# How Devanagari works for Marathi: the recurring features a learner from
# English misses, shown before the first letters and from a script deck's
# Tips. See ADR-0016 and docs/DECK-FORMAT.md.
schema: 1
kind: script
id: mr-script
language: mr
name: "How Devanagari works for Marathi"
intro: "Marathi is written in Devanagari, the script of Hindi and Sanskrit, in the style called Balbodh. It is built from a few ideas that come back in letter after letter. They look strange at first because English has none of them. Once you have seen them, the letters start to make sense."
features:
  - id: headline
    name: "The headline"
    term: "शिरोरेखा"
    reading: "śirorekhā"
    ipa: "ʃirorekʰa"
    example: "क"
    text: "Most letters hang from a line along the top, and in a word the lines join into one. Read along the top, not along a baseline as in English."
    letters: ["क", "ग", "त", "न", "म", "ल", "स"]
  - id: headline-gap
    name: "A gap in the headline"
    example: "ध"
    text: "In a few letters the line breaks, and the gap is what tells them from a look-alike: ध from घ, and भ from म."
    letters: ["थ", "ध", "भ", "श"]
  - id: stem
    name: "The standing line"
    example: "ग"
    text: "Most letters have an upright line on the right. A letter drops it to become a half letter when it joins the next one: रस्ता, गप्पा."
    letters: ["ग", "प", "म", "स", "ल", "ब"]
  - id: rows
    name: "Rows of five"
    term: "वर्ग"
    reading: "varg"
    ipa: "ʋərɡ"
    example: "क"
    text: "Most consonants come in five rows of five. Each row is made in about one place in the mouth: क at the back, च against the palate, ट with the tongue curled back, त on the teeth, प at the lips. The columns work the same way in every row: plain (क), with a breath (ख), voiced (ग), voiced with a breath (घ), and through the nose (ङ). ङ and ञ are rare: Marathi usually writes the dot ं instead."
    letters: ["क", "ख", "ग", "घ", "ङ", "च", "छ", "ज", "झ", "ञ", "ट", "ठ", "ड", "ढ", "ण", "त", "थ", "द", "ध", "न", "प", "फ", "ब", "भ", "म"]
  - id: inherent-vowel
    name: "The vowel you don't see"
    example: "क"
    text: "Every consonant carries a short a, said like the u of 'but', unless a sign changes it: क alone is ka."
    letters: ["क", "कल", "कमळ"]
  - id: final-a
    name: "The last a usually isn't said"
    example: "घर"
    text: "At the end of most words the carried a goes quiet: घर is ghar, कमळ is kamal. After two joined consonants it stays: मित्र is mitra. Inside long words it can go quiet too, so learn each word as it's said."
    letters: ["घर", "कमळ", "मित्र"]
  - id: vowel-signs
    name: "Vowels as signs on a letter"
    term: "मात्रा"
    reading: "mātrā"
    ipa: "mat̪ra"
    example: "कि"
    text: "After a consonant a vowel is a sign on it, not a letter of its own. ि is written before the consonant but said after it: you see ि then क, and say ki. े and ै sit above, ु, ू and ृ below, the rest after."
    letters: ["का", "कि", "की", "कु", "के", "को"]
  - id: two-sounds
    name: "च and ज have two sounds"
    example: "च"
    text: "Before i and e, and in words from Sanskrit, च and ज are the ch of 'church' and the j of 'judge'. Before a, o and u in most Marathi words they are ts and dz: चहा is tsahaa, जग is dzag. The script does not show which, so learn it with the word."
    letters: ["च", "ज", "झ"]
  - id: curled-l
    name: "ळ, the curled-back l"
    example: "ळ"
    text: "Marathi has a second l, made with the tongue curled back, that Hindi lacks. It changes the word: काल is yesterday, काळ an age. It never starts a word."
    letters: ["ळ", "शाळा", "डोळा"]
  - id: half-letters
    name: "Half letters"
    term: "जोडाक्षर"
    reading: "joḍākṣar"
    ipa: "dzoɖakʂər"
    example: "स्त"
    text: "Two consonants with no vowel between them join. Usually the first is written as a half letter, without its standing line: रस्ता. क drops the hook on its right instead (क्क). Letters with no standing line stack, one above the other: द्ध, ट्ट."
    letters: ["क्क", "स्त", "च्च", "द्ध", "ट्ट"]
  - id: own-shapes
    name: "Joins with shapes of their own"
    example: "ज्ञ"
    text: "A few joins look nothing like their parts: क्ष is क and ष, त्र is त and र, श्र is श and र, and ज्ञ is ज and ञ, which Marathi says dny: ज्ञान is dnyan. क्ष and ज्ञ count as letters of the Marathi alphabet."
    letters: ["क्ष", "त्र", "ज्ञ", "श्र"]
  - id: r-forms
    name: "र written as a stroke, a hook or an eyelash"
    example: "प्र"
    text: "Next to another consonant र isn't written in full. After it, it's a slanting stroke at its foot (प्र), or a small caret under ट and ड (ट्र). Before it, it's usually a small hook on top, the reph (सूर्य). In many Marathi words before य it is a small eyelash instead: दुसऱ्या."
    letters: ["प्र", "ट्र", "र्य", "ऱ्य"]
  - id: english-vowels
    name: "Two vowels for English words"
    example: "ऑ"
    text: "Marathi adds two vowels for English words, each with a small moon on top: ॲ, the a of 'bat' (बॅग, bag), and ऑ, the o of British 'hot' (ऑफिस, office). English v is often written व्ह: ड्रायव्हर."
    letters: ["ॲ", "ऑ", "बॅ", "डॉ"]
  - id: nasal-dot
    name: "The dot above"
    term: "अनुस्वार"
    reading: "anusvār"
    ipa: "ənusʋar"
    example: "ं"
    text: "A dot above a letter, the anusvar, is the nasal that suits the next consonant: n in पंधरा, m in आंबा. At the end of a word, in speech and in dialogue, it marks a nasal a: मुलं, children. Marathi rarely uses the moon and dot ँ that Hindi has."
    letters: ["कं", "पंधरा", "आंबा", "मुलं"]
  - id: halant
    name: "The mark that takes the vowel away"
    term: "हलंत"
    reading: "halant"
    ipa: "ɦələnt̪"
    example: "क्"
    text: "The small slanting stroke below a letter, ्, means no vowel after it. You'll rarely see it, because two consonants usually join instead."
    letters: ["क्", "द्", "ट्"]
  - id: full-stop
    name: "A full stop, not a line"
    example: "."
    text: "Hindi ends a sentence with a standing line, ।. Marathi uses the same full stop, comma and question mark as English."
  - id: digits
    name: "Devanagari digits"
    example: "४"
    text: "Devanagari has its own digits, and Marathi uses them more than Hindi does: newspapers, calendars and many signs print them. ४ is 4, though it looks like an 8, and १ and ९ look alike."
    letters: ["०", "१", "२", "३", "४", "५", "६", "७", "८", "९"]
