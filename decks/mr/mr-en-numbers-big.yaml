    target: "नव्वद"
    native: "90, ninety"
    reading: "navvad"
    pos: "other"
  - id: mr-0279
    target: "शंभर"
    native: "100, a hundred"
    reading: "shambhar"
    pos: "other"
    notes: "A hundred on its own. After a number, 'hundred' is -शे, written as one word with it: दोनशे (donshe), 200."
  - id: mr-0280
    target: "एकशे"
    native: "one hundred (with more after it)"
    reading: "ekshe"
    pos: "other"
    notes: "Before more digits a hundred is एकशे: एकशे वीस (ekshe viis), 120. Many prices are said in hundreds: अकराशे (akraashe), eleven hundred, 1,100."
  - id: mr-0281
    target: "दोनशे"
    native: "200, two hundred"
    reading: "donshe"
    pos: "other"
  - id: mr-0282
    target: "तीनशे"
    native: "300, three hundred"
    reading: "tiinshe"
    pos: "other"
  - id: mr-0283
    target: "चारशे"
    native: "400, four hundred"
    reading: "chaarshe"
    pos: "other"
  - id: mr-0284
    target: "पाचशे"
    native: "500, five hundred"
    reading: "paachshe"
    pos: "other"
    notes: "पाचशेची नोट (paachshechii not), a 500-rupee note."
  - id: mr-0285
    target: "सहाशे"
    native: "600, six hundred"
    reading: "sahaashe"
    pos: "other"
  - id: mr-0286
    target: "सातशे"
    native: "700, seven hundred"
    reading: "saatshe"
    pos: "other"
  - id: mr-0287
    target: "आठशे"
    native: "800, eight hundred"
    reading: "aathshe"
    pos: "other"
  - id: mr-0288
    target: "नऊशे"
    native: "900, nine hundred"
    reading: "naushe"
    pos: "other"
  - id: mr-0289
    target: "हजार"
    native: "1,000, a thousand"
    reading: "hajaar"
    pos: "other"
    notes: "दोन हजार पंचवीस (don hajaar panchviis), 2025. Marathi writes it without the dot below that Hindi puts in हज़ार."
  - id: mr-0290
    target: "लाख"
    native: "1,00,000, a lakh (a hundred thousand)"
    reading: "laakh"
    pos: "other"
    notes: "Indian numbering counts in lakhs and crores, and places its commas to match: 1,00,000 is one lakh, 10,00,000 ten lakh. Prices, salaries and populations are all given this way."
  - id: mr-0291
    target: "कोटी"
    native: "1,00,00,000, a crore (ten million)"
    reading: "kotii"
    pos: "other"
    notes: "A hundred lakh."
  - id: mr-0292
    target: "सव्वा"
    native: "1¼; and a quarter"
    reading: "savvaa"
    pos: "other"
    notes: "Before another number, a quarter more: सव्वादोन (savvaadon), 2¼, and on the clock 2:15. सव्वाशे (savvaashe) is 125."
  - id: mr-0293
    target: "दीड"
    native: "1½, one and a half"
    reading: "diid"
    pos: "other"
    notes: "With शे and हजार too: दीडशे (diidshe) is 150, दीड हजार 1,500. On the clock, दीड वाजता is at 1:30. Heard constantly in markets."
  - id: mr-0294
    target: "अडीच"
    native: "2½, two and a half"
    reading: "adiich"
    pos: "other"
    notes: "अडीचशे (adiichshe) is 250, and अडीच वाजता at 2:30. From 3½ on, Marathi says साडे."
  - id: mr-0295
    target: "साडे"
    native: "and a half (from 3½ on)"
    reading: "saade"
    pos: "other"
    notes: "Joined to the number: साडेतीन (saadetiin), 3½; साडेतीनशे, 350; साडेचार वाजता, at 4:30."
  - id: mr-0296
    target: "पावणे"
    native: "a quarter less"
    reading: "paavne"
    pos: "other"
    notes: "Joined to the number: पावणेदोन (paavnedon), 1¾; पावणेपाच वाजता (paavnepaach vaajtaa), at a quarter to five."
  - id: mr-0297
    target: "एकवीस"
    native: "21, twenty-one"
    reading: "ekviis"
    pos: "other"
    notes: "Each number from 21 to 99 is one word, the unit blended into the ten, often irregularly: learn them as words. Before each ten comes एकोण-, 'one less': एकोणतीस, 29."
