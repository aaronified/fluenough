  - id: mr-0279
    target: "शंभर"
    native: "100, a hundred"
    reading: "śambhar"
    ipa: "ʃəmbʱər"
    pos: "other"
    notes: "A hundred on its own. After a number, 'hundred' is -शे, written as one word with it: दोनशे (donśe), 200."
  - id: mr-0280
    target: "एकशे"
    native: "one hundred (with more after it)"
    reading: "ekśe"
    ipa: "ekʃe"
    pos: "other"
    notes: "Before more digits a hundred is एकशे: एकशे वीस (ekśe vis), 120. Many prices are said in hundreds: अकराशे (akrāśe), eleven hundred, 1,100."
  - id: mr-0281
    target: "दोनशे"
    native: "200, two hundred"
    reading: "donśe"
    ipa: "d̪onʃe"
    pos: "other"
