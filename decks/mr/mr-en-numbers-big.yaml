schema: 1
id: mr-en-numbers-big
name: "Tens and big numbers"
kind: vocab
theme: numbers-big
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Every number from 21 to 99, the hundreds, a thousand, lakh and crore, and the quarters and halves every market uses. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: mr-0272
    target: "तीस"
    native: "30, thirty"
    reading: "tiis"
    pos: "other"
    notes: "Every number from 21 to 99 has its own word in Marathi, as in Hindi: 26 is सव्वीस (savviis), not 'twenty six'. This deck teaches every one."
  - id: mr-0273
    target: "चाळीस"
    native: "40, forty"
    reading: "chaaliis"
    pos: "other"
    notes: "With the curled-back ळ."
  - id: mr-0274
    target: "पन्नास"
    native: "50, fifty"
    reading: "pannaas"
    pos: "other"
  - id: mr-0275
    target: "साठ"
    native: "60, sixty"
    reading: "saath"
    pos: "other"
