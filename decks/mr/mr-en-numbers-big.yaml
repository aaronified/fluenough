    target: "आठशे"
    native: "800, eight hundred"
    reading: "āṭhśe"
    ipa: "aʈʰʃe"
    pos: "other"
  - id: mr-0288
    target: "नऊशे"
    native: "900, nine hundred"
    reading: "nauśe"
    ipa: "nəuʃe"
    pos: "other"
  - id: mr-0289
    target: "हजार"
    native: "1,000, a thousand"
    reading: "hajār"
    ipa: "ɦədzar"
    pos: "other"
    notes: "दोन हजार पंचवीस (don hajār pañcvis), 2025. Marathi writes it without the dot below that Hindi puts in हज़ार."
  - id: mr-0290
    target: "लाख"
    native: "1,00,000, a lakh (a hundred thousand)"
    reading: "lākh"
    ipa: "lakʰ"
    pos: "other"
    notes: "Indian numbering counts in lakhs and crores, and places its commas to match: 1,00,000 is one lakh, 10,00,000 ten lakh. Prices, salaries and populations are all given this way."
  - id: mr-0291
    target: "कोटी"
    native: "1,00,00,000, a crore (ten million)"
    reading: "koṭi"
    ipa: "koʈi"
    pos: "other"
    notes: "A hundred lakh."
  - id: mr-0292
    target: "सव्वा"
    native: "1¼; and a quarter"
    reading: "savvā"
    ipa: "səʋʋa"
    pos: "other"
    notes: "Before another number, a quarter more: सव्वादोन (savvādon), 2¼, and on the clock 2:15. सव्वाशे (savvāśe) is 125."
  - id: mr-0293
    target: "दीड"
    native: "1½, one and a half"
    reading: "diḍ"
    ipa: "d̪iɖ"
    pos: "other"
    notes: "With शे and हजार too: दीडशे (diḍśe) is 150, दीड हजार 1,500. On the clock, दीड वाजता is at 1:30. Heard constantly in markets."
  - id: mr-0294
    target: "अडीच"
    native: "2½, two and a half"
    reading: "aḍic"
    ipa: "əɖits"
    pos: "other"
    notes: "अडीचशे (aḍicśe) is 250, and अडीच वाजता at 2:30. From 3½ on, Marathi says साडे."
  - id: mr-0295
    target: "साडे"
    native: "and a half (from 3½ on)"
    reading: "sāḍe"
    ipa: "saɖe"
    pos: "other"
    notes: "Joined to the number: साडेतीन (sāḍetin), 3½; साडेतीनशे, 350; साडेचार वाजता, at 4:30."
  - id: mr-0296
    target: "पावणे"
    native: "a quarter less"
    reading: "pāvṇe"
    ipa: "paʋɳe"
    pos: "other"
    notes: "Joined to the number: पावणेदोन (pāvṇedon), 1¾; पावणेपाच वाजता (pāvṇepāc vājtā), at a quarter to five."
  - id: mr-0297
    target: "एकवीस"
    native: "21, twenty-one"
    reading: "ekvis"
    ipa: "ekʋis"
    pos: "other"
    notes: "Each number from 21 to 99 is one word, the unit blended into the ten, often irregularly: learn them as words. Before each ten comes एकोण-, 'one less': एकोणतीस, 29."
