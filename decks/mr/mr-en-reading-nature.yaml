  - id: "mr-park-signs"
    title: "Park signs"
    sentences:
      - { text: "उद्यान सकाळी सहा ते रात्री आठ खुले आहे.", reading: "udyān sakāḷi sahā te rātri āṭh khule āhe.", ipa: "ud̪jan səkaɭi səɦa t̪e rat̪ri aʈʰ kʰule aɦe" }
      - { text: "फुलं तोडू नका.", reading: "phulam̐ toḍu nakā.", ipa: "pʰulə̃ t̪oɖu nəka" }
      - { text: "कचरा कुंडीत टाका.", reading: "kacrā kuṇḍit ṭākā.", ipa: "kətsra kuɳɖit̪ ʈaka" }
      - { text: "झाडावर चढू नका.", reading: "jhāḍāvar caḍhu nakā.", ipa: "dzʱaɖaʋər tsəɖʱu nəka" }
