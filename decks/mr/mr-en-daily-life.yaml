schema: 1
id: mr-en-daily-life
name: "A day"
kind: vocab
theme: daily-life
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The day from waking to sleeping, and how often things happen. Verbs are given in their -णे form, the one a dictionary lists. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: mr-0494
    target: "उठणे"
    native: "to get up; to wake up"
    reading: "uṭhṇe"
    ipa: "uʈʰɳe"
    pos: "verb"
    notes: "सकाळी लवकर उठणे, to get up early in the morning."
  - id: mr-0495
    target: "अंघोळ करणे"
    native: "to bathe; to have a shower"
    reading: "aṅghoḷ karṇe"
    ipa: "əŋɡʱoɭ kərɳe"
    pos: "phrase"
    notes: "अंघोळ (aṅghoḷ) is a bath, and करणे 'to do'."
  - id: mr-0496
    target: "दात घासणे"
    native: "to brush one's teeth"
    reading: "dāt ghāsṇe"
    ipa: "d̪at̪ ɡʱasɳe"
    pos: "phrase"
    notes: "'To rub the teeth'."
  - id: mr-0497
    target: "नाश्ता"
    native: "breakfast; a snack"
    reading: "nāśtā"
    ipa: "naʃt̪a"
    pos: "noun"
    gender: "m"
    notes: "Often पोहे (pohe), flattened rice, or उपमा (upmā). नाश्ता केला का? (nashta kela ka?), have you had breakfast?"
  - id: mr-0498
    target: "जेवण"
    native: "meal; lunch; dinner"
    reading: "jevaṇ"
    ipa: "dʒeʋəɳ"
    pos: "noun"
    gender: "n"
    notes: "दुपारचे जेवण (dupārce jevaṇ), lunch; रात्रीचे जेवण (rātrice jevaṇ), dinner."
  - id: mr-0499
    target: "जेवणे"
    native: "to eat (a meal)"
    reading: "jevṇe"
    ipa: "dʒeʋɳe"
    pos: "verb"
    notes: "For a meal, not a snack: मी जेवलो (mi jevlo), I've eaten. खाणे is to eat anything."
  - id: mr-0500
    target: "झोपणे"
    native: "to sleep; to go to bed"
    reading: "jhopṇe"
    ipa: "dzʱopɳe"
    pos: "verb"
    notes: "झोप (jhop) is sleep."
  - id: mr-0501
    target: "कामावर जाणे"
    native: "to go to work"
    reading: "kāmāvar jāṇe"
    ipa: "kamaʋər dzaɳe"
    pos: "phrase"
    notes: "'To go onto work'."
  - id: mr-0502
    target: "घरी परत येणे"
    native: "to come back home"
    reading: "ghari parat yeṇe"
    ipa: "ɡʱəri pərət̪ jeɳe"
    pos: "phrase"
    notes: "परत (parat) is 'back, again'."
  - id: mr-0503
    target: "स्वयंपाक करणे"
    native: "to cook"
    reading: "svayampāk karṇe"
    ipa: "sʋəjəmpak kərɳe"
    pos: "phrase"
  - id: mr-0504
    target: "कपडे धुणे"
    native: "to wash clothes"
    reading: "kapḍe dhuṇe"
    ipa: "kəpɖe d̪ʱuɳe"
    pos: "phrase"
    notes: "कपडे (kapḍe), clothes, is plural."
  - id: mr-0505
    target: "रोज"
    native: "every day"
    reading: "roj"
    ipa: "rodz"
    pos: "adv"
    notes: "मी रोज चालतो (mi roj cālto), I walk every day."
  - id: mr-0506
    target: "नेहमी"
    native: "always"
    reading: "nehmi"
    ipa: "neɦmi"
    pos: "adv"
  - id: mr-0507
    target: "कधीकधी"
    native: "sometimes"
    reading: "kadhikadhi"
    ipa: "kəd̪ʱikəd̪ʱi"
    pos: "adv"
    notes: "'When-when'. Also कधी कधी, written apart."
  - id: mr-0508
    target: "कधीच नाही"
    native: "never"
    reading: "kadhic nāhi"
    ipa: "kəd̪ʱits naɦi"
    pos: "phrase"
    notes: "With a verb, नाही goes after it: मी कधीच दारू पीत नाही, I never drink alcohol."
  - id: mr-0509
    target: "लवकर"
    native: "early; soon; quickly"
    reading: "lavkar"
    ipa: "ləʋkər"
    pos: "adv"
    notes: "लवकर या (lavkar yā), come soon."
  - id: mr-0510
    target: "उशिरा"
    native: "late"
    reading: "uśirā"
    ipa: "uʃira"
    pos: "adv"
    notes: "उशीर (uśir) is lateness: मला उशीर झाला (malā uśir jhālā), I'm late."
  - id: mr-0511
    target: "मी सात वाजता उठतो."
    native: "I get up at seven. (a man speaking)"
    reading: "mi sāt vājtā uṭhto."
    ipa: "mi sat̪ ʋadzt̪a uʈʰt̪o"
    alt_target: ["मी सात वाजता उठते."]
    pos: "phrase"
    notes: "A woman says उठते (uṭhte)."
  - id: mr-0512
    target: "चालणे"
    native: "to walk"
    reading: "cālṇe"
    ipa: "tsalɳe"
    pos: "verb"
    notes: "Also 'to work, to run' of a machine, and 'it's fine': चालेल (cālel), that'll do."
  - id: mr-0513
    target: "वाचणे"
    native: "to read"
    reading: "vācṇe"
    ipa: "ʋatsɳe"
    pos: "verb"
    notes: "पेपर वाचणे (pepar vācṇe), to read the newspaper."
