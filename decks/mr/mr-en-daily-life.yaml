schema: 1
id: mr-en-daily-life
name: "A day"
kind: vocab
theme: daily-life
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The day from waking to sleeping, and how often things happen. Verbs are given in their -णे form, the one a dictionary lists. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: mr-0494
    target: "उठणे"
    native: "to get up; to wake up"
    reading: "uthne"
    pos: "verb"
    notes: "सकाळी लवकर उठणे, to get up early in the morning."
  - id: mr-0495
    target: "अंघोळ करणे"
    native: "to bathe; to have a shower"
    reading: "anghol karne"
    pos: "phrase"
    notes: "अंघोळ (anghol) is a bath, and करणे 'to do'."
  - id: mr-0496
    target: "दात घासणे"
    native: "to brush one's teeth"
    reading: "dat ghasne"
    pos: "phrase"
    notes: "'To rub the teeth'."
  - id: mr-0497
    target: "नाश्ता"
    native: "breakfast; a snack"
    reading: "nashta"
    pos: "noun"
    gender: "m"
    notes: "Often पोहे (pohe), flattened rice, or उपमा (upma). नाश्ता केला का? (nashta kela ka?), have you had breakfast?"
  - id: mr-0498
    target: "जेवण"
    native: "meal; lunch; dinner"
    reading: "jevan"
    pos: "noun"
    gender: "n"
    notes: "दुपारचे जेवण (duparche jevan), lunch; रात्रीचे जेवण (ratriche jevan), dinner."
  - id: mr-0499
    target: "जेवणे"
    native: "to eat (a meal)"
    reading: "jevne"
    pos: "verb"
    notes: "For a meal, not a snack: मी जेवलो (mi jevlo), I've eaten. खाणे is to eat anything."
  - id: mr-0500
    target: "झोपणे"
    native: "to sleep; to go to bed"
    reading: "jhopne"
    pos: "verb"
    notes: "झोप (jhop) is sleep."
  - id: mr-0501
    target: "कामावर जाणे"
    native: "to go to work"
    reading: "kamavar jane"
    pos: "phrase"
    notes: "'To go onto work'."
  - id: mr-0502
    target: "घरी परत येणे"
    native: "to come back home"
    reading: "ghari parat yene"
    pos: "phrase"
    notes: "परत (parat) is 'back, again'."
  - id: mr-0503
    target: "स्वयंपाक करणे"
    native: "to cook"
    reading: "svayampak karne"
    pos: "phrase"
  - id: mr-0504
    target: "कपडे धुणे"
    native: "to wash clothes"
    reading: "kapde dhune"
    pos: "phrase"
    notes: "कपडे (kapde), clothes, is plural."
  - id: mr-0505
    target: "रोज"
    native: "every day"
    reading: "roj"
    pos: "adv"
    notes: "मी रोज चालतो (mi roj chalto), I walk every day."
  - id: mr-0506
    target: "नेहमी"
    native: "always"
    reading: "nehmi"
    pos: "adv"
  - id: mr-0507
    target: "कधीकधी"
    native: "sometimes"
    reading: "kadhikadhi"
    pos: "adv"
    notes: "'When-when'. Also कधी कधी, written apart."
  - id: mr-0508
    target: "कधीच नाही"
    native: "never"
    reading: "kadhich nahi"
    pos: "phrase"
    notes: "With a verb, नाही goes after it: मी कधीच दारू पीत नाही, I never drink alcohol."
  - id: mr-0509
    target: "लवकर"
    native: "early; soon; quickly"
    reading: "lavkar"
    pos: "adv"
    notes: "लवकर या (lavkar ya), come soon."
  - id: mr-0510
    target: "उशिरा"
    native: "late"
    reading: "ushira"
    pos: "adv"
    notes: "उशीर (ushir) is lateness: मला उशीर झाला (mala ushir jhala), I'm late."
  - id: mr-0511
    target: "मी सात वाजता उठतो."
    native: "I get up at seven. (a man speaking)"
    reading: "mi sat vajta uthto."
    alt_target: ["मी सात वाजता उठते."]
    pos: "phrase"
    notes: "A woman says उठते (uthte)."
  - id: mr-0512
    target: "चालणे"
    native: "to walk"
    reading: "chalne"
    pos: "verb"
    notes: "Also 'to work, to run' of a machine, and 'it's fine': चालेल (chalel), that'll do."
  - id: mr-0513
    target: "वाचणे"
    native: "to read"
    reading: "vachne"
    pos: "verb"
    notes: "पेपर वाचणे (pepar vachne), to read the newspaper."
