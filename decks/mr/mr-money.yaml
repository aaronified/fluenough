      - { target: "खर्च कमी करायला हवा.", reading: "kharc kami karāylā havā.", ipa: "kʰərts kəmi kərajla ɦəʋa", bases: [{ word: "कमी", base: "कमी", reading: "kami" }, { word: "करायला", ref: "mr-0712" }, { word: "हवा", ref: "mr-1018" }] }
