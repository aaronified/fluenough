cards:
  - id: "mr-1747"
    target: "पैसा"
    reading: "paisā"
    ipa: "pəisa"
    pos: "noun"
    gender: "m"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "पैसा", reading: "paisā" }] }
    examples:
      - { target: "माझ्याकडे पैसा नाही.", reading: "mājhyākḍe paisā nāhi.", ipa: "madʒʱjakɖe pəisa naɦi", bases: [{ word: "माझ्याकडे", ref: "mr-0080" }, { word: "नाही", base: "नसणे", reading: "nasṇe" }] }
      - { target: "पैशांचं नियोजन करा.", reading: "paiśāñcam̐ niyojan karā.", ipa: "pəiʃaɲtsə̃ nijodzən kəra", bases: [{ word: "पैशांचं", base: "पैसा", reading: "paisā" }, { word: "नियोजन", base: "नियोजन", reading: "niyojan" }, { word: "करा", ref: "mr-0712" }] }
  - id: "mr-1748"
    target: "कमाई"
    reading: "kamāi"
    ipa: "kəmai"
    pos: "noun"
    gender: "f"
