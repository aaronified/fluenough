    examples:
      - { target: "माझं वार्षिक उत्पन्न वाढलं.", reading: "mājham̐ vārṣik utpann vāḍhlam̐.", ipa: "madzʱə̃ ʋarʂik ut̪pənn ʋaɖʱlə̃", bases: [{ word: "माझं", ref: "mr-0080" }, { word: "वार्षिक", base: "वार्षिक", reading: "vārṣik" }, { word: "वाढलं", ref: "mr-1027" }] }
      - { target: "उत्पन्नाचा दाखला आणा.", reading: "utpannācā dākhlā āṇā.", ipa: "ut̪pənnatsa d̪akʰla aɳa", bases: [{ word: "उत्पन्नाचा", base: "उत्पन्न", reading: "utpann" }, { word: "दाखला", base: "दाखला", reading: "dākhlā" }, { word: "आणा", ref: "mr-0800" }] }
  - id: "mr-1750"
