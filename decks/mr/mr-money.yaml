      - { target: "बचत बँकेत ठेवा.", reading: "bacat bam̐ket ṭhevā.", ipa: "bətsət̪ bə̃ket̪ ʈʰeʋa", bases: [{ word: "बँकेत", ref: "mr-0959" }, { word: "ठेवा", ref: "mr-0723" }] }
  - id: "mr-1752"
