    examples:
      - { target: "त्याची महिन्याची कमाई चांगली आहे.", reading: "tyāci mahinyāci kamāi cāṅgali āhe.", ipa: "t̪jatʃi məɦinjatʃi kəmai tsaŋɡəli aɦe", bases: [{ word: "त्याची", ref: "mr-0676" }, { word: "महिन्याची", ref: "mr-0514" }, { word: "चांगली", ref: "mr-0759" }, { word: "आहे", base: "असणे", reading: "asṇe" }] }
      - { target: "कमाईतून घर चालतं.", reading: "kamāitun ghar cāltam̐.", ipa: "kəmait̪un ɡʱər tsalt̪ə̃", bases: [{ word: "कमाईतून", base: "कमाई", reading: "kamāi" }, { word: "घर", ref: "mr-0048" }, { word: "चालतं", ref: "mr-0512" }] }
  - id: "mr-1749"
    target: "उत्पन्न"
