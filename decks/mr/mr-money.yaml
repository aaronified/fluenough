      - { target: "गुंतवणुकीचा विचार करा.", reading: "guntavṇukicā vicār karā.", ipa: "ɡunt̪əʋɳukitsa ʋitsar kəra", bases: [{ word: "गुंतवणुकीचा", base: "गुंतवणूक", reading: "guntavṇuk" }, { word: "विचार", ref: "mr-1365" }, { word: "करा", ref: "mr-0712" }] }
  - id: "mr-1753"
