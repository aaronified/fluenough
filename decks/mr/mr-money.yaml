    examples:
      - { target: "त्याने बँकेकडून कर्ज घेतलं.", reading: "tyāne bam̐kekḍun karj ghetlam̐.", ipa: "t̪jane bə̃kekɖun kərdz ɡʱet̪lə̃", bases: [{ word: "त्याने", ref: "mr-0676" }, { word: "बँकेकडून", ref: "mr-0959" }, { word: "घेतलं", ref: "mr-0722" }] }
