schema: 1
id: mr-en-script-vowel-signs
name: "Marathi vowel signs"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "After a consonant a vowel is written as a sign (matra) on it: after it, above, below, or, for i, before it. Here on क and on म, with the dot, the two dots and the mark that takes the vowel away. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: mr-0063
    target: "का"
    native: "kaa (k + the aa sign)"
    reading: "kā"
    ipa: "ka"
    notes: "The aa sign ा is a standing line after the consonant: काका (kākā, uncle). Compare क on its own, which is 'ka' with the short a."
  - id: mr-0064
    target: "कि"
    native: "ki (k + the i sign)"
    reading: "ki"
    ipa: "ki"
    notes: "The i sign ि is written before the consonant but said after it: you see ि then क, and say ki. किल्ला (killā, fort)."
  - id: mr-0065
    target: "की"
    native: "kii (k + the ii sign)"
    reading: "ki"
    ipa: "ki"
    notes: "The ii sign ी comes after the consonant, curling over it to the right: कीडा (kiḍā, insect)."
  - id: mr-0066
    target: "कु"
    native: "ku (k + the u sign)"
    reading: "ku"
    ipa: "ku"
    notes: "The u sign ु hangs below: कुत्रा (kutrā, dog)."
  - id: mr-0067
    target: "कू"
    native: "kuu (k + the uu sign)"
    reading: "ku"
    ipa: "ku"
    notes: "The uu sign ू hangs below too, turned the other way: भूक (bhuk, hunger). On र both signs change shape: रु and रू."
  - id: mr-0068
    target: "कृ"
    native: "kru (k + the ru sign)"
    reading: "kru"
    ipa: "kru"
    modes: [recognition, production]
    notes: "The ru sign ृ is a small hook below, in words from Sanskrit: कृपया (krupayā, please). Marathi says it 'ru'. A recogniser writes 'kru' as क्रु, so it is drilled by reading and writing only."
  - id: mr-0069
    target: "के"
    native: "ke (k + the e sign)"
    reading: "ke"
    ipa: "ke"
    notes: "The e sign े is a stroke above: केळे (keḷe, banana)."
  - id: mr-0070
    target: "कै"
    native: "kai (k + the ai sign)"
    reading: "kai"
    ipa: "kəi"
    notes: "The ai sign ै is two strokes above: कैरी (kairi, green mango)."
  - id: mr-0071
    target: "को"
    native: "ko (k + the o sign)"
    reading: "ko"
    ipa: "ko"
    notes: "The o sign ो is a standing line with a stroke above: कोण (koṇ, who)."
  - id: mr-0072
    target: "कौ"
    native: "kau (k + the au sign)"
    reading: "kau"
    ipa: "kəu"
    notes: "The au sign ौ is a standing line with two strokes above: कौतुक (kautuk, praise; fond pride)."
  - id: mr-0073
    target: "कं"
    native: "kam, kan (k + the dot, anusvaar)"
    reading: "kam̐"
    ipa: "kə̃"
    modes: [recognition, production]
    notes: "The dot ं above, the anusvar, is the nasal that suits the next consonant, n or m: कंगवा (kaṅgvā, comb), आंबा (āmbā, mango). At the end of a word in speech it marks a nasal a: मुलं (mulam̐, children). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  - id: mr-0074
    target: "कः"
    native: "kah (k + the two dots, visarga)"
    reading: "kaḥ"
    ipa: "kəh"
    modes: [recognition, production]
    notes: "Two dots after a letter, the visarga, are a breath of h, in a few words from Sanskrit: दुःख (duḥkh, sorrow). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  - id: mr-0075
    target: "क्"
    native: "k (with the halant: no vowel)"
    reading: "k"
    ipa: "k"
    modes: [recognition, production]
    notes: "The small slanting stroke below, the halant ्, takes the vowel away: क् is 'k' alone. Two consonants usually join instead, so it is rare: विद्वान् (vidvān, learned). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  - id: mr-0076
    target: "बॅ"
    native: "bae (b + the ae sign)"
    reading: "bê"
    ipa: "bæ"
    modes: [recognition, production]
    notes: "The sign ॅ, a small moon above, is the 'a' of English 'bat', in English words: बॅग (bêg) and बॅट (bêṭ) are said as in English. A recogniser may write it otherwise, so it is drilled by reading and writing only."
  - id: mr-0077
    target: "डॉ"
    native: "do (d + the open o sign)"
    reading: "ḍô"
    ipa: "ɖɔ"
    notes: "The sign ॉ is the o sign with a moon above: the open 'o' of British 'hot', in English words: डॉक्टर (ḍôkṭar, doctor)."
  - id: mr-0078
    target: "मा"
    native: "maa (m + the aa sign)"
    reading: "mā"
    ipa: "ma"
    notes: "The same aa sign on another consonant: each sign keeps its place on every consonant. मामा (māmā, uncle on the mother's side)."
  - id: mr-0079
    target: "मि"
    native: "mi (m + the i sign)"
    reading: "mi"
    ipa: "mi"
    notes: "The i sign before म, said after it: मिरची (mirci, chilli)."
  - id: mr-0080
    target: "मी"
    native: "mii (m + the ii sign); I"
    reading: "mi"
    ipa: "mi"
    notes: "The ii sign after म. On its own, मी is the word 'I'."
  - id: mr-0081
    target: "मु"
    native: "mu (m + the u sign)"
    reading: "mu"
    ipa: "mu"
    notes: "The u sign below म: मुलगा (mulgā, boy)."
  - id: mr-0082
    target: "मू"
    native: "muu (m + the uu sign)"
    reading: "mu"
    ipa: "mu"
    notes: "The uu sign below म: मूल (mul, child)."
  - id: mr-0083
    target: "मे"
    native: "me (m + the e sign)"
    reading: "me"
    ipa: "me"
    notes: "The e sign above म: मेथी (methi, fenugreek)."
  - id: mr-0084
    target: "मै"
    native: "mai (m + the ai sign)"
    reading: "mai"
    ipa: "məi"
    notes: "The ai sign above म: मैदान (maidān, open ground)."
  - id: mr-0085
    target: "मो"
    native: "mo (m + the o sign)"
    reading: "mo"
    ipa: "mo"
    notes: "The o sign on म: मोर (mor, peacock)."
  - id: mr-0086
    target: "मौ"
    native: "mau (m + the au sign)"
    reading: "mau"
    ipa: "məu"
    notes: "The au sign on म: मौज (mauj, fun)."
