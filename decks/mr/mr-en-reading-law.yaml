  "sentences":
  - "text": "भाडेकरूला राहण्याचा अधिकार आहे."
    "reading": "bhāḍekrulā rāhaṇyācā adhikār āhe."
    "ipa": "bʱaɖekrula raɦəɳjatsa əd̪ʱikar aɦe"
  - "text": "भाडे वाढवण्याआधी घरमालकाने नोटीस द्यायला हवी."
    "reading": "bhāḍe vāḍhvaṇyāādhi gharmālkāne noṭis dyāylā havi."
    "ipa": "bʱaɖe ʋaɖʱʋəɳjaad̪ʱi ɡʱərmalkane noʈis d̪jajla ɦəʋi"
  - "text": "कराराची प्रत मागा."
    "reading": "karārāci prat māgā."
    "ipa": "kəraratʃi prət̪ maɡa"
  - "text": "भाड्याची पावती घ्या."
    "reading": "bhāḍyāci pāvti ghyā."
    "ipa": "bʱaɖjatʃi paʋt̪i ɡʱja"
  - "text": "अडचण असल्यास मदत मागा."
    "reading": "aḍcaṇ asalyās madat māgā."
    "ipa": "əɖtsəɳ əsəljas məd̪ət̪ maɡa"
