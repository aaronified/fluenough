schema: 1
id: mr-en-grammar-differences
name: "How Marathi grammar differs from English"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Before any theme: the verb last, endings for in, to and with written onto the noun, three genders and a verb that shows the speaker's, two yous, two wes, no articles, and how Marathi says have, not and questions. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: mr-0125
    target: "मी भात खातो."
    native: "I eat rice. (a man speaking)"
    reading: "mi bhāt khāto."
    ipa: "mi bʱat̪ kʰat̪o"
    alt_target: ["मी भात खाते."]
    tags: ["grammar", "word-order"]
    notes: "The verb comes last: subject, object, verb. Word for word, 'I rice eat'. A woman says खाते (khāte)."
  - id: mr-0126
    target: "तो डॉक्टर आहे."
    native: "He is a doctor."
    reading: "to ḍôkṭar āhe."
    ipa: "t̪o ɖɔkʈər aɦe"
    tags: ["grammar", "word-order"]
    notes: "आहे (āhe), 'is', comes last too: 'he doctor is'."
  - id: mr-0127
    target: "घरात"
    native: "in the house"
    reading: "gharāt"
    ipa: "ɡʱərat̪"
    tags: ["grammar", "case-endings"]
    notes: "Marathi puts 'in' after the noun, as an ending, and writes it joined: घर (ghar, house) + -त (-ta), with an -आ- (-ā-) between."
  - id: mr-0128
    target: "मुंबईला"
    native: "to Mumbai"
    reading: "mumbailā"
    ipa: "mumbəila"
    tags: ["grammar", "case-endings"]
    notes: "'To' is the ending -ला (-lā): मुंबई (mumbai) + -ला (-lā)."
  - id: mr-0129
    target: "आईबरोबर"
    native: "with mother"
    reading: "āibarobar"
    ipa: "aibərobər"
    tags: ["grammar", "case-endings"]
    notes: "'With' is -बरोबर (-barobar), written joined too: आई (āi, mother) + -बरोबर (-barobar). Hindi writes such words apart; Marathi joins them."
  - id: mr-0130
    target: "मी आलो."
    native: "I came. (a man speaking)"
    reading: "mi ālo."
    ipa: "mi alo"
    tags: ["grammar", "gender"]
    notes: "The verb shows the speaker's gender, even for 'I': a man says आलो (ālo)."
  - id: mr-0131
    target: "मी आले."
    native: "I came. (a woman speaking)"
    reading: "mi āle."
    ipa: "mi ale"
    tags: ["grammar", "gender"]
    notes: "A woman says आले (āle). Learners who are women need these forms from the first day."
  - id: mr-0132
    target: "तो आला."
    native: "He came."
    reading: "to ālā."
    ipa: "t̪o ala"
    tags: ["grammar", "gender"]
  - id: mr-0133
    target: "ती आली."
    native: "She came."
    reading: "ti āli."
    ipa: "t̪i ali"
    tags: ["grammar", "gender"]
  - id: mr-0134
    target: "ते आले."
    native: "It came."
    reading: "te āle."
    ipa: "t̪e ale"
    tags: ["grammar", "gender"]
    notes: "Marathi has a third gender, neuter, for many things and for children: बाळ आले (bāḷ āle), the baby came. ते (te) is also 'they' and a respectful 'he'."
  - id: mr-0135
    target: "तू ये."
    native: "Come! (to a friend)"
    reading: "tu ye."
    ipa: "t̪u je"
    tags: ["grammar", "two-yous"]
    notes: "Two words for 'you': तू (tu) to a friend, a child or someone younger, and in many families to a mother."
  - id: mr-0136
    target: "तुम्ही या."
    native: "Please come."
    reading: "tumhi yā."
    ipa: "t̪umɦi ja"
    tags: ["grammar", "two-yous"]
    notes: "तुम्ही (tumhi) is the respectful 'you', and the plural, and its verb takes the plural: या (yā), not ये (ye)."
  - id: mr-0137
    target: "आपण"
    native: "we (you and I); you (very formal)"
    reading: "āpaṇ"
    ipa: "apəɳ"
    tags: ["grammar", "two-wes"]
    notes: "Two words for 'we': आपण (āpaṇ) includes the person you're talking to. In formal speech it is also a very polite 'you'."
  - id: mr-0138
    target: "आम्ही"
    native: "we (not you)"
    reading: "āmhi"
    ipa: "amɦi"
    tags: ["grammar", "two-wes"]
    notes: "आम्ही (āmhi) leaves the person you're talking to out."
  - id: mr-0139
    target: "एक पुस्तक"
    native: "a book; one book"
    picture: "📖"
    reading: "ek pustak"
    ipa: "ek pust̪ək"
    tags: ["grammar", "articles"]
    notes: "No word for 'the', and एक (ek), 'one', serves for 'a' when it is needed."
  - id: mr-0140
    target: "माझ्याकडे पुस्तक आहे."
    native: "I have a book."
    reading: "mājhyākaḍe pustak āhe."
    ipa: "madʒʱjakəɖe pust̪ək aɦe"
    tags: ["grammar", "have"]
    notes: "No verb 'have': 'with me a book is'. -कडे (-kaḍe) is 'at, towards, with'."
  - id: mr-0141
    target: "मी येणार नाही."
    native: "I won't come."
    reading: "mi yeṇār nāhi."
    ipa: "mi jeɳar naɦi"
    tags: ["grammar", "negation"]
    notes: "नाही (nāhi), 'not', comes after the verb: येणार (yeṇār) is 'going to come'."
  - id: mr-0142
    target: "वेळ नाही."
    native: "There's no time."
    reading: "veḷ nāhi."
    ipa: "ʋeɭ naɦi"
    tags: ["grammar", "negation"]
    notes: "नाही (nāhi) is also 'there is not', the opposite of आहे (āhe)."
  - id: mr-0143
    target: "तुम्ही येणार का?"
    native: "Will you come?"
    reading: "tumhi yeṇār kā?"
    ipa: "t̪umɦi jeɳar ka"
    tags: ["grammar", "questions"]
    notes: "A yes-or-no question adds का (kā) at the end, or simply rises in tone: तुम्ही येणार (you will come) becomes तुम्ही येणार का (tumhi yeṇār kā)?"
