schema: 1
id: mr-en-time
name: "Time and days"
kind: vocab
theme: time
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Today and tomorrow, the parts of the day, telling the time, and the days of the week. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: mr-0474
    target: "आज"
    native: "today"
    reading: "aj"
    pos: "adv"
  - id: mr-0475
    target: "उद्या"
    native: "tomorrow"
    reading: "udya"
    pos: "adv"
    notes: "Unlike Hindi, which says कल for both, Marathi has a word of its own for each: उद्या tomorrow, काल yesterday."
  - ref: mr-0119
    notes: "Only 'yesterday'. The day before yesterday is परवा (parva), which is also the day after tomorrow."
  - id: mr-0476
    target: "आता"
    native: "now"
    reading: "ata"
    pos: "adv"
    notes: "आत्ता (atta), right now."
  - id: mr-0477
    target: "सकाळ"
    native: "morning"
    reading: "sakal"
    pos: "noun"
    gender: "f"
    notes: "सकाळी (sakali), in the morning: सकाळी सात वाजता, at seven in the morning."
  - id: mr-0478
    target: "दुपार"
    native: "afternoon; midday"
    reading: "dupar"
    pos: "noun"
    gender: "f"
    notes: "दुपारी (dupari), in the afternoon. Many shops close for a while after lunch."
  - id: mr-0479
    target: "संध्याकाळ"
    native: "evening"
    reading: "sandhyakal"
    pos: "noun"
    gender: "f"
    notes: "संध्याकाळी (sandhyakali), in the evening."
  - id: mr-0480
    target: "रात्र"
    native: "night"
    reading: "ratra"
    pos: "noun"
    gender: "f"
    notes: "रात्री (ratri), at night."
  - ref: mr-0122
    notes: "Time, and a time: आता वेळ नाही (ata vel nahi), there's no time now; जेवणाची वेळ, mealtime."
  - id: mr-0481
    target: "वाजता"
    native: "at … o'clock"
    reading: "vajta"
    pos: "other"
    notes: "After the number: चार वाजता (char vajta), at four o'clock. 'It's four o'clock' is चार वाजले (char vajle), 'four have struck'."
  - id: mr-0482
    target: "तास"
    native: "hour"
    reading: "tas"
    pos: "noun"
    gender: "m"
    notes: "दोन तास (don tas), two hours. A lesson at school is a तास too."
  - id: mr-0483
    target: "मिनिट"
    native: "minute"
    reading: "minit"
    pos: "noun"
    gender: "n"
    notes: "पाच मिनिटे (pach minite), five minutes. एक मिनिट!, just a minute!"
  - id: mr-0484
    target: "साडेचार"
    native: "half past four; 4½"
    reading: "sadechar"
    pos: "other"
    notes: "साडे + the hour: साडेपाच (sadepach), 5:30. But 1:30 is दीड (did) and 2:30 अडीच (adich). A quarter past is सव्वा, a quarter to पावणे: सव्वाचार, 4:15; पावणेचार, 3:45."
  - id: mr-0485
    target: "दिवस"
    native: "day"
    reading: "divas"
    pos: "noun"
    gender: "m"
    notes: "दिवसा (divsa), by day. दर दिवशी (dar divshi), every day."
  - id: mr-0486
    target: "आठवडा"
    native: "week"
    reading: "athvada"
    pos: "noun"
    gender: "m"
    notes: "पुढच्या आठवड्यात (pudhchya athvadyat), next week."
  - id: mr-0487
    target: "सोमवार"
    native: "Monday"
    reading: "somvar"
    pos: "noun"
    gender: "m"
    notes: "The days are named after the moon and the planets, as in English: सोम, the moon. On Monday: सोमवारी (somvari)."
  - id: mr-0488
    target: "मंगळवार"
    native: "Tuesday"
    reading: "mangalvar"
    pos: "noun"
    gender: "m"
    notes: "मंगळ, Mars, with the curled-back ळ."
  - id: mr-0489
    target: "बुधवार"
    native: "Wednesday"
    reading: "budhvar"
    pos: "noun"
    gender: "m"
  - id: mr-0490
    target: "गुरुवार"
    native: "Thursday"
    reading: "guruvar"
    pos: "noun"
    gender: "m"
  - id: mr-0491
    target: "शुक्रवार"
    native: "Friday"
    reading: "shukravar"
    pos: "noun"
    gender: "m"
  - id: mr-0492
    target: "शनिवार"
    native: "Saturday"
    reading: "shanivar"
    pos: "noun"
    gender: "m"
  - id: mr-0493
    target: "रविवार"
    native: "Sunday"
    reading: "ravivar"
    pos: "noun"
    gender: "m"
