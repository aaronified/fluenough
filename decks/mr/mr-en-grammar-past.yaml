schema: 1
id: mr-en-grammar-past
name: "Past tense"
kind: grammar
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I went, she came: the simple past of verbs without an object, by person and gender. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Simple past, verbs without an object"
  slot_name: "person and gender"
  slots: ["मी (m)", "मी (f)", "आम्ही", "तू (m)", "तू (f)", "तुम्ही", "तो", "ती", "ते (it)", "ते (they)", "त्या (they, f)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The stem, then -ल-, then an ending that agrees with the doer: a man says मी गेलो, a woman मी गेले; to a man तू गेलास, to a woman तू गेलीस; तो गेला, ती गेली, ते (it) गेले. आम्ही takes -लो, and तुम्ही -लात, often shortened to -ला. जाणे and येणे have stems of their own: गेला, आला. With an object the rule is different: see Pitfalls."
  entries:
    - lemma: "जाणे"
      key: jaane
      reading: "jane"
      gloss: "to go"
      forms:
        "मी (m)": "गेलो"
        "मी (f)": "गेले"
        "आम्ही": "गेलो"
        "तू (m)": "गेलास"
        "तू (f)": "गेलीस"
        "तुम्ही": ["गेलात", "गेला"]
        "तो": "गेला"
        "ती": "गेली"
        "ते (it)": "गेले"
        "ते (they)": "गेले"
        "त्या (they, f)": "गेल्या"
      readings:
        "मी (m)": "gelo"
        "मी (f)": "gele"
        "आम्ही": "gelo"
        "तू (m)": "gelas"
        "तू (f)": "gelis"
        "तुम्ही": ["gelat", "gela"]
        "तो": "gela"
        "ती": "geli"
        "ते (it)": "gele"
        "ते (they)": "gele"
        "त्या (they, f)": "gelya"
    - lemma: "येणे"
      key: yene
      reading: "yene"
      gloss: "to come"
      forms:
        "मी (m)": "आलो"
        "मी (f)": "आले"
        "आम्ही": "आलो"
        "तू (m)": "आलास"
        "तू (f)": "आलीस"
        "तुम्ही": ["आलात", "आला"]
        "तो": "आला"
        "ती": "आली"
        "ते (it)": "आले"
        "ते (they)": "आले"
        "त्या (they, f)": "आल्या"
      readings:
        "मी (m)": "alo"
        "मी (f)": "ale"
        "आम्ही": "alo"
        "तू (m)": "alas"
        "तू (f)": "alis"
        "तुम्ही": ["alat", "ala"]
        "तो": "ala"
        "ती": "ali"
        "ते (it)": "ale"
        "ते (they)": "ale"
        "त्या (they, f)": "alya"
    - lemma: "बसणे"
      key: basne
      reading: "basne"
      gloss: "to sit"
      forms:
        "मी (m)": "बसलो"
        "मी (f)": "बसले"
        "आम्ही": "बसलो"
        "तू (m)": "बसलास"
        "तू (f)": "बसलीस"
        "तुम्ही": ["बसलात", "बसला"]
        "तो": "बसला"
        "ती": "बसली"
        "ते (it)": "बसले"
        "ते (they)": "बसले"
        "त्या (they, f)": "बसल्या"
      readings:
        "मी (m)": "baslo"
        "मी (f)": "basle"
        "आम्ही": "baslo"
        "तू (m)": "baslas"
        "तू (f)": "baslis"
        "तुम्ही": ["baslat", "basla"]
        "तो": "basla"
        "ती": "basli"
        "ते (it)": "basle"
        "ते (they)": "basle"
        "त्या (they, f)": "baslya"
    - lemma: "उठणे"
      key: uthne
      reading: "uthne"
      gloss: "to get up"
      forms:
        "मी (m)": "उठलो"
        "मी (f)": "उठले"
        "आम्ही": "उठलो"
        "तू (m)": "उठलास"
        "तू (f)": "उठलीस"
        "तुम्ही": ["उठलात", "उठला"]
        "तो": "उठला"
        "ती": "उठली"
        "ते (it)": "उठले"
        "ते (they)": "उठले"
        "त्या (they, f)": "उठल्या"
      readings:
        "मी (m)": "uthlo"
        "मी (f)": "uthle"
        "आम्ही": "uthlo"
        "तू (m)": "uthlas"
        "तू (f)": "uthlis"
        "तुम्ही": ["uthlat", "uthla"]
        "तो": "uthla"
        "ती": "uthli"
        "ते (it)": "uthle"
        "ते (they)": "uthle"
        "त्या (they, f)": "uthlya"
