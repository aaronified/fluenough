schema: 1
kind: "phonetics"
id: "mr-phonetics"
language: "mr"
variety: "Standard Marathi, as the course's broad ipa writes it"
description: "Rules that turn a card's broad ipa into its narrow [ ] form, in order. Written for tools/derive_phonetic.py, never read by the app. Each rule applies the regular expression to the whole ipa string and replaces every match; the next rule works on the result. Only rules that are attested are here. The course's broad ipa for Marathi (tools/transcribe.py mr) already writes the dental stops (t̪ d̪), the retroflexes (ʈ ɖ ɳ ɭ ʂ), aspirates and breathy voice (ʰ ʱ), the glide ʋ, the breathy h ɦ, the central schwa ə (deleted word-finally, kept after a conjunct), the diphthongs əi əu, the loan vowels æ ɔ, the nasal said before a stop for an anusvara (ŋ ɲ) and the word-final nasalised ə̃, and it already chooses the alveolar affricates ts dz before a back vowel and the postalveolars tʃ dʒ before a front vowel (transcribe.py, from the letter's following vowel), so the rules here add what it does not say: the nasal before a stop that was left plain (mr-n-velar, mr-n-palatal), the dental nasal (mr-n-dental), the murmured sonorants म्ह न्ह ल्ह (mr-sonorant-murmured), the tap ɾ for ऱ र (mr-r-tap) and the retroflex lateral flap of ळ (mr-l-retroflex-flap). Order: the rules touch different sounds and cannot clash. Left out, on purpose: the ɖ~ɽ allophony (Wikipedia: stops word-initially or after nasals, flaps elsewhere, but Wiktionary writes ɖ in every position, 95 of 95, and the flap would need a symbol the course does not otherwise use); ʃ and tʃ as ɕ and t͡ɕ (Wikipedia gives /ɕ~ʃ/ and /t͡ɕ~t͡ʃ/ as variants, Wiktionary writes ɕ and t͡ɕ, the course teaches ʃ and tʃ, and which is more standard is not settled); tie bars on ts dz (Wikipedia and Wiktionary write them, no source says they are required); vowel length (Wikipedia: almost no phonemic length, i and u long in monosyllables and may be long word-finally, but Wiktionary writes iː uː on most final syllables and the line between the two is not stated); the nasal glides [w̃] before श ष स ह र and [j̃] before य for an anusvara (Wikipedia states them, but the broad ipa writes a nasalised vowel in those 8 words and the rule cannot tell which realisation it stands for); the merger of ɳ and ʂ with n and s in Marathwada-Vidarbha speech (a dialect); murmured j. A rule left out is not a claim that it does not exist. Sources are named per rule; Wikipedia, Marathi phonology and the kaikki.org Marathi dump were read on 2026-11-15; Wiktionary's Appendix:Marathi pronunciation does not exist (404 on 2026-11-15) and is not cited."
rules:
  - id: "mr-n-velar"
    pattern: 'n(?=ˈ?[kɡ])'
    replace: "ŋ"
    source: "Wikipedia, Marathi phonology (https://en.wikipedia.org/wiki/Marathi_phonology, CC BY-SA 4.0), fetched 2026-11-15, \"Consonants\": the nasals are /m n ɳ/ with palatal /ɲ/ and velar /ŋ/ given in parentheses, that is, marginal sounds that occur as the n before a palatal or velar stop; Wiktionary writes [ŋ] for it (e.g. मुंगी [muŋ.ɡiː], Wiktionary Marathi entries (kaikki.org Marathi dump modified 2026-10-30, untagged narrow forms, read 2026-11-15)). The broad ipa (tools/transcribe.py mr) already writes the nasal said before a stop for an anusvara (ŋ 107 words, ɲ 70, counted on decks-live 2026-11-15), so this rule only catches the three words it left with a plain n (snanɡruɦ, bəsəst̪ʰankaʋər)."
  - id: "mr-n-palatal"
    pattern: 'n(?=ˈ?(?:tʃ|dʒ))'
    replace: "ɲ"
    source: "Wikipedia, Marathi phonology (https://en.wikipedia.org/wiki/Marathi_phonology, CC BY-SA 4.0), fetched 2026-11-15, \"Consonants\": /ɲ/ is a marginal nasal, the n before a palatal affricate (as mr-n-velar). Catches the two words the broad ipa left with a plain n (pʰontʃi, ləɦanpɳapasuntʃi). Only tʃ and dʒ are taken: before the alveolar affricates ts dz the broad ipa already writes ɲ for an anusvara (maɲdzər), and the rule leaves a plain n there alone."
  - id: "mr-n-dental"
    pattern: 'n(?=ˈ?[td]̪)'
    replace: "n̪"
    source: "Wikipedia, Marathi phonology (https://en.wikipedia.org/wiki/Marathi_phonology, CC BY-SA 4.0), fetched 2026-11-15, \"Consonants\": the stops t̪ d̪ are dental and the nasal n is in the same dental-alveolar column; the broad ipa writes the nasal before a dental stop as a plain n (310 words, counted on decks-live 2026-11-15: sənd̪ʱi, t̪in, kut̪ra), so it is written dental (n̪) before t̪ or d̪, as Telugu and Kannada do (te-n-dental, kn-n-dental); Wiktionary writes [sən.d̪ʱiː] with a plain n, which this rule does not follow (the same assimilation is attested in Pandharipande, Marathi (1997, Routledge Descriptive Grammars), named here as the work the field cites, not read for this file). Medium confidence: the sources place n in the dental-alveolar column without saying which."
  - id: "mr-sonorant-murmured"
    pattern: '([mnɳlʋ])ɦ'
    replace: "\\1ʱ"
    source: "Wikipedia, Marathi phonology (https://en.wikipedia.org/wiki/Marathi_phonology, CC BY-SA 4.0), fetched 2026-11-15, \"Consonants\": the sonorants m n ɳ ʋ l ɾ have murmured counterparts /mʱ nʱ ɳʱ ʋʱ lʱ ɾʱ/, written in Devanagari as the sonorant with a conjunct ह (म्ह, न्ह, ण्ह, व्ह, ल्ह); Wiktionary writes [mʱəiːs] for म्हैस and [lʱii.ɳe] for लिहिणे (Wiktionary Marathi entries (kaikki.org Marathi dump modified 2026-10-30, untagged narrow forms, read 2026-11-15)). The broad ipa writes the conjunct as the sonorant then ɦ (169 distinct broad ipa strings in decks/mr on decks-live, counted 2026-11-16: amɦi, ɡunɦa, unɦat̪), with no vowel between, so the pair is one murmured sound: the sonorant plus ʱ. The palatal glide j is left out: Wikipedia gives /jʱ/ only in parentheses. A few words whose schwa the broad ipa deletes (for example दरमहा, सकलही) are wrongly murmured; they are fixed by correcting their broad ipa."
  - id: "mr-r-tap"
    pattern: '(?<!r)r(?!r)'
    replace: "ɾ"
    source: "Wikipedia, Marathi phonology (https://en.wikipedia.org/wiki/Marathi_phonology, CC BY-SA 4.0), fetched 2026-11-15, \"Consonants\": the rhotic is /ɾ~r/, and the murmured one /ɾʱ~rʱ/; Wiktionary writes ɾ in all 612 rhotics of its untagged Marathi narrow forms and no r (Wiktionary Marathi entries (kaikki.org Marathi dump modified 2026-10-30, untagged narrow forms, read 2026-11-15): ऋतू [ɾu.t̪uː], पूर [puːɾ]). So the broad ipa's r (3,435 occurrences) is a tap in the standard, as kn-r-tap does for Kannada. A doubled rr (one loan, ant̪ərraʂʈrij) is left a trill."
  - id: "mr-l-retroflex-flap"
    pattern: 'ɭ(?!\u0306)'
    replace: "ɭ\u0306"
    source: "Wikipedia, Marathi phonology (https://en.wikipedia.org/wiki/Marathi_phonology, CC BY-SA 4.0), fetched 2026-11-15, \"Consonants\": the single Indo-Aryan /l/ became \"the retroflex lateral flap (written ḷ)\" of ळ (kuḷa, kamaḷa); Wiktionary writes it [ɭ̆] (breve) in every Marathi narrow form that has it: 114 of 114 (Wiktionary Marathi entries (kaikki.org Marathi dump modified 2026-10-30, untagged narrow forms, read 2026-11-15): खेळाडू [kʰe.ɭ̆a.ɖuː], शेळी [ɕe.ɭ̆iː]). The decks' broad ipa writes ɭ (669 words); the narrow form adds the breve for the flap, because the flap symbol itself (U+1DF08) is outside the validator's IPA characters."
