  "sentences":
  - "text": "पहिल्या पावतीत: त्याने पेन घेतला आणि वही घेतली."
    "reading": "pahilyā pāvtit: tyāne pen ghetlā āṇi vahi ghetli."
    "ipa": "pəɦilja paʋt̪it̪ t̪jane pen ɡʱet̪la aɳi ʋəɦi ɡʱet̪li"
  - "text": "दुसऱ्या पावतीत: तिने साडी घेतली आणि दूध घेतलं."
    "reading": "dusaryā pāvtit: tine sāḍi ghetli āṇi dudh ghetlam̐."
    "ipa": "d̪usərja paʋt̪it̪ t̪ine saɖi ɡʱet̪li aɳi d̪ud̪ʱ ɡʱet̪lə̃"
  - "text": "दोन्ही पावत्या माझ्याकडे आहेत."
    "reading": "donhi pāvatyā mājhyākḍe āhet."
    "ipa": "d̪onɦi paʋət̪ja madʒʱjakɖe aɦet̪"
  - "text": "मी त्या दोन्ही पावत्या वाचल्या."
    "reading": "mi tyā donhi pāvatyā vācalyā."
    "ipa": "mi t̪ja d̪onɦi paʋət̪ja ʋatsəlja"
