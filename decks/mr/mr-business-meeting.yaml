cards:
  - id: "mr-8050"
    target: "आजच्या बैठकीचा अजेंडा काय आहे?"
    reading: "ājacyā baiṭhkicā ajeṇḍā kāy āhe?"
    ipa: "adzətʃja bəiʈʰkitsa ədʒeɳɖa kaj aɦe"
    pos: "phrase"
    modes: ["recognition", "production", "listening"]
  - id: "mr-8051"
    target: "मला काही बोलायचं आहे."
    reading: "malā kāhi bolāycam̐ āhe."
    ipa: "məla kaɦi bolajtsə̃ aɦe"
    pos: "phrase"
    modes: ["recognition", "production", "listening"]
  - id: "mr-8052"
    target: "मला हे पटत नाही."
    reading: "malā he paṭat nāhi."
    ipa: "məla ɦe pəʈət̪ naɦi"
    pos: "phrase"
    modes: ["recognition", "production", "listening"]
    notes: [{ id: "n1", kind: "usage" }]
  - id: "mr-8053"
    target: "ही बैठक किती वेळ चालेल?"
    reading: "hi baiṭhak kiti veḷ cālel?"
    ipa: "ɦi bəiʈʰək kit̪i ʋeɭ tsalel"
    pos: "phrase"
    modes: ["recognition", "production", "listening"]
  - id: "mr-8054"
    target: "पुढची बैठक कधी आहे?"
    reading: "puḍhci baiṭhak kadhi āhe?"
    ipa: "puɖʱtʃi bəiʈʰək kəd̪ʱi aɦe"
    pos: "phrase"
    modes: ["recognition", "production", "listening"]
  - id: "mr-8055"
    target: "मुद्द्यावर येऊया."
    reading: "muddyāvar yeuyā."
    ipa: "mud̪d̪jaʋər jeuja"
    pos: "phrase"
    modes: ["recognition", "production", "listening"]
  - id: "mr-8056"
    target: "हा निर्णय आजच घेऊया."
    reading: "hā nirṇay ājac gheuyā."
    ipa: "ɦa nirɳəj adzəts ɡʱeuja"
    pos: "phrase"
    modes: ["recognition", "production", "listening"]
  - id: "mr-8057"
    target: "पुढच्या आठवड्यात पुन्हा भेटूया."
    reading: "puḍhacyā āṭhvaḍyāt punhā bheṭuyā."
    ipa: "puɖʱətʃja aʈʰʋəɖjat̪ punɦa bʱeʈuja"
    pos: "phrase"
    modes: ["recognition", "production", "listening"]
  - id: "mr-8058"
    target: "हे मुद्दे लिहून ठेवा."
    reading: "he mudde lihun ṭhevā."
    ipa: "ɦe mud̪d̪e liɦun ʈʰeʋa"
    pos: "phrase"
    modes: ["recognition", "production", "listening"]
