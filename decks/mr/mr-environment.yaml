    reading: "punarvāpar"
    ipa: "punərʋapər"
    pos: "noun"
    gender: "m"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "पुनर्वापर", reading: "punarvāpar" }] }
    examples:
      - { target: "प्लास्टिकचा पुनर्वापर करा.", reading: "plāsṭikcā punarvāpar karā.", ipa: "plasʈiktsa punərʋapər kəra", bases: [{ word: "प्लास्टिकचा", base: "प्लास्टिक", reading: "plāsṭik" }, { word: "करा", ref: "mr-0712" }] }
      - { target: "कागदाचा पुनर्वापर होतो.", reading: "kāgdācā punarvāpar hoto.", ipa: "kaɡd̪atsa punərʋapər ɦot̪o", bases: [{ word: "कागदाचा", ref: "mr-0838" }, { word: "होतो", base: "होणे", reading: "hoṇe" }] }
  - id: "mr-1486"
