      - { target: "तापमानवाढ ही मोठी समस्या आहे.", reading: "tāpmānvāḍh hi moṭhi samasyā āhe.", ipa: "t̪apmanʋaɖʱ ɦi moʈʰi səməsja aɦe", bases: [{ word: "ही", ref: "mr-0679" }, { word: "मोठी", ref: "mr-0760" }, { word: "समस्या", base: "समस्या", reading: "samasyā" }, { word: "आहे", base: "असणे", reading: "asṇe" }] }
