cards:
  - id: "mr-1482"
    target: "पर्यावरण"
    reading: "paryāvraṇ"
    ipa: "pərjaʋrəɳ"
    pos: "noun"
    gender: "n"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "पर्यावरण", reading: "paryāvraṇ" }] }
    examples:
      - { target: "पर्यावरण स्वच्छ ठेवा.", reading: "paryāvraṇ svacch ṭhevā.", ipa: "pərjaʋrəɳ sʋətstʃʰ ʈʰeʋa", bases: [{ word: "स्वच्छ", ref: "mr-0766" }, { word: "ठेवा", ref: "mr-0723" }] }
      - { target: "पर्यावरणाचं रक्षण करणं गरजेचं आहे.", reading: "paryāvrṇācam̐ rakṣaṇ karṇam̐ garjecam̐ āhe.", ipa: "pərjaʋrɳatsə̃ rəkʂəɳ kərɳə̃ ɡərdʒetsə̃ aɦe", bases: [{ word: "पर्यावरणाचं", ref: "mr-1482" }, { word: "रक्षण", base: "रक्षण", reading: "rakṣaṇ" }, { word: "करणं", ref: "mr-0712" }, { word: "आहे", base: "असणे", reading: "asṇe" }] }
  - id: "mr-1483"
    target: "प्रदूषण"
    reading: "praduṣaṇ"
    ipa: "prəd̪uʂəɳ"
    pos: "noun"
    gender: "n"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "प्रदूषण", reading: "praduṣaṇ" }] }
    examples:
      - { target: "शहरात हवेचं प्रदूषण जास्त आहे.", reading: "śahrāt havecam̐ praduṣaṇ jāst āhe.", ipa: "ʃəɦrat̪ ɦəʋetsə̃ prəd̪uʂəɳ dzast̪ aɦe", bases: [{ word: "शहरात", base: "शहर", reading: "śahar" }, { word: "हवेचं", ref: "mr-1018" }, { word: "जास्त", base: "जास्त", reading: "jāst" }, { word: "आहे", base: "असणे", reading: "asṇe" }] }
      - { target: "प्रदूषण कमी करा.", reading: "praduṣaṇ kami karā.", ipa: "prəd̪uʂəɳ kəmi kəra", bases: [{ word: "कमी", base: "कमी", reading: "kami" }, { word: "करा", ref: "mr-0712" }] }
  - id: "mr-1484"
    target: "प्रदूषित"
    reading: "praduṣit"
    ipa: "prəd̪uʂit̪"
    pos: "adjective"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "प्रदूषित", reading: "praduṣit" }] }
    examples:
      - { target: "ही नदी प्रदूषित झाली आहे.", reading: "hi nadi praduṣit jhāli āhe.", ipa: "ɦi nəd̪i prəd̪uʂit̪ dzʱali aɦe", bases: [{ word: "ही", ref: "mr-0679" }, { word: "नदी", ref: "mr-0966" }, { word: "झाली", base: "होणे", reading: "hoṇe" }, { word: "आहे", base: "असणे", reading: "asṇe" }] }
      - { target: "प्रदूषित पाणी पिऊ नका.", reading: "praduṣit pāṇi piu nakā.", ipa: "prəd̪uʂit̪ paɳi piu nəka", bases: [{ word: "पिऊ", ref: "mr-0709" }, { word: "नका", ref: "mr-0413" }] }
  - id: "mr-1485"
