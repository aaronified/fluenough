      - { target: "जंगलतोड थांबवा.", reading: "jaṅgaltoḍ thāmbavā.", ipa: "dzəŋɡəlt̪oɖ t̪ʰambəʋa", bases: [{ word: "थांबवा", base: "थांबवणे", reading: "thāmbavṇe" }] }
  - id: "mr-1488"
    target: "तापमानवाढ"
