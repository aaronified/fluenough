    examples:
      - { target: "हा वृक्ष खूप जुना आहे.", reading: "hā vrukṣ khup junā āhe.", ipa: "ɦa ʋrukʂ kʰup dzuna aɦe", bases: [{ word: "हा", ref: "mr-0679" }, { word: "जुना", ref: "mr-0762" }, { word: "आहे", base: "असणे", reading: "asṇe" }] }
      - { target: "वृक्ष लावा.", reading: "vrukṣ lāvā.", ipa: "ʋrukʂ laʋa", bases: [{ word: "लावा", base: "लावणे", reading: "lāvṇe" }] }
  - id: "mr-1487"
    target: "जंगलतोड"
