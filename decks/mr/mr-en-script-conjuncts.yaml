schema: 1
id: mr-en-script-conjuncts
name: "Marathi conjuncts"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Two consonants with no vowel between them join: the first is usually written as a half letter, without its standing line. Four join in shapes of their own, r takes three forms, and Marathi has its own eyelash r. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: mr-0087
    target: "क्ष"
    native: "k + curled-back sh (ksh)"
    reading: "kṣa"
    ipa: "kʂə"
    notes: "Its own shape, nothing like its parts: पक्षी (pakṣi, bird). Marathi counts it as a letter of the alphabet."
  - id: mr-0088
    target: "त्र"
    native: "t + r (tr)"
    reading: "tra"
    ipa: "t̪rə"
    notes: "Its own shape, त (ta) joined with र (ra): मित्र (mitra, friend). A word that ends in a conjunct keeps its last a in Marathi: mitra, not mitr."
  - id: mr-0089
    target: "ज्ञ"
    native: "j + ny, said dny"
    reading: "dnya"
    ipa: "d̪ɲə"
    notes: "Its own shape. Marathi says it 'dny', where Hindi says 'gy': ज्ञान (dnyān, knowledge). It is a letter of the Marathi alphabet."
  - id: mr-0090
    target: "श्र"
    native: "sh + r (shr)"
    reading: "śra"
    ipa: "ʃrə"
    notes: "Its own shape: श्रावण (śrāvaṇ, the month of the monsoon festivals)."
  - id: mr-0091
    target: "प्र"
    native: "p + r (the r stroke)"
    reading: "pra"
    ipa: "prə"
    notes: "A र (ra) after a consonant is a small slanting stroke at its foot: प्रवास (pravās, journey)."
  - id: mr-0092
    target: "ट्र"
    native: "curled-back t + r"
    reading: "ṭra"
    ipa: "ʈrə"
    notes: "After ट (ṭa) or ड (ḍa), र (ra) is written as a small caret below: ट्रेन (ṭren, train)."
  - id: mr-0093
    target: "र्य"
    native: "r + y (the reph)"
    reading: "rya"
    ipa: "rjə"
    notes: "A र (ra) before another consonant is usually a small hook above that consonant, the reph: सूर्य (surya, sun)."
  - id: mr-0094
    target: "ऱ्य"
    native: "r + y (the eyelash r)"
    reading: "rya"
    ipa: "rjə"
    modes: [recognition, production]
    notes: "In many Marathi words where r meets y, the r is a small eyelash instead of a reph: दुसऱ्या (dusryā, other; second), कैऱ्या (kairyā, green mangoes). It sounds the same as र्य (rya), so it is drilled by reading and writing only."
  - id: mr-0095
    target: "क्क"
    native: "k + k (half क (ka))"
    reading: "kka"
    ipa: "kkə"
    modes: [recognition, production]
    notes: "The first क (ka) is written without its hook on the right and joins the second: पक्का (pakkā, firm; certain). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  - id: mr-0096
    target: "च्च"
    native: "ch + ch (half च (ca))"
    reading: "cca"
    ipa: "tstsə"
    modes: [recognition, production]
    notes: "Half च (ca) joined to च (ca): कच्चा (kaccā, raw; unripe). Drilled by reading and writing only."
  - id: mr-0097
    target: "त्त"
    native: "t + t (half त (ta))"
    reading: "tta"
    ipa: "t̪t̪ə"
    modes: [recognition, production]
    notes: "Half त (ta) joined to त (ta): पत्ता (pattā, address). Drilled by reading and writing only."
  - id: mr-0098
    target: "ल्ल"
    native: "l + l (half ल (la))"
    reading: "lla"
    ipa: "llə"
    modes: [recognition, production]
    notes: "Half ल (la) joined to ल (la): किल्ला (killā, fort). Drilled by reading and writing only."
  - id: mr-0099
    target: "न्न"
    native: "n + n (half न (na))"
    reading: "nna"
    ipa: "nnə"
    modes: [recognition, production]
    notes: "Half न (na) joined to न (na): पन्नास (pannās, fifty). Drilled by reading and writing only."
  - id: mr-0100
    target: "प्प"
    native: "p + p (half प (pa))"
    reading: "ppa"
    ipa: "ppə"
    modes: [recognition, production]
    notes: "Half प (pa) joined to प (pa): गप्पा (gappā, a chat). Drilled by reading and writing only."
  - id: mr-0101
    target: "ट्ट"
    native: "curled-back t + t (stacked)"
    reading: "ṭṭa"
    ipa: "ʈʈə"
    modes: [recognition, production]
    notes: "ट (ṭa) has no standing line, so it can't be halved: the second ट (ṭa) is stacked below the first. पट्टा (paṭṭā, strap; belt). Drilled by reading and writing only."
  - id: mr-0102
    target: "द्ध"
    native: "d + dh (stacked)"
    reading: "ddha"
    ipa: "d̪d̪ʱə"
    notes: "द (da) stacks too, with ध (dha) below it: शुद्ध (śuddha, pure)."
  - id: mr-0103
    target: "द्य"
    native: "d + y"
    reading: "dya"
    ipa: "d̪jə"
    notes: "द (da) with a small य (ya) joined after it: विद्यार्थी (vidyārthi, student)."
  - id: mr-0104
    target: "स्त"
    native: "s + t (half स (sa))"
    reading: "sta"
    ipa: "st̪ə"
    notes: "Half स (sa) joined to त (ta): रस्ता (rastā, road)."
  - id: mr-0105
    target: "स्थ"
    native: "s + th (half स (sa))"
    reading: "stha"
    ipa: "st̪ʰə"
    notes: "Half स (sa) joined to थ (tha): स्थानक (sthānak, station)."
  - id: mr-0106
    target: "क्त"
    native: "k + t"
    reading: "kta"
    ipa: "kt̪ə"
    notes: "क (ka) without its hook, joined to त (ta): फक्त (phakta, only). The final a stays after a conjunct."
  - id: mr-0107
    target: "श्च"
    native: "sh + ch"
    reading: "śca"
    ipa: "ʃtsə"
    notes: "Half श (śa) joined to च (ca): पश्चिम (paścim, west)."
  - id: mr-0108
    target: "म्ह"
    native: "m with a breath (mh)"
    reading: "mha"
    ipa: "mɦə"
    notes: "Marathi joins h to m, n and l to give them a breath: तुम्ही (tumhi, you), आम्ही (āmhi, we)."
  - id: mr-0109
    target: "न्ह"
    native: "n with a breath (nh)"
    reading: "nha"
    ipa: "nɦə"
    notes: "Half न (na) joined to ह (ha): उन्हाळा (unhāḷā, summer)."
  - id: mr-0110
    target: "ल्ह"
    native: "l with a breath (lh)"
    reading: "lha"
    ipa: "lɦə"
    notes: "Half ल (la) joined to ह (ha): कोल्हा (kolhā, jackal), and the city of कोल्हापूर (kolhāpur)."
