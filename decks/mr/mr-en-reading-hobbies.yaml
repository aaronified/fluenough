  - "text": "रविवारी सकाळी सात वाजता खेळ असतो."
    "reading": "ravivāri sakāḷi sāt vājtā kheḷ asto."
    "ipa": "rəʋiʋari səkaɭi sat̪ ʋadzt̪a kʰeɭ əst̪o"
  - "text": "मंगळवारी संध्याकाळी गाण्याचा वर्ग असतो."
    "reading": "maṅgaḷvāri sandhyākāḷi gāṇyācā varg asto."
    "ipa": "məŋɡəɭʋari sənd̪ʱjakaɭi ɡaɳjatsa ʋərɡ əst̪o"
  - "text": "नवीन सदस्यांचे स्वागत आहे."
    "reading": "navin sadasyāñce svāgat āhe."
    "ipa": "nəʋin səd̪əsjaɲtʃe sʋaɡət̪ aɦe"
  - "text": "प्रवेश मोफत आहे."
    "reading": "praveś mophat āhe."
    "ipa": "prəʋeʃ mopʰət̪ aɦe"
