schema: 1
id: mr-en-market
name: "Market"
kind: vocab
theme: market
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Asking the price, bargaining, paying: what a market stall needs. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: mr-0369
    target: "किती झाले?"
    native: "How much does it come to?"
    reading: "kiti jhale?"
    pos: "phrase"
    notes: "'How much has it become?', when you have chosen and want to pay. For one thing: हे कितीला? (he kitila?), how much is this?"
  - id: mr-0370
    target: "किंमत"
    native: "price"
    reading: "kimmat"
    pos: "noun"
    gender: "f"
    notes: "The anusvar before म is said m: kimmat."
  - id: mr-0371
    target: "रुपया"
    native: "rupee"
    reading: "rupaya"
    pos: "noun"
    gender: "m"
    notes: "More than one: रुपये (rupaye). शंभर रुपये, a hundred rupees."
  - id: mr-0372
    target: "पैसे"
    native: "money"
    reading: "paise"
    pos: "noun"
    gender: "m"
    notes: "Plural, like 'funds': पैसे आहेत (paise ahet), there's money. One पैसा is a hundredth of a rupee."
  - id: mr-0373
    target: "सुटे पैसे"
    native: "change; small notes and coins"
    reading: "sute paise"
    pos: "phrase"
    notes: "सुटे आहेत का? (sute ahet ka?), do you have change?"
  - id: mr-0374
    target: "खूप महाग आहे!"
    native: "That's too expensive!"
    reading: "khup mahag ahe!"
    pos: "phrase"
    notes: "खूप is 'very, a lot'."
  - id: mr-0375
    target: "थोडे कमी करा."
    native: "Please lower it a little."
    reading: "thode kami kara."
    pos: "phrase"
    tags: ["polite"]
    notes: "The polite way to bargain: 'make it a little less'. Bargaining is expected at markets and stalls, not in shops with fixed prices."
  - id: mr-0376
    target: "दुकान"
    native: "shop"
    reading: "dukan"
    pos: "noun"
    gender: "n"
  - id: mr-0377
    target: "द्या"
    native: "please give (me)"
    reading: "dya"
    pos: "verb"
    tags: ["polite"]
    notes: "एक किलो द्या (ek kilo dya), a kilo, please. To a friend: दे (de)."
  - id: mr-0378
    target: "किलो"
    native: "kilo"
    reading: "kilo"
    pos: "noun"
    gender: "m"
    notes: "अर्धा किलो (ardha kilo), half a kilo; पाव किलो (pav kilo), a quarter kilo."
  - id: mr-0379
    target: "आणखी काही नको."
    native: "Nothing else."
    reading: "ankhi kahi nako."
    pos: "phrase"
    notes: "नको is 'don't want'. The seller will ask आणखी काही? (ankhi kahi?), anything else?"
  - id: mr-0380
    target: "स्वस्त"
    native: "cheap"
    reading: "svasta"
    pos: "adj"
  - id: mr-0381
    target: "महाग"
    native: "expensive"
    reading: "mahag"
    pos: "adj"
  - id: mr-0382
    target: "पिशवी"
    native: "bag (for shopping)"
    reading: "pishvi"
    pos: "noun"
    gender: "f"
    notes: "Many shops charge for a plastic bag, so bring your own: पिशवी आहे (pishvi ahe), I have a bag."
  - id: mr-0383
    target: "बाजार"
    native: "market"
    reading: "bajar"
    pos: "noun"
    gender: "m"
    notes: "भाजी बाजार (bhaji bajar), the vegetable market. From Persian."
