schema: 1
id: mr-en-help
name: "Help"
kind: vocab
theme: help
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Asking for help, doctors and medicine, and saying you are lost. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: mr-0594
    target: "मदत करा!"
    native: "Help!"
    reading: "madat kara!"
    pos: "phrase"
    notes: "'Please help'. The emergency number in India is 112."
  - ref: mr-0415
  - ref: mr-0238
    notes: "डॉक्टरांना बोलवा (doktaranna bolva), call a doctor: a doctor is spoken of in the respectful plural."
  - id: mr-0595
    target: "दवाखाना"
    native: "clinic; the doctor's"
    reading: "davakhana"
    pos: "noun"
    gender: "m"
    notes: "A local doctor's practice, where most people go first."
  - id: mr-0596
    target: "रुग्णालय"
    native: "hospital"
    reading: "rugnalay"
    pos: "noun"
    gender: "n"
    notes: "Formal, and on signs. In speech, हॉस्पिटल (hospital)."
  - id: mr-0597
    target: "औषध"
    native: "medicine"
    reading: "aushadh"
    pos: "noun"
    gender: "n"
    notes: "A chemist's is a मेडिकल (medikal) or औषधाचे दुकान."
  - id: mr-0598
    target: "पोलीस"
    native: "police"
    reading: "polis"
    pos: "noun"
    gender: "m"
    notes: "पोलीस स्टेशन, police station; formally पोलीस ठाणे (polis thane)."
  - id: mr-0599
    target: "मी हरवलो आहे."
    native: "I'm lost. (a man speaking)"
    reading: "mi haravlo ahe."
    alt_target: ["मी हरवले आहे."]
    pos: "phrase"
    notes: "A woman says हरवले. Or ask the way: मला रस्ता सापडत नाही (mala rasta sapdat nahi), I can't find the way."
  - id: mr-0600
    target: "माझे पाकीट हरवले."
    native: "I've lost my wallet."
    reading: "majhe pakit haravle."
    pos: "phrase"
    notes: "'My wallet got lost': the thing lost is the subject. माझा फोन हरवला, I've lost my phone."
  - id: mr-0601
    target: "दुखते"
    native: "it hurts; it aches"
    reading: "dukhte"
    alt_target: ["दुखतो"]
    pos: "verb"
    notes: "Agrees with what hurts: माझे डोके दुखते (majhe doke dukhte), I have a headache; माझा पाय दुखतो (majha pay dukhto), my leg hurts."
  - id: mr-0602
    target: "ताप"
    native: "fever"
    reading: "tap"
    pos: "noun"
    gender: "m"
    notes: "मला ताप आला आहे (mala tap ala ahe), I've got a fever: 'fever has come to me'."
  - id: mr-0603
    target: "मला बरे वाटत नाही."
    native: "I don't feel well."
    reading: "mala bare vatat nahi."
    pos: "phrase"
  - id: mr-0604
    target: "सांभाळून!"
    native: "Careful!"
    reading: "sambhalun!"
    pos: "phrase"
    notes: "Also a goodbye: सांभाळून जा (sambhalun ja), go carefully."
  - id: mr-0605
    target: "आग"
    native: "fire"
    reading: "ag"
    pos: "noun"
    gender: "f"
  - id: mr-0606
    target: "अपघात"
    native: "accident"
    reading: "apghat"
    pos: "noun"
    gender: "m"
