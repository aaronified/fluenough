  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The stem with -आयचा, agreeing with the doer like the past, even when there is an object: मी लहानपणी पुण्यात राहायचो, I used to live in Pune as a child; ती रोज स्वयंपाक करायची, she used to cook every day. Books use -त असे instead: मी जात असे, I used to go."
