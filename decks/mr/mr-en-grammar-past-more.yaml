schema: 1
id: mr-en-grammar-past-more
name: "Used to"
kind: grammar
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I used to go, she used to come: the past of a habit, by person and gender. Not yet checked by a Marathi speaker: please report any mistake."
tags: [unreviewed, grammar]
pattern:
  name: "Past habit"
  slot_name: "person and gender"
  slots: ["मी (m)", "मी (f)", "आम्ही", "तू (m)", "तू (f)", "तुम्ही", "तो", "ती", "ते (it)", "ते (they)", "त्या (they, f)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The stem with -आयचा (-āycā), agreeing with the doer like the past, even when there is an object: मी लहानपणी पुण्यात राहायचो (mi lahānpṇi puṇyāt rāhāyco), I used to live in Pune as a child; ती रोज स्वयंपाक करायची (ti roj svayampāk karāyci), she used to cook every day. Books use -त असे (-ta ase) instead: मी जात असे (mi jāt ase), I used to go."
