  "sentences":
  - "text": "सूचना: उद्या सकाळी दहा वाजता बैठक आहे."
    "reading": "sucnā: udyā sakāḷi dahā vājtā baiṭhak āhe."
    "ipa": "sutsna ud̪ja səkaɭi d̪əɦa ʋadzt̪a bəiʈʰək aɦe"
  - "text": "बैठक खोली क्रमांक तीनमध्ये होईल."
    "reading": "baiṭhak kholi kramāṅk tinmadhye hoil."
    "ipa": "bəiʈʰək kʰoli krəmaŋk t̪inməd̪ʱje ɦoil"
  - "text": "सर्वांनी वेळेवर या."
    "reading": "sarvānni veḷevar yā."
    "ipa": "sərʋanni ʋeɭeʋər ja"
  - "text": "कृपया आपला अहवाल सोबत आणा."
    "reading": "krupyā āplā ahvāl sobat āṇā."
    "ipa": "krupja apla əɦʋal sobət̪ aɳa"
  - "text": "काही प्रश्न असल्यास सुरेश यांना विचारा."
    "reading": "kāhi praśna asalyās sureś yānnā vicārā."
    "ipa": "kaɦi prəʃnə əsəljas sureʃ janna ʋitsara"
