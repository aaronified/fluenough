- "id": "mr-newspaper-feature"
  "title": "A teacher's day"
  "sentences":
  - "text": "आज आपण एका शिक्षिकेला भेटतो."
    "reading": "āj āpaṇ ekā śikṣikelā bheṭto."
    "ipa": "adz apəɳ eka ʃikʂikela bʱeʈt̪o"
  - "text": "ती दररोज सकाळी सहा वाजता उठते."
    "reading": "ti darroj sakāḷi sahā vājtā uṭhte."
    "ipa": "t̪i d̪ərrodz səkaɭi səɦa ʋadzt̪a uʈʰt̪e"
  - "text": "ती शाळेत मुलांना मराठी शिकवते."
    "reading": "ti śāḷet mulānnā marāṭhi śikvte."
    "ipa": "t̪i ʃaɭet̪ mulanna məraʈʰi ʃikʋt̪e"
  - "text": "ती म्हणते, की वाचन खूप महत्त्वाचे आहे."
    "reading": "ti mhaṇte, ki vācan khup mahattvāce āhe."
    "ipa": "t̪i mɦəɳt̪e ki ʋatsən kʰup məɦət̪t̪ʋatʃe aɦe"
  - "text": "ती संध्याकाळी गाणी ऐकते."
    "reading": "ti sandhyākāḷi gāṇi aikte."
    "ipa": "t̪i sənd̪ʱjakaɭi ɡaɳi əikt̪e"
