  - id: "mr-1229"
    target: "निसर्ग"
    reading: "nisarg"
    ipa: "nisərɡ"
    pos: "noun"
    gender: "m"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "निसर्ग", reading: "nisarg" }] }
    examples:
      - { target: "निसर्ग सुंदर आहे.", reading: "nisarg sundar āhe.", ipa: "nisərɡ sund̪ər aɦe", bases: [{ word: "आहे", base: "असणे", reading: "asṇe" }] }
