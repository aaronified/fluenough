schema: 1
id: mr-en-script-consonants
name: "Marathi consonants"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Every consonant, each carrying its vowel a: the plain and breathy ones, on the teeth and curled back, the two sounds of च and ज, and ळ, the curled-back l that Hindi lacks. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: mr-0014
    target: "क"
    native: "k (ka)"
    reading: "ka"
    ipa: "kə"
    notes: "Like the 'k' of 'skin', with no puff of breath. Every consonant carries the short a (अ) unless a sign changes it. कमळ (kamaḷ, lotus)."
  - id: mr-0015
    target: "ख"
    native: "kh, with a breath (kha)"
    reading: "kha"
    ipa: "kʰə"
    notes: "क with a puff of breath after it. It changes the word: खिडकी (khiḍki, window)."
  - id: mr-0016
    target: "ग"
    native: "g (ga)"
    reading: "ga"
    ipa: "ɡə"
    notes: "Like the 'g' of 'go': गाय (gāy, cow)."
  - id: mr-0017
    target: "घ"
    native: "gh, with a breath (gha)"
    reading: "gha"
    ipa: "ɡʱə"
    notes: "ग with a breath after it: घर (ghar, house)."
  - id: mr-0018
    target: "ङ"
    native: "ng (as in 'sing')"
    reading: "ṅa"
    ipa: "ŋə"
    modes: [recognition, production]
    notes: "Seen in a few words from Sanskrit, such as वाङ्मय (vāṅmay, literature); Marathi usually writes the dot ं instead. Hardly ever heard on its own, so it is drilled by reading and writing only."
  - id: mr-0019
    target: "च"
    native: "ch or ts (ca)"
    reading: "ca"
    ipa: "tsə"
    notes: "Two sounds. Before i and e, and in words from Sanskrit, the 'ch' of 'church': चिमणी (cimṇi, sparrow). Before a, o and u in most Marathi words it is 'ts', as in 'cats': चहा (cahā, tea) is said tsahaa. The readings write ch for both."
  - id: mr-0020
    target: "छ"
    native: "chh, with a breath (cha)"
    reading: "cha"
    ipa: "tʃʰə"
    notes: "च with a breath after it: छत्री (chatri, umbrella)."
  - id: mr-0021
    target: "ज"
    native: "j or dz (ja)"
    reading: "ja"
    ipa: "dzə"
    notes: "Two sounds, like च. Before i and e, the 'j' of 'judge': जेवण (jevaṇ, meal). Before a, o and u in most Marathi words it is 'dz', as in 'adze': जग (jag, world) is said dzag."
  - id: mr-0022
    target: "झ"
    native: "jh or dzh, with a breath (jha)"
    reading: "jha"
    ipa: "dzʱə"
    notes: "ज with a breath after it, and like ज it is 'dz' before a, o and u in Marathi words: झाड (jhāḍ, tree)."
  - id: mr-0023
    target: "ञ"
    native: "ny (in conjuncts)"
    reading: "ña"
    ipa: "ɲə"
    modes: [recognition, production]
    notes: "Seen almost only inside conjuncts from Sanskrit, above all ज्ञ. Hardly ever heard on its own, so it is drilled by reading and writing only."
  - id: mr-0024
    target: "ट"
    native: "t, curled back (ṭa)"
    reading: "ṭa"
    ipa: "ʈə"
    notes: "The tongue tip curls back to touch the roof of the mouth: retroflex. English 't' is close to this. Compare त: टोपी (ṭopi, cap)."
  - id: mr-0025
    target: "ठ"
    native: "th, curled back, with a breath (ṭha)"
    reading: "ṭha"
    ipa: "ʈʰə"
    notes: "ट with a breath after it. Not the 'th' of 'think': ठिकाण (ṭhikāṇ, place)."
  - id: mr-0026
    target: "ड"
    native: "d, curled back (ḍa)"
    reading: "ḍa"
    ipa: "ɖə"
    notes: "The tongue tip curls back, as for ट. English 'd' is close to this. Compare द: डोळा (ḍoḷā, eye)."
  - id: mr-0027
    target: "ढ"
    native: "dh, curled back, with a breath (ḍha)"
    reading: "ḍha"
    ipa: "ɖʱə"
    notes: "ड with a breath after it: ढग (ḍhag, cloud)."
  - id: mr-0028
    target: "ण"
    native: "n, curled back (ṇa)"
    reading: "ṇa"
    ipa: "ɳə"
    notes: "The tongue tip curls back, as for ट. Unlike Hindi, Marathi says it clearly and uses it all the time, inside and at the end of words, though never at the start: पाणी (pāṇi, water), आपण (āpaṇ, we)."
  - id: mr-0029
    target: "त"
    native: "t, on the teeth (ta)"
    reading: "ta"
    ipa: "t̪ə"
    notes: "The tongue touches the back of the upper teeth: dental. English has no such t; it sounds softer. Compare ट: ताट (tāṭ, plate)."
  - id: mr-0030
    target: "थ"
    native: "th, on the teeth, with a breath (tha)"
    reading: "tha"
    ipa: "t̪ʰə"
    notes: "त with a breath after it. Not the 'th' of 'think': थंड (thaṇḍ, cold)."
  - id: mr-0031
    target: "द"
    native: "d, on the teeth (da)"
    reading: "da"
    ipa: "d̪ə"
    notes: "The tongue touches the back of the upper teeth, as for त. Compare ड: दार (dār, door)."
  - id: mr-0032
    target: "ध"
    native: "dh, on the teeth, with a breath (dha)"
    reading: "dha"
    ipa: "d̪ʱə"
    notes: "द with a breath after it. Not the 'th' of 'this': धन्यवाद (dhanyavād, thank you)."
  - id: mr-0033
    target: "न"
    native: "n (na)"
    reading: "na"
    ipa: "nə"
    notes: "The 'n' of 'no', with the tongue on the teeth: नाव (nāv, name; boat)."
  - id: mr-0034
    target: "प"
    native: "p (pa)"
    reading: "pa"
    ipa: "pə"
    notes: "Like the 'p' of 'spin', with no puff of breath: पाणी (pāṇi, water)."
  - id: mr-0035
    target: "फ"
    native: "ph or f (pha)"
    reading: "pha"
    ipa: "pʰə"
    notes: "प with a breath after it: फूल (phul, flower). Many speakers say it like English 'f', and Marathi writes English f with it, with no dot: फोन (fon, phone)."
  - id: mr-0036
    target: "ब"
    native: "b (ba)"
    reading: "ba"
    ipa: "bə"
    notes: "Like the 'b' of 'boy': बाळ (bāḷ, baby)."
  - id: mr-0037
    target: "भ"
    native: "bh, with a breath (bha)"
    reading: "bha"
    ipa: "bʱə"
    notes: "ब with a breath after it. Not 'v': भात (bhāt, cooked rice)."
  - id: mr-0038
    target: "म"
    native: "m (ma)"
    reading: "ma"
    ipa: "mə"
    notes: "Like the 'm' of 'mother': मासा (māsā, fish)."
  - id: mr-0039
    target: "य"
    native: "y (ya)"
    reading: "ya"
    ipa: "jə"
    notes: "Like the 'y' of 'yes': यश (yaś, success)."
  - id: mr-0040
    target: "र"
    native: "r (ra)"
    reading: "ra"
    ipa: "rə"
    notes: "A single tap of the tongue, like the 'tt' of American 'butter'. Never silent: रस्ता (rastā, road)."
  - id: mr-0041
    target: "ल"
    native: "l, on the teeth (la)"
    reading: "la"
    ipa: "lə"
    notes: "A clear 'l', as at the start of 'leaf', with the tongue near the teeth. Compare ळ: लिंबू (limbu, lemon)."
  - id: mr-0042
    target: "व"
    native: "v or w (va)"
    reading: "va"
    ipa: "ʋə"
    notes: "Between English 'v' and 'w': वाघ (vāgh, tiger)."
  - id: mr-0043
    target: "श"
    native: "sh (śa)"
    reading: "śa"
    ipa: "ʃə"
    notes: "The 'sh' of 'shop': शाळा (śāḷā, school)."
  - id: mr-0044
    target: "ष"
    native: "sh, curled back (ṣa)"
    reading: "ṣa"
    ipa: "ʂə"
    modes: [recognition, production]
    notes: "Curled back in careful speech, in words from Sanskrit: भाषा (bhāṣā, language). It sounds like श in everyday speech, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: mr-0045
    target: "स"
    native: "s (sa)"
    reading: "sa"
    ipa: "sə"
    notes: "The 's' of 'sun', never 'sh': साप (sāp, snake)."
  - id: mr-0046
    target: "ह"
    native: "h (ha)"
    reading: "ha"
    ipa: "ɦə"
    notes: "Like the 'h' of 'hat': हात (hāt, hand)."
  - id: mr-0047
    target: "ळ"
    native: "l, curled back (ḷa)"
    reading: "ḷa"
    ipa: "ɭə"
    notes: "The tongue tip curls back, as for ट, and says an l. Hindi has no such letter; Marathi uses it everywhere, and it changes the word: काळ (kāḷ, time; an age), with the curled-back l, against काल (kāl, yesterday), with the l on the teeth. It never starts a word: शाळा (śāḷā, school)."
