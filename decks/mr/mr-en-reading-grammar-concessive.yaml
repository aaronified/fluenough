  "sentences":
  - "text": "मला दोन नोकऱ्या मिळाल्या आहेत."
    "reading": "malā don nokaryā miḷālyā āhet."
    "ipa": "məla d̪on nokərja miɭalja aɦet̪"
  - "text": "पहिली नोकरी जास्त पगार देते."
    "reading": "pahili nokri jāst pagār dete."
    "ipa": "pəɦili nokri dzast̪ pəɡar d̪et̪e"
  - "text": "पण ती घरापासून खूप दूर आहे."
    "reading": "paṇ ti gharāpāsun khup dur āhe."
    "ipa": "pəɳ t̪i ɡʱərapasun kʰup d̪ur aɦe"
  - "text": "दुसरी नोकरी जवळ आहे, पण पगार कमी आहे."
    "reading": "dusri nokri javaḷ āhe, paṇ pagār kami āhe."
    "ipa": "d̪usri nokri dzəʋəɭ aɦe pəɳ pəɡar kəmi aɦe"
  - "text": "खूप विचार केला तरी मी अजून निर्णय घेतला नाही."
    "reading": "khup vicār kelā tari mi ajun nirṇay ghetlā nāhi."
    "ipa": "kʰup ʋitsar kela t̪əri mi ədzun nirɳəj ɡʱet̪la naɦi"
