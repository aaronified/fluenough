    reading: "a"
    ipa: "ə"
    pos: "letter"
    notes:
      - { id: "n1", kind: "note" }
    "examples": [
      {"target": "अंधाराची भीती वाटते.", "reading": "andhārāci bhiti vāṭte.", "ipa": "ənd̪ʱaratʃi bʱit̪i ʋaʈt̪e", "bases": [{"word": "अंधाराची", "base": "अंधार", "reading": "andhār"}, {"word": "वाटते", "base": "वाटणे", "reading": "vāṭṇe"}]},
      {"target": "अग्निशमन दल आलं.", "reading": "agniśman dal ālam̐.", "ipa": "əɡniʃmən d̪əl alə̃", "bases": [{"word": "दल", "base": "दल", "reading": "dal"}, {"word": "आलं", "ref": "mr-0711"}]}
    ]
  - id: "mr-0002"
    target: "आ"
    reading: "ā"
    ipa: "a"
    pos: "letter"
    notes:
