  "title": "A shop sign"
  "sentences":
  - "text": "या दुकानात सर्व कपडे स्वस्त आहेत."
    "reading": "yā dukānāt sarva kapḍe svast āhet."
    "ipa": "ja d̪ukanat̪ sərʋə kəpɖe sʋəst̪ aɦet̪"
  - "text": "नवीन साड्या आल्या आहेत."
    "reading": "navin sāḍyā ālyā āhet."
    "ipa": "nəʋin saɖja alja aɦet̪"
  - "text": "त्यांच्यावर पंचवीस टक्के सूट आहे."
    "reading": "tyāñcyāvar pañcavis ṭakke suṭ āhe."
    "ipa": "t̪jaɲtʃjaʋər pəɲtsəʋis ʈəkke suʈ aɦe"
  - "text": "दुकान रविवारी बंद असते."
    "reading": "dukān ravivāri band aste."
    "ipa": "d̪ukan rəʋiʋari bənd̪ əst̪e"
  - "text": "खरेदी केल्यावर पावती घ्या."
    "reading": "kharedi kelyāvar pāvti ghyā."
    "ipa": "kʰəred̪i keljaʋər paʋt̪i ɡʱja"
