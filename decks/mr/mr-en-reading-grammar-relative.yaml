passages:
  - id: "mr-shop-reviews"
    title: "Shop reviews"
    sentences:
      - text: "हे दुकान चांगलं आहे."
        reading: "he dukān cāṅgalam̐ āhe."
        ipa: "ɦe d̪ukan tsaŋɡələ̃ aɦe"
      - text: "जो माणूस दुकानात काम करतो तो खूप मदत करतो."
        reading: "jo māṇus dukānāt kām karto to khup madat karto."
        ipa: "dzo maɳus d̪ukanat̪ kam kərt̪o t̪o kʰup məd̪ət̪ kərt̪o"
      - text: "जी मुलगी पैसे घेते ती छान बोलते."
        reading: "ji mulgi paise ghete ti chān bolte."
        ipa: "dʒi mulɡi pəise ɡʱet̪e t̪i tʃʰan bolt̪e"
      - text: "पण दुकान थोडं महाग आहे."
        reading: "paṇ dukān thoḍam̐ mahāg āhe."
        ipa: "pəɳ d̪ukan t̪ʰoɖə̃ məɦaɡ aɦe"
      - text: "मला इथे पुन्हा यायला आवडेल."
        reading: "malā ithe punhā yāylā āvḍel."
        ipa: "məla it̪ʰe punɦa jajla aʋɖel"
