  "sentences":
  - "text": "हाय, तू कुठे आहेस?"
    "reading": "hāy, tu kuṭhe āhes?"
    "ipa": "ɦaj t̪u kuʈʰe aɦes"
  - "text": "मी बाजारात आहे. तू ये."
    "reading": "mi bājārāt āhe. tu ye."
    "ipa": "mi badzarat̪ aɦe t̪u je"
  - "text": "ठीक आहे, मी लगेच येतो."
    "reading": "ṭhik āhe, mi lagec yeto."
    "ipa": "ʈʰik aɦe mi ləɡets jet̪o"
  - "text": "आपण उद्या सिनेमाला जाऊया का?"
    "reading": "āpaṇ udyā sinemālā jāuyā kā?"
    "ipa": "apəɳ ud̪ja sinemala dzauja ka"
  - "text": "हो, चालेल!"
    "reading": "ho, cālel!"
    "ipa": "ɦo tsalel"
