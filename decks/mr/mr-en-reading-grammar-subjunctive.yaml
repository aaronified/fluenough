- "id": "mr-friendly-advice"
  "title": "A friendly note"
  "sentences":
  - "text": "तू जरा विश्रांती घे."
    "reading": "tu jarā viśrānti ghe."
    "ipa": "t̪u dzəra ʋiʃrant̪i ɡʱe"
  - "text": "तुला डॉक्टरांना भेटायला हवं."
    "reading": "tulā ḍôkṭarānnā bheṭāylā havam̐."
    "ipa": "t̪ula ɖɔkʈəranna bʱeʈajla ɦəʋə̃"
  - "text": "मला आशा आहे की तू लवकर बरा होशील."
    "reading": "malā āśā āhe ki tu lavkar barā hośil."
    "ipa": "məla aʃa aɦe ki t̪u ləʋkər bəra ɦoʃil"
  - "text": "रात्री फोन बंद कर."
    "reading": "rātri phon band kar."
    "ipa": "rat̪ri pʰon bənd̪ kər"
  - "text": "काळजी घे."
    "reading": "kāḷji ghe."
    "ipa": "kaɭdʒi ɡʱe"
