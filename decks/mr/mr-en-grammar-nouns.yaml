schema: 1
id: mr-en-grammar-nouns
name: "Nouns: plural and endings"
kind: grammar
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The plural, and the endings for 'in', 'on' and 'to', added to a noun that often changes first. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Noun forms"
  slot_name: "form"
  slots: ["plural", "in: -त (-ta)", "on: -वर (-var)", "to: -ला (-lā)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Before an ending a noun takes its oblique form, and Marathi writes the ending joined to it. A masculine noun in -आ (-ā) changes it to -्या (-yā): रस्ता (rastā), रस्त्यावर (rastyāvar). A feminine noun in -आ (-ā) changes it to -े (e): शाळा (śāḷā), शाळेत (śāḷet). Most nouns ending in a consonant add -ा (ā): घर (ghar), घरात (gharāt). The plural: a masculine -आ (-ā) becomes -े (e) (रस्ते (raste)); a neuter noun ending in a consonant adds -े (e) (घरे (ghare), in speech घरं (gharam̐)); a feminine -ई (-i) becomes -्या (-yā) (खोल्या (kholyā)); a feminine -आ (-ā) stays (शाळा). -ला (-lā) is 'to', and also marks a person as the object."
  entries:
    - lemma: "घर"
      key: ghar
      reading: "ghar"
      ipa: "ɡʱər"
      gloss: "house (n)"
      forms:
        "plural": ["घरे", "घरं"]
        "in: -त (-ta)": "घरात"
        "on: -वर (-var)": "घरावर"
        "to: -ला (-lā)": "घराला"
      readings:
        "plural": ["ghare", "gharam̐"]
        "in: -त (-ta)": "gharāt"
        "on: -वर (-var)": "gharāvar"
        "to: -ला (-lā)": "gharālā"
      ipas:
        "plural": "ɡʱəre"
        "in: -त (-ta)": "ɡʱərat̪"
        "on: -वर (-var)": "ɡʱəraʋər"
        "to: -ला (-lā)": "ɡʱərala"
    - lemma: "शाळा"
      key: shaalaa
      reading: "śāḷā"
      ipa: "ʃaɭa"
      gloss: "school (f)"
      forms:
        "plural": "शाळा"
        "in: -त (-ta)": "शाळेत"
        "on: -वर (-var)": "शाळेवर"
        "to: -ला (-lā)": "शाळेला"
      readings:
        "plural": "śāḷā"
        "in: -त (-ta)": "śāḷet"
        "on: -वर (-var)": "śāḷevar"
        "to: -ला (-lā)": "śāḷelā"
      ipas:
        "plural": "ʃaɭa"
        "in: -त (-ta)": "ʃaɭet̪"
        "on: -वर (-var)": "ʃaɭeʋər"
        "to: -ला (-lā)": "ʃaɭela"
    - lemma: "खोली"
      key: kholii
      reading: "kholi"
      ipa: "kʰoli"
      gloss: "room (f)"
      forms:
        "plural": "खोल्या"
        "in: -त (-ta)": "खोलीत"
        "on: -वर (-var)": "खोलीवर"
        "to: -ला (-lā)": "खोलीला"
