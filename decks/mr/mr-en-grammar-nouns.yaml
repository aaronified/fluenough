        "to: -ला": "batlila"
    - lemma: "पुस्तक"
      key: pustak
      reading: "pustak"
      gloss: "book (n)"
      forms:
        "plural": ["पुस्तके", "पुस्तकं"]
        "in: -त": "पुस्तकात"
        "on: -वर": "पुस्तकावर"
        "to: -ला": "पुस्तकाला"
      readings:
