schema: 1
id: mr-en-grammar-nouns
name: "Nouns: plural and endings"
kind: grammar
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The plural, and the endings for 'in', 'on' and 'to', added to a noun that often changes first. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Noun forms"
  slot_name: "form"
  slots: ["plural", "in: -त", "on: -वर", "to: -ला"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Before an ending a noun takes its oblique form, and Marathi writes the ending joined to it. A masculine noun in -आ changes it to -्या: रस्ता, रस्त्यावर. A feminine noun in -आ changes it to -े: शाळा, शाळेत. Most nouns ending in a consonant add -ा: घर, घरात. The plural: a masculine -आ becomes -े (रस्ते); a neuter noun ending in a consonant adds -े (घरे, in speech घरं); a feminine -ई becomes -्या (खोल्या); a feminine -आ stays (शाळा). -ला is 'to', and also marks a person as the object."
  entries:
    - lemma: "घर"
      key: ghar
      gloss: "house (n)"
      forms:
        "plural": ["घरे", "घरं"]
        "in: -त": "घरात"
        "on: -वर": "घरावर"
        "to: -ला": "घराला"
    - lemma: "शाळा"
      key: shaalaa
      gloss: "school (f)"
      forms:
        "plural": "शाळा"
        "in: -त": "शाळेत"
        "on: -वर": "शाळेवर"
        "to: -ला": "शाळेला"
    - lemma: "खोली"
      key: kholii
      gloss: "room (f)"
      forms:
        "plural": "खोल्या"
        "in: -त": "खोलीत"
        "on: -वर": "खोलीवर"
        "to: -ला": "खोलीला"
    - lemma: "रस्ता"
      key: rastaa
      gloss: "road (m)"
      forms:
        "plural": "रस्ते"
        "in: -त": "रस्त्यात"
        "on: -वर": "रस्त्यावर"
        "to: -ला": "रस्त्याला"
    - lemma: "खिसा"
      key: khisaa
      gloss: "pocket (m)"
      forms:
        "plural": "खिसे"
        "in: -त": "खिशात"
        "on: -वर": "खिशावर"
        "to: -ला": "खिशाला"
    - lemma: "बाटली"
      key: baatlii
      gloss: "bottle (f)"
      forms:
        "plural": "बाटल्या"
        "in: -त": "बाटलीत"
        "on: -वर": "बाटलीवर"
        "to: -ला": "बाटलीला"
    - lemma: "पुस्तक"
      key: pustak
      gloss: "book (n)"
      forms:
        "plural": ["पुस्तके", "पुस्तकं"]
        "in: -त": "पुस्तकात"
        "on: -वर": "पुस्तकावर"
        "to: -ला": "पुस्तकाला"
    - lemma: "झाड"
      key: jhaad
      gloss: "tree (n)"
      forms:
        "plural": ["झाडे", "झाडं"]
        "in: -त": "झाडात"
        "on: -वर": "झाडावर"
        "to: -ला": "झाडाला"
    - lemma: "गाडी"
      key: gaadii
      gloss: "car; vehicle (f)"
      forms:
        "plural": "गाड्या"
        "in: -त": "गाडीत"
        "on: -वर": "गाडीवर"
        "to: -ला": "गाडीला"
    - lemma: "डबा"
      key: dabaa
      gloss: "box; tiffin; train carriage (m)"
      forms:
        "plural": "डबे"
        "in: -त": "डब्यात"
        "on: -वर": "डब्यावर"
        "to: -ला": "डब्याला"
