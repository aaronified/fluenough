schema: 1
id: mr-en-grammar-nouns
name: "Nouns: plural and endings"
kind: grammar
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The plural, and the endings for 'in', 'on' and 'to', added to a noun that often changes first. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
pattern:
  name: "Noun forms"
  slot_name: "form"
  slots: ["plural", "in: -त", "on: -वर", "to: -ला"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Before an ending a noun takes its oblique form, and Marathi writes the ending joined to it. A masculine noun in -आ changes it to -्या: रस्ता, रस्त्यावर. A feminine noun in -आ changes it to -े: शाळा, शाळेत. Most nouns ending in a consonant add -ा: घर, घरात. The plural: a masculine -आ becomes -े (रस्ते); a neuter noun ending in a consonant adds -े (घरे, in speech घरं); a feminine -ई becomes -्या (खोल्या); a feminine -आ stays (शाळा). -ला is 'to', and also marks a person as the object."
  entries:
    - lemma: "घर"
      key: ghar
      reading: "ghar"
      gloss: "house (n)"
      forms:
        "plural": ["घरे", "घरं"]
        "in: -त": "घरात"
        "on: -वर": "घरावर"
        "to: -ला": "घराला"
      readings:
        "plural": ["ghare", "ghara"]
        "in: -त": "gharat"
        "on: -वर": "gharavar"
        "to: -ला": "gharala"
    - lemma: "शाळा"
      key: shaalaa
      reading: "shala"
      gloss: "school (f)"
      forms:
        "plural": "शाळा"
        "in: -त": "शाळेत"
        "on: -वर": "शाळेवर"
        "to: -ला": "शाळेला"
      readings:
        "plural": "shala"
        "in: -त": "shalet"
        "on: -वर": "shalevar"
        "to: -ला": "shalela"
    - lemma: "खोली"
      key: kholii
      reading: "kholi"
      gloss: "room (f)"
      forms:
        "plural": "खोल्या"
        "in: -त": "खोलीत"
        "on: -वर": "खोलीवर"
        "to: -ला": "खोलीला"
      readings:
        "plural": "kholya"
        "in: -त": "kholit"
        "on: -वर": "kholivar"
        "to: -ला": "kholila"
    - lemma: "रस्ता"
      key: rastaa
      reading: "rasta"
      gloss: "road (m)"
      forms:
        "plural": "रस्ते"
        "in: -त": "रस्त्यात"
        "on: -वर": "रस्त्यावर"
        "to: -ला": "रस्त्याला"
      readings:
        "plural": "raste"
        "in: -त": "rastyat"
        "on: -वर": "rastyavar"
        "to: -ला": "rastyala"
    - lemma: "खिसा"
      key: khisaa
      reading: "khisa"
      gloss: "pocket (m)"
      forms:
        "plural": "खिसे"
        "in: -त": "खिशात"
        "on: -वर": "खिशावर"
        "to: -ला": "खिशाला"
      readings:
        "plural": "khise"
        "in: -त": "khishat"
        "on: -वर": "khishavar"
        "to: -ला": "khishala"
    - lemma: "बाटली"
      key: baatlii
      reading: "batli"
      gloss: "bottle (f)"
      forms:
        "plural": "बाटल्या"
        "in: -त": "बाटलीत"
        "on: -वर": "बाटलीवर"
        "to: -ला": "बाटलीला"
      readings:
