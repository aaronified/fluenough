        "आम्ही": "जाणार नाही"
        "तू": "जाणार नाहीस"
        "तुम्ही": "जाणार नाही"
        "तो / ती / ते": "जाणार नाही"
        "ते / त्या (they)": "जाणार नाहीत"
      readings:
        "मी": "janar nahi"
        "आम्ही": "janar nahi"
        "तू": "janar nahis"
        "तुम्ही": "janar nahi"
        "तो / ती / ते": "janar nahi"
        "ते / त्या (they)": "janar nahit"
    - lemma: "येणे, won't"
      key: yenaar-naahii
