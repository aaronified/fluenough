        "आम्ही": "khat nahi"
        "तू": "khat nahis"
        "तुम्ही": "khat nahi"
        "तो / ती / ते": "khat nahi"
        "ते / त्या (they)": "khat nahit"
    - lemma: "जाणे, won't"
      key: jaanaar-naahii
      reading: "jane, won't"
      gloss: "not to go, later"
      forms:
