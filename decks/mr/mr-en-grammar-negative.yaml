schema: 1
id: mr-en-grammar-negative
name: "Don't and won't"
kind: grammar
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I don't go, she won't come: नाही after the verb, taking the person's ending. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Negative"
  slot_name: "person"
  slots: ["मी", "आम्ही", "तू", "तुम्ही", "तो / ती / ते", "ते / त्या (they)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "'Don't' is the stem with -त, then नाही: मी जात नाही, I don't go. 'Won't' is the -णार form, then नाही: मी जाणार नाही, I won't go. Neither shows gender. नाही takes -स for तू and -त for they: तू जात नाहीस, ते जात नाहीत. A request uses नको and नका instead: जाऊ नका, please don't go. The past negative is the past with नाही: मी गेलो नाही, I didn't go."
  entries:
    - lemma: "जाणे, don't"
      key: jaat-naahii
      reading: "jāṇe, don't"
      ipa: "dzaɳe"
      gloss: "not to go, as a habit"
      forms:
        "मी": "जात नाही"
        "आम्ही": "जात नाही"
        "तू": "जात नाहीस"
        "तुम्ही": "जात नाही"
        "तो / ती / ते": "जात नाही"
        "ते / त्या (they)": "जात नाहीत"
      readings:
        "मी": "jāt nāhi"
        "आम्ही": "jāt nāhi"
        "तू": "jāt nāhis"
        "तुम्ही": "jāt nāhi"
        "तो / ती / ते": "jāt nāhi"
        "ते / त्या (they)": "jāt nāhit"
      ipas:
        "मी": "dzat̪ naɦi"
        "आम्ही": "dzat̪ naɦi"
        "तू": "dzat̪ naɦis"
        "तुम्ही": "dzat̪ naɦi"
        "तो / ती / ते": "dzat̪ naɦi"
        "ते / त्या (they)": "dzat̪ naɦit̪"
