schema: 1
id: mr-en-sound-differences
name: "Sounds to tell apart"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Pairs of everyday words that differ in one sound: a or aa, a breath after a consonant, the tongue on the teeth or curled back, the two l's, and a single or double consonant. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - ref: mr-0055
    tags: ["vowel-length"]
    notes: "a against aa: दार (dār, door) has the long a where दर (dar, rate) has the short a, said like the u of 'but'."
  - id: mr-0111
    target: "दार"
    native: "door"
    reading: "dār"
    ipa: "d̪ar"
    pos: "noun"
    gender: "n"
    tags: ["vowel-length", "aspiration"]
    notes: "a against aa: दार (dār, door, with the long a) against दर (dar, rate, with the short a). And a breath: धार (dhār, edge) is दार (dār) with a breath after the d."
  - ref: mr-0049
    tags: ["vowel-length"]
    notes: "a against aa: जाग (jāg, waking) has the long a where जग (jag, world) has the short a."
  - id: mr-0112
    target: "जाग"
    native: "waking; wakefulness"
    reading: "jāg"
    ipa: "dzaɡ"
    pos: "noun"
    gender: "f"
    tags: ["vowel-length"]
    notes: "a against aa: जाग (jāg, with the long a) against जग (jag, world, with the short a). मला जाग आली (malā jāg āli), I woke up."
  - id: mr-0113
    target: "धार"
    native: "sharp edge; a stream (of water)"
    reading: "dhār"
    ipa: "d̪ʱar"
    pos: "noun"
    gender: "f"
    tags: ["aspiration"]
    notes: "A breath after the consonant: धार (dhār, edge) is दार (dār, door) with a breath after the d."
  - id: mr-0114
    target: "बाग"
    native: "garden"
    reading: "bāg"
    ipa: "baɡ"
    pos: "noun"
    gender: "f"
    tags: ["aspiration"]
    notes: "A breath after the consonant: भाग (bhāg, part) is बाग (bāg, garden) with a breath after the b."
  - id: mr-0115
    target: "भाग"
    native: "part; share"
    reading: "bhāg"
    ipa: "bʱaɡ"
    pos: "noun"
    gender: "m"
    tags: ["aspiration"]
    notes: "A breath after the consonant: भाग (bhāg, part) is बाग (bāg, garden) with a breath after the b."
  - id: mr-0116
    target: "पळ"
    native: "run! (to a friend)"
    reading: "paḷ"
    ipa: "pəɭ"
