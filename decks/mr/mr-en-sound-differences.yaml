schema: 1
id: mr-en-sound-differences
name: "Sounds to tell apart"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Pairs of everyday words that differ in one sound: a or aa, a breath after a consonant, the tongue on the teeth or curled back, the two l's, and a single or double consonant. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - ref: mr-0055
    tags: ["vowel-length"]
    notes: "a against aa: दार (daar, door) has the long aa where दर (dar, rate) has the short a, said like the u of 'but'."
  - id: mr-0111
    target: "दार"
    native: "door"
    reading: "daar"
    pos: "noun"
    gender: "n"
    tags: ["vowel-length", "aspiration"]
    notes: "a against aa: दार (daar, door) against दर (dar, rate). And a breath: धार (dhaar, edge) is दार with a breath after the d."
  - ref: mr-0049
    tags: ["vowel-length"]
    notes: "a against aa: जाग (jaag, waking) has the long aa where जग (jag, world) has the short a."
  - id: mr-0112
    target: "जाग"
    native: "waking; wakefulness"
    reading: "jaag"
    pos: "noun"
    gender: "f"
    tags: ["vowel-length"]
    notes: "a against aa: जाग (jaag) against जग (jag, world). मला जाग आली (malaa jaag aalii), I woke up."
  - id: mr-0113
    target: "धार"
    native: "sharp edge; a stream (of water)"
    reading: "dhaar"
    pos: "noun"
    gender: "f"
    tags: ["aspiration"]
    notes: "A breath after the consonant: धार (dhaar, edge) is दार (daar, door) with a breath after the d."
  - id: mr-0114
    target: "बाग"
    native: "garden"
    reading: "baag"
    pos: "noun"
    gender: "f"
    tags: ["aspiration"]
    notes: "A breath after the consonant: भाग (bhaag, part) is बाग (baag, garden) with a breath after the b."
  - id: mr-0115
    target: "भाग"
    native: "part; share"
    reading: "bhaag"
    pos: "noun"
    gender: "m"
    tags: ["aspiration"]
    notes: "A breath after the consonant: भाग (bhaag, part) is बाग (baag, garden) with a breath after the b."
  - id: mr-0116
    target: "पळ"
    native: "run! (to a friend)"
    reading: "pal"
    pos: "verb"
    tags: ["aspiration"]
    notes: "A breath after the consonant: फळ (phal, fruit) is पळ (pal, run!) with a breath after the p."
  - ref: mr-0056
    tags: ["aspiration"]
    notes: "A breath after the consonant: फळ (phal, fruit) is पळ (pal, run!) with a breath after the p."
  - id: mr-0117
    target: "वात"
    native: "wick (of a lamp)"
    reading: "vaat"
    pos: "noun"
    gender: "f"
    tags: ["dental-retroflex"]
    notes: "Dental against curled back: वात (vaat, wick) has the tongue on the teeth; वाट (vaat, way) has it curled back."
  - id: mr-0118
    target: "वाट"
    native: "way; path; waiting"
    reading: "vaat"
    pos: "noun"
    gender: "f"
    tags: ["dental-retroflex"]
    notes: "Dental against curled back: वाट (vaat, way) has the tongue curled back; वात (vaat, wick) has it on the teeth. वाट पाहणे (vaat paahne), to wait."
  - id: mr-0119
    target: "काल"
    native: "yesterday"
    reading: "kaal"
    pos: "adv"
    tags: ["lateral"]
    notes: "The two l's: काल (kaal, yesterday) has the l on the teeth; काळ (kaal, time, an age) has it curled back. Unlike Hindi कल, काल is never 'tomorrow'."
  - id: mr-0120
    target: "काळ"
    native: "time; an age; an era"
    reading: "kaal"
    pos: "noun"
    gender: "m"
    tags: ["lateral"]
    notes: "The two l's: काळ (kaal, time) has the l curled back; काल (kaal, yesterday) has it on the teeth."
  - id: mr-0121
    target: "वेल"
    native: "vine; creeper"
    reading: "vel"
    pos: "noun"
    gender: "f"
    tags: ["lateral"]
    notes: "The two l's: वेल (vel, vine) has the l on the teeth; वेळ (vel, time) has it curled back."
  - id: mr-0122
    target: "वेळ"
    native: "time; an occasion"
    reading: "vel"
    pos: "noun"
    gender: "f"
    tags: ["lateral"]
    notes: "The two l's: वेळ (vel, time) has the l curled back; वेल (vel, vine) has it on the teeth. वेळ नाही (vel naahii), there's no time."
  - id: mr-0123
    target: "शिका"
    native: "learn! (polite)"
    reading: "shikaa"
    pos: "verb"
    tags: ["gemination"]
    notes: "Single against double: शिक्का (shikkaa, stamp) holds the k longer than शिका (shikaa, learn!)."
  - id: mr-0124
    target: "शिक्का"
    native: "stamp; seal"
    reading: "shikkaa"
    pos: "noun"
    gender: "m"
