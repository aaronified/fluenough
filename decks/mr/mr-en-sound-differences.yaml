    native: "yesterday"
    reading: "kāl"
    ipa: "kal"
    pos: "adv"
    tags: ["lateral"]
    notes: "The two l's: काल (kāl, yesterday) has the l on the teeth; काळ (kāḷ, time, an age) has it curled back. Unlike Hindi कल (kal), काल (kāl) is never 'tomorrow'."
