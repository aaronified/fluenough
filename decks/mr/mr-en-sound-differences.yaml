    notes: "A breath after the consonant: फळ (phaḷ, fruit) is पळ (paḷ, run!) with a breath after the p."
  - ref: mr-0056
    tags: ["aspiration"]
    notes: "A breath after the consonant: फळ (phaḷ, fruit) is पळ (paḷ, run!) with a breath after the p."
  - id: mr-0117
    target: "वात"
    native: "wick (of a lamp)"
    reading: "vāt"
    ipa: "ʋat̪"
    pos: "noun"
    gender: "f"
    tags: ["dental-retroflex"]
    notes: "Dental against curled back: वात (vāt, wick) has the tongue on the teeth for t; वाट (vāṭ, way) has it curled back."
  - id: mr-0118
    target: "वाट"
    native: "way; path; waiting"
    reading: "vāṭ"
    ipa: "ʋaʈ"
