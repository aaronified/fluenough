    gender: "f"
    tags: ["dental-retroflex"]
    notes: "Dental against curled back: वाट (vāṭ, way) has the tongue curled back for t; वात (vāt, wick) has it on the teeth. वाट पाहणे (vāṭ pāhṇe), to wait."
  - id: mr-0119
