schema: 1
id: mr-en-work
name: "Work"
kind: vocab
theme: work
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Jobs, the workplace, and how to ask and say what someone does. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: mr-0234
    target: "काम"
    native: "work; a job; a task"
    reading: "kaam"
    pos: "noun"
    gender: "n"
    notes: "मी कामावर जातो (mii kaamaavar jaato), I'm going to work: 'onto work'."
  - id: mr-0235
    target: "नोकरी"
    native: "job; employment"
    reading: "nokrii"
    pos: "noun"
    gender: "f"
    notes: "A salaried job: मी नोकरी करतो (mii nokrii karto), I have a job."
  - id: mr-0236
    target: "ऑफिस"
    native: "office"
    reading: "ofis"
    pos: "noun"
    gender: "n"
    notes: "Formally कार्यालय (kaaryaalay), as on signs."
  - id: mr-0237
    target: "शिक्षक"
    native: "teacher (a man)"
    reading: "shikshak"
    pos: "noun"
    gender: "m"
    notes: "A woman teacher is a शिक्षिका (shikshikaa). Pupils call a teacher सर or मॅडम, or ताई and दादा in a village school."
  - id: mr-0238
    target: "डॉक्टर"
    native: "doctor"
    reading: "doktar"
    pos: "noun"
    gender: "m"
    notes: "For a woman too: डॉक्टर आल्या (doktar aalyaa), the doctor (she) has come, in the respectful plural."
  - id: mr-0239
    target: "शेतकरी"
    native: "farmer"
    reading: "shetkarii"
    pos: "noun"
    gender: "m"
    notes: "From शेत (shet), a field."
  - id: mr-0240
    target: "दुकानदार"
    native: "shopkeeper"
    reading: "dukaandaar"
    pos: "noun"
    gender: "m"
  - id: mr-0241
    target: "ड्रायव्हर"
    native: "driver"
    reading: "draayvhar"
    pos: "noun"
    gender: "m"
    notes: "Marathi writes English v as व्ह: ड्रायव्हर. It is said with a plain v."
  - id: mr-0242
    target: "इंजिनिअर"
    native: "engineer"
    reading: "injiniar"
    alt_target: ["इंजिनीअर", "इंजिनियर"]
    pos: "noun"
    gender: "m"
  - id: mr-0243
    target: "पगार"
    native: "salary; wages"
    reading: "pagaar"
    pos: "noun"
    gender: "m"
    notes: "From Portuguese pagar, to pay."
  - id: mr-0244
    target: "सुट्टी"
    native: "holiday; a day off"
    reading: "suttii"
    pos: "noun"
    gender: "f"
    notes: "आज सुट्टी आहे (aaj suttii aahe), it's a holiday today."
  - id: mr-0245
    target: "मीटिंग"
    native: "meeting"
    reading: "miiting"
    pos: "noun"
    gender: "f"
    notes: "Formally बैठक (baithak)."
  - id: mr-0246
    target: "तुम्ही काय काम करता?"
    native: "What do you do?"
    reading: "tumhii kaay kaam kartaa?"
    pos: "phrase"
    notes: "'What work do you do?'"
  - id: mr-0247
    target: "मी शिक्षक आहे."
    native: "I'm a teacher. (a man speaking)"
    reading: "mii shikshak aahe."
    alt_target: ["मी शिक्षिका आहे."]
    pos: "phrase"
    notes: "No 'a': 'I teacher am'."
  - id: mr-0248
    target: "विद्यार्थी"
    native: "student (a man)"
    reading: "vidyaarthii"
    pos: "noun"
    gender: "m"
    notes: "A woman student: विद्यार्थिनी (vidyaarthinii)."
  - id: mr-0249
    target: "कंपनी"
    native: "company; firm"
    reading: "kampanii"
    pos: "noun"
    gender: "f"
  - id: mr-0250
    target: "व्यवसाय"
    native: "business; profession"
    reading: "vyavasaay"
    pos: "noun"
    gender: "m"
    notes: "माझा स्वतःचा व्यवसाय आहे (maajhaa svatahchaa vyavasaay aahe), I have my own business."
  - id: mr-0251
    target: "मालक"
    native: "owner; boss"
    reading: "maalak"
    pos: "noun"
    gender: "m"
