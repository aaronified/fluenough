schema: 1
id: mr-en-grammar-compound-verbs
name: "Verbs that add a shade"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN, icon: "म" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The first verb in -ऊन (-un), 'having done', and a second verb after it that adds a shade: done for good, done for oneself, done for someone, kept for later. Not yet checked by a Marathi speaker: please report any mistake."
tags: [unreviewed, grammar]
cards:
  - id: mr-0549
    target: "खाऊन टाक."
    native: "Eat it up. (to a friend)"
    reading: "khāun ṭāk."
    ipa: "kʰaun ʈak"
    pos: "phrase"
    notes: "टाकणे (ṭākṇe), 'to throw', after a verb in -ऊन (-un): done completely, done with. To someone you call तुम्ही (tumhi): खाऊन टाका (khāun ṭākā)."
  - id: mr-0550
    target: "मी विसरून गेलो."
    native: "I clean forgot. (a man speaking)"
    reading: "mi visrun gelo."
    ipa: "mi ʋisrun ɡelo"
    alt_target: ["मी विसरून गेले."]
    pos: "phrase"
    notes: "जाणे (jāṇe), 'to go', after -ऊन (-un): something that happened to you, all the way. A woman says गेले (gele)."
  - id: mr-0551
    target: "लिहून ठेवा."
    native: "Write it down (for later)."
    reading: "lihun ṭhevā."
    ipa: "liɦun ʈʰeʋa"
    pos: "phrase"
    notes: "ठेवणे (ṭhevṇe), 'to keep, to put': done and kept for later."
  - id: mr-0552
    target: "समजून घ्या."
    native: "Please try to understand."
    reading: "samjun ghyā."
    ipa: "səmdzun ɡʱja"
    pos: "phrase"
    notes: "घेणे (gheṇe), 'to take': done for oneself, taken in."
  - id: mr-0553
    target: "मला करून द्या."
    native: "Please do it for me."
    reading: "malā karun dyā."
    ipa: "məla kərun d̪ja"
    pos: "phrase"
    notes: "देणे (deṇe), 'to give': done for someone else."
  - id: mr-0554
    target: "घेऊन या."
    native: "Please bring it."
    reading: "gheun yā."
    ipa: "ɡʱeun ja"
    pos: "phrase"
    notes: "'Take and come': Marathi brings things this way. पाणी घेऊन ये (pāṇi gheun ye), bring some water, to a friend."
  - id: mr-0555
    target: "घेऊन जा."
    native: "Take it away; take it with you."
    reading: "gheun jā."
    ipa: "ɡʱeun dza"
    pos: "phrase"
    notes: "'Take and go'."
  - id: mr-0556
    target: "तो झोपी गेला."
    native: "He fell asleep."
    reading: "to jhopi gelā."
    ipa: "t̪o dzʱopi ɡela"
    pos: "phrase"
    notes: "'He went to sleep': जाणे (jāṇe) for a change that comes over you."
  - id: mr-0557
    target: "तो निघून गेला."
    native: "He left; he went away."
    reading: "to nighun gelā."
    ipa: "t̪o niɡʱun ɡela"
    pos: "phrase"
    notes: "निघणे (nighṇe) is 'to set out'. Leaving, people say चला (calā), निघतो (chala, nighto), right, I'm off."
