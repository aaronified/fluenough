schema: 1
id: mr-en-grammar-compound-verbs
name: "Verbs that add a shade"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The first verb in -ऊन, 'having done', and a second verb after it that adds a shade: done for good, done for oneself, done for someone, kept for later. Not yet checked by a Marathi speaker: please report any mistake."
tags: [unreviewed, grammar]
cards:
  - id: mr-0549
    target: "खाऊन टाक."
    native: "Eat it up. (to a friend)"
    reading: "khaauun taak."
    pos: "phrase"
    notes: "टाकणे, 'to throw', after a verb in -ऊन: done completely, done with. To someone you call तुम्ही: खाऊन टाका."
  - id: mr-0550
    target: "मी विसरून गेलो."
    native: "I clean forgot. (a man speaking)"
    reading: "mii visruun gelo."
    alt_target: ["मी विसरून गेले."]
    pos: "phrase"
    notes: "जाणे, 'to go', after -ऊन: something that happened to you, all the way. A woman says गेले."
  - id: mr-0551
    target: "लिहून ठेवा."
    native: "Write it down (for later)."
    reading: "lihuun thevaa."
    pos: "phrase"
    notes: "ठेवणे, 'to keep, to put': done and kept for later."
  - id: mr-0552
    target: "समजून घ्या."
    native: "Please try to understand."
    reading: "samjuun ghyaa."
    pos: "phrase"
    notes: "घेणे, 'to take': done for oneself, taken in."
  - id: mr-0553
    target: "मला करून द्या."
    native: "Please do it for me."
    reading: "malaa karuun dyaa."
    pos: "phrase"
    notes: "देणे, 'to give': done for someone else."
  - id: mr-0554
    target: "घेऊन या."
    native: "Please bring it."
    reading: "gheuun yaa."
    pos: "phrase"
    notes: "'Take and come': Marathi brings things this way. पाणी घेऊन ये (paanii gheuun ye), bring some water, to a friend."
  - id: mr-0555
    target: "घेऊन जा."
    native: "Take it away; take it with you."
    reading: "gheuun jaa."
    pos: "phrase"
    notes: "'Take and go'."
  - id: mr-0556
    target: "तो झोपी गेला."
    native: "He fell asleep."
    reading: "to jhopii gelaa."
    pos: "phrase"
    notes: "'He went to sleep': जाणे for a change that comes over you."
  - id: mr-0557
    target: "तो निघून गेला."
    native: "He left; he went away."
    reading: "to nighuun gelaa."
    pos: "phrase"
    notes: "निघणे is 'to set out'. Leaving, people say चला, निघतो (chalaa, nighto), right, I'm off."
