schema: 1
id: mr-en-grammar-gender-number
name: "Gender and number"
kind: vocab
language: { code: mr, iso639_3: mar, name: Marathi, script: devanagari, tts: mr-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Three genders, masculine, feminine and neuter, and the plural of each. Not yet checked by a Marathi speaker: please report any mistake."
tags: [beginner, grammar, unreviewed]
cards:
  - ref: mr-0222
    notes: "Masculine. Most nouns in -आ are masculine, and their describing words and verbs take -आ: मोठा मुलगा आला, the big boy came."
  - ref: mr-0223
    notes: "Feminine. Most nouns in -ई are feminine, and take -ई: मोठी मुलगी आली, the big girl came."
  - ref: mr-0224
    notes: "Neuter. A third gender English and Hindi lack, for a child, a baby (बाळ), and many things: घर, पुस्तक, पाणी. It takes -ए: मोठे मूल आले, the big child came."
  - id: mr-0407
    target: "मुलगे"
    native: "boys; sons"
    reading: "mulge"
    ipa: "mulɡe"
    pos: "noun"
    gender: "m"
    notes: "A masculine -आ becomes -ए in the plural: मुलगा, मुलगे; रस्ता, रस्ते. A masculine noun ending in a consonant does not change: एक देश, दोन देश."
  - id: mr-0408
    target: "मुली"
    native: "girls; daughters"
    reading: "muli"
    ipa: "muli"
    pos: "noun"
    gender: "f"
    notes: "Feminine nouns form plurals several ways: मुलगी, मुली; खोली, खोल्या; बहीण, बहिणी; शाळा stays शाळा."
  - id: mr-0409
    target: "मुले"
    native: "children; boys"
    reading: "mule"
    ipa: "mule"
    alt_target: ["मुलं"]
    pos: "noun"
    gender: "n"
    notes: "The plural of मूल, and a mixed group: in speech मुलं (mulam̐). A neuter noun ending in a consonant adds -ए, said as a nasal a in speech: घरे, घरं, houses."
  - id: mr-0410
    target: "पुस्तके"
    native: "books"
    reading: "pustake"
    ipa: "pust̪əke"
    alt_target: ["पुस्तकं"]
    pos: "noun"
    gender: "n"
    notes: "Neuter plural. A describing word before it takes -ई: नवी पुस्तके, new books."
