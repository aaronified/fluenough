      - { target: "गृहपाठ पूर्ण केला का?", reading: "gruhpāṭh purṇ kelā kā?", ipa: "ɡruɦpaʈʰ purɳ kela ka", bases: [{ word: "केला", ref: "mr-0712" }] }
  - id: "mr-1117"
