cards:
  - id: "mr-1114"
    target: "शिक्षिका"
    reading: "śikṣikā"
    ipa: "ʃikʂika"
    pos: "noun"
    gender: "f"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "शिक्षिका", reading: "śikṣikā" }] }
    examples:
      - { target: "शिक्षिका हुशार आहे.", reading: "śikṣikā huśār āhe.", ipa: "ʃikʂika ɦuʃar aɦe", bases: [{ word: "आहे", base: "असणे", reading: "asṇe" }] }
      - { target: "शिक्षिकेने परीक्षा घेतली.", reading: "śikṣikene parikṣā ghetli.", ipa: "ʃikʂikene pərikʂa ɡʱet̪li", bases: [{ word: "शिक्षिकेने", ref: "mr-1114" }, { word: "घेतली", ref: "mr-0722" }] }
  - id: "mr-1115"
    target: "अभ्यास"
    reading: "abhyās"
    ipa: "əbʱjas"
