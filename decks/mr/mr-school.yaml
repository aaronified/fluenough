    gender: "m"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "अभ्यास", reading: "abhyās" }] }
    examples:
      - { target: "रोज अभ्यास करा.", reading: "roj abhyās karā.", ipa: "rodz əbʱjas kəra", bases: [{ word: "करा", ref: "mr-0712" }] }
      - { target: "परीक्षेसाठी खूप अभ्यास केला.", reading: "parikṣesāṭhi khup abhyās kelā.", ipa: "pərikʂesaʈʰi kʰup əbʱjas kela", bases: [{ word: "परीक्षेसाठी", ref: "mr-1117" }, { word: "केला", ref: "mr-0712" }] }
