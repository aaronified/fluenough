      - { target: "निकाल कधी जाहीर होईल?", reading: "nikāl kadhi jāhir hoil?", ipa: "nikal kəd̪ʱi dzaɦir ɦoil", bases: [{ word: "होईल", base: "होणे", reading: "hoṇe" }] }
