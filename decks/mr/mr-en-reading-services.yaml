  - id: "mr-bank-form"
    title: "Bank form"
    sentences:
      - text: "फॉर्मवर तुमचं नाव लिहा."
        reading: "phôrmavar tumcam̐ nāv lihā."
        ipa: "pʰɔrməʋər t̪umtsə̃ naʋ liɦa"
      - text: "तुमचा पत्ता नीट लिहा."
        reading: "tumcā pattā niṭ lihā."
        ipa: "t̪umtsa pət̪t̪a niʈ liɦa"
      - text: "पिन कोड बरोबर लिहा."
        reading: "pin koḍ barobar lihā."
        ipa: "pin koɖ bərobər liɦa"
      - text: "शेवटी इथे सही करा."
        reading: "śevṭi ithe sahi karā."
        ipa: "ʃeʋʈi it̪ʰe səɦi kəra"
      - text: "फॉर्म बँकेत द्या."
        reading: "phôrma bam̐ket dyā."
        ipa: "pʰɔrmə bə̃ket̪ d̪ja"
