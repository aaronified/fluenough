    "ipa": "piʃʋit̪ ek ʋəɦi aɦe"
  - "text": "पिशवीसाठी ऑफिसमध्ये या."
    "reading": "piśvisāṭhi ôphismadhye yā."
    "ipa": "piʃʋisaʈʰi ɔpʰisməd̪ʱje ja"
