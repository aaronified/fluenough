cards:
  - id: bn-0371
    target: "সাহায্য"
    native: "help"
    reading: "shahajjo"
    pos: "noun"
  - id: bn-0372
    target: "সাহায্য করুন!"
    native: "Please help!"
    reading: "shahajjo korun!"
    pos: "phrase"
    tags: ["polite"]
  - id: bn-0373
    target: "বাঁচাও!"
    native: "Help! (in danger)"
    reading: "banchao!"
    pos: "phrase"
    notes: "What you shout in danger: literally 'save me!'"
  - id: bn-0374
    target: "দাঁড়ান!"
    native: "Stop! Wait, please!"
    reading: "danran!"
    pos: "phrase"
    tags: ["polite"]
  - ref: bn-0375
    native: "police"
    notes: "The emergency number is 112 in India and 999 in Bangladesh."
  - id: bn-0376
    target: "ডাক্তার"
    native: "doctor"
    reading: "daktar"
    pos: "noun"
  - id: bn-0377
