    reading: "hashpatal"
    pos: "noun"
  - id: bn-0378
    target: "ওষুধ"
    native: "medicine"
    reading: "oshudh"
    pos: "noun"
    notes: "A chemist's is ওষুধের দোকান."
  - id: bn-0379
    target: "ব্যথা"
    native: "pain"
    reading: "byatha"
    pos: "noun"
    notes: "মাথা ব্যথা করছে (matha byatha korchhe), I have a headache."
  - id: bn-0380
    target: "আমি হারিয়ে গেছি।"
    native: "I'm lost."
    reading: "ami hariye gechhi."
    pos: "phrase"
