    target: "আমি বুঝতে পারিনি।"
    native: "I didn't understand."
    reading: "ami bujhte parini."
    pos: "phrase"
  - id: bn-0382
    target: "বাথরুম কোথায়?"
    native: "Where is the toilet?"
    reading: "bathrum kothay?"
    pos: "phrase"
    notes: "Signs say শৌচাগার (shouchagar)."
  - id: bn-0726
    target: "আমার শরীর খারাপ।"
    native: "I'm not well."
    reading: "amar shorir kharap."
    pos: "phrase"
    notes: "Literally 'my body is bad'."
