id: bn-en-eating-out
name: "Eating out"
kind: vocab
theme: eating-out
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Ordering, asking for less spice, and paying the bill."
tags: [beginner]
cards:
  - id: bn-0349
    target: "খাবার"
    native: "food"
    reading: "khabar"
    pos: "noun"
  - id: bn-0350
    target: "জল"
    native: "water"
    reading: "jol"
    alt_target: ["পানি"]
    pos: "noun"
    notes: "Also পানি (pani)."
  - id: bn-0351
    target: "চা"
    native: "tea"
    reading: "cha"
    pos: "noun"
  - id: bn-0352
    target: "ভাত"
    native: "cooked rice; a meal"
    reading: "bhat"
    pos: "noun"
    notes: "ভাত খেয়েছো? 'Have you eaten rice?' is how people ask whether you have eaten."
  - id: bn-0353
    target: "রুটি"
    native: "flatbread; roti"
    reading: "ruti"
    pos: "noun"
  - id: bn-0354
    target: "আমাকে … দিন।"
    native: "Please give me …"
    reading: "amake ... din."
    pos: "phrase"
    tags: ["polite"]
    notes: "The thing wanted goes in the gap: আমাকে এক কাপ চা দিন, a cup of tea, please."
  - id: bn-0355
    target: "আরও"
    native: "more"
    reading: "aro"
    alt_target: ["আরো", "আর"]
    pos: "other"
    notes: "আরও একটু (aro ektu), a little more. Also written আরো. আর alone can mean 'more' too: আর একটা, one more."
  - id: bn-0356
    target: "ঝাল"
    native: "spicy (hot)"
    reading: "jhal"
    pos: "adj"
    notes: "কম ঝাল (kom jhal), less spicy."
  - id: bn-0357
    target: "মিষ্টি"
    native: "sweet; a sweet"
    reading: "mishti"
    pos: "adj"
    notes: "Bengal's sweets are famous: রসগোল্লা (roshogolla), সন্দেশ (shondesh), মিষ্টি দই (mishti doi)."
  - id: bn-0358
    target: "নিরামিষ"
    native: "vegetarian"
    reading: "niramish"
    pos: "adj"
    notes: "Non-vegetarian is আমিষ (amish), and fish counts as আমিষ."
  - id: bn-0359
    target: "বিলটা দিন।"
    native: "The bill, please."
    reading: "bilta din."
    pos: "phrase"
    tags: ["polite"]
  - id: bn-0360
    target: "খুব ভালো হয়েছে।"
    native: "It was very good."
    reading: "khub bhalo hoyechhe."
    pos: "phrase"
  - id: bn-0749
    target: "চা খাবেন?"
    native: "Will you have some tea?"
    reading: "cha khaben?"
    pos: "phrase"
    tags: ["polite"]
    notes: "Drinks are eaten in Bengali: চা, জল, শরবত (shorbot), all খাওয়া. জল খাবেন? Will you have some water?"
