description: "Ordering, asking for less spice, and paying the bill."
tags: [beginner]
cards:
  - id: bn-en-eating-out-0001
    target: "খাবার"
    native: "food"
    reading: "khabar"
    pos: "noun"
  - id: bn-en-eating-out-0002
    target: "জল"
    native: "water"
    reading: "jol"
    pos: "noun"
    notes: "In West Bengal water is জল. In Bangladesh, and among many Muslim speakers, it is পানি (pani)."
  - id: bn-en-eating-out-0003
    target: "চা"
    native: "tea"
    reading: "cha"
    pos: "noun"
  - id: bn-en-eating-out-0004
    target: "ভাত"
    native: "cooked rice; a meal"
    reading: "bhat"
    pos: "noun"
    notes: "ভাত খেয়েছ? 'Have you eaten rice?' is how people ask whether you have eaten."
  - id: bn-en-eating-out-0005
    target: "রুটি"
    native: "flatbread; roti"
    reading: "ruti"
    pos: "noun"
  - id: bn-en-eating-out-0006
    target: "আমাকে … দিন।"
    native: "Please give me …"
    reading: "amake … din."
    pos: "phrase"
    tags: ["polite"]
    notes: "The thing wanted goes in the gap: আমাকে এক কাপ চা দিন, a cup of tea, please."
  - id: bn-en-eating-out-0007
    target: "আরও"
    native: "more"
    reading: "aro"
    pos: "other"
    notes: "আরও একটু (aro ektu), a little more."
  - id: bn-en-eating-out-0008
    target: "ঝাল"
    native: "spicy (hot)"
    reading: "jhal"
    pos: "adj"
    notes: "কম ঝাল (kom jhal), less spicy."
  - id: bn-en-eating-out-0009
    target: "মিষ্টি"
    native: "sweet; a sweet"
    reading: "mishti"
    pos: "adj"
    notes: "Bengal's sweets are famous: রসগোল্লা (roshogolla), সন্দেশ (shondesh), মিষ্টি দই (mishti doi)."
  - id: bn-en-eating-out-0010
    target: "নিরামিষ"
    native: "vegetarian"
    reading: "niramish"
    pos: "adj"
    notes: "Non-vegetarian is আমিষ (amish), and fish counts as আমিষ."
  - id: bn-en-eating-out-0011
    target: "বিলটা দিন।"
    native: "The bill, please."
    reading: "bilta din."
    pos: "phrase"
    tags: ["polite"]
  - id: bn-en-eating-out-0012
    target: "খুব ভালো হয়েছে।"
    native: "It was very good."
    reading: "khub bhalo hoyechhe."
    pos: "phrase"
