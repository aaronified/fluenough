  - id: bn-0351
    target: "চা"
    native: "tea"
    picture: "🍵"
    reading: "cā"
    ipa: "tʃa"
    pos: "noun"
  - id: bn-0352
    target: "ভাত"
    native: "cooked rice; a meal"
    picture: "🍚"
    reading: "bhāt"
    ipa: "bʱat̪"
    pos: "noun"
    notes: "ভাত খেয়েছো (bhāt kheyecho)? 'Have you eaten rice?' is how people ask whether you have eaten."
  - id: bn-0353
    target: "রুটি"
    native: "flatbread; roti"
    picture: "🫓"
    reading: "ruṭi"
    ipa: "ruʈi"
    pos: "noun"
  - id: bn-0354
    target: "আমাকে … দিন।"
    native: "Please give me …"
    reading: "āmāke... din."
    ipa: "amake d̪in"
    pos: "phrase"
    tags: ["polite"]
    notes: "The thing wanted goes in the gap: আমাকে এক কাপ চা দিন (āmāke ek kāp cā din), a cup of tea, please."
    bases:
      - { word: "আমাকে", base: "আমি", reading: "āmi", meaning: "I" }
  - id: bn-0355
    target: "আরও"
    native: "more"
    reading: "āro"
    ipa: "aro"
    alt_target: ["আরো", "আর"]
    pos: "other"
    notes: "আরও একটু (āro ekṭu), a little more. Also written আরো (āro). আর (ār) alone can mean 'more' too: আর একটা (ār ekoṭā), one more."
  - id: bn-0356
    target: "ঝাল"
    native: "spicy (hot)"
    reading: "jhāl"
    ipa: "dʒʱal"
    pos: "adj"
    notes: "কম ঝাল (kôm jhāl), less spicy."
  - id: bn-0357
    target: "মিষ্টি"
    native: "sweet; a sweet"
    reading: "miśṭi"
    ipa: "miʃʈi"
    pos: "adj"
    notes: "Bengal's sweets are famous: রসগোল্লা (rôśogollā), সন্দেশ (śôndeś), মিষ্টি দই (miśṭi doi)."
  - id: bn-0358
    target: "নিরামিষ"
    native: "vegetarian"
    reading: "nirāmiś"
    ipa: "niramiʃ"
    pos: "adj"
    notes: "Non-vegetarian is আমিষ (āmiś), and fish counts as আমিষ (āmiś)."
  - id: bn-0359
    target: "বিলটা দিন।"
    native: "The bill, please."
    reading: "bilṭā din."
    ipa: "bilʈa d̪in"
    pos: "phrase"
    tags: ["polite"]
    bases:
      - { word: "বিলটা", base: "বিল", reading: "bil", meaning: "bill" }
  - id: bn-0360
    target: "খুব ভালো হয়েছে।"
    native: "It was very good."
    reading: "khub bhālo hôyeche."
    ipa: "kʰub bʱalo ɦɔjetʃʰe"
    pos: "phrase"
    bases:
      - { word: "হয়েছে", base: "হওয়া", reading: "hoā", meaning: "to be; to become; to happen" }
  - id: bn-0749
    target: "চা খাবেন?"
    native: "Will you have some tea?"
    reading: "cā khāben?"
    ipa: "tʃa kʰaben"
    pos: "phrase"
    tags: ["polite"]
    notes: "Drinks are eaten in Bengali: চা (cā), জল (jôl), শরবত (śôrbot), all খাওয়া (khāoyā). জল খাবেন (jôl khāben)? Will you have some water?"
    bases:
      - { word: "খাবেন", base: "খাওয়া", reading: "khāoā", meaning: "to eat; to drink" }
