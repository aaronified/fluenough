description: "I like, I love, I don't like, my favourite: four ways Bengali says it. Not yet checked by a Bengali speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: bn-0715
    target: "আমার মিষ্টি ভালো লাগে।"
    native: "I like sweets."
    reading: "āmār miśṭi bhālo lāge."
    ipa: "amar miʃʈi bʱalo laɡe"
    pos: "phrase"
    notes: "The liker takes -র (-rô): 'to me sweets feel good'. লাগে (lāge) stays the same for everyone: তোর (tor), তোমার (tomār), আপনার (āponār), ওর (or), ওঁর মিষ্টি ভালো লাগে (om̐r miśṭi bhālo lāge)."
  - id: bn-0716
    target: "আমার এই গানটা ভালো লাগে না।"
    native: "I don't like this song."
    reading: "āmār ei gānṭā bhālo lāge nā."
    ipa: "amar ei ɡanʈa bʱalo laɡe na"
    pos: "phrase"
  - id: bn-0717
    target: "আপনার কি কলকাতা ভালো লাগে?"
    native: "Do you like Kolkata?"
    reading: "āpnār ki kôlkātā bhālo lāge?"
    ipa: "apnar ki kɔlkat̪a bʱalo laɡe"
    pos: "phrase"
    notes: "কি (ki) after the subject turns it into a yes-or-no question."
  - id: bn-0718
    target: "ওঁর চা ভালো লাগে না।"
    native: "She doesn't like tea. / He doesn't like tea. (respectful)"
    reading: "om̐r cā bhālo lāge nā."
    ipa: "õr tʃa bʱalo laɡe na"
    alt_target: ["ওনার চা ভালো লাগে না।"]
    pos: "phrase"
    notes: "উনি (uni) takes -র (-rô) as ওঁর (om̐r), often said ওনার (onār); both are accepted."
  - id: bn-0719
    target: "খুব ভালো লাগল।"
    native: "I really enjoyed it."
    reading: "khub bhālo lāglo."
    ipa: "kʰub bʱalo laɡlo"
    pos: "phrase"
    notes: "For one experience, the past লাগল (lāgol): সিনেমাটা ভালো লাগল (sinemāṭā bhālo lāgol), I liked the film. আলাপ করে ভালো লাগল (ālāp kôre bhālo lāglo), nice to meet you."
  - id: bn-0720
    target: "আমি মাছ ভালোবাসি।"
    native: "I love fish."
    reading: "āmi māch bhālobāśi."
    ipa: "ami matʃʰ bʱalobaʃi"
    pos: "phrase"
    notes: "ভালোবাসা (bhālobāsā) is an ordinary verb: no -র (-rô) on the subject, and the verb changes for the person: আমি ভালোবাসি (āmi bhālobāsi), তুই ভালোবাসিস (tui bhālobāsis), তুমি ভালোবাসো (tumi bhālobāso), আপনি ভালোবাসেন (āpni bhālobāsen), ও ভালোবাসে (o bhālobāse), উনি ভালোবাসেন (uni bhālobāsen). It is used for food and pastimes as much as for people."
  - id: bn-0721
    target: "আমি তোমাকে ভালোবাসি।"
    native: "I love you."
    reading: "āmi tomāke bhālobāśi."
    ipa: "ami t̪omake bʱalobaʃi"
    pos: "phrase"
    notes: "The person loved takes -কে (-ke)."
  - id: bn-0722
    target: "ও ক্রিকেট খেলতে ভালোবাসে।"
    native: "He loves playing cricket. / She loves playing cricket."
    reading: "o krikeṭ khelte bhālobāśe."
    ipa: "o krikeʈ kʰelt̪e bʱalobaʃe"
    pos: "phrase"
    notes: "'Loves doing': the verb's -তে (-te) form, then ভালোবাসা (bhālobāsā)."
  - id: bn-0723
    target: "আমি ঝাল খাবার পছন্দ করি না।"
    native: "I don't like spicy food."
    reading: "āmi jhāl khābār pôchondo kori nā."
    ipa: "ami dʒʱal kʰabar pɔtʃʰond̪o kori na"
    pos: "phrase"
    notes: "পছন্দ করা (pôchondo kôrā) is a noun with করা (kôrā), and only করা (kôrā) changes: আপনি পছন্দ করেন (āpni pôchondo kôren), ও পছন্দ করে (o pôchondo kôre). In the negative it is 'don't like': ঝাল খাবার পছন্দ করি না (jhāl khābār pôchondo kori nā)."
  - id: bn-0724
    target: "পছন্দ"
    native: "liking; choice"
    reading: "pôchondo"
    ipa: "pɔtʃʰond̪o"
    pos: "noun"
    notes: "কোনটা পছন্দ (konṭā pôchondo)? Which one do you like? Of something you have picked out: এটা আমার পছন্দ হয়েছে (eṭā āmār pôchondo hôyeche), I like this one."
  - id: bn-0725
    target: "রসগোল্লা আমার প্রিয় মিষ্টি।"
    native: "Rosogolla is my favourite sweet."
    reading: "rôśogollā āmār priyo miśṭi."
    ipa: "rɔʃoɡolla amar prijo miʃʈi"
    pos: "phrase"
    notes: "প্রিয় (priyo) is an adjective, so there is no verb. 'Not my favourite' is আমার প্রিয় নয় (āmār priyo nôy), or in speech না (nā)."
  - ref: bn-0640
