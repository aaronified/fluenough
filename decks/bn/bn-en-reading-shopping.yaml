  "title": "Bargaining at a stall"
  "theme": "shopping"
  "sentences":
  - "text": "আলু কত করে কিলো?"
    "reading": "ālu kôto kôre kilo?"
    "ipa": "alu kɔt̪o kɔre kilo"
  - "text": "দশ টাকা। একটু কম করুন।"
    "reading": "dôś ṭākā. ekṭu kôm korun."
    "ipa": "d̪ɔʃ ʈaka ekʈu kɔm korun"
  - "text": "ঠিক আছে, আট টাকা দেব।"
    "reading": "ṭhik āche, āṭ ṭākā deb."
    "ipa": "ʈʰik atʃʰe aʈ ʈaka d̪eb"
  - "text": "আট টাকা হলে কিনব।"
    "reading": "āṭ ṭākā hôle kinob."
    "ipa": "aʈ ʈaka ɦɔle kinob"
