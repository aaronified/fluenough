- "id": "bn-price-list"
  "title": "A price list"
  "theme": "shopping"
  "sentences":
  - "text": "দোকানের দামের তালিকা।"
    "reading": "dokāner dāmer tālikā."
    "ipa": "d̪okaner d̪amer t̪alika"
  - "text": "চাল কিলো পঞ্চাশ টাকা।"
    "reading": "cāl kilo pôncāś ṭākā."
    "ipa": "tʃal kilo pɔntʃaʃ ʈaka"
  - "text": "ডিম দশ টাকা।"
    "reading": "ḍim dôś ṭākā."
    "ipa": "ɖim d̪ɔʃ ʈaka"
  - "text": "আজ সবজিতে ছাড় আছে।"
    "reading": "āj śôbjite chāṛ āche."
    "ipa": "adʒ ʃɔbdʒit̪e tʃʰaɽ atʃʰe"
  - "text": "নগদ টাকায় দাম আরও কম।"
    "reading": "nôgod ṭākāy dām āro kôm."
    "ipa": "nɔɡod̪ ʈakaj d̪am aro kɔm"
