description: "Getting a ride, agreeing the fare and getting off where you want."
tags: [beginner]
cards:
  - id: bn-en-transport-0001
    target: "বাস"
    native: "bus"
    reading: "bas"
    pos: "noun"
  - id: bn-en-transport-0002
    target: "অটো"
    native: "auto-rickshaw"
    reading: "oto"
    pos: "noun"
    notes: "In Kolkata many autos run fixed routes, like a shared bus."
  - id: bn-en-transport-0003
    target: "ট্যাক্সি"
    native: "taxi"
    reading: "tyaksi"
    pos: "noun"
  - id: bn-en-transport-0004
    target: "ভাড়া"
    native: "fare; rent"
    reading: "bhara"
    pos: "noun"
    notes: "ভাড়া কত? What's the fare?"
  - id: bn-en-transport-0005
    target: "মিটারে চলুন।"
    native: "Please go by the meter."
    reading: "mitare cholun."
    pos: "phrase"
    tags: ["polite"]
    notes: "Ask before you get in. If the driver refuses, agree the fare first."
  - id: bn-en-transport-0006
    target: "স্টেশনে যাব।"
    native: "I want to go to the station."
    reading: "steshone jabo."
    pos: "phrase"
    notes: "Literally 'I'll go to the station'. Put any place with -এ or -তে before যাব: এয়ারপোর্টে যাব।"
  - id: bn-en-transport-0007
    target: "কতক্ষণ লাগবে?"
    native: "How long will it take?"
    reading: "kotokkhon lagbe?"
    pos: "phrase"
  - id: bn-en-transport-0008
    target: "এখানে থামুন।"
    native: "Stop here, please."
    reading: "ekhane thamun."
    pos: "phrase"
    tags: ["polite"]
  - id: bn-en-transport-0009
    target: "স্টেশন"
    native: "station"
    reading: "steshon"
    pos: "noun"
  - id: bn-en-transport-0010
    target: "টিকিট"
    native: "ticket"
    reading: "tikit"
    pos: "noun"
  - id: bn-en-transport-0011
