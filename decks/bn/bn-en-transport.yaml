cards:
  - id: bn-0280
    target: "বাস"
    native: "bus"
    reading: "bas"
    pos: "noun"
  - id: bn-0281
    target: "অটো"
    native: "auto-rickshaw"
    reading: "oto"
    alt_target: ["সিএনজি"]
    pos: "noun"
    notes: "In Kolkata many autos run fixed routes, like a shared bus. Also সিএনজি (sienji), named after the gas it runs on."
  - id: bn-0282
    target: "ট্যাক্সি"
    native: "taxi"
    reading: "tyaksi"
    pos: "noun"
  - id: bn-0283
    target: "ভাড়া"
    native: "fare; rent"
    reading: "bhara"
    pos: "noun"
    notes: "ভাড়া কত? What's the fare?"
  - id: bn-0284
    target: "মিটারে চলুন।"
    native: "Please go by the meter."
    reading: "mitare cholun."
    pos: "phrase"
    tags: ["polite"]
    notes: "Ask before you get in. If the driver refuses, agree the fare first."
  - id: bn-0285
    target: "স্টেশনে যাব।"
    native: "I want to go to the station."
    reading: "steshone jabo."
    pos: "phrase"
    notes: "Literally 'I'll go to the station'. Put any place with -এ, or after a vowel -য় or -তে, before যাব: এয়ারপোর্টে যাব, হাওড়ায় যাব।"
  - id: bn-0286
    target: "কতক্ষণ লাগবে?"
    native: "How long will it take?"
    reading: "kotokkhon lagbe?"
    pos: "phrase"
  - id: bn-0287
    target: "এখানে থামুন।"
    native: "Stop here, please."
    reading: "ekhane thamun."
    pos: "phrase"
    tags: ["polite"]
  - id: bn-0288
    target: "স্টেশন"
    native: "station"
    reading: "steshon"
    pos: "noun"
  - id: bn-0289
