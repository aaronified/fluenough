    - lemma: "বলা"
      key: "bola"
      reading: "bôlā"
      ipa: "bɔla"
      forms: { "direct": "সে বলল, 'আমি যাব।'", "reported": "সে বলল যে সে যাবে।" }
      readings: { "direct": "se bôlol, 'āmi jāb.'", "reported": "se bôlol je se jābe." }
      ipas: { "direct": "se bɔlol ami dʒab", "reported": "se bɔlol dʒe se dʒabe" }
    - lemma: "জানানো"
      key: "janano"
      reading: "jānāno"
      ipa: "dʒanano"
      forms: { "direct": "সে জানাল, 'আমি আসব।'", "reported": "সে জানাল যে সে আসবে।" }
      readings: { "direct": "se jānāl, 'āmi āsob.'", "reported": "se jānāl je se āsobe." }
      ipas: { "direct": "se dʒanal ami asob", "reported": "se dʒanal dʒe se asobe" }
    - lemma: "লেখা"
      key: "lekha"
      reading: "lekhā"
      ipa: "lekʰa"
      forms: { "direct": "সে লিখল, 'আমি ভালো আছি।'", "reported": "সে লিখল যে সে ভালো আছে।" }
      readings: { "direct": "se likhol, 'āmi bhālo āchi.'", "reported": "se likhol je se bhālo āche." }
      ipas: { "direct": "se likʰol ami bʱalo atʃʰi", "reported": "se likʰol dʒe se bʱalo atʃʰe" }
    - lemma: "ভাবা"
      key: "bhaba"
      reading: "bhābā"
      ipa: "bʱaba"
      forms: { "direct": "সে ভাবল, 'কাল বৃষ্টি হবে।'", "reported": "সে ভাবল যে কাল বৃষ্টি হবে।" }
      readings: { "direct": "se bhābol, 'kāl briśṭi hôbe.'", "reported": "se bhābol je kāl briśṭi hôbe." }
      ipas: { "direct": "se bʱabol kal briʃʈi ɦɔbe", "reported": "se bʱabol dʒe kal briʃʈi ɦɔbe" }
    - lemma: "জিজ্ঞেস করা"
      key: "jijnes"
      reading: "jigges kôrā"
      ipa: "dʒiɡɡes kɔra"
      forms: { "direct": "সে জিজ্ঞেস করল, 'তুমি কোথায় যাবে?'", "reported": "সে জিজ্ঞেস করল তুমি কোথায় যাবে।" }
      readings: { "direct": "se jigges kôrol, 'tumi kothāy jābe?'", "reported": "se jigges kôrol tumi kothāy jābe." }
      ipas: { "direct": "se dʒiɡɡes kɔrol t̪umi kot̪ʰaj dʒabe", "reported": "se dʒiɡɡes kɔrol t̪umi kot̪ʰaj dʒabe" }
