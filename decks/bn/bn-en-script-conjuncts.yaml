schema: 1
id: bn-en-script-conjuncts
name: "Bengali conjuncts"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Two consonants with no vowel between them are written joined. These are the ones a beginner meets first, each in an everyday word. Not yet checked by a Bengali speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: bn-0081
    target: "ক্ষ"
    native: "k + murdhonno sho, said kh"
    reading: "kkhô"
    ipa: "kkʰɔ"
    notes: "Looks nothing like its parts. It is said 'kh' at the start of a word and 'kkh' inside one: ক্ষমা (khômā, forgiveness), পক্ষ (pôkkho, side)."
  - id: bn-0082
    target: "জ্ঞ"
    native: "j + ny, said gy"
    reading: "ggô"
    ipa: "ɡɡɔ"
    notes: "Looks nothing like its parts. At the start of a word it is said 'g' and turns the vowel after it into the 'a' of 'cat': জ্ঞান (gyan, knowledge). Inside a word it is 'gg': বিজ্ঞান (biggān, science)."
  - id: bn-0083
    target: "ক্ত"
    native: "k + t"
    reading: "ktô"
    ipa: "kt̪ɔ"
    notes: "ক and ত joined: রক্ত (rôkto, blood)."
  - id: bn-0084
    target: "ক্র"
    native: "k + the r-sign"
    reading: "krô"
    ipa: "krɔ"
    notes: "A র after a consonant is written as a stroke below it, the r-sign (র-ফলা): ক্রিকেট (krikeṭ, cricket)."
  - id: bn-0085
    target: "প্র"
    native: "p + the r-sign"
    reading: "prô"
    ipa: "prɔ"
    notes: "The r-sign below প: প্রেম (prem, love)."
  - id: bn-0086
    target: "ত্র"
    native: "t + the r-sign"
    reading: "trô"
    ipa: "t̪rɔ"
    notes: "The r-sign below ত: ছাত্র (chātro, student)."
  - id: bn-0087
    target: "র্ম"
    native: "the r-hook + m"
    reading: "rmô"
    ipa: "rmɔ"
    notes: "A র before another consonant is written as a small hook on top of it, the reph (রেফ): ধর্ম (dhôrmo, religion)."
  - id: bn-0088
    target: "ন্ত"
    native: "n + t"
    reading: "ntô"
    ipa: "nt̪ɔ"
    notes: "ন and ত joined: শান্ত (śānto, calm)."
  - id: bn-0089
    target: "ন্দ"
    native: "n + d"
    reading: "ndô"
    ipa: "nd̪ɔ"
    notes: "ন and দ joined: সুন্দর (śundor, beautiful)."
  - id: bn-0090
    target: "স্ত"
    native: "s + t"
    reading: "stô"
    ipa: "st̪ɔ"
    notes: "Here স is said 's', not 'sh': আস্তে (āste, slowly)."
  - id: bn-0091
    target: "স্থ"
    native: "s + th"
    reading: "sthô"
    ipa: "st̪ʰɔ"
    notes: "স and থ joined, with স said 's': স্থান (sthān, place)."
  - id: bn-0092
    target: "শ্র"
    native: "talobbo sho + the r-sign, said sr"
    reading: "srô"
    ipa: "srɔ"
    notes: "The r-sign below শ. Before র, শ is said 's': শ্রম (srôm, labour)."
  - id: bn-0093
    target: "ষ্ট"
    native: "murdhonno sho + curled-back t"
    reading: "śṭô"
    ipa: "ʃʈɔ"
    notes: "ষ and ট joined: কষ্ট (kôśṭo, hardship)."
  - id: bn-0094
    target: "ঙ্গ"
    native: "ng + g"
    reading: "ṅgô"
    ipa: "ŋɡɔ"
    notes: "ঙ and গ joined: সঙ্গে (śôṅge, with)."
  - id: bn-0095
    target: "ঞ্চ"
    native: "ny + ch, said nch"
    reading: "ncô"
    ipa: "ntʃɔ"
    notes: "ঞ and চ joined, said 'nch': পঞ্চাশ (pôncāś, fifty)."
  - id: bn-0096
    target: "ন্ন"
    native: "n + n"
    reading: "nnô"
    ipa: "nnɔ"
    modes: [recognition, production]
    notes: "Two ন joined: কান্না (kānnā, crying). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  - id: bn-0097
    target: "ত্ত"
    native: "t + t"
    reading: "ttô"
    ipa: "t̪t̪ɔ"
    modes: [recognition, production]
    notes: "Two ত joined: উত্তর (uttor, answer; north). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  - id: bn-0098
    target: "দ্ধ"
    native: "d + dh"
    reading: "ddhô"
    ipa: "d̪d̪ʱɔ"
    modes: [recognition, production]
    notes: "দ and ধ joined: যুদ্ধ (juddho, war). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  - id: bn-0099
    target: "ল্প"
    native: "l + p"
    reading: "lpô"
    ipa: "lpɔ"
    notes: "ল and প joined: গল্প (gôlpo, story)."
  - id: bn-0100
    target: "স্ব"
    native: "s + the b-sign, said sh"
    reading: "śô"
    ipa: "ʃɔ"
    notes: "A ব after a consonant is written as the b-sign (ব-ফলা). It is not said after the first letter of a word: স্বামী (śāmi, husband). Inside a word it doubles the consonant: বিশ্ব (bishsho, world)."
  - id: bn-0101
    target: "ব্য"
    native: "b + the y-sign"
    reading: "bê"
    ipa: "bæ"
    notes: "A য after a consonant is written as the y-sign (য-ফলা). At the start of a word it turns the vowel into the 'a' of 'cat': ব্যাংক (bêṅk, bank)."
  - id: bn-0391
    target: "স্ত্র"
    native: "s + t + the r-sign"
    reading: "strô"
    ipa: "st̪rɔ"
    notes: "Three consonants in one shape: স্ত্রী (stri, wife)."
  - id: bn-0392
    target: "ত্ম"
    native: "t + the m-sign, said tt"
    reading: "ttô"
    ipa: "t̪t̪ɔ"
    modes: [recognition, production]
    notes: "After a consonant ম can be written as a sign (ম-ফলা) that is not said itself and only doubles the consonant before it: আত্মীয় (āttiyo, relative), পদ্ম (pôddo, lotus). Said on its own it sounds like ত্ত, so it is drilled by reading and writing only."
  - id: bn-0393
    target: "ম্ব"
    native: "m + b"
    reading: "mbô"
    ipa: "mbɔ"
    notes: "ম and ব joined: লম্বা (lômbā, tall)."
  - id: bn-0394
    target: "ঙ্ক"
    native: "ng + k"
    reading: "ṅkô"
    ipa: "ŋkɔ"
    notes: "ঙ and ক joined: অঙ্ক (ôṅko, sum; maths)."
