schema: 1
id: bn-en-script-conjuncts
name: "Bengali conjuncts"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Two consonants with no vowel between them are written joined. These are the ones a beginner meets first, each in an everyday word."
tags: [beginner, unreviewed, script]
cards:
  - id: bn-en-script-conjuncts-0001
    target: "ক্ষ"
    native: "k + murdhonyo sho, said kh"
    reading: "kkho"
    notes: "Looks nothing like its parts. It is said 'kh' at the start of a word and 'kkh' inside one: ক্ষমা (khoma, forgiveness), পক্ষ (pokkho, side)."
  - id: bn-en-script-conjuncts-0002
    target: "জ্ঞ"
    native: "j + ny, said gy"
    reading: "gyo"
    notes: "Looks nothing like its parts, and is said 'g' with a 'y' glide: জ্ঞান (gyan, knowledge). Inside a word it is 'gg': বিজ্ঞান (biggan, science)."
  - id: bn-en-script-conjuncts-0003
    target: "ক্ত"
    native: "k + t"
    reading: "kto"
    notes: "ক and ত joined: রক্ত (rokto, blood)."
  - id: bn-en-script-conjuncts-0004
    target: "ক্র"
    native: "k + the r-sign"
    reading: "kro"
    notes: "A র after a consonant is written as a stroke below it, the r-sign (র-ফলা): ক্রিকেট (kriket, cricket)."
  - id: bn-en-script-conjuncts-0005
    target: "প্র"
    native: "p + the r-sign"
    reading: "pro"
    notes: "The r-sign below প: প্রেম (prem, love)."
  - id: bn-en-script-conjuncts-0006
    target: "ত্র"
    native: "t + the r-sign"
    reading: "tro"
    notes: "The r-sign below ত: ছাত্র (chhatro, student)."
  - id: bn-en-script-conjuncts-0007
    target: "র্ম"
    native: "the r-hook + m"
    reading: "rmo"
    notes: "A র before another consonant is written as a small hook on top of it, the reph (রেফ): ধর্ম (dhormo, religion)."
  - id: bn-en-script-conjuncts-0008
    target: "ন্ত"
    native: "n + t"
    reading: "nto"
    notes: "ন and ত joined: শান্ত (shanto, calm)."
  - id: bn-en-script-conjuncts-0009
    target: "ন্দ"
    native: "n + d"
    reading: "ndo"
    notes: "ন and দ joined: সুন্দর (shundor, beautiful)."
  - id: bn-en-script-conjuncts-0010
    target: "স্ত"
    native: "s + t"
    reading: "sto"
    notes: "Here স is said 's', not 'sh': আস্তে (aste, slowly)."
  - id: bn-en-script-conjuncts-0011
    target: "স্থ"
    native: "s + th"
    reading: "stho"
    notes: "স and থ joined, with স said 's': স্থান (sthan, place)."
  - id: bn-en-script-conjuncts-0012
    target: "শ্র"
    native: "talobyo sho + the r-sign, said sr"
    reading: "sro"
    notes: "The r-sign below শ. Before র, শ is said 's': শ্রম (srom, labour)."
  - id: bn-en-script-conjuncts-0013
    target: "ষ্ট"
    native: "murdhonyo sho + curled-back t"
    reading: "shto"
    notes: "ষ and ট joined: কষ্ট (koshto, hardship)."
  - id: bn-en-script-conjuncts-0014
    target: "ঙ্গ"
    native: "ng + g"
    reading: "nggo"
    notes: "ঙ and গ joined: সঙ্গে (shongge, with)."
  - id: bn-en-script-conjuncts-0015
    target: "ঞ্চ"
    native: "ny + ch, said nch"
    reading: "ncho"
    notes: "ঞ and চ joined, said 'nch': পঞ্চাশ (ponchash, fifty)."
  - id: bn-en-script-conjuncts-0016
    target: "ন্ন"
    native: "n + n"
    reading: "nno"
    modes: [recognition, production]
    notes: "Two ন joined: কান্না (kanna, crying). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  - id: bn-en-script-conjuncts-0017
    target: "ত্ত"
    native: "t + t"
    reading: "tto"
    modes: [recognition, production]
    notes: "Two ত joined: উত্তর (uttor, answer; north). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  - id: bn-en-script-conjuncts-0018
    target: "দ্ধ"
    native: "d + dh"
    reading: "ddho"
    modes: [recognition, production]
    notes: "দ and ধ joined: যুদ্ধ (juddho, war). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
  - id: bn-en-script-conjuncts-0019
    target: "ল্প"
    native: "l + p"
    reading: "lpo"
    notes: "ল and প joined: গল্প (golpo, story)."
  - id: bn-en-script-conjuncts-0020
    target: "স্ব"
    native: "s + the b-sign, said sh"
    reading: "sho"
    notes: "A ব after a consonant is written as the b-sign (ব-ফলা). It is not said after the first letter of a word: স্বামী (shami, husband). Inside a word it doubles the consonant: বিশ্ব (bishsho, world)."
  - id: bn-en-script-conjuncts-0021
    target: "ব্য"
    native: "b + the y-sign"
    reading: "bya"
    notes: "A য after a consonant is written as the y-sign (য-ফলা). At the start of a word it turns the vowel into the 'a' of 'cat': ব্যাংক (byank, bank)."
