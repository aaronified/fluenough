schema: 1
id: bn-en-grammar-past-more
name: "Was doing, had done, used to"
kind: grammar
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I was eating, I had gone, I used to go: three more pasts, -ছিলাম, -এছিলাম and -তাম. Not yet checked by a Bengali speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Past continuous, past perfect and habitual past"
  slot_name: "tense, person and respect"
  slots: ["was doing, আমি / আমরা", "was doing, তুই / তোরা", "was doing, তুমি / তোমরা", "was doing, আপনি / আপনারা", "was doing, সে / তারা", "was doing, তিনি / তাঁরা", "had done, আমি / আমরা", "had done, তুই / তোরা", "had done, তুমি / তোমরা", "had done, আপনি / আপনারা", "had done, সে / তারা", "had done, তিনি / তাঁরা", "used to, আমি / আমরা", "used to, তুই / তোরা", "used to, তুমি / তোমরা", "used to, আপনি / আপনারা", "used to, সে / তারা", "used to, তিনি / তাঁরা"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Was doing and had done end in the forms of ছিল: -ছিলাম, -ছিলি, -ছিলে, -ছিলেন, -ছিল, -ছিলেন. Used to takes -তাম, -তিস, -তে, -তেন, -তো, -তেন; তুমি করতে looks like the করতে of করতে হবে, and the sentence tells them apart. Was doing is the present continuous with ছিল in place of its ending: করছি, করছিলাম; যাচ্ছি, যাচ্ছিলাম. Had done is the present perfect the same way: করেছি, করেছিলাম; যাওয়া gives গিয়েছিলাম, said গেছিলাম in everyday speech, and both are accepted. It is also the plain past for something further back: গত বছর আমি দিল্লি গিয়েছিলাম, I went to Delhi last year. Used to also means would: জানলে বলতাম, I'd have said if I'd known. ও and এ take the same form as সে, and উনি and ইনি the same as তিনি. করতো is also written করত, and both are accepted."
