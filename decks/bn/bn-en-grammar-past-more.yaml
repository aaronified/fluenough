schema: 1
id: bn-en-grammar-past-more
name: "Was doing, had done, used to"
kind: grammar
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I was eating, I had gone, I used to go: three more pasts, -ছিলাম (-chilām), -এছিলাম (-echilām) and -তাম (-tām). Not yet checked by a Bengali speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Past continuous, past perfect and habitual past"
  slot_name: "tense, person and respect"
  slots: ["was doing, আমি (āmi) / আমরা (āmorā)", "was doing, তুই (tui) / তোরা (torā)", "was doing, তুমি (tumi) / তোমরা (tomorā)", "was doing, আপনি (āpni) / আপনারা (āponārā)", "was doing, সে (se) / তারা (tārā)", "was doing, তিনি (tini) / তাঁরা (tām̐rā)", "had done, আমি (āmi) / আমরা (āmorā)", "had done, তুই (tui) / তোরা (torā)", "had done, তুমি (tumi) / তোমরা (tomorā)", "had done, আপনি (āpni) / আপনারা (āponārā)", "had done, সে (se) / তারা (tārā)", "had done, তিনি (tini) / তাঁরা (tām̐rā)", "used to, আমি (āmi) / আমরা (āmorā)", "used to, তুই (tui) / তোরা (torā)", "used to, তুমি (tumi) / তোমরা (tomorā)", "used to, আপনি (āpni) / আপনারা (āponārā)", "used to, সে (se) / তারা (tārā)", "used to, তিনি (tini) / তাঁরা (tām̐rā)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Was doing and had done end in the forms of ছিল (chil): -ছিলাম (-chilām), -ছিলি (-chili), -ছিলে (-chile), -ছিলেন (-chilen), -ছিল (-chil), -ছিলেন (-chilen). Used to takes -তাম (-tām), -তিস (-tis), -তে (-te), -তেন (-ten), -তো (-to), -তেন (-ten); তুমি করতে (tumi kôrote) looks like the করতে (kôrote) of করতে হবে (kôrote hôbe), and the sentence tells them apart. Was doing is the present continuous with ছিল (chil) in place of its ending: করছি (kôrochi), করছিলাম (kôrochilām); যাচ্ছি (jācchi), যাচ্ছিলাম (jācchilām). Had done is the present perfect the same way: করেছি (kôrechi), করেছিলাম (kôrechilām); যাওয়া (jāoyā) gives গিয়েছিলাম (giyechilām), said গেছিলাম (gechilām) in everyday speech, and both are accepted. It is also the plain past for something further back: গত বছর আমি দিল্লি গিয়েছিলাম (gôt bôchor āmi dilli giyechilām), I went to Delhi last year. Used to also means would: জানলে বলতাম (jānole bôlotām), I'd have said if I'd known. ও (o) and এ (e) take the same form as সে (se), and উনি (uni) and ইনি (ini) the same as তিনি (tini). করতো (kôroto) is also written করত (kôrot), and both are accepted."
