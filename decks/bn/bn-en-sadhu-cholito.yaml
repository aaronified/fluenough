  - id: bn-0785
    target: "করিয়া"
    native: "having done; চলিত করে (colit kôre)"
    reading: "koriyā"
    ipa: "korija"
    pos: "other"
    modes: [recognition]
    notes: "Sadhu verbs are longer: -ইয়া (-iyā) for -এ (-e). Every sadhu verb below follows the same pattern."
  - id: bn-0786
    target: "করিল"
    native: "did (he, she); চলিত করল (colit kôrol)"
    reading: "korilo"
    ipa: "korilo"
    pos: "other"
    modes: [recognition]
    notes: "Sadhu -ইল (-il) for the plain past, চলিত (colit) -ল (-lô)."
  - id: bn-0787
    target: "করিলাম"
    native: "I did; চলিত করলাম (colit kôrolām)"
    reading: "korilām"
    ipa: "korilam"
    pos: "other"
    modes: [recognition]
    notes: "Sadhu -ইলাম (-ilām), চলিত (colit) -লাম (-lām)."
  - id: bn-0788
    target: "করিতেছে"
    native: "is doing; চলিত করছে (colit kôroche)"
    reading: "koriteche"
    ipa: "korit̪etʃʰe"
    pos: "other"
    modes: [recognition]
    notes: "Sadhu -ইতেছে (-iteche), চলিত (colit) -ছে (-che). The NCTB grammar pairs তাহারা বাড়ি যাইতেছে (tāhārā bāṛi jāiteche)। with তারা বাড়ি যাচ্ছে (tārā bāṛi jācche)। (they are going home)."
  - id: bn-0789
