schema: 1
id: bn-en-sadhu-cholito
name: "Older Bengali: sadhu and cholito"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Before reading Tagore: the older forms his books use, to recognise. Sadhu verbs and pronouns, the apostrophe that marks a dropped vowel, and older and poetic words, each with its চলিত (cholito) form, the Bengali of today. Not yet checked by a Bengali speaker: please report any mistake."
tags: [reading, unreviewed]
cards:
  - id: bn-0773
    target: "ক’রে"
    native: "having done; today করে"
    reading: "kore"
    pos: "other"
    modes: [recognition]
    notes: "The apostrophe marks a dropped ই: সাধু করিয়া, older ক’রে, today করে. In Sahaj Path: চুপ ক’রে ব’সে ঘুম পায়।"
  - id: bn-0774
    target: "ব’সে"
    native: "sitting; today বসে"
    reading: "bose"
    pos: "other"
    modes: [recognition]
    notes: "The same apostrophe: সাধু বসিয়া, older ব’সে, today বসে."
  - id: bn-0775
    target: "ঐ"
    native: "that; today usually ওই"
    reading: "oi"
    pos: "other"
    modes: [recognition]
    notes: "An older spelling, still in use. In Sahaj Path: ঐ সাদা ছাতা।"
  - id: bn-0776
    target: "কয়জন"
    native: "a few (people); today কজন"
    reading: "koyjon"
    pos: "other"
    modes: [recognition]
    notes: "In Sahaj Path: ঐ বাড়ি থেকে কয়জন ছেলে এলে বেশ হয়।"
  - id: bn-0777
    target: "দুখী"
    native: "poor, unhappy; today দুঃখী"
    reading: "dukhi"
    pos: "other"
    modes: [recognition]
    notes: "An older, poetic form. In Sahaj Path: দুখী বুড়ি."
  - id: bn-0778
    target: "বলি নে"
    native: "I don't say; today বলি না"
    reading: "boli ne"
    pos: "phrase"
    modes: [recognition]
    notes: "Older speech uses নে for না. In Sahaj Path: তাকে কিছু বলি নে।"
  - id: bn-0779
    target: "নাই"
    native: "there isn't; today নেই"
    reading: "nai"
    pos: "other"
    modes: [recognition]
    notes: "Sadhu and older speech. Tagore, বাংলাভাষা-পরিচয়: ‘নাহি’ শব্দের সংস্কৃত প্রতিশব্দ ‘নাস্তি’, চলিত কথায় ‘নেই’।"
  - id: bn-0780
    target: "এস"
    native: "come!; today এসো"
    reading: "esho"
    pos: "other"
    modes: [recognition]
    notes: "The familiar 'come', written without ো in older books."
  - id: bn-0781
    target: "কোথা"
    native: "where; today কোথায়"
    reading: "kotha"
    pos: "other"
    modes: [recognition]
    notes: "Poetic and older."
  - id: bn-0782
    target: "মোর"
    native: "my; today আমার"
    reading: "mor"
    pos: "other"
    modes: [recognition]
    notes: "Poetic."
  - id: bn-0783
    target: "তারে"
    native: "him, her; today তাকে"
    reading: "tare"
    pos: "other"
    modes: [recognition]
    notes: "Poetic."
  - id: bn-0784
    target: "হেথা"
    native: "here; today এখানে"
    reading: "hetha"
    pos: "other"
    modes: [recognition]
    notes: "Poetic, with হোথা, there, and সেথা, over there."
  - id: bn-0785
    target: "করিয়া"
    native: "having done; চলিত করে"
    reading: "koriya"
    pos: "other"
    modes: [recognition]
    notes: "Sadhu verbs are longer: -ইয়া for -এ. Every sadhu verb below follows the same pattern."
  - id: bn-0786
    target: "করিল"
    native: "did (he, she); চলিত করল"
    reading: "korilo"
    pos: "other"
    modes: [recognition]
    notes: "Sadhu -ইল for the plain past, চলিত -ল."
  - id: bn-0787
    target: "করিলাম"
    native: "I did; চলিত করলাম"
    reading: "korilam"
    pos: "other"
    modes: [recognition]
    notes: "Sadhu -ইলাম, চলিত -লাম."
  - id: bn-0788
    target: "করিতেছে"
    native: "is doing; চলিত করছে"
    reading: "koritechhe"
    pos: "other"
    modes: [recognition]
    notes: "Sadhu -ইতেছে, চলিত -ছে. The NCTB grammar pairs তাহারা বাড়ি যাইতেছে। with তারা বাড়ি যাচ্ছে। (they are going home)."
  - id: bn-0789
    target: "করিয়াছে"
    native: "has done; চলিত করেছে"
    reading: "koriyachhe"
    pos: "other"
    modes: [recognition]
    notes: "Sadhu -ইয়াছে, চলিত -এছে. The NCTB grammar pairs আপনি ভাত খাইয়াছেন। with আপনি ভাত খেয়েছেন। (you have eaten)."
  - id: bn-0790
    target: "করিবে"
    native: "will do; চলিত করবে"
    reading: "koribe"
    pos: "other"
    modes: [recognition]
    notes: "Sadhu -ইবে, চলিত -বে."
  - id: bn-0791
    target: "করিতে"
    native: "to do; চলিত করতে"
    reading: "korite"
    pos: "other"
    modes: [recognition]
    notes: "Sadhu -ইতে, চলিত -তে."
  - id: bn-0792
    target: "তাহার"
    native: "his, her; চলিত তার"
    reading: "tahar"
    pos: "other"
    modes: [recognition]
    notes: "Sadhu pronouns are longer: তাহা for তা."
  - id: bn-0793
    target: "তাহাকে"
    native: "him, her; চলিত তাকে"
    reading: "tahake"
    pos: "other"
    modes: [recognition]
    notes: "Likewise উহাকে for ওকে."
  - id: bn-0794
    target: "তাহারা"
    native: "they; চলিত তারা"
    reading: "tahara"
    pos: "other"
    modes: [recognition]
    notes: "The NCTB grammar pairs তাহারা বাড়ি যাইতেছে। with তারা বাড়ি যাচ্ছে।"
  - id: bn-0795
    target: "যাহা"
    native: "what, which; চলিত যা"
    reading: "jaha"
    pos: "other"
    modes: [recognition]
    notes: "Likewise ইহা for এ- and উহা for ও-."
  - id: bn-0796
    target: "হইতে"
    native: "from; চলিত থেকে"
    reading: "hoite"
    pos: "other"
    modes: [recognition]
    notes: "Sadhu হইতে, চলিত থেকে."
