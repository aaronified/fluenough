    native: "has done; চলিত করেছে (colit kôreche)"
    reading: "koriyāche"
    ipa: "korijatʃʰe"
    pos: "other"
    modes: [recognition]
    notes: "Sadhu -ইয়াছে (-iyāche), চলিত (colit) -এছে (-eche). The NCTB grammar pairs আপনি ভাত খাইয়াছেন (āpni bhāt khāiyāchen)। with আপনি ভাত খেয়েছেন (āpni bhāt kheyechen)। (you have eaten)."
