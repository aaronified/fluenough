schema: 1
id: bn-en-sadhu-cholito
name: "Older Bengali: sadhu and cholito"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Before reading Tagore: the older forms his books use, to recognise. Sadhu verbs and pronouns, the apostrophe that marks a dropped vowel, and older and poetic words, each with its চলিত (colito) form, the Bengali of today. Not yet checked by a Bengali speaker: please report any mistake."
tags: [reading, unreviewed]
cards:
  - id: bn-0773
    target: "ক’রে"
    native: "having done; today করে (kôre)"
    reading: "kô're"
    ipa: "kɔre"
    pos: "other"
    modes: [recognition]
    notes: "The apostrophe marks a dropped ই (i): সাধু করিয়া (sādhu koriyā), older ক (kô)’রে (re), today করে (kôre). In Sahaj Path: চুপ ক (cup kô)’রে ব (re bô)’সে ঘুম পায় (se ghum pāy)।"
  - id: bn-0774
    target: "ব’সে"
    native: "sitting; today বসে (bôse)"
    reading: "bô'śe"
    ipa: "bɔʃe"
    pos: "other"
    modes: [recognition]
    notes: "The same apostrophe: সাধু বসিয়া (sādhu bosiyā), older ব (bô)’সে (se), today বসে (bôse)."
  - id: bn-0775
    target: "ঐ"
    native: "that; today usually ওই (oi)"
    reading: "oi"
    ipa: "oi"
    pos: "other"
    modes: [recognition]
    notes: "An older spelling, still in use. In Sahaj Path: ঐ সাদা ছাতা (oi sādā chātā)।"
  - id: bn-0776
    target: "কয়জন"
    native: "a few (people); today usually কয়েকজন (kôyekojon)"
    reading: "kôyjon"
    ipa: "kɔjdʒon"
    pos: "other"
    modes: [recognition]
    notes: "In Sahaj Path: ঐ বাড়ি থেকে কয়জন ছেলে এলে বেশ হয় (oi bāṛi theke kôyjon chele ele beś hôy)।"
  - id: bn-0777
    target: "দুখী"
    native: "poor, unhappy; today দুঃখী (duḥkhi)"
    reading: "dukhi"
    ipa: "d̪ukʰi"
    pos: "other"
    modes: [recognition]
    notes: "An older, poetic form. In Sahaj Path: দুখী বুড়ি (dukhi buṛi)."
  - id: bn-0778
    target: "বলি নে"
    native: "I don't say; today বলি না (boli nā)"
    reading: "boli ne"
    ipa: "boli ne"
    pos: "phrase"
    modes: [recognition]
    notes: "Older speech uses নে (ne) for না (nā). In Sahaj Path: তাকে কিছু বলি নে (tāke kichu boli ne)।"
  - id: bn-0779
    target: "নাই"
    native: "there isn't; today নেই (nei)"
    reading: "nāi"
    ipa: "nai"
    pos: "other"
    modes: [recognition]
    notes: "Sadhu, and still heard in speech. Tagore, বাংলাভাষা-পরিচয় (bāṅlābhāśā-poricoy): ‘নাহি (nāhi)’ শব্দের সংস্কৃত প্রতিশব্দ (śôbder soṅskrit protiśobd) ‘নাস্তি (nāsti)’, চলিত কথায় (colit kôthāy) ‘নেই (nei)’।"
  - id: bn-0780
