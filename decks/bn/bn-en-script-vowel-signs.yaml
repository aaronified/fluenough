schema: 1
id: bn-en-script-vowel-signs
name: "Bengali vowel signs"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "After a consonant a vowel is written as a sign (kar) on it, before, after, below or around it. Here on ক and on ম. Not yet checked by a Bengali speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: bn-0063
    target: "কা"
    native: "ka (k + the a sign)"
    reading: "kā"
    ipa: "ka"
    notes: "The a sign া (a-kar) is written after the consonant: ক + া = কা. Compare ক on its own, which is 'ko'."
  - id: bn-0064
    target: "কি"
    native: "ki (k + the short i sign)"
    reading: "ki"
    ipa: "ki"
    notes: "The short i sign ি (hroshsho i-kar) is written BEFORE the consonant but said after it: you see ি then ক, and say 'ki'."
  - id: bn-0065
    target: "কী"
    native: "ki (k + the long i sign)"
    reading: "ki"
    ipa: "ki"
    modes: [recognition, production]
    notes: "The long i sign ী (dirgho i-kar) is written after the consonant. It sounds just like কি, but the spelling tells two words apart: কী is 'what', and কি turns a sentence into a yes-or-no question. Because it sounds the same, it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: bn-0066
    target: "কু"
    native: "ku (k + the short u sign)"
    reading: "ku"
    ipa: "ku"
    notes: "The short u sign ু (hroshsho u-kar) hangs below the consonant."
  - id: bn-0067
    target: "কূ"
    native: "ku (k + the long u sign)"
    reading: "ku"
    ipa: "ku"
    modes: [recognition, production]
    notes: "The long u sign ূ (dirgho u-kar) also hangs below. It sounds just like কু, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: bn-0068
    target: "কৃ"
    native: "kri (k + the ri sign)"
    reading: "kri"
    ipa: "kri"
    modes: [recognition, production]
    notes: "The ri sign ৃ (ri-kar) hangs below the consonant: কৃষক (kriśok, farmer). A recogniser writes this sound as ক্রি, so it is drilled by reading and writing only."
  - id: bn-0069
    target: "কে"
    native: "ke (k + the e sign)"
    reading: "ke"
    ipa: "ke"
    notes: "The e sign ে (e-kar) is written BEFORE the consonant and said after it: কে (ke, who)."
  - id: bn-0070
    target: "কৈ"
    native: "koi (k + the oi sign)"
    reading: "koi"
    ipa: "koi"
    modes: [recognition, production]
    notes: "The oi sign ৈ (oi-kar) is also written before the consonant and said after it. A recogniser writes this sound as কই, so it is drilled by reading and writing only."
  - id: bn-0071
    target: "কো"
    native: "ko (k + the o sign)"
    reading: "ko"
    ipa: "ko"
    notes: "The o sign ো (o-kar) comes in two parts around the consonant: ে before it and া after it. This is the closed o of 'go', unlike the open o ক carries on its own."
  - id: bn-0072
    target: "কৌ"
    native: "kou (k + the ou sign)"
    reading: "kou"
    ipa: "kou"
    modes: [recognition, production]
    notes: "The ou sign ৌ (ou-kar) also comes in two parts: ে before the consonant and ৗ after it. A recogniser writes this sound as কউ, so it is drilled by reading and writing only."
  - id: bn-0073
    target: "ক্"
    native: "k (with the hoshonto: no vowel)"
    reading: "k"
    ipa: "k"
    modes: [recognition, production]
    notes: "The hoshonto ্ below a consonant takes its vowel away: ক্ is 'k' alone. Usually two consonants join into a conjunct instead, so you see it mostly in single letters and new words. A sign rather than a syllable you say, so it is drilled by reading and writing only."
  - id: bn-0074
    target: "মা"
    native: "ma (m + the a sign)"
    reading: "mā"
    ipa: "ma"
    notes: "The same a sign on another consonant: each sign keeps its place on almost every consonant. After র, শ and হ the u signs join in shapes of their own: রু, শু, হু. মা (mā, mother)."
  - id: bn-0075
    target: "মি"
    native: "mi (m + the short i sign)"
    reading: "mi"
    ipa: "mi"
    notes: "The short i sign is written before ম, as before ক, and said after it."
  - id: bn-0076
    target: "মী"
    native: "mi (m + the long i sign)"
    reading: "mi"
    ipa: "mi"
    modes: [recognition, production]
    notes: "The long i sign is written after ম. It sounds just like মি, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: bn-0077
    target: "মু"
    native: "mu (m + the short u sign)"
    reading: "mu"
    ipa: "mu"
    notes: "The short u sign hangs below ম, as below ক."
  - id: bn-0078
    target: "মূ"
    native: "mu (m + the long u sign)"
    reading: "mu"
    ipa: "mu"
    modes: [recognition, production]
    notes: "The long u sign hangs below ম. It sounds just like মু, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: bn-0079
    target: "মে"
    native: "me (m + the e sign)"
    reading: "me"
    ipa: "me"
    notes: "The e sign is written before ম and said after it: মেয়ে (meye, girl; daughter)."
  - id: bn-0080
    target: "মো"
    native: "mo (m + the o sign)"
    reading: "mo"
    ipa: "mo"
    notes: "The o sign wraps around ম in two parts, as it wraps around ক: মোটা (moṭā, fat; thick)."
