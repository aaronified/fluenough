schema: 1
id: bn-en-script-vowel-signs
name: "Bengali vowel signs"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "After a consonant a vowel is written as a sign (kar) on it, before, after, below or around it. Here on ক and on ম."
tags: [beginner, unreviewed, script]
cards:
  - id: bn-en-script-vowel-signs-0001
    target: "কা"
    native: "ka (k + the a sign)"
    reading: "ka"
    notes: "The a sign া (a-kar) is written after the consonant: ক + া = কা. Compare ক on its own, which is 'ko'."
  - id: bn-en-script-vowel-signs-0002
    target: "কি"
    native: "ki (k + the short i sign)"
    reading: "ki"
    notes: "The short i sign ি (hroshwo i-kar) is written BEFORE the consonant but said after it: you see ি then ক, and say 'ki'."
  - id: bn-en-script-vowel-signs-0003
    target: "কী"
    native: "ki (k + the long i sign)"
    reading: "ki"
    modes: [recognition, production]
    notes: "The long i sign ী (dirgho i-kar) is written after the consonant. It sounds just like কি; the two are a matter of spelling. It sounds just like কি, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: bn-en-script-vowel-signs-0004
    target: "কু"
    native: "ku (k + the short u sign)"
    reading: "ku"
    notes: "The short u sign ু (hroshwo u-kar) hangs below the consonant."
  - id: bn-en-script-vowel-signs-0005
    target: "কূ"
    native: "ku (k + the long u sign)"
    reading: "ku"
    modes: [recognition, production]
    notes: "The long u sign ূ (dirgho u-kar) also hangs below. It sounds just like কু. It sounds just like কু, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: bn-en-script-vowel-signs-0006
    target: "কৃ"
    native: "kri (k + the ri sign)"
    reading: "kri"
    modes: [recognition, production]
    notes: "The ri sign ৃ (ri-kar) hangs below the consonant: কৃষক (krishok, farmer). A recogniser writes this sound as ক্রি, so it is drilled by reading and writing only."
  - id: bn-en-script-vowel-signs-0007
    target: "কে"
    native: "ke (k + the e sign)"
    reading: "ke"
    notes: "The e sign ে (e-kar) is written BEFORE the consonant and said after it: কে (ke, who)."
  - id: bn-en-script-vowel-signs-0008
    target: "কৈ"
    native: "koi (k + the oi sign)"
    reading: "koi"
    modes: [recognition, production]
    notes: "The oi sign ৈ (oi-kar) is also written before the consonant and said after it. A recogniser writes this sound as কই, so it is drilled by reading and writing only."
  - id: bn-en-script-vowel-signs-0009
    target: "কো"
    native: "ko (k + the o sign)"
    reading: "ko"
    notes: "The o sign ো (o-kar) comes in two parts around the consonant: ে before it and া after it. This is the closed o of 'go', unlike the open o ক carries on its own."
  - id: bn-en-script-vowel-signs-0010
    target: "কৌ"
    native: "kou (k + the ou sign)"
    reading: "kou"
    modes: [recognition, production]
    notes: "The ou sign ৌ (ou-kar) also comes in two parts: ে before the consonant and ৗ after it. A recogniser writes this sound as কউ, so it is drilled by reading and writing only."
  - id: bn-en-script-vowel-signs-0011
    target: "ক্"
    native: "k (with the hoshonto: no vowel)"
    reading: "k"
    modes: [recognition, production]
    notes: "The hoshonto ্ below a consonant takes its vowel away: ক্ is 'k' alone. Usually two consonants join into a conjunct instead, so you see it mostly in single letters and new words. A sign rather than a syllable you say, so it is drilled by reading and writing only."
  - id: bn-en-script-vowel-signs-0012
    target: "মা"
    native: "ma (m + the a sign)"
    reading: "ma"
    notes: "The same a sign on another consonant: each sign keeps its place whatever the consonant. মা (ma, mother)."
  - id: bn-en-script-vowel-signs-0013
    target: "মি"
    native: "mi (m + the short i sign)"
    reading: "mi"
    notes: "The short i sign is written before ম, as before ক, and said after it."
  - id: bn-en-script-vowel-signs-0014
    target: "মী"
    native: "mi (m + the long i sign)"
    reading: "mi"
    modes: [recognition, production]
    notes: "The long i sign is written after ম. It sounds just like মি. It sounds just like মি, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: bn-en-script-vowel-signs-0015
    target: "মু"
    native: "mu (m + the short u sign)"
    reading: "mu"
    notes: "The short u sign hangs below ম, as below ক."
  - id: bn-en-script-vowel-signs-0016
    target: "মূ"
    native: "mu (m + the long u sign)"
    reading: "mu"
    modes: [recognition, production]
    notes: "The long u sign hangs below ম. It sounds just like মু. It sounds just like মু, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: bn-en-script-vowel-signs-0017
    target: "মে"
    native: "me (m + the e sign)"
    reading: "me"
    notes: "The e sign is written before ম and said after it: মেয়ে (meye, girl; daughter)."
  - id: bn-en-script-vowel-signs-0018
    target: "মো"
    native: "mo (m + the o sign)"
    reading: "mo"
    notes: "The o sign wraps around ম in two parts, as it wraps around ক: মোটা (mota, fat; thick)."
