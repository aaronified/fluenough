  - id: "bn-3312"
    target: "ক্যারিয়ার"
    reading: "kêriyār"
    ipa: "kærijar"
    phonetic: "[kærijar]"
    phonetic_source: "rules"
    pos: "noun"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "ক্যারিয়ার", reading: "kêriyār" }] }
    examples:
      - { target: "আমার ক্যারিয়ার শুরু হয়েছে।", reading: "āmār kêriyār śuru hôyeche.", ipa: "amar kærijar ʃuru ɦɔjetʃʰe", bases: [{ word: "আমার", ref: "bn-0833" }, { word: "শুরু", base: "শুরু", reading: "śuru" }, { word: "হয়েছে", ref: "bn-0874" }] }
      - { target: "ক্যারিয়ারের জন্য পড়াশোনা করো।", reading: "kêriyārer jonn pôṛāśonā kôro.", ipa: "kærijarer dʒonn pɔɽaʃona kɔro", bases: [{ word: "ক্যারিয়ারের", base: "ক্যারিয়ার", reading: "kêriyārer" }, { word: "জন্য", base: "জন্য", reading: "jonn" }, { word: "পড়াশোনা", base: "পড়াশোনা", reading: "pôṛāśonā" }, { word: "করো", ref: "bn-0102" }] }
  - id: "bn-3313"
