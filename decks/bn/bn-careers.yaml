      - { target: "জীবনবৃত্তান্তটা পাঠাও।", reading: "jibonobrittāntoṭā pāṭhāo.", ipa: "dʒibonobrit̪t̪ant̪oʈa paʈʰao", bases: [{ word: "জীবনবৃত্তান্তটা", base: "জীবনবৃত্তান্ত", reading: "jibonobrittāntoṭā" }, { word: "পাঠাও", ref: "bn-1108" }] }
      - { target: "জীবনবৃত্তান্তে অভিজ্ঞতা লেখো।", reading: "jibonobrittānte ôbhiggotā lekho.", ipa: "dʒibonobrit̪t̪ant̪e ɔbʱiɡɡot̪a lekʰo", bases: [{ word: "জীবনবৃত্তান্তে", base: "জীবনবৃত্তান্ত", reading: "jibonobrittānte" }, { word: "অভিজ্ঞতা", ref: "bn-3315" }, { word: "লেখো", base: "লেখা", reading: "lekho" }] }
