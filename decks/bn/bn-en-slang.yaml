cards:
  - id: bn-0750
    target: "তামাক সেবন"
    native: "smoking (slang)"
    reading: "tāmāk śebon"
    ipa: "t̪amak ʃebon"
    alt_target: ["তামাক সেবন করা"]
    pos: "phrase"
    notes: "Literally 'taking tobacco', and exactly সিগারেট খাওয়া, smoking. As a verb, তামাক সেবন করা."
  - id: bn-0748
    target: "পান করা"
    native: "to drink alcohol (slang)"
    reading: "pān kôrā"
    ipa: "pan kɔra"
    pos: "phrase"
    notes: "Formally just 'to drink', as in writing: জল পান করা. In speech it usually means drinking alcohol, so for tea or water say খাওয়া. Not পান খাওয়া, which is chewing a betel leaf."
