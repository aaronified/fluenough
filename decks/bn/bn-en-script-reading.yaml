schema: 1
id: bn-en-script-reading
name: "First words to read"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Short everyday words written with letters alone, no vowel signs: the headline, the knot, the dot below and the vowel you do not see, at work."
tags: [beginner, unreviewed, script]
cards:
  - id: bn-en-script-reading-0001
    target: "ঘর"
    native: "room; home"
    reading: "ghor"
    notes: "Two letters under one headline. ঘ is gho and র is ro, but the last o isn't said: ghor."
  - id: bn-en-script-reading-0002
    target: "জল"
    native: "water"
    reading: "jol"
    notes: "The headline runs on over both letters. ল has a knot; the final o is quiet."
  - id: bn-en-script-reading-0003
    target: "কলম"
    native: "pen"
    reading: "kolom"
    notes: "Three letters and no vowel written: ko-lo-m. Look for the knot in ক and in ল."
  - id: bn-en-script-reading-0004
    target: "বন"
    native: "forest"
    reading: "bon"
    notes: "ব has no dot below. With one it would be র."
  - id: bn-en-script-reading-0005
    target: "রথ"
    native: "chariot"
    reading: "roth"
    notes: "র is ব with a dot below. থ has only half a headline."
  - id: bn-en-script-reading-0006
    target: "বল"
    native: "ball"
    reading: "bol"
    notes: "ব and ল under one headline; the last o is quiet."
  - id: bn-en-script-reading-0007
    target: "ফল"
    native: "fruit"
    reading: "phol"
    notes: "ফ is প with a curl and a breath after it: ph."
  - id: bn-en-script-reading-0008
    target: "পথ"
    native: "way; path"
    reading: "poth"
    notes: "প and থ both have only half a headline, so the line breaks over them."
  - id: bn-en-script-reading-0009
    target: "নখ"
    native: "nail (of a finger)"
    reading: "nokh"
    notes: "খ has a knot and half a headline."
  - id: bn-en-script-reading-0010
    target: "দশ"
    native: "ten"
    reading: "dosh"
    notes: "শ has half a headline; it is said sh."
  - id: bn-en-script-reading-0011
    target: "তরল"
    native: "liquid"
    reading: "torol"
    notes: "ত has a knot; ত, র and ল each carry their o, and the last one is quiet."
  - id: bn-en-script-reading-0012
    target: "গরম"
    native: "hot"
    reading: "gorom"
    notes: "গ has half a headline; then র and ম."
  - id: bn-en-script-reading-0013
    target: "শহর"
    native: "city"
    reading: "shohor"
    notes: "শ, হ and র: no vowel written, and the last o is quiet."
  - id: bn-en-script-reading-0014
    target: "সময়"
    native: "time"
    reading: "shomoy"
    notes: "য় is য with a dot below, said y."
  - id: bn-en-script-reading-0015
    target: "বড়"
    native: "big"
    reading: "boro"
    notes: "ড় is ড with a dot below: the tongue is placed as for ড, but doesn't touch the roof of the mouth. This word keeps its last o: boro."
  - id: bn-en-script-reading-0016
    target: "এক"
    native: "one"
    reading: "ek"
    notes: "এ has no headline, so the line starts only over ক. এ is a vowel letter, written in full at the start of a word."
