schema: 1
id: bn-en-grammar-needs
name: "Need and want"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I need, I don't need, I want: লাগবে and দরকার take the needer's -র, চাই does not. Not yet checked by a Bengali speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: bn-0571
    target: "আমার একটা ছাতা লাগবে।"
    native: "I need an umbrella."
    reading: "āmār ekṭā chātā lāgbe."
    ipa: "amar ekʈa tʃʰat̪a laɡbe"
    pos: "phrase"
    notes: "The one who needs takes -র, and লাগবে stays the same for everyone: তোর, তোমার, আপনার, ওর, ওঁর একটা ছাতা লাগবে. For something needed now, Bengali uses the future লাগবে, 'will be needed'; the present লাগে is not used this way."
  - id: bn-0572
    target: "আপনার কী লাগবে?"
    native: "What do you need? (what a shopkeeper asks)"
    reading: "āpnār ki lāgbe?"
    ipa: "apnar ki laɡbe"
    alt_target: ["কী লাগবে?"]
    pos: "phrase"
    notes: "In a shop often just কী লাগবে? To a friend: তোমার কী লাগবে?"
  - id: bn-0573
    target: "আমার আর কিছু লাগবে না।"
    native: "I don't need anything else."
    reading: "āmār ār kichu lāgbe nā."
    ipa: "amar ar kitʃʰu laɡbe na"
    pos: "phrase"
    notes: "না goes at the end, after লাগবে."
  - id: bn-0574
    target: "লাগবে না, ধন্যবাদ।"
    native: "I don't need it, thanks."
    reading: "lāgbe nā, dhonnobād."
    ipa: "laɡbe na d̪ʱonnobad̪"
    pos: "phrase"
    notes: "The polite way to turn down what a shopkeeper offers."
  - id: bn-0577
    target: "দরকার"
    native: "need; necessary"
    reading: "dôrkār"
    ipa: "d̪ɔrkar"
    pos: "noun"
    notes: "A noun, so it needs no verb in the present: আমার টাকা দরকার, I need money. It is a little more formal than লাগবে."
  - id: bn-0578
    target: "আমার একটু সাহায্য দরকার।"
    native: "I need a little help."
    reading: "āmār ekṭu śāhājjo dôrkār."
    ipa: "amar ekʈu ʃaɦadʒdʒo d̪ɔrkar"
    pos: "phrase"
    notes: "Like লাগবে, দরকার takes the needer's -র."
  - id: bn-0579
    target: "দরকার নেই।"
    native: "There's no need."
    reading: "dôrkār nei."
    ipa: "d̪ɔrkar nei"
    pos: "phrase"
    notes: "The negative of দরকার is নেই: আমার টাকা দরকার নেই, I don't need money."
  - id: bn-0580
    target: "আমার টাকা দরকার ছিল।"
    native: "I needed money."
    reading: "āmār ṭākā dôrkār chilo."
    ipa: "amar ʈaka d̪ɔrkar tʃʰilo"
    pos: "phrase"
    notes: "In the past দরকার takes ছিল, and ছিল না for 'didn't need': দরকার ছিল না."
  - id: bn-0581
    target: "আমি এক কাপ চা চাই।"
    native: "I want a cup of tea."
    reading: "āmi ek kāp cā cāi."
    ipa: "ami ek kap tʃa tʃai"
    pos: "phrase"
    notes: "চাওয়া, 'to want', is an ordinary verb: no -র on the one who wants, and the verb changes for the person: আমি চাই, তুই চাস, তুমি চাও, আপনি চান, ও চায়, উনি চান."
  - id: bn-0582
    target: "ও আরও সময় চায়।"
    native: "She wants more time. / He wants more time."
    reading: "o āro śômoy cāy."
    ipa: "o aro ʃɔmoj tʃaj"
    pos: "phrase"
