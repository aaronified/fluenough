schema: 1
id: bn-en-sound-differences
name: "Sounds to tell apart"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Pairs of everyday words that differ in one sound: a breath after a consonant, the tongue on the teeth or curled back, the vowel every consonant carries against a, and a nasal vowel."
tags: [beginner, unreviewed]
