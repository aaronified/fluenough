        "আমি: present": "পড়ি"
        "সে: present": "পড়ে"
        "আমি: have done (-এছি)": "পড়েছি"
        "আমি: did (-লাম)": "পড়লাম"
        "আমি: will (-ব)": ["পড়ব", "পড়বো"]
        "আমি: didn't (-নি)": "পড়িনি"
      readings:
        "আমি: present": "poṛi"
        "সে: present": "pôṛe"
        "আমি: have done (-এছি)": "pôṛechi"
        "আমি: did (-লাম)": "pôṛlām"
        "আমি: will (-ব)": ["pôṛbo", "pôṛbo"]
        "আমি: didn't (-নি)": "poṛini"
      ipas:
        "আমি: present": "poɽi"
        "সে: present": "pɔɽe"
