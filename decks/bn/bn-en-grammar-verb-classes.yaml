schema: 1
id: bn-en-grammar-verb-classes
name: "The ten verb types"
kind: grammar
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Bengali verbs fall into ten types by their vowels: learn one verb of each and you can conjugate the rest. Not yet checked by a Bengali speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Principal parts, by verb type"
  slot_name: "form"
  slots: ["আমি: present", "সে: present", "আমি: have done (-এছি)", "আমি: did (-লাম)", "আমি: will (-ব)", "আমি: didn't (-নি)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Basic Bangla (4.4 to 4.9) sorts verbs into ten types by their vowels, and every verb of a type changes the same way. Type 1, অ-আ: পড়া, like করা and বলা. Type 2, আ-আ: জানা, থাকা, আনা; the -এছি past turns আ into এ: জেনেছি, এনেছি. Type 3, এ-আ: লেখা, শেখা, কেনা, and type 5, ও-আ: বোঝা, শোনা, খোঁজা. Here এ becomes ই and ও becomes উ in every form but the present of তুমি, সে and আপনি: লিখি, লিখেছি, লিখব, but সে লেখে. Type 4, অ্যা-আ: দেখা, whose এ is the a of 'cat' in দেখা and দেখে, and a plain e in দেখি. Type 6, এ-ও-আ: দেওয়া, নেওয়া: দিই, দিয়েছি, দিলাম, but দেয় and দেব. Type 7, যাওয়া, takes গ- in the past: গিয়েছি, also said গেছি, and গেলাম. Type 7a, খাওয়া, which Basic Bangla gives with চাওয়া; পাওয়া goes the same way: খেয়েছি, খেলাম. Type 8, ও-ও-আ: ধোয়া, which Basic Bangla writes ধোওয়া. Type 9, অ-ও-আ: হওয়া. Type 10, ঔ-আ-ও: দৌড়ানো, পৌঁছানো. In speech the আ of these verbs is often an ও, as in ঘুমোচ্ছি for ঘুমাচ্ছি; the table shows Basic Bangla's forms and accepts both. 'Didn't' is the present with -নি joined on: লিখিনি, সে লেখেনি."
  entries:
    - lemma: "পড়া"
      key: pora
      reading: "pora"
      gloss: "to read; to study"
      forms:
        "আমি: present": "পড়ি"
        "সে: present": "পড়ে"
        "আমি: have done (-এছি)": "পড়েছি"
        "আমি: did (-লাম)": "পড়লাম"
        "আমি: will (-ব)": ["পড়ব", "পড়বো"]
        "আমি: didn't (-নি)": "পড়িনি"
      readings:
        "আমি: present": "pori"
        "সে: present": "pore"
        "আমি: have done (-এছি)": "porechhi"
        "আমি: did (-লাম)": "porlam"
        "আমি: will (-ব)": ["porbo", "porbo"]
        "আমি: didn't (-নি)": "porini"
