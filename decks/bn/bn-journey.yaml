  - id: "bn-2443"
    target: "যাত্রা"
    reading: "jātrā"
    ipa: "dʒat̪ra"
    pos: "noun"
    notes:
      - { id: "n1", kind: "note" }
    examples:
      - { target: "আমাদের যাত্রা লম্বা ছিল।", reading: "āmāder jātrā lômbā chil.", ipa: "amad̪er dʒat̪ra lɔmba tʃʰil", bases: [{ word: "আমাদের", base: "আমরা", reading: "āmorā" }, { word: "ছিল", ref: "bn-0875" }] }
