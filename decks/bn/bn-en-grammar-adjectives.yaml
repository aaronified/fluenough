description: "Describing words, which don't change for number and almost never for gender, and how to say -er and -est. Not yet checked by a Bengali speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: bn-0617
    target: "ভালো"
    native: "good"
    reading: "bhālo"
    ipa: "bʱalo"
    pos: "adj"
  - id: bn-0618
    target: "খারাপ"
    native: "bad"
    reading: "khārāp"
    ipa: "kʰarap"
    pos: "adj"
  - id: bn-0619
    target: "ছোট"
    native: "small; young"
    reading: "choṭo"
    ipa: "tʃʰoʈo"
    alt_target: ["ছোটো"]
    pos: "adj"
    notes: "Also written ছোটো (choṭo), as Basic Bangla does, and বড় (bôṛo), big, as বড়ো (bôṛo). Both spellings are right."
  - ref: bn-0062
    native: "big; elder"
    notes: "বড় বাড়ি (bôṛo bāṛi), a big house; বড় ভাই (bôṛo bhāi), an elder brother. Also written বড়ো (bôṛo)."
  - ref: bn-0060
    notes: "গরম চা (gôrom cā), hot tea. The opposite is ঠান্ডা (ṭhānḍā)."
  - id: bn-0620
    target: "নতুন"
    native: "new"
    reading: "notun"
    ipa: "not̪un"
    pos: "adj"
  - id: bn-0621
    target: "পুরোনো"
    native: "old (of things)"
    reading: "purono"
    ipa: "purono"
    alt_target: ["পুরনো"]
    pos: "adj"
    notes: "Also written পুরনো (purono). Not for people: an old person is বৃদ্ধ (briddho)."
  - id: bn-0622
    target: "ঠান্ডা"
    native: "cold"
    reading: "ṭhānḍā"
    ipa: "ʈʰanɖa"
    alt_target: ["ঠাণ্ডা"]
    pos: "adj"
    notes: "Also written ঠাণ্ডা (ṭhānḍā), as the Bangla Academy dictionary does."
  - id: bn-0623
    target: "সহজ"
    native: "easy"
    reading: "śôhoj"
    ipa: "ʃɔɦodʒ"
    pos: "adj"
  - id: bn-0624
    target: "কঠিন"
    native: "difficult"
    reading: "koṭhin"
    ipa: "koʈʰin"
    pos: "adj"
  - id: bn-0625
    target: "সুন্দর"
    native: "beautiful"
    reading: "śundor"
    ipa: "ʃund̪or"
    pos: "adj"
    notes: "A few adjectives from Sanskrit have a feminine form, as in সুন্দরী মেয়ে (sundori meye), a beautiful girl, but the plain form is always right: সুন্দর মেয়ে (śundor meye)."
  - id: bn-0626
    target: "পরিষ্কার"
    native: "clean; clear"
    reading: "poriśkār"
    ipa: "poriʃkar"
    pos: "adj"
  - id: bn-0627
    target: "নোংরা"
    native: "dirty"
    reading: "noṅrā"
    ipa: "noŋra"
    pos: "adj"
  - id: bn-0628
    target: "লম্বা"
    native: "tall; long"
    reading: "lômbā"
    ipa: "lɔmba"
    pos: "adj"
  - id: bn-0629
    target: "বেঁটে"
    native: "short (of a person)"
    reading: "bem̐ṭe"
    ipa: "bẽʈe"
    alt_target: ["খাটো"]
    pos: "adj"
    notes: "Also খাটো (khāṭo)."
  - id: bn-0630
    target: "মোটা"
    native: "fat; thick"
    reading: "moṭā"
    ipa: "moʈa"
    pos: "adj"
  - id: bn-0631
    target: "রোগা"
    native: "thin (of a person)"
    reading: "rogā"
    ipa: "roɡa"
    pos: "adj"
  - id: bn-0632
    target: "ভারী"
    native: "heavy"
    reading: "bhāri"
    ipa: "bʱari"
    pos: "adj"
    notes: "With ী (i). ভারি (bhāri) with ি (i) is the adverb 'very', as in ভারি সুন্দর (bhāri śundor)."
  - id: bn-0633
    target: "হালকা"
    native: "light (not heavy)"
    reading: "hālkā"
    ipa: "ɦalka"
    pos: "adj"
  - id: bn-0634
    target: "গরিব"
    native: "poor"
    reading: "gorib"
    ipa: "ɡorib"
    alt_target: ["গরীব"]
    pos: "adj"
    notes: "The Bangla Academy spelling. Basic Bangla writes গরীব (gorib)."
  - id: bn-0635
    target: "খুশি"
    native: "happy"
    reading: "khuśi"
    ipa: "kʰuʃi"
