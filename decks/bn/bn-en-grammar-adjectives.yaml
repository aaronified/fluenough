  - id: bn-0636
    target: "ক্লান্ত"
    native: "tired"
    reading: "klānto"
    ipa: "klant̪o"
    pos: "adj"
  - id: bn-0637
    target: "ব্যস্ত"
    native: "busy"
    reading: "bêsto"
    ipa: "bæst̪o"
    pos: "adj"
  - id: bn-0638
    target: "শক্ত"
    native: "hard"
    reading: "śôkto"
    ipa: "ʃɔkt̪o"
    pos: "adj"
  - id: bn-0639
    target: "নরম"
    native: "soft"
    reading: "nôrom"
    ipa: "nɔrom"
    pos: "adj"
  - id: bn-0640
    target: "প্রিয়"
    native: "favourite; dear"
    reading: "priyo"
    ipa: "prijo"
    pos: "adj"
    notes: "আমার প্রিয় খাবার (āmār priyo khābār), my favourite food."
  - id: bn-0641
    target: "খুব"
    native: "very"
    reading: "khub"
    ipa: "kʰub"
    pos: "adv"
  - id: bn-0642
    target: "ও আমার চেয়ে লম্বা।"
    native: "She is taller than me. / He is taller than me."
    reading: "o āmār ceye lômbā."
    ipa: "o amar tʃeje lɔmba"
    alt_target: ["ও আমার থেকে লম্বা।"]
    pos: "phrase"
    notes: "'Than' is চেয়ে (ceye) or থেকে (theke) after the possessive: আমার চেয়ে (āmār ceye), আমার থেকে (āmār theke). Both are right. The adjective itself never changes."
    bases:
      - { word: "আমার", base: "আমি", reading: "āmi", meaning: "I" }
  - id: bn-0643
    target: "এটা সবচেয়ে ভালো।"
    native: "This is the best."
    reading: "eṭā śôbceye bhālo."
    ipa: "eʈa ʃɔbtʃeje bʱalo"
    pos: "phrase"
    notes: "সবচেয়ে (sôboceye), 'than all', makes -est: সবচেয়ে বড় (sôboceye bôṛo), the biggest."
    bases:
      - { word: "এটা", base: "এটা", reading: "eṭā", meaning: "this (thing)" }
      - { word: "সবচেয়ে", base: "সবচেয়ে", reading: "śôbceye", meaning: "most; more than all" }
  - id: bn-0644
    target: "এটা আরও ভালো।"
    native: "This one is even better."
    reading: "eṭā āro bhālo."
    ipa: "eʈa aro bʱalo"
    pos: "phrase"
    notes: "With no 'than', আরও (still more) makes -er: আরও বড় (āro bôṛo), bigger."
    bases:
      - { word: "এটা", base: "এটা", reading: "eṭā", meaning: "this (thing)" }
