schema: 1
id: bn-en-grammar-pronouns
name: "Pronouns and possessives"
kind: grammar
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I, you, he and she, here, over there and not present, with my and your, and me and you as objects."
tags: [beginner, grammar]
pattern:
  name: "Personal pronouns"
  slot_name: "form"
  slots: ["possessive: my, your …", "object: me, to me …"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Bengali has three words for 'you': আপনি (respectful), তুমি (familiar) and তুই (intimate). 'He or she' depends on where the person is: এ for someone here, ও for someone over there, সে for someone not present. Their respectful forms are ইনি, উনি and তিনি, and their plurals এরা, ওরা and তারা. A possessive never changes for the thing owned: আমার বই, আমার বাড়ি. In the plural, the object is usually the same as the possessive: আমাদের, or with -কে, আমাদেরকে. In speech এঁর and ওঁর are often এনার and ওনার: ওনার বাড়ি, and এঁকে and ওঁকে are এনাকে and ওনাকে; the drill accepts both."
  entries:
    - lemma: "আমি"
      key: ami
      reading: "ami"
      gloss: "I"
      forms:
        "possessive: my, your …": "আমার"
        "object: me, to me …": "আমাকে"
      readings:
        "possessive: my, your …": "amar"
        "object: me, to me …": "amake"
    - lemma: "তুই"
      key: tui
      reading: "tui"
      gloss: "you, intimate"
      forms:
        "possessive: my, your …": "তোর"
        "object: me, to me …": "তোকে"
      readings:
        "possessive: my, your …": "tor"
        "object: me, to me …": "toke"
    - lemma: "তুমি"
      key: tumi
      reading: "tumi"
      gloss: "you, familiar"
      forms:
        "possessive: my, your …": "তোমার"
        "object: me, to me …": "তোমাকে"
      readings:
        "possessive: my, your …": "tomar"
        "object: me, to me …": "tomake"
    - lemma: "আপনি"
      key: apni
      reading: "apni"
      gloss: "you, respectful"
      forms:
        "possessive: my, your …": "আপনার"
        "object: me, to me …": "আপনাকে"
      readings:
        "possessive: my, your …": "apnar"
        "object: me, to me …": "apnake"
    - lemma: "সে"
      key: she
      reading: "she"
      gloss: "he or she"
      forms:
        "possessive: my, your …": "তার"
        "object: me, to me …": "তাকে"
      readings:
        "possessive: my, your …": "tar"
        "object: me, to me …": "take"
    - lemma: "তিনি"
      key: tini
      reading: "tini"
      gloss: "he or she, respectful"
      forms:
        "possessive: my, your …": "তাঁর"
        "object: me, to me …": "তাঁকে"
      readings:
        "possessive: my, your …": "tanr"
        "object: me, to me …": "tanke"
    - lemma: "আমরা"
      key: amra
      reading: "amra"
      gloss: "we"
      forms:
        "possessive: my, your …": "আমাদের"
        "object: me, to me …": "আমাদের"
