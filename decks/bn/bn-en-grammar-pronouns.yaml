        "object: me, to me …": "তোকে"
      readings:
        "possessive: my, your …": "tor"
        "object: me, to me …": "toke"
      ipas:
        "possessive: my, your …": "t̪or"
        "object: me, to me …": "t̪oke"
    - lemma: "তুমি"
      key: tumi
      reading: "tumi"
      ipa: "t̪umi"
      gloss: "you, familiar"
