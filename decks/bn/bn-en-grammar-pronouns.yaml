schema: 1
id: bn-en-grammar-pronouns
name: "Pronouns and possessives"
kind: grammar
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I, you, he and she, here, over there and not present, with my and your, and me and you as objects."
tags: [beginner, grammar]
pattern:
  name: "Personal pronouns"
  slot_name: "form"
  slots: ["possessive: my, your …", "object: me, to me …"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Bengali has three words for 'you': আপনি (respectful), তুমি (familiar) and তুই (intimate). 'He or she' depends on where the person is: এ for someone here, ও for someone over there, সে for someone not present. Their respectful forms are ইনি, উনি and তিনি, and their plurals এরা, ওরা and তারা. A possessive never changes for the thing owned: আমার বই, আমার বাড়ি. In the plural, the object is usually the same as the possessive: আমাদের, or with -কে, আমাদেরকে. In speech এঁর and ওঁর are often এনার and ওনার: ওনার বাড়ি, and এঁকে and ওঁকে are এনাকে and ওনাকে; the drill accepts both."
  entries:
    - lemma: "আমি"
      key: ami
      gloss: "I"
      forms:
        "possessive: my, your …": "আমার"
        "object: me, to me …": "আমাকে"
    - lemma: "তুই"
      key: tui
      gloss: "you, intimate"
      forms:
        "possessive: my, your …": "তোর"
        "object: me, to me …": "তোকে"
    - lemma: "তুমি"
      key: tumi
      gloss: "you, familiar"
      forms:
        "possessive: my, your …": "তোমার"
        "object: me, to me …": "তোমাকে"
    - lemma: "আপনি"
      key: apni
      gloss: "you, respectful"
      forms:
        "possessive: my, your …": "আপনার"
        "object: me, to me …": "আপনাকে"
    - lemma: "সে"
      key: she
      gloss: "he or she"
      forms:
        "possessive: my, your …": "তার"
        "object: me, to me …": "তাকে"
    - lemma: "তিনি"
      key: tini
      gloss: "he or she, respectful"
      forms:
        "possessive: my, your …": "তাঁর"
        "object: me, to me …": "তাঁকে"
    - lemma: "আমরা"
      key: amra
      gloss: "we"
      forms:
        "possessive: my, your …": "আমাদের"
        "object: me, to me …": "আমাদের"
    - lemma: "তোমরা"
      key: tomra
      gloss: "you all, familiar"
      forms:
        "possessive: my, your …": "তোমাদের"
        "object: me, to me …": "তোমাদের"
    - lemma: "ওরা"
      key: ora
      gloss: "they, over there"
      forms:
        "possessive: my, your …": "ওদের"
        "object: me, to me …": "ওদের"
    - lemma: "এ"
      key: e
      gloss: "he or she, here, familiar"
      forms:
        "possessive: my, your …": "এর"
        "object: me, to me …": "একে"
    - lemma: "ও"
      key: o
      gloss: "he or she, over there, familiar"
      forms:
        "possessive: my, your …": "ওর"
        "object: me, to me …": "ওকে"
    - lemma: "ইনি"
      key: ini
      gloss: "he or she, here, respectful"
      forms:
        "possessive: my, your …": ["এঁর", "এনার"]
        "object: me, to me …": ["এঁকে", "এনাকে"]
    - lemma: "উনি"
      key: uni
      gloss: "he or she, over there, respectful"
      forms:
        "possessive: my, your …": ["ওঁর", "ওনার"]
        "object: me, to me …": ["ওঁকে", "ওনাকে"]
    - lemma: "তোরা"
      key: tora
      gloss: "you all, intimate"
      forms:
        "possessive: my, your …": "তোদের"
        "object: me, to me …": "তোদের"
    - lemma: "আপনারা"
      key: apnara
      gloss: "you all, respectful"
      forms:
        "possessive: my, your …": "আপনাদের"
        "object: me, to me …": "আপনাদের"
    - lemma: "এরা"
      key: era
      gloss: "they, here"
      forms:
        "possessive: my, your …": "এদের"
        "object: me, to me …": "এদের"
    - lemma: "তারা"
      key: tara
      gloss: "they, not present"
      forms:
        "possessive: my, your …": "তাদের"
        "object: me, to me …": "তাদের"
    - lemma: "তাঁরা"
      key: tanra
      gloss: "they, respectful"
      forms:
        "possessive: my, your …": "তাঁদের"
        "object: me, to me …": "তাঁদের"
