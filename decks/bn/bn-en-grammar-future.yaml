        "তুই / তোরা": "খাবি"
        "তুমি / তোমরা": "খাবে"
        "আপনি / আপনারা": "খাবেন"
        "সে / তারা": "খাবে"
        "তিনি / তাঁরা": "খাবেন"
      readings:
        "আমি / আমরা": ["khābo", "khābo"]
        "তুই / তোরা": "khābi"
        "তুমি / তোমরা": "khābe"
        "আপনি / আপনারা": "khāben"
        "সে / তারা": "khābe"
        "তিনি / তাঁরা": "khāben"
