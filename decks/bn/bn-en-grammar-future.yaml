        "তুই / তোরা": "বলবি"
        "তুমি / তোমরা": "বলবে"
        "আপনি / আপনারা": "বলবেন"
        "সে / তারা": "বলবে"
        "তিনি / তাঁরা": "বলবেন"
      readings:
        "আমি / আমরা": ["bôlbo", "bôlbo"]
        "তুই / তোরা": "bôlbi"
        "তুমি / তোমরা": "bôlbe"
        "আপনি / আপনারা": "bôlben"
        "সে / তারা": "bôlbe"
        "তিনি / তাঁরা": "bôlben"
      ipas:
        "আমি / আমরা": "bɔlbo"
        "তুই / তোরা": "bɔlbi"
        "তুমি / তোমরা": "bɔlbe"
