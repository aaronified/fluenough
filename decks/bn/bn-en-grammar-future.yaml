schema: 1
id: bn-en-grammar-future
name: "Future tense"
kind: grammar
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I will do, you will go."
tags: [beginner, grammar]
pattern:
  name: "Future"
  slot_name: "person and respect"
  slots: ["আমি / আমরা", "তুই / তোরা", "তুমি / তোমরা", "আপনি / আপনারা", "সে / তারা", "তিনি / তাঁরা"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The verb changes for person and for respect, never for gender or number: আমি and আমরা take the same form. The endings are -ব, -বি, -বে, -বেন. Some writers add the o: করবো, যাবো, and both are accepted."
  entries:
    - lemma: "করা"
      key: kora
      reading: "kôrā"
      ipa: "kɔra"
      gloss: "to do"
      forms:
        "আমি / আমরা": ["করব", "করবো"]
        "তুই / তোরা": "করবি"
        "তুমি / তোমরা": "করবে"
        "আপনি / আপনারা": "করবেন"
        "সে / তারা": "করবে"
        "তিনি / তাঁরা": "করবেন"
      readings:
        "আমি / আমরা": ["kôrbo", "kôrbo"]
        "তুই / তোরা": "kôrbi"
        "তুমি / তোমরা": "kôrbe"
        "আপনি / আপনারা": "kôrben"
        "সে / তারা": "kôrbe"
        "তিনি / তাঁরা": "kôrben"
      ipas:
        "আমি / আমরা": "kɔrbo"
        "তুই / তোরা": "kɔrbi"
        "তুমি / তোমরা": "kɔrbe"
        "আপনি / আপনারা": "kɔrben"
        "সে / তারা": "kɔrbe"
        "তিনি / তাঁরা": "kɔrben"
    - lemma: "যাওয়া"
      key: jaoa
      reading: "jāoā"
      ipa: "dʒaoa"
      gloss: "to go"
      forms:
        "আমি / আমরা": ["যাব", "যাবো"]
        "তুই / তোরা": "যাবি"
        "তুমি / তোমরা": "যাবে"
        "আপনি / আপনারা": "যাবেন"
        "সে / তারা": "যাবে"
        "তিনি / তাঁরা": "যাবেন"
      readings:
        "আমি / আমরা": ["jābo", "jābo"]
        "তুই / তোরা": "jābi"
        "তুমি / তোমরা": "jābe"
        "আপনি / আপনারা": "jāben"
        "সে / তারা": "jābe"
        "তিনি / তাঁরা": "jāben"
      ipas:
        "আমি / আমরা": "dʒabo"
        "তুই / তোরা": "dʒabi"
        "তুমি / তোমরা": "dʒabe"
        "আপনি / আপনারা": "dʒaben"
        "সে / তারা": "dʒabe"
        "তিনি / তাঁরা": "dʒaben"
