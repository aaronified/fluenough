schema: 1
id: bn-en-grammar-future
name: "Future tense"
kind: grammar
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I will do, you will go."
tags: [beginner, grammar]
pattern:
  name: "Future"
  slot_name: "person and respect"
  slots: ["আমি / আমরা", "তুই / তোরা", "তুমি / তোমরা", "আপনি / আপনারা", "সে / তারা", "তিনি / তাঁরা"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The verb changes for person and for respect, never for gender or number: আমি and আমরা take the same form. The endings are -ব, -বি, -বে, -বেন. Some writers add the o: করবো, যাবো, and both are accepted."
  entries:
    - lemma: "করা"
      key: kora
      reading: "kora"
      gloss: "to do"
      forms:
        "আমি / আমরা": ["করব", "করবো"]
        "তুই / তোরা": "করবি"
        "তুমি / তোমরা": "করবে"
        "আপনি / আপনারা": "করবেন"
        "সে / তারা": "করবে"
        "তিনি / তাঁরা": "করবেন"
      readings:
        "আমি / আমরা": ["korbo", "korbo"]
        "তুই / তোরা": "korbi"
        "তুমি / তোমরা": "korbe"
        "আপনি / আপনারা": "korben"
        "সে / তারা": "korbe"
        "তিনি / তাঁরা": "korben"
    - lemma: "যাওয়া"
      key: jaoa
      reading: "jaoa"
      gloss: "to go"
      forms:
        "আমি / আমরা": ["যাব", "যাবো"]
        "তুই / তোরা": "যাবি"
        "তুমি / তোমরা": "যাবে"
        "আপনি / আপনারা": "যাবেন"
        "সে / তারা": "যাবে"
        "তিনি / তাঁরা": "যাবেন"
      readings:
        "আমি / আমরা": ["jabo", "jabo"]
        "তুই / তোরা": "jabi"
        "তুমি / তোমরা": "jabe"
        "আপনি / আপনারা": "jaben"
        "সে / তারা": "jabe"
        "তিনি / তাঁরা": "jaben"
    - lemma: "খাওয়া"
      key: khaoa
      reading: "khaoa"
      gloss: "to eat"
      forms:
        "আমি / আমরা": ["খাব", "খাবো"]
        "তুই / তোরা": "খাবি"
        "তুমি / তোমরা": "খাবে"
        "আপনি / আপনারা": "খাবেন"
        "সে / তারা": "খাবে"
        "তিনি / তাঁরা": "খাবেন"
      readings:
        "আমি / আমরা": ["khabo", "khabo"]
        "তুই / তোরা": "khabi"
        "তুমি / তোমরা": "khabe"
        "আপনি / আপনারা": "khaben"
        "সে / তারা": "khabe"
        "তিনি / তাঁরা": "khaben"
    - lemma: "বলা"
      key: bola
      reading: "bola"
      gloss: "to say"
      forms:
        "আমি / আমরা": ["বলব", "বলবো"]
        "তুই / তোরা": "বলবি"
        "তুমি / তোমরা": "বলবে"
        "আপনি / আপনারা": "বলবেন"
        "সে / তারা": "বলবে"
        "তিনি / তাঁরা": "বলবেন"
      readings:
        "আমি / আমরা": ["bolbo", "bolbo"]
        "তুই / তোরা": "bolbi"
        "তুমি / তোমরা": "bolbe"
        "আপনি / আপনারা": "bolben"
        "সে / তারা": "bolbe"
        "তিনি / তাঁরা": "bolben"
