cards:
  - id: bn-0302
    target: "… কোথায়?"
    native: "Where is …?"
    reading: "... kothāy?"
    ipa: "kot̪ʰaj"
    pos: "phrase"
    notes: "Put the place first: স্টেশনটা কোথায়? Where's the station?"
  - id: bn-0303
    target: "ডান"
    native: "right (side)"
    reading: "ḍān"
    ipa: "ɖan"
    pos: "adj"
    notes: "ডান দিকে (ḍān dike), to the right."
  - id: bn-0304
    target: "বাঁ"
    native: "left (side)"
    reading: "bām̐"
    ipa: "bã"
    alt_target: ["বাম"]
    pos: "adj"
    notes: "বাঁ দিকে (bām̐ dike), to the left. Also বাম (bām)."
  - id: bn-0305
    target: "সোজা"
    native: "straight on"
    reading: "śojā"
    ipa: "ʃodʒa"
    pos: "adv"
  - id: bn-0306
    target: "ঘুরুন"
    native: "please turn"
    reading: "ghurun"
    ipa: "ɡʱurun"
    pos: "verb"
    tags: ["polite"]
    notes: "ডান দিকে ঘুরুন, turn right."
  - id: bn-0307
    target: "সামনে"
    native: "ahead; in front"
    reading: "śāmne"
    ipa: "ʃamne"
    pos: "adv"
  - id: bn-0308
    target: "পিছনে"
