    target: "ওখানে"
    native: "there"
    reading: "okhāne"
    ipa: "okʰane"
    pos: "adv"
  - id: bn-0313
    target: "রাস্তা"
    native: "road; street"
    reading: "rāstā"
    ipa: "rast̪a"
    pos: "noun"
  - id: bn-0314
    target: "মোড়"
    native: "crossing; corner"
    reading: "moṛ"
    ipa: "moɽ"
    pos: "noun"
    notes: "Directions are often given by crossings: শ্যামবাজার মোড়, the Shyambazar crossing in Kolkata."
