    ipa: "pitʃʰone"
    alt_target: ["পেছনে"]
    pos: "adv"
  - id: bn-0309
    target: "কাছে"
    native: "near"
    reading: "kāche"
    ipa: "katʃʰe"
    pos: "adv"
    notes: "স্টেশনের কাছে, near the station."
  - id: bn-0310
    target: "দূরে"
    native: "far"
    reading: "dure"
    ipa: "d̪ure"
    pos: "adv"
    notes: "কত দূর? How far is it?"
  - id: bn-0311
