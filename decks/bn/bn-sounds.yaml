# Bengali's sound contrasts: pairs of letters or signs that change a word,
# for the speaking drill's feedback (#89) and the minimal-pair drill (#31).
# Each id is the tag the language's sound-differences deck uses. See
# ADR-0015 and docs/DECK-FORMAT.md.
schema: 1
kind: "sounds"
part: "core"
id: "bn-sounds"
language: "bn"
contrasts:
  - id: "aspiration"
    pairs: [["ক", "খ"], ["গ", "ঘ"], ["চ", "ছ"], ["জ", "ঝ"], ["ট", "ঠ"], ["ড", "ঢ"], ["ত", "থ"], ["দ", "ধ"], ["প", "ফ"], ["ব", "ভ"], ["ড়", "ঢ়"]]
  - id: "dental-retroflex"
    pairs: [["ত", "ট"], ["থ", "ঠ"], ["দ", "ড"], ["ধ", "ঢ"]]
  - id: "inherent-vowel"
    within_word: true
    pairs: [["", "া"]]
  - id: "nasal"
    pairs: [["", "ঁ"]]
  - id: "flap"
    pairs: [["ড", "ড়"], ["ঢ", "ঢ়"], ["ড়", "র"]]
