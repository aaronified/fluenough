# Bengali's sound contrasts: pairs of letters or signs that change a word,
# for the speaking drill's feedback (#89) and the minimal-pair drill (#31).
# Each id is the tag the language's sound-differences deck uses. See
# ADR-0015 and docs/DECK-FORMAT.md.
schema: 1
kind: sounds
id: bn-sounds
language: bn
contrasts:
  - id: aspiration
    name: "a breath after the consonant"
    pairs: [["ক", "খ"], ["গ", "ঘ"], ["চ", "ছ"], ["জ", "ঝ"], ["ট", "ঠ"], ["ড", "ঢ"], ["ত", "থ"], ["দ", "ধ"], ["প", "ফ"], ["ব", "ভ"]]
  - id: dental-retroflex
    name: "the tongue on the teeth or curled back"
    pairs: [["ত", "ট"], ["থ", "ঠ"], ["দ", "ড"], ["ধ", "ঢ"]]
  - id: inherent-vowel
    name: "the open o against a"
    within_word: true
    pairs: [["", "া"]]
  - id: nasal
    name: "a vowel said through the nose"
    pairs: [["", "ঁ"]]
  - id: flap
    name: "the flapped r (ড়) against d or r"
    pairs: [["ড", "ড়"], ["ড়", "র"]]
