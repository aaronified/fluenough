- id: "bn-a-busy-day"
  title: "A busy day"
  theme: "daily-life"
  sentences:
  - text: "আমি সকালে উঠি।"
    reading: "āmi śôkāle uṭhi."
    ipa: "ami ʃɔkale uʈʰi"
  - text: "দুপুরে আমি বাইরে বেরোই।"
    reading: "dupure āmi bāire beroi."
    ipa: "d̪upure ami baire beroi"
  - text: "বিকেলে বন্ধুকে বাড়িটা দেখাই।"
    reading: "bikele bondhuke bāṛiṭā dekhāi."
    ipa: "bikele bond̪ʱuke baɽiʈa d̪ekʰai"
  - text: "রাতে আমি বাতিটা নেভাই।"
    reading: "rāte āmi bātiṭā nebhāi."
    ipa: "rat̪e ami bat̪iʈa nebʱai"
  - text: "আমি চা খাই।"
    reading: "āmi cā khāi."
    ipa: "ami tʃa kʰai"
  questions:
  - id: "bn-5468"
    prompt:
      en: "The speaker goes out at midday."
    answer: true
  - id: "bn-5469"
    prompt:
      en: "What does the speaker switch off at night?"
    options:
    - en: "বাতি (bāti)"
    - en: "জানালা (jānālā)"
    answer: 1
  - id: "bn-5470"
    prompt:
      en: "The speaker shows a friend the house."
    answer: true
- id: "bn-diary-entry"
  title: "A diary entry"
  theme: "verbs-3"
  sentences:
  - text: "আজ সোমবার।"
    reading: "āj śombār."
    ipa: "adʒ ʃombar"
  - text: "দুপুরে আমি অফিসে যাই।"
    reading: "dupure āmi ôphise jāi."
    ipa: "d̪upure ami ɔpʰise dʒai"
  - text: "বিকেলে আমি বাতি জ্বালাই।"
    reading: "bikele āmi bāti jālāi."
    ipa: "bikele ami bat̪i dʒalai"
  - text: "রাতে আমি বই পড়ি।"
    reading: "rāte āmi boi poṛi."
    ipa: "rat̪e ami boi poɽi"
  - text: "কাল আমি আবার চা খাব।"
    reading: "kāl āmi ābār cā khābo."
    ipa: "kal ami abar tʃa kʰabo"
