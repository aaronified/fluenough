schema: 1
id: bn-en-grammar-questions
name: "Basic questions"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Yes/no questions and question words, with the word order unchanged."
tags: [beginner, grammar]
cards:
  - id: bn-0171
    target: "আপনি কি বাংলা বলেন?"
    native: "Do you speak Bengali?"
    reading: "āpni ki bāṅlā bôlen?"
    ipa: "apni ki baŋla bɔlen"
    pos: "phrase"
    notes: "কি after the subject makes a yes/no question."
  - id: bn-0172
    target: "আপনি চা খাবেন?"
    native: "Will you have tea?"
    reading: "āpni cā khāben?"
    ipa: "apni tʃa kʰaben"
    pos: "phrase"
    notes: "The voice rising at the end is enough to make a question."
  - id: bn-0173
    target: "এটা কী?"
    native: "What is this?"
    reading: "eṭā ki?"
    ipa: "eʈa ki"
    pos: "phrase"
    notes: "The question word goes where the answer would: এটা বই → এটা কী?"
  - id: bn-0174
    target: "আপনি কোথায় যাচ্ছেন?"
    native: "Where are you going?"
    reading: "āpni kothāy jācchen?"
    ipa: "apni kot̪ʰaj dʒatʃtʃʰen"
    pos: "phrase"
  - id: bn-0175
    target: "উনি কে?"
    native: "Who is he? / Who is she?"
    reading: "uni ke?"
    ipa: "uni ke"
    pos: "phrase"
    notes: "উনি is the respectful 'he or she' for someone over there; ইনি is for someone right here. তিনি, for someone not present, is more common in writing."
  - id: bn-0176
    target: "আপনি কখন আসবেন?"
    native: "When will you come?"
    reading: "āpni kôkhon āśben?"
    ipa: "apni kɔkʰon aʃben"
    pos: "phrase"
  - id: bn-0177
    target: "আপনি বাংলা কেন শিখছেন?"
    native: "Why are you learning Bengali?"
    reading: "āpni bāṅlā keno śikhchen?"
    ipa: "apni baŋla keno ʃikʰtʃʰen"
    pos: "phrase"
  - id: bn-0178
    target: "আপনার কটি ছেলেমেয়ে?"
    native: "How many children do you have?"
    reading: "āpnār koṭi chelemeye?"
    ipa: "apnar koʈi tʃʰelemeje"
    pos: "phrase"
    notes: "ছেলেমেয়ে, 'sons and daughters', is 'children'."
  - id: bn-0179
    target: "কেমন লাগল?"
    native: "How was it? Did you like it?"
    reading: "kemon lāglo?"
    ipa: "kemon laɡlo"
    pos: "phrase"
  - id: bn-0180
    target: "ভালো, তাই না?"
    native: "It's good, isn't it?"
    reading: "bhālo, tāi nā?"
    ipa: "bʱalo t̪ai na"
    pos: "phrase"
    notes: "তাই না? at the end asks for agreement."
