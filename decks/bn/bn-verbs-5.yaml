cards:
  - id: "bn-4480"
    target: "জোড়ানো"
    reading: "joṛāno"
    ipa: "dʒoɽano"
    pos: "verb"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "জোড়ানো", reading: "joṛāno" }] }
    examples:
      - { target: "সে দুটো তার জোড়াল।", reading: "se duṭo tār joṛāl.", ipa: "se d̪uʈo t̪ar dʒoɽal", bases: [{ word: "সে", ref: "bn-0839" }, { word: "দুটো", base: "দুটো", reading: "duṭo" }, { word: "তার", ref: "bn-3275" }, { word: "জোড়াল", base: "জোড়ানো", reading: "joṛāl" }] }
      - { target: "ভাঙা কাপটা জোড়ানো যাবে?", reading: "bhāṅā kāpoṭā joṛāno jābe?", ipa: "bʱaŋa kapoʈa dʒoɽano dʒabe", bases: [{ word: "ভাঙা", ref: "bn-1102" }, { word: "কাপটা", base: "কাপ", reading: "kāpoṭā" }, { word: "জোড়ানো", base: "জোড়ানো", reading: "joṛāno" }, { word: "যাবে", ref: "bn-0873" }] }
  - id: "bn-4481"
    target: "ভাঙানো"
    reading: "bhāṅāno"
    ipa: "bʱaŋano"
    pos: "verb"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "ভাঙানো", reading: "bhāṅāno" }] }
    examples:
      - { target: "এক শো টাকা ভাঙাল।", reading: "ek śo ṭākā bhāṅāl.", ipa: "ek ʃo ʈaka bʱaŋal", bases: [{ word: "এক", ref: "bn-0202" }, { word: "শো", base: "শো", reading: "śo" }, { word: "টাকা", ref: "bn-0245" }, { word: "ভাঙাল", base: "ভাঙানো", reading: "bhāṅāl" }] }
      - { target: "পাঁচ টাকার খুচরো ভাঙিয়ে দাও।", reading: "pām̐c ṭākār khucoro bhāṅiye dāo.", ipa: "pãtʃ ʈakar kʰutʃoro bʱaŋije d̪ao", bases: [{ word: "খুচরো", ref: "bn-0246" }, { word: "ভাঙিয়ে", base: "ভাঙানো", reading: "bhāṅiye" }, { word: "দাও", ref: "bn-0888" }] }
  - id: "bn-4482"
    target: "মেলানো"
    reading: "melāno"
    ipa: "melano"
    pos: "verb"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "মেলানো", reading: "melāno" }] }
    examples:
      - { target: "সে হিসাবটা মেলাল।", reading: "se hisāboṭā melāl.", ipa: "se ɦisaboʈa melal", bases: [{ word: "সে", ref: "bn-0839" }, { word: "হিসাবটা", ref: "bn-1720" }, { word: "মেলাল", base: "মেলানো", reading: "melāl" }] }
      - { target: "ছবির সঙ্গে মেলাও।", reading: "chobir sôṅge melāo.", ipa: "tʃʰobir sɔŋɡe melao", bases: [{ word: "ছবির", ref: "bn-1145" }, { word: "সঙ্গে", ref: "bn-0296" }, { word: "মেলাও", base: "মেলানো", reading: "melāo" }] }
  - id: "bn-4483"
