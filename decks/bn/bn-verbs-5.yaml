    examples:
      - { target: "আমি ডাক্তার ডাকালাম।", reading: "āmi ḍāktār ḍākālām.", ipa: "ami ɖakt̪ar ɖakalam", bases: [{ word: "আমি", ref: "bn-0833" }, { word: "ডাক্তার", ref: "bn-0376" }, { word: "ডাকালাম", base: "ডাকানো", reading: "ḍākālām" }] }
