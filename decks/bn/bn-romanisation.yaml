# How Bengali readings are written, and the spellings a learner may type for
# the same sound, which grading treats as one (#47). The first spelling of
# each group is the one the decks use. o and a are not a group: Bengalis type
# the inherent vowel as the o it is said as, and কল (kol) and কাল (kal) are
# different words. See "Romanisation" in docs/DECK-FORMAT.md. Not yet checked
# by a Bengali speaker: please report any mistake.
schema: 1
kind: romanisation
id: bn-romanisation
language: bn
scheme: "Based on ISO 15919's letters, spelled as said, and departing from the standard where a learner is better served (ADR-0025; the README lists the departures): ā for আ; ô for the inherent vowel where it is said [ɔ] and o where it is said [o] (kôthā, kôlkātā), and nothing where it is silent (nām); i and u for both the short and the long vowel, which Bengali says alike; e, and ê where এ is said [æ]; oi and ou for ঐ and ঔ; ṭ ṭh ḍ ḍh for the retroflex row and t th d dh for the row on the teeth; n for ন and ণ, said alike; c ch j jh for চ ছ জ ঝ, and j for য; ś for শ, ষ and স where they are said sh, and s where said s (strī); b for ব; ṛ for ড় and ঢ়; ṅ for ঙ and ং; y for য়; m̐ for ঁ. A য-ফলা or ব-ফলা is written as said: a held consonant (biddā), or ê after the first consonant (bêbśā). ক্ষ is kkh and জ্ঞ gg, as said. A typed answer needs none of the marks."
standard: "ISO 15919"
# How a reading's letters are typed, read from the left, longest first:
# each reading is spelled so before an answer is compared with it.
typed:
  - ["ṅkh", "nkh"]
  - ["ṅgh", "ngh"]
  - ["ṅk", "nk"]
  - ["ṅg", "ng"]
  - ["ṅ", "ng"]
  - ["ñch", "nchh"]
  - ["ñc", "nch"]
  - ["ñjh", "njh"]
  - ["ñj", "nj"]
  - ["ñ", "ny"]
  - ["cch", "chchh"]
  - ["cc", "chch"]
  - ["ch", "chh"]
  - ["c", "ch"]
  - ["ś", "sh"]
  - ["ṣ", "sh"]
  - ["m̐", "n"]
  - ["ṁ", "n"]
  - ["k͟h", "kh"]
  - ["ê", "ya"]
equivalents:
  - ["i", "ee", "yi"]
  - ["u", "oo"]
  - ["sh", "s"]
  - ["chh", "ch"]
  - ["chchh", "cch"]
  - ["bh", "v"]
  - ["ph", "f"]
  - ["j", "z"]
  - ["oa", "owa", "wa"]
  - ["a", "ya"]
  - ["o", "yo"]
  - ["e", "ye"]
