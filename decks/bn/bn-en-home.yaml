cards:
  - id: bn-0594
    target: "ফ্ল্যাট"
    native: "flat; apartment"
    reading: "phlêṭ"
    ipa: "pʰlæʈ"
    pos: "noun"
    notes: "Where you live now, a flat or a house, is also বাসা (bāśā); বাড়ি (bāṛi) is the house, or the family home."
  - id: bn-0595
    target: "রান্নাঘর"
    native: "kitchen"
    reading: "rānnāghor"
    ipa: "rannaɡʱor"
    pos: "noun"
    notes: "রান্না (rānnā), cooking, and ঘর (ghôr), room."
  - id: bn-0596
    target: "শোয়ার ঘর"
    native: "bedroom"
    reading: "śoyār ghôr"
    ipa: "ʃojar ɡʱɔr"
    alt_target: ["শোবার ঘর"]
    pos: "phrase"
    notes: "'The room for lying down'. Also শোবার ঘর (śobār ghôr)."
  - id: bn-0597
    target: "বসার ঘর"
    native: "living room"
    reading: "bôśār ghôr"
    ipa: "bɔʃar ɡʱɔr"
    pos: "phrase"
    notes: "'The room for sitting'."
  - id: bn-0598
    target: "বাথরুম"
    native: "bathroom"
    reading: "bāthrum"
    ipa: "bat̪ʰrum"
    alt_target: ["স্নানঘর", "গোসলখানা"]
    pos: "noun"
    notes: "Everyone says বাথরুম (bāthrum). The Bengali words are স্নানঘর (snānghor) and গোসলখানা (gośolkhānā)."
  - id: bn-0599
    target: "দরজা"
    native: "door"
    reading: "dôrjā"
    ipa: "d̪ɔrdʒa"
    pos: "noun"
  - id: bn-0600
    target: "জানালা"
    native: "window"
    reading: "jānālā"
    ipa: "dʒanala"
    alt_target: ["জানলা"]
    pos: "noun"
    notes: "In speech also জানলা (jānlā)."
  - id: bn-0601
    target: "বারান্দা"
    native: "balcony; veranda"
    reading: "bārāndā"
    ipa: "barand̪a"
    pos: "noun"
  - id: bn-0602
    target: "ছাদ"
    native: "roof; roof terrace"
    reading: "chād"
    ipa: "tʃʰad̪"
    pos: "noun"
    notes: "Flat roofs are lived on: people dry clothes and fly kites on the ছাদ."
  - id: bn-0603
    target: "সিঁড়ি"
    native: "stairs"
    reading: "śim̐ṛi"
    ipa: "ʃĩɽi"
    pos: "noun"
  - id: bn-0604
    target: "তলা"
    native: "floor; storey"
    reading: "tôlā"
    ipa: "t̪ɔla"
    pos: "noun"
    notes: "Counted from the ground: একতলা (ektolā) is the ground floor, দোতলা (dotolā) the one above. আমি দোতলায় থাকি (āmi dotolāy thāki), I live one floor up."
