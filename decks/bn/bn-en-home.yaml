  - id: bn-0612
    target: "বাড়ির সামনে একটা পার্ক আছে।"
    native: "There's a park in front of the house."
    reading: "bāṛir śāmne ekṭā pārk āche."
    ipa: "baɽir ʃamne ekʈa park atʃʰe"
    pos: "phrase"
    notes: "'In front of the house' is বাড়ির সামনে: the house takes -র, and সামনে comes after it. আছে, 'there is', comes last."
  - id: bn-0613
    target: "আমাদের পাড়াটা খুব শান্ত।"
    native: "Our neighbourhood is very quiet."
    reading: "āmāder pāṛāṭā khub śānto."
    ipa: "amad̪er paɽaʈa kʰub ʃant̪o"
    pos: "phrase"
    notes: "No 'is': 'our neighbourhood very quiet'."
