description: "The rooms of a flat, what is in them, and the neighbourhood around it. Not yet checked by a Bengali speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: bn-0594
    target: "ফ্ল্যাট"
    native: "flat; apartment"
    reading: "phlyat"
    pos: "noun"
    notes: "Where you live now, a flat or a house, is also বাসা (basha); বাড়ি (bari) is the house, or the family home."
  - id: bn-0595
    target: "রান্নাঘর"
    native: "kitchen"
    reading: "rannaghor"
    pos: "noun"
    notes: "রান্না (ranna), cooking, and ঘর (ghor), room."
  - id: bn-0596
    target: "শোয়ার ঘর"
    native: "bedroom"
    reading: "shoyar ghor"
    alt_target: ["শোবার ঘর"]
    pos: "phrase"
    notes: "'The room for lying down'. Also শোবার ঘর (shobar ghor)."
  - id: bn-0597
    target: "বসার ঘর"
    native: "living room"
    reading: "boshar ghor"
    pos: "phrase"
    notes: "'The room for sitting'."
  - id: bn-0598
    target: "বাথরুম"
    native: "bathroom"
    reading: "bathrum"
    alt_target: ["স্নানঘর", "গোসলখানা"]
    pos: "noun"
    notes: "Everyone says বাথরুম (bathrum). The Bengali words are স্নানঘর (snanghor) and গোসলখানা (gosholkhana)."
  - id: bn-0599
    target: "দরজা"
    native: "door"
    reading: "dorja"
    pos: "noun"
  - id: bn-0600
    target: "জানালা"
    native: "window"
    reading: "janala"
    alt_target: ["জানলা"]
    pos: "noun"
    notes: "In speech also জানলা (janla)."
  - id: bn-0601
    target: "বারান্দা"
    native: "balcony; veranda"
    reading: "baranda"
    pos: "noun"
  - id: bn-0602
    target: "ছাদ"
    native: "roof; roof terrace"
    reading: "chhad"
    pos: "noun"
    notes: "Flat roofs are lived on: people dry clothes and fly kites on the ছাদ."
  - id: bn-0603
    target: "সিঁড়ি"
    native: "stairs"
    reading: "shinri"
    pos: "noun"
  - id: bn-0604
    target: "তলা"
    native: "floor; storey"
    reading: "tola"
    pos: "noun"
    notes: "Counted from the ground: একতলা (ektola) is the ground floor, দোতলা (dotola) the one above. আমি দোতলায় থাকি (ami dotolay thaki), I live one floor up."
