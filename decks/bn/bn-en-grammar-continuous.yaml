schema: 1
id: bn-en-grammar-continuous
name: "Present continuous"
kind: grammar
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I am doing, she is going: what is happening now."
tags: [beginner, grammar]
pattern:
  name: "Present continuous"
  slot_name: "person and respect"
  slots: ["আমি / আমরা", "তুই / তোরা", "তুমি / তোমরা", "আপনি / আপনারা", "সে / তারা", "তিনি / তাঁরা"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The verb changes for person and for respect, never for gender or number: আমি and আমরা take the same form. The endings are -ছি, -ছিস, -ছো, -ছেন, -ছে; a stem ending in a vowel takes -চ্ছ-: যাচ্ছি. করছো is also written করছ, and both are accepted."
  entries:
    - lemma: "করা"
      key: kora
      reading: "kora"
      gloss: "to do"
      forms:
        "আমি / আমরা": "করছি"
        "তুই / তোরা": "করছিস"
        "তুমি / তোমরা": ["করছো", "করছ"]
        "আপনি / আপনারা": "করছেন"
        "সে / তারা": "করছে"
        "তিনি / তাঁরা": "করছেন"
      readings:
        "আমি / আমরা": "korchhi"
        "তুই / তোরা": "korchhish"
        "তুমি / তোমরা": ["korchho", "korchho"]
        "আপনি / আপনারা": "korchhen"
        "সে / তারা": "korchhe"
        "তিনি / তাঁরা": "korchhen"
    - lemma: "যাওয়া"
      key: jaoa
      reading: "jaoa"
      gloss: "to go"
      forms:
        "আমি / আমরা": "যাচ্ছি"
        "তুই / তোরা": "যাচ্ছিস"
        "তুমি / তোমরা": ["যাচ্ছো", "যাচ্ছ"]
        "আপনি / আপনারা": "যাচ্ছেন"
        "সে / তারা": "যাচ্ছে"
        "তিনি / তাঁরা": "যাচ্ছেন"
      readings:
        "আমি / আমরা": "jachchhi"
        "তুই / তোরা": "jachchhish"
        "তুমি / তোমরা": ["jachchho", "jachchho"]
        "আপনি / আপনারা": "jachchhen"
        "সে / তারা": "jachchhe"
        "তিনি / তাঁরা": "jachchhen"
    - lemma: "খাওয়া"
      key: khaoa
      reading: "khaoa"
      gloss: "to eat"
      forms:
        "আমি / আমরা": "খাচ্ছি"
        "তুই / তোরা": "খাচ্ছিস"
        "তুমি / তোমরা": ["খাচ্ছো", "খাচ্ছ"]
        "আপনি / আপনারা": "খাচ্ছেন"
        "সে / তারা": "খাচ্ছে"
        "তিনি / তাঁরা": "খাচ্ছেন"
      readings:
        "আমি / আমরা": "khachchhi"
        "তুই / তোরা": "khachchhish"
        "তুমি / তোমরা": ["khachchho", "khachchho"]
        "আপনি / আপনারা": "khachchhen"
        "সে / তারা": "khachchhe"
        "তিনি / তাঁরা": "khachchhen"
    - lemma: "বলা"
      key: bola
      reading: "bola"
      gloss: "to say"
      forms:
        "আমি / আমরা": "বলছি"
        "তুই / তোরা": "বলছিস"
        "তুমি / তোমরা": ["বলছো", "বলছ"]
        "আপনি / আপনারা": "বলছেন"
        "সে / তারা": "বলছে"
        "তিনি / তাঁরা": "বলছেন"
      readings:
        "আমি / আমরা": "bolchhi"
        "তুই / তোরা": "bolchhish"
        "তুমি / তোমরা": ["bolchho", "bolchho"]
        "আপনি / আপনারা": "bolchhen"
        "সে / তারা": "bolchhe"
        "তিনি / তাঁরা": "bolchhen"
