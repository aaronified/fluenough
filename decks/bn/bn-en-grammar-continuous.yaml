schema: 1
id: bn-en-grammar-continuous
name: "Present continuous"
kind: grammar
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I am doing, she is going: what is happening now."
tags: [beginner, grammar]
pattern:
  name: "Present continuous"
  slot_name: "person and respect"
  slots: ["আমি / আমরা", "তুই / তোরা", "তুমি / তোমরা", "আপনি / আপনারা", "সে / তারা", "তিনি / তাঁরা"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The verb changes for person and for respect, never for gender or number: আমি (āmi) and আমরা (āmorā) take the same form. The endings are -ছি (-chi), -ছিস (-chis), -ছো (-cho), -ছেন (-chen), -ছে (-che); a stem ending in a vowel takes -চ্ছ- (-cch-): যাচ্ছি (jācchi). করছো (kôrocho) is also written করছ (kôroch), and both are accepted."
  entries:
    - lemma: "করা"
      key: kora
      reading: "kôrā"
      ipa: "kɔra"
      gloss: "to do"
      forms:
        "আমি / আমরা": "করছি"
        "তুই / তোরা": "করছিস"
        "তুমি / তোমরা": ["করছো", "করছ"]
        "আপনি / আপনারা": "করছেন"
        "সে / তারা": "করছে"
        "তিনি / তাঁরা": "করছেন"
      readings:
        "আমি / আমরা": "kôrchi"
        "তুই / তোরা": "kôrchiś"
        "তুমি / তোমরা": ["kôrcho", "kôrcho"]
        "আপনি / আপনারা": "kôrchen"
        "সে / তারা": "kôrche"
        "তিনি / তাঁরা": "kôrchen"
      ipas:
        "আমি / আমরা": "kɔrtʃʰi"
        "তুই / তোরা": "kɔrtʃʰiʃ"
        "তুমি / তোমরা": "kɔrtʃʰo"
        "আপনি / আপনারা": "kɔrtʃʰen"
        "সে / তারা": "kɔrtʃʰe"
        "তিনি / তাঁরা": "kɔrtʃʰen"
    - lemma: "যাওয়া"
      key: jaoa
      reading: "jāoā"
      ipa: "dʒaoa"
      gloss: "to go"
      forms:
        "আমি / আমরা": "যাচ্ছি"
        "তুই / তোরা": "যাচ্ছিস"
        "তুমি / তোমরা": ["যাচ্ছো", "যাচ্ছ"]
        "আপনি / আপনারা": "যাচ্ছেন"
        "সে / তারা": "যাচ্ছে"
        "তিনি / তাঁরা": "যাচ্ছেন"
      readings:
        "আমি / আমরা": "jācchi"
        "তুই / তোরা": "jācchiś"
        "তুমি / তোমরা": ["jāccho", "jāccho"]
        "আপনি / আপনারা": "jācchen"
        "সে / তারা": "jācche"
        "তিনি / তাঁরা": "jācchen"
      ipas:
        "আমি / আমরা": "dʒatʃtʃʰi"
        "তুই / তোরা": "dʒatʃtʃʰiʃ"
        "তুমি / তোমরা": "dʒatʃtʃʰo"
        "আপনি / আপনারা": "dʒatʃtʃʰen"
        "সে / তারা": "dʒatʃtʃʰe"
        "তিনি / তাঁরা": "dʒatʃtʃʰen"
    - lemma: "খাওয়া"
      key: khaoa
      reading: "khāoā"
      ipa: "kʰaoa"
      gloss: "to eat"
      forms:
        "আমি / আমরা": "খাচ্ছি"
        "তুই / তোরা": "খাচ্ছিস"
        "তুমি / তোমরা": ["খাচ্ছো", "খাচ্ছ"]
        "আপনি / আপনারা": "খাচ্ছেন"
        "সে / তারা": "খাচ্ছে"
        "তিনি / তাঁরা": "খাচ্ছেন"
      readings:
        "আমি / আমরা": "khācchi"
        "তুই / তোরা": "khācchiś"
        "তুমি / তোমরা": ["khāccho", "khāccho"]
        "আপনি / আপনারা": "khācchen"
        "সে / তারা": "khācche"
        "তিনি / তাঁরা": "khācchen"
      ipas:
        "আমি / আমরা": "kʰatʃtʃʰi"
        "তুই / তোরা": "kʰatʃtʃʰiʃ"
        "তুমি / তোমরা": "kʰatʃtʃʰo"
        "আপনি / আপনারা": "kʰatʃtʃʰen"
        "সে / তারা": "kʰatʃtʃʰe"
        "তিনি / তাঁরা": "kʰatʃtʃʰen"
    - lemma: "বলা"
      key: bola
      reading: "bôlā"
      ipa: "bɔla"
      gloss: "to say"
      forms:
        "আমি / আমরা": "বলছি"
        "তুই / তোরা": "বলছিস"
        "তুমি / তোমরা": ["বলছো", "বলছ"]
        "আপনি / আপনারা": "বলছেন"
        "সে / তারা": "বলছে"
        "তিনি / তাঁরা": "বলছেন"
      readings:
        "আমি / আমরা": "bôlchi"
        "তুই / তোরা": "bôlchiś"
        "তুমি / তোমরা": ["bôlcho", "bôlcho"]
        "আপনি / আপনারা": "bôlchen"
        "সে / তারা": "bôlche"
        "তিনি / তাঁরা": "bôlchen"
      ipas:
        "আমি / আমরা": "bɔltʃʰi"
        "তুই / তোরা": "bɔltʃʰiʃ"
        "তুমি / তোমরা": "bɔltʃʰo"
        "আপনি / আপনারা": "bɔltʃʰen"
        "সে / তারা": "bɔltʃʰe"
        "তিনি / তাঁরা": "bɔltʃʰen"
