schema: 1
id: bn-en-grammar-conjunctions
name: "Joining words"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "And, but, or, because: joining words and sentences."
tags: [beginner, grammar]
cards:
  - id: bn-en-grammar-conjunctions-0001
    target: "আর"
    native: "and; more"
    reading: "ar"
    pos: "other"
    notes: "The everyday 'and': চা আর বিস্কুট, tea and biscuits."
  - id: bn-en-grammar-conjunctions-0002
    target: "এবং"
    native: "and (formal)"
    reading: "ebong"
    pos: "other"
    notes: "In writing and in careful speech."
  - id: bn-en-grammar-conjunctions-0003
    target: "কিন্তু"
    native: "but"
    reading: "kintu"
    pos: "other"
  - id: bn-en-grammar-conjunctions-0004
    target: "বা"
    native: "or"
    reading: "ba"
    pos: "other"
    notes: "Also অথবা (othoba)."
  - id: bn-en-grammar-conjunctions-0005
    target: "কারণ"
    native: "because"
    reading: "karon"
    pos: "other"
    notes: "আমি আসিনি, কারণ আমি অসুস্থ ছিলাম। I didn't come because I was ill."
  - id: bn-en-grammar-conjunctions-0006
    target: "তাই"
    native: "so; that's why"
    reading: "tai"
    pos: "other"
    notes: "আমি অসুস্থ ছিলাম, তাই আসিনি। I was ill, so I didn't come."
  - id: bn-en-grammar-conjunctions-0007
    target: "যে"
    native: "that (after say, know)"
    reading: "je"
    pos: "other"
    notes: "ও বলল যে ও আসবে। She said that she would come."
  - id: bn-en-grammar-conjunctions-0008
    target: "যদি … তাহলে"
    native: "if … then"
    reading: "jodi … tahole"
    pos: "phrase"
    notes: "যদি বৃষ্টি হয়, তাহলে আমি আসব না। If it rains, I won't come."
  - id: bn-en-grammar-conjunctions-0009
    target: "যখন … তখন"
    native: "when … then"
    reading: "jokhon … tokhon"
    pos: "phrase"
    notes: "যখন আমি এলাম, তখন ও ঘুমোচ্ছিল। When I came, he was sleeping."
  - id: bn-en-grammar-conjunctions-0010
    target: "আমিও"
    native: "me too; I also"
    reading: "amio"
    pos: "other"
    notes: "-ও, 'also', joins the end of the word it is about: আজও, even today."
