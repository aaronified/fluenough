schema: 1
id: bn-en-grammar-conjunctions
name: "Joining words"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "And, but, or, because: joining words and sentences."
tags: [beginner, grammar]
cards:
  - id: bn-0361
    target: "আর"
    native: "and"
    reading: "ār"
    ipa: "ar"
    pos: "other"
    notes: "The everyday 'and': চা আর বিস্কুট (cā ār biskuṭ), tea and biscuits. It can also mean 'more': আর একটু (ār ekṭu), a little more."
  - id: bn-0362
    target: "এবং"
    native: "and (formal)"
    reading: "eboṅ"
    ipa: "eboŋ"
    pos: "other"
    notes: "In writing and in careful speech."
  - id: bn-0363
    target: "কিন্তু"
    native: "but"
    reading: "kintu"
    ipa: "kint̪u"
    pos: "other"
  - id: bn-0364
    target: "বা"
    native: "or"
    reading: "bā"
    ipa: "ba"
    pos: "other"
    notes: "Also অথবা (ôthobā)."
  - id: bn-0365
    target: "কারণ"
    native: "because"
    reading: "kāron"
    ipa: "karon"
    pos: "other"
    notes: "আমি আসিনি (āmi āsini), কারণ আমি অসুস্থ ছিলাম (kāron āmi ôsusth chilām)। I didn't come because I was ill."
  - id: bn-0366
    target: "তাই"
    native: "so; that's why"
    reading: "tāi"
    ipa: "t̪ai"
    pos: "other"
    notes: "আমি অসুস্থ ছিলাম (āmi ôsusth chilām), তাই আসিনি (tāi āsini)। I was ill, so I didn't come."
  - id: bn-0367
    target: "যে"
    native: "that (after say, know)"
    reading: "je"
    ipa: "dʒe"
    pos: "other"
    notes: "ও বলল যে ও আসবে (o bôlol je o āsobe)। She said that she would come."
  - id: bn-0368
    target: "যদি … তাহলে"
    native: "if … then"
    reading: "jodi... tāhole"
    ipa: "dʒod̪i t̪aɦole"
    pos: "phrase"
    notes: "যদি বৃষ্টি হয় (jodi briśṭi hôy), তাহলে আমি আসব না (tāhole āmi āsob nā)। If it rains, I won't come."
  - id: bn-0369
    target: "যখন … তখন"
    native: "when … then"
    reading: "jôkhon... tôkhon"
    ipa: "dʒɔkʰon t̪ɔkʰon"
    pos: "phrase"
    notes: "যখন আমি এলাম (jôkhon āmi elām), তখন ও ঘুমোচ্ছিল (tôkhon o ghumocchil)। When I came, he was sleeping."
  - id: bn-0370
    target: "আমিও"
    native: "me too; I also"
    reading: "āmio"
    ipa: "amio"
    pos: "other"
    notes: "-ও (-o), 'also', joins the end of the word it is about: আজও (ājoo), even today."
  - id: bn-0711
    target: "তবে"
    native: "however; but (softer)"
    reading: "tôbe"
    ipa: "t̪ɔbe"
    pos: "other"
    notes: "Softer than কিন্তু (kintu): ভালো (bhālo), তবে একটু দামি (tôbe ekṭu dāmi). Good, but a little expensive."
  - id: bn-0712
    target: "হয়তো"
    native: "maybe"
    reading: "hôyto"
    ipa: "ɦɔjt̪o"
    pos: "other"
    notes: "হয়তো ও আসবে (hôyto o āsobe)। Maybe she'll come."
  - id: bn-0713
    target: "বোধহয়"
    native: "I suppose; probably"
    reading: "bodhhoy"
    ipa: "bod̪ʱɦoj"
    pos: "other"
    notes: "ও বোধহয় বাড়িতে (o bodhhoy bāṛite)। She's probably at home."
  - id: bn-0714
    target: "চা না কফি?"
    native: "Tea or coffee?"
    reading: "cā nā kophi?"
    ipa: "tʃa na kopʰi"
    pos: "phrase"
    notes: "In a question, না (nā) between two choices is 'or'."
