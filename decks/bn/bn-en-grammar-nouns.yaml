schema: 1
id: bn-en-grammar-nouns
name: "Nouns: the, plural and case"
kind: grammar
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "-টা for 'the', -গুলো for the plural, and the endings for 'of' and 'in'."
tags: [beginner, grammar]
pattern:
  name: "Noun forms"
  slot_name: "form"
  slots: ["the one: -টা", "the ones: -গুলো", "of: -র or -এর", "in, at: -এ or -তে"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Bengali has no 'the': -টা after a noun does its work, and -গুলো makes it plural. A noun ending in a consonant takes -এর and -এ (ঘরের, ঘরে). One ending in a vowel sign takes -র and -তে (বাড়ির, বাড়িতে), or -য় after আ (ঢাকায়). When a word ends in a full vowel letter, as বই, ভাই and বউ do, 'of' is -য়ের (বইয়ের) and 'in' is -য়ে or -তে (বইয়ে, বইতে). People take -রা for the plural: ছেলেরা, the boys."
  entries:
    - lemma: "বই"
      key: boi
      reading: "boi"
      gloss: "book"
      forms:
        "the one: -টা": "বইটা"
        "the ones: -গুলো": "বইগুলো"
        "of: -র or -এর": "বইয়ের"
        "in, at: -এ or -তে": "বইয়ে"
      readings:
        "the one: -টা": "boita"
        "the ones: -গুলো": "boigulo"
        "of: -র or -এর": "boiyer"
        "in, at: -এ or -তে": "boiye"
    - lemma: "বাড়ি"
      key: bari
      reading: "bari"
      gloss: "house"
      forms:
        "the one: -টা": "বাড়িটা"
        "the ones: -গুলো": "বাড়িগুলো"
        "of: -র or -এর": "বাড়ির"
        "in, at: -এ or -তে": "বাড়িতে"
      readings:
        "the one: -টা": "barita"
        "the ones: -গুলো": "barigulo"
        "of: -র or -এর": "barir"
        "in, at: -এ or -তে": "barite"
    - lemma: "ঘর"
      key: ghor
      reading: "ghor"
      gloss: "room"
      forms:
        "the one: -টা": "ঘরটা"
        "the ones: -গুলো": "ঘরগুলো"
        "of: -র or -এর": "ঘরের"
        "in, at: -এ or -তে": "ঘরে"
      readings:
        "the one: -টা": "ghorta"
        "the ones: -গুলো": "ghorgulo"
        "of: -র or -এর": "ghorer"
        "in, at: -এ or -তে": "ghore"
    - lemma: "দোকান"
      key: dokan
      reading: "dokan"
      gloss: "shop"
      forms:
        "the one: -টা": "দোকানটা"
        "the ones: -গুলো": "দোকানগুলো"
        "of: -র or -এর": "দোকানের"
        "in, at: -এ or -তে": "দোকানে"
      readings:
        "the one: -টা": "dokanta"
        "the ones: -গুলো": "dokangulo"
        "of: -র or -এর": "dokaner"
        "in, at: -এ or -তে": "dokane"
    - lemma: "গাড়ি"
      key: gari
      reading: "gari"
      gloss: "car"
      forms:
        "the one: -টা": "গাড়িটা"
        "the ones: -গুলো": "গাড়িগুলো"
        "of: -র or -এর": "গাড়ির"
        "in, at: -এ or -তে": "গাড়িতে"
      readings:
        "the one: -টা": "garita"
        "the ones: -গুলো": "garigulo"
        "of: -র or -এর": "garir"
        "in, at: -এ or -তে": "garite"
    - lemma: "শহর"
      key: shohor
      reading: "shohor"
      gloss: "city"
      forms:
        "the one: -টা": "শহরটা"
        "the ones: -গুলো": "শহরগুলো"
        "of: -র or -এর": "শহরের"
        "in, at: -এ or -তে": "শহরে"
      readings:
        "the one: -টা": "shohorta"
        "the ones: -গুলো": "shohorgulo"
        "of: -র or -এর": "shohorer"
        "in, at: -এ or -তে": "shohore"
