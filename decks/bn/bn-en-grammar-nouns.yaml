schema: 1
id: bn-en-grammar-nouns
name: "Nouns: the, plural and case"
kind: grammar
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "-টা (-ṭā) for 'the', -গুলো (-gulo) for the plural, and the endings for 'of' and 'in'."
tags: [beginner, grammar]
pattern:
  name: "Noun forms"
  slot_name: "form"
  slots: ["the one: -টা (-ṭā)", "the ones: -গুলো (-gulo)", "of: -র (-rô) or -এর (-er)", "in, at: -এ (-e) or -তে (-te)"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Bengali has no 'the': -টা (-ṭā) after a noun does its work, and -গুলো (-gulo) makes it plural. A noun ending in a consonant takes -এর (-er) and -এ (-e) (ঘরের (ghôrer), ঘরে (ghôre)). One ending in a vowel sign takes -র (-rô) and -তে (-te) (বাড়ির (bāṛir), বাড়িতে (bāṛite)), or -য় (-yô) after আ (ā) (ঢাকায় (ḍhākāy)). When a word ends in a full vowel letter, as বই (boi), ভাই (bhāi) and বউ (bou) do, 'of' is -য়ের (-yer) (বইয়ের (boiyer)) and 'in' is -য়ে (-ye) or -তে (-te) (বইয়ে (boiye), বইতে (boite)). People take -রা (-rā) for the plural: ছেলেরা (chelerā), the boys."
  entries:
    - lemma: "বই"
      key: boi
      reading: "boi"
      ipa: "boi"
      gloss: "book"
      forms:
        "the one: -টা (-ṭā)": "বইটা"
        "the ones: -গুলো (-gulo)": "বইগুলো"
        "of: -র (-rô) or -এর (-er)": "বইয়ের"
        "in, at: -এ (-e) or -তে (-te)": "বইয়ে"
      readings:
        "the one: -টা (-ṭā)": "boiṭā"
        "the ones: -গুলো (-gulo)": "boigulo"
        "of: -র (-rô) or -এর (-er)": "boiyer"
        "in, at: -এ (-e) or -তে (-te)": "boiye"
      ipas:
        "the one: -টা (-ṭā)": "boiʈa"
        "the ones: -গুলো (-gulo)": "boiɡulo"
        "of: -র (-rô) or -এর (-er)": "boijer"
        "in, at: -এ (-e) or -তে (-te)": "boije"
    - lemma: "বাড়ি"
      key: bari
      reading: "bāṛi"
      ipa: "baɽi"
      gloss: "house"
      forms:
        "the one: -টা (-ṭā)": "বাড়িটা"
        "the ones: -গুলো (-gulo)": "বাড়িগুলো"
        "of: -র (-rô) or -এর (-er)": "বাড়ির"
        "in, at: -এ (-e) or -তে (-te)": "বাড়িতে"
      readings:
        "the one: -টা (-ṭā)": "bāṛiṭā"
        "the ones: -গুলো (-gulo)": "bāṛigulo"
        "of: -র (-rô) or -এর (-er)": "bāṛir"
        "in, at: -এ (-e) or -তে (-te)": "bāṛite"
      ipas:
        "the one: -টা (-ṭā)": "baɽiʈa"
        "the ones: -গুলো (-gulo)": "baɽiɡulo"
        "of: -র (-rô) or -এর (-er)": "baɽir"
        "in, at: -এ (-e) or -তে (-te)": "baɽit̪e"
    - lemma: "ঘর"
