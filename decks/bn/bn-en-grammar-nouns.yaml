schema: 1
id: bn-en-grammar-nouns
name: "Nouns: the, plural and case"
kind: grammar
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "-টা for 'the', -গুলো for the plural, and the endings for 'of' and 'in'."
tags: [beginner, grammar]
pattern:
  name: "Noun forms"
  slot_name: "form"
  slots: ["the one: -টা", "the ones: -গুলো", "of: -র or -এর", "in, at: -এ or -তে"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "Bengali has no 'the': -টা after a noun does its work, and -গুলো makes it plural. A noun ending in a consonant takes -এর and -এ (ঘরের, ঘরে). One ending in a vowel sign takes -র and -তে (বাড়ির, বাড়িতে), or -য় after আ (ঢাকায়). When a word ends in a full vowel letter, as বই, ভাই and বউ do, 'of' is -য়ের (বইয়ের) and 'in' is -য়ে or -তে (বইয়ে, বইতে). People take -রা for the plural: ছেলেরা, the boys."
  entries:
    - lemma: "বই"
      key: boi
      reading: "boi"
      ipa: "boi"
      gloss: "book"
      forms:
        "the one: -টা": "বইটা"
        "the ones: -গুলো": "বইগুলো"
        "of: -র or -এর": "বইয়ের"
        "in, at: -এ or -তে": "বইয়ে"
      readings:
        "the one: -টা": "boiṭā"
        "the ones: -গুলো": "boigulo"
        "of: -র or -এর": "boiyer"
        "in, at: -এ or -তে": "boiye"
      ipas:
        "the one: -টা": "boiʈa"
        "the ones: -গুলো": "boiɡulo"
        "of: -র or -এর": "boijer"
        "in, at: -এ or -তে": "boije"
    - lemma: "বাড়ি"
      key: bari
      reading: "bāṛi"
      ipa: "baɽi"
      gloss: "house"
      forms:
        "the one: -টা": "বাড়িটা"
        "the ones: -গুলো": "বাড়িগুলো"
        "of: -র or -এর": "বাড়ির"
        "in, at: -এ or -তে": "বাড়িতে"
      readings:
        "the one: -টা": "bāṛiṭā"
        "the ones: -গুলো": "bāṛigulo"
        "of: -র or -এর": "bāṛir"
        "in, at: -এ or -তে": "bāṛite"
      ipas:
        "the one: -টা": "baɽiʈa"
        "the ones: -গুলো": "baɽiɡulo"
        "of: -র or -এর": "baɽir"
        "in, at: -এ or -তে": "baɽit̪e"
    - lemma: "ঘর"
      key: ghor
      reading: "ghôr"
      ipa: "ɡʱɔr"
      gloss: "room"
      forms:
