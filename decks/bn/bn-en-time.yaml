schema: 1
id: bn-en-time
name: "Time and days"
kind: vocab
theme: time
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Today and tomorrow, telling the time, and the days of the week."
tags: [beginner]
cards:
  - id: bn-en-time-0001
    target: "আজ"
    native: "today"
    reading: "aj"
    pos: "adv"
  - id: bn-en-time-0002
    target: "কাল"
    native: "tomorrow; yesterday"
    reading: "kal"
    pos: "adv"
    notes: "One word for both; the verb's tense says which. গতকাল (gotokal) is only yesterday, আগামীকাল (agamikal) only tomorrow."
  - id: bn-en-time-0003
    target: "এখন"
    native: "now"
    reading: "ekhon"
    pos: "adv"
  - id: bn-en-time-0004
    target: "সকাল"
    native: "morning"
    reading: "shokal"
    pos: "noun"
  - id: bn-en-time-0005
    target: "বিকেল"
    native: "afternoon"
    reading: "bikel"
    pos: "noun"
    notes: "Bengali divides the day finely: সকাল, দুপুর (dupur, midday), বিকেল, সন্ধ্যা (evening), রাত (night)."
  - id: bn-en-time-0006
    target: "সন্ধ্যা"
    native: "evening"
    reading: "shondhya"
    alt_target: ["সন্ধে"]
    pos: "noun"
    notes: "In speech often সন্ধে (shondhe)."
  - id: bn-en-time-0007
    target: "রাত"
    native: "night"
    reading: "rat"
    pos: "noun"
  - id: bn-en-time-0008
    target: "বাজে"
    native: "o'clock (it strikes)"
    reading: "baje"
    pos: "verb"
    notes: "চারটে বাজে (charte baje), it's four o'clock. The number takes -টা or -টে: একটা, দুটো, চারটে."
  - id: bn-en-time-0009
    target: "সাড়ে"
    native: "half past; and a half"
    reading: "share"
    pos: "other"
    notes: "সাড়ে চারটে, half past four. Half past one and half past two are দেড়টা (derta) and আড়াইটে (araite)."
  - id: bn-en-time-0010
    target: "কটা বাজে?"
    native: "What time is it?"
    reading: "kota baje?"
    pos: "phrase"
  - id: bn-en-time-0011
    target: "দিন"
    native: "day"
    reading: "din"
    pos: "noun"
  - id: bn-en-time-0012
    target: "সপ্তাহ"
    native: "week"
    reading: "shoptaho"
    alt_target: ["হপ্তা"]
    pos: "noun"
    notes: "In speech also হপ্তা (hopta)."
  - id: bn-en-time-0013
    target: "সোমবার"
    native: "Monday"
    reading: "shombar"
    pos: "noun"
    notes: "Each day ends in বার (bar), and the names are the same as in Hindi."
  - id: bn-en-time-0014
    target: "মঙ্গলবার"
    native: "Tuesday"
    reading: "monggolbar"
    pos: "noun"
  - id: bn-en-time-0015
    target: "বুধবার"
    native: "Wednesday"
    reading: "budhbar"
    pos: "noun"
  - id: bn-en-time-0016
    target: "বৃহস্পতিবার"
    native: "Thursday"
    reading: "brihoshpotibar"
    alt_target: ["বিষ্যুদবার"]
    pos: "noun"
    notes: "In speech often বিষ্যুদবার (bishyudbar)."
  - id: bn-en-time-0017
    target: "শুক্রবার"
    native: "Friday"
    reading: "shukrobar"
    pos: "noun"
  - id: bn-en-time-0018
    target: "শনিবার"
    native: "Saturday"
    reading: "shonibar"
    pos: "noun"
  - id: bn-en-time-0019
    target: "রবিবার"
    native: "Sunday"
    reading: "robibar"
    pos: "noun"
