schema: 1
id: bn-en-time
name: "Time and days"
kind: vocab
theme: time
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Today and tomorrow, the parts of the day, telling the time, and the days of the week."
tags: [beginner]
cards:
  - id: bn-0315
    target: "আজ"
    native: "today"
    reading: "aj"
    pos: "adv"
  - id: bn-0316
    target: "কাল"
    native: "tomorrow; yesterday"
    reading: "kal"
    pos: "adv"
    notes: "One word for both; the verb's tense says which. গতকাল (gotokal) is only yesterday, আগামীকাল (agamikal) only tomorrow."
  - id: bn-0317
    target: "এখন"
    native: "now"
    reading: "ekhon"
    pos: "adv"
  - id: bn-0318
    target: "সকাল"
    native: "morning"
    reading: "shokal"
    pos: "noun"
  - id: bn-0319
    target: "বিকেল"
    native: "afternoon"
    reading: "bikel"
    alt_target: ["বিকাল"]
    pos: "noun"
    notes: "Bengali divides the day finely: ভোর (bhor, dawn), সকাল, দুপুর (dupur, midday), বিকেল, সন্ধ্যা (evening), রাত (night). Also বিকাল (bikal)."
  - id: bn-0320
    target: "সন্ধ্যা"
    native: "evening"
    reading: "shondha"
    alt_target: ["সন্ধে"]
    pos: "noun"
    notes: "Often said সন্ধে (shondhe)."
  - id: bn-0321
    target: "রাত"
    native: "night"
    reading: "rat"
    pos: "noun"
  - id: bn-0322
    target: "বাজে"
    native: "o'clock (it strikes)"
    reading: "baje"
    pos: "verb"
    notes: "চারটে বাজে (charte baje), it's four o'clock. The number takes -টা: একটা, পাঁচটা, ছটা. Two, three and four are different: দুটো, তিনটে, চারটে, and so is half past two, আড়াইটে. Also with -টা for every number: দুইটা, তিনটা, চারটা বাজে."
  - id: bn-0323
    target: "সাড়ে"
    native: "half past; and a half"
    reading: "share"
    pos: "other"
    notes: "সাড়ে চারটে, half past four. Half past one and half past two are দেড়টা (derta) and আড়াইটে (araite), also আড়াইটা (araita)."
  - id: bn-0324
    target: "কটা বাজে?"
    native: "What time is it?"
    reading: "kota baje?"
    alt_target: ["কয়টা বাজে?"]
    pos: "phrase"
    notes: "Also কয়টা বাজে? (koyta baje?)"
  - id: bn-0325
    target: "দিন"
    native: "day"
    reading: "din"
    pos: "noun"
  - id: bn-0326
    target: "সপ্তাহ"
    native: "week"
    reading: "shoptaho"
    alt_target: ["হপ্তা"]
    pos: "noun"
    notes: "Also হপ্তা (hopta), in everyday speech."
  - id: bn-0327
    target: "সোমবার"
    native: "Monday"
    reading: "shombar"
    pos: "noun"
    notes: "Each day ends in বার (bar). Most names match Hindi's, but for Thursday Hindi usually says गुरुवार where Bengali says বৃহস্পতিবার."
  - id: bn-0328
    target: "মঙ্গলবার"
    native: "Tuesday"
    reading: "mongolbar"
    pos: "noun"
  - id: bn-0329
    target: "বুধবার"
    native: "Wednesday"
    reading: "budhbar"
    pos: "noun"
  - id: bn-0330
    target: "বৃহস্পতিবার"
    native: "Thursday"
    reading: "brihoshpotibar"
    alt_target: ["বিষ্যুদবার"]
    pos: "noun"
    notes: "In speech often বিষ্যুদবার (bishshudbar)."
  - id: bn-0331
    target: "শুক্রবার"
    native: "Friday"
    reading: "shukrobar"
    pos: "noun"
  - id: bn-0332
    target: "শনিবার"
    native: "Saturday"
    reading: "shonibar"
    pos: "noun"
  - id: bn-0333
    target: "রবিবার"
    native: "Sunday"
    reading: "robibar"
    pos: "noun"
  - id: bn-0645
    target: "দুপুর"
    native: "midday; early afternoon"
    reading: "dupur"
    pos: "noun"
  - id: bn-0646
    target: "ভোর"
    native: "dawn; early morning"
    reading: "bhor"
    pos: "noun"
  - id: bn-0647
    target: "সোয়া"
    native: "a quarter past"
    reading: "shoya"
    pos: "other"
    notes: "সোয়া তিনটে, a quarter past three, also সোয়া তিনটা."
  - id: bn-0648
    target: "পৌনে"
    native: "a quarter to"
    reading: "poune"
    pos: "other"
    notes: "পৌনে চারটে, a quarter to four: 'four, less a quarter'. Also পৌনে চারটা."
  - id: bn-0649
    target: "কটায়?"
    native: "At what time?"
    reading: "kotay?"
    alt_target: ["কয়টায়?", "কখন?"]
    pos: "phrase"
    notes: "-টায় is 'at' with a time: সাতটায়, at seven; দুটোয়, at two. Also কয়টায়? (koytay?)"
  - id: bn-0650
    target: "গতকাল"
    native: "yesterday"
    reading: "gotokal"
    alt_target: ["কাল"]
    pos: "adv"
  - id: bn-0651
    target: "আগামীকাল"
    native: "tomorrow"
    reading: "agamikal"
    alt_target: ["কাল"]
    pos: "adv"
  - id: bn-0652
    target: "পরশু"
    native: "the day after tomorrow; the day before yesterday"
    reading: "porshu"
    pos: "adv"
    notes: "Like কাল, one word for both; the verb's tense says which."
  - id: bn-0653
    target: "গত সপ্তাহে"
    native: "last week"
    reading: "goto shoptahe"
    pos: "phrase"
  - id: bn-0654
    target: "পরের সপ্তাহে"
    native: "next week"
    reading: "porer shoptahe"
    alt_target: ["আগামী সপ্তাহে"]
    pos: "phrase"
  - id: bn-0655
    target: "ঘণ্টা"
    native: "hour"
    reading: "ghonta"
    pos: "noun"
    notes: "এক ঘণ্টা, an hour; আধ ঘণ্টা (adh ghonta), half an hour."
  - id: bn-0656
    target: "মিনিট"
    native: "minute"
    reading: "minit"
    pos: "noun"
