  - id: "bn-3887"
    target: "বন্ধুত্ব"
    reading: "bondhutto"
    ipa: "bond̪ʱut̪t̪"
    phonetic: "[bond̪ʱut̪t̪]"
    phonetic_source: "rules"
    pos: "noun"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "বন্ধুত্ব", reading: "bondhutto" }] }
    examples:
      - { target: "আমাদের বন্ধুত্ব অনেক দিনের।", reading: "āmāder bondhutto ônek diner.", ipa: "amad̪er bond̪ʱut̪t̪ ɔnek d̪iner", bases: [{ word: "আমাদের", ref: "bn-0834" }, { word: "অনেক", ref: "bn-0550" }, { word: "দিনের", ref: "bn-0325" }] }
      - { target: "বন্ধুত্বে বিশ্বাস থাকা জরুরি।", reading: "bondhutte biśśās thākā joruri.", ipa: "bond̪ʱut̪t̪e biʃʃas t̪ʰaka dʒoruri", bases: [{ word: "বন্ধুত্বে", base: "বন্ধুত্ব", reading: "bondhutte" }, { word: "বিশ্বাস", ref: "bn-2960" }, { word: "থাকা", ref: "bn-0875" }, { word: "জরুরি", ref: "bn-1778" }] }
  - id: "bn-3888"
