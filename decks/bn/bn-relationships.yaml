      - { target: "তাদের প্রেম খুব গভীর।", reading: "tāder prem khub gobhir.", ipa: "t̪ad̪er prem kʰub ɡobʱir", bases: [{ word: "তাদের", ref: "bn-0840" }, { word: "খুব", ref: "bn-0641" }, { word: "গভীর", base: "গভীর", reading: "gobhir" }] }
