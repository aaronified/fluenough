passages:
  - id: "bn-a-discussion"
    title: "A short discussion of an idea"
    theme: "abstract-words"
    sentences:
      - { text: "আমাদের বন্ধুত্বে সততা আর বিশ্বাস খুব জরুরি।", reading: "āmāder bondhutte sôtotā ār biśśās khub joruri.", ipa: "amad̪er bond̪ʱut̪t̪e sɔt̪ot̪a ar biʃʃas kʰub dʒoruri" }
      - { text: "তুমি বললে, সুযোগ থাকলে সবাই ভালো হতে পারে।", reading: "tumi bôlole, sujog thākole sôbāi bhālo hôte pāre.", ipa: "t̪umi bɔlole sudʒoɡ t̪ʰakole sɔbai bʱalo ɦɔt̪e pare" }
      - { text: "আমি মনে করি, চেষ্টা আর ধৈর্যই সফলতার চাবি।", reading: "āmi mône kori, ceśṭā ār dhoirjoi sôpholotār cābi.", ipa: "ami mɔne kori tʃeʃʈa ar d̪ʱoirdʒoi sɔpʰolot̪ar tʃabi" }
      - { text: "সাম্য আর সহনশীলতা ছাড়া সমাজ এগোয় না।", reading: "sāmmo ār sôhonośilotā chāṛā sômāj egoy nā.", ipa: "samm ar sɔɦonoʃilot̪a tʃʰaɽa sɔmadʒ eɡoj na" }
      - { text: "এই বিষয়ে তোমার মত কী?", reading: "ei biśoye tomār môt ki?", ipa: "ei biʃoje t̪omar mɔt̪ ki" }
    questions:
      - id: "bn-4311"
        prompt: { "en": "The discussion is about an idea that matters to friends." }
        answer: true
      - id: "bn-4312"
        prompt: { "en": "What does the speaker think is the key to success?" }
        options: [{ "en": "Effort and patience" }, { "en": "Luck alone" }]
        answer: 1
      - id: "bn-4313"
        prompt: { "en": "What does the society need in order to move forward?" }
        options: [{ "en": "Equality and tolerance" }, { "en": "Only money" }]
        answer: 1
  - id: "bn-opinion-column"
    title: "A short opinion column"
    theme: "abstract-words"
    sentences:
      - { text: "প্রগতি মানে শুধু টাকা নয়।", reading: "prôgoti māne śudhu ṭākā nôy.", ipa: "prɔɡot̪i mane ʃud̪ʱu ʈaka nɔj" }
      - { text: "শিক্ষা, কৌতূহল আর নৈতিকতা নিয়েই প্রকৃত উন্নতি।", reading: "śikkhā, koutuhol ār noitikotā niyei prokrit unnoti.", ipa: "ʃikkʰa kout̪uɦol ar noit̪ikot̪a nijei prokrit̪ unnot̪i" }
      - { text: "আমাদের সংস্কৃতির প্রতি গৌরব থাকা ভালো।", reading: "āmāder soṅskritir proti gourob thākā bhālo.", ipa: "amad̪er soŋskrit̪ir prot̪i ɡourob t̪ʰaka bʱalo" }
      - { text: "কিন্তু অহংকার নয়, বিনয়ই মানুষের গুণ।", reading: "kintu ôhoṅkār nôy, binoyoi mānuśer gun.", ipa: "kint̪u ɔɦoŋkar nɔj binojoi manuʃer ɡun" }
      - { text: "সব মিলিয়ে সমাজের কল্যাণই আসল লক্ষ্য।", reading: "sôb miliye sômājer kollānoi āsol lôkkho.", ipa: "sɔb milije sɔmadʒer kollanoi asol lɔkkkʰ" }
    questions:
      - id: "bn-4314"
        prompt: { "en": "The column says progress is more than money." }
        answer: true
      - id: "bn-4315"
        prompt: { "en": "Which quality does the column call a human virtue?" }
        options: [{ "en": "Humility" }, { "en": "Arrogance" }]
        answer: 1
      - id: "bn-4316"
        prompt: { "en": "What does the column say is the real aim?" }
        options: [{ "en": "The welfare of society" }, { "en": "Personal fame" }]
        answer: 1
