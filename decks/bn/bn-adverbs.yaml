    examples:
      - { target: "তুমি কি কখনো ঢাকায় গেছ?", reading: "tumi ki kôkhono ḍhākāy gech?", ipa: "t̪umi ki kɔkʰono ɖʱakaj ɡetʃʰ", bases: [{ word: "ঢাকায়", base: "ঢাকা", reading: "ḍhākā", ipa: "ɖʱaka" }, { word: "গেছ", base: "যাওয়া", reading: "jāoyā", ipa: "dʒaoja" }] }
      - { target: "আমি কখনো মিথ্যা বলি না।", reading: "āmi kôkhono mitthā boli nā.", ipa: "ami kɔkʰono mit̪t̪ʰa boli na", bases: [{ word: "মিথ্যা", base: "মিথ্যা", reading: "mitthā", ipa: "mit̪t̪ʰa" }, { word: "বলি", base: "বলা", reading: "bôlā", ipa: "bɔla" }] }
  - id: "bn-1527"
