    examples:
      - { target: "আমি এই ছবিটা কখনোই দেখিনি।", reading: "āmi ei chobiṭā kôkhonoi dekhini.", ipa: "ami ei tʃʰobiʈa kɔkʰonoi d̪ekʰini", bases: [{ word: "এই", base: "এই", reading: "ei", ipa: "ei" }, { word: "ছবিটা", ref: "bn-1145" }, { word: "কখনোই", base: "কখনোই", reading: "kôkhonoi", ipa: "kɔkʰonoi" }, { word: "দেখিনি", base: "দেখা", reading: "dekhā", ipa: "d̪ekʰa" }] }
      - { target: "সে কখনোই দেরি করে না।", reading: "se kôkhonoi deri kôre nā.", ipa: "se kɔkʰonoi d̪eri kɔre na", bases: [{ word: "কখনোই", base: "কখনোই", reading: "kôkhonoi", ipa: "kɔkʰonoi" }, { word: "দেরি", base: "দেরি", reading: "deri", ipa: "d̪eri" }, { word: "করে", base: "করা", reading: "kôrā", ipa: "kɔra" }] }
