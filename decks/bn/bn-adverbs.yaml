      - { target: "রোজ সকালে খবরের কাগজ আসে।", reading: "roj śôkāle khôborer kāgoj āse.", ipa: "rodʒ ʃɔkale kʰɔborer kaɡodʒ ase", bases: [{ word: "খবরের", base: "খবর", reading: "khôbor", ipa: "kʰɔbor" }, { word: "আসে", base: "আসা", reading: "āsā", ipa: "aʃa" }] }
