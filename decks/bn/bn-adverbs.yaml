  - id: "bn-1524"
    target: "প্রায়ই"
    reading: "prāyoi"
    ipa: "prajoi"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "প্রায়ই দেরি", reading: "prāyoi deri" }] }
    examples:
      - { target: "আমরা প্রায়ই বাজারে যাই।", reading: "āmorā prāyoi bājāre jāi.", ipa: "amora prajoi badʒare dʒai", bases: [{ word: "বাজারে", ref: "bn-1040" }, { word: "যাই", base: "যাওয়া", reading: "jāoyā", ipa: "dʒaoja" }] }
      - { target: "তুমি প্রায়ই দেরি করো।", reading: "tumi prāyoi deri kôro.", ipa: "t̪umi prajoi d̪eri kɔro", bases: [{ word: "দেরি", base: "দেরি", reading: "deri", ipa: "d̪eri" }, { word: "করো", base: "করা", reading: "kôrā", ipa: "kɔra" }] }
