cards:
  - id: "bn-1523"
    target: "সবসময়"
    reading: "sôbosomoy"
    ipa: "sɔbosomoj"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "সবসময় চা", reading: "sôbosomoy cā" }] }
    examples:
      - { target: "সে সবসময় সময়মতো আসে।", reading: "se sôbosomoy sômoyomoto āse.", ipa: "se sɔbosomoj sɔmojomot̪o ase", bases: [{ word: "আসে", base: "আসা", reading: "āsā", ipa: "aʃa" }] }
      - { target: "আমি সবসময় সকালে চা খাই।", reading: "āmi sôbosomoy sôkāle cā khāi.", ipa: "ami sɔbosomoj sɔkale tʃa kʰai", bases: [{ word: "খাই", base: "খাওয়া", reading: "khāoyā", ipa: "kʰaoja" }] }
  - id: "bn-1524"
    target: "প্রায়ই"
    reading: "prāyoi"
    ipa: "prajoi"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "প্রায়ই দেরি", reading: "prāyoi deri" }] }
    examples:
      - { target: "আমরা প্রায়ই বাজারে যাই।", reading: "āmorā prāyoi bājāre jāi.", ipa: "amora prajoi badʒare dʒai", bases: [{ word: "যাই", base: "যাওয়া", reading: "jāoyā", ipa: "dʒaoja" }] }
      - { target: "তুমি প্রায়ই দেরি করো।", reading: "tumi prāyoi deri kôro.", ipa: "t̪umi prajoi d̪eri kɔro", bases: [{ word: "করো", base: "করা", reading: "kôrā", ipa: "kɔra" }] }
  - id: "bn-1525"
    target: "মাঝে মাঝে"
    reading: "mājhe mājhe"
    ipa: "madʒʱe madʒʱe"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "মাঝে মাঝে", reading: "mājhe mājhe" }] }
    examples:
      - { target: "মাঝে মাঝে বৃষ্টি হয়।", reading: "mājhe mājhe briśṭi hôy.", ipa: "madʒʱe madʒʱe briʃʈi ɦɔj", bases: [{ word: "হয়", base: "হওয়া", reading: "hôoyā", ipa: "ɦɔja" }] }
      - { target: "মাঝে মাঝে আমি বই পড়ি।", reading: "mājhe mājhe āmi boi poṛi.", ipa: "madʒʱe madʒʱe ami boi poɽi", bases: [{ word: "পড়ি", base: "পড়া", reading: "pôṛā", ipa: "pɔɽa" }] }
  - id: "bn-1526"
    target: "কখনো"
    reading: "kôkhono"
    ipa: "kɔkʰono"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "কখনো না", reading: "kôkhono nā" }, { word: "কখনোই না", reading: "kôkhonoi nā" }] }
    examples:
      - { target: "তুমি কি কখনো ঢাকায় গেছ?", reading: "tumi ki kôkhono ḍhākāy gech?", ipa: "t̪umi ki kɔkʰono ɖʱakaj ɡetʃʰ", bases: [{ word: "গেছ", base: "যাওয়া", reading: "jāoyā", ipa: "dʒaoja" }] }
      - { target: "আমি কখনো মিথ্যা বলি না।", reading: "āmi kôkhono mitthā boli nā.", ipa: "ami kɔkʰono mit̪t̪ʰa boli na", bases: [{ word: "বলি", base: "বলা", reading: "bôlā", ipa: "bɔla" }] }
  - id: "bn-1527"
    target: "কখনোই না"
    reading: "kôkhonoi nā"
    ipa: "kɔkʰonoi na"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "কখনোই না দেখা", reading: "kôkhonoi nā dekhā" }] }
    examples:
      - { target: "আমি এই ছবিটা কখনোই দেখিনি।", reading: "āmi ei chobiṭā kôkhonoi dekhini.", ipa: "ami ei tʃʰobiʈa kɔkʰonoi d̪ekʰini", bases: [{ word: "দেখিনি", base: "দেখা", reading: "dekhā", ipa: "d̪ekʰa" }] }
      - { target: "সে কখনোই দেরি করে না।", reading: "se kôkhonoi deri kôre nā.", ipa: "se kɔkʰonoi d̪eri kɔre na", bases: [{ word: "করে", base: "করা", reading: "kôrā", ipa: "kɔra" }] }
  - id: "bn-1528"
    target: "রোজ"
    reading: "roj"
    ipa: "rodʒ"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "রোজ সকালে", reading: "roj sôkāle" }] }
    examples:
      - { target: "আমি রোজ হাঁটি।", reading: "āmi roj hām̐ṭi.", ipa: "ami rodʒ ɦãʈi", bases: [{ word: "হাঁটি", base: "হাঁটা", reading: "hām̐ṭā", ipa: "ɦãʈa" }] }
      - { target: "রোজ সকালে খবরের কাগজ আসে।", reading: "roj sôkāle khôborer kāgoj āse.", ipa: "rodʒ sɔkale kʰɔborer kaɡodʒ ase", bases: [{ word: "আসে", base: "আসা", reading: "āsā", ipa: "aʃa" }] }
  - id: "bn-1529"
    target: "প্রতিদিন"
    reading: "protidin"
    ipa: "prot̪id̪in"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "প্রতিদিন সকালে", reading: "protidin sôkāle" }] }
    examples:
      - { target: "সে প্রতিদিন অফিসে যায়।", reading: "se protidin ôphise jāy.", ipa: "se prot̪id̪in ɔpʰise dʒaj", bases: [{ word: "যায়", base: "যাওয়া", reading: "jāoyā", ipa: "dʒaoja" }] }
      - { target: "প্রতিদিন একটু পড়ো।", reading: "protidin ekoṭu pôṛo.", ipa: "prot̪id̪in ekoʈu pɔɽo", bases: [{ word: "পড়ো", base: "পড়া", reading: "pôṛā", ipa: "pɔɽa" }] }
  - id: "bn-1530"
    target: "বারবার"
    reading: "bārobār"
    ipa: "barobar"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "বারবার চেষ্টা", reading: "bārobār ceśṭā" }] }
    examples:
      - { target: "সে বারবার একই কথা বলে।", reading: "se bārobār ekoi kôthā bôle.", ipa: "se barobar ekoi kɔt̪ʰa bɔle", bases: [{ word: "বলে", base: "বলা", reading: "bôlā", ipa: "bɔla" }] }
      - { target: "বারবার চেষ্টা করো।", reading: "bārobār ceśṭā kôro.", ipa: "barobar tʃeʃʈa kɔro", bases: [{ word: "করো", base: "করা", reading: "kôrā", ipa: "kɔra" }] }
  - id: "bn-1531"
    target: "আবার"
    reading: "ābār"
    ipa: "abar"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "আবার দেখা", reading: "ābār dekhā" }] }
    examples:
      - { target: "আবার বৃষ্টি হচ্ছে।", reading: "ābār briśṭi hôcche.", ipa: "abar briʃʈi ɦɔtʃtʃʰe", bases: [{ word: "হচ্ছে", base: "হওয়া", reading: "hôoyā", ipa: "ɦɔja" }] }
      - { target: "আবার দেখা হবে।", reading: "ābār dekhā hôbe.", ipa: "abar d̪ekʰa ɦɔbe", bases: [{ word: "হবে", base: "হওয়া", reading: "hôoyā", ipa: "ɦɔja" }] }
  - id: "bn-1532"
    target: "আগে"
    reading: "āge"
    ipa: "aɡe"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "খাওয়ার আগে", reading: "khāoyār āge" }, { word: "আগে থেকে", reading: "āge thekē" }] }
    examples:
      - { target: "আমি আগে ঢাকায় থাকতাম।", reading: "āmi āge ḍhākāy thākotām.", ipa: "ami aɡe ɖʱakaj t̪ʰakot̪am", bases: [{ word: "থাকতাম", base: "থাকা", reading: "thākā", ipa: "t̪ʰaka" }] }
      - { target: "খাওয়ার আগে হাত ধোও।", reading: "khāoyār āge hāt dhoo.", ipa: "kʰaojar aɡe ɦat̪ d̪ʱoo", bases: [{ word: "ধোও", base: "ধোওয়া", reading: "dhoyā", ipa: "d̪ʱoja" }] }
  - id: "bn-1533"
    target: "এখনো"
    reading: "ekhono"
    ipa: "ekʰono"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "এখনো সময়", reading: "ekhono sômoy" }] }
    examples:
      - { target: "সে এখনো ঘুমায়।", reading: "se ekhono ghumāy.", ipa: "se ekʰono ɡʱumaj", bases: [{ word: "ঘুমায়", base: "ঘুমানো", reading: "ghumānō", ipa: "ɡʱumano" }] }
      - { target: "এখনো সময় আছে।", reading: "ekhono sômoy āche.", ipa: "ekʰono sɔmoj atʃʰe", bases: [{ word: "আছে", base: "থাকা", reading: "thākā", ipa: "t̪ʰaka" }] }
  - id: "bn-1534"
    target: "এখন"
    reading: "ekhon"
    ipa: "ekʰon"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "এখন কয়টা", reading: "ekhon kôyoṭā" }] }
    examples:
      - { target: "আমি এখন বাড়ি যাব।", reading: "āmi ekhon bāṛi jāb.", ipa: "ami ekʰon baɽi dʒab", bases: [{ word: "যাব", base: "যাওয়া", reading: "jāoyā", ipa: "dʒaoja" }] }
      - { target: "এখন কয়টা বাজে?", reading: "ekhon kôyoṭā bāje?", ipa: "ekʰon kɔjoʈa badʒe", bases: [{ word: "বাজে", base: "বাজা", reading: "bājā", ipa: "badʒa" }] }
  - id: "bn-1535"
    target: "তখন"
    reading: "tôkhon"
    ipa: "t̪ɔkʰon"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "তখন থেকে", reading: "tôkhon thekē" }] }
    examples:
      - { target: "তখন বৃষ্টি হচ্ছিল।", reading: "tôkhon briśṭi hocchil.", ipa: "t̪ɔkʰon briʃʈi ɦɔtʃtʃʰil", bases: [{ word: "হচ্ছিল", base: "হওয়া", reading: "hôoyā", ipa: "ɦɔja" }] }
      - { target: "তখন আমি ছোট ছিলাম।", reading: "tôkhon āmi choṭ chilām.", ipa: "t̪ɔkʰon ami tʃʰoʈ tʃʰilam" }
  - id: "bn-1536"
    target: "তারপর"
    reading: "tārpor"
    ipa: "t̪arpor"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "তারপর কী", reading: "tārpor kī" }] }
    examples:
      - { target: "আগে খাও, তারপর ঘুমাও।", reading: "āge khāo, tārpor ghumāo.", ipa: "aɡe kʰao t̪arpor ɡʱumao", bases: [{ word: "খাও", base: "খাওয়া", reading: "khāoyā", ipa: "kʰaoja" }, { word: "ঘুমাও", base: "ঘুমানো", reading: "ghumānō", ipa: "ɡʱumano" }] }
      - { target: "তারপর কী হলো?", reading: "tārpor kī hôlo?", ipa: "t̪arpor ki ɦɔlo", bases: [{ word: "হলো", base: "হওয়া", reading: "hôoyā", ipa: "ɦɔja" }] }
  - id: "bn-1537"
    target: "পরে"
    reading: "pôre"
    ipa: "pɔre"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "পরে দেখা", reading: "pôre dekhā" }] }
    examples:
      - { target: "আমি পরে ফোন করব।", reading: "āmi pôre phon kôrob.", ipa: "ami pɔre pʰon kɔrob", bases: [{ word: "করব", base: "করা", reading: "kôrā", ipa: "kɔra" }] }
      - { target: "পরে দেখা হবে।", reading: "pôre dekhā hôbe.", ipa: "pɔre d̪ekʰa ɦɔbe", bases: [{ word: "হবে", base: "হওয়া", reading: "hôoyā", ipa: "ɦɔja" }] }
  - id: "bn-1538"
    target: "হঠাৎ"
    reading: "hôṭhāt"
    ipa: "ɦɔʈʰat̪"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "হঠাৎ করে", reading: "hôṭhāt kôre" }] }
    examples:
      - { target: "হঠাৎ আলো নিভে গেল।", reading: "hôṭhāt ālo nibhe gel.", ipa: "ɦɔʈʰat̪ alo nibʱe ɡel", bases: [{ word: "গেল", base: "যাওয়া", reading: "jāoyā", ipa: "dʒaoja" }] }
      - { target: "সে হঠাৎ চলে গেল।", reading: "se hôṭhāt côle gel.", ipa: "se ɦɔʈʰat̪ tʃɔle ɡel", bases: [{ word: "চলে", base: "চলা", reading: "côlā", ipa: "tʃɔla" }, { word: "গেল", base: "যাওয়া", reading: "jāoyā", ipa: "dʒaoja" }] }
  - id: "bn-1539"
    target: "শীঘ্রই"
    reading: "śighroi"
    ipa: "ʃiɡʱroi"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "শীঘ্রই ফিরব", reading: "śighroi phirob" }] }
    examples:
      - { target: "শীঘ্রই আমি ফিরব।", reading: "śighroi āmi phirob.", ipa: "ʃiɡʱroi ami pʰirob", bases: [{ word: "ফিরব", base: "ফেরা", reading: "phērā", ipa: "pʰera" }] }
      - { target: "ট্রেনটা শীঘ্রই আসবে।", reading: "ṭrenoṭā śighroi āsobe.", ipa: "ʈrenoʈa ʃiɡʱroi asobe", bases: [{ word: "আসবে", base: "আসা", reading: "āsā", ipa: "aʃa" }] }
  - id: "bn-1540"
    target: "তাড়াতাড়ি"
    reading: "tāṛātāṛi"
    ipa: "t̪aɽat̪aɽi"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "তাড়াতাড়ি এসো", reading: "tāṛātāṛi eso" }] }
    examples:
      - { target: "একটু তাড়াতাড়ি এসো।", reading: "ekoṭu tāṛātāṛi eso.", ipa: "ekoʈu t̪aɽat̪aɽi eso", bases: [{ word: "এসো", base: "আসা", reading: "āsā", ipa: "aʃa" }] }
      - { target: "তাড়াতাড়ি খাও।", reading: "tāṛātāṛi khāo.", ipa: "t̪aɽat̪aɽi kʰao", bases: [{ word: "খাও", base: "খাওয়া", reading: "khāoyā", ipa: "kʰaoja" }] }
  - id: "bn-1541"
    target: "আজ"
    reading: "āj"
    ipa: "adʒ"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "আজ সকালে", reading: "āj sôkāle" }, { word: "আজকে", reading: "ājke" }] }
    examples:
      - { target: "আজ আমার ছুটি।", reading: "āj āmār chuṭi.", ipa: "adʒ amar tʃʰuʈi" }
      - { target: "আজ কত তারিখ?", reading: "āj kôt tārikh?", ipa: "adʒ kɔt̪ t̪arikʰ" }
  - id: "bn-1542"
    target: "আজকাল"
    reading: "ājokāl"
    ipa: "adʒokal"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "আজকাল সবাই", reading: "ājokāl sôbāi" }] }
    examples:
      - { target: "আজকাল সবাই মোবাইলে কথা বলে।", reading: "ājokāl sôbāi mobāile kôthā bôle.", ipa: "adʒokal sɔbai mobaile kɔt̪ʰa bɔle", bases: [{ word: "বলে", base: "বলা", reading: "bôlā", ipa: "bɔla" }] }
      - { target: "আজকাল ঠান্ডা কম পড়ে।", reading: "ājokāl ṭhānḍā kôm pôṛe.", ipa: "adʒokal ʈʰanɖa kɔm pɔɽe", bases: [{ word: "পড়ে", base: "পড়া", reading: "pôṛā", ipa: "pɔɽa" }] }
  - id: "bn-1543"
    target: "গতকাল"
    reading: "gôtokāl"
    ipa: "ɡɔt̪okal"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "গতকাল রাতে", reading: "gôtokāl rāte" }] }
    examples:
      - { target: "গতকাল আমি বাজারে গিয়েছিলাম।", reading: "gôtokāl āmi bājāre giyechilām.", ipa: "ɡɔt̪okal ami badʒare ɡijetʃʰilam", bases: [{ word: "গিয়েছিলাম", base: "যাওয়া", reading: "jāoyā", ipa: "dʒaoja" }] }
      - { target: "গতকাল বৃষ্টি হয়েছিল।", reading: "gôtokāl briśṭi hôyechil.", ipa: "ɡɔt̪okal briʃʈi ɦɔjetʃʰil", bases: [{ word: "হয়েছিল", base: "হওয়া", reading: "hôoyā", ipa: "ɦɔja" }] }
  - id: "bn-1544"
    target: "কাল"
    reading: "kāl"
    ipa: "kal"
    pos: "adv"
    notes:
