    ipa: "kɔkʰonoi na"
    pos: "adv"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "কখনোই না দেখা", reading: "kôkhonoi nā dekhā" }] }
    bases:
      - { word: "কখনোই", base: "কখনোই", reading: "kôkhonoi", ipa: "kɔkʰonoi" }
