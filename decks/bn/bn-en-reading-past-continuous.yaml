- id: "bn-what-was-happening"
  title: "What was happening"
  theme: "home"
  sentences:
  - text: "হঠাৎ আলো চলে গেল!"
    reading: "hôṭhāt ālo côle gelo!"
    ipa: "ɦɔʈʰat̪ alo tʃɔle ɡelo"
  - text: "তুমি কী করছিলে?"
    reading: "tumi ki kôrchile?"
    ipa: "t̪umi ki kɔrtʃʰile"
  - text: "আমি রান্না করছিলাম।"
    reading: "āmi rānnā kôrchilām."
    ipa: "ami ranna kɔrtʃʰilam"
  - text: "বাবা কী করছিলেন?"
    reading: "bābā ki kôrchilen?"
    ipa: "baba ki kɔrtʃʰilen"
  - text: "বাবা ভাত খাচ্ছিলেন।"
    reading: "bābā bhāt khācchilen."
    ipa: "baba bʱat̪ kʰatʃtʃʰilen"
  questions:
  - id: "bn-5450"
