- id: "bn-power-cut-story"
  title: "A power cut in the evening"
  theme: "home"
  sentences:
  - text: "সন্ধ্যায় হঠাৎ বিদ্যুৎ চলে গেল।"
    reading: "śônddhāy hôṭhāt biddut côle gelo."
    ipa: "ʃɔnd̪d̪ʱaj ɦɔʈʰat̪ bid̪d̪ut̪ tʃɔle ɡelo"
  - text: "ঘরে আলো ছিল না।"
    reading: "ghôre ālo chilo nā."
    ipa: "ɡʱɔre alo tʃʰilo na"
  - text: "মা রান্নাঘরে কাজ করছিলেন।"
    reading: "mā rānnāghore kāj kôrchilen."
    ipa: "ma rannaɡʱore kadʒ kɔrtʃʰilen"
  - text: "ভাই ঘরে ভাত খাচ্ছিল, আর আমি জানালার কাছে যাচ্ছিলাম।"
    reading: "bhāi ghôre bhāt khācchilo, ār āmi jānālār kāche jācchilām."
    ipa: "bʱai ɡʱɔre bʱat̪ kʰatʃtʃʰilo ar ami dʒanalar katʃʰe dʒatʃtʃʰilam"
  - text: "তারপর আমরা সবাই বাইরে গেলাম।"
    reading: "tārpor āmrā śôbāi bāire gelām."
    ipa: "t̪arpor amra ʃɔbai baire ɡelam"
  questions:
  - id: "bn-5453"
    prompt:
      en: "The power went off in the morning."
    answer: false
