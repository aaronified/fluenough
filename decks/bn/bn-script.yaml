# How Bengali script works: the recurring features a learner from English
# misses, shown before the first letters and from a script deck's Tips.
# See ADR-0016 and docs/DECK-FORMAT.md.
schema: 1
kind: "script"
part: "core"
id: "bn-script"
language: "bn"
features:
  - id: "headline"
    term: "মাত্রা"
    reading: "mātrā"
    ipa: "mat̪ra"
    example: "ক"
    letters: ["ক", "ঘ", "ত", "দ", "ন", "ম", "ল"]
  - id: "half-headline"
    term: "অর্ধমাত্রা"
    reading: "ôrdhomātrā"
    ipa: "ɔrd̪ʱomat̪ra"
    example: "খ"
    letters: ["ঋ", "খ", "গ", "ণ", "থ", "ধ", "প", "শ"]
  - id: "no-headline"
    term: "মাত্রাহীন"
    reading: "mātrāhin"
    ipa: "mat̪raɦin"
    example: "এ"
    letters: ["এ", "ঐ", "ও", "ঔ", "ঙ", "ঞ", "ৎ", "ং", "ঃ", "ঁ"]
  - id: "rows"
    term: "বর্গ"
    reading: "bôrgo"
    ipa: "bɔrɡo"
    example: "ক"
    letters: ["ক", "খ", "গ", "ঘ", "ঙ", "চ", "ছ", "জ", "ঝ", "ঞ", "ট", "ঠ", "ড", "ঢ", "ণ", "ত", "থ", "দ", "ধ", "ন", "প", "ফ", "ব", "ভ", "ম"]
  - id: "inherent-vowel"
    example: "ক"
    letters: ["ক", "কল", "কলম"]
  - id: "final-vowel"
    example: "ঘর"
    letters: ["ঘর", "জল", "কলম"]
