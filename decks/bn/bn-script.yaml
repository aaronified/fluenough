    term: "হসন্ত"
    reading: "hôśonto"
    ipa: "ɦɔʃont̪o"
    example: "ক্"
    letters: ["ক্", "ত্"]
  - id: "conjuncts"
    term: "যুক্তাক্ষর"
    reading: "juktākkhor"
