schema: 1
id: bn-en-numbers-big
name: "Tens and big numbers"
kind: vocab
theme: numbers-big
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The tens, a hundred, a thousand, lakh and crore, and the halves every market uses."
tags: [beginner]
cards:
  - id: bn-en-numbers-big-0001
    target: "ত্রিশ"
    native: "30, thirty"
    reading: "trish"
    alt_target: ["তিরিশ"]
    pos: "other"
    notes: "Every number up to a hundred has its own word: 26 is ছাব্বিশ (chhabbish), not 'twenty six'. This deck teaches the tens. In speech 30 is often তিরিশ (tirish)."
  - id: bn-en-numbers-big-0002
    target: "চল্লিশ"
    native: "40, forty"
    reading: "chollish"
    pos: "other"
  - id: bn-en-numbers-big-0003
    target: "পঞ্চাশ"
    native: "50, fifty"
    reading: "ponchash"
    pos: "other"
  - id: bn-en-numbers-big-0004
    target: "ষাট"
    native: "60, sixty"
    reading: "shat"
    pos: "other"
  - id: bn-en-numbers-big-0005
    target: "সত্তর"
    native: "70, seventy"
    reading: "shottor"
    pos: "other"
  - id: bn-en-numbers-big-0006
    target: "আশি"
    native: "80, eighty"
    reading: "ashi"
    pos: "other"
  - id: bn-en-numbers-big-0007
    target: "নব্বই"
    native: "90, ninety"
    reading: "nobboi"
    pos: "other"
  - id: bn-en-numbers-big-0008
    target: "একশো"
    native: "100, a hundred"
    reading: "eksho"
    pos: "other"
    notes: "Hundreds join into one word: দুশো (dusho) is 200, তিনশো 300, পাঁচশো 500."
  - id: bn-en-numbers-big-0009
    target: "হাজার"
    native: "1,000, a thousand"
    reading: "hajar"
    pos: "other"
    notes: "দু হাজার কুড়ি (du hajar kuri) is 2020."
  - id: bn-en-numbers-big-0010
    target: "লাখ"
    native: "1,00,000, a lakh (a hundred thousand)"
    reading: "lakh"
    alt_target: ["লক্ষ"]
    pos: "other"
    notes: "Indian numbering counts in lakhs and crores, and places its commas to match: 1,00,000 is one lakh. Formally লক্ষ (lokkho)."
  - id: bn-en-numbers-big-0011
    target: "কোটি"
    native: "1,00,00,000, a crore (ten million)"
    reading: "koti"
    pos: "other"
    notes: "A hundred lakh."
  - id: bn-en-numbers-big-0012
    target: "দেড়"
    native: "1½, one and a half"
    reading: "der"
    pos: "other"
    notes: "With hundreds too: দেড়শো (dersho) is 150. Heard constantly in markets."
  - id: bn-en-numbers-big-0013
    target: "আড়াই"
    native: "2½, two and a half"
    reading: "arai"
    pos: "other"
    notes: "আড়াইশো (araisho) is 250. From 3½ on, Bengali says সাড়ে (share), 'and a half': সাড়ে তিনশো, 350."
