    native: "80, eighty"
    reading: "ashi"
    pos: "other"
  - id: bn-0228
    target: "নব্বই"
    native: "90, ninety"
    reading: "nobboi"
    pos: "other"
  - id: bn-0229
    target: "একশো"
    native: "100, a hundred"
    reading: "eksho"
    alt_target: ["একশ"]
    pos: "other"
    notes: "Also written একশ. Hundreds join into one word: দুশো (dusho) is 200, তিনশো 300, পাঁচশো 500."
  - id: bn-0230
    target: "হাজার"
    native: "1,000, a thousand"
    reading: "hajar"
    pos: "other"
    notes: "দু হাজার কুড়ি (du hajar kuri) is 2020, also দুই হাজার বিশ (dui hajar bish)."
  - id: bn-0231
    target: "লাখ"
    native: "1,00,000, a lakh (a hundred thousand)"
    reading: "lakh"
    alt_target: ["লক্ষ"]
    pos: "other"
    notes: "South Asian numbering counts in lakhs and crores, and places its commas to match: 1,00,000 is one lakh. Formally লক্ষ (lokkho)."
  - id: bn-0232
    target: "কোটি"
    native: "1,00,00,000, a crore (ten million)"
    reading: "koti"
    pos: "other"
    notes: "A hundred lakh."
  - id: bn-0233
    target: "দেড়"
    native: "1½, one and a half"
    reading: "der"
    pos: "other"
    notes: "With hundreds too: দেড়শো (dersho) is 150. Heard constantly in markets."
  - id: bn-0234
    target: "আড়াই"
    native: "2½, two and a half"
    reading: "arai"
    pos: "other"
    notes: "আড়াইশো (araisho) is 250. From 3½ on, Bengali says সাড়ে (share), 'and a half': সাড়ে তিনশো, 350."
  - id: bn-0235
    target: "দুশো"
    native: "200, two hundred"
    reading: "dusho"
    alt_target: ["দুশ", "দুইশো", "দুইশ"]
    pos: "other"
    notes: "The hundreds join into one word: দুশো (dusho), also দুইশ (duisho), but never two words."
  - id: bn-0236
    target: "তিনশো"
