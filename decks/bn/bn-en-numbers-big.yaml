    target: "ষাট"
    native: "60, sixty"
    reading: "śāṭ"
    ipa: "ʃaʈ"
    pos: "other"
    notes: "Not সাত (śāt, 7): ষাট ends in the retroflex ট, with the tongue curled back, and is 60."
