schema: 1
id: bn-en-numbers-big
name: "Tens and big numbers"
kind: vocab
theme: numbers-big
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Every number from 21 to 99, the hundreds, a thousand, lakh and crore, and the halves every market uses."
tags: [beginner]
cards:
  - id: bn-0222
    target: "ত্রিশ"
    native: "30, thirty"
    reading: "triś"
    ipa: "t̪riʃ"
    alt_target: ["তিরিশ"]
    pos: "other"
    notes: "Every number up to a hundred has its own word: 26 is ছাব্বিশ (chābbiś), not 'twenty-six'. In speech 30 is often তিরিশ (tiriś)."
