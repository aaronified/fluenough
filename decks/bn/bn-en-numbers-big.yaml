schema: 1
id: bn-en-numbers-big
name: "Tens and big numbers"
kind: vocab
theme: numbers-big
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Every number from 21 to 99, the hundreds, a thousand, lakh and crore, and the halves every market uses."
tags: [beginner]
cards:
  - id: bn-0222
    target: "ত্রিশ"
    native: "30, thirty"
    reading: "trish"
    alt_target: ["তিরিশ"]
    pos: "other"
    notes: "Every number up to a hundred has its own word: 26 is ছাব্বিশ (chhabbish), not 'twenty-six'. In speech 30 is often তিরিশ (tirish)."
  - id: bn-0223
    target: "চল্লিশ"
    native: "40, forty"
    reading: "chollish"
    pos: "other"
  - id: bn-0224
    target: "পঞ্চাশ"
    native: "50, fifty"
    reading: "ponchash"
    pos: "other"
  - id: bn-0225
    target: "ষাট"
    native: "60, sixty"
    reading: "shat"
    pos: "other"
    notes: "Not সাত (shat, 7): ষাট ends in the retroflex ট, with the tongue curled back, and is 60."
  - id: bn-0226
    target: "সত্তর"
    native: "70, seventy"
    reading: "shottor"
    pos: "other"
  - id: bn-0227
