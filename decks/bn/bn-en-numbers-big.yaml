  - id: bn-0229
    target: "একশো"
    native: "100, a hundred"
    reading: "ekśo"
    ipa: "ekʃo"
    alt_target: ["একশ"]
    pos: "other"
    notes: "Also written একশ. Hundreds join into one word: দুশো (duśo) is 200, তিনশো 300, পাঁচশো 500."
  - id: bn-0230
    target: "হাজার"
    native: "1,000, a thousand"
    reading: "hājār"
    ipa: "ɦadʒar"
    pos: "other"
    notes: "দু হাজার কুড়ি (du hājār kuṛi) is 2020, also দুই হাজার বিশ (dui hājār biś)."
  - id: bn-0231
    target: "লাখ"
    native: "1,00,000, a lakh (a hundred thousand)"
    reading: "lākh"
    ipa: "lakʰ"
    alt_target: ["লক্ষ"]
    pos: "other"
    notes: "South Asian numbering counts in lakhs and crores, and places its commas to match: 1,00,000 is one lakh. Formally লক্ষ (lôkkho)."
  - id: bn-0232
    target: "কোটি"
    native: "1,00,00,000, a crore (ten million)"
    reading: "koṭi"
    ipa: "koʈi"
    pos: "other"
    notes: "A hundred lakh."
  - id: bn-0233
    target: "দেড়"
    native: "1½, one and a half"
    reading: "deṛ"
    ipa: "d̪eɽ"
    pos: "other"
    notes: "With hundreds too: দেড়শো (deṛśo) is 150. Heard constantly in markets."
  - id: bn-0234
    target: "আড়াই"
    native: "2½, two and a half"
    reading: "āṛāi"
    ipa: "aɽai"
    pos: "other"
    notes: "আড়াইশো (āṛāiśo) is 250. From 3½ on, Bengali says সাড়ে (śāṛe), 'and a half': সাড়ে তিনশো, 350."
  - id: bn-0235
    target: "দুশো"
    native: "200, two hundred"
    reading: "duśo"
    ipa: "d̪uʃo"
    alt_target: ["দুশ", "দুইশো", "দুইশ"]
    pos: "other"
    notes: "The hundreds join into one word: দুশো (duśo), also দুইশ (duiśo), but never two words."
