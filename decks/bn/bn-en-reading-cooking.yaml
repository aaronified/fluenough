- "id": "bn-fish-curry-aloud"
  "title": "A grandmother's fish curry"
  "theme": "cooking"
  "sentences":
  - "text": "আজ আমি মাছ রাঁধব।"
    "reading": "āj āmi māch rām̐dhbo."
    "ipa": "adʒ ami matʃʰ rãd̪ʱbo"
  - "text": "প্রথমে পেঁয়াজ আর রসুন কাটব।"
    "reading": "prôthme pem̐yāj ār rośun kāṭbo."
    "ipa": "prɔt̪ʰme pẽjadʒ ar roʃun kaʈbo"
  - "text": "তেলে ফোড়ন দিন।"
    "reading": "tele phoṛon din."
    "ipa": "t̪ele pʰoɽon d̪in"
  - "text": "জল দিয়ে সেদ্ধ করুন।"
    "reading": "jôl diye seddho korun."
    "ipa": "dʒɔl d̪ije sed̪d̪ʱo korun"
