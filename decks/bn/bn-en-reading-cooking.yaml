- "id": "bn-recipe-card"
  "title": "A recipe card"
  "theme": "cooking"
  "sentences":
  - "text": "উপকরণ: ডাল, পেঁয়াজ, রসুন, নুন, হলুদ।"
    "reading": "upokoron: ḍāl, pem̐yāj, rośun, nun, holud."
    "ipa": "upokoron ɖal pẽjadʒ roʃun nun ɦolud̪"
  - "text": "ডালটা ভালো করে ধুয়ে নিন।"
    "reading": "ḍālṭā bhālo kôre dhuye nin."
    "ipa": "ɖalʈa bʱalo kɔre d̪ʱuje nin"
  - "text": "প্রথম ধাপে তেলে ফোড়ন দিন।"
    "reading": "prôthom dhāpe tele phoṛon din."
    "ipa": "prɔt̪ʰom d̪ʱape t̪ele pʰoɽon d̪in"
  - "text": "তারপর ডাল দিয়ে ফোটান।"
    "reading": "tārpor ḍāl diye phoṭān."
    "ipa": "t̪arpor ɖal d̪ije pʰoʈan"
  - "text": "শেষে ধনেপাতা ছড়িয়ে দিন।"
    "reading": "śeśe dhônepātā choṛiye din."
    "ipa": "ʃeʃe d̪ʱɔnepat̪a tʃʰoɽije d̪in"
