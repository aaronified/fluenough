cards:
  - id: "bn-2389"
    target: "মেসেজ"
    reading: "mesej"
    ipa: "mesedʒ"
    pos: "noun"
    notes:
      - { id: "n1", kind: "note" }
    synonyms: [{ id: "s1", ref: "bn-2390" }]
    examples:
      - { target: "আমি তোমাকে মেসেজ পাঠাই।", reading: "āmi tomāke mesej pāṭhāi.", ipa: "ami t̪omake mesedʒ paʈʰai", bases: [{ word: "তোমাকে", ref: "bn-0835" }, { word: "পাঠাই", ref: "bn-1108" }] }
      - { target: "মেসেজটা পড়ো।", reading: "mesejoṭā pôṛo.", ipa: "mesedʒoʈa pɔɽo", bases: [{ word: "মেসেজটা", base: "মেসেজ", reading: "mesej" }, { word: "পড়ো", ref: "bn-0119" }] }
  - id: "bn-2390"
