      - { target: "বার্তাটা খুব জরুরি।", reading: "bārtāṭā khub joruri.", ipa: "bart̪aʈa kʰub dʒoruri", bases: [{ word: "বার্তাটা", base: "বার্তা", reading: "bārtā" }] }
