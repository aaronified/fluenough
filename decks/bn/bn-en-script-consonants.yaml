schema: 1
id: bn-en-script-consonants
name: "Bengali consonants"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Every consonant, each carrying its vowel o, then the dotted letters and the three marks for nasals and breath, on ক."
tags: [beginner, unreviewed, script]
cards:
  - id: bn-en-script-consonants-0001
    target: "ক"
    native: "k (ko)"
    reading: "ko"
    notes: "Like the 'k' of 'skin', with no puff of breath after it. Every consonant carries the open vowel o (অ) unless a sign changes it."
  - id: bn-en-script-consonants-0002
    target: "খ"
    native: "kh, with a breath (kho)"
    reading: "kho"
    notes: "ক with a puff of breath after it, as in 'kh' of 'blockhead'. English 'k' at the start of a word has a little of this breath; Bengali keeps the two apart: কাল (kal, time) against খাল (khal, canal)."
  - id: bn-en-script-consonants-0003
    target: "গ"
    native: "g (go)"
    reading: "go"
    notes: "Like the 'g' of 'go'."
  - id: bn-en-script-consonants-0004
    target: "ঘ"
    native: "gh, with a breath (gho)"
    reading: "gho"
    notes: "গ with a breath after it, as in 'gh' of 'doghouse': ঘর (ghor, room; house)."
  - id: bn-en-script-consonants-0005
    target: "ঙ"
    native: "ng (as in 'sing')"
    reading: "ngo"
    notes: "The 'ng' of 'sing'. It comes after a vowel or in a conjunct, never at the start of a word: ব্যাঙ (byang, frog)."
  - id: bn-en-script-consonants-0006
    target: "চ"
    native: "ch (cho)"
    reading: "cho"
    notes: "Like the 'ch' of 'church', with no puff of breath."
  - id: bn-en-script-consonants-0007
    target: "ছ"
    native: "chh, with a breath (chho)"
    reading: "chho"
    notes: "চ with a breath after it: ছবি (chhobi, picture)."
  - id: bn-en-script-consonants-0008
    target: "জ"
    native: "j (borgiyo jo)"
    reading: "jo"
    notes: "Like the 'j' of 'judge': জল (jol, water). It is called borgiyo jo, 'the j of the rows', to tell it from য, which sounds the same."
  - id: bn-en-script-consonants-0009
    target: "ঝ"
    native: "jh, with a breath (jho)"
    reading: "jho"
    notes: "জ with a breath after it: ঝাল (jhal, hot, as with chilli)."
  - id: bn-en-script-consonants-0010
    target: "ঞ"
    native: "ny (in conjuncts)"
    reading: "nyo"
    notes: "A nasal made against the palate. You see it almost only in conjuncts such as ঞ্চ and ঞ্জ, where it sounds like n: পঞ্চাশ (ponchash, fifty)."
  - id: bn-en-script-consonants-0011
    target: "ট"
    native: "t, curled back (to)"
    reading: "to"
    notes: "The tongue tip curls back and touches the roof of the mouth: retroflex. English 't' is close to this. Compare ত, said with the tongue on the teeth: টাকা (taka, money)."
  - id: bn-en-script-consonants-0012
    target: "ঠ"
    native: "th, curled back, with a breath (tho)"
    reading: "tho"
    notes: "ট with a breath after it: ঠান্ডা (thanda, cold)."
  - id: bn-en-script-consonants-0013
    target: "ড"
    native: "d, curled back (do)"
    reading: "do"
    notes: "The tongue tip curls back, as for ট: ডাক্তার (daktar, doctor). Compare দ, said with the tongue on the teeth."
  - id: bn-en-script-consonants-0014
    target: "ঢ"
    native: "dh, curled back, with a breath (dho)"
    reading: "dho"
    notes: "ড with a breath after it: ঢাকা (dhaka, Dhaka; covered)."
  - id: bn-en-script-consonants-0015
    target: "ণ"
    native: "n (murdhonyo no)"
    reading: "no"
    modes: [recognition, production]
    notes: "Sounds just like ন today: murdhonyo means 'curled back', as it once was. It is a spelling, mostly in words from Sanskrit: কারণ (karon, reason). It sounds just like ন, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: bn-en-script-consonants-0016
    target: "ত"
    native: "t, on the teeth (to)"
    reading: "to"
    notes: "The tongue touches the back of the upper teeth: dental. English has no such t; it sounds softer than English 't'. Compare ট: তুমি (tumi, you)."
  - id: bn-en-script-consonants-0017
    target: "থ"
    native: "th, on the teeth, with a breath (tho)"
    reading: "tho"
    notes: "ত with a breath after it. Not the 'th' of 'thin': থাকা (thaka, to stay)."
  - id: bn-en-script-consonants-0018
    target: "দ"
    native: "d, on the teeth (do)"
    reading: "do"
    notes: "The tongue touches the back of the upper teeth, as for ত: দিন (din, day). Compare ড."
  - id: bn-en-script-consonants-0019
    target: "ধ"
    native: "dh, on the teeth, with a breath (dho)"
    reading: "dho"
    notes: "দ with a breath after it: ধন্যবাদ (dhonnobad, thank you). Not the 'th' of 'this'."
  - id: bn-en-script-consonants-0020
    target: "ন"
    native: "n (dontyo no)"
    reading: "no"
    notes: "The 'n' of 'no'. Dontyo means 'of the teeth', to tell it from ণ, which sounds the same today: নাম (nam, name)."
  - id: bn-en-script-consonants-0021
    target: "প"
    native: "p (po)"
    reading: "po"
    notes: "Like the 'p' of 'spin', with no puff of breath."
  - id: bn-en-script-consonants-0022
    target: "ফ"
    native: "ph, with a breath (pho)"
    reading: "pho"
    notes: "প with a breath after it. Many speakers say it like English 'f': ফল (phol, fruit)."
  - id: bn-en-script-consonants-0023
    target: "ব"
    native: "b (bo)"
    reading: "bo"
    notes: "Like the 'b' of 'boy'. Bengali has no separate 'v' sound: বই (boi, book)."
  - id: bn-en-script-consonants-0024
    target: "ভ"
    native: "bh, with a breath (bho)"
    reading: "bho"
    notes: "ব with a breath after it. Not 'v': ভাত (bhat, cooked rice)."
  - id: bn-en-script-consonants-0025
    target: "ম"
    native: "m (mo)"
    reading: "mo"
    notes: "Like the 'm' of 'mother': মা (ma, mother)."
  - id: bn-en-script-consonants-0026
    target: "য"
    native: "j (ontostho jo)"
    reading: "jo"
    modes: [recognition, production]
    notes: "At the start of a word it sounds just like জ: যাওয়া (jaowa, to go). After another consonant it is written as the y-sign (য-ফলা), as in ব্য. It sounds just like জ, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: bn-en-script-consonants-0027
    target: "র"
    native: "r (ro)"
    reading: "ro"
    notes: "A single tap of the tongue, like the 'tt' of American 'butter' or the r of Spanish 'pero'. Never silent: রাত (rat, night)."
  - id: bn-en-script-consonants-0028
    target: "ল"
    native: "l (lo)"
    reading: "lo"
    notes: "A clear 'l', as at the start of 'leaf': লাল (lal, red)."
  - id: bn-en-script-consonants-0029
    target: "শ"
    native: "sh (talobyo sho)"
    reading: "sho"
    notes: "The 'sh' of 'shop': শাড়ি (shari, sari). Bengali says শ, ষ and স all as 'sh' in most words; their names tell them apart in spelling."
  - id: bn-en-script-consonants-0030
    target: "ষ"
    native: "sh (murdhonyo sho)"
    reading: "sho"
    modes: [recognition, production]
    notes: "Sounds just like শ, 'sh'. It is a spelling, mostly in words from Sanskrit: ভাষা (bhasha, language). It sounds just like শ, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: bn-en-script-consonants-0031
    target: "স"
    native: "sh or s (dontyo sho)"
    reading: "sho"
    modes: [recognition, production]
    notes: "Usually 'sh' too: সে (she, he; she). It is said 's' before t, th, n, r and l, as in আস্তে (aste, slowly), and in many English words. It sounds just like শ in most words, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: bn-en-script-consonants-0032
    target: "হ"
    native: "h (ho)"
    reading: "ho"
    notes: "Like the 'h' of 'hat': হাত (hat, hand)."
  - id: bn-en-script-consonants-0033
    target: "ড়"
    native: "r, flapped (ড-e shunyo ro)"
    reading: "ro"
    notes: "ড with a dot below: the tongue curls back and flaps forward. It never starts a word: বাড়ি (bari, house; home)."
  - id: bn-en-script-consonants-0034
    target: "ঢ়"
    native: "rh, flapped, with a breath (ঢ-e shunyo ro)"
    reading: "rho"
    modes: [recognition, production]
    notes: "ঢ with a dot below. Most speakers say it like ড়. It is rare: আষাঢ় (asharh, a month of the rains). It sounds just like ড়, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: bn-en-script-consonants-0035
    target: "য়"
    native: "y (ontostho yo)"
    reading: "yo"
    notes: "য with a dot below: a 'y' or 'w' glide between vowels. It never starts a word: আয় (ay, come)."
  - id: bn-en-script-consonants-0036
    target: "ৎ"
    native: "t, with no vowel (khondo to)"
    reading: "t"
    notes: "A t that ends a syllable with no vowel after it: হঠাৎ (hothat, suddenly)."
  - id: bn-en-script-consonants-0037
    target: "কং"
    native: "ng after a vowel (onusshar), on ক"
    reading: "kong"
    modes: [recognition, production]
    notes: "ং (onusshar) after a vowel is said 'ng': কং is 'kong', as in বাংলা (bangla, Bengali). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  - id: bn-en-script-consonants-0038
    target: "কঃ"
    native: "the breath mark (bishorgo), on ক"
    reading: "koh"
    modes: [recognition, production]
    notes: "ঃ (bishorgo) is rare. Inside a word it usually doubles the next consonant: দুঃখ (dukkho, sorrow). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  - id: bn-en-script-consonants-0039
    target: "কাঁ"
    native: "nasal vowel mark (chondrobindu), on কা"
    reading: "kan"
    modes: [recognition, production]
    notes: "ঁ (chondrobindu) above a letter makes its vowel nasal, said through the nose as well: কাঁ is 'kan', as in কাঁদা (kanda, to cry). With it or without it are different words: বাধা (badha, obstacle), বাঁধা (bandha, tied). A mark rather than a sound of its own, so it is drilled by reading and writing only."
