schema: 1
id: bn-en-script-consonants
name: "Bengali consonants"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Every consonant, each carrying its vowel o, then the dotted letters and the three marks for nasals and breath, on ক. Not yet checked by a Bengali speaker: please report any mistake."
tags: [beginner, unreviewed, script]
cards:
  - id: bn-0012
    target: "ক"
    native: "k (kô)"
    reading: "kô"
    ipa: "kɔ"
    notes: "Like the 'k' of 'skin', with no puff of breath after it. Every consonant carries the open vowel o (অ) unless a sign changes it."
  - id: bn-0013
    target: "খ"
    native: "kh, with a breath (khô)"
    reading: "khô"
    ipa: "kʰɔ"
    notes: "ক with a puff of breath after it, as in the 'kh' of 'blockhead'. English 'k' at the start of a word has a little of this breath; Bengali keeps the two apart: কাল (kāl, tomorrow) against খাল (khāl, canal)."
  - id: bn-0014
    target: "গ"
    native: "g (gô)"
    reading: "gô"
    ipa: "ɡɔ"
    notes: "Like the 'g' of 'go'."
  - id: bn-0015
    target: "ঘ"
    native: "gh, with a breath (ghô)"
    reading: "ghô"
    ipa: "ɡʱɔ"
    notes: "গ with a breath after it, as in the 'gh' of 'doghouse': ঘর (ghôr, room; house)."
  - id: bn-0016
    target: "ঙ"
    native: "ng (as in 'sing')"
    reading: "ṅô"
    ipa: "ŋɔ"
    notes: "The 'ng' of 'sing'. It comes after a vowel or in a conjunct, never at the start of a word: ব্যাঙ (bêṅ, frog)."
  - id: bn-0017
    target: "চ"
    native: "ch (cô)"
    reading: "cô"
    ipa: "tʃɔ"
    notes: "Like the 'ch' of 'church', with no puff of breath."
  - id: bn-0018
    target: "ছ"
    native: "chh, with a breath (chô)"
    reading: "chô"
    ipa: "tʃʰɔ"
    notes: "চ with a breath after it: ছবি (chobi, picture)."
  - id: bn-0019
    target: "জ"
    native: "j (borgiyo jo)"
    reading: "jô"
    ipa: "dʒɔ"
    notes: "Like the 'j' of 'judge': জল (jôl, water). It is called borgiyo jo, 'the j of the rows', to tell it from য, which sounds the same."
  - id: bn-0020
    target: "ঝ"
    native: "jh, with a breath (jhô)"
    reading: "jhô"
    ipa: "dʒʱɔ"
    notes: "জ with a breath after it: ঝাল (jhāl, hot, as with chilli)."
  - id: bn-0021
    target: "ঞ"
    native: "ny (in conjuncts)"
    reading: "ñô"
    ipa: "ɲɔ"
    notes: "A nasal made against the palate. You see it almost only in conjuncts such as ঞ্চ and ঞ্জ, where it sounds like n: পঞ্চাশ (pôncāś, fifty)."
  - id: bn-0022
    target: "ট"
    native: "t, curled back (ṭô)"
    reading: "ṭô"
    ipa: "ʈɔ"
    notes: "The tongue tip curls back and touches the roof of the mouth: retroflex. English 't' is close to this. Compare ত, said with the tongue on the teeth: টাকা (ṭākā, money)."
  - id: bn-0023
    target: "ঠ"
    native: "th, curled back, with a breath (ṭhô)"
    reading: "ṭhô"
    ipa: "ʈʰɔ"
    notes: "ট with a breath after it: ঠান্ডা (ṭhānḍā, cold)."
  - id: bn-0024
    target: "ড"
    native: "d, curled back (ḍô)"
    reading: "ḍô"
    ipa: "ɖɔ"
    notes: "The tongue tip curls back, as for ট, and touches the roof of the mouth just behind the ridge behind the teeth: ডাক্তার (ḍāktār, doctor). Compare দ, said with the tongue on the teeth."
  - id: bn-0025
    target: "ঢ"
    native: "dh, curled back, with a breath (ḍhô)"
    reading: "ḍhô"
    ipa: "ɖʱɔ"
    notes: "Like ড, but the tongue touches the roof of the mouth a little further back, with a breath after it: ঢাকা (ḍhākā, Dhaka; covered)."
  - id: bn-0026
    target: "ণ"
    native: "n (murdhonno no)"
    reading: "nô"
    ipa: "nɔ"
    modes: [recognition, production]
    notes: "Sounds just like ন today: murdhonno means 'curled back', as it once was. It is a spelling, mostly in words from Sanskrit: কারণ (kāron, reason). Because it sounds the same, it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: bn-0027
    target: "ত"
    native: "t, on the teeth (tô)"
    reading: "tô"
    ipa: "t̪ɔ"
    notes: "The tongue touches the back of the upper teeth: dental. English has no such t; it sounds softer than English 't'. Compare ট: তুমি (tumi, you)."
  - id: bn-0028
    target: "থ"
    native: "th, on the teeth, with a breath (thô)"
    reading: "thô"
    ipa: "t̪ʰɔ"
    notes: "ত with a breath after it. Not the 'th' of 'thin': থাকা (thākā, to stay)."
  - id: bn-0029
    target: "দ"
    native: "d, on the teeth (dô)"
    reading: "dô"
    ipa: "d̪ɔ"
    notes: "The tongue touches the back of the upper teeth, as for ত: দিন (din, day). Compare ড."
  - id: bn-0030
    target: "ধ"
    native: "dh, on the teeth, with a breath (dhô)"
    reading: "dhô"
    ipa: "d̪ʱɔ"
    notes: "দ with a breath after it: ধন্যবাদ (dhonnobād, thank you). Not the 'th' of 'this'."
  - id: bn-0031
    target: "ন"
    native: "n (donto no)"
    reading: "nô"
    ipa: "nɔ"
    notes: "The 'n' of 'no'. Donto means 'of the teeth', to tell it from ণ, which sounds the same today: নাম (nām, name)."
  - id: bn-0032
    target: "প"
    native: "p (pô)"
    reading: "pô"
    ipa: "pɔ"
    notes: "Like the 'p' of 'spin', with no puff of breath."
  - id: bn-0033
    target: "ফ"
    native: "ph, with a breath (phô)"
    reading: "phô"
    ipa: "pʰɔ"
    notes: "প with a breath after it. Many speakers say it like English 'f': ফল (phôl, fruit)."
  - id: bn-0034
    target: "ব"
    native: "b (bô)"
    reading: "bô"
    ipa: "bɔ"
    notes: "Like the 'b' of 'boy'. Bengali has no separate 'v' sound: বই (boi, book)."
  - id: bn-0035
    target: "ভ"
    native: "bh, with a breath (bhô)"
    reading: "bhô"
    ipa: "bʱɔ"
    notes: "ব with a breath after it. Not 'v': ভাত (bhāt, cooked rice)."
  - id: bn-0036
    target: "ম"
    native: "m (mô)"
    reading: "mô"
    ipa: "mɔ"
    notes: "Like the 'm' of 'mother': মা (mā, mother)."
  - id: bn-0037
    target: "য"
    native: "j (ontostho jo)"
    reading: "jô"
    ipa: "dʒɔ"
    modes: [recognition, production]
    notes: "At the start of a word it sounds just like জ: যাওয়া (jāoā, to go). After another consonant it is written as the y-sign (য-ফলা), as in ব্য. Because it sounds the same, it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: bn-0038
    target: "র"
    native: "r (rô)"
    reading: "rô"
    ipa: "rɔ"
    notes: "A single tap of the tongue, like the 'tt' of American 'butter' or the r of Spanish 'pero'. Never silent: রাত (rāt, night)."
  - id: bn-0039
    target: "ল"
    native: "l (lô)"
    reading: "lô"
    ipa: "lɔ"
    notes: "A clear 'l', as at the start of 'leaf': লাল (lāl, red)."
  - id: bn-0040
    target: "শ"
    native: "sh (talobbo sho)"
    reading: "śô"
    ipa: "ʃɔ"
    notes: "The 'sh' of 'shop': শাড়ি (śāṛi, sari). Bengali says শ, ষ and স all as 'sh' in most words; their names tell them apart in spelling."
  - id: bn-0041
    target: "ষ"
    native: "sh (murdhonno sho)"
    reading: "śô"
    ipa: "ʃɔ"
    modes: [recognition, production]
    notes: "Sounds just like শ, 'sh'. It is a spelling, mostly in words from Sanskrit: ভাষা (bhāśā, language). Because it sounds the same, it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: bn-0042
    target: "স"
    native: "sh or s (donto sho)"
    reading: "śô"
    ipa: "ʃɔ"
    modes: [recognition, production]
    notes: "Usually 'sh' too: সে (śe, he; she). It is said 's' before t, th, n, r and l, as in আস্তে (āste, slowly), and in many English words. It sounds just like শ in most words, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  - id: bn-0043
    target: "হ"
    native: "h (hô)"
    reading: "hô"
    ipa: "ɦɔ"
    notes: "Like the 'h' of 'hat': হাত (hāt, hand)."
  - id: bn-0044
    target: "ড়"
    native: "r, tongue placed as for ড (do-e shunno ro)"
    reading: "ṛô"
    ipa: "ɽɔ"
    notes: "ড with a dot below: the tongue is placed as for ড, but doesn't touch the roof of the mouth. It never starts a word: বাড়ি (bāṛi, house; home)."
  - id: bn-0045
    target: "ঢ়"
    native: "rh, tongue placed as for ঢ (dho-e shunno rho)"
    reading: "ṛô"
    ipa: "ɽɔ"
    notes: "ঢ with a dot below: the tongue is placed as for ঢ, a little further back than for ড়, and doesn't touch the roof of the mouth. It is rare: আষাঢ় (āśāṛ, a month of the rains)."
  - id: bn-0046
    target: "য়"
    native: "y (ontostho yo)"
    reading: "yô"
    ipa: "jɔ"
    notes: "য with a dot below: a 'y' or 'w' glide between vowels. It never starts a word: আয় (āy, come)."
  - id: bn-0047
    target: "ৎ"
    native: "t, with no vowel (khondo to)"
    reading: "t"
    ipa: "t̪"
    notes: "A t that ends a syllable with no vowel after it: হঠাৎ (hôṭhāt, suddenly)."
  - id: bn-0048
    target: "কং"
    native: "ng after a vowel (onushshar), on ক"
    reading: "kôṅ"
    ipa: "kɔŋ"
    modes: [recognition, production]
    notes: "ং (onushshar) after a vowel is said 'ng': কং is 'kong', as in বাংলা (bāṅlā, Bengali). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  - id: bn-0049
    target: "কঃ"
    native: "the breath mark (bishorgo), on ক"
    reading: "kôḥ"
    ipa: "kɔh"
    modes: [recognition, production]
    notes: "ঃ (bishorgo) is rare. Inside a word it usually doubles the next consonant: দুঃখ (dukkho, sorrow). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  - id: bn-0050
    target: "কাঁ"
    native: "nasal vowel mark (chondrobindu), on কা"
    reading: "kām̐"
    ipa: "kã"
    modes: [recognition, production]
    notes: "ঁ (chondrobindu) above a letter makes its vowel nasal, said through the nose as well: কাঁ is 'kan', as in কাঁদা (kām̐dā, to cry). With it or without it are different words: বাধা (bādhā, obstacle), বাঁধা (bām̐dhā, tied). A mark rather than a sound of its own, so it is drilled by reading and writing only."
