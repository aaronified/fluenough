        "তুই / তোরা": "নস"
        "তুমি / তোমরা": "নও"
        "আপনি / আপনারা": "নন"
        "সে / তারা": "নয়"
        "তিনি / তাঁরা": "নন"
      readings:
        "আমি / আমরা": "noi"
        "তুই / তোরা": "nôś"
        "তুমি / তোমরা": "nôo"
        "আপনি / আপনারা": "nôn"
        "সে / তারা": "nôy"
        "তিনি / তাঁরা": "nôn"
      ipas:
        "আমি / আমরা": "noi"
        "তুই / তোরা": "nɔʃ"
        "তুমি / তোমরা": "nɔo"
