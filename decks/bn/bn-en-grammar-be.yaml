schema: 1
id: bn-en-grammar-be
name: "To be: আছে (āche), ছিল (chil), নয় (nôy)"
kind: grammar
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Bengali's three ways of saying be: আছে (āche) for where and how someone is, ছিল (chil) for was, and নয় (nôy) for is not. Not yet checked by a Bengali speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "To be"
  slot_name: "person and respect"
  slots: ["আমি / আমরা", "তুই / তোরা", "তুমি / তোমরা", "আপনি / আপনারা", "সে / তারা", "তিনি / তাঁরা"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "আছে (āche) is be for where and how: আমি ভালো আছি (āmi bhālo āchi), I'm well; বাবা বাড়িতে আছেন (bābā bāṛite āchen), Father is at home. With the owner's -র (-rô) it is have: আমার সময় আছে (āmār śômoy āche), I have time. Its negative is নেই (nei), the same for every person: আমি বাড়িতে নেই (āmi bāṛite nei), I'm not at home. With a noun or an adjective the present has no verb (আমি ছাত্র (āmi chātro), I am a student), but 'not' has one: আমি ছাত্র নই (āmi chātro noi). In speech না (nā) often stands for every নয় (nôy) form: আমি ছাত্র না (āmi chātro nā). ছিল (chil) is the past of both: আমি বাড়িতে ছিলাম (āmi bāṛite chilām), আমি ছাত্র ছিলাম (āmi chātro chilām), and its negative puts না (nā) after it: ছিলাম না (chilām nā). ও (o) and এ (e) take the same form as সে (se), and উনি (uni) and ইনি (ini) the same as তিনি (tini). তুমি আছো (tumi ācho) is also written আছ (āch), and both are accepted."
  entries:
    - lemma: "আছে"
      key: achhe
      reading: "āche"
      ipa: "atʃʰe"
      gloss: "am, is, are (somewhere, or how); there is"
      forms:
        "আমি / আমরা": "আছি"
        "তুই / তোরা": "আছিস"
        "তুমি / তোমরা": ["আছো", "আছ"]
        "আপনি / আপনারা": "আছেন"
        "সে / তারা": "আছে"
        "তিনি / তাঁরা": "আছেন"
      readings:
        "আমি / আমরা": "āchi"
        "তুই / তোরা": "āchiś"
        "তুমি / তোমরা": ["ācho", "ācho"]
        "আপনি / আপনারা": "āchen"
        "সে / তারা": "āche"
        "তিনি / তাঁরা": "āchen"
      ipas:
        "আমি / আমরা": "atʃʰi"
        "তুই / তোরা": "atʃʰiʃ"
        "তুমি / তোমরা": "atʃʰo"
        "আপনি / আপনারা": "atʃʰen"
        "সে / তারা": "atʃʰe"
        "তিনি / তাঁরা": "atʃʰen"
    - lemma: "ছিল"
      key: chhilo
      reading: "chilo"
      ipa: "tʃʰilo"
      gloss: "was, were"
      forms:
        "আমি / আমরা": "ছিলাম"
        "তুই / তোরা": "ছিলি"
        "তুমি / তোমরা": "ছিলে"
        "আপনি / আপনারা": "ছিলেন"
        "সে / তারা": "ছিল"
        "তিনি / তাঁরা": "ছিলেন"
      readings:
        "আমি / আমরা": "chilām"
        "তুই / তোরা": "chili"
        "তুমি / তোমরা": "chile"
        "আপনি / আপনারা": "chilen"
        "সে / তারা": "chilo"
        "তিনি / তাঁরা": "chilen"
      ipas:
        "আমি / আমরা": "tʃʰilam"
        "তুই / তোরা": "tʃʰili"
        "তুমি / তোমরা": "tʃʰile"
        "আপনি / আপনারা": "tʃʰilen"
        "সে / তারা": "tʃʰilo"
        "তিনি / তাঁরা": "tʃʰilen"
    - lemma: "নয়"
      key: noy
      reading: "nôy"
      ipa: "nɔj"
