  - id: "bn-3965"
    target: "বাড়িওয়ালি"
    reading: "bāṛioyāli"
    ipa: "baɽiojali"
    pos: "noun"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "বাড়িওয়ালি", reading: "bāṛioyāli" }] }
    examples:
      - { target: "বাড়িওয়ালি ভালো মানুষ।", reading: "bāṛioyāli bhālo mānuś.", ipa: "baɽiojali bʱalo manuʃ", bases: [{ word: "ভালো", ref: "bn-0617" }, { word: "মানুষ", base: "মানুষ", reading: "mānuś" }] }
      - { target: "বাড়িওয়ালির সঙ্গে কথা বললাম।", reading: "bāṛioyālir sôṅge kôthā bôlolām.", ipa: "baɽiojalir sɔŋɡe kɔt̪ʰa bɔlolam", bases: [{ word: "বাড়িওয়ালির", base: "বাড়িওয়ালি", reading: "bāṛioyālir" }, { word: "সঙ্গে", ref: "bn-0296" }, { word: "কথা", ref: "bn-2409" }, { word: "বললাম", ref: "bn-0879" }] }
  - id: "bn-3966"
    target: "গৃহপ্রবেশ"
    reading: "grihoprobeś"
    ipa: "ɡriɦoprobeʃ"
    pos: "noun"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "গৃহপ্রবেশ", reading: "grihoprobeś" }] }
    examples:
      - { target: "গৃহপ্রবেশের দিন সবাই এল।", reading: "grihoprobeśer din sôbāi el.", ipa: "ɡriɦoprobeʃer d̪in sɔbai el", bases: [{ word: "গৃহপ্রবেশের", base: "গৃহপ্রবেশ", reading: "grihoprobeśer" }, { word: "দিন", ref: "bn-0251" }, { word: "সবাই", ref: "bn-0854" }, { word: "এল", ref: "bn-0872" }] }
      - { target: "নতুন বাড়িতে গৃহপ্রবেশ হলো।", reading: "notun bāṛite grihoprobeś hôlo.", ipa: "not̪un baɽit̪e ɡriɦoprobeʃ ɦɔlo", bases: [{ word: "নতুন", ref: "bn-0620" }, { word: "বাড়িতে", ref: "bn-0124" }, { word: "গৃহপ্রবেশ", base: "গৃহপ্রবেশ", reading: "grihoprobeś" }, { word: "হলো", ref: "bn-0812" }] }
  - id: "bn-3967"
    target: "আসবাবপত্র"
    reading: "āsobābopotr"
    ipa: "asobabopot̪r"
    pos: "noun"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "আসবাবপত্র", reading: "āsobābopotr" }] }
    examples:
      - { target: "আসবাবপত্রগুলো পুরোনো।", reading: "āsobābopotrogulo purono.", ipa: "asobabopot̪roɡulo purono", bases: [{ word: "আসবাবপত্রগুলো", base: "আসবাবপত্র", reading: "āsobābopotrogulo" }, { word: "পুরোনো", ref: "bn-0621" }] }
      - { target: "নতুন আসবাবপত্র কিনতে হবে।", reading: "notun āsobābopotr kinote hôbe.", ipa: "not̪un asobabopot̪r kinot̪e ɦɔbe", bases: [{ word: "নতুন", ref: "bn-0620" }, { word: "কিনতে", ref: "bn-0890" }, { word: "হবে", ref: "bn-0874" }] }
  - id: "bn-3968"
    target: "স্নানঘর"
    reading: "snānoghor"
    ipa: "snanoɡʱor"
    pos: "noun"
    notes:
