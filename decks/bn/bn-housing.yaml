      - { target: "ওভেনটা গরম হচ্ছে।", reading: "obhenoṭā gôrom hôcche.", ipa: "obʱenoʈa ɡɔrom ɦɔtʃtʃʰe", bases: [{ word: "ওভেনটা", base: "ওভেন", reading: "obhenoṭā" }, { word: "গরম", ref: "bn-0060" }, { word: "হচ্ছে", ref: "bn-0874" }] }
  - id: "bn-3972"
