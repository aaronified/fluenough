    examples:
      - { target: "কক্ষটি খুব বড়।", reading: "kôkkhoṭi khub bôṛ.", ipa: "kɔkkʰoʈi kʰub bɔɽ", bases: [{ word: "খুব", ref: "bn-0641" }, { word: "বড়", ref: "bn-0062" }] }
      - { target: "সভার কক্ষে অনেক লোক।", reading: "sôbhār kôkkhe ônek lok.", ipa: "sɔbʱar kɔkkʰe ɔnek lok", bases: [{ word: "সভার", ref: "bn-2622" }, { word: "কক্ষে", base: "কক্ষ", reading: "kôkkhe" }, { word: "অনেক", ref: "bn-0550" }, { word: "লোক", base: "লোক", reading: "lok" }] }
  - id: "bn-3971"
