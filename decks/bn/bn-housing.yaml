      - { target: "দড়িটা খুব শক্ত।", reading: "doṛiṭā khub śôkt.", ipa: "d̪oɽiʈa kʰub ʃɔkt̪", bases: [{ word: "দড়িটা", base: "দড়ি", reading: "doṛiṭā" }, { word: "খুব", ref: "bn-0641" }, { word: "শক্ত", ref: "bn-0638" }] }
