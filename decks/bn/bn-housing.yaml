    reading: "śôyonokokkh"
    ipa: "ʃɔjonokokkʰ"
    pos: "noun"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "শয়নকক্ষ", reading: "śôyonokokkh" }] }
    examples:
      - { target: "শয়নকক্ষে একটা খাট আছে।", reading: "śôyonokokkhe ekoṭā khāṭ āche.", ipa: "ʃɔjonokokkʰe ekoʈa kʰaʈ atʃʰe", bases: [{ word: "একটা", base: "একটা", reading: "ekoṭā" }, { word: "খাট", ref: "bn-2578" }, { word: "আছে", base: "আছে", reading: "āche" }] }
      - { target: "শয়নকক্ষের জানালা বড়।", reading: "śôyonokokkher jānālā bôṛ.", ipa: "ʃɔjonokokkʰer dʒanala bɔɽ", bases: [{ word: "শয়নকক্ষের", base: "শয়নকক্ষ", reading: "śôyonokokkher" }, { word: "জানালা", ref: "bn-0600" }, { word: "বড়", ref: "bn-0062" }] }
  - id: "bn-3970"
