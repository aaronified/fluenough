        answer: true
      - id: "bn-5414"
        prompt: { en: "The speaker says this phone is cheaper." }
        answer: true
  - id: "bn-two-cities"
    title: "Village and town"
    theme: "describing"
    sentences:
      - { text: "গ্রাম ছোট।", reading: "grām choṭo.", ipa: "ɡram tʃʰoʈo" }
      - { text: "গ্রামে নদী আর পাহাড়।", reading: "grāme nodi ār pāhāṛ.", ipa: "ɡrame nod̪i ar paɦaɽ" }
      - { text: "শহরে দোকান বেশি।", reading: "śôhore dokān beśi.", ipa: "ʃɔɦore d̪okan beʃi" }
      - { text: "শহরে বাস আর ট্রেন।", reading: "śôhore bāś ār ṭren.", ipa: "ʃɔɦore baʃ ar ʈren" }
      - { text: "গ্রামের বাতাস পরিষ্কার।", reading: "grāmer bātās poriskār.", ipa: "ɡramer bat̪as poriskar" }
    questions:
