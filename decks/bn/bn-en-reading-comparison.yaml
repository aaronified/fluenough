        prompt: { en: "The text says the village is small." }
        answer: true
      - id: "bn-5416"
        prompt: { en: "Where are there more shops?" }
        options: [{ en: "In the village" }, { en: "In the town" }]
        answer: 2
      - id: "bn-5417"
        prompt: { en: "The text says the air in the village is clean." }
