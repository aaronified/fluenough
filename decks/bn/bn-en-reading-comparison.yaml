      - { text: "ওটা বেশি দামি।", reading: "oṭā beśi dāmi.", ipa: "oʈa beʃi d̪ami" }
      - { text: "এটা কম দামি।", reading: "eṭā kôm dāmi.", ipa: "eʈa kɔm d̪ami" }
      - { text: "এটা সবচেয়ে ভালো।", reading: "eṭā sôbceye bhālo.", ipa: "eʈa sɔbtʃeje bʱalo" }
