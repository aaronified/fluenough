passages:
  - id: "bn-ticket-counter"
    title: "Buying a train ticket"
    theme: "journey"
    sentences:
      - { text: "আমাকে একটা টিকিট দিন।", reading: "āmāke ekṭā ṭikiṭ din.", ipa: "amake ekʈa ʈikiʈ d̪in" }
      - { text: "এই ট্রেনটা কখন ছাড়বে?", reading: "ei ṭrenṭā kôkhon chāṛbe?", ipa: "ei ʈrenʈa kɔkʰon tʃʰaɽbe" }
      - { text: "কোন প্ল্যাটফর্মে যাব?", reading: "kon plêṭforme jābo?", ipa: "kon plæʈforme dʒabo" }
      - { text: "দুটো টিকিট লাগবে।", reading: "duṭo ṭikiṭ lāgbe.", ipa: "d̪uʈo ʈikiʈ laɡbe" }
      - { text: "ধন্যবাদ, এই নিন।", reading: "dhonnobād, ei nin.", ipa: "d̪ʱonnobad̪ ei nin" }
    questions:
      - id: "bn-5506"
        prompt: { en: "The buyer needs two tickets." }
        answer: true
      - id: "bn-5507"
        prompt: { en: "What does the buyer ask about?" }
        options: [{ en: "When the train leaves" }, { en: "The price of a bus" }]
        answer: 1
      - id: "bn-5508"
        prompt: { en: "The passage ends with a thank you." }
        answer: true
  - id: "bn-train-timetable"
    title: "A train timetable and a notice"
    theme: "journey"
    sentences:
      - { text: "সময়সূচিটা দেখুন।", reading: "sômoysuciṭā dekhun.", ipa: "sɔmojsutʃiʈa d̪ekʰun" }
      - { text: "ট্রেনটা প্ল্যাটফর্ম তিন থেকে ছাড়বে।", reading: "ṭrenṭā plêṭform tin theke chāṛbe.", ipa: "ʈrenʈa plæʈform t̪in t̪ʰeke tʃʰaɽbe" }
      - { text: "ট্রেনটা দেরিতে আসবে।", reading: "ṭrenṭā derite āśbe.", ipa: "ʈrenʈa d̪erit̪e aʃbe" }
      - { text: "বাসটা এখানে থামে।", reading: "bāśṭā ekhāne thāme.", ipa: "baʃʈa ekʰane t̪ʰame" }
      - { text: "ফেরির টিকিট এখানে পাওয়া যায়।", reading: "ferir ṭikiṭ ekhāne pāoā jāy.", ipa: "ferir ʈikiʈ ekʰane paoa dʒaj" }
    questions:
      - id: "bn-5509"
        prompt: { en: "The train leaves from platform three." }
        answer: true
      - id: "bn-5510"
        prompt: { en: "What does the notice say about one train?" }
        options: [{ en: "It will be late" }, { en: "It will not run" }]
        answer: 1
      - id: "bn-5511"
        prompt: { en: "Ferry tickets can be bought here." }
        answer: true
