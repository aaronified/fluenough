- "id": "bn-festival-invitation"
  "title": "An invitation"
  "theme": "festivals"
  "sentences":
  - "text": "প্রিয় রহিম, আগামী রবিবার আমাদের বাড়িতে ঈদের ভোজ আছে।"
    "reading": "priy rohim, āgāmi robibār āmāder bāṛite ider bhoj āche."
    "ipa": "prij roɦim aɡami robibar amad̪er baɽit̪e id̪er bʱodʒ atʃʰe"
  - "text": "সন্ধ্যা ছয়টায় এসো। উপহার আনতে ভুলো না।"
    "reading": "sônddhā chôyoṭāy eso. upohār ānote bhulo nā."
    "ipa": "sɔnd̪d̪ʱa tʃʰɔjoʈaj eso upoɦar anot̪e bʱulo na"
  "questions":
  - "id": "bn-1683"
    "prompt":
      "en": "The invitation is to a meal at the writer's home."
    "answer": true
