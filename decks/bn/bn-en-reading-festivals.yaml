- "id": "bn-puja-plans"
  "title": "Plans for the puja"
  "theme": "festivals"
  "sentences":
  - "text": "পূজায় আমরা বাড়িতে বন্ধুদের ডাকব।"
    "reading": "pujāy āmorā bāṛite bondhuder ḍākob."
    "ipa": "pudʒaj amora baɽit̪e bond̪ʱud̪er ɖakob"
  - "text": "বাবা বাজি কিনবেন।"
    "reading": "bābā bāji kinoben."
    "ipa": "baba badʒi kinoben"
  - "text": "মা বড় ভোজ রান্না করবেন।"
    "reading": "mā bôṛ bhoj rānnā kôroben."
    "ipa": "ma bɔɽ bʱodʒ ranna kɔroben"
  - "text": "আর আমি সন্ধ্যায় প্রদীপ জ্বালাব।"
    "reading": "ār āmi sônddhāy prodip jālāb."
    "ipa": "ar ami sɔnd̪d̪ʱaj prod̪ip dʒalab"
  "questions":
  - "id": "bn-1681"
    "prompt":
      "en": "The family will invite friends to the house for the puja."
    "answer": true
  - "id": "bn-1682"
