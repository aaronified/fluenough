    - lemma: "করা"
      key: kora
      reading: "kôrā"
      ipa: "kɔra"
      gloss: "to do"
      forms:
        "আমি / আমরা": "করিনি"
        "তুই / তোরা": "করিসনি"
        "তুমি / তোমরা": ["করোনি", "করনি"]
        "আপনি / আপনারা": "করেননি"
        "সে / তারা": "করেনি"
        "তিনি / তাঁরা": "করেননি"
      readings:
        "আমি / আমরা": "korini"
        "তুই / তোরা": "koriśni"
        "তুমি / তোমরা": ["kôroni", "kôroni"]
        "আপনি / আপনারা": "kôrenni"
        "সে / তারা": "kôreni"
        "তিনি / তাঁরা": "kôrenni"
      ipas:
        "আমি / আমরা": "korini"
        "তুই / তোরা": "koriʃni"
        "তুমি / তোমরা": "kɔroni"
