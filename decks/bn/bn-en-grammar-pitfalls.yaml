description: "The mistakes English speakers make most in Bengali."
tags: [beginner, grammar]
cards:
  - id: bn-0383
    target: "আপনি বসুন।"
    native: "Please sit down."
    reading: "apni boshun."
    pos: "phrase"
    notes: "With আপনি, the verb takes its respectful form. তুমি বসো is for friends; তুই বস for the very close, and rude to a stranger."
  - id: bn-0384
    target: "আমি জানি না।"
    native: "I don't know."
    reading: "ami jani na."
    pos: "phrase"
    notes: "না comes after the verb, never before it as 'not' does in English."
  - id: bn-0385
    target: "আমি জল খাই।"
    native: "I drink water."
    reading: "ami jol khai."
    alt_target: ["আমি পানি খাই।"]
    pos: "phrase"
    notes: "Bengali eats water and tea, and even cigarettes: খাওয়া covers drinking and smoking. Also পানি (pani): আমি পানি খাই."
  - id: bn-0386
    target: "আমার খিদে পেয়েছে।"
    native: "I'm hungry."
    reading: "amar khide peyechhe."
    alt_target: ["আমার ক্ষুধা লেগেছে।"]
    pos: "phrase"
    notes: "'Hunger has come to me'. So too আমার তেষ্টা পেয়েছে, I'm thirsty. Also আমার ক্ষুধা লেগেছে (amar khudha legechhe) and আমার পিপাসা লেগেছে (amar pipasha legechhe)."
  - id: bn-0387
    target: "আমাকে যেতে হবে।"
    native: "I have to go."
    reading: "amake jete hobe."
    pos: "phrase"
    notes: "'To me, going will be': the one who must takes -কে."
  - id: bn-0388
    target: "ও আমার বোন।"
    native: "She is my sister."
    reading: "o amar bon."
    pos: "phrase"
    notes: "ও is he or she. Only বোন, sister, says it is a woman."
  - id: bn-0389
    target: "কাল আসব।"
    native: "I'll come tomorrow."
    reading: "kal ashbo."
    pos: "phrase"
    notes: "The doer is often left out: the verb's ending already says 'I'."
  - id: bn-0390
    target: "দাদা, একটু সরুন।"
    native: "Excuse me, could you move a little?"
    reading: "dada, ektu shorun."
    alt_target: ["ভাই, একটু সরুন।", "দিদি, একটু সরুন।", "আপা, একটু সরুন।"]
    pos: "phrase"
    notes: "A request to a stranger often starts with an address: দাদা (dada) or দিদি (didi), also ভাই (bhai) or আপা (apa). In many families দাদা means grandfather. Without an address, a request can sound curt."
  - id: bn-0747
    target: "সিগারেট খাওয়া"
    native: "to smoke a cigarette"
    reading: "sigaret khaoa"
    alt_target: ["তামাক সেবন করা", "তামাক সেবন"]
    pos: "phrase"
    notes: "Cigarettes are eaten too: ও সিগারেট খায় না, he or she doesn't smoke. Also তামাক সেবন (tamak shebon), the slang for it."