schema: 1
id: bn-en-grammar-pitfalls
name: "Pitfalls"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The mistakes English speakers make most in Bengali."
tags: [beginner, grammar]
cards:
  - id: bn-en-grammar-pitfalls-0001
    target: "আপনি বসুন।"
    native: "Please sit down."
    reading: "apni boshun."
    pos: "phrase"
    notes: "With আপনি, the verb takes its respectful form. তুমি বসো is for friends; তুই বস for the very close, and rude to a stranger."
  - id: bn-en-grammar-pitfalls-0002
    target: "আমি জানি না।"
    native: "I don't know."
    reading: "ami jani na."
    pos: "phrase"
    notes: "না comes after the verb, never before it as 'not' does in English."
  - id: bn-en-grammar-pitfalls-0003
    target: "আমি জল খাই।"
    native: "I drink water."
    reading: "ami jol khai."
    pos: "phrase"
    notes: "Bengali eats water and tea, and even cigarettes: খাওয়া covers drinking and smoking."
  - id: bn-en-grammar-pitfalls-0004
    target: "আমার খিদে পেয়েছে।"
    native: "I'm hungry."
    reading: "amar khide peyechhe."
    pos: "phrase"
    notes: "'Hunger has come to me'. So too আমার তেষ্টা পেয়েছে, I'm thirsty."
  - id: bn-en-grammar-pitfalls-0005
    target: "আমাকে যেতে হবে।"
    native: "I have to go."
    reading: "amake jete hobe."
    pos: "phrase"
    notes: "'To me, going will be': the one who must takes -কে."
  - id: bn-en-grammar-pitfalls-0006
    target: "ও আমার বোন।"
    native: "She is my sister."
    reading: "o amar bon."
    pos: "phrase"
    notes: "ও is he or she. Only বোন, sister, says it is a woman."
  - id: bn-en-grammar-pitfalls-0007
    target: "কাল আসব।"
    native: "I'll come tomorrow."
    reading: "kal ashbo."
    pos: "phrase"
    notes: "The doer is often left out: the verb's ending already says 'I'."
  - id: bn-en-grammar-pitfalls-0008
    target: "দাদা, একটু সরুন।"
    native: "Excuse me, could you move a little?"
    reading: "dada, ektu shorun."
    pos: "phrase"
    notes: "A request to a stranger starts with দাদা or দিদি; without it, it can sound curt."
