schema: 1
id: bn-en-addressing
name: "Addressing people"
kind: vocab
theme: addressing
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "What to call a shopkeeper, a driver or an older woman: Bengali speakers address strangers as family."
tags: [beginner]
cards:
  - id: bn-0181
    target: "দাদা"
    native: "elder brother; to a man a little older"
    reading: "dada"
    alt_target: ["ভাই", "বড় ভাই"]
    pos: "noun"
    tags: ["honorific"]
    notes: "What you call a shopkeeper or a taxi driver: দাদা, কত হলো? Friendly and polite at once. Also ভাই (bhai). Careful: in many families দাদা means grandfather."
  - id: bn-0182
    target: "দিদি"
    native: "elder sister; to a woman a little older"
    reading: "didi"
    alt_target: ["আপা"]
    pos: "noun"
    tags: ["honorific"]
    notes: "Also আপা (apa)."
  - id: bn-0183
    target: "কাকু"
    native: "uncle; to a man of your parents' age"
    reading: "kaku"
    alt_target: ["কাকা", "চাচা"]
    pos: "noun"
    tags: ["honorific"]
    notes: "Strictly your father's younger brother: কাকা (kaka), fondly কাকু. Also চাচা (chacha)."
  - id: bn-0184
    target: "মাসিমা"
    native: "aunty; to a woman of your parents' age"
    reading: "mashima"
    alt_target: ["কাকিমা", "খালা"]
    pos: "noun"
    tags: ["honorific"]
    notes: "Strictly your mother's sister: মাসি (mashi). Also খালা (khala). To a woman you don't know: মাসিমা, কাকিমা (kakima) or খালা."
  - id: bn-0185
    target: "দাদু"
    native: "grandfather; to an old man"
    reading: "dadu"
    alt_target: ["দাদা", "নানা"]
    pos: "noun"
    tags: ["honorific"]
    notes: "Also দাদা (dada), or নানা (nana) for your mother's father. Careful: দাদা is also an elder brother."
  - id: bn-0186
    target: "ভাই"
    native: "brother; to a younger man"
    reading: "bhai"
    pos: "noun"
    notes: "To a younger man: a waiter, a boy at a shop. Many speakers also say ভাই to a man their age or older, where others say দাদা, and আপা (apa) where others say দিদি."
  - id: bn-0187
    target: "স্যার"
    native: "sir"
    reading: "syar"
    pos: "noun"
    tags: ["honorific"]
    notes: "From English, used in offices and shops."
  - id: bn-0188
    target: "ম্যাডাম"
    native: "madam"
    reading: "myadam"
    pos: "noun"
    tags: ["honorific"]
  - id: bn-0189
    target: "বন্ধু"
    native: "friend"
    reading: "bondhu"
    pos: "noun"
  - id: bn-0190
    target: "শুনছেন?"
    native: "Excuse me? (to get attention)"
    reading: "shunchhen?"
    pos: "phrase"
    tags: ["polite"]
    notes: "Literally 'are you listening?'. The polite way to call a waiter or stop a passer-by."
  - id: bn-0414
    target: "আপা"
    native: "elder sister; to a woman a little older"
    reading: "apa"
    alt_target: ["দিদি"]
    pos: "noun"
    tags: ["honorific"]
    notes: "Also দিদি (didi)."
  - id: bn-0415
    target: "তপনদা, কেমন আছেন?"
    native: "How are you, Tapan-da?"
    reading: "toponda, kemon achhen?"
    alt_target: ["তপন ভাই, কেমন আছেন?"]
    pos: "phrase"
    tags: ["honorific"]
    notes: "-দা and -দি after a first name are দাদা and দিদি cut short: for someone a little older whom you know by name. Many speakers put ভাই or আপা after the name instead: তপন ভাই (topon bhai)."
