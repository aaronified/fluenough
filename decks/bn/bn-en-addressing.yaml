schema: 1
id: bn-en-addressing
name: "Addressing people"
kind: vocab
theme: addressing
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "What to call a shopkeeper, a driver or an older woman: Bengali speakers address strangers as family."
tags: [beginner]
cards:
  - id: bn-0181
    target: "দাদা"
    native: "elder brother; to a man a little older"
    reading: "dādā"
    ipa: "d̪ad̪a"
    alt_target: ["ভাই", "বড় ভাই"]
    pos: "noun"
    tags: ["honorific"]
    notes: "What you call a shopkeeper or a taxi driver: দাদা (dādā), কত হলো (kôto hôlo)? Friendly and polite at once. Also ভাই (bhāi). Careful: in many families দাদা (dādā) means grandfather."
  - id: bn-0182
    target: "দিদি"
    native: "elder sister; to a woman a little older"
    reading: "didi"
    ipa: "d̪id̪i"
    alt_target: ["আপা"]
    pos: "noun"
    tags: ["honorific"]
    notes: "Also আপা (āpā)."
  - id: bn-0183
    target: "কাকু"
    native: "uncle; to a man of your parents' age"
    reading: "kāku"
    ipa: "kaku"
    alt_target: ["কাকা", "চাচা"]
    pos: "noun"
    tags: ["honorific"]
    notes: "Strictly your father's younger brother: কাকা (kākā), fondly কাকু (kāku). Also চাচা (cācā)."
  - id: bn-0184
    target: "মাসিমা"
    native: "aunty; to a woman of your parents' age"
    reading: "māśimā"
    ipa: "maʃima"
    alt_target: ["কাকিমা", "খালা"]
    pos: "noun"
    tags: ["honorific"]
    notes: "Strictly your mother's sister: মাসি (māśi). Also খালা (khālā). To a woman you don't know: মাসিমা (māśimā), কাকিমা (kākimā) or খালা (khālā)."
  - id: bn-0185
    target: "দাদু"
    native: "grandfather; to an old man"
    reading: "dādu"
    ipa: "d̪ad̪u"
    alt_target: ["দাদা", "নানা"]
    pos: "noun"
    tags: ["honorific"]
    notes: "Also দাদা (dādā), or নানা (nānā) for your mother's father. Careful: দাদা (dādā) is also an elder brother."
  - id: bn-0186
    target: "ভাই"
    native: "brother; to a younger man"
    reading: "bhāi"
    ipa: "bʱai"
    pos: "noun"
    notes: "To a younger man: a waiter, a boy at a shop. Many speakers also say ভাই (bhāi) to a man their age or older, where others say দাদা (dādā), and আপা (āpā) where others say দিদি (didi)."
  - id: bn-0187
    target: "স্যার"
    native: "sir"
    reading: "sêr"
    ipa: "sær"
    pos: "noun"
    tags: ["honorific"]
    notes: "From English, used in offices and shops."
  - id: bn-0188
    target: "ম্যাডাম"
    native: "madam"
    reading: "mêḍām"
    ipa: "mæɖam"
    pos: "noun"
    tags: ["honorific"]
  - id: bn-0189
    target: "বন্ধু"
    native: "friend"
    reading: "bondhu"
    ipa: "bond̪ʱu"
    pos: "noun"
  - id: bn-0190
    target: "শুনছেন?"
    native: "Excuse me? (to get attention)"
    reading: "śunchen?"
    ipa: "ʃuntʃʰen"
    pos: "phrase"
    tags: ["polite"]
    notes: "Literally 'are you listening?'. The polite way to call a waiter or stop a passer-by."
  - id: bn-0414
    target: "আপা"
    native: "elder sister; to a woman a little older"
    reading: "āpā"
    ipa: "apa"
    alt_target: ["দিদি"]
    pos: "noun"
    tags: ["honorific"]
    notes: "Also দিদি (didi)."
  - id: bn-0415
    target: "তপনদা, কেমন আছেন?"
    native: "How are you, Tapan-da?"
    reading: "tôpondā, kemon āchen?"
    ipa: "t̪ɔpond̪a kemon atʃʰen"
    alt_target: ["তপন ভাই, কেমন আছেন?"]
    pos: "phrase"
    tags: ["honorific"]
    notes: "-দা (-dā) and -দি (-di) after a first name are দাদা (dādā) and দিদি (didi) cut short: for someone a little older whom you know by name. Many speakers put ভাই (bhāi) or আপা (āpā) after the name instead: তপন ভাই (tôpon bhāi)."
    bases:
      - { word: "তপনদা", base: "তপন", reading: "tôpon", meaning: "Tapan (a man's name)" }
      - { word: "আছেন", base: "আছে", reading: "āche", meaning: "to be; there is" }
