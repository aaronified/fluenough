    native: "age"
    reading: "boyosh"
    pos: "noun"
  - id: bn-0417
    target: "আপনার বয়স কত?"
    native: "How old are you?"
    reading: "apnar boyosh koto?"
    pos: "phrase"
  - id: bn-0418
    target: "আমার বয়স ত্রিশ।"
    native: "I'm thirty."
    reading: "amar boyosh trish."
    alt_target: ["আমার বয়স তিরিশ।"]
    pos: "phrase"
    notes: "'My age thirty': no 'years' and no verb. In speech 30 is often তিরিশ (tirish)."
  - id: bn-0419
    target: "বিদেশি"
    native: "foreigner; foreign"
    reading: "bideshi"
