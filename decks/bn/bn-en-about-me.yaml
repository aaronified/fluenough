cards:
  - id: bn-0191
    target: "নাম"
    native: "name"
    reading: "nam"
    pos: "noun"
  - id: bn-0192
    target: "আমার নাম …"
    native: "My name is …"
    reading: "amar nam …"
    pos: "phrase"
    notes: "There is no 'is': 'my name …'. Bengali drops 'to be' in the present."
  - id: bn-0193
    target: "আপনার নাম কী?"
    native: "What is your name?"
    reading: "apnar nam ki?"
    pos: "phrase"
    tags: ["polite"]
  - id: bn-0194
    target: "আমি … থেকে এসেছি।"
    native: "I'm from …"
    reading: "ami … theke eshechhi."
    pos: "phrase"
    notes: "Literally 'I have come from …'. থেকে (theke), 'from', comes after the place."
  - id: bn-0195
    target: "আমি … থাকি।"
    native: "I live in …"
    reading: "ami … thaki."
    pos: "phrase"
    notes: "The place takes -এ or -তে: আমি কলকাতায় থাকি, I live in Kolkata."
