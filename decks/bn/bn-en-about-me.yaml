schema: 1
id: bn-en-about-me
name: "About me"
kind: vocab
theme: about-me
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Your name and age, where you are from, where you live, and the people around you."
tags: [beginner]
cards:
  - id: bn-0191
    target: "নাম"
    native: "name"
    reading: "nam"
    pos: "noun"
  - id: bn-0192
    target: "আমার নাম …"
    native: "My name is …"
    reading: "amar nam ..."
    pos: "phrase"
    notes: "There is no 'is': 'my name …'. In the present, Bengali needs no verb to say what something is. To say where someone is, or how they are, it uses আছে: ভালো আছি, I'm fine."
  - id: bn-0193
    target: "আপনার নাম কী?"
    native: "What is your name?"
    reading: "apnar nam ki?"
    pos: "phrase"
    tags: ["polite"]
  - id: bn-0194
    target: "আমি … থেকে এসেছি।"
    native: "I'm from …"
    reading: "ami ... theke eshechhi."
    pos: "phrase"
    notes: "Literally 'I have come from …'. থেকে (theke), 'from', comes after the place."
  - id: bn-0195
    target: "আমি … থাকি।"
    native: "I live in …"
    reading: "ami ... thaki."
    pos: "phrase"
    notes: "The place takes -এ, or after a vowel -য় or -তে: আমি কলকাতায় থাকি, I live in Kolkata; আমি ঢাকায় থাকি, I live in Dhaka."
  - id: bn-0196
    target: "বাড়ি"
    native: "home; house"
    reading: "bari"
    alt_target: ["বাসা"]
    pos: "noun"
    notes: "বাড়ি (bari) is home, wherever you live. Also বাসা (basha), for the place you live now, with বাড়ি the family home."
  - id: bn-0197
    target: "পরিবার"
    native: "family"
    reading: "poribar"
    pos: "noun"
  - id: bn-0198
    target: "কাজ"
    native: "work"
    reading: "kaj"
    pos: "noun"
  - id: bn-0199
    target: "শহর"
    native: "city; town"
    reading: "shohor"
    pos: "noun"
  - id: bn-0200
    target: "দেশ"
    native: "country"
    reading: "desh"
    pos: "noun"
  - id: bn-0201
    target: "ভাষা"
    native: "language"
    reading: "bhasha"
    pos: "noun"
  - id: bn-0416
