schema: 1
id: bn-en-first-words
name: "First words"
kind: vocab
theme: first-words
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Greetings, the respect Bengali builds into them, and how to say you are still learning."
tags: [beginner]
cards:
  - id: bn-en-first-words-0001
    target: "নমস্কার"
    native: "hello; goodbye"
    reading: "nomoshkar"
    pos: "other"
    tags: ["greeting"]
    notes: "Said with palms pressed together. Many Muslim speakers greet with আসসালামু আলাইকুম (assalamu alaikum) instead. Younger people in a family greet elders by touching their feet: প্রণাম (pronam)."
  - id: bn-en-first-words-0002
    target: "প্রণাম"
    native: "a respectful greeting to an elder"
    reading: "pronam"
    pos: "other"
    tags: ["greeting", "honorific"]
    notes: "Bowing to an elder or touching their feet. A visitor is not expected to."
  - id: bn-en-first-words-0003
    target: "আপনি"
    native: "you (respectful)"
    reading: "apni"
    pos: "other"
    tags: ["honorific"]
    notes: "Bengali has three words for 'you': আপনি for strangers, elders and customers; তুমি (tumi) for friends and family; তুই (tui) only for the very close, and rude to anyone else. The verb changes with each. A learner is always safe with আপনি."
  - id: bn-en-first-words-0004
    target: "আপনি কেমন আছেন?"
    native: "How are you? (respectful)"
    reading: "apni kemon achhen?"
    pos: "phrase"
    tags: ["greeting"]
    notes: "To a friend: কেমন আছো? (kemon achho?). Bengali has no grammatical gender, so it is the same to a man or a woman."
  - id: bn-en-first-words-0005
    target: "ভালো আছি।"
    native: "I'm fine."
    reading: "bhalo achhi."
    pos: "phrase"
    tags: ["greeting"]
    notes: "ভালো (bhalo) is 'good, well', one of the most useful words there is."
  - id: bn-en-first-words-0006
    target: "ধন্যবাদ"
    native: "thank you"
    reading: "dhonnobad"
    pos: "other"
    tags: ["polite"]
    notes: "Among family and friends thanks are often left unsaid. Many people say 'thank you' in English."
  - id: bn-en-first-words-0007
    target: "আচ্ছা"
    native: "OK; I see"
    reading: "achchha"
    pos: "other"
    notes: "The all-purpose 'OK' or 'right'. Also the start of a goodbye: আচ্ছা, আসি।"
  - id: bn-en-first-words-0008
    target: "আসি"
    native: "goodbye (said by the one leaving)"
    reading: "ashi"
    pos: "other"
    tags: ["greeting"]
    notes: "Literally 'I'll come'. On leaving, Bengali speakers say আসি rather than যাই (jai), 'I'm going', which sounds final."
  - id: bn-en-first-words-0009
    target: "আমি বাংলা জানি না।"
    native: "I don't know Bengali."
    reading: "ami bangla jani na."
    pos: "phrase"
    notes: "না (na), 'not', comes after the verb."
  - id: bn-en-first-words-0010
    target: "আমি এখনও বাংলা শিখছি।"
    native: "I'm still learning Bengali."
    reading: "ami ekhono bangla shikhchhi."
    pos: "phrase"
    notes: "The same for a man and a woman: Bengali verbs do not show gender."
  - id: bn-en-first-words-0011
    target: "আস্তে বলুন।"
    native: "Please speak slowly."
    reading: "aste bolun."
    pos: "phrase"
    tags: ["polite"]
    notes: "বলুন is the polite request form of বলা (bola, to say). The ending -উন makes any verb a polite request: বসুন (boshun), please sit."
  - id: bn-en-first-words-0012
    target: "আবার বলুন।"
    native: "Please say that again."
    reading: "abar bolun."
    pos: "phrase"
    tags: ["polite"]
  - id: bn-en-first-words-0013
    target: "আবার দেখা হবে।"
    native: "See you again."
    reading: "abar dekha hobe."
    pos: "phrase"
    tags: ["greeting"]
    notes: "Literally 'there will be a meeting again'."
