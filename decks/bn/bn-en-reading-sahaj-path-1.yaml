passages:
  - id: bn-sahaj-path-1-01
    title: "Where they live"
    source: "Sahaj Path, part 1, page ২০ (Visva-Bharati, 1993 printing)"
    sentences:
      - text: "বনে থাকে বাঘ।"
        reading: "bône thāke bāgh."
        ipa: "bɔne t̪ʰake baɡʱ"
      - text: "গাছে থাকে পাখি।"
        reading: "gāche thāke pākhi."
        ipa: "ɡatʃʰe t̪ʰake pakʰi"
      - text: "জলে থাকে মাছ।"
        reading: "jôle thāke māch."
        ipa: "dʒɔle t̪ʰake matʃʰ"
      - text: "ডালে আছে ফল।"
        reading: "ḍāle āche phôl."
        ipa: "ɖale atʃʰe pʰɔl"
      - text: "পাখি ফল খায়।"
        reading: "pākhi phôl khāy."
        ipa: "pakʰi pʰɔl kʰaj"
      - text: "পাখা মেলে ওড়ে।"
        reading: "pākhā mele oṛe."
        ipa: "pakʰa mele oɽe"
    glossary:
      - word: "বনে"
        modern: "বনে"
        reading: "bône"
        ipa: "bɔne"
        meaning: { en: "in the forest" }
      - word: "বাঘ"
        modern: "বাঘ"
        reading: "bāgh"
        ipa: "baɡʱ"
        meaning: { en: "tiger" }
      - word: "পাখা"
        modern: "পাখা"
        reading: "pākhā"
        ipa: "pakʰa"
        meaning: { en: "wings" }
      - word: "মেলে"
        modern: "মেলে"
        reading: "mele"
        ipa: "mele"
        meaning: { en: "spreading (its wings)" }
      - word: "ওড়ে"
        modern: "ওড়ে"
        reading: "oṛe"
        ipa: "oɽe"
        meaning: { en: "flies" }
    questions:
      - id: bn-0751
        prompt: { en: "Where does the tiger live?" }
        options:
          - { en: "In the forest" }
          - { en: "In the water" }
          - { en: "In a tree" }
        answer: 1
      - id: bn-0752
        prompt: { en: "The fish lives in the water." }
        answer: true
      - id: bn-0753
        prompt: { en: "What does the bird eat?" }
        options:
          - { en: "Fish" }
          - { en: "Fruit" }
          - { en: "Rice" }
        answer: 2
  - id: bn-sahaj-path-1-02
    title: "Ram picks flowers"
    source: "Sahaj Path, part 1, page ২৩ (Visva-Bharati, 1993 printing)"
    sentences:
      - text: "রাম বনে ফুল পাড়ে।"
        reading: "rām bône phul pāṛe."
        ipa: "ram bɔne pʰul paɽe"
      - text: "গায়ে তার লাল শাল।"
        reading: "gāye tār lāl śāl."
        ipa: "ɡaje t̪ar lal ʃal"
      - text: "হাতে তার সাজি।"
        reading: "hāte tār śāji."
        ipa: "ɦat̪e t̪ar ʃadʒi"
      - text: "জবা ফুল তোলে।"
        reading: "jôbā phul tole."
        ipa: "dʒɔba pʰul t̪ole"
      - text: "বেল ফুল তোলে।"
        reading: "bel phul tole."
        ipa: "bel pʰul t̪ole"
      - text: "বেল ফুল সাদা।"
        reading: "bel phul śādā."
        ipa: "bel pʰul ʃad̪a"
      - text: "জবা ফুল লাল।"
        reading: "jôbā phul lāl."
        ipa: "dʒɔba pʰul lal"
      - text: "জলে আছে নাল ফুল।"
        reading: "jôle āche nāl phul."
        ipa: "dʒɔle atʃʰe nal pʰul"
    glossary:
      - word: "লাল"
        modern: "লাল"
        reading: "lāl"
        ipa: "lal"
        meaning: { en: "red" }
      - word: "সাদা"
        modern: "সাদা"
        reading: "śādā"
        ipa: "ʃad̪a"
        meaning: { en: "white" }
      - word: "শাল"
        modern: "শাল"
        reading: "śāl"
        ipa: "ʃal"
        meaning: { en: "a shawl" }
      - word: "জবা"
        modern: "জবা"
        reading: "jôbā"
        ipa: "dʒɔba"
        meaning: { en: "hibiscus" }
      - word: "বেল"
        modern: "বেল"
        reading: "bel"
        ipa: "bel"
        meaning: { en: "bel, a white jasmine" }
      - word: "সাজি"
        modern: "সাজি"
        reading: "śāji"
        ipa: "ʃadʒi"
        meaning: { en: "a flower basket" }
      - word: "নাল ফুল"
        modern: "নাল ফুল"
        reading: "nāl phul"
        ipa: "nal pʰul"
        meaning: { en: "a red water lily" }
    questions:
      - id: bn-0754
        prompt: { en: "What colour is Ram's shawl?" }
        options:
          - { en: "Red" }
          - { en: "White" }
          - { en: "Black" }
        answer: 1
      - id: bn-0755
        prompt: { en: "The bel flower is white." }
        answer: true
      - id: bn-0756
        prompt: { en: "The joba flower is white." }
        answer: false
  - id: bn-sahaj-path-1-03
    title: "A puja at home"
    source: "Sahaj Path, part 1, page ২৩ (Visva-Bharati, 1993 printing)"
    sentences:
      - text: "ফুল তুলে রাম বাড়ি চলে।"
        reading: "phul tule rām bāṛi côle."
        ipa: "pʰul t̪ule ram baɽi tʃɔle"
      - text: "তার বাড়ি আজ পূজা।"
        reading: "tār bāṛi āj pujā."
        ipa: "t̪ar baɽi adʒ pudʒa"
      - text: "পূজা হবে রাতে।"
        reading: "pujā hôbe rāte."
        ipa: "pudʒa ɦɔbe rat̪e"
      - text: "তাই রাম ফুল আনে।"
        reading: "tāi rām phul āne."
        ipa: "t̪ai ram pʰul ane"
      - text: "তাই তার ঘরে খুব ঘটা।"
        reading: "tāi tār ghôre khub ghôṭā."
        ipa: "t̪ai t̪ar ɡʱɔre kʰub ɡʱɔʈa"
      - text: "ঢাক বাজে, ঢোল বাজে।"
        reading: "ḍhāk bāje, ḍhol bāje."
        ipa: "ɖʱak badʒe ɖʱol badʒe"
      - text: "ঘরে ঘরে ধূপ ধুনা।"
        reading: "ghôre ghôre dhup dhunā."
        ipa: "ɡʱɔre ɡʱɔre d̪ʱup d̪ʱuna"
    glossary:
      - word: "পূজা"
        modern: "পূজা"
        reading: "pujā"
        ipa: "pudʒa"
        meaning: { en: "worship; a puja" }
      - word: "রাতে"
        modern: "রাতে"
        reading: "rāte"
        ipa: "rat̪e"
        meaning: { en: "at night" }
      - word: "ঘটা"
        modern: "ঘটা"
        reading: "ghôṭā"
        ipa: "ɡʱɔʈa"
        meaning: { en: "pomp, festivity" }
      - word: "ধুনা"
        modern: "ধুনা"
        reading: "dhunā"
        ipa: "d̪ʱuna"
        meaning: { en: "resin burnt as incense" }
    questions:
      - id: bn-0757
        prompt: { en: "When will the puja be?" }
        options:
          - { en: "In the morning" }
          - { en: "At night" }
          - { en: "Tomorrow" }
        answer: 2
      - id: bn-0758
        prompt: { en: "Ram brings the flowers home for the puja." }
        answer: true
  - id: bn-sahaj-path-1-04
    title: "Going to the market"
    source: "Sahaj Path, part 1, page ২৬ (Visva-Bharati, 1993 printing)"
    theme: groceries
    sentences:
      - text: "ঐ সাদা ছাতা।"
        reading: "oi śādā chātā."
        ipa: "oi ʃad̪a tʃʰat̪a"
      - text: "দাদা যায় হাটে।"
        reading: "dādā jāy hāṭe."
        ipa: "d̪ad̪a dʒaj ɦaʈe"
      - text: "গায়ে লাল জামা।"
        reading: "gāye lāl jāmā."
        ipa: "ɡaje lal dʒama"
      - text: "মামা যায় খাতা হাতে।"
        reading: "māmā jāy khātā hāte."
        ipa: "mama dʒaj kʰat̪a ɦat̪e"
      - text: "গায়ে সাদা শাল।"
        reading: "gāye śādā śāl."
        ipa: "ɡaje ʃad̪a ʃal"
      - text: "মামা আনে চাল ডাল।"
        reading: "māmā āne cāl ḍāl."
        ipa: "mama ane tʃal ɖal"
      - text: "আর কেনে শাক।"
        reading: "ār kene śāk."
        ipa: "ar kene ʃak"
      - text: "আর কেনে আটা।"
        reading: "ār kene āṭā."
        ipa: "ar kene aʈa"
    glossary:
      - word: "ঐ"
        modern: "ওই"
        reading: "oi"
        ipa: "oi"
        meaning: { en: "that" }
        note: { en: "an older spelling of ওই, still in use" }
      - word: "হাটে"
        modern: "হাটে"
        reading: "hāṭe"
        ipa: "ɦaʈe"
        meaning: { en: "to the market (a village market held on fixed days)" }
      - word: "জামা"
        modern: "জামা"
        reading: "jāmā"
        ipa: "dʒama"
        meaning: { en: "a shirt" }
      - word: "শাক"
        modern: "শাক"
        reading: "śāk"
        ipa: "ʃak"
        meaning: { en: "leafy greens" }
      - word: "আটা"
        modern: "আটা"
        reading: "āṭā"
        ipa: "aʈa"
        meaning: { en: "wheat flour" }
    questions:
      - id: bn-0759
        prompt: { en: "Where does Dada go?" }
        options:
          - { en: "To the market" }
          - { en: "To school" }
          - { en: "Home" }
        answer: 1
      - id: bn-0760
        prompt: { en: "Mama brings rice and lentils, and buys greens and flour." }
        answer: true
      - id: bn-0761
        prompt: { en: "Mama wears a red shirt." }
        answer: false
  - id: bn-sahaj-path-1-05
    title: "Fruit for everyone"
    source: "Sahaj Path, part 1, page ২৬ (Visva-Bharati, 1993 printing)"
    theme: groceries
    sentences:
      - text: "দাদা কেনে পাকা আতা, সাত আনা দিয়ে।"
        reading: "dādā kene pākā ātā, śāt ānā diye."
        ipa: "d̪ad̪a kene paka at̪a ʃat̪ ana d̪ije"
      - text: "আর আখ, আর জাম চার আনা।"
        reading: "ār ākh, ār jām cār ānā."
        ipa: "ar akʰ ar dʒam tʃar ana"
      - text: "বাবা খাবে।"
        reading: "bābā khābe."
        ipa: "baba kʰabe"
      - text: "কাকা খাবে।"
        reading: "kākā khābe."
        ipa: "kaka kʰabe"
      - text: "আর খাবে মামা।"
        reading: "ār khābe māmā."
        ipa: "ar kʰabe mama"
      - text: "তার পরে কাজ আছে।"
        reading: "tār pôre kāj āche."
        ipa: "t̪ar pɔre kadʒ atʃʰe"
      - text: "বাবা কাজে যাবে।"
        reading: "bābā kāje jābe."
        ipa: "baba kadʒe dʒabe"
    glossary:
      - word: "পাকা"
        modern: "পাকা"
        reading: "pākā"
        ipa: "paka"
        meaning: { en: "ripe" }
      - word: "আতা"
        modern: "আতা"
        reading: "ātā"
        ipa: "at̪a"
        meaning: { en: "custard apple" }
      - word: "আখ"
        modern: "আখ"
        reading: "ākh"
        ipa: "akʰ"
        meaning: { en: "sugar cane" }
      - word: "জাম"
        modern: "জাম"
        reading: "jām"
        ipa: "dʒam"
        meaning: { en: "jamun, a small purple fruit" }
      - word: "আনা"
        modern: "আনা"
        reading: "ānā"
        ipa: "ana"
        meaning: { en: "an anna, an old coin: sixteen made a rupee" }
    questions:
      - id: bn-0762
        prompt: { en: "What does Dada pay for the ripe custard apples?" }
        options:
          - { en: "Seven annas" }
          - { en: "Four annas" }
          - { en: "Seven rupees" }
        answer: 1
      - id: bn-0763
        prompt: { en: "Father will go to work afterwards." }
        answer: true
  - id: bn-sahaj-path-1-06
    title: "The parakeet"
    source: "Sahaj Path, part 1, page ৩০ (Visva-Bharati, 1993 printing)"
    sentences:
      - text: "এ কী পাখি?"
        reading: "e ki pākhi?"
        ipa: "e ki pakʰi"
      - text: "এ যে টিয়া পাখি।"
        reading: "e je ṭiyā pākhi."
        ipa: "e dʒe ʈija pakʰi"
      - text: "ও পাখি কি কিছু কথা বলে?"
        reading: "o pākhi ki kichu kôthā bôle?"
        ipa: "o pakʰi ki kitʃʰu kɔt̪ʰa bɔle"
      - text: "কী কথা বলে?"
        reading: "ki kôthā bôle?"
        ipa: "ki kɔt̪ʰa bɔle"
      - text: "ও বলে, রাম রাম, হরি হরি।"
        reading: "o bôle, rām rām, hori hori."
        ipa: "o bɔle ram ram ɦori ɦori"
      - text: "ও কী খায়?"
        reading: "o ki khāy?"
        ipa: "o ki kʰaj"
      - text: "ও খায় দানা।"
        reading: "o khāy dānā."
        ipa: "o kʰaj d̪ana"
    glossary:
      - word: "টিয়া"
        modern: "টিয়া"
        reading: "ṭiyā"
        ipa: "ʈija"
        meaning: { en: "a parakeet" }
      - word: "কথা"
        modern: "কথা"
        reading: "kôthā"
        ipa: "kɔt̪ʰa"
        meaning: { en: "words; talk" }
      - word: "দানা"
        modern: "দানা"
        reading: "dānā"
        ipa: "d̪ana"
        meaning: { en: "grain, seed" }
    questions:
      - id: bn-0764
        prompt: { en: "What kind of bird is it?" }
        options:
          - { en: "A parakeet" }
          - { en: "A crow" }
          - { en: "A myna" }
        answer: 1
      - id: bn-0765
        prompt: { en: "What does it eat?" }
        options:
          - { en: "Grain" }
          - { en: "Fish" }
          - { en: "Fruit" }
        answer: 1
      - id: bn-0766
        prompt: { en: "The bird cannot say anything." }
        answer: false
  - id: bn-sahaj-path-1-07
    title: "A cold morning"
    source: "Sahaj Path, part 1, page ৩৩ (Visva-Bharati, 1993 printing)"
    sentences:
      - text: "চুপ ক’রে ব’সে ঘুম পায়।"
        reading: "cup kô're bô'śe ghum pāy."
        ipa: "tʃup kɔre bɔʃe ɡʱum paj"
      - text: "চলো, ঘুরে আসি।"
        reading: "côlo, ghure āśi."
        ipa: "tʃɔlo ɡʱure aʃi"
      - text: "ফুল তুলে আনি।"
        reading: "phul tule āni."
        ipa: "pʰul t̪ule ani"
      - text: "আজ খুব শীত।"
        reading: "āj khub śit."
        ipa: "adʒ kʰub ʃit̪"
      - text: "কচুপাতা থেকে টুপ্ টুপ্ ক’রে হিম পড়ে।"
        reading: "kocupātā theke ṭup ṭup kô're him pôṛe."
        ipa: "kotʃupat̪a t̪ʰeke ʈup ʈup kɔre ɦim pɔɽe"
      - text: "ঘাস ভিজে।"
        reading: "ghāś bhije."
        ipa: "ɡʱaʃ bʱidʒe"
      - text: "পা ভিজে যায়।"
        reading: "pā bhije jāy."
        ipa: "pa bʱidʒe dʒaj"
      - text: "দুখী বুড়ি উনুন-ধারে উবু হয়ে ব’সে আগুন পোহায় আর গুন্ গুন্ গায়।"
        reading: "dukhi buṛi unun-dhāre ubu hôye bô'śe āgun pohāy ār gun gun gāy."
        ipa: "d̪ukʰi buɽi unund̪ʱare ubu ɦɔje bɔʃe aɡun poɦaj ar ɡun ɡun ɡaj"
    glossary:
      - word: "ক’রে"
        modern: "করে"
        reading: "kôre"
        ipa: "kɔre"
        meaning: { en: "having done; after a sound word, 'with': টুপটুপ করে, with a drip, drip" }
        note: { en: "older spelling: the apostrophe marks a dropped ই" }
      - word: "ব’সে"
        modern: "বসে"
        reading: "bôśe"
        ipa: "bɔʃe"
        meaning: { en: "sitting" }
        note: { en: "older spelling: the apostrophe marks a dropped ই" }
      - word: "হিম"
        modern: "হিম"
        reading: "him"
        ipa: "ɦim"
        meaning: { en: "dew; the cold of the night" }
      - word: "শীত"
        modern: "শীত"
        reading: "śit"
        ipa: "ʃit̪"
        meaning: { en: "cold; winter" }
      - word: "কচুপাতা"
        modern: "কচুপাতা"
        reading: "kocupātā"
        ipa: "kotʃupat̪a"
        meaning: { en: "taro leaves" }
      - word: "উনুন"
        modern: "উনুন"
        reading: "unun"
        ipa: "unun"
        meaning: { en: "a clay stove" }
      - word: "আগুন"
        modern: "আগুন"
        reading: "āgun"
        ipa: "aɡun"
        meaning: { en: "fire" }
      - word: "দুখী"
        modern: "দুঃখী"
        reading: "dukkhi"
        ipa: "d̪ukkʰi"
        meaning: { en: "poor, unhappy" }
        note: { en: "older, poetic form" }
      - word: "উবু হয়ে"
        modern: "উবু হয়ে"
        reading: "ubu hôye"
        ipa: "ubu ɦɔje"
        meaning: { en: "squatting" }
      - word: "পোহায়"
        modern: "পোহায়"
        reading: "pohāy"
        ipa: "poɦaj"
        meaning: { en: "warms herself (at a fire)" }
    questions:
      - id: bn-0767
        prompt: { en: "It is very cold today." }
        answer: true
      - id: bn-0768
        prompt: { en: "Where does the dew drip from?" }
        options:
          - { en: "From the taro leaves" }
          - { en: "From the roof" }
          - { en: "From the sky" }
        answer: 1
      - id: bn-0769
        prompt: { en: "The old woman sits by the stove and hums." }
        answer: true
  - id: bn-sahaj-path-1-08
    title: "Football"
    source: "Sahaj Path, part 1, page ৩৭ (Visva-Bharati, 1993 printing)"
    sentences:
      - text: "বেলা যায়।"
        reading: "belā jāy."
        ipa: "bela dʒaj"
      - text: "তেল মেখে জলে ডুব দিয়ে আসি।"
        reading: "tel mekhe jôle ḍub diye āśi."
        ipa: "t̪el mekʰe dʒɔle ɖub d̪ije aʃi"
      - text: "তার পরে খেলা হবে।"
        reading: "tār pôre khelā hôbe."
        ipa: "t̪ar pɔre kʰela ɦɔbe"
      - text: "একা একা খেলা যায় না।"
        reading: "ekā ekā khelā jāy nā."
        ipa: "eka eka kʰela dʒaj na"
      - text: "ঐ বাড়ি থেকে কয়জন ছেলে এলে বেশ হয়।"
        reading: "oi bāṛi theke kôyjon chele ele beś hôy."
        ipa: "oi baɽi t̪ʰeke kɔjdʒon tʃʰele ele beʃ ɦɔj"
      - text: "ঐ-যে আসে শচী সেন, মণি সেন, বংশী সেন, আর ঐ-যে আসে মধু শেঠ আর খেতু শেঠ।"
        reading: "oi-je āśe śoci śen, moni śen, boṅśi śen, ār oi-je āśe modhu śeṭh ār khetu śeṭh."
        ipa: "oidʒe aʃe ʃotʃi ʃen moni ʃen boŋʃi ʃen ar oidʒe aʃe mod̪ʱu ʃeʈʰ ar kʰet̪u ʃeʈʰ"
      - text: "ফুটবল খেলা খুব হবে।"
        reading: "phuṭbol khelā khub hôbe."
        ipa: "pʰuʈbol kʰela kʰub ɦɔbe"
    glossary:
      - word: "বেলা যায়"
        modern: "বেলা যায়"
        reading: "belā jāy"
        ipa: "bela dʒaj"
        meaning: { en: "the day is getting on" }
      - word: "কয়জন"
        modern: "কয়েকজন"
        reading: "kôyekjon"
        ipa: "kɔjekdʒon"
        meaning: { en: "a few (people)" }
      - word: "খেলা"
        modern: "খেলা"
        reading: "khelā"
        ipa: "kʰela"
        meaning: { en: "a game; play" }
      - word: "ফুটবল"
        modern: "ফুটবল"
        reading: "phuṭbol"
        ipa: "pʰuʈbol"
        meaning: { en: "football" }
      - word: "বেশ হয়"
        modern: "বেশ হয়"
        reading: "beś hôy"
        ipa: "beʃ ɦɔj"
        meaning: { en: "it would be nice" }
    questions:
      - id: bn-0770
        prompt: { en: "What game will they play?" }
        options:
          - { en: "Football" }
          - { en: "Cricket" }
          - { en: "Hide and seek" }
        answer: 1
      - id: bn-0771
        prompt: { en: "You cannot play alone." }
        answer: true
      - id: bn-0772
        prompt: { en: "They bathe before they play." }
        answer: true
