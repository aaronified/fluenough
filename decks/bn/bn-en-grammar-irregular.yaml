schema: 1
id: bn-en-grammar-irregular
name: "Irregular verbs"
kind: grammar
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The common verbs whose stem shifts from tense to tense."
tags: [beginner, grammar]
pattern:
  name: "Irregular verbs"
  slot_name: "form"
  slots: ["present, আমি", "past, আমি", "future, আমি", "polite request, আপনি"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "These are among the most used verbs in Bengali, so they are worth learning by heart. The stem's vowel shifts: দেওয়া gives দিই, দিলাম, দেব. আসা and যাওয়া take different pasts: এলাম, গেলাম. আসা's past is এলাম (elam), also আসলাম (ashlam); the drill accepts both. হোন, the polite request of হওয়া, is written with ো to keep it apart from the present হন."
  entries:
    - lemma: "যাওয়া"
      key: jaoa
      reading: "jaoa"
      gloss: "to go"
      forms:
        "present, আমি": "যাই"
        "past, আমি": "গেলাম"
        "future, আমি": ["যাব", "যাবো"]
        "polite request, আপনি": "যান"
      readings:
        "present, আমি": "jai"
        "past, আমি": "gelam"
        "future, আমি": ["jabo", "jabo"]
        "polite request, আপনি": "jan"
    - lemma: "আসা"
      key: asha
      reading: "asha"
      gloss: "to come"
      forms:
        "present, আমি": "আসি"
        "past, আমি": ["এলাম", "আসলাম"]
        "future, আমি": ["আসব", "আসবো"]
        "polite request, আপনি": "আসুন"
      readings:
        "present, আমি": "ashi"
        "past, আমি": ["elam", "ashlam"]
        "future, আমি": ["ashbo", "ashbo"]
        "polite request, আপনি": "ashun"
    - lemma: "দেওয়া"
      key: deoa
      reading: "deoa"
      gloss: "to give"
      forms:
        "present, আমি": "দিই"
        "past, আমি": "দিলাম"
        "future, আমি": ["দেব", "দেবো"]
        "polite request, আপনি": "দিন"
      readings:
        "present, আমি": "di"
        "past, আমি": "dilam"
        "future, আমি": ["debo", "debo"]
        "polite request, আপনি": "din"
    - lemma: "নেওয়া"
      key: neoa
      reading: "neoa"
      gloss: "to take"
      forms:
        "present, আমি": "নিই"
        "past, আমি": "নিলাম"
        "future, আমি": ["নেব", "নেবো"]
        "polite request, আপনি": "নিন"
      readings:
        "present, আমি": "ni"
        "past, আমি": "nilam"
        "future, আমি": ["nebo", "nebo"]
        "polite request, আপনি": "nin"
    - lemma: "খাওয়া"
      key: khaoa
      reading: "khaoa"
      gloss: "to eat"
      forms:
        "present, আমি": "খাই"
        "past, আমি": "খেলাম"
        "future, আমি": ["খাব", "খাবো"]
        "polite request, আপনি": "খান"
      readings:
        "present, আমি": "khai"
        "past, আমি": "khelam"
        "future, আমি": ["khabo", "khabo"]
        "polite request, আপনি": "khan"
    - lemma: "হওয়া"
      key: hoa
      reading: "hoa"
      gloss: "to be, to become"
      forms:
        "present, আমি": "হই"
        "past, আমি": "হলাম"
        "future, আমি": ["হব", "হবো"]
        "polite request, আপনি": "হোন"
      readings:
        "present, আমি": "hoi"
        "past, আমি": "holam"
        "future, আমি": ["hobo", "hobo"]
        "polite request, আপনি": "hon"
