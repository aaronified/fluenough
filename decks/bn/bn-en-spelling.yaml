schema: 1
id: bn-en-spelling
name: "Bengali spellings, old and new"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Spellings you will meet in older books, and the rules that changed them: Calcutta University's of 1936, the Paschimbanga Bangla Akademi's and the Bangla Academy's. Every older spelling here is printed in a book or a rulebook. Not yet checked by a Bengali speaker: please report any mistake."
source: "Older printings of Sahaj Path and Abol Tabol, and the spelling rules of Calcutta University (1936), the Paschimbanga Bangla Akademi and the Bangla Academy"
tags: [advanced, unreviewed]
cards:
  - id: bn-0797
    target: "পাখী"
    native: "bird; today পাখি (pākhi)"
    picture: "🐦"
    reading: "pākhi"
    ipa: "pakʰi"
    pos: "other"
    modes: [recognition]
    notes: "Sanskrit words keep their ঈ (i); other words now take ই (i). Calcutta University's rules of 1936 allowed both পাখী (pākhi) and পাখি (pākhi); the Paschimbanga Bangla Akademi and the Bangla Academy both write only পাখি (pākhi)."
  - id: bn-0798
    target: "বাড়ী"
    native: "house, home; today বাড়ি (bāṛi)"
    picture: "🏠"
    reading: "bāṛi"
    ipa: "baɽi"
    pos: "other"
    modes: [recognition]
    notes: "The same rule as পাখি (pākhi): ই (i) in words that are not Sanskrit. The Shaibya printing of Abol Tabol: কোথায় বাড়ী (kothāy bāṛi)"
  - id: bn-0799
    target: "গরীব"
    native: "poor; today গরিব (gorib)"
    reading: "gorib"
    ipa: "ɡorib"
    pos: "other"
    modes: [recognition]
    notes: "A loanword, so ই (i). The Shaibya printing of Abol Tabol: গরীব বেজায় (gorib bejāy)—"
  - id: bn-0800
    target: "তৈরী"
    native: "ready; today তৈরি (toiri)"
    reading: "toiri"
    ipa: "t̪oiri"
    pos: "other"
    modes: [recognition]
    notes: "Not Sanskrit, so ই (i). The Shaibya printing of Abol Tabol: তৈরী ছেলে (toiri chele)"
  - id: bn-0801
    target: "হাতী"
    native: "elephant; today হাতি (hāti)"
    picture: "🐘"
    reading: "hāti"
    ipa: "ɦat̪i"
    pos: "other"
    modes: [recognition]
    notes: "Not Sanskrit, so ই (i). The Shaibya printing of Abol Tabol: হ্যাংলা হাতী চ্যাং-দোলা (hêṅlā hāti cêṅ-dolā),"
  - id: bn-0802
    target: "খুশী"
    native: "happy; today খুশি (khuśi)"
    reading: "khuśi"
    ipa: "kʰuʃi"
    pos: "other"
    modes: [recognition]
    notes: "Not Sanskrit, so ই (i). Sahaj Path's 1993 printing has both, খুশি (khuśi) and খুব খুশী (khub khuśi)"
  - id: bn-0803
    target: "ইংরেজী"
    native: "English; today ইংরেজি (iṅreji)"
    reading: "iṅreji"
    ipa: "iŋredʒi"
    pos: "other"
    modes: [recognition]
    notes: "Calcutta University's rules of 1936 asked for ঈ (i) in the names of languages and peoples. Both academies now write ইংরেজি (iṅreji), বাঙালি (bāṅāli)."
  - id: bn-0804
    target: "শ্রেণী"
    native: "class, row; today শ্রেণি (śreni)"
    reading: "sreni"
    ipa: "sreni"
    pos: "other"
    modes: [recognition]
    notes: "A Sanskrit word correct with either vowel takes the short one in both academies' rules. A 1949 reprint of Tagore's বাংলাভাষা-পরিচয় (bāṅlābhāśā-poricoy) still prints শ্রেণী (sreni)."
  - id: bn-0805
    target: "কর্ম্ম"
    native: "work, deed; today কর্ম (kôrm)"
    reading: "kôrmmo"
    ipa: "kɔrmmo"
    pos: "other"
    modes: [recognition]
    notes: "No doubled letter after a reph (র্). Calcutta University, 1936: কর্ম্ম (kôrmmo) → কর্ম (kôrm). The Bangla Academy agrees."
  - id: bn-0806
    target: "কক্ষণো"
    native: "never; today কক্ষনো (kôkkhono)"
    reading: "kôkkhono"
    ipa: "kɔkkʰono"
    pos: "other"
    modes: [recognition]
    notes: "A word that is not Sanskrit never takes ণ (Bangla Academy, rule 2.7). The Shaibya printing of Abol Tabol: কক্ষণো তা হয় না (kôkkhono tā hôy nā)।"
  - id: bn-0807
    target: "সোণা"
    native: "gold; today সোনা (sonā)"
    reading: "śonā"
    ipa: "ʃona"
    pos: "other"
    modes: [recognition]
    notes: "Calcutta University, 1936: সোণা (śonā) → সোনা (sonā). ন (nô) ণ (nô), in words that are not Sanskrit."
  - id: bn-0808
    target: "ভাল"
    native: "good; today ভালো (bhālo)"
    reading: "bhālo"
    ipa: "bʱalo"
    pos: "other"
    modes: [recognition]
    notes: "Calcutta University made the final ো (o) optional; the Paschimbanga Bangla Akademi writes ভালো (bhālo), মতো (môto), and the Bangla Academy allows it. The Shaibya printing of Abol Tabol: ভাল রে ভাল (bhālo re bhālo)!"
  - id: bn-0809
    target: "রঙ"
    native: "colour; today রং (rôṅ)"
    reading: "rôṅ"
    ipa: "rɔŋ"
    pos: "other"
    modes: [recognition]
    notes: "At the end of a word ং (ôṅ), before a vowel ঙ (ṅô): রং (rôṅ), but রঙিন (Bangla Academy, rule 2.4). Calcutta University allowed both, and Sahaj Path writes রঙ (rôṅ)."
  - id: bn-0810
    target: "দৈ"
    native: "curd; today দই (doi)"
    reading: "doi"
    ipa: "d̪oi"
    pos: "other"
    modes: [recognition]
    notes: "An older spelling; today দই (doi). The Shaibya printing of Abol Tabol: চৌদ্দ হাঁড়ি দৈ কি মালাই (coudd hām̐ṛi doi ki mālāi)"
  - id: bn-0811
    target: "শেখে নি"
    native: "hasn't learnt; today শেখেনি (śekheni)"
    reading: "śekhe ni"
    ipa: "ʃekʰe ni"
    pos: "phrase"
    modes: [recognition]
    notes: "The Bangla Academy's rules of 2012 join নি (ni) to the verb, শেখেনি (śekheni), and keep না (nā) apart: শেখে না (śekhe nā). Sahaj Path's 1993 printing: শেখে নি সে কথা কওয়া (śekhe ni se kôthā kôoyā)"
  - id: bn-0812
    target: "হলো"
    native: "became; also হল (hôl)"
    reading: "hôlo"
    ipa: "ɦɔlo"
    pos: "other"
    modes: [recognition]
    notes: "The Bangla Academy allows a final ো (o) on verbs: হলো (hôlo), দেবো (debo). The Paschimbanga Bangla Akademi writes হল (hôl), দেব (deb). Sahaj Path's 1993 printing has ভোর হ (bhor hô)’ল (lô)।"
