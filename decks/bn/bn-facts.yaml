description: "One true, surprising thing about Bengali a day, in English, Bengali and Hindi."
facts:
  - id: bn-fact-001
    tags: [script, conjuncts]
    text:
      en: "Two consonants with no vowel between them join into a যুক্তাক্ষর (juktakkhor), a conjunct: ক + ষ = ক্ষ, জ + ঞ = জ্ঞ, হ + ম = হ্ম. Some look nothing like the letters they are made of."
      bn: "মাঝে স্বর না থাকলে দুটি ব্যঞ্জন জুড়ে যুক্তাক্ষর হয়: ক + ষ = ক্ষ, জ + ঞ = জ্ঞ, হ + ম = হ্ম। কয়েকটিকে দেখে তাদের অংশ চেনাই যায় না।"
      hi: "दो व्यंजनों के बीच स्वर न हो तो वे मिलकर युक्ताक्षर बनाते हैं: ক + ষ = ক্ষ, জ + ঞ = জ্ঞ, হ + ম = হ্ম। कुछ युक्ताक्षर अपने अक्षरों से बिल्कुल अलग दिखते हैं।"
  - id: bn-fact-002
    tags: [pronunciation, script]
    text:
      en: "Bengali has three letters for s, শ, ষ and স, but usually says all three as sh: সাত (seven) is shat. A plain s is heard mainly before some consonants, as in স্টেশন (steshon)."
      bn: "বাংলায় শ, ষ, স তিনটি বর্ণ, কিন্তু সাধারণত তিনটিরই উচ্চারণ 'শ': সাত শোনায় 'শাত'। কিছু যুক্তবর্ণে, যেমন স্টেশন-এ, খাঁটি 's' শোনা যায়।"
      hi: "बांग्ला में स के तीन अक्षर हैं, শ, ষ और স, पर आमतौर पर तीनों को 'श' बोला जाता है: সাত (सात) को 'शात'। कुछ संयुक्ताक्षरों में, जैसे স্টেশন (स्टेशन) में, 'स' सुनाई देता है।"
  - id: bn-fact-003
    tags: [pronunciation]
    text:
      en: "Every Bengali consonant letter carries a built-in vowel, অ, said as an open o, close to the vowel in 'law', not as a: কমল (lotus) is komol, and বন (forest) is bon."
      bn: "বাংলার প্রতিটি ব্যঞ্জনবর্ণে একটি অন্তর্নিহিত 'অ' থাকে, আর তার উচ্চারণ হিন্দি বা ইংরেজির 'a'-র মতো নয়, খোলা 'ও'-র কাছাকাছি: কমল, বন।"
      hi: "बांग्ला के हर व्यंजन में छिपा स्वर 'अ' की तरह नहीं, खुले 'ओ' की तरह बोला जाता है: কমল (कमल) को 'कोमोल' और বন (वन) को 'बोन' बोलते हैं।"
  - id: bn-fact-004
    tags: [script]
    text:
      en: "Most Bengali letters hang from a line along the top, the মাত্রা (matra), which joins the letters of a word. A few, such as এ and ও, have none."
      bn: "বাংলার বেশিরভাগ অক্ষর মাথার একটা টানা রেখা, মাত্রা, থেকে ঝোলে; মাত্রা একটি শব্দের অক্ষরগুলোকে জুড়ে রাখে। এ, ও-র মতো কয়েকটি অক্ষরে মাত্রা নেই।"
      hi: "बांग्ला के ज़्यादातर अक्षर ऊपर की एक रेखा से लटकते हैं, जिसे মাত্রা (मात्रा) कहते हैं; यह शब्द के अक्षरों को जोड़ती है। এ और ও जैसे कुछ अक्षरों पर यह रेखा नहीं होती।"
  - id: bn-fact-005
    tags: [script]
    text:
      en: "Three Bengali vowel signs, ি, ে and ৈ, are written before their consonant but said after it: কি (ki), কে (ke), কৈ (koi). ো and ৌ go on both sides: কো (ko)."
      bn: "তিনটি স্বরচিহ্ন, ি, ে আর ৈ, ব্যঞ্জনের আগে লেখা হয় কিন্তু উচ্চারিত হয় পরে: কি, কে, কৈ। ো আর ৌ বসে ব্যঞ্জনের দুপাশে: কো।"
      hi: "बांग्ला की तीन मात्राएँ, ি, ে और ৈ, व्यंजन से पहले लिखी जाती हैं पर बोली बाद में जाती हैं: কি (कि), কে (के), কৈ (कै)। ো और ৌ व्यंजन के दोनों ओर लगती हैं: কো (को)।"
  - id: bn-fact-006
    tags: [script]
    text:
      en: "ৎ, the খণ্ড ত (khondo to, 'broken t'), is a t with no vowel after it. It ends words such as হঠাৎ (hothat, suddenly) and সৎ (shot, honest)."
      bn: "ৎ (খণ্ড ত) হলো স্বরহীন ত: এটি হঠাৎ, সৎ-এর মতো শব্দের শেষে বসে।"
      hi: "ৎ (খণ্ড ত, 'खंड त') बिना स्वर वाला त है: यह হঠাৎ (अचानक) और সৎ (ईमानदार) जैसे शब्दों के अंत में आता है।"
  - id: bn-fact-007
    tags: [script, pronunciation]
    text:
      en: "য় is a light y sound that comes after a vowel: যায় (jay, goes), হয় (hoy, happens), মেয়ে (meye, girl)."
      bn: "য় (অন্তঃস্থ অ) স্বরের পরে হালকা 'য়' ধ্বনি দেয়: যায়, হয়, মেয়ে।"
      hi: "য় स्वर के बाद आने वाली 'य' की हल्की ध्वनि है: যায় (जाय), হয় (होय), মেয়ে (मेये, लड़की)।"
  - id: bn-fact-008
    tags: [script, pronunciation]
    text:
      en: "ং is said ng: বাংলা is bangla, and রং (colour) is rong."
      bn: "অনুস্বার ং-এর উচ্চারণ 'ঙ': বাংলা, রং।"
      hi: "ং (अनुस्वार) को 'ङ' बोला जाता है: বাংলা (बाङ्ला), রং (रङ, रंग)।"
  - id: bn-fact-009
    tags: [pronunciation]
    text:
      en: "Bengali has no v or w of its own: ব is always b. The Sanskrit word vana, forest, is বন (bon) in Bengali."
      bn: "বাংলায় আলাদা 'v' বা 'w' ধ্বনি নেই: ব সবসময় 'b'। সংস্কৃতের 'vana' বাংলায় বন।"
      hi: "बांग्ला में 'व' की अपनी ध्वनि नहीं है: ব हमेशा 'ब' बोला जाता है। संस्कृत का वन बांग्ला में বন, 'बोन', है।"
  - id: bn-fact-010
    tags: [pronunciation, conjuncts]
    text:
      en: "A য or ব joined under a consonant, the য-ফলা or ব-ফলা, is usually not said; it doubles the consonant instead: বিদ্যা (learning) is biddya, and বিশ্ব (world) is bishsho."
      bn: "ব্যঞ্জনের সঙ্গে য-ফলা বা ব-ফলা যুক্ত হলে সাধারণত আলাদা উচ্চারিত হয় না, বরং ব্যঞ্জনটি দ্বিত্ব পায়: বিদ্যা, বিশ্ব।"
      hi: "किसी व्यंजन के साथ য-ফলা (य-फला) या ব-ফলা (ब-फला) जुड़ने पर वह अलग नहीं बोला जाता, बल्कि व्यंजन दोहरा हो जाता है: বিদ্যা को 'बिद्दा' और বিশ্ব को 'बिश्शो' बोलते हैं।"
  - id: bn-fact-011
    tags: [grammar]
    text:
      en: "Bengali has no grammatical gender. Verbs and adjectives are the same whoever they describe, and সে means both he and she."
      bn: "বাংলায় ব্যাকরণগত লিঙ্গ নেই। কে বলছে বা কার কথা হচ্ছে, তাতে ক্রিয়া বা বিশেষণ বদলায় না; 'সে' মানে পুরুষ ও নারী দুজনেই।"
      hi: "बांग्ला में व्याकरणिक लिंग नहीं होता। क्रिया और विशेषण किसी के लिए भी एक जैसे रहते हैं, और সে (शे) का अर्थ 'वह' है, पुरुष हो या स्त्री।"
  - id: bn-fact-012
    tags: [grammar, respect]
    text:
      en: "Bengali verbs show respect: আপনি যান, তুমি যাও and তুই যা all mean 'you go', from most to least formal."
      bn: "বাংলা ক্রিয়া সম্মান প্রকাশ করে: আপনি যান, তুমি যাও, তুই যা, তিনটির অর্থ এক, শুধু সম্মানের মাত্রা আলাদা।"
      hi: "बांग्ला क्रियाएँ सम्मान दिखाती हैं: আপনি যান (आप जाइए), তুমি যাও (तुम जाओ) और তুই যা (तू जा), अर्थ एक पर सम्मान अलग।"
  - id: bn-fact-013
    tags: [grammar]
    text:
      en: "Bengali drops 'to be' in the present: আমি ছাত্র, 'I student', means 'I am a student'."
      bn: "বর্তমান কালে বাংলা 'হওয়া' ক্রিয়াটি বাদ দেয়: 'আমি ছাত্র' বাক্যে কোনো ক্রিয়াই নেই।"
      hi: "वर्तमान काल में बांग्ला 'होना' क्रिया छोड़ देती है: আমি ছাত্র (मैं छात्र) का अर्थ है 'मैं छात्र हूँ'।"
  - id: bn-fact-014
    tags: [grammar]
    text:
      en: "Bengali puts 'not' after the verb: আমি জানি না is, word for word, 'I know not'."
      bn: "বাংলায় 'না' বসে ক্রিয়ার পরে: আমি জানি না।"
      hi: "बांग्ला में 'नहीं' क्रिया के बाद आता है: আমি জানি না, शब्दशः 'मैं जानता नहीं'।"
  - id: bn-fact-015
    tags: [grammar]
    text:
      en: "Bengali has no 'the', but it counts with classifiers: একটা বই (one book), দুটো কলম (two pens). -টা after a noun makes it definite: বইটা, the book."
      bn: "বাংলায় আলাদা করে 'the' নেই, কিন্তু গোনার সময় নির্দেশক লাগে: একটা বই, দুটো কলম। বিশেষ্যের পরে -টা বসালে তা নির্দিষ্ট হয়: বইটা।"
      hi: "बांग्ला में 'the' नहीं है, पर गिनते समय -টা (टा) जैसे निर्देशक लगते हैं: একটা বই (एक किताब), দুটো কলম (दो कलम)। संज्ञा के बाद -টা लगाने से वह निश्चित हो जाती है: বইটা, वह किताब।"
  - id: bn-fact-016
    tags: [words]
    text:
      en: "Bengali 'eats' its drinks: খাওয়া covers eating, drinking and smoking alike, as in জল খাওয়া (to drink water) and চা খাওয়া (to drink tea)."
      bn: "বাংলায় খাওয়া শুধু খাবারের নয়: জল খাওয়া, চা খাওয়া, এমনকি সিগারেট খাওয়াও বলা হয়।"
      hi: "बांग्ला में খাওয়া (खाना) पीने और धूम्रपान के लिए भी है: জল খাওয়া (पानी पीना), চা খাওয়া (चाय पीना)।"
  - id: bn-fact-017
    tags: [words]
    text:
      en: "কাল means both yesterday and tomorrow; the verb's tense says which. পরশু is both the day before yesterday and the day after tomorrow."
      bn: "কাল মানে গতকাল ও আগামীকাল দুটোই; ক্রিয়ার কাল বলে দেয় কোনটা। পরশুও তেমনই, আগের বা পরের।"
      hi: "কাল (काल) का अर्थ बीता हुआ कल भी है और आने वाला कल भी; क्रिया का काल बताता है कौन-सा। পরশু (परशु) भी दोनों तरफ़ का होता है।"
  - id: bn-fact-018
    tags: [words]
    text:
      en: "Repeating a word with its first sound changed to ট means 'and so on': চা-টা is 'tea and such', বই-টই 'books and things'."
      bn: "শব্দের পরে তার প্রথম ধ্বনি বদলে 'ট' দিয়ে আবার বললে মানে হয় 'এইসব': চা-টা, বই-টই।"
      hi: "बांग्ला में शब्द को दोहराकर पहली ध्वनि 'ट' कर देने से 'वग़ैरह' का अर्थ आता है: চা-টা (चाय-वाय), বই-টই (किताब-विताब)।"
  - id: bn-fact-019
    tags: [words, family]
    text:
      en: "Bengali names relatives exactly: your father's younger brother is কাকা (kaka), his elder brother জেঠু (jethu), your mother's brother মামা (mama), your father's sister পিসি (pishi) and your mother's sister মাসি (mashi)."
      bn: "বাংলায় আত্মীয়ের নাম খুব নির্দিষ্ট: বাবার ছোট ভাই কাকা, বড় ভাই জেঠু, মায়ের ভাই মামা, বাবার বোন পিসি, মায়ের বোন মাসি।"
      hi: "बांग्ला में रिश्तों के नाम बहुत सटीक हैं: पिता के छोटे भाई কাকা (काका), बड़े भाई জেঠু (जेठू), माँ के भाई মামা (मामा), पिता की बहन পিসি (पिसी), माँ की बहन মাসি (मासी)।"
  - id: bn-fact-020
    tags: [words]
    text:
      en: "In India, Bengali speakers call the rupee টাকা (taka), the same word as Bangladesh's currency."
      bn: "ভারতে বাঙালিরা রুপিকে টাকা বলেন; বাংলাদেশের মুদ্রার নামও টাকা।"
      hi: "भारत में बांग्ला बोलने वाले रुपये को টাকা (टाका) कहते हैं, जो बांग्लादेश की मुद्रा का भी नाम है।"
  - id: bn-fact-021
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Bengali_language"
    text:
      en: "Bengali is the national language of Bangladesh and an official language of West Bengal, Tripura and Assam's Barak Valley. The two main standards differ in some words: জল and পানি for water, লঙ্কা and মরিচ for chilli."
      bn: "বাংলা বাংলাদেশের রাষ্ট্রভাষা, আর পশ্চিমবঙ্গ, ত্রিপুরা ও আসামের বরাক উপত্যকার সরকারি ভাষা। দুই মান্য রূপে কিছু শব্দ আলাদা: জল ও পানি, লঙ্কা ও মরিচ।"
      hi: "बांग्ला बांग्लादेश की राष्ट्रभाषा है, और पश्चिम बंगाल, त्रिपुरा और असम की बराक घाटी की सरकारी भाषा। इसके दो मानक रूपों में कुछ शब्द अलग हैं: জল और পানি (पानी), লঙ্কা और মরিচ (मिर्च)।"
  - id: bn-fact-022
    tags: [history]
    source: "https://en.wikipedia.org/wiki/International_Mother_Language_Day"
    text:
      en: "21 February is International Mother Language Day. UNESCO chose it to honour the students killed in Dhaka in 1952 while demanding recognition for Bengali."
      bn: "২১ ফেব্রুয়ারি আন্তর্জাতিক মাতৃভাষা দিবস। ১৯৫২ সালে বাংলাকে রাষ্ট্রভাষার মর্যাদার দাবিতে ঢাকায় নিহত ছাত্রদের স্মরণে ইউনেস্কো দিনটি বেছে নেয়।"
      hi: "21 फ़रवरी अंतर्राष्ट्रीय मातृभाषा दिवस है। यूनेस्को ने यह दिन 1952 में ढाका में उन छात्रों की याद में चुना, जो बांग्ला को मान्यता दिलाने की माँग करते हुए मारे गए।"
  - id: bn-fact-023
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Jana_Gana_Mana"
    text:
      en: "Rabindranath Tagore wrote, in Bengali, both জন গণ মন, India's national anthem, and আমার সোনার বাংলা, Bangladesh's."
      bn: "রবীন্দ্রনাথ ঠাকুর বাংলায় লিখেছিলেন ভারতের জাতীয় সংগীত 'জন গণ মন' আর বাংলাদেশের 'আমার সোনার বাংলা', দুটোই।"
      hi: "रवींद्रनाथ ठाकुर ने बांग्ला में भारत का राष्ट्रगान 'जन गण मन' और बांग्लादेश का 'आमार सोनार बांग्ला', दोनों लिखे।"
  - id: bn-fact-024
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Rabindranath_Tagore"
    text:
      en: "In 1913 Tagore became the first non-European to win the Nobel Prize in Literature, for Gitanjali, which he had translated from Bengali himself."
      bn: "১৯১৩ সালে রবীন্দ্রনাথ প্রথম অ-ইউরোপীয় হিসেবে সাহিত্যে নোবেল পুরস্কার পান, গীতাঞ্জলির জন্য, যার ইংরেজি অনুবাদ তিনি নিজেই করেছিলেন।"
      hi: "1913 में रवींद्रनाथ ठाकुर साहित्य का नोबेल पाने वाले पहले ग़ैर-यूरोपीय बने, गीतांजलि के लिए, जिसका अंग्रेज़ी अनुवाद उन्होंने ख़ुद किया था।"
  - id: bn-fact-025
    tags: [history]
    source: "https://en.wikipedia.org/wiki/Bengali_language"
    text:
      en: "Bengali is one of the most spoken languages in the world, with well over 200 million speakers."
      bn: "বাংলা পৃথিবীর সবচেয়ে বেশি কথিত ভাষাগুলোর একটি; বক্তা বিশ কোটিরও বেশি।"
      hi: "बांग्ला दुनिया की सबसे ज़्यादा बोली जाने वाली भाषाओं में से एक है, जिसके बोलने वाले बीस करोड़ से भी ज़्यादा हैं।"
  - id: bn-fact-026
    tags: [script, history]
    text:
      en: "With a few changes, the Bengali script is also used for Assamese, and for Manipuri beside its own Meitei script."
      bn: "বাংলা লিপি সামান্য বদলে অসমিয়া ভাষাতেও ব্যবহৃত হয়, আর মণিপুরিতে তার নিজস্ব মেইতেই লিপির পাশাপাশি।"
      hi: "बांग्ला लिपि कुछ बदलावों के साथ असमिया में भी इस्तेमाल होती है, और मणिपुरी में उसकी अपनी मैतेई लिपि के साथ-साथ।"
  - id: bn-fact-027
    tags: [numbers, script]
    text:
      en: "Bengali has its own digits: ০ ১ ২ ৩ ৪ ৫ ৬ ৭ ৮ ৯. Watch out: ৪ looks like an 8 but is four."
      bn: "বাংলার নিজস্ব অঙ্ক: ০ ১ ২ ৩ ৪ ৫ ৬ ৭ ৮ ৯। ইংরেজি অঙ্কে অভ্যস্ত চোখে ৪ দেখতে 8-এর মতো, কিন্তু এর মান চার।"
      hi: "बांग्ला के अपने अंक हैं: ০ ১ ২ ৩ ৪ ৫ ৬ ৭ ৮ ৯। ध्यान दें, ৪ दिखने में 8 जैसा है, पर इसका अर्थ चार है।"
  - id: bn-fact-028
    tags: [numbers]
    text:
      en: "Every number up to a hundred has its own word in Bengali: 26 is ছাব্বিশ (chhabbish), and 99 is নিরানব্বই (niranobboi)."
      bn: "একশো পর্যন্ত প্রতিটি সংখ্যার নিজস্ব শব্দ আছে: ছাব্বিশ, নিরানব্বই।"
      hi: "बांग्ला में सौ तक हर संख्या का अपना शब्द है: 26 ছাব্বিশ (छाब्बिश), 99 নিরানব্বই (निरानोब्बोई)।"
  - id: bn-fact-029
    tags: [history, grammar]
    source: "https://en.wikipedia.org/wiki/Sadhu_bhasha"
    text:
      en: "Written Bengali had two styles: সাধু ভাষা (shadhu bhasha), formal and with long verb forms, and চলিত ভাষা (cholito bhasha), based on Kolkata speech. চলিত is now used almost everywhere: করিয়াছিলাম has become করেছিলাম, 'I had done'."
      bn: "লেখ্য বাংলার দুটি রীতি ছিল: দীর্ঘ ক্রিয়ারূপের সাধু ভাষা, আর কলকাতার মুখের ভাষা-ভিত্তিক চলিত ভাষা। এখন প্রায় সর্বত্র চলিত চলে: করিয়াছিলাম হয়েছে করেছিলাম।"
      hi: "लिखित बांग्ला की दो शैलियाँ थीं: लंबे क्रिया-रूपों वाली সাধু ভাষা (साधु भाषा), और कोलकाता की बोली पर आधारित চলিত ভাষা (चलित भाषा)। अब लगभग हर जगह चलित चलती है: করিয়াছিলাম अब করেছিলাম है।"
  - id: bn-fact-030
    tags: [words, loanwords]
    source: "https://en.wiktionary.org/wiki/jute"
    text:
      en: "English borrowed from Bengali: jute from ঝুটো (jhuto), dinghy from ডিঙি (dingi), and bungalow from বাংলো, a house 'in the Bengal style'."
      bn: "ইংরেজি বাংলা থেকে শব্দ নিয়েছে: jute এসেছে ঝুটো থেকে, dinghy ডিঙি থেকে, আর bungalow বাংলো, অর্থাৎ 'বাংলা ধাঁচের' ঘর থেকে।"
      hi: "अंग्रेज़ी ने बांग्ला से शब्द लिए हैं: jute ঝুটো (झुटो) से, dinghy ডিঙি (डिंगी) से, और bungalow 'बंगाली शैली के घर' से।"
  - id: bn-fact-031
    tags: [words, loanwords]
    text:
      en: "Portuguese traders left Bengali everyday words: চাবি (key), জানালা (window), আলমারি (cupboard) and বালতি (bucket)."
      bn: "পর্তুগিজ বণিকদের কাছ থেকে বাংলায় এসেছে অনেক রোজকার শব্দ: চাবি, জানালা, আলমারি, বালতি।"
      hi: "बांग्ला ने पुर्तगाली व्यापारियों से कई रोज़मर्रा के शब्द लिए: চাবি (चाबी), জানালা (जानाला, खिड़की), আলমারি (अलमारी), বালতি (बाल्टी)।"
  - id: bn-fact-032
    tags: [grammar]
    text:
      en: "Bengali often pairs a verb with a second, light verb for a shade of meaning: খেয়ে ফেলা is 'eat up', বসে পড়া 'sit down'."
      bn: "বাংলায় প্রায়ই একটি ক্রিয়ার সঙ্গে আরেকটি হালকা ক্রিয়া জুড়ে অর্থে রং আনা হয়: খেয়ে ফেলা, বসে পড়া।"
      hi: "बांग्ला में भी एक क्रिया के साथ दूसरी सहायक क्रिया जुड़कर अर्थ में रंग भरती है: খেয়ে ফেলা (खा डालना), বসে পড়া (बैठ जाना)।"
  - id: bn-fact-033
    tags: [words]
    text:
      en: "Some pairs make one word: ছেলেমেয়ে, 'boys and girls', means children, and মা-বাবা, 'mother and father', means parents."
      bn: "অনেক জোড়া শব্দ মিলে একটি অর্থ দেয়: ছেলেমেয়ে মানে সন্তানেরা, মা-বাবা মানে অভিভাবক।"
      hi: "बांग्ला में कई जोड़े मिलकर एक अर्थ देते हैं: ছেলেমেয়ে (लड़के-लड़कियाँ) का मतलब बच्चे, মা-বাবা (माँ-बाप) का मतलब माता-पिता।"
  - id: bn-fact-101
    contrast: en
    tags: [pronunciation]
    text:
      en: "English tells s from sh (sip, ship); Bengali mostly does not. শ, ষ and স are usually all sh, so সাত (seven) is shat, and an English s there sounds foreign."
  - id: bn-fact-102
    contrast: en
    tags: [pronunciation]
    text:
      en: "Romanisation writes Bangla with an a, but most Bengali consonants carry an o-like vowel. That is why the city is now spelled Kolkata: কলকাতা is kolkata, not kalkata."
  - id: bn-fact-103
    contrast: en
    tags: [grammar]
    text:
      en: "English splits he and she; Bengali does not. সে and ও mean either, and nothing else in the sentence says which."
  - id: bn-fact-104
    contrast: en
    tags: [grammar, respect]
    text:
      en: "English has one 'you'. Bengali has three, and the verb changes with each: আপনি যান, তুমি যাও, তুই যা. তুই to a stranger is rude; আপনি is always safe."
  - id: bn-fact-105
    contrast: hi
    tags: [grammar]
    text:
      en: "Hindi makes a man say जाता हूँ and a woman जाती हूँ. Bengali has no gender: everyone says আমি যাই."
      hi: "हिंदी में पुरुष 'जाता हूँ' और स्त्री 'जाती हूँ' कहती है; बांग्ला में लिंग नहीं है, इसलिए सब আমি যাই (आमि जाइ) ही कहते हैं।"
  - id: bn-fact-106
    contrast: hi
    tags: [pronunciation]
    text:
      en: "Hindi's built-in a becomes an open o in Bengali: the lotus is kamal in Hindi and komol in Bengali."
      hi: "हिंदी का 'अ' बांग्ला में खुला 'ओ' बन जाता है: हिंदी का कमल बांग्ला में কমল, 'कोमोल'।"
  - id: bn-fact-107
    contrast: hi
    tags: [pronunciation]
    text:
      en: "Hindi व is v; Bengali ব is always b. Hindi van, forest, is Bengali bon."
      hi: "हिंदी में व 'व' है, पर बांग्ला में ব हमेशा 'ब': हिंदी का वन बांग्ला में বন, 'बोन'।"
  - id: bn-fact-108
    contrast: hi
    tags: [grammar]
    text:
      en: "Hindi puts नहीं before the verb; Bengali puts না after it: আমি জানি না, 'I know not'."
      hi: "हिंदी में 'नहीं' क्रिया से पहले आता है, बांग्ला में 'না' क्रिया के बाद: আমি জানি না, 'मैं जानता नहीं'।"
