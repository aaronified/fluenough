    ipa: "prɔt̪ʰom"
    pos: "adj"
  - id: bn-0699
    target: "দ্বিতীয়"
    native: "second"
    reading: "ditiyo"
    ipa: "d̪it̪ijo"
    pos: "adj"
    notes: "The ব under দ is not said."
  - id: bn-0700
    target: "তৃতীয়"
    native: "third"
    reading: "tritiyo"
    ipa: "t̪rit̪ijo"
    pos: "adj"
  - id: bn-0701
    target: "পয়লা"
    native: "the 1st (of a month)"
    reading: "pôylā"
    ipa: "pɔjla"
    alt_target: ["পহেলা"]
    pos: "other"
    notes: "Dates have forms of their own: পয়লা, দোসরা, তেসরা, চৌঠা for the 1st to the 4th, then -ই from the 5th to the 18th (পাঁচই, written ৫ই) and -এ from the 19th (উনিশে, একুশে). Also পহেলা (pôhelā)."
  - id: bn-0702
    target: "দোসরা"
    native: "the 2nd (of a month)"
    reading: "dośrā"
    ipa: "d̪oʃra"
    pos: "other"
  - id: bn-0703
    target: "তেসরা"
    native: "the 3rd (of a month)"
    reading: "teśrā"
    ipa: "t̪eʃra"
    pos: "other"
  - id: bn-0704
    target: "চৌঠা"
    native: "the 4th (of a month)"
    reading: "couṭhā"
    ipa: "tʃouʈʰa"
    pos: "other"
  - id: bn-0705
    target: "একুশে ফেব্রুয়ারি"
    native: "21 February (Language Martyrs' Day)"
    reading: "ekuśe phebruāri"
    ipa: "ekuʃe pʰebruari"
    pos: "phrase"
    notes: "So famous it is a name: একুশে, 'the 21st', remembers the students killed in Dhaka in 1952 for the right to Bengali. Bengalis everywhere keep it, and UNESCO made it International Mother Language Day."
  - id: bn-0706
    target: "ঋতু"
    native: "season"
    reading: "ritu"
    ipa: "rit̪u"
    pos: "noun"
    notes: "Bengal counts six: গ্রীষ্ম (grishsho, summer), বর্ষা (bôrśā, the rains), শরৎ (śôrot, early autumn), হেমন্ত (hemonto, late autumn), শীত (śit, winter) and বসন্ত (bôśonto, spring)."
  - id: bn-0707
    target: "গরমকাল"
    native: "summer"
    reading: "gôromkāl"
    ipa: "ɡɔromkal"
    alt_target: ["গ্রীষ্মকাল"]
    pos: "noun"
    notes: "কাল here is 'time, season': গরম (gôrom), hot, + কাল. The formal word is গ্রীষ্মকাল (grishshokal)."
  - id: bn-0708
