schema: 1
id: bn-en-calendar
name: "Months and years"
kind: vocab
theme: calendar
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The months as Bengali says them, dates and seasons, and how to read a year."
tags: [beginner]
cards:
  - id: bn-0334
    target: "মাস"
    native: "month"
    reading: "mash"
    pos: "noun"
    notes: "The Gregorian months are used for almost everything. Bengal's own calendar matters mostly for festivals and পয়লা বৈশাখ (poyla boishakh), also পহেলা বৈশাখ (pohela boishakh), the new year on 14 or 15 April."
  - id: bn-0335
    target: "বছর"
    native: "year"
    reading: "bochhor"
    pos: "noun"
    notes: "Years before 2000 are read in hundreds: 1950 is উনিশশো পঞ্চাশ (unishsho ponchash), also written উনিশশ পঞ্চাশ. From 2000, in thousands: 2020 is দু হাজার কুড়ি (du hajar kuri), also দুই হাজার বিশ (dui hajar bish)."
  - id: bn-0336
    target: "তারিখ"
    native: "date"
    reading: "tarikh"
    pos: "noun"
    notes: "আজ কত তারিখ? What's the date today?"
  - id: bn-0337
    target: "জানুয়ারি"
    native: "January"
