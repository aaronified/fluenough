schema: 1
id: bn-en-calendar
name: "Months and years"
kind: vocab
theme: calendar
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The months as Bengali says them, dates and seasons, and how to read a year."
tags: [beginner]
cards:
  - id: bn-0334
    target: "মাস"
    native: "month"
    reading: "māś"
    ipa: "maʃ"
    pos: "noun"
    notes: "The Gregorian months are used for almost everything. Bengal's own calendar matters mostly for festivals and পয়লা বৈশাখ (pôylā boiśākh), also পহেলা বৈশাখ (pôhelā boiśākh), the new year on 14 or 15 April."
  - id: bn-0335
    target: "বছর"
    native: "year"
    reading: "bôchor"
    ipa: "bɔtʃʰor"
    pos: "noun"
    notes: "Years before 2000 are read in hundreds: 1950 is উনিশশো পঞ্চাশ (uniśśo pôncāś), also written উনিশশ পঞ্চাশ. From 2000, in thousands: 2020 is দু হাজার কুড়ি (du hājār kuṛi), also দুই হাজার বিশ (dui hājār biś)."
  - id: bn-0336
    target: "তারিখ"
    native: "date"
    reading: "tārikh"
    ipa: "t̪arikʰ"
    pos: "noun"
    notes: "আজ কত তারিখ? What's the date today?"
  - id: bn-0337
