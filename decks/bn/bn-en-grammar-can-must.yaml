schema: 1
id: bn-en-grammar-can-must
name: "Can, want to, have to"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "The verb's -তে (-te) form with পারা (pārā), চাওয়া (cāoā) and হবে (hôbe). Not yet checked by a Bengali speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: bn-0736
    target: "পারা"
    native: "to be able; can"
    reading: "pārā"
    ipa: "para"
    pos: "verb"
    notes: "After the verb's -তে (-te) form: বলতে পারি (bôlote pāri), I can speak."
  - id: bn-0737
    target: "আমি বাংলা বলতে পারি।"
    native: "I can speak Bengali."
    reading: "āmi bāṅlā bôlte pāri."
    ipa: "ami baŋla bɔlt̪e pari"
    pos: "phrase"
    notes: "'Can' is পারা (pārā) after the verb's -তে (-te) form: বলতে (bôlote), করতে (kôrote), but যেতে (jete), খেতে (khete), দিতে (dite), নিতে (nite) and হতে (hôte)."
    bases:
      - { word: "আমি", ref: "bn-0833" }
      - { word: "বাংলা", base: "বাংলা", reading: "bāṅlā", meaning: "Bengali (the language); Bengal" }
      - { word: "বলতে", ref: "bn-0879" }
      - { word: "পারি", ref: "bn-0736" }
  - id: bn-0738
    target: "আমি সাঁতার কাটতে পারি না।"
    native: "I can't swim."
    reading: "āmi śām̐tār kāṭte pāri nā."
    ipa: "ami ʃãt̪ar kaʈt̪e pari na"
    pos: "phrase"
    notes: "না (nā) goes after পারি (pāri). Swimming is সাঁতার কাটা (sām̐tār kāṭā), 'to cut a swim'."
    bases:
      - { word: "আমি", ref: "bn-0833" }
      - { word: "সাঁতার", base: "সাঁতার", reading: "śām̐tār", meaning: "swimming" }
      - { word: "কাটতে", ref: "bn-1101" }
      - { word: "পারি", ref: "bn-0736" }
  - id: bn-0739
    target: "আমি যেতে পারিনি।"
    native: "I couldn't go."
    reading: "āmi jete pārini."
    ipa: "ami dʒet̪e parini"
    pos: "phrase"
    notes: "'Couldn't' is পারিনি (pārini), the present with -নি (-ni)."
    bases:
      - { word: "আমি", ref: "bn-0833" }
      - { word: "যেতে", ref: "bn-0873" }
      - { word: "পারিনি", ref: "bn-0736" }
  - id: bn-0740
    target: "আমাকে একটু সাহায্য করতে পারবেন?"
    native: "Could you help me a little?"
    reading: "āmāke ekṭu śāhājjo kôrte pārben?"
    ipa: "amake ekʈu ʃaɦadʒdʒo kɔrt̪e parben"
    pos: "phrase"
    tags: ["polite"]
    notes: "The future পারবেন (pāroben) makes the request polite. পারেন (pāren)? is also right."
    bases:
      - { word: "আমাকে", ref: "bn-0833" }
      - { word: "করতে", ref: "bn-0102" }
      - { word: "পারবেন", ref: "bn-0736" }
  - id: bn-0741
    target: "চাওয়া"
    native: "to want"
    reading: "cāoā"
    ipa: "tʃaoa"
    pos: "verb"
    notes: "A thing wanted comes before it: আমি চা চাই (āmi cā cāi), I want tea."
  - id: bn-0742
    target: "আমি বাড়ি যেতে চাই।"
    native: "I want to go home."
    reading: "āmi bāṛi jete cāi."
    ipa: "ami baɽi dʒet̪e tʃai"
    pos: "phrase"
    notes: "'Want to': the -তে (-te) form, then চাওয়া (cāoā)."
    bases:
      - { word: "আমি", ref: "bn-0833" }
      - { word: "যেতে", ref: "bn-0873" }
      - { word: "চাই", ref: "bn-0741" }
  - id: bn-0743
    target: "আমাকে কাল কাজে যেতে হবে।"
    native: "I have to go to work tomorrow."
    reading: "āmāke kāl kāje jete hôbe."
    ipa: "amake kal kadʒe dʒet̪e ɦɔbe"
    pos: "phrase"
    notes: "'Have to': the one who must takes -কে (-ke), then the -তে (-te) form and হবে (hôbe)."
    bases:
      - { word: "আমাকে", ref: "bn-0833" }
      - { word: "কাজে", ref: "bn-0198" }
      - { word: "যেতে", ref: "bn-0873" }
      - { word: "হবে", ref: "bn-0874" }
  - id: bn-0744
    target: "তোমাকে আসতে হবে না।"
    native: "You don't have to come."
    reading: "tomāke āśte hôbe nā."
    ipa: "t̪omake aʃt̪e ɦɔbe na"
    pos: "phrase"
    notes: "না (nā) after হবে (hôbe): no need."
    bases:
      - { word: "তোমাকে", ref: "bn-0835" }
      - { word: "আসতে", ref: "bn-0872" }
      - { word: "হবে", ref: "bn-0874" }
  - id: bn-0745
    target: "এখানে ছবি তোলা যায়?"
    native: "Can one take photos here?"
    reading: "ekhāne chobi tolā jāy?"
    ipa: "ekʰane tʃʰobi t̪ola dʒaj"
    pos: "phrase"
    notes: "'Can one': the verbal noun (তোলা) with যায় (jāy)."
    bases:
      - { word: "ছবি", ref: "bn-1145" }
      - { word: "তোলা", ref: "bn-1104" }
      - { word: "যায়", ref: "bn-0873" }
  - id: bn-0746
    target: "আপনার বিশ্রাম নেওয়া উচিত।"
    native: "You should rest."
    reading: "āpnār bisrām neoā ucit."
    ipa: "apnar bisram neoa utʃit̪"
    pos: "phrase"
    notes: "'Should': the one who should takes -র (-rô), then the verbal noun and উচিত (ucit)."
    bases:
      - { word: "আপনার", ref: "bn-0138" }
      - { word: "বিশ্রাম", base: "বিশ্রাম", reading: "bisrām", meaning: "rest" }
      - { word: "নেওয়া", ref: "bn-0889" }
      - { word: "উচিত", base: "উচিত", reading: "ucit", meaning: "proper; should" }
