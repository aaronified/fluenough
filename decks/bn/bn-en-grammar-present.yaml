schema: 1
id: bn-en-grammar-present
name: "Present tense"
kind: grammar
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I do, you go, she eats: the simple present, by person and respect."
tags: [beginner, grammar]
pattern:
  name: "Simple present"
  slot_name: "person and respect"
  slots: ["আমি / আমরা", "তুই / তোরা", "তুমি / তোমরা", "আপনি / আপনারা", "সে / তারা", "তিনি / তাঁরা"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The verb changes for person and for respect, never for gender or number: আমি and আমরা take the same form. The endings are -ই, -িস, -ও, -েন, -ে, -েন. After a vowel, as in যা- and খা-, they are -ই, -স, -ও, -ন, -য়, -ন: যাই, যাস, যাও, যান, যায়, যান. In লেখা and বোঝা the stem's vowel rises for আমি and তুই: লিখি but লেখে, বুঝি but বোঝে. দেখা keeps its এ: দেখি. দেওয়া shifts by person: দিই, দাও, দেয়. তুমি করো is also written কর, and both are accepted."
  entries:
    - lemma: "করা"
      key: kora
      reading: "kora"
      gloss: "to do"
      forms:
        "আমি / আমরা": "করি"
        "তুই / তোরা": "করিস"
        "তুমি / তোমরা": ["করো", "কর"]
        "আপনি / আপনারা": "করেন"
        "সে / তারা": "করে"
        "তিনি / তাঁরা": "করেন"
      readings:
        "আমি / আমরা": "kori"
        "তুই / তোরা": "korish"
        "তুমি / তোমরা": ["koro", "koro"]
        "আপনি / আপনারা": "koren"
        "সে / তারা": "kore"
        "তিনি / তাঁরা": "koren"
    - lemma: "যাওয়া"
      key: jaoa
      reading: "jaoa"
      gloss: "to go"
      forms:
        "আমি / আমরা": "যাই"
        "তুই / তোরা": "যাস"
        "তুমি / তোমরা": "যাও"
        "আপনি / আপনারা": "যান"
        "সে / তারা": "যায়"
        "তিনি / তাঁরা": "যান"
      readings:
        "আমি / আমরা": "jai"
        "তুই / তোরা": "jash"
        "তুমি / তোমরা": "jao"
        "আপনি / আপনারা": "jan"
        "সে / তারা": "jay"
        "তিনি / তাঁরা": "jan"
    - lemma: "খাওয়া"
      key: khaoa
      reading: "khaoa"
