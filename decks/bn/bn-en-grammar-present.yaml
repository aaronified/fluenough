schema: 1
id: bn-en-grammar-present
name: "Present tense"
kind: grammar
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I do, you go, she eats: the simple present, by person and respect."
tags: [beginner, grammar]
pattern:
  name: "Simple present"
  slot_name: "person and respect"
  slots: ["আমি / আমরা", "তুই / তোরা", "তুমি / তোমরা", "আপনি / আপনারা", "সে / তারা", "তিনি / তাঁরা"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The verb changes for person and for respect, never for gender or number: আমি and আমরা take the same form. The endings are -ই, -িস, -ও, -েন, -ে, -েন. After a vowel, as in যা- and খা-, they are -ই, -স, -ও, -ন, -য়, -ন: যাই, যাস, যাও, যান, যায়, যান. In লেখা and বোঝা the stem's vowel rises for আমি and তুই: লিখি but লেখে, বুঝি but বোঝে. দেখা keeps its এ: দেখি. দেওয়া shifts by person: দিই, দাও, দেয়. তুমি করো is also written কর, and both are accepted."
  entries:
    - lemma: "করা"
      key: kora
      gloss: "to do"
      forms:
        "আমি / আমরা": "করি"
        "তুই / তোরা": "করিস"
        "তুমি / তোমরা": ["করো", "কর"]
        "আপনি / আপনারা": "করেন"
        "সে / তারা": "করে"
        "তিনি / তাঁরা": "করেন"
    - lemma: "যাওয়া"
      key: jaoa
      gloss: "to go"
      forms:
        "আমি / আমরা": "যাই"
        "তুই / তোরা": "যাস"
        "তুমি / তোমরা": "যাও"
        "আপনি / আপনারা": "যান"
        "সে / তারা": "যায়"
        "তিনি / তাঁরা": "যান"
    - lemma: "খাওয়া"
      key: khaoa
      gloss: "to eat"
      forms:
        "আমি / আমরা": "খাই"
        "তুই / তোরা": "খাস"
        "তুমি / তোমরা": "খাও"
        "আপনি / আপনারা": "খান"
        "সে / তারা": "খায়"
        "তিনি / তাঁরা": "খান"
    - lemma: "বলা"
      key: bola
      gloss: "to say"
      forms:
        "আমি / আমরা": "বলি"
        "তুই / তোরা": "বলিস"
        "তুমি / তোমরা": ["বলো", "বল"]
        "আপনি / আপনারা": "বলেন"
        "সে / তারা": "বলে"
        "তিনি / তাঁরা": "বলেন"
    - lemma: "লেখা"
      key: lekha
      gloss: "to write"
      forms:
        "আমি / আমরা": "লিখি"
        "তুই / তোরা": "লিখিস"
        "তুমি / তোমরা": ["লেখো", "লেখ"]
        "আপনি / আপনারা": "লেখেন"
        "সে / তারা": "লেখে"
        "তিনি / তাঁরা": "লেখেন"
    - lemma: "দেখা"
      key: dekha
      gloss: "to see"
      forms:
        "আমি / আমরা": "দেখি"
        "তুই / তোরা": "দেখিস"
        "তুমি / তোমরা": ["দেখো", "দেখ"]
        "আপনি / আপনারা": "দেখেন"
        "সে / তারা": "দেখে"
        "তিনি / তাঁরা": "দেখেন"
    - lemma: "বোঝা"
      key: bojha
      gloss: "to understand"
      forms:
        "আমি / আমরা": "বুঝি"
        "তুই / তোরা": "বুঝিস"
        "তুমি / তোমরা": ["বোঝো", "বোঝ"]
        "আপনি / আপনারা": "বোঝেন"
        "সে / তারা": "বোঝে"
        "তিনি / তাঁরা": "বোঝেন"
    - lemma: "থাকা"
      key: thaka
      gloss: "to stay; to live"
      forms:
        "আমি / আমরা": "থাকি"
        "তুই / তোরা": "থাকিস"
        "তুমি / তোমরা": ["থাকো", "থাক"]
        "আপনি / আপনারা": "থাকেন"
        "সে / তারা": "থাকে"
        "তিনি / তাঁরা": "থাকেন"
    - lemma: "দেওয়া"
      key: deoa
      gloss: "to give"
      forms:
        "আমি / আমরা": "দিই"
        "তুই / তোরা": "দিস"
        "তুমি / তোমরা": "দাও"
        "আপনি / আপনারা": "দেন"
        "সে / তারা": "দেয়"
        "তিনি / তাঁরা": "দেন"
    - lemma: "হওয়া"
      key: hoa
      gloss: "to be; to become"
      forms:
        "আমি / আমরা": "হই"
        "তুই / তোরা": "হস"
        "তুমি / তোমরা": "হও"
        "আপনি / আপনারা": "হন"
        "সে / তারা": "হয়"
        "তিনি / তাঁরা": "হন"
