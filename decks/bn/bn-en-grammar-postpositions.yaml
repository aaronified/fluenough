schema: 1
id: bn-en-grammar-postpositions
name: "Case endings and postpositions"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "In, of, to and from: endings on the noun, and words after it."
tags: [beginner, grammar]
cards:
  - ref: bn-0124
    native: "at home; in the house"
    notes: "-এ or -তে is 'in, at': ঘরে, in the room; কলকাতায়, in Kolkata."
  - id: bn-0292
    target: "রামের বাড়ি"
    native: "Ram's house"
    reading: "ramer bari"
    pos: "phrase"
    notes: "-এর or -র is 'of, 's'."
  - id: bn-0293
    target: "রামকে দিন।"
    native: "Give it to Ram, please."
    reading: "ramke din."
    pos: "phrase"
    notes: "-কে marks the person something is given or said to."
  - id: bn-0294
    target: "থেকে"
    native: "from"
    reading: "theke"
    pos: "particle"
    notes: "দিল্লি থেকে, from Delhi. কাল থেকে, since yesterday."
  - id: bn-0295
    target: "দিয়ে"
    native: "with (using); by way of"
    reading: "diye"
    pos: "particle"
    notes: "হাত দিয়ে, with the hand. এই রাস্তা দিয়ে, along this road."
  - id: bn-0296
    target: "সঙ্গে"
    native: "with (together with)"
    reading: "shongge"
    alt_target: ["সাথে"]
    pos: "particle"
    notes: "The noun before it takes -এর: রামের সঙ্গে, with Ram; আমার সঙ্গে, with me. Also সাথে (shathe)."
  - id: bn-0297
    target: "জন্য"
    native: "for"
    reading: "jonno"
    pos: "particle"
    notes: "আপনার জন্য, for you."
  - ref: bn-0309
    native: "near; (to have on you)"
    notes: "স্টেশনের কাছে, near the station. আমার কাছে টাকা আছে, I have money on me."
  - id: bn-0298
    target: "পরে"
    native: "after"
    reading: "pore"
    pos: "particle"
    notes: "খাওয়ার পরে, after eating."
  - id: bn-0299
    target: "আগে"
    native: "before"
    reading: "age"
    pos: "particle"
    notes: "খাওয়ার আগে, before eating."
  - id: bn-0300
    target: "ওপরে"
    native: "on; above"
    reading: "opore"
    pos: "particle"
    notes: "টেবিলের ওপরে, on the table."
  - id: bn-0301
    target: "নিচে"
    native: "under; below"
    reading: "niche"
    pos: "particle"
    notes: "টেবিলের নিচে, under the table."
