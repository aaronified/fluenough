schema: 1
id: bn-en-grammar-postpositions
name: "Case endings and postpositions"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "In, of, to and from: endings on the noun, and words after it."
tags: [beginner, grammar]
cards:
  - ref: bn-0124
    tags: []
    native: "at home; in the house"
    notes: "-এ (-e), -তে (-te) or -য় (-yô) is 'in, at': ঘরে (ghôre), in the room; বাড়িতে (bāṛite), at home; কলকাতায় (kôlokātāy) (-য় (-yô) after আ (ā))."
  - id: bn-0292
    target: "রামের বাড়ি"
    native: "Ram's house"
    reading: "rāmer bāṛi"
    ipa: "ramer baɽi"
    pos: "phrase"
    notes: "-এর (-er) or -র (-rô) is 'of, 's'."
  - id: bn-0293
    target: "রামকে দিন।"
    native: "Give it to Ram, please."
    reading: "rāmke din."
    ipa: "ramke d̪in"
    pos: "phrase"
    notes: "-কে (-ke) marks a person as the object: the one given or told something (রামকে দিন), or the one seen or known (আমি রামকে চিনি). Things usually take no ending."
  - id: bn-0294
    target: "থেকে"
    native: "from"
    reading: "theke"
    ipa: "t̪ʰeke"
    pos: "particle"
    notes: "দিল্লি থেকে (dilli theke), from Delhi. কাল থেকে (kāl theke), since yesterday or from tomorrow: কাল (kāl) is both, and the verb's tense tells you which."
  - id: bn-0295
    target: "দিয়ে"
    native: "with (using); by way of"
    reading: "diye"
    ipa: "d̪ije"
    pos: "particle"
    notes: "হাত দিয়ে (hāt diye), with the hand. এই রাস্তা দিয়ে (ei rāstā diye), along this road."
  - id: bn-0296
    target: "সঙ্গে"
    native: "with (together with)"
    reading: "śôṅge"
    ipa: "ʃɔŋɡe"
    alt_target: ["সাথে"]
    pos: "particle"
    notes: "The noun before it takes -এর (-er): রামের সঙ্গে (rāmer śôṅge), with Ram; আমার সঙ্গে (āmār śôṅge), with me. Also সাথে (śāthe)."
  - id: bn-0297
    target: "জন্য"
    native: "for"
    reading: "jonno"
    ipa: "dʒonno"
    pos: "particle"
    notes: "আপনার জন্য (āponār jonno), for you."
  - ref: bn-0309
    native: "near; (to have on you)"
    notes: "স্টেশনের কাছে (sṭeśoner kāche), near the station. আমার কাছে টাকা আছে (āmār kāche ṭākā āche), I have money on me."
  - id: bn-0298
    target: "পরে"
    native: "after"
    reading: "pôre"
    ipa: "pɔre"
    alt_target: ["পর"]
    pos: "particle"
    notes: "খাওয়ার পরে (khāoyār pôre) or খাওয়ার পর (khāoyār pôr), after eating."
  - id: bn-0299
    target: "আগে"
    native: "before"
    reading: "āge"
    ipa: "aɡe"
    pos: "particle"
    notes: "খাওয়ার আগে (khāoyār āge), before eating."
  - id: bn-0300
    target: "ওপরে"
    native: "on; above"
    reading: "opore"
    ipa: "opore"
    alt_target: ["উপরে"]
    pos: "particle"
    notes: "টেবিলের ওপরে (ṭebiler opore), on the table. Also written উপরে (upore)."
  - id: bn-0301
    target: "নিচে"
    native: "under; below"
    reading: "nice"
    ipa: "nitʃe"
    alt_target: ["নীচে"]
    pos: "particle"
    notes: "টেবিলের নিচে (ṭebiler nice), under the table. Also written নীচে (nice)."
  - id: bn-0585
    target: "ভিতরে"
    native: "inside"
    reading: "bhitore"
    ipa: "bʱit̪ore"
    alt_target: ["ভেতরে"]
    pos: "particle"
    notes: "বাক্সের ভিতরে (bākser bhitore), inside the box. In speech often ভেতরে (bhetore)."
  - id: bn-0586
    target: "বাইরে"
    native: "outside"
    reading: "bāire"
    ipa: "baire"
    pos: "particle"
    notes: "বাড়ির বাইরে (bāṛir bāire), outside the house."
  - id: bn-0587
    target: "মধ্যে"
    native: "in; within; among"
    reading: "moddhe"
    ipa: "mod̪d̪ʱe"
    pos: "particle"
    notes: "এক ঘণ্টার মধ্যে (ek ghônṭār moddhe), within an hour."
  - id: bn-0588
    target: "চেয়ে"
    native: "than"
    reading: "ceye"
    ipa: "tʃeje"
    pos: "particle"
    notes: "After the possessive: আমার চেয়ে (āmār ceye), than me."
  - id: bn-0589
    target: "ছাড়া"
    native: "except; without"
    reading: "chāṛā"
    ipa: "tʃʰaɽa"
    pos: "particle"
    notes: "The word before it takes no ending: চিনি ছাড়া (cini chāṛā), without sugar."
  - id: bn-0590
    target: "নিয়ে"
    native: "about (a topic); bringing along"
    reading: "niye"
    ipa: "nije"
    pos: "particle"
    notes: "কী নিয়ে (ki niye)? About what? A person before it takes -কে (-ke): ওকে নিয়ে এসো (oke niye eso), bring him along."
  - id: bn-0591
    target: "পর্যন্ত"
    native: "until; as far as"
    reading: "pôrjonto"
    ipa: "pɔrdʒont̪o"
    alt_target: ["অবধি"]
    pos: "particle"
    notes: "পাঁচটা পর্যন্ত (pām̐coṭā pôrjonto), until five. Also অবধি (ôbodhi)."
  - id: bn-0592
    target: "আমি ওকে চিনি।"
    native: "I know him. / I know her."
    reading: "āmi oke cini."
    ipa: "ami oke tʃini"
    pos: "phrase"
    notes: "A person as the object takes -কে (-ke); a thing usually doesn't: আমি বইটা চাই (āmi boiṭā cāi)."
  - id: bn-0593
    target: "কাঠের টেবিল"
    native: "a wooden table"
    reading: "kāṭher ṭebil"
    ipa: "kaʈʰer ʈebil"
    pos: "phrase"
    notes: "-এর (-er) is also 'made of' and 'aged': দশ বছরের ছেলে (dôś bôchorer chele), a ten-year-old boy."
