  - id: "bn-3690"
    target: "রাজা"
    reading: "rājā"
    ipa: "radʒa"
    pos: "noun"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "রাজা", reading: "rājā" }] }
    examples:
      - { target: "রাজা প্রজাদের ভালোবাসতেন।", reading: "rājā prôjāder bhālobāsoten.", ipa: "radʒa prɔdʒad̪er bʱalobasot̪en", bases: [{ word: "প্রজাদের", base: "প্রজা", reading: "prôjāder" }, { word: "ভালোবাসতেন", ref: "bn-2248" }] }
      - { target: "রাজার প্রাসাদটা বড়।", reading: "rājār prāsādoṭā bôṛ.", ipa: "radʒar prasad̪oʈa bɔɽ", bases: [{ word: "রাজার", base: "রাজা", reading: "rājār" }, { word: "প্রাসাদটা", ref: "bn-3073" }, { word: "বড়", ref: "bn-0062" }] }
  - id: "bn-3691"
