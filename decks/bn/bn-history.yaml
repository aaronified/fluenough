    reading: "rāni"
    ipa: "rani"
    pos: "noun"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "রানি", reading: "rāni" }] }
    examples:
      - { target: "রানি দুর্গে থাকতেন।", reading: "rāni durge thākoten.", ipa: "rani d̪urɡe t̪ʰakot̪en", bases: [{ word: "দুর্গে", ref: "bn-3074" }, { word: "থাকতেন", ref: "bn-0875" }] }
      - { target: "রানির গল্প সবাই জানে।", reading: "rānir gôlp sôbāi jāne.", ipa: "ranir ɡɔlp sɔbai dʒane", bases: [{ word: "রানির", base: "রানি", reading: "rānir" }, { word: "গল্প", ref: "bn-2214" }, { word: "সবাই", ref: "bn-0854" }, { word: "জানে", ref: "bn-0881" }] }
  - id: "bn-3692"
    target: "সম্রাট"
    reading: "sômrāṭ"
    ipa: "sɔmraʈ"
    pos: "noun"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "সম্রাট", reading: "sômrāṭ" }] }
    examples:
      - { target: "সম্রাট বিশাল সাম্রাজ্য শাসন করতেন।", reading: "sômrāṭ biśāl sāmrājj śāson kôroten.", ipa: "sɔmraʈ biʃal samradʒdʒ ʃason kɔrot̪en", bases: [{ word: "বিশাল", base: "বিশাল", reading: "biśāl" }, { word: "সাম্রাজ্য", ref: "bn-3706" }, { word: "শাসন", ref: "bn-3697" }, { word: "করতেন", ref: "bn-0102" }] }
      - { target: "সম্রাটের মুদ্রা এখনো আছে।", reading: "sômrāṭer mudrā ekhono āche.", ipa: "sɔmraʈer mud̪ra ekʰono atʃʰe", bases: [{ word: "সম্রাটের", base: "সম্রাট", reading: "sômrāṭer" }, { word: "মুদ্রা", ref: "bn-3051" }, { word: "এখনো", ref: "bn-1533" }, { word: "আছে", base: "আছে", reading: "āche" }] }
  - id: "bn-3693"
