schema: 1
id: "bn-en-help"
kind: "layer"
core: "bn-help"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Help"
description: "Asking for help, saying you feel ill, doctors and medicine, and saying you are lost."
license: "CC-BY-SA-4.0"
tags: ["beginner"]
cards:
  "bn-0371":
    native: "help"
    "examples": {
      "সাহায্য করুন!": {"native": "Please help!", "bases": {}},
      "অভাবী মানুষকে সাহায্য করো।": {"native": "Help people in need. (familiar)", "bases": {"মানুষকে": "people", "সাহায্য": "help"}}
    }
  "bn-0372":
    native: "Please help!"
  "bn-0373":
    native: "Help! (in danger)"
    notes:
      "n1": "What you shout in danger: literally 'save me!'"
  "bn-0374":
    native: "Stop!; Wait, please!"
  "bn-0375":
    native: "police"
    notes:
      "n1": "The emergency number is 112 in India and 999 in Bangladesh."
  "bn-0376":
    native: "doctor"
    "examples": {
      "ডাক্তার দেখানো": {"native": "to see a doctor", "bases": {"ডাক্তার": "doctor"}}
    }
  "bn-0377":
    native: "hospital"
    "examples": {
      "অ্যাম্বুলেন্সে হাসপাতালে যাও।": {"native": "Go to hospital by ambulance. (familiar)", "bases": {"অ্যাম্বুলেন্সে": "ambulance", "হাসপাতালে": "hospital"}},
      "হাসপাতালে কে আছেন?": {"native": "Who is in the hospital?", "bases": {"কে": "who", "আছেন": "is", "হাসপাতালে": "hospital"}}
    }
  "bn-0378":
    native: "medicine"
    notes:
      "n1": "A chemist's is ওষুধের দোকান (ośudher dokān)."
    "examples": {
      "ওষুধ খাওয়া": {"native": "to take medicine", "bases": {}}
    }
  "bn-0379":
    native: "pain"
    notes:
      "n1": "মাথা ব্যথা করছে (māthā bêthā kôrche), I have a headache."
  "bn-0380":
    native: "I'm lost."
    notes:
      "n1": "যাওয়া (jāoā) changes its stem in the past and perfect: গে- (ge-)."
  "bn-0381":
    native: "I didn't understand."
  "bn-0382":
    native: "Where is the toilet?"
    notes:
      "n1": "Signs say শৌচাগার (śoucāgār)."
  "bn-0726":
    native: "I'm not well."
    notes:
      "n1": "Literally 'my body is bad'."
  "bn-0727":
    native: "fever"
    notes:
      "n1": "The ব (bô) under জ (jô) is not said. আমার জ্বর হয়েছে (āmār jôr hôyeche), I have a fever."
    "examples": {
      "আমার জ্বর।": {"native": "I have a fever.", "bases": {}},
      "জ্বর হওয়া": {"native": "to get a fever", "bases": {}}
    }
  "bn-0728":
    native: "head"
    "examples": {
      "আমার মাথায় ব্যথা।": {"native": "I have a headache.", "bases": {"মাথায়": "head"}}
    }
  "bn-0729":
    native: "stomach"
    "examples": {
      "আমার পেটে ব্যথা।": {"native": "I have a stomach ache.", "bases": {"পেটে": "stomach"}},
      "বাবার পেট খারাপ।": {"native": "Father has an upset stomach.", "bases": {"পেট": "stomach"}}
    }
  "bn-0730":
    native: "hand; arm"
    "examples": {
      "হাত ঘষল।": {"native": "She rubbed her hands.", "bases": {"ঘষল": "to rub", "হাত": "hand; arm"}}
    }
  "bn-0731":
    native: "foot; leg"
    "examples": {
      "পায়ের পেশিতে ব্যথা।": {"native": "Pain in the leg muscles.", "bases": {"পেশিতে": "muscle", "পায়ের": "foot; leg"}}
    }
  "bn-0732":
    native: "eye"
    "examples": {
      "প্রতিমার চোখ খুব সুন্দর।": {"native": "The image's eyes are very beautiful.", "bases": {}},
      "সে চোখের জল ঝরাল।": {"native": "She shed tears.", "bases": {"ঝরাল": "to shed", "চোখের": "eye"}}
    }
  "bn-0733":
    native: "tooth"
    "examples": {
      "দাঁত মাজা": {"native": "to brush one's teeth", "bases": {"মাজা": "to scrub; to brush (teeth)"}}
    }
  "bn-0734":
    native: "throat; neck"
    "examples": {
      "মাথায় ব্যথা আর গলা ব্যথা।": {"native": "A headache and a sore throat.", "bases": {"গলা": "throat; neck"}}
    }
  "bn-0735":
    native: "I have a stomach ache."
