schema: 1
id: "bn-en-grammar-verb-perfect"
kind: "layer"
core: "bn-grammar-verb-perfect"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Verbs: what I, you, he, she have done"
description: "Every verb the course teaches, in the perfect for something done that still counts now, for each person and each level of respect. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "person"
  slots:
    "ami": "I or we, in the perfect"
    "tui": "you (intimate), in the perfect"
    "tumi": "you (familiar), in the perfect"
    "apni": "you (respectful), in the perfect"
    "se": "he, she or they, in the perfect"
    "tini": "he or she (respectful), in the perfect"
rules:
  "bn-rule-perfect-first":
    name: "-ছি (-chi): I, we"
    explanation: "{1} joins the stem and is for 'I' and for 'we' alike: {2}, {3}. The stem is the one the verb takes before 'and', so a verb whose stem changes keeps the change: {4} gives {5}, and {6} gives {7}. For {8} there are two forms, {9} and the colloquial {10}, and both are used."
  "bn-rule-perfect-second":
    name: "-ছিস (-chiś), -ছো (-cho), -ছেন (-chen): you"
    explanation: "The three words for you keep their endings in the perfect, and the stem does not change between them. {1}, for a friend or a younger person, takes {2}: {3}. {4}, the familiar one, takes {5} or the shorter {6}: {7}. {8}, the respectful one, takes {9}: {10}. A verb with a changed stem keeps it: {11}, {12}."
  "bn-rule-perfect-third":
    name: "-ছে (-che), -ছেন (-chen): he, she, they"
    explanation: "For someone who is not there, {1} is the ordinary ending: {2}, {3}. It does not change for one or for many. For someone you respect it is {4}, as for {5}: {6}. A verb with a changed stem keeps it: {7}, {8}."
