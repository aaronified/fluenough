id: "bn-en-clothes-sentences"
kind: "layer"
core: "bn-clothes-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Clothes and colours: sentences"
description: "Short sentences about what people wear and what colour it is. They unlock once their words and rules are known. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-1212":
    native: "I have a blue shirt."
    notes:
      "n1": "একটা (ekṭā) means 'a' or 'one' and comes before the noun it counts, here a blue shirt."
    bases:
      "আছে": "to be; there is"
  "bn-1213":
    native: "She wears a red sari."
  "bn-1214":
    native: "I wear a white panjabi."
  "bn-1215":
    native: "Father wears a dhoti. (respectful)"
    notes:
      "n1": "The -েন (-en) ending is the respectful form, as in আপনি (āpni) দেখেন (dekhen), you look."
  "bn-1216":
    native: "Please wear black shoes."
    notes:
      "n1": "The -ুন (-un) ending is the polite request for আপনি (āpni), as in দেখুন (dekhun), please look."
  "bn-1217":
    native: "Where are my shoes?"
  "bn-1218":
    native: "This shirt is beautiful."
    notes:
      "n1": "-টা (-ṭā) marks one thing already known, as in এই (ei) জামাটা (jāmāṭā), this shirt."
    bases:
      "এই": "this"
  "bn-1219":
    native: "How much is the sari?"
  "bn-1220":
    native: "What colour is your cap? (familiar)"
    notes:
      "n1": "তোমার (tomār), your, is the familiar form used with a friend or child; the respectful form is আপনার (āpnār)."
  "bn-1221":
    native: "My favourite colour is blue."
  "bn-1222":
    native: "The mango is yellow."
  "bn-1223":
    native: "Please wipe your face with a gamchha."
    notes:
      "n1": "দিয়ে (diye), with, marks the thing used to do something, as in গামছা (gāmchā) দিয়ে, with a gamchha."
  "bn-1224":
    native: "My elder sister wears jewellery. (respectful)"
  "bn-1225":
    native: "Your necklace is beautiful. (respectful)"
    notes:
      "n1": "আপনার (āpnār), your, is the respectful form; the familiar form is তোমার (tomār)."
