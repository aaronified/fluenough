cards:
  "bn-6000":
    native: "The affection of the powerful is a dam built of sand."
    notes:
      "literal": "Word for word: The love of the great is a sand embankment."
      "usage": "Said of a powerful person's affection, which gives way when it is tested."
  "bn-6001":
    native: "A cheat's affection is as sharp as a razor's edge."
    notes:
      "literal": "Word for word: The love of a cheat is the edge of a razor."
      "usage": "Said of flattery from someone who deceives."
  "bn-6002":
    native: "Affection that is pressed on, and beauty made by scrubbing, are not genuine."
    notes:
      "literal": "Word for word: Love that is pleaded for, and beauty made by polishing."
      "usage": "Said of forced affection and of looks that are put on."
  "bn-6003":
    native: "Old age brings serious illnesses."
    notes:
      "literal": "Word for word: In old age, a big disease."
      "usage": "Said when an older person falls seriously ill."
  "bn-6004":
    native: "An old myna does not become tame, so old habits stay."
    notes:
      "literal": "Word for word: Does an old myna become tame?"
      "usage": "Said of someone too old to change the way they do things."
  "bn-6005":
    native: "With old age, understanding and judgement fade away."
    notes:
      "literal": "Word for word: When one is old, wit and sense are lost."
      "usage": "Said of an older person whose judgement has slipped."
  "bn-6006":
    native: "A true statement needs no decoration."
    notes:
      "literal": "Word for word: A true word has no branches and no leaves."
  "bn-6007":
    native: "Smiling and cheerful outside, but full of poison inside."
    notes:
      "literal": "Word for word: Outwardly, smiles and cheer; inwardly, a heap of poison."
      "usage": "Said of a person who is friendly to your face and hostile behind your back."
  "bn-6008":
    native: "Once dressed up and adorned, anyone can look like a king."
    notes:
      "literal": "Word for word: Dressed and decorated, the drongo is king."
      "usage": "Said of someone whose appearance is grander than their worth."
  "bn-6009":
    native: "He has no understanding at all."
    notes:
      "literal": "Word for word: In understanding, a raw plantain."
      "usage": "Said of a dull person; the raw plantain stands for nothing."
  "bn-6010":
    native: "The clever mouse runs when it sees the cat."
    notes:
      "literal": "Word for word: A clever mouse runs away on seeing a cat."
      "usage": "Said of someone who leaves danger in time."
  "bn-6011":
    native: "In a crisis, the mind turns the wrong way."
    notes:
      "literal": "Word for word: In a time of disaster, reversed understanding."
      "usage": "Said of panic, when fear makes sense go the wrong way."
  "bn-6012":
    native: "The blacksmith next door: make my knife for me."
    notes:
      "literal": "Word for word: The blacksmith is near the house; make my blade for me."
      "usage": "Said of the nearby helper that one turns to first."
  "bn-6013":
    native: "Open your mouth and the village news comes to you."
    notes:
      "literal": "Word for word: If you open your mouth, village news is got."
      "usage": "Said of gossip that reaches you just by being around people."
  "bn-6014":
    native: "Each stop on the way makes the journey longer, and the road is not to blame."
    notes:
      "literal": "Word for word: Sit for a while, stand for a kos; the road says, what fault is mine?"
      "usage": "Said of someone who lingers on a journey and then blames the road."
  "bn-6015":
    native: "All roads are a rush, but at the ferry landing you are stuck."
    notes:
      "literal": "Word for word: All roads are a scramble; at the ferry landing, rolling about."
      "usage": "Said of how a delay at the last step can undo all the hurry before it."
  "bn-6016":
    native: "Setting out on the road with nothing to rely on."
    notes:
      "literal": "Word for word: Walking the road without provisions."
      "usage": "Said of starting a venture without the means to finish it."
  "bn-6017":
    native: "A king is honoured in his own country."
    notes:
      "literal": "Word for word: In one's own country, the king is worshipped."
      "usage": "Said to stress that a person's standing is greatest at home."
  "bn-6018":
    native: "No one farmed in their father's time, and now they tie up a cat and farm."
    notes:
      "literal": "Word for word: In father's time there was no farming; tying up a cat, they farm."
      "usage": "Said of someone who attempts a job with no knowledge and makes a show of it."
  "bn-6019":
    native: "Clouds alone do not wet the ground."
    notes:
      "literal": "Word for word: Clouds alone do not soak the soil."
      "usage": "Said of promises or talk that bring no result without action."
