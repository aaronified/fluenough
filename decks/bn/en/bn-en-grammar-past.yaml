pattern:
  name: "Simple past"
  slot_name: "person and respect"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "kora": "to do"
    "jaoa": "to go"
    "khaoa": "to eat"
    "bola": "to say"
  notes: "The verb changes for person and for respect, never for gender or number: আমি (āmi) and আমরা (āmorā) take the same form. The endings are -লাম (-lām), -লি (-li), -লে (-le), -লেন (-len), -ল (-lô), -লেন (-len). যাওয়া (jāoyā) takes a different stem: গেলাম (gelām). খাওয়া (khāoyā) changes its vowel: খেলাম (khelām)."
