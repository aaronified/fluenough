schema: 1
id: "bn-en-grammar-sentences"
kind: "layer"
core: "bn-grammar-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Basic sentences"
description: "Word order, no 'is', and how Bengali says 'have' and 'like'."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar"]
cards:
  "bn-0149":
    native: "I am a student."
    notes:
      "n1": "No 'is' in the present: 'I student'. A woman says আমি ছাত্রী (chhatri)."
  "bn-0150":
    native: "This is my house."
  "bn-0151":
    native: "I drink tea."
    notes:
      "n1": "Subject, object, verb. Bengali 'eats' tea: খাওয়া (khāoyā) covers drinking too."
  "bn-0152":
    native: "She is learning Bengali. / He is learning Bengali."
    bases:
      "বাংলা": "Bengali (the language); Bengal"
  "bn-0153":
    native: "I like Bengali."
    notes:
      "n1": "'To me, Bengali feels good': the liker takes the possessive."
    bases:
      "বাংলা": "Bengali (the language); Bengal"
      "লাগে": "to feel; to be needed; to take (of time)"
  "bn-0154":
    native: "I have a car."
    notes:
      "n1": "'Of me there is a car': আছে (āche), 'there is', with the owner's possessive."
    bases:
      "আছে": "to be; there is"
  "bn-0155":
    native: "I don't have money."
    notes:
      "n1": "নেই (nei), 'there isn't', is the negative of আছে (āche)."
    bases:
      "নেই": "there is not"
  "bn-0156":
    native: "This isn't good."
    notes:
      "n1": "না (nā) comes at the end: 'this good not'."
  "bn-0157":
    native: "Please don't go."
    notes:
      "n1": "না (nā) comes after the verb, even for 'don't'."
  "bn-0158":
    native: "It's very hot today."
    notes:
      "n1": "No 'it', and no 'is'."
