"cards":
  "bn-5050":
    "native": "I sleep eight hours every day."
    "confusables":
      "c1":
        "why": "ten, not eight"
      "c2":
        "why": "at night, not every day"
  "bn-5051":
    "native": "When do you come?"
    "confusables":
      "c1":
        "why": "when at what time, not which day"
      "c2":
        "why": "he comes, not you"
  "bn-5052":
    "native": "He comes after three weeks."
    "confusables":
      "c1":
        "why": "before, not after"
      "c2":
        "why": "goes, not comes"
  "bn-5053":
    "native": "He goes to the office three days a week."
    "confusables":
      "c1":
        "why": "two days, not three"
      "c2":
        "why": "comes to, not goes to"
  "bn-5054":
    "native": "We play for two hours at midday."
    "confusables":
      "c1":
        "why": "in the morning, not at midday"
      "c2":
        "why": "sleep, not play"
  "bn-5055":
    "native": "They call out a hundred times."
    "confusables":
      "c1":
        "why": "listens, not calls"
      "c2":
        "why": "one, not a hundred"
  "bn-5056":
    "native": "I walk in the morning."
    "confusables":
      "c1":
        "why": "in the afternoon, not the morning"
      "c2":
        "why": "see, not walk"
  "bn-5057":
    "native": "For how many days do you walk?"
    "confusables":
      "c1":
        "why": "how many things, not how many days"
      "c2":
        "why": "I walk, not you"
  "bn-5058":
    "native": "Elder brother sits for a minute and a half."
    "confusables":
      "c1":
        "why": "hours, not minutes"
      "c2":
        "why": "I sit, not he sits"
  "bn-5059":
    "native": "My brother is very tall."
    "confusables":
      "c1":
        "why": "small, not tall"
      "c2":
        "why": "happy, not tall"
