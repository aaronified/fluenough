schema: 1
id: "bn-en-grammar-emphasis-sentences"
kind: "layer"
core: "bn-grammar-emphasis-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Emphasis: sentences"
description: "Short sentences with the -ই (-i) form: itself, only this one, for sure. They unlock once their words are known. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-4075":
    native: "I will do the work myself."
    notes:
      "n1": "আমিই (āmii), I myself, adds the emphasis -ই (-i) to আমি (āmi), I."
    confusables: { "c1": { why: "you: a different person doing the work" }, "c2": { why: "everyone: many people, not one" } }
  "bn-4076":
    native: "You are the best."
    bases: { "সেরা": "best" }
    notes:
      "n1": "তুমিই (tumii), you yourself, adds the emphasis -ই (-i) to the word for you."
    confusables: { "c1": { why: "I: the speaker, not the one praised" }, "c2": { why: "good: a weaker word than best" } }
  "bn-4077":
    native: "Stay right here. (familiar)"
    notes:
      "n1": "এখানেই (ekhānei), right here, adds the emphasis -ই (-i) to এখানে (ekhāne), here."
    confusables: { "c1": { why: "there: a different place" }, "c2": { why: "home: a place, not 'here'" } }
  "bn-4078":
    native: "He will come tomorrow, for sure."
    notes:
      "n1": "কালই (kāloi), for sure tomorrow, adds the emphasis -ই (-i) to কাল (kāl), tomorrow."
    confusables: { "c1": { why: "today: a different day" }, "c2": { why: "yesterday: the other direction" } }
  "bn-4079":
    native: "That very book is mine."
    notes:
      "n1": "সেই (sei), that very, is a demonstrative: সেই বই (sei boi), that very book."
    confusables: { "c1": { why: "this: near, not that one" }, "c2": { why: "that: a different distance" } }
  "bn-4080":
    native: "Money is not everything."
    notes:
      "n1": "টাকাই (ṭākāi), money itself, adds the emphasis -ই (-i) to টাকা (ṭākā), money."
    confusables: { "c1": { why: "wealth: a related idea, not money itself" }, "c2": { why: "a price: a different word" } }
  "bn-4081":
    native: "The house itself is my shelter."
    notes:
      "n1": "বাড়িই (bāṛii), the house itself, adds the emphasis -ই (-i) to বাড়ি (bāṛi), house."
    confusables: { "c1": { why: "a building: a larger structure" }, "c2": { why: "a village: a different place" } }
  "bn-4082":
    native: "Finish it today, without fail. (familiar)"
    bases: { "শেষ": "finish" }
    notes:
      "n1": "আজই (ājoi), today without fail, adds the emphasis -ই (-i) to আজ (āj), today."
    confusables: { "c1": { why: "tomorrow: the opposite day" }, "c2": { why: "later: not today" } }
  "bn-4083":
    native: "We ourselves came first."
    notes:
      "n1": "আমরাই (āmorāi), we ourselves, adds the emphasis -ই (-i) to the word for we."
    confusables: { "c1": { why: "last: the opposite of first" }, "c2": { why: "they: other people" } }
  "bn-4084":
    native: "I am calling you, and you alone."
    notes:
      "n1": "তোমাকেই (tomākei) puts the object ending -কে (-ke) before the emphasis -ই (-i): 'you alone'."
    confusables: { "c1": { why: "everyone: all people, not one" }, "c2": { why: "someone: not a particular person" } }
