schema: 1
id: "bn-en-grammar-while-sentences"
kind: "layer"
core: "bn-grammar-while-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "While and during: sentences"
description: "Short sentences saying what happens at the same time. They unlock once their words are known. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-3525":
    native: "Talk while you eat. (familiar)"
    bases: { "গল্প": "story" }
    notes:
      "n1": "খেতে খেতে (khete khete) repeats খেতে (khete), eating, to mean 'while eating'."
    confusables: { "c1": { why: "to sleep: a different thing at the same time" }, "c2": { why: "to read: a different thing at the same time" } }
  "bn-3526":
    native: "I listen to songs during the cooking."
    bases: { "রান্নার": "of cooking", "গান": "song", "শুনি": "listen" }
    notes:
      "n1": "রান্নার (rānnār) is the genitive of রান্না (rānnā), cooking, and সময় (sômoy), time, follows it: 'during the cooking'."
    confusables: { "c1": { why: "of eating: a different time" }, "c2": { why: "of sleep: a different time" } }
  "bn-3527":
    native: "I am talking while walking."
    notes:
      "n1": "হাঁটতে হাঁটতে (hām̐ṭote hām̐ṭote) repeats হাঁটতে (hām̐ṭote), walking, to mean 'while walking'."
    confusables: { "c1": { why: "to run: a different movement" }, "c2": { why: "sitting: a different position" } }
  "bn-3528":
    native: "See it as you go. (familiar)"
    notes:
      "n1": "যাওয়ার (jāoyār) is the genitive of যাওয়া (jāoyā), going, so যাওয়ার সময় (jāoyār sômoy) means 'when going'."
    confusables: { "c1": { why: "of coming: the opposite direction" }, "c2": { why: "of staying: a different time" } }
  "bn-3529":
    native: "I fell asleep while watching pictures."
    bases: { "ঘুমিয়ে": "asleep", "পড়লাম": "fell" }
    notes:
      "n1": "ঘুমিয়ে পড়া (ghumiye pôṛā) is an aspectual compound: the -iye form of ঘুমানো (ghumāno), to sleep, with পড়া (pôṛā), to fall, means 'fall asleep'."
    confusables: { "c1": { why: "awake: the opposite" }, "c2": { why: "getting up: a different action" } }
  "bn-3530":
    native: "It feels hot while working."
    notes:
      "n1": "করার (kôrār) is the genitive of করা (kôrā), doing, so কাজ করার সময় (kāj kôrār sômoy) means 'while working'."
    confusables: { "c1": { why: "cold: the opposite" }, "c2": { why: "rest: a different time" } }
