native: { code: "en", iso639_3: "eng", name: "English" }
name: "Weather: sentences"
description: "Short sentences about the weather and the seasons. They unlock once their words and rules are known. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-1614":
    native: "There are clouds in the sky today."
    bases:
      "আছে": "to be; there is"
  "bn-1616":
    native: "I take an umbrella with me."
    notes:
      "n1": "নিয়ে (niye) is the conjunctive form of নেওয়া (neoyā), to take, and যাই (jāi) is যাওয়া (jāoyā), to go; together they mean 'take along'."
    bases:
      "নিয়ে": "to take"
      "যাই": "to go"
  "bn-1617":
    native: "It often rains in the monsoon."
    notes:
      "n1": "বৃষ্টি (briśṭi) হয় (hôy), literally 'rain happens', is how Bengali says it rains."
    bases:
      "হয়": "to happen; to become"
  "bn-1618":
    native: "In winter there is fog in the mornings."
    bases:
      "সকালে": "in the morning"
      "থাকে": "to stay; to be"
  "bn-1619":
    native: "Please take an umbrella."
    notes:
      "n1": "নিন (nin) is the polite request of নেওয়া (neoyā), to take, said to আপনি (āpni)."
    bases:
      "নিন": "to take"
  "bn-1620":
    native: "There is no electricity today."
    bases:
      "নেই": "there is not; no"
  "bn-1621":
    native: "A rainbow comes out after the rain."
    bases:
      "ওঠে": "to rise; to come out"
