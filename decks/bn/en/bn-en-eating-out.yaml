id: "bn-en-eating-out"
kind: "layer"
core: "bn-eating-out"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Eating out"
description: "Ordering, asking for less spice, and paying the bill."
license: "CC-BY-SA-4.0"
tags: ["beginner"]
cards:
  "bn-0349":
    native: "food"
  "bn-0350":
    native: "water"
    notes:
      "n1": "Also পানি (pāni)."
  "bn-0351":
    native: "tea"
  "bn-0352":
    native: "cooked rice; a meal"
    notes:
      "n1": "ভাত খেয়েছো (bhāt kheyecho)? 'Have you eaten rice?' is how people ask whether you have eaten."
  "bn-0353":
    native: "flatbread; roti"
  "bn-0354":
    native: "Please give me …"
    notes:
      "n1": "The thing wanted goes in the gap: আমাকে এক কাপ চা দিন (āmāke ek kāp cā din), a cup of tea, please."
  "bn-0355":
    native: "more"
    notes:
      "n1": "আরও একটু (āro ekṭu), a little more. Also written আরো (āro). আর (ār) alone can mean 'more' too: আর একটা (ār ekoṭā), one more."
  "bn-0356":
    native: "spicy (hot)"
    notes:
      "n1": "কম ঝাল (kôm jhāl), less spicy."
  "bn-0357":
    native: "sweet; a sweet"
    notes:
      "n1": "Bengal's sweets are famous: রসগোল্লা (rôśogollā), সন্দেশ (śôndeś), মিষ্টি দই (miśṭi doi)."
  "bn-0358":
    native: "vegetarian"
    notes:
      "n1": "Non-vegetarian is আমিষ (āmiś), and fish counts as আমিষ (āmiś)."
  "bn-0359":
    native: "The bill, please."
    bases:
      "বিলটা": "bill"
  "bn-0360":
    native: "It was very good."
  "bn-0749":
    native: "Will you have some tea?"
    notes:
      "n1": "Drinks are eaten in Bengali: চা (cā), জল (jôl), শরবত (śôrbot), all খাওয়া (khāoyā). জল খাবেন (jôl khāben)? Will you have some water?"
