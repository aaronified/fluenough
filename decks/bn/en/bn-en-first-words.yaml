schema: 1
id: "bn-en-first-words"
kind: "layer"
core: "bn-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
description: "Greetings, the respect Bengali builds into them, and how to say you are still learning."
license: "CC-BY-SA-4.0"
tags: ["beginner"]
cards:
  "bn-0136":
    native: "hello; goodbye"
    notes:
      "n1": "Said with palms pressed together, in many Hindu families; many Muslim families say আসসালামু আলাইকুম (āssālāmu ālāikum). Neither is universal. In many Hindu families, younger people greet elders by touching their feet: প্রণাম (prônām)."
  "bn-0137":
    native: "a respectful greeting to an elder"
    notes:
      "n1": "Bowing to an elder or touching their feet. A visitor is not expected to."
  "bn-0138":
    native: "you (respectful)"
    notes:
      "n1": "Bengali has three words for 'you': আপনি (āpni) for strangers, elders and customers; তুমি (tumi) for friends and family; তুই (tui) only for the very close, and rude to anyone else. The verb changes with each. A learner is always safe with আপনি (āpni)."
  "bn-0139":
    native: "How are you? (respectful)"
    notes:
      "n1": "To a friend: কেমন আছো? (kemon achho?). Bengali has no grammatical gender, so it is the same to a man or a woman."
    bases:
      "আছেন": "to be; there is"
  "bn-0140":
    native: "I'm fine."
    notes:
      "n1": "ভালো (bhālo) is 'good, well', one of the most useful words there is."
    bases:
      "আছি": "to be; there is"
  "bn-0141":
    native: "thank you"
    notes:
      "n1": "Among family and friends thanks are often left unsaid. Many people say 'thank you' in English."
  "bn-0142":
    native: "OK; I see"
    notes:
      "n1": "The all-purpose 'OK' or 'right'. Also the start of a goodbye: আচ্ছা (ācchā), আসি (āśi)।"
  "bn-0143":
    native: "bye, I'm off (said by the one leaving)"
    notes:
      "n1": "Literally 'I'll come'. On leaving, Bengali speakers say আসি (āśi) rather than যাই (jāi), 'I'm going', which sounds final. Also চলি (coli)."
  "bn-0144":
    native: "I don't know Bengali."
    notes:
      "n1": "না (nā), 'not', comes after the verb."
    bases:
      "বাংলা": "Bengali (the language); Bengal"
  "bn-0145":
    native: "I'm still learning Bengali."
    notes:
      "n1": "The same for a man and a woman: Bengali verbs do not show gender."
    bases:
      "এখনও": "still; yet"
      "বাংলা": "Bengali (the language); Bengal"
  "bn-0146":
    native: "Please speak slowly."
    notes:
      "n1": "বলুন (bolun) is the polite request form of বলা (bôlā, to say). Most verbs take -উন (-un) for a polite request: বসুন (bośun), please sit. Verbs whose stem ends in a vowel take -ন (-nô): যান (jān), please go; খান (khān), please eat; দিন (din), please give. একটু (ekṭu), 'a little', softens a request."
    bases:
      "ধীরে": "slow"
  "bn-0147":
    native: "Please say that again."
    bases:
      "আবার": "again"
  "bn-0148":
    native: "See you again."
    notes:
      "n1": "Literally 'there will be a meeting again'."
    bases:
      "আবার": "again"
  "bn-0395":
    native: "hello (literally 'peace be upon you')"
    notes:
      "n1": "The greeting in many Muslim families; many Hindu families say নমস্কার (nômośkār). Neither is universal. The reply is ওয়ালাইকুম আসসালাম (wālāikum āssālām)."
    bases:
      "আসসালামু": "peace (Arabic, in the greeting)"
      "আলাইকুম": "upon you (Arabic, in the greeting)"
  "bn-0396":
    native: "and peace be upon you (the reply)"
    bases:
      "ওয়ালাইকুম": "and upon you (Arabic, in the reply)"
      "আসসালাম": "peace (Arabic, in the reply)"
  "bn-0397":
    native: "goodbye"
    notes:
      "n1": "Said in many Muslim families. Also আল্লাহ হাফেজ (āllāh hāphej)."
    bases:
      "খোদা": "God (from Persian)"
      "হাফেজ": "protector, keeper (from Arabic)"
  "bn-0398":
    native: "What's new?"
    notes:
      "n1": "To someone you know: 'what news?'"
    bases:
      "খবর": "news"
  "bn-0399":
    native: "so-so; not bad"
  "bn-0400":
    native: "Nice to meet you."
    notes:
      "n1": "'Talking with you felt good.'"
    bases:
      "আলাপ": "a talk; getting to know someone"
      "লাগল": "to feel; to be needed; to take (of time)"
  "bn-0401":
    native: "Take care. (respectful)"
    notes:
      "n1": "To a friend: ভালো থেকো (bhālo theko)."
  "bn-0402":
    native: "Do come again."
    notes:
      "n1": "A host's goodbye. To a friend: আবার এসো (ābār eśo)."
    bases:
      "আবার": "again"
  "bn-0403":
    native: "Sorry; excuse me."
    notes:
      "n1": "For a small mistake, or to get past someone. Also মাফ করবেন (māph kôrben). A formal apology is আমি দুঃখিত (āmi dukkhito)."
    bases:
      "মাপ": "pardon (also: a measure)"
  "bn-0404":
    native: "I understand."
    notes:
      "n1": "Literally 'I have understood'. Not understanding is বুঝিনি (bujhini)."
  "bn-0405":
    native: "Please say it in Bengali."
    notes:
      "n1": "বাংলা (bāṅlā) + -য় (-yô), 'in Bengali'."
    bases:
      "বাংলায়": "Bengali (the language); Bengal"
