schema: 1
id: "bn-en-script-reading-2"
kind: "layer"
core: "bn-script-reading-2"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More words to read"
description: "Thirty everyday words that are already cards of the course, read from the letters and conjuncts taught in the script decks: nothing new is learned here, only read. Each note gives how the cluster is said. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "bn-1037":
    notes:
      "n1": "স্কুল (skul): স্ক (skô) is said sk, joined by a hasanta; the ু (u) sign gives the u, and the final ল (lô) is said l."
  "bn-0264":
    notes:
      "n1": "লঙ্কা (lôṅkā): ঙ্ক (ṅkô) is said ṅk, with the nasal ṅ before the k; the া (ā) sign gives the long ā at the end."
  "bn-1046":
    notes:
      "n1": "মন্দির (mondir): ন্দ (ndô) is said nd, joined by a hasanta; the ি (i) sign gives the i."
  "bn-1053":
    notes:
      "n1": "গ্রাম (grām): গ্র (grô) is said gr, joined by a hasanta; the া (ā) sign gives the long ā."
  "bn-1077":
    notes:
      "n1": "উত্তর (uttor): ত্ত (ttô) is said tt, a doubled t; the final র (rô) is said r, with its vowel dropped at the end."
  "bn-1078":
    notes:
      "n1": "দক্ষিণ (dokkhin): ক্ষ (kkhô) is said kkh, joined by a hasanta; the final ণ (nô) is said n."
  "bn-1080":
    notes:
      "n1": "পশ্চিম (pościm): শ্চ (ścô) is said śc, joined by a hasanta; the ি (i) sign gives the i."
  "bn-0376":
    notes:
      "n1": "ডাক্তার (ḍāktār): ক্ত (ktô) is said kt, joined by a hasanta; the া (ā) sign gives the long ā before the final র (rô)."
  "bn-0379":
    notes:
      "n1": "ব্যথা (bêthā): ব্য (bê) is read bê, not bya; the া (ā) sign at the end gives the long ā."
  "bn-0727":
    notes:
      "n1": "জ্বর (jôr): জ্ব (jô) is said j, with no b sound, and the final র (rô) is said r."
  "bn-2214":
    notes:
      "n1": "গল্প (golpô): ল্প (lpô) is said lp, joined by a hasanta; the word ends on প (pô) with its vowel dropped."
  "bn-2224":
    notes:
      "n1": "ভ্রমণ (bhrômôn): ভ্র (bhrô) is said bhr, joined by a hasanta; the word ends on ণ (nô) with its vowel dropped."
  "bn-2235":
    notes:
      "n1": "পুরস্কার (purôskār): স্ক (skô) is said sk, joined by a hasanta; the া (ā) sign gives the long ā at the end."
  "bn-2246":
    notes:
      "n1": "শিল্পী (śilpī): ল্প (lpô) is said lp, joined by a hasanta; the ী (i) sign gives the long i."
  "bn-0595":
    notes:
      "n1": "রান্নাঘর (rānnāghor): ন্ন (nnô) is said nn, a doubled n, and the ঘ (ghô) is said gh."
  "bn-4318":
    notes:
      "n1": "সঞ্চয় (sôncoy): ঞ্চ (ncô) is said nc, with the nasal n before the c."
  "bn-2700":
    notes:
      "n1": "চট্টগ্রাম (côṭṭogrām): ট্ট (ṭṭô) is said ṭṭ, a doubled ṭ, and গ্র (grô) is said gr; the া (ā) sign gives the long ā at the end."
  "bn-2699":
    notes:
      "n1": "সুন্দরবন (sundorobon): ন্দ (ndô) is said nd, joined by a hasanta; the ু (u) sign gives the u."
  "bn-2443":
    notes:
      "n1": "যাত্রা (jātrā): ত্র (trô) is said tr, joined by a hasanta; the া (ā) signs give the long ā."
  "bn-4093":
    notes:
      "n1": "শাস্তি (śāsti): স্ত (stô) is said st, joined by a hasanta; the ি (i) sign gives the i."
  "bn-1649":
    notes:
      "n1": "প্রসাদ (prôsād): প্র (prô) is said pr, joined by a hasanta; the া (ā) sign gives the long ā."
  "bn-2121":
    notes:
      "n1": "স্বাদ (śād): স্ব (śô) is said ś, with the ব not said; the া (ā) sign gives the long ā."
  "bn-2682":
    notes:
      "n1": "দ্বীপ (dip): দ্ব (dô) is said d, with the ব not said."
  "bn-3402":
    notes:
      "n1": "শক্তি (śokti): ক্ত (ktô) is said kt, joined by a hasanta; the ি (i) sign gives the i."
  "bn-2775":
    notes:
      "n1": "মস্তিষ্ক (mostiśko): স্ত (stô) is said st and ষ্ক (śkô) is said śk, both joined by a hasanta; the final ক (kô) is said ko."
  "bn-2209":
    notes:
      "n1": "ক্রিকেট (krikeṭ): ক্র (krô) is said kr, joined by a hasanta; the ি (i) sign gives the i, and the final ট (ṭô) is said ṭ."
  "bn-2885":
    notes:
      "n1": "সংবাদপত্র (sôṅbādopotro): ত্র (trô) is said tr, joined by a hasanta; the ং (ṅ) mark before ব is a nasal ṅ."
  "bn-1022":
    notes:
      "n1": "রক্ত (rôkto): ক্ত (ktô) is said kt, joined by a hasanta; the final ত (tô) is said t."
  "bn-2818":
    notes:
      "n1": "বিরক্ত (birokto): ক্ত (ktô) is said kt, joined by a hasanta; the ি (i) sign gives the i."
  "bn-0968":
    notes:
      "n1": "সন্দেশ (śôndeś): ন্দ (ndô) is said nd, joined by a hasanta; the final শ (śô) is said ś."
