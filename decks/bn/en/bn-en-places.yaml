schema: 1
id: "bn-en-places"
kind: "layer"
core: "bn-places"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Places"
description: "Schools and markets, the places of worship, rivers and villages, the big buildings of a town, and the words of a district and a state. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-1037":
    native: "school"
    wiktionary: true
    notes:
      "n1": "A word from English."
    "examples": {
      "স্কুলে সময়মতো যাও।": {"native": "Go to school on time.", "bases": {"স্কুলে": "school"}}
    }
  "bn-1038":
    native: "college"
    wiktionary: true
    notes:
      "n1": "A word from English."
  "bn-1039":
    native: "university"
    wiktionary: true
    notes:
      "n1": "Literally 'world school'. In speech it is often shortened to {1}."
  "bn-1040":
    native: "market; bazaar"
    wiktionary: true
    notes:
      "n1": "A word from Persian. It is also the shopping itself: {1}, to do the shopping."
    "examples": {
      "আমি বাজারে যাই।": {"native": "I go to the market.", "bases": {"বাজারে": "market; bazaar"}},
      "বাজারে অগ্নিকাণ্ড ঘটেছে।": {"native": "A fire has happened in the market.", "bases": {"ঘটেছে": "has happened", "বাজারে": "market; bazaar"}}
    }
  "bn-1041":
    native: "bank"
    wiktionary: true
    notes:
      "n1": "Also spelled {1}. The same letters, with a different vowel, are the word for a frog."
    "examples": {
      "চেকটা ব্যাংকে জমা দাও।": {"native": "Deposit the cheque at the bank. (familiar)", "bases": {"চেকটা": "cheque", "ব্যাংকে": "bank"}}
    }
  "bn-1042":
    native: "post office"
    notes:
      "n1": "From {1}, 'the post' (also 'a call'), and {2}, 'house'."
    "examples": {
      "ডাকঘর কোথায়?": {"native": "Where is the post office?", "bases": {}}
    }
  "bn-1043":
    native: "police station"
    wiktionary: true
    notes:
      "n1": "It is the police station and also the area it covers."
      "pair": "Not {1}, to stop: only the middle consonant differs."
    "examples": {
      "থানা কোন দিকে?": {"native": "Which way is the police station?", "bases": {}}
    }
  "bn-1044":
    native: "park"
    notes:
      "n1": "A word from English."
    "examples": {
      "আমরা পার্কে হাঁটি।": {"native": "We walk in the park.", "bases": {"পার্কে": "park"}},
      "প্রবীণরা পার্কে বসেছিলেন।": {"native": "The elderly people were sitting in the park.", "bases": {"প্রবীণরা": "elder", "পার্কে": "park"}}
    }
  "bn-1045":
    native: "field; open ground"
    wiktionary: true
    notes:
      "n1": "{1} is a playing field; a green {2} is a rice field."
    "examples": {
      "খেলোয়াড়রা মাঠে নামছে।": {"native": "The players are going onto the field.", "bases": {"খেলোয়াড়রা": "player (in a sport)", "নামছে": "to go down; to enter", "মাঠে": "field; open ground"}}
    }
  "bn-1046":
    native: "temple"
    wiktionary: true
    notes:
      "n1": "The terracotta temples of Bishnupur in West Bengal, built in the 17th and 18th centuries, are known for the clay pictures on their walls."
    "examples": {
      "প্রাচীন মন্দির দেখলাম।": {"native": "I saw an ancient temple.", "bases": {"মন্দির": "temple"}},
      "মন্দিরে প্রসাদ বিতরণ হচ্ছে।": {"native": "Blessed food is being given out at the temple.", "bases": {"মন্দিরে": "temple"}}
    }
  "bn-1047":
    native: "mosque"
    wiktionary: true
    notes:
      "n1": "A word from Persian, from Arabic. The call to prayer, {1}, is made from it."
  "bn-1048":
    native: "church"
    wiktionary: true
    notes:
      "n1": "A word from Portuguese, through the churches of the Portuguese traders in Bengal."
    "examples": {
      "বড়দিনে গির্জায় গান হয়।": {"native": "At Christmas there are songs in the church.", "bases": {"গির্জায়": "church"}},
      "বড়দিনে গির্জায় যাওয়া হয়।": {"native": "People go to church at Christmas.", "bases": {"গির্জায়": "church"}}
    }
  "bn-1049":
    native: "garden; orchard"
    wiktionary: true
    notes:
      "n1": "It is a flower garden and also a fruit orchard or a tea garden: {1}."
    "examples": {
      "বাগানে গোলাপ ফুটেছে।": {"native": "Roses have bloomed in the garden.", "bases": {"ফুটেছে": "bloomed", "বাগানে": "garden; orchard"}},
      "বাগানে সুন্দর ফুল ফুটেছে।": {"native": "Beautiful flowers have bloomed in the garden.", "bases": {"বাগানে": "garden; orchard"}}
    }
  "bn-1050":
    native: "river"
    wiktionary: true
    notes:
      "n1": "Bengal is a delta of great rivers, and {1} is in the names of many places. A small river or stream is a {2}, canal."
    "examples": {
      "উদ্ধারকারীরা নদীতে নামলেন।": {"native": "The rescuers went into the river.", "bases": {"উদ্ধারকারীরা": "rescuer", "নদীতে": "river"}},
      "গঙ্গা ভারতের নদী।": {"native": "The Ganges is an Indian river.", "bases": {}}
    }
  "bn-1051":
    native: "pond"
    wiktionary: true
    notes:
      "n1": "A village pond, used for washing, bathing and keeping fish."
    "examples": {
      "পুকুরে মাছ আছে।": {"native": "There are fish in the pond.", "bases": {"আছে": "to be; there is", "পুকুরে": "pond"}},
      "গ্রামে একটা পুকুর আছে।": {"native": "There is a pond in the village.", "bases": {"আছে": "to be; there is"}}
    }
  "bn-1052":
    native: "bridge"
    wiktionary: true
    notes:
      "n1": "The formal word. In speech people say {1}, from English, and the drill accepts it."
    "examples": {
      "প্রকৌশলী সেতু বানাচ্ছেন।": {"native": "The engineer is building a bridge.", "bases": {"বানাচ্ছেন": "building", "সেতু": "bridge"}},
      "সেতু দিয়ে নদী পার হও।": {"native": "Cross the river by the bridge. (familiar)", "bases": {"সেতু": "bridge"}}
    }
  "bn-1053":
    native: "village"
    wiktionary: true
    notes:
      "n1": "The opposite of {1}, city. In speech a village is also {2}."
    "examples": {
      "গ্রামে শান্তি আছে।": {"native": "There is peace in the village.", "bases": {"আছে": "there is", "গ্রামে": "village"}}
    }
  "bn-1054":
    native: "open-air market (on fixed days)"
    wiktionary: true
    notes:
      "pair": "Not {1}, hand: the {2} of {3} is said with the tongue curled back."
      "n2": "A market that is held on fixed days of the week, in a village or a small town."
    "examples": {
      "গ্রামীণ এলাকায় হাট বসে।": {"native": "A market is held in rural areas.", "bases": {"এলাকায়": "in the area", "হাট": "market"}}
    }
  "bn-1055":
    native: "ghat; steps down to the water"
    notes:
      "pair": "Only the last sound differs: {1} is the ghat and {2} the back of the neck."
      "n2": "The steps at the edge of a river or pond where people bathe, wash and catch a boat or ferry."
  "bn-1056":
    native: "lane; alley"
    wiktionary: true
    notes:
      "n1": "A narrow lane, as in the old quarters of Kolkata. A road is a {1}."
    "examples": {
      "গলিটা সরু।": {"native": "The lane is narrow.", "bases": {"গলিটা": "lane; alley"}}
    }
  "bn-1057":
    native: "hotel; a simple eating place"
    wiktionary: true
    notes:
      "n1": "It is also a plain restaurant: a {1} serves rice and curry at midday."
    "examples": {
      "এই হোটেলটা নিরাপদ।": {"native": "This hotel is safe.", "bases": {"এই": "this", "হোটেলটা": "hotel; a simple eating place"}},
      "হোটেলের ঠিকানা কী?": {"native": "What is the hotel's address?", "bases": {"কী": "what", "হোটেলের": "hotel; a simple eating place"}}
    }
  "bn-1058":
    native: "restaurant"
    wiktionary: true
    notes:
      "n1": "From French, by way of English. It is often said {1}."
    "examples": {
      "আমরা খেতে রেস্তোরাঁয় যাব।": {"native": "We will go to a restaurant to eat.", "bases": {"রেস্তোরাঁয়": "restaurant"}}
    }
  "bn-1059":
    native: "library"
    wiktionary: true
    notes:
      "n1": "A word from English; the formal word is {1}. It can also be a bookshop."
    "examples": {
      "তিনি পড়ার জন্য লাইব্রেরিতে যান।": {"native": "He goes to the library to study.", "bases": {"তিনি": "he (formal)", "পড়ার": "of reading", "জন্য": "for", "লাইব্রেরিতে": "to the library"}}
    }
  "bn-1060":
    native: "cinema; a film"
    notes:
      "n1": "It is both the film and the hall where it is shown: {1}, to see a film."
    "examples": {
      "আজ রাতে সিনেমা দেখব।": {"native": "I will watch a film tonight.", "bases": {"সিনেমা": "cinema; a film"}},
      "সচরাচর সন্ধ্যায় সিনেমা দেখি।": {"native": "I usually watch films in the evening.", "bases": {"সচরাচর": "usually", "সিনেমা": "cinema; a film"}}
    }
  "bn-1061":
    native: "factory; workshop"
    wiktionary: true
    notes:
      "n1": "A word from Persian."
    "examples": {
      "কারখানার ধোঁয়া বেশি।": {"native": "The factory smoke is heavy.", "bases": {"কারখানার": "factory; workshop"}}
    }
  "bn-1062":
    native: "airport"
    wiktionary: true
    notes:
      "n1": "From {1}, aeroplane, and {2}, port."
  "bn-1063":
    native: "bus stand"
    notes:
      "n1": "Also written as two words, {1}."
  "bn-1064":
    native: "pharmacy"
    notes:
      "n1": "A word from English. The shop is also an {1}, a medicine shop."
    "examples": {
      "ফার্মেসিতে প্রেসক্রিপশন দেখান।": {"native": "Show the prescription at the pharmacy.", "bases": {"ফার্মেসিতে": "pharmacy"}}
    }
  "bn-1065":
    native: "court of law"
    wiktionary: true
    notes:
      "n1": "A word from Persian, from Arabic."
    "examples": {
      "আইনজীবী আদালতে গেলেন।": {"native": "The lawyer went to court.", "bases": {"আদালতে": "court of law"}},
      "আদালতের রায় বেরোল।": {"native": "The court's verdict came out.", "bases": {"আদালতের": "court of law"}}
    }
  "bn-1066":
    native: "sea"
    wiktionary: true
    notes:
      "n1": "The Bay of Bengal is the {1}."
    "examples": {
      "সমুদ্র দক্ষিণে।": {"native": "The sea is to the south.", "bases": {"সমুদ্র": "sea"}},
      "জাহাজটা সমুদ্রে যাচ্ছে।": {"native": "The ship is going to the sea.", "bases": {"জাহাজটা": "ship; large boat", "সমুদ্রে": "sea"}}
    }
  "bn-1067":
    native: "hill; mountain"
    wiktionary: true
    notes:
      "n1": "The word covers a hill and a mountain. People of the plains of Bengal go to the {1} for a holiday."
    "examples": {
      "অতিথিশালাটা পাহাড়ে।": {"native": "The guesthouse is in the hills.", "bases": {"অতিথিশালাটা": "guesthouse", "পাহাড়ে": "hill; mountain"}},
      "পাহাড় উত্তরে।": {"native": "The hills are to the north.", "bases": {"পাহাড়": "hill; mountain"}}
    }
  "bn-1068":
    native: "capital city"
    wiktionary: true
    notes:
      "n1": "{1} is the capital of West Bengal and {2} the capital of Bangladesh."
    "examples": {
      "ঢাকা বাংলাদেশের রাজধানী।": {"native": "Dhaka is the capital of Bangladesh.", "bases": {"রাজধানী": "capital city"}},
      "এই রাজ্যের রাজধানী কলকাতা।": {"native": "The capital of this state is Kolkata.", "bases": {"এই": "this", "রাজ্যের": "state", "রাজধানী": "capital city"}}
    }
  "bn-1069":
    native: "district"
    wiktionary: true
    notes:
      "n1": "A word from Persian. A state or a division is made of districts."
  "bn-1070":
    native: "state; kingdom"
    wiktionary: true
    notes:
      "n1": "A state of India, such as {1}, West Bengal. In old books it is a kingdom."
    "examples": {
      "ভারতে অনেক রাজ্য আছে।": {"native": "India has many states.", "bases": {"আছে": "there is"}},
      "এই রাজ্যের রাজধানী কলকাতা।": {"native": "The capital of this state is Kolkata.", "bases": {"এই": "this", "রাজ্যের": "state"}}
    }
