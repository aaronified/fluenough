schema: 1
id: "bn-en-script-digits"
kind: "layer"
core: "bn-script-digits"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Bengali digits"
description: "The ten digits of Bengali script, each with the number word it names. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "bn-1352":
    native: "0 (zero)"
    notes:
      "n1": "A plain oval with no stroke, the same idea as the Western 0. It is a digit, not a letter. Its word শূন্য (śunno, zero) comes from Sanskrit."
  "bn-1353":
    native: "1 (one)"
    notes:
      "n1": "A short upright stroke. Its word এক (ek, one) is the same in Bengali and Assamese."
  "bn-1354":
    native: "2 (two)"
    notes:
      "n1": "Its word দুই (dui, two) is said 'dooi', with the 'oo' of 'food' running into 'ee'."
  "bn-1355":
    native: "3 (three)"
    notes:
      "n1": "Its word তিন (tin, three) rhymes with English 'tin'."
  "bn-1356":
    native: "4 (four)"
    notes:
      "n1": "Looks like an 8, but is 4. Its word চার (cār, four) is said 'char'. Do not read ৪ (4) as ৮ (8)."
  "bn-1357":
    native: "5 (five)"
    notes:
      "n1": "Its word পাঁচ (pām̐c, five) has a nasal vowel: the sound comes partly through the nose."
  "bn-1358":
    native: "6 (six)"
    notes:
      "n1": "Its word ছয় (chôy, six) starts with an aspirated 'ch', a 'ch' with a puff of air after it."
  "bn-1359":
    native: "7 (seven)"
    notes:
      "n1": "Its word সাত (śāt, seven) starts with 'sh', as in English 'shut'."
  "bn-1360":
    native: "8 (eight)"
    notes:
      "n1": "The true 8. Its word আট (āṭ, eight) is said 'aat'. Do not read ৪ (4) as this digit: ৪ is 4."
  "bn-1361":
    native: "9 (nine)"
    notes:
      "n1": "Its word নয় (nôy, nine) is said 'noy', with the 'oy' of 'boy'."
