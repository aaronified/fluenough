schema: 1
id: "bn-en-relationships-sentences"
kind: "layer"
core: "bn-relationships-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Relationships: sentences"
description: "Short sentences about friends, neighbours, families and the bonds between people. They unlock once their words and rules are known. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-3932":
    native: "The neighbours came to our house."
    notes:
      "n1": "-রা (-rā) is the plural ending for people: পড়শিরা (pôṛośirā), the neighbours."
    confusables: { "c1": { why: "a guest: a visitor, not a neighbour" }, "c2": { why: "an enemy: the opposite of a neighbour's kindness" } }
  "bn-3933":
    native: "Friendship means trust."
    bases: { "মানে": "means" }
    notes:
      "n1": "মানে (māne) here means 'means'. The same spelling is also a form of মানা (mānā), 'to follow', so the two can look alike."
    confusables: { "c1": { why: "enmity: the opposite of friendship" }, "c2": { why: "a relationship: wider than friendship" } }
  "bn-3934":
    native: "My younger brother quarrelled with me."
    notes:
      "n1": "সঙ্গে (sôṅge), with, comes after the person it goes with: আমার সঙ্গে (āmār sôṅge), with me."
    confusables: { "c1": { why: "a sister: a different family member" }, "c2": { why: "an uncle: a different family member" } }
  "bn-3935":
    native: "He is a very close friend of mine."
    notes:
      "n1": "তিনি (tini) is the respectful word for 'he' or 'she'; the everyday word is সে (se)."
    confusables: { "c1": { why: "distant: the opposite of close" }, "c2": { why: "acquainted: known, but not a close friend" } }
  "bn-3936":
    native: "We should respect elders."
    notes:
      "n1": "উচিত (ucit), should or ought, comes after the verb: করা উচিত (kôrā ucit), should do."
    confusables: { "c1": { why: "insult: the opposite of respect" }, "c2": { why: "neglect: a different attitude" } }
  "bn-3937":
    native: "He is a trustworthy and kind person."
    bases: { "মানুষ": "person" }
    confusables: { "c1": { why: "cruel: the opposite of kind" }, "c2": { why: "lazy: a different quality" } }
  "bn-3938":
    native: "Tomorrow I will meet him."
    notes:
      "n1": "দেখা করা (dekhā kôrā), to meet, is a verb phrase: দেখা (dekhā), seeing, with করা (kôrā), to do."
    confusables: { "c1": { why: "phone: a call, not a meeting in person" }, "c2": { why: "a letter: writing, not meeting" } }
  "bn-3939":
    native: "We should listen to the elderly."
    notes:
      "n1": "শোনা উচিত (śonā ucit), should listen: the verb stays in its plain form before উচিত (ucit)."
    confusables: { "c1": { why: "a child: a different age group" }, "c2": { why: "a young man: a different age group" } }
  "bn-3940":
    native: "My gratitude is towards you."
    notes:
      "n1": "প্রতি (proti), towards, comes after the noun: তোমার প্রতি (tomār proti), towards you."
    confusables: { "c1": { why: "ungrateful: the opposite of grateful" }, "c2": { why: "happy: a feeling, not a thanks" } }
  "bn-3941":
    native: "She forgave me."
    notes:
      "n1": "ক্ষমা করা (kkhômā kôrā), to forgive, is a verb phrase: ক্ষমা (kkhômā), forgiveness, with করা (kôrā), to do."
    confusables: { "c1": { why: "forgot: she did not forgive, she forgot" }, "c2": { why: "punishment: the opposite of forgiveness" } }
  "bn-3942":
    native: "After the separation there was much sorrow."
    notes:
      "n1": "পর (pôr), after, follows a noun in the genitive: বিচ্ছেদের পর (biccheder pôr), after the separation."
    confusables: { "c1": { why: "reunion: the opposite of separation" }, "c2": { why: "festival: a different occasion" } }
