schema: 1
id: "bn-en-grammar-questions"
kind: "layer"
core: "bn-grammar-questions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Basic questions"
description: "Yes/no questions and question words, with the word order unchanged."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar"]
cards:
  "bn-0171":
    native: "Do you speak Bengali?"
    notes:
      "n1": "কি (ki) after the subject makes a yes/no question."
    bases:
      "বাংলা": "Bengali (the language); Bengal"
  "bn-0172":
    native: "Will you have tea?"
    notes:
      "n1": "The voice rising at the end is enough to make a question."
  "bn-0173":
    native: "What is this?"
    notes:
      "n1": "The question word goes where the answer would: এটা বই (eṭā boi) → এটা কী (eṭā ki)?"
  "bn-0174":
    native: "Where are you going?"
  "bn-0175":
    native: "Who is he?; Who is she?"
    notes:
      "n1": "উনি (uni) is the respectful 'he or she' for someone over there; ইনি (ini) is for someone right here. তিনি (tini), for someone not present, is more common in writing."
  "bn-0176":
    native: "When will you come?"
  "bn-0177":
    native: "Why are you learning Bengali?"
    bases:
      "বাংলা": "Bengali (the language); Bengal"
  "bn-0178":
    native: "How many children do you have?"
    notes:
      "n1": "ছেলেমেয়ে (chelemeye), 'sons and daughters', is 'children'."
  "bn-0179":
    native: "How was it?; Did you like it?"
    bases:
      "লাগল": "to feel; to be needed; to take (of time)"
  "bn-0180":
    native: "It's good, isn't it?"
    notes:
      "n1": "তাই না (tāi nā)? at the end asks for agreement."
