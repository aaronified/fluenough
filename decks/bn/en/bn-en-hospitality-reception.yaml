native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hospitality: hotel reception"
license: "CC-BY-SA-4.0"
description: "Words and phrases for the hotel desk: the booking, the room and key, the luggage, the receipt and the bill."
cards:
  "bn-7140":
    native: "Is there a booking in your name?"
    notes: { n1: "নামে (nāme) is নাম (nām), name, with -এ (-e), in; the guest's booking is held in their name." }
  "bn-7141":
    native: "How many nights will you stay?"
    notes: { n1: "থাকবেন (thākben) is the polite future of থাকা (thākā), to stay, for আপনি (āpni)." }
  "bn-7142":
    native: "Please tell me your name."
    notes: { n1: "দয়া করে (dôyā kôre) means please; বলুন (bôlun) is the polite command from বলা (bôlā), to say, for আপনি (āpni)." }
  "bn-7143":
    native: "Please sign here."
  "bn-7144":
    native: "Here is your key."
    notes: { n1: "নিন (nin) is the polite command from নেওয়া (neoyā), to take; handing something over, the staff say এই নিন (ei nin), here you are." }
  "bn-7145":
    native: "Your room is on the second floor."
    notes: { n1: "দোতলায় (dotlāy) is দোতলা (dotlā), the second storey, with -য় (-y), on; the phrase is attested by its parts: দোতলা (dotlā) is in the Bengali Wiktionary and the locative -য় (-y) follows the course's locative note." }
  "bn-7146":
    native: "I am sending your luggage up to the room."
    notes: { n1: "পাঠিয়ে দিচ্ছি (pāṭhiye dicchi) is I am sending it along, from পাঠানো (pāṭhāno), to send, with দেওয়া (deoyā), to give, as a helping verb." }
  "bn-7147":
    native: "There is a room free for you."
  "bn-7148":
    native: "Please wait a moment."
    notes: { n1: "করুন (kôrun) is the polite command from করা (kôrā), to do, for আপনি (āpni); অপেক্ষা করা (ôpekkhā kôrā) is to wait." }
  "bn-7149":
    native: "Welcome to our hotel."
