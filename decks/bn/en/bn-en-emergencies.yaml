schema: 1
id: "bn-en-emergencies"
kind: "layer"
core: "bn-emergencies"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Emergencies"
description: "Accidents, fires, floods and storms: the words for help, warnings, shelters and the people who rescue. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-4023":
    native: "fire brigade"
    notes:
      "n1": "{1}: The fire brigade: the team and the engines that put out fires."
    examples:
      "দমকল এসেছে।": "The fire brigade has come."
      "দমকলের গাড়ি খুব জোরে যাচ্ছে।": { native: "The fire engine is going very fast.", bases: { "দমকলের": "fire brigade" } }
  "bn-4024":
    native: "rescue"
    notes:
      "n1": "{1}: A rescue: saving a person from danger."
    examples:
      "উদ্ধার কাজ শুরু হলো।": "The rescue work started."
      "উদ্ধারের জন্য লোক এল।": { native: "People came for the rescue.", bases: { "উদ্ধারের": "rescue", "লোক": "people" } }
  "bn-4025":
    native: "explosion"
    notes:
      "n1": "{1}: An explosion: a sudden loud burst with fire or force."
    examples:
      "বিস্ফোরণের শব্দ শোনা গেল।": "The sound of an explosion was heard."
      "বিস্ফোরণে কেউ আহত হয়নি।": { native: "No one was injured in the explosion.", bases: { "বিস্ফোরণে": "explosion", "কেউ": "no one" } }
  "bn-4026":
    native: "caution; warning"
    notes:
      "n1": "{1}: Caution or a warning: being careful to avoid danger."
    examples:
      "সতর্কতা নাও।": "Take care. (familiar)"
      "সতর্কতার জন্য দরজা বন্ধ করো।": { native: "Close the door as a precaution. (familiar)", bases: { "সতর্কতার": "caution; warning" } }
  "bn-4027":
    native: "shelter"
    notes:
      "n1": "{1}: Shelter: a safe place to stay in danger."
    examples:
      "আশ্রয় নিতে হবে।": "We must take shelter."
      "আশ্রয়ের জায়গা কোথায়?": { native: "Where is the place of shelter?", bases: { "আশ্রয়ের": "shelter", "জায়গা": "place" } }
  "bn-4028":
    native: "relief"
    notes:
      "n1": "{1}: Relief: food, clothes and help given to people in disaster."
    examples:
      "ত্রাণ এসেছে।": "The relief has come."
      "ত্রাণের খাবার সবাই পেল।": { native: "Everyone got the relief food.", bases: { "ত্রাণের": "relief" } }
  "bn-4029":
    native: "embankment"
    notes:
      "n1": "{1}: An embankment: a wall built to stop water from flooding."
    examples:
      "বাঁধটা ভেঙে গেছে।": { native: "The embankment has broken.", bases: { "বাঁধটা": "embankment" } }
      "নদীর বাঁধ মেরামত হচ্ছে।": { native: "The river's embankment is being repaired.", bases: { "বাঁধ": "embankment" } }
  "bn-4030":
    native: "lightning"
    notes:
      "n1": "{1}: Lightning: a flash of lightning that strikes the ground."
    examples:
      "বজ্রপাতে একজন আহত হলো।": { native: "One person was hurt by lightning.", bases: { "বজ্রপাতে": "lightning", "একজন": "one" } }
      "বজ্রপাতের সময় ঘরে থাকো।": { native: "Stay at home during lightning. (familiar)", bases: { "বজ্রপাতের": "lightning" } }
  "bn-4031":
    native: "fire incident"
    notes:
      "n1": "{1}: A fire incident: a large fire that harms people or property."
    examples:
      "বাজারে অগ্নিকাণ্ড ঘটেছে।": { native: "A fire has happened in the market.", bases: { "ঘটেছে": "has happened" } }
      "অগ্নিকাণ্ডের কারণ কী?": { native: "What was the cause of the fire?", bases: { "অগ্নিকাণ্ডের": "fire incident" } }
  "bn-4032":
    native: "siren"
    notes:
      "n1": "{1}: A siren: a loud alarm sound that warns people."
    examples:
      "সাইরেন বাজছে।": "The siren is sounding."
      "সাইরেন শুনে সবাই বাইরে এল।": "Hearing the siren, everyone came out."
  "bn-4033":
    native: "panic"
    notes:
      "n1": "{1}: Panic: a sudden strong fear."
    examples:
      "চারদিকে আতঙ্ক ছড়িয়ে পড়ল।": { native: "Panic spread all around.", bases: { "চারদিকে": "all around", "ছড়িয়ে": "spread" } }
      "আতঙ্ক কমাতে হবে।": "We must reduce the panic."
  "bn-4034":
    native: "disaster"
    notes:
      "n1": "{1}: A disaster: a great misfortune that causes loss."
    examples:
      "বন্যা এক বড় বিপর্যয়।": "The flood was a great disaster."
      "বিপর্যয়ের পর সাহায্য এল।": { native: "After the disaster, help came.", bases: { "বিপর্যয়ের": "disaster" } }
  "bn-4035":
    native: "damage; loss"
    notes:
      "n1": "{1}: Damage or loss: harm done to people or things."
    examples:
      "বড় ক্ষতি হয়েছে।": "There has been great damage."
      "ক্ষতির হিসাব নেওয়া হচ্ছে।": { native: "The damage is being assessed.", bases: { "ক্ষতির": "damage; loss" } }
  "bn-4036":
    native: "danger signal"
    notes:
      "n1": "{1}: A danger signal: a warning sign or alarm of danger."
    examples:
      "বিপদসংকেত দেওয়া হলো।": "A danger signal was given."
      "বিপদসংকেতের লাল আলো জ্বলছে।": { native: "The red light of the danger signal is on.", bases: { "বিপদসংকেতের": "danger signal", "জ্বলছে": "is on" } }
  "bn-4037":
    native: "emergency"
    notes:
      "n1": "{1}: An emergency: a state of urgent need or danger."
    examples:
      "জরুরি অবস্থা ঘোষণা হলো।": "A state of emergency was declared."
      "জরুরি অবস্থায় ফোন করো।": { native: "Call in an emergency. (familiar)", bases: { "অবস্থায়": "in a state" } }
  "bn-4038":
    native: "rescuer"
    notes:
      "n1": "{1}: A rescuer: a person who saves others from danger."
    examples:
      "উদ্ধারকারীরা নদীতে নামলেন।": "The rescuers went into the river."
      "উদ্ধারকারীদের ধন্যবাদ।": { native: "Thanks to the rescuers.", bases: { "উদ্ধারকারীদের": "rescuer" } }
  "bn-4039":
    native: "volunteer"
    notes:
      "n1": "{1}: A volunteer: a person who helps without pay."
    examples:
      "স্বেচ্ছাসেবকরা ত্রাণ বিলোলেন।": { native: "The volunteers distributed relief.", bases: { "বিলোলেন": "distributed" } }
      "স্বেচ্ছাসেবক হিসেবে কাজ করি।": { native: "I work as a volunteer.", bases: { "হিসেবে": "as" } }
  "bn-4040":
    native: "first aid"
    notes:
      "n1": "{1}: First aid: the first help given to a hurt person before a doctor comes."
    examples:
      "প্রাথমিক চিকিৎসার বাক্স কোথায়?": "Where is the first aid box?"
      "প্রাথমিক চিকিৎসা জানা জরুরি।": "Knowing first aid is important."
  "bn-4041":
    native: "storm surge"
    notes:
      "n1": "{1}: A storm surge: a sudden rise of sea water on the land."
    examples:
      "জলোচ্ছ্বাসে গ্রাম ডুবে গেল।": { native: "The village sank in the storm surge.", bases: { "জলোচ্ছ্বাসে": "storm surge", "ডুবে": "sank" } }
      "জলোচ্ছ্বাসের খবর এসেছে।": { native: "News of the storm surge has come.", bases: { "জলোচ্ছ্বাসের": "storm surge" } }
  "bn-4042":
    native: "torch"
    notes:
      "n1": "{1}: A torch: a small electric lamp that can be carried."
    examples:
      "টর্চ নিয়ে যাও।": "Take the torch with you. (familiar)"
      "টর্চের আলো জ্বালাও।": { native: "Switch on the light of the torch. (familiar)", bases: { "টর্চের": "torch" } }
  "bn-4043":
    native: "candle"
    notes:
      "n1": "{1}: A candle: a stick of wax with a wick, for light."
    examples:
      "মোমবাতি জ্বলছে।": { native: "The candles are burning.", bases: { "জ্বলছে": "burning" } }
      "মোমবাতি নিভিয়ে দাও।": "Put out the candle. (familiar)"
  "bn-4044":
    native: "relief camp"
    notes:
      "n1": "{1}: A relief camp: a place where people in disaster are given food and shelter."
    examples:
      "ত্রাণশিবিরে অনেক মানুষ আছে।": { native: "There are many people in the relief camp.", bases: { "ত্রাণশিবিরে": "relief camp", "মানুষ": "people", "আছে": "there are" } }
      "ত্রাণশিবির কোথায়?": { native: "Where is the relief camp?", bases: { "ত্রাণশিবির": "relief camp" } }
  "bn-4045":
    native: "shelter centre"
    notes:
      "n1": "{1}: A shelter centre: a building where people can stay safely in danger."
    examples:
      "আশ্রয়কেন্দ্রে খাবার পাওয়া যায়।": { native: "Food is available at the shelter centre.", bases: { "আশ্রয়কেন্দ্রে": "shelter centre" } }
      "আশ্রয়কেন্দ্রটা স্কুলে।": { native: "The shelter centre is in the school.", bases: { "আশ্রয়কেন্দ্রটা": "shelter centre" } }
  "bn-4046":
    native: "alert"
    notes:
      "n1": "{1}: Alert or careful: watching for danger."
    examples:
      "সতর্ক থাকো।": "Be careful. (familiar)"
      "পুলিশ সতর্ক আছে।": { native: "The police are alert.", bases: { "আছে": "are" } }
  "bn-4047":
    native: "damaged"
    notes:
      "n1": "{1}: Damaged or harmed: hurt by loss or disaster."
    examples:
      "ক্ষতিগ্রস্ত বাড়ি অনেক।": "There are many damaged houses."
      "ক্ষতিগ্রস্তদের সাহায্য করা হবে।": { native: "The damaged people will be helped.", bases: { "ক্ষতিগ্রস্তদের": "damaged" } }
  "bn-4048":
    native: "injured"
    notes:
      "n1": "{1}: Injured: hurt in an accident or a fight."
    examples:
      "আহত লোককে হাসপাতালে নেওয়া হলো।": { native: "The injured person was taken to hospital.", bases: { "লোককে": "person" } }
      "কয়েকজন আহত হয়েছে।": "A few people have been injured."
  "bn-4049":
    native: "dead"
    notes:
      "n1": "{1}: Dead: no longer alive, a formal word."
    examples:
      "মৃত মানুষ নেই।": { native: "No dead people are here.", bases: { "মানুষ": "people", "নেই": "are not" } }
      "মৃতদের পরিবারকে খবর দেওয়া হলো।": { native: "The families of the dead were informed.", bases: { "মৃতদের": "dead" } }
  "bn-4050":
    native: "emergency (adj)"
    notes:
      "n1": "{1}: Emergency: for use in urgent need."
    examples:
      "আপৎকালীন নম্বর কত?": "What is the emergency number? (familiar)"
      "এটা আপৎকালীন দরজা।": "This is an emergency door."
  "bn-4051":
    native: "risky"
    notes:
      "n1": "{1}: Risky: with danger or the chance of harm."
    examples:
      "রাস্তাটা ঝুঁকিপূর্ণ।": "The road is risky."
      "ঝুঁকিপূর্ণ কাজ করবে না।": "Do not do risky work. (familiar)"
  "bn-4052":
    native: "dangerous"
    notes:
      "n1": "{1}: Dangerous: likely to cause harm."
    examples:
      "এই জায়গা বিপজ্জনক।": { native: "This place is dangerous.", bases: { "এই": "this", "জায়গা": "place" } }
      "বিপজ্জনক খেলা খেলো না।": "Do not play dangerous games. (familiar)"
  "bn-4053":
    native: "unconscious"
    notes:
      "n1": "{1}: Unconscious: not awake, not aware."
    examples:
      "সে অজ্ঞান হয়ে গেল।": "He fell unconscious."
      "অজ্ঞান মানুষকে ধরো।": { native: "Hold the unconscious person. (familiar)", bases: { "মানুষকে": "person" } }
  "bn-4054":
    native: "to rescue"
    notes:
      "n1": "{1}: To rescue: to save someone from danger."
    examples:
      "দমকল কর্মীরা শিশুকে উদ্ধার করল।": { native: "The firefighters rescued the child.", bases: { "শিশুকে": "child" } }
      "আমাদের উদ্ধার করা হয়েছে।": "We have been rescued."
  "bn-4055":
    native: "to evacuate"
    notes:
      "n1": "{1}: To evacuate: to move people from danger to a safe place."
    examples:
      "লোকদের সরিয়ে নেওয়া হলো।": { native: "The people were evacuated.", bases: { "লোকদের": "people" } }
      "আমাদের নিরাপদ জায়গায় সরিয়ে নেওয়া হবে।": { native: "We will be moved to a safe place.", bases: { "জায়গায়": "place" } }
  "bn-4056":
    native: "to put out a fire"
    notes:
      "n1": "{1}: To put out a fire: to stop a fire burning."
    examples:
      "দমকল আগুন নেভাল।": "The fire brigade put out the fire."
      "আগুন নেভাতে জল দাও।": "Give water to put out the fire. (familiar)"
  "bn-4057":
    native: "to flee"
    notes:
      "n1": "{1}: To escape or to flee: to run away from danger."
    examples:
      "লোকজন দ্রুত পালাল।": { native: "People quickly fled.", bases: { "লোকজন": "people", "পালাল": "fled" } }
      "বিপদ দেখে সে পালাল।": { native: "Seeing the danger, he ran away.", bases: { "পালাল": "ran away" } }
