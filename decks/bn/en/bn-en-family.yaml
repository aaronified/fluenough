schema: 1
id: "bn-en-family"
kind: "layer"
core: "bn-family"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Family"
description: "Parents, brothers and sisters, grandparents, and the aunts and uncles on each side, with the other words many families use. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-0423":
    native: "father"
    notes:
      "n1": "বাবা (bābā) is said everywhere. Many Muslim families also say আব্বা (ābbā) or আব্বু (ābbu)."
  "bn-0424":
    native: "mother"
    notes:
      "n1": "মা (mā) is said everywhere. Many Muslim families also say আম্মা (āmmā) or আম্মু (āmmu)."
  "bn-0186":
    native: "brother; younger brother"
    notes:
      "n1": "An elder brother is দাদা (dādā), also বড় ভাই (bôṛo bhāi); in many families দাদা (dādā) means grandfather. Cousins are brothers and sisters too: মামাতো ভাই (māmāto bhāi) is your mother's brother's son."
  "bn-0181":
    native: "elder brother"
    notes:
      "n1": "Also বড় ভাই (bôṛo bhāi). In many families দাদা (dādā) means grandfather."
  "bn-0182":
    native: "elder sister"
    notes:
      "n1": "Also আপা (āpā)."
  "bn-0425":
    native: "sister; younger sister"
    notes:
      "n1": "An elder sister is দিদি (didi), also আপা (āpā). Brothers and sisters are named by birth order: বড় (bôṛo) the eldest, মেজো (mejo) the second, ছোট (choṭo) the youngest."
  "bn-0426":
    native: "son; boy"
  "bn-0427":
    native: "daughter; girl"
  "bn-0428":
    native: "husband"
    notes:
      "n1": "স্ব (śô) is said sh: at the start of a word the ব (bô)-sign is silent. Also বর (bôr), in everyday speech."
  "bn-0429":
    native: "wife"
    notes:
      "n1": "In everyday speech বউ (bou), which also means bride. স্ত্র (strô) is s, t and r in one conjunct."
  "bn-0430":
    native: "children (one's sons and daughters)"
    notes:
      "n1": "Sons and daughters in one word."
  "bn-0431":
    native: "grandfather (father's father)"
    notes:
      "n1": "Also দাদু (dādu), said for either grandfather, and দাদা (dādā). Careful: দাদা (dādā) is also an elder brother."
  "bn-0432":
    native: "grandmother (father's mother)"
    notes:
      "n1": "Also written ঠাকুরমা (ṭhākuromā). Also দাদি (dādi)."
  "bn-0433":
    native: "grandfather (mother's father)"
    notes:
      "n1": "More formally দাদামশাই (dādāmośāi). Also নানা (nānā)."
  "bn-0434":
    native: "grandmother (mother's mother)"
    notes:
      "n1": "Also দিদা (didā), and নানি (nāni)."
  "bn-0435":
    native: "uncle (father's younger brother)"
    notes:
      "n1": "Fondly কাকু (kāku). Also চাচা (cācā). His wife is কাকিমা (kākimā), also চাচি (cāci). Your father's elder brother is জেঠু (jeṭhu), also বড় চাচা (bôṛo cācā)."
  "bn-0436":
    native: "aunt (father's sister)"
    notes:
      "n1": "Also পিসিমা (piśimā), and ফুফু (phuphu). Her husband is পিসেমশাই (piśemośāi), also ফুফা (phuphā)."
  "bn-0437":
    native: "uncle (mother's brother)"
    notes:
      "n1": "The same word in every family. His wife is মামি (māmi), also মামিমা (māmimā)."
  "bn-0438":
    native: "aunt (mother's sister)"
    notes:
      "n1": "Also মাসিমা (māśimā), and খালা (khālā). Her husband is মেসো (meśo) or মেসোমশাই (meśomośāi), also খালু (khālu)."
  "bn-0439":
    native: "I have one brother and two sisters."
    notes:
      "n1": "Having is আছে (āche), 'there is', with the owner in the possessive: আমার (āmār), 'of me'."
    bases:
      "আছে": "to be; there is"
  "bn-0440":
    native: "Do you have brothers and sisters?"
    notes:
      "n1": "ভাইবোন (bhāibon) is brothers and sisters together. কি (ki) makes it a yes-or-no question."
    bases:
      "ভাইবোন": "brothers and sisters"
      "আছে": "to be; there is"
  "bn-0441":
    native: "I'm married."
    notes:
      "n1": "Unmarried is অবিবাহিত (ôbibāhito). In everyday speech also আমার বিয়ে হয়েছে (āmār biye hôyeche), 'my wedding has happened'."
    bases:
      "বিবাহিত": "married"
  "bn-0442":
    native: "parents"
  "bn-0443":
    native: "relative"
  "bn-0444":
    native: "uncle (father's elder brother)"
    notes:
      "n1": "Formally জ্যাঠা (jêṭhā). Also বড় চাচা (bôṛo cācā). His wife is জেঠিমা (jeṭhimā), also বড় চাচি (bôṛo cāci)."
  "bn-0445":
    native: "father-in-law"
  "bn-0446":
    native: "mother-in-law"
  "bn-0447":
    native: "grandson"
  "bn-0448":
    native: "granddaughter"
