id: "bn-en-multiword-conjunct-other"
kind: "layer"
core: "bn-multiword-conjunct-other"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word verbs: noun or adjective plus a light verb"
description: "Twenty Bengali verbs made of a noun or adjective and a light verb (to become, to get, to give, to come): to feel like, to seem, to come to mind, to promise, to be stunned, to be ruined, to become famous, to be flustered, to get a chance, to be frantic, to get the right trace. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "bn-6100":
    native: "to smell; to catch a scent"
    notes:
      "u1": "গন্ধ (gôndho), smell, with পাওয়া (pāoā): to smell something or catch its scent. Only পাওয়া changes with person and tense. Attested on en.wiktionary, page গন্ধ পাওয়া."
  "bn-6101":
    native: "to feel like; to wish"
    notes:
      "u1": "ইচ্ছা (icchā), wish, with হওয়া (hoā): to feel like doing something; the person feeling it takes -র, as in আমার ইচ্ছা হয় (āmār icchā hôy), I feel like it. Only হওয়া changes with person and tense. Attested on en.wiktionary, page ইচ্ছা হওয়া."
  "bn-6102":
    native: "to rain"
    notes:
      "u1": "বৃষ্টি (briśṭi), rain, with হওয়া (hoā): to rain; বৃষ্টি পড়া (briśṭi pôṛā) is the synonym. Only হওয়া changes with person and tense. Attested on en.wiktionary, page বৃষ্টি হওয়া."
  "bn-6103":
    native: "to push; to shove"
    notes:
      "u1": "ধাক্কা (dhākkā), push; shove, with দেওয়া (deoā): to push someone or something. Only দেওয়া changes with person and tense. Attested on en.wiktionary, page ধাক্কা দেওয়া."
    bases:
      "ধাক্কা": { meaning: "push; shove" }
  "bn-6104":
    native: "to educate; to teach"
    notes:
      "u1": "শিক্ষা (śikkhā), education, with দেওয়া (deoā): to educate or teach someone. Only দেওয়া changes with person and tense. Attested on en.wiktionary, page শিক্ষা দেওয়া."
  "bn-6105":
    native: "to avenge; to take revenge"
    notes:
      "u1": "প্রতিশোধ (protiśodh), revenge, with দেওয়া (deoā): to avenge; to take revenge on someone. Only দেওয়া changes with person and tense. Attested on en.wiktionary, page প্রতিশোধ দেওয়া."
    bases:
      "প্রতিশোধ": { meaning: "revenge" }
  "bn-6106":
    native: "to die (figurative)"
    notes:
      "u1": "অক্কা (ôkkā), death (slang), with পাওয়া (pāoā): a figurative way to say someone died; the page says it literally means to attain God. Only পাওয়া changes with person and tense. Attested on en.wiktionary, page অক্কা পাওয়া."
    bases:
      "অক্কা": { meaning: "death (slang)" }
  "bn-6107":
    native: "to germinate; to sprout"
    notes:
      "u1": "অঙ্কুরিত (ôṅkurito), sprouted, with হওয়া (hoā): to germinate or sprout, said of seeds. Only হওয়া changes with person and tense. Attested on en.wiktionary, page অঙ্কুরিত হওয়া."
    bases:
      "অঙ্কুরিত": { meaning: "sprouted" }
  "bn-6108":
    native: "to seem; to feel"
    notes:
      "u1": "মনে (mône), in the mind, with হওয়া (hoā), to become: to feel, or have the impression, that something is so. Only হওয়া changes with person and tense. Attested on bn.wiktionary, page মনে হওয়া, which gives the sense to feel; to have an impression."
    bases:
      "মনে": { meaning: "in the mind" }
  "bn-6109":
    native: "to come to mind; to be remembered"
    notes:
      "u1": "মনে (mône), in the mind, with আসা (āsā), to come: a thing comes back to mind and is remembered. Only আসা changes with person and tense. Attested on bn.wiktionary, page মনে আসা, which gives the sense to come to memory."
    bases:
      "মনে": { meaning: "in the mind" }
  "bn-6110":
    native: "to dawn on someone; to become clear to someone"
    notes:
      "u1": "মাথা (māthā), head, in the form মাথায় (māthāy), with আসা (āsā), to come: an idea comes into the head and becomes clear. Only আসা changes with person and tense. Attested on bn.wiktionary, page মাথায় আসা, which gives the sense to become understood."
    bases:
      "মাথায়": { meaning: "on the head" }
  "bn-6111":
    native: "to be on the tip of one's tongue; to feel like saying"
    notes:
      "u1": "মুখ (mukh), mouth, in the form মুখে (mukhe), with আসা (āsā), to come: a word comes to the mouth, so one feels like saying it. Only আসা changes with person and tense. Attested on bn.wiktionary, page মুখে আসা, which gives the sense to feel the wish to say something."
    bases:
      "মুখে": { meaning: "in the mouth" }
  "bn-6112":
    native: "to promise; to give one's word"
    notes:
      "u1": "কথা (kôthā), word, with দেওয়া (deoā), to give: to promise someone to do, or not to do, something; to give one's word. Only দেওয়া changes with person and tense. Attested on bn.wiktionary, page কথা দেওয়া, which gives the sense to give one's word, to promise."
  "bn-6113":
    native: "to be alarmed; to be flustered"
    notes:
      "u1": "তটস্থ (tôṭostho), agitated, with হওয়া (hoā), to become: to be upset, or flustered and at a loss from fear. Only হওয়া changes with person and tense. Attested on bn.wiktionary, page তটস্থ হওয়া, which gives the sense to be agitated, in fear."
    bases:
      "তটস্থ": { meaning: "agitated; alarmed" }
  "bn-6114":
    native: "to be desperate; to be frantic"
    notes:
      "u1": "হন্নে (hônne), frantic, with হওয়া (hoā), to become: to be eager for something, or to be worked up and furious. Only হওয়া changes with person and tense. Attested on bn.wiktionary, page হন্নে হওয়া, which gives the senses to be eager for something and to be in a rage."
    bases:
      "হন্নে": { meaning: "frantic; eager" }
  "bn-6115":
    native: "to be stunned; to be frozen still"
    notes:
      "u1": "পাথর (pāthor), stone, with হওয়া (hoā), to become: to become like stone, stunned and still, as with shock. Only হওয়া changes with person and tense. Attested on bn.wiktionary, page পাথর হওয়া, which gives the sense to be stunned."
  "bn-6116":
    native: "to be wasted; to come to nothing"
    notes:
      "u1": "মাটি (māṭi), earth, soil, with হওয়া (hoā), to become: to be spoiled, as when a plan falls apart through one slip. Only হওয়া changes with person and tense. Attested on bn.wiktionary, page মাটি হওয়া, which gives the sense to be spoiled."
  "bn-6117":
    native: "to get a trace; to find the right way"
    notes:
      "u1": "হদিস (hodis), trace or clue, with পাওয়া (pāoā), to get: to get the right trace or path to something. Only পাওয়া changes with person and tense. Attested on bn.wiktionary, page হদিস পাওয়া, which gives the sense to get the right trace or path."
    bases:
      "হদিস": { meaning: "trace; clue" }
  "bn-6118":
    native: "to get a break; to get a chance"
    notes:
      "u1": "ফাঁক (phām̐k), gap or spare time, with পাওয়া (pāoā), to get: to get a rest, or an opportunity to do something. Only পাওয়া changes with person and tense. Attested on bn.wiktionary, page ফাঁক পাওয়া, which gives the sense to get a rest or an opportunity."
    bases:
      "ফাঁক": { meaning: "gap; spare time" }
  "bn-6119":
    native: "to become famous"
    notes:
      "u1": "নাম (nām), name, with হওয়া (hoā), to become: to become well known. Only হওয়া changes with person and tense. Attested on bn.wiktionary, page নাম হওয়া, which gives the sense to become famous."
