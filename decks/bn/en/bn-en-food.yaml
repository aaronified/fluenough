schema: 1
id: "bn-en-food"
kind: "layer"
core: "bn-food"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Food and drink"
description: "Fruit, vegetables, the basics of a Bengali kitchen, the dishes and snacks of the table, fish, drinks, the things you eat with, and how food tastes. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-0937":
    native: "apple"
    wiktionary: true
    notes:
      "n1": "A word from English."
    "examples": {
      "আমাকে একটা আপেল দিন।": {"native": "Please give me an apple.", "bases": {}},
      "আমি তিনটে আপেল গুনি।": {"native": "I count three apples.", "bases": {}}
    }
  "bn-0938":
    native: "orange (the fruit)"
    wiktionary: true
    notes:
      "n1": "The colour orange is {1}. The fruit is also called {2}, 'orange lime'."
  "bn-0939":
    native: "grape; grapes"
    wiktionary: true
    notes:
      "n1": "A word from Persian."
      "pair": "Only the last sound differs: {1} is a grape and {2} a finger."
  "bn-0940":
    native: "watermelon"
    wiktionary: true
    notes:
      "n1": "A word from Persian."
  "bn-0941":
    native: "pineapple"
    wiktionary: true
    notes:
      "n1": "Borrowed from Portuguese. It is often read as {1}, 'to bring', and {2}, 'juice', 'a fruit that brings juice'."
  "bn-0942":
    native: "guava"
    wiktionary: true
    notes:
      "n1": "Borrowed from Portuguese, from the word for 'pear'."
  "bn-0943":
    native: "coconut"
    wiktionary: true
    notes:
      "n1": "A green coconut that is drunk is a {1}; a ripe one, grated for sweets and curries, is a {2}."
  "bn-0944":
    native: "jackfruit"
    wiktionary: true
    notes:
      "n1": "The jackfruit is the national fruit of Bangladesh. The word means 'thorny fruit'."
  "bn-0945":
    native: "lychee"
    wiktionary: true
    notes:
      "n1": "Its season in Bengal is early summer, May and June. The word comes from Chinese."
  "bn-0946":
    native: "pumpkin; gourd"
    wiktionary: true
    notes:
      "n1": "The same word names the orange pumpkin and the pale gourd. It is also spelled {1}."
  "bn-0947":
    native: "pointed gourd"
    notes:
      "n1": "A small green vegetable of Bengal and Bihar, cooked in curries and fried: {1}."
  "bn-0948":
    native: "cabbage"
    notes:
      "n1": "Literally 'tied cauliflower': {1} means tied, and {2} is the cauliflower."
  "bn-0949":
    native: "carrot"
    wiktionary: true
    notes:
      "n1": "A word from Sanskrit."
  "bn-0950":
    native: "cucumber"
    wiktionary: true
    notes:
      "n1": "Eaten raw as a salad with salt and chilli, and in summer drinks and yoghurt."
  "bn-0951":
    native: "okra; lady's finger"
    wiktionary: true
    notes:
      "n1": "A vegetable of the summer and the rains, cooked as a dry fry."
  "bn-0952":
    native: "radish"
    notes:
      "n1": "Also spelled {1}. It is eaten raw in salads and cooked in curries."
  "bn-0953":
    native: "fine white flour"
    wiktionary: true
    notes:
      "n1": "The flour of {1} and of sweets. The flour of everyday rotis is {2}."
    "examples": {
      "ময়দা মাখা হয়েছে।": {"native": "The flour has been kneaded.", "bases": {"ময়দা": "fine white flour"}}
    }
  "bn-0954":
    native: "ghee"
    wiktionary: true
    notes:
      "n1": "Butter cooked until clear; it flavours rice, sweets and festival food."
  "bn-0955":
    native: "butter"
    wiktionary: true
    notes:
      "n1": "Spread on bread. For cooking, people use {1}, ghee, instead."
  "bn-0956":
    native: "curd; yoghurt"
    wiktionary: true
    notes:
      "n1": "Sweet curd, {1}, set in a clay pot, is a famous sweet of Bengal."
      "n2": "Old books spell it {1}; today it is {2}."
  "bn-0957":
    native: "honey"
    wiktionary: true
    notes:
      "n1": "A word from Sanskrit. It is also a common man's name."
  "bn-0958":
    native: "spices; a spice mix"
    wiktionary: true
    notes:
      "n1": "A word from Persian, from Arabic. {1} is the mix of whole spices added to rich dishes."
    "examples": {
      "মশলা বাটা হয়েছে।": {"native": "The spices have been ground.", "bases": {}},
      "সব মশলা মেশান।": {"native": "Mix in all the spices.", "bases": {"মেশান": "to mix in"}}
    }
  "bn-0959":
    native: "turmeric; yellow"
    wiktionary: true
    notes:
      "n1": "Before a Bengali wedding, turmeric paste is rubbed on the bride and the groom in the ceremony called {1}."
      "n2": "The same word is the colour yellow."
    "examples": {
      "আমের রং হলুদ।": {"native": "The mango is yellow.", "bases": {}},
      "সরিষা ফুল হলুদ।": {"native": "Mustard flowers are yellow.", "bases": {"হলুদ": "turmeric; yellow"}}
    }
  "bn-0960":
    native: "ginger"
    wiktionary: true
    notes:
      "n1": "From Sanskrit for 'wet', since fresh ginger is wet. {1} is tea with ginger."
    "examples": {
      "কুচি কুচি আদা দিন।": {"native": "Add finely chopped ginger.", "bases": {"আদা": "ginger"}}
    }
  "bn-0961":
    native: "cumin"
    wiktionary: true
    notes:
      "n1": "Also said {1}. Ground cumin is {2}."
  "bn-0962":
    native: "khichuri (rice and lentils cooked together)"
    wiktionary: true
    notes:
      "n1": "Rice and lentils cooked together, the comfort food of a rainy day. It is also the food that is offered and shared at a puja."
  "bn-0963":
    native: "biryani"
    wiktionary: true
    notes:
      "n1": "Kolkata biryani is known for the potato cooked in it with the meat."
  "bn-0964":
    native: "payesh (rice pudding)"
    wiktionary: true
    notes:
      "n1": "Payesh, rice cooked in sweet milk, is the dish of a birthday in many Bengali homes."
    "examples": {
      "এলাচ দিয়ে পায়েস।": {"native": "Payesh with cardamom.", "bases": {"পায়েস": "payesh (rice pudding)"}}
    }
  "bn-0965":
    native: "luchi (fried puffed bread)"
    wiktionary: true
    notes:
      "n1": "A round bread of {1}, fried until it puffs. It is eaten at breakfast and on special days, often with potato curry, {2}."
    "examples": {
      "বেলন দিয়ে লুচি বেলো।": {"native": "Roll the luchi with the rolling pin.", "bases": {"বেলো": "to roll out", "লুচি": "luchi (fried puffed bread)"}}
    }
  "bn-0966":
    native: "paratha; layered fried flatbread"
    notes:
      "n1": "Layered and fried in oil. Also spelled {1}."
  "bn-0967":
    native: "rosogolla (a sweet of cheese in syrup)"
    wiktionary: true
    notes:
      "n1": "Where the rosogolla came from is disputed between Bengal and Odisha, and both have a geographical indication for their own."
    "examples": {
      "রসগোল্লা আমার প্রিয় মিষ্টি।": {"native": "Rosogolla is my favourite sweet.", "bases": {"রসগোল্লা": "rosogolla (a sweet of cheese in syrup)"}}
    }
  "bn-0968":
    native: "sandesh (a milk sweet)"
    wiktionary: true
    notes:
      "n1": "The same word also means 'a message', from Sanskrit."
  "bn-0969":
    native: "singara (a fried snack, like a samosa)"
    notes:
      "n1": "The Bengali samosa, usually filled with potato. Also spelled {1}."
  "bn-0970":
    native: "jhalmuri (a spicy puffed-rice snack)"
    wiktionary: true
    notes:
      "n1": "Puffed rice, {1}, mixed with chopped onion, chilli and mustard oil, and sold on streets and trains."
  "bn-0971":
    native: "phuchka (a crisp shell filled with spicy water)"
    wiktionary: true
    notes:
      "n1": "A street snack of Kolkata and Bangladesh. Elsewhere in India it is called {1} or {2}."
  "bn-0972":
    native: "hilsa"
    wiktionary: true
    notes:
      "n1": "The hilsa is the national fish of Bangladesh, and the favourite fish of the monsoon in Bengal."
    "examples": {
      "আপনি ইলিশ খান?": {"native": "Do you eat hilsa? (respectful)", "bases": {}},
      "ভাপে ইলিশ রাঁধা হয়েছে।": {"native": "Hilsa has been cooked by steam.", "bases": {"ভাপে": "steam"}}
    }
  "bn-0973":
    native: "prawn; shrimp"
    wiktionary: true
    notes:
      "n1": "A big freshwater prawn is a {1}."
  "bn-0974":
    native: "rohu (a river carp)"
    wiktionary: true
    notes:
      "n1": "An everyday fish for curry, cut into steaks."
  "bn-0975":
    native: "coffee"
    wiktionary: true
    notes:
      "n1": "The Indian Coffee House on College Street in Kolkata is known as a place where students, writers and artists meet to talk."
      "n2": "A word from English."
    "examples": {
      "চা না কফি?": {"native": "Tea or coffee?", "bases": {"কফি": "coffee"}},
      "ক্যাফেতে বসে কফি খাই।": {"native": "I sit in a cafe and have coffee.", "bases": {"ক্যাফেতে": "cafe", "কফি": "coffee"}}
    }
  "bn-0976":
    native: "juice"
    notes:
      "n1": "A word from English."
  "bn-0977":
    native: "sherbet; a cold sweet drink"
    wiktionary: true
    notes:
      "n1": "A word from Persian, from Arabic. A summer drink of lime or fruit with sugar."
  "bn-0978":
    native: "plate"
    notes:
      "n1": "A word from English. The traditional metal plate for a meal is a {1} or {2}."
    "examples": {
      "আমাকে আরেকটা প্লেট দিন।": {"native": "Please give me another plate.", "bases": {}}
    }
  "bn-0979":
    native: "bowl"
    wiktionary: true
    notes:
      "pair": "Not {1}, house: {2} has a stop made with the tongue curled back, {1} a flap."
      "pair2": "Not {1}, lamp: {2} has the tongue curled back, {1} on the teeth."
  "bn-0980":
    native: "glass; a drinking glass"
    wiktionary: true
    notes:
      "n1": "A word from English."
  "bn-0981":
    native: "spoon"
    wiktionary: true
    notes:
      "n1": "A word from Persian. Many people eat rice with the right hand, so a spoon is for sweets and soups."
    "examples": {
      "এক চামচ হলুদের গুঁড়ো দিন।": {"native": "Add one spoon of turmeric powder.", "bases": {"চামচ": "spoon"}}
    }
  "bn-0982":
    native: "knife"
    wiktionary: true
    notes:
      "n1": "Not {1}, stealing: the first letter of {2} has a puff of breath after it."
    "examples": {
      "ছুরি দিয়ে সবজি কাটুন।": {"native": "Please cut the vegetables with a knife.", "bases": {}}
    }
  "bn-0983":
    native: "wok; a round iron pan"
    wiktionary: true
    notes:
      "n1": "The deep round pan for frying and for curries; from Sanskrit {1}. The pot for rice is a {2}."
    "examples": {
      "কড়াইটা নাড়ুন।": {"native": "Stir the wok.", "bases": {"নাড়ুন": "to stir", "কড়াইটা": "wok; a round iron pan"}}
    }
  "bn-0984":
    native: "sour"
    wiktionary: true
    notes:
      "n1": "Tamarind, curd and unripe mango are {1}. A {1} dish, a sour chutney, ends a Bengali meal."
    "examples": {
      "এর স্বাদ টক।": {"native": "Its taste is sour.", "bases": {"এর": "its", "টক": "sour"}}
    }
  "bn-0985":
    native: "bitter"
    wiktionary: true
    notes:
      "n1": "A traditional Bengali meal begins with something bitter, such as bitter gourd, and ends with something sweet."
  "bn-0986":
    native: "salty"
    notes:
      "n1": "From {1}, salt. It also names a salty snack, as against a sweet one: {2}."
    "examples": {
      "সাগরের জল নোনতা।": {"native": "The water of the ocean is salty.", "bases": {"সাগরের": "ocean; large sea"}}
    }
  "bn-0987":
    native: "tasty; delicious"
    wiktionary: true
    notes:
      "n1": "The formal word. In speech people more often say {1}, 'good', or {2}, 'great'."
    "examples": {
      "ডালনাটা খুব সুস্বাদু।": {"native": "The dalna is very tasty.", "bases": {"ডালনাটা": "a mildly spiced mixed-vegetable curry, usually with potato"}}
    }
  "bn-0988":
    native: "raw; unripe"
    wiktionary: true
    notes:
      "n1": "It is raw food, unripe fruit, and also a rough or unfinished thing: {1}, a green mango."
    "examples": {
      "কাঁচা লঙ্কা কুচানো হয়েছে।": {"native": "The green chillies have been chopped finely.", "bases": {"কাঁচা": "raw; unripe"}},
      "কাঁচা লঙ্কা কোটা হয়েছে।": {"native": "The green chillies have been chopped.", "bases": {}}
    }
  "bn-0989":
    native: "fried"
    wiktionary: true
    notes:
      "n1": "It is the adjective and also the noun: {1}, fried potato, is a side dish of everyday meals."
    "examples": {
      "পাঁপড় ভাজা হয়েছে।": {"native": "The papadum has been fried.", "bases": {"ভাজা": "fried"}},
      "ভাজা খাবারে চর্বি বেশি।": {"native": "Fried food has a lot of fat.", "bases": {"ভাজা": "fried", "খাবারে": "in the food"}}
    }
