schema: 1
id: "bn-en-environment"
kind: "layer"
core: "bn-environment"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Environment"
description: "Pollution, climate, wildlife and the things people do to protect the earth. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-3391":
    native: "environment"
    notes:
      "n1": "{1}: The environment: the air, water, land and living things around us."
    examples:
      "পরিবেশ ভালো রাখো।": "Keep the environment good. (familiar)"
      "পরিবেশের জন্য কাজ করো।": { native: "Work for the environment. (familiar)", bases: { "পরিবেশের": "environment", "জন্য": "for" } }
  "bn-3392":
    native: "pollution"
    notes:
      "n1": "{1}: Pollution: making air, water or land dirty and harmful."
    examples:
      "এখানে দূষণ বেশি।": "Pollution is high here."
      "দূষণ কমাও।": { native: "Reduce pollution. (familiar)", bases: { "কমাও": "reduce" } }
  "bn-3393":
    native: "air pollution"
    notes:
      "n1": "{1}: Air pollution: dirty and harmful air."
    examples:
      "বায়ুদূষণে কাশি হয়।": { native: "Air pollution causes coughing.", bases: { "বায়ুদূষণে": "air pollution" } }
      "বায়ুদূষণ থেকে সাবধান।": { native: "Be careful of air pollution. (familiar)", bases: { "থেকে": "from", "সাবধান": "careful" } }
  "bn-3394":
    native: "water pollution"
    notes:
      "n1": "{1}: Water pollution: dirty and harmful water."
    examples:
      "নদীতে জলদূষণ বেড়েছে।": { native: "Water pollution in the river has increased.", bases: { "বেড়েছে": "increased" } }
      "জলদূষণ বন্ধ করো।": "Stop water pollution. (familiar)"
  "bn-3395":
    native: "climate"
    notes:
      "n1": "{1}: Climate: the usual weather of a place over many years."
    examples:
      "জলবায়ু বদলাচ্ছে।": { native: "The climate is changing.", bases: { "বদলাচ্ছে": "changing" } }
      "জলবায়ুর কথা ভাবো।": { native: "Think about the climate. (familiar)", bases: { "জলবায়ুর": "climate", "ভাবো": "think" } }
  "bn-3396":
    native: "global warming"
    notes:
      "n1": "{1}: Global warming: the rise in the earth's temperature."
    examples:
      "উষ্ণায়ন বাড়ছে।": { native: "Global warming is increasing.", bases: { "বাড়ছে": "increasing" } }
      "উষ্ণায়নের কারণ কী?": { native: "What is the cause of global warming?", bases: { "উষ্ণায়নের": "global warming", "কী": "what" } }
  "bn-3397":
    native: "recycling"
    notes:
      "n1": "{1}: Recycling: using old things again."
    examples:
      "পুনর্ব্যবহার ভালো।": "Recycling is good."
      "পুনর্ব্যবহারের জন্য বোতল দাও।": { native: "Give bottles for recycling. (familiar)", bases: { "পুনর্ব্যবহারের": "recycling", "জন্য": "for", "বোতল": "bottle" } }
  "bn-3398":
    native: "waste"
    notes:
      "n1": "{1}: Waste: things thrown away after use."
    examples:
      "বর্জ্য ফেলো না।": { native: "Do not throw away waste. (familiar)", bases: { "না": "not" } }
      "বর্জ্যটা কোথায়?": { native: "Where is the waste?", bases: { "বর্জ্যটা": "waste" } }
  "bn-3399":
    native: "plastic"
    notes:
      "n1": "{1}: Plastic: a material that does not rot easily."
    examples:
      "প্লাস্টিকের ব্যাগ খারাপ।": { native: "Plastic bags are bad.", bases: { "প্লাস্টিকের": "plastic" } }
      "প্লাস্টিক কম ব্যবহার করো।": { native: "Use less plastic. (familiar)", bases: { "কম": "less", "ব্যবহার": "use" } }
  "bn-3400":
    native: "wildlife"
    notes:
      "n1": "{1}: Wildlife: animals that live free in nature."
    examples:
      "বন্যপ্রাণী বনে থাকে।": "Wildlife lives in the forest."
      "বন্যপ্রাণী রক্ষা করো।": { native: "Protect wildlife. (familiar)", bases: { "রক্ষা": "protection" } }
  "bn-3401":
    native: "species"
    notes:
      "n1": "{1}: A species: a kind of living thing."
    examples:
      "অনেক প্রজাতি বিপন্ন।": "Many species are endangered."
      "এই প্রজাতির পাখি বেশি।": { native: "There are many birds of this kind.", bases: { "এই": "this", "প্রজাতির": "of this kind" } }
  "bn-3402":
    native: "energy; power"
    notes:
      "n1": "{1}: Energy or power: the ability to do work."
    examples:
      "সৌর শক্তি ভালো।": { native: "Solar energy is good.", bases: { "সৌর": "solar" } }
      "শক্তি বাঁচাও।": { native: "Save energy. (familiar)", bases: { "বাঁচাও": "save" } }
  "bn-3403":
    native: "carbon"
    notes:
      "n1": "{1}: Carbon: an element that goes into the air from burning."
    examples:
      "কার্বন বাড়ছে।": { native: "Carbon is increasing.", bases: { "বাড়ছে": "increasing" } }
      "কার্বন কমাতে গাছ লাগাও।": { native: "Plant trees to reduce carbon. (familiar)", bases: { "কমাতে": "to reduce", "লাগাও": "plant" } }
  "bn-3404":
    native: "smoke"
    notes:
      "n1": "{1}: Smoke: the grey cloud from burning."
    examples:
      "ধোঁয়া উঠছে।": { native: "Smoke is rising.", bases: { "উঠছে": "rising" } }
      "কারখানার ধোঁয়া বেশি।": "The factory smoke is heavy."
  "bn-3405":
    native: "fuel"
    notes:
      "n1": "{1}: Fuel: material burnt to give energy."
    examples:
      "জ্বালানি দাম বাড়ছে।": { native: "The price of fuel is rising.", bases: { "বাড়ছে": "rising" } }
      "জ্বালানি বাঁচাও।": { native: "Save fuel. (familiar)", bases: { "বাঁচাও": "save" } }
  "bn-3406":
    native: "earthquake"
    notes:
      "n1": "{1}: An earthquake: the shaking of the ground."
    examples:
      "গতকাল ভূমিকম্প হয়েছে।": { native: "There was an earthquake yesterday.", bases: { "গতকাল": "yesterday" } }
      "ভূমিকম্পের সময় বাইরে যাও।": { native: "During an earthquake, go outside. (familiar)", bases: { "ভূমিকম্পের": "earthquake" } }
  "bn-3407":
    native: "landslide"
    notes:
      "n1": "{1}: A landslide: earth falling down a hill."
    examples:
      "পাহাড়ে ভূমিধস হয়েছে।": "There has been a landslide in the hills."
      "ভূমিধসের খবর পেলাম।": { native: "I got the news of the landslide.", bases: { "ভূমিধসের": "landslide", "খবর": "news" } }
  "bn-3408":
    native: "conservation"
    notes:
      "n1": "{1}: Conservation: keeping something safe and whole."
    examples:
      "বনের সংরক্ষণ দরকার।": "The conservation of the forest is needed."
      "সংরক্ষণের কাজ শুরু হলো।": { native: "The work of conservation has started.", bases: { "সংরক্ষণের": "conservation", "শুরু": "started" } }
  "bn-3409":
    native: "planting"
    notes:
      "n1": "{1}: Planting: putting a plant or tree into the ground."
    examples:
      "গাছ রোপণ করা হলো।": "A tree was planted."
      "রোপণের দিন আজ।": { native: "Today is the day of planting.", bases: { "রোপণের": "planting", "আজ": "today" } }
  "bn-3410":
    native: "ecosystem"
    notes:
      "n1": "{1}: An ecosystem: living things and their surroundings together."
    examples:
      "বাস্তুতন্ত্র বদলাচ্ছে।": { native: "The ecosystem is changing.", bases: { "বদলাচ্ছে": "changing" } }
      "বাস্তুতন্ত্রে সবাই মিলে থাকে।": { native: "Everything lives together in the ecosystem.", bases: { "বাস্তুতন্ত্রে": "ecosystem", "সবাই": "everyone", "মিলে": "together" } }
  "bn-3411":
    native: "ozone"
    notes:
      "n1": "{1}: Ozone: a gas high in the air that protects from the sun."
    examples:
      "ওজোন স্তর পাতলা।": { native: "The ozone layer is thin.", bases: { "স্তর": "layer" } }
      "ওজোনের ক্ষয় হচ্ছে।": { native: "Ozone is being depleted.", bases: { "ওজোনের": "ozone", "ক্ষয়": "depletion" } }
  "bn-3412":
    native: "heat"
    notes:
      "n1": "{1}: Heat: warmth given off by something hot."
    examples:
      "তাপ বেশি।": "The heat is high."
      "তাপে গাছ শুকিয়ে যাচ্ছে।": { native: "The trees are drying up in the heat.", bases: { "তাপে": "heat", "শুকিয়ে": "drying" } }
  "bn-3413":
    native: "noise; sound"
    notes:
      "n1": "{1}: Noise or sound: something heard."
    examples:
      "এখানে শব্দ অনেক।": "There is a lot of noise here."
      "শব্দ কমাও।": { native: "Reduce the noise. (familiar)", bases: { "কমাও": "reduce" } }
  "bn-3414":
    native: "tree (formal)"
    notes:
      "n1": "{1}: A tree, a formal word."
    examples:
      "এই বৃক্ষটা বড়।": { native: "This tree is big.", bases: { "এই": "this", "বৃক্ষটা": "the tree" } }
      "বৃক্ষ রোপণ করো।": "Plant trees. (familiar)"
  "bn-3415":
    native: "air (formal)"
    notes:
      "n1": "{1}: Air, a formal word for the air we breathe."
    examples:
      "বায়ু পরিষ্কার রাখো।": "Keep the air clean. (familiar)"
      "বায়ুতে ধোঁয়া।": { native: "There is smoke in the air.", bases: { "বায়ুতে": "air (formal)" } }
  "bn-3416":
    native: "biodiversity"
    notes:
      "n1": "{1}: Biodiversity: the variety of living things."
    examples:
      "জীববৈচিত্র্য রক্ষা করো।": { native: "Protect biodiversity. (familiar)", bases: { "রক্ষা": "protection" } }
      "জীববৈচিত্র্যের ক্ষতি হচ্ছে।": { native: "Biodiversity is being harmed.", bases: { "জীববৈচিত্র্যের": "biodiversity", "ক্ষতি": "harm" } }
  "bn-3417":
    native: "awareness"
    notes:
      "n1": "{1}: Awareness: knowing about something and caring."
    examples:
      "সচেতনতা বাড়াও।": { native: "Increase awareness. (familiar)", bases: { "বাড়াও": "increase" } }
      "পরিবেশ নিয়ে সচেতনতা দরকার।": { native: "Awareness about the environment is needed.", bases: { "নিয়ে": "about" } }
  "bn-3418":
    native: "plants"
    notes:
      "n1": "{1}: Plants: living things that grow in the ground."
    examples:
      "উদ্ভিদ বাঁচাও।": { native: "Save the plants. (familiar)", bases: { "বাঁচাও": "save" } }
      "এখানে অনেক উদ্ভিদ আছে।": { native: "There are many plants here.", bases: { "আছে": "are" } }
  "bn-3419":
    native: "animals"
    notes:
      "n1": "{1}: Animals: living creatures that move and feel."
    examples:
      "প্রাণীদের যত্ন নাও।": { native: "Take care of the animals. (familiar)", bases: { "প্রাণীদের": "animals", "যত্ন": "care" } }
      "এখানে অনেক প্রাণী আছে।": { native: "There are many animals here.", bases: { "আছে": "are" } }
  "bn-3420":
    native: "disaster"
    notes:
      "n1": "{1}: A disaster: a sudden event that causes great harm."
    examples:
      "দুর্যোগের সময় সাবধান থাকো।": { native: "Be careful during a disaster. (familiar)", bases: { "দুর্যোগের": "disaster", "সাবধান": "careful" } }
      "দুর্যোগ এসেছে।": "A disaster has come."
  "bn-3421":
    native: "mineral"
    notes:
      "n1": "{1}: A mineral: natural matter found in the ground."
    examples:
      "এখানে খনিজ আছে।": { native: "There are minerals here.", bases: { "আছে": "are" } }
      "খনিজের খনন বন্ধ করো।": { native: "Stop mining the minerals. (familiar)", bases: { "খনিজের": "mineral", "খনন": "mining" } }
  "bn-3422":
    native: "rainfall"
    notes:
      "n1": "{1}: Rainfall: the amount of rain that falls."
    examples:
      "এ বছর বৃষ্টিপাত কম।": { native: "There was little rainfall this year.", bases: { "এ": "this", "বছর": "year", "কম": "little" } }
      "বৃষ্টিপাত বাড়ছে।": { native: "Rainfall is increasing.", bases: { "বাড়ছে": "increasing" } }
  "bn-3423":
    native: "soil erosion"
    notes:
      "n1": "{1}: Soil erosion: soil washed or blown away."
    examples:
      "মাটিক্ষয় হচ্ছে।": "Soil erosion is happening."
      "মাটিক্ষয় রোধ করো।": { native: "Stop soil erosion. (familiar)", bases: { "রোধ": "stopping" } }
  "bn-3424":
    native: "water body"
    notes:
      "n1": "{1}: A water body: a lake, pond or marsh."
    examples:
      "জলাশয়ে মাছ আছে।": { native: "There are fish in the water body.", bases: { "জলাশয়ে": "in the water body", "আছে": "are" } }
      "জলাশয় পরিষ্কার রাখো।": "Keep the water body clean. (familiar)"
  "bn-3425":
    native: "warmth"
    notes:
      "n1": "{1}: Warmth: how hot or warm something is."
    examples:
      "উষ্ণতা বাড়ছে।": { native: "The warmth is increasing.", bases: { "বাড়ছে": "increasing" } }
      "উষ্ণতার কারণে গাছ মরছে।": { native: "Trees are dying because of the warmth.", bases: { "উষ্ণতার": "warmth", "কারণে": "because of", "মরছে": "dying" } }
  "bn-3426":
    native: "earth"
    notes:
      "n1": "{1}: The earth: the planet we live on."
    examples:
      "পৃথিবী গরম হচ্ছে।": "The earth is getting warm."
      "পৃথিবী বাঁচাও।": { native: "Save the earth. (familiar)", bases: { "বাঁচাও": "save" } }
  "bn-3427":
    native: "sustainable"
    notes:
      "n1": "{1}: Sustainable: lasting, and not harming the earth."
    examples:
      "টেকসই উন্নয়ন দরকার।": { native: "Sustainable development is needed.", bases: { "উন্নয়ন": "development" } }
      "এটা টেকসই পণ্য।": { native: "This is a sustainable product.", bases: { "পণ্য": "product" } }
  "bn-3428":
    native: "endangered"
    notes:
      "n1": "{1}: Endangered: at risk of dying out."
    examples:
      "বাঘ বিপন্ন প্রাণী।": { native: "The tiger is an endangered animal.", bases: { "বাঘ": "tiger" } }
      "বিপন্ন গাছ বাঁচাও।": { native: "Save the endangered trees. (familiar)", bases: { "বাঁচাও": "save" } }
  "bn-3429":
    native: "fertile"
    notes:
      "n1": "{1}: Fertile: good for growing crops."
    examples:
      "এই মাটি উর্বর।": { native: "This soil is fertile.", bases: { "এই": "this" } }
      "উর্বর জমিতে ফসল হয়।": { native: "Crops grow on fertile land.", bases: { "জমিতে": "on the land" } }
  "bn-3430":
    native: "polluted"
    notes:
      "n1": "{1}: Polluted: made dirty and harmful."
    examples:
      "নদীর জল দূষিত।": "The river's water is polluted."
      "দূষিত বাতাসে কাশি হয়।": "Coughing happens in polluted air."
  "bn-3431":
    native: "to plant trees"
    bases: { "বৃক্ষরোপণ": "tree-planting" }
    notes:
      "n1": "{1}: To plant trees: to put trees into the ground."
    examples:
      "আমরা বৃক্ষরোপণ করেছি।": { native: "We have planted trees.", bases: { "বৃক্ষরোপণ": "tree-planting" } }
      "এসো, বৃক্ষরোপণ করি।": { native: "Come, let us plant trees.", bases: { "বৃক্ষরোপণ": "tree-planting" } }
  "bn-3432":
    native: "to clean"
    notes:
      "n1": "{1}: To clean: to make clean."
    examples:
      "নদী পরিষ্কার করা হবে।": "The river will be cleaned."
      "রাস্তা পরিষ্কার করো।": "Clean the road. (familiar)"
  "bn-3433":
    native: "to conserve"
    notes:
      "n1": "{1}: To conserve: to keep safe and whole."
    examples:
      "বন সংরক্ষণ করো।": "Conserve the forest. (familiar)"
      "আমরা প্রকৃতি সংরক্ষণ করব।": { native: "We will conserve nature.", bases: { "প্রকৃতি": "nature" } }
  "bn-3434":
    native: "to recycle"
    notes:
      "n1": "{1}: To recycle: to use again."
    examples:
      "বোতলগুলো পুনর্ব্যবহার করো।": { native: "Recycle the bottles. (familiar)", bases: { "বোতলগুলো": "bottles" } }
      "কাগজ পুনর্ব্যবহার করা হয়।": "Paper is recycled."
  "bn-3435":
    native: "to pollute"
    notes:
      "n1": "{1}: To pollute: to make dirty and harmful."
    examples:
      "নদীতে বর্জ্য ফেলে দূষণ কোরো না।": { native: "Do not pollute the river by throwing waste into it. (familiar)", bases: { "না": "not" } }
      "বাতাস দূষণ করছে।": "The air is polluting."
  "bn-3436":
    native: "to become aware"
    bases: { "সচেতন": "aware" }
    notes:
      "n1": "{1}: To become aware: to start to care about something."
    examples:
      "আমরা পরিবেশ নিয়ে সচেতন হয়েছি।": { native: "We have become aware of the environment.", bases: { "নিয়ে": "about", "সচেতন": "aware" } }
      "সচেতন হও।": { native: "Become aware. (familiar)", bases: { "সচেতন": "aware" } }
  "bn-3437":
    native: "to plant a tree"
    bases: { "লাগানো": "plant" }
    notes:
      "n1": "{1}: To plant a tree: to put a tree in the ground."
    examples:
      "আমি একটা গাছ লাগিয়েছি।": { native: "I have planted a tree.", bases: { "লাগিয়েছি": "planted" } }
      "গাছ লাগাও।": { native: "Plant a tree. (familiar)", bases: { "লাগাও": "plant" } }
  "bn-3438":
    native: "gradually"
    notes:
      "n1": "{1}: Gradually: little by little."
    examples:
      "ক্রমশ উষ্ণতা বাড়ছে।": { native: "Warmth is gradually increasing.", bases: { "বাড়ছে": "increasing" } }
      "ক্রমশ সবাই সচেতন হচ্ছে।": { native: "Everyone is gradually becoming aware.", bases: { "সবাই": "everyone", "সচেতন": "aware" } }
  "bn-3439":
    native: "everywhere"
    notes:
      "n1": "{1}: Everywhere: in every place."
    examples:
      "সর্বত্র ময়লা।": "There is dirt everywhere."
      "পরিষ্কার সর্বত্র রাখো।": "Keep it clean everywhere. (familiar)"
  "bn-3440":
    native: "day by day"
    notes:
      "n1": "{1}: Day by day: little by little over the days."
    examples:
      "দিনে দিনে গরম বাড়ছে।": { native: "It is getting hotter day by day.", bases: { "বাড়ছে": "increasing" } }
      "দিনে দিনে অবস্থা খারাপ হচ্ছে।": { native: "The situation is getting worse day by day.", bases: { "অবস্থা": "situation" } }
