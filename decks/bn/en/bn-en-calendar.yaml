schema: 1
id: "bn-en-calendar"
kind: "layer"
core: "bn-calendar"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Months and years"
description: "The months as Bengali says them, dates and seasons, and how to read a year."
license: "CC-BY-SA-4.0"
tags: ["beginner"]
cards:
  "bn-0334":
    native: "month"
    notes:
      "n1": "The Gregorian months are used for almost everything. Bengal's own calendar matters mostly for festivals and পয়লা বৈশাখ (pôylā boiśākh), also পহেলা বৈশাখ (pôhelā boiśākh), the new year on 14 or 15 April."
    "examples": {
      "প্রকল্পটা দুই মাসের।": {"native": "The project lasts two months.", "bases": {"প্রকল্পটা": "project", "দুই": "two", "মাসের": "of a month"}},
      "মাসের আয় কত?": {"native": "What is the monthly income?", "bases": {"মাসের": "monthly", "আয়": "income"}}
    }
  "bn-0335":
    native: "year"
    notes:
      "n1": "Years before 2000 are read in hundreds: 1950 is উনিশশো পঞ্চাশ (uniśśo pôncāś), also written উনিশশ পঞ্চাশ (uniśoś pôncāś). From 2000, in thousands: 2020 is দু হাজার কুড়ি (du hājār kuṛi), also দুই হাজার বিশ (dui hājār biś)."
    "examples": {
      "আমার পাঁচ বছরের অভিজ্ঞতা।": {"native": "I have five years of experience.", "bases": {"পাঁচ": "five", "বছরের": "year"}},
      "এ বছর ফলন ভালো।": {"native": "This year the yield is good.", "bases": {"এ": "this", "বছর": "year"}}
    }
  "bn-0336":
    native: "date"
    notes:
      "n1": "আজ কত তারিখ (āj kôto tārikh)? What's the date today?"
    "examples": {
      "দলিলে তারিখ লেখা আছে।": {"native": "The date is written in the document.", "bases": {"দলিলে": "document", "আছে": "is", "তারিখ": "date"}},
      "শিলালিপিতে কোনো তারিখ নেই।": {"native": "There is no date on the inscription.", "bases": {"নেই": "there is no", "তারিখ": "date"}}
    }
  "bn-0337":
    native: "January"
  "bn-0338":
    native: "February"
    "examples": {
      "একুশে ফেব্রুয়ারি": {"native": "21 February (Language Martyrs' Day)", "bases": {}}
    }
  "bn-0339":
    native: "March"
  "bn-0340":
    native: "April"
  "bn-0341":
    native: "May"
  "bn-0342":
    native: "June"
  "bn-0343":
    native: "July"
  "bn-0344":
    native: "August"
  "bn-0345":
    native: "September"
  "bn-0346":
    native: "October"
  "bn-0347":
    native: "November"
  "bn-0348":
    native: "December"
  "bn-0698":
    native: "first"
    "examples": {
      "আমরাই প্রথম এসেছি।": {"native": "We ourselves came first.", "bases": {"প্রথম": "first"}},
      "প্রথম সংস্করণটা দুর্লভ।": {"native": "The first edition is rare.", "bases": {"দুর্লভ": "rare", "সংস্করণটা": "edition", "প্রথম": "first"}}
    }
  "bn-0699":
    native: "second"
    notes:
      "n1": "The ব (bô) under দ (dô) is not said."
    "examples": {
      "দ্বিতীয় অর্ধে দল গোল করেছে।": {"native": "The team has scored a goal in the second half.", "bases": {"অর্ধে": "in the half", "দ্বিতীয়": "second"}}
    }
  "bn-0700":
    native: "third"
  "bn-0701":
    native: "the 1st (of a month)"
    notes:
      "n1": "Dates have forms of their own: পয়লা (pôylā), দোসরা (dośrā), তেসরা (teśrā), চৌঠা (couṭhā) for the 1st to the 4th, then -ই (-i) from the 5th to the 18th (পাঁচই (pām̐coi), written ৫ই (5i)) and -এ (-e) from the 19th (উনিশে (uniśe), একুশে (ekuśe)). Also পহেলা (pôhelā)."
  "bn-0702":
    native: "the 2nd (of a month)"
  "bn-0703":
    native: "the 3rd (of a month)"
  "bn-0704":
    native: "the 4th (of a month)"
  "bn-0705":
    native: "21 February (Language Martyrs' Day)"
    notes:
      "n1": "So famous it is a name: একুশে (ekuśe), 'the 21st', remembers the students killed in Dhaka in 1952 for the right to Bengali. Bengalis everywhere keep it, and UNESCO made it International Mother Language Day."
  "bn-0706":
    native: "season"
    notes:
      "n1": "Bengal counts six: গ্রীষ্ম (grishsho, summer), বর্ষা (bôrśā, the rains), শরৎ (śôrot, early autumn), হেমন্ত (hemonto, late autumn), শীত (śit, winter) and বসন্ত (bôśonto, spring)."
  "bn-0707":
    native: "summer"
    notes:
      "n1": "কাল (kāl) here is 'time, season': গরম (gôrom), hot, + কাল (kāl). The formal word is গ্রীষ্মকাল (grishshokal)."
  "bn-0708":
    native: "the rainy season"
  "bn-0709":
    native: "winter"
    "examples": {
      "সরস্বতী পূজা শীতকালে হয়।": {"native": "Saraswati Puja is held in winter.", "bases": {"শীতকালে": "winter"}}
    }
  "bn-0710":
    native: "spring"
  "bn-1367":
    native: "Months of the year"
    explanation: "The twelve months, January first, in order."
