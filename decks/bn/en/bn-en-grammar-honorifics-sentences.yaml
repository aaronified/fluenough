cards:
  "bn-4544":
    native: "Please sit down a moment. (respectful)"
    confusables: { "c1": { why: "sit (intimate): the wrong level for an elder" }, "c2": { why: "sit (familiar): too informal for a stranger" } }
  "bn-4545":
    native: "Come tomorrow. (familiar)"
    confusables: { "c1": { why: "come (intimate): the form for a close friend" }, "c2": { why: "come (respectful): for an elder or a stranger" } }
  "bn-4546":
    native: "Will you play with me? (intimate)"
    confusables: { "c1": { why: "will play (respectful): wrong for a close friend" }, "c2": { why: "will play (familiar): not the intimate form" } }
  "bn-4547":
    native: "Elder brother, where are you going? (respectful)"
    confusables: { "c1": { why: "will go (intimate): wrong for an elder" }, "c2": { why: "will go (familiar): too casual here" } }
  "bn-4548":
    native: "Please say it, I am listening. (respectful)"
    confusables: { "c1": { why: "say (intimate): not for a group of elders" }, "c2": { why: "say (familiar): too informal" } }
  "bn-4549":
    native: "Do you read books? (familiar)"
    confusables: { "c1": { why: "read (intimate): for a close friend" }, "c2": { why: "read (respectful): for an elder" } }
  "bn-4550":
    native: "Doctor, please take the medicine. (respectful)"
    confusables: { "c1": { why: "eat (intimate): wrong for a doctor" }, "c2": { why: "eat (familiar): too casual" } }
  "bn-4551":
    native: "Open the door, will you. (intimate)"
    confusables: { "c1": { why: "open (respectful): not for a close friend" }, "c2": { why: "open (familiar): one step too formal" } }
  "bn-4552":
    native: "Sir, please listen a moment. (respectful)"
    confusables: { "c1": { why: "listen (intimate): wrong for a teacher" }, "c2": { why: "listen (familiar): too casual" } }
  "bn-4553":
    native: "You get up every morning. (familiar)"
    confusables: { "c1": { why: "get up (intimate): for a close friend" }, "c2": { why: "get up (respectful): for an elder" } }
  "bn-4554":
    native: "Mother, please have a look. (familiar)"
    confusables: { "c1": { why: "look (intimate): too close for a mother" }, "c2": { why: "look (respectful): too formal for a mother" } }
