schema: 1
id: "bn-en-relationships"
kind: "layer"
core: "bn-relationships"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Relationships"
description: "Friends, neighbours, brothers and sisters, love, respect, quarrels and making up: the words for the bonds between people. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-3887":
    native: "friendship"
    notes:
      "n1": "{1}: Friendship: the bond between friends."
    examples:
      "আমাদের বন্ধুত্ব অনেক দিনের।": "Our friendship is of many years."
      "বন্ধুত্বে বিশ্বাস থাকা জরুরি।": { native: "Trust is important in friendship.", bases: { "বন্ধুত্বে": "friendship" } }
  "bn-3888":
    native: "romantic love"
    notes:
      "n1": "{1}: Love between two people; romantic love."
    examples:
      "তাদের প্রেম খুব গভীর।": { native: "Their love is very deep.", bases: { "গভীর": "deep" } }
      "প্রেম আর ভালোবাসা এক নয়।": "Romance and affection are not the same."
  "bn-3889":
    native: "respect; honour"
    notes:
      "n1": "{1}: Respect: the honour one gives to another person."
    examples:
      "বড়দের সম্মান করা উচিত।": "We should respect elders."
      "তার সম্মান সবাই করে।": "Everyone shows him respect."
  "bn-3890":
    native: "quarrel"
    notes:
      "n1": "{1}: A quarrel: an angry argument."
    examples:
      "ভাইয়ের সঙ্গে ঝগড়া হলো।": "There was a quarrel with my brother."
      "ঝগড়াটা শেষ হলো।": { native: "The quarrel ended.", bases: { "ঝগড়াটা": "quarrel", "শেষ": "ended" } }
  "bn-3891":
    native: "separation"
    notes:
      "n1": "{1}: Separation: the end of a close relationship or a parting."
    examples:
      "দুই বন্ধুর বিচ্ছেদ হলো।": "The two friends were separated."
      "বিচ্ছেদের দুঃখ খুব বড়।": { native: "The pain of separation is very big.", bases: { "বিচ্ছেদের": "separation" } }
  "bn-3892":
    native: "misunderstanding"
    notes:
      "n1": "{1}: A misunderstanding: a small quarrel or a bad feeling between people."
    examples:
      "দুই ভাইয়ের মধ্যে মনোমালিন্য।": "There is a misunderstanding between the two brothers."
      "মনোমালিন্য মিটে গেল।": { native: "The misunderstanding was settled.", bases: { "মিটে": "settled" } }
  "bn-3893":
    native: "neighbour"
    notes:
      "n1": "{1}: A neighbour: a person who lives near you."
    examples:
      "পড়শি আমাদের বাড়িতে এল।": "The neighbour came to our house."
      "পড়শিদের সঙ্গে ভালো সম্পর্ক।": { native: "Good relations with the neighbours.", bases: { "পড়শিদের": "neighbour" } }
  "bn-3894":
    native: "elder brother"
    notes:
      "n1": "{1}: An elder brother: a brother older than you."
    examples:
      "বড়ভাই আমাকে সাহায্য করলেন।": "My elder brother helped me."
      "বড়ভাইয়ের বিয়ে কবে?": { native: "When is my elder brother's wedding?", bases: { "বড়ভাইয়ের": "elder brother" } }
  "bn-3895":
    native: "younger brother"
    notes:
      "n1": "{1}: A younger brother: a brother younger than you."
    examples:
      "ছোটভাই স্কুলে গেছে।": "My younger brother has gone to school."
      "ছোটভাইকে আদর করো।": { native: "Show affection to your younger brother. (familiar)", bases: { "ছোটভাইকে": "younger brother" } }
  "bn-3896":
    native: "aunt"
    notes:
      "n1": "{1}: An aunt: the mother's sister, or a respectful word for an older woman."
    examples:
      "খালা আজ আসছেন।": "Aunt is coming today."
      "খালার বাড়ি দূরে।": { native: "Aunt's house is far away.", bases: { "খালার": "aunt" } }
  "bn-3897":
    native: "boyfriend; lover"
    notes:
      "n1": "{1}: A boyfriend or a lover: a man in love with someone."
    examples:
      "প্রেমিক ফুল নিয়ে এল।": "The boyfriend came with flowers."
      "প্রেমিকের চিঠি পড়ল।": { native: "She read the letter from her boyfriend.", bases: { "প্রেমিকের": "boyfriend; lover" } }
  "bn-3898":
    native: "girlfriend; lover"
    notes:
      "n1": "{1}: A girlfriend or a lover: a woman in love with someone."
    examples:
      "প্রেমিকা হাসল।": "The girlfriend smiled."
      "প্রেমিকাকে উপহার দিলাম।": { native: "I gave a gift to my girlfriend.", bases: { "প্রেমিকাকে": "girlfriend; lover" } }
  "bn-3899":
    native: "hurt feelings"
    notes:
      "n1": "{1}: Hurt feelings: a sulky feeling after someone has upset you."
    examples:
      "তার অভিমান ভাঙল।": "His hurt feelings went away."
      "অভিমানে সে কথা বলল না।": { native: "In sulk, she did not speak.", bases: { "অভিমানে": "hurt feelings" } }
  "bn-3900":
    native: "envy"
    notes:
      "n1": "{1}: Envy: a bad feeling when you want what someone else has."
    examples:
      "হিংসা খারাপ জিনিস।": "Envy is a bad thing."
      "কারো প্রতি হিংসা রেখো না।": { native: "Do not hold envy against anyone. (familiar)", bases: { "কারো": "anyone" } }
  "bn-3901":
    native: "jealousy"
    notes:
      "n1": "{1}: Jealousy: a feeling of envy, often about a rival or a loved one."
    examples:
      "তার ঈর্ষা খুব স্পষ্ট।": { native: "His jealousy is very clear.", bases: { "স্পষ্ট": "clear" } }
      "ঈর্ষায় সে ভুল করল।": { native: "Out of jealousy, he made a mistake.", bases: { "ঈর্ষায়": "jealousy" } }
  "bn-3902":
    native: "trust; reliance"
    notes:
      "n1": "{1}: Trust and reliance: the feeling that someone can be counted on."
    examples:
      "তুমিই আমার ভরসা।": "You are my support."
      "তার উপর ভরসা রাখা যায়।": { native: "One can rely on him.", bases: { "উপর": "on" } }
  "bn-3903":
    native: "elderly person"
    notes:
      "n1": "{1}: An elderly person: someone who is older and respected."
    examples:
      "প্রবীণরা পার্কে বসেছিলেন।": { native: "The elderly people were sitting in the park.", bases: { "প্রবীণরা": "elder" } }
      "প্রবীণের কথা শোনা উচিত।": { native: "One should listen to the elderly.", bases: { "প্রবীণের": "elderly person" } }
  "bn-3904":
    native: "companion"
    notes:
      "n1": "{1}: A companion: someone who goes with you."
    examples:
      "আমার সঙ্গী খুব ভালো।": "My companion is very good."
      "সঙ্গীকে নিয়ে যাও।": { native: "Take your companion with you. (familiar)", bases: { "সঙ্গীকে": "companion" } }
  "bn-3905":
    native: "female companion"
    notes:
      "n1": "{1}: A female companion: a woman who goes with you."
    examples:
      "সঙ্গিনী আমার বোন।": "My female companion is my sister."
      "সঙ্গিনীর সঙ্গে কথা বললাম।": { native: "I talked with my female companion.", bases: { "সঙ্গিনীর": "female companion" } }
  "bn-3906":
    native: "union; reunion"
    notes:
      "n1": "{1}: A union or a reunion: people coming together after being apart."
    examples:
      "দুই বোনের মিলন হলো।": "The two sisters were reunited."
      "মিলনের আনন্দ অনেক।": { native: "The joy of the reunion is great.", bases: { "মিলনের": "union; reunion" } }
  "bn-3907":
    native: "distance"
    notes:
      "n1": "{1}: Distance: the space between two things or people; also the gap between them."
    examples:
      "দুজনের দূরত্ব বেশি।": { native: "The distance between the two is large.", bases: { "দুজনের": "of the two" } }
      "দূরত্ব কমাতে হবে।": "We must reduce the distance."
  "bn-3908":
    native: "likeness"
    notes:
      "n1": "{1}: A likeness or a similarity between two things or people."
    examples:
      "তাদের মধ্যে অনেক মিল আছে।": { native: "There are many similarities between them.", bases: { "আছে": "there are" } }
      "দুজনের মতের মিল নেই।": { native: "The two of them do not agree.", bases: { "দুজনের": "of the two", "নেই": "there is no" } }
  "bn-3909":
    native: "talk; acquaintance"
    notes:
      "n1": "{1}: A talk or an acquaintance: the first conversation with someone."
    examples:
      "তার সঙ্গে আলাপ হলো।": "I got to know him."
      "আলাপটা ভালো লাগল।": { native: "I liked the talk.", bases: { "আলাপটা": "talk; acquaintance" } }
  "bn-3910":
    native: "introduction; identity"
    notes:
      "n1": "{1}: An introduction or identity: knowing who someone is."
    examples:
      "পরিচয় হলো তার সঙ্গে।": "I was introduced to him."
      "পরিচয়পত্রটা দেখাও।": "Show your identity card. (familiar)"
  "bn-3911":
    native: "meeting"
    notes:
      "n1": "{1}: A meeting: a formal word for seeing someone in person."
    examples:
      "সাক্ষাৎ খুব আনন্দের।": "The meeting is very happy."
      "সাক্ষাতের সময় কবে?": { native: "When is the time of the meeting?", bases: { "সাক্ষাতের": "meeting" } }
  "bn-3912":
    native: "respect; reverence"
    notes:
      "n1": "{1}: Respect and reverence: a deep respect for someone."
    examples:
      "তাকে শ্রদ্ধা করি।": "I respect him."
      "শ্রদ্ধা আর প্রীতি রাখো।": "Keep respect and affection. (familiar)"
  "bn-3913":
    native: "gratitude"
    notes:
      "n1": "{1}: Gratitude: a feeling of thanks for help."
    examples:
      "তোমার প্রতি কৃতজ্ঞতা রইল।": "I remain grateful to you."
      "কৃতজ্ঞতা জানানো উচিত।": { native: "One should express gratitude.", bases: { "জানানো": "to express" } }
  "bn-3914":
    native: "enemy"
    notes:
      "n1": "{1}: An enemy: a person who wants to harm you."
    examples:
      "শত্রু কে?": "Who is the enemy? (familiar)"
      "শত্রুর সঙ্গে বন্ধুত্ব হয় না।": { native: "Friendship does not come with an enemy.", bases: { "শত্রুর": "enemy" } }
  "bn-3915":
    native: "close one"
    notes:
      "n1": "{1}: A close one: a family member or a very close friend."
    examples:
      "আপনজনরা সবাই এল।": { native: "All the close ones came.", bases: { "আপনজনরা": "close one" } }
      "আপনজনের খবর নিলাম।": { native: "I asked about my close one.", bases: { "আপনজনের": "close one" } }
  "bn-3916":
    native: "family members"
    notes:
      "n1": "{1}: Family members and dependants: the people of one's household."
    examples:
      "পরিজনদের খবর ভালো।": { native: "The news of the family is good.", bases: { "পরিজনদের": "family members" } }
      "সে পরিজনকে ছেড়ে গেল।": { native: "He left his family.", bases: { "পরিজনকে": "family members", "ছেড়ে": "to leave" } }
  "bn-3917":
    native: "companion; mate"
    notes:
      "n1": "{1}: A companion or a mate: someone who walks with you through life."
    examples:
      "সাথি হয়ে থাকো।": "Stay as a companion. (familiar)"
      "আমার সাথি এখানে নেই।": { native: "My companion is not here.", bases: { "নেই": "is not" } }
  "bn-3918":
    native: "female friend"
    notes:
      "n1": "{1}: A female friend: a woman friend."
    examples:
      "বান্ধবী আমাকে ফোন করল।": "My female friend phoned me."
      "বান্ধবীর বাড়ি কোথায়?": { native: "Where is your female friend's house?", bases: { "বান্ধবীর": "female friend" } }
  "bn-3919":
    native: "traitor"
    notes:
      "n1": "{1}: A traitor: a person who betrays a trust."
    examples:
      "বিশ্বাসঘাতককে কেউ ভালোবাসে না।": { native: "No one loves a traitor.", bases: { "কেউ": "no one", "বিশ্বাসঘাতককে": "traitor" } }
      "বিশ্বাসঘাতকতা করা খারাপ।": { native: "Betrayal is bad.", bases: { "বিশ্বাসঘাতকতা": "betrayal" } }
  "bn-3920":
    native: "close; one's own"
    notes:
      "n1": "{1}: Close and one's own: a close relation or one's own."
    examples:
      "আপন ভাই এখানে থাকে।": "My own brother lives here."
      "এটা আমার আপন ঘর।": "This is my own house."
  "bn-3921":
    native: "trustworthy"
    notes:
      "n1": "{1}: Trustworthy: someone who can be relied on."
    examples:
      "সে খুব বিশ্বস্ত বন্ধু।": "He is a very trustworthy friend."
      "বিশ্বস্ত লোক খুঁজছি।": { native: "I am looking for a trustworthy person.", bases: { "লোক": "person" } }
  "bn-3922":
    native: "close; near"
    notes:
      "n1": "{1}: Close or near: near in place or in heart."
    examples:
      "কাছের বন্ধু এল।": "A close friend came."
      "আমার কাছের লোকরা এখানে।": { native: "The people close to me are here.", bases: { "লোকরা": "people" } }
  "bn-3923":
    native: "distant"
    notes:
      "n1": "{1}: Far or distant: far in place or in heart."
    examples:
      "দূরের আত্মীয় এসেছে।": "A distant relative has come."
      "দূরের গ্রামে যাব।": "I will go to a distant village."
  "bn-3924":
    native: "kind"
    notes:
      "n1": "{1}: Kind: caring and gentle towards others."
    examples:
      "সে খুব সদয় মানুষ।": { native: "She is a very kind person.", bases: { "মানুষ": "person" } }
      "সদয় ব্যবহার সবাই পছন্দ করে।": { native: "Everyone likes kind behaviour.", bases: { "ব্যবহার": "behaviour" } }
  "bn-3925":
    native: "sympathetic"
    notes:
      "n1": "{1}: Sympathetic: able to understand and share another's feelings."
    examples:
      "তিনি খুব সহানুভূতিশীল।": "He is very sympathetic."
      "সহানুভূতিশীল বন্ধু পাওয়া ভাগ্য।": { native: "It is luck to have a sympathetic friend.", bases: { "ভাগ্য": "luck" } }
  "bn-3926":
    native: "to stand by"
    notes:
      "n1": "{1}: To stand by: to be there for someone in trouble."
    examples:
      "বিপদে সে আমার পাশে থাকল।": "In trouble, she stood by me."
      "বন্ধুরা সবসময় পাশে থাকে।": "Friends always stand by."
  "bn-3927":
    native: "to take care of"
    notes:
      "n1": "{1}: To take care of: to look after someone or something."
    examples:
      "মা আমার যত্ন নেন।": "Mother takes care of me."
      "নিজের যত্ন নাও।": "Take care of yourself. (familiar)"
  "bn-3928":
    native: "to remember"
    notes:
      "n1": "{1}: To remember: to keep someone or something in mind."
    examples:
      "তার কথা আমি মনে রাখব।": "I will remember his words."
      "বন্ধুরা আমাকে মনে রাখে।": "My friends remember me."
  "bn-3929":
    native: "to meet"
    notes:
      "n1": "{1}: To meet: to see someone in person on purpose."
    examples:
      "কাল তোমার সঙ্গে দেখা করব।": "I will meet you tomorrow."
      "আমরা অনেক দিন দেখা করিনি।": "We have not met for many days."
  "bn-3930":
    native: "to quarrel"
    notes:
      "n1": "{1}: To quarrel: to have an angry argument."
    examples:
      "ভাই-বোন রোজ ঝগড়া করে।": "The brother and sister quarrel every day."
      "আমি তার সঙ্গে ঝগড়া করিনি।": "I did not quarrel with him."
  "bn-3931":
    native: "to chat"
    notes:
      "n1": "{1}: To chat: to talk with someone, to get to know them."
    examples:
      "নতুন বন্ধুর সঙ্গে আলাপ করলাম।": "I chatted with a new friend."
      "চলো আলাপ করি।": "Let us chat. (familiar)"
