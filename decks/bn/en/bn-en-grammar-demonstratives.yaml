native: { code: "en", iso639_3: "eng", name: "English" }
name: "This, that and the one not here"
description: "Bengali points three ways: এ- (e-) near you, ও- (o-) over there, সে- (se-) out of sight or already mentioned. Not yet checked by a Bengali speaker: please report any mistake."
