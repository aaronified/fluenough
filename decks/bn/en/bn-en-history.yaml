schema: 1
id: "bn-en-history"
kind: "layer"
core: "bn-history"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "History"
description: "Kings, queens, forts, wars, rebellions and the things left from the past: tombs, inscriptions, manuscripts and ruins. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-3690":
    native: "king"
    notes:
      "n1": "{1}: A king: the ruler of a kingdom."
    examples:
      "রাজা প্রজাদের ভালোবাসতেন।": { native: "The king loved his subjects.", bases: { "প্রজাদের": "the subjects" } }
      "রাজার প্রাসাদটা বড়।": { native: "The king's palace is big.", bases: { "রাজার": "king" } }
  "bn-3691":
    native: "queen"
    notes:
      "n1": "{1}: A queen: the wife of a king, or a female ruler."
    examples:
      "রানি দুর্গে থাকতেন।": "The queen used to live in the fort."
      "রানির গল্প সবাই জানে।": { native: "Everyone knows the queen's story.", bases: { "রানির": "queen" } }
  "bn-3692":
    native: "emperor"
    notes:
      "n1": "{1}: An emperor: the ruler of an empire."
    examples:
      "সম্রাট বিশাল সাম্রাজ্য শাসন করতেন।": { native: "The emperor ruled a huge empire.", bases: { "বিশাল": "huge" } }
      "সম্রাটের মুদ্রা এখনো আছে।": { native: "The emperor's coins still exist.", bases: { "সম্রাটের": "emperor", "আছে": "exist" } }
  "bn-3693":
    native: "dynasty"
    notes:
      "n1": "{1}: A dynasty: a line of rulers from one family."
    examples:
      "এই রাজবংশ তিনশো বছর ছিল।": { native: "This dynasty lasted three hundred years.", bases: { "এই": "this", "ছিল": "lasted" } }
      "রাজবংশের ইতিহাস পড়লাম।": { native: "I read the history of the dynasty.", bases: { "রাজবংশের": "dynasty" } }
  "bn-3694":
    native: "war"
    notes:
      "n1": "{1}: A war: a fight between armies or countries."
    examples:
      "যুদ্ধ অনেক বছর চলেছিল।": "The war went on for many years."
      "যুদ্ধের পর শান্তি এল।": { native: "After the war, peace came.", bases: { "যুদ্ধের": "war" } }
  "bn-3695":
    native: "soldier; soldiers"
    notes:
      "n1": "{1}: A soldier, or soldiers together: the men of an army."
    examples:
      "সৈন্যরা দুর্গ ঘিরে ফেলল।": { native: "The soldiers surrounded the fort.", bases: { "সৈন্যরা": "soldier; soldiers", "ঘিরে": "surrounded" } }
      "সৈন্যদের সংখ্যা বেশি ছিল।": { native: "The number of soldiers was large.", bases: { "সৈন্যদের": "soldier; soldiers", "সংখ্যা": "number", "ছিল": "was" } }
  "bn-3696":
    native: "general"
    notes:
      "n1": "{1}: A general: the commander of an army."
    examples:
      "সেনাপতি যুদ্ধের পরিকল্পনা করলেন।": { native: "The general made the war plan.", bases: { "যুদ্ধের": "of the war" } }
      "সেনাপতির কথা সবাই শুনল।": { native: "Everyone listened to the general.", bases: { "সেনাপতির": "general" } }
  "bn-3697":
    native: "rule"
    notes:
      "n1": "{1}: Rule: the act or the period of governing a country."
    examples:
      "তার শাসন ভালো ছিল।": { native: "His rule was good.", bases: { "ছিল": "was" } }
      "শাসনের সময় অনেক কিছু বদলাল।": { native: "Many things changed during the period of rule.", bases: { "শাসনের": "rule" } }
  "bn-3698":
    native: "ruler"
    notes:
      "n1": "{1}: A ruler: the person who governs a country."
    examples:
      "শাসক প্রজাদের কথা শুনতেন।": { native: "The ruler used to listen to the subjects.", bases: { "প্রজাদের": "the subjects" } }
      "নতুন শাসক এলেন।": "A new ruler came."
  "bn-3699":
    native: "subjugation"
    notes:
      "n1": "{1}: Subjugation: being ruled by another country."
    examples:
      "পরাধীনতার দিন শেষ হলো।": { native: "The days of subjugation ended.", bases: { "পরাধীনতার": "subjugation", "শেষ": "end" } }
      "স্বাধীনতা আর পরাধীনতা আলাদা।": { native: "Independence and subjugation are different.", bases: { "আলাদা": "different" } }
  "bn-3700":
    native: "movement"
    notes:
      "n1": "{1}: A movement: a campaign of people to change something."
    examples:
      "আন্দোলন শুরু হলো।": "The movement began."
      "ছাত্রদের আন্দোলনে অনেক লোক এল।": { native: "Many people came to the students' movement.", bases: { "আন্দোলনে": "movement", "লোক": "people" } }
  "bn-3701":
    native: "revolution"
    notes:
      "n1": "{1}: A revolution: a sudden big change in government or society."
    examples:
      "বিপ্লবের পর দেশ বদলাল।": { native: "After the revolution the country changed.", bases: { "বিপ্লবের": "revolution" } }
      "বিপ্লবীরা রাস্তায় নামলেন।": { native: "The revolutionaries came out onto the streets.", bases: { "বিপ্লবীরা": "revolutionaries" } }
  "bn-3702":
    native: "civilisation"
    notes:
      "n1": "{1}: Civilisation: a society with its own culture, cities and writing."
    examples:
      "সিন্ধু সভ্যতা অনেক পুরোনো।": { native: "The Indus civilisation is very old.", bases: { "সিন্ধু": "Indus" } }
      "প্রাচীন সভ্যতার নিদর্শন দেখলাম।": { native: "I saw the remains of an ancient civilisation.", bases: { "সভ্যতার": "civilisation" } }
  "bn-3703":
    native: "tomb"
    notes:
      "n1": "{1}: A tomb: a grave, or a monument over a grave."
    examples:
      "সমাধিটা বাগানের মাঝখানে।": { native: "The tomb is in the middle of the garden.", bases: { "সমাধিটা": "tomb" } }
      "সমাধিতে ফুল রাখা হলো।": { native: "Flowers were placed on the tomb.", bases: { "সমাধিতে": "tomb" } }
  "bn-3704":
    native: "memorial"
    notes:
      "n1": "{1}: A memorial: a monument built to remember people or events."
    examples:
      "স্মৃতিসৌধে ফুল দিলাম।": { native: "I laid flowers at the memorial.", bases: { "স্মৃতিসৌধে": "memorial" } }
      "স্মৃতিসৌধটি অনেক উঁচু।": { native: "The memorial is very tall.", bases: { "স্মৃতিসৌধটি": "memorial" } }
  "bn-3705":
    native: "royal palace"
    notes:
      "n1": "{1}: A royal palace: the palace where a king lives."
    examples:
      "রাজপ্রাসাদের ঘরগুলো সুন্দর।": { native: "The rooms of the royal palace are beautiful.", bases: { "রাজপ্রাসাদের": "royal palace" } }
      "রাজপ্রাসাদে অনেক মানুষ থাকত।": { native: "Many people used to live in the royal palace.", bases: { "রাজপ্রাসাদে": "royal palace", "মানুষ": "people" } }
  "bn-3706":
    native: "empire"
    notes:
      "n1": "{1}: An empire: many countries or lands ruled by one ruler."
    examples:
      "সাম্রাজ্যটা খুব বড় ছিল।": { native: "The empire was very big.", bases: { "সাম্রাজ্যটা": "empire", "ছিল": "was" } }
      "সাম্রাজ্যের রাজধানী কোথায় ছিল?": { native: "Where was the capital of the empire?", bases: { "সাম্রাজ্যের": "empire", "ছিল": "was" } }
  "bn-3707":
    native: "rebellion"
    notes:
      "n1": "{1}: A rebellion: a revolt against the rulers."
    examples:
      "সৈন্যরা বিদ্রোহ করল।": { native: "The soldiers rebelled.", bases: { "সৈন্যরা": "soldiers" } }
      "বিদ্রোহের পর অনেক পরিবর্তন এল।": { native: "After the rebellion many changes came.", bases: { "বিদ্রোহের": "rebellion", "পরিবর্তন": "changes" } }
  "bn-3708":
    native: "colony"
    notes:
      "n1": "{1}: A colony: a country ruled by another country."
    examples:
      "দেশটা একসময় উপনিবেশ ছিল।": { native: "The country was once a colony.", bases: { "একসময়": "once", "ছিল": "was" } }
      "উপনিবেশের মানুষ স্বাধীনতা চাইল।": { native: "The people of the colony wanted independence.", bases: { "উপনিবেশের": "colony", "মানুষ": "people" } }
  "bn-3709":
    native: "nawab"
    notes:
      "n1": "{1}: A nawab: a governor who ruled Bengal under the Mughals."
    examples:
      "নবাব প্রাসাদে থাকতেন।": "The nawab lived in a palace."
      "নবাবের সেনাবাহিনী বড় ছিল।": { native: "The nawab's army was large.", bases: { "নবাবের": "nawab", "সেনাবাহিনী": "army", "ছিল": "was" } }
  "bn-3710":
    native: "landlord"
    notes:
      "n1": "{1}: A landlord: a rich man who owned land and collected rent."
    examples:
      "জমিদার গ্রামের জমি দেখতেন।": "The landlord looked after the village land."
      "জমিদারের বাড়ি বড়।": { native: "The landlord's house is big.", bases: { "জমিদারের": "landlord" } }
  "bn-3711":
    native: "document"
    notes:
      "n1": "{1}: A document: a written paper that records a fact or a deal."
    examples:
      "পুরোনো দলিলটা পাওয়া গেল।": { native: "The old document was found.", bases: { "দলিলটা": "document" } }
      "দলিলে তারিখ লেখা আছে।": { native: "The date is written in the document.", bases: { "দলিলে": "document", "আছে": "is" } }
  "bn-3712":
    native: "inscription"
    notes:
      "n1": "{1}: An inscription: writing carved on stone."
    examples:
      "পাথরে খোদাই করা লেখা।": { native: "Writing carved on stone.", bases: { "খোদাই": "carved" } }
      "শিলালিপিটি পড়া কঠিন।": { native: "The inscription is hard to read.", bases: { "শিলালিপিটি": "inscription" } }
  "bn-3713":
    native: "archaeology"
    notes:
      "n1": "{1}: Archaeology: the study of past peoples through what they left behind."
    examples:
      "প্রত্নতত্ত্ব আমার পছন্দের বিষয়।": "Archaeology is my favourite subject."
      "প্রত্নতত্ত্বে তিনি অনেক কাজ করেছেন।": { native: "He has done a lot of work in archaeology.", bases: { "প্রত্নতত্ত্বে": "archaeology" } }
  "bn-3714":
    native: "excavation"
    notes:
      "n1": "{1}: Excavation: digging up the ground to find old things."
    examples:
      "খননে একটা মূর্তি পাওয়া গেছে।": { native: "A statue has been found in the excavation.", bases: { "খননে": "excavation", "একটা": "a" } }
      "খনন কাজ চলছে।": "The excavation work is going on."
  "bn-3715":
    native: "manuscript"
    notes:
      "n1": "{1}: A manuscript: an old handwritten book on palm leaves or paper."
    examples:
      "পুঁথিটা তালপাতায় লেখা।": { native: "The manuscript is written on palm leaves.", bases: { "পুঁথিটা": "manuscript", "তালপাতায়": "on palm leaves" } }
      "পুঁথির ভাষা কঠিন।": { native: "The language of the manuscript is difficult.", bases: { "পুঁথির": "manuscript" } }
  "bn-3716":
    native: "warrior"
    notes:
      "n1": "{1}: A warrior: a fighter in a war."
    examples:
      "যোদ্ধারা সাহসী ছিলেন।": { native: "The warriors were brave.", bases: { "সাহসী": "brave", "ছিলেন": "were" } }
      "যোদ্ধার বর্ম ভারী।": { native: "The warrior's armour is heavy.", bases: { "যোদ্ধার": "warrior", "বর্ম": "armour" } }
  "bn-3717":
    native: "bravery"
    notes:
      "n1": "{1}: Bravery: great courage in danger."
    examples:
      "তার বীরত্বের গল্প সবাই বলে।": { native: "Everyone tells the story of his bravery.", bases: { "বীরত্বের": "bravery" } }
      "বীরত্ব দেখানো সহজ নয়।": "Showing bravery is not easy."
  "bn-3718":
    native: "historian"
    notes:
      "n1": "{1}: A historian: a person who studies and writes history."
    examples:
      "ইতিহাসবিদ নতুন বই লিখেছেন।": "The historian has written a new book."
      "ইতিহাসবিদের মতটি আলাদা।": { native: "The historian's view is different.", bases: { "ইতিহাসবিদের": "historian", "আলাদা": "different" } }
  "bn-3719":
    native: "century"
    notes:
      "n1": "{1}: A century: one hundred years."
    examples:
      "এই মন্দিরটি কয়েক শতাব্দী পুরোনো।": { native: "This temple is several centuries old.", bases: { "এই": "this" } }
      "বিশ শতাব্দীতে অনেক পরিবর্তন হলো।": { native: "Many changes happened in the twentieth century.", bases: { "বিশ": "twenty", "পরিবর্তন": "changes" } }
  "bn-3720":
    native: "era"
    notes:
      "n1": "{1}: An era: a long period of history."
    examples:
      "মধ্যযুগে অনেক দুর্গ ছিল।": { native: "There were many forts in the medieval era.", bases: { "মধ্যযুগে": "in the medieval era", "ছিল": "were" } }
      "নতুন যুগ শুরু হলো।": "A new era began."
  "bn-3721":
    native: "period"
    notes:
      "n1": "{1}: A period of time: the years over which an event or a rule lasted."
    examples:
      "এই সময়কালে বড় যুদ্ধ হয়েছিল।": { native: "A big war happened in this period.", bases: { "এই": "this" } }
      "সময়কালটা দীর্ঘ ছিল।": { native: "The period was long.", bases: { "সময়কালটা": "period", "দীর্ঘ": "long", "ছিল": "was" } }
  "bn-3722":
    native: "weapon"
    notes:
      "n1": "{1}: A weapon: a tool used to fight, such as a sword or a gun."
    examples:
      "সৈন্যদের অস্ত্র ভারী ছিল।": { native: "The soldiers' weapons were heavy.", bases: { "সৈন্যদের": "soldiers'", "ছিল": "were" } }
      "অস্ত্রটা ফেলে দাও।": "Put the weapon down. (familiar)"
  "bn-3723":
    native: "sword"
    notes:
      "n1": "{1}: A sword: a long blade used in old wars."
    examples:
      "তরবারিটা খুব ধারালো।": { native: "The sword is very sharp.", bases: { "তরবারিটা": "sword", "ধারালো": "sharp" } }
      "যোদ্ধা তরবারি তুলে নিল।": { native: "The warrior picked up the sword.", bases: { "তরবারি": "sword" } }
  "bn-3724":
    native: "the people"
    notes:
      "n1": "{1}: The people as a whole: the public, the citizens."
    examples:
      "জনগণ নতুন নেতা চাইল।": "The people wanted a new leader."
      "জনগণের মতামত গুরুত্বপূর্ণ।": { native: "The people's opinion is important.", bases: { "জনগণের": "the people" } }
  "bn-3725":
    native: "leadership"
    notes:
      "n1": "{1}: Leadership: the act of leading a group."
    examples:
      "তার নেতৃত্বে আন্দোলন হলো।": "The movement happened under his leadership."
      "ভালো নেতৃত্ব জরুরি।": "Good leadership is important."
  "bn-3726":
    native: "victory"
    notes:
      "n1": "{1}: Victory: winning a war or a contest."
    examples:
      "যুদ্ধে বিজয় হলো।": { native: "There was victory in the war.", bases: { "যুদ্ধে": "in the war" } }
      "বিজয়ের দিন উৎসব হলো।": { native: "On the day of victory there was a festival.", bases: { "বিজয়ের": "victory" } }
  "bn-3727":
    native: "defeat"
    notes:
      "n1": "{1}: Defeat: losing a war or a contest."
    examples:
      "পরাজয়ের পর সৈন্যরা ফিরল।": { native: "After the defeat the soldiers returned.", bases: { "পরাজয়ের": "defeat", "সৈন্যরা": "soldiers" } }
      "পরাজয় মেনে নেওয়া কঠিন।": { native: "It is hard to accept defeat.", bases: { "মেনে": "accepting" } }
  "bn-3728":
    native: "proof; evidence"
    notes:
      "n1": "{1}: Proof or evidence: something that shows a thing is true."
    examples:
      "এর পক্ষে প্রমাণ আছে।": { native: "There is evidence for this.", bases: { "এর": "this", "পক্ষে": "for", "আছে": "there is" } }
      "পুরোনো দলিলই প্রমাণ।": { native: "The old document is proof.", bases: { "দলিলই": "the document" } }
  "bn-3729":
    native: "relic; sign"
    notes:
      "n1": "{1}: A relic or a sign: something that shows what happened in the past."
    examples:
      "প্রাচীন নিদর্শন দেখে কী মনে হয়?": "What do you think when you see the ancient relics? (familiar)"
      "নিদর্শনটি খুব পুরোনো।": { native: "The relic is very old.", bases: { "নিদর্শনটি": "relic; sign" } }
  "bn-3730":
    native: "ancient"
    notes:
      "n1": "{1}: Ancient: very old, from a long time ago."
    examples:
      "প্রাচীন মন্দির দেখলাম।": "I saw an ancient temple."
      "প্রাচীন যুগ খুব আলাদা ছিল।": { native: "The ancient era was very different.", bases: { "আলাদা": "different", "ছিল": "was" } }
  "bn-3731":
    native: "modern"
    notes:
