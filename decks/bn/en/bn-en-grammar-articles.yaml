core: "bn-grammar-articles"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Classifiers: a and the"
description: "Bengali has no 'a' or 'the'. -টা (-ṭā), -টি (-ṭi) and -গুলো (-gulo) do their work, -জন (-jôn) counts people, and -খানা (-khānā) is for flat things."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar"]
cards:
  "bn-0254":
    native: "The book is on the table."
    notes:
      "n1": "Bengali has no 'the': -টা (-ṭā) after the noun does its work. In speech the 'is' can be left out here; in full, বইটা টেবিলের ওপরে আছে (boiṭā ṭebiler opore āche)."
    bases:
      "ওপর": "top; above; on"
  "bn-0255":
    native: "A book, please."
    notes:
      "n1": "একটা (ekoṭā), 'one' with -টা (-ṭā), does the work of 'a'."
  "bn-0256":
    native: "The boy has come."
    notes:
      "n1": "আসা (āśā) changes its stem in the perfect: এস- (eś-)."
  "bn-0257":
    native: "A girl is singing."
    notes:
      "n1": "-টি (-ṭi) is a gentler, more formal -টা (-ṭā), often used for people and small things."
    bases:
      "গান": "song"
      "গাইছে": "to sing"
  "bn-0258":
    native: "Where are the books?"
    notes:
      "n1": "-গুলো (-gulo), 'the several', makes a plural."
  "bn-0259":
    native: "Two teas, please."
    notes:
      "n1": "Numbers take the classifier too: দুটো (duṭo), তিনটে (tinoṭe), চারটে (duto, tinte, charte), also দুইটা (duiṭā), তিনটা (tinoṭā), চারটা (duita, tinta, charta)."
  "bn-0557":
    native: "a man; one person"
    notes:
      "n1": "-জন (-jôn) counts people: একজন (ekojon), দুজন (dujon), কয়েকজন (kôyekojon). Not for things, and not usually for small children."
    bases:
      "লোক": "person; man"
  "bn-0558":
    native: "a few friends"
  "bn-0559":
    native: "two kilos of potatoes"
    notes:
      "n1": "With a unit (a kilo, a day, a metre) the number takes no -টা (-ṭā): দু কেজি (du keji), তিন দিন (tin din). দু (du) and দুই (dui) are both right here."
  "bn-0560":
    native: "the book (-খানা)"
    notes:
      "n1": "-খানা (-khānā) is used mostly for flat, thin things like a book or a letter: চিঠিখানা (ciṭhikhānā), the letter. -টা (-ṭā) is always right too."
