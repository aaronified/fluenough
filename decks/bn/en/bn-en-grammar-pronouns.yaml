pattern:
  name: "Personal pronouns"
  slot_name: "form"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "ami": "I"
    "tui": "you, intimate"
    "tumi": "you, familiar"
    "apni": "you, respectful"
    "she": "he or she"
    "tini": "he or she, respectful"
    "amra": "we"
    "tomra": "you all, familiar"
    "ora": "they, over there"
    "e": "he or she, here, familiar"
    "o": "he or she, over there, familiar"
    "ini": "he or she, here, respectful"
    "uni": "he or she, over there, respectful"
    "tora": "you all, intimate"
    "apnara": "you all, respectful"
    "era": "they, here"
    "tara": "they, not present"
    "tanra": "they, respectful"
  notes: "Bengali has three words for 'you': আপনি (respectful), তুমি (familiar) and তুই (intimate). 'He or she' depends on where the person is: এ (e) for someone here, ও (o) for someone over there, সে (se) for someone not present. Their respectful forms are ইনি (ini), উনি (uni) and তিনি (tini), and their plurals এরা (erā), ওরা (orā) and তারা (tārā). A possessive never changes for the thing owned: আমার বই (āmār boi), আমার বাড়ি (āmār bāṛi). In the plural, the object is usually the same as the possessive: আমাদের (āmāder), or with -কে (-ke), আমাদেরকে (āmāderoke). In speech এঁর (em̐r) and ওঁর (om̐r) are often এনার (enār) and ওনার (onār): ওনার বাড়ি (onār bāṛi), and এঁকে (em̐ke) and ওঁকে (om̐ke) are এনাকে (enāke) and ওনাকে (onāke); the drill accepts both."
