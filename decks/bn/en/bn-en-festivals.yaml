"cards":
  "bn-1631":
    "native": "festival"
    "notes":
      "n1": "{1} is a festival: a day or days of celebration."
    "synonyms":
      "parbon": "a festival, especially an older religious one"
    "examples":
      "এটি একটি বড়ো উৎসব।":
        "native": "This is a big festival."
        "bases":
          "এটি":
            "meaning": "this"
          "একটি":
            "meaning": "one; a"
          "বড়ো":
            "meaning": "big"
      "উৎসবের দিনে সবাই নতুন জামা পরে।":
        "native": "On festival day everyone wears new clothes."
        "bases":
          "উৎসবের":
            "meaning": "festival"
  "bn-1632":
    "native": "puja; worship"
    "notes":
      "n1": "{1} is worship of a god, and also the festival of that worship."
    "synonyms": {}
    "examples":
      "বাড়িতে পূজা হচ্ছে।":
        "native": "A puja is being held at home."
      "মায়েরা পূজার আয়োজন করে।":
        "native": "The mothers arrange the puja."
        "bases":
          "পূজার":
            "meaning": "of the puja"
          "আয়োজন":
            "meaning": "arrangement"
  "bn-1633":
    "native": "puja (everyday word)"
    "notes":
      "n1": "{1} is the everyday word for puja, used in speech."
    "synonyms": {}
    "examples":
      "আমরা পুজোয় নতুন জামা কিনি।":
        "native": "We buy new clothes for the puja."
        "bases":
          "পুজোয়":
            "meaning": "at the puja"
      "পুজো কবে?":
        "native": "When is the puja?"
  "bn-1634":
    "native": "Durga Puja"
    "notes":
      "n1": "{1} is the autumn festival of the goddess Durga, the largest puja in Bengal."
    "examples":
      "দুর্গাপূজা শরৎকালে হয়।":
        "native": "Durga Puja is held in autumn."
        "bases":
          "শরৎকালে":
            "meaning": "autumn"
      "দুর্গাপূজায় সবাই বেড়াতে যায়।":
        "native": "At Durga Puja everyone goes out to visit."
        "bases":
          "দুর্গাপূজায়":
            "meaning": "at Durga Puja"
          "বেড়াতে":
            "meaning": "to go out; to visit"
  "bn-1635":
    "native": "Kali Puja"
    "notes":
      "n1": "{1} honours the goddess Kali and is held in the Diwali season."
    "examples":
      "কালীপূজা দীপাবলির সময় হয়।":
        "native": "Kali Puja is held at the time of Diwali."
        "bases":
          "দীপাবলির":
            "meaning": "of Diwali"
      "রাতে বাড়িতে প্রদীপ জ্বালানো হয়।":
        "native": "At night lamps are lit at home."
        "bases":
          "জ্বালানো":
            "meaning": "to light"
  "bn-1636":
    "native": "Saraswati Puja"
    "notes":
      "n1": "{1} honours the goddess of learning in late winter, when students lay their books before her."
    "examples":
      "সরস্বতী পূজায় ছাত্রছাত্রীরা বই রাখে।":
        "native": "At Saraswati Puja students place their books before the goddess."
        "bases":
          "পূজায়":
            "meaning": "at the puja"
          "ছাত্রছাত্রীরা":
            "meaning": "students"
      "সরস্বতী পূজা শীতকালে হয়।":
        "native": "Saraswati Puja is held in winter."
  "bn-1637":
    "native": "Pohela Boishakh; the Bengali new year"
    "notes":
      "n1": "{1} is the first day of the Bengali new year, in mid April."
    "examples":
      "পহেলা বৈশাখে সবাই মিষ্টি খায়।":
        "native": "On Pohela Boishakh everyone eats sweets."
        "bases":
          "বৈশাখে":
            "meaning": "Boishakh"
      "আজ পহেলা বৈশাখ।":
        "native": "Today is the first day of Boishakh."
  "bn-1638":
    "native": "new year"
    "notes":
      "n1": "{1} is the new year."
    "examples":
      "নববর্ষে নতুন জামা পরো।":
        "native": "Wear new clothes on New Year's day."
        "bases":
          "নববর্ষে":
            "meaning": "new year"
      "শুভ নববর্ষ!":
        "native": "Happy New Year!"
  "bn-1639":
    "native": "Eid"
    "notes":
      "n1": "{1} ends the fast of Ramadan; Muslims mark it with prayer and a festive meal."
    "examples":
      "আজ ঈদ।":
        "native": "Today is Eid."
      "ঈদের দিনে সবাই বন্ধুদের বাড়ি যায়।":
        "native": "On Eid day everyone goes to friends' homes."
        "bases":
          "ঈদের":
            "meaning": "of Eid"
  "bn-1640":
    "native": "Christmas"
    "notes":
      "n1": "{1} is Christmas, kept by Bengali Christians with a church service and a family meal."
    "examples":
      "বড়দিনে গির্জায় গান হয়।":
        "native": "At Christmas there are songs in the church."
        "bases":
          "বড়দিনে":
            "meaning": "Christmas"
      "বড়দিনের ছুটি কবে?":
        "native": "When is the Christmas holiday?"
        "bases":
          "বড়দিনের":
            "meaning": "Christmas"
  "bn-1641":
    "native": "Dol; the spring festival of colours"
    "notes":
      "n1": "{1}, also called Dol Purnima or Dol Jatra, is the spring festival of colours, widely known as Holi."
    "examples":
      "দোলের দিনে সবাই রং খেলে।":
        "native": "On Dol day everyone plays with colours."
        "bases":
          "দোলের":
            "meaning": "Dol"
      "দোল বসন্তে হয়।":
        "native": "Dol is held in spring."
  "bn-1642":
    "native": "Bhai Phonta"
    "notes":
      "n1": "{1}: sisters mark their brothers' foreheads and pray for their long life. It comes soon after Kali Puja."
    "examples":
      "ভাইফোঁটায় বোন ভাইকে ফোঁটা দেয়।":
        "native": "On Bhai Phonta a sister marks her brother's forehead."
        "bases":
          "ভাইফোঁটায়":
            "meaning": "Bhai Phonta"
      "ভাইফোঁটার দিনে ভাই উপহার পায়।":
        "native": "On the day of Bhai Phonta the brother receives a gift."
        "bases":
          "ভাইফোঁটার":
            "meaning": "Bhai Phonta"
  "bn-1643":
    "native": "rakhi; the thread tied on a brother's wrist"
    "notes":
      "n1": "{1} is the thread a sister ties on her brother's wrist at Raksha Bandhan."
    "examples":
      "বোন ভাইয়ের হাতে রাখি বাঁধে।":
        "native": "The sister ties a rakhi on her brother's wrist."
      "রাখির দিনে ভাই বোনকে উপহার দেয়।":
        "native": "On rakhi day the brother gives his sister a gift."
        "bases":
          "রাখির":
            "meaning": "rakhi"
  "bn-1644":
    "native": "god; goddess"
    "notes":
      "n1": "{1} is a god or a goddess."
    "synonyms": {}
    "examples":
      "দুর্গা একজন দেবতা।":
        "native": "Durga is a goddess."
        "bases":
          "দুর্গা":
            "meaning": "Durga"
          "একজন":
            "meaning": "one person"
      "দেবতার সামনে প্রদীপ জ্বলে।":
        "native": "A lamp burns in front of the god."
        "bases":
          "দেবতার":
            "meaning": "god"
          "জ্বলে":
            "meaning": "to burn"
  "bn-1645":
    "native": "idol; a god as worshipped"
    "notes":
      "n1": "{1}: an idol of a god, as it is worshipped in a puja."
    "synonyms": {}
    "examples":
      "পূজা মণ্ডপে ঠাকুর সাজানো হয়।":
        "native": "The idol is decorated in the puja pandal."
        "bases":
          "সাজানো":
            "meaning": "to decorate"
      "ঠাকুরকে ফুল দেওয়া হয়।":
        "native": "Flowers are offered to the idol."
        "bases":
          "ঠাকুরকে":
            "meaning": "idol"
          "ফুল":
            "meaning": "flower"
  "bn-1646":
    "native": "image; statue of a god"
    "notes":
      "n1": "{1} is a statue or image of a god, usually made of clay."
    "examples":
      "প্রতিমা মাটির তৈরি।":
        "native": "The image is made of clay."
        "bases":
          "মাটির":
            "meaning": "clay"
          "তৈরি":
            "meaning": "made"
      "প্রতিমার চোখ খুব সুন্দর।":
        "native": "The image's eyes are very beautiful."
        "bases":
          "প্রতিমার":
            "meaning": "image"
  "bn-1647":
    "native": "pandal; the hall for the puja"
    "notes":
      "n1": "{1} is the temporary hall, or pandal, where the idol stays during the puja."
    "examples":
      "মণ্ডপ সুন্দর করে সাজানো হয়েছে।":
        "native": "The pandal has been decorated beautifully."
        "bases":
          "সাজানো":
            "meaning": "to decorate"
      "মণ্ডপে অনেক মানুষ এসেছে।":
        "native": "Many people have come to the pandal."
        "bases":
          "মণ্ডপে":
            "meaning": "pandal"
          "মানুষ":
            "meaning": "people"
  "bn-1648":
    "native": "prayer"
    "notes":
      "n1": "{1} is a prayer: words said to a god."
    "collocations":
      "kora": "to pray; to say a prayer"
    "examples":
      "সবাই মন্দিরে প্রার্থনা করে।":
        "native": "Everyone prays in the temple."
      "প্রার্থনার পর প্রসাদ দেওয়া হয়।":
        "native": "After the prayer, blessed food is given."
        "bases":
          "প্রার্থনার":
            "meaning": "prayer"
  "bn-1649":
    "native": "blessed food"
    "notes":
      "n1": "{1} is food offered to a god, then shared among everyone."
    "examples":
      "সবাই প্রসাদ খায়।":
        "native": "Everyone eats the blessed food."
      "মন্দিরে প্রসাদ বিতরণ হচ্ছে।":
        "native": "Blessed food is being given out at the temple."
        "bases":
          "বিতরণ":
            "meaning": "distribution"
  "bn-1650":
    "native": "fast"
    "notes":
      "n1": "{1} is fasting: going without food for a religious reason."
    "collocations":
      "kora": "to fast; to keep a fast"
    "examples":
      "আজ আমার উপবাস।":
        "native": "Today I am fasting."
      "অনেকে উপবাস করে।":
        "native": "Many people fast."
        "bases":
          "অনেকে":
            "meaning": "many people"
  "bn-1651":
    "native": "lamp"
    "notes":
      "n1": "{1} is a small oil lamp, lit at festivals."
    "collocations":
      "jalano": "to light"
    "examples":
      "ঘরে ঘরে প্রদীপ জ্বলছে।":
        "native": "Lamps are burning in every house."
        "bases":
          "জ্বলছে":
            "meaning": "to burn"
      "দীপাবলিতে অনেক প্রদীপ জ্বালানো হয়।":
        "native": "At Diwali many lamps are lit."
        "bases":
          "দীপাবলিতে":
            "meaning": "Diwali"
          "জ্বালানো":
            "meaning": "to light"
  "bn-1652":
    "native": "incense"
    "notes":
      "n1": "{1} is incense: sticks that give off a sweet smoke in a puja."
    "collocations":
      "jalano": "to light"
    "examples":
      "ধূপের গন্ধে ঘর ভরে যায়।":
        "native": "The room fills with the smell of incense."
        "bases":
          "ধূপের":
            "meaning": "incense"
          "গন্ধে":
            "meaning": "smell"
      "ধূপ জ্বালিয়ে প্রার্থনা শুরু হলো।":
        "native": "After lighting the incense, the prayer began."
        "bases":
          "জ্বালিয়ে":
            "meaning": "to light"
          "শুরু":
            "meaning": "start"
  "bn-1653":
    "native": "conch shell"
    "notes":
      "n1": "{1} is a conch shell, blown at pujas and at weddings."
    "examples":
      "শঙ্খ বাজছে।":
        "native": "The conch is sounding."
        "bases":
          "বাজছে":
            "meaning": "to sound"
      "মায়েরা শঙ্খ বাজায়।":
        "native": "The mothers blow the conch."
        "bases":
          "বাজায়":
            "meaning": "to blow"
  "bn-1654":
    "native": "fireworks"
    "notes":
      "n1": "{1} is fireworks, set off at night during a festival."
    "collocations":
      "photano": "to set off"
    "examples":
      "রাতের আকাশে বাজি ফুটছে।":
        "native": "Fireworks are bursting in the night sky."
        "bases":
          "ফুটছে":
            "meaning": "to burst"
      "বাজি ফোটানো বিপজ্জনক।":
        "native": "Setting off fireworks is dangerous."
        "bases":
          "ফোটানো":
            "meaning": "to set off"
          "বিপজ্জনক":
            "meaning": "dangerous"
  "bn-1655":
    "native": "devotional singing"
    "notes":
      "n1": "{1} is devotional singing with chanting and drums."
    "examples":
      "পূজার রাতে কীর্তন হয়।":
        "native": "Kirtan is held on puja nights."
      "কীর্তনের সুর খুব সুন্দর।":
        "native": "The tune of the kirtan is very beautiful."
        "bases":
          "কীর্তনের":
            "meaning": "kirtan"
          "সুর":
            "meaning": "tune"
  "bn-1656":
    "native": "aarti; the ritual of waving lamps"
    "notes":
      "n1": "{1} is a ritual in which lamps are waved before an idol."
    "examples":
      "সন্ধ্যায় আরতি শুরু হলো।":
        "native": "The aarti began in the evening."
        "bases":
          "শুরু":
            "meaning": "start"
      "সবাই আরতি দেখছে।":
        "native": "Everyone is watching the aarti."
  "bn-1657":
    "native": "garland"
    "notes":
      "n1": "{1} is a garland of flowers, put on an idol or given to a guest."
    "examples":
      "ঠাকুরকে ফুলের মালা পরানো হয়।":
        "native": "A flower garland is put on the idol."
        "bases":
          "ফুলের":
            "meaning": "flower"
          "পরানো":
            "meaning": "to put on"
      "বন্ধুকে মালা উপহার দিলাম।":
        "native": "I gave my friend a garland as a gift."
  "bn-1658":
    "native": "procession"
    "notes":
      "n1": "{1} is a procession: people moving together along the road."
    "examples":
      "পূজার শোভাযাত্রা রাস্তায় বের হলো।":
        "native": "The puja procession came out onto the road."
        "bases":
          "বের":
            "meaning": "out"
      "শোভাযাত্রায় অনেক মানুষ গান গাইছে।":
        "native": "Many people are singing songs in the procession."
        "bases":
          "শোভাযাত্রায়":
            "meaning": "procession"
          "মানুষ":
            "meaning": "people"
          "গাইছে":
            "meaning": "to sing"
  "bn-1659":
    "native": "immersion of an idol in water"
    "notes":
      "n1": "{1} is the immersion of an idol in water at the end of a puja."
    "examples":
      "দশমীর দিনে প্রতিমা বিসর্জন হয়।":
        "native": "On the tenth day the idol is immersed."
        "bases":
          "দশমীর":
            "meaning": "tenth day"
      "বিসর্জনের সময় নদীতে ভিড় হয়।":
        "native": "At the immersion there is a crowd at the river."
        "bases":
          "বিসর্জনের":
            "meaning": "immersion"
          "ভিড়":
            "meaning": "crowd"
  "bn-1661":
    "native": "rice cake"
    "notes":
      "n1": "{1} is a rice cake, a food made at festivals, often in winter."
    "examples":
      "শীতে ঘরে ঘরে পিঠে হয়।":
        "native": "In winter rice cakes are made in every house."
      "মায়েরা পিঠে বানায়।":
        "native": "The mothers make rice cakes."
        "bases":
          "বানায়":
            "meaning": "to make"
  "bn-1662":
    "native": "feast"
    "notes":
      "n1": "{1} is a feast: a big meal for many guests."
    "examples":
      "পূজার পর বড় ভোজ হয়।":
        "native": "After the puja there is a big feast."
      "অতিথিদের জন্য ভোজ দেওয়া হলো।":
        "native": "A feast was given for the guests."
  "bn-1663":
    "native": "invitation"
    "notes":
      "n1": "{1} is an invitation to a meal or a festival."
    "synonyms":
      "nemontonno": "invitation (informal)"
    "examples":
      "আমাদের নিমন্ত্রণ আছে।":
        "native": "We have been invited."
        "bases":
          "আছে":
            "meaning": "to have"
      "পূজার নিমন্ত্রণ পেয়েছি।":
        "native": "I have received an invitation to the puja."
  "bn-1664":
    "native": "gift"
    "notes":
      "n1": "{1} is a gift, given at a festival or a birthday."
    "collocations":
      "deoya": "to give"
    "examples":
      "বন্ধুকে একটি উপহার দিলাম।":
        "native": "I gave a gift to my friend."
        "bases":
          "একটি":
            "meaning": "one; a"
      "উপহারটা খুব সুন্দর।":
        "native": "The gift is very beautiful."
        "bases":
          "উপহারটা":
            "meaning": "gift"
  "bn-1665":
    "native": "guest"
    "notes":
      "n1": "{1} is a guest: a person invited to one's home."
    "examples":
      "অতিথিরা এসেছেন।":
        "native": "The guests have come."
        "bases":
          "অতিথিরা":
            "meaning": "guests"
      "অতিথিকে মিষ্টি দিন।":
        "native": "Give the guest some sweets."
