schema: 1
id: "bn-en-directions"
kind: "layer"
core: "bn-directions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Directions"
description: "Left, right, straight on, and asking where something is."
license: "CC-BY-SA-4.0"
tags: ["beginner"]
cards:
  "bn-0302":
    native: "Where is …?"
    notes:
      "n1": "Put the place first: স্টেশনটা কোথায় (sṭeśonoṭā kothāy)? Where's the station?"
  "bn-0303":
    native: "right (side)"
    notes:
      "n1": "ডান দিকে (ḍān dike), to the right."
    "examples": {
      "মাউসটা ডান দিকে।": {"native": "The mouse is on the right side.", "bases": {"মাউসটা": "mouse", "ডান": "right", "দিকে": "side"}}
    }
  "bn-0304":
    native: "left (side)"
    notes:
      "n1": "বাঁ দিকে (bām̐ dike), to the left. Also বাম (bām)."
  "bn-0305":
    native: "straight on"
    "examples": {
      "তার চুল সোজা।": {"native": "His hair is straight.", "bases": {}},
      "সোজা হয়ে দাঁড়াও।": {"native": "Stand up straight. (familiar)", "bases": {"হয়ে": "having become", "দাঁড়াও": "stand (familiar)"}}
    }
  "bn-0306":
    native: "please turn"
    notes:
      "n1": "ডান দিকে ঘুরুন (ḍān dike ghurun), turn right."
  "bn-0307":
    native: "ahead; in front"
    "examples": {
      "বিচারকের সামনে যাও।": {"native": "Go in front of the judge. (familiar)", "bases": {"বিচারকের": "judge", "সামনে": "in front"}},
      "দম্পতি বাড়ির সামনে দাঁড়ালেন।": {"native": "The couple stood in front of the house.", "bases": {"সামনে": "ahead; in front"}}
    }
  "bn-0308":
    native: "behind; at the back"
  "bn-0309":
    native: "near"
    notes:
      "n1": "স্টেশনের কাছে (sṭeśoner kāche), near the station."
    "examples": {
      "চট্টগ্রাম সমুদ্রের কাছে।": {"native": "Chittagong is near the sea.", "bases": {"কাছে": "near"}},
      "স্কুল বাড়ির কাছে।": {"native": "The school is near the house.", "bases": {"কাছে": "near; (to have on you)"}}
    }
  "bn-0310":
    native: "far"
    notes:
      "n1": "কত দূর (kôto dur)? How far is it?"
    "examples": {
      "খালার বাড়ি দূরে।": {"native": "Aunt's house is far away.", "bases": {"খালার": "aunt", "দূরে": "far"}}
    }
  "bn-0311":
    native: "here"
    "examples": {
      "এখানে থামুন।": {"native": "Stop here, please.", "bases": {}},
      "এখানে নামুন।": {"native": "Get off here. (respectful)", "bases": {}}
    }
  "bn-0312":
    native: "there"
  "bn-0313":
    native: "road; street"
    "examples": {
      "রাস্তাটা ঝুঁকিপূর্ণ।": {"native": "The road is risky.", "bases": {"রাস্তাটা": "road; street"}},
      "রাস্তায় জ্যাম।": {"native": "There is a jam on the road.", "bases": {"রাস্তায়": "road; street"}}
    }
  "bn-0314":
    native: "crossing; corner"
    notes:
      "n1": "Directions are often given by crossings: শ্যামবাজার মোড় (śêmobājār moṛ), the Shyambazar crossing in Kolkata."
    "examples": {
      "দোকানটা মোড়ের উল্টোদিকে।": {"native": "The shop is opposite the corner.", "bases": {"মোড়ের": "crossing; corner"}},
      "কাহিনিতে নতুন মোড় আছে।": {"native": "The plot has a new turn.", "bases": {"কাহিনিতে": "story; plot", "আছে": "has", "মোড়": "crossing; corner"}}
    }
