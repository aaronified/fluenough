  notes: "Basic Bangla (4.4 to 4.9) sorts verbs into ten types by their vowels, and every verb of a type changes the same way. Type 1, অ-আ (ô-ā): পড়া (pôṛā), like করা (kôrā) and বলা (bôlā). Type 2, আ-আ (ā-ā): জানা (jānā), থাকা (thākā), আনা (ānā); the -এছি (-echi) past turns আ (ā) into এ (e): জেনেছি (jenechi), এনেছি (enechi). Type 3, এ-আ (e-ā): লেখা (lekhā), শেখা (śekhā), কেনা (kenā), and type 5, ও-আ (o-ā): বোঝা (bojhā), শোনা (śonā), খোঁজা (khom̐jā). Here এ (e) becomes ই (i) and ও (o) becomes উ (u) in every form but the present of তুমি (tumi), সে (se) and আপনি (āpni): লিখি (likhi), লিখেছি (likhechi), লিখব (likhob), but সে লেখে (se lekhe). Type 4, অ্যা-আ (ê-ā): দেখা (dekhā), whose এ (e) is the a of 'cat' in দেখা (dekhā) and দেখে (dekhe), and a plain e in দেখি (dekhi). Type 6, এ-ও-আ (e-o-ā): দেওয়া (deoyā), নেওয়া (neoyā): দিই (dii), দিয়েছি (diyechi), দিলাম (dilām), but দেয় (dey) and দেব (deb). Type 7, যাওয়া (jāoyā), takes গ- (gô-) in the past: গিয়েছি (giyechi), also said গেছি (gechi), and গেলাম (gelām). Type 7a, খাওয়া (khāoyā), which Basic Bangla gives with চাওয়া (cāoā); পাওয়া (pāoyā) goes the same way: খেয়েছি (kheyechi), খেলাম (khelām). Type 8, ও-ও-আ (o-o-ā): ধোয়া (dhoyā), which Basic Bangla writes ধোওয়া (dhooyā). Type 9, অ-ও-আ (ô-o-ā): হওয়া (hôoyā). Type 10, ঔ-আ-ও (ou-ā-o): দৌড়ানো (douṛāno), পৌঁছানো (poum̐chāno). In speech the আ (ā) of these verbs is often an ও (o), as in ঘুমোচ্ছি (ghumocchi) for ঘুমাচ্ছি (ghumācchi); the table shows Basic Bangla's forms and accepts both. 'Didn't' is the present with -নি (-ni) joined on: লিখিনি (likhini), সে লেখেনি (se lekheni)."
