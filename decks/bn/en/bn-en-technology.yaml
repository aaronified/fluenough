schema: 1
id: "bn-en-technology"
kind: "layer"
core: "bn-technology"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Technology"
description: "Machines, software and the internet: downloading, updating, logging in, and the parts of a computer. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-3245":
    native: "technology"
    notes:
      "n1": "{1}: Technology: the tools and methods that make work easier."
    examples:
      "নতুন প্রযুক্তি এসেছে।": "New technology has arrived."
      "প্রযুক্তির দাম কমছে।": { native: "The price of technology is falling.", bases: { "প্রযুক্তির": "technology", "কমছে": "falling" } }
  "bn-3246":
    native: "software"
    notes:
      "n1": "{1}: Software: the programs a computer runs."
    examples:
      "সফটওয়্যারটা নতুন।": { native: "The software is new.", bases: { "সফটওয়্যারটা": "software" } }
      "ভালো সফটওয়্যার দরকার।": "Good software is needed."
  "bn-3247":
    native: "keyboard"
    notes:
      "n1": "{1}: A keyboard: the row of keys you type on."
    examples:
      "কিবোর্ডে বাংলা লেখো।": { native: "Type Bengali on the keyboard. (familiar)", bases: { "কিবোর্ডে": "keyboard", "লেখো": "write" } }
      "কিবোর্ডটা ভাঙা।": { native: "The keyboard is broken.", bases: { "কিবোর্ডটা": "keyboard" } }
  "bn-3248":
    native: "mouse"
    notes:
      "n1": "{1}: A mouse: a small device for pointing on a computer screen."
    examples:
      "মাউসটা ডান দিকে।": { native: "The mouse is on the right side.", bases: { "মাউসটা": "mouse", "ডান": "right", "দিকে": "side" } }
      "মাউস নিয়ে কাজ করো।": { native: "Work with the mouse. (familiar)", bases: { "নিয়ে": "with" } }
  "bn-3249":
    native: "signal"
    notes:
      "n1": "{1}: A signal: the sign that carries a call or message."
    examples:
      "সিগন্যাল নেই।": { native: "There is no signal.", bases: { "নেই": "there is not" } }
      "সিগন্যাল ভালো হলে ফোন করো।": "If the signal is good, call. (familiar)"
  "bn-3250":
    native: "download"
    notes:
      "n1": "{1}: A download: a file copied from the internet to a device."
    examples:
      "ডাউনলোডটা শেষ।": { native: "The download is finished.", bases: { "ডাউনলোডটা": "download", "শেষ": "finished" } }
      "ডাউনলোড ধীর।": { native: "The download is slow.", bases: { "ধীর": "slow" } }
  "bn-3251":
    native: "upload"
    notes:
      "n1": "{1}: An upload: a file sent from a device to the internet."
    examples:
      "আপলোডের আগে ছবিটা দেখো।": { native: "Look at the photo before uploading. (familiar)", bases: { "আপলোডের": "upload" } }
      "আপলোড শেষ হয়েছে।": { native: "The upload has finished.", bases: { "শেষ": "finished" } }
  "bn-3252":
    native: "installation"
    notes:
      "n1": "{1}: An installation: setting up a program on a device."
    examples:
      "ইনস্টল হয়ে গেছে।": "The installation has finished."
      "ইনস্টলের জন্য সময় লাগে।": { native: "Installation takes time.", bases: { "ইনস্টলের": "installation", "জন্য": "for" } }
  "bn-3253":
    native: "update"
    notes:
      "n1": "{1}: An update: a new version of a program."
    examples:
      "আপডেট এসেছে।": "An update has come."
      "আপডেটটা বড়।": { native: "The update is big.", bases: { "আপডেটটা": "update" } }
  "bn-3254":
    native: "data"
    notes:
      "n1": "{1}: Data: information stored or sent by a computer."
    examples:
      "ডেটা শেষ হয়ে গেছে।": { native: "The data has run out.", bases: { "শেষ": "run out" } }
      "ডেটা কিনতে হবে।": "I will have to buy data."
  "bn-3255":
    native: "robot"
    notes:
      "n1": "{1}: A robot: a machine that does work by itself."
    examples:
      "রোবট কাজ করছে।": "The robot is working."
      "রোবটটা নতুন।": { native: "The robot is new.", bases: { "রোবটটা": "robot" } }
  "bn-3256":
    native: "intelligence"
    notes:
      "n1": "{1}: Intelligence: the ability to think and learn."
    examples:
      "কৃত্রিম বুদ্ধিমত্তা নিয়ে কথা হচ্ছে।": { native: "They are talking about artificial intelligence.", bases: { "কৃত্রিম": "artificial", "নিয়ে": "about" } }
      "তার বুদ্ধিমত্তা ভালো।": "His intelligence is good."
  "bn-3257":
    native: "code"
    notes:
      "n1": "{1}: Code: the written instructions of a program."
    examples:
      "কোডটা ভুল।": { native: "The code is wrong.", bases: { "কোডটা": "code" } }
      "কোড লেখা শেখো।": "Learn to write code. (familiar)"
  "bn-3258":
    native: "program"
    notes:
      "n1": "{1}: A program: a set of instructions a computer runs."
    examples:
      "এই প্রোগ্রামটা ভালো।": { native: "This program is good.", bases: { "এই": "this", "প্রোগ্রামটা": "program" } }
      "প্রোগ্রাম চালু করো।": { native: "Start the program. (familiar)", bases: { "চালু": "on; running" } }
  "bn-3259":
    native: "fault; error"
    notes:
      "n1": "{1}: A fault or error: a mistake that stops something working."
    examples:
      "একটা ত্রুটি আছে।": { native: "There is a fault.", bases: { "আছে": "there is" } }
      "ত্রুটিটা ঠিক করো।": { native: "Fix the fault. (familiar)", bases: { "ত্রুটিটা": "fault; error", "ঠিক": "fix" } }
  "bn-3260":
    native: "user"
    notes:
      "n1": "{1}: A user: a person who uses a device or program."
    examples:
      "ব্যবহারকারী অনেক।": "There are many users."
      "নতুন ব্যবহারকারীদের সাহায্য করো।": { native: "Help the new users. (familiar)", bases: { "ব্যবহারকারীদের": "user" } }
  "bn-3261":
    native: "login"
    notes:
      "n1": "{1}: A login: the sign-in to an account."
    examples:
      "লগইন করা যাচ্ছে না।": { native: "I cannot log in.", bases: { "যাচ্ছে": "can", "না": "not" } }
      "লগইনের পাসওয়ার্ড কী?": { native: "What is the login password?", bases: { "লগইনের": "login", "কী": "what" } }
  "bn-3262":
    native: "menu"
    notes:
      "n1": "{1}: A menu: a list of choices on a screen or in a restaurant."
    examples:
      "মেনু খোলো।": "Open the menu. (familiar)"
      "মেনুতে সেটিংস আছে।": { native: "There are settings in the menu.", bases: { "মেনুতে": "menu", "আছে": "there are" } }
  "bn-3263":
    native: "icon"
    notes:
      "n1": "{1}: An icon: a small picture on a screen that opens something."
    examples:
      "আইকনে ক্লিক করো।": { native: "Click the icon. (familiar)", bases: { "আইকনে": "icon", "ক্লিক": "click" } }
      "আইকনটা নতুন।": { native: "The icon is new.", bases: { "আইকনটা": "icon" } }
  "bn-3264":
    native: "settings"
    notes:
      "n1": "{1}: Settings: the choices that control how a device works."
    examples:
      "সেটিংস বদলাও।": { native: "Change the settings. (familiar)", bases: { "বদলাও": "change" } }
      "সেটিংসে যাও।": { native: "Go to the settings. (familiar)", bases: { "সেটিংসে": "settings" } }
  "bn-3265":
    native: "memory"
    notes:
      "n1": "{1}: Memory: the space in a device where it keeps information."
    examples:
      "ফোনের মেমরি ভরা।": "The phone's memory is full."
      "মেমরি বাড়াও।": { native: "Increase the memory. (familiar)", bases: { "বাড়াও": "increase" } }
  "bn-3266":
    native: "chip"
    notes:
      "n1": "{1}: A chip: a small piece of electronics inside a device."
    examples:
      "চিপটা গরম হয়েছে।": { native: "The chip has become hot.", bases: { "চিপটা": "chip" } }
      "নতুন চিপ লাগবে।": "A new chip will be needed."
  "bn-3267":
    native: "solar power"
    notes:
      "n1": "{1}: Solar power: energy from the sun."
    examples:
      "সৌরশক্তিতে চার্জ হয়।": { native: "It is charged by solar power.", bases: { "সৌরশক্তিতে": "solar power", "চার্জ": "charge" } }
      "সৌরশক্তি পরিষ্কার।": "Solar power is clean."
  "bn-3268":
    native: "machine"
    notes:
      "n1": "{1}: A machine or instrument: a device that does work."
    examples:
      "যন্ত্রটা বন্ধ।": { native: "The machine is off.", bases: { "যন্ত্রটা": "machine" } }
      "যন্ত্র চালানো শেখো।": { native: "Learn to run the machine. (familiar)", bases: { "চালানো": "run" } }
  "bn-3269":
    native: "invention"
    notes:
      "n1": "{1}: Invention: a new thing made for the first time."
    examples:
      "এটা একটা নতুন উদ্ভাবন।": "This is a new invention."
      "উদ্ভাবনের গল্প শুনলাম।": { native: "I heard the story of the invention.", bases: { "উদ্ভাবনের": "invention", "শুনলাম": "heard" } }
  "bn-3270":
    native: "laptop"
    notes:
      "n1": "{1}: A laptop: a small portable computer."
    examples:
      "ল্যাপটপটা আমার।": { native: "The laptop is mine.", bases: { "ল্যাপটপটা": "laptop" } }
      "ল্যাপটপে কাজ করো।": { native: "Work on the laptop. (familiar)", bases: { "ল্যাপটপে": "laptop" } }
  "bn-3271":
    native: "tablet"
    notes:
      "n1": "{1}: A tablet: a flat portable screen device."
    examples:
      "ট্যাবলেটে ছবি দেখো।": { native: "Look at photos on the tablet. (familiar)", bases: { "ট্যাবলেটে": "tablet" } }
      "ট্যাবলেটটা ভারী না।": { native: "The tablet is not heavy.", bases: { "ট্যাবলেটটা": "tablet", "না": "not" } }
  "bn-3272":
    native: "speaker"
    notes:
      "n1": "{1}: A speaker: a device that makes sound."
    examples:
      "স্পিকারে গান বাজছে।": { native: "Music is playing on the speaker.", bases: { "স্পিকারে": "speaker", "গান": "song", "বাজছে": "playing" } }
      "স্পিকারটা জোরে।": { native: "The speaker is loud.", bases: { "স্পিকারটা": "speaker" } }
  "bn-3273":
    native: "headphones"
    notes:
      "n1": "{1}: Headphones: a device worn on the ears to listen privately."
    examples:
      "হেডফোন কানে লাগাও।": { native: "Put the headphones on your ears. (familiar)", bases: { "লাগাও": "put on" } }
      "হেডফোনটা ভালো।": { native: "The headphones are good.", bases: { "হেডফোনটা": "headphones" } }
  "bn-3274":
    native: "microphone"
    notes:
      "n1": "{1}: A microphone: a device that picks up sound."
    examples:
      "মাইক্রোফোনে কথা বলো।": { native: "Speak into the microphone. (familiar)", bases: { "মাইক্রোফোনে": "microphone" } }
      "মাইক্রোফোনটা ঠিক আছে।": { native: "The microphone is working.", bases: { "মাইক্রোফোনটা": "microphone", "ঠিক": "working", "আছে": "is" } }
  "bn-3275":
    native: "wire; cable"
    notes:
      "n1": "{1}: A wire or cable: a thin metal line that carries electricity."
    examples:
      "তারটা ছেঁড়া।": { native: "The wire is torn.", bases: { "তারটা": "wire; cable", "ছেঁড়া": "torn" } }
      "তার দিয়ে সংযোগ দাও।": { native: "Connect with a wire. (familiar)", bases: { "সংযোগ": "connection" } }
  "bn-3276":
    native: "search"
    notes:
      "n1": "{1}: A search: looking for information on a device."
    examples:
      "অনুসন্ধান করো।": "Search. (familiar)"
      "অনুসন্ধানের ফল কী?": { native: "What is the result of the search?", bases: { "অনুসন্ধানের": "search", "কী": "what" } }
  "bn-3277":
    native: "webcam"
    notes:
      "n1": "{1}: A webcam: a camera for video calls on a computer."
    examples:
      "ওয়েবক্যামটা চালু আছে।": { native: "The webcam is switched on.", bases: { "ওয়েবক্যামটা": "webcam", "চালু": "on; running", "আছে": "is" } }
      "ওয়েবক্যাম দিয়ে কথা বলো।": "Talk using the webcam. (familiar)"
  "bn-3278":
    native: "Bluetooth"
    notes:
      "n1": "{1}: Bluetooth: a short-range wireless link between devices."
    examples:
      "ব্লুটুথ চালু করো।": { native: "Turn on Bluetooth. (familiar)", bases: { "চালু": "on; running" } }
      "ব্লুটুথ কাজ করছে না।": { native: "Bluetooth is not working.", bases: { "না": "not" } }
  "bn-3279":
    native: "digital"
    notes:
      "n1": "{1}: Digital: using computer data, not on paper."
    examples:
      "ডিজিটাল ছবি সুন্দর।": "Digital photos are beautiful."
      "এটা ডিজিটাল ঘড়ি।": "This is a digital clock."
  "bn-3280":
    native: "smart"
    notes:
      "n1": "{1}: Smart: clever, or using computer control."
    examples:
      "স্মার্ট ফোনটা নতুন।": "The smart phone is new."
      "স্মার্ট ঘড়ি দামি।": "A smart watch is expensive."
  "bn-3281":
    native: "offline"
    notes:
      "n1": "{1}: Offline: not connected to the internet."
    examples:
      "ফোনটা অফলাইন।": "The phone is offline."
      "অফলাইনে কাজ করো।": { native: "Work offline. (familiar)", bases: { "অফলাইনে": "offline" } }
  "bn-3282":
    native: "wireless"
    notes:
      "n1": "{1}: Wireless: without wires."
    examples:
      "ওয়্যারলেস মাউস কিনেছি।": "I have bought a wireless mouse."
      "ওয়্যারলেস সংযোগ আছে।": { native: "There is a wireless connection.", bases: { "সংযোগ": "connection", "আছে": "there is" } }
  "bn-3283":
    native: "to download"
    notes:
      "n1": "{1}: To download: to copy a file from the internet."
    examples:
      "আমি একটা ছবি ডাউনলোড করেছি।": "I have downloaded a picture."
      "ডাউনলোড করো।": "Download it. (familiar)"
  "bn-3284":
    native: "to upload"
    notes:
      "n1": "{1}: To upload: to send a file to the internet."
    examples:
      "ছবিটা আপলোড করো।": "Upload the picture. (familiar)"
      "আমরা ভিডিও আপলোড করেছি।": "We have uploaded the video."
  "bn-3285":
    native: "to install"
    notes:
      "n1": "{1}: To install: to set up a program on a device."
    examples:
      "অ্যাপটা ইনস্টল করো।": "Install the app. (familiar)"
      "কাল ইনস্টল করা হবে।": { native: "It will be installed tomorrow.", bases: { "কাল": "tomorrow" } }
  "bn-3286":
    native: "to update"
    notes:
      "n1": "{1}: To update: to install the newest version."
    examples:
      "ফোনটা আপডেট করো।": "Update the phone. (familiar)"
      "আমি আপডেট করেছি।": "I have updated it."
  "bn-3287":
    native: "to click"
    bases: { "ক্লিক": "click" }
    notes:
      "n1": "{1}: To click: to press a button on a screen or mouse."
    examples:
      "বোতামে ক্লিক করো।": { native: "Click the button. (familiar)", bases: { "ক্লিক": "click" } }
      "একবার ক্লিক করলে খুলবে।": { native: "It will open if you click once.", bases: { "একবার": "once", "ক্লিক": "click" } }
  "bn-3288":
    native: "to search"
    notes:
      "n1": "{1}: To search: to look for information."
    examples:
      "আমি ইন্টারনেটে অনুসন্ধান করছি।": "I am searching the internet."
      "অনুসন্ধান করে দেখো।": "Search and see. (familiar)"
  "bn-3289":
    native: "to switch on"
    bases: { "চালু": "on; running" }
    notes:
      "n1": "{1}: To switch on: to start a device or program."
    examples:
      "ফোনটা চালু করো।": { native: "Switch on the phone. (familiar)", bases: { "চালু": "on; running" } }
      "মেশিন চালু করা হয়েছে।": { native: "The machine has been switched on.", bases: { "মেশিন": "machine", "চালু": "on; running" } }
  "bn-3290":
    native: "to log in"
    notes:
      "n1": "{1}: To log in: to sign in to an account."
    examples:
      "আমি লগইন করেছি।": "I have logged in."
      "লগইন করো।": "Log in. (familiar)"
  "bn-3291":
    native: "automatically"
    notes:
      "n1": "{1}: Automatically: by itself, without a person doing it."
    examples:
      "ফোন স্বয়ংক্রিয়ভাবে আপডেট হয়।": "The phone updates automatically."
      "দরজাটা স্বয়ংক্রিয়ভাবে বন্ধ হয়।": "The door closes automatically."
  "bn-3292":
    native: "free of charge"
    notes:
      "n1": "{1}: Free of charge: at no cost."
    examples:
      "এই অ্যাপটা বিনামূল্যে।": { native: "This app is free.", bases: { "এই": "this" } }
      "ওয়াইফাই বিনামূল্যে পাওয়া যায়।": "Wi-fi can be had for free."
  "bn-3293":
    native: "immediately"
    notes:
      "n1": "{1}: Immediately: at once."
    examples:
