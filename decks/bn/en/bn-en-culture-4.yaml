name: "Culture: twentieth-century fiction and poetry"
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
description: "Short lines from novels by Bibhutibhushan Bandyopadhyay and Sarat Chandra Chattopadhyay, poems by Jibanananda Das and Sukanta Bhattacharya, an essay by Jagadish Chandra Bose and sonnets by Pramatha Chaudhuri, all in the public domain. Each shows who wrote it, when, and where it comes from. Not yet checked by a Bengali speaker: please report any mistake."

cards:
  "bn-5850":
    native: "Shankar was a boy from a thoroughly remote village."
    notes:
      "n1": "The first sentence of the story proper, after a cry of warning that the Wikisource text prints as an epigraph at the top of the chapter. It goes on to say that he has just passed his F.A. examination and is sitting at home in the village. The English Wikipedia article calls the book an adventure novel about a young Bengali man in the forests of Africa in 1909 and 1910."
  "bn-5851":
    native: "At the far northern edge of the village of Nishchindipur stands Harihar Ray's small house."
    notes:
      "n1": "The opening sentence of the novel. The sentences after it, on the Wikisource page, say that Harihar is an ordinary householder who lives on the small income of his ancestral land and on gifts from a few disciples. The English Wikipedia article says the novel first appeared as a serial in a Calcutta periodical in 1928 and as a book in 1929, and that it was the author's first published novel."
  "bn-5852":
    native: "One day at noon in the month of Baishakh the sun had no end and the heat had no limit."
    notes:
      "n1": "The first sentence of the novel. The next sentence puts Devdas, a boy of the Mukhujje family, in the corner of the village school room on a torn mat, and the sentences after it describe the boys playing outside in the lunch break. The English Wikipedia article gives 30 June 1917 as the publication date."
  "bn-5853":
    native: "Standing in the late afternoon of this wandering life of mine, and sitting down to tell one chapter of it, how many things I remember today!"
    notes:
      "n1": "The first sentence of part one, spoken by the narrator Srikanta. The next paragraph says that since childhood he has heard only a steady chorus of shame from relatives and strangers alike. The English Wikipedia article lists the four parts as 1917, 1918, 1927 and 1933."
  "bn-5854":
    native: "Gurucharan was a bank clerk on a salary of sixty rupees."
    notes:
      "n1": "The second sentence of the novel. The next sentence says that his body was as dry and thin as a hired cab's horse. The English Wikipedia article calls the book a 1914 novel of social protest, set in Calcutta early in the twentieth century."
  "bn-5855":
    native: "Apurba and his friends often argued in the following way."
    notes:
      "n1": "The first sentence of the novel, the start of a short dialogue between Apurba and his friends, who tell him that although he has passed his M.Sc. he still keeps a tuft of hair. The English Wikipedia article says the novel was first published in 1926 after being serialized in the journal Bangabani, and that the British government banned it on 4 January 1927."
  "bn-5856":
    native: "For a thousand years I have been walking the roads of the earth,"
    notes:
      "n1": "The first line of one of the best-loved Bengali poems. The Bengali Wikipedia article says that Buddhadeb Bose first printed it in his magazine Kavita in December 1935, and that Jibanananda Das put it in his third book, Banalata Sen, in December 1942. The poem ends each of its three verses with the name of Banalata Sen of Natore."
  "bn-5857":
    native: "I will come back again to the bank of the Dhanshiri, to this Bengal"
    notes:
      "n1": "The first line of a poem of fourteen lines. The next line says he may return not as a man but as a kite or a myna. The same article says the poet did not publish the book or any poem in it in his lifetime, and that his notebook of poems was found after his death in 1954."
  "bn-5858":
    native: "That day too this field will not fall silent, I know,"
    notes:
      "n1": "The first line of the short poem that opens the book. It goes on to ask whether the chaltaful flower will no longer be wet with dew once the poet is gone. The Bengali Wikipedia article calls Rupasi Bangla his seventh book of poems and says it first appeared in 1957."
  "bn-5859":
    native: "So the runner dashes off, and his bell jingles in the night."
    notes:
      "n1": "A poem about the night mail runner, who carries the news along the roads in the dark. The first lines repeat the word runner again and again, and a few lines later it says he has taken the job of bringing new news."
  "bn-5860":
    native: "Great life, no more of this kind of poetry."
    notes:
      "n1": "The poem turns away from soft verse. The lines after it ask for harsh prose instead, saying that the ring and polish of verse should be wiped away and that the hard hammer of prose should be struck today."
  "bn-5861":
    native: "The present is built from the old; if the history of the past is not known, the present and the future will stay unknowable."
    notes:
      "n1": "The first sentence of the opening piece of the book, a collection of Bengali essays by the scientist. The piece goes on to describe a painting of a prince watching the crowds from his palace, and a calm statue of the Buddha cut into a mountainside."
  "bn-5862":
    native: "Clasping Petrarch's feet, I bind my verse in metre,"
    notes:
      "n1": "The first line of the first of the fifty sonnets in the book. The lines after it speak of Petrarch as the one whose genius took form on earth in the sonnet, and say he alone has been accepted as teacher, though there is no direct link between teacher and pupil."
  "bn-5863":
    native: "Shah Jahan's white monument, firm and beautiful!"
    notes:
      "n1": "The first line of a sonnet on the Taj Mahal. The next lines say its body is made of marble and its inside is set with sapphire, emerald and topaz."
  "bn-5864":
    native: "The graceful clove creeper sways in the breeze."
    notes:
      "n1": "The first line of a sonnet titled Joydeb. The next line says that colour and scent are mixed together in the spring."
  "bn-5865":
    native: "Such people are like a straw fire, says the sentence."
    notes:
      "n1": "The opening sentence of the author's first published novel. It goes on to say that such people need someone behind them who supplies straw when it is needed, and the third paragraph says that the young man Surendranath is somewhat like this."
  "bn-5866":
    native: "In the village he was known as a helper of others, but equally as a stubborn man."
    notes:
      "n1": "The sentence describes Nilambar, the elder of two brothers who live in Saptagram in the district of Hooghly. The sentence before it says he was a man of great strength, and the page goes on to say that his younger brother Pitambar was of a very different nature."
  "bn-5867":
    native: "Beni Ghoshal steps into the courtyard and asks an older woman, \"There you are, aunt, where is Rama?\""
    notes:
      "n1": "The first sentence of the novel. The aunt points to the kitchen, and Beni asks Rama what she will do about the funeral rites of her uncle Tarini, now that his son Ramesh has arrived."
