schema: 1
id: "bn-en-weddings"
kind: "layer"
core: "bn-weddings"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Weddings"
description: "The invitation, the rites and the guests at a wedding: the groom and the bride, the turmeric rite, the mehendi and the ululation. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-3752":
    native: "wedding; marriage"
    notes:
      "n1": "{1}: A wedding or a marriage: the ceremony that joins two people."
    examples:
      "বিয়ের দিন সবাই এল।": { native: "Everyone came on the wedding day.", bases: { "বিয়ের": "wedding; marriage" } }
      "বিয়েটা সুন্দর হলো।": { native: "The wedding was beautiful.", bases: { "বিয়েটা": "wedding; marriage" } }
  "bn-3753":
    native: "groom"
    notes:
      "n1": "{1}: A groom: a man who is getting married."
    examples:
      "বর সাদা পাঞ্জাবি পরেছেন।": "The groom is wearing a white punjabi."
      "বরের বন্ধুরা গান গাইছে।": { native: "The groom's friends are singing.", bases: { "বরের": "groom" } }
  "bn-3754":
    native: "bride"
    notes:
      "n1": "{1}: A bride: a woman who is getting married."
    examples:
      "কনে লাল শাড়ি পরেছে।": "The bride is wearing a red sari."
      "কনের মুখ খুশিতে ভরা।": { native: "The bride's face is full of joy.", bases: { "কনের": "bride" } }
  "bn-3755":
    native: "groom's party"
    notes:
      "n1": "{1}: The groom's party: the guests who go with the groom to the bride's house."
    examples:
      "বরযাত্রীরা সকালে এল।": "The groom's party came in the morning."
      "বরযাত্রীদের খাবারের আয়োজন হলো।": { native: "Food was arranged for the groom's party.", bases: { "বরযাত্রীদের": "groom's party" } }
  "bn-3756":
    native: "invited guest"
    notes:
      "n1": "{1}: An invited guest: a person who has been asked to a wedding or a meal."
    examples:
      "নিমন্ত্রিতরা খেতে বসলেন।": "The invited guests sat down to eat."
      "নিমন্ত্রিত অতিথিদের নাম লেখা হলো।": "The names of the invited guests were written down."
  "bn-3757":
    native: "blessing"
    notes:
      "n1": "{1}: A blessing: a wish of good luck given by an elder."
    examples:
      "বড়দের আশীর্বাদ নিলাম।": "I received the blessings of the elders."
      "তোমার আশীর্বাদ চাই।": "I want your blessing. (familiar)"
  "bn-3758":
    native: "turmeric rite"
    notes:
      "n1": "{1}: The turmeric rite: a ceremony before a wedding when turmeric is put on the bride or the groom."
    examples:
      "গায়ে হলুদের অনুষ্ঠান আজ।": "The turmeric ceremony is today."
      "গায়ে হলুদে সবাই নাচল।": "Everyone danced at the turmeric rite."
  "bn-3759":
    native: "vermilion"
    notes:
      "n1": "{1}: Vermilion: red powder put in the parting of a married woman's hair."
    examples:
      "কনের মাথায় সিঁদুর পরানো হলো।": { native: "Vermilion was put on the bride's head.", bases: { "পরানো": "put on" } }
      "সিঁদুরের রং লাল।": { native: "The colour of vermilion is red.", bases: { "সিঁদুরের": "vermilion" } }
  "bn-3760":
    native: "Banarasi sari"
    notes:
      "n1": "{1}: A Banarasi sari: a silk sari from Varanasi, worn at weddings."
    examples:
      "বেনারসিটা খুব দামি।": { native: "The Banarasi sari is very costly.", bases: { "বেনারসিটা": "Banarasi sari" } }
      "বিয়েতে বেনারসি পরা হয়।": { native: "A Banarasi sari is worn at weddings.", bases: { "বেনারসি": "Banarasi sari" } }
  "bn-3761":
    native: "priest"
    notes:
      "n1": "{1}: A priest: the person who performs the wedding rites."
    examples:
      "পুরোহিত মন্ত্র পড়লেন।": "The priest recited the mantras."
      "পুরোহিতের কথায় সবাই বসল।": { native: "At the priest's word, everyone sat down.", bases: { "পুরোহিতের": "priest" } }
  "bn-3762":
    native: "mantra"
    notes:
      "n1": "{1}: A mantra: a sacred verse said in a ritual."
    examples:
      "মন্ত্রগুলো স্পষ্টভাবে পড়া হলো।": { native: "The mantras were recited clearly.", bases: { "মন্ত্রগুলো": "mantra", "স্পষ্টভাবে": "clearly" } }
      "মন্ত্র শুনে মন ভালো হলো।": "Hearing the mantras, the mind became calm."
  "bn-3763":
    native: "arrangements"
    notes:
      "n1": "{1}: Arrangements: the planning and preparation of an event."
    examples:
      "বিয়ের আয়োজন বড়।": "The wedding arrangements are big."
      "আয়োজনে অনেক সময় লেগেছে।": { native: "The arrangements took a lot of time.", bases: { "আয়োজনে": "arrangements" } }
  "bn-3764":
    native: "adornment"
    notes:
      "n1": "{1}: Adornment: the dress and jewellery worn to look beautiful."
    examples:
      "কনের সাজ খুব সুন্দর।": "The bride's adornment is very beautiful."
      "সাজ শেষ হতে অনেক সময় লাগল।": { native: "Finishing the adornment took a long time.", bases: { "শেষ": "finishing" } }
  "bn-3765":
    native: "mehendi"
    notes:
      "n1": "{1}: Mehendi: henna designs drawn on the hands before a wedding."
    examples:
      "হাতে মেহেন্দি লাগানো হলো।": { native: "Henna was put on the hands.", bases: { "লাগানো": "put on" } }
      "মেহেন্দির রং গাঢ় হলো।": { native: "The colour of the henna became dark.", bases: { "মেহেন্দির": "mehendi", "গাঢ়": "dark" } }
  "bn-3766":
    native: "marriage"
    notes:
      "n1": "{1}: Marriage: the formal union of two people, a formal word."
    examples:
      "বিবাহ একটি বড় সিদ্ধান্ত।": "Marriage is a big decision."
      "তাদের বিবাহ রেজিস্ট্রি হলো।": { native: "Their marriage was registered.", bases: { "রেজিস্ট্রি": "registered" } }
  "bn-3767":
    native: "couple"
    notes:
      "n1": "{1}: A couple: a husband and a wife."
    examples:
      "দম্পতি বাড়ির সামনে দাঁড়ালেন।": "The couple stood in front of the house."
      "দম্পতির প্রথম বছর খুব ভালো কাটল।": { native: "The couple's first year went very well.", bases: { "দম্পতির": "couple" } }
  "bn-3768":
    native: "wife; bride"
    notes:
      "n1": "{1}: A wife, or a bride: a common, everyday word."
    examples:
      "বউ খুব লাজুক।": { native: "The bride is very shy.", bases: { "লাজুক": "shy" } }
      "বউকে নতুন শাড়ি দিলাম।": { native: "I gave my wife a new sari.", bases: { "বউকে": "wife; bride" } }
  "bn-3769":
    native: "son-in-law"
    notes:
      "n1": "{1}: A son-in-law: a daughter's husband."
    examples:
      "জামাই এসেছে।": "The son-in-law has come."
      "জামাইকে সবাই যত্ন করল।": { native: "Everyone looked after the son-in-law.", bases: { "জামাইকে": "son-in-law" } }
  "bn-3770":
    native: "wedding-night room"
    notes:
      "n1": "{1}: The wedding-night room: the room where a newly married couple spend their first night."
    examples:
      "বাসরে ফুল সাজানো হলো।": "Flowers were arranged in the wedding room."
      "বাসরের গান শুনতে ভালো লাগে।": { native: "It is nice to hear the songs of the wedding room.", bases: { "বাসরের": "wedding-night room" } }
  "bn-3771":
    native: "witness"
    notes:
      "n1": "{1}: A witness: a person who saw something and can say it happened."
    examples:
      "দুজন সাক্ষী সই করলেন।": { native: "Two witnesses signed.", bases: { "দুজন": "two" } }
      "সাক্ষীদের সামনে মালা পরানো হলো।": { native: "The garland was put on in front of the witnesses.", bases: { "সাক্ষীদের": "witness", "পরানো": "put on" } }
  "bn-3772":
    native: "band; music"
    notes:
      "n1": "{1}: Music played by instruments: the band at a wedding."
    examples:
      "বাজনা বাজছে।": "The music is playing."
      "বাজনার শব্দে কান ভরে গেল।": { native: "The sound of the music filled the ears.", bases: { "বাজনার": "band; music" } }
  "bn-3773":
    native: "congratulations"
    notes:
      "n1": "{1}: Congratulations: good wishes for a happy event."
    examples:
      "তোমাকে অভিনন্দন।": "Congratulations to you. (familiar)"
      "সবাই নতুন দম্পতিকে অভিনন্দন জানাল।": { native: "Everyone congratulated the new couple.", bases: { "জানাল": "congratulated" } }
  "bn-3774":
    native: "promise"
    notes:
      "n1": "{1}: A promise: a firm word that one will do something."
    examples:
      "প্রতিশ্রুতি দাও।": "Make a promise. (familiar)"
      "সে তার প্রতিশ্রুতি রেখেছে।": "She has kept her promise."
  "bn-3775":
    native: "household"
    notes:
      "n1": "{1}: A household: the home and the daily life of a married couple."
    examples:
      "তাদের সংসার সুখের।": { native: "Their married life is happy.", bases: { "সুখের": "happy" } }
      "নতুন সংসার শুরু হলো।": "A new household began."
  "bn-3776":
    native: "relationship"
    notes:
      "n1": "{1}: A relationship: a bond between people."
    examples:
      "তাদের সম্পর্ক ভালো।": "Their relationship is good."
      "দুই পরিবারের সম্পর্ক মজবুত।": { native: "The bond between the two families is strong.", bases: { "মজবুত": "strong" } }
  "bn-3777":
    native: "veil"
    notes:
      "n1": "{1}: A veil: a cloth pulled over the head."
    examples:
      "কনের মুখে ঘোমটা।": "A veil over the bride's face."
      "ঘোমটাটা সরিয়ে দেখো।": { native: "Lift the veil and look. (familiar)", bases: { "ঘোমটাটা": "veil", "সরিয়ে": "lift" } }
  "bn-3778":
    native: "crown (groom's)"
    notes:
      "n1": "{1}: A tall crown worn by the groom at a wedding."
    examples:
      "বরের মাথায় টোপর।": "A crown on the groom's head."
      "টোপরটা খুব হালকা।": { native: "The crown is very light.", bases: { "টোপরটা": "crown (groom's)" } }
  "bn-3779":
    native: "ring"
    notes:
      "n1": "{1}: A ring: a band worn on the finger."
    examples:
      "আংটিটা নতুন।": { native: "The ring is new.", bases: { "আংটিটা": "ring" } }
      "বর কনেকে আংটি পরাল।": { native: "The groom put a ring on the bride.", bases: { "আংটি": "ring", "পরাল": "put on" } }
  "bn-3780":
    native: "jewellery"
    notes:
      "n1": "{1}: Jewellery: gold or silver ornaments."
    examples:
      "কনের গহনা খুব দামি।": "The bride's jewellery is very costly."
      "গহনাগুলো বাক্সে রাখো।": { native: "Keep the jewellery in the box. (familiar)", bases: { "গহনাগুলো": "jewellery" } }
  "bn-3781":
    native: "ornament"
    notes:
      "n1": "{1}: An ornament or jewellery, a formal word."
    examples:
      "অলংকারের ওজন বেশি।": { native: "The weight of the ornaments is large.", bases: { "অলংকারের": "ornament" } }
      "সে অনেক অলংকার পরেছে।": "She is wearing many ornaments."
  "bn-3782":
    native: "sandalwood"
    notes:
      "n1": "{1}: Sandalwood paste: a fragrant paste put on the forehead or body."
    examples:
      "কপালে চন্দনের টিপ।": { native: "A sandalwood mark on the forehead.", bases: { "টিপ": "mark" } }
      "চন্দনের গন্ধ ভালো লাগে।": { native: "I like the smell of sandalwood.", bases: { "চন্দনের": "sandalwood" } }
  "bn-3783":
    native: "life"
    notes:
      "n1": "{1}: Life: the time one lives, or the way one lives."
    examples:
      "নতুন জীবন শুরু হলো।": "A new life began."
      "বিবাহিত জীবন সুখের হোক।": { native: "May the married life be happy.", bases: { "বিবাহিত": "married", "সুখের": "happy" } }
  "bn-3784":
    native: "farewell"
    notes:
      "n1": "{1}: Farewell: goodbye when someone leaves."
    examples:
      "বিদায়ের সময় কাঁদলাম।": { native: "I cried at the time of farewell.", bases: { "বিদায়ের": "farewell" } }
      "সবাই বিদায় জানাল।": { native: "Everyone said farewell.", bases: { "জানাল": "said" } }
  "bn-3785":
    native: "welcome rite"
    notes:
      "n1": "{1}: A welcome rite: welcoming a bride or a guest with a ceremony."
    examples:
      "বরণের জন্য সবাই তৈরি।": { native: "Everyone is ready for the welcome.", bases: { "বরণের": "welcome rite", "তৈরি": "ready" } }
      "নতুন বউয়ের বরণ হলো।": { native: "The new bride was welcomed.", bases: { "বরণ": "welcome rite" } }
  "bn-3786":
    native: "ululation"
    notes:
      "n1": "{1}: Ululation: women's high cry of joy at a wedding or a festival."
    examples:
      "উলুধ্বনিতে বাড়ি ভরে গেল।": "The house was filled with ululation."
      "উলুধ্বনি শুনে সবাই এল।": "Everyone came hearing the ululation."
  "bn-3787":
    native: "conch shell"
    notes:
      "n1": "{1}: A conch shell: blown at weddings and rites."
    examples:
      "শাঁখ বাজছে।": "The conch is sounding."
      "শাঁখ আর উলুধ্বনি শুনলাম।": "I heard the conch and the ululation."
  "bn-3788":
    native: "new bride"
    notes:
      "n1": "{1}: A new bride: a woman who has just married."
    examples:
      "নববধূ ঘরে এলেন।": "The new bride came into the house."
      "নববধূকে সবাই আশীর্বাদ করল।": { native: "Everyone blessed the new bride.", bases: { "নববধূকে": "new bride" } }
  "bn-3789":
    native: "affection"
    notes:
      "n1": "{1}: Affection and goodwill: a kind feeling for others."
    examples:
      "তাদের প্রীতি দেখে ভালো লাগল।": "Seeing their affection, I felt good."
      "প্রীতি আর শ্রদ্ধা রাখো।": { native: "Keep affection and respect. (familiar)", bases: { "শ্রদ্ধা": "respect" } }
  "bn-3790":
    native: "caring"
    notes:
      "n1": "{1}: Caring and tenderness: love shown in care."
    examples:
      "মায়ের আদর সবচেয়ে বড়।": { native: "A mother's care is the greatest.", bases: { "সবচেয়ে": "most" } }
      "নববধূকে আদর করা হলো।": "The new bride was shown care."
  "bn-3791":
    native: "bride; wife"
    notes:
      "n1": "{1}: A bride or a wife, a formal word."
    examples:
      "আজ বধূ নতুন ঘরে এল।": "Today the bride came into the new house."
      "বধূর সাজ দেখার মতো ছিল।": { native: "The bride's adornment was worth seeing.", bases: { "বধূর": "bride; wife", "মতো": "like", "ছিল": "was" } }
  "bn-3792":
    native: "sacred"
    notes:
      "n1": "{1}: Sacred or holy: pure and set apart for religious use."
    examples:
      "পবিত্র মন্ত্র পড়া হলো।": "A holy mantra was recited."
      "এই অনুষ্ঠান খুব পবিত্র।": { native: "This ceremony is very sacred.", bases: { "এই": "this" } }
  "bn-3793":
    native: "joyful"
    notes:
      "n1": "{1}: Joyful: full of joy."
    examples:
      "আনন্দময় দিন ছিল।": { native: "It was a joyful day.", bases: { "ছিল": "was" } }
      "বিয়েটা আনন্দময় হলো।": "The wedding became joyful."
  "bn-3794":
    native: "to exchange garlands"
    notes:
      "n1": "{1}: To exchange garlands: the bride and the groom each give the other a garland at the wedding."
    examples:
      "তারা মালা বদল করল।": { native: "They exchanged garlands.", bases: { "বদল": "exchange" } }
      "বর আর কনে সবার সামনে মালা বদল করলেন।": { native: "The groom and the bride exchanged garlands in front of everyone.", bases: { "বদল": "exchange" } }
  "bn-3795":
    native: "to invite"
    notes:
      "n1": "{1}: To invite: to ask someone to a meal or an event."
    examples:
      "সবাইকে নিমন্ত্রণ করলাম।": "I invited everyone."
      "তোমাকেও নিমন্ত্রণ করা হয়েছে।": "You have also been invited. (familiar)"
  "bn-3796":
    native: "to bless"
    notes:
      "n1": "{1}: To bless: to give a blessing to someone."
    examples:
      "বড়রা নববধূকে আশীর্বাদ করলেন।": "The elders blessed the new bride."
      "মা সন্তানকে আশীর্বাদ করেন।": { native: "The mother blesses her child.", bases: { "সন্তানকে": "her child" } }
