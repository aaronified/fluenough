schema: 1
id: "bn-en-grammar-gender-number"
kind: "layer"
core: "bn-grammar-gender-number"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "No gender; plurals"
description: "Bengali has no grammatical gender, and its verbs ignore number."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar"]
cards:
  "bn-0274":
    native: "He is coming. / She is coming."
    notes:
      "n1": "সে (se) is he and she. Nothing in the sentence says which."
  "bn-0275":
    native: "a good boy"
  "bn-0276":
    native: "a good girl"
    notes:
      "n1": "Adjectives don't change for gender: ভালো (bhālo) for both. A few borrowed from Sanskrit have a feminine form, like সুন্দরী (sundori), but the plain form is always correct."
  "bn-0277":
    native: "I go; we go."
    notes:
      "n1": "The verb does not change for number."
  "bn-0278":
    native: "The boys are playing."
    notes:
      "n1": "-রা (-rā) makes a plural for people: ছেলেরা (chelerā), মেয়েরা (meyerā)."
  "bn-0279":
    native: "three books"
    notes:
      "n1": "After a number, or অনেক (many), the noun stays singular. Also তিনটা বই (tinṭā boi)."
