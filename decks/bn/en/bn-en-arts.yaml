schema: 1
id: "bn-en-arts"
kind: "layer"
core: "bn-arts"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Arts"
description: "Painting, sculpture, music, dance and the people who make art: painters, dancers, exhibitions and galleries. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-3609":
    native: "painter"
    notes:
      "n1": "{1}: A painter: a person who paints pictures."
    examples:
      "চিত্রকর ছবি আঁকছেন।": "The painter is drawing a picture."
      "চিত্রকরের প্রদর্শনী আজ শুরু।": { native: "The painter's exhibition starts today.", bases: { "চিত্রকরের": "painter" } }
  "bn-3610":
    native: "paintbrush"
    notes:
      "n1": "{1}: A paintbrush: a brush used for painting."
    examples:
      "তুলিটা নতুন।": { native: "The brush is new.", bases: { "তুলিটা": "paintbrush" } }
      "তুলি দিয়ে ছবি আঁকো।": { native: "Paint a picture with a brush. (familiar)", bases: { "তুলি": "paintbrush" } }
  "bn-3611":
    native: "canvas"
    notes:
      "n1": "{1}: A canvas: the cloth or board that a painting is made on."
    examples:
      "ক্যানভাসটা বড়।": { native: "The canvas is big.", bases: { "ক্যানভাসটা": "canvas" } }
      "ক্যানভাসে নীল রং লাগাও।": { native: "Put blue paint on the canvas. (familiar)", bases: { "ক্যানভাসে": "canvas", "লাগাও": "put on" } }
  "bn-3612":
    native: "exhibition"
    notes:
      "n1": "{1}: An exhibition: a public show of art or things."
    examples:
      "প্রদর্শনীটা কাল শুরু হবে।": { native: "The exhibition will start tomorrow.", bases: { "প্রদর্শনীটা": "exhibition" } }
      "প্রদর্শনীতে অনেক ছবি আছে।": { native: "There are many pictures at the exhibition.", bases: { "প্রদর্শনীতে": "exhibition", "আছে": "there are" } }
  "bn-3613":
    native: "gallery"
    notes:
      "n1": "{1}: A gallery: a room or building where art is shown."
    examples:
      "গ্যালারিতে ভিড় নেই।": { native: "There is no crowd in the gallery.", bases: { "গ্যালারিতে": "gallery", "ভিড়": "crowd", "নেই": "there is no" } }
      "গ্যালারিটা শহরের মাঝখানে।": { native: "The gallery is in the middle of the town.", bases: { "গ্যালারিটা": "gallery" } }
  "bn-3614":
    native: "sculpture"
    notes:
      "n1": "{1}: A sculpture: a work of art carved or shaped from stone, wood or clay."
    examples:
      "ভাস্কর্যটা পাথরের তৈরি।": { native: "The sculpture is made of stone.", bases: { "ভাস্কর্যটা": "sculpture", "তৈরি": "made" } }
      "ভাস্কর্যের সামনে ছবি তুললাম।": { native: "I took a photo in front of the sculpture.", bases: { "ভাস্কর্যের": "sculpture" } }
  "bn-3615":
    native: "statue; idol"
    notes:
      "n1": "{1}: A statue or an idol: a carved or cast figure of a person or a god."
    examples:
      "পার্কে একটা মূর্তি আছে।": { native: "There is a statue in the park.", bases: { "একটা": "a", "আছে": "there is" } }
      "মূর্তিটা খুব পুরোনো।": { native: "The statue is very old.", bases: { "মূর্তিটা": "statue; idol" } }
  "bn-3616":
    native: "sitar"
    notes:
      "n1": "{1}: A sitar: a long-necked Indian stringed instrument."
    examples:
      "সেতার বাজাচ্ছেন।": "He is playing the sitar."
      "সেতারের সুর খুব মিষ্টি।": { native: "The sitar's tune is very sweet.", bases: { "সেতারের": "sitar" } }
  "bn-3617":
    native: "dancer (male)"
    notes:
      "n1": "{1}: A male dancer: a man who dances, often on a stage."
    examples:
      "নর্তক মঞ্চে নাচছেন।": "The dancer is dancing on the stage."
      "নর্তকের পোশাক সুন্দর।": { native: "The dancer's costume is beautiful.", bases: { "নর্তকের": "dancer (male)" } }
  "bn-3618":
    native: "dancer (female)"
    notes:
      "n1": "{1}: A female dancer: a woman who dances, often on a stage."
    examples:
      "নর্তকী খুব সুন্দর নাচে।": "The female dancer dances very beautifully."
      "নর্তকীর সঙ্গে কথা বললাম।": { native: "I talked with the female dancer.", bases: { "নর্তকীর": "dancer (female)" } }
  "bn-3619":
    native: "pottery"
    notes:
      "n1": "{1}: Pottery: the art of making things from clay."
    examples:
      "মৃৎশিল্প আমাদের ঐতিহ্য।": "Pottery is our heritage."
      "মাটি দিয়ে মৃৎশিল্প তৈরি হয়।": { native: "Pottery is made from clay.", bases: { "তৈরি": "made" } }
  "bn-3620":
    native: "handicraft"
    notes:
      "n1": "{1}: Handicraft: things made by hand with skill."
    examples:
      "হস্তশিল্পের দোকান কোথায়?": { native: "Where is the handicraft shop?", bases: { "হস্তশিল্পের": "handicraft" } }
      "হস্তশিল্প কিনতে ভালো লাগে।": { native: "It is nice to buy handicrafts.", bases: { "হস্তশিল্প": "handicraft" } }
  "bn-3621":
    native: "fine handwork"
    notes:
      "n1": "{1}: Fine handwork: intricate decorative work done by hand."
    examples:
      "শাড়িতে সুন্দর কারুকাজ আছে।": { native: "The sari has beautiful fine work.", bases: { "আছে": "has" } }
      "কারুকাজটা খুব সূক্ষ্ম।": { native: "The fine work is very delicate.", bases: { "কারুকাজটা": "fine handwork", "সূক্ষ্ম": "delicate" } }
  "bn-3622":
    native: "design; pattern"
    notes:
      "n1": "{1}: A design or a pattern: a drawn plan or decorative pattern."
    examples:
      "নকশাটা খুব সুন্দর।": { native: "The design is very beautiful.", bases: { "নকশাটা": "design; pattern" } }
      "ঘরের নকশা বদলাবে।": "The design of the house will change."
  "bn-3623":
    native: "line"
    notes:
      "n1": "{1}: A line: a stroke drawn with a pen or a brush."
    examples:
      "ছবিতে সোজা রেখা আছে।": { native: "The picture has a straight line.", bases: { "আছে": "has" } }
      "রেখাগুলো খুব মোটা।": { native: "The lines are very thick.", bases: { "রেখাগুলো": "line" } }
  "bn-3624":
    native: "imagination"
    notes:
      "n1": "{1}: Imagination: the ability to form pictures and ideas in the mind."
    examples:
      "তোমার কল্পনা খুব ভালো।": "Your imagination is very good. (familiar)"
      "কল্পনায় একটা ছবি আঁকলাম।": { native: "I drew a picture in my imagination.", bases: { "কল্পনায়": "imagination", "একটা": "a" } }
  "bn-3625":
    native: "photograph (formal)"
    notes:
      "n1": "{1}: A photograph: a picture made by light, a formal word."
    examples:
      "আলোকচিত্রটা সুন্দর।": { native: "The photograph is beautiful.", bases: { "আলোকচিত্রটা": "photograph (formal)" } }
      "আলোকচিত্রটি কে তুলেছে?": { native: "Who took this photograph?", bases: { "আলোকচিত্রটি": "photograph (formal)" } }
  "bn-3626":
    native: "photograph"
    notes:
      "n1": "{1}: A photograph: a picture taken with a camera."
    examples:
      "ফটোগ্রাফ তোলো।": "Take a photograph. (familiar)"
      "ফটোগ্রাফগুলো দেখো।": { native: "Look at the photographs. (familiar)", bases: { "ফটোগ্রাফগুলো": "photograph" } }
  "bn-3627":
    native: "sketch"
    notes:
      "n1": "{1}: A sketch: a rough, quick drawing."
    examples:
      "স্কেচটা দ্রুত আঁকা।": { native: "The sketch is quickly drawn.", bases: { "স্কেচটা": "sketch" } }
      "স্কেচ করতে ভালো লাগে।": "I like to make sketches."
  "bn-3628":
    native: "talent"
    notes:
      "n1": "{1}: Talent: a natural gift or ability."
    examples:
      "তার প্রতিভা সবাই জানে।": "Everyone knows his talent."
      "প্রতিভাবান শিল্পী।": { native: "A talented artist.", bases: { "প্রতিভাবান": "talented" } }
  "bn-3629":
    native: "studio"
    notes:
      "n1": "{1}: A studio: a room or place where films, music or art are made."
    examples:
      "স্টুডিওতে গান রেকর্ড হচ্ছে।": { native: "A song is being recorded in the studio.", bases: { "স্টুডিওতে": "studio", "রেকর্ড": "recorded" } }
      "স্টুডিওটা বড় আর পরিষ্কার।": { native: "The studio is big and clean.", bases: { "স্টুডিওটা": "studio" } }
  "bn-3630":
    native: "portrait"
    notes:
      "n1": "{1}: A portrait: a painting or photograph of a person."
    examples:
      "দেয়ালে তার প্রতিকৃতি আছে।": { native: "His portrait is on the wall.", bases: { "আছে": "is" } }
      "প্রতিকৃতিটা কে এঁকেছে?": { native: "Who painted the portrait?", bases: { "প্রতিকৃতিটা": "portrait" } }
  "bn-3631":
    native: "backdrop"
    notes:
      "n1": "{1}: A backdrop: the painted scene behind the actors on a stage."
    examples:
      "মঞ্চের দৃশ্যপটটা সুন্দর।": { native: "The stage backdrop is beautiful.", bases: { "দৃশ্যপটটা": "backdrop" } }
      "দৃশ্যপটে একটা নদী আঁকা আছে।": { native: "A river is painted on the backdrop.", bases: { "দৃশ্যপটে": "backdrop", "একটা": "a", "আছে": "is" } }
  "bn-3632":
    native: "Rabindra Sangeet"
    notes:
      "n1": "{1}: Rabindra Sangeet: songs written and composed by Rabindranath Tagore."
    examples:
      "রবীন্দ্রসংগীত খুব ভালো লাগে।": "I like Tagore's songs very much."
      "সে রবীন্দ্রসংগীত গায়।": "She sings Tagore's songs."
  "bn-3633":
    native: "picture (formal)"
    notes:
      "n1": "{1}: A picture or a painting, a formal word."
    examples:
      "এই চিত্রটি বড় একটি ক্যানভাসে আঁকা।": { native: "This picture is painted on a big canvas.", bases: { "এই": "this", "ক্যানভাসে": "on a canvas", "চিত্রটি": "picture" } }
      "চিত্রটি খুব দামি।": { native: "The picture is very valuable.", bases: { "চিত্রটি": "picture" } }
  "bn-3634":
    native: "painting (the art)"
    notes:
      "n1": "{1}: Painting: the art of making pictures with colours."
    examples:
      "চিত্রশিল্প আমার প্রিয়।": "Painting is my favourite."
      "চিত্রশিল্পে তিনি নাম করেছেন।": { native: "He has made a name in painting.", bases: { "চিত্রশিল্পে": "painting (the art)" } }
  "bn-3635":
    native: "decoration"
    notes:
      "n1": "{1}: Decoration: things put up or done to make a place look nice."
    examples:
      "ঘরের সাজসজ্জা সুন্দর।": "The decoration of the room is beautiful."
      "উৎসবের জন্য সাজসজ্জা হচ্ছে।": "Decoration is being done for the festival."
  "bn-3636":
    native: "heritage"
    notes:
      "n1": "{1}: Heritage: customs, arts and things handed down from the past."
    examples:
      "আমাদের ঐতিহ্য অনেক পুরোনো।": "Our heritage is very old."
      "ঐতিহ্য রক্ষা করা জরুরি।": { native: "Protecting heritage is important.", bases: { "রক্ষা": "protecting" } }
  "bn-3637":
    native: "costume; clothes"
    notes:
      "n1": "{1}: Clothes or a costume: what one wears, especially on stage."
    examples:
      "নাটকে নায়িকার পোশাক লাল।": "In the play the heroine's costume is red."
      "পোশাকটা খুব সুন্দর।": { native: "The costume is very beautiful.", bases: { "পোশাকটা": "costume" } }
  "bn-3638":
    native: "dhol (drum)"
    notes:
      "n1": "{1}: A dhol: a large drum played with the hands."
    examples:
      "ঢোল বাজছে।": "The drum is playing."
      "ঢোলের শব্দ শুনলাম।": { native: "I heard the sound of the drum.", bases: { "ঢোলের": "dhol (drum)" } }
  "bn-3639":
    native: "playwright"
    notes:
      "n1": "{1}: A playwright: a person who writes plays."
    examples:
      "নাট্যকার নতুন নাটক লিখছেন।": "The playwright is writing a new play."
      "নাট্যকারের নাম কী?": { native: "What is the playwright's name?", bases: { "নাট্যকারের": "playwright" } }
  "bn-3640":
    native: "craftsman"
    notes:
      "n1": "{1}: A craftsman: a skilled worker who makes things by hand."
    examples:
      "কারিগর সুন্দর নকশা করেছেন।": "The craftsman has made a beautiful design."
      "কারিগরের হাতে যাদু আছে।": { native: "The craftsman's hands have magic.", bases: { "কারিগরের": "craftsman", "যাদু": "magic", "আছে": "has" } }
  "bn-3641":
    native: "drawing"
    notes:
      "n1": "{1}: Drawing: the act of making a picture with a pen or pencil."
    examples:
      "অঙ্কনের ক্লাস আছে।": { native: "There is a drawing class.", bases: { "অঙ্কনের": "drawing", "আছে": "there is" } }
      "অঙ্কনে তার দক্ষতা অসাধারণ।": { native: "His skill in drawing is outstanding.", bases: { "অঙ্কনে": "drawing", "অসাধারণ": "outstanding" } }
  "bn-3642":
    native: "auction"
    notes:
      "n1": "{1}: An auction: a sale where things go to the highest bidder."
    examples:
      "নিলামে ছবিটা বিক্রি হলো।": { native: "The picture was sold at the auction.", bases: { "নিলামে": "auction" } }
      "নিলাম কাল শুরু হবে।": "The auction will start tomorrow."
  "bn-3643":
    native: "fine arts"
    notes:
      "n1": "{1}: Fine arts: painting, music, dance and sculpture together."
    examples:
      "শিল্পকলা মানুষের মন ভালো রাখে।": { native: "Fine arts keep people's minds well.", bases: { "মানুষের": "of people" } }
      "শিল্পকলা বিষয়ে তিনি পড়েন।": "He studies fine arts."
  "bn-3644":
    native: "painted scroll"
    notes:
      "n1": "{1}: A painted scroll: a folk picture on a long cloth or paper."
    examples:
      "পটটা খুব পুরোনো।": { native: "The scroll is very old.", bases: { "পটটা": "painted scroll" } }
      "পটে গল্প আঁকা আছে।": { native: "A story is painted on the scroll.", bases: { "পটে": "painted scroll", "আছে": "is" } }
  "bn-3645":
    native: "dance artist"
    notes:
      "n1": "{1}: A dance artist: a person who performs dance."
    examples:
      "নৃত্যশিল্পী মঞ্চে এলেন।": "The dance artist came onto the stage."
      "নৃত্যশিল্পীর নাচ দেখলাম।": { native: "I watched the dance artist's dance.", bases: { "নৃত্যশিল্পীর": "dance artist" } }
  "bn-3646":
    native: "lyricist"
    notes:
      "n1": "{1}: A lyricist: a person who writes the words of songs."
    examples:
      "গীতিকার নতুন গান লিখেছেন।": "The lyricist has written a new song."
      "গীতিকারের কথা সুন্দর।": { native: "The lyricist's words are beautiful.", bases: { "গীতিকারের": "lyricist" } }
  "bn-3647":
    native: "composer"
    notes:
      "n1": "{1}: A composer: a person who makes the tune of a song."
    examples:
      "সুরকার সুর বানিয়েছেন।": { native: "The composer has made a tune.", bases: { "বানিয়েছেন": "made" } }
      "এই গানের সুরকার কে?": { native: "Who is the composer of this song?", bases: { "এই": "this" } }
  "bn-3648":
    native: "musician"
    notes:
      "n1": "{1}: A musician: a person who plays or sings music."
    examples:
      "সংগীতশিল্পী সবাইকে মুগ্ধ করলেন।": { native: "The musician charmed everyone.", bases: { "মুগ্ধ": "charmed" } }
      "সংগীতশিল্পীর অনুষ্ঠান আজ রাতে।": { native: "The musician's show is tonight.", bases: { "সংগীতশিল্পীর": "musician" } }
  "bn-3649":
    native: "critic"
    notes:
      "n1": "{1}: A critic: a person who gives an opinion on art or a film."
    examples:
      "সমালোচক ছবিটার প্রশংসা করেছেন।": "The critic praised the film."
      "সমালোচকদের মত আলাদা।": { native: "The critics' views differ.", bases: { "সমালোচকদের": "critic", "আলাদা": "different" } }
  "bn-3650":
    native: "creative"
    notes:
      "n1": "{1}: Creative: full of new ideas and new ways to make things."
    examples:
      "সে খুব সৃজনশীল মানুষ।": { native: "She is a very creative person.", bases: { "মানুষ": "person" } }
      "সৃজনশীল কাজ ভালো লাগে।": "Creative work is nice to me."
  "bn-3651":
    native: "to draw"
    notes:
      "n1": "{1}: To draw: to make a picture with lines, usually with a pencil or a pen."
    examples:
      "ছবি অঙ্কন করি।": "I draw pictures."
      "সে রোজ অঙ্কন করে।": "He draws every day."
  "bn-3652":
    native: "to exhibit"
    notes:
      "n1": "{1}: To exhibit: to put art or work on public view."
    examples:
