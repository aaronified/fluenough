"cards":
  "bn-5200":
    "native": "I call a doctor."
    "confusables":
      "c1":
        "why": "a hospital is a place, not the person to call"
      "c2":
        "why": "police: a different person to call"
  "bn-5201":
    "native": "Where does the doctor live?"
    "confusables":
      "c1":
        "why": "when asks for a time, not a place"
      "c2":
        "why": "who asks for a person, not a place"
  "bn-5202":
    "native": "I have a sore throat."
    "confusables":
      "c1":
        "why": "head: a different part of the body"
      "c2":
        "why": "hand: a different part of the body"
  "bn-5203":
    "native": "I come from the hospital."
    "confusables":
      "c1":
        "why": "to go: the opposite direction"
      "c2":
        "why": "with: a different postposition"
  "bn-5204":
    "native": "Please call the police."
    "confusables":
      "c1":
        "why": "doctor: a different person to call"
      "c2":
        "why": "to say: a different verb"
  "bn-5205":
    "native": "I am looking for you."
    "confusables":
      "c1":
        "why": "to get or find: you get it, you do not search for it"
      "c2":
        "why": "to see: a different verb"
  "bn-5206":
    "native": "The police stand on the road."
    "confusables":
      "c1":
        "why": "police station: where the police are, not the road"
      "c2":
        "why": "to sit: a different verb"
  "bn-5207":
    "native": "Who understands me?"
    "confusables":
      "c1":
        "why": "who (more than one): asks about several people"
      "c2":
        "why": "what: asks about a thing"
