    confusables: { "c1": { why: "empty: the opposite of a jam" }, "c2": { why: "far: not in a jam" } }
  "bn-2491":
    native: "I walk to the station."
    confusables: { "c1": { why: "by car: not on foot" }, "c2": { why: "by bus: not on foot" } }
  "bn-2492":
