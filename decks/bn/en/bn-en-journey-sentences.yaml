  "bn-2481":
    native: "I go to the office by bus every day."
    confusables: { "c1": { why: "by train: a different way to go" }, "c2": { why: "on foot: not by bus" } }
  "bn-2482":
    native: "When will the train leave?"
    bases: { "ছাড়বে": "to leave; to depart" }
    confusables: { "c1": { why: "where: not when" }, "c2": { why: "why: not when" } }
  "bn-2483":
