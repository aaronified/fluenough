    confusables: { "c1": { why: "there: not here" }, "c2": { why: "far: not here" } }
  "bn-2484":
    native: "How much is the fare to go to the station?"
    confusables: { "c1": { why: "time: not the fare" }, "c2": { why: "delay: not the fare" } }
  "bn-2485":
    native: "Where is my passport?"
    confusables: { "c1": { why: "visa: not the passport itself" }, "c2": { why: "ticket: not the passport" } }
  "bn-2486":
    native: "The train has come late."
    confusables: { "c1": { why: "before: not late" }, "c2": { why: "quickly: not late" } }
  "bn-2487":
    native: "Which car will you go in? (respectful)"
