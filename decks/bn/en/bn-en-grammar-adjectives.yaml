schema: 1
id: "bn-en-grammar-adjectives"
kind: "layer"
core: "bn-grammar-adjectives"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Adjectives and comparison"
description: "Describing words, which don't change for number and almost never for gender, and how to say -er and -est. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "grammar"]
cards:
  "bn-0617":
    native: "good"
    "examples": {
      "উদ্যোগটা ভালো।": {"native": "The initiative is good.", "bases": {"উদ্যোগটা": "enterprise; initiative", "ভালো": "good"}},
      "চার্জারটা ভালো।": {"native": "The charger is good.", "bases": {"চার্জারটা": "charger"}}
    }
  "bn-0618":
    native: "bad"
    "examples": {
      "কিবোর্ডটা খারাপ।": {"native": "The keyboard is bad.", "bases": {"খারাপ": "bad"}},
      "এই বোতামটা খারাপ।": {"native": "This button is faulty.", "bases": {"এই": "this", "বোতামটা": "button"}}
    }
  "bn-0619":
    native: "small; young"
    notes:
      "n1": "Also written ছোটো (choṭo), as Basic Bangla does, and বড় (bôṛo), big, as বড়ো (bôṛo). Both spellings are right."
    "examples": {
      "অক্ষরগুলো ছোট।": {"native": "The letters are small.", "bases": {"অক্ষরগুলো": "letter", "ছোট": "small; young"}},
      "চারাগুলো ছোট।": {"native": "The seedlings are small.", "bases": {"চারাগুলো": "seedling", "ছোট": "small; young"}}
    }
  "bn-0062":
    native: "big; elder"
    notes:
      "n1": "বড় বাড়ি (bôṛo bāṛi), a big house; বড় ভাই (bôṛo bhāi), an elder brother. Also written বড়ো (bôṛo)."
  "bn-0060":
    notes:
      "n1": "গরম চা (gôrom cā), hot tea. The opposite is ঠান্ডা (ṭhānḍā)."
  "bn-0620":
    native: "new"
    "examples": {
      "অভিধানটা নতুন।": {"native": "The dictionary is new.", "bases": {"অভিধানটা": "dictionary", "নতুন": "new"}},
      "আংটিটা নতুন।": {"native": "The ring is new.", "bases": {"আংটিটা": "ring", "নতুন": "new"}}
    }
  "bn-0621":
    native: "old (of things)"
    notes:
      "n1": "Also written পুরনো (purono). Not for people: an old person is বৃদ্ধ (briddho)."
    "examples": {
      "আসবাবপত্রগুলো পুরোনো।": {"native": "The furniture is old.", "bases": {"আসবাবপত্রগুলো": "furniture", "পুরোনো": "old (of things)"}},
      "উপকথাটা পুরোনো।": {"native": "The folk tale is old.", "bases": {"উপকথাটা": "folk tale", "পুরোনো": "old (of things)"}}
    }
  "bn-0622":
    native: "cold"
    notes:
      "n1": "Also written ঠাণ্ডা (ṭhānḍā), as the Bangla Academy dictionary does."
    "examples": {
      "ঠান্ডা লাগা": {"native": "to catch a cold", "bases": {"ঠান্ডা": "cold"}},
      "পানিটা ঠান্ডা।": {"native": "The water is cold.", "bases": {"পানিটা": "water"}}
    }
  "bn-0623":
    native: "easy"
    "examples": {
      "ব্যাখ্যাটা সহজ।": {"native": "The explanation is simple.", "bases": {"ব্যাখ্যাটা": "explanation", "সহজ": "simple"}},
      "অনলাইনে কেনা সহজ।": {"native": "Buying online is easy.", "bases": {"সহজ": "easy"}}
    }
  "bn-0624":
    native: "difficult"
    "examples": {
      "অঙ্কটা কঠিন।": {"native": "The maths sum is hard.", "bases": {"অঙ্কটা": "maths; an arithmetic sum", "কঠিন": "difficult"}},
      "ধাঁধাটা কঠিন।": {"native": "The riddle is hard.", "bases": {"ধাঁধাটা": "riddle", "কঠিন": "difficult"}}
    }
  "bn-0625":
    native: "beautiful"
    notes:
      "n1": "A few adjectives from Sanskrit have a feminine form, as in সুন্দরী মেয়ে (sundori meye), a beautiful girl, but the plain form is always right: সুন্দর মেয়ে (śundor meye)."
    "examples": {
      "আলোকচিত্রটা সুন্দর।": {"native": "The photograph is beautiful.", "bases": {"আলোকচিত্রটা": "photograph (formal)", "সুন্দর": "beautiful"}},
      "উপমাটা সুন্দর।": {"native": "The comparison is beautiful.", "bases": {"উপমাটা": "simile", "সুন্দর": "beautiful"}}
    }
  "bn-0626":
    native: "clean; clear"
    "examples": {
      "সৌরশক্তি পরিষ্কার।": {"native": "Solar power is clean.", "bases": {"পরিষ্কার": "clean; clear"}},
      "স্নানঘরটা পরিষ্কার।": {"native": "The bathroom is clean.", "bases": {"স্নানঘরটা": "bathroom", "পরিষ্কার": "clean; clear"}}
    }
  "bn-0627":
    native: "dirty"
  "bn-0628":
    native: "tall; long"
    "examples": {
      "ছায়াটা লম্বা।": {"native": "The shadow is long.", "bases": {"ছায়াটা": "shade; shadow"}},
      "শিকড়গুলো লম্বা।": {"native": "The roots are long.", "bases": {"শিকড়গুলো": "root (of a plant)"}}
    }
  "bn-0629":
    native: "short (of a person)"
    notes:
      "n1": "Also খাটো (khāṭo)."
  "bn-0630":
    native: "fat; thick"
    "examples": {
      "রেখাগুলো খুব মোটা।": {"native": "The lines are very thick.", "bases": {"রেখাগুলো": "line", "মোটা": "fat; thick"}}
    }
  "bn-0631":
    native: "thin (of a person)"
  "bn-0632":
    native: "heavy"
    notes:
      "n1": "With ী (i). ভারি (bhāri) with ি (i) is the adverb 'very', as in ভারি সুন্দর (bhāri śundor)."
    "examples": {
      "কম্বলটা ভারী।": {"native": "The blanket is heavy.", "bases": {"কম্বলটা": "blanket", "ভারী": "heavy"}},
      "পাথরটা ভারী।": {"native": "The stone is heavy.", "bases": {"পাথরটা": "stone; rock"}}
    }
  "bn-0633":
    native: "light (not heavy)"
    "examples": {
      "টোপরটা খুব হালকা।": {"native": "The crown is very light.", "bases": {"টোপরটা": "crown (groom's)", "হালকা": "light (not heavy)"}},
      "সকালে হালকা হাওয়া দেয়।": {"native": "A light breeze blows in the morning.", "bases": {}}
    }
  "bn-0634":
    native: "poor"
    notes:
      "n1": "The Bangla Academy spelling. Basic Bangla writes গরীব (gorib)."
  "bn-0635":
    native: "happy"
    "examples": {
      "স্থানীয় মানুষ খুশি।": {"native": "The local people are happy.", "bases": {"মানুষ": "people", "খুশি": "happy"}},
      "আমি আজ খুব খুশি।": {"native": "I am very happy today.", "bases": {"আজ": "today"}}
    }
  "bn-0636":
    native: "tired"
    "examples": {
      "খুব ক্লান্ত থাকলেও সে কাজ করে।": {"native": "Even though she is very tired, she works.", "bases": {"ক্লান্ত": "tired"}}
    }
  "bn-0637":
    native: "busy"
    "examples": {
      "শহুরে রাস্তা ব্যস্ত।": {"native": "The urban roads are busy.", "bases": {"ব্যস্ত": "busy"}},
      "নগরটা বড়, আর ব্যস্ত।": {"native": "The city is big, and busy.", "bases": {"নগরটা": "city", "ব্যস্ত": "busy"}}
    }
  "bn-0638":
    native: "hard"
    "examples": {
      "উইকেটটা খুব শক্ত।": {"native": "The wicket is very hard.", "bases": {"উইকেটটা": "wicket", "শক্ত": "hard"}},
      "দড়িটা খুব শক্ত।": {"native": "The rope is very strong.", "bases": {"দড়িটা": "rope", "শক্ত": "hard"}}
    }
  "bn-0639":
    native: "soft"
    "examples": {
      "আমার বালিশটা নরম।": {"native": "My pillow is soft.", "bases": {"বালিশটা": "the pillow"}},
      "সৈকতের বালি নরম।": {"native": "The sand of the beach is soft.", "bases": {"সৈকতের": "beach", "নরম": "soft"}}
    }
  "bn-0640":
    native: "favourite; dear"
    notes:
      "n1": "আমার প্রিয় খাবার (āmār priyo khābār), my favourite food."
    "examples": {
      "চিত্রশিল্প আমার প্রিয়।": {"native": "Painting is my favourite.", "bases": {"প্রিয়": "favourite; dear"}},
      "প্রিয় বিষয় কী?": {"native": "What is your favourite subject?", "bases": {"প্রিয়": "favourite; dear"}}
    }
  "bn-0641":
    native: "very"
    "examples": {
      "অভিনেতা খুব ভালো।": {"native": "The actor is very good.", "bases": {"খুব": "very"}},
      "অভিনেত্রী খুব সুন্দর।": {"native": "The actress is very beautiful.", "bases": {"খুব": "very"}}
    }
  "bn-0642":
    native: "She is taller than me.; He is taller than me."
    notes:
      "n1": "'Than' is চেয়ে (ceye) or থেকে (theke) after the possessive: আমার চেয়ে (āmār ceye), আমার থেকে (āmār theke). Both are right. The adjective itself never changes."
  "bn-0643":
    native: "This is the best."
    notes:
      "n1": "সবচেয়ে (sôboceye), 'than all', makes -est: সবচেয়ে বড় (sôboceye bôṛo), the biggest."
    bases:
      "সবচেয়ে": "most; more than all"
  "bn-0644":
    native: "This one is even better."
    notes:
      "n1": "With no 'than', আরও (still more) makes -er: আরও বড় (āro bôṛo), bigger."
