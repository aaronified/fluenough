kind: "layer"
core: "bn-grammar-adjectives"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Adjectives and comparison"
description: "Describing words, which don't change for number and almost never for gender, and how to say -er and -est. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "grammar"]
cards:
  "bn-0617":
    native: "good"
  "bn-0618":
    native: "bad"
  "bn-0619":
    native: "small; young"
    notes:
      "n1": "Also written ছোটো (choṭo), as Basic Bangla does, and বড় (bôṛo), big, as বড়ো (bôṛo). Both spellings are right."
  "bn-0062":
    native: "big; elder"
    notes:
      "n1": "বড় বাড়ি (bôṛo bāṛi), a big house; বড় ভাই (bôṛo bhāi), an elder brother. Also written বড়ো (bôṛo)."
  "bn-0060":
    notes:
      "n1": "গরম চা (gôrom cā), hot tea. The opposite is ঠান্ডা (ṭhānḍā)."
  "bn-0620":
    native: "new"
  "bn-0621":
    native: "old (of things)"
    notes:
      "n1": "Also written পুরনো (purono). Not for people: an old person is বৃদ্ধ (briddho)."
  "bn-0622":
    native: "cold"
    notes:
      "n1": "Also written ঠাণ্ডা (ṭhānḍā), as the Bangla Academy dictionary does."
  "bn-0623":
    native: "easy"
  "bn-0624":
    native: "difficult"
  "bn-0625":
    native: "beautiful"
    notes:
      "n1": "A few adjectives from Sanskrit have a feminine form, as in সুন্দরী মেয়ে (sundori meye), a beautiful girl, but the plain form is always right: সুন্দর মেয়ে (śundor meye)."
  "bn-0626":
    native: "clean; clear"
  "bn-0627":
    native: "dirty"
  "bn-0628":
    native: "tall; long"
  "bn-0629":
    native: "short (of a person)"
    notes:
      "n1": "Also খাটো (khāṭo)."
  "bn-0630":
    native: "fat; thick"
  "bn-0631":
    native: "thin (of a person)"
  "bn-0632":
    native: "heavy"
    notes:
      "n1": "With ী (i). ভারি (bhāri) with ি (i) is the adverb 'very', as in ভারি সুন্দর (bhāri śundor)."
  "bn-0633":
    native: "light (not heavy)"
  "bn-0634":
    native: "poor"
    notes:
      "n1": "The Bangla Academy spelling. Basic Bangla writes গরীব (gorib)."
  "bn-0635":
    native: "happy"
  "bn-0636":
    native: "tired"
  "bn-0637":
    native: "busy"
  "bn-0638":
    native: "hard"
  "bn-0639":
    native: "soft"
  "bn-0640":
    native: "favourite; dear"
    notes:
      "n1": "আমার প্রিয় খাবার (āmār priyo khābār), my favourite food."
  "bn-0641":
    native: "very"
  "bn-0642":
    native: "She is taller than me. / He is taller than me."
    notes:
      "n1": "'Than' is চেয়ে (ceye) or থেকে (theke) after the possessive: আমার চেয়ে (āmār ceye), আমার থেকে (āmār theke). Both are right. The adjective itself never changes."
  "bn-0643":
    native: "This is the best."
    notes:
      "n1": "সবচেয়ে (sôboceye), 'than all', makes -est: সবচেয়ে বড় (sôboceye bôṛo), the biggest."
    bases:
      "সবচেয়ে": "most; more than all"
  "bn-0644":
    native: "This one is even better."
    notes:
      "n1": "With no 'than', আরও (still more) makes -er: আরও বড় (āro bôṛo), bigger."
