native: { code: "en", iso639_3: "eng", name: "English" }
name: "Bengali stress, intonation and length (IPA)"
description: "How Bengali uses stress, intonation, length and, in some dialects, tone: one card each. For learners who know the IPA or want to learn it. Variety taught: Standard Colloquial Bengali of Kolkata, with a note wherever Bangladeshi Standard (Dhaka) differs. This is a proposal, not yet confirmed by the owner, a Bengali speaker or a phonetician. The only JIPA illustration found, by Khan (2010), describes Bangladeshi Standard, so facts taken from it are marked as that; Wikipedia's page covers both and says where it knows they differ."
license: "CC-BY-SA-4.0"
authors:
  - { name: "Fluenough contributors" }
  - { name: "Wikipedia contributors (Bengali phonology; Help:IPA/Bengali)", url: "https://en.wikipedia.org/wiki/Bengali_phonology" }
source: "Khan (2010), 'Bengali (Bangladeshi Standard)', Illustration of the IPA, Journal of the International Phonetic Association 40(2): 221-225, doi 10.1017/S0025100310000071 (named in Wikipedia's references; the article itself was not read); also as cited by Wikipedia: Ferguson and Chowdhury (1960), Language 36(1): 22-59; Chatterji (1921), Bulletin of the School of Oriental and African Studies 2: 1-25; Masica (1991), The Indo-Aryan Languages, Cambridge University Press; Hayes and Lahiri (1991), Natural Language and Linguistic Theory 9: 47-96; Bhattacharya (2000), Bangla (Bengali). Text adapted from Wikipedia, 'Bengali phonology' and 'Help:IPA/Bengali', CC BY-SA 4.0, https://en.wikipedia.org/wiki/Bengali_phonology"
tags: ["ipa", "phonology", "unreviewed"]
cards:
  "bn-2054":
    native: "stress: mostly on the first syllable"
    notes:
      "n1": "In Standard Bengali stress is mostly on the first syllable, and words are almost all trochaic. Secondary stress often falls on the odd-numbered syllables after it, the third a little weaker and the later ones very weak. Words from Sanskrit stress the root syllable instead. Prefixes shift stress to the left: sabhya, 'civilised', is stressed on its first syllable and asabhya, 'uncivilised', on the prefix. Stress does not change what a word means."
      "n2": "In a statement the stress is generally lowest on the last word. Wikipedia's IPA help page marks primary stress with ˈ and secondary stress with ˌ before the syllable."
  "bn-2055":
    native: "intonation: rising pitch with a low end"
    notes:
      "n1": "Pitch matters little for single words, apart from a few cases such as telling apart identical vowels in a diphthong, but in sentences intonation matters. In a plain statement most words or phrases carry a rising tone, and the last word only a low one, so high and low alternate until the final drop."
      "n2": "With a focused word the rises last only up to it, and all later words are low; this also holds for question-word questions, since the question word counts as focused. In yes-no questions the rises may be exaggerated, and the last syllable of the last word takes a high falling tone instead of a flat low one."
  "bn-2056":
    native: "vowel length: not contrastive"
    notes:
      "n1": "Like most Magadhan languages, Bengali does not contrast long and short vowels, unlike most Indo-Aryan languages, so the letters ই (i) and ঈ (i), and উ (u) and ঊ (u), are said alike. Vowels in open one-syllable words can be somewhat longer: the vowel of চা (cā), tea, can be longer than the first vowel of caṭa, 'licking', and the suffix ṭa, 'the', keeps it long in caṭa, 'the tea', which makes a minimal pair."
      "n2": "The source then notes that echo reduplication copies the long vowel, giving caṭa, 'tea and all that comes with it', with two longer vowels. So length can tell apart words that are otherwise alike, but only because of where the word boundary falls."
    examples:
      "চা": "tea"
  "bn-2057":
    native: "doubled consonants"
    notes:
      "n1": "Bengali has doubled, long consonants, which Wikipedia's IPA help page marks with ː. Many are written as a conjunct, a letter with the য-ফলা (jô-phôla) or ব-ফলা (bô-phôla) sign, or as a doubled letter: in this course নব্বই (nôbboi), ninety, and চব্বিশ (cobbiś), twenty-four, are said with a long b. A conjunct at the start of a word can lose the length, as জ্ঞান (jñān) is said gæn alone and gːæn after a prefix."
    examples:
      "নব্বই": "90, ninety"
      "চব্বিশ": "24, twenty-four"
  "bn-2058":
    native: "tone: contrastive in some eastern dialects"
    notes:
      "n1": "Some varieties, particularly Chittagonian, Noakhailla and Sylheti, have contrastive tone, so pitch can tell words apart. The breathy voiced series is missing in the Eastern Bengali of Sylhet, Barak Valley, Cumilla, Tripura, Noakhali and Chittagong, and is replaced by tone, as in Punjabi."
