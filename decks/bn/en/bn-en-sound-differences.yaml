schema: 1
id: "bn-en-sound-differences"
kind: "layer"
core: "bn-sound-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sounds to tell apart"
description: "Pairs of everyday words that differ in one sound: a breath after a consonant, the tongue on the teeth or curled back, the vowel every consonant carries against a, a nasal vowel, and the flapped r. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-0102":
    native: "to do"
    notes:
      "n1": "Aspiration: খরা (khôrā, drought) is করা (kôrā, to do) with a puff of breath after the k."
  "bn-0103":
    native: "drought"
    notes:
      "n1": "Aspiration: খরা (khôrā, drought) is করা (kôrā, to do) with a puff of breath after the k."
  "bn-0316":
    notes:
      "n1": "Aspiration: খাল (khāl, canal) is কাল (kāl, tomorrow) with a breath after the k."
  "bn-0104":
    native: "canal"
    notes:
      "n1": "Aspiration: খাল (khāl, canal) is কাল (kāl, tomorrow) with a breath after the k."
  "bn-0105":
    native: "rheumatism"
    notes:
      "n1": "Aspiration: ভাত (bhāt, cooked rice) is বাত (bāt, rheumatism) with a breath after the b. Say বাত (bāt) and you've said rheumatism."
  "bn-0352":
    native: "cooked rice"
    notes:
      "n1": "Aspiration: ভাত (bhāt, cooked rice) is বাত (bāt, rheumatism) with a breath after the b. Say বাত (bāt) and you've said rheumatism."
  "bn-0272":
    native: "uncooked rice"
    notes:
      "n1": "Aspiration: ছাল (chāl, bark) is চাল (cāl, uncooked rice) with a breath after the ch."
  "bn-0106":
    native: "bark (of a tree)"
    notes:
      "n1": "Aspiration: ছাল (chāl, bark) is চাল (cāl, uncooked rice) with a breath after the ch."
  "bn-0107":
    native: "rhythm; palmyra palm"
    notes:
      "n1": "Aspiration: থাল (thāl, a large plate) is তাল (tāl, rhythm) with a breath after the t."
  "bn-0108":
    native: "large plate"
    notes:
      "n1": "Aspiration: থাল (thāl, a large plate) is তাল (tāl, rhythm) with a breath after the t."
  "bn-0109":
    native: "call; post (mail)"
    notes:
      "n1": "Aspiration: ঢাক (ḍhāk, a big drum) is like ডাক (ḍāk, call; post), but with the tongue a little further back and a breath after the d."
  "bn-0110":
    native: "dhak (a big drum)"
    notes:
      "n1": "Aspiration: ঢাক (ḍhāk, a big drum) is like ডাক (ḍāk, call; post), but with the tongue a little further back and a breath after the d."
  "bn-0111":
    native: "gift; donation"
    notes:
      "n1": "Dental against curled back: দান (dān, gift) has the tongue on the teeth; ডান (ḍān, right) has it curled back. English 'd' is nearer ডান (ḍān)."
  "bn-0303":
    notes:
      "n1": "Dental against curled back: দান (dān, gift) has the tongue on the teeth; ডান (ḍān, right) has it curled back. English 'd' is nearer ডান (ḍān)."
  "bn-0112":
    native: "shelf"
    notes:
      "n1": "Dental against curled back: তাক (tāk, shelf) has the tongue on the teeth; টাক (ṭāk, bald patch) has it curled back."
  "bn-0113":
    native: "bald patch"
    notes:
      "n1": "Dental against curled back: তাক (tāk, shelf) has the tongue on the teeth; টাক (ṭāk, bald patch) has it curled back."
  "bn-0114":
    native: "after; other"
    notes:
      "n1": "The open o against a: পর (pôr, after; other) has the vowel every consonant carries; পার (pār, the far bank; across) has আ (ā), the 'a' of 'father'."
  "bn-0115":
    native: "the far bank; across"
    notes:
      "n1": "The open o against a: পর (pôr, after; other) has the vowel every consonant carries; পার (pār, the far bank; across) has আ (ā), the 'a' of 'father'."
  "bn-0350":
    notes:
      "n1": "The open o against a: জল (jôl, water) has the vowel every consonant carries; জাল (jāl, net) has আ (ā), the 'a' of 'father'. Also পানি (pāni)."
  "bn-0116":
    native: "net"
    notes:
      "n1": "The open o against a: জল (jôl, water) has the vowel every consonant carries; জাল (jāl, net) has আ (ā), the 'a' of 'father'."
  "bn-0117":
    native: "obstacle"
    notes:
      "n1": "Nasal vowel: বাঁধা (bām̐dhā, tied) is বাধা (bādhā, obstacle) with the vowel said through the nose as well, marked by ঁ (ôm̐) above."
  "bn-0118":
    native: "tied"
    notes:
      "n1": "Nasal vowel: বাঁধা (bām̐dhā, tied) is বাধা (bādhā, obstacle) with the vowel said through the nose as well, marked by ঁ (ôm̐) above."
  "bn-0119":
    native: "to read; to fall"
    notes:
      "n1": "The flapped r against r: পড়া (pôṛā, to read) has ড় (ṛô), the tongue placed as for ড (ḍô) without touching the roof of the mouth; পরা (pôrā, to wear) has র (rô), a tap of the tongue tip."
  "bn-0120":
    native: "to wear"
    notes:
      "n1": "The flapped r against r: পড়া (pôṛā, to read) has ড় (ṛô), the tongue placed as for ড (ḍô) without touching the roof of the mouth; পরা (pôrā, to wear) has র (rô), a tap of the tongue tip."
