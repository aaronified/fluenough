id: "bn-en-body-sentences"
kind: "layer"
core: "bn-body-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The body: sentences"
description: "Short sentences about where it hurts and what we do with each part of the body. They unlock once their words and rules are known. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-1026":
    native: "I have a headache."
    notes:
      "n1": "মাথায় (māthāy) is the locative of মাথা (māthā), head, with the ending -য় (-y) after -া (-a)."
  "bn-1027":
    native: "I have a stomach ache."
    notes:
      "n1": "পেটে (peṭe) is the locative of পেট (peṭ), stomach, with the ending -ে (-e)."
  "bn-1028":
    native: "I have a pain in my back."
    notes:
      "n1": "পিঠে (piṭhe) is the locative of পিঠ (piṭh), back, with the ending -ে (-e)."
  "bn-1029":
    native: "I have a pain in my knee."
    notes:
      "n1": "হাঁটুতে (hām̐ṭute) is the locative of হাঁটু (hām̐ṭu), knee, with the ending -তে (-te)."
  "bn-1030":
    native: "I have a fever."
  "bn-1031":
    native: "Please open your mouth."
    notes:
      "n1": "খুলুন (khulun) is the polite request form of খোলা (kholā), to open, used with আপনি (āpni), you (respectful)."
  "bn-1032":
    native: "I eat rice with my hand."
    notes:
      "n1": "দিয়ে (diye) means 'with' or 'by means of'; here হাত দিয়ে (hāt diye) is 'with the hand'."
  "bn-1033":
    native: "We see with our eyes and hear with our ears."
    notes:
      "n1": "চোখ দিয়ে (cokh diye) and কান দিয়ে (kān diye) mean 'with the eyes' and 'with the ears'; দিয়ে (diye) means 'with'."
  "bn-1034":
    native: "What is in your hand? (respectful)"
    notes:
      "n1": "আপনার (āpnār) is the respectful 'your', from আপনি (āpni), you (respectful)."
  "bn-1035":
    native: "Take the medicine from the doctor."
    notes:
      "n1": "কাছ থেকে (kāch theke) means 'from' someone; থেকে (theke) is the word for 'from'."
    bases:
      "কাছ": "nearness; the place of someone"
  "bn-1036":
    native: "The doctor looks at my tongue."
    notes:
      "n1": "দেখেন (dekhen) is the respectful present form of দেখা (dekhā), to look, with ডাক্তার (ḍāktār), doctor, as the subject."
