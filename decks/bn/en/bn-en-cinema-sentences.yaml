schema: 1
id: "bn-en-cinema-sentences"
kind: "layer"
core: "bn-cinema-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Cinema: sentences"
description: "Short sentences about films, actors and the cinema hall. They unlock once their words and rules are known. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-3592":
    native: "I will watch a film tonight."
    notes:
      "n1": "দেখব (dekhob) is the first-person future of দেখা (dekhā), to see or watch."
    confusables: { "c1": { why: "a play: performed on a stage, not a film" }, "c2": { why: "a concert: music, not a film" } }
  "bn-3593":
    native: "The hero of the film is very good."
    notes:
      "n1": "ছবিটার (chobiṭār) joins ছবি (chobi), film, with -টা (-ṭā), 'the', and then the genitive -র (-r), 'of': 'the film's'."
    confusables: { "c1": { why: "villain: the opposite role" }, "c2": { why: "actor: the person who plays any role" } }
  "bn-3594":
    native: "There were many viewers in the hall."
    bases: { "ছিল": "were" }
    notes:
      "n1": "হলে (hôle) here means 'in the hall', but with a verb it means 'if'."
    confusables: { "c1": { why: "listener: someone who listens, not a viewer" }, "c2": { why: "staff: people at work, not in a hall" } }
  "bn-3595":
    native: "I liked the trailer."
    notes:
      "n1": "আমার ভালো লাগল (āmār bhālo lāgol) literally means 'good seemed to me', so the person who likes it is in the genitive আমার (āmār)."
    confusables: { "c1": { why: "a poster: a printed picture, not a moving trailer" }, "c2": { why: "a review: a written opinion" } }
  "bn-3596":
    native: "The song is very sweet."
    confusables: { "c1": { why: "crying: a sad sound, not a song" }, "c2": { why: "sound: any noise, not a song" } }
  "bn-3597":
    native: "Everyone applauded."
    notes:
      "n1": "হাততালি দেওয়া (hātotāli deoyā), to applaud, is the noun হাততালি (hātotāli), clapping, with দেওয়া (deoyā), to give."
    confusables: { "c1": { why: "a curse: not applause" }, "c2": { why: "fear: a feeling, not applause" } }
  "bn-3598":
    native: "The director has made a new film."
    bases: { "নির্মাণ": "making" }
    notes:
      "n1": "করেছেন (kôrechen) uses the respectful ending -ছেন (-chen) for a person one respects, so it means 'has made' for the director."
    confusables: { "c1": { why: "producer: pays for a film, not directs it" }, "c2": { why: "maker: close in meaning, a different word" } }
  "bn-3599":
    native: "The film will be released tomorrow."
    notes:
      "n1": "মুক্তি পাওয়া (mukti pāoyā), to be released, is the noun মুক্তি (mukti), release, with পাওয়া (pāoyā), to get."
    confusables: { "c1": { why: "cancelled: the opposite" }, "c2": { why: "finished: a different state" } }
  "bn-3600":
    native: "On the big screen the film is wonderful."
    bases: { "চমৎকার": "wonderful" }
    notes:
      "n1": "বড়পর্দায় (bôṛopordāy) joins বড় (bôṛo), big, and পর্দা (pôrdā), screen, with the place ending -য় (-y)."
    confusables: { "c1": { why: "small screen: the television, the opposite" }, "c2": { why: "stage: a live performance" } }
  "bn-3601":
    native: "It rains now and then."
    bases: { "মাঝে": "now and then" }
    notes:
      "n1": "মাঝে মাঝে (mājhe mājhe) repeats মাঝে (mājhe), in between, to mean 'now and then'."
    confusables: { "c1": { why: "all: the opposite of sometimes" }, "c2": { why: "once: a single time" } }
  "bn-3602":
    native: "The story is historical."
    confusables: { "c1": { why: "imaginary: the opposite of historical" }, "c2": { why: "real: a different quality" } }
