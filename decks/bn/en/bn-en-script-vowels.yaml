schema: 1
id: "bn-en-script-vowels"
kind: "layer"
core: "bn-script-vowels"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Bengali vowels"
description: "The eleven vowels as they are written on their own: at the start of a word, or after another vowel. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "bn-0001":
    native: "o, open (the vowel every consonant carries)"
    notes:
      "n1": "Said with the mouth open, like the 'o' of British 'hot' or the 'aw' of 'law'. Every consonant carries it unless a sign changes it: ক (kô) is 'ko'. On its own it starts a word: অনেক (ônek, many)."
  "bn-0002":
    native: "a (as in 'father')"
    notes:
      "n1": "Like the 'a' of 'father', never the 'a' of 'cat': আম (ām, mango). Bengali has no long and short vowels, so hold it no longer than any other."
  "bn-0003":
    native: "i, short form (hroshsho i)"
    notes:
      "n1": "Like the 'ee' of 'see': ইলিশ (iliś, hilsa fish). Bengali writes i two ways, short and long, but today both sound the same: which one a word takes is spelling."
  "bn-0004":
    native: "i, long form (dirgho i)"
    notes:
      "n1": "Sounds just like ই (i), the 'ee' of 'see'. The long form is kept from Sanskrit spelling: ঈদ (id, Eid). Because it sounds the same, it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  "bn-0005":
    native: "u, short form (hroshsho u)"
    notes:
      "n1": "Like the 'oo' of 'food': উট (uṭ, camel). As with i, the short and long forms of u sound the same today."
  "bn-0006":
    native: "u, long form (dirgho u)"
    notes:
      "n1": "Sounds just like উ (u), the 'oo' of 'food'. It is rare: ঊষা (uśā, dawn). Because it sounds the same, it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  "bn-0007":
    native: "ri (a vowel letter)"
    notes:
      "n1": "Said 'ri', as at the start of 'river', though it is written as one vowel. It comes in words from Sanskrit: ঋতু (ritu, season). A recogniser writes this sound as রি (ri), so it is drilled by reading and writing only."
  "bn-0008":
    native: "e (as in 'café'; often 'a' as in 'cat')"
    notes:
      "n1": "Usually the 'e' of 'café', without the glide of English 'say'. In many words it is said like the 'a' of 'cat': এক (ek, one) sounds close to 'ack'. The spelling doesn't show which."
  "bn-0009":
    native: "oi (as in 'boy')"
    notes:
      "n1": "A glide from o to i, like the 'oy' of 'boy': ঐ (oi, that). A recogniser writes this sound as ওই (oi), the commoner spelling of the same word, so it is drilled by reading and writing only."
  "bn-0010":
    native: "o, closed (as in 'go')"
    notes:
      "n1": "Like the 'o' of 'go', without the 'w' English adds at the end. Don't confuse it with অ (ô), the open o: ওষুধ (ośudh, medicine)."
  "bn-0011":
    native: "ou (o gliding to u)"
    notes:
      "n1": "A glide from o to u, as in 'go' run into 'oo'. It is rare: ঔষধ (ouśodh, medicine, a formal word). A recogniser writes this sound as ওউ (ou), so it is drilled by reading and writing only."
