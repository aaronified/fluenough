id: "bn-en-places-sentences"
kind: "layer"
core: "bn-places-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Places: sentences"
description: "Short sentences about where places are, how to ask the way, and what happens in each. They unlock once their words and rules are known. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-1085":
    native: "The school is near the house."
    notes:
      "n1": "বাড়ির (bāṛir) is the genitive of বাড়ি (bāṛi), house, so বাড়ির কাছে (bāṛir kāche) means 'near the house'."
  "bn-1086":
    native: "The bank is beside the station."
    notes:
      "n1": "পাশে (pāśe), beside, follows a noun in the genitive: স্টেশনের (sṭeśoner), of the station."
  "bn-1087":
    native: "I go to the market."
    notes:
      "n1": "বাজারে (bājāre) is বাজার (bājār), market, with the locative ending -ে (-e); with যাই (jāi), I go, it means 'to the market'."
  "bn-1088":
    native: "The boys play in the field."
    notes:
      "n1": "ছেলেরা (chelerā) is ছেলে (chele), boy, with the plural ending -রা (rā)."
  "bn-1089":
    native: "We walk in the park."
    notes:
      "n1": "পার্কে (pārke) is পার্ক (pārk), park, with the locative ending -ে (-e), 'in the park'."
  "bn-1090":
    native: "He works in a hospital.; She works in a hospital. (respectful)"
    notes:
      "n1": "করেন (kôren) is the respectful present of করা (kôrā), to do; তিনি (tini), he or she, is the respectful subject."
  "bn-1091":
    native: "Where is the post office?"
  "bn-1092":
    native: "I go home from school."
    notes:
      "n1": "থেকে (theke) means 'from': স্কুল থেকে (skul theke) is 'from school'."
  "bn-1093":
    native: "There is a temple beside the river."
    notes:
      "n1": "একটা (ekṭā) before a noun means 'a' or 'one': একটা মন্দির (ekṭā mondir) is 'a temple'."
    bases:
      "আছে": "to be; there is"
  "bn-1094":
    native: "There is a pond in the village."
    notes:
      "n1": "একটা (ekṭā) before a noun means 'a' or 'one': একটা পুকুর (ekṭā pukur) is 'a pond'."
    bases:
      "আছে": "to be; there is"
  "bn-1095":
    native: "Which way is the police station?"
    notes:
      "n1": "কোন দিকে (kon dike) means 'which direction'; দিকে (dike) is the locative of দিক (dik), direction, with the ending -ে (-e)."
  "bn-1096":
    native: "Please go straight to the north."
    notes:
      "n1": "সোজা (śojā) means 'straight on'; উত্তর দিকে সোজা (uttor dike śojā) is 'straight to the north'."
  "bn-1097":
    native: "The shop is opposite the corner."
    notes:
      "n1": "উল্টোদিকে (ulṭodike) is a compound of উল্টো (ulṭo), opposite, and দিকে (dike), direction."
  "bn-1098":
    native: "The temple is across the river."
    notes:
      "n1": "নদীর ওপারে (nodir opāre) is 'across the river', with নদীর (nodir), the genitive of নদী (nodi), river."
