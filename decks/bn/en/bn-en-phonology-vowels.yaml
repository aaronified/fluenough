schema: 1
id: "bn-en-phonology-vowels"
kind: "layer"
core: "bn-phonology-vowels"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Bengali vowel sounds (IPA)"
description: "The vowels, nasal vowels and diphthongs of Bengali, one card each: the IPA symbol, the letters, example words and, where this course's words give one, a minimal pair. For learners who know the IPA or want to learn it. Variety taught: Standard Colloquial Bengali of Kolkata, with a note wherever Bangladeshi Standard (Dhaka) differs. This is a proposal, not yet confirmed by the owner, a Bengali speaker or a phonetician. The only JIPA illustration found, by Khan (2010), describes Bangladeshi Standard, so facts taken from it are marked as that; Wikipedia's page covers both and says where it knows they differ."
license: "CC-BY-SA-4.0"
authors:
  - { name: "Fluenough contributors" }
  - { name: "Wikipedia contributors (Bengali phonology; Help:IPA/Bengali)", url: "https://en.wikipedia.org/wiki/Bengali_phonology" }
source: "Khan (2010), 'Bengali (Bangladeshi Standard)', Illustration of the IPA, Journal of the International Phonetic Association 40(2): 221-225, doi 10.1017/S0025100310000071 (named in Wikipedia's references; the article itself was not read); also as cited by Wikipedia: Ferguson and Chowdhury (1960), Language 36(1): 22-59; Chatterji (1921), Bulletin of the School of Oriental and African Studies 2: 1-25; Masica (1991), The Indo-Aryan Languages, Cambridge University Press; Hayes and Lahiri (1991), Natural Language and Linguistic Theory 9: 47-96; Bhattacharya (2000), Bangla (Bengali). Text adapted from Wikipedia, 'Bengali phonology' and 'Help:IPA/Bengali', CC BY-SA 4.0, https://en.wikipedia.org/wiki/Bengali_phonology"
tags: ["ipa", "phonology", "unreviewed"]
cards:
  "bn-2024":
    native: "close front vowel (i); the letters ই (i) and ঈ (i)"
    notes:
      "n1": "Both ই (i) and ঈ (i) are said i: Bengali vowel length is not contrastive, so the two letters sound alike. The help page compares i to the 'ea' of 'beat'. In many northern Bangladeshi dialects ই (i) is the uncommon ɪ and ঈ (i) the usual i."
      "n2": "Minimal pair among this course's words: {1}, this person (here, respectful), and {2}, that person (there, respectful), differ only in the vowel, i against u."
    examples:
      "তিন": "3, three"
      "ডিম": "egg"
  "bn-2025":
    native: "close back vowel (u); the letters উ (u) and ঊ (u)"
    notes:
      "n1": "Both উ (u) and ঊ (u) are said u. The source adds that u may also be a near-close back [ʊ]."
      "n2": "Minimal pair among this course's words: {1}, light, and {2}, potato, differ only in the last vowel, o against u."
    examples:
      "দুধ": "milk"
      "ঘুম": "sleep"
  "bn-2026":
    native: "close-mid front vowel (e); the letter এ (e)"
    notes:
      "n1": "The help page compares e to the 'ay' of Scottish 'may'. The letter এ (e) is e in some words and æ in others (see the æ card and the spelling deck)."
      "n2": "Minimal pair among this course's words: {1}, here, and {2}, there, differ only in the first vowel, e against o."
      "n3": "Minimal pair among this course's words: {1}, who, and {2}, what, differ only in the vowel, e against i."
    examples:
      "কেন": "why"
      "সে": "he; she; that person"
  "bn-2027":
    native: "close-mid back vowel (o); the letters ও (o) and sometimes অ (ô)"
    notes:
      "n1": "The help page compares it to the 'o' of 'story'. The inherent vowel অ (ô) is said o in some words and ɔ in others, so o and ɔ are two vowels of one spelling. The page also lists the semivowel o̯."
      "n2": "Minimal pair among this course's words: {1}, socks, and {2}, fun; tastiness, differ only in the first vowel, o against ɔ."
      "n3": "Minimal pair among this course's words: {1}, to lift; to pick up; to take (a photo), and {2}, floor; storey, differ only in the first vowel, o against ɔ."
    examples:
      "ওঠা": "to get up; to rise"
      "ভোর": "dawn; early morning"
  "bn-2028":
    native: "open-mid or near-open front vowel (æ); the letters অ্যা (ê) or ্যা (yā), and এ (e) in some words"
    notes:
      "n1": "The source says æ never occurs outside the first syllable in native words: it began as the sound of a word-initial e and became a phoneme when a later vowel dropped out, as in একই (êkoi), once [ækoi̯] and now [æki]. It is usually near-open, æ, but may be open-mid, ɛ, as Khan (2010) writes it and especially in Dhaka."
      "n2": "The exceptions the source names come after a prefix to জ্ঞা (ggā): বিজ্ঞান (bijñān), science, has a long consonant before the æ. Some speakers say a for æ in জ্ঞান (jñān), knowledge, so that it sounds like গান (gān), song."
    examples:
      "ব্যাগ": "bag"
      "ব্যথা": "pain"
  "bn-2029":
    native: "open-mid back vowel (ɔ); the letter অ (ô)"
    notes:
      "n1": "The help page compares it to the 'o' of 'off'. It is the vowel every consonant letter carries unless a sign changes it, and it is often silent at the end of a word (see the spelling deck)."
      "n2": "Minimal pair among this course's words: {1}, water, and {2}, net, differ only in the vowel, ɔ against a."
    examples:
      "জল": "water"
      "ঘর": "room"
  "bn-2030":
    native: "open central vowel (a); the letter আ (ā)"
    notes:
      "n1": "The source says a is said ɐ in onomatopoeia and in words of more than one syllable, and as the more open a or aː in words of one syllable. The help page compares it to the 'a' of Australian 'father' or the 'u' of RP 'cut'."
      "n2": "Minimal pair among this course's words: {1}, water, and {2}, net, differ only in the vowel, a against ɔ."
    examples:
      "মাছ": "fish"
      "কাজ": "work"
  "bn-2031":
    native: "open-mid back unrounded vowel (ʌ), only in English loans"
    notes:
      "n1": "The source lists ʌ in brackets: it is found only in English loanwords with that vowel, and most speakers merge it with a, some with ɔ. Its example, বাস (bus), is said with ʌ, set against বাঁশ (bamboo) with a; this course writes বাস (bās) with a."
    examples:
      "বাস": "bus"
  "bn-2032":
    native: "a nasal i (ĩ)"
    notes:
      "n1": "A nasal vowel is the oral vowel said with air through the nose as well, written with the sign ঁ (candrabindu). Bengali is usually said to have up to seven nasal vowels, but they are not phonemic, or are missing, in many dialects, including most eastern ones (Islam 2018, as cited by Wikipedia)."
    examples:
      "ইঁদুর": "mouse; rat"
      "সিঁড়ি": "stairs"
  "bn-2033":
    native: "a nasal u (ũ)"
    notes:
      "n1": "A nasal u, written with the sign ঁ (candrabindu). Bengali is usually said to have up to seven nasal vowels, but they are not phonemic, or are missing, in many dialects, including most eastern ones (Islam 2018, as cited by Wikipedia)."
    examples:
      "উঁচু": "high; tall (of things)"
      "পৌঁছানো": "to arrive; to reach"
  "bn-2034":
    native: "a nasal e (ẽ)"
    notes:
      "n1": "A nasal e, written with the sign ঁ (candrabindu). Bengali is usually said to have up to seven nasal vowels, but they are not phonemic, or are missing, in many dialects, including most eastern ones (Islam 2018, as cited by Wikipedia)."
    examples:
      "পেঁপে": "papaya"
      "বেঁটে": "short (of a person)"
  "bn-2035":
    native: "a nasal o (õ)"
    notes:
      "n1": "A nasal o, written with the sign ঁ (candrabindu). Bengali is usually said to have up to seven nasal vowels, but they are not phonemic, or are missing, in many dialects, including most eastern ones (Islam 2018, as cited by Wikipedia)."
    examples:
      "ঠোঁট": "lip"
      "ফোঁটা": "drop; dot"
  "bn-2036":
    native: "a nasal a (ã)"
    notes:
      "n1": "A nasal a, written with the sign ঁ (candrabindu). Among this course's words it is the nasal vowel with clear pairs. Bengali is usually said to have up to seven nasal vowels, but they are not phonemic, or are missing, in many dialects, including most eastern ones (Islam 2018, as cited by Wikipedia)."
      "n2": "Minimal pair among this course's words: {1}, left (side), and {2}, or, differ only in the nasal, ã against a."
      "n3": "Minimal pair among this course's words: {1}, tied, and {2}, obstacle, differ only in the nasal, ã against a."
    examples:
      "বাঁ": "left (side)"
      "দাঁত": "tooth"
  "bn-2037":
    native: "a nasal æ (æ̃), marginal"
    notes:
      "n1": "The source lists æ̃ and ɔ̃ in brackets: they have no minimal pairs with their oral partners, though they are phonetically distinct, which makes their status as phonemes hard to define. Bengali is usually said to have up to seven nasal vowels, but they are not phonemic, or are missing, in many dialects, including most eastern ones (Islam 2018, as cited by Wikipedia)."
    examples:
      "হ্যাঁ": "yes"
  "bn-2038":
    native: "a nasal ɔ (ɔ̃), marginal"
    notes:
      "n1": "The second bracketed nasal vowel: see the æ̃ card. No word of this course's cards is a clear example of it, so this card has none. Bengali is usually said to have up to seven nasal vowels, but they are not phonemic, or are missing, in many dialects, including most eastern ones (Islam 2018, as cited by Wikipedia)."
  "bn-2039":
    native: "the diphthong ii̯"
    notes:
      "n1": "The source's example is nii, 'I take'. The semivowels e̯, i̯, o̯ and u̯ can form the glide of a diphthong; the number of Bengali diphthongs is not settled, with bounds of 17 and 31. Wikipedia itself asks how this differs from a plain long i."
  "bn-2040":
    native: "the diphthong iu̯"
    notes:
      "n1": "The source's example is biubhôl, 'upset'."
    examples:
      "কম্পিউটার": "computer"
  "bn-2041":
    native: "the diphthong ei̯"
    notes:
      "n1": "The source's example is dei, 'I give'."
    examples:
      "তেইশ": "23, twenty-three"
  "bn-2042":
    native: "the diphthong eu̯"
    notes:
      "n1": "The source's example is ḍheu, 'wave'."
  "bn-2043":
    native: "the diphthong æe̯"
    notes:
      "n1": "The source's example is nêe, 'they (singular) takes'."
  "bn-2044":
    native: "the diphthong ai̯"
    notes:
      "n1": "The source's example is pai, 'I find'."
    examples:
      "ভাই": "brother; younger brother"
      "তাই": "so; that's why"
  "bn-2045":
    native: "the diphthong ae̯"
    notes:
      "n1": "The source's example is pae, 'they (singular) find'."
  "bn-2046":
    native: "the diphthong au̯"
    notes:
      "n1": "The source's example is pau, 'sliced bread'."
  "bn-2047":
    native: "the diphthong ao̯"
    notes:
      "n1": "The source's example is pao, 'you find'."
    examples:
      "খাওয়া": "to eat; to drink"
      "পাওয়া": "to get; to find; to receive"
  "bn-2048":
    native: "the diphthong ɔe̯"
    notes:
      "n1": "The source's example is nôe, 'they (singular) are not'. This course writes নয় (nôy), nine, with a j, nɔj."
    examples:
      "নয়": "9, nine"
  "bn-2049":
    native: "the diphthong ɔo̯"
    notes:
      "n1": "The source's example is nôo, 'you are not'."
    examples:
      "চওড়া": "wide"
  "bn-2050":
    native: "the diphthong oi̯"
    notes:
      "n1": "The source's example is noi, 'I am not'. This is one of the two diphthongs with a letter of its own, ঐ (oi)."
    examples:
      "বই": "book"
      "দই": "curd; yoghurt"
  "bn-2051":
    native: "the diphthong oo̯"
    notes:
      "n1": "The source's example is dhoo, 'you wash'."
  "bn-2052":
    native: "the diphthong ou̯"
    notes:
      "n1": "The source's example is nouka, 'boat'. This is the other diphthong with a letter of its own, ঔ (ou)."
    examples:
      "নৌকা": "boat"
      "চৌঠা": "the 4th (of a month)"
  "bn-2053":
    native: "the diphthong ui̯"
    notes:
      "n1": "The source's example is dhui, 'I wash'."
    examples:
      "দুই": "2, two"
      "তুই": "you (intimate)"
