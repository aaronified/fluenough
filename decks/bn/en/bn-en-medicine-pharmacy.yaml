core: "bn-medicine-pharmacy"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Medicine: at the pharmacy"
license: "CC-BY-SA-4.0"
description: "Phrases and words for buying medicine at a pharmacy: the prescription, the dose and the price."
cards:
  "bn-7120":
    native: "Do you have the prescription?"
    notes: { n1: "আপনার কাছে (āpnār kāche) is literally near you, the usual way to ask whether someone has something with them." }
  "bn-7121":
    native: "Take this medicine twice a day."
    notes: { n1: "দুবার (dubār) is দু (du), two, with বার (bār), time; দিনে (dine) is দিন (din), day, with -এ (-e), per day." }
  "bn-7122":
    native: "Take it after a meal."
    notes: { n1: "খাওয়ার (khāoyār) is খাওয়া (khāoyā), eating, with -র (-r), which links it to পরে (pôre), after." }
  "bn-7123":
    native: "Take it before a meal."
  "bn-7124":
    native: "Take one tablet in the morning and one at night."
  "bn-7125":
    native: "Take one spoonful of the syrup twice a day."
    notes: { n1: "করে (kôre) after an amount means each time; এক চামচ করে (ek cāmoc kôre) is one spoonful each time." }
  "bn-7126":
    native: "Where should I apply the ointment?"
    notes: { n1: "মলমটা (môlomṭā) is মলম (môlom), ointment, with -টা (-ṭā), the one in question; লাগাব (lāgābo) is from লাগানো (lāgāno), to apply." }
  "bn-7127":
    native: "When does this medicine expire?"
    notes: { n1: "শেষ হবে (śeś hôbe) means will end; মেয়াদ (meyād) is the period of validity, so the question is when the validity ends.", n2: "শেষ (śeś), end or finished, is new here; the course teaches শেষ করা (śeś kôrā), to finish something, and শেষে (śeśe), at the end." }
  "bn-7128":
    native: "Do not take it on an empty stomach."
    notes: { n1: "খাবেন না (khāben nā) is a polite prohibition: না (nā) comes after the verb." }
  "bn-7129":
    native: "How much is this?"
