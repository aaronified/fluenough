kind: "layer"
core: "bn-medicine-clinic"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Medicine: a clinic appointment"
license: "CC-BY-SA-4.0"
description: "Phrases and words for a doctor's visit: the problem, the examination, tests, medicine and a follow-up."
cards:
  "bn-7100":
    native: "What seems to be the problem?"
    notes: { n1: "আপনার (āpnār) is আপনি (āpni), you in the polite form, with -র (-r), of; a doctor uses the polite form with a patient." }
  "bn-7101":
    native: "How many days have you had the fever?"
    notes: { n1: "ধরে (dhôre) after a length of time means for or since; কত দিন ধরে (kôto din dhôre) asks for how long." }
  "bn-7102":
    native: "Where does it hurt?"
  "bn-7103":
    native: "Open your mouth."
    notes: { n1: "খুলুন (khulun) is the polite command from খোলা (kholā), to open, for আপনি (āpni)." }
  "bn-7104":
    native: "Breathe in deeply."
    notes: { n1: "শ্বাস নিন (śāś nin) is literally take a breath; নিন (nin) is the polite command from নেওয়া (neoyā), to take." }
  "bn-7105":
    native: "You will need to have a blood test."
    notes: { n1: "করাতে হবে (kôrāte hôbe) means must have it done: করানো (kôrāno), to have something done, with হবে (hôbe), will be." }
  "bn-7106":
    native: "Please take this medicine regularly."
    notes: { n1: "খাবেন (khāben) is the polite form of খাওয়া (khāoyā), to eat or take, and is how a doctor gives instructions." }
  "bn-7107":
    native: "Please come back after a week."
  "bn-7108":
    native: "When will I get the report?"
    notes: { n1: "পাব (pābo) is I will get, from পাওয়া (pāoyā), to get." }
  "bn-7109":
    native: "I am sending you to the hospital."
    notes: { n1: "পাঠাচ্ছি (pāṭhācchi) is I am sending, the present continuous of পাঠানো (pāṭhāno), to send." }
