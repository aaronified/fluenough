schema: 1
id: "bn-en-grammar-likes"
kind: "layer"
core: "bn-grammar-likes"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Likes and dislikes"
description: "I like, I love, I don't like, my favourite: four ways Bengali says it. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "grammar"]
cards:
  "bn-0715":
    native: "I like sweets."
    notes:
      "n1": "The liker takes -র (-rô): 'to me sweets feel good'. লাগে (lāge) stays the same for everyone: তোর (tor), তোমার (tomār), আপনার (āponār), ওর (or), ওঁর মিষ্টি ভালো লাগে (om̐r miśṭi bhālo lāge)."
    bases:
      "লাগে": "to feel; to be needed; to take (of time)"
  "bn-0716":
    native: "I don't like this song."
    bases:
      "এই": "this"
      "গানটা": "song"
      "লাগে": "to feel; to be needed; to take (of time)"
  "bn-0717":
    native: "Do you like Kolkata?"
    notes:
      "n1": "কি (ki) after the subject turns it into a yes-or-no question."
    bases:
      "কলকাতা": "Kolkata"
      "লাগে": "to feel; to be needed; to take (of time)"
  "bn-0718":
    native: "She doesn't like tea. / He doesn't like tea. (respectful)"
    notes:
      "n1": "উনি (uni) takes -র (-rô) as ওঁর (om̐r), often said ওনার (onār); both are accepted."
    bases:
      "লাগে": "to feel; to be needed; to take (of time)"
  "bn-0719":
    native: "I really enjoyed it."
    notes:
      "n1": "For one experience, the past লাগল (lāgol): সিনেমাটা ভালো লাগল (sinemāṭā bhālo lāgol), I liked the film. আলাপ করে ভালো লাগল (ālāp kôre bhālo lāglo), nice to meet you."
    bases:
      "লাগল": "to feel; to be needed; to take (of time)"
  "bn-0720":
    native: "I love fish."
    notes:
      "n1": "ভালোবাসা (bhālobāsā) is an ordinary verb: no -র (-rô) on the subject, and the verb changes for the person: আমি ভালোবাসি (āmi bhālobāsi), তুই ভালোবাসিস (tui bhālobāsis), তুমি ভালোবাসো (tumi bhālobāso), আপনি ভালোবাসেন (āpni bhālobāsen), ও ভালোবাসে (o bhālobāse), উনি ভালোবাসেন (uni bhālobāsen). It is used for food and pastimes as much as for people."
    bases:
      "ভালোবাসি": "to love"
  "bn-0721":
    native: "I love you."
    notes:
      "n1": "The person loved takes -কে (-ke)."
    bases:
      "ভালোবাসি": "to love"
  "bn-0722":
    native: "He loves playing cricket. / She loves playing cricket."
    notes:
      "n1": "'Loves doing': the verb's -তে (-te) form, then ভালোবাসা (bhālobāsā)."
    bases:
      "ক্রিকেট": "cricket"
      "ভালোবাসে": "to love"
  "bn-0723":
    native: "I don't like spicy food."
    notes:
      "n1": "পছন্দ করা (pôchondo kôrā) is a noun with করা (kôrā), and only করা (kôrā) changes: আপনি পছন্দ করেন (āpni pôchondo kôren), ও পছন্দ করে (o pôchondo kôre). In the negative it is 'don't like': ঝাল খাবার পছন্দ করি না (jhāl khābār pôchondo kori nā)."
  "bn-0724":
    native: "liking; choice"
    notes:
      "n1": "কোনটা পছন্দ (konṭā pôchondo)? Which one do you like? Of something you have picked out: এটা আমার পছন্দ হয়েছে (eṭā āmār pôchondo hôyeche), I like this one."
  "bn-0725":
    native: "Rosogolla is my favourite sweet."
    notes:
      "n1": "প্রিয় (priyo) is an adjective, so there is no verb. 'Not my favourite' is আমার প্রিয় নয় (āmār priyo nôy), or in speech না (nā)."
