native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word verbs: joined form + auxiliary (aspectual)"
description: "Twenty Bengali verbs made of a joined verb form and an auxiliary: to wash off, to cut off, to break down, to take off, to fall asleep, to lie down, to burst in, to wake up, to hand over, to pour out, to wake someone up, to hear and take in, to recognise, to make a mental note of, to say in advance, to forget, to leave, to go out, to come out, to sit up awake. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "bn-6150":
    native: "to wash off; to rinse away"
    notes:
      "u1": "ধুয়ে (dhuye) is the joined form of ধোয়া (dhoyā); with ফেলা (phelā) it means to wash something off or away completely. Only ফেলা changes with person and tense. Attested on bn.wiktionary, page ধুয়ে ফেলা (dhuye phelā)."
  "bn-6151":
    native: "to cut off; to cut down"
    notes:
      "u1": "কেটে (keṭe) is the joined form of কাটা (kāṭā); with ফেলা (phelā) it means to cut something off or down. Only ফেলা changes with person and tense. Attested on bn.wiktionary, page কেটে ফেলা (keṭe phelā)."
  "bn-6152":
    native: "to break down; to demolish"
    notes:
      "u1": "ভেঙে (bheṅe) is the joined form of ভাঙা (bhāṅā); with ফেলা (phelā) it means to break something up or pull it down. Only ফেলা changes with person and tense. Attested on bn.wiktionary, page ভেঙে ফেলা (bheṅe phelā)."
  "bn-6153":
    native: "to take off; to remove"
    notes:
      "u1": "খুলে (khule) is the joined form of খোলা (kholā); with ফেলা (phelā) it means to take something off or remove it completely. Only ফেলা changes with person and tense. Attested on bn.wiktionary, page খুলে ফেলা (khule phelā)."
  "bn-6154":
    native: "to fall asleep"
    notes:
      "u1": "ঘুমিয়ে (ghumiye) is the joined form of ঘুমোনো (ghumono); with পড়া (pôṛā) it means to drop off to sleep. Only পড়া changes with person and tense. Attested on bn.wiktionary, page ঘুমিয়ে পড়া (ghumiye pôṛā)."
  "bn-6155":
    native: "to lie down; to go to bed"
    notes:
      "u1": "শুয়ে (śuye) is the joined form of শোয়া (śoyā); with পড়া (pôṛā) it means to lie down or go to bed. Only পড়া changes with person and tense. Attested on en.wiktionary, page শুয়ে পড়া (śuye pôṛā)."
  "bn-6156":
    native: "to burst in; to slip in"
    notes:
      "u1": "ঢুকে (ḍhuke) is the joined form of ঢোকা (ḍhokā); with পড়া (pôṛā) it means to enter a place suddenly or without warning. Only পড়া changes with person and tense. Attested on bn.wiktionary, page ঢুকে পড়া (ḍhuke pôṛā)."
  "bn-6157":
    native: "to wake up; to awaken"
    notes:
      "u1": "জেগে (jege) is the joined form of জাগা (jāgā); with ওঠা (oṭhā) it means to wake from sleep. Only ওঠা changes with person and tense. Attested on bn.wiktionary, page জেগে ওঠা (jege oṭhā)."
  "bn-6158":
    native: "to hand over; to hand to someone"
    notes:
      "u1": "তুলে (tule) is the joined form of তোলা (tolā); with দেওয়া (deoā) it means to put something into someone's hands. Only দেওয়া changes with person and tense. Attested on bn.wiktionary, page তুলে দেওয়া (tule deoā)."
  "bn-6159":
    native: "to pour out"
    notes:
      "u1": "ঢেলে (ḍhele) is the joined form of ঢালা (ḍhālā); with দেওয়া (deoā) it means to pour a liquid out of one place into another. Only দেওয়া changes with person and tense. Attested on bn.wiktionary, page ঢেলে দেওয়া (ḍhele deoā)."
  "bn-6160":
    native: "to wake someone up"
    notes:
      "u1": "জাগিয়ে (jāgiye) is the joined form of জাগানো (jāgāno); with দেওয়া (deoā) it means to wake someone from sleep. Only দেওয়া changes with person and tense. Attested on bn.wiktionary, page জাগিয়ে দেওয়া (jāgiye deoā)."
  "bn-6161":
    native: "to hear and take in"
    notes:
      "u1": "শুনে (śune) is the joined form of শোনা (śonā); with নেওয়া (neoā) it means to listen to something and take it in. Only নেওয়া changes with person and tense. Attested on bn.wiktionary, page শুনে নেওয়া (śune neoā)."
  "bn-6162":
    native: "to recognise; to learn to identify"
    notes:
      "u1": "চিনে (cine) is the joined form of চেনা (cenā); with নেওয়া (neoā) it means to identify someone or something. Only নেওয়া changes with person and tense. Attested on bn.wiktionary, page চিনে নেওয়া (cine neoā)."
  "bn-6163":
    native: "to make a mental note of; to remember by sight"
    notes:
      "u1": "চিনে (cine) is the joined form of চেনা (cenā); with রাখা (rākhā) it means to recognise someone so as to remember them later. Only রাখা changes with person and tense. Attested on bn.wiktionary, page চিনে রাখা (cine rākhā)."
  "bn-6164":
    native: "to say in advance; to tell beforehand"
    notes:
      "u1": "বলে (bôle) is the joined form of বলা (bôlā); with রাখা (rākhā) it means to tell someone something ahead of time. Only রাখা changes with person and tense. Attested on bn.wiktionary, page বলে রাখা (bôle rākhā)."
  "bn-6165":
    native: "to forget"
    notes:
      "u1": "ভুলে (bhule) is the joined form of ভোলা (bholā); with যাওয়া (jāoā) it means to forget a thing or to do a thing. Only যাওয়া changes with person and tense. Attested on en.wiktionary, page ভুলে যাওয়া (bhule jāoā)."
  "bn-6166":
    native: "to leave; to go away"
    notes:
      "u1": "চলে (côle) is the joined form of চলা (côlā); with যাওয়া (jāoā) it means to go away from a place. Only যাওয়া changes with person and tense. Attested on en.wiktionary, page চলে যাওয়া (côle jāoā)."
  "bn-6167":
    native: "to go out; to leave"
    notes:
      "u1": "বেরিয়ে (beriye) is the joined form of বেরোনো (berono); with যাওয়া (jāoā) it means to go out of a place. Only যাওয়া changes with person and tense. Attested on bn.wiktionary, page বেরিয়ে যাওয়া (beriye jāoā)."
  "bn-6168":
    native: "to come out"
    notes:
      "u1": "বেরিয়ে (beriye) is the joined form of বেরোনো (berono); with আসা (āśā) it means to come out of a place. Only আসা changes with person and tense. Attested on bn.wiktionary, page বেরিয়ে আসা (beriye āśā)."
  "bn-6169":
    native: "to sit up awake; to stay up"
    notes:
      "u1": "জেগে (jege) is the joined form of জাগা (jāgā); with বসা (bôśā) it means to stay awake sitting up, often waiting or watching over someone. Only বসা changes with person and tense. Attested on bn.wiktionary, page জেগে বসা (jege bôśā)."
