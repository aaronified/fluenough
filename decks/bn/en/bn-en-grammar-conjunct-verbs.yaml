schema: 1
id: "bn-en-grammar-conjunct-verbs"
kind: "layer"
core: "bn-grammar-conjunct-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Noun + করা (kôrā)"
description: "Many Bengali verbs are a noun and করা (kôrā), and only করা (kôrā) changes: রান্না করি (rānnā kori), রান্না করেছি (rānnā kôrechi). Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "grammar"]
cards:
  "bn-0666":
    notes:
      "n1": "Only করা (kôrā) changes: আমি রান্না করি (āmi rānnā kori), ও রান্না করছে (o rānnā kôroche). Basic Bangla 8.4 lists these noun + করা (kôrā) verbs."
  "bn-0677":
    native: "to work"
    "examples": {
      "কাজ করার সময় গরম লাগে।": {"native": "It feels hot while working.", "bases": {}}
    }
  "bn-0678":
    native: "to do the shopping"
    notes:
      "n1": "Food shopping, at the market."
  "bn-0660":
    native: "to have a bath; to shower"
    notes:
      "n1": "Also গোসল করা (gośol kôrā)."
  "bn-0679":
    native: "to phone"
    notes:
      "n1": "The one phoned takes -কে (-ke): মাকে ফোন করো (māke phon kôro), phone Mum."
  "bn-0680":
    native: "to chat"
    notes:
      "n1": "গল্প (gôlp) is a story; গল্প করা (gôlpo kôrā) is a long, easy talk."
    bases:
      "গল্প": "a story; a chat"
  "bn-0681":
    native: "to rest"
    notes:
      "n1": "Also বিশ্রাম নেওয়া (biśrām neoā), with নেওয়া (neoyā), to take."
    bases:
      "বিশ্রাম": "rest"
  "bn-0682":
    native: "to exercise"
    bases:
      "ব্যায়াম": "exercise"
    "examples": {
      "ব্যায়াম করা ভালো।": {"native": "Exercise is good.", "bases": {}}
    }
  "bn-0683":
    native: "to clean"
    "examples": {
      "নদী পরিষ্কার করা হবে।": {"native": "The river will be cleaned.", "bases": {}},
      "আমি ছেলেকে ঘর পরিষ্কার করালাম।": {"native": "I had my son clean the room.", "bases": {"করালাম": "had (him) do"}}
    }
  "bn-0684":
    native: "to marry"
    bases:
      "বিয়ে": "marriage; wedding"
  "bn-0685":
    native: "to ask"
    notes:
      "n1": "The one asked takes -কে (-ke): ওকে জিজ্ঞেস করুন (oke jigges korun), ask him. জিজ্ঞাসা করা (jiggāśā kôrā) is the more formal form."
    bases:
      "জিজ্ঞেস": "asking; a question"
    "examples": {
      "সে জিজ্ঞেস করল তুমি কোথায় যাবে।": {"native": "She asked where you would go.", "bases": {"জিজ্ঞেস": "to ask"}}
    }
  "bn-0686":
    native: "to start"
    bases:
      "শুরু": "start; beginning"
    "examples": {
      "ব্যবসা শুরু করার আগে ভাবো।": {"native": "Think before starting a business. (familiar)", "bases": {"শুরু": "starting", "ভাবো": "think"}},
      "ব্যবসা শুরু করার আগে পরিকল্পনা করো।": {"native": "Plan before starting a business. (familiar)", "bases": {"শুরু": "starting"}}
    }
  "bn-0687":
    native: "to finish"
    bases:
      "শেষ": "end; finish"
  "bn-0688":
    native: "to make a mistake"
  "bn-0689":
    native: "to decide; to fix"
    "examples": {
      "জমির সীমানা ঠিক করা হলো।": {"native": "The boundary of the land was fixed.", "bases": {}}
    }
  "bn-0690":
    native: "to help"
    notes:
      "n1": "The one helped takes -কে (-ke): আমাকে সাহায্য করুন (āmāke śāhājjo korun), help me."
    "examples": {
      "ক্ষতিগ্রস্তদের সাহায্য করা হবে।": {"native": "The damaged people will be helped.", "bases": {"ক্ষতিগ্রস্তদের": "damaged"}}
    }
  "bn-0691":
    native: "to try"
    bases:
      "চেষ্টা": "effort; an attempt"
  "bn-0692":
    native: "to wait"
    notes:
      "n1": "Waiting for someone is -র জন্য (-rô jonno): তোমার জন্য অপেক্ষা করছি (tomār jonno ôpekkhā kôrochi), I'm waiting for you."
    bases:
      "অপেক্ষা": "waiting"
    "examples": {
      "অপেক্ষা করা কঠিন।": {"native": "Waiting is hard.", "bases": {}}
    }
  "bn-0693":
    native: "to like"
    notes:
      "n1": "আমি চা পছন্দ করি (āmi cā pôchondo kori), I like tea."
  "bn-0694":
    native: "to sing"
    notes:
      "n1": "Also গান গাওয়া (gān gāoā)."
    bases:
      "গান": "song"
  "bn-0695":
    native: "to get angry"
  "bn-0696":
    native: "to remember (to come to mind)"
    notes:
      "n1": "With পড়া (pôṛā), not করা (kôrā), and the one who remembers takes -র (-rô): আমার মনে পড়েছে (āmār mône pôṛeche), I've remembered."
    bases:
      "মনে": "mind; heart"
  "bn-0697":
    native: "to be late"
    notes:
      "n1": "With হওয়া (hôoyā), and the one who is late takes -র (-rô): আমার দেরি হয়ে গেছে (āmār deri hôye geche), I'm late."
    bases:
      "দেরি": "delay; lateness"
