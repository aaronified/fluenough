"id": "bn-en-cooking"
"kind": "layer"
"core": "bn-cooking"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Cooking"
"description": "Frying, boiling, stirring and straining, the spices of a Bengali kitchen, and the steps of a simple recipe. Not yet checked by a Bengali speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "bn-1840":
    "native": "to wash (things)"
    "notes":
      "n1": "Used for washing things such as hands, plates and bowls. The everyday word for washing."
    "examples":
      "খাওয়ার আগে হাত ধোয়ো।":
        "native": "Wash your hands before eating."
        "bases":
          "ধোয়ো": "to wash"
      "আমি বাটিগুলো ধুই।":
        "native": "I wash the bowls."
        "bases":
          "ধুই": "to wash"
  "bn-1841":
    "native": "boiled; cooked by boiling"
    "notes":
      "n1": "Used for food cooked in water, such as boiled eggs, meat or dal. The opposite is raw."
    "examples":
      "ডিমটা সেদ্ধ করুন।": "Boil the egg, please."
      "এই মাংসটা ভালো করে সেদ্ধ হয়েছে।":
        "native": "This meat has been boiled well."
        "bases":
          "এই": "this"
  "bn-1842":
    "native": "to boil (a liquid)"
    "notes":
      "n1": "To bring a liquid such as water or milk to the boil. Its base verb is for a liquid that boils by itself."
    "bases":
      "ফোটানো": "to make boil"
    "examples":
      "জলটা ফোটান।":
        "native": "Boil the water, please."
        "bases":
          "ফোটান": "to boil (a liquid)"
      "দুধ ফুটলে নামিয়ে নিন।":
        "native": "Take it off when the milk boils."
        "bases":
          "ফুটলে": "to boil, on its own"
          "নামিয়ে": "to take down; to lift off"
  "bn-1843":
    "native": "to stir"
    "notes":
      "n1": "Used when cooking, to keep food moving in the pan so that it does not stick or burn."
    "examples":
      "ডালটা আস্তে নাড়ুন।":
        "native": "Stir the dal gently."
        "bases":
          "আস্তে": "gently; slowly"
          "নাড়ুন": "to stir"
      "পেঁয়াজ নাড়তে থাকো।":
        "native": "Keep stirring the onion."
        "bases":
          "নাড়তে": "to stir"
  "bn-1844":
    "native": "to strain"
    "notes":
      "n1": "To pour a liquid through a strainer, to keep the solids in the pan."
    "examples":
      "ঝোলটা ছেঁকে নিন।":
        "native": "Strain the broth."
        "bases":
          "ঝোলটা": "broth; the liquid of a curry"
          "ছেঁকে": "to strain"
      "ভাতের ফ্যান ছেঁকে ফেলুন।":
        "native": "Strain off the rice water."
        "bases":
          "ফ্যান": "the starchy water left after boiling rice"
          "ছেঁকে": "to strain"
          "ফেলুন": "to throw away; to pour away"
  "bn-1845":
    "native": "to knead; to rub in with the hands"
    "notes":
      "n1": "Used for flour that is kneaded with water, and for rubbing spices or salt into meat or fish."
    "examples":
      "মাংসে নুন মাখান।":
        "native": "Rub salt into the meat."
        "bases":
          "মাখান": "to rub; to knead"
      "আটা জল দিয়ে মাখুন।":
        "native": "Knead the flour with water."
        "bases":
          "আটা": "flour"
          "মাখুন": "to knead"
  "bn-1846":
    "native": "to sprinkle; to spread"
    "notes":
      "n1": "To scatter something in small amounts over food, such as coriander leaves or sugar."
    "examples":
      "ধনেপাতা ছড়িয়ে দিন।":
        "native": "Sprinkle the coriander leaves."
        "bases":
          "ছড়িয়ে": "to sprinkle; to spread"
      "উপরে একটু চিনি ছড়িয়ে দিন।":
        "native": "Sprinkle a little sugar on top."
        "bases":
          "উপরে": "on top; above"
          "ছড়িয়ে": "to sprinkle; to spread"
  "bn-1847":
    "native": "to cover"
    "notes":
      "n1": "To put a lid or cover on a pot, so that food keeps its heat or does not get dirty."
    "examples":
      "পাত্রটা ঢাকো।":
        "native": "Cover the pot."
        "bases":
          "পাত্রটা": "pot; vessel"
          "ঢাকো": "to cover"
      "ঢাকনা দিয়ে ঢাকুন।":
        "native": "Cover it with a lid."
        "bases":
          "ঢাকনা": "lid; cover"
          "ঢাকুন": "to cover"
  "bn-1848":
    "native": "smell"
    "notes":
      "n1": "The smell of food while it cooks, or of a dish when it is ready. Also used for a bad smell."
    "examples":
      "রান্নার গন্ধ খুব ভালো।":
        "native": "The smell of the cooking is very good."
        "bases":
          "রান্নার": "cooking; the act of cooking"
      "মাছটার গন্ধ ভালো না।":
        "native": "The fish does not smell good."
        "bases":
          "না": "not"
  "bn-1849":
    "native": "taste; flavour"
    "notes":
      "n1": "The taste of a dish. Salt and spices change it, and cooks check it before serving."
    "examples":
      "এর স্বাদ খুব মিষ্টি।":
        "native": "Its taste is very sweet."
        "bases":
          "এর": "its; of this"
      "নুন দিয়ে স্বাদ ঠিক করুন।":
        "native": "Adjust the taste with salt."
        "bases":
          "ঠিক": "right; correct; to adjust"
  "bn-1850":
    "native": "sour"
    "notes":
      "n1": "Sour in taste, as tamarind, lime or unripe mango is. The opposite of sweet."
    "examples":
      "আমটা খুব টক।": "The mango is very sour."
      "তেঁতুল দিলে ডালটা টক হয়।":
        "native": "When you add tamarind, the dal turns sour."
        "bases":
          "তেঁতুল": "tamarind"
  "bn-1851":
    "native": "bitter"
    "notes":
      "n1": "Bitter in taste, as bitter gourd or neem is. The opposite of sweet."
    "examples":
      "করলাটা খুব তিতা।":
        "native": "The bitter gourd is very bitter."
        "bases":
          "করলাটা": "bitter gourd"
      "নিমপাতা খুব তিতা।":
        "native": "Neem leaves are very bitter."
        "bases":
          "নিমপাতা": "neem leaves"
  "bn-1852":
    "native": "ripe"
    "notes":
      "n1": "Of fruit, when it is ready to eat. A green or unripe fruit is raw."
    "examples":
      "আমগুলো পাকা।": "The mangoes are ripe."
      "কলাটা পাকা হলে মিষ্টি লাগে।":
        "native": "When the banana is ripe, it tastes sweet."
        "bases":
          "লাগে": "to taste; to seem"
  "bn-1853":
    "native": "recipe"
    "notes":
      "n1": "A word from English. The steps and the ingredients of a dish written down, as on a recipe card."
    "examples":
      "এই রেসিপিটা খুব সহজ।":
        "native": "This recipe is very easy."
        "bases":
          "এই": "this"
          "রেসিপিটা": "recipe"
      "রেসিপিটা আমাকে দিন।":
        "native": "Give me the recipe."
        "bases":
          "রেসিপিটা": "recipe"
  "bn-1854":
    "native": "ingredients"
    "notes":
      "n1": "Everything a dish needs, written at the top of a recipe."
    "examples":
      "সব উপকরণ তৈরি।":
        "native": "All the ingredients are ready."
        "bases":
          "তৈরি": "ready; made"
      "উপকরণগুলো ধুয়ে নিন।":
        "native": "Please wash the ingredients."
        "bases":
          "উপকরণগুলো": "ingredients"
  "bn-1855":
    "native": "step (of a process)"
    "notes":
      "n1": "One stage of a recipe or of any process. A recipe card lists its steps in order."
    "examples":
      "প্রথম ধাপে পেঁয়াজ ভাজুন।":
        "native": "Fry the onion as the first step."
        "bases":
          "ধাপে": "step"
          "ভাজুন": "to fry"
      "পরের ধাপ খুব সহজ।":
        "native": "The next step is very easy."
        "bases":
          "পরের": "next; following"
  "bn-1856":
    "native": "ghee; clarified butter"
    "notes":
      "n1": "Butter with the milk solids removed, used for frying and for the last touch on a dish."
    "examples":
      "ঘি দিয়ে ভাত খাই।": "I eat rice with ghee."
      "ঘিয়ে হলুদটা ভাজুন।":
        "native": "Fry the turmeric in ghee."
        "bases":
          "ঘিয়ে": "ghee"
          "ভাজুন": "to fry"
  "bn-1857":
    "native": "turmeric"
    "notes":
      "n1": "A yellow spice from a root, used in almost every Bengali dish. It also stains."
    "examples":
      "মাছে একটু হলুদ দিন।": "Add a little turmeric to the fish."
      "হলুদের রং খুব সুন্দর।":
        "native": "The colour of turmeric is very beautiful."
        "bases":
          "হলুদের": "turmeric"
          "রং": "colour"
  "bn-1858":
    "native": "cumin"
    "notes":
      "n1": "A small brown seed spice. It is often fried in oil at the start of a dish."
    "examples":
      "জিরা ভাজলে সুন্দর গন্ধ হয়।":
        "native": "Cumin smells lovely when it is fried."
        "bases":
          "ভাজলে": "to fry"
      "এক চামচ জিরা দিন।": "One spoon of cumin, please."
  "bn-1859":
    "native": "black pepper"
    "notes":
      "n1": "A hot spice from the peppercorn, used whole or ground. It is hotter than chilli in some dishes."
    "examples":
      "মাংসে একটু গোলমরিচ দিন।": "Add a little black pepper to the meat."
      "গোলমরিচ খুব ঝাল।": "Black pepper is very hot."
  "bn-1860":
    "native": "cardamom"
    "notes":
      "n1": "A green pod spice with a sweet smell. It is used in tea, rice and sweets."
    "examples":
      "চায়ে একটা এলাচ দিন।": "Add one cardamom to the tea."
      "এলাচের গন্ধ ভালো লাগে।":
        "native": "I like the smell of cardamom."
        "bases":
          "এলাচের": "cardamom"
          "লাগে": "to feel; to seem"
  "bn-1861":
    "native": "bay leaf"
    "notes":
      "n1": "A dried leaf that is fried in oil or put into a curry for its smell. It is not eaten."
    "examples":
      "তরকারিতে দুটো তেজপাতা দিন।":
        "native": "Put two bay leaves in the curry."
        "bases":
          "তরকারিতে": "curry; a vegetable dish"
      "তেজপাতা তেলে ভাজুন।":
        "native": "Fry the bay leaves in oil."
        "bases":
          "ভাজুন": "to fry"
  "bn-1862":
    "native": "coriander leaves"
    "notes":
      "n1": "Fresh green leaves, used at the end of a dish as a garnish."
    "examples":
      "খাওয়ার আগে ধনেপাতা ছড়িয়ে দিন।": "Sprinkle coriander leaves before eating."
      "ধনেপাতা দিয়ে সাজান।":
        "native": "Garnish with coriander leaves."
        "bases":
          "সাজান": "to decorate; to garnish"
  "bn-1863":
    "native": "tempering; spices fried in hot oil at the start"
    "notes":
      "n1": "Whole spices fried in hot oil at the start of a dish, which give it its smell. The step is called tempering."
    "examples":
      "প্রথমে তেলে ফোড়ন দিন।": "First, add the tempering to the oil."
      "ফোড়নের গন্ধ খুব ভালো।":
        "native": "The tempering smells very good."
        "bases":
          "ফোড়নের": "tempering"
  "bn-1864":
    "native": "strainer; sieve"
    "notes":
      "n1": "A mesh or perforated tool that holds back solids when a liquid is poured through it."
    "examples":
      "ছাঁকনি দিয়ে জল ছেঁকে নিন।": "Strain the water through a strainer."
      "ছাঁকনিটা ধুয়ে রাখুন।":
        "native": "Wash the strainer and put it away."
        "bases":
          "ছাঁকনিটা": "strainer"
