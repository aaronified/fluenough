native: { code: "en", iso639_3: "eng", name: "English" }
name: "Numbers 1–20"
description: "One to twenty. Every number up to a hundred has its own word in Bengali, so these are the ones to learn first."
license: "CC-BY-SA-4.0"
tags: ["beginner"]
cards:
  "bn-0202":
    native: "1, one"
    notes:
      "n1": "Bengali has its own digits, ১ ২ ৩ (1 2 3). Prices, signs and bus numbers use them or 1 2 3, so learn to read both."
  "bn-0203":
    native: "2, two"
    notes:
      "n1": "Shortened to দু (du) before a word: দু কাপ চা (du kāp cā), two cups of tea."
  "bn-0204":
    native: "3, three"
  "bn-0205":
    native: "4, four"
  "bn-0206":
    native: "5, five"
  "bn-0207":
    native: "6, six"
  "bn-0208":
    native: "7, seven"
    notes:
      "n1": "Said almost like ষাট (60), which ends in the retroflex ট (ṭô)."
  "bn-0209":
    native: "8, eight"
  "bn-0210":
    native: "9, nine"
  "bn-0211":
    native: "10, ten"
  "bn-0212":
    native: "11, eleven"
  "bn-0213":
    native: "12, twelve"
  "bn-0214":
    native: "13, thirteen"
  "bn-0215":
    native: "14, fourteen"
    notes:
      "n1": "Also written চৌদ্দ (coudd)."
  "bn-0216":
    native: "15, fifteen"
  "bn-0217":
    native: "16, sixteen"
  "bn-0218":
    native: "17, seventeen"
  "bn-0219":
    native: "18, eighteen"
    notes:
      "n1": "Also written আঠেরো (āṭhero), as it is often said."
  "bn-0220":
    native: "19, nineteen"
  "bn-0221":
    native: "20, twenty"
    notes:
      "n1": "Also বিশ (biś)."
