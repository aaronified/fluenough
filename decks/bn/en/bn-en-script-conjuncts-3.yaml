core: "bn-script-conjuncts-3"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Bengali conjuncts, third set"
description: "Further common joins of two letters, each with its reading. Two letters are joined with a hasanta, or a letter takes the r-sign. A cluster with no taught word has no example. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "bn-5600":
    native: "n + dh, said ndh"
    notes:
      "n1": "ন (nô) and ধ (dhô) joined with a hasanta, the mark that drops the first letter's vowel. Said ndhô."
    "examples": {
      "বন্ধু": {"native": "friend", "bases": {}}
    }
  "bn-5601":
    native: "n + m, said nm"
    notes:
      "n1": "ন (nô) and ম (mô) joined with a hasanta, the mark that drops the first letter's vowel. Said nmô."
