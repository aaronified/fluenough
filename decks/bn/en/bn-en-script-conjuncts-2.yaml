name: "Bengali conjuncts, more"
description: "Further common two-letter joins, each with its reading. Two letters are joined with a hasanta, or a letter takes the r-sign. A cluster with no taught word has no example. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
