tags: ["beginner", "unreviewed"]
cards:
  "bn-1297":
    native: "The cow gives milk."
    notes:
      "n1": "দেয় (dey), gives, is the third-person form of দেওয়া (deoyā), to give, with the -য় (-y) ending."
  "bn-1298":
    native: "The dog runs in the road."
  "bn-1299":
    native: "The birds sit in the tree."
    bases:
      "গাছে": "tree"
  "bn-1300":
    native: "Fish live in the water."
  "bn-1301":
    native: "Tigers live in the Sundarbans."
    bases:
      "সুন্দরবনে": "the Sundarbans, the mangrove forest of the delta"
  "bn-1302":
    native: "I am afraid of snakes."
    notes:
      "n1": "ভয় পাই (bhôy pāi), I am afraid, is literally 'I get fear': the verb is পাওয়া (pāoyā), to get."
  "bn-1303":
    native: "We have a cat."
    bases:
      "আছে": "to be; there is"
  "bn-1304":
    native: "The cat drinks milk."
  "bn-1305":
    native: "The elephant is very big."
  "bn-1306":
    native: "The horses are in the field."
    notes:
      "n1": "-গুলো (-gulo) marks a plural of things, as in ঘোড়াগুলো (ghoṛāgulo), the horses; people and birds take -রা (-rā), as in পাখিরা (pākhirā)."
    bases:
      "আছে": "to be; there is"
  "bn-1307":
    native: "There are many ducks in the village."
    bases:
      "আছে": "to be; there is"
  "bn-1308":
    native: "The boy calls the goat."
  "bn-1309":
    native: "The monkey climbs the tree."
    notes:
      "n1": "ওঠে (oṭhe) is ওঠা (oṭhā), to rise, and with a tree as the place it means to climb."
    bases:
      "গাছে": "tree"
  "bn-1310":
    native: "The peacock is very beautiful."
