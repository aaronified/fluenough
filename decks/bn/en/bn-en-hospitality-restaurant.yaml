native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hospitality: restaurant"
license: "CC-BY-SA-4.0"
description: "Words and phrases for restaurant staff: the table, the menu, the order, serving and the bill."
cards:
  "bn-7160":
    native: "There is a table free for you."
  "bn-7161":
    native: "Here is the menu."
  "bn-7162":
    native: "What will you have?"
    notes: { n1: "খাবেন (khāben) is the polite future of খাওয়া (khāoyā), to eat, for আপনি (āpni); the staff ask it with কী (kī), what." }
  "bn-7163":
    native: "Will you have tea?"
    notes: { n1: "কি (ki), without a long ī, turns the sentence into a yes-or-no question; কী (kī) asks what." }
  "bn-7164":
    native: "Shall I make it less spicy?"
    notes: { n1: "দেব (debo) is I will give; asked about a dish, it offers to make it less hot." }
  "bn-7165":
    native: "Please wait a moment, the food is coming."
  "bn-7166":
    native: "Will you need anything else?"
    notes: { n1: "লাগবে (lāgbe) is will be needed, from লাগা (lāgā); it is the usual way to ask whether the guest wants anything more." }
  "bn-7167":
    native: "Here is your bill."
    notes: { n1: "বিলটা (biloṭā) is বিল (bil), bill, with -টা (-ṭā), the one in question; বিল as a bill comes from English bill." }
  "bn-7168":
    native: "I am serving your food now."
    notes: { n1: "পরিবেশন করছি (poribeśon kôrchi) is I am serving; a phrase of attested words, পরিবেশন being in the Bengali Wiktionary as serving food at a meal." }
  "bn-7170":
    native: "order (of food)"
    "examples": {
      "আপনার অর্ডার কী?": {"native": "What is your order?", "bases": {}}
    }
  "bn-7171":
    native: "tip, gratuity"
    notes: { n1: "বকশিশ (bôkśiś) is also spelt বখশিশ (bôkhśiś); it is a gift of money for good service." }
    "examples": {
      "এই নিন আপনার বকশিশ।": {"native": "Here is your tip.", "bases": {}}
    }
