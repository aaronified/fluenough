schema: 1
id: "bn-en-quantities"
kind: "layer"
core: "bn-quantities"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Quantities"
description: "How much and how many: measures, parts and the words that say a little, a lot, each and another. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC0-1.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-1311":
    native: "a little; few"
    wiktionary: true
    notes:
      "n1": "It means little in amount and few in number: {1}, a little sugar. Its opposite is {2}."
  "bn-1312":
    native: "a few; several"
    wiktionary: true
    notes:
      "n1": "It always joins a counting word: {1}, a few things; {2}, a few people."
  "bn-1313":
    native: "plenty of; a lot of"
    wiktionary: true
    notes:
      "n1": "It goes with things you count and things you measure: {1}, plenty of people; {2}, plenty of water."
  "bn-1314":
    native: "a little; slight; ordinary"
    notes:
      "n1": "{1} is a little salt. Said of a matter it also means minor, ordinary or 'mere'."
  "bn-1315":
    native: "whole; entire; full"
    notes:
      "n1": "{1} is the whole day. It is also 'full' as in full price: {2}."
  "bn-1316":
    native: "half"
    notes:
      "n1": "It goes before a noun: {1}, half a litre. The shorter form is {2}: {3}, half a kilo."
  "bn-1317":
    native: "half (of a whole)"
    notes:
      "n1": "It is half of something already named: {1}, the half of it. From Sanskrit {2}, half."
  "bn-1318":
    native: "dozen"
    wiktionary: true
    notes:
      "n1": "A word from English. Eggs are bought by the dozen, {1}, or in fours, {2}."
  "bn-1319":
    native: "pair"
    wiktionary: true
    notes:
      "n1": "Shoes, socks and earrings come by the {1}: {2}, a pair of shoes. As a verb stem it also means to join."
  "bn-1320":
    native: "packet"
    notes:
      "n1": "A word from English. Tea, biscuits and cigarettes are all sold by the packet."
  "bn-1321":
    native: "litre"
    notes:
      "n1": "A word from English. Milk, oil and petrol are sold by the litre."
  "bn-1322":
    native: "piece; bit"
    notes:
      "n1": "{1} is a piece of paper. {2} is 'in pieces'. Also spelled {3}."
  "bn-1323":
    native: "drop; dot"
    wiktionary: true
    notes:
      "n1": "On Bhai Phonta, in the autumn festival season, a sister marks a {1}, a dot of sandal paste, on her brother's forehead. The day is named after the dot."
      "n2": "{1} is one drop of water."
  "bn-1324":
    native: "fist; handful"
    wiktionary: true
    notes:
      "n1": "{1} is a handful of rice. In Bangladesh the mobile phone is formally the {2}, the 'fist phone'."
  "bn-1325":
    native: "basket"
    wiktionary: true
    notes:
      "n1": "A basket woven of cane or bamboo, for fruit, vegetables and fish."
  "bn-1326":
    native: "sack"
    wiktionary: true
    notes:
      "n1": "A big sack, often of jute: {1}. A word from Persian."
  "bn-1327":
    native: "time; occasion; day (of the week)"
    wiktionary: true
    notes:
      "n1": "After a number it counts times: {1}, once; {2}, twice. It is also the day of the week: {3}, Monday."
  "bn-1328":
    native: "share; part; division"
    wiktionary: true
    notes:
      "pair": "Only the aspirate moves: {1}, share, begins with the aspirated [bh]; {2}, tiger, ends in the aspirated [gh]."
      "n2": "{1} is my share. {2} is to divide, in sums, or to share."
  "bn-1329":
    native: "per; every"
    wiktionary: true
    notes:
      "n1": "Before a noun: {1}, per kilo; {2}, every day. It is often joined to the noun: {3}."
  "bn-1330":
    native: "each; every one"
    wiktionary: true
    notes:
      "n1": "{1} is each boy. On its own it is {2}, each person."
  "bn-1331":
    native: "another; one more"
    wiktionary: true
    notes:
      "n1": "{1} is one more, another one. It is made of {2}, more, and {3}, one."
  "bn-1332":
    native: "other; different"
    wiktionary: true
    notes:
      "n1": "{1} is another day. It means a different one, where {2} means one more of the same."
  "bn-1333":
    native: "any; no"
    wiktionary: true
    notes:
      "pair": "Only the last vowel differs: {1}, any, has an [o]; {2}, which, has none."
      "n2": "With a negative it means 'no': {1}, there are no mosquitoes. In a question it means 'any'."
