schema: 1
id: "bn-en-quantities"
kind: "layer"
core: "bn-quantities"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Quantities"
description: "How much and how many: measures, parts and the words that say a little, a lot, each and another. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-1311":
    native: "a little; few"
    wiktionary: true
    notes:
      "n1": "It means little in amount and few in number: {1}, a little sugar. Its opposite is {2}."
    "examples": {
      "ঘরে অল্প চিনি আছে।": {"native": "There is a little sugar at home.", "bases": {"আছে": "to be; there is"}}
    }
  "bn-1312":
    native: "a few; several"
    wiktionary: true
    notes:
      "n1": "It always joins a counting word: {1}, a few things; {2}, a few people."
    "examples": {
      "কয়েকজন আহত হয়েছে।": {"native": "A few people have been injured.", "bases": {"কয়েকজন": "few; several"}},
      "এর দাম কয়েক ডলার।": {"native": "It costs a few dollars.", "bases": {"এর": "its", "কয়েক": "few; several"}}
    }
  "bn-1313":
    native: "plenty of; a lot of"
    wiktionary: true
    notes:
      "n1": "It goes with things you count and things you measure: {1}, plenty of people; {2}, plenty of water."
    "examples": {
      "বর্ষায় প্রচুর বৃষ্টি হয়।": {"native": "In the monsoon there is a lot of rain.", "bases": {}},
      "বাজারে প্রচুর মাছ আছে।": {"native": "There is plenty of fish in the market.", "bases": {"আছে": "to be; there is"}}
    }
  "bn-1314":
    native: "a little; slight; ordinary"
    notes:
      "n1": "{1} is a little salt. Said of a matter it also means minor, ordinary or 'mere'."
    "examples": {
      "সামান্য নুন দিন।": {"native": "Please add a little salt.", "bases": {}}
    }
  "bn-1315":
    native: "whole; entire; full"
    notes:
      "n1": "{1} is the whole day. It is also 'full' as in full price: {2}."
  "bn-1316":
    native: "half"
    notes:
      "n1": "It goes before a noun: {1}, half a litre. The shorter form is {2}: {3}, half a kilo."
  "bn-1317":
    native: "half (of a whole)"
    notes:
      "n1": "It is half of something already named: {1}, the half of it. From Sanskrit {2}, half."
    "examples": {
      "অর্ধেকটা আপনি নিন।": {"native": "You take half. (respectful)", "bases": {"অর্ধেকটা": "half (of a whole)"}}
    }
  "bn-1318":
    native: "dozen"
    wiktionary: true
    notes:
      "n1": "A word from English. Eggs are bought by the dozen, {1}, or in fours, {2}."
    "examples": {
      "এক ডজন ডিম কত?": {"native": "How much is a dozen eggs?", "bases": {}}
    }
  "bn-1319":
    native: "pair"
    wiktionary: true
    notes:
      "n1": "Shoes, socks and earrings come by the {1}: {2}, a pair of shoes. As a verb stem it also means to join."
    "examples": {
      "এক জোড়া জুতো কত?": {"native": "How much is a pair of shoes?", "bases": {}}
    }
  "bn-1320":
    native: "packet"
    notes:
      "n1": "A word from English. Tea, biscuits and cigarettes are all sold by the packet."
    "examples": {
      "এক প্যাকেট চা দিন।": {"native": "Please give me a packet of tea.", "bases": {}}
    }
  "bn-1321":
    native: "litre"
    notes:
      "n1": "A word from English. Milk, oil and petrol are sold by the litre."
    "examples": {
      "বাবা এক লিটার দুধ আনেন।": {"native": "Father brings a litre of milk. (respectful)", "bases": {}}
    }
  "bn-1322":
    native: "piece; bit"
    notes:
      "n1": "{1} is a piece of paper. {2} is 'in pieces'. Also spelled {3}."
    "examples": {
      "এক টুকরো রুটি দিন।": {"native": "Please give me a piece of bread.", "bases": {}}
    }
  "bn-1323":
    native: "drop; dot"
    wiktionary: true
    notes:
      "n1": "On Bhai Phonta, in the autumn festival season, a sister marks a {1}, a dot of sandal paste, on her brother's forehead. The day is named after the dot."
      "n2": "{1} is one drop of water."
    "examples": {
      "এক ফোঁটা জল নেই।": {"native": "There is not a drop of water.", "bases": {"নেই": "there is not"}}
    }
  "bn-1324":
    native: "fist; handful"
    wiktionary: true
    notes:
      "n1": "{1} is a handful of rice. In Bangladesh the mobile phone is formally the {2}, the 'fist phone'."
  "bn-1325":
    native: "basket"
    wiktionary: true
    notes:
      "n1": "A basket woven of cane or bamboo, for fruit, vegetables and fish."
    "examples": {
      "ঝুড়িতে অনেক আম আছে।": {"native": "There are many mangoes in the basket.", "bases": {"আছে": "to be; there is", "ঝুড়িতে": "basket"}},
      "ময়লার ঝুড়িটা খালি করো।": {"native": "Empty the rubbish bin. (familiar)", "bases": {"ঝুড়িটা": "basket"}}
    }
  "bn-1326":
    native: "sack"
    wiktionary: true
    notes:
      "n1": "A big sack, often of jute: {1}. A word from Persian."
  "bn-1327":
    native: "time; occasion; day (of the week)"
    wiktionary: true
    notes:
      "n1": "After a number it counts times: {1}, once; {2}, twice. It is also the day of the week: {3}, Monday."
  "bn-1328":
    native: "share; part; division"
    wiktionary: true
    notes:
      "pair": "Only the aspirate moves: {1}, share, begins with the aspirated [bh]; {2}, tiger, ends in the aspirated [gh]."
      "n2": "{1} is my share. {2} is to divide, in sums, or to share."
    "examples": {
      "এটা আমার ভাগ।": {"native": "This is my share.", "bases": {}},
      "আমরা কাজ ভাগ করে নিই।": {"native": "We share the work between us.", "bases": {"নিই": "take"}}
    }
  "bn-1329":
    native: "per; every"
    wiktionary: true
    notes:
      "n1": "Before a noun: {1}, per kilo; {2}, every day. It is often joined to the noun: {3}."
    "examples": {
      "তার প্রতি ঘৃণা নেই।": {"native": "I have no hatred for him.", "bases": {"প্রতি": "towards", "নেই": "there is not"}},
      "তোমার প্রতি আমার কৃতজ্ঞতা।": {"native": "My gratitude is towards you.", "bases": {"প্রতি": "per; every"}}
    }
  "bn-1330":
    native: "each; every one"
    wiktionary: true
    notes:
      "n1": "{1} is each boy. On its own it is {2}, each person."
  "bn-1331":
    native: "another; one more"
    wiktionary: true
    notes:
      "n1": "{1} is one more, another one. It is made of {2}, more, and {3}, one."
    "examples": {
      "আমাকে আরেকটা প্লেট দিন।": {"native": "Please give me another plate.", "bases": {"আরেকটা": "another; one more"}}
    }
  "bn-1332":
    native: "other; different"
    wiktionary: true
    notes:
      "n1": "{1} is another day. It means a different one, where {2} means one more of the same."
    "examples": {
      "অন্য রং আছে?": {"native": "Do you have another colour?", "bases": {"আছে": "to be; there is", "অন্য": "other; different"}}
    }
  "bn-1333":
    native: "any; no"
    wiktionary: true
    notes:
      "pair": "Only the last vowel differs: {1}, any, has an [o]; {2}, which, has none."
      "n2": "With a negative it means 'no': {1}, there are no mosquitoes. In a question it means 'any'."
    "examples": {
      "কোনো সমস্যা নেই।": {"native": "No problem.", "bases": {"সমস্যা": "problem", "নেই": "there is not", "কোনো": "any; no"}},
      "তার কোনো জবাব নেই।": {"native": "There is no reply from him.", "bases": {"তার": "his; her", "নেই": "there is not; does not have"}}
    }
