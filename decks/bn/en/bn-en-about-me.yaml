schema: 1
id: "bn-en-about-me"
kind: "layer"
core: "bn-about-me"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "About me"
description: "Your name and age, where you are from, where you live, and the people around you."
license: "CC-BY-SA-4.0"
tags: ["beginner"]
cards:
  "bn-0191":
    native: "name"
  "bn-0192":
    native: "My name is …"
    notes:
      "n1": "There is no 'is': 'my name …'. In the present, Bengali needs no verb to say what something is. To say where someone is, or how they are, it uses আছে (āche): ভালো আছি (bhālo āchi), I'm fine."
  "bn-0193":
    native: "What is your name?"
  "bn-0194":
    native: "I'm from …"
    notes:
      "n1": "Literally 'I have come from …'. থেকে (theke), 'from', comes after the place. আসা (āśā) changes its stem in the perfect: এস- (eś-)."
  "bn-0195":
    native: "I live in …"
    notes:
      "n1": "The place takes -এ (-e), or after a vowel -য় (-yô) or -তে (-te): আমি কলকাতায় থাকি (āmi kôlokātāy thāki), I live in Kolkata; আমি ঢাকায় থাকি (āmi ḍhākāy thāki), I live in Dhaka."
  "bn-0196":
    native: "home; house"
    notes:
      "n1": "বাড়ি (bāṛi) is home, wherever you live. Also বাসা (bāśā), for the place you live now, with বাড়ি (bāṛi) the family home."
  "bn-0197":
    native: "family"
  "bn-0198":
    native: "work"
  "bn-0199":
    native: "city; town"
  "bn-0200":
    native: "country"
  "bn-0201":
    native: "language"
  "bn-0416":
    native: "age"
  "bn-0417":
    native: "How old are you?"
  "bn-0418":
    native: "I'm thirty."
    notes:
      "n1": "'My age thirty': no 'years' and no verb. In speech 30 is often তিরিশ (tiriś)."
  "bn-0419":
    native: "foreigner; foreign"
  "bn-0420":
    native: "a Bengali (person)"
    notes:
      "n1": "The language is বাংলা (bāṅlā); its people, wherever they live, are বাঙালি (bāṅāli)."
  "bn-0421":
    native: "Indian"
  "bn-0422":
    native: "Bangladeshi"
