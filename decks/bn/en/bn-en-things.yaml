schema: 1
id: "bn-en-things"
kind: "layer"
core: "bn-things"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Things around you"
description: "Books and pens, watches and glasses, bags and phones, locks, bottles and soap, and the vehicles of the road, the track, the river and the air. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-1139":
    native: "book"
    wiktionary: true
    notes:
      "n1": "The Amar Ekushey Book Fair in Dhaka is held every February, the month of Language Movement Day, and thousands of books are published for it."
      "n2": "It ends in a vowel letter of its own, so it takes {1} before a noun: {2}, of the book."
    "examples": {
      "বইগুলো কোথায়?": {"native": "Where are the books?", "bases": {"বইগুলো": "book"}},
      "ইতিহাস বই পড়ো।": {"native": "Read the history book.", "bases": {"বই": "book"}}
    }
  "bn-1140":
    native: "notebook; exercise book"
    wiktionary: true
    notes:
      "n1": "Shops open a new account book, a {1}, on Pohela Boishakh, the Bengali New Year, and invite their customers for sweets."
    "examples": {
      "উপস্থিতি খাতা কোথায়?": {"native": "Where is the attendance register?", "bases": {"খাতা": "notebook; exercise book"}},
      "পরীক্ষক খাতা দেখছেন।": {"native": "The examiner is checking the answer books.", "bases": {"খাতা": "notebook; exercise book"}}
    }
  "bn-0052":
    notes:
      "n1": "A word from Persian, from Arabic, which took it from Greek: the same word is behind English 'calamus'."
    "examples": {
      "আমার কলম নেই।": {"native": "I don't have a pen.", "bases": {"নেই": "there is not"}},
      "আপনি কলম দিয়ে লেখেন।": {"native": "You write with a pen. (respectful)", "bases": {}}
    }
  "bn-1142":
    native: "pencil"
    notes:
      "n1": "A word from English."
  "bn-1143":
    native: "paper"
    wiktionary: true
    notes:
      "n1": "In speech the newspaper is also just {1}, 'the paper': {2}, today's paper."
    "examples": {
      "আমি কাগজে লিখি।": {"native": "I write on paper.", "bases": {"কাগজে": "paper"}},
      "এই কাগজ বৈধ।": {"native": "This paper is valid.", "bases": {"এই": "this", "কাগজ": "paper"}}
    }
  "bn-1144":
    native: "letter"
    wiktionary: true
    notes:
      "n1": "A letter that is written and sent: {1}, to write a letter."
    "examples": {
      "খামে চিঠি ভরো।": {"native": "Put the letter in the envelope. (familiar)", "bases": {"খামে": "envelope", "ভরো": "put in", "চিঠি": "letter"}},
      "চিঠিটা টাইপ করো।": {"native": "Type the letter. (familiar)", "bases": {"টাইপ": "type", "চিঠিটা": "letter"}}
    }
  "bn-1145":
    native: "picture; photo; film"
    wiktionary: true
    notes:
      "n1": "It is a picture, a photo, a painting and also a film: {1}, to take a photo; {2}, to draw."
    "examples": {
      "ছবিটা ব্লকবাস্টার।": {"native": "The film is a blockbuster.", "bases": {"ছবিটা": "picture; photo; film"}},
      "এই ছবিটা ভৌতিক।": {"native": "This film is a horror film.", "bases": {"এই": "this", "ছবিটা": "picture; photo; film"}}
    }
  "bn-1146":
    native: "watch; clock"
    wiktionary: true
    notes:
      "n1": "{1} is a wristwatch and {2} a wall clock."
    "examples": {
      "আমার ঘড়িটা নতুন।": {"native": "My watch is new.", "bases": {"ঘড়িটা": "watch; clock"}},
      "এটা ডিজিটাল ঘড়ি।": {"native": "This is a digital clock.", "bases": {"ঘড়ি": "watch; clock"}}
    }
  "bn-1147":
    native: "glasses; spectacles"
    wiktionary: true
    notes:
      "n1": "It is singular in form: {1}, to wear glasses. A word from Persian."
  "bn-1148":
    native: "umbrella"
    wiktionary: true
    notes:
      "n1": "It is needed from the first rains. {1} is to hold up an umbrella."
    "examples": {
      "আপনার ছাতাটা কোথায়?": {"native": "Where is your umbrella? (respectful)", "bases": {"ছাতাটা": "umbrella"}},
      "আপনি ছাতা নিন।": {"native": "Please take an umbrella.", "bases": {"নিন": "to take"}}
    }
  "bn-1149":
    native: "bag"
    wiktionary: true
    notes:
      "n1": "A word from English."
    "examples": {
      "অতিরিক্ত ব্যাগ লাগবে?": {"native": "Do you need an extra bag?", "bases": {}},
      "ওই ব্যাগটা ভারী।": {"native": "That bag is heavy.", "bases": {"ওই": "that", "ব্যাগটা": "bag"}}
    }
  "bn-1150":
    native: "cloth bag; shopping bag"
    notes:
      "n1": "The cloth or plastic bag people carry to the market: {1}."
    "examples": {
      "বাজারে যাব, সঙ্গে থলে নেব।": {"native": "I will go to the market and take a cloth bag.", "bases": {}}
    }
  "bn-1151":
    native: "mobile phone"
    wiktionary: true
    notes:
      "n1": "Short for 'mobile phone'. People say {1} for the phone itself and {2} for a call."
    "examples": {
      "আমার একটা মোবাইল আছে।": {"native": "I have a mobile phone.", "bases": {"আছে": "to be; there is"}},
      "আজকাল সবাই মোবাইলে কথা বলে।": {"native": "Nowadays everyone talks on the phone.", "bases": {"মোবাইলে": "mobile phone"}}
    }
  "bn-1152":
    native: "phone; telephone"
    wiktionary: true
    notes:
      "n1": "{1} is to phone someone; {2} is to pick up a call."
    "examples": {
      "ফোনটা বাজছে।": {"native": "The phone is ringing.", "bases": {"ফোনটা": "phone; telephone"}},
      "ফোনটা বাজল।": {"native": "The phone rang.", "bases": {"বাজল": "to ring (of a phone)", "ফোনটা": "phone; telephone"}}
    }
  "bn-1153":
    native: "computer"
    wiktionary: true
    notes:
      "n1": "A word from English."
    "examples": {
      "কম্পিউটারটা চালু করুন।": {"native": "Start the computer. (respectful)", "bases": {"চালু": "running; on", "কম্পিউটারটা": "computer"}},
      "আমি কম্পিউটারের প্রশিক্ষণ নিয়েছি।": {"native": "I have taken computer training.", "bases": {"প্রশিক্ষণ": "training", "কম্পিউটারের": "computer"}}
    }
  "bn-1154":
    native: "television; TV"
    notes:
      "n1": "Said as the letters T and V. The long form is {1}."
    "examples": {
      "আমরা টিভি দেখি।": {"native": "We watch television.", "bases": {}}
    }
  "bn-1155":
    native: "lock; padlock"
    wiktionary: true
    notes:
      "n1": "Not {1}, rhythm or palm: {2} ends in a long vowel."
      "n2": "{1} is to lock; the key is a {2}."
    "examples": {
      "দরজায় তালা লাগান।": {"native": "Please lock the door.", "bases": {"লাগান": "to fix; to put on; to apply"}},
      "সে চাবিটা তালায় ঢোকাল।": {"native": "She put the key into the lock.", "bases": {"ঢোকাল": "to put in", "তালায়": "lock; padlock"}}
    }
  "bn-1156":
    native: "box"
    wiktionary: true
    notes:
      "n1": "A word from English."
    "examples": {
      "গহনাগুলো বাক্সে রাখো।": {"native": "Keep the jewellery in the box. (familiar)", "bases": {"গহনাগুলো": "jewellery", "বাক্সে": "box"}},
      "সে বাক্সটা নামাল।": {"native": "She put the box down.", "bases": {"নামাল": "to lower", "বাক্সটা": "box"}}
    }
  "bn-1157":
    native: "bottle"
    wiktionary: true
    notes:
      "n1": "A word from Portuguese."
    "examples": {
      "বোতলগুলো পুনর্ব্যবহার করো।": {"native": "Recycle the bottles. (familiar)", "bases": {"বোতলগুলো": "bottles"}},
      "বোতলে জল আছে।": {"native": "There is water in the bottle.", "bases": {"আছে": "to be; there is", "বোতলে": "bottle"}}
    }
  "bn-1158":
    native: "bucket"
    wiktionary: true
    notes:
      "n1": "A word from Portuguese."
    "examples": {
      "বালতিটা খালি করো।": {"native": "Empty the bucket. (familiar)", "bases": {"বালতিটা": "bucket"}},
      "বালতিতে জল নেই।": {"native": "There is no water in the bucket.", "bases": {"নেই": "there is not", "বালতিতে": "bucket"}}
    }
  "bn-1159":
    native: "soap"
    wiktionary: true
    notes:
      "n1": "It belongs to the same family of words as English 'soap'."
  "bn-1160":
    native: "mirror"
    wiktionary: true
    notes:
      "n1": "A word from Persian."
  "bn-1161":
    native: "comb"
    notes:
      "n1": "{1} is to comb one's hair."
  "bn-1162":
    native: "lamp; light"
    wiktionary: true
    notes:
      "pair": "Not {1}, bowl: {2} has the tongue on the teeth, {1} curled back."
      "n2": "{1} is to switch on a light; literally, to light the lamp."
    "examples": {
      "বাতিটা নেভাও।": {"native": "Switch off the light. (familiar)", "bases": {"নেভাও": "switch off (familiar)", "বাতিটা": "lamp; light"}},
      "ঘরটা অন্ধকার, বাতিটা জ্বালাও।": {"native": "The room is dark, switch on the light. (familiar)", "bases": {"অন্ধকার": "dark", "জ্বালাও": "switch on (familiar)", "বাতিটা": "lamp; light"}}
    }
  "bn-1163":
    native: "car; vehicle"
    wiktionary: true
    notes:
      "n1": "It is a car and, more widely, a wheeled vehicle; a train is also called a {1} in speech."
    "examples": {
      "গাড়িটা একটু সরো।": {"native": "Move the car a little. (familiar)", "bases": {"সরো": "to move aside", "গাড়িটা": "car; vehicle"}},
      "গাড়িটা গ্যারেজে রাখো।": {"native": "Keep the car in the garage. (familiar)", "bases": {"গ্যারেজে": "garage", "গাড়িটা": "car; vehicle"}}
    }
  "bn-1164":
    native: "train"
    wiktionary: true
    notes:
      "n1": "Also {1}. A train is the way most people cross Bengal."
    "examples": {
      "আমি ট্রেনটা ধরেছি।": {"native": "I caught the train.", "bases": {"ট্রেনটা": "train"}},
      "আমি ট্রেনে যাই।": {"native": "I go by train.", "bases": {"ট্রেনে": "train"}}
    }
  "bn-1165":
    native: "bicycle"
    wiktionary: true
    notes:
      "n1": "A bicycle. A cycle rickshaw, the common rickshaw of a Bengal town, is a {1}."
  "bn-1166":
    native: "boat"
    wiktionary: true
    notes:
      "n1": "{1} is to row a boat. A ferry across a river is a {2}."
    "examples": {
      "কাগজের নৌকা ভাসল।": {"native": "The paper boat floated.", "bases": {"ভাসল": "to float", "নৌকা": "boat"}},
      "নৌকাটা জলে ভাসছে।": {"native": "The boat is floating on the water.", "bases": {"ভাসছে": "to float", "নৌকাটা": "boat"}}
    }
  "bn-1167":
    native: "aeroplane"
    wiktionary: true
    notes:
      "n1": "A word from Sanskrit; the airport is a {1}."
    "examples": {
      "বিমানটা উড়ল।": {"native": "The plane took off.", "bases": {"উড়ল": "to fly", "বিমানটা": "aeroplane"}}
    }
  "bn-1168":
    native: "towel"
    wiktionary: true
    notes:
      "n1": "A word from Portuguese. The thin cotton towel that Bengal uses is a {1}."
