schema: 1
id: "bn-en-adverbs"
kind: "layer"
core: "bn-adverbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Adverbs: how often, how well, when"
description: "Adverbs of how often, when, how well and how much: always, often, sometimes, never, now, soon, slowly, very, almost and the rest. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-1523":
    native: "always"
    notes:
      "n1": "{1} is the usual way to say every time: always tea, the time of day in the morning."
    examples:
      "সে সবসময় সময়মতো আসে।":
        native: "He always comes on time."
        bases:
          "আসে": { meaning: "to come" }
      "আমি সবসময় সকালে চা খাই।":
        native: "I always have tea in the morning."
        bases:
          "খাই": { meaning: "to eat" }
  "bn-1524":
    native: "often"
    notes:
      "n1": "{1}, often late, is said of a person who is often late."
    examples:
      "আমরা প্রায়ই বাজারে যাই।":
        native: "We often go to the market."
        bases:
          "যাই": { meaning: "to go" }
      "তুমি প্রায়ই দেরি করো।":
        native: "You are often late."
        bases:
          "করো": { meaning: "to do" }
  "bn-1525":
    native: "sometimes; now and then"
    notes:
      "n1": "It is said twice, {1}, to mean now and then."
    examples:
      "মাঝে মাঝে বৃষ্টি হয়।":
        native: "It sometimes rains."
        bases:
          "হয়": { meaning: "to happen" }
      "মাঝে মাঝে আমি বই পড়ি।":
        native: "Sometimes I read books."
        bases:
          "পড়ি": { meaning: "to read" }
  "bn-1526":
    native: "ever; at any time"
    notes:
      "n1": "With a question, {1} means ever. The strong form for never is {2}."
    examples:
      "তুমি কি কখনো ঢাকায় গেছ?":
        native: "Have you ever been to Dhaka?"
        bases:
          "গেছ": { meaning: "to go" }
      "আমি কখনো মিথ্যা বলি না।":
        native: "I never tell lies."
        bases:
          "বলি": { meaning: "to say" }
  "bn-1527":
    native: "never"
    notes:
      "n1": "{1}: I have never seen it. The verb comes before না (nā)."
    examples:
      "আমি এই ছবিটা কখনোই দেখিনি।":
        native: "I have never seen this film."
        bases:
          "দেখিনি": { meaning: "to see" }
      "সে কখনোই দেরি করে না।":
        native: "He is never late."
        bases:
          "করে": { meaning: "to do" }
  "bn-1528":
    native: "every day; daily"
    notes:
      "n1": "{1} is the usual way to say that something happens every day."
    examples:
      "আমি রোজ হাঁটি।":
        native: "I walk every day."
        bases:
          "হাঁটি": { meaning: "to walk" }
      "রোজ সকালে খবরের কাগজ আসে।":
        native: "The newspaper comes every morning."
        bases:
          "আসে": { meaning: "to come" }
  "bn-1529":
    native: "every day; daily"
    notes:
      "n1": "{1} is more formal than the everyday word for every day."
    examples:
      "সে প্রতিদিন অফিসে যায়।":
        native: "He goes to the office every day."
        bases:
          "যায়": { meaning: "to go" }
      "প্রতিদিন একটু পড়ো।":
        native: "Read a little every day."
        bases:
          "পড়ো": { meaning: "to read" }
  "bn-1530":
    native: "again and again; repeatedly"
    notes:
      "n1": "{1} is said of a thing done many times over, not just once."
    examples:
      "সে বারবার একই কথা বলে।":
        native: "He says the same thing again and again."
        bases:
          "বলে": { meaning: "to say" }
      "বারবার চেষ্টা করো।":
        native: "Try again and again."
        bases:
          "করো": { meaning: "to do" }
  "bn-1531":
    native: "again; once more"
    notes:
      "n1": "{1}: it is raining again, and we will meet again."
    examples:
      "আবার বৃষ্টি হচ্ছে।":
        native: "It is raining again."
        bases:
          "হচ্ছে": { meaning: "to happen" }
      "আবার দেখা হবে।":
        native: "We will meet again."
        bases:
          "হবে": { meaning: "to happen" }
  "bn-1532":
    native: "before; earlier"
    notes:
      "n1": "{1} is before a time, as in before eating. {2} is said of earlier times, from before."
    examples:
      "আমি আগে ঢাকায় থাকতাম।":
        native: "I used to live in Dhaka before."
        bases:
          "থাকতাম": { meaning: "to stay" }
      "খাওয়ার আগে হাত ধোও।":
        native: "Wash your hands before eating."
        bases:
          "ধোও": { meaning: "to wash" }
  "bn-1533":
    native: "still; yet"
    notes:
      "n1": "{1} is said of something that goes on: there is still time."
    examples:
      "সে এখনো ঘুমায়।":
        native: "He is still sleeping."
        bases:
          "ঘুমায়": { meaning: "to sleep" }
      "এখনো সময় আছে।":
        native: "There is still time."
        bases:
          "আছে": { meaning: "to stay; to be (in a place)" }
  "bn-1534":
    native: "now; at this time"
    notes:
      "n1": "{1} is now, at this moment. In a question about the time it asks what time it is now."
    examples:
      "আমি এখন বাড়ি যাব।":
        native: "I will go home now."
        bases:
          "যাব": { meaning: "to go" }
      "এখন কয়টা বাজে?":
        native: "What time is it now?"
        bases:
          "বাজে": { meaning: "to strike (of the clock)" }
  "bn-1535":
    native: "then; at that time"
    notes:
      "n1": "{1} refers back to a time already named."
    examples:
      "তখন বৃষ্টি হচ্ছিল।":
        native: "It was raining then."
        bases:
          "হচ্ছিল": { meaning: "to happen" }
      "তখন আমি ছোট ছিলাম।": "I was small then."
  "bn-1536":
    native: "after that; then"
    notes:
      "n1": "{1} links one thing to the next: first this, then that."
    examples:
      "আগে খাও, তারপর ঘুমাও।":
        native: "Eat first, then sleep."
        bases:
          "খাও": { meaning: "to eat" }
          "ঘুমাও": { meaning: "to sleep" }
      "তারপর কী হলো?":
        native: "What happened then?"
        bases:
          "হলো": { meaning: "to happen" }
  "bn-1537":
    native: "later; afterwards"
    notes:
      "n1": "{1} means at a later time, as in I will phone later."
    examples:
      "আমি পরে ফোন করব।":
        native: "I will phone later."
        bases:
          "করব": { meaning: "to do" }
      "পরে দেখা হবে।":
        native: "See you later."
        bases:
          "হবে": { meaning: "to happen" }
  "bn-1538":
    native: "suddenly"
    notes:
      "n1": "{1} is said of a sudden change, all at once and without warning."
    examples:
      "হঠাৎ আলো নিভে গেল।":
        native: "The light suddenly went out."
        bases:
          "গেল": { meaning: "to go" }
      "সে হঠাৎ চলে গেল।":
        native: "He suddenly left."
        bases:
          "চলে": { meaning: "to move on; to leave" }
          "গেল": { meaning: "to go" }
  "bn-1539":
    native: "soon; shortly"
    notes:
      "n1": "{1}: it is soon, not yet. The train will come soon."
    examples:
      "শীঘ্রই আমি ফিরব।":
        native: "I will be back soon."
        bases:
          "ফিরব": { meaning: "to return" }
      "ট্রেনটা শীঘ্রই আসবে।":
        native: "The train will come soon."
        bases:
          "আসবে": { meaning: "to come" }
  "bn-1540":
    native: "quickly; early"
    notes:
      "n1": "{1} is quickly. Said of time it can mean early."
    examples:
      "একটু তাড়াতাড়ি এসো।":
        native: "Come a little early."
        bases:
          "এসো": { meaning: "to come" }
      "তাড়াতাড়ি খাও।":
        native: "Eat quickly."
        bases:
          "খাও": { meaning: "to eat" }
  "bn-1541":
    native: "today"
    notes:
      "n1": "{1} is today, as in today being a day off. {2} is the spoken form of today."
    examples:
      "আজ আমার ছুটি।": "I have a day off today."
      "আজ কত তারিখ?": "What is today's date?"
  "bn-1542":
    native: "nowadays; these days"
    notes:
      "n1": "{1} is nowadays, as a comment on how things are now."
    examples:
      "আজকাল সবাই মোবাইলে কথা বলে।":
        native: "Nowadays everyone talks on the phone."
        bases:
          "বলে": { meaning: "to say" }
      "আজকাল ঠান্ডা কম পড়ে।":
        native: "These days it is less cold."
        bases:
          "পড়ে": { meaning: "to fall" }
  "bn-1543":
    native: "yesterday"
    notes:
      "n1": "{1} is last night, said with yesterday."
    examples:
      "গতকাল আমি বাজারে গিয়েছিলাম।":
        native: "Yesterday I went to the market."
        bases:
          "গিয়েছিলাম": { meaning: "to go" }
      "গতকাল বৃষ্টি হয়েছিল।":
        native: "It rained yesterday."
        bases:
          "হয়েছিল": { meaning: "to happen" }
  "bn-1544":
    native: "tomorrow; yesterday (in the past)"
    notes:
      "n1": "{1} is tomorrow morning and {2} is tomorrow night. Said in the past it can mean yesterday."
    examples:
      "কাল দেখা হবে।":
        native: "See you tomorrow."
        bases:
          "হবে": { meaning: "to happen" }
      "কাল আমরা সিনেমায় যাব।":
        native: "Tomorrow we will go to the cinema."
        bases:
          "যাব": { meaning: "to go" }
  "bn-1545":
    native: "in the morning"
    notes:
      "n1": "{1} is in the morning, as a time when things happen."
    examples:
      "আমি সকালে ব্যায়াম করি।":
        native: "I exercise in the morning."
        bases:
          "করি": { meaning: "to do" }
      "সে সকালে অফিসে যায়।":
        native: "He goes to the office in the morning."
        bases:
          "যায়": { meaning: "to go" }
  "bn-1546":
    native: "in the afternoon"
    notes:
      "n1": "{1}: in the afternoon, as in going to the park."
    examples:
      "বিকেলে আমরা পার্কে যাই।":
        native: "In the afternoon we go to the park."
        bases:
          "যাই": { meaning: "to go" }
      "বিকেলে মেঘ করেছিল।":
        native: "Clouds had gathered in the afternoon."
        bases:
          "করেছিল": { meaning: "to do" }
  "bn-1547":
    native: "at night"
    notes:
      "n1": "{1} is at night, as the time for sleep."
    examples:
      "আমি রাতে ঘুমাতে যাই।":
        native: "I go to sleep at night."
        bases:
          "যাই": { meaning: "to go" }
      "রাতে খুব ঠান্ডা লাগে।":
        native: "At night it feels very cold."
        bases:
          "লাগে": { meaning: "to feel" }
  "bn-1548":
    native: "very"
    notes:
      "n1": "{1}: very good. It goes before the adjective."
    examples:
      "আজ খুব গরম।": "It is very hot today."
      "এই গানটা খুব সুন্দর।": "This song is very beautiful."
  "bn-1549":
    native: "a little; a bit"
    notes:
      "n1": "{1}: wait a little."
    examples:
      "একটু জল দাও।":
        native: "Give a little water."
        bases:
          "দাও": { meaning: "to give" }
      "একটু অপেক্ষা করো।":
        native: "Wait a little."
        bases:
          "করো": { meaning: "to do" }
  "bn-1550":
    native: "a lot; many; much"
    notes:
      "n1": "{1} means many days, a lot of time."
    examples:
      "অনেক মানুষ এসেছে।":
        native: "Many people have come."
        bases:
          "এসেছে": { meaning: "to come" }
      "আমি অনেক কাজ করি।":
        native: "I do a lot of work."
        bases:
          "করি": { meaning: "to do" }
  "bn-1551":
    native: "more; too much"
    notes:
      "n1": "{1} means too expensive, as in too expensive a price."
    examples:
      "এটা বেশি দামি।": "This is too expensive."
      "বেশি চিনি দিয়ো না।":
        native: "Don't add too much sugar."
        bases:
          "দিয়ো": { meaning: "to give" }
  "bn-1552":
    native: "less; few"
    notes:
      "n1": "{1} is a low price. The word also means few, as in few people."
    examples:
      "এখানে কম মানুষ থাকে।":
        native: "Few people live here."
        bases:
          "থাকে": { meaning: "to stay" }
      "একটু কম দাও।":
        native: "Give a little less."
        bases:
          "দাও": { meaning: "to give" }
  "bn-1553":
    native: "well; properly"
    notes:
      "n1": "{1}: understand well."
    examples:
      "সে ভালোভাবে বাংলা বলে।":
        native: "He speaks Bengali well."
        bases:
          "বলে": { meaning: "to say" }
      "ভালোভাবে পড়ো।":
        native: "Study well."
        bases:
          "পড়ো": { meaning: "to read" }
  "bn-1554":
    native: "slowly"
    notes:
      "n1": "{1} is the phrase for slowly, a bit at a time."
    examples:
      "ধীরে কথা বলো।":
        native: "Speak slowly."
        bases:
          "বলো": { meaning: "to say" }
      "ট্রেনটা ধীরে চলছে।":
        native: "The train is moving slowly."
        bases:
          "চলছে": { meaning: "to move" }
  "bn-1555":
    native: "loudly; fast"
    notes:
      "n1": "{1}: walk fast."
    examples:
      "জোরে কথা বোলো না।":
        native: "Don't speak loudly."
        bases:
          "বোলো": { meaning: "to say" }
      "জোরে গাড়ি চালিও না।":
        native: "Don't drive fast."
        bases:
          "চালিও": { meaning: "to drive" }
  "bn-1556":
    native: "softly; gently"
    notes:
      "n1": "{1} means softly, gently. Said twice it means bit by bit."
    examples:
      "আস্তে কথা বলো।":
        native: "Speak softly."
        bases:
          "বলো": { meaning: "to say" }
      "দরজাটা আস্তে বন্ধ করো।":
        native: "Close the door gently."
        bases:
          "করো": { meaning: "to do" }
  "bn-1557":
    native: "completely; fully"
    notes:
      "n1": "{1} means completely well."
    examples:
      "আমি পুরোপুরি ভালো আছি।":
        native: "I am completely well."
        bases:
          "আছি": { meaning: "to stay; to be (in a place)" }
      "কাজটা পুরোপুরি শেষ হয়েছে।":
        native: "The work is completely finished."
        bases:
          "হয়েছে": { meaning: "to happen" }
  "bn-1558":
    native: "almost; nearly"
    notes:
      "n1": "{1} means almost all, most of."
    examples:
      "প্রায় দশটা বাজে।":
        native: "It is almost ten o'clock."
        bases:
          "বাজে": { meaning: "to strike (of the clock)" }
      "সে প্রায় এসে গেছে।":
        native: "He has almost arrived."
        bases:
          "গেছে": { meaning: "to go" }
  "bn-1559":
    native: "straight"
    notes:
      "n1": "{1}: go straight along the road."
    examples:
      "সোজা যাও।":
        native: "Go straight."
        bases:
          "যাও": { meaning: "to go" }
      "সোজা রাস্তা ধরে যাও।":
        native: "Take the straight road."
        bases:
          "যাও": { meaning: "to go" }
  "bn-1560":
    native: "perhaps; maybe"
    notes:
      "n1": "{1} is perhaps not, in a sentence with না (nā)."
    examples:
      "হয়তো কাল বৃষ্টি হবে।":
        native: "Perhaps it will rain tomorrow."
        bases:
          "হবে": { meaning: "to happen" }
      "হয়তো সে আসবে না।":
        native: "Perhaps he will not come."
        bases:
          "আসবে": { meaning: "to come" }
  "bn-1561":
    native: "certainly; surely"
    notes:
      "n1": "{1}: you surely know."
    examples:
      "নিশ্চয়ই যাব।":
        native: "Certainly I will go."
        bases:
          "যাব": { meaning: "to go" }
      "তুমি নিশ্চয়ই জানো।":
        native: "You surely know."
        bases:
          "জানো": { meaning: "to know" }
  "bn-1562":
    native: "probably"
    notes:
      "n1": "{1}: it will probably rain today."
    examples:
      "সম্ভবত আজ বৃষ্টি হবে।":
        native: "It will probably rain today."
        bases:
          "হবে": { meaning: "to happen" }
      "সম্ভবত সে এখন ঘুমিয়ে আছে।":
        native: "He is probably sleeping now."
        bases:
          "ঘুমিয়ে": { meaning: "to sleep" }
          "আছে": { meaning: "to stay; to be (in a place)" }
  "bn-1563":
    native: "really; truly"
    notes:
      "n1": "{1}: really, I am telling you truly."
    examples:
      "সত্যি? আমি বিশ্বাস করি না।":
        native: "Really? I don't believe it."
        bases:
          "করি": { meaning: "to do" }
      "সত্যি খুব ভালো।": "Really very good."
  "bn-1564":
    native: "together"
    notes:
      "n1": "{1}: eat together."
    examples:
      "আমরা একসঙ্গে খাই।":
        native: "We eat together."
        bases:
          "খাই": { meaning: "to eat" }
      "চলো একসঙ্গে যাই।":
        native: "Let's go together."
        bases:
          "যাই": { meaning: "to go" }
  "bn-1565":
    native: "alone"
    notes:
      "n1": "{1}: alone, by oneself."
    examples:
      "সে একা থাকে।":
        native: "He lives alone."
        bases:
          "থাকে": { meaning: "to stay" }
      "একা যেতে ভয় লাগে।":
        native: "I am scared to go alone."
        bases:
          "যেতে": { meaning: "to go" }
          "লাগে": { meaning: "to feel" }
  "bn-1566":
