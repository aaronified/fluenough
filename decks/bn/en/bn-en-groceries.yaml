  "bn-0266":
    native: "fish"
    notes:
      "n1": "Fish is at the heart of Bengali food. Ask for it by name: রুই (rui), ইলিশ (iliś), চিংড়ি (ciṅṛi, prawns)."
  "bn-0267":
    native: "meat"
    notes:
      "n1": "Also গোশ্ত (gośt). In many homes, মাংস (māṅśo) on its own means goat meat."
  "bn-0268":
    native: "goat meat (mutton)"
    notes:
      "n1": "What to ask for at the butcher. In South Asia 'mutton' almost always means goat. Also খাসির মাংস (khāśir māṅśo), the more common word in many places."
    bases:
      "পাঁঠার": "billy goat"
  "bn-0269":
    native: "chicken"
    notes:
      "n1": "Chicken meat is মুরগির মাংস (murgir māṅśo); in shops people also just say 'chicken'."
  "bn-0270":
    native: "egg"
    notes:
      "n1": "Sold by the piece or the dozen, ডজন (ḍôjon)."
