schema: 1
id: "bn-en-groceries"
kind: "layer"
core: "bn-groceries"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Groceries"
description: "Vegetables, fruit, fish, meat, eggs and the staples."
license: "CC-BY-SA-4.0"
tags: ["beginner"]
cards:
  "bn-0260":
    native: "vegetable; vegetables"
    "examples": {
      "সবজি বিক্রি করো।": {"native": "Sell the vegetables. (familiar)", "bases": {"সবজি": "vegetable; vegetables"}}
    }
  "bn-0261":
    native: "potato"
    "examples": {
      "আলু সেদ্ধ করুন।": {"native": "Please boil the potatoes.", "bases": {}},
      "আলুর খোসা ছাড়ান।": {"native": "Peel the potatoes.", "bases": {"ছাড়ান": "to peel or remove", "আলুর": "potato"}}
    }
  "bn-0262":
    native: "onion"
    "examples": {
      "পেঁয়াজ কুচি করুন।": {"native": "Chop the onion finely.", "bases": {}},
      "পেঁয়াজ কুচিয়ে নিন।": {"native": "Chop the onion finely.", "bases": {"কুচিয়ে": "to chop finely"}}
    }
  "bn-0263":
    native: "tomato"
  "bn-0264":
    native: "chilli"
    notes:
      "n1": "Also মরিচ (moric). Green chillies are কাঁচা লঙ্কা (kām̐cā lôṅkā), or কাঁচা মরিচ (kām̐cā moric)."
    "examples": {
      "মুড়ির সঙ্গে কাঁচা লঙ্কা।": {"native": "Puffed rice with green chillies.", "bases": {"মুড়ির": "puffed rice"}},
      "কাঁচা লঙ্কা কুচানো হয়েছে।": {"native": "The green chillies have been chopped finely.", "bases": {}}
    }
  "bn-0265":
    native: "garlic"
    "examples": {
      "রসুন কোটো।": {"native": "Pound the garlic.", "bases": {"কোটো": "to chop or pound"}}
    }
  "bn-0266":
    native: "fish"
    notes:
      "n1": "Fish is at the heart of Bengali food. Ask for it by name: রুই (rui), ইলিশ (iliś), চিংড়ি (ciṅṛi, prawns)."
    "examples": {
      "মাছটা কত?": {"native": "How much is the fish?", "bases": {"মাছটা": "fish"}}
    }
  "bn-0267":
    native: "meat"
    notes:
      "n1": "Also গোশ্ত (gośt). In many homes, মাংস (māṅśo) on its own means goat meat."
    "examples": {
      "পাঁঠার মাংস": {"native": "goat meat (mutton)", "bases": {"পাঁঠার": "billy goat"}},
      "আমি মাংস খাই না।": {"native": "I don't eat meat.", "bases": {}}
    }
  "bn-0268":
    native: "goat meat (mutton)"
    notes:
      "n1": "What to ask for at the butcher. In South Asia 'mutton' almost always means goat. Also খাসির মাংস (khāśir māṅśo), the more common word in many places."
    bases:
      "পাঁঠার": "billy goat"
  "bn-0269":
    native: "chicken"
    notes:
      "n1": "Chicken meat is মুরগির মাংস (murgir māṅśo); in shops people also just say 'chicken'."
    "examples": {
      "ফার্মে অনেক মুরগি আছে।": {"native": "There are many hens on the farm.", "bases": {"ফার্মে": "farm", "আছে": "there are", "মুরগি": "chicken"}}
    }
  "bn-0270":
    native: "egg"
    notes:
      "n1": "Sold by the piece or the dozen, ডজন (ḍôjon)."
    "examples": {
      "ডিম সেদ্ধ হয়েছে।": {"native": "The egg has been boiled.", "bases": {}}
    }
  "bn-0271":
    native: "milk"
    "examples": {
      "দুধ ফুটে গেছে।": {"native": "The milk has boiled over.", "bases": {"ফুটে": "to boil (of water)"}}
    }
  "bn-0272":
    native: "rice (uncooked)"
    notes:
      "n1": "Uncooked rice is চাল (cāl); cooked rice is ভাত (bhāt)."
  "bn-0273":
    native: "lentils; dal"
    "examples": {
      "ডালটা ছাঁকা হয়েছে।": {"native": "The dal has been strained.", "bases": {"ডালটা": "lentils; dal"}}
    }
  "bn-0561":
    native: "banana"
    notes:
      "n1": "Sold by the dozen, ডজন (ḍôjon), or by the piece."
    "examples": {
      "কয়েকটা কলা দিন।": {"native": "Please give me a few bananas.", "bases": {}}
    }
  "bn-0562":
    native: "mango"
    "examples": {
      "আম খাওয়ার মৌসুম এসেছে।": {"native": "The mango-eating season has come.", "bases": {}}
    }
  "bn-0563":
    native: "papaya"
  "bn-0564":
    native: "lime; lemon"
  "bn-0565":
    native: "cauliflower"
  "bn-0566":
    native: "aubergine; eggplant"
  "bn-0567":
    native: "salt"
    notes:
      "n1": "Also লবণ (lôbon)."
    "examples": {
      "সামান্য নুন দিন।": {"native": "Please add a little salt.", "bases": {}},
      "স্বাদমতো নুন দিন।": {"native": "Add salt to taste.", "bases": {}}
    }
  "bn-0056":
    native: "fruit"
  "bn-0569":
    native: "oil"
    "examples": {
      "তেলে ফোড়ন দিন।": {"native": "Add the tempering to the oil.", "bases": {"তেলে": "oil"}},
      "সরষের তেল আনুন।": {"native": "Bring some mustard oil.", "bases": {"সরষের": "mustard seed", "তেল": "oil"}}
    }
  "bn-0570":
    native: "sugar"
    "examples": {
      "আমি তাকে চিনি।": {"native": "I know him.", "bases": {"চিনি": "know (I know)"}}
    }
