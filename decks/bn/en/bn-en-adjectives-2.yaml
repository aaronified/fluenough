schema: 1
id: "bn-en-adjectives-2"
kind: "layer"
core: "bn-adjectives-2"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More describing words"
description: "Words for describing a room: dark, comfortable, tidy, spacious, and the parts of a home. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-2549":
    native: "dark"
    notes:
      "n1": "{1}: A dark room, with no light coming in."
    antonyms: { "a1": "bright" }
    examples:
      "ঘরটা অন্ধকার।": "The room is dark."
      "আলো নেই, খুব অন্ধকার।": { native: "There is no light; it is very dark.", bases: { "নেই": "there is not" } }
  "bn-2550":
    native: "comfortable"
    notes:
      "n1": "{1}: A comfortable bed: soft and easy to lie on."
    examples:
      "এই বিছানাটা আরামদায়ক।": { native: "This bed is comfortable.", bases: { "এই": "this" } }
      "সোফাটা খুব আরামদায়ক।": "The sofa is very comfortable."
  "bn-2551":
    native: "old"
    notes:
      "n1": "{1}: Used of things that are old, such as a house or a cupboard. The opposite is নতুন (notun)."
    antonyms: { "a1": "new" }
    examples:
      "এই আলমারিটা পুরনো।": { native: "This cupboard is old.", bases: { "এই": "this" } }
      "পুরনো পর্দাটা ফেলে দাও।": "Throw away the old curtain. (familiar)"
  "bn-2552":
    native: "empty"
    notes:
      "n1": "{1}: Empty: nothing is inside or on it, such as a room or a seat."
    antonyms: { "a1": "crammed full" }
    examples:
      "ঘরটা ফাঁকা।": "The room is empty."
      "চেয়ারটা ফাঁকা, বসো।": "The chair is empty, sit down. (familiar)"
  "bn-2553":
    native: "untidy"
    notes:
      "n1": "{1}: Untidy: a room or a desk in a mess. The opposite is পরিষ্কার (poriṣkār)."
    antonyms: { "a1": "clean" }
    examples:
      "ঘরটা খুব অগোছালো।": "The room is very untidy."
      "টেবিলটা অগোছালো, কিছু খুঁজে পাই না।": { native: "The table is untidy; I cannot find anything.", bases: { "খুঁজে": "to search", "না": "not" } }
  "bn-2554":
    native: "round"
    notes:
      "n1": "{1}: Round, as a shape: a plate or a clock face."
    examples:
      "এই থালাটা গোল।": { native: "This plate is round.", bases: { "এই": "this" } }
      "ঘড়ির মুখটা গোল।": "The clock face is round."
  "bn-2555":
    native: "square"
    notes:
      "n1": "{1}: Square: four equal sides, like a box."
    examples:
      "টেবিলটা চৌকো।": "The table is square."
      "ঘরটা চৌকো, লম্বা নয়।": "The room is square, not long."
  "bn-2556":
    native: "level"
    notes:
      "n1": "{1}: Level and even: a floor or a shelf that is not tilted."
    examples:
      "মেঝেটা সমান।": "The floor is level."
      "তাকটা সমান রাখো।": "Keep the shelf level. (familiar)"
  "bn-2557":
    native: "crooked"
    notes:
      "n1": "{1}: Bent or crooked: not straight."
    examples:
      "দরজাটা বাঁকা।": "The door is crooked."
      "ছবিটা বাঁকা হয়ে ঝুলছে।": { native: "The picture hangs crooked.", bases: { "ঝুলছে": "to hang" } }
  "bn-2558":
    native: "smooth"
    notes:
      "n1": "{1}: Smooth to touch: a wall with no bumps."
    antonyms: { "a1": "rough" }
    examples:
      "দেয়ালটা মসৃণ।": "The wall is smooth."
      "মেঝেটা মসৃণ আর ঠান্ডা।": "The floor is smooth and cool."
  "bn-2559":
    native: "rough"
    notes:
      "n1": "{1}: Rough to touch: a wall or a cloth that is not smooth."
    examples:
      "দেয়ালটা খসখসে।": "The wall is rough."
      "পুরনো কার্পেটটা খসখসে হয়ে গেছে।": "The old carpet has gone rough."
  "bn-2560":
    native: "spotless"
    notes:
      "n1": "{1}: Shining and spotless: clean and polished."
    examples:
      "রান্নাঘরটা ঝকঝকে।": "The kitchen is spotless."
      "মেঝেটা ঝকঝকে, ধুলো নেই।": { native: "The floor is spotless; there is no dust.", bases: { "নেই": "there is not" } }
  "bn-2561":
    native: "loose"
    notes:
      "n1": "{1}: Loose: not fixed firmly in place."
    examples:
      "জানালার কাচটা ঢিলে।": "The window glass is loose."
      "ছিটকিনিটা ঢিলে, ঠিক করো।": { native: "The latch is loose; fix it. (familiar)", bases: { "ঠিক": "right; correct" } }
  "bn-2562":
    native: "bright"
    notes:
      "n1": "{1}: Bright, of light: a lamp or the sun that gives a strong light."
    antonyms: { "a1": "dark" }
    examples:
      "আলোটা খুব উজ্জ্বল।": "The light is very bright."
      "বাতিটা খুব উজ্জ্বল, চোখে লাগে।": "The bulb is very bright; it hurts the eyes."
  "bn-2563":
    native: "dim; faded"
    notes:
      "n1": "{1}: Dim or faded: lost its brightness or colour."
    antonyms: { "a1": "bright" }
    examples:
      "দেয়ালের রং মলিন হয়ে গেছে।": "The wall's paint has faded."
      "বাতিটা মলিন, আরও আলো দাও।": { native: "The bulb is dim; give more light. (familiar)", bases: { "আরও": "more" } }
  "bn-2564":
    native: "faded"
    notes:
      "n1": "{1}: Faded in colour: a curtain or a sofa that has lost its colour."
    examples:
      "পর্দাটা রঙচটা হয়ে গেছে।": "The curtain has faded."
      "পুরনো সোফাটা রঙচটা।": "The old sofa is faded."
  "bn-2565":
    native: "colourful"
    notes:
      "n1": "{1}: Colourful: many bright colours."
    examples:
      "ঘরের দেয়ালগুলো রঙিন।": "The walls of the room are colourful."
      "বাচ্চাদের ঘরটা খুব রঙিন।": { native: "The children's room is very colourful.", bases: { "বাচ্চাদের": "of the children" } }
  "bn-2566":
    native: "sticky"
    notes:
      "n1": "{1}: Sticky: a surface that holds on to what touches it."
    examples:
      "টেবিলটা আঠালো।": "The table is sticky."
      "হাতটা আঠালো, ধুয়ে ফেলো।": { native: "The hand is sticky; wash it off. (familiar)", bases: { "হাতটা": "hand" } }
  "bn-2567":
    native: "dusty"
    notes:
      "n1": "{1}: Covered in dust."
    examples:
      "আলমারিটা ধুলোমাখা।": "The cupboard is covered in dust."
      "বইয়ের তাকটা ধুলোমাখা।": "The shelf of books is dusty."
  "bn-2568":
    native: "crammed full"
    notes:
      "n1": "{1}: Crammed and packed full, with no space left."
    antonyms: { "a1": "empty" }
    examples:
      "ঘরটা জিনিসে ঠাসা।": "The room is packed with things."
      "আলমারিটা বইয়ে ঠাসা।": "The cupboard is crammed with books."
  "bn-2569":
    native: "noisy"
    notes:
      "n1": "{1}: Noisy, full of voices and sounds."
    examples:
      "রাস্তার পাশের ঘরটা কোলাহলপূর্ণ।": "The room by the road is noisy."
      "রাতে বাজারের পাশে থাকা কোলাহলপূর্ণ।": "Being beside the market at night is noisy."
  "bn-2570":
    native: "spacious"
    notes:
      "n1": "{1}: Spacious: a room with plenty of room in it."
    antonyms: { "a1": "tiny and cramped" }
    examples:
      "ঘরটা খুব প্রশস্ত।": "The room is very spacious."
      "নতুন বাড়িটা প্রশস্ত আর আলোয় ভরা।": "The new house is spacious and full of light."
  "bn-2571":
    native: "quiet and deserted"
    notes:
      "n1": "{1}: Quiet and deserted: nobody about."
    examples:
      "রাতে রাস্তাটা নির্জন।": "At night the road is deserted."
      "দুপুরে বাড়িটা নির্জন থাকে।": "At noon the house is quiet."
  "bn-2572":
    native: "clear; transparent"
    notes:
      "n1": "{1}: Clear and transparent: you can see through it."
    examples:
      "জানালার কাচটা স্বচ্ছ।": "The window glass is clear."
      "পরিষ্কার জানালা, কাচ স্বচ্ছ।": "A clean window; the glass is clear."
  "bn-2573":
    native: "tiny and cramped"
    notes:
      "n1": "{1}: Tiny and cramped: a small, dark, airless room."
    examples:
      "ঘরটা খুব ঘুপচি।": "The room is very cramped."
      "ঘুপচি ঘরে কোনো জানালা নেই।": { native: "In the cramped room there is no window.", bases: { "নেই": "there is not" } }
  "bn-2574":
    native: "lit up"
    notes:
      "n1": "{1}: Lit up: a room full of light."
    examples:
      "সন্ধ্যায় ঘরটা আলোকিত।": { native: "In the evening the room is lit up.", bases: { "সন্ধ্যায়": "in the evening" } }
      "বাতি জ্বললে ঘরটা আলোকিত হয়।": { native: "When the lamp is lit, the room is lit up.", bases: { "জ্বললে": "when it lights up" } }
  "bn-2575":
    native: "room (formal)"
    notes:
      "n1": "{1}: A formal word for a room; in a house ঘর (ghôr) is the usual word."
    examples:
      "এই কামরাটা বড়।": { native: "This room is big.", bases: { "এই": "this", "কামরাটা": "room (formal)" } }
      "পাশের কামরায় কেউ আছে।": { native: "Someone is in the next room.", bases: { "কামরায়": "room (formal)", "কেউ": "someone", "আছে": "there is" } }
  "bn-2576":
    native: "wall"
    notes:
      "n1": "{1}: A wall of a room or a house."
    examples:
      "দেয়ালে একটা ছবি আছে।": { native: "There is a picture on the wall.", bases: { "দেয়ালে": "wall", "আছে": "there is" } }
      "দেয়ালের রং সাদা।": { native: "The wall's paint is white.", bases: { "দেয়ালের": "wall" } }
  "bn-2577":
    native: "floor"
    notes:
      "n1": "{1}: The floor you stand on in a room."
    examples:
      "মেঝেতে একটা কার্পেট বিছানো।": { native: "A carpet is spread on the floor.", bases: { "মেঝেতে": "floor", "বিছানো": "spread out" } }
      "মেঝেটা ঠান্ডা।": { native: "The floor is cold.", bases: { "মেঝেটা": "floor" } }
  "bn-2578":
    native: "bedstead"
    notes:
      "n1": "{1}: A bed frame, usually of wood or metal."
    examples:
      "ঘরে একটা ছোট খাট আছে।": { native: "There is a small bed in the room.", bases: { "আছে": "there is" } }
      "খাটটা আরামদায়ক।": { native: "The bed is comfortable.", bases: { "খাটটা": "bedstead" } }
  "bn-2579":
    native: "sofa"
    notes:
      "n1": "{1}: A sofa, a long seat for two or more people."
    examples:
      "বসার ঘরে একটা সোফা আছে।": { native: "There is a sofa in the sitting room.", bases: { "আছে": "there is" } }
      "সোফায় বসো।": { native: "Sit on the sofa. (familiar)", bases: { "সোফায়": "sofa" } }
  "bn-2580":
    native: "curtain"
    notes:
      "n1": "{1}: A curtain, hung in front of a window or door."
    examples:
      "জানালায় নীল পর্দা।": "A blue curtain on the window."
      "পর্দাটা সরাও, আলো আসুক।": { native: "Move the curtain, let the light in. (familiar)", bases: { "পর্দাটা": "curtain", "সরাও": "to move aside" } }
  "bn-2581":
    native: "carpet"
    notes:
      "n1": "{1}: A carpet, a thick floor covering."
    examples:
      "মেঝেতে লাল কার্পেট।": "A red carpet on the floor."
      "কার্পেটটা খুব পুরনো।": { native: "The carpet is very old.", bases: { "কার্পেটটা": "carpet" } }
  "bn-2582":
    native: "clothes stand"
    notes:
      "n1": "{1}: A stand for hanging clothes on, like a rail."
    examples:
      "আলনায় জামা ঝুলছে।": { native: "Clothes are hanging on the stand.", bases: { "আলনায়": "clothes stand", "ঝুলছে": "to hang" } }
      "আলনাটা দরজার পাশে।": { native: "The clothes stand is beside the door.", bases: { "আলনাটা": "clothes stand" } }
  "bn-2583":
    native: "drawer"
    notes:
      "n1": "{1}: A drawer, a box that slides in and out of a table or cupboard."
    examples:
      "টেবিলের ড্রয়ারে চাবি আছে।": { native: "There is a key in the table's drawer.", bases: { "ড্রয়ারে": "drawer", "আছে": "there is" } }
      "ড্রয়ারটা খোলো।": { native: "Open the drawer. (familiar)", bases: { "ড্রয়ারটা": "drawer" } }
  "bn-2584":
    native: "switch"
    notes:
      "n1": "{1}: A switch that turns a light or a fan on and off."
    examples:
      "দরজার পাশে আলোর সুইচ।": "A light switch beside the door."
      "সুইচটা টিপলে আলো জ্বলে।": { native: "When you press the switch the light comes on.", bases: { "সুইচটা": "switch", "টিপলে": "when pressed", "জ্বলে": "to light up" } }
  "bn-2585":
    native: "ceiling"
    notes:
      "n1": "{1}: The ceiling: the inside top of a room."
    examples:
      "সিলিংয়ে একটা পাখা আছে।": { native: "There is a fan on the ceiling.", bases: { "সিলিংয়ে": "ceiling", "আছে": "there is" } }
      "সিলিংটা অনেক উঁচু।": { native: "The ceiling is very high.", bases: { "সিলিংটা": "ceiling" } }
  "bn-2586":
    native: "window pane"
    notes:
      "n1": "{1}: A window pane, the glass in a window frame."
    examples:
      "জানালার শার্সিটা ভাঙা।": { native: "The window pane is broken.", bases: { "শার্সিটা": "window pane" } }
      "শার্সিতে ধুলো জমেছে।": { native: "Dust has collected on the window pane.", bases: { "শার্সিতে": "window pane", "জমেছে": "to collect" } }
  "bn-2587":
    native: "glass"
    notes:
      "n1": "{1}: Glass, the material of windows and cups."
    examples:
      "কাচটা পরিষ্কার করো।": { native: "Clean the glass. (familiar)", bases: { "কাচটা": "glass" } }
      "কাচে আঙুলের দাগ।": { native: "Finger marks on the glass.", bases: { "কাচে": "glass", "আঙুলের": "of the finger", "দাগ": "mark" } }
  "bn-2588":
    native: "deposit"
    notes:
      "n1": "{1}: A deposit: money paid up front and given back at the end."
    examples:
      "ঘর ভাড়া নিতে জামানত লাগে।": "To rent a room you need a deposit."
      "জামানতটা ফেরত পাব।": { native: "I will get the deposit back.", bases: { "জামানতটা": "deposit", "ফেরত": "back; returned" } }
  "bn-2589":
    native: "landlord"
    notes:
      "n1": "{1}: A landlord, the owner who rents out a house."
    examples:
      "আমাদের বাড়িওয়ালা ভালো।": "Our landlord is good."
      "বাড়িওয়ালাকে ভাড়াটা দিলাম।": { native: "I gave the rent to the landlord.", bases: { "বাড়িওয়ালাকে": "landlord" } }
  "bn-2590":
    native: "tenant"
    notes:
      "n1": "{1}: A tenant, a person who rents a room or a house."
    examples:
      "নতুন ভাড়াটে এসেছে।": "A new tenant has come."
      "ভাড়াটের সঙ্গে কথা বলো।": { native: "Talk to the tenant. (familiar)", bases: { "ভাড়াটের": "tenant", "সঙ্গে": "with" } }
  "bn-2591":
    native: "repair"
    notes:
      "n1": "{1}: Repair: fixing something that is broken."
    examples:
      "ছাদের মেরামত হচ্ছে।": "The roof is being repaired."
      "মেরামতের দাম কত?": { native: "How much is the repair?", bases: { "মেরামতের": "repair" } }
  "bn-2592":
    native: "wall clock"
    notes:
      "n1": "{1}: A wall clock, a clock hung on a wall."
    examples:
      "দেয়ালঘড়িটা ঠিক সময় দেখায়।": { native: "The wall clock shows the right time.", bases: { "দেয়ালঘড়িটা": "wall clock", "ঠিক": "right; correct", "দেখায়": "to show" } }
      "ঘরের দেয়ালে একটা ঘড়ি ঝুলছে।": { native: "A clock is hanging on the wall of the room.", bases: { "ঝুলছে": "to hang" } }
  "bn-2593":
    native: "latch; bolt"
    notes:
      "n1": "{1}: A latch or bolt that holds a door or window shut."
    examples:
      "দরজায় ছিটকিনি লাগাও।": { native: "Put the latch on the door. (familiar)", bases: { "লাগাও": "to fix on" } }
      "ছিটকিনিটা ঢিলে।": { native: "The latch is loose.", bases: { "ছিটকিনিটা": "latch; bolt" } }
  "bn-2594":
    native: "furniture"
    notes:
      "n1": "{1}: Furniture: beds, chairs, tables and cupboards."
    examples:
      "ঘরে অনেক আসবাব।": "There is a lot of furniture in the room."
      "নতুন আসবাবের দাম বেশি।": { native: "New furniture costs a lot.", bases: { "আসবাবের": "furniture" } }
  "bn-2595":
    native: "wood"
    notes:
      "n1": "{1}: Wood, the material of a tree."
    examples:
      "খাটটা কাঠের।": { native: "The bed is made of wood.", bases: { "কাঠের": "wood" } }
      "কাঠের দরজা ভারী।": { native: "The wooden door is heavy.", bases: { "কাঠের": "wood" } }
  "bn-2596":
    native: "brick"
    notes:
      "n1": "{1}: A brick, a block of baked clay used to build walls."
    examples:
      "দেয়ালটা ইটের তৈরি।": { native: "The wall is made of brick.", bases: { "ইটের": "brick", "তৈরি": "made" } }
      "বাড়ির দেয়াল ইটের।": { native: "The house's wall is brick.", bases: { "ইটের": "brick" } }
  "bn-2597":
    native: "cement"
    notes:
      "n1": "{1}: Cement, the grey powder that sets hard with water."
    examples:
      "মেঝেতে সিমেন্ট লাগানো হচ্ছে।": { native: "Cement is being put on the floor.", bases: { "লাগানো": "to put on" } }
      "সিমেন্টের গন্ধ খারাপ।": { native: "The smell of cement is bad.", bases: { "সিমেন্টের": "cement", "গন্ধ": "smell", "খারাপ": "bad" } }
  "bn-2598":
    native: "small opening high in a wall"
    notes:
      "n1": "{1}: A small opening high in a wall, for air and light."
    examples:
      "ঘুলঘুলি দিয়ে আলো আসে।": "Light comes in through the small opening."
      "ঘুলঘুলিটা খুব উঁচুতে।": { native: "The opening is very high up.", bases: { "ঘুলঘুলিটা": "small opening high in a wall" } }
  "bn-2599":
    native: "door frame"
    notes:
      "n1": "{1}: The frame at the bottom of a doorway."
    examples:
      "দরজার চৌকাঠ উঁচু।": "The door frame is high."
      "চৌকাঠে পা রেখো না।": { native: "Do not put your foot on the door frame. (familiar)", bases: { "চৌকাঠে": "door frame", "না": "not" } }
  "bn-2600":
    native: "to repair"
    notes:
      "n1": "{1}: To repair: to fix something that is broken."
    examples:
      "ছাদটা মেরামত করা হবে।": "The roof will be repaired."
      "কাল কেউ এসে দেয়াল মেরামত করবে।": { native: "Tomorrow someone will come and repair the wall.", bases: { "কাল": "tomorrow", "কেউ": "someone" } }
  "bn-2601":
    native: "to paint"
    notes:
      "n1": "{1}: To paint: to put colour on a wall or a door."
    examples:
      "আমরা ঘরের দেয়াল রং করব।": "We will paint the wall of the room."
      "রং করা দেয়ালটা ঝকঝকে।": "The wall that has been painted is spotless."
  "bn-2602":
    native: "to rent out"
    notes:
      "n1": "{1}: To rent out: to let a room or a house to someone for money."
    examples:
      "ওরা ওপরের ঘরটা ভাড়া দেয়।": { native: "They rent out the room upstairs.", bases: { "ওপরের": "upper" } }
      "আমি বাড়িটা ভাড়া দিতে চাই।": "I want to rent out the house."
  "bn-2603":
    native: "to rent"
    notes:
      "n1": "{1}: To rent: to take a room or a house for money."
    examples:
      "আমি একটা ছোট ঘর ভাড়া নিয়েছি।": "I have rented a small room."
      "ভাড়া নেওয়ার আগে ঘরটা দেখো।": { native: "Look at the room before you rent it. (familiar)", bases: { "আগে": "before" } }
