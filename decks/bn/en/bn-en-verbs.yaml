schema: 1
id: "bn-en-verbs"
kind: "layer"
core: "bn-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Everyday verbs"
description: "The verbs of every day, in the form the dictionary gives: come, go, eat, see, say, give, take and the rest, with the way each is said for I, you and he. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-0872":
    native: "to come"
    wiktionary: true
    notes:
      "n1": "On leaving, people say {1}, 'I'll come', and not {2}, 'I'm going', which sounds final."
    "examples": {
      "দমকল এসেছে।": {"native": "The fire brigade has come.", "bases": {"এসেছে": "to come"}},
      "দুর্যোগ এসেছে।": {"native": "A disaster has come.", "bases": {"এসেছে": "to come"}}
    }
  "bn-0873":
    native: "to go"
    wiktionary: true
    notes:
      "n1": "Its stem {1} ends in a vowel, so the endings are short: {2}, {3}, {4}. It is also the verb that makes the passive: {5}, 'can be seen'."
    "examples": {
      "নিশ্চয়ই যাব।": {"native": "Certainly I will go.", "bases": {}},
      "বিদেশে যাবে?": {"native": "Will you go abroad? (familiar)", "bases": {"বিদেশে": "abroad; a foreign country", "যাবে": "to go"}}
    }
  "bn-0874":
    native: "to be; to become; to happen"
    wiktionary: true
    notes:
      "n1": "There is no word for 'is' between a noun and what it is: {1}, 'I am a student'. {2} means 'to become' and 'to happen': {3}, what has happened?"
    "examples": {
      "চুরি হয়েছে।": {"native": "A theft has happened.", "bases": {"হয়েছে": "to be; to become; to happen"}},
      "জনগণনা হচ্ছে।": {"native": "The census is being taken.", "bases": {"হচ্ছে": "to be; to become; to happen"}}
    }
  "bn-0875":
    native: "to stay; to live; to be (in a place)"
    wiktionary: true
    notes:
      "n1": "It says where someone lives: {1}, I live in Kolkata. It also means 'to stay' and 'to remain'."
    "examples": {
      "ভালো থাকবেন।": {"native": "Take care. (respectful)", "bases": {"থাকবেন": "to stay; to live; to be (in a place)"}},
      "সতর্ক থাকো।": {"native": "Be careful. (familiar)", "bases": {"থাকো": "to stay; to live; to be (in a place)"}}
    }
  "bn-0876":
    native: "to eat; to drink"
    wiktionary: true
    notes:
      "n1": "It also covers drinking and smoking: {1}, I drink tea; {2}, I smoke. A polite request is the same as the present: {3}, please eat."
    "examples": {
      "তাড়াতাড়ি খাও।": {"native": "Eat quickly.", "bases": {}},
      "সিগারেট খাওয়া": {"native": "to smoke a cigarette", "bases": {"সিগারেট": "cigarette", "খাওয়া": "to eat; to drink"}}
    }
  "bn-0877":
    native: "to see; to look; to watch"
    wiktionary: true
    notes:
      "n1": "It also names a meeting: {1}, 'we will meet', is literally 'a seeing will be'."
    "examples": {
      "ক্লিপটা দেখো।": {"native": "Watch the clip. (familiar)", "bases": {"ক্লিপটা": "clip", "দেখো": "to see; to look; to watch"}},
      "ট্রেলারটা দেখো।": {"native": "Watch the trailer. (familiar)", "bases": {"ট্রেলারটা": "trailer", "দেখো": "to see; to look; to watch"}}
    }
  "bn-0878":
    native: "to hear; to listen"
    wiktionary: true
    notes:
      "n1": "The stem's vowel changes: {1}, I listen, but {2}, he listens. {3}, please listen, is also how you get attention."
    "examples": {
      "খবরটা শুনেছ?": {"native": "Have you heard the news? (familiar)", "bases": {"খবরটা": "news", "শুনেছ": "to hear"}},
      "অভিনেত্রীর গান শুনলাম।": {"native": "I heard the actress's song.", "bases": {"অভিনেত্রীর": "actress", "শুনলাম": "to hear; to listen"}}
    }
  "bn-0879":
    native: "to say; to speak; to tell"
    wiktionary: true
    notes:
      "n1": "It means to say, to speak and to tell: {1}, I speak Bengali. {2}, 'please say', also invites someone to speak."
    "examples": {
      "ধাঁধা বলো।": {"native": "Tell a riddle.", "bases": {"বলো": "to say; to speak; to tell"}}
    }
  "bn-0880":
    native: "to write"
    wiktionary: true
    notes:
      "n1": "The stem's vowel changes: {1}, I write, but {2}, you write. The same word {3} is also a noun, 'writing'."
    "examples": {
      "জবাব লেখো।": {"native": "Write the answer.", "bases": {"লেখো": "to write"}},
      "অভিমতটা লিখে দিন।": {"native": "Please write down the opinion. (respectful)", "bases": {"অভিমতটা": "opinion (formal)", "লিখে": "writing"}}
    }
  "bn-0881":
    native: "to know"
    wiktionary: true
    notes:
      "n1": "It is for knowing a fact or a language: {1}, I know. For knowing a person it is {2}."
    "examples": {
      "আপনি বাংলা জানেন?": {"native": "Do you know Bengali? (respectful)", "bases": {"বাংলা": "Bengali (the language); Bengal", "জানেন": "to know"}},
      "আমি জানি না।": {"native": "I don't know.", "bases": {"জানি": "to know"}}
    }
  "bn-0882":
    native: "to understand"
    wiktionary: true
    notes:
      "n1": "The stem's vowel changes: {1}, I understand, but {2}, you understand."
    "examples": {
      "আমি বাংলা বুঝি।": {"native": "I understand Bengali.", "bases": {"বাংলা": "Bengali (the language); Bengal", "বুঝি": "to understand"}},
      "আমি তোমার যুক্তি বুঝেছি।": {"native": "I have understood your reason.", "bases": {"বুঝেছি": "understood"}}
    }
  "bn-0883":
    native: "to learn"
    wiktionary: true
    notes:
      "n1": "The stem's vowel changes: {1}, I learn, but {2}, he learns. To teach is a different verb, {3}."
    "examples": {
      "পিয়ানো শিখছি।": {"native": "I am learning the piano.", "bases": {"শিখছি": "to learn"}},
      "আমি বাংলা শিখছি।": {"native": "I am learning Bengali.", "bases": {"শিখছি": "to learn"}}
    }
  "bn-0884":
    native: "to sit"
    wiktionary: true
    notes:
      "n1": "{1} is the polite request to sit down. The same verb also means 'to settle' and, after another verb, 'to keep': {2}, to sit about."
    "examples": {
      "বসার ঘর": {"native": "living room", "bases": {"বসার": "to sit"}},
      "সোফায় বসো।": {"native": "Sit on the sofa. (familiar)", "bases": {"সোফায়": "sofa", "বসো": "to sit"}}
    }
  "bn-0885":
    native: "to get up; to rise"
    wiktionary: true
    notes:
      "n1": "The stem's vowel changes: {1}, I get up, but {2}, you get up. It also means 'to climb'."
    "examples": {
      "ধোঁয়া উঠছে।": {"native": "Smoke is rising.", "bases": {"উঠছে": "rising"}},
      "সূর্য ওঠে।": {"native": "The sun rises.", "bases": {}}
    }
  "bn-0886":
    native: "to stand"
    wiktionary: true
    notes:
      "n1": "Said sharply, {1} means 'stop!' or 'wait!'."
    "examples": {
      "আমি উঠে দাঁড়ালাম।": {"native": "I got up and stood.", "bases": {"দাঁড়ালাম": "to stand"}},
      "বাস স্টপে দাঁড়াও।": {"native": "Wait at the bus stop. (familiar)", "bases": {"দাঁড়াও": "to stand; to wait"}}
    }
  "bn-0887":
    native: "to sleep"
    notes:
      "n1": "It is also written {1}; the first spelling is how it is said."
    "examples": {
      "সে রাতে ঘুমাতে পারেনি।": {"native": "She could not sleep at night.", "bases": {"ঘুমাতে": "to sleep"}},
      "ওষুধ খাওয়ার পর একটু ঘুমান।": {"native": "After taking the medicine, sleep a little.", "bases": {"ঘুমান": "to sleep"}}
    }
  "bn-0888":
    native: "to give"
    wiktionary: true
    notes:
      "n1": "It is irregular, with a different vowel in nearly every form: {1}, {2}, {3}, {4}. {5}, 'please give', is how you ask for something in a shop."
    "examples": {
      "জবাব দাও।": {"native": "Reply. (familiar)", "bases": {"দাও": "to give"}},
      "তালি দাও।": {"native": "Clap. (familiar)", "bases": {"দাও": "to give"}}
    }
  "bn-0889":
    native: "to take"
    wiktionary: true
    notes:
      "n1": "It is irregular like {1}: {2}, {3}, {4}, {5}. It is also used for medicine and for a price: {6}, to take medicine; {7}, to charge a price."
    "examples": {
      "টিকাটা নিয়েছ?": {"native": "Did you have the jab? (familiar)", "bases": {"টিকাটা": "vaccine; jab", "নিয়েছ": "to take"}},
      "টোকেন নাও।": {"native": "Take a token. (familiar)", "bases": {"নাও": "to take"}}
    }
  "bn-0890":
    native: "to buy"
    wiktionary: true
    notes:
      "pair": "Not {1}, 'why': the last vowel of {2} is long and open, that of {1} short and round."
      "n2": "The stem's vowel changes: {1}, I buy, but {2}, you buy."
    "examples": {
      "আপনি কী কেনেন?": {"native": "What do you buy? (respectful)", "bases": {"কেনেন": "to buy"}},
      "ওয়্যারলেস মাউস কিনেছি।": {"native": "I have bought a wireless mouse.", "bases": {"কিনেছি": "to buy"}}
    }
  "bn-0891":
    native: "to get; to find; to receive"
    wiktionary: true
    notes:
      "n1": "It also says that you feel hunger or thirst, for which Bengali 'gets' it: {1}, 'hunger is got'."
    "examples": {
      "ডিগ্রি পেয়েছি।": {"native": "I have got a degree.", "bases": {"পেয়েছি": "to get; to find; to receive"}},
      "প্রশ্নপত্র পেয়েছি।": {"native": "I have got the question paper.", "bases": {"পেয়েছি": "to get; to find; to receive"}}
    }
  "bn-0892":
    native: "to walk; to move; to go on"
    wiktionary: true
    notes:
      "n1": "{1}, 'let's go', is the polite way of setting off together. It also means that something works or goes on: {2}, work is going on."
    "examples": {
      "খনন কাজ চলছে।": {"native": "The excavation work is going on.", "bases": {"চলছে": "to walk; to move; to go on"}},
      "চলো আলাপ করি।": {"native": "Let us chat. (familiar)", "bases": {"চলো": "to walk; to move; to go on"}}
    }
  "bn-0893":
    native: "to bring"
    wiktionary: true
    notes:
      "n1": "It means to bring something here. To bring something along with you is {1}."
    "examples": {
      "নতুন ধারণা আনো।": {"native": "Bring a new idea. (familiar)", "bases": {"আনো": "bring"}},
      "গরুর জন্য খড় আনো।": {"native": "Bring straw for the cows. (familiar)", "bases": {"গরুর": "of the cow", "জন্য": "for", "আনো": "bring"}}
    }
  "bn-0894":
    native: "to put; to keep"
    wiktionary: true
    notes:
      "n1": "It means to put a thing somewhere and to keep it there: {1}, please put it here. It is also used for naming: {2}, to give a name."
    "examples": {
      "ধৈর্য রাখো।": {"native": "Be patient. (familiar)", "bases": {"রাখো": "to put; to keep"}},
      "ফোনটা রাখুন।": {"native": "Hang up the phone. (respectful)", "bases": {"রাখুন": "to put; to keep"}}
    }
  "bn-0895":
    native: "to play"
    wiktionary: true
    notes:
      "n1": "The same word {1} is the noun 'a game': {2}, playing cricket."
    "examples": {
      "ছেলেরা খেলছে।": {"native": "The boys are playing.", "bases": {"খেলছে": "to play"}},
      "টেনিস খেলো?": {"native": "Do you play tennis? (familiar)", "bases": {"খেলো": "to play"}}
    }
  "bn-0896":
    native: "to walk"
    wiktionary: true
    notes:
      "n1": "It is walking on foot. {1} also covers going along, by any means."
    "examples": {
      "দ্রুত হাঁটো।": {"native": "Walk quickly. (familiar)", "bases": {"হাঁটো": "to walk"}},
      "হেঁটে যাও।": {"native": "Go on foot. (familiar)", "bases": {"হেঁটে": "to walk"}}
    }
  "bn-0897":
    native: "to open"
    wiktionary: true
    notes:
      "n1": "The stem's vowel changes: {1}, I open, but {2}, you open. The same word {3} is also the adjective 'open'."
    "examples": {
      "গেটটা খোলা।": {"native": "The gate is open.", "bases": {"গেটটা": "gate", "খোলা": "to open"}},
      "ড্রয়ারটা খোলো।": {"native": "Open the drawer. (familiar)", "bases": {"ড্রয়ারটা": "drawer", "খোলো": "to open"}}
    }
  "bn-0898":
    native: "to call"
    wiktionary: true
    notes:
      "n1": "It means to call someone, and to summon a doctor or a taxi. The noun {1}, 'a call', is the same."
    "examples": {
      "কর্মকর্তা ডাকছেন।": {"native": "The officer is calling.", "bases": {"ডাকছেন": "calling"}},
      "তোমাকেই ডাকছি।": {"native": "I am calling you, and you alone.", "bases": {"ডাকছি": "to call"}}
    }
  "bn-0899":
    native: "to laugh; to smile"
    wiktionary: true
    notes:
      "n1": "It covers both laughing and smiling: {1}, 'please smile', is what a photographer says."
    "examples": {
      "প্রেমিকা হাসল।": {"native": "The girlfriend smiled.", "bases": {"হাসল": "to laugh; to smile"}},
      "বুড়ো মানুষটি হাসছেন।": {"native": "The old man is smiling. (respectful)", "bases": {"মানুষটি": "the person", "হাসছেন": "is smiling (respectful)"}}
    }
  "bn-1447":
    native: "Present tense: to come"
    explanation: "The simple present of to come, by person and respect, in the table's order."
  "bn-1448":
    native: "Present tense: to go"
    explanation: "The simple present of to go, by person and respect, in the table's order."
  "bn-1449":
    native: "Present tense: to be; to become; to happen"
    explanation: "The simple present of to be; to become; to happen, by person and respect, in the table's order."
  "bn-1450":
    native: "Present tense: to stay; to live; to be (in a place)"
    explanation: "The simple present of to stay; to live; to be (in a place), by person and respect, in the table's order."
  "bn-1451":
    native: "Present tense: to eat; to drink"
    explanation: "The simple present of to eat; to drink, by person and respect, in the table's order."
  "bn-1452":
    native: "Present tense: to see; to look; to watch"
    explanation: "The simple present of to see; to look; to watch, by person and respect, in the table's order."
  "bn-1454":
    native: "Present tense: to say; to speak; to tell"
    explanation: "The simple present of to say; to speak; to tell, by person and respect, in the table's order."
  "bn-1463":
    native: "Present tense: to give"
    explanation: "The simple present of to give, by person and respect, in the table's order."
  "bn-1520":
    native: "Simple present: I (āmi)"
    explanation: "The simple present for I, আমি (āmi), across the verbs: আসি (āsi), যাই (jāi), খাই (khāi), দেখি (dekhi). The full list shows every verb of the course."
  "bn-1521":
    native: "Simple present: you (tumi)"
    explanation: "The simple present for the familiar you, তুমি (tumi), across the verbs: আসো (āso), যাও (jāo), খাও (khāo), দেখো (dekho). The full list shows every verb of the course."
  "bn-1522":
    native: "Simple present: you (āpni)"
    explanation: "The simple present for the respectful you, আপনি (āpni), across the verbs: আসেন (āsen), যান (jān), খান (khān), দেখেন (dekhen). The full list shows every verb of the course."
