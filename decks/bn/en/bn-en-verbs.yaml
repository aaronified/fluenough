schema: 1
id: "bn-en-verbs"
kind: "layer"
core: "bn-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Everyday verbs"
description: "The verbs of every day, in the form the dictionary gives: come, go, eat, see, say, give, take and the rest, with the way each is said for I, you and he. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC0-1.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-0872":
    native: "to come"
    wiktionary: true
    notes:
      "n1": "On leaving, people say {1}, 'I'll come', and not {2}, 'I'm going', which sounds final."
  "bn-0873":
    native: "to go"
    wiktionary: true
    notes:
      "n1": "Its stem {1} ends in a vowel, so the endings are short: {2}, {3}, {4}. It is also the verb that makes the passive: {5}, 'can be seen'."
  "bn-0874":
    native: "to be; to become; to happen"
    wiktionary: true
    notes:
      "n1": "There is no word for 'is' between a noun and what it is: {1}, 'I am a student'. {2} means 'to become' and 'to happen': {3}, what has happened?"
  "bn-0875":
    native: "to stay; to live; to be (in a place)"
    wiktionary: true
    notes:
      "n1": "It says where someone lives: {1}, I live in Kolkata. It also means 'to stay' and 'to remain'."
  "bn-0876":
    native: "to eat; to drink"
    wiktionary: true
    notes:
      "n1": "It also covers drinking and smoking: {1}, I drink tea; {2}, I smoke. A polite request is the same as the present: {3}, please eat."
  "bn-0877":
    native: "to see; to look; to watch"
    wiktionary: true
    notes:
      "n1": "It also names a meeting: {1}, 'we will meet', is literally 'a seeing will be'."
  "bn-0878":
    native: "to hear; to listen"
    wiktionary: true
    notes:
      "n1": "The stem's vowel changes: {1}, I listen, but {2}, he listens. {3}, please listen, is also how you get attention."
  "bn-0879":
    native: "to say; to speak; to tell"
    wiktionary: true
    notes:
      "n1": "It means to say, to speak and to tell: {1}, I speak Bengali. {2}, 'please say', also invites someone to speak."
  "bn-0880":
    native: "to write"
    wiktionary: true
    notes:
      "n1": "The stem's vowel changes: {1}, I write, but {2}, you write. The same word {3} is also a noun, 'writing'."
  "bn-0881":
    native: "to know"
    wiktionary: true
    notes:
      "n1": "It is for knowing a fact or a language: {1}, I know. For knowing a person it is {2}."
  "bn-0882":
    native: "to understand"
    wiktionary: true
    notes:
      "n1": "The stem's vowel changes: {1}, I understand, but {2}, you understand."
  "bn-0883":
    native: "to learn"
    wiktionary: true
    notes:
      "n1": "The stem's vowel changes: {1}, I learn, but {2}, he learns. To teach is a different verb, {3}."
  "bn-0884":
    native: "to sit"
    wiktionary: true
    notes:
      "n1": "{1} is the polite request to sit down. The same verb also means 'to settle' and, after another verb, 'to keep': {2}, to sit about."
  "bn-0885":
    native: "to get up; to rise"
    wiktionary: true
    notes:
      "n1": "The stem's vowel changes: {1}, I get up, but {2}, you get up. It also means 'to climb'."
  "bn-0886":
    native: "to stand"
    wiktionary: true
    notes:
      "n1": "Said sharply, {1} means 'stop!' or 'wait!'."
  "bn-0887":
    native: "to sleep"
    notes:
      "n1": "It is also written {1}; the first spelling is how it is said."
  "bn-0888":
    native: "to give"
    wiktionary: true
    notes:
      "n1": "It is irregular, with a different vowel in nearly every form: {1}, {2}, {3}, {4}. {5}, 'please give', is how you ask for something in a shop."
  "bn-0889":
    native: "to take"
    wiktionary: true
    notes:
      "n1": "It is irregular like {1}: {2}, {3}, {4}, {5}. It is also used for medicine and for a price: {6}, to take medicine; {7}, to charge a price."
  "bn-0890":
    native: "to buy"
    wiktionary: true
    notes:
      "pair": "Not {1}, 'why': the last vowel of {2} is long and open, that of {1} short and round."
      "n2": "The stem's vowel changes: {1}, I buy, but {2}, you buy."
  "bn-0891":
    native: "to get; to find; to receive"
    wiktionary: true
    notes:
      "n1": "It also says that you feel hunger or thirst, for which Bengali 'gets' it: {1}, 'hunger is got'."
  "bn-0892":
    native: "to walk; to move; to go on"
    wiktionary: true
    notes:
      "n1": "{1}, 'let's go', is the polite way of setting off together. It also means that something works or goes on: {2}, work is going on."
  "bn-0893":
    native: "to bring"
    wiktionary: true
    notes:
      "n1": "It means to bring something here. To bring something along with you is {1}."
  "bn-0894":
    native: "to put; to keep"
    wiktionary: true
    notes:
      "n1": "It means to put a thing somewhere and to keep it there: {1}, please put it here. It is also used for naming: {2}, to give a name."
  "bn-0895":
    native: "to play"
    wiktionary: true
    notes:
      "n1": "The same word {1} is the noun 'a game': {2}, playing cricket."
  "bn-0896":
    native: "to walk"
    wiktionary: true
    notes:
      "n1": "It is walking on foot. {1} also covers going along, by any means."
  "bn-0897":
    native: "to open"
    wiktionary: true
    notes:
      "n1": "The stem's vowel changes: {1}, I open, but {2}, you open. The same word {3} is also the adjective 'open'."
  "bn-0898":
    native: "to call"
    wiktionary: true
    notes:
      "n1": "It means to call someone, and to summon a doctor or a taxi. The noun {1}, 'a call', is the same."
  "bn-0899":
    native: "to laugh; to smile"
    wiktionary: true
    notes:
      "n1": "It covers both laughing and smiling: {1}, 'please smile', is what a photographer says."
