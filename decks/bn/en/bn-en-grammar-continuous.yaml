native: { code: "en", iso639_3: "eng", name: "English" }
name: "Present continuous"
description: "I am doing, she is going: what is happening now."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar"]
pattern:
  name: "Present continuous"
  slot_name: "person and respect"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "kora": "to do"
    "jaoa": "to go"
    "khaoa": "to eat"
    "bola": "to say"
  notes: "The verb changes for person and for respect, never for gender or number: আমি (āmi) and আমরা (āmorā) take the same form. The endings are -ছি (-chi), -ছিস (-chis), -ছো (-cho), -ছেন (-chen), -ছে (-che); a stem ending in a vowel takes -চ্ছ- (-cch-): যাচ্ছি (jācchi). করছো (kôrocho) is also written করছ (kôroch), and both are accepted."
