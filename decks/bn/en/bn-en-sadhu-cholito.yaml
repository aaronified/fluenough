id: "bn-en-sadhu-cholito"
kind: "layer"
core: "bn-sadhu-cholito"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Older Bengali: sadhu and cholito"
description: "Before reading Tagore: the older forms his books use, to recognise. Sadhu verbs and pronouns, the apostrophe that marks a dropped vowel, and older and poetic words, each with its চলিত (colito) form, the Bengali of today. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["reading", "unreviewed"]
cards:
  "bn-0773":
    native: "having done; today করে (kôre)"
    notes:
      "n1": "The apostrophe marks a dropped ই (i): সাধু করিয়া (sādhu koriyā), older ক (kô)’রে (re), today করে (kôre). In Sahaj Path: চুপ ক (cup kô)’রে ব (re bô)’সে ঘুম পায় (se ghum pāy)।"
  "bn-0774":
    native: "sitting; today বসে (bôse)"
    notes:
      "n1": "The same apostrophe: সাধু বসিয়া (sādhu bosiyā), older ব (bô)’সে (se), today বসে (bôse)."
  "bn-0775":
    native: "that; today usually ওই (oi)"
    notes:
      "n1": "An older spelling, still in use. In Sahaj Path: ঐ সাদা ছাতা (oi sādā chātā)।"
  "bn-0776":
    native: "a few (people); today usually কয়েকজন (kôyekojon)"
    notes:
      "n1": "In Sahaj Path: ঐ বাড়ি থেকে কয়জন ছেলে এলে বেশ হয় (oi bāṛi theke kôyjon chele ele beś hôy)।"
  "bn-0777":
    native: "poor, unhappy; today দুঃখী (duḥkhi)"
    notes:
      "n1": "An older, poetic form. In Sahaj Path: দুখী বুড়ি (dukhi buṛi)."
  "bn-0778":
    native: "I don't say; today বলি না (boli nā)"
    notes:
      "n1": "Older speech uses নে (ne) for না (nā). In Sahaj Path: তাকে কিছু বলি নে (tāke kichu boli ne)।"
  "bn-0779":
    native: "there isn't; today নেই (nei)"
    notes:
      "n1": "Sadhu, and still heard in speech. Tagore, বাংলাভাষা-পরিচয় (bāṅlābhāśā-poricoy): ‘নাহি (nāhi)’ শব্দের সংস্কৃত প্রতিশব্দ (śôbder soṅskrit protiśobd) ‘নাস্তি (nāsti)’, চলিত কথায় (colit kôthāy) ‘নেই (nei)’।"
  "bn-0780":
    native: "come!; today এসো (eso)"
    notes:
      "n1": "The familiar 'come', written without ো (o) in older books."
  "bn-0781":
    native: "where; today কোথায় (kothāy)"
    notes:
      "n1": "Poetic and older."
  "bn-0782":
    native: "my; today আমার (āmār)"
    notes:
      "n1": "Poetic."
  "bn-0783":
    native: "him, her; today তাকে (tāke)"
    notes:
      "n1": "Poetic."
  "bn-0784":
    native: "here; today এখানে (ekhāne)"
    notes:
      "n1": "Poetic, with হোথা (hothā), over there, and সেথা (sethā), there."
  "bn-0785":
    native: "having done; চলিত করে (colit kôre)"
    notes:
      "n1": "Sadhu verbs are longer: -ইয়া (-iyā) for -এ (-e). Every sadhu verb below follows the same pattern."
  "bn-0786":
    native: "did (he, she); চলিত করল (colit kôrol)"
    notes:
      "n1": "Sadhu -ইল (-il) for the plain past, চলিত (colit) -ল (-lô)."
  "bn-0787":
    native: "I did; চলিত করলাম (colit kôrolām)"
    notes:
      "n1": "Sadhu -ইলাম (-ilām), চলিত (colit) -লাম (-lām)."
  "bn-0788":
    native: "is doing; চলিত করছে (colit kôroche)"
    notes:
      "n1": "Sadhu -ইতেছে (-iteche), চলিত (colit) -ছে (-che). The NCTB grammar pairs তাহারা বাড়ি যাইতেছে (tāhārā bāṛi jāiteche)। with তারা বাড়ি যাচ্ছে (tārā bāṛi jācche)। (they are going home)."
  "bn-0789":
    native: "has done; চলিত করেছে (colit kôreche)"
    notes:
      "n1": "Sadhu -ইয়াছে (-iyāche), চলিত (colit) -এছে (-eche). The NCTB grammar pairs আপনি ভাত খাইয়াছেন (āpni bhāt khāiyāchen)। with আপনি ভাত খেয়েছেন (āpni bhāt kheyechen)। (you have eaten)."
  "bn-0790":
    native: "will do; চলিত করবে (colit kôrobe)"
    notes:
      "n1": "Sadhu -ইবে (-ibe), চলিত (colit) -বে (-be)."
  "bn-0791":
    native: "to do; চলিত করতে (colit kôrote)"
    notes:
      "n1": "Sadhu -ইতে (-ite), চলিত (colit) -তে (-te)."
  "bn-0792":
    native: "his, her; চলিত তার (colit tār)"
    notes:
      "n1": "Sadhu pronouns are longer: তাহা (tāhā) for তা (tā)."
  "bn-0793":
    native: "him, her; চলিত তাকে (colit tāke)"
    notes:
      "n1": "Likewise উহাকে (uhāke) for ওকে (oke)."
  "bn-0794":
    native: "they; চলিত তারা (colit tārā)"
    notes:
      "n1": "The NCTB grammar pairs তাহারা বাড়ি যাইতেছে (tāhārā bāṛi jāiteche)। with তারা বাড়ি যাচ্ছে (tārā bāṛi jācche)।"
  "bn-0795":
    native: "what, which; চলিত যা (colit jā)"
    notes:
      "n1": "Likewise ইহা (ihā) for এ- (e-) and উহা (uhā) for ও- (o-)."
  "bn-0796":
    native: "from; চলিত থেকে (colit theke)"
    notes:
      "n1": "Sadhu হইতে (hoite), চলিত থেকে (colit theke)."
