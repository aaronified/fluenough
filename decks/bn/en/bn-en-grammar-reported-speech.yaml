description: "Reported speech: to pass on what someone said, put যে (je) before the reported clause, and change the person and the tense. Not yet checked by a Bengali speaker: please report any mistake."
tags: ["unreviewed"]
pattern:
  name: "Reported speech"
  slot_name: "form"
  slots: { "direct": "the words as they were said, in quotes", "reported": "the words told by another person, with যে (je), that" }
  entries:
    "bola": "to say"
    "janano": "to inform"
    "lekha": "to write"
    "bhaba": "to think"
    "jijnes": "to ask"
  notes: "To pass on what someone said, put যে (je) before the reported clause, and change the person to fit the speaker: সে বলল, 'আমি যাব।' (se bolal, 'āmi jāb'), she said, 'I will go.' becomes সে বলল যে সে যাবে (se bolal je se jābe), she said that she would go. For a command use যেন (jen): মা বললেন যেন আমি যাই (mā bolen jen āmi jāi), mother said that I should go. A question keeps its question word and drops the question mark: সে জিজ্ঞেস করল তুমি কোথায় যাবে (se jijñes korolo tumi kothāy jābe), she asked where you would go."
