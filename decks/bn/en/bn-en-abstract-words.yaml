schema: 1
id: "bn-en-abstract-words"
kind: "layer"
core: "bn-abstract-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Ideas and qualities"
description: "Words for ideas and qualities: hope, balance, honesty, patience, success and the things we talk about in an opinion. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-4244":
    native: "possibility"
    notes:
      "n1": "{1}: Possibility: a chance that something may happen."
    examples:
      "এখানে ভালো কাজের সম্ভাবনা আছে।": { native: "There is a chance of good work here.", bases: { "আছে": "there is" } }
      "বৃষ্টির সম্ভাবনা বেশি।": "The chance of rain is high."
  "bn-4245":
    native: "limitation"
    notes:
      "n1": "{1}: Limitation: a limit that holds someone or something back."
    examples:
      "আমাদের সীমাবদ্ধতা আছে।": { native: "We have limitations.", bases: { "আছে": "have" } }
      "সময়ের সীমাবদ্ধতায় কাজটা শেষ হলো না।": { native: "Because of the time limit, the work did not finish.", bases: { "সীমাবদ্ধতায়": "limitation", "শেষ": "finish" } }
  "bn-4246":
    native: "equality"
    notes:
      "n1": "{1}: Equality: the same rights and status for everyone."
    examples:
      "সবার সমান অধিকার, এটাই সাম্য।": "Equal rights for all, that is equality."
      "সাম্যের জন্য লড়াই চলছে।": { native: "A fight for equality is going on.", bases: { "সাম্যের": "equality", "লড়াই": "fight" } }
  "bn-4247":
    native: "honesty"
    notes:
      "n1": "{1}: Honesty: being truthful and fair."
    examples:
      "তার সততা সবাই জানে।": "Everyone knows his honesty."
      "সততাই সবচেয়ে বড় গুণ।": { native: "Honesty is the greatest quality.", bases: { "সবচেয়ে": "most", "গুণ": "quality", "সততাই": "honesty" } }
  "bn-4248":
    native: "opportunity"
    notes:
      "n1": "{1}: Opportunity: a chance to do something good."
    examples:
      "এটা একটা ভালো সুযোগ।": { native: "This is a good opportunity.", bases: { "একটা": "a" } }
      "সুযোগ হাতছাড়া করো না।": { native: "Do not let the opportunity go. (familiar)", bases: { "হাতছাড়া": "let go" } }
  "bn-4249":
    native: "creation"
    notes:
      "n1": "{1}: Creation: something made new, or the act of making it."
    examples:
      "এটা তার নতুন সৃষ্টি।": "This is his new creation."
      "প্রকৃতির সৃষ্টি সুন্দর।": "Nature's creation is beautiful."
  "bn-4250":
    native: "effort"
    notes:
      "n1": "{1}: Effort: a serious attempt to do something hard."
    examples:
      "তার প্রয়াস প্রশংসনীয়।": { native: "His effort is praiseworthy.", bases: { "প্রশংসনীয়": "praiseworthy" } }
      "প্রয়াসের ফল পাওয়া গেল।": { native: "The result of the effort was found.", bases: { "প্রয়াসের": "effort" } }
  "bn-4251":
    native: "attempt"
    notes:
      "n1": "{1}: Trying: an attempt to do something."
    examples:
      "চেষ্টা করে যাও।": "Keep trying. (familiar)"
      "আমার চেষ্টা বৃথা গেল।": { native: "My attempt was wasted.", bases: { "বৃথা": "wasted" } }
  "bn-4252":
    native: "knowledge"
    notes:
      "n1": "{1}: Knowledge: what one knows, or understanding."
    examples:
      "বই পড়ে জ্ঞান বাড়ে।": { native: "Knowledge grows by reading books.", bases: { "বাড়ে": "grows" } }
      "জ্ঞানী মানুষকে সবাই সম্মান করে।": { native: "Everyone respects a knowledgeable person.", bases: { "জ্ঞানী": "knowledgeable", "মানুষকে": "person" } }
  "bn-4253":
    native: "intelligence"
    notes:
      "n1": "{1}: Intelligence: the ability to think and understand quickly."
    examples:
      "তার বুদ্ধি খুব ধারালো।": { native: "His intelligence is very sharp.", bases: { "ধারালো": "sharp" } }
      "বুদ্ধি খাটাও।": { native: "Use your intelligence. (familiar)", bases: { "খাটাও": "use" } }
  "bn-4254":
    native: "beauty"
    notes:
      "n1": "{1}: Beauty: the quality of being pleasing to see."
    examples:
      "এই জায়গার সৌন্দর্য অপূর্ব।": { native: "The beauty of this place is wonderful.", bases: { "এই": "this", "জায়গার": "of the place", "অপূর্ব": "wonderful" } }
      "সৌন্দর্য দেখে মুগ্ধ হলাম।": { native: "I was charmed by the beauty.", bases: { "মুগ্ধ": "charmed" } }
  "bn-4255":
    native: "progress"
    notes:
      "n1": "{1}: Progress: moving forward and getting better over time."
    examples:
      "দেশের প্রগতি হচ্ছে।": "The country is making progress."
      "প্রগতির পথে এগিয়ে চলো।": { native: "Move forward on the path of progress. (familiar)", bases: { "প্রগতির": "progress", "এগিয়ে": "forward" } }
  "bn-4256":
    native: "decline"
    notes:
      "n1": "{1}: Decline: getting worse."
    examples:
      "তার স্বাস্থ্যের অবনতি হয়েছে।": "His health has declined."
      "অবনতি রোধ করা জরুরি।": { native: "Stopping the decline is important.", bases: { "রোধ": "stopping" } }
  "bn-4257":
    native: "discipline"
    notes:
      "n1": "{1}: Discipline: order and good behaviour kept by rules."
    examples:
      "ক্লাসে শৃঙ্খলা থাকা জরুরি।": "Discipline in class is important."
      "শৃঙ্খলা মেনে চলো।": { native: "Follow the discipline. (familiar)", bases: { "মেনে": "following" } }
  "bn-4258":
    native: "conscience"
    notes:
      "n1": "{1}: Conscience: the inner sense of right and wrong."
    examples:
      "তার বিবেক পরিষ্কার।": "His conscience is clear."
      "বিবেকের কথা শোনো।": { native: "Listen to your conscience. (familiar)", bases: { "বিবেকের": "conscience" } }
  "bn-4259":
    native: "dignity"
    notes:
      "n1": "{1}: Dignity: the respect that a person deserves."
    examples:
      "সবার মর্যাদা সমান।": "Everyone's dignity is equal."
      "মর্যাদা রক্ষা করা উচিত।": { native: "One should keep one's dignity.", bases: { "রক্ষা": "keep" } }
  "bn-4260":
    native: "pride"
    notes:
      "n1": "{1}: Pride: a feeling of honour in one's achievement."
    examples:
      "দেশের গৌরব বাড়াও।": { native: "Raise the country's pride. (familiar)", bases: { "বাড়াও": "raise" } }
      "এতে আমাদের গৌরব আছে।": { native: "There is our pride in this.", bases: { "আছে": "there is" } }
  "bn-4261":
    native: "culture"
    notes:
      "n1": "{1}: Culture: the customs, arts and way of life of a people."
    examples:
      "বাংলা সংস্কৃতি অনেক পুরোনো।": "Bengali culture is very old."
      "সংস্কৃতি জানা ভালো।": "Knowing culture is good."
  "bn-4262":
    native: "attention"
    notes:
      "n1": "{1}: Attention: focus on one thing."
    examples:
      "মনোযোগ দিয়ে পড়ো।": "Read with attention. (familiar)"
      "ক্লাসে তার মনোযোগ নেই।": { native: "He is not paying attention in class.", bases: { "নেই": "is not" } }
  "bn-4263":
    native: "curiosity"
    notes:
      "n1": "{1}: Curiosity: a desire to know or learn."
    examples:
      "শিশুদের কৌতূহল বেশি।": { native: "Children have a lot of curiosity.", bases: { "শিশুদের": "children" } }
      "কৌতূহলে সে প্রশ্ন করল।": { native: "Out of curiosity, she asked a question.", bases: { "কৌতূহলে": "curiosity" } }
  "bn-4264":
    native: "arrogance"
    notes:
      "n1": "{1}: Pride or arrogance: thinking too highly of oneself."
    examples:
      "অহংকার ভালো নয়।": "Arrogance is not good."
      "অহংকার ছাড়ো।": "Leave your arrogance. (familiar)"
  "bn-4265":
    native: "humility"
    notes:
      "n1": "{1}: Humility: modest and polite behaviour."
    examples:
      "তার বিনয় দেখে সবাই খুশি।": "Everyone is pleased with his humility."
      "বিনয়ের সঙ্গে কথা বলো।": { native: "Speak with humility. (familiar)", bases: { "বিনয়ের": "humility" } }
  "bn-4266":
    native: "honour"
    notes:
      "n1": "{1}: Honour and respect, a formal word."
    examples:
      "সম্ভ্রমের সঙ্গে আমন্ত্রণ জানাই।": { native: "I invite you with respect.", bases: { "আমন্ত্রণ": "invitation", "জানাই": "extend", "সম্ভ্রমের": "respect" } }
      "তার সম্ভ্রম রক্ষা করো।": { native: "Keep his honour. (familiar)", bases: { "রক্ষা": "keep" } }
  "bn-4267":
    native: "self-control"
    notes:
      "n1": "{1}: Self-control: holding back one's feelings and desires."
    examples:
      "রাগে সংযম রাখো।": "Keep control in anger. (familiar)"
      "সংযমই শান্তির পথ।": { native: "Self-control is the path to peace.", bases: { "সংযমই": "self-control" } }
  "bn-4268":
    native: "meaning; money"
    notes:
      "n1": "{1}: Meaning, or money: the sense of a word, or wealth."
    examples:
      "এই শব্দের অর্থ কী?": { native: "What is the meaning of this word? (familiar)", bases: { "এই": "this" } }
      "তার অর্থ অনেক।": "He has a lot of money."
  "bn-4269":
    native: "reality"
    notes:
      "n1": "{1}: Reality: the way things really are."
    examples:
      "বাস্তবতা মেনে নিতে হবে।": { native: "We must accept reality.", bases: { "মেনে": "accept" } }
      "এই গল্প বাস্তবতার কাছাকাছি।": { native: "This story is close to reality.", bases: { "এই": "this", "বাস্তবতার": "reality" } }
  "bn-4270":
    native: "evenness; equality"
    notes:
      "n1": "{1}: Equality or evenness: being equal or level."
    examples:
      "সবার সমতা থাকা উচিত।": "There should be equality for everyone."
      "জমিটা সমতল, সমতা আছে।": { native: "The land is flat, with evenness.", bases: { "আছে": "has" } }
  "bn-4271":
    native: "weakness"
    notes:
      "n1": "{1}: Weakness: lack of strength or ability."
    examples:
      "তার দুর্বলতা কোথায়?": "Where is his weakness? (familiar)"
      "দুর্বলতা স্বীকার করা ভালো।": { native: "Admitting weakness is good.", bases: { "স্বীকার": "admitting" } }
  "bn-4272":
    native: "success"
    notes:
      "n1": "{1}: Success: achieving what one set out to do."
    examples:
      "সফলতা এক দিনে আসে না।": "Success does not come in one day."
      "তার সফলতায় আমি খুশি।": { native: "I am happy at his success.", bases: { "সফলতায়": "success" } }
  "bn-4273":
    native: "failure"
    notes:
      "n1": "{1}: Failure: not succeeding in what one tried to do."
    examples:
      "ব্যর্থতা থেকে শেখো।": "Learn from failure. (familiar)"
      "এটা আমার ব্যর্থতা।": "This is my failure."
  "bn-4274":
    native: "happiness"
    notes:
      "n1": "{1}: Happiness: a state of being content and well."
    examples:
      "সুখ টাকায় কেনা যায় না।": "Happiness cannot be bought with money."
      "তারা সুখে আছে।": { native: "They are happy.", bases: { "আছে": "are", "সুখে": "happiness" } }
  "bn-4275":
    native: "remembrance"
    notes:
      "n1": "{1}: Remembrance: keeping someone in one's memory."
    examples:
      "তাঁর স্মরণে একটা সভা হলো।": { native: "A meeting was held in his remembrance.", bases: { "একটা": "a", "স্মরণে": "remembrance" } }
      "স্মরণ করে কাঁদলাম।": "I wept in remembrance."
  "bn-4276":
    native: "labour"
    notes:
      "n1": "{1}: Labour: hard work done with the body or the mind."
    examples:
      "কৃষকের শ্রমে ধান হয়।": { native: "Rice grows through the farmer's labour.", bases: { "শ্রমে": "labour" } }
      "এতে অনেক শ্রম লেগেছে।": "This took a lot of labour."
  "bn-4277":
    native: "inspiration"
    notes:
      "n1": "{1}: Inspiration: a force that moves one to act."
    examples:
      "তার কথায় প্রেরণা পেলাম।": "I got inspiration from his words."
      "প্রেরণা দাও।": "Give inspiration. (familiar)"
  "bn-4278":
    native: "credit; achievement"
    notes:
      "n1": "{1}: Credit or achievement: the honour for doing something well."
    examples:
      "এর কৃতিত্ব তোমার।": { native: "The credit for this is yours.", bases: { "এর": "this" } }
      "তার কৃতিত্ব সবাই মানে।": { native: "Everyone accepts his achievement.", bases: { "মানে": "accepts" } }
  "bn-4279":
    native: "grace"
    notes:
      "n1": "{1}: Grace or mercy: kindness shown from above."
    examples:
      "ঈশ্বরের কৃপা থাকুক।": { native: "May God's grace be there.", bases: { "ঈশ্বরের": "of God" } }
      "তাঁর কৃপায় বেঁচে গেলাম।": { native: "By his grace I survived.", bases: { "কৃপায়": "grace" } }
  "bn-4280":
    native: "compassion"
    notes:
      "n1": "{1}: Compassion: feeling for someone who suffers."
    examples:
      "তার করুণা অনেক।": "His compassion is great."
      "দরিদ্রদের প্রতি করুণা দেখাও।": { native: "Show compassion to the poor. (familiar)", bases: { "দরিদ্রদের": "the poor" } }
  "bn-4281":
    native: "devotion"
    notes:
      "n1": "{1}: Devotion: steady and sincere commitment to a task."
    examples:
      "কাজে নিষ্ঠা থাকা জরুরি।": "Devotion to work is important."
      "তিনি নিষ্ঠার সঙ্গে পড়ান।": { native: "He teaches with devotion.", bases: { "নিষ্ঠার": "devotion" } }
  "bn-4282":
    native: "transparency"
    notes:
      "n1": "{1}: Transparency: openness and clarity so that all can see."
    examples:
      "সরকারের স্বচ্ছতা দরকার।": "The government needs transparency."
      "কাজে স্বচ্ছতা রাখো।": "Keep transparency in work. (familiar)"
  "bn-4283":
    native: "self-interest"
    notes:
      "n1": "{1}: Self-interest: what one wants for oneself."
    examples:
      "নিজের স্বার্থ দেখো।": "Look after your own interest. (familiar)"
      "স্বার্থের জন্য কাজ করো না।": { native: "Do not work for self-interest. (familiar)", bases: { "স্বার্থের": "self-interest" } }
  "bn-4284":
    native: "helping others"
    notes:
      "n1": "{1}: Helping others: doing good for other people."
    examples:
      "পরোপকারই ধর্ম।": { native: "Helping others is the duty.", bases: { "ধর্ম": "duty", "পরোপকারই": "helping others" } }
      "পরোপকার করা ভালো।": "Helping others is good."
  "bn-4285":
    native: "self-confidence"
    notes:
      "n1": "{1}: Self-confidence: trust in one's own ability."
    examples:
      "তার আত্মবিশ্বাস বেশি।": "He has a lot of self-confidence."
      "আত্মবিশ্বাস নিয়ে কথা বলো।": "Speak with self-confidence. (familiar)"
  "bn-4286":
    native: "unity"
    notes:
      "n1": "{1}: Unity: people joined together in one purpose."
    examples:
      "ঐক্যই শক্তি।": { native: "Unity is strength.", bases: { "ঐক্যই": "unity" } }
      "দেশের ঐক্য বজায় থাকুক।": { native: "May the country's unity be kept.", bases: { "বজায়": "kept" } }
  "bn-4287":
    native: "variety"
    notes:
      "n1": "{1}: Variety or diversity: many different kinds together."
    examples:
      "এখানে অনেক বৈচিত্র্য আছে।": { native: "There is much variety here.", bases: { "আছে": "there is" } }
      "বৈচিত্র্যই সৌন্দর্য।": { native: "Variety is beauty.", bases: { "বৈচিত্র্যই": "diversity" } }
  "bn-4288":
    native: "balance"
    notes:
      "n1": "{1}: Balance: a state of even weight or steady order."
    examples:
      "জীবনে ভারসাম্য দরকার।": "Life needs balance."
      "দুই দিকে ভারসাম্য রাখো।": "Keep balance between the two sides. (familiar)"
  "bn-4289":
    native: "firmness"
    notes:
      "n1": "{1}: Firmness: strength of purpose that does not bend."
    examples:
      "তার দৃঢ়তা প্রশংসনীয়।": { native: "His firmness is praiseworthy.", bases: { "প্রশংসনীয়": "praiseworthy" } }
      "দৃঢ়তা নিয়ে এগিয়ে যাও।": { native: "Go forward with firmness. (familiar)", bases: { "এগিয়ে": "forward" } }
  "bn-4290":
    native: "morality"
    notes:
      "n1": "{1}: Morality: the principles of right and wrong in behaviour."
    examples:
      "তার নৈতিকতা প্রশ্নাতীত।": { native: "His morality is beyond question.", bases: { "প্রশ্নাতীত": "beyond question" } }
      "নৈতিকতা মেনে কাজ করো।": { native: "Work by the rules of morality. (familiar)", bases: { "মেনে": "by" } }
  "bn-4291":
    native: "welfare"
    notes:
      "n1": "{1}: Welfare: good for people, their well-being."
    examples:
      "সবার কল্যাণ চাই।": "I want welfare for everyone."
