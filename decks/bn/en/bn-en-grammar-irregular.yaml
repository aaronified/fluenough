pattern:
  name: "Irregular verbs"
  slot_name: "form"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "jaoa": "to go"
    "asha": "to come"
    "deoa": "to give"
    "neoa": "to take"
    "khaoa": "to eat"
    "hoa": "to be, to become"
  notes: "These are among the most used verbs in Bengali, so they are worth learning by heart. The stem's vowel shifts: দেওয়া (deoyā) gives দিই (dii), দিলাম (dilām), দেব (deb). আসা (āsā) and যাওয়া (jāoyā) take different pasts: এলাম (elām), গেলাম (gelām). আসা (āsā)'s past is এলাম (elām), also আসলাম (āślām); the drill accepts both. হোন (hon), the polite request of হওয়া (hôoyā), is written with ো (o) to keep it apart from the present হন (hôn)."
