schema: 1
id: "bn-en-verbs-4"
kind: "layer"
core: "bn-verbs-4"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Story actions"
description: "Verbs for telling a story: making, breaking, hiding, waking, shouting and the actions of a day. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-4144":
    native: "to build; to shape"
    notes:
      "n1": "{1}: To build or to shape: to make something by putting parts together."
    examples:
      "তারা নতুন ঘর গড়ল।": { native: "They built a new house.", bases: { "গড়ল": "to build; to shape" } }
      "মাটি দিয়ে পুতুল গড়ে।": { native: "She shapes dolls from clay.", bases: { "পুতুল": "dolls", "গড়ে": "to build; to shape" } }
  "bn-4145":
    native: "to hit"
    notes:
      "n1": "{1}: To hit or to strike: to give a blow with the hand or a stick."
    examples:
      "সে বল মারল।": { native: "He hit the ball.", bases: { "মারল": "to hit" } }
      "কেউ তাকে মারে না।": { native: "No one hits him.", bases: { "কেউ": "no one", "মারে": "to hit" } }
  "bn-4146":
    native: "to run"
    notes:
      "n1": "{1}: To run: to go fast on foot."
    examples:
      "ছেলেরা মাঠে ছুটল।": { native: "The boys ran to the field.", bases: { "ছুটল": "to run" } }
      "বাস ধরতে ছুটে যাও।": { native: "Run to catch the bus. (familiar)", bases: { "ছুটে": "to run" } }
  "bn-4147":
    native: "to fly"
    notes:
      "n1": "{1}: To fly: to move through the air with wings."
    examples:
      "পাখি আকাশে উড়ছে।": { native: "The bird is flying in the sky.", bases: { "উড়ছে": "to fly" } }
      "বিমানটা উড়ল।": { native: "The plane took off.", bases: { "উড়ল": "to fly" } }
  "bn-4148":
    native: "to shake off; to sweep"
    notes:
      "n1": "{1}: To shake off or to sweep: to clean by shaking or brushing."
    examples:
      "কাপড়টা ঝেড়ে নাও।": { native: "Shake the cloth and take it. (familiar)", bases: { "ঝেড়ে": "to shake off; to sweep" } }
      "ঘরটা ঝাড়তে হবে।": { native: "The room must be swept.", bases: { "ঝাড়তে": "to shake off; to sweep" } }
  "bn-4149":
    native: "to measure"
    notes:
      "n1": "{1}: To measure: to find the size or the length of something."
    examples:
      "দরজাটা মাপলাম।": { native: "I measured the door.", bases: { "মাপলাম": "to measure" } }
      "কাপড় মেপে দাও।": { native: "Measure the cloth and give it. (familiar)", bases: { "মেপে": "to measure" } }
  "bn-4150":
    native: "to tear"
    notes:
      "n1": "{1}: To tear: to pull something apart."
    examples:
      "জামাটা ছিঁড়ে গেল।": { native: "The shirt tore.", bases: { "ছিঁড়ে": "to tear" } }
      "কাগজ ছিঁড়ো না।": { native: "Do not tear the paper. (familiar)", bases: { "ছিঁড়ো": "to tear" } }
  "bn-4151":
    native: "to choose"
    notes:
      "n1": "{1}: To choose: to pick out the best from several."
    examples:
      "সে ভালো আম বাছল।": { native: "She picked out the good mangoes.", bases: { "বাছল": "to choose" } }
      "কোনটা বাছবে?": { native: "Which one will you choose? (familiar)", bases: { "বাছবে": "to choose" } }
  "bn-4152":
    native: "to taste"
    notes:
      "n1": "{1}: To taste: to take a small bit of food to try it."
    examples:
      "ঝোলটা একটু চাখো।": { native: "Taste the broth a little. (familiar)", bases: { "চাখো": "to taste" } }
      "সে মিষ্টি চাখল।": { native: "She tasted the sweet.", bases: { "চাখল": "to taste" } }
  "bn-4153":
    native: "to smell"
    notes:
      "n1": "{1}: To smell: to take in a scent through the nose."
    examples:
      "ফুলটা শুঁকলাম।": { native: "I smelled the flower.", bases: { "শুঁকলাম": "to smell" } }
      "গন্ধ শুঁকে বলো।": { native: "Smell it and tell me. (familiar)", bases: { "শুঁকে": "to smell" } }
  "bn-4154":
    native: "to float"
    notes:
      "n1": "{1}: To float: to stay on the surface of water."
    examples:
      "নৌকাটা জলে ভাসছে।": { native: "The boat is floating on the water.", bases: { "ভাসছে": "to float" } }
      "কাগজের নৌকা ভাসল।": { native: "The paper boat floated.", bases: { "ভাসল": "to float" } }
  "bn-4155":
    native: "to lick"
    notes:
      "n1": "{1}: To lick: to pass the tongue over something."
    examples:
      "বিড়ালটা দুধ চাটল।": { native: "The cat licked the milk.", bases: { "চাটল": "to lick" } }
      "আঙুল চেটো না।": { native: "Do not lick your fingers. (familiar)", bases: { "চেটো": "to lick" } }
  "bn-4156":
    native: "to rub"
    notes:
      "n1": "{1}: To rub: to move one thing hard over another."
    examples:
      "থালাটা ঘষে পরিষ্কার করো।": { native: "Rub the plate clean. (familiar)", bases: { "ঘষে": "to rub" } }
      "হাত ঘষল।": { native: "She rubbed her hands.", bases: { "ঘষল": "to rub" } }
  "bn-4157":
    native: "to dress up"
    notes:
      "n1": "{1}: To dress up: to put on clothes and ornaments for a special occasion."
    examples:
      "বউ সেজে বসেছে।": { native: "The bride is dressed up and sitting.", bases: { "সেজে": "to dress up" } }
      "ছেলেটা সেজে এল।": { native: "The boy came dressed up.", bases: { "সেজে": "to dress up" } }
  "bn-4158":
    native: "to take off; to untie"
    notes:
      "n1": "{1}: To take off or to untie: to remove a covering."
    examples:
      "জুতো খুলে ঢোকো।": { native: "Take off your shoes and come in. (familiar)", bases: { "খুলে": "to take off; to untie" } }
      "বাঁধনটা খুলল।": { native: "The knot came undone.", bases: { "বাঁধনটা": "the knot", "খুলল": "to take off; to untie" } }
  "bn-4159":
    native: "to climb; to ride"
    notes:
      "n1": "{1}: To climb or to ride: to go up onto something or into a vehicle."
    examples:
      "সে গাছে চড়ল।": { native: "She climbed the tree.", bases: { "চড়ল": "to climb; to ride" } }
      "বাসে চড়ে অফিসে যাই।": { native: "I ride the bus to the office.", bases: { "চড়ে": "to climb; to ride" } }
  "bn-4160":
    native: "to survive"
    notes:
      "n1": "{1}: To survive: to stay alive, or to be saved from danger."
    examples:
      "সে দুর্ঘটনায় বাঁচল।": { native: "He survived the accident.", bases: { "বাঁচল": "to survive" } }
      "কিভাবে বাঁচব?": { native: "How will I survive? (familiar)", bases: { "বাঁচব": "to survive" } }
  "bn-4161":
    native: "to die"
    notes:
      "n1": "{1}: To die: to stop living."
    examples:
      "গাছটা মরে গেল।": { native: "The tree died.", bases: { "মরে": "to die" } }
      "পোকাটা মরেছে।": { native: "The insect has died.", bases: { "পোকাটা": "the insect", "মরেছে": "to die" } }
  "bn-4162":
    native: "to sink"
    notes:
      "n1": "{1}: To sink: to go under water."
    examples:
      "নৌকাটা নদীতে ডুবল।": { native: "The boat sank in the river.", bases: { "ডুবল": "to sink" } }
      "সূর্য ডুবছে।": { native: "The sun is setting.", bases: { "ডুবছে": "to sink" } }
  "bn-4163":
    native: "to hang"
    notes:
      "n1": "{1}: To hang: to be fixed at the top and move freely below."
    examples:
      "দেয়ালে ছবি ঝুলছে।": { native: "A picture is hanging on the wall.", bases: { "ঝুলছে": "to hang" } }
      "গাছে আম ঝুলে আছে।": { native: "Mangoes are hanging on the tree.", bases: { "ঝুলে": "to hang", "আছে": "are" } }
  "bn-4164":
    native: "to shout out"
    notes:
      "n1": "{1}: To shout out: to call out loudly."
    examples:
      "সে জোরে হাঁক দিল।": { native: "He gave a loud shout.", bases: { "হাঁক": "a shout" } }
      "কেউ নাম ধরে হাঁকছে।": { native: "Someone is calling out the name.", bases: { "কেউ": "someone", "হাঁকছে": "to shout out" } }
  "bn-4165":
    native: "to swell"
    notes:
      "n1": "{1}: To swell: to grow bigger than normal."
    examples:
      "তার পা ফুলে গেছে।": { native: "His foot has swollen.", bases: { "ফুলে": "to swell" } }
      "গরমে ভাত ফুলে যায়।": { native: "In the heat, rice swells.", bases: { "ফুলে": "to swell" } }
  "bn-4166":
    native: "to turn; to roam"
    notes:
      "n1": "{1}: To turn or to roam: to move round, or to walk about for fun."
    examples:
      "চাকাটা ঘুরছে।": { native: "The wheel is turning.", bases: { "চাকাটা": "the wheel", "ঘুরছে": "to turn; to roam" } }
      "আমরা শহরে ঘুরে বেড়ালাম।": { native: "We wandered around the town.", bases: { "ঘুরে": "to turn; to roam", "বেড়ালাম": "wandered" } }
  "bn-4167":
    native: "to press"
    notes:
      "n1": "{1}: To press or to weigh down: to push down on something."
    examples:
      "ভারী বই দিয়ে কাগজ চাপা দাও।": { native: "Press the paper down with a heavy book. (familiar)", bases: { "চাপা": "to press" } }
      "কষ্টে বুক চাপা পড়ল।": "The chest was pressed by sorrow."
  "bn-4168":
    native: "to throw"
    notes:
      "n1": "{1}: To throw: to send something through the air with the hand."
    examples:
      "সে বল ছুঁড়ল।": { native: "He threw the ball.", bases: { "ছুঁড়ল": "to throw" } }
      "ঢিল ছুঁড়ো না।": { native: "Do not throw stones. (familiar)", bases: { "ঢিল": "stones", "ছুঁড়ো": "to throw" } }
  "bn-4169":
    native: "to wipe"
    notes:
      "n1": "{1}: To wipe: to clean by rubbing with a cloth."
    examples:
      "টেবিলটা মুছে নাও।": { native: "Wipe the table and take it. (familiar)", bases: { "মুছে": "to wipe" } }
      "মুখ পোঁছো।": { native: "Wipe your face. (familiar)", bases: { "পোঁছো": "to wipe" } }
  "bn-4170":
    native: "to wrap; to fold"
    notes:
      "n1": "{1}: To fold or to wrap: to turn or to wrap something around."
    examples:
      "উপহারটা কাগজে মোড়া হলো।": { native: "The gift was wrapped in paper.", bases: { "মোড়া": "to wrap; to fold" } }
      "কাপড়টা মুড়ে রাখো।": { native: "Fold the cloth and keep it. (familiar)", bases: { "মুড়ে": "to wrap; to fold" } }
  "bn-4171":
    native: "to sleep (formal)"
    notes:
      "n1": "{1}: To sleep: a more formal word for sleeping."
    examples:
      "শিশুটি এখন ঘুমাচ্ছে।": { native: "The child is sleeping now.", bases: { "শিশুটি": "the child", "ঘুমাচ্ছে": "to sleep (formal)" } }
      "রাতে ভালো করে ঘুমাও।": { native: "Sleep well at night. (familiar)", bases: { "ঘুমাও": "to sleep (formal)" } }
  "bn-4172":
    native: "to seat; to place"
    notes:
      "n1": "{1}: To seat or to place: to make someone sit, or to set something in a place."
    examples:
      "মা শিশুকে চেয়ারে বসাল।": { native: "The mother seated the child on the chair.", bases: { "শিশুকে": "the child", "বসাল": "to seat; to place" } }
      "টেবিলে ফুলদানি বসাও।": { native: "Place the vase on the table. (familiar)", bases: { "ফুলদানি": "vase", "বসাও": "to seat; to place" } }
  "bn-4173":
    native: "to make write"
    notes:
      "n1": "{1}: To make someone write, or to have something written."
    examples:
      "শিক্ষক ছাত্রকে বোর্ডে লেখাল।": { native: "The teacher made the student write on the board.", bases: { "লেখাল": "to make write" } }
      "চিঠিটা লেখানো হলো।": { native: "The letter was had written.", bases: { "লেখানো": "to make write" } }
  "bn-4174":
    native: "to move aside"
    notes:
      "n1": "{1}: To move aside: to shift something from its place."
    examples:
      "চেয়ারটা সরাও।": { native: "Move the chair aside. (familiar)", bases: { "সরাও": "to move aside" } }
      "সে জিনিসপত্র সরিয়ে রাখল।": { native: "She moved the things aside.", bases: { "জিনিসপত্র": "things", "সরিয়ে": "to move aside" } }
  "bn-4175":
    native: "to wrap around"
    notes:
      "n1": "{1}: To wrap or to coil around: to twist something round another thing."
    examples:
      "সে গায়ে চাদর জড়াল।": { native: "She wrapped a shawl around her body.", bases: { "গায়ে": "around the body", "জড়াল": "to wrap around" } }
      "লতাটা গাছে জড়িয়ে আছে।": { native: "The creeper is wound around the tree.", bases: { "লতাটা": "the creeper", "জড়িয়ে": "to wrap around", "আছে": "is" } }
  "bn-4176":
    native: "to pick up"
    notes:
      "n1": "{1}: To pick up: to gather things from the ground."
    examples:
      "সে রাস্তা থেকে একটা পয়সা কুড়াল।": { native: "She picked up a coin from the road.", bases: { "একটা": "a", "কুড়াল": "to pick up" } }
      "পাতা কুড়ানো হচ্ছে।": "Leaves are being gathered."
  "bn-4177":
    native: "to chase away"
    notes:
      "n1": "{1}: To chase away: to drive someone or something away."
    examples:
      "কুকুরটাকে তাড়াল।": { native: "He chased the dog away.", bases: { "তাড়াল": "to chase away" } }
      "মশা তাড়ানোর জন্য ধূপ জ্বালো।": { native: "Light incense to chase away mosquitoes. (familiar)", bases: { "তাড়ানোর": "to chase away" } }
  "bn-4178":
    native: "to bite"
    notes:
      "n1": "{1}: To bite: to close the teeth on something."
    examples:
      "কুকুরটা হাত কামড়াল।": { native: "The dog bit the hand.", bases: { "কামড়াল": "to bite" } }
      "মশা কামড়ায়।": { native: "Mosquitoes bite.", bases: { "কামড়ায়": "to bite" } }
  "bn-4179":
    native: "to make tremble"
    notes:
      "n1": "{1}: To make tremble: to shake something."
    examples:
      "ঠান্ডায় সে হাত কাঁপাচ্ছে।": { native: "In the cold, she is making her hands shake.", bases: { "কাঁপাচ্ছে": "to make tremble" } }
      "ভূমিকম্প মাটি কাঁপাল।": { native: "The earthquake shook the ground.", bases: { "কাঁপাল": "to make tremble" } }
  "bn-4180":
    native: "to startle"
    notes:
      "n1": "{1}: To startle: to make someone jump with surprise."
    examples:
      "বিকট শব্দে সবাই চমকাল।": { native: "Everyone was startled by the loud noise.", bases: { "বিকট": "loud", "চমকাল": "to startle" } }
      "খবরটা শুনে চমকে উঠলাম।": { native: "I jumped on hearing the news.", bases: { "চমকে": "to startle" } }
  "bn-4181":
    native: "to make laugh"
    notes:
      "n1": "{1}: To make someone laugh."
    examples:
      "সে সবাইকে হাসাল।": { native: "She made everyone laugh.", bases: { "হাসাল": "to make laugh" } }
      "গল্পটা আমাকে হাসাল।": { native: "The story made me laugh.", bases: { "হাসাল": "to make laugh" } }
  "bn-4182":
    native: "to make cry"
    notes:
      "n1": "{1}: To make someone cry."
    examples:
      "ছবিটা সবাইকে কাঁদাল।": { native: "The film made everyone cry.", bases: { "কাঁদাল": "to make cry" } }
      "দুঃখের কথা আমাকে কাঁদাল।": { native: "The sad words made me cry.", bases: { "কাঁদাল": "to make cry" } }
  "bn-4183":
    native: "to make angry"
    notes:
      "n1": "{1}: To make someone angry."
    examples:
      "তার কথা আমাকে রাগাল।": { native: "His words made me angry.", bases: { "রাগাল": "to make angry" } }
      "কেন ওকে রাগাচ্ছ?": { native: "Why are you making him angry? (familiar)", bases: { "রাগাচ্ছ": "to make angry" } }
  "bn-4184":
    native: "to lower"
    notes:
      "n1": "{1}: To lower or to bring down: to move something to a lower place."
    examples:
      "সে বাক্সটা নামাল।": { native: "She put the box down.", bases: { "নামাল": "to lower" } }
      "পতাকাটা নামাও।": { native: "Lower the flag. (familiar)", bases: { "পতাকাটা": "the flag", "নামাও": "to lower" } }
  "bn-4185":
    native: "to raise"
    notes:
      "n1": "{1}: To raise or to lift: to move something up."
    examples:
      "কুলি মাল মাথায় উঠাল।": { native: "The porter lifted the load onto his head.", bases: { "মাল": "load", "উঠাল": "to raise" } }
      "হাতটা উঠাও।": { native: "Raise your hand. (familiar)", bases: { "উঠাও": "to raise" } }
  "bn-4186":
    native: "to hide"
    notes:
      "n1": "{1}: To hide: to put out of sight."
    examples:
      "সে চাবিটা লুকাল।": { native: "She hid the key.", bases: { "লুকাল": "to hide" } }
      "বাচ্চারা খেলার সময় লুকায়।": { native: "Children hide during play.", bases: { "বাচ্চারা": "children", "লুকায়": "to hide" } }
  "bn-4187":
    native: "to save"
    notes:
      "n1": "{1}: To save someone: to rescue a person from danger."
    examples:
      "সে একটা শিশুকে বাঁচাল।": { native: "He saved a child.", bases: { "একটা": "a", "শিশুকে": "child", "বাঁচাল": "to save" } }
