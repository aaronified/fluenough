schema: 1
id: "bn-en-appearance-sentences"
kind: "layer"
core: "bn-appearance-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Appearance: sentences"
description: "Short sentences about how people look. They unlock once their words are known. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-2331":
    native: "Her hair is long."
    confusables: { "c1": { why: "খাটো (khāṭo), short: the wrong length for long hair." }, "c2": { why: "মোটা (moṭā), fat: a body, not a length of hair." } }
  "bn-2332":
    native: "She is very beautiful."
    confusables: { "c1": { why: "ভালো (bhālo), good: a judgement, not a look." }, "c2": { why: "কুৎসিত (kutsit), ugly: the opposite, which this sentence does not say." } }
  "bn-2333":
    native: "There is a smile on her face."
    confusables: { "c1": { why: "কান্না (kānnā), crying: not a smile." }, "c2": { why: "রাগ (rāg), anger: a feeling, not a smile." } }
  "bn-2334":
    native: "My father is of medium height."
    confusables: { "c1": { why: "ছোট (choṭo), small: a size of a thing, not a height in between." }, "c2": { why: "দাদা (dādā), elder brother: a family word, not a height." } }
  "bn-2335":
    native: "His skin is fair."
    bases: { "গায়ের": "of the body" }
    confusables: { "c1": { why: "সাদা (śādā), white: a colour, not a skin tone." }, "c2": { why: "কালো (kālo), black or dark: the other skin tone, not this one." } }
  "bn-2336":
    native: "He has a bald patch on his head."
    confusables: { "c1": { why: "চুল (cul), hair: a full head of hair is not a bald patch." }, "c2": { why: "চোখ (cokh), eye: a part of the face, not the top of the head." } }
  "bn-2337":
    native: "Grandfather's hair is grey."
    confusables: { "c1": { why: "ঘন (ghôn), thick: a density, not a colour." }, "c2": { why: "লম্বা (lômbā), long: a length, not a colour." } }
  "bn-2338":
    native: "He has grown old."
    bases: { "হয়েছে": "has become" }
    confusables: { "c1": { why: "ভালো (bhālo), good: not a sign of age." }, "c2": { why: "নতুন (notun), new: a thing, not a person's age." } }
  "bn-2339":
    native: "Your features are lovely."
    confusables: { "c1": { why: "ভালো (bhālo), good: a judgement, not a feature of the face." }, "c2": { why: "নাক (nāk), nose: one feature, not the whole face." } }
  "bn-2340":
    native: "That young man is tall."
    confusables: { "c1": { why: "বুড়ো (buṛo), old: not a young man." }, "c2": { why: "যুবতী (juboti), young woman: the wrong gender for this sentence." } }
  "bn-2341":
    native: "Her hair is curly and thick."
    confusables: { "c1": { why: "সোজা (śojā), straight: the opposite of curly, not this hair." }, "c2": { why: "দাড়ি (dāṛi), beard: hair on the face, not on the head." } }
  "bn-2342":
    native: "Your cheek is round and plump."
    confusables: { "c1": { why: "ভুরু (bhuru), eyebrow: a feature above the eye, not the cheek." }, "c2": { why: "ঠোঁট (ṭhom̐ṭ), lips: near the cheek, but not the cheek." } }
