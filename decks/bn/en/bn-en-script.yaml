schema: 1
id: "bn-en-script"
kind: "layer"
core: "bn-script"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "How Bengali script works"
intro: "Bengali script is built from a few ideas that come back in letter after letter. They look strange at first because English has none of them. Once you have seen them, the letters start to make sense."
features:
  "headline":
    name: "The headline"
    text: "Most letters hang from a line along the top, and in a word the lines join into one. Read along the top, not along a baseline as in English."
  "half-headline":
    name: "Letters with half a headline"
    text: "Eight letters carry only part of the line, so it stops short over them. Where it breaks often shows where one letter ends."
  "no-headline":
    name: "Letters with no headline"
    text: "A few letters and marks have no line at all and stand apart in a word."
  "rows":
    name: "Rows of five"
    text: "Most consonants come in five rows of five, each named after its first letter: ক-বর্গ (kô-bôrg), চ-বর্গ (cô-bôrg), ট-বর্গ (ṭô-bôrg), ত-বর্গ (tô-bôrg) and প-বর্গ (pô-bôrg). Each row is made in about one area of the mouth: ক (kô) at the back, চ (cô) against the palate, ট (ṭô) with the tongue curled back, ত (tô) on the teeth, প (pô) at the lips. Within a row the place can shift a little: ঢ (ḍhô) touches a little further back than ড (ḍô). The columns work the same way in every row: plain (ক), with a breath (খ), voiced (গ), voiced with a breath (ঘ), and through the nose (ঙ). Some letter names come from the rows: ণ (nô) is murdhonno no, of the ট (ṭô) row, and ন (nô) is donto no, of the ত (tô) row; জ (jô) is borgiyo jo, the jo of the rows, unlike য (jô)."
  "inherent-vowel":
    name: "The vowel you don't see"
    text: "Every consonant carries a vowel unless a sign changes it: most often the open o of অ (ô), like the aw in 'awe', and sometimes a closed o, as in 'go'. ক (kô) alone is ko. So কলম (kôlom) is kolom, with no vowel written at all."
  "final-vowel":
    name: "The last o is usually not said"
    text: "At the end of most words the carried o goes quiet: ঘর (ghôr) is ghor, not ghoro, and কলম (kôlom) is kolom. Some words keep it, such as বড় (bôṛo, big), so learn each word as it's said."
  "vowel-signs":
    name: "Vowels as signs on a letter"
    text: "After a consonant a vowel is a sign on it, not a letter of its own, named after its vowel: আ-কার (ā-kār) is the sign for আ (ā). ি (i), ে (e) and ৈ (oi) are written before the consonant but said after it: you see ি (i) then ক (kô), and say ki. ো (o) and ৌ (ou) go on both sides: কো (ko) is ko."
  "hoshonto":
    name: "The mark that takes the vowel away"
    text: "The small slanting stroke below a letter, ্, means no vowel after it. You'll rarely see it, because two consonants usually join instead."
  "conjuncts":
    name: "Letters that join"
    text: "Two consonants with no vowel between them are written as one shape, side by side or one above the other. Some look nothing like their parts: ক্ষ (kkhô) is ক (kô) and ষ (śô)."
  "r-forms":
    name: "র (rô) written as a stroke"
    text: "Next to another consonant র (rô) isn't written in full. After it, it's a stroke at its foot (প্র); before it, a small hook on top, the reph (র্ম)."
  "phola":
    name: "য (jô) and ব (bô) written as a sign"
    text: "After a consonant য (jô) is written as a hook beside it (ব্য), and ব (bô) as a small mark under or beside it (স্ব). Neither is usually said as itself: they double the consonant before them, or change its vowel, so learn each word as it's said."
  "dot-below":
    name: "A dot below makes another letter"
    text: "Some letters differ only by a dot below: ব (bô) and র (rô), ড (ḍô) and ড় (ṛô), ঢ (ḍhô) and ঢ় (ṛô), য (jô) and য় (yô). Look for the dot every time. Their names say so: র (rô) is ব-এ শূন্য র (bô-e śunno rô), ব (bô) with a zero below, and ড় (ṛô) is ড-এ শূন্য ড় (ḍô-e śunno ṛô). ড় (ṛô) and ঢ় (ṛô) are said with the tongue placed as for ড (ḍô) and ঢ (ḍhô), but not touching the roof of the mouth."
  "nasal-marks":
    name: "The moon and the circle"
    text: "The moon and dot ঁ (ôm̐) above a letter makes its vowel nasal, said through the nose as well, and it changes the word: বাধা (bādhā) is an obstacle, বাঁধা (bām̐dhā) is tied. The small circle ং (ôṅ) after a vowel is ng: বাংলা (bāṅlā)."
  "digits":
    name: "Bengali digits"
    text: "Bengali writes its own digits, in prices, dates and phone numbers. ৪ (4) is 4, though it looks like an 8."
