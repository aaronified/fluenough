    confusables: { "c1": { why: "self-interest: the opposite of welfare for all" }, "c2": { why: "harm: the opposite of welfare" } }
  "bn-4309":
    native: "Behind this success there is a lot of labour."
    bases: { "এই": "this", "সাফল্যের": "of success", "পেছনে": "behind", "শ্রম": "labour" }
    confusables: { "c1": { why: "failure: the opposite of success" }, "c2": { why: "laziness: the opposite of labour" } }
  "bn-4310":
    native: "With self-confidence and patience, everything happens."
    bases: { "আত্মবিশ্বাস": "self-confidence" }
    confusables: { "c1": { why: "fear: the opposite of confidence" }, "c2": { why: "impatience: the opposite of patience" } }
