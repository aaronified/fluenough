  "bn-4300":
    native: "Keeping balance is important for life."
    confusables: { "c1": { why: "inequality: the opposite of balance" }, "c2": { why: "indifference: a different attitude" } }
  "bn-4301":
    native: "I learnt a new skill in this opportunity."
    bases: { "এই": "this", "সুযোগে": "in this chance" }
    confusables: { "c1": { why: "danger: the opposite kind of chance" }, "c2": { why: "shortage: a different problem" } }
  "bn-4302":
    native: "After failure she tried again."
    bases: { "চেষ্টা": "tried" }
    confusables: { "c1": { why: "success: the opposite of failure" }, "c2": { why: "fear: a feeling, not an attempt" } }
  "bn-4303":
    native: "Everyone should have respect for the teacher."
    confusables: { "c1": { why: "contempt: the opposite of respect" }, "c2": { why: "devotion: close, but a different feeling" } }
  "bn-4304":
    native: "Bringing equality to society is not hard."
    confusables: { "c1": { why: "inequality: the opposite of equality" }, "c2": { why: "peace: a different aim" } }
  "bn-4305":
    native: "His firmness inspired everyone."
    bases: { "অনুপ্রাণিত": "inspired" }
    confusables: { "c1": { why: "weakness: the opposite of firmness" }, "c2": { why: "flexibility: a related but different quality" } }
  "bn-4306":
    native: "Care for the environment is the path to progress."
    confusables: { "c1": { why: "decline: the opposite of progress" }, "c2": { why: "improvement: close, but a different word" } }
  "bn-4307":
    native: "Devotion and honesty in work are important."
    bases: { "নিষ্ঠা": "devotion", "সততা": "honesty" }
    confusables: { "c1": { why: "neglect: the opposite of devotion" }, "c2": { why: "deceit: the opposite of honesty" } }
  "bn-4308":
    native: "She works for the welfare of everyone."
