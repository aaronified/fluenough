id: "bn-en-grammar-needs"
kind: "layer"
core: "bn-grammar-needs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Need and want"
description: "I need, I don't need, I want: লাগবে (lāgobe) and দরকার (dôrkār) take the needer's -র (-rô), চাই (cāi) does not. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "grammar"]
cards:
  "bn-0571":
    native: "I need an umbrella."
    notes:
      "n1": "The one who needs takes -র (-rô), and লাগবে (lāgobe) stays the same for everyone: তোর (tor), তোমার (tomār), আপনার (āponār), ওর (or), ওঁর একটা ছাতা লাগবে (om̐r ekoṭā chātā lāgobe). For something needed now, Bengali uses the future লাগবে (lāgobe), 'will be needed'; the present লাগে (lāge) is not used this way."
    bases:
      "লাগবে": "to feel; to be needed; to take (of time)"
  "bn-0572":
    native: "What do you need? (what a shopkeeper asks)"
    notes:
      "n1": "In a shop often just কী লাগবে (ki lāgobe)? To a friend: তোমার কী লাগবে (tomār ki lāgobe)?"
    bases:
      "লাগবে": "to feel; to be needed; to take (of time)"
  "bn-0573":
    native: "I don't need anything else."
    notes:
      "n1": "না (nā) goes at the end, after লাগবে (lāgobe)."
    bases:
      "লাগবে": "to feel; to be needed; to take (of time)"
  "bn-0574":
    native: "I don't need it, thanks."
    notes:
      "n1": "The polite way to turn down what a shopkeeper offers."
    bases:
      "লাগবে": "to feel; to be needed; to take (of time)"
  "bn-0577":
    native: "need; necessary"
    notes:
      "n1": "A noun, so it needs no verb in the present: আমার টাকা দরকার (āmār ṭākā dôrkār), I need money. It is a little more formal than লাগবে (lāgobe)."
  "bn-0578":
    native: "I need a little help."
    notes:
      "n1": "Like লাগবে (lāgobe), দরকার (dôrkār) takes the needer's -র (-rô)."
  "bn-0579":
    native: "There's no need."
    notes:
      "n1": "The negative of দরকার (dôrkār) is নেই (nei): আমার টাকা দরকার নেই (āmār ṭākā dôrkār nei), I don't need money."
    bases:
      "নেই": "there is not"
  "bn-0580":
    native: "I needed money."
    notes:
      "n1": "In the past দরকার (dôrkār) takes ছিল (chil), and ছিল না (chil nā) for 'didn't need': দরকার ছিল না (dôrkār chil nā). আছে (āche) changes its stem in the past: ছিল (chil)."
    bases:
      "ছিল": "to be; there is"
  "bn-0581":
    native: "I want a cup of tea."
    notes:
      "n1": "চাওয়া (cāoā), 'to want', is an ordinary verb: no -র (-rô) on the one who wants, and the verb changes for the person: আমি চাই (āmi cāi), তুই চাস (tui cās), তুমি চাও (tumi cāo), আপনি চান (āpni cān), ও চায় (o cāy), উনি চান (uni cān)."
    bases:
      "কাপ": "cup"
  "bn-0582":
    native: "She wants more time.; He wants more time."
