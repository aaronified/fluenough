schema: 1
id: "bn-en-market"
kind: "layer"
core: "bn-market"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Market"
description: "Asking the price, bargaining, paying, and saying how much: what a market stall needs."
license: "CC-BY-SA-4.0"
tags: ["beginner"]
cards:
  "bn-0243":
    native: "How much is it?"
    notes:
      "n1": "Also এটা কত? (eta koto?), how much is this?"
  "bn-0244":
    native: "price"
    "examples": {
      "কত দাম?": {"native": "How much is it?", "bases": {}},
      "এই দাম যুক্তিসঙ্গত।": {"native": "This price is reasonable.", "bases": {"এই": "this", "দাম": "price"}}
    }
  "bn-0245":
    native: "rupee; money"
    notes:
      "n1": "টাকা (ṭākā) is the word for money, and for the currency: the rupee in India, the taka in Bangladesh. একশো টাকা (ekśo ṭākā), a hundred rupees."
    "examples": {
      "অনলাইনে টাকা পাঠাও।": {"native": "Send money online. (familiar)", "bases": {"টাকা": "rupee; money"}}
    }
  "bn-0246":
    native: "change; small notes and coins"
    notes:
      "n1": "খুচরো আছে (khucro āche)? Do you have change?"
    "examples": {
      "খুচরো আছে?": {"native": "Do you have small change?", "bases": {}},
      "দোকানি খুচরো টাকা বদলে দিলেন।": {"native": "The shopkeeper exchanged the small change.", "bases": {}}
    }
  "bn-0247":
    native: "expensive"
    notes:
      "n1": "খুব দামি (khub dāmi)! It's very expensive! Adjectives don't change for number, and almost never for gender."
    "examples": {
      "চিত্রটি খুব দামি।": {"native": "The picture is very valuable.", "bases": {"চিত্রটি": "picture", "দামি": "expensive"}},
      "বেনারসিটা খুব দামি।": {"native": "The Banarasi sari is very costly.", "bases": {"বেনারসিটা": "Banarasi sari", "দামি": "expensive"}}
    }
  "bn-0248":
    native: "cheap"
    "examples": {
      "হোস্টেলটা সস্তা।": {"native": "The hostel is cheap.", "bases": {"হোস্টেলটা": "hostel", "সস্তা": "cheap"}},
      "ভর্তুকিতে সস্তা হলো।": {"native": "It became cheaper with the subsidy.", "bases": {"ভর্তুকিতে": "subsidy", "সস্তা": "cheap"}}
    }
  "bn-0249":
    native: "Please lower it a little."
    notes:
      "n1": "The polite way to bargain. Bargaining is expected at markets, not in shops with fixed prices."
  "bn-0250":
    native: "shop"
    "examples": {
      "দোকান বন্ধ।": {"native": "The shop is closed.", "bases": {}},
      "খদ্দের দোকানে ঢুকল।": {"native": "The customer came into the shop.", "bases": {"দোকানে": "shop"}}
    }
  "bn-0251":
    native: "please give (me)"
    notes:
      "n1": "The polite request form of দেওয়া (deoā, to give): এক কিলো দিন (ek kilo din), a kilo, please. দিন (din) also means 'day'."
  "bn-0252":
    native: "kilo"
    notes:
      "n1": "Also কেজি (keji). আধ কিলো (ādh kilo) is half a kilo."
    "examples": {
      "প্রতি কিলো কত?": {"native": "How much per kilo?", "bases": {}},
      "আমি এক কিলো আলু কিনি।": {"native": "I buy a kilo of potatoes.", "bases": {}}
    }
  "bn-0253":
    native: "Nothing else."
    notes:
      "n1": "What you say when the shopkeeper asks আর কিছু? (anything else?)."
  "bn-0545":
    native: "I'm just looking."
  "bn-0546":
    native: "How much a kilo?"
    notes:
      "n1": "কত করে (kôto kôre), 'at how much', asks the rate: কত করে ডজন (kôto kôre ḍôjon)? How much a dozen?"
  "bn-0547":
    native: "I'll take this."
  "bn-0548":
    native: "Do you have another colour?"
    bases:
      "আছে": "to be; there is"
  "bn-0549":
    native: "some; something"
    "examples": {
      "বাকি আছে কিছু।": {"native": "Some dues remain.", "bases": {"আছে": "remain", "কিছু": "some; something"}},
      "আগাম কিছু টাকা দিলাম।": {"native": "I paid some money in advance.", "bases": {"কিছু": "some"}}
    }
  "bn-0550":
    native: "many; a lot"
    "examples": {
      "অনেক শুভেচ্ছা!": {"native": "Many good wishes!", "bases": {}},
      "প্রার্থী অনেক।": {"native": "There are many candidates.", "bases": {"অনেক": "many; a lot"}}
    }
  "bn-0551":
    native: "a little"
    notes:
      "n1": "Also the softener in any request: একটু দেখুন (ekṭu dekhun), please have a look."
    "examples": {
      "আপনি একটু বসুন।": {"native": "Please sit down a moment. (respectful)", "bases": {"একটু": "little"}},
      "আমি একটু নার্ভাস।": {"native": "I am a little nervous.", "bases": {"একটু": "little"}}
    }
  "bn-0552":
    native: "all; everything"
    "examples": {
      "টাকাই সব নয়।": {"native": "Money is not everything.", "bases": {"সব": "all; everything"}},
      "সব কাপড় ভেজা।": {"native": "All the clothes are wet.", "bases": {}}
    }
  "bn-0553":
    native: "only; just"
    "examples": {
      "আমি শুধু দেখছি।": {"native": "I'm just looking.", "bases": {}},
      "দোকানি কার্ডে নেয় না, শুধু নগদ নেয়।": {"native": "The shopkeeper does not take cards, only cash.", "bases": {}}
    }
  "bn-0554":
    native: "enough"
  "bn-0555":
    native: "too much; too many"
    notes:
      "n1": "খুব বেশি দাম (khub beśi dām), the price is too high."
    "examples": {
      "তাপ বেশি।": {"native": "The heat is high.", "bases": {"বেশি": "too much; too many"}},
      "ব্যয় বেশি।": {"native": "The expense is high.", "bases": {"বেশি": "too much; too many"}}
    }
  "bn-0556":
    native: "less; low"
    "examples": {
      "ভলিউম কম।": {"native": "The volume is low.", "bases": {}},
      "আমার ব্যালেন্স কম।": {"native": "My balance is low.", "bases": {"কম": "less; low"}}
    }
