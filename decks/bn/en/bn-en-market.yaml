schema: 1
id: "bn-en-market"
kind: "layer"
core: "bn-market"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Market"
description: "Asking the price, bargaining, paying, and saying how much: what a market stall needs."
license: "CC-BY-SA-4.0"
tags: ["beginner"]
cards:
  "bn-0243":
    native: "How much is it?"
    notes:
      "n1": "Also এটা কত? (eta koto?), how much is this?"
  "bn-0244":
    native: "price"
  "bn-0245":
    native: "rupee; money"
    notes:
      "n1": "টাকা (ṭākā) is the word for money, and for the currency: the rupee in India, the taka in Bangladesh. একশো টাকা (ekśo ṭākā), a hundred rupees."
  "bn-0246":
    native: "change; small notes and coins"
    notes:
      "n1": "খুচরো আছে (khucro āche)? Do you have change?"
  "bn-0247":
    native: "expensive"
    notes:
      "n1": "খুব দামি (khub dāmi)! It's very expensive! Adjectives don't change for number, and almost never for gender."
  "bn-0248":
    native: "cheap"
  "bn-0249":
    native: "Please lower it a little."
    notes:
      "n1": "The polite way to bargain. Bargaining is expected at markets, not in shops with fixed prices."
  "bn-0250":
    native: "shop"
  "bn-0251":
    native: "please give (me)"
    notes:
      "n1": "The polite request form of দেওয়া (deoā, to give): এক কিলো দিন (ek kilo din), a kilo, please. দিন (din) also means 'day'."
  "bn-0252":
    native: "kilo"
    notes:
      "n1": "Also কেজি (keji). আধ কিলো (ādh kilo) is half a kilo."
  "bn-0253":
    native: "Nothing else."
    notes:
      "n1": "What you say when the shopkeeper asks আর কিছু? (anything else?)."
  "bn-0545":
    native: "I'm just looking."
  "bn-0546":
    native: "How much a kilo?"
    notes:
      "n1": "কত করে (kôto kôre), 'at how much', asks the rate: কত করে ডজন (kôto kôre ḍôjon)? How much a dozen?"
  "bn-0547":
    native: "I'll take this."
  "bn-0548":
    native: "Do you have another colour?"
    bases:
      "আছে": "to be; there is"
  "bn-0549":
    native: "some; something"
  "bn-0550":
    native: "many; a lot"
  "bn-0551":
    native: "a little"
    notes:
      "n1": "Also the softener in any request: একটু দেখুন (ekṭu dekhun), please have a look."
  "bn-0552":
    native: "all; everything"
  "bn-0553":
    native: "only; just"
  "bn-0554":
    native: "enough"
  "bn-0555":
    native: "too much; too many"
    notes:
      "n1": "খুব বেশি দাম (khub beśi dām), the price is too high."
  "bn-0556":
    native: "less; low"
