name: "Culture: Tagore and children's classics"
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
description: "Short lines from songs, poems and stories by Rabindranath Tagore, and from the children's books of Sukumar Ray, Upendrakishore Ray Chowdhury and Abanindranath Tagore, all in the public domain. Each shows who wrote it, when, and where it comes from. Not yet checked by a Bengali speaker: please report any mistake."

cards:
  "bn-5800":
    native: "My golden Bengal, I love you."
    notes:
      "n1": "The first line of the song. The Bengali Wikipedia article says its manuscript has not survived, links it with the Partition of Bengal protests of 1905, and says it was printed in the Sanjibani newspaper on 7 September 1905 under Tagore's name. It is the national anthem of Bangladesh."
  "bn-5801":
    native: "If no one answers your call, then walk alone."
    notes:
      "n1": "The first line of a song on the theme of going on even when nobody helps. The Bengali Wikipedia article says it first appeared in the magazine Bhandar in September 1905 under the title Eka (Alone), and that Mahatma Gandhi was deeply moved by it."
  "bn-5802":
    native: "Victory to you, leader of the minds of all the people, giver of India's destiny!"
    notes:
      "n1": "The first line of a song of five verses, of which only the first is sung as India's national anthem. The Bengali Wikipedia article says it was first sung on 27 December 1911 at the Calcutta session of the Indian National Congress and appeared in January 1912 in the magazine Tattwabodhini Patrika under the title Bharat-Bidhata."
  "bn-5803":
    native: "Where the mind is without fear and the head is held high"
    notes:
      "n1": "The first line of a prayer for India. The Bengali Wikipedia article says it first appeared in Naibedya in July 1901 under the title Prarthana (Prayer), and that Tagore later put it into English himself for the English Gitanjali of 1912. It is often read in schools in India and Bangladesh."
  "bn-5804":
    native: "Clouds roar in the sky, heavy rain."
    notes:
      "n1": "The poem opens in the rainy season. The speaker sits alone on his small field beside the swollen river, with all the rice already cut, and sees a boat coming across with someone singing as he rows."
  "bn-5805":
    native: "I had only two bighas of land, and everything else had gone to debt."
    notes:
      "n1": "A bigha is a unit of land. In this story poem a poor farmer, Upen, tells how the landowner wanted his two bighas to make a garden square, and how he refused to sell the land where seven generations of his family had lived."
  "bn-5806":
    native: "Father, what relation is Mother to you?"
    notes:
      "n1": "Five-year-old Mini, who cannot stop talking, asks her father this in the opening scene, right after telling him what the doorkeeper and a servant boy said. The Bengali Wikipedia article says the story was published in 1892 and tells of an Afghan fruit seller who makes friends with a little Bengali girl."
  "bn-5807":
    native: "Your kitchen work can wait for now; just get the tobacco ready for me, will you."
    notes:
      "n1": "The postmaster, a young man from Calcutta posted to the village of Ulapur, says this to Ratan, the orphan girl who does his housework. She has just told him she must go and light the stove."
  "bn-5808":
    native: "Look, you'll get a beating."
    notes:
      "n1": "Fatik, the leader of the village boys, says this to his younger brother Makhan, who has sat down on the log the boys wanted to roll away. Makhan only moves about a little and settles into his seat more firmly."
  "bn-5809":
    native: "Amit Ray is a barrister."
    notes:
      "n1": "The first sentence of the chapter on Amit's character. The next sentences tell how his English friends turned his surname Ray into Roy or Rey, and how Amit then made up a spelling of his own."
  "bn-5810":
    native: "This earth of ours is full of grain and flowers."
    notes:
      "n1": "The first line of a patriotic song. The Bengali Wikipedia article says Dwijendralal Ray wrote and set it to music in 1905, when the Partition of Bengal began the Swadeshi movement, and lists its release as 1909."
  "bn-5811":
    native: "Here there is no ban, brother; here there are no chains and no barriers."
    notes:
      "n1": "Two lines from the title poem that opens the book. Here, in a land of clouds and rainbows, the poet says he is free to sing whatever comes into his head, whether or not it makes sense. The Bengali Wikipedia article gives 19 September 1923 for the book, nine days after the author's death."
  "bn-5812":
    native: "What a nuisance! Why is the handkerchief meowing?"
    notes:
      "n1": "A boy lies in the shade of a tree on a hot day and finds that his handkerchief has become a fat red cat. The cat says it may be called a cat, a handkerchief or Chandrabindu, as he likes."
  "bn-5813":
    native: "I bow to you, great queen!"
    notes:
      "n1": "The tailorbird says this to the cat, who wants to eat her chicks, bending her head to a branch. The cat is pleased and goes away. The English Wikipedia article calls the book a collection of children's stories about a clever tailorbird, published in 1911."
  "bn-5814":
    native: "A king had two queens, Duo and Suo."
    notes:
      "n1": "The first sentence of the children's story. The king lets Suo live in a seven-storey palace with hundreds of servants, while Duo lives in a broken-down house with one maid. The Bengali Wikipedia article says Abanindranath Tagore wrote it in 1896."
