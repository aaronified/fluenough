schema: 1
id: "bn-en-phonology-consonants"
kind: "layer"
core: "bn-phonology-consonants"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Bengali consonant sounds (IPA)"
description: "The consonant phonemes of Bengali, one card each, with two marginal ones at the end: the IPA symbol, the letters, example words and, where this course's words give one, a minimal pair. For learners who know the IPA or want to learn it. Variety taught: Standard Colloquial Bengali of Kolkata, with a note wherever Bangladeshi Standard (Dhaka) differs. This is a proposal, not yet confirmed by the owner, a Bengali speaker or a phonetician. The only JIPA illustration found, by Khan (2010), describes Bangladeshi Standard, so facts taken from it are marked as that; Wikipedia's page covers both and says where it knows they differ."
license: "CC-BY-SA-4.0"
authors:
  - { name: "Fluenough contributors" }
  - { name: "Wikipedia contributors (Bengali phonology; Help:IPA/Bengali)", url: "https://en.wikipedia.org/wiki/Bengali_phonology" }
source: "Khan (2010), 'Bengali (Bangladeshi Standard)', Illustration of the IPA, Journal of the International Phonetic Association 40(2): 221-225, doi 10.1017/S0025100310000071 (named in Wikipedia's references; the article itself was not read); also as cited by Wikipedia: Ferguson and Chowdhury (1960), Language 36(1): 22-59; Chatterji (1921), Bulletin of the School of Oriental and African Studies 2: 1-25; Masica (1991), The Indo-Aryan Languages, Cambridge University Press; Hayes and Lahiri (1991), Natural Language and Linguistic Theory 9: 47-96; Bhattacharya (2000), Bangla (Bengali). Text adapted from Wikipedia, 'Bengali phonology' and 'Help:IPA/Bengali', CC BY-SA 4.0, https://en.wikipedia.org/wiki/Bengali_phonology"
tags: ["ipa", "phonology", "unreviewed"]
cards:
  "bn-1993":
    native: "voiced bilabial nasal (m); the letter ম (mô)"
    notes:
      "n1": "The m of 'much' in Wikipedia's comparison. Bengali has three nasal consonants in the table: m, n and ŋ."
      "n2": "Minimal pair among this course's words: {1}, mother, and {2}, no; not, differ only in m against n."
    examples:
      "মা": "mother"
      "আম": "mango"
  "bn-1994":
    native: "voiced dental or alveolar nasal (n); the letters ন (nô) and ণ (nô)"
    notes:
      "n1": "Both ন (nô) and ণ (nô) are said n: the help page gives n for both. The nasal table lists n in the dental or alveolar column, and a footnote says [ɳ] can occur in conjuncts with a curled-back stop, where ণ (nô) was the original sound."
      "n2": "Minimal pair among this course's words: {1}, price, and {2}, gift; donation, differ only in m against n."
    examples:
      "না": "no; not"
      "নাম": "name"
  "bn-1995":
    native: "voiced velar nasal (ŋ); the letters ঙ (ṅô) and ং (ôṅ)"
    notes:
      "n1": "The ng of 'sing' in Wikipedia's comparison. It is a phoneme in the table. The letter ং (ôṅ) is said ŋ as well, as in রং (rôṅ)."
      "n2": "Minimal pair among this course's words: {1}, to break, and {2}, fare; rent, differ only in the middle sound, ŋ against ɽ."
    examples:
      "রং": "colour; paint"
      "আঙুর": "grape; grapes"
  "bn-1996":
    native: "voiceless bilabial stop (p), with no puff of breath; the letter প (pô)"
    notes:
      "n1": "Like the p of 'span' in Wikipedia's comparison: no puff of breath. The aspirated pʰ is a separate phoneme."
      "n2": "Minimal pair among this course's words: {1}, or, and {2}, foot; leg, differ only in voice, b against p."
    examples:
      "পা": "foot; leg"
      "পর": "after; other"
  "bn-1997":
    native: "voiceless aspirated bilabial stop (pʰ): p with a puff of breath; the letter ফ (phô)"
    notes:
      "n1": "The source says ফ (phô) is said either as a stop, pʰ, or, commonly, as a fricative, ɸ or f; in loanwords such as ফ্যান (fan) it can be a fricative. Wikipedia's help page lists ɸ as a marginal consonant for ফ (phô)."
      "n2": "Minimal pair among this course's words: {1}, to play, and {2}, to throw; to drop, differ only in the first sound, kʰ against pʰ."
    examples:
      "ফল": "fruit"
      "ফোন": "phone; telephone"
  "bn-1998":
    native: "voiced bilabial stop (b); the letter ব (bô)"
    notes:
      "n1": "The b of 'abash' in Wikipedia's comparison."
      "n2": "Minimal pair among this course's words: {1}, or, and {2}, foot; leg, differ only in voice, b against p."
    examples:
      "বই": "book"
      "বাস": "bus"
  "bn-1999":
    native: "voiced breathy bilabial stop (bʱ); the letter ভ (bhô)"
    notes:
      "n1": "Said either as a breathy stop, bʱ, or much more rarely as a fricative made with both lips or with the lip and teeth; in foreign loans such as ভিসা (visa) the fricative can occur. In the east the breathy series is replaced by tone or loses its breathiness (see the allophones and prosody decks)."
      "n2": "Minimal pair among this course's words: {1}, cooked rice, and {2}, rheumatism, differ only in the breath after the b, bʱ against b."
    examples:
      "ভাত": "cooked rice"
      "ভাই": "brother; younger brother"
  "bn-2000":
    native: "voiceless dental stop (t̪), with no puff of breath; the letters ত (tô) and ৎ (tô)"
    notes:
      "n1": "The tongue tip is on the teeth. A footnote says Bengali contrasts the dental stops t̪ and d̪ with the apical postalveolar ʈ and ɖ, and the aspirated pairs too. Wikipedia's IPA help page notes that dental t and d sound like English t and d to most English speakers, and that some speakers use the dental stops for English th. The table writes plain t; this course writes t̪, as its other Bengali cards do. The help page also gives the letter ৎ (khanda-tô) as this sound."
      "n2": "Minimal pair among this course's words: {1}, please give (me), and {2}, 3, three, differ only in voice, d̪ against t̪."
      "n3": "Minimal pair among this course's words: {1}, shelf, and {2}, bald patch, differ only in the place of the t: on the teeth, or curled back (t̪ against ʈ)."
    examples:
      "তিন": "3, three"
      "কত": "how much; how many"
  "bn-2001":
    native: "voiceless aspirated dental stop (t̪ʰ): t̪ with a puff of breath; the letter থ (thô)"
    notes:
      "n1": "The aspirated dental stop. The source adds that in English loans an educated speaker may use a th-like fricative for থ (thô); the help page compares it to Indian English th in 'thought'."
      "n2": "Minimal pair among this course's words: {1}, large plate, and {2}, rhythm; palmyra palm, differ only in the breath after the t: t̪ʰ against t̪."
    examples:
      "থাল": "large plate"
      "মাথা": "head"
  "bn-2002":
    native: "voiced dental stop (d̪); the letter দ (dô)"
    notes:
      "n1": "The voiced partner of t̪. The help page compares it to the d of 'deal', but dental. Bengali approximates English ð as দ (dô), not as ধ (dhô); educated speakers may say a fricative in English loans."
      "n2": "Minimal pair among this course's words: {1}, please give (me), and {2}, 3, three, differ only in voice, d̪ against t̪."
      "n3": "Minimal pair among this course's words: {1}, gift; donation, and {2}, right (side), differ only in the place of the d: on the teeth, or curled back (d̪ against ɖ)."
    examples:
      "দশ": "ten"
      "দই": "curd; yoghurt"
  "bn-2003":
    native: "voiced breathy dental stop (d̪ʱ); the letter ধ (dhô)"
    notes:
      "n1": "The breathy partner of d̪. The southeast of the Bengali area, where the breathy series is missing, is described in the allophones deck."
      "n2": "Minimal pair among this course's words: {1}, half, and {2}, ginger, differ only in the breath after the d: d̪ʱ against d̪."
    examples:
      "দুধ": "milk"
      "ধরা": "to hold; to catch"
  "bn-2004":
    native: "voiceless retroflex stop (ʈ), with no puff of breath; the letter ট (ṭô)"
    notes:
      "n1": "A footnote says true retroflex (curled-back) consonants are not found in Bengali: they are apical postalveolar in western dialects and fronted to apico-alveolar in others; Mazumdar (1920) is quoted as saying ট (ṭô) and ড (ḍô) sound almost like English T and D. This course writes ʈ and ɖ, as its other Bengali cards do."
      "n2": "Minimal pair among this course's words: {1}, shelf, and {2}, bald patch, differ only in the place of the t: curled back, or on the teeth (ʈ against t̪)."
      "n3": "Minimal pair among this course's words: {1}, hand; arm, and {2}, open-air market (on fixed days), differ only in the place of the last consonant: on the teeth, or curled back."
    examples:
      "আট": "8, eight"
      "টাকা": "rupee; money"
  "bn-2005":
    native: "voiceless aspirated retroflex stop (ʈʰ): ʈ with a puff of breath; the letter ঠ (ṭhô)"
    notes:
      "n1": "The aspirated partner of ʈ. In Mymensingh, Sylhet and Chittagong and nearby areas the retroflexes are said alveolar and lose their aspiration."
      "n2": "Minimal pair among this course's words: {1}, to get up; to rise, and {2}, that (over there), differ only in the breath after the ʈ: ʈʰ against ʈ."
    examples:
      "ঠিক": "right; correct; exact"
      "মাঠ": "field; open ground"
  "bn-2006":
    native: "voiced retroflex stop (ɖ); the letter ড (ḍô)"
    notes:
      "n1": "The voiced partner of ʈ, with the same note on the place of the tongue tip. It is said ɽ, not ɖ, away from the start of a word: see the ɽ card."
      "n2": "Minimal pair among this course's words: {1}, gift; donation, and {2}, right (side), differ only in the place of the d: on the teeth, or curled back (d̪ against ɖ)."
    examples:
      "ডিম": "egg"
      "ডাল": "lentils; dal"
  "bn-2007":
    native: "voiced breathy retroflex stop (ɖʱ); the letter ঢ (ḍhô)"
    notes:
      "n1": "The breathy partner of ɖ. The help page compares it to the 'dh' of American 'birdhouse'. Away from the start of a word it is said ɽ (see the ɽ card)."
      "n2": "Minimal pair among this course's words: {1}, dhak (a big drum), and {2}, call; post (mail), differ only in the breath after the ɖ: ɖʱ against ɖ."
    examples:
      "ঢালা": "to pour"
      "ঢাক": "dhak (a big drum)"
  "bn-2008":
    native: "voiceless postalveolar affricate (tʃ); the letter চ (cô)"
    notes:
      "n1": "The tch of 'catch' in Wikipedia's comparison, with no puff of breath. A footnote says the affricates can be said alveolo-palatal, tɕ, instead."
      "n2": "Minimal pair among this course's words: {1}, uncooked rice, and {2}, net, differ only in voice, tʃ against dʒ."
      "n3": "Minimal pair among this course's words: {1}, uncooked rice, and {2}, bark (of a tree), differ only in the breath after the tʃ: tʃ against tʃʰ."
    examples:
      "চা": "tea"
      "চার": "4, four"
  "bn-2009":
    native: "voiceless aspirated postalveolar affricate (tʃʰ): tʃ with a puff of breath; the letter ছ (chô)"
    notes:
      "n1": "The ch of 'choose' in Wikipedia's comparison. The source adds that some loanwords that had s now have tʃʰ in Standard Bengali, such as পছন্দ (pôchondo, from Persian pasand)."
      "n2": "Minimal pair among this course's words: {1}, bark (of a tree), and {2}, uncooked rice, differ only in the breath after the tʃ: tʃʰ against tʃ."
    examples:
      "ছয়": "6, six"
      "মাছ": "fish"
  "bn-2010":
    native: "voiced postalveolar affricate (dʒ); the letters জ (jô) and য (jô)"
    notes:
      "n1": "Both জ (jô) and য (jô) are dʒ in native words, as the help page says; in foreign words they can stand for z (see the z card). The help page compares it to the dg of 'hedge'."
      "n2": "Minimal pair among this course's words: {1}, net, and {2}, uncooked rice, differ only in voice, dʒ against tʃ."
      "n3": "Minimal pair among this course's words: {1}, spicy (hot), and {2}, net, differ only in the breath after the dʒ: dʒʱ against dʒ."
    examples:
      "জল": "water"
      "আজ": "today"
  "bn-2011":
    native: "voiced breathy postalveolar affricate (dʒʱ); the letter ঝ (jhô)"
    notes:
      "n1": "The breathy partner of dʒ. In the far east it is often said as a fricative instead."
      "n2": "Minimal pair among this course's words: {1}, spicy (hot), and {2}, net, differ only in the breath after the dʒ: dʒʱ against dʒ."
    examples:
      "ঝাল": "spicy (hot)"
      "বোঝা": "to understand"
  "bn-2012":
    native: "voiceless velar stop (k), with no puff of breath; the letter ক (kô)"
    notes:
      "n1": "Like the k of 'scan' in Wikipedia's comparison: no puff of breath."
      "n2": "Minimal pair among this course's words: {1}, cheek, and {2}, tomorrow; yesterday, differ only in voice, g against k."
      "n3": "Minimal pair among this course's words: {1}, canal, and {2}, tomorrow; yesterday, differ only in the breath after the k: kʰ against k."
    examples:
      "এক": "one"
      "কত": "how much; how many"
  "bn-2013":
    native: "voiceless aspirated velar stop (kʰ): k with a puff of breath; the letters খ (khô) and ক্ষ (kkhô)"
    notes:
      "n1": "The help page gives both খ (khô) and the conjunct ক্ষ (kkhô) as kʰ, with the example ক্ষমা (kkhômā); this course's own cards read ক্ষ (kkhô) as a long kkʰ, as in শিক্ষক (śikkhok), so the sources and the course differ on ক্ষ (kkhô)."
      "n2": "Minimal pair among this course's words: {1}, canal, and {2}, tomorrow; yesterday, differ only in the breath after the k: kʰ against k."
    examples:
      "খাল": "canal"
      "এখন": "now"
  "bn-2014":
    native: "voiced velar stop (ɡ); the letter গ (gô)"
    notes:
      "n1": "The g of 'agate' in Wikipedia's comparison."
      "n2": "Minimal pair among this course's words: {1}, cheek, and {2}, tomorrow; yesterday, differ only in voice, g against k."
    examples:
      "গলা": "throat; neck"
      "আগে": "before"
  "bn-2015":
    native: "voiced breathy velar stop (ɡʱ); the letter ঘ (ghô)"
    notes:
      "n1": "The breathy partner of ɡ. The source says it stays stable across the dialects that keep aspiration; a very few speakers say it as an affricate, which it calls extremely rare."
      "n2": "Minimal pair among this course's words: {1}, ghee, and {2}, what, differ only in the first sound, ɡʱ against k."
    examples:
      "ঘর": "room"
      "ঘি": "ghee"
  "bn-2016":
    native: "voiceless alveolar sibilant (s), for many speakers"
    notes:
      "n1": "The source says s is a phoneme for many speakers of Standard Bengali, as in স্কুল (skul) and আস্তে (āste), softly, which differs from আসতে (āśte), to come, said with ʃ. For some speakers, especially in Rajshahi and Western Bengali, স (śô) and শ (śô) are the same sound. This course's readings write ś where স (śô) is said sh and s where it is said s, as in স্কুল (skul)."
    examples:
      "স্কুল": "school"
      "আস্তে": "softly; gently"
  "bn-2017":
    native: "voiceless postalveolar fricative (ʃ); the letters শ (śô), ষ (śô) and স (śô)"
    notes:
      "n1": "The sh of 'shoe' in Wikipedia's comparison. The help page gives all three letters শ (śô), ষ (śô) and স (śô) as ʃ. A footnote says that for some speakers s can be an allophone of ʃ or tʃʰ."
      "n2": "Minimal pair among this course's words: {1}, hand; arm, and {2}, 7, seven, differ only in the first sound, ɦ against ʃ."
    examples:
      "শহর": "city"
      "দশ": "ten"
  "bn-2018":
    native: "voiced glottal fricative (ɦ); the letters হ (hô) and ঃ (ôh)"
    notes:
      "n1": "A footnote says ɦ is said h at the start or end of a word and ɦ between vowels. The help page gives the letters হ (hô) and ঃ (the visarga) for it."
      "n2": "Minimal pair among this course's words: {1}, hand; arm, and {2}, 7, seven, differ only in the first sound, ɦ against ʃ."
    examples:
      "হাত": "hand; arm"
      "শহর": "city"
  "bn-2019":
    native: "voiced lateral approximant (l); the letter ল (lô)"
    notes:
      "n1": "The l of 'leaf' in Wikipedia's comparison."
      "n2": "Minimal pair among this course's words: {1}, uncooked rice, and {2}, 4, four, differ only in the last sound, l against r."
    examples:
      "তাল": "rhythm; palmyra palm"
      "জল": "water"
  "bn-2020":
    native: "alveolar rhotic (r), usually a tap; the letter র (rô)"
    notes:
      "n1": "Usually an alveolar tap, ɾ; it can also be an approximant, ɹ, especially in the east and before consonants, and very rarely a trill. The table writes r."
      "n2": "Minimal pair among this course's words: {1}, uncooked rice, and {2}, 4, four, differ only in the last sound, l against r."
    examples:
      "ঘর": "room"
      "পর": "after; other"
  "bn-2021":
    native: "voiced retroflex flap (ɽ); the letters ড় (ṛô) and ঢ় (ṛô)"
    notes:
      "n1": "The source says ɽ began as the sound of ɖ away from the start of a word, and that loanwords with ɖ made it a phoneme. In Dhaka Standard it is said as ɾ or ɹ like r, so that পড়া (pôṛā) and পরা (pôrā) can be homophones there; in the far west the two stay distinct."
      "n2": "Minimal pair among this course's words: {1}, necklace, and {2}, bone, differ only in the last sound, r against ɽ."
      "n3": "Minimal pair among this course's words: {1}, to wear, and {2}, to read; to fall, differ only in the middle sound, r against ɽ."
    examples:
      "পড়া": "to read; to fall"
      "ঘোড়া": "horse"
  "bn-2022":
    native: "voiced retroflex nasal (ɳ), marginal; the letter ণ (ṇô)"
    notes:
      "n1": "A footnote says ɳ may occur as an allophone of n in conjuncts with curled-back stops, as the original sound of ণ (nô); in other words ণ (nô) is said n. So ɳ is marked marginal in the table."
      "n2": "The example word ঘণ্টা (ghônṭā, hour) has the conjunct ণ্ট (nṭ), where the source allows ɳ; this course's IPA for it writes n."
    examples:
      "ঘণ্টা": "hour"
  "bn-2023":
    native: "voiced alveolar sibilant (z), marginal: in loans only"
    notes:
      "n1": "The letters জ (jô) and য (jô) may stand for z in foreign words and names, such as জাকাত (zakat) and আজিজ (Aziz). Most foreign words with z take dʒ instead, as in namaz and 'design', and some words that had z are now said with dʒ, as সবজি (śôbji, vegetable) from Persian sabzi."
    examples:
      "সবজি": "vegetable; vegetables"
