schema: 1
id: "bn-en-time"
kind: "layer"
core: "bn-time"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Time and days"
description: "Today and tomorrow, the parts of the day, telling the time, and the days of the week."
license: "CC-BY-SA-4.0"
tags: ["beginner"]
cards:
  "bn-0315":
    native: "today"
  "bn-0316":
    native: "tomorrow; yesterday"
    notes:
      "n1": "One word for both; the verb's tense says which. গতকাল (gôtokāl) is only yesterday, আগামীকাল (āgāmikāl) only tomorrow."
  "bn-0317":
    native: "now"
  "bn-0318":
    native: "morning"
  "bn-0319":
    native: "afternoon"
    notes:
      "n1": "Bengali divides the day finely: ভোর (bhor, dawn), সকাল (śôkāl), দুপুর (dupur, midday), বিকেল (bikel), সন্ধ্যা (evening), রাত (night). Also বিকাল (bikāl)."
  "bn-0320":
    native: "evening"
    notes:
      "n1": "Often said সন্ধে (śôndhe)."
  "bn-0321":
    native: "night"
  "bn-0322":
    native: "o'clock (it strikes)"
    notes:
      "n1": "চারটে বাজে (cārṭe bāje), it's four o'clock. The number takes -টা (-ṭā): একটা (ekoṭā), পাঁচটা (pām̐coṭā), ছটা (chôṭā). Two, three and four are different: দুটো (duṭo), তিনটে (tinoṭe), চারটে (cāroṭe), and so is half past two, আড়াইটে (āṛāiṭe). Also with -টা (-ṭā) for every number: দুইটা (duiṭā), তিনটা (tinoṭā), চারটা বাজে (cāroṭā bāje)."
  "bn-0323":
    native: "half past; and a half"
    notes:
      "n1": "সাড়ে চারটে (śāṛe cāroṭe), half past four. Half past one and half past two are দেড়টা (deṛṭā) and আড়াইটে (āṛāiṭe), also আড়াইটা (āṛāiṭā)."
  "bn-0324":
    native: "What time is it?"
    notes:
      "n1": "Also কয়টা বাজে? (koyta baje?)"
  "bn-0325":
    native: "day"
  "bn-0326":
    native: "week"
    notes:
      "n1": "Also হপ্তা (hôptā), in everyday speech."
  "bn-0327":
    native: "Monday"
    notes:
      "n1": "Each day ends in বার (bār). Most names match Hindi's, but for Thursday Hindi usually says गुरुवार (guruvār) where Bengali says বৃহস্পতিবার (brihośpotibār)."
  "bn-0328":
    native: "Tuesday"
  "bn-0329":
    native: "Wednesday"
  "bn-0330":
    native: "Thursday"
    notes:
      "n1": "In speech often বিষ্যুদবার (bishshudbar)."
  "bn-0331":
    native: "Friday"
  "bn-0332":
    native: "Saturday"
  "bn-0333":
    native: "Sunday"
  "bn-0645":
    native: "midday; early afternoon"
  "bn-0646":
    native: "dawn; early morning"
  "bn-0647":
    native: "a quarter past"
    notes:
      "n1": "সোয়া তিনটে (śoyā tinoṭe), a quarter past three, also সোয়া তিনটা (śoyā tinoṭā)."
  "bn-0648":
    native: "a quarter to"
    notes:
      "n1": "পৌনে চারটে (poune cāroṭe), a quarter to four: 'four, less a quarter'. Also পৌনে চারটা (poune cāroṭā)."
  "bn-0649":
    native: "At what time?"
    notes:
      "n1": "-টায় (-ṭāy) is 'at' with a time: সাতটায় (sātoṭāy), at seven; দুটোয় (duṭoy), at two. Also কয়টায়? (koytay?)"
  "bn-0650":
    native: "yesterday"
  "bn-0651":
    native: "tomorrow"
  "bn-0652":
    native: "the day after tomorrow; the day before yesterday"
    notes:
      "n1": "Like কাল (kāl), one word for both; the verb's tense says which."
  "bn-0653":
    native: "last week"
    bases:
      "গত": "last; past"
  "bn-0654":
    native: "next week"
  "bn-0655":
    native: "hour"
    notes:
      "n1": "এক ঘণ্টা (ek ghônṭā), an hour; আধ ঘণ্টা (ādh ghônṭā), half an hour."
  "bn-0656":
    native: "minute"
