schema: 1
id: "bn-en-script-conjuncts"
kind: "layer"
core: "bn-script-conjuncts"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Bengali conjuncts"
description: "Two consonants with no vowel between them are written joined. These are the ones a beginner meets first, each in an everyday word. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "bn-0081":
    native: "k + murdhonno sho, said kh"
    notes:
      "n1": "Looks nothing like its parts. It is said 'kh' at the start of a word and 'kkh' inside one: ক্ষমা (khômā, forgiveness), পক্ষ (pôkkho, side)."
    "examples": {
      "কতক্ষণ লাগবে?": {"native": "How long will it take?", "bases": {"কতক্ষণ": "how long", "লাগবে": "to feel; to be needed; to take (of time)"}}
    }
  "bn-0082":
    native: "j + ny, said gy"
    notes:
      "n1": "Looks nothing like its parts. At the start of a word it is said 'g' and turns the vowel after it into the 'a' of 'cat': জ্ঞান (gyan, knowledge). Inside a word it is 'gg': বিজ্ঞান (biggān, science)."
    "examples": {
      "কৃতজ্ঞ থাকো।": {"native": "Stay grateful. (familiar)", "bases": {}},
      "বিজ্ঞাপনটা ভালো।": {"native": "The advertisement is good.", "bases": {"বিজ্ঞাপনটা": "advertisement"}}
    }
  "bn-0083":
    native: "k + t"
    notes:
      "n1": "ক (kô) and ত (tô) joined: রক্ত (rôkto, blood)."
    "examples": {
      "কীটনাশকটা বিষাক্ত।": {"native": "The pesticide is poisonous.", "bases": {"কীটনাশকটা": "pesticide", "বিষাক্ত": "poisonous"}},
      "যুক্তিটা বুঝেছি।": {"native": "I understand the reason.", "bases": {"যুক্তিটা": "reason", "বুঝেছি": "understood"}}
    }
  "bn-0084":
    native: "k + the r-sign"
    notes:
      "n1": "A র (rô) after a consonant is written as a stroke below it, the r-sign (র-ফলা): ক্রিকেট (krikeṭ, cricket)."
    "examples": {
      "মাইক্রোওয়েভটা নতুন।": {"native": "The microwave is new.", "bases": {"মাইক্রোওয়েভটা": "microwave"}},
      "কোম্পানিটা খুব সক্রিয়।": {"native": "The company is very active.", "bases": {"কোম্পানিটা": "the company"}}
    }
  "bn-0085":
    native: "p + the r-sign"
    notes:
      "n1": "The r-sign below প (pô): প্রেম (prem, love)."
    "examples": {
      "প্রতিভাবান শিল্পী।": {"native": "A talented artist.", "bases": {"প্রতিভাবান": "talented"}},
      "প্রতিশ্রুতি দাও।": {"native": "Make a promise. (familiar)", "bases": {}}
    }
  "bn-0086":
    native: "t + the r-sign"
    notes:
      "n1": "The r-sign below ত (tô): ছাত্র (chātro, student)."
    "examples": {
      "চিত্রনাট্যটা ভালো।": {"native": "The screenplay is good.", "bases": {"চিত্রনাট্যটা": "screenplay"}},
      "তাপমাত্রা কমছে।": {"native": "The temperature is falling.", "bases": {}}
    }
  "bn-0087":
    native: "the r-hook + m"
    notes:
      "n1": "A র (rô) before another consonant is written as a small hook on top of it, the reph (রেফ): ধর্ম (dhôrmo, religion)."
    "examples": {
      "ইউনিফর্ম পরো।": {"native": "Wear the uniform.", "bases": {}},
      "কর্মকর্তা আসবেন।": {"native": "The officer will come.", "bases": {}}
    }
  "bn-0088":
    native: "n + t"
    notes:
      "n1": "ন (nô) and ত (tô) joined: শান্ত (śānto, calm)."
    "examples": {
      "আমি সন্তুষ্ট।": {"native": "I am satisfied.", "bases": {}},
      "গন্তব্য কোথায়?": {"native": "Where is the destination?", "bases": {}}
    }
  "bn-0089":
    native: "n + d"
    notes:
      "n1": "ন (nô) and দ (dô) joined: সুন্দর (śundor, beautiful)."
    "examples": {
      "কাহিনিটা সুন্দর।": {"native": "The story is beautiful.", "bases": {"কাহিনিটা": "story; plot"}}
    }
  "bn-0090":
    native: "s + t"
    notes:
      "n1": "Here স (śô) is said 's', not 'sh': আস্তে (āste, slowly)."
    "examples": {
      "বাস্তুতন্ত্র বদলাচ্ছে।": {"native": "The ecosystem is changing.", "bases": {"বদলাচ্ছে": "changing"}}
    }
  "bn-0091":
    native: "s + th"
    notes:
      "n1": "স (śô) and থ (thô) joined, with স (śô) said 's': স্থান (sthān, place)."
    "examples": {
      "উপস্থিতি জরুরি।": {"native": "Attendance is important.", "bases": {}},
      "কর্মসংস্থান বাড়ছে।": {"native": "Employment is growing.", "bases": {"বাড়ছে": "growing"}}
    }
  "bn-0092":
    native: "talobbo sho + the r-sign, said sr"
    notes:
      "n1": "The r-sign below শ (śô). Before র (rô), শ (śô) is said 's': শ্রম (srôm, labour)."
    "examples": {
      "শ্রমশক্তি বাড়ছে।": {"native": "The workforce is growing.", "bases": {"বাড়ছে": "growing"}}
    }
  "bn-0093":
    native: "murdhonno sho + curled-back t"
    notes:
      "n1": "ষ (śô) and ট (ṭô) joined: কষ্ট (kôśṭo, hardship)."
    "examples": {
      "একাকীত্ব কষ্টের।": {"native": "Loneliness is painful.", "bases": {"কষ্টের": "painful"}},
      "বৃষ্টিপাত বাড়ছে।": {"native": "Rainfall is increasing.", "bases": {"বাড়ছে": "increasing"}}
    }
  "bn-0094":
    native: "ng + g"
    notes:
      "n1": "ঙ (ṅô) and গ (gô) joined: সঙ্গে (śôṅge, with)."
    "examples": {
      "ভ্রমণসঙ্গীরা এসেছে।": {"native": "The travel companions have come.", "bases": {"ভ্রমণসঙ্গীরা": "travel companions"}},
      "আমরা একসঙ্গে খাই।": {"native": "We eat together.", "bases": {}}
    }
  "bn-0095":
    native: "ny + ch, said nch"
    notes:
      "n1": "ঞ (ñô) and চ (cô) joined, said 'nch': পঞ্চাশ (pôncāś, fifty)."
    "examples": {
      "মঞ্চটা বড়।": {"native": "The stage is big.", "bases": {"মঞ্চটা": "stage"}},
      "কর্মীরা লাঞ্চে গেছে।": {"native": "The staff have gone to lunch.", "bases": {"কর্মীরা": "staff member", "লাঞ্চে": "at lunch"}}
    }
  "bn-0096":
    native: "n + n"
    notes:
      "n1": "Two ন (nô) joined: কান্না (kānnā, crying). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "অনেক প্রজাতি বিপন্ন।": {"native": "Many species are endangered.", "bases": {}},
      "কাজটা সম্পন্ন হলো।": {"native": "The work was completed.", "bases": {"সম্পন্ন": "complete"}}
    }
  "bn-0097":
    native: "t + t"
    notes:
      "n1": "Two ত (tô) joined: উত্তর (uttor, answer; north). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "জীবনবৃত্তান্তটা ভালো।": {"native": "The CV is good.", "bases": {}},
      "বাচ্চারা উত্তেজিত।": {"native": "The children are excited.", "bases": {"বাচ্চারা": "children"}}
    }
  "bn-0098":
    native: "d + dh"
    notes:
      "n1": "দ (dô) and ধ (dhô) joined: যুদ্ধ (juddho, war). Said on its own, a doubled consonant sounds like the single one, so it is drilled by reading and writing only."
    "examples": {
      "বুদ্ধি খাটাও।": {"native": "Use your intelligence. (familiar)", "bases": {"খাটাও": "use"}},
      "সিদ্ধান্তটা ঠিক।": {"native": "The decision is right.", "bases": {"সিদ্ধান্তটা": "decision", "ঠিক": "right"}}
    }
  "bn-0099":
    native: "l + p"
    notes:
      "n1": "ল (lô) and প (pô) joined: গল্প (gôlpo, story)."
    "examples": {
      "পরিকল্পনাটা ভালো।": {"native": "The plan is good.", "bases": {"পরিকল্পনাটা": "plan"}},
      "শিল্প বাড়ছে।": {"native": "Industry is growing.", "bases": {"বাড়ছে": "growing"}}
    }
  "bn-0100":
    native: "s + the b-sign, said sh"
    notes:
      "n1": "A ব (bô) after a consonant is written as the b-sign (ব-ফলা). It is not said after the first letter of a word: স্বামী (śāmi, husband). Inside a word it doubles the consonant: বিশ্ব (bishsho, world)."
    "examples": {
      "এখানে স্বাক্ষর করুন।": {"native": "Please sign here.", "bases": {}}
    }
  "bn-0101":
    native: "b + the y-sign"
    notes:
      "n1": "A য (jô) after a consonant is written as the y-sign (য-ফলা). At the start of a word it turns the vowel into the 'a' of 'cat': ব্যাংক (bêṅk, bank)."
  "bn-0391":
    native: "s + t + the r-sign"
    notes:
      "n1": "Three consonants in one shape: স্ত্রী (stri, wife)."
    "examples": {
      "মা জামা ইস্ত্রি করেন।": {"native": "Mother irons the shirt. (respectful)", "bases": {"ইস্ত্রি": "ironing"}},
      "সৈন্যদের অস্ত্র ভারী ছিল।": {"native": "The soldiers' weapons were heavy.", "bases": {"সৈন্যদের": "soldiers'", "ছিল": "were"}}
    }
  "bn-0392":
    native: "t + the m-sign, said tt"
    notes:
      "n1": "After a consonant ম (mô) can be written as a sign (ম-ফলা) that is not said itself and only doubles the consonant before it: আত্মীয় (āttiyo, relative), পদ্ম (pôddo, lotus). Said on its own it sounds like ত্ত (ttô), so it is drilled by reading and writing only."
    "examples": {
      "আত্মজীবনীটা পড়ো।": {"native": "Read the autobiography. (familiar)", "bases": {"আত্মজীবনীটা": "autobiography"}},
      "তার আত্মবিশ্বাস বেশি।": {"native": "He has a lot of self-confidence.", "bases": {}}
    }
  "bn-0393":
    native: "m + b"
    notes:
      "n1": "ম (mô) and ব (bô) joined: লম্বা (lômbā, tall)."
    "examples": {
      "অ্যাম্বুলেন্স এসেছে।": {"native": "The ambulance has come.", "bases": {}},
      "বিলম্ব হলো।": {"native": "There has been a delay.", "bases": {}}
    }
  "bn-0394":
    native: "ng + k"
    notes:
      "n1": "ঙ (ṅô) and ক (kô) joined: অঙ্ক (ôṅko, sum; maths)."
    "examples": {
      "অঙ্ক কষো।": {"native": "Do the maths sum.", "bases": {}},
      "অঙ্কনের ক্লাস আছে।": {"native": "There is a drawing class.", "bases": {"অঙ্কনের": "drawing", "আছে": "there is"}}
    }
