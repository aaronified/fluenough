id: "bn-en-multiword-idiomatic"
kind: "layer"
core: "bn-multiword-idiomatic"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word verbs: idioms of body and mind"
description: "Twenty Bengali verb phrases whose meaning is more than the sum of their parts: to pay attention, to get caught, to rack one's brains, to listen closely, to be about to leave, to lend a hand, to speak up, to meddle, to keep watch, to ruin, to heed, to glare, to submit, to sulk, to hold back, to feel sad, to prick up one's ears, to beg, to steel oneself, to encourage. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "bn-6200":
    native: "to pay attention; to give one's mind"
    notes:
      "u1": "মন (môn), mind, with দেওয়া (deoyā), to give: to give one's mind to a task and concentrate on it; it can also mean to give one's heart to someone, to fall in love. Said to urge someone to focus, for example on studying. Attested on bn.wiktionary, page মন দেওয়া."
  "bn-6201":
    native: "to get caught"
    notes:
      "u1": "ধরা (dhôrā), to catch, with পড়া (pôṛā), to fall: to be caught, as a thief is by the police or a fish in a net. Said of someone caught in the act or found out. Attested on bn.wiktionary, page ধরা পড়া."
  "bn-6202":
    native: "to rack one's brains; to fret"
    notes:
      "u1": "মাথা (māthā), head, with ঘামানো (ghāmāno), to make sweat: to strain one's mind over a matter, often needlessly. Said to tell someone not to worry about something that does not need it. Attested on bn.wiktionary, page মাথা ঘামানো."
    bases:
      "ঘামানো": { meaning: "to make sweat" }
  "bn-6203":
    native: "to listen closely; to eavesdrop"
    notes:
      "u1": "কান (kān), ear, with পাতা (pātā), to lay out: to set one's ear to something, that is, to listen attentively or to listen in secretly. Said of someone straining to hear. Attested on bn.wiktionary, page কান পাতা."
    bases:
      "পাতা": { meaning: "to spread; to lay out" }
  "bn-6204":
    native: "to be about to leave; to step forward"
    notes:
      "u1": "পা (pā), foot, with বাড়ানো (bāṛāno), to stretch out: to be on the point of going, with one foot already moving. Said of someone ready to leave at a word. Attested on bn.wiktionary, page পা বাড়ানো."
    bases:
      "বাড়ানো": { meaning: "to stretch out; to extend" }
  "bn-6205":
    native: "to set one's hand to; to start work on"
    notes:
      "u1": "হাত (hāt), hand, with লাগানো (lāgāno), to apply: to set one's hand to a job, that is, to begin working on it or to join in. Said when someone starts or joins a task. Attested on bn.wiktionary, page হাত লাগানো."
    bases:
      "লাগানো": { meaning: "to apply; to set" }
  "bn-6206":
    native: "to speak up; to protest"
    notes:
      "u1": "মুখ (mukh), mouth, with খোলা (kholā), to open: to break a silence and begin to protest. Said of people who stayed quiet for a time and now speak out against something wrong. Attested on bn.wiktionary, page মুখ খোলা."
  "bn-6207":
    native: "to meddle; to poke one's nose in"
    notes:
      "u1": "নাক (nāk), nose, with গলানো (golāno), to push through: to meddle in what is not one's business. Said with disapproval of someone who interferes in another person's affairs. Attested on bn.wiktionary, page নাক গলানো."
    bases:
      "গলানো": { meaning: "to push through" }
  "bn-6208":
    native: "to keep an eye on; to watch"
    notes:
      "u1": "চোখ (chokh), eye, with রাখা (rākhā), to keep: to keep a careful watch on someone or something. Said of keeping guard or tracking movements. Attested on bn.wiktionary, page চোখ রাখা."
  "bn-6209":
    native: "to ruin; to spoil"
    notes:
      "u1": "মাথা (māthā), head, with খাওয়া (khāoyā), to eat: to spoil or ruin someone, an idiom. The page's examples use it as an urgent plea, as in a spoken appeal to a loved one. Heard in family talk. Attested on bn.wiktionary, page মাথা খাওয়া."
  "bn-6210":
    native: "to listen; to heed"
    notes:
      "u1": "কান (kān), ear, with দেওয়া (deoyā), to give: to lend an ear, that is, to listen, or to take notice of what is said. Said of paying heed to advice or to a sound. Attested on bn.wiktionary, page কান দেওয়া."
  "bn-6211":
    native: "to glare angrily"
    notes:
      "u1": "চোখ (chokh), eye, with রাঙানো (rāṅāno), to redden: to glare at someone in anger, as if the eyes turned red. Said of a threatening look. Attested on bn.wiktionary, page চোখ রাঙানো."
    bases:
      "রাঙানো": { meaning: "to redden" }
  "bn-6212":
    native: "to bow to; to submit"
    notes:
      "u1": "মাথা (māthā), head, with নোয়ানো (noyāno), to bend: to bow the head, that is, to yield or accept another's authority. Said of someone who gives in. Attested on bn.wiktionary, page মাথা নোয়ানো."
    bases:
      "নোয়ানো": { meaning: "to bend; to bow" }
  "bn-6213":
    native: "to sulk; to look sullen"
    notes:
      "u1": "মুখ (mukh), face, ভার (bhār), heavy, with করা (kôrā), to do: to make a long face, that is, to sulk in a huff. Said of someone offended who does not say so. Attested on bn.wiktionary, page মুখ ভার করা."
    bases:
      "ভার": { meaning: "heavy" }
  "bn-6214":
    native: "to hold back; to stay out"
    notes:
      "u1": "হাত (hāt), hand, with গুটানো (guṭāno), to draw in: to pull one's hands back, that is, to stop or to keep out of a matter. Said of someone who will not get involved. Attested on bn.wiktionary, page হাত গুটানো."
    bases:
      "গুটানো": { meaning: "to fold up; to draw in" }
  "bn-6215":
    native: "to feel sad; to be upset"
    notes:
      "u1": "মন (môn), mind, খারাপ (khārāp), bad, with করা (kôrā), to do: to feel low or sad, for example over a poor exam result. Said of an unhappy mood. Attested on bn.wiktionary, page মন খারাপ করা."
  "bn-6216":
    native: "to prick up one's ears; to be alert"
    notes:
      "u1": "কান (kān), ear, খাড়া (khāṛā), upright, with করা (kôrā), to do: to stand the ears up, that is, to become alert. The page notes it is a saying spread by word of mouth. Said of listening out for something. Attested on bn.wiktionary, page কান খাড়া করা."
    bases:
      "খাড়া": { meaning: "upright; erect" }
  "bn-6217":
    native: "to beg; to ask for money"
    notes:
      "u1": "হাত (hāt), hand, with পাতা (pātā), to spread out: to hold out a hand, that is, to beg or to ask for a favour. The page also lists taking a bribe. Said of asking others for money. Attested on bn.wiktionary, page হাত পাতা."
    bases:
      "পাতা": { meaning: "to spread; to lay out" }
  "bn-6218":
    native: "to steel oneself; to hope"
    notes:
      "u1": "বুক (buk), chest, with বাঁধা (bām̐dhā), to tie: to brace oneself, that is, to stay firm in trouble, or to hope for something. Said to urge patience in hard times. Attested on bn.wiktionary, page বুক বাঁধা."
    bases:
      "বাঁধা": { meaning: "to tie" }
  "bn-6219":
    native: "to encourage; to pat on the back"
    notes:
      "u1": "পিঠ (piṭh), back, with চাপড়ানো (cāpôṛāno), to pat: to encourage someone with praise, as if patting them on the back. Said when giving a person heart. Attested on bn.wiktionary, page পিঠ চাপড়ানো."
    bases:
      "চাপড়ানো": { meaning: "to pat" }
