schema: 1
id: "bn-en-body"
kind: "layer"
core: "bn-body"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The body"
description: "The parts of the face and body, from the forehead to the heel, with the head, hands and feet and the words for pain, fever and the doctor. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-1002":
    native: "face; mouth"
    wiktionary: true
    notes:
      "n1": "It means both the face and the mouth: {1}, to wash one's face; {2}, to open one's mouth."
    "examples": {
      "মুখ ধোয়া": {"native": "to wash one's face", "bases": {"মুখ": "face; mouth"}},
      "মুখ পোঁছো।": {"native": "Wipe your face. (familiar)", "bases": {"পোঁছো": "to wipe", "মুখ": "face; mouth"}}
    }
  "bn-1003":
    native: "nose"
    wiktionary: true
    notes:
      "n1": "{1}, 'the nose calls', is to snore."
  "bn-1004":
    native: "ear"
    wiktionary: true
    notes:
      "n1": "The formal word, used in writing and in names, is {1}."
    "examples": {
      "হেডফোন কানে লাগাও।": {"native": "Put the headphones on your ears. (familiar)", "bases": {"লাগাও": "put on", "কানে": "ear"}},
      "বাজনার শব্দে কান ভরে গেল।": {"native": "The sound of the band filled the ears.", "bases": {"কান": "ear"}}
    }
  "bn-1005":
    native: "hair (on the head)"
    wiktionary: true
    notes:
      "n1": "It is singular in form but means all the hair: {1}, to have a haircut. Hair on the body is {2}."
    "examples": {
      "আমি চুল ছাঁটি।": {"native": "I trim my hair.", "bases": {"ছাঁটি": "trim (I trim)", "চুল": "hair (on the head)"}},
      "ওর চুল কোঁকড়া।": {"native": "Her hair is curly.", "bases": {"ওর": "his; her"}}
    }
  "bn-1006":
    native: "lip"
    wiktionary: true
    notes:
      "n1": "It also means a bird's beak."
  "bn-1007":
    native: "tongue"
    wiktionary: true
    notes:
      "n1": "The formal word is {1}."
    "examples": {
      "ডাক্তার আমার জিভ দেখেন।": {"native": "The doctor looks at my tongue.", "bases": {}}
    }
  "bn-1008":
    native: "cheek"
    wiktionary: true
    notes:
      "pair": "Not {1}, canal: {2} has no puff of breath after the first sound."
      "n2": "The same word also means abuse: {1}, to abuse someone."
    "examples": {
      "তোমার গালটা গোলগাল।": {"native": "Your cheek is round and plump.", "bases": {"গালটা": "cheek"}},
      "তার গালে একটা দাগ আছে।": {"native": "He has a mark on his cheek.", "bases": {"গালে": "cheek"}}
    }
  "bn-1009":
    native: "forehead"
    wiktionary: true
    notes:
      "n1": "It also means fate, the luck that is thought to be written on the forehead."
    "examples": {
      "কপালে চন্দনের টিপ।": {"native": "A sandalwood mark on the forehead.", "bases": {"টিপ": "mark", "চন্দনের": "sandalwood paste", "কপালে": "forehead"}}
    }
  "bn-1010":
    native: "eyebrow"
    wiktionary: true
    notes:
      "n1": "{1} is to frown."
  "bn-1011":
    native: "neck (the back of it)"
    wiktionary: true
    notes:
      "n1": "It is the back of the neck. The front is part of the {1}, throat."
      "pair": "Only the last sound differs: {1} is the back of the neck and {2} a ghat, the steps down to the water."
  "bn-1012":
    native: "shoulder"
    wiktionary: true
    notes:
      "n1": "From Sanskrit {1}; its first two sounds dropped out, and the formal word is still {1}."
    "examples": {
      "তার কাঁধ চওড়া।": {"native": "His shoulders are broad.", "bases": {}}
    }
  "bn-1013":
    native: "back (of the body)"
    wiktionary: true
    notes:
      "n1": "Not {1}, the rice cakes that are made and eaten in winter."
    "examples": {
      "আমার পিঠে ব্যথা।": {"native": "I have a pain in my back.", "bases": {"পিঠে": "back (of the body)"}}
    }
  "bn-1014":
    native: "chest"
    wiktionary: true
    notes:
      "n1": "It is also the heart as the seat of feeling, and courage."
    "examples": {
      "কষ্টে বুক চাপা পড়ল।": {"native": "The chest was pressed by sorrow.", "bases": {"বুক": "chest"}},
      "আমি একটা কম্বল বুক করেছি।": {"native": "I have booked a blanket.", "bases": {"বুক": "booking"}}
    }
  "bn-1015":
    native: "elbow"
    wiktionary: true
    notes:
      "n1": "It ends in a vowel letter of its own, so it takes {1} before a noun: {2}, of the elbow."
  "bn-1016":
    native: "wrist"
    notes:
      "n1": "The joint between the {1}, hand, and the arm."
  "bn-1017":
    native: "finger; toe"
    wiktionary: true
    notes:
      "pair": "Only the last sound differs: {1} is a finger and {2} a grape."
    "examples": {
      "আঙুল চেটো না।": {"native": "Do not lick your fingers. (familiar)", "bases": {"চেটো": "to lick", "আঙুল": "finger; toe"}},
      "কাচে আঙুলের দাগ।": {"native": "Finger marks on the glass.", "bases": {"কাচে": "glass", "আঙুলের": "of the finger", "দাগ": "mark"}}
    }
  "bn-0058":
    notes:
      "n1": "{1} is to cut one's nails. It also means a claw."
  "bn-1019":
    native: "knee"
    wiktionary: true
    notes:
      "n1": "{1} is to kneel."
    "examples": {
      "আমার হাঁটুতে ব্যথা।": {"native": "I have a pain in my knee.", "bases": {"হাঁটুতে": "knee"}}
    }
  "bn-1020":
    native: "heel"
    notes:
      "n1": "The hard back part of the {1}, foot."
  "bn-1021":
    native: "bone"
    wiktionary: true
    notes:
      "n1": "The small bones of a fish are {1}, and not {2}."
      "pair": "Only the last sound differs: {1} is a bone and {2} a necklace."
    "examples": {
      "এক্স-রেতে হাড় ভাঙা নেই।": {"native": "The X-ray shows no broken bone.", "bases": {}}
    }
  "bn-1022":
    native: "blood"
    wiktionary: true
    notes:
      "n1": "{1} is to give blood, at a camp or a hospital."
    "examples": {
      "রক্ত পরীক্ষা": {"native": "blood test", "bases": {}},
      "আপনার রক্ত পরীক্ষা হয়েছে?": {"native": "Has your blood test been done?", "bases": {"রক্ত": "blood"}}
    }
  "bn-1023":
    native: "skin; leather"
    wiktionary: true
    notes:
      "n1": "The same word is the skin of a person and the leather of a bag or a shoe."
  "bn-1024":
    native: "body"
    wiktionary: true
    notes:
      "n1": "{1}, 'the body is bad', is how you say you are unwell."
    "examples": {
      "আমার শরীর খারাপ।": {"native": "I'm not well.", "bases": {"শরীর": "body"}},
      "ওর শরীর ভারী।": {"native": "His build is stocky.", "bases": {"ওর": "his; her"}}
    }
  "bn-1025":
    native: "beard"
    wiktionary: true
    notes:
      "n1": "{1} is to shave. A moustache is {2}."
    "examples": {
      "দাড়িটা ঘন।": {"native": "The beard is thick.", "bases": {"দাড়িটা": "beard"}},
      "আমি সকালে দাড়ি কামাই।": {"native": "I shave in the morning.", "bases": {"কামাই": "shave (I shave)", "দাড়ি": "beard"}}
    }
