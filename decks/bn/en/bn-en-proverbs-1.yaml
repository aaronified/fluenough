tags: ["unreviewed"]
cards:
  "bn-5900":
    native: "A dilemma: whichever way you turn, there is danger."
    notes:
      "literal": "Word for word: Crocodile in the water, tiger on the land."
  "bn-5902":
    native: "Spoil someone and they take liberties."
    notes:
      "literal": "Word for word: If you give a dog no room, it climbs onto your shoulder."
  "bn-5903":
    native: "Said of someone who eats anything or talks without care."
    notes:
      "literal": "Word for word: What will a goat not eat, what will a madman not say."
  "bn-5901":
    native: "A crooked nature cannot be made straight."
    notes:
      "literal": "Word for word: Oil put on a dog's tail never makes it straight."
  "bn-5904":
    native: "Good things are wasted on someone who cannot take them."
    notes:
      "literal": "Word for word: A dog's stomach does not bear ghee."
  "bn-5905":
    native: "Show without substance: appearances with nothing behind them."
    notes:
      "literal": "Word for word: No rice in the house, but a canopy at the door."
  "bn-5906":
    native: "One person enjoys, another pays."
    notes:
      "literal": "Word for word: Ramakrishna will drink the buttermilk, Kali will pay the cowries."
  "bn-5907":
    native: "With money, even the impossible can be bought."
    notes:
      "literal": "Word for word: With cowries (money), tiger's milk can be had."
  "bn-5908":
    native: "Said of a deal that brings two gains at once."
    notes:
      "literal": "Word for word: Selling bananas, and also showing the chariot."
  "bn-5909":
    native: "Paying for a service and still coming to harm."
    notes:
      "literal": "Word for word: Paying the ferry fare, and still drowning on the crossing."
  "bn-5911":
    native: "A lazy person always finds an excuse not to work."
    notes:
      "literal": "Word for word: A lazy cow looks for a new-moon day."
  "bn-5910":
    native: "Hard work means you will never lack food or clothes."
    notes:
      "literal": "Word for word: If there is a body, what sorrow is there over rice and cloth."
  "bn-5912":
    native: "Said of someone who shirks work but never misses a meal."
    notes:
      "literal": "Word for word: At the time of work they cannot be found; at the time of eating they come first."
  "bn-5913":
    native: "People turn respectful only when they need something."
    notes:
      "literal": "Word for word: When pressure comes, they call you father."
  "bn-5914":
    native: "Said of someone who plans for things he does not yet have."
    notes:
      "literal": "Word for word: No house yet, and he builds a door; no wife yet, and he weeps for a son."
  "bn-5916":
    native: "People who share a bad habit feel close to each other."
    notes:
      "literal": "Word for word: Thieves are cousins to one another."
  "bn-5915":
    native: "People are kind only while they need you."
    notes:
      "literal": "Word for word: The qazi while there is work; a rogue once the work is done."
  "bn-5917":
    native: "Without money, you have no friends."
    notes:
      "literal": "Word for word: Cowries for the puffed rice and curds; without cowries there is no friend."
  "bn-5918":
    native: "One person's season brings gain, another's brings loss."
    notes:
      "literal": "Word for word: For one person it is the month of Bhadra; for another it is ruin."
  "bn-5919":
    native: "A favour or a blessing does not reach everyone."
    notes:
      "literal": "Word for word: Rain from a patchy cloud does not fall everywhere."
