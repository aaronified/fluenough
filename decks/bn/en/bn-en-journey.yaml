schema: 1
id: "bn-en-journey"
kind: "layer"
core: "bn-journey"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Journey"
description: "Trains, buses, boats and flights, tickets and the road. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-2443":
    native: "journey"
    notes:
      "n1": "A journey from one place to another; the trip itself, not the arrival."
    examples:
      "আমাদের যাত্রা লম্বা ছিল।": { native: "Our journey was long.", bases: { "আমাদের": "we; us" } }
      "যাত্রা শুভ হোক।": "May your journey be safe. (respectful)"
  "bn-2444":
    native: "trip; tour"
    notes:
      "n1": "A trip made for work, a visit or pleasure, often with a stay."
    examples:
      "তার সফর খুব ভালো হলো।": { native: "His trip was very good.", bases: { "তার": "his; her" } }
      "আমি এক সপ্তাহের সফরে আছি।": { native: "I am on a week's trip.", bases: { "সপ্তাহের": "week", "সফরে": "trip; tour", "আছি": "to be; there is" } }
  "bn-2445":
    native: "platform"
    notes:
      "n1": "The raised place at a station where a train stops."
    examples:
      "ট্রেনটা তিন নম্বর প্ল্যাটফর্মে।": { native: "The train is at platform three.", bases: { "প্ল্যাটফর্মে": "platform" } }
      "প্ল্যাটফর্মে অনেক লোক।": { native: "There are many people on the platform.", bases: { "প্ল্যাটফর্মে": "platform", "লোক": "person; people" } }
  "bn-2446":
    native: "timetable; schedule"
    notes:
      "n1": "The list of times when trains, buses or flights leave and arrive."
    examples:
      "সময়সূচিটা দেখো।": { native: "Look at the timetable. (familiar)", bases: { "সময়সূচিটা": "timetable; schedule" } }
      "সময়সূচিতে ভুল আছে।": { native: "There is a mistake in the timetable.", bases: { "সময়সূচিতে": "timetable; schedule", "আছে": "to be; there is" } }
  "bn-2447":
    native: "ship; large boat"
    notes:
      "n1": "A large boat for the sea or big rivers."
    examples:
      "জাহাজটা সমুদ্রে যাচ্ছে।": { native: "The ship is going to the sea.", bases: { "জাহাজটা": "ship; large boat", "সমুদ্রে": "sea" } }
      "আমরা জাহাজে উঠলাম।": { native: "We got on the ship.", bases: { "জাহাজে": "ship; large boat" } }
  "bn-2448":
    native: "passport"
    notes:
      "n1": "The booklet that proves who you are when you travel abroad."
    examples:
      "আমার পাসপোর্ট কোথায়?": "Where is my passport?"
      "পাসপোর্টটা হারিয়ে গেছে।": { native: "The passport has been lost.", bases: { "পাসপোর্টটা": "passport" } }
  "bn-2449":
    native: "visa"
    notes:
      "n1": "The permission to enter another country, written in the passport."
    examples:
      "ভিসা পেয়েছি।": "I have got the visa."
      "ভিসাটা কবে শেষ হবে?": { native: "When does the visa end?", bases: { "ভিসাটা": "visa", "শেষ": "end; finished" } }
  "bn-2450":
    native: "suitcase"
    notes:
      "n1": "A large case for clothes on a journey."
    examples:
      "সুটকেসটা ভারী।": { native: "The suitcase is heavy.", bases: { "সুটকেসটা": "suitcase" } }
      "সুটকেসটা বন্ধ করো।": { native: "Close the suitcase. (familiar)", bases: { "সুটকেসটা": "suitcase" } }
  "bn-2451":
    native: "delay; lateness"
    notes:
      "n1": "Time lost by arriving or leaving after the set time."
    examples:
      "ট্রেনে দেরি হচ্ছে।": "The train is delayed."
      "দেরি করো না।": "Don't be late. (familiar)"
  "bn-2452":
    native: "passenger"
    notes:
      "n1": "A person who travels in a train, bus, plane or boat."
    examples:
      "যাত্রীরা নামছে।": { native: "The passengers are getting off.", bases: { "যাত্রীরা": "passenger" } }
      "বাসে অনেক যাত্রী।": "There are many passengers on the bus."
  "bn-2453":
    native: "driver (formal)"
    notes:
      "n1": "The formal word for a driver; in everyday talk the word is ড্রাইভার (ḍrāibhār)."
    examples:
      "বাসের চালক ভালো।": "The bus driver is good."
      "চালককে ধন্যবাদ।": { native: "Thank the driver. (respectful)", bases: { "চালককে": "driver (formal)" } }
  "bn-2454":
    native: "traffic"
    notes:
      "n1": "The cars, buses and people moving on the roads."
    examples:
      "রাস্তায় ট্রাফিক বেশি।": "There is a lot of traffic on the road."
      "ট্রাফিকে আটকে গেলাম।": { native: "I got stuck in traffic.", bases: { "ট্রাফিকে": "traffic", "আটকে": "to stop; to get stuck" } }
  "bn-2455":
    native: "traffic jam"
    notes:
      "n1": "A place where traffic is stopped and cannot move."
    examples:
      "রাস্তায় জ্যাম।": "There is a jam on the road."
      "জ্যামে দু ঘণ্টা লাগল।": { native: "It took two hours in the jam.", bases: { "জ্যামে": "traffic jam", "দু": "two" } }
  "bn-2456":
    native: "stop (bus or train)"
    notes:
      "n1": "The place where a bus or train stops for passengers."
    examples:
      "এখানে বাসের স্টপ নেই।": { native: "There is no bus stop here.", bases: { "নেই": "there is not; does not have" } }
      "পরের স্টপে নামব।": { native: "I will get off at the next stop.", bases: { "পরের": "next; later", "স্টপে": "stop (bus or train)" } }
  "bn-2457":
    native: "bus stop"
    notes:
      "n1": "The place by the road where buses stop."
    examples:
      "বাস স্টপটা কোথায়?": "Where is the bus stop?"
      "বাস স্টপে দাঁড়াও।": { native: "Wait at the bus stop. (familiar)", bases: { "দাঁড়াও": "to stand; to wait" } }
  "bn-2458":
    native: "to stop (a vehicle)"
    notes:
      "n1": "Making a vehicle stop; the verb for a vehicle stopping itself is থামা (thāmā)."
    examples:
      "গাড়িটা থামাও।": { native: "Stop the car. (familiar)", bases: { "থামাও": "to stop (a vehicle)" } }
      "চালক বাসটা থামালেন।": { native: "The driver stopped the bus. (respectful)", bases: { "থামালেন": "to stop (a vehicle)" } }
  "bn-2459":
    native: "to come back"
    notes:
      "n1": "Returning to the place you came from."
    examples:
      "আমি কাল ফিরে আসব।": "I will come back tomorrow."
      "তুমি কখন ফিরে এলে?": "When did you come back? (familiar)"
  "bn-2460":
    native: "to buy a ticket"
    notes:
      "n1": "Buying a ticket at the counter or online."
    examples:
      "আমি দুটো টিকিট কাটলাম।": { native: "I bought two tickets.", bases: { "দুটো": "two" } }
      "টিকিটটা কাটো।": "Buy the ticket. (familiar)"
  "bn-2461":
    native: "booking"
    notes:
      "n1": "Reserving a seat, room or ticket in advance."
    examples:
      "বুকিংটা কনফার্ম হয়েছে।": { native: "The booking has been confirmed.", bases: { "বুকিংটা": "booking", "কনফার্ম": "confirmed" } }
      "আমার বুকিং আছে।": { native: "I have a booking.", bases: { "আছে": "to be; there is" } }
  "bn-2462":
    native: "destination"
    notes:
      "n1": "The place where a journey is going to end."
    examples:
      "গন্তব্য কোথায়?": "Where is the destination?"
      "গন্তব্যে কখন পৌঁছাবে?": { native: "When will you reach the destination? (familiar)", bases: { "গন্তব্যে": "destination" } }
  "bn-2463":
    native: "luggage"
    notes:
      "n1": "The bags and cases a traveller takes on a journey."
    examples:
      "লাগেজ বেশি হয়ে গেছে।": "The luggage has become too much."
      "লাগেজটা কোথায় রাখব?": { native: "Where shall I put the luggage?", bases: { "লাগেজটা": "luggage" } }
  "bn-2464":
    native: "motorbike"
    notes:
      "n1": "A two-wheeled motor vehicle."
    examples:
      "মোটরসাইকেলটা নতুন।": { native: "The motorbike is new.", bases: { "মোটরসাইকেলটা": "motorbike" } }
      "আমি মোটরসাইকেলে যাই।": { native: "I go by motorbike.", bases: { "মোটরসাইকেলে": "motorbike" } }
  "bn-2465":
    native: "ferry"
    notes:
      "n1": "A boat that carries people and vehicles across a river or a strait."
    examples:
      "ফেরিটা এখনই ছাড়বে।": { native: "The ferry will leave right now.", bases: { "ফেরিটা": "ferry", "এখনই": "right now", "ছাড়বে": "to leave; to depart" } }
      "ফেরিতে গাড়ি ওঠে।": { native: "Cars get on the ferry.", bases: { "ফেরিতে": "ferry" } }
  "bn-2466":
    native: "to be late"
    notes:
      "n1": "Arriving or doing something after the time it should be done."
    examples:
      "আমরা দেরি করছি।": "We are late."
      "এত দেরি করো না।": { native: "Do not be so late. (familiar)", bases: { "এত": "so much; so" } }
  "bn-2467":
    native: "to get into a vehicle"
    notes:
      "n1": "Getting onto a bus, car, train or boat. The opposite is নামা (nāmā)."
    examples:
      "গাড়িতে ওঠো।": "Get into the car. (familiar)"
      "আমি বাসে উঠলাম।": "I got onto the bus."
  "bn-2468":
    native: "to get off a vehicle"
    notes:
      "n1": "Getting down from a bus, car, train or boat."
    examples:
      "এখানে নামুন।": "Get off here. (respectful)"
      "আমি পরের স্টপে নামব।": { native: "I will get off at the next stop.", bases: { "পরের": "next; later" } }
  "bn-2469":
    native: "to catch a train"
    notes:
      "n1": "Getting to a train in time to take it."
    examples:
      "আমি ট্রেনটা ধরেছি।": "I caught the train."
      "ট্রেনটা ধরতে দৌড়াও।": { native: "Run to catch the train. (familiar)", bases: { "দৌড়াও": "to run" } }
  "bn-2470":
    native: "to reach the destination"
    notes:
      "n1": "Arriving at the place a journey was going to."
    examples:
      "আমরা সন্ধ্যায় গন্তব্যে পৌঁছাব।": { native: "We will reach the destination in the evening.", bases: { "সন্ধ্যায়": "evening" } }
      "কখন পৌঁছাবে?": "When will you arrive? (familiar)"
  "bn-2471":
    native: "to walk there"
    notes:
      "n1": "Going somewhere on foot."
    examples:
      "আমি হেঁটে স্টেশনে যাই।": "I walk to the station."
      "হেঁটে যাও।": "Go on foot. (familiar)"
  "bn-2472":
    native: "to take a rickshaw"
    notes:
      "n1": "Hiring a rickshaw to travel a short distance."
    examples:
      "রিকশা নিচ্ছি।": "I am taking a rickshaw."
      "একটা রিকশা নিন।": "Take a rickshaw. (respectful)"
  "bn-2473":
    native: "to take a taxi"
    notes:
      "n1": "Hiring a taxi for a journey."
    examples:
      "ট্যাক্সি নিই?": "Shall I take a taxi?"
      "ট্যাক্সি নাও।": "Take a taxi. (familiar)"
  "bn-2474":
    native: "to drive a car"
    notes:
      "n1": "Driving a car or a vehicle."
    examples:
      "তুমি গাড়ি চালাও?": "Do you drive a car? (familiar)"
      "আমি গাড়ি চালাতে পারি।": { native: "I can drive a car.", bases: { "পারি": "to be able" } }
  "bn-2475":
    native: "belt; seat belt"
    notes:
      "n1": "A strap worn round the waist, or fixed in a seat for safety."
    examples:
      "বেল্টটা বাঁধো।": { native: "Fasten the belt. (familiar)", bases: { "বেল্টটা": "belt; seat belt", "বাঁধো": "to tie; to fasten" } }
      "সিটবেল্ট লাগান।": { native: "Put on the seat belt. (respectful)", bases: { "সিটবেল্ট": "seat belt" } }
  "bn-2476":
    native: "helmet"
    notes:
      "n1": "A hard hat worn on a motorbike or bicycle for safety."
    examples:
      "হেলমেট পরো।": { native: "Wear a helmet. (familiar)", bases: { "পরো": "to wear" } }
      "হেলমেটটা ভালো।": { native: "The helmet is good.", bases: { "হেলমেটটা": "helmet" } }
  "bn-2477":
    native: "flight"
    notes:
      "n1": "A journey by aeroplane."
    examples:
      "ফ্লাইটটা কখন?": { native: "When is the flight?", bases: { "ফ্লাইটটা": "flight" } }
      "ফ্লাইট বাতিল হয়েছে।": { native: "The flight has been cancelled.", bases: { "বাতিল": "cancelled" } }
  "bn-2478":
    native: "to travel"
    notes:
      "n1": "Going to other places, for pleasure or to see things."
    examples:
      "আমি দেশ ভ্রমণ করতে ভালোবাসি।": "I love to travel the country."
      "আমরা ভ্রমণ করছি।": "We are travelling."
  "bn-2479":
    native: "abroad; a foreign country"
    notes:
      "n1": "A country other than your own."
    examples:
      "সে বিদেশে থাকে।": { native: "He lives abroad.", bases: { "বিদেশে": "abroad; a foreign country" } }
      "বিদেশে যাবে?": { native: "Will you go abroad? (familiar)", bases: { "বিদেশে": "abroad; a foreign country" } }
  "bn-2480":
    native: "start; beginning"
    notes:
      "n1": "The first part of a journey or an action."
    examples:
      "যাত্রার শুরুতে বৃষ্টি ছিল।": { native: "There was rain at the start of the journey.", bases: { "শুরুতে": "start; beginning" } }
      "সবকিছুর শুরু আছে।": { native: "Everything has a start.", bases: { "সবকিছুর": "everything", "আছে": "to be; there is" } }
