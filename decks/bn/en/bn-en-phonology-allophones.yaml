id: "bn-en-phonology-allophones"
kind: "layer"
core: "bn-phonology-allophones"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Bengali sound variants (IPA)"
description: "Some of the ways Bengali sounds vary, and where eastern dialects differ, as the sources used describe them: one card each, taught with example words and never used to work out how a word is said. For learners who know the IPA or want to learn it. Variety taught: Standard Colloquial Bengali of Kolkata, with a note wherever Bangladeshi Standard (Dhaka) differs. This is a proposal, not yet confirmed by the owner, a Bengali speaker or a phonetician. The only JIPA illustration found, by Khan (2010), describes Bangladeshi Standard, so facts taken from it are marked as that; Wikipedia's page covers both and says where it knows they differ."
license: "CC-BY-SA-4.0"
authors:
  - { name: "Fluenough contributors" }
  - { name: "Wikipedia contributors (Bengali phonology; Help:IPA/Bengali)", url: "https://en.wikipedia.org/wiki/Bengali_phonology" }
source: "Khan (2010), 'Bengali (Bangladeshi Standard)', Illustration of the IPA, Journal of the International Phonetic Association 40(2): 221-225, doi 10.1017/S0025100310000071 (named in Wikipedia's references; the article itself was not read); also as cited by Wikipedia: Ferguson and Chowdhury (1960), Language 36(1): 22-59; Chatterji (1921), Bulletin of the School of Oriental and African Studies 2: 1-25; Masica (1991), The Indo-Aryan Languages, Cambridge University Press; Hayes and Lahiri (1991), Natural Language and Linguistic Theory 9: 47-96; Bhattacharya (2000), Bangla (Bengali). Text adapted from Wikipedia, 'Bengali phonology' and 'Help:IPA/Bengali', CC BY-SA 4.0, https://en.wikipedia.org/wiki/Bengali_phonology"
tags: ["ipa", "phonology", "unreviewed"]
cards:
  "bn-2063":
    native: "ɖ said as ɽ away from the start of a word"
    notes:
      "n1": "The source says ɽ began as an allophone of ɖ that occurs outside word-initial position and outside the clusters ɖɖ and nɖ, and that loanwords with ɖ made it a phoneme. The example words show the context the rule names; the sources give no recordings or measurements of these words, so a speaker may say them differently."
    examples:
      "ডিম": "egg"
      "পড়া": "to read; to fall"
  "bn-2064":
    native: "n said as ɳ before a curled-back stop"
    notes:
      "n1": "In conjuncts with curled-back stops n may be said ɳ, the original sound of ণ (nô); elsewhere ণ (nô) is said n. The example words show the context the rule names; the sources give no recordings or measurements of these words, so a speaker may say them differently."
    examples:
      "ঘণ্টা": "hour"
  "bn-2065":
    native: "ɦ said as h at the start or end of a word"
    notes:
      "n1": "The source says ɦ may lose its voice and be said h at the start or end of a word, with ɦ between vowels. This course's IPA writes ɦ for হ (hô) everywhere. The example words show the context the rule names; the sources give no recordings or measurements of these words, so a speaker may say them differently."
    examples:
      "হাত": "hand; arm"
      "শহর": "city"
  "bn-2066":
    native: "pʰ said as ɸ or f"
    notes:
      "n1": "The letter ফ (phô) is said either as the stop pʰ or, commonly, as the fricative ɸ or f; in loanwords such as ফ্যান (fan) the fricative can occur. In the east pʰ is said ɸ or f more. The example words show the context the rule names; the sources give no recordings or measurements of these words, so a speaker may say them differently."
    examples:
      "ফল": "fruit"
      "ফোন": "phone; telephone"
  "bn-2067":
    native: "bʱ said as a fricative"
    notes:
      "n1": "The letter ভ (bhô) is said as the breathy stop bʱ or, much more rarely, as a fricative made with both lips or with the lip and teeth; in foreign loans such as ভিসা (visa) the fricative can occur. In eastern dialects it becomes b or a bilabial fricative. The example words show the context the rule names; the sources give no recordings or measurements of these words, so a speaker may say them differently."
    examples:
      "ভাত": "cooked rice"
      "ভাই": "brother; younger brother"
  "bn-2068":
    native: "r said as a tap, an approximant or a trill"
    notes:
      "n1": "Most speakers say r colloquially as a tap, ɾ. It can also be an approximant, ɹ, especially in some eastern dialects and sometimes before consonants in conjuncts, and very rarely a trill, especially at the start of some words. The example words show the context the rule names; the sources give no recordings or measurements of these words, so a speaker may say them differently."
    examples:
      "ঘর": "room"
      "পর": "after; other"
  "bn-2069":
    native: "tʃ and dʒ said as tɕ and dʑ"
    notes:
      "n1": "The postalveolar affricates tʃ, tʃʰ, dʒ and dʒʱ can also be said as alveolo-palatal tɕ, tɕʰ, dʑ and dʑʱ. The example words show the context the rule names; the sources give no recordings or measurements of these words, so a speaker may say them differently."
    examples:
      "চা": "tea"
      "জল": "water"
  "bn-2070":
    native: "ʃ and s: one sound for some speakers, and s for ʃ or tʃʰ"
    notes:
      "n1": "For some speakers, especially in Rajshahi and Western Bengali, স (śô) and শ (śô) are the same sound, so বাস (bus) and বাঁশ (bamboo) sound alike. For some speakers s can be an allophone of ʃ or of tʃʰ: সালাম (greetings) said with ʃ, and বিশ্রী (ugly) said bitʃːʰiri. Some loanwords that had s now have tʃʰ in Standard Bengali, as পছন্দ (pôchondo) from Persian pasand. The example words show the context the rule names; the sources give no recordings or measurements of these words, so a speaker may say them differently."
    examples:
      "পছন্দ": "liking; choice"
      "শহর": "city"
  "bn-2071":
    native: "z said as dʒ in most loans"
    notes:
      "n1": "Most foreign words with z are said with dʒ instead: namaz is নামাজ (nāmāj) and 'design' is ডিজাইন (ḍijāin). Some words that had z are now said with dʒ in Standard Bengali, such as সবজি (śôbji) from Persian sabzi; a z opposed to s has developed in Chittagonian. The example words show the context the rule names; the sources give no recordings or measurements of these words, so a speaker may say them differently."
    examples:
      "সবজি": "vegetable; vegetables"
  "bn-2072":
    native: "a said as ɐ or as a more open a"
    notes:
      "n1": "In onomatopoeia and in words of more than one syllable a is said as the vowel ɐ; in words of one syllable it is the more open a or aː. The example words show the context the rule names; the sources give no recordings or measurements of these words, so a speaker may say them differently."
    examples:
      "মাছ": "fish"
      "পাখি": "bird"
  "bn-2073":
    native: "u said as ʊ"
    notes:
      "n1": "The vowel u may also be a fully back near-close ʊ. The example words show the context the rule names; the sources give no recordings or measurements of these words, so a speaker may say them differently."
    examples:
      "দুধ": "milk"
      "ঘুম": "sleep"
  "bn-2074":
    native: "the semivowels e̯, i̯, o̯ and u̯ said as j and w"
    notes:
      "n1": "The semivowels o̯ and u̯ may be merged as w, especially in loanwords such as ওয়াদা (promise) and উইলিয়াম (William); e̯ and i̯ may be said j in some pronunciations of vowel clusters, as in নয়ন (nôyon), eye, and ভাই (bhāi), brothers. So j and w are marginal consonants of Bengali. The example words show the context the rule names; the sources give no recordings or measurements of these words, so a speaker may say them differently."
    examples:
      "ভাই": "brother; younger brother"
      "নয়": "9, nine"
  "bn-2075":
    native: "eastern dialects: affricates become fricatives"
    notes:
      "n1": "In much of the east and southeast of the Bengali area, many stops and affricates heard in the west are said as fricatives. The western tʃ, tʃʰ, dʒ and dʒʱ correspond to eastern ts or s, s, z or dz, and z or zʱ; some Perso-Arabic loans with z are not said so in all dialects."
  "bn-2076":
    native: "eastern dialects: kʰ, pʰ and bʱ become fricatives"
    notes:
      "n1": "The aspirated kʰ, pʰ and bʱ of the west and centre correspond in the east to a velar or uvular fricative, ɸ or f, and b or a bilabial fricative; gʱ is relatively stable. These are most common in Sylheti. In English loans, থ (thô) and দ (dô) become th-like fricatives in the speech of educated speakers, though not in native words."
  "bn-2077":
    native: "eastern dialects: the curled-back stops are said at the ridge"
    notes:
      "n1": "In dialects of Mymensingh, Sylhet and Chittagong, and parts of Dhaka and Barishal, and Tripura and the Barak Valley, alveolar stops are said in place of ট (ṭô), ঠ (ṭhô), ড (ḍô) and ঢ (ḍhô), like the stops of Thai and Lao. Retroflexes lose their aspiration."
  "bn-2078":
    native: "eastern dialects: r and ɽ are not told apart"
    notes:
      "n1": "In far western Bengali r and ɽ are clear and distinct, as in the languages further west. In western and central dialects they are often less clear, and in eastern dialects they are lost: both are said ɾ or ɹ, like Assamese ৰ (rô). The pair পড়ে (pôṛe) and পরে (pôre) can then be homophones."
  "bn-2079":
    native: "eastern dialects: s and ʃ become h"
    notes:
      "n1": "Many eastern dialects share features with Assamese, including the change of স (śô), শ (śô) and ষ (śô), ʃ, to হ (hô), h, but not to x."
