"id": "bn-en-shopping"
"kind": "layer"
"core": "bn-shopping"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Shopping"
"description": "Buying and selling, prices, money, the shop and the market: bargaining, paying and returning. Not yet checked by a Bengali speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "bn-1685":
    "native": "shopping; buying things"
    "notes":
      "n1": "{1} is the whole business of buying things, at a shop or a market."
    "examples":
      "আমরা শনিবার বাজারে কেনাকাটা করি।": "We go shopping at the market on Saturdays."
      "কেনাকাটার পর আমি দোকানে রসিদ নিই।":
        "native": "After shopping, I take a receipt at the shop."
        "bases":
          "কেনাকাটার":
            "meaning": "shopping"
  "bn-1686":
    "native": "buyer; customer"
    "notes":
      "n1": "{1} is someone who buys, in a shop or at a market."
    "examples":
      "ক্রেতা ভালো জিনিস চান।": "The buyer wants good things."
      "দোকানে অনেক ক্রেতা এসেছে।": "Many buyers have come to the shop."
  "bn-1687":
    "native": "seller"
    "notes":
      "n1": "{1} is someone who sells, at a shop, a stall or a market."
    "examples":
      "বিক্রেতা আজ দাম কম বলছে।": "The seller is quoting a lower price today."
      "বিক্রেতা রসিদ দিতে ভুলে গেছে।":
        "native": "The seller forgot to give the receipt."
        "bases":
          "ভুলে":
            "meaning": "to forget"
  "bn-1688":
    "native": "sale; selling"
    "notes":
      "n1": "{1} is the act of selling, or the amount sold."
    "examples":
      "আজ দোকানে বিক্রি বেশি হয়েছে।": "Sales were high at the shop today."
      "এই জামার বিক্রি ভালো হয়েছে।":
        "native": "Sales of this shirt have been good."
        "bases":
          "এই":
            "meaning": "this"
  "bn-1689":
    "native": "to sell"
    "notes":
      "n1": "{1} is to sell. Its opposite is {2}, to buy."
    "examples":
      "সে বাজারে সবজি বেচে।":
        "native": "She sells vegetables at the market."
        "bases":
          "বেচে":
            "meaning": "to sell"
      "দোকানদার ধারে বেচে না।":
        "native": "The shopkeeper does not sell on credit."
        "bases":
          "বেচে":
            "meaning": "to sell"
  "bn-1690":
    "native": "rate; price per unit"
    "notes":
      "n1": "{1} is the rate of a price: per kilo, per dozen. For the whole price of a thing, say {2}."
    "examples":
      "এই আলুর দর কত?":
        "native": "What is the rate of these potatoes?"
        "bases":
          "এই":
            "meaning": "this"
      "বাজারে সবজির দর বেড়েছে।":
        "native": "The rate of vegetables has risen at the market."
        "bases":
          "বেড়েছে":
            "meaning": "to rise"
  "bn-1691":
    "native": "discount"
    "notes":
      "n1": "{1} is a cut from the price, or a concession for a group such as students."
    "examples":
      "এই দোকানে ছাড় আছে?":
        "native": "Is there a discount at this shop?"
        "bases":
          "এই":
            "meaning": "this"
      "ছাত্রদের জন্য ছাড় দেওয়া হয়।":
        "native": "A discount is given for students."
        "bases":
          "ছাত্রদের":
            "meaning": "student"
  "bn-1692":
    "native": "offer; special deal"
    "notes":
      "n1": "{1} is a special deal for a short time. The word is an English loan."
    "examples":
      "এই অফারে দাম কম।":
        "native": "The price is low with this offer."
        "bases":
          "এই":
            "meaning": "this"
          "অফারে":
            "meaning": "offer"
      "অনলাইনে বড় অফার আছে।": "There are big offers online."
  "bn-1693":
    "native": "paisa; small coin; money"
    "notes":
      "n1": "{1} is a small coin, and in everyday talk a small amount of money."
    "examples":
      "পয়সা দিয়ে কী কিনব?": "What will I buy with coins?"
      "দোকানদার আমাকে পয়সা ফেরত দিল।": "The shopkeeper gave me my change back."
  "bn-1694":
    "native": "cash"
    "notes":
      "n1": "{1} is money paid at once, in hand. The opposite is {2}, credit."
    "examples":
      "নগদ টাকা দিলে ছাড় পাবেন।": "If you pay in cash, you get a discount."
      "দোকানি কার্ডে নেয় না, শুধু নগদ নেয়।": "The shopkeeper does not take cards, only cash."
  "bn-1695":
    "native": "credit; a debt"
    "notes":
      "n1": "{1} is buying now and paying later, on trust. The opposite is {2}, cash."
    "examples":
      "ধারে জিনিস কিনলে দাম বেশি হয়।":
        "native": "Things bought on credit cost more."
        "bases":
          "ধারে":
            "meaning": "credit"
      "দোকানদার আমাকে ধার দিয়েছে।": "The shopkeeper has given me credit."
  "bn-1696":
    "native": "bill"
    "notes":
      "n1": "{1} is the statement of what you owe. A {2} shows what you paid."
    "examples":
      "বিলটা কত হলো?":
        "native": "How much is the bill?"
        "bases":
          "বিলটা":
            "meaning": "bill"
      "দোকানের বিল দিন।": "Pay the shop's bill."
  "bn-1697":
    "native": "receipt"
    "notes":
      "n1": "{1} is the proof of a purchase. Keep it if you want to return or exchange."
    "examples":
      "ফেরত দিতে রসিদ লাগবে।":
        "native": "A receipt is needed to return things."
        "bases":
          "লাগবে":
            "meaning": "to be needed"
      "দোকান থেকে রসিদ নিয়ো।": "Take the receipt from the shop."
  "bn-1698":
    "native": "weight"
    "notes":
      "n1": "{1} is weight, as measured on a scale. Some goods are sold by weight."
    "examples":
      "আমি এক কিলো আলু ওজন করি।": "I weigh one kilo of potatoes."
      "ওজন ঠিক আছে?": "Is the weight right?"
  "bn-1699":
    "native": "size"
    "notes":
      "n1": "{1} is the size of clothes or things. The word is an English loan."
    "examples":
      "এই জামার সাইজ কত?":
        "native": "What size is this shirt?"
        "bases":
          "এই":
            "meaning": "this"
      "ছোট সাইজ আছে?": "Is there a small size?"
  "bn-1700":
    "native": "return; money given back"
    "notes":
      "n1": "{1} is giving something back: goods returned, or change given back."
    "examples":
      "আমি এটা ফেরত দেব।": "I will return this."
      "দোকান থেকে ফেরত দেওয়া যায়।": "It can be returned to the shop."
  "bn-1701":
    "native": "to change; to exchange"
    "notes":
      "n1": "{1} is to change one thing for another, or to exchange money for smaller notes."
    "examples":
      "এই জামাটা বদলানো যাবে?":
        "native": "Can this shirt be exchanged?"
        "bases":
          "এই":
            "meaning": "this"
      "দোকানি খুচরো টাকা বদলে দিলেন।":
        "native": "The shopkeeper exchanged the small change."
        "bases":
          "বদলে":
            "meaning": "to change"
  "bn-1702":
    "native": "bargaining"
    "notes":
      "n1": "{1} is haggling over a price, back and forth, as at a market stall."
    "examples":
      "বাজারে দরদাম করা ভালো।": "At the market, it is good to bargain."
      "দরদামের পর দাম কমলো।":
        "native": "After bargaining, the price fell."
        "bases":
          "দরদামের":
            "meaning": "bargaining"
          "কমলো":
            "meaning": "to fall"
  "bn-1703":
    "native": "expense; spending"
    "notes":
      "n1": "{1} is money spent on something."
    "examples":
      "মাসের খরচ কত?":
        "native": "How much is the monthly spending?"
        "bases":
          "মাসের":
            "meaning": "month"
      "বাজারের খরচ বেড়েছে।":
        "native": "The market expense has risen."
        "bases":
          "বেড়েছে":
            "meaning": "to rise"
  "bn-1704":
    "native": "list"
    "notes":
      "n1": "{1} is a list of things to buy or to remember."
    "examples":
      "এই তালিকায় সবজি লেখা আছে।":
        "native": "Vegetables are written on this list."
        "bases":
          "এই":
            "meaning": "this"
          "তালিকায়":
            "meaning": "list"
      "কী কী কিনতে হবে, তালিকা করুন।": "Make a list of what to buy."
  "bn-1705":
    "native": "shopping"
    "notes":
      "n1": "{1} is an English loan, used in everyday speech for going out to buy things."
    "examples":
      "আমরা শপিংয়ে যাব।":
        "native": "We will go shopping."
        "bases":
          "শপিংয়ে":
            "meaning": "shopping"
      "শপিংয়ের জন্য সময় আছে?":
        "native": "Is there time for shopping?"
        "bases":
          "শপিংয়ের":
            "meaning": "shopping"
  "bn-1706":
    "native": "cashier"
    "notes":
      "n1": "{1} is the person who takes payment at a shop's desk."
    "examples":
      "ক্যাশিয়ার টাকা গুনছেন।":
        "native": "The cashier is counting the money."
        "bases":
          "গুনছেন":
            "meaning": "to count"
      "ক্যাশিয়ারকে বিল দিন।":
        "native": "Give the bill to the cashier."
        "bases":
          "ক্যাশিয়ারকে":
            "meaning": "cashier"
  "bn-1707":
    "native": "queue; line"
    "notes":
      "n1": "{1} is a line of people waiting their turn at a counter."
    "examples":
      "দোকানের লাইনে অনেক লোক।":
        "native": "Many people are in the shop's queue."
        "bases":
          "লাইনে":
            "meaning": "queue"
          "লোক":
            "meaning": "person"
      "লাইনে দাঁড়াতে হবে।":
        "native": "We will have to stand in the queue."
        "bases":
          "লাইনে":
            "meaning": "queue"
  "bn-1708":
    "native": "budget"
    "notes":
      "n1": "{1} is the money you plan to spend in a month or on a trip."
    "examples":
      "মাসের বাজেট কত?":
        "native": "What is the monthly budget?"
        "bases":
          "মাসের":
            "meaning": "month"
      "বাজেটের মধ্যে কেনাকাটা করো।":
        "native": "Shop within your budget."
        "bases":
          "বাজেটের":
            "meaning": "budget"
  "bn-1709":
    "native": "online"
    "notes":
      "n1": "{1} means on the internet: an online shop is a shop on the web."
    "examples":
      "অনলাইনে কেনা সহজ।":
        "native": "Buying online is easy."
        "bases":
          "অনলাইনে":
            "meaning": "online"
      "অনলাইন দোকানে ডেলিভারি আছে?": "Is there delivery at the online shop?"
  "bn-1710":
    "native": "card"
    "notes":
      "n1": "{1} is a bank card or a shop card. Paying by it is different from paying {2}."
    "examples":
      "এই দোকানে কার্ড নেয়?":
        "native": "Does this shop take cards?"
        "bases":
          "এই":
            "meaning": "this"
      "কার্ডে টাকা দিতে পারি।":
        "native": "I can pay by card."
        "bases":
          "কার্ডে":
            "meaning": "card"
          "পারি":
            "meaning": "to be able"
  "bn-1711":
    "native": "total"
    "notes":
      "n1": "{1} is the sum of all the items: the amount to pay in all."
    "examples":
      "মোট কত টাকা হলো?": "How much is the total?"
      "সব জিনিসের মোট দাম বলুন।": "Tell me the total price of all the goods."
  "bn-1712":
    "native": "goods; product"
    "notes":
      "n1": "{1} is goods offered for sale: a product or a stock item. A formal word."
    "examples":
      "এই পণ্যের দাম বেশি।":
        "native": "The price of this product is high."
        "bases":
          "এই":
            "meaning": "this"
          "পণ্যের":
            "meaning": "goods"
      "নতুন পণ্য এসেছে।": "New goods have arrived."
  "bn-1713":
    "native": "thing; goods"
    "notes":
      "n1": "{1} is the everyday word for a thing, an item or goods in a shop."
    "examples":
      "এই জিনিসটা কত?":
        "native": "How much is this thing?"
        "bases":
          "এই":
            "meaning": "this"
          "জিনিসটা":
            "meaning": "thing"
      "ভালো জিনিস সস্তায় পাবেন।": "You will get good things cheaply."
  "bn-1714":
    "native": "change (money given back)"
    "notes":
      "n1": "{1} is the money given back when you pay with a larger note."
    "examples":
      "ভাঙানি টাকাটা নিন।": "Take your change."
      "আমার কাছে ভাঙানি নেই।":
        "native": "I have no change on me."
        "bases":
          "নেই":
            "meaning": "there is not"
  "bn-1715":
    "native": "to reduce; to lower (a price)"
    "notes":
      "n1": "{1} is to make a price or an amount smaller."
    "examples":
      "দোকানি দাম কমাতে রাজি হলো।":
        "native": "The shopkeeper agreed to lower the price."
        "bases":
          "কমাতে":
            "meaning": "to lower"
          "রাজি":
            "meaning": "agreed"
      "একটু দাম কমান না?":
        "native": "Won't you lower the price a little?"
        "bases":
          "কমান":
            "meaning": "to lower"
  "bn-1717":
    "native": "grocer"
    "notes":
      "n1": "{1} is a grocer, a shopkeeper who sells food and household goods."
    "examples":
      "মুদির দোকানে চাল কিনি।":
        "native": "I buy rice at the grocer's shop."
        "bases":
          "মুদির":
            "meaning": "grocer"
      "মুদি আমাকে ডিম দিলেন।": "The grocer gave me eggs."
  "bn-1718":
    "native": "delivery"
    "notes":
      "n1": "{1} is bringing goods to your home. The word is an English loan."
    "examples":
      "বাড়িতে ডেলিভারি দেন?": "Do you deliver to the house?"
      "ডেলিভারির জন্য কত লাগবে?":
        "native": "How much does delivery cost?"
        "bases":
          "ডেলিভারির":
            "meaning": "delivery"
          "লাগবে":
            "meaning": "to cost"
  "bn-1719":
    "native": "quantity; amount"
    "notes":
      "n1": "{1} is how much of a thing there is, or how much is wanted."
    "examples":
      "কত পরিমাণ কিনব?": "How much quantity will I buy?"
      "সবজির পরিমাণ বেশি।": "The amount of vegetables is large."
  "bn-1720":
    "native": "account; calculation; bill"
    "notes":
      "n1": "{1} is a count or a sum of money. Its near synonym is {2}, the bill."
    "examples":
      "বিক্রেতা হিসাব করছেন।": "The seller is working out the total."
      "হিসাবটা ঠিক আছে?":
        "native": "Is the calculation right?"
        "bases":
          "হিসাবটা":
            "meaning": "calculation"
  "bn-1721":
    "native": "buying and selling; trade"
    "notes":
      "n1": "{1} is buying and selling together: trade, or a deal."
    "examples":
      "বাজারে কেনাবেচা ভালো চলছে।": "Trade is going well at the market."
      "দুজনের কেনাবেচা হয়ে গেল।":
        "native": "The deal between the two of them is done."
        "bases":
          "দুজনের":
            "meaning": "two people"
  "bn-1722":
    "native": "purchase; buying"
    "notes":
      "n1": "{1} is a purchase, the act of buying. A formal word."
    "examples":
      "এই ক্রয়ের রসিদ আছে।":
        "native": "There is a receipt for this purchase."
        "bases":
          "এই":
            "meaning": "this"
          "ক্রয়ের":
            "meaning": "purchase"
      "ক্রয় করার আগে দাম দেখুন।": "Check the price before you buy."
  "bn-1723":
    "native": "customer"
    "notes":
      "n1": "{1} is the everyday word for a customer."
    "examples":
      "খদ্দের দোকানে ঢুকল।":
        "native": "The customer came into the shop."
        "bases":
          "ঢুকল":
            "meaning": "to enter"
      "সকালে খদ্দের বেশি থাকে।": "There are more customers in the morning."
  "bn-1724":
    "native": "shopkeeper"
    "notes":
      "n1": "{1} is the everyday word for a shopkeeper. It means the same as {2}."
    "examples":
      "দোকানি ভালো লোক।":
        "native": "The shopkeeper is a good man."
        "bases":
          "লোক":
            "meaning": "person"
      "দোকানি আমাকে চা দিলেন।": "The shopkeeper gave me tea."
  "bn-1725":
    "native": "sale"
    "notes":
      "n1": "{1} is a sale, the formal word. In talk people say {2}."
    "examples":
      "এই মাসে বিক্রয় বেড়েছে।":
        "native": "Sales have risen this month."
        "bases":
          "এই":
            "meaning": "this"
          "মাসে":
            "meaning": "month"
          "বেড়েছে":
            "meaning": "to rise"
      "বিক্রয়ের হিসাব দিন।":
        "native": "Give the sales account."
        "bases":
          "বিক্রয়ের":
            "meaning": "sale"
  "bn-1726":
    "native": "sample"
    "notes":
      "n1": "{1} is a small part shown to tell what the whole is like."
    "examples":
      "এই কাপড়ের নমুনা দেখাবেন?":
        "native": "Will you show a sample of this cloth?"
        "bases":
          "এই":
            "meaning": "this"
          "দেখাবেন":
            "meaning": "to show"
      "নমুনাটা ভালো।":
        "native": "The sample is good."
        "bases":
          "নমুনাটা":
            "meaning": "sample"
  "bn-1727":
    "native": "dues; money still owed"
    "notes":
      "n1": "{1} is money that is owed and not yet paid."
