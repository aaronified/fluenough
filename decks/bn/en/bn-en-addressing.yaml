id: "bn-en-addressing"
kind: "layer"
core: "bn-addressing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Addressing people"
description: "What to call a shopkeeper, a driver or an older woman: Bengali speakers address strangers as family."
license: "CC-BY-SA-4.0"
tags: ["beginner"]
cards:
  "bn-0181":
    native: "elder brother; to a man a little older"
    notes:
      "n1": "What you call a shopkeeper or a taxi driver: দাদা (dādā), কত হলো (kôto hôlo)? Friendly and polite at once. Also ভাই (bhāi). Careful: in many families দাদা (dādā) means grandfather."
  "bn-0182":
    native: "elder sister; to a woman a little older"
    notes:
      "n1": "Also আপা (āpā)."
  "bn-0183":
    native: "uncle; to a man of your parents' age"
    notes:
      "n1": "Strictly your father's younger brother: কাকা (kākā), fondly কাকু (kāku). Also চাচা (cācā)."
  "bn-0184":
    native: "aunty; to a woman of your parents' age"
    notes:
      "n1": "Strictly your mother's sister: মাসি (māśi). Also খালা (khālā). To a woman you don't know: মাসিমা (māśimā), কাকিমা (kākimā) or খালা (khālā)."
  "bn-0185":
    native: "grandfather; to an old man"
    notes:
      "n1": "Also দাদা (dādā), or নানা (nānā) for your mother's father. Careful: দাদা (dādā) is also an elder brother."
  "bn-0186":
    native: "brother; to a younger man"
    notes:
      "n1": "To a younger man: a waiter, a boy at a shop. Many speakers also say ভাই (bhāi) to a man their age or older, where others say দাদা (dādā), and আপা (āpā) where others say দিদি (didi)."
  "bn-0187":
    native: "sir"
    notes:
      "n1": "From English, used in offices and shops."
  "bn-0188":
    native: "madam"
  "bn-0189":
    native: "friend"
  "bn-0190":
    native: "Excuse me? (to get attention)"
    notes:
      "n1": "Literally 'are you listening?'. The polite way to call a waiter or stop a passer-by."
  "bn-0414":
    native: "elder sister; to a woman a little older"
    notes:
      "n1": "Also দিদি (didi)."
  "bn-0415":
    native: "How are you, Tapan-da?"
    notes:
      "n1": "-দা (-dā) and -দি (-di) after a first name are দাদা (dādā) and দিদি (didi) cut short: for someone a little older whom you know by name. Many speakers put ভাই (bhāi) or আপা (āpā) after the name instead: তপন ভাই (tôpon bhāi)."
    bases:
      "তপনদা": "Tapan (a man's name)"
      "আছেন": "to be; there is"
