schema: 1
id: "bn-en-script-vowel-signs"
kind: "layer"
core: "bn-script-vowel-signs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Bengali vowel signs"
description: "After a consonant a vowel is written as a sign (kar) on it, before, after, below or around it. Here on ক (kô) and on ম (mô). Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "bn-0063":
    native: "ka (k + the a sign)"
    notes:
      "n1": "The a sign া (a-kar) is written after the consonant: ক (kô) + া (ā) = কা (kā). Compare ক (kô) on its own, which is 'ko'."
    "examples": {
      "কার্বন বাড়ছে।": {"native": "Carbon is increasing.", "bases": {"বাড়ছে": "increasing"}},
      "কাল আসব।": {"native": "I'll come tomorrow.", "bases": {}}
    }
  "bn-0064":
    native: "ki (k + the short i sign)"
    notes:
      "n1": "The short i sign ি (hroshsho i-kar) is written BEFORE the consonant but said after it: you see ি (i) then ক (kô), and say 'ki'."
    "examples": {
      "ডাকটিকিট কোথায়?": {"native": "Where are the stamps?", "bases": {}},
      "আগে টিকিট কাটো।": {"native": "Buy the ticket first. (familiar)", "bases": {"কাটো": "buy"}}
    }
  "bn-0065":
    native: "ki (k + the long i sign)"
    notes:
      "n1": "The long i sign ী (dirgho i-kar) is written after the consonant. It sounds just like কি (ki), but the spelling tells two words apart: কী (ki) is 'what', and কি (ki) turns a sentence into a yes-or-no question. Because it sounds the same, it is drilled by reading and writing only: no ear or recogniser can tell them apart."
    "examples": {
      "পাসওয়ার্ড কী?": {"native": "What is the password?", "bases": {}},
      "অবসরে কী করো?": {"native": "What do you do in your free time?", "bases": {"অবসরে": "free time; leisure"}}
    }
  "bn-0066":
    native: "ku (k + the short u sign)"
    notes:
      "n1": "The short u sign ু (hroshsho u-kar) hangs below the consonant."
    "examples": {
      "কুলিকে ডাকো।": {"native": "Call the porter. (familiar)", "bases": {"কুলিকে": "porter", "ডাকো": "call"}},
      "ঈশ্বরের কৃপা থাকুক।": {"native": "May God's grace be there.", "bases": {"ঈশ্বরের": "of God"}}
    }
  "bn-0067":
    native: "ku (k + the long u sign)"
    notes:
      "n1": "The long u sign ূ (dirgho u-kar) also hangs below. It sounds just like কু (ku), so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
    "examples": {
      "উপকূলে ঘূর্ণিঝড় এসেছে।": {"native": "A cyclone has come to the coast.", "bases": {}},
      "নলকূপের জল ঠান্ডা।": {"native": "The water from the tube well is cold.", "bases": {"নলকূপের": "tube well"}}
    }
  "bn-0068":
    native: "kri (k + the ri sign)"
    notes:
      "n1": "The ri sign ৃ (ri-kar) hangs below the consonant: কৃষক (kriśok, farmer). A recogniser writes this sound as ক্রি (kri), so it is drilled by reading and writing only."
    "examples": {
      "আমি প্রকৃতি ভালোবাসি।": {"native": "I love nature.", "bases": {}},
      "এর কৃতিত্ব তোমার।": {"native": "The credit for this is yours.", "bases": {"এর": "this"}}
    }
  "bn-0069":
    native: "ke (k + the e sign)"
    notes:
      "n1": "The e sign ে (e-kar) is written BEFORE the consonant and said after it: কে (ke, who)."
    "examples": {
      "উইকেট পড়ল।": {"native": "A wicket fell.", "bases": {}},
      "চালককে ধন্যবাদ।": {"native": "Thank the driver. (respectful)", "bases": {"চালককে": "driver (formal)"}}
    }
  "bn-0070":
    native: "koi (k + the oi sign)"
    notes:
      "n1": "The oi sign ৈ (oi-kar) is also written before the consonant and said after it. A recogniser writes this sound as কই (koi), so it is drilled by reading and writing only."
  "bn-0071":
    native: "ko (k + the o sign)"
    notes:
      "n1": "The o sign ো (o-kar) comes in two parts around the consonant: ে (e) before it and া (ā) after it. This is the closed o of 'go', unlike the open o ক (kô) carries on its own."
    "examples": {
      "চালানটা কোথায়?": {"native": "Where is the invoice?", "bases": {"চালানটা": "invoice"}},
      "ঝাড়ু কোথায়?": {"native": "Where is the broom?", "bases": {}}
    }
  "bn-0072":
    native: "kou (k + the ou sign)"
    notes:
      "n1": "The ou sign ৌ (ou-kar) also comes in two parts: ে (e) before the consonant and ৗ (ou) after it. A recogniser writes this sound as কউ (kou), so it is drilled by reading and writing only."
    "examples": {
      "প্রকৌশলীর কাজ কঠিন।": {"native": "The engineer's work is hard.", "bases": {"প্রকৌশলীর": "engineer", "কঠিন": "hard"}},
      "শিশুদের কৌতূহল বেশি।": {"native": "Children have a lot of curiosity.", "bases": {"শিশুদের": "children"}}
    }
  "bn-0073":
    native: "k (with the hoshonto: no vowel)"
    notes:
      "n1": "The hoshonto ্ below a consonant takes its vowel away: ক্ (k) is 'k' alone. Usually two consonants join into a conjunct instead, so you see it mostly in single letters and new words. A sign rather than a syllable you say, so it is drilled by reading and writing only."
    "examples": {
      "ক্যান্টিন বন্ধ।": {"native": "The canteen is closed.", "bases": {}},
      "ক্যাবটা এসেছে।": {"native": "The cab has come.", "bases": {"ক্যাবটা": "cab"}}
    }
  "bn-0074":
    native: "ma (m + the a sign)"
    notes:
      "n1": "The same a sign on another consonant: each sign keeps its place on almost every consonant. After র (rô), শ (śô) and হ (hô) the u signs join in shapes of their own: রু (ru), শু (śu), হু (hu). মা (mā, mother)."
    "examples": {
      "এটাই সমাধান।": {"native": "This is the solution.", "bases": {"এটাই": "this"}},
      "গাড়িটা থামাও।": {"native": "Stop the car. (familiar)", "bases": {"থামাও": "to stop (a vehicle)"}}
    }
  "bn-0075":
    native: "mi (m + the short i sign)"
    notes:
      "n1": "The short i sign is written before ম (mô), as before ক (kô), and said after it."
    "examples": {
      "ছবিটা মিলনান্তক।": {"native": "The film has a happy ending.", "bases": {}},
      "জমিটা উর্বর।": {"native": "The land is fertile.", "bases": {"জমিটা": "land; field"}}
    }
  "bn-0076":
    native: "mi (m + the long i sign)"
    notes:
      "n1": "The long i sign is written after ম (mô). It sounds just like মি (mi), so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
    "examples": {
      "গ্রামীণ জীবন শান্ত।": {"native": "Rural life is calm.", "bases": {"জীবন": "life"}},
      "অভিজ্ঞ কর্মীরা সাহায্য করবে।": {"native": "Experienced staff will help.", "bases": {}}
    }
  "bn-0077":
    native: "mu (m + the short u sign)"
    notes:
      "n1": "The short u sign hangs below ম (mô), as below ক (kô)."
    "examples": {
      "নমুনাটা ভালো।": {"native": "The sample is good.", "bases": {}},
      "আপনি মুখ খুলুন।": {"native": "Please open your mouth.", "bases": {}}
    }
  "bn-0078":
    native: "mu (m + the long u sign)"
    notes:
      "n1": "The long u sign hangs below ম (mô). It sounds just like মু (mu), so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
    "examples": {
      "এই অ্যাপটা বিনামূল্যে।": {"native": "This app is free.", "bases": {"এই": "this"}},
      "ফসলের মূল্য কম।": {"native": "The value of the crop is low.", "bases": {"কম": "low"}}
    }
  "bn-0079":
    native: "me (m + the e sign)"
    notes:
      "n1": "The e sign is written before ম (mô) and said after it: মেয়ে (meye, girl; daughter)."
    "examples": {
      "ক্যামেরাটা নতুন।": {"native": "The camera is new.", "bases": {"ক্যামেরাটা": "camera"}},
      "পশ্চিমে কলকাতা।": {"native": "Kolkata is to the west.", "bases": {}}
    }
  "bn-0080":
    native: "mo (m + the o sign)"
    notes:
      "n1": "The o sign wraps around ম (mô) in two parts, as it wraps around ক (kô): মোটা (moṭā, fat; thick)."
    "examples": {
      "ঘুমোতে যাওয়া": {"native": "to go to bed", "bases": {}},
      "মোটরসাইকেলটা নতুন।": {"native": "The motorbike is new.", "bases": {"মোটরসাইকেলটা": "motorbike"}}
    }
