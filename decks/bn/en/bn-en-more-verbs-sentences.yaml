id: "bn-en-more-verbs-sentences"
kind: "layer"
core: "bn-more-verbs-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More verbs: sentences"
description: "Short sentences in the present tense with the new verbs: what people cook, wash, send and look for. They unlock once their words and rules are known. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-1123":
    native: "Mother cooks rice. (respectful)"
    notes:
      "n1": "রাঁধেন (rām̐dhen) is the respectful present of রাঁধা (rām̐dhā), to cook; মা (mā), mother, is the subject."
  "bn-1124":
    native: "I wash my hands."
    notes:
      "n1": "ধুই (dhui) is the first-person present of ধোয়া (dhoyā), to wash, with আমি (āmi), I."
  "bn-1125":
    native: "Please wash your hands."
    notes:
      "n1": "ধুন (dhun) is the polite imperative of ধোয়া (dhoyā), to wash, used with আপনি (āpni), you (respectful)."
  "bn-1126":
    native: "He cuts fruit.; She cuts fruit."
    notes:
      "n1": "কাটে (kāṭe) is the third-person present of কাটা (kāṭā), to cut, with সে (śe), he or she."
  "bn-1127":
    native: "Please cut the vegetables with a knife."
    notes:
      "n1": "দিয়ে (diye) names the tool: ছুরি দিয়ে (churi diye) is 'with a knife'."
  "bn-1128":
    native: "I am looking for my friend."
    notes:
      "n1": "বন্ধুকে (bondhuke) is বন্ধু (bondhu), friend, with the object ending -কে (-ke)."
  "bn-1129":
    native: "He loses money.; She loses money."
    notes:
      "n1": "হারায় (hārāy) is the third-person present of হারানো (hārāno), which means both 'to lose' and 'to get lost'."
  "bn-1130":
    native: "I send money to my mother."
    notes:
      "n1": "মাকে (māke) is মা (mā), mother, with the ending -কে (-ke), 'to mother'."
  "bn-1131":
    native: "We return home."
    notes:
      "n1": "ফিরি (phiri) is the first-person present of ফেরা (pherā), to return; বাড়ি (bāṛi), home, takes no ending here."
  "bn-1132":
    native: "The bus stops here."
    notes:
      "n1": "থামে (thāme) is the third-person present of থামা (thāmā), to stop."
  "bn-1133":
    native: "Please pour the water."
    notes:
      "n1": "ঢালুন (ḍhālun) is the polite imperative of ঢালা (ḍhālā), to pour."
  "bn-1134":
    native: "The boys run in the field."
    notes:
      "n1": "দৌড়ায় (douṛāy) is the third-person present of দৌড়ানো (douṛāno), to run."
  "bn-1135":
    native: "I count three apples."
    notes:
      "n1": "তিনটে (tinṭe) is তিন (tin), three, with the ending -টে (ṭe) for counting things."
  "bn-1136":
    native: "My elder sister teaches me Bengali."
    notes:
      "n1": "আমাকে (āmāke) is আমি (āmi), I, in its object form with -কে (-ke), 'me'."
    bases:
      "বাংলা": "Bengali (the language); Bengal"
  "bn-1137":
    native: "What do you think? (respectful)"
    notes:
      "n1": "ভাবেন (bhāben) is the respectful present of ভাবা (bhābā), to think, used with আপনি (āpni), you (respectful)."
  "bn-1138":
    native: "The boy is crying."
    notes:
      "n1": "ছেলেটা (cheleṭā) is ছেলে (chele), boy, with -টা (ṭā) marking a specific boy."
