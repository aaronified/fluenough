schema: 1
id: "bn-en-questions"
kind: "layer"
core: "bn-questions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Yes, no and questions"
description: "Yes and no, the question words, and how a sentence becomes a question."
license: "CC-BY-SA-4.0"
tags: ["beginner"]
cards:
  "bn-0159":
    native: "yes"
    notes:
      "n1": "Said softly, also হুঁ (hum̐). A polite yes is also জি (ji)."
    "examples": {
      "হ্যাঁ, অবশ্যই।": {"native": "Yes, of course.", "bases": {"অবশ্যই": "certainly; without fail"}}
    }
  "bn-0160":
    native: "no; not"
    notes:
      "n1": "As 'not' it comes after the verb: আমি জানি না (āmi jāni nā), I don't know."
    "examples": {
      "না, ধন্যবাদ।": {"native": "No, thank you.", "bases": {}}
    }
  "bn-0161":
    native: "what"
    notes:
      "n1": "Spelled with a long ী (i) as 'what'. With a short ি (i), কি (ki) turns a sentence into a yes/no question: আপনি কি বাংলা বলেন (āpni ki bāṅlā bôlen)? Do you speak Bengali?"
    "examples": {
      "কী খবর?": {"native": "What's new?", "bases": {"খবর": "news"}}
    }
  "bn-0162":
    native: "who"
    "examples": {
      "কে জিতবে?": {"native": "Who will win?", "bases": {"জিতবে": "to win"}},
      "শত্রু কে?": {"native": "Who is the enemy? (familiar)", "bases": {"কে": "who"}}
    }
  "bn-0163":
    native: "where"
    "examples": {
      "এটিএম কোথায়?": {"native": "Where is the ATM?", "bases": {"কোথায়": "where"}}
    }
  "bn-0164":
    native: "when; at what time"
    notes:
      "n1": "কবে (kôbe) is 'when' as in 'on which day'."
    "examples": {
      "ফ্লাইটটা কখন?": {"native": "When is the flight?", "bases": {"ফ্লাইটটা": "flight"}},
      "আপনি কখন আসবেন?": {"native": "When will you come?", "bases": {}}
    }
  "bn-0165":
    native: "why"
    "examples": {
      "কেন আমাকে ধমকাচ্ছ?": {"native": "Why are you scolding me? (familiar)", "bases": {"ধমকাচ্ছ": "to scold", "কেন": "why"}}
    }
  "bn-0166":
    native: "how; what … like"
    notes:
      "n1": "কীভাবে (kibhābe) is 'how' as in 'in what way'."
    "examples": {
      "আবহাওয়া কেমন?": {"native": "How is the weather?", "bases": {}}
    }
  "bn-0167":
    native: "how much; how many"
    notes:
      "n1": "কত দাম (kôto dām)? How much does it cost?"
    "examples": {
      "বেতনভাতা কত?": {"native": "How much are the pay and allowances?", "bases": {"কত": "how much; how many"}}
    }
  "bn-0168":
    native: "which one"
    "examples": {
      "কোনটা বাছবে?": {"native": "Which one will you choose? (familiar)", "bases": {"বাছবে": "to choose", "কোনটা": "which one"}}
    }
  "bn-0169":
    native: "Is that OK?; OK?"
    notes:
      "n1": "As a reply, ঠিক আছে (ṭhik āche) means 'OK, fine'."
    bases:
      "আছে": "to be; there is"
  "bn-0170":
    native: "Really?"
  "bn-0406":
    native: "when (on what day)"
    notes:
      "n1": "কখন (kôkhon) is the hour, কবে (kôbe) the day: কবে আসবেন (kôbe āsoben)? When will you come?"
    "examples": {
      "নির্বাচন কবে?": {"native": "When is the election?", "bases": {"কবে": "when"}},
      "পুজো কবে?": {"native": "When is the puja?", "bases": {}}
    }
  "bn-0407":
    native: "whose"
    notes:
      "n1": "কার বই (kār boi)? Whose book?"
    "examples": {
      "উদ্ধৃতিটা কার?": {"native": "Whose quotation is it? (familiar)", "bases": {"উদ্ধৃতিটা": "quotation", "কার": "whose"}},
      "ওগুলো কার?": {"native": "Whose are those?", "bases": {}}
    }
  "bn-0408":
    native: "whom; to whom"
  "bn-0409":
    native: "who (more than one)"
    "examples": {
      "তারা কারা?": {"native": "Who are they?", "bases": {}}
    }
  "bn-0410":
    native: "how; in what way"
    notes:
      "n1": "Also কী করে (ki kôre)."
    "examples": {
      "কিভাবে বাঁচব?": {"native": "How will I survive? (familiar)", "bases": {"বাঁচব": "to survive", "কিভাবে": "how; in what way"}}
    }
  "bn-0411":
    native: "how many (things you count)"
    notes:
      "n1": "কটা বই (kôṭā boi)? How many books? কত (kôto) is for amounts: কত টাকা (kôto ṭākā)? Also কয়টা (kôyṭā)."
    "examples": {
      "কটা বাজে?": {"native": "What time is it?", "bases": {}},
      "আপনার কটি ছেলেমেয়ে?": {"native": "How many children do you have?", "bases": {"কটি": "how many (things you count)"}}
    }
  "bn-0412":
    native: "which"
    notes:
      "n1": "Before a noun: কোন বাস (kon bās)? Which bus? On its own: কোনটা (konṭā)."
    "examples": {
      "কোন পার্টিতে যাবে?": {"native": "Which party will you join?", "bases": {"কোন": "which", "পার্টিতে": "to the party"}},
      "আপনি কোন গাড়িতে যাবেন?": {"native": "Which car will you go in? (respectful)", "bases": {}}
    }
  "bn-0413":
    native: "from where"
    notes:
      "n1": "আপনি কোথা থেকে এসেছেন (āpni kothā theke esechen)? Where have you come from?"
  "bn-1362":
    native: "Question words"
    explanation: "The words that ask a question: what, who, whose, which, where, when, why, how, and how many or how much."
