schema: 1
id: "bn-en-questions"
kind: "layer"
core: "bn-questions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Yes, no and questions"
description: "Yes and no, the question words, and how a sentence becomes a question."
license: "CC-BY-SA-4.0"
tags: ["beginner"]
cards:
  "bn-0159":
    native: "yes"
    notes:
      "n1": "Said softly, also হুঁ (hum̐). A polite yes is also জি (ji)."
  "bn-0160":
    native: "no; not"
    notes:
      "n1": "As 'not' it comes after the verb: আমি জানি না (āmi jāni nā), I don't know."
  "bn-0161":
    native: "what"
    notes:
      "n1": "Spelled with a long ী (i) as 'what'. With a short ি (i), কি (ki) turns a sentence into a yes/no question: আপনি কি বাংলা বলেন (āpni ki bāṅlā bôlen)? Do you speak Bengali?"
  "bn-0162":
    native: "who"
  "bn-0163":
    native: "where"
  "bn-0164":
    native: "when; at what time"
    notes:
      "n1": "কবে (kôbe) is 'when' as in 'on which day'."
  "bn-0165":
    native: "why"
  "bn-0166":
    native: "how; what … like"
    notes:
      "n1": "কীভাবে (kibhābe) is 'how' as in 'in what way'."
  "bn-0167":
    native: "how much; how many"
    notes:
      "n1": "কত দাম (kôto dām)? How much does it cost?"
  "bn-0168":
    native: "which one"
  "bn-0169":
    native: "Is that OK? / OK?"
    notes:
      "n1": "As a reply, ঠিক আছে (ṭhik āche) means 'OK, fine'."
    bases:
      "আছে": "to be; there is"
  "bn-0170":
    native: "Really?"
  "bn-0406":
    native: "when (on what day)"
    notes:
      "n1": "কখন (kôkhon) is the hour, কবে (kôbe) the day: কবে আসবেন (kôbe āsoben)? When will you come?"
  "bn-0407":
    native: "whose"
    notes:
      "n1": "কার বই (kār boi)? Whose book?"
  "bn-0408":
    native: "whom; to whom"
  "bn-0409":
    native: "who (more than one)"
  "bn-0410":
    native: "how; in what way"
    notes:
      "n1": "Also কী করে (ki kôre)."
  "bn-0411":
    native: "how many (things you count)"
    notes:
      "n1": "কটা বই (kôṭā boi)? How many books? কত (kôto) is for amounts: কত টাকা (kôto ṭākā)? Also কয়টা (kôyṭā)."
  "bn-0412":
    native: "which"
    notes:
      "n1": "Before a noun: কোন বাস (kon bās)? Which bus? On its own: কোনটা (konṭā)."
  "bn-0413":
    native: "from where"
    notes:
      "n1": "আপনি কোথা থেকে এসেছেন (āpni kothā theke esechen)? Where have you come from?"
  "bn-1362":
    native: "Question words"
    explanation: "The words that ask a question: what, who, whose, which, where, when, why, how, and how many or how much."
