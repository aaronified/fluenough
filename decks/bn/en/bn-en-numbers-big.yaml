schema: 1
id: "bn-en-numbers-big"
kind: "layer"
core: "bn-numbers-big"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Tens and big numbers"
description: "Every number from 21 to 99, the hundreds, a thousand, lakh and crore, and the halves every market uses."
license: "CC-BY-SA-4.0"
tags: ["beginner"]
cards:
  "bn-0222":
    native: "30, thirty"
    notes:
      "n1": "Every number up to a hundred has its own word: 26 is ছাব্বিশ (chābbiś), not 'twenty-six'. In speech 30 is often তিরিশ (tiriś)."
  "bn-0223":
    native: "40, forty"
  "bn-0224":
    native: "50, fifty"
  "bn-0225":
    native: "60, sixty"
    notes:
      "n1": "Not সাত (śāt, 7): ষাট (śāṭ) ends in the retroflex ট (ṭô), with the tongue curled back, and is 60."
  "bn-0226":
    native: "70, seventy"
  "bn-0227":
    native: "80, eighty"
  "bn-0228":
    native: "90, ninety"
  "bn-0229":
    native: "100, a hundred"
    notes:
      "n1": "Also written একশ (ekoś). Hundreds join into one word: দুশো (duśo) is 200, তিনশো (tinśo) 300, পাঁচশো (pām̐cśo) 500."
  "bn-0230":
    native: "1,000, a thousand"
    notes:
      "n1": "দু হাজার কুড়ি (du hājār kuṛi) is 2020, also দুই হাজার বিশ (dui hājār biś)."
  "bn-0231":
    native: "1,00,000, a lakh (a hundred thousand)"
    notes:
      "n1": "South Asian numbering counts in lakhs and crores, and places its commas to match: 1,00,000 is one lakh. Formally লক্ষ (lôkkho)."
  "bn-0232":
    native: "1,00,00,000, a crore (ten million)"
    notes:
      "n1": "A hundred lakh."
  "bn-0233":
    native: "1½, one and a half"
    notes:
      "n1": "With hundreds too: দেড়শো (deṛśo) is 150. Heard constantly in markets."
  "bn-0234":
    native: "2½, two and a half"
    notes:
      "n1": "আড়াইশো (āṛāiśo) is 250. From 3½ on, Bengali says সাড়ে (śāṛe), 'and a half': সাড়ে তিনশো (śāṛe tinśo), 350."
  "bn-0235":
    native: "200, two hundred"
    notes:
      "n1": "The hundreds join into one word: দুশো (duśo), also দুইশ (duiśo), but never two words."
  "bn-0236":
    native: "300, three hundred"
  "bn-0237":
    native: "400, four hundred"
  "bn-0238":
    native: "500, five hundred"
  "bn-0239":
    native: "600, six hundred"
  "bn-0240":
    native: "700, seven hundred"
  "bn-0241":
    native: "800, eight hundred"
  "bn-0242":
    native: "900, nine hundred"
  "bn-0473":
    native: "21, twenty-one"
    notes:
      "n1": "Each number from 21 to 99 is one word, with the unit blended into the ten, often irregularly; learn them as words."
  "bn-0474":
