  "bn-0481":
    native: "29, twenty-nine"
    notes:
      "n1": "ঊন- (un-) means 'one less': 29 is 'one less than thirty', and so for 39, 49 … 89. Also written উন- (un-). In everyday speech its o is dropped, untrish; unotrish is more formal. Before the vowel of আশি (āśi) it stays: ঊনআশি (unoāśi) is unoashi."
