name: "Indefinites: sentences"
description: "Short sentences with কেউ (keu), কিছু (kichu), কোথাও (kothāo) and কখনো (kôkhono): someone, something, somewhere and sometimes. They unlock once their words are known. Not yet checked by a Bengali speaker: please report any mistake."
