schema: 1
id: "bn-en-grammar-verb-habitual-past"
kind: "layer"
core: "bn-grammar-verb-habitual-past"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Verbs: what I, you, he, she used to do"
description: "Every verb the course teaches, for what someone used to do over and over, in the past, for each person and each level of respect. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "person"
  slots:
    "ami": "I or we, in the habitual past"
    "tui": "you (intimate), in the habitual past"
    "tumi": "you (familiar), in the habitual past"
    "apni": "you (respectful), in the habitual past"
    "se": "he, she or they, in the habitual past"
    "tini": "he or she (respectful), in the habitual past"
rules:
  "bn-rule-habitual-past-first":
    name: "-তাম (-tām): I, we"
    explanation: "{1} joins the stem and is for 'I' and for 'we' alike: {2}, {3}. A few verbs change their stem in the habitual past: {4} from 'to go' and {5} from 'to eat'."
  "bn-rule-habitual-past-second":
    name: "-তিস (-tis), -তে (-te), -তেন (-ten): you"
    explanation: "{1}, for a friend or a younger person, takes {2}: {3}. {4}, the familiar one, takes {5}: {6}. {7}, the respectful one, takes {8}: {9}. A verb with a changed stem keeps it: {10}."
  "bn-rule-habitual-past-third":
    name: "-তো (-to), -ত (-t), -তেন (-ten): he, she, they"
    explanation: "For someone who is not there, the ending is {1} or {2}, and both are used: {3} or {4}. {5} is the same for many people. For someone you respect it is {6}, as in {7}. A verb with a changed stem keeps it: {8}, {9}."
