id: "bn-en-multiword-conjunct-kora"
kind: "layer"
core: "bn-multiword-conjunct-kora"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Multi-word verbs: noun + করা (kôrā)"
description: "Nineteen Bengali verbs made of a noun and করা (kôrā): to follow, to behave, to request, to take part, to ban, to present, to kiss, to hate, to prove, to translate, to interfere, to ignore, to hate, to work out a sum, to study, to annoy, to reminisce, to divide into parts, to marry. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "bn-6050":
    native: "to follow; to pursue"
    notes:
      "u1": "অনুসরণ (ônuśoron), following; pursuit, with করা (kôrā): to follow someone or something, or to pursue it. Only করা changes with person and tense. Attested on en.wiktionary, page অনুসরণ করা."
    bases:
      "অনুসরণ": { meaning: "following; pursuit" }
  "bn-6051":
    native: "to behave"
    notes:
      "u1": "আচরণ (ācoron), conduct; behaviour, with করা (kôrā): to behave in a certain way. Only করা changes with person and tense. Attested on en.wiktionary, page আচরণ করা."
    bases:
      "আচরণ": { meaning: "conduct; behaviour" }
  "bn-6052":
    native: "to request; to ask for"
    notes:
      "u1": "অনুরোধ (ônurodh), request, with করা (kôrā): to ask politely for something. Only করা changes with person and tense. Attested on en.wiktionary, page অনুরোধ করা."
    bases:
      "অনুরোধ": { meaning: "request" }
  "bn-6053":
    native: "to take part; to participate"
    notes:
      "u1": "অংশগ্রহণ (ôṅśogrohon), participation, with করা (kôrā): to take part in an event or activity. Only করা changes with person and tense. Attested on en.wiktionary, page অংশগ্রহণ করা."
    bases:
      "অংশগ্রহণ": { meaning: "participation" }
  "bn-6054":
    native: "to ban; to forbid; to outlaw"
    notes:
      "u1": "নিষিদ্ধ (niśiddho), forbidden; banned, with করা (kôrā): to forbid or ban something. Only করা changes with person and tense. Attested on en.wiktionary, page নিষিদ্ধ করা."
    bases:
      "নিষিদ্ধ": { meaning: "forbidden; banned" }
  "bn-6055":
    native: "to present; to submit"
    notes:
      "u1": "পেশ (peś), presentation; submission, with করা (kôrā): to put something forward or hand it in. Only করা changes with person and tense. Attested on en.wiktionary, page পেশ করা."
    bases:
      "পেশ": { meaning: "presentation; submission" }
  "bn-6056":
    native: "to kiss"
    notes:
      "u1": "চুম্বন (cumbon), kiss, with করা (kôrā): to kiss someone. Only করা changes with person and tense. Attested on en.wiktionary, page চুম্বন করা."
    bases:
      "চুম্বন": { meaning: "kiss" }
  "bn-6057":
    native: "to hate"
    notes:
      "u1": "ঘৃণা (ghrinā), hatred, with করা (kôrā): to hate someone or something. Only করা changes with person and tense. Attested on en.wiktionary, page ঘৃণা করা."
  "bn-6058":
    native: "to prove"
    notes:
      "u1": "প্রমাণ (prômān), proof, with করা (kôrā): to prove that something is so. Only করা changes with person and tense. Attested on en.wiktionary, page প্রমাণ করা."
  "bn-6059":
    native: "to translate"
    notes:
      "u1": "তর্জমা (tôrjomā), translation, with করা (kôrā): to translate a text; a synonym of অনুবাদ করা (the course already teaches অনুবাদ করা). Only করা changes with person and tense. Attested on en.wiktionary, page তর্জমা করা."
    bases:
      "তর্জমা": { meaning: "translation" }
  "bn-6060":
    native: "to interfere; to meddle"
    notes:
      "u1": "হস্তক্ষেপ (hôstokkhep), interference, with করা (kôrā): to step into a matter that is not yours. Only করা changes with person and tense. Attested on en.wiktionary, page হস্তক্ষেপ করা."
    bases:
      "হস্তক্ষেপ": { meaning: "interference" }
  "bn-6061":
    native: "to ignore; to disregard; to reject"
    notes:
      "u1": "অগ্রাহ্য (ôgrāhho), unacceptable; disregarded, with করা (kôrā): to disregard or reject something. Only করা changes with person and tense. Attested on en.wiktionary, page অগ্রাহ্য করা."
    bases:
      "অগ্রাহ্য": { meaning: "unacceptable; disregarded" }
  "bn-6062":
    native: "to hate"
    notes:
      "u1": "ঘেন্না (ghennā), disgust; loathing, with করা (kôrā): to hate or loathe; the everyday, rougher word beside ঘৃণা করা. Only করা changes with person and tense. Attested on en.wiktionary, page ঘেন্না করা."
    bases:
      "ঘেন্না": { meaning: "disgust; loathing" }
  "bn-6063":
    native: "to work out a sum"
    notes:
      "u1": "অঙ্ক (ôṅko), sum; arithmetic problem, with করা (kôrā): to do or solve an arithmetic problem; অঙ্ক কষা is the synonym. Only করা changes with person and tense. Attested on en.wiktionary, page অঙ্ক করা."
  "bn-6064":
    native: "to study"
    notes:
      "u1": "শিক্ষা (śikkhā), education; learning, with করা (kôrā): to study or learn. Only করা changes with person and tense. Attested on en.wiktionary, page শিক্ষা করা."
  "bn-6065":
    native: "to annoy; to pester"
    notes:
      "u1": "জ্বালাতন (jālāton), annoyance; harassment, with করা (kôrā): to irritate or pester someone. Only করা changes with person and tense. Attested on en.wiktionary, page জ্বালাতন করা."
    bases:
      "জ্বালাতন": { meaning: "annoyance; harassment" }
  "bn-6066":
    native: "to reminisce"
    notes:
      "u1": "স্মৃতিচারণ (smriticāron), reminiscence, with করা (kôrā): to recall and talk about the past. Only করা changes with person and tense. Attested on en.wiktionary, page স্মৃতিচারণ করা."
    bases:
      "স্মৃতিচারণ": { meaning: "reminiscence" }
  "bn-6067":
    native: "to divide into parts"
    notes:
      "u1": "অংশ (ôṅśo), part; share, with করা (kôrā): to divide something into parts or shares. Only করা changes with person and tense. Attested on en.wiktionary, page অংশ করা."
    bases:
      "অংশ": { meaning: "part; share" }
  "bn-6068":
    native: "to marry; to wed"
    notes:
      "u1": "শাদি (śādi), wedding; marriage, with করা (kôrā): to marry; বিয়ে করা is the everyday form. Only করা changes with person and tense. Attested on en.wiktionary, page শাদি করা."
    bases:
      "শাদি": { meaning: "wedding; marriage" }
