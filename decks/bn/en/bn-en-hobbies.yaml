schema: 1
id: "bn-en-hobbies"
kind: "layer"
core: "bn-hobbies"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hobbies"
description: "Hobbies words: sports, music, games, drawing, and the free-time things people do. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-2207":
    native: "hobby; a fondness for something"
    notes: { "n1": "শখ করা (śokh korā), to have a hobby; কী শখ? (kī śokh?), what hobby?" }
    examples: { "তোমার শখ কী?": "What is your hobby?", "আমার শখ ছবি আঁকা।": "My hobby is drawing pictures." }
  "bn-2208":
    native: "football"
    notes: { "n1": "ফুটবল খেলা (phuṭbôl khelā), to play football." }
    examples: { "আমি রোজ ফুটবল খেলি।": "I play football every day.", "ফুটবল মাঠে খেলা হচ্ছে।": "A football match is being played on the field." }
  "bn-2209":
    native: "cricket"
    notes: { "n1": "ক্রিকেট দেখা (krikeṭ dekhā), to watch cricket." }
    examples:
      "ক্রিকেট দেখতে ভালো লাগে।":
        native: "I like watching cricket."
        bases: { "লাগে": "to feel; to seem" }
      "ভাই ক্রিকেট খেলে।": "My brother plays cricket."
  "bn-2210":
    native: "badminton"
    notes: { "n1": "ব্যাডমিন্টন খেলা (byāḍmintôn khelā), to play badminton." }
    examples: { "বোন ব্যাডমিন্টন খেলে।": "My sister plays badminton.", "ব্যাডমিন্টন খেলতে যাবে?": "Will you go to play badminton?" }
  "bn-2211":
    native: "chess"
    notes: { "n1": "দাবা খেলা (dābā khelā), to play chess." }
    examples:
      "বাবা দাবা খেলেন।": "Father plays chess."
      "দাবায় জেতা কঠিন।":
        native: "Winning at chess is hard."
        bases: { "দাবায়": "at chess" }
  "bn-2212":
    native: "carrom"
    notes: { "n1": "ক্যারাম বোর্ড (kyārām bord), a carrom board." }
    examples:
      "আমরা ক্যারাম খেলি।": "We play carrom."
      "ক্যারামের বোর্ড বড়।":
        native: "The carrom board is big."
        bases: { "ক্যারামের": "carrom" }
  "bn-2213":
    native: "kite"
    notes: { "n1": "ঘুড়ি ওড়ানো (ghuṛi oṛāno), to fly a kite." }
    examples:
      "ছেলেরা ঘুড়ি ওড়াচ্ছে।":
        native: "The boys are flying kites."
        bases: { "ওড়াচ্ছে": "to fly" }
      "আকাশে ঘুড়ি উড়ছে।": "A kite is flying in the sky."
  "bn-2214":
    native: "story; a chat"
    notes: { "n1": "গল্প করা (golpô korā), to chat; গল্প বলা (golpô balā), to tell a story." }
    examples: { "দাদু রোজ গল্প বলেন।": "Grandfather tells stories every day.", "বন্ধুদের সঙ্গে গল্প করি।": "I chat with my friends." }
  "bn-2215":
    native: "adda: a relaxed chat with friends"
    notes: { "n1": "আড্ডা দেওয়া (āḍḍā deoyā), to hang out and chat. Adda is one of the great Bengali pastimes." }
    examples:
      "বিকেলে বন্ধুদের সঙ্গে আড্ডা দিই।": "In the evening I hang out with my friends."
      "আড্ডা মানে গল্প আর হাসি।":
        native: "Adda means chat and laughter."
        bases: { "মানে": "means", "হাসি": "laughter" }
  "bn-2216":
    native: "poem"
    notes: { "n1": "কবিতা পড়া (kôbitā poṛā), to read a poem." }
    examples:
      "কবিতাটা খুব সুন্দর।":
        native: "The poem is very beautiful."
        bases: { "কবিতাটা": "poem" }
      "আমি কবিতা লিখি।": "I write poems."
  "bn-2217":
    native: "to draw; to paint"
    notes: { "n1": "ছবি আঁকা (chabi ām̐kā), to draw pictures." }
    examples:
      "বোন ছবি আঁকে।":
        native: "My sister draws pictures."
        bases: { "আঁকে": "to draw" }
      "আমি সুন্দর ছবি আঁকি।":
        native: "I draw beautiful pictures."
        bases: { "আঁকি": "to draw" }
  "bn-2218":
    native: "tabla (a pair of drums)"
    notes: { "n1": "তবলা বাজানো (tôblā bājāno), to play the tabla." }
    examples:
      "তবলার বোল শোনো।":
        native: "Listen to the tabla's bols."
        bases: { "তবলার": "tabla (a pair of drums)", "বোল": "a spoken drum pattern" }
      "তবলা বাজানো শিখছি।": "I am learning to play the tabla."
  "bn-2219":
    native: "harmonium"
    notes: { "n1": "হারমোনিয়াম বাজানো (hārmoniyām bājāno), to play the harmonium." }
    examples:
      "দাদা হারমোনিয়াম বাজায়।": "My elder brother plays the harmonium."
      "হারমোনিয়ামের সুর মিষ্টি।":
        native: "The harmonium's tune is sweet."
        bases: { "হারমোনিয়ামের": "harmonium" }
  "bn-2220":
    native: "guitar"
    notes: { "n1": "গিটার বাজানো (giṭār bājāno), to play the guitar." }
    examples:
      "ভাই গিটার শেখে।": "My brother learns the guitar."
      "গিটারটা নতুন।":
        native: "The guitar is new."
        bases: { "গিটারটা": "guitar" }
  "bn-2221":
    native: "to play (an instrument)"
    notes: { "n1": "বাজানো (bājāno) is to play an instrument. খেলা (khelā) is to play a game or a sport." }
    examples:
      "তুমি কী বাজাও?":
        native: "What do you play?"
        bases: { "বাজাও": "to play (an instrument)" }
      "আমি রোজ বাজাই।":
        native: "I play it every day."
        bases: { "বাজাই": "to play (an instrument)" }
  "bn-2222":
    native: "to sing"
    notes: { "n1": "গাওয়া (gāoyā) changes its stem in the present: গান গায় (gān gāy), sings a song; the stem is গায় (gāy)." }
    examples:
      "মা সুন্দর গান গায়।":
        native: "Mother sings beautiful songs."
        bases: { "গায়": "to sing" }
      "আমি গাইতে পারি না।":
        native: "I cannot sing."
        bases: { "গাইতে": "to sing" }
  "bn-2223":
    native: "swimming"
    notes: { "n1": "সাঁতার কাটা (sām̐tār kāṭā), to swim." }
    examples: { "সাঁতার শেখা সহজ নয়।": "Learning to swim is not easy.", "নদীতে সাঁতার কাটি।": "I swim in the river." }
  "bn-2224":
    native: "travel; a trip"
    notes: { "n1": "ভ্রমণে যাওয়া (bhrômôṇe jāoyā), to go travelling." }
    examples:
      "ছুটিতে ভ্রমণে যাব।":
        native: "I will go travelling on holiday."
        bases: { "ভ্রমণে": "travel; a trip" }
      "ভ্রমণ খুব মজার।": "Travel is very fun."
  "bn-2225":
    native: "flower"
    notes: { "n1": "ফুল ফোটা (phul phoṭā), flowers blooming." }
    examples: { "বাগানে সুন্দর ফুল ফুটেছে।": "Beautiful flowers have bloomed in the garden.", "ফুল তুলো না।": "Don't pick the flowers." }
  "bn-2226":
    native: "club"
    notes: { "n1": "ক্লাবের সদস্য (klāber sôdôśyô), a member of the club." }
    examples:
      "আমি একটা ক্লাবের সদস্য।":
        native: "I am a member of a club."
        bases: { "ক্লাবের": "club", "সদস্য": "member" }
      "ক্লাবে রোজ খেলা হয়।":
        native: "There is play at the club every day."
        bases: { "ক্লাবে": "club" }
  "bn-2227":
    native: "player (in a sport)"
    notes: { "n1": "ভালো খেলোয়াড় (bhālo khelōyār), a good player." }
    examples:
      "ও ভালো খেলোয়াড়।": "He is a good player."
      "খেলোয়াড়রা মাঠে নামছে।":
        native: "The players are going onto the field."
        bases: { "খেলোয়াড়রা": "player (in a sport)", "নামছে": "to go down; to enter" }
  "bn-2228":
    native: "spectator"
    notes: { "n1": "দর্শকদের উৎসাহ (dôrśôkder utsāh), the spectators' enthusiasm." }
    examples:
      "স্টেডিয়ামে অনেক দর্শক।":
        native: "There are many spectators in the stadium."
        bases: { "স্টেডিয়ামে": "stadium" }
      "দর্শকরা উৎসাহ দেয়।":
        native: "The spectators cheer."
        bases: { "দর্শকরা": "spectator" }
  "bn-2229":
    native: "to win"
    notes: { "n1": "জেতা (jetā) changes its stem in the past: জিতেছে (jitechē), won; the stem is জিত- (jit-)." }
    examples:
      "আমাদের দল জিতেছে।":
        native: "Our team has won."
        bases: { "জিতেছে": "to win" }
      "কে জিতবে?":
        native: "Who will win?"
        bases: { "জিতবে": "to win" }
  "bn-2230":
    native: "to lose"
    notes: { "n1": "হারা (hārā) changes its stem in the past: হেরেছি (herechi), I have lost; the stem is হের- (her-)." }
    examples:
      "আমরা ম্যাচে হেরেছি।":
        native: "We have lost the match."
        bases: { "হেরেছি": "to lose" }
      "হেরে গেলে মন খারাপ।":
        native: "If we lose, we feel bad."
        bases: { "হেরে": "to lose", "মন": "mind" }
  "bn-2231":
    native: "team; group"
    notes: { "n1": "দলে খেলা (dôle khelā), to play in a team." }
    examples:
      "আমার দলে সাত জন।":
        native: "There are seven people in my team."
        bases: { "দলে": "team", "জন": "person" }
      "দলটা ভালো খেলছে।":
        native: "The team is playing well."
        bases: { "দলটা": "team; group" }
  "bn-2232":
    native: "match"
    notes: { "n1": "ম্যাচ দেখা (myāc dekhā), to watch a match." }
    examples:
      "আজ বিকেলে ম্যাচ।": "The match is this afternoon."
      "ম্যাচটা দেখব।":
        native: "I will watch the match."
        bases: { "ম্যাচটা": "match" }
  "bn-2233":
    native: "competition"
    notes: { "n1": "সাঁতারের প্রতিযোগিতা (sām̐tārer prôtijogitā), a swimming competition." }
    examples:
      "সাঁতারের প্রতিযোগিতা হবে।": "There will be a swimming competition."
      "প্রতিযোগিতায় জিতলে পুরস্কার।":
        native: "If you win the competition, a prize."
        bases: { "প্রতিযোগিতায়": "competition" }
  "bn-2234":
    native: "practice; habit"
    notes: { "n1": "অভ্যাস করা (ābhyās korā), to practise." }
    examples: { "রোজ অভ্যাস করো।": "Practise every day.", "পড়ার অভ্যাস ভালো।": "The habit of reading is good." }
  "bn-2235":
    native: "prize"
    notes: { "n1": "প্রথম পুরস্কার (prôthôm purôskār), first prize." }
    examples:
      "সে প্রথম পুরস্কার পেয়েছে।": "She has won the first prize."
      "পুরস্কারটা সুন্দর।":
        native: "The prize is beautiful."
        bases: { "পুরস্কারটা": "prize" }
  "bn-2236":
    native: "collection"
    notes: { "n1": "ডাকটিকিট সংগ্রহ (ḍākṭikiṭ sôṅgrôho), a stamp collection." }
    examples: { "আমার ডাকটিকিটের সংগ্রহ বড়।": "My stamp collection is big.", "বই সংগ্রহ করা শখ।": "Collecting books is a hobby." }
  "bn-2237":
    native: "postage stamp"
    notes: { "n1": "ডাকটিকিট সংগ্রহ করা (ḍākṭikiṭ sôṅgrôho korā), to collect stamps." }
    examples:
      "ডাকটিকিট কোথায়?": "Where are the stamps?"
      "বাবার কাছে অনেক ডাকটিকিট আছে।":
        native: "Father has many stamps."
        bases: { "আছে": "is; are; has" }
  "bn-2238":
    native: "play; drama"
    notes: { "n1": "নাটক দেখা (nāṭôk dekhā), to watch a play." }
    examples:
      "আমরা একটা নাটক দেখলাম।": "We watched a play."
      "নাটকটা খুব ভালো লেগেছে।":
        native: "I liked the play very much."
        bases: { "নাটকটা": "play; drama", "লেগেছে": "to feel; to seem" }
  "bn-2239":
    native: "camera"
    notes: { "n1": "ক্যামেরা দিয়ে ছবি তোলা (kyāmerā diye chabi tolā), to take photos with a camera." }
    examples:
      "ক্যামেরাটা নতুন।":
        native: "The camera is new."
        bases: { "ক্যামেরাটা": "camera" }
      "ছবি তুলতে ক্যামেরা লাগে।":
        native: "A camera is needed to take photos."
        bases: { "লাগে": "to feel; to seem" }
  "bn-2240":
    native: "sewing; stitching"
    notes: { "n1": "সেলাই করা (selāi korā), to sew." }
    examples:
      "মা সেলাই করেন।": "Mother does sewing."
      "সেলাইয়ের কাজটা সুন্দর।":
        native: "The sewing work is beautiful."
        bases: { "সেলাইয়ের": "sewing; stitching" }
  "bn-2241":
    native: "enthusiasm; encouragement"
    notes: { "n1": "উৎসাহ দেওয়া (utsāh deoyā), to encourage." }
    examples: { "ছাত্রদের খুব উৎসাহ।": "The students are very keen.", "উৎসাহ দাও।": "Encourage them." }
  "bn-2242":
    native: "wish; desire"
    notes: { "n1": "ইচ্ছে করা (icche korā), to feel like doing something." }
    examples:
      "তোমার কী ইচ্ছে?": "What do you want to do?"
      "গান শেখার ইচ্ছে আছে।":
        native: "I want to learn singing."
        bases: { "আছে": "is; are; has" }
  "bn-2243":
    native: "tune; melody"
    notes: { "n1": "গানের সুর (gāner sur), the tune of a song." }
    examples:
      "গানের সুর মিষ্টি।": "The tune of the song is sweet."
      "সুরটা আমার মনে আছে।":
        native: "I remember the tune."
        bases: { "সুরটা": "tune; melody", "মনে": "mind", "আছে": "is; are; has" }
  "bn-2244":
    native: "musical instrument"
    notes: { "n1": "বাদ্যযন্ত্র বাজানো (bādyôntrô bājāno), to play a musical instrument." }
    examples:
      "তুমি কোন বাদ্যযন্ত্র বাজাও?": "Which musical instrument do you play?"
      "বাদ্যযন্ত্রটা পুরোনো।":
        native: "The instrument is old."
        bases: { "বাদ্যযন্ত্রটা": "musical instrument" }
  "bn-2245":
    native: "to dance"
    notes: { "n1": "নাচা (nācā) is the verb; নাচ (nāc) is the noun, a dance." }
    examples:
      "বোন খুব সুন্দর নাচে।":
        native: "My sister dances very beautifully."
        bases: { "নাচে": "to dance" }
      "নাচতে ভালো লাগে।":
        native: "I like dancing."
        bases: { "নাচতে": "to dance", "লাগে": "to feel; to seem" }
  "bn-2246":
    native: "artist"
    notes: { "n1": "চিত্রশিল্পী (citraśilpī), a painter." }
    examples:
      "তিনি একজন শিল্পী।": "He is an artist."
      "শিল্পীরা নতুন ছবি আঁকছে।":
        native: "The artists are painting new pictures."
        bases: { "শিল্পীরা": "artist" }
  "bn-2247":
    native: "music (formal word)"
    notes: { "n1": "সংগীত শেখা (śôṅgit śekhā), to learn music." }
    examples:
      "সংগীত শোনা ভালো লাগে।":
        native: "I like listening to music."
        bases: { "লাগে": "to feel; to seem" }
      "সংগীত শিক্ষক ভালো।": "The music teacher is good."
  "bn-2248":
    native: "to love"
    notes: { "n1": "ভালোবাসা (bhālobāsā) changes its stem in the present: ভালোবাসি (bhālobāsi), I love; the stem is ভালোবাস- (bhālobās-)." }
    examples:
      "আমি গান ভালোবাসি।":
        native: "I love songs."
        bases: { "ভালোবাসি": "to love" }
      "মা আমাকে ভালোবাসেন।":
        native: "Mother loves me."
        bases: { "ভালোবাসেন": "to love" }
  "bn-2249":
    native: "entertainment; fun"
    notes: { "n1": "বিনোদনের জন্য (binodôner jonno), for fun." }
    examples:
      "বিনোদনের জন্য গান শুনি।":
        native: "I listen to songs for fun."
        bases: { "বিনোদনের": "entertainment; fun" }
      "এটা আমার বিনোদন।": "This is my entertainment."
  "bn-2250":
    native: "free time; leisure"
    notes: { "n1": "অবসর সময় (ôbôśôr śomoy), free time." }
