native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: early and medieval Bengali, and songs of the Bengal Renaissance"
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
description: "Short lines of Bengali verse from the Middle Ages to the 1800s, from Chandidas to Lalon, in the public domain. Each shows who wrote it, when, and where it comes from. Not yet checked by a Bengali speaker: please report any mistake."

cards:
  "bn-5700":
    native: "Mind, you do not know how to farm."
    notes:
      "n1": "The first line of a famous song of Ramprasad. The poet speaks to his own mind as to a farmer who has left good land lying unused: the land is the human life, and it could give a golden harvest if it were worked."
  "bn-5701":
    native: "May my children always have milk and rice."
    notes:
      "n1": "The ferryman asks the goddess for this one wish, and she grants it. The wish is that his children never lack milk and rice."
  "bn-5702":
    native: "Everyone in the world asks, \"What caste is Lalon?\""
    notes:
      "n1": "The song goes on to say that Lalon has never seen what the form of caste is. Lalon's songs are known for asking why people are divided by caste and religion."
  "bn-5703":
    native: "How does the unknown bird come and go in the cage?"
    notes:
      "n1": "The first line of a song of Lalon that is printed among the Baul songs. The cage in the song has eight rooms and nine doors, and the singer tells his mind that the cage is made of raw bamboo and will fall apart one day."
  "bn-5704":
    native: "I am proud in your pride, and beautiful in your beauty."
    notes:
      "n1": "Radha speaks to Krishna. The book says that the line shows how Radha and Krishna are one: all that she is, she has from him, as heat belongs to fire. The word hām is an older form meaning 'I'."
  "bn-5705":
    native: "\"Caste is lost, caste is lost!\" they cry; what a strange business this is."
    notes:
      "n1": "The people in the song cry out that someone has lost caste. Lalon answers that this is a strange business, and says that no one is willing to act truthfully."
  "bn-5706":
    native: "I saw a form with my eyes; I saw my own form."
    notes:
      "n1": "The next line says that the form came out of the poet himself and showed itself to him."
  "bn-5707":
    native: "On a Sunday, the holy Shripanchami day of the month of Magh, in that month I, Krittibas, was born."
    notes:
      "n1": "In his self-account, Krittibas says when he was born. The first word names the day of the week, Sunday."
  "bn-5708":
    native: "Giri, this time when my Uma comes, I will not send Uma away again."
    notes:
      "n1": "The next lines of the song say that if people speak ill of this, the speaker will not listen to anyone."
  "bn-5709":
    native: "Listen, brother: the human being is above all, he is the truth, and there is nothing above him."
    notes:
      "n1": "One of the best-known lines credited to Chandidas. The article says he wrote it in praise of the Sahajiya teachers. The first word is an older form of 'listen'."
  "bn-5710":
    native: "I do not love you so that you will love me; it is simply my nature, and I know no one but you."
    notes:
      "n1": "The Bengali Wikipedia article quotes this as one of Nidhu Babu's love songs. The last word of the first line is a short spoken form of 'I do not love'."
  "bn-5711":
    native: "What need have I of Kashi; Gaya, the Ganges and Varanasi lie at my Mother's feet."
    notes:
      "n1": "The poet says that he does not need to travel to holy places, because for him all of them are at the feet of the Mother, the goddess Kali."
  "bn-5712":
    native: "Why do you call, flute, and what more do you want; only my life is left, so take that too."
    notes:
      "n1": "The speaker asks a flute why it calls and what more it wants, and says that only life is left to give."
  "bn-5713":
    native: "Born into a Kayastha family and living in the village of Singi; Priyankar Das's son was named Sudhakar."
    notes:
      "n1": "The poet gives his family and village in his own account of himself, as the Bengali Wikipedia article quotes it. Singi is a village in Bardhaman district. The verses go on to name more of his family."
  "bn-5714":
    native: "Without love there is no feeling, and without feeling there is no taste."
    notes:
      "n1": "This is the first line of a stanza of Alaol's Padmavati, as the Bengali Wikipedia article quotes it. The next line says that everything the poet sees in the three worlds is held by love."
  "bn-5715":
    native: "Her lips are red like the bandhuk flower, her face is like the autumn moon, and her eyes put the deer's to shame."
    notes:
      "n1": "The book quotes these lines to show how a medieval poet describes the goddess Gauri in the same language that poets of Radha and Krishna use for Radha. The bandhuk is a red flower."
  "bn-5716":
    native: "She broke the branches in play and took flowers and fruit, with sixteen thousand gopis in her company."
    notes:
      "n1": "Krishna says this to Radha in the flower grove, as the book tells the scene. The language is early Middle Bengali: the word for 'took' and the ending of the last line are older forms."
  "bn-5717":
    native: "The first god, the formless Niranjan, whose creation is the three worlds, is the ancient supreme person."
    notes:
      "n1": "The book quotes this as the poet's account of creation. In the next lines the goddess comes out of the body of this first god and stands before him as the source of creation."
