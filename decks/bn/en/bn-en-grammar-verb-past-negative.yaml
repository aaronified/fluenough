schema: 1
id: "bn-en-grammar-verb-past-negative"
kind: "layer"
core: "bn-grammar-verb-past-negative"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Verbs: what I, you, he, she did not do"
description: "Every verb the course teaches, in the simple past negative for something that did not happen, for each person and each level of respect. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "person"
  slots:
    "ami": "I or we, in the past, negative"
    "tui": "you (intimate), in the past, negative"
    "tumi": "you (familiar), in the past, negative"
    "apni": "you (respectful), in the past, negative"
    "se": "he, she or they, in the past, negative"
    "tini": "he or she (respectful), in the past, negative"
rules:
  "bn-rule-past-negative-first":
    name: "-নি (-ni): I, we"
    explanation: "'I' and 'we' take the same negative: {1} gives {2}, and {3} gives {4}. A stem that ends in a vowel keeps that vowel: {5}. A stem the present does not change keeps its form: {6}."
  "bn-rule-past-negative-second":
    name: "তুই দেখিসনি (tui dekhisni), তুমি দেখোনি (tumi dekhoni), আপনি দেখেননি (āpni dekhenni): you"
    explanation: "The three words for you each have their own negative, and the stem does not change between them. {1}, for a friend or a younger person, takes {2}. {3}, the familiar one, takes {4}, and for a verb whose stem ends in a consonant the short form {5} is also said. {6}, the respectful one, takes {7}. A vowel stem keeps its vowel: {8}, {9}, {10}."
  "bn-rule-past-negative-third":
    name: "সে দেখেনি (se dekheni), তিনি দেখেননি (tini dekhenni): he, she, they"
    explanation: "For someone who is not there, {1} takes the ordinary form: {2}; for more than one person, {3}. It does not change for one or for many. For someone you respect, {4} takes {5}. A vowel stem keeps its vowel: {6}, and {7} is the respectful form of such a verb."
