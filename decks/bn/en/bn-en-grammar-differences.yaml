schema: 1
id: "bn-en-grammar-differences"
kind: "layer"
core: "bn-grammar-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "How Bengali grammar differs from English"
description: "Before any theme: the verb last, no is, endings for in and of, no gender, three yous, no articles, and how Bengali says have, not and questions. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "grammar"]
cards:
  "bn-0121":
    native: "I eat rice."
    notes:
      "n1": "The verb comes last: subject, object, verb. Word for word, 'I rice eat'."
  "bn-0122":
    native: "You are a doctor."
    notes:
      "n1": "No word for 'am', 'is' or 'are' when saying what someone is, in the present: 'you doctor'. Where someone is, or how they are, takes আছে (āche): ভালো আছি (bhālo āchi), I'm fine."
  "bn-0123":
    native: "at school; to school"
    notes:
      "n1": "Bengali puts 'in', 'at' and 'to' after the noun, as an ending: স্কুল (skul) + -এ (-e)."
  "bn-0124":
    native: "at home"
    notes:
      "n1": "After a vowel the ending is usually -তে (-te): বাড়ি (bāṛi) + -তে (-te). After আ (ā) it is often -য় (-yô): ঢাকায় (ḍhākāy, in Dhaka)."
  "bn-0125":
    native: "father's book"
    notes:
      "n1": "'Of' is an ending on the owner, which comes first: বাবা (bābā) + -র (-rô). It is -র (-rô) after a vowel sign, -এর (-er) after a consonant (ঘরের), and -য়ের (-yer) after a full vowel letter (বইয়ের)."
  "bn-0126":
    native: "He goes. / She goes."
    notes:
      "n1": "No grammatical gender: সে (se) is both 'he' and 'she', and nothing else in the sentence changes."
  "bn-0127":
    native: "You go. (respectful)"
    notes:
      "n1": "Three words for 'you', each with its own verb ending: আপনি (āpni) for strangers and elders takes -ন (-nô)."
  "bn-0128":
    native: "You go. (familiar)"
    notes:
      "n1": "তুমি (tumi), for friends and family, takes -ও (-o)."
  "bn-0129":
    native: "You go. (intimate)"
    notes:
      "n1": "তুই (tui), only for the very close or a child, takes -স (-śô). To anyone else it is rude."
  "bn-0130":
    native: "a book; one book"
    notes:
      "n1": "No word for 'a': a number takes the classifier -টা (-ṭā), and একটা (ekoṭā) is 'one' or 'a'."
  "bn-0131":
    native: "the book"
    notes:
      "n1": "No word for 'the' either: -টা (-ṭā) on the noun makes it definite."
  "bn-0132":
    native: "I have a book."
    notes:
      "n1": "No verb 'have': 'of me a book there is', with আছে (āche), 'there is'."
    bases:
      "আছে": "to be; there is"
  "bn-0133":
    native: "I don't go."
    notes:
      "n1": "না (nā) comes after the verb: 'I go not'."
  "bn-0134":
    native: "There is no food."
    notes:
      "n1": "নেই (nei) is 'there is not', the opposite of আছে (āche)."
    bases:
      "নেই": "there is not"
  "bn-0135":
    native: "Will you go?"
    notes:
      "n1": "A yes-or-no question adds কি (ki) and keeps the statement's word order: আপনি যাবেন (you will go). Don't confuse it with কী (ki), 'what'."
