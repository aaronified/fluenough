schema: 1
id: "bn-en-script-consonants"
kind: "layer"
core: "bn-script-consonants"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Bengali consonants"
description: "Every consonant, each carrying its vowel o, then the dotted letters and the three marks for nasals and breath, on ক (kô). Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "bn-0012":
    native: "k (kô)"
    notes:
      "n1": "Like the 'k' of 'skin', with no puff of breath after it. Every consonant carries the open vowel o (অ) unless a sign changes it."
  "bn-0013":
    native: "kh, with a breath (khô)"
    notes:
      "n1": "ক (kô) with a puff of breath after it, as in the 'kh' of 'blockhead'. English 'k' at the start of a word has a little of this breath; Bengali keeps the two apart: কাল (kāl, tomorrow) against খাল (khāl, canal)."
  "bn-0014":
    native: "g (gô)"
    notes:
      "n1": "Like the 'g' of 'go'."
  "bn-0015":
    native: "gh, with a breath (ghô)"
    notes:
      "n1": "গ (gô) with a breath after it, as in the 'gh' of 'doghouse': ঘর (ghôr, room; house)."
  "bn-0016":
    native: "ng (as in 'sing')"
    notes:
      "n1": "The 'ng' of 'sing'. It comes after a vowel or in a conjunct, never at the start of a word: ব্যাঙ (bêṅ, frog)."
  "bn-0017":
    native: "ch (cô)"
    notes:
      "n1": "Like the 'ch' of 'church', with no puff of breath."
  "bn-0018":
    native: "chh, with a breath (chô)"
    notes:
      "n1": "চ (cô) with a breath after it: ছবি (chobi, picture)."
  "bn-0019":
    native: "j (borgiyo jo)"
    notes:
      "n1": "Like the 'j' of 'judge': জল (jôl, water). It is called borgiyo jo, 'the j of the rows', to tell it from য (jô), which sounds the same."
  "bn-0020":
    native: "jh, with a breath (jhô)"
    notes:
      "n1": "জ (jô) with a breath after it: ঝাল (jhāl, hot, as with chilli)."
  "bn-0021":
    native: "ny (in conjuncts)"
    notes:
      "n1": "A nasal made against the palate. You see it almost only in conjuncts such as ঞ্চ (ncô) and ঞ্জ (nj), where it sounds like n: পঞ্চাশ (pôncāś, fifty)."
  "bn-0022":
    native: "t, curled back (ṭô)"
    notes:
      "n1": "The tongue tip curls back and touches the roof of the mouth: retroflex. English 't' is close to this. Compare ত (tô), said with the tongue on the teeth: টাকা (ṭākā, money)."
  "bn-0023":
    native: "th, curled back, with a breath (ṭhô)"
    notes:
      "n1": "ট (ṭô) with a breath after it: ঠান্ডা (ṭhānḍā, cold)."
  "bn-0024":
    native: "d, curled back (ḍô)"
    notes:
      "n1": "The tongue tip curls back, as for ট (ṭô), and touches the roof of the mouth just behind the ridge behind the teeth: ডাক্তার (ḍāktār, doctor). Compare দ (dô), said with the tongue on the teeth."
  "bn-0025":
    native: "dh, curled back, with a breath (ḍhô)"
    notes:
      "n1": "Like ড (ḍô), but the tongue touches the roof of the mouth a little further back, with a breath after it: ঢাকা (ḍhākā, Dhaka; covered)."
  "bn-0026":
    native: "n (murdhonno no)"
    notes:
      "n1": "Sounds just like ন (nô) today: murdhonno means 'curled back', as it once was. It is a spelling, mostly in words from Sanskrit: কারণ (kāron, reason). Because it sounds the same, it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  "bn-0027":
    native: "t, on the teeth (tô)"
    notes:
      "n1": "The tongue touches the back of the upper teeth: dental. English has no such t; it sounds softer than English 't'. Compare ট (ṭô): তুমি (tumi, you)."
  "bn-0028":
    native: "th, on the teeth, with a breath (thô)"
    notes:
      "n1": "ত (tô) with a breath after it. Not the 'th' of 'thin': থাকা (thākā, to stay)."
  "bn-0029":
    native: "d, on the teeth (dô)"
    notes:
      "n1": "The tongue touches the back of the upper teeth, as for ত (tô): দিন (din, day). Compare ড (ḍô)."
  "bn-0030":
    native: "dh, on the teeth, with a breath (dhô)"
    notes:
      "n1": "দ (dô) with a breath after it: ধন্যবাদ (dhonnobād, thank you). Not the 'th' of 'this'."
  "bn-0031":
    native: "n (donto no)"
    notes:
      "n1": "The 'n' of 'no'. Donto means 'of the teeth', to tell it from ণ (nô), which sounds the same today: নাম (nām, name)."
  "bn-0032":
    native: "p (pô)"
    notes:
      "n1": "Like the 'p' of 'spin', with no puff of breath."
  "bn-0033":
    native: "ph, with a breath (phô)"
    notes:
      "n1": "প (pô) with a breath after it. Many speakers say it like English 'f': ফল (phôl, fruit)."
  "bn-0034":
    native: "b (bô)"
    notes:
      "n1": "Like the 'b' of 'boy'. Bengali has no separate 'v' sound: বই (boi, book)."
  "bn-0035":
    native: "bh, with a breath (bhô)"
    notes:
      "n1": "ব (bô) with a breath after it. Not 'v': ভাত (bhāt, cooked rice)."
  "bn-0036":
    native: "m (mô)"
    notes:
      "n1": "Like the 'm' of 'mother': মা (mā, mother)."
  "bn-0037":
    native: "j (ontostho jo)"
    notes:
      "n1": "At the start of a word it sounds just like জ (jô): যাওয়া (jāoā, to go). After another consonant it is written as the y-sign (য-ফলা), as in ব্য (bê). Because it sounds the same, it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  "bn-0038":
    native: "r (rô)"
    notes:
      "n1": "A single tap of the tongue, like the 'tt' of American 'butter' or the r of Spanish 'pero'. Never silent: রাত (rāt, night)."
  "bn-0039":
    native: "l (lô)"
    notes:
      "n1": "A clear 'l', as at the start of 'leaf': লাল (lāl, red)."
  "bn-0040":
    native: "sh (talobbo sho)"
    notes:
      "n1": "The 'sh' of 'shop': শাড়ি (śāṛi, sari). Bengali says শ (śô), ষ (śô) and স (śô) all as 'sh' in most words; their names tell them apart in spelling."
  "bn-0041":
    native: "sh (murdhonno sho)"
    notes:
      "n1": "Sounds just like শ (śô), 'sh'. It is a spelling, mostly in words from Sanskrit: ভাষা (bhāśā, language). Because it sounds the same, it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  "bn-0042":
    native: "sh or s (donto sho)"
    notes:
      "n1": "Usually 'sh' too: সে (śe, he; she). It is said 's' before t, th, n, r and l, as in আস্তে (āste, slowly), and in many English words. It sounds just like শ (śô) in most words, so it is drilled by reading and writing only: no ear or recogniser can tell them apart."
  "bn-0043":
    native: "h (hô)"
    notes:
      "n1": "Like the 'h' of 'hat': হাত (hāt, hand)."
  "bn-0044":
    native: "r, tongue placed as for ড (do-e shunno ro)"
    notes:
      "n1": "ড (ḍô) with a dot below: the tongue is placed as for ড (ḍô), but doesn't touch the roof of the mouth. It never starts a word: বাড়ি (bāṛi, house; home)."
  "bn-0045":
    native: "rh, tongue placed as for ঢ (dho-e shunno rho)"
    notes:
      "n1": "ঢ (ḍhô) with a dot below: the tongue is placed as for ঢ (ḍhô), a little further back than for ড় (ṛô), and doesn't touch the roof of the mouth. It is rare: আষাঢ় (āśāṛ, a month of the rains)."
  "bn-0046":
    native: "y (ontostho yo)"
    notes:
      "n1": "য (jô) with a dot below: a 'y' or 'w' glide between vowels. It never starts a word: আয় (āy, come)."
  "bn-0047":
    native: "t, with no vowel (khondo to)"
    notes:
      "n1": "A t that ends a syllable with no vowel after it: হঠাৎ (hôṭhāt, suddenly)."
  "bn-0048":
    native: "ng after a vowel (onushshar), on ক (kô)"
    notes:
      "n1": "ং (onushshar) after a vowel is said 'ng': কং (kôṅ) is 'kong', as in বাংলা (bāṅlā, Bengali). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  "bn-0049":
    native: "the breath mark (bishorgo), on ক (kô)"
    notes:
      "n1": "ঃ (bishorgo) is rare. Inside a word it usually doubles the next consonant: দুঃখ (dukkho, sorrow). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  "bn-0050":
    native: "nasal vowel mark (chondrobindu), on কা (kā)"
    notes:
      "n1": "ঁ (chondrobindu) above a letter makes its vowel nasal, said through the nose as well: কাঁ (kām̐) is 'kan', as in কাঁদা (kām̐dā, to cry). With it or without it are different words: বাধা (bādhā, obstacle), বাঁধা (bām̐dhā, tied). A mark rather than a sound of its own, so it is drilled by reading and writing only."
