schema: 1
id: "bn-en-weddings-sentences"
kind: "layer"
core: "bn-weddings-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Weddings: sentences"
description: "Short sentences about a wedding: the groom, the bride, the rites and the guests. They unlock once their words and rules are known. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-3797":
    native: "The groom and the bride exchanged garlands."
    bases: { "বদল": "exchange" }
    notes:
      "n1": "বদল (bôdol), exchange, is a noun that takes করা (kôrā), to do, as in মালা বদল করল (mālā bôdol kôrol), 'exchanged garlands'."
    confusables: { "c1": { why: "a quarrel: the opposite mood" }, "c2": { why: "a game: a different activity" } }
  "bn-3798":
    native: "After the marriage the new bride came into the new house."
    notes:
      "n1": "এলেন (elen) is the respectful past of আসা (āsā), to come, with the -লেন (-len) ending."
    confusables: { "c1": { why: "separation: the opposite of marriage" }, "c2": { why: "a journey: a different event" } }
  "bn-3799":
    native: "The priest is reciting the mantras."
    notes:
      "n1": "পড়ছেন (pôṛochen) is the continuous of পড়া (pôṛā), to read, with the respectful ending -ছেন (-chen)."
    confusables: { "c1": { why: "a song: sung, not recited" }, "c2": { why: "a poem: read, not a mantra" } }
  "bn-3800":
    native: "There was singing in the wedding room."
    notes:
      "n1": "বাসরে (bāsore) is বাসর (bāsor), the wedding room, with the place ending -এ (-e)."
    confusables: { "c1": { why: "sleep: a different state" }, "c2": { why: "a house: a place, not a room of the wedding" } }
  "bn-3801":
    native: "Everyone blessed the couple."
    notes:
      "n1": "দম্পতিকে (dômpotike) is দম্পতি (dômpoti), couple, with -কে (-ke), which marks the person acted on: 'blessed the couple'."
    confusables: { "c1": { why: "a curse: the opposite of a blessing" }, "c2": { why: "a gift: given, not a blessing" } }
  "bn-3802":
    native: "The bride's jewellery is very costly."
    notes:
      "n1": "কনের (kôner) is কনে (kône), bride, with the genitive -র (-r), 'of the bride'."
    confusables: { "c1": { why: "adornment: close in meaning, a different word" }, "c2": { why: "a ring: one piece, not all the jewellery" } }
  "bn-3803":
    native: "The sound of the band filled the ears."
    confusables: { "c1": { why: "silence: the opposite of loud music" }, "c2": { why: "smoke: a different thing" } }
  "bn-3804":
    native: "The witnesses signed."
    notes:
      "n1": "সই করা (soi kôrā), to sign, is the noun সই (soi), signature, with করা (kôrā), to do."
    confusables: { "c1": { why: "a stamp: a different mark" }, "c2": { why: "a pen: a tool, not the act" } }
  "bn-3805":
    native: "After the turmeric rite the mehendi was applied."
    bases: { "হলুদের": "turmeric" }
    confusables: { "c1": { why: "wedding day: a different day of the rites" }, "c2": { why: "welcome: a different rite" } }
  "bn-3806":
    native: "The groom's party came this morning."
    notes:
      "n1": "এল (el) is the plain past of আসা (āsā), to come; for a person one respects the form is এলেন (elen)."
    confusables: { "c1": { why: "in the afternoon: a different time" }, "c2": { why: "at night: a different time" } }
  "bn-3807":
    native: "They are living a happy married life."
    bases: { "সুখে": "happily" }
    notes:
      "n1": "সুখে (sukhe) is the locative of সুখ (sukh), happiness, used as an adverb: 'happily'."
    confusables: { "c1": { why: "trouble: the opposite of happiness" }, "c2": { why: "an office: a place of work, not a home" } }
