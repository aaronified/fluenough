native: { code: "en", iso639_3: "eng", name: "English" }
name: "Noun forms: sentences"
description: "Sentences that use the noun forms: more than one, of, in, from, with and to. They unlock once their words and rules are known. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-0924":
    native: "The boys go home."
    notes:
      "n1": "-রা (-rā) makes a plural of people: ছেলেরা (chelerā), the boys."
  "bn-0925":
    native: "The girls eat rice."
  "bn-0926":
    native: "Father is at home. (respectful)"
    notes:
      "n1": "-তে (-te) on বাড়ি (bāṛi), house, gives বাড়িতে (bāṛite), 'at home'."
  "bn-0927":
    native: "My elder brother works in an office."
    notes:
      "n1": "-এ (-e) on অফিস (ôphis), office, gives অফিসে (ôphise), 'in the office'."
  "bn-0928":
    native: "I go to work with my father."
    notes:
      "n1": "সঙ্গে (śôṅge), 'with', comes after the noun it goes with, as in বাবার সঙ্গে (bābār śôṅge), 'with father'."
  "bn-0929":
    native: "I go to work from home."
    notes:
      "n1": "থেকে (theke), 'from', comes after its noun, as in বাড়ি থেকে (bāṛi theke), 'from home'."
  "bn-0930":
    native: "I go home from the office."
    notes:
      "n1": "বাড়ি (bāṛi) with no ending means 'home' as the place you go to: বাড়ি যাই (bāṛi jāi), 'I go home'."
  "bn-0931":
    native: "We stay at grandfather's house."
    notes:
      "n1": "The endings stack: দাদুর (dādur), 'grandfather's', then বাড়িতে (bāṛite), 'at the house', as in দাদুর বাড়িতে (dādur bāṛite), at grandfather's house."
  "bn-0932":
    native: "What is mother's name?"
    notes:
      "n1": "মা (mā), mother, becomes মায়ের (māyer) for 'mother's', with the -ের (-er) ending."
  "bn-0933":
    native: "This is father's house."
  "bn-0934":
    native: "I call my mother."
    notes:
      "n1": "মা (mā), mother, takes -কে (-ke) as the person being called: মাকে ডাকি (māke ḍāki), I call my mother."
  "bn-0935":
    native: "Father looks at his son."
  "bn-0936":
    native: "They come with a friend."
