tags: ["beginner", "grammar", "unreviewed"]
pattern:
  name: "Imperatives"
  slot_name: "form of address"
  slots: { "তুই": "to a child or close friend: তুই (tui)", "তুমি": "to a friend or someone you know: তুমি (tumi)", "আপনি": "to an elder or a stranger, respectfully: আপনি (apni)" }
  entries: { khaoa: "to eat", jaoa: "to go", bola: "to say; to speak", kora: "to do", dekha: "to see; to look", shona: "to hear; to listen", lekha: "to write", pora: "to read", deoa: "to give", neoa: "to take", asa: "to come", thaka: "to stay; to be", dhoya: "to wash" }
  notes: "Do it! The imperative changes for the person addressed. তুই (tui) takes the bare stem: খা (khā), eat. তুমি (tumi) adds -ও (-o): খাও (khāo), eat. আপনি (apni) adds -ন (-n): খান (khān), please eat. Some verbs change their stem for আপনি (apni): শুনুন (śunun), listen, from শোনা (śonā); দিন (din), give, from দেওয়া (deoyā). The তুমি (tumi) form of আসা (āsā), to come, is এসো (eśo)."
