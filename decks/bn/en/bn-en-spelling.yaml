schema: 1
id: "bn-en-spelling"
kind: "layer"
core: "bn-spelling"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Bengali spellings, old and new"
description: "Spellings you will meet in older books, and the rules that changed them: Calcutta University's of 1936, the Paschimbanga Bangla Akademi's and the Bangla Academy's. Every older spelling here is printed in a book or a rulebook. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["advanced", "unreviewed"]
cards:
  "bn-0797":
    native: "bird; today পাখি (pākhi)"
    notes:
      "n1": "Sanskrit words keep their ঈ (i); other words now take ই (i). Calcutta University's rules of 1936 allowed both পাখী (pākhi) and পাখি (pākhi); the Paschimbanga Bangla Akademi and the Bangla Academy both write only পাখি (pākhi)."
  "bn-0798":
    native: "house, home; today বাড়ি (bāṛi)"
    notes:
      "n1": "The same rule as পাখি (pākhi): ই (i) in words that are not Sanskrit. The Shaibya printing of Abol Tabol: কোথায় বাড়ী (kothāy bāṛi)"
  "bn-0799":
    native: "poor; today গরিব (gorib)"
    notes:
      "n1": "A loanword, so ই (i). The Shaibya printing of Abol Tabol: গরীব বেজায় (gorib bejāy)—"
  "bn-0800":
    native: "ready; today তৈরি (toiri)"
    notes:
      "n1": "Not Sanskrit, so ই (i). The Shaibya printing of Abol Tabol: তৈরী ছেলে (toiri chele)"
  "bn-0801":
    native: "elephant; today হাতি (hāti)"
    notes:
      "n1": "Not Sanskrit, so ই (i). The Shaibya printing of Abol Tabol: হ্যাংলা হাতী চ্যাং-দোলা (hêṅlā hāti cêṅ-dolā),"
  "bn-0802":
    native: "happy; today খুশি (khuśi)"
    notes:
      "n1": "Not Sanskrit, so ই (i). Sahaj Path's 1993 printing has both, খুশি (khuśi) and খুব খুশী (khub khuśi)"
  "bn-0803":
    native: "English; today ইংরেজি (iṅreji)"
    notes:
      "n1": "Calcutta University's rules of 1936 asked for ঈ (i) in the names of languages and peoples. Both academies now write ইংরেজি (iṅreji), বাঙালি (bāṅāli)."
  "bn-0804":
    native: "class, row; today শ্রেণি (śreni)"
    notes:
      "n1": "A Sanskrit word correct with either vowel takes the short one in both academies' rules. A 1949 reprint of Tagore's বাংলাভাষা-পরিচয় (bāṅlābhāśā-poricoy) still prints শ্রেণী (sreni)."
  "bn-0805":
    native: "work, deed; today কর্ম (kôrm)"
    notes:
      "n1": "No doubled letter after a reph (র্). Calcutta University, 1936: কর্ম্ম (kôrmmo) → কর্ম (kôrm). The Bangla Academy agrees."
  "bn-0806":
    native: "never; today কক্ষনো (kôkkhono)"
    notes:
      "n1": "A word that is not Sanskrit never takes ণ (Bangla Academy, rule 2.7). The Shaibya printing of Abol Tabol: কক্ষণো তা হয় না (kôkkhono tā hôy nā)।"
  "bn-0807":
    native: "gold; today সোনা (sonā)"
    notes:
      "n1": "Calcutta University, 1936: সোণা (śonā) → সোনা (sonā). ন (nô) ণ (nô), in words that are not Sanskrit."
  "bn-0808":
    native: "good; today ভালো (bhālo)"
    notes:
      "n1": "Calcutta University made the final ো (o) optional; the Paschimbanga Bangla Akademi writes ভালো (bhālo), মতো (môto), and the Bangla Academy allows it. The Shaibya printing of Abol Tabol: ভাল রে ভাল (bhālo re bhālo)!"
  "bn-0809":
    native: "colour; today রং (rôṅ)"
    notes:
      "n1": "At the end of a word ং (ôṅ), before a vowel ঙ (ṅô): রং (rôṅ), but রঙিন (Bangla Academy, rule 2.4). Calcutta University allowed both, and Sahaj Path writes রঙ (rôṅ)."
  "bn-0810":
    native: "curd; today দই (doi)"
    notes:
      "n1": "An older spelling; today দই (doi). The Shaibya printing of Abol Tabol: চৌদ্দ হাঁড়ি দৈ কি মালাই (coudd hām̐ṛi doi ki mālāi)"
  "bn-0811":
    native: "hasn't learnt; today শেখেনি (śekheni)"
    notes:
      "n1": "The Bangla Academy's rules of 2012 join নি (ni) to the verb, শেখেনি (śekheni), and keep না (nā) apart: শেখে না (śekhe nā). Sahaj Path's 1993 printing: শেখে নি সে কথা কওয়া (śekhe ni se kôthā kôoyā)"
  "bn-0812":
    native: "became; also হল (hôl)"
    notes:
      "n1": "The Bangla Academy allows a final ো (o) on verbs: হলো (hôlo), দেবো (debo). The Paschimbanga Bangla Akademi writes হল (hôl), দেব (deb). Sahaj Path's 1993 printing has ভোর হ (bhor hô)’ল (lô)।"
