  - "unreviewed"
"cards":
  "bn-1913":
    "native": "Sit quietly in class, please."
    "confusables":
      "stand":
        "why": "Standing up is the opposite action; this step asks the pupils to sit."
      "walk":
        "why": "Walking is not sitting; this instruction is about where to sit in class."
    "bases":
      "চুপ": "quiet; silent"
  "bn-1914":
    "native": "The teacher writes a question on the blackboard."
    "confusables":
      "wipe":
        "why": "Wiping is what is done after writing, not the writing itself."
      "picture":
        "why": "A picture is drawn, not written; the sentence is about writing a question."
  "bn-1915":
    "native": "The girl students are reading books."
    "confusables":
      "play":
        "why": "Playing is an activity; the students here are reading."
      "sleep":
        "why": "Sleep is not a school activity; the sentence says the students are reading."
    "bases":
      "পড়ছে": "to read; to study"
  "bn-1916":
    "native": "Our school has a holiday."
    "confusables":
      "class":
        "why": "A class is a lesson; the sentence says there is no school today."
      "exam":
        "why": "An exam is taken in school, but the sentence is about a holiday."
  "bn-1917":
    "native": "Read the chapters before the exam."
    "confusables":
      "picture":
        "why": "A picture is not a chapter; the sentence is about reading before an exam."
      "chalk":
        "why": "Chalk is for the blackboard; nothing here is written with it."
    "bases":
      "পড়ো": "to read; to study"
  "bn-1918":
    "native": "My homework is finished."
    "confusables":
      "fun":
        "why": "Fun is a feeling about work; the sentence says the homework is finished."
      "wrong":
        "why": "A mistake is not finished homework; this says the homework is done."
    "bases":
      "আমার": "my"
      "শেষ": "end; finished"
  "bn-1919":
    "native": "The science subject is very fun."
    "confusables":
      "maths":
        "why": "Maths is also a subject, but the sentence names science."
      "history":
        "why": "History is also a subject, but the sentence names science."
  "bn-1920":
    "native": "Where is the history map?"
    "confusables":
      "notebook":
        "why": "A notebook is what a pupil writes in; the sentence asks about a map."
      "eraser":
        "why": "An eraser is for rubbing out; the sentence asks where the map is."
  "bn-1921":
    "native": "Make a rule for your studies."
    "confusables":
      "uniform":
        "why": "A uniform is clothing; the sentence is about a rule for studies."
      "tiffin":
        "why": "A tiffin is a break; the sentence is about a rule for studies."
  "bn-1922":
    "native": "At tiffin, everyone plays on the field."
    "confusables":
      "classroom":
        "why": "The classroom is where lessons are; the sentence says the pupils play outside."
      "sleep":
        "why": "Sleep does not fit a break on the field."
    "bases":
      "সময়": "time"
  "bn-1923":
    "native": "Sit on the bench and write with chalk."
    "confusables":
      "eraser":
        "why": "An eraser is not used to write; the sentence says write with chalk."
      "picture":
        "why": "A picture is not written with chalk."
  "bn-1924":
    "native": "The teacher tells a story in class."
    "confusables":
      "learn":
        "why": "To learn is what pupils do, but this sentence says the teacher tells a story."
      "write":
        "why": "To write is a different action; the teacher tells a story here."
    "bases":
      "গল্প": "story"
