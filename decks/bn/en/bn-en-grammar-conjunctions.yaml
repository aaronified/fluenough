schema: 1
id: "bn-en-grammar-conjunctions"
kind: "layer"
core: "bn-grammar-conjunctions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Joining words"
description: "And, but, or, because: joining words and sentences."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar"]
cards:
  "bn-0361":
    native: "and"
    notes:
      "n1": "The everyday 'and': চা আর বিস্কুট (cā ār biskuṭ), tea and biscuits. It can also mean 'more': আর একটু (ār ekṭu), a little more."
  "bn-0362":
    native: "and (formal)"
    notes:
      "n1": "In writing and in careful speech."
  "bn-0363":
    native: "but"
  "bn-0364":
    native: "or"
    notes:
      "n1": "Also অথবা (ôthobā)."
  "bn-0365":
    native: "because"
    notes:
      "n1": "আমি আসিনি (āmi āsini), কারণ আমি অসুস্থ ছিলাম (kāron āmi ôsusth chilām)। I didn't come because I was ill."
  "bn-0366":
    native: "so; that's why"
    notes:
      "n1": "আমি অসুস্থ ছিলাম (āmi ôsusth chilām), তাই আসিনি (tāi āsini)। I was ill, so I didn't come."
  "bn-0367":
    native: "that (after say, know)"
    notes:
      "n1": "ও বলল যে ও আসবে (o bôlol je o āsobe)। She said that she would come."
  "bn-0368":
    native: "if … then"
    notes:
      "n1": "যদি বৃষ্টি হয় (jodi briśṭi hôy), তাহলে আমি আসব না (tāhole āmi āsob nā)। If it rains, I won't come."
    bases:
      "যদি": "if"
      "তাহলে": "then; in that case"
  "bn-0369":
    native: "when … then"
    notes:
      "n1": "যখন আমি এলাম (jôkhon āmi elām), তখন ও ঘুমোচ্ছিল (tôkhon o ghumocchil)। When I came, he was sleeping."
    bases:
      "যখন": "when"
      "তখন": "then; at that time"
  "bn-0370":
    native: "me too; I also"
    notes:
      "n1": "-ও (-o), 'also', joins the end of the word it is about: আজও (ājoo), even today."
  "bn-0711":
    native: "however; but (softer)"
    notes:
      "n1": "Softer than কিন্তু (kintu): ভালো (bhālo), তবে একটু দামি (tôbe ekṭu dāmi). Good, but a little expensive."
  "bn-0712":
    native: "maybe"
    notes:
      "n1": "হয়তো ও আসবে (hôyto o āsobe)। Maybe she'll come."
  "bn-0713":
    native: "I suppose; probably"
    notes:
      "n1": "ও বোধহয় বাড়িতে (o bodhhoy bāṛite)। She's probably at home."
  "bn-0714":
    native: "Tea or coffee?"
    notes:
      "n1": "In a question, না (nā) between two choices is 'or'."
