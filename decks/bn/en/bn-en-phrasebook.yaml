schema: 1
id: "bn-en-phrasebook"
kind: "layer"
core: "bn-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty phrases to say whole from the first day, before their words are taught: good morning and good night, sorry and no problem, please, thank you, congratulations, and how to ask for English. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC0-1.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-0813":
    native: "Good morning!"
    notes:
      "n1": "Also heard: {1}, the formal word, and {2}, the all-purpose greeting."
    bases:
      "শুভ": "auspicious; good"
  "bn-0814":
    native: "Good night!"
    notes:
      "n1": "Said when you part for the night. It is also written as one word, {1}."
    bases:
      "শুভ": "auspicious; good"
      "রাত্রি": "night (formal)"
  "bn-0815":
    native: "Welcome!"
    notes:
      "n1": "Said to a guest, and often written above a door or on a banner."
    bases:
      "স্বাগতম": "welcome"
  "bn-0816":
    native: "I'm sorry."
    notes:
      "n1": "A more formal apology than {1}, which also means 'excuse me'. It also says you are sorry to hear bad news."
    bases:
      "দুঃখিত": "sorry; sad"
  "bn-0817":
    native: "OK; all right."
    notes:
      "n1": "Literally 'it is right'. With a rising voice it asks 'is that OK?': {1}."
    bases:
      "আছে": "to be; there is"
  "bn-0818":
    native: "No problem."
    notes:
      "n1": "Literally 'there is not any problem'. Also said: {1}, 'there is no trouble'."
    bases:
      "সমস্যা": "problem"
      "নেই": "there is not"
  "bn-0819":
    native: "Thank you very much."
    notes:
      "n1": "{1} means 'many' or 'a lot', so this is 'many thanks'."
  "bn-0820":
    native: "No, thank you."
    notes:
      "n1": "The usual polite refusal of an offer of food, tea or help."
  "bn-0821":
    native: "Yes, of course."
    notes:
      "n1": "{1} is 'certainly' or 'without fail'; the ending {2} adds 'indeed'."
    bases:
      "অবশ্যই": "certainly; without fail"
  "bn-0822":
    native: "Please. (literally 'kindly')"
    notes:
      "n1": "It goes in front of a request: {1}, please sit down. A request already ends in a polite form, so many people leave it out."
    bases:
      "দয়া": "kindness; mercy"
  "bn-0823":
    native: "I can't understand."
    notes:
      "n1": "Literally 'I am not able to understand'. The word {1}, 'not', comes at the end."
  "bn-0824":
    native: "Can you speak English? (respectful)"
    notes:
      "n1": "{1}, with the short sign {2}, makes a yes-or-no question; {3}, with the long sign {4}, means 'what'. The two are said alike."
    bases:
      "ইংরেজি": "English"
  "bn-0825":
    native: "Please wait a moment."
    notes:
      "n1": "{1}, 'a little', softens a request."
    bases:
      "অপেক্ষা": "waiting"
  "bn-0826":
    native: "Please hurry!"
    notes:
      "n1": "Literally 'do it quickly'."
    bases:
      "তাড়াতাড়ি": "quickly"
  "bn-0827":
    native: "Careful!"
    notes:
      "n1": "Shouted to stop someone, and written on warning signs."
    bases:
      "সাবধান": "careful"
  "bn-0828":
    native: "Happy birthday!"
    notes:
      "n1": "{1} starts many greetings for happy days."
    bases:
      "শুভ": "auspicious; good"
      "জন্মদিন": "birthday"
  "bn-0829":
    native: "Happy New Year!"
    notes:
      "n1": "Said at Pohela Boishakh, the Bengali New Year, in mid-April; people also say {1} in writing, on cards and in messages."
    bases:
      "শুভ": "auspicious; good"
      "নববর্ষ": "new year"
  "bn-0830":
    native: "Congratulations!"
    notes:
      "n1": "Said for a success, an engagement, a wedding or a birth."
    bases:
      "অভিনন্দন": "congratulations"
  "bn-0831":
    native: "Don't worry."
    notes:
      "n1": "Literally 'please do not think about it'. The polite ending {1} is for a person you respect."
  "bn-0832":
    native: "What has happened? What's wrong?"
    notes:
      "n1": "Said to someone who looks upset, or when something has gone wrong."
