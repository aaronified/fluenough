tags: ["unreviewed"]
description: "Short lines of Bengali prose and verse from the 1800s, from Vidyasagar's primer to Bankim's novels and the poems of Madhusudan, in the public domain. Each shows who wrote it, when, and where it comes from. Not yet checked by a Bengali speaker: please report any mistake."

cards:
  "bn-5750":
    native: "In time the day of the chariot festival came round."
    notes:
      "n1": "This line begins a sketch of the Rath Yatra chariot festival in Kolkata. The sketch is written in the everyday speech of the city, and describes boys in new shoes and crowds on Chitpur Road."
  "bn-5751":
    native: "Many people called Kamalakanta mad."
    notes:
      "n1": "The book begins by introducing Kamalakanta, a man who lost a clerk's job and wandered off. The narrator says he left behind a bundle of his papers (the daptar), and the book is that bundle."
  "bn-5752":
    native: "The whole royal palace was full of festivity."
    notes:
      "n1": "It happens when the news spreads that Janaki (Sita) is expecting a child. The people of the city also hold festivities in their own homes."
  "bn-5753":
    native: "Fallen in open battle, the crest-jewel of heroes"
    notes:
      "n1": "The first line of the epic. It speaks of the hero Birbahu, who has gone untimely to the house of death, and the poet then asks the goddess of poetry which hero the king of the demons chose as commander."
  "bn-5754":
    native: "Who wants to live without freedom?"
    notes:
      "n1": "The Bengali Wikipedia article says this part of the poem was very famous among the revolutionaries of the Swadeshi period. The next line asks who would put the chain of slavery on his feet."
  "bn-5755":
    native: "The second watch of the night, the world silent."
    notes:
      "n1": "The first line of the long poem about the Battle of Plassey. It opens at night in the council house of Jagat Seth in Murshidabad, with clouds and lightning overhead."
  "bn-5756":
    native: "A poor man's word holds good when it is stale."
    notes:
      "n1": "Sadhucharan says this to his master, the landowner Golok Chandra Basu, after reminding him that he had advised leaving the village long ago. The saying means that a poor man's advice is only heeded when it is already old."
  "bn-5757":
    native: "Boatman, how far can you go today?"
    notes:
      "n1": "An old passenger asks this of the boatman on a boat returning from Gangasagar on a foggy night. The passengers speak in everyday words, while the narrator writes in the formal book style."
  "bn-5758":
    native: "Gopal is well-behaved; Rakhal is not like that."
    notes:
      "n1": "The lesson sets a well-behaved boy, Gopal, against Rakhal, who does not listen to his parents, plays on the way to school and loses his books. It ends by saying that no boy should be like Rakhal."
  "bn-5759":
    native: "Baburam Babu of Baidyabati was very worldly."
    notes:
      "n1": "The first sentence of the novel. It introduces Baburam Babu, who made money working in the law courts, after which friends and flatterers crowded his sitting room."
  "bn-5760":
    native: "O Bengal, in your storehouse there are many kinds of jewels."
    notes:
      "n1": "The first line of the sonnet that opens the book. The poet says he ignored these jewels and went begging in foreign lands; then in a dream the goddess of the family tells him to go home, and he finds a mine of gems in his mother tongue."
  "bn-5761":
    native: "Always, river, you come to my mind."
    notes:
      "n1": "The poet speaks to the river of his home from far away. He says that he has seen many rivers in many lands, but no water quenches his thirst of love like yours."
  "bn-5762":
    native: "In the city of Varanasi there lived a very mighty king named Pratapamukuta."
    notes:
      "n1": "The first sentence of the first story, in Vidyasagar's Bengali version of the tales of the vampire Betal. The Wikisource page names Vidyasagar as the translator and gives the original author as unknown."
  "bn-5763":
    native: "I bow to the Mother: well watered, richly fruited, cooled by the Malay breeze, dark with crops, Mother."
    notes:
      "n1": "In the novel the monk Bhabananda sings these lines on a moonlit night. The book's note gives the tune as Mallar in Kawwali tal. The English Wikipedia article names Bankim Chandra as the composer of Vande Mataram."
  "bn-5764":
    native: "Soon a summer storm rushed in with a great roar."
    notes:
      "n1": "A horseman is riding alone from Bishnupur toward Mandaran as evening falls, and darkness and lightning close in. It is the opening scene of the novel."
