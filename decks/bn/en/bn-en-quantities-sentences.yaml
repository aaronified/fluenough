kind: "layer"
core: "bn-quantities-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Quantities: sentences"
description: "Short sentences for the grocer's and the kitchen. They unlock once their words and rules are known. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-1334":
    native: "I buy a kilo of potatoes."
    notes:
      "n1": "কিলো (kilo), kilo, stays unchanged after এক (ek), one, and before the item আলু (ālu), potatoes."
  "bn-1335":
    native: "How much is a dozen eggs?"
    notes:
      "n1": "কত (kôto), how much, asks the price: এক ডজন ডিম কত (ek ḍôjon ḍim kôto) is 'how much is a dozen eggs'."
  "bn-1336":
    native: "Please give me a packet of tea."
    notes:
      "n1": "এক প্যাকেট (ek pêkeṭ), a packet of, puts the measure word between the number and চা (cā), tea."
  "bn-1337":
    native: "Father brings a litre of milk. (respectful)"
    notes:
      "n1": "আনেন (ānen) is the respectful present of আনা (ānā), to bring; বাবা (bābā), father, is the subject."
  "bn-1338":
    native: "There is plenty of fish in the market."
    notes:
      "n1": "প্রচুর (procur), plenty, comes before the noun মাছ (māch), fish."
    bases:
      "আছে": "to be; there is"
  "bn-1339":
    native: "There is a little sugar at home."
    notes:
      "n1": "ঘরে (ghôre) is the locative of ঘর (ghôr), room, with the ending -ে (-e)."
    bases:
      "আছে": "to be; there is"
  "bn-1340":
    native: "Please give me a few bananas."
    notes:
      "n1": "কয়েকটা (kôyekṭā) is কয়েক (kôyek), a few, with -টা (ṭā) for things."
  "bn-1341":
    native: "How much per kilo?"
    notes:
      "n1": "প্রতি (proti), per, comes before the unit: প্রতি কিলো (proti kilo) is 'per kilo'."
  "bn-1342":
    native: "Please give me another plate."
    notes:
      "n1": "আরেকটা (ārekṭā) is আরেক (ārek), another, with -টা (ṭā) for a single thing."
  "bn-1343":
    native: "I drink tea twice."
    notes:
      "n1": "দুবার (dubār) means 'twice'; বার (bār) counts occasions."
    bases:
      "দুবার": "twice"
  "bn-1344":
    native: "There is not a drop of water."
    notes:
      "n1": "ফোঁটা (phom̐ṭā), drop, is the counter in এক ফোঁটা (ek phom̐ṭā), one drop."
    bases:
      "নেই": "there is not"
  "bn-1345":
    native: "There are no mosquitoes in the room."
    notes:
      "n1": "কোনো (kono), any, with নেই (nei), there is not, means 'no' or 'not any'."
    bases:
      "নেই": "there is not"
  "bn-1346":
    native: "Please give me a piece of bread."
    notes:
      "n1": "এক টুকরো (ek ṭukro), a piece of, puts the measure word টুকরো (ṭukro) before the item রুটি (ruṭi), bread."
  "bn-1347":
    native: "You take half. (respectful)"
    notes:
      "n1": "অর্ধেকটা (ôrdhekṭā) is অর্ধেক (ôrdhek), half, with -টা (ṭā) for one portion."
  "bn-1348":
    native: "Please add a little salt."
    notes:
      "n1": "সামান্য (śāmānno), a little, comes before the noun নুন (nun), salt."
  "bn-1349":
    native: "This is my share."
  "bn-1350":
    native: "How much is a pair of shoes?"
    notes:
      "n1": "জোড়া (joṛā), pair, is the counter in এক জোড়া (ek joṛā), a pair of, before জুতো (juto), shoes."
  "bn-1351":
    native: "There are many mangoes in the basket."
    notes:
      "n1": "ঝুড়িতে (jhuṛite) is ঝুড়ি (jhuṛi), basket, with the locative ending -তে (-te)."
    bases:
      "আছে": "to be; there is"
