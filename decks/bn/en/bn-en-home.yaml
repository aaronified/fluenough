schema: 1
id: "bn-en-home"
kind: "layer"
core: "bn-home"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Home and neighbourhood"
description: "The rooms of a flat, what is in them, and the neighbourhood around it. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-0594":
    native: "flat; apartment"
    notes:
      "n1": "Where you live now, a flat or a house, is also বাসা (bāśā); বাড়ি (bāṛi) is the house, or the family home."
  "bn-0595":
    native: "kitchen"
    notes:
      "n1": "রান্না (rānnā), cooking, and ঘর (ghôr), room."
  "bn-0596":
    native: "bedroom"
    notes:
      "n1": "'The room for lying down'. Also শোবার ঘর (śobār ghôr)."
  "bn-0597":
    native: "living room"
    notes:
      "n1": "'The room for sitting'."
  "bn-0598":
    native: "bathroom"
    notes:
      "n1": "Everyone says বাথরুম (bāthrum). The Bengali words are স্নানঘর (snānghor) and গোসলখানা (gośolkhānā)."
  "bn-0599":
    native: "door"
  "bn-0600":
    native: "window"
    notes:
      "n1": "In speech also জানলা (jānlā)."
  "bn-0601":
    native: "balcony; veranda"
  "bn-0602":
    native: "roof; roof terrace"
    notes:
      "n1": "Flat roofs are lived on: people dry clothes and fly kites on the ছাদ (chād)."
  "bn-0603":
    native: "stairs"
  "bn-0604":
    native: "floor; storey"
    notes:
      "n1": "Counted from the ground: একতলা (ektolā) is the ground floor, দোতলা (dotolā) the one above. আমি দোতলায় থাকি (āmi dotolāy thāki), I live one floor up."
  "bn-0605":
    native: "key"
  "bn-0606":
    native: "bed"
  "bn-0607":
    native: "chair"
  "bn-0608":
    native: "table"
  "bn-0609":
    native: "fan"
    notes:
      "n1": "Also ফ্যান (phên), from English."
  "bn-0610":
    native: "neighbourhood"
    notes:
      "n1": "পাড়ার দোকান (pāṛār dokān), the local shop."
  "bn-0611":
    native: "neighbour"
  "bn-0612":
    native: "There's a park in front of the house."
    notes:
      "n1": "'In front of the house' is বাড়ির সামনে (bāṛir śāmne): the house takes -র (-rô), and সামনে (śāmne) comes after it. আছে (āche), 'there is', comes last."
    bases:
      "আছে": "to be; there is"
  "bn-0613":
    native: "Our neighbourhood is very quiet."
    notes:
      "n1": "No 'is': 'our neighbourhood very quiet'."
  "bn-0196":
    native: "house; home"
    notes:
      "n1": "Where you live now is also বাসা (bāśā); বাড়ি (bāṛi) is the house, or the family home."
  "bn-0051":
    native: "room"
  "bn-0615":
    native: "light"
  "bn-0616":
    native: "cupboard; wardrobe"
  "bn-0283":
    native: "rent"
    notes:
      "n1": "Also the fare for a bus or a taxi."
