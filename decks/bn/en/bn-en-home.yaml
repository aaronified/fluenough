schema: 1
id: "bn-en-home"
kind: "layer"
core: "bn-home"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Home and neighbourhood"
description: "The rooms of a flat, what is in them, and the neighbourhood around it. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-0594":
    native: "flat; apartment"
    notes:
      "n1": "Where you live now, a flat or a house, is also বাসা (bāśā); বাড়ি (bāṛi) is the house, or the family home."
    "examples": {
      "ফ্ল্যাটটা খোলামেলা।": {"native": "The flat is airy.", "bases": {"ফ্ল্যাটটা": "flat; apartment"}},
      "এই ভবনে অনেক ফ্ল্যাট আছে।": {"native": "There are many flats in this building.", "bases": {"এই": "this", "ভবনে": "building", "আছে": "there are", "ফ্ল্যাট": "flat; apartment"}}
    }
  "bn-0595":
    native: "kitchen"
    notes:
      "n1": "রান্না (rānnā), cooking, and ঘর (ghôr), room."
    "examples": {
      "রান্নাঘরটা ঝকঝকে।": {"native": "The kitchen is spotless.", "bases": {"রান্নাঘরটা": "kitchen"}},
      "রান্নাঘরে ওভেন নতুন।": {"native": "The oven in the kitchen is new.", "bases": {"রান্নাঘরে": "kitchen"}}
    }
  "bn-0596":
    native: "bedroom"
    notes:
      "n1": "'The room for lying down'. Also শোবার ঘর (śobār ghôr)."
  "bn-0597":
    native: "living room"
    notes:
      "n1": "'The room for sitting'."
  "bn-0598":
    native: "bathroom"
    notes:
      "n1": "Everyone says বাথরুম (bāthrum). The Bengali words are স্নানঘর (snānghor) and গোসলখানা (gośolkhānā)."
    "examples": {
      "বাথরুম কোথায়?": {"native": "Where is the toilet?", "bases": {}}
    }
  "bn-0599":
    native: "door"
    "examples": {
      "দরজাটা টানুন।": {"native": "Pull the door. (respectful)", "bases": {"টানুন": "pull (respectful)", "দরজাটা": "door"}},
      "দরজাটা ঠেলুন।": {"native": "Please push the door. (respectful)", "bases": {"ঠেলুন": "push (respectful)", "দরজাটা": "door"}}
    }
  "bn-0600":
    native: "window"
    notes:
      "n1": "In speech also জানলা (jānlā)."
    "examples": {
      "জানালাটা বন্ধ করুন।": {"native": "Please close the window. (respectful)", "bases": {"জানালাটা": "window"}},
      "জানালায় নীল পর্দা।": {"native": "A blue curtain on the window.", "bases": {"জানালায়": "window"}}
    }
  "bn-0601":
    native: "balcony; veranda"
    "examples": {
      "বারান্দাটা খুব খোলামেলা।": {"native": "The balcony is very airy.", "bases": {"বারান্দাটা": "balcony; veranda"}},
      "অ্যাপার্টমেন্টে বড় বারান্দা আছে।": {"native": "The apartment has a big balcony.", "bases": {"অ্যাপার্টমেন্টে": "apartment", "আছে": "has", "বারান্দা": "balcony; veranda"}}
    }
  "bn-0602":
    native: "roof; roof terrace"
    notes:
      "n1": "Flat roofs are lived on: people dry clothes and fly kites on the ছাদ (chād)."
    "examples": {
      "নিচু ছাদ।": {"native": "A low roof.", "bases": {}},
      "ছাদে কাপড় শুকাও।": {"native": "Dry the clothes on the roof. (familiar)", "bases": {"ছাদে": "on the roof", "শুকাও": "dry"}}
    }
  "bn-0603":
    native: "stairs"
    "examples": {
      "ছেলেটা সিঁড়ি দিয়ে নামে।": {"native": "The boy goes down the stairs.", "bases": {"দিয়ে": "by; through", "নামে": "gets down", "সিঁড়ি": "stairs"}}
    }
  "bn-0604":
    native: "floor; storey"
    notes:
      "n1": "Counted from the ground: একতলা (ektolā) is the ground floor, দোতলা (dotolā) the one above. আমি দোতলায় থাকি (āmi dotolāy thāki), I live one floor up."
  "bn-0605":
    native: "key"
    "examples": {
      "চাবি কোথায়?": {"native": "Where is the key?", "bases": {}},
      "চাবিটা ঘোরাও।": {"native": "Turn the key. (familiar)", "bases": {"ঘোরাও": "turn (familiar)", "চাবিটা": "key"}}
    }
  "bn-0606":
    native: "bed"
    "examples": {
      "বিছানাটা ছিমছাম।": {"native": "The bed is neat.", "bases": {"বিছানাটা": "bed"}},
      "আপনি বিছানাটা করুন।": {"native": "Please make the bed. (respectful)", "bases": {"বিছানাটা": "bed"}}
    }
  "bn-0607":
    native: "chair"
    "examples": {
      "চেয়ারটা সরাও।": {"native": "Move the chair aside. (familiar)", "bases": {"সরাও": "to move aside", "চেয়ারটা": "chair"}},
      "চেয়ারটা ফাঁকা, বসো।": {"native": "The chair is empty, sit down. (familiar)", "bases": {"চেয়ারটা": "chair"}}
    }
  "bn-0608":
    native: "table"
    "examples": {
      "কাঠের টেবিল": {"native": "a wooden table", "bases": {"কাঠের": "wood"}},
      "টেবিলটা আঠালো।": {"native": "The table is sticky.", "bases": {"টেবিলটা": "table"}}
    }
  "bn-0609":
    native: "fan"
    notes:
      "n1": "Also ফ্যান (phên), from English."
    "examples": {
      "আমি পাখাটা নেভাই।": {"native": "I switch off the fan.", "bases": {"নেভাই": "switch off (I switch off)", "পাখাটা": "fan"}},
      "সিলিংয়ের পাখাটা ঢিলে।": {"native": "The ceiling fan is loose.", "bases": {"পাখাটা": "fan"}}
    }
  "bn-0610":
    native: "neighbourhood"
    notes:
      "n1": "পাড়ার দোকান (pāṛār dokān), the local shop."
    "examples": {
      "আমাদের পাড়াটা খুব শান্ত।": {"native": "Our neighbourhood is very quiet.", "bases": {"পাড়াটা": "neighbourhood"}}
    }
  "bn-0611":
    native: "neighbour"
    "examples": {
      "ভারত বাংলাদেশের প্রতিবেশী।": {"native": "India is a neighbour of Bangladesh.", "bases": {"প্রতিবেশী": "neighbour"}},
      "আমাদের প্রতিবেশী খুব রাগী।": {"native": "Our neighbour is very short-tempered.", "bases": {"প্রতিবেশী": "neighbour"}}
    }
  "bn-0612":
    native: "There's a park in front of the house."
    notes:
      "n1": "'In front of the house' is বাড়ির সামনে (bāṛir śāmne): the house takes -র (-rô), and সামনে (śāmne) comes after it. আছে (āche), 'there is', comes last."
    bases:
      "আছে": "to be; there is"
  "bn-0613":
    native: "Our neighbourhood is very quiet."
    notes:
      "n1": "No 'is': 'our neighbourhood very quiet'."
  "bn-0196":
    native: "house; home"
    notes:
      "n1": "Where you live now is also বাসা (bāśā); বাড়ি (bāṛi) is the house, or the family home."
  "bn-0051":
    native: "room"
    "examples": {
      "ঘরটা অন্ধকার।": {"native": "The room is dark.", "bases": {"ঘরটা": "room"}}
    }
  "bn-0615":
    native: "light"
    "examples": {
      "আলো নেভান।": {"native": "Please switch off the light. (respectful)", "bases": {"নেভান": "switch off (respectful)", "আলো": "light"}},
      "আলোটা খুব উজ্জ্বল।": {"native": "The light is very bright.", "bases": {"আলোটা": "light"}}
    }
  "bn-0616":
    native: "cupboard; wardrobe"
    "examples": {
      "আলমারিটা ধুলোমাখা।": {"native": "The cupboard is dusty.", "bases": {"আলমারিটা": "cupboard; wardrobe"}},
      "আলমারিটা বইয়ে ঠাসা।": {"native": "The cupboard is crammed with books.", "bases": {"আলমারিটা": "cupboard; wardrobe"}}
    }
  "bn-0283":
    native: "rent"
    notes:
      "n1": "Also the fare for a bus or a taxi."
