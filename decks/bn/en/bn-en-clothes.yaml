native: { code: "en", iso639_3: "eng", name: "English" }
name: "Clothes and colours"
description: "What people wear, from the sari, the panjabi and the lungi to shoes and jewellery, and the colours of it all. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC0-1.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-1188":
    native: "cloth; clothes"
    wiktionary: true
    notes:
      "n1": "It is cloth and also the clothes you wear: {1}, to dress; {2}, to wash clothes."
  "bn-1189":
    native: "shirt; dress; any garment"
    wiktionary: true
    notes:
      "n1": "A shirt, a blouse, a child's frock: any garment for the top of the body. {1} is clothes in general. A word from Persian."
  "bn-1190":
    native: "shirt"
    wiktionary: true
    notes:
      "n1": "A word from English; a shirt with buttons, as against a {1}."
  "bn-1191":
    native: "trousers"
    notes:
      "n1": "A word from English. It is singular in form: {1}, to wear trousers."
  "bn-1192":
    native: "sari"
    wiktionary: true
    notes:
      "n1": "The sari, a long cloth wrapped round the body, is worn by many Bengali women. {1} is to wear one."
  "bn-1193":
    native: "panjabi (a long loose shirt for men)"
    notes:
      "n1": "A long loose shirt worn by men at festivals and weddings, often with a {1}. The same word also means a person from Punjab."
  "bn-1194":
    native: "dhoti"
    wiktionary: true
    notes:
      "n1": "A long cloth wrapped round the waist and the legs, worn by men on festive days."
  "bn-1195":
    native: "lungi"
    wiktionary: true
    notes:
      "n1": "A cloth tied round the waist and worn as an everyday garment by many men, above all in Bangladesh."
  "bn-1196":
    native: "shoes"
    wiktionary: true
    notes:
      "n1": "A pair is {1}. {2} is to put on shoes."
  "bn-1197":
    native: "sandals; slippers"
    notes:
      "n1": "Open footwear for everyday wear. {1} are flip-flops."
  "bn-1198":
    native: "socks"
    wiktionary: true
    notes:
      "n1": "A word from Persian. A pair of socks is {1}."
  "bn-1199":
    native: "cap; hat"
    wiktionary: true
    notes:
      "n1": "The white cap worn by many Muslim men to pray is also a {1}."
  "bn-1200":
    native: "gamchha (a thin cotton towel)"
    wiktionary: true
    notes:
      "n1": "The thin checked cotton towel of Bengal, used after a bath and in the fields. From {1}, body, and {2}, to wipe."
  "bn-1201":
    native: "jewellery"
    wiktionary: true
    notes:
      "n1": "{1} is to wear jewellery. It is singular in form and means all of it."
  "bn-1202":
    native: "necklace"
    wiktionary: true
    notes:
      "pair": "Only the last sound differs: {1} is a necklace and {2} a bone."
      "n2": "The same word also means defeat: {1}, to admit defeat."
  "bn-1203":
    native: "colour; paint"
    wiktionary: true
    notes:
      "n1": "Also spelled {1}. In a shop it is both the colour of a thing and a tin of paint."
  "bn-1204":
    native: "red"
    wiktionary: true
    notes:
      "n1": "{1}, 'red tea', is tea without milk."
  "bn-1205":
    native: "blue"
    wiktionary: true
    notes:
      "n1": "The word is also indigo, the dye that Bengal's farmers were forced to grow, until the Indigo Revolt of 1859."
  "bn-1206":
    native: "green"
    wiktionary: true
    notes:
      "n1": "The green of the rice fields. It also means fresh and young, and a word of Persian origin."
  "bn-1207":
    native: "white"
    wiktionary: true
    notes:
      "n1": "It also means plain: {1} is a blank sheet of paper."
  "bn-1208":
    native: "black"
    wiktionary: true
    notes:
      "n1": "It is black and dark: {1}, black hair."
  "bn-1209":
    native: "brown"
    wiktionary: true
    notes:
      "n1": "From {1}, almond or nut, with {2}: 'like an almond'."
  "bn-1210":
    native: "pink"
    notes:
      "n1": "From {1}, rose, with {2}: 'like a rose'."
  "bn-1211":
    native: "grey"
    wiktionary: true
    notes:
      "n1": "A word from Sanskrit. In speech people also say {1}, 'the colour of ash'."
