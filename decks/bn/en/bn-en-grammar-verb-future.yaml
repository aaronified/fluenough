schema: 1
id: "bn-en-grammar-verb-future"
kind: "layer"
core: "bn-grammar-verb-future"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Verbs: what I, you, he, she will do"
description: "Every verb the course teaches, in the simple future for something that will happen, for each person and each level of respect. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "person"
  slots:
    "ami": "I or we, in the future"
    "tui": "you (intimate), in the future"
    "tumi": "you (familiar), in the future"
    "apni": "you (respectful), in the future"
    "se": "he, she or they, in the future"
    "tini": "he or she (respectful), in the future"
rules:
  "bn-rule-future-first":
    name: "-ব (-bô), -বো (-bo): I, we"
    explanation: "{1} joins the stem and is for 'I' and for 'we' alike; {2} is the same ending written with the vowel sign for o, a second form of it: {3}, {4}. The stem is the one the present uses after 'I': {5} gives {6}. A few verbs change their stem: {7} gives {8}, {9} gives {10}, and {11} gives {12}. One form serves for something that will happen."
  "bn-rule-future-second":
    name: "-বি (-bi), -বে (-be), -বেন (-ben): you"
    explanation: "The three words for you keep their three endings in the future, and the stem does not change between them. {1}, for a friend or a younger person, takes {2}: {3}. {4}, the familiar one, takes {5}: {6}. {7}, the respectful one, takes {8}: {9}. A verb with a changed stem keeps it: {10}, {11}, {12}."
  "bn-rule-future-third":
    name: "-বে (-be), -বেন (-ben): he, she, they"
    explanation: "For someone who is not there, {1} is the ordinary ending: {2}, {3}. It does not change for one or for many. For someone you respect it is {4}, as for {5}: {6}. A verb with a changed stem keeps it: {7}, {8}."
