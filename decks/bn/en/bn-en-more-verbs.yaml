core: "bn-more-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More verbs"
description: "Cooking and washing, cutting and pouring, holding, sending and losing, going and returning, and the verbs of the body: run, jump, fly, cry. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC0-1.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-1099":
    native: "to cook (rice, curry)"
    wiktionary: true
    notes:
      "n1": "It is for cooking a meal; the noun is {1}, cooking, and a cook is a {2}."
  "bn-1100":
    native: "to wash"
    wiktionary: true
    notes:
      "n1": "Its stem changes in nearly every form: {1}, I wash, {2}, you wash, {3}, he washes, and {4}, please wash. It is also written {5}."
  "bn-1101":
    native: "to cut"
    wiktionary: true
    notes:
      "n1": "It also means to swim, in the phrase {1}, literally 'to cut swimming'."
  "bn-1102":
    native: "to break"
    wiktionary: true
    notes:
      "n1": "It is to break something. To get broken, as a cup does, is {1}."
  "bn-1103":
    native: "to throw; to drop"
    wiktionary: true
    notes:
      "pair": "Not {1}, to return: {2} has an l, {1} an r."
      "n2": "After another verb it shows that something is done completely: {1}, to eat it all up."
  "bn-1104":
    native: "to lift; to pick up; to take (a photo)"
    wiktionary: true
    notes:
      "n1": "The stem's vowel changes: {1}, I lift, but {2}, you lift. It is also the verb for taking a photo: {3}."
  "bn-1105":
    native: "to look for; to search"
    wiktionary: true
    notes:
      "n1": "The noun {1} is a search and news about someone: {2} is to ask after a person."
  "bn-1106":
    native: "to lose; to get lost"
    wiktionary: true
    notes:
      "n1": "It is to lose a thing and also to be lost oneself: {1}, 'I have got lost'."
  "bn-1107":
    native: "to hold; to catch"
    wiktionary: true
    notes:
      "n1": "It is to hold, to catch and to grasp: {1}, to hold a hand. Among close friends {2} is also 'here, take it'."
  "bn-1108":
    native: "to send"
    wiktionary: true
    notes:
      "n1": "It is to send a thing or a person: {1}, to send money."
  "bn-1109":
    native: "to arrive; to reach"
    wiktionary: true
    notes:
      "n1": "It is to arrive at a place or to reach it: {1}, to reach the station."
  "bn-1110":
    native: "to return"
    wiktionary: true
    notes:
      "pair": "Not {1}, to throw: {2} has an r, {1} an l."
      "n2": "The stem's vowel changes: {1}, I return, but {2}, he returns. {3} is to come home."
  "bn-1111":
    native: "to stop"
    wiktionary: true
    notes:
      "pair": "Not {1}, police station: only the middle consonant differs."
      "n2": "It is to stop by itself, as a bus or the rain does. To make something stop is {1}."
  "bn-1112":
    native: "to pour"
    wiktionary: true
    notes:
      "n1": "It is to pour a liquid: {1}, to pour water."
  "bn-1113":
    native: "to count"
    wiktionary: true
    notes:
      "n1": "The stem's vowel changes: {1}, I count, but {2}, you count."
  "bn-1114":
    native: "to teach"
    wiktionary: true
    notes:
      "n1": "It is {1}, to learn, with {2} added: the form that means 'to make someone learn'."
  "bn-1115":
    native: "to run"
    wiktionary: true
    notes:
      "n1": "The noun {1} is a run or a race."
  "bn-1116":
    native: "to fly"
    wiktionary: true
    notes:
      "pair": "Not {1}, those people: the middle sound of {2} is a flap, and {1} has an ordinary r."
      "n2": "The stem's vowel changes: {1}, I fly, but {2}, it flies. A bird or a kite flies."
  "bn-1117":
    native: "to jump"
    wiktionary: true
    notes:
      "n1": "It is to jump or leap: a child, a frog and a goat all {1}."
  "bn-1118":
    native: "to think"
    wiktionary: true
    notes:
      "pair": "Not {1}, father: {2} has a puff of breath on its first sound."
      "n2": "It is to think and to worry. The noun {1} is a thought or a worry."
  "bn-1119":
    native: "to cry"
    wiktionary: true
    notes:
      "n1": "The noun is {1}, crying."
  "bn-1120":
    native: "to lie down; to go to bed"
    wiktionary: true
    notes:
      "n1": "It is said exactly like {1}, 'a quarter past'. Its stem changes: {2}, I lie down, {3}, you lie down. It is also written {4}."
  "bn-1121":
    native: "to wipe"
    wiktionary: true
    notes:
      "n1": "It is to wipe a table, a floor or one's face: {1}, to mop a room."
  "bn-1122":
    native: "to turn; to walk around"
    wiktionary: true
    notes:
      "n1": "{1} is to go out and come back, for a walk or a trip. The polite request {2} means 'please turn'."
