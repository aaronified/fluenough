schema: 1
id: "bn-en-more-verbs"
kind: "layer"
core: "bn-more-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More verbs"
description: "Cooking and washing, cutting and pouring, holding, sending and losing, going and returning, and the verbs of the body: run, jump, fly, cry. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-1099":
    native: "to cook (rice, curry)"
    wiktionary: true
    notes:
      "n1": "It is for cooking a meal; the noun is {1}, cooking, and a cook is a {2}."
    "examples": {
      "মা ভাত রাঁধেন।": {"native": "Mother cooks rice. (respectful)", "bases": {"রাঁধেন": "to cook (rice, curry)"}},
      "আজ ডালনা রাঁধা হয়েছে।": {"native": "Dalna has been cooked today.", "bases": {"রাঁধা": "to cook (rice, curry)"}}
    }
  "bn-1100":
    native: "to wash"
    wiktionary: true
    notes:
      "n1": "Its stem changes in nearly every form: {1}, I wash, {2}, you wash, {3}, he washes, and {4}, please wash. It is also written {5}."
    "examples": {
      "আপনি হাত ধুন।": {"native": "Please wash your hands.", "bases": {"ধুন": "to wash"}},
      "আমি হাত ধুই।": {"native": "I wash my hands.", "bases": {"ধুই": "to wash"}}
    }
  "bn-1101":
    native: "to cut"
    wiktionary: true
    notes:
      "n1": "It also means to swim, in the phrase {1}, literally 'to cut swimming'."
    "examples": {
      "টিকিটটা কাটো।": {"native": "Buy the ticket. (familiar)", "bases": {"কাটো": "to cut"}},
      "আগাম টিকিট কাটো।": {"native": "Buy the ticket in advance. (familiar)", "bases": {"কাটো": "buy"}}
    }
  "bn-1102":
    native: "to break"
    wiktionary: true
    notes:
      "n1": "It is to break something. To get broken, as a cup does, is {1}."
    "examples": {
      "কিবোর্ডটা ভাঙা।": {"native": "The keyboard is broken.", "bases": {"কিবোর্ডটা": "keyboard", "ভাঙা": "to break"}},
      "বেঞ্চটা ভেঙেছে।": {"native": "The bench has broken.", "bases": {"বেঞ্চটা": "bench", "ভেঙেছে": "to break"}}
    }
  "bn-1103":
    native: "to throw; to drop"
    wiktionary: true
    notes:
      "pair": "Not {1}, to return: {2} has an l, {1} an r."
      "n2": "After another verb it shows that something is done completely: {1}, to eat it all up."
    "examples": {
      "অস্ত্রটা ফেলে দাও।": {"native": "Put the weapon down. (familiar)", "bases": {"অস্ত্রটা": "weapon", "ফেলে": "to throw; to drop"}},
      "খোসাগুলো ফেলে দিন।": {"native": "Throw away the peels.", "bases": {"খোসাগুলো": "peel; skin of a fruit or vegetable", "ফেলে": "to throw; to drop"}}
    }
  "bn-1104":
    native: "to lift; to pick up; to take (a photo)"
    wiktionary: true
    notes:
      "n1": "The stem's vowel changes: {1}, I lift, but {2}, you lift. It is also the verb for taking a photo: {3}."
    "examples": {
      "ফটোগ্রাফ তোলো।": {"native": "Take a photograph. (familiar)", "bases": {"তোলো": "to lift; to pick up; to take (a photo)"}},
      "ফসল তুলেছি।": {"native": "I have gathered the crop.", "bases": {"তুলেছি": "to lift; to pick up; to take (a photo)"}}
    }
  "bn-1105":
    native: "to look for; to search"
    wiktionary: true
    notes:
      "n1": "The noun {1} is a search and news about someone: {2} is to ask after a person."
    "examples": {
      "চাকরি খোঁজো।": {"native": "Look for a job. (familiar)", "bases": {"খোঁজো": "to look for; to search"}},
      "আমি চাকরি খুঁজছি।": {"native": "I am looking for a job.", "bases": {"খুঁজছি": "looking"}}
    }
  "bn-1106":
    native: "to lose; to get lost"
    wiktionary: true
    notes:
      "n1": "It is to lose a thing and also to be lost oneself: {1}, 'I have got lost'."
    "examples": {
      "আমার ব্যাগপত্র হারিয়েছে।": {"native": "My bags have been lost.", "bases": {"হারিয়েছে": "lost"}},
      "আমি হারিয়ে গেছি।": {"native": "I'm lost.", "bases": {"হারিয়ে": "to lose; to get lost"}}
    }
  "bn-1107":
    native: "to hold; to catch"
    wiktionary: true
    notes:
      "n1": "It is to hold, to catch and to grasp: {1}, to hold a hand. Among close friends {2} is also 'here, take it'."
    "examples": {
      "ফোনটা ধরো।": {"native": "Answer the phone. (familiar)", "bases": {"ধরো": "to hold; to catch"}}
    }
  "bn-1108":
    native: "to send"
    wiktionary: true
    notes:
      "n1": "It is to send a thing or a person: {1}, to send money."
    "examples": {
      "জীবনবৃত্তান্তটা পাঠাও।": {"native": "Send the CV. (familiar)", "bases": {"জীবনবৃত্তান্তটা": "CV", "পাঠাও": "to send"}},
      "আজই টাকা পাঠাও।": {"native": "Send the money today. (familiar)", "bases": {"আজই": "today itself", "পাঠাও": "to send"}}
    }
  "bn-1109":
    native: "to arrive; to reach"
    wiktionary: true
    notes:
      "n1": "It is to arrive at a place or to reach it: {1}, to reach the station."
    "examples": {
      "কখন পৌঁছাবে?": {"native": "When will you arrive? (familiar)", "bases": {"পৌঁছাবে": "to arrive; to reach"}}
    }
  "bn-1110":
    native: "to return"
    wiktionary: true
    notes:
      "pair": "Not {1}, to throw: {2} has an r, {1} an l."
      "n2": "The stem's vowel changes: {1}, I return, but {2}, he returns. {3} is to come home."
    "examples": {
      "অবশেষে সে ফিরেছে।": {"native": "She has returned at last.", "bases": {"ফিরেছে": "returned"}},
      "আমরা বাড়ি ফিরি।": {"native": "We return home.", "bases": {"ফিরি": "to return"}}
    }
  "bn-1111":
    native: "to stop"
    wiktionary: true
    notes:
      "pair": "Not {1}, police station: only the middle consonant differs."
      "n2": "It is to stop by itself, as a bus or the rain does. To make something stop is {1}."
    "examples": {
      "বাস এখানে থামে।": {"native": "The bus stops here.", "bases": {"থামে": "to stop"}},
      "বাসটা এখানে থামে।": {"native": "The bus stops here.", "bases": {"থামে": "to stop"}}
    }
  "bn-1112":
    native: "to pour"
    wiktionary: true
    notes:
      "n1": "It is to pour a liquid: {1}, to pour water."
    "examples": {
      "জল ঢালুন।": {"native": "Please pour the water.", "bases": {"ঢালুন": "to pour"}}
    }
  "bn-1113":
    native: "to count"
    wiktionary: true
    notes:
      "n1": "The stem's vowel changes: {1}, I count, but {2}, you count."
    "examples": {
      "ক্যাশিয়ার টাকা গুনছেন।": {"native": "The cashier is counting the money.", "bases": {}},
      "আমি তিনটে আপেল গুনি।": {"native": "I count three apples.", "bases": {"গুনি": "to count"}}
    }
  "bn-1114":
    native: "to teach"
    wiktionary: true
    notes:
      "n1": "It is {1}, to learn, with {2} added: the form that means 'to make someone learn'."
    "examples": {
      "উন্নতির জন্য শেখো।": {"native": "Learn for improvement. (familiar)", "bases": {"উন্নতির": "progress; improvement", "জন্য": "for", "শেখো": "to teach"}},
      "কোড লেখা শেখো।": {"native": "Learn to write code. (familiar)", "bases": {"শেখো": "to teach"}}
    }
  "bn-1115":
    native: "to run"
    wiktionary: true
    notes:
      "n1": "The noun {1} is a run or a race."
    "examples": {
      "পশুটা দৌড়াচ্ছে।": {"native": "The animal is running.", "bases": {"পশুটা": "animal (large or wild)", "দৌড়াচ্ছে": "to run"}},
      "ছেলেরা মাঠে দৌড়ায়।": {"native": "The boys run in the field.", "bases": {"দৌড়ায়": "to run"}}
    }
  "bn-1116":
    native: "to fly"
    wiktionary: true
    notes:
      "pair": "Not {1}, those people: the middle sound of {2} is a flap, and {1} has an ordinary r."
      "n2": "The stem's vowel changes: {1}, I fly, but {2}, it flies. A bird or a kite flies."
    "examples": {
      "মৌমাছিটা উড়ছে।": {"native": "The honeybee is flying.", "bases": {"মৌমাছিটা": "honeybee", "উড়ছে": "to fly"}},
      "আকাশে ঘুড়ি উড়ছে।": {"native": "A kite is flying in the sky.", "bases": {"উড়ছে": "to fly"}}
    }
  "bn-1117":
    native: "to jump"
    wiktionary: true
    notes:
      "n1": "It is to jump or leap: a child, a frog and a goat all {1}."
  "bn-1118":
    native: "to think"
    wiktionary: true
    notes:
      "pair": "Not {1}, father: {2} has a puff of breath on its first sound."
      "n2": "It is to think and to worry. The noun {1} is a thought or a worry."
    "examples": {
      "আপনি কী ভাবেন?": {"native": "What do you think? (respectful)", "bases": {"ভাবেন": "to think"}},
      "জলবায়ুর কথা ভাবো।": {"native": "Think about the climate. (familiar)", "bases": {"জলবায়ুর": "climate", "ভাবো": "think"}}
    }
  "bn-1119":
    native: "to cry"
    wiktionary: true
    notes:
      "n1": "The noun is {1}, crying."
    "examples": {
      "আবেগে সে কাঁদল।": {"native": "In her emotion, she cried.", "bases": {"আবেগে": "in emotion", "কাঁদল": "to cry"}},
      "বিদায়ের সময় কাঁদলাম।": {"native": "I cried at the time of farewell.", "bases": {"বিদায়ের": "farewell", "কাঁদলাম": "to cry"}}
    }
  "bn-1120":
    native: "to lie down; to go to bed"
    wiktionary: true
    notes:
      "n1": "It is said exactly like {1}, 'a quarter past'. Its stem changes: {2}, I lie down, {3}, you lie down. It is also written {4}."
  "bn-1121":
    native: "to wipe"
    wiktionary: true
    notes:
      "n1": "It is to wipe a table, a floor or one's face: {1}, to mop a room."
    "examples": {
      "ডাস্টার দিয়ে বোর্ড মোছো।": {"native": "Wipe the board with the duster.", "bases": {"মোছো": "to wipe"}},
      "রাবার দিয়ে ভুল মুছুন।": {"native": "Rub out the mistake with the eraser.", "bases": {"মুছুন": "to wipe"}}
    }
  "bn-1122":
    native: "to turn; to walk around"
    wiktionary: true
    notes:
      "n1": "{1} is to go out and come back, for a walk or a trip. The polite request {2} means 'please turn'."
    "examples": {
      "অবসর নেওয়ার পরে ঘুরবেন।": {"native": "After retiring you will travel.", "bases": {"পরে": "after", "ঘুরবেন": "will travel"}},
      "আমরা শহরটা ঘুরে দেখলাম।": {"native": "We walked round the town and saw it.", "bases": {"ঘুরে": "walking round"}}
    }
