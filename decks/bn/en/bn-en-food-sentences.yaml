kind: "layer"
core: "bn-food-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Food and drink: sentences"
description: "Short sentences about what people eat and drink, and how they ask for it. They unlock once their words and rules are known. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-0990":
    native: "I eat rice, lentils and fish."
  "bn-0991":
    native: "I don't eat meat."
    notes:
      "n1": "না (nā) goes after the verb to make it negative: খাই না (khāi nā), I don't eat."
  "bn-0992":
    native: "Do you eat hilsa? (respectful)"
  "bn-0993":
    native: "He drinks milk.; She drinks milk."
    notes:
      "n1": "খায় (khāy), 'he or she eats', is the form of খাওয়া (khāoā), 'to eat', where the stem changes: the ordinary -ে (-e) ending does not appear."
  "bn-0994":
    native: "Grandfather drinks tea. (respectful)"
  "bn-0995":
    native: "We eat fruit."
  "bn-0996":
    native: "I eat rice with dal."
  "bn-0997":
    native: "I don't take sugar in my tea."
    notes:
      "n1": "চা (cā), tea, becomes চায়ে (cāye) for 'in tea', with a y-sound before the -এ (-e) ending."
  "bn-0998":
    native: "Please give me an apple."
    notes:
      "n1": "একটা (ekṭā), 'a' or 'one', puts the classifier -টা (-ṭā) before the noun, as in একটা আপেল (ekṭā āpel), one apple."
  "bn-0999":
    native: "Two eggs, please."
    notes:
      "n1": "দুটো (duṭo), two, takes the classifier -টো (-ṭo) for things counted: দুটো ডিম (duṭo ḍim), two eggs."
  "bn-1000":
    native: "How much is the fish?"
    notes:
      "n1": "-টা (-ṭā) can also mark a particular item that is known: মাছটা (māchṭā), the fish."
  "bn-1001":
    native: "What do you buy? (respectful)"
    notes:
      "n1": "কেনেন (kenen) is the respectful form of কেনা (kenā), 'to buy', for আপনি (āpni)."
