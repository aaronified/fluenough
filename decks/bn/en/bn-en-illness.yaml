"name": "Illness and the doctor"
"description": "Colds, fevers, pain, the doctor, the medicine and the clinic: what to say when you are ill. Not yet checked by a Bengali speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "bn-1756":
    "native": "illness; sickness"
    "notes":
      "n1": "{1} is any illness, from a cold to a long disease. It is the general word."
    "examples":
      "আমার অসুখ এখন ভালো।":
        "native": "My illness is better now."
        "bases":
          "আমার":
            "meaning": "my"
      "এই অসুখ অনেক দিন ধরে চলছে।":
        "native": "This illness has gone on for many days."
        "bases":
          "এই":
            "meaning": "this"
          "চলছে":
            "meaning": "going on"
  "bn-1757":
    "native": "cold; runny nose"
    "notes":
      "n1": "{1} is a common cold, with a runny or blocked nose. For cold weather, say {2}."
    "examples":
      "আমার সর্দি হয়েছে।":
        "native": "I have a cold."
        "bases":
          "আমার":
            "meaning": "my"
      "সর্দি থাকলে গরম জল খান।": "If you have a cold, drink hot water."
  "bn-1758":
    "native": "cough"
    "notes":
      "n1": "{1} is a cough, dry or with phlegm. Medicine for it is {2}."
    "examples":
      "রাতে আমার খুব কাশি হয়।":
        "native": "At night I have a bad cough."
        "bases":
          "আমার":
            "meaning": "my"
      "কাশির ওষুধ দিন।":
        "native": "Give me a cough medicine."
        "bases":
          "কাশির":
            "meaning": "cough"
  "bn-1759":
    "native": "sneeze"
    "notes":
      "n1": "{1} is a sneeze, a sudden burst of air from the nose."
    "examples":
      "হঠাৎ হাঁচি এল।":
        "native": "A sneeze came suddenly."
        "bases":
          "হঠাৎ":
            "meaning": "suddenly"
      "ঠান্ডা লাগলে হাঁচি হয়।":
        "native": "When you catch a cold, you sneeze."
        "bases":
          "লাগলে":
            "meaning": "catch"
  "bn-1760":
    "native": "vomit; being sick"
    "notes":
      "n1": "{1} is vomit, or the act of being sick."
    "examples":
      "তার বমি হয়েছে।":
        "native": "He has been sick."
        "bases":
          "তার":
            "meaning": "his, her"
      "বমি বন্ধ হলে জল খাবেন।":
        "native": "When the vomiting stops, drink water."
        "bases":
          "বন্ধ":
            "meaning": "stopped"
  "bn-1761":
    "native": "diarrhoea"
    "notes":
      "n1": "{1} is loose, frequent stools. See a doctor if it goes on."
    "examples":
      "ডায়রিয়ার জন্য প্রচুর জল খান।":
        "native": "Drink plenty of water for diarrhoea."
        "bases":
          "ডায়রিয়ার":
            "meaning": "diarrhoea"
          "জন্য":
            "meaning": "for"
          "প্রচুর":
            "meaning": "plenty"
      "দুই দিন ধরে তার ডায়রিয়া হচ্ছে।":
        "native": "He has had diarrhoea for two days."
        "bases":
          "তার":
            "meaning": "his, her"
  "bn-1762":
    "native": "rest"
    "notes":
      "n1": "{1} is rest, time away from work or effort. To take a rest, say {2}."
    "examples":
      "ডাক্তার বললেন কয়েক দিন বিশ্রাম দরকার।":
        "native": "The doctor said a few days of rest are needed."
        "bases":
          "বললেন":
            "meaning": "said"
          "কয়েক":
            "meaning": "a few"
          "দরকার":
            "meaning": "needed"
      "বিশ্রামের পর আমি ভালো বোধ করছি।":
        "native": "After the rest I feel better."
        "bases":
          "বিশ্রামের":
            "meaning": "rest"
          "পর":
            "meaning": "after"
          "বোধ":
            "meaning": "feeling"
  "bn-1763":
    "native": "weak"
    "notes":
      "n1": "{1} is weak, after an illness, a fever or hunger."
    "examples":
      "জ্বরের পর সে খুব দুর্বল।":
        "native": "After the fever he is very weak."
        "bases":
          "পর":
            "meaning": "after"
      "এত দুর্বল লাগছে কেন?":
        "native": "Why do I feel so weak?"
        "bases":
          "এত":
            "meaning": "so"
          "লাগছে":
            "meaning": "feel"
  "bn-1764":
    "native": "clinic"
    "notes":
      "n1": "{1} is a small place where a doctor sees patients, usually smaller than a hospital."
    "examples":
      "আমি এখন ক্লিনিকে যাচ্ছি।":
        "native": "I am going to the clinic now."
        "bases":
          "ক্লিনিকে":
            "meaning": "clinic"
      "এই ক্লিনিকের ডাক্তার ভালো।":
        "native": "The doctor at this clinic is good."
        "bases":
          "এই":
            "meaning": "this"
          "ক্লিনিকের":
            "meaning": "clinic"
  "bn-1765":
    "native": "disease"
    "notes":
      "n1": "{1} is a disease, an illness with a known cause. The everyday word is {2}."
    "examples":
      "এটা একটি গুরুতর রোগ।":
        "native": "This is a serious disease."
        "bases":
          "একটি":
            "meaning": "a"
          "গুরুতর":
            "meaning": "serious"
      "অনেক রোগ দূষিত জল থেকে হয়।":
        "native": "Many diseases come from contaminated water."
        "bases":
          "দূষিত":
            "meaning": "contaminated"
          "থেকে":
            "meaning": "from"
  "bn-1766":
    "native": "patient"
    "notes":
      "n1": "{1} is a person who is ill and being treated by a doctor or in a hospital."
    "examples":
      "রোগী ডাক্তারকে ব্যথার কথা বলল।":
        "native": "The patient told the doctor about the pain."
        "bases":
          "কথা":
            "meaning": "matter; words"
          "বলল":
            "meaning": "told"
      "হাসপাতালে অনেক রোগী আছে।":
        "native": "There are many patients in the hospital."
        "bases":
          "আছে":
            "meaning": "is there"
  "bn-1767":
    "native": "treatment; medical care"
    "notes":
      "n1": "{1} is the treatment given to a patient, or medical care in general."
    "examples":
      "তার চিকিৎসা চলছে।":
        "native": "He is under treatment."
        "bases":
          "তার":
            "meaning": "his"
          "চলছে":
            "meaning": "going on"
      "ভালো চিকিৎসা পাওয়া সহজ নয়।":
        "native": "Good treatment is not easy to get."
        "bases":
          "সহজ":
            "meaning": "easy"
          "নয়":
            "meaning": "is not"
  "bn-1768":
    "native": "tablet; pill"
    "notes":
      "n1": "{1} is a tablet, a small solid dose of medicine."
    "examples":
      "দিনে দুটি বড়ি খান।":
        "native": "Take two tablets a day."
        "bases":
          "দুটি":
            "meaning": "two"
      "এই বড়ি খাওয়ার পর ঘুম পায়।":
        "native": "After taking this tablet you feel sleepy."
        "bases":
          "এই":
            "meaning": "this"
          "পর":
            "meaning": "after"
  "bn-1769":
    "native": "syrup"
    "notes":
      "n1": "{1} is a sweet liquid medicine, usually taken by the spoonful."
    "examples":
      "শিশুকে সিরাপ দিন।":
        "native": "Give the child syrup."
        "bases":
          "শিশুকে":
            "meaning": "child"
      "কাশির সিরাপ আছে?":
        "native": "Is there cough syrup?"
        "bases":
          "কাশির":
            "meaning": "cough"
          "আছে":
            "meaning": "there is"
  "bn-1770":
    "native": "injection"
    "notes":
      "n1": "{1} is an injection, a dose of medicine given with a needle."
    "examples":
      "ডাক্তার ইনজেকশন দিলেন।": "The doctor gave an injection."
      "ইনজেকশনের পর ব্যথা কমে।":
        "native": "The pain eases after the injection."
        "bases":
          "ইনজেকশনের":
            "meaning": "injection"
          "পর":
            "meaning": "after"
          "কমে":
            "meaning": "eases"
  "bn-1771":
    "native": "prescription"
    "notes":
      "n1": "{1} is the doctor's written order for medicine. You take it to the pharmacy."
    "examples":
      "ডাক্তার একটি প্রেসক্রিপশন লিখে দিলেন।":
        "native": "The doctor wrote a prescription and gave it."
        "bases":
          "একটি":
            "meaning": "a"
          "লিখে":
            "meaning": "wrote"
      "ফার্মেসিতে প্রেসক্রিপশন দেখান।": "Show the prescription at the pharmacy."
  "bn-1772":
    "native": "bandage"
    "notes":
      "n1": "{1} is a strip of cloth tied round a wound."
    "examples":
      "ক্ষতে ব্যান্ডেজ লাগান।":
        "native": "Put a bandage on the wound."
        "bases":
          "লাগান":
            "meaning": "put on"
      "ব্যান্ডেজটা ময়লা হয়ে গেছে।":
        "native": "The bandage has got dirty."
        "bases":
          "ব্যান্ডেজটা":
            "meaning": "bandage"
          "ময়লা":
            "meaning": "dirty"
  "bn-1773":
    "native": "vitamin"
    "notes":
      "n1": "{1} is a substance the body needs in small amounts, found in food."
    "examples":
      "সবজিতে অনেক ভিটামিন থাকে।": "Vegetables have many vitamins."
      "ডাক্তার ভিটামিন খেতে বললেন।":
        "native": "The doctor told him to take vitamins."
        "bases":
          "বললেন":
            "meaning": "told"
  "bn-1774":
    "native": "thermometer"
    "notes":
      "n1": "{1} is the instrument that measures body temperature."
    "examples":
      "থার্মোমিটারে জ্বর একশো ডিগ্রি।":
        "native": "The thermometer shows a fever of one hundred degrees."
        "bases":
          "থার্মোমিটারে":
            "meaning": "thermometer"
          "ডিগ্রি":
            "meaning": "degree"
      "জ্বর মাপতে থার্মোমিটার লাগে।":
        "native": "A thermometer is needed to measure a fever."
        "bases":
          "মাপতে":
            "meaning": "to measure"
          "লাগে":
            "meaning": "is needed"
  "bn-1775":
    "native": "X-ray"
    "notes":
      "n1": "{1} is a picture of the inside of the body, taken with radiation."
    "examples":
      "ডাক্তার হাতের এক্স-রে দেখলেন।":
        "native": "The doctor looked at the X-ray of the arm."
        "bases":
          "এক্স":
            "meaning": "X"
          "রে":
            "meaning": "ray"
      "এক্স-রেতে হাড় ভাঙা নেই।":
        "native": "The X-ray shows no broken bone."
        "bases":
          "হাড়":
            "meaning": "bone"
          "ভাঙা":
            "meaning": "broken"
          "নেই":
            "meaning": "there is not"
          "এক্স":
            "meaning": "X"
          "রেতে":
            "meaning": "in the X-ray"
  "bn-1776":
    "native": "test; examination"
    "notes":
      "n1": "{1} is a test, such as an exam or a medical test. For a blood test, say {2}."
    "examples":
      "ডাক্তার রক্ত পরীক্ষা করতে বললেন।":
        "native": "The doctor told him to have a blood test."
        "bases":
          "বললেন":
            "meaning": "told"
      "পরীক্ষার ফল কাল পাওয়া যাবে।":
        "native": "The test result will be available tomorrow."
        "bases":
          "পরীক্ষার":
            "meaning": "test"
  "bn-1777":
    "native": "blood test"
    "notes":
      "n1": "{1} is a test of a sample of blood. A test in general is {2}."
    "examples":
      "কাল আমার রক্ত পরীক্ষা হবে।":
        "native": "I will have a blood test tomorrow."
        "bases":
          "আমার":
            "meaning": "my"
      "রক্ত পরীক্ষার ফল ভালো।": "The blood test result is good."
  "bn-1778":
    "native": "urgent"
    "notes":
      "n1": "{1} is urgent, something that must be done at once."
    "examples":
      "রোগীর অবস্থা জরুরি।":
        "native": "The patient's condition is urgent."
        "bases":
          "অবস্থা":
            "meaning": "condition"
      "জরুরি দরকারে ডাক্তারকে ডাকুন।":
        "native": "For an urgent need, call the doctor."
        "bases":
          "দরকারে":
            "meaning": "need"
  "bn-1779":
    "native": "sweat"
    "notes":
      "n1": "{1} is sweat, the liquid that comes out of the skin in heat or fever."
    "examples":
      "জ্বর হলে গা দিয়ে ঘাম হয়।":
        "native": "With a fever, the skin sweats."
        "bases":
          "গা":
            "meaning": "skin; body"
          "দিয়ে":
            "meaning": "through"
      "তার সারা গায়ে ঘাম।":
        "native": "He is sweating all over."
        "bases":
          "তার":
            "meaning": "his"
          "সারা":
            "meaning": "all"
          "গায়ে":
            "meaning": "body"
  "bn-1780":
    "native": "wound; cut"
    "notes":
      "n1": "{1} is a wound, a cut or an open sore on the skin."
    "examples":
      "ক্ষতটা পরিষ্কার রাখুন।":
        "native": "Keep the wound clean."
        "bases":
          "ক্ষতটা":
            "meaning": "wound"
          "পরিষ্কার":
            "meaning": "clean"
      "হাতের ক্ষতে ব্যথা হচ্ছে।":
        "native": "The wound on my arm hurts."
        "bases":
          "ক্ষতে":
            "meaning": "wound"
  "bn-1781":
    "native": "swollen"
    "notes":
      "n1": "{1} is swollen, bigger than usual because of an injury or illness."
    "examples":
      "হাতের আঙুল ফোলা।":
        "native": "The finger of the hand is swollen."
        "bases":
          "আঙুল":
            "meaning": "finger"
      "মুখ ফোলা থাকলে ডাক্তার দেখান।": "If your face is swollen, see a doctor."
  "bn-1782":
    "native": "breath"
    "notes":
      "n1": "{1} is breath, the air taken in and let out by the lungs."
    "examples":
      "তার শ্বাস নিতে কষ্ট হচ্ছে।":
        "native": "It is hard for him to breathe."
        "bases":
          "তার":
            "meaning": "his"
      "ধীরে শ্বাস নিন।": "Breathe slowly."
  "bn-1783":
    "native": "discomfort; pain; hardship"
    "notes":
      "n1": "{1} is discomfort or pain felt in the body, or hardship."
    "examples":
      "কোথায় কষ্ট হচ্ছে?": "Where does it hurt?"
      "তার খুব কষ্ট হচ্ছে।":
        "native": "He is in great discomfort."
        "bases":
          "তার":
            "meaning": "his"
  "bn-1784":
    "native": "danger"
    "notes":
      "n1": "{1} is danger, a risk of harm to a person."
    "examples":
      "এই অবস্থায় কোনো বিপদ নেই।":
        "native": "In this condition there is no danger."
        "bases":
          "এই":
            "meaning": "this"
          "অবস্থায়":
            "meaning": "condition"
          "কোনো":
            "meaning": "any"
          "নেই":
            "meaning": "there is not"
      "বুকে ব্যথা হলে বিপদ হতে পারে।": "Chest pain can be dangerous."
  "bn-1785":
    "native": "advice"
    "notes":
      "n1": "{1} is advice, a suggestion about what to do."
    "examples":
      "ডাক্তারের পরামর্শ নিন।": "Take the doctor's advice."
      "বন্ধুর পরামর্শে আমি ডাক্তার দেখালাম।":
        "native": "On my friend's advice I had a doctor look at it."
        "bases":
          "পরামর্শে":
            "meaning": "advice"
          "দেখালাম":
            "meaning": "had looked"
  "bn-1786":
    "native": "ambulance"
    "notes":
      "n1": "{1} is a vehicle that takes sick or injured people to hospital."
    "examples":
      "অ্যাম্বুল্যান্স এসে গেছে।": "The ambulance has arrived."
      "বিপদের সময় অ্যাম্বুল্যান্সে ফোন করুন।":
        "native": "In an emergency, phone for an ambulance."
        "bases":
          "অ্যাম্বুল্যান্সে":
            "meaning": "ambulance"
          "ফোন":
            "meaning": "phone call"
  "bn-1787":
    "native": "admission (to hospital)"
    "notes":
      "n1": "{1} is being taken in as a patient, for example into a hospital."
    "examples":
      "তাকে হাসপাতালে ভর্তি করা হয়েছে।":
        "native": "He has been admitted to hospital."
        "bases":
          "তাকে":
            "meaning": "him, her"
      "ভর্তির জন্য কাগজ লাগবে।":
        "native": "Papers are needed for admission."
        "bases":
          "ভর্তির":
            "meaning": "admission"
          "জন্য":
            "meaning": "for"
          "কাগজ":
            "meaning": "papers"
          "লাগবে":
            "meaning": "needed"
  "bn-1788":
    "native": "to recover; to get well"
    "notes":
      "n1": "{1} is to recover from an illness and get better. The opposite is {2}, to be ill."
    "examples":
      "ওষুধ খেলে শিগগিরই সেরে উঠবে।":
        "native": "If you take the medicine you will get well soon."
        "bases":
          "শিগগিরই":
            "meaning": "soon"
          "সেরে":
            "meaning": "recovered"
      "জ্বর সেরে গেছে আর এখন ভালো।":
        "native": "The fever has gone and now I am well."
        "bases":
          "সেরে":
            "meaning": "recovered"
  "bn-1789":
    "native": "to stay in bed; to lie down"
    "notes":
      "n1": "{1} is to lie down and stay still, usually in bed, to rest while ill."
    "examples":
      "আজ বিছানায় শুয়ে থাকুন।":
        "native": "Stay in bed today."
