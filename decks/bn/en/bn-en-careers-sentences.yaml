schema: 1
id: "bn-en-careers-sentences"
kind: "layer"
core: "bn-careers-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Careers: sentences"
description: "Short sentences about jobs, training and plans for work. They unlock once their words and rules are known. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-3362":
    native: "I am looking for a job."
    notes:
      "n1": "খুঁজছি (khum̐jochi) is খোঁজা (khōjā), to look for, in the 'I am looking' form, where the stem vowel changes from ō to u."
    bases: { "খুঁজছি": "looking" }
    confusables: { "c1": { why: "unemployed: a state, not a search" }, "c2": { why: "a business: a different kind of work" } }
  "bn-3363":
    native: "He has a lot of experience."
    confusables: { "c1": { why: "skill: close, but a different word" }, "c2": { why: "qualification: a different word" } }
  "bn-3364":
    native: "The company is hiring new people."
    notes:
      "n1": "নিয়োগ দিচ্ছে (niyog dicche) is the noun নিয়োগ (niyog), appointment, with দিচ্ছে (dicche), the continuous of দেওয়া (deoyā), 'to give': 'is hiring'."
    bases: { "লোক": "people" }
    confusables: { "c1": { why: "layoffs: the opposite of hiring" }, "c2": { why: "retirement: a different exit from work" } }
  "bn-3365":
    native: "The CV is good."
    confusables: { "c1": { why: "a certificate: a proof, not a CV" }, "c2": { why: "a letter: a different document" } }
  "bn-3366":
    native: "She has sat the exam successfully."
    notes:
      "n1": "The ending -bhābe makes an adverb: সফলভাবে (sôpholobhābe), 'successfully'."
    confusables: { "c1": { why: "unsuccessful: the opposite" }, "c2": { why: "not successful: close, but a different word" } }
  "bn-3367":
    native: "How much are the pay and allowances?"
    confusables: { "c1": { why: "expense: money spent, the opposite" }, "c2": { why: "income: money earned, close but different" } }
  "bn-3368":
    native: "I will work here permanently."
    notes:
      "n1": "স্থায়ীভাবে (sthāyibhābe), 'permanently', takes the same adverb ending -bhābe as সফলভাবে (sôpholobhābe)."
    confusables: { "c1": { why: "temporary: the opposite" }, "c2": { why: "near: a place, not a time" } }
  "bn-3369":
    native: "What is your goal?"
    bases: { "কী": "what" }
    confusables: { "c1": { why: "dream: a wish, close to goal" }, "c2": { why: "a plan: the steps toward a goal" } }
  "bn-3370":
    native: "The company wants a skilled worker."
    notes:
      "n1": "চায় (cāy), 'wants', is the present form for he, she or it of চাওয়া (cāoyā), to want."
    bases: { "একজন": "one", "শ্রমিক": "worker", "চায়": "wants" }
    confusables: { "c1": { why: "unemployed: the opposite of skilled work" }, "c2": { why: "retirement: a different status" } }
  "bn-3371":
    native: "Plan before starting a business. (familiar)"
    notes:
      "n1": "করার আগে (kôrār āge), 'before doing', puts a verb in its -ar form before আগে (āge), 'before'."
    bases: { "শুরু": "starting" }
    confusables: { "c1": { why: "a job: a different kind of work" }, "c2": { why: "training: a different step" } }
  "bn-3372":
    native: "Dad has retired."
    notes:
      "n1": "নিয়েছেন (niyechen), 'has taken', is the respectful form for বাবা (bābā), father: the -chhen ending shows respect, here in অবসর (ôbsor) নিয়েছেন (niyechen), 'has retired'."
    confusables: { "c1": { why: "hiring: the opposite event" }, "c2": { why: "education: a different stage of life" } }
