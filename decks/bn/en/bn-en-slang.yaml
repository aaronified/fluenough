cards:
  "bn-0750":
    native: "smoking (slang)"
    notes:
      "n1": "Literally 'taking tobacco', and exactly সিগারেট খাওয়া (sigāreṭ khāoā), smoking. As a verb, তামাক সেবন করা (tāmāk sebon kôrā)."
    bases:
      "তামাক": "tobacco"
      "সেবন": "taking (formal)"
  "bn-0748":
    native: "to drink alcohol (slang)"
    notes:
      "n1": "Formally just 'to drink', as in writing: জল পান করা (jôl pān kôrā). In speech it usually means drinking alcohol, so for tea or water say খাওয়া (khāoyā). Not পান খাওয়া (pān khāoyā), which is chewing a betel leaf."
    bases:
      "পান": "drinking (also: a betel leaf)"
