schema: 1
id: "bn-en-careers"
kind: "layer"
core: "bn-careers"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Careers"
description: "Jobs and what they need: skills, qualifications, a CV, the employer, the pay and the plans for the future. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-3312":
    native: "career"
    notes:
      "n1": "{1}: A career: the work one does over a long time."
    examples:
      "আমার ক্যারিয়ার শুরু হয়েছে।": { native: "My career has started.", bases: { "শুরু": "started" } }
      "ক্যারিয়ারের জন্য পড়াশোনা করো।": { native: "Study for your career. (familiar)", bases: { "ক্যারিয়ারের": "career", "জন্য": "for", "পড়াশোনা": "study" } }
  "bn-3313":
    native: "CV"
    notes:
      "n1": "{1}: A CV, a written account of one's education and work."
    examples:
      "জীবনবৃত্তান্তটা পাঠাও।": { native: "Send the CV. (familiar)", bases: { "জীবনবৃত্তান্তটা": "CV" } }
      "জীবনবৃত্তান্তে অভিজ্ঞতা লেখো।": { native: "Write your experience in the CV. (familiar)", bases: { "জীবনবৃত্তান্তে": "CV", "লেখো": "write" } }
  "bn-3314":
    native: "skill"
    notes:
      "n1": "{1}: Skill: the ability to do something well."
    examples:
      "তার কম্পিউটারে দক্ষতা আছে।": { native: "He has skill with computers.", bases: { "আছে": "has" } }
      "দক্ষতা বাড়াও।": { native: "Build your skills. (familiar)", bases: { "বাড়াও": "build", "দক্ষতা": "skill" } }
  "bn-3315":
    native: "experience"
    notes:
      "n1": "{1}: Experience: knowledge gained from doing a job."
    examples:
      "আমার পাঁচ বছরের অভিজ্ঞতা।": { native: "I have five years of experience.", bases: { "পাঁচ": "five" } }
      "অভিজ্ঞতা থাকলে ভালো।": { native: "It is good to have experience.", bases: { "থাকলে": "if there is" } }
  "bn-3316":
    native: "qualification; merit"
    notes:
      "n1": "{1}: Qualification or merit: what makes a person fit for a job."
    examples:
      "যোগ্যতা অনুযায়ী কাজ পাবে।": { native: "You will get work according to your qualifications.", bases: { "অনুযায়ী": "according to" } }
      "তোমার যোগ্যতা কী?": { native: "What are your qualifications?", bases: { "কী": "what" } }
  "bn-3317":
    native: "degree"
    notes:
      "n1": "{1}: A degree: a university qualification."
    examples:
      "ডিগ্রি পেয়েছি।": "I have got a degree."
      "ডিগ্রিটা কোথা থেকে?": { native: "Where is the degree from?", bases: { "ডিগ্রিটা": "degree", "কোথা": "where", "থেকে": "from" } }
  "bn-3318":
    native: "certificate"
    notes:
      "n1": "{1}: A certificate: an official paper that proves a course was passed."
    examples:
      "সার্টিফিকেট দেখাও।": "Show the certificate. (familiar)"
      "সার্টিফিকেটটা নতুন।": { native: "The certificate is new.", bases: { "সার্টিফিকেটটা": "certificate" } }
  "bn-3319":
    native: "employer"
    notes:
      "n1": "{1}: An employer: the person or company that hires workers."
    examples:
      "নিয়োগকর্তা ভালো মানুষ।": { native: "The employer is a good person.", bases: { "মানুষ": "person" } }
      "নিয়োগকর্তার সঙ্গে কথা বলো।": { native: "Talk to the employer. (familiar)", bases: { "নিয়োগকর্তার": "employer", "সঙ্গে": "with" } }
  "bn-3320":
    native: "profession"
    notes:
      "n1": "{1}: A profession: the job one is trained for."
    examples:
      "তোমার পেশা কী?": { native: "What is your profession?", bases: { "কী": "what" } }
      "এটা সম্মানের পেশা।": { native: "This is a respected profession.", bases: { "সম্মানের": "respected", "পেশা": "profession" } }
  "bn-3321":
    native: "engineer"
    notes:
      "n1": "{1}: An engineer: a person who designs and builds machines or structures."
    examples:
      "প্রকৌশলী সেতু বানাচ্ছেন।": { native: "The engineer is building a bridge.", bases: { "বানাচ্ছেন": "building" } }
      "প্রকৌশলীর কাজ কঠিন।": { native: "The engineer's work is hard.", bases: { "প্রকৌশলীর": "engineer", "কঠিন": "hard" } }
  "bn-3322":
    native: "enterprise; initiative"
    notes:
      "n1": "{1}: An enterprise or initiative: a new effort to start something."
    examples:
      "নতুন উদ্যোগ শুরু হলো।": { native: "A new enterprise has started.", bases: { "শুরু": "started" } }
      "উদ্যোগটা ভালো।": { native: "The initiative is good.", bases: { "উদ্যোগটা": "enterprise; initiative" } }
  "bn-3323":
    native: "company"
    notes:
      "n1": "{1}: A company: a business organisation."
    examples:
      "কোম্পানিটা বড়।": { native: "The company is big.", bases: { "কোম্পানিটা": "company" } }
      "এই কোম্পানিতে কাজ করি।": { native: "I work at this company.", bases: { "এই": "this", "কোম্পানিতে": "company" } }
  "bn-3324":
    native: "workforce"
    notes:
      "n1": "{1}: Workforce: the workers available to do work."
    examples:
      "শ্রমশক্তি বাড়ছে।": { native: "The workforce is growing.", bases: { "বাড়ছে": "growing" } }
      "দেশের শ্রমশক্তি বড়।": "The country's workforce is large."
  "bn-3325":
    native: "unemployment"
    notes:
      "n1": "{1}: Unemployment: being without a job."
    examples:
      "বেকারত্ব কমাতে হবে।": { native: "Unemployment must be reduced.", bases: { "কমাতে": "to reduce" } }
      "বেকারত্বের খবর ভালো না।": { native: "The news of unemployment is not good.", bases: { "বেকারত্বের": "unemployment", "খবর": "news", "না": "not" } }
  "bn-3326":
    native: "vacancy"
    notes:
      "n1": "{1}: A vacancy: a post that is empty and needs someone."
    examples:
      "দুটো শূন্যপদ আছে।": { native: "There are two vacancies.", bases: { "দুটো": "two", "আছে": "there are" } }
      "শূন্যপদের জন্য আবেদন করো।": { native: "Apply for the vacancy. (familiar)", bases: { "শূন্যপদের": "vacancy", "জন্য": "for" } }
  "bn-3327":
    native: "advertisement"
    notes:
      "n1": "{1}: An advertisement: a notice that tells people about a job or product."
    examples:
      "কাগজে একটা বিজ্ঞাপন দেখেছি।": "I saw an advertisement in the paper."
      "বিজ্ঞাপনটা ভালো।": { native: "The advertisement is good.", bases: { "বিজ্ঞাপনটা": "advertisement" } }
  "bn-3328":
    native: "hiring"
    notes:
      "n1": "{1}: Hiring: the act of giving someone a job."
    examples:
      "নিয়োগ হয়েছে।": "The hiring has happened."
      "নিয়োগের খবর কবে?": { native: "When is the news of the hiring?", bases: { "নিয়োগের": "hiring", "খবর": "news", "কবে": "when" } }
  "bn-3329":
    native: "contract; agreement"
    notes:
      "n1": "{1}: A contract or agreement: terms agreed by two sides."
    examples:
      "চুক্তিটা সই করো।": { native: "Sign the contract. (familiar)", bases: { "চুক্তিটা": "contract; agreement", "সই": "signature" } }
      "চুক্তির শর্ত কী?": { native: "What are the terms of the contract?", bases: { "চুক্তির": "contract; agreement", "শর্ত": "terms", "কী": "what" } }
  "bn-3330":
    native: "income"
    notes:
      "n1": "{1}: Income: money a person earns."
    examples:
      "তার আয় ভালো।": "His income is good."
      "মাসের আয় কত?": { native: "What is the monthly income?", bases: { "মাসের": "monthly", "আয়": "income" } }
  "bn-3331":
    native: "expense"
    notes:
      "n1": "{1}: Expense: money spent."
    examples:
      "ব্যয় বেশি।": "The expense is high."
      "ব্যয় কমাও।": { native: "Reduce expenses. (familiar)", bases: { "কমাও": "reduce" } }
  "bn-3332":
    native: "goal"
    notes:
      "n1": "{1}: A goal: what one aims to achieve."
    examples:
      "আমার লক্ষ্য ডাক্তার হওয়া।": "My goal is to become a doctor."
      "লক্ষ্যে পৌঁছাও।": { native: "Reach your goal. (familiar)", bases: { "লক্ষ্যে": "to the goal", "পৌঁছাও": "reach" } }
  "bn-3333":
    native: "plan"
    notes:
      "n1": "{1}: A plan: a set of steps made in advance."
    examples:
      "আমার পরিকল্পনা শোনো।": { native: "Listen to my plan. (familiar)", bases: { "শোনো": "listen" } }
      "পরিকল্পনাটা ভালো।": { native: "The plan is good.", bases: { "পরিকল্পনাটা": "plan" } }
  "bn-3334":
    native: "institution"
    notes:
      "n1": "{1}: An institution or organisation: a body set up for a purpose."
    examples:
      "প্রতিষ্ঠানটা বড়।": { native: "The institution is big.", bases: { "প্রতিষ্ঠানটা": "institution" } }
      "এই প্রতিষ্ঠানে চাকরি আছে।": { native: "There are jobs in this institution.", bases: { "এই": "this", "প্রতিষ্ঠানে": "institution", "আছে": "there are" } }
  "bn-3335":
    native: "researcher"
    notes:
      "n1": "{1}: A researcher: a person who studies a subject in depth."
    examples:
      "গবেষক কাজ করছেন।": "The researcher is working."
      "গবেষকদের সঙ্গে কথা বলো।": { native: "Talk to the researchers. (familiar)", bases: { "গবেষকদের": "researcher", "সঙ্গে": "with" } }
  "bn-3336":
    native: "scientist"
    notes:
      "n1": "{1}: A scientist: a person who studies science."
    examples:
      "বিজ্ঞানী নতুন কিছু খুঁজছেন।": { native: "The scientist is looking for something new.", bases: { "কিছু": "something", "খুঁজছেন": "looking" } }
      "বিজ্ঞানীর কাজ কঠিন।": { native: "The scientist's work is hard.", bases: { "বিজ্ঞানীর": "scientist", "কঠিন": "hard" } }
  "bn-3337":
    native: "pay"
    notes:
      "n1": "{1}: Pay: the money a worker is paid, an informal word."
    examples:
      "মাইনে কত?": "What is the pay?"
      "মাইনে বাড়ল।": { native: "The pay has gone up.", bases: { "বাড়ল": "gone up" } }
  "bn-3338":
    native: "employment"
    notes:
      "n1": "{1}: Employment: the providing of work for people."
    examples:
      "কর্মসংস্থান বাড়ছে।": { native: "Employment is growing.", bases: { "বাড়ছে": "growing" } }
      "নতুন কর্মসংস্থান দরকার।": "New employment is needed."
  "bn-3339":
    native: "businessperson"
    notes:
      "n1": "{1}: A businessperson: a person who runs a trade."
    examples:
      "ব্যবসায়ী দোকানে আছেন।": { native: "The businessperson is in the shop.", bases: { "আছেন": "is" } }
      "ব্যবসায়ীদের সঙ্গে দেখা করো।": { native: "Meet the businesspeople. (familiar)", bases: { "ব্যবসায়ীদের": "businessperson", "সঙ্গে": "with" } }
  "bn-3340":
    native: "industry"
    notes:
      "n1": "{1}: Industry: the making of goods in factories."
    examples:
      "শিল্প বাড়ছে।": { native: "Industry is growing.", bases: { "বাড়ছে": "growing" } }
      "নতুন শিল্প শুরু হচ্ছে।": { native: "A new industry is starting.", bases: { "শুরু": "starting" } }
  "bn-3341":
    native: "programme"
    notes:
      "n1": "{1}: A programme: a planned set of activities."
    examples:
      "নতুন কর্মসূচি শুরু হবে।": { native: "A new programme will start.", bases: { "শুরু": "start" } }
      "কর্মসূচির সময়সূচি দেখো।": { native: "Look at the programme's timetable. (familiar)", bases: { "কর্মসূচির": "programme" } }
  "bn-3342":
    native: "pay and allowances"
    notes:
      "n1": "{1}: Pay and allowances: salary with extra money for housing or travel."
    examples:
      "বেতনভাতা ভালো।": "The pay and allowances are good."
      "বেতনভাতার খবর কবে?": { native: "When is the news about pay and allowances?", bases: { "বেতনভাতার": "pay and allowances", "খবর": "news", "কবে": "when" } }
  "bn-3343":
    native: "overtime"
    notes:
      "n1": "{1}: Overtime: extra hours worked beyond the usual time."
    examples:
      "আজ ওভারটাইম করছি।": { native: "I am working overtime today.", bases: { "আজ": "today" } }
      "ওভারটাইমের টাকা পাবে।": { native: "You will get the overtime money.", bases: { "ওভারটাইমের": "overtime" } }
  "bn-3344":
    native: "post; rank"
    notes:
      "n1": "{1}: A post or rank: a position in an office."
    examples:
      "এই পদে কে আছে?": { native: "Who is in this post?", bases: { "এই": "this", "পদে": "in the post", "কে": "who", "আছে": "is" } }
      "পদটা খালি।": { native: "The post is empty.", bases: { "পদটা": "post; rank" } }
  "bn-3345":
    native: "progress; improvement"
    notes:
      "n1": "{1}: Progress or improvement: getting better."
    examples:
      "কাজে উন্নতি হয়েছে।": "There has been progress at work."
      "উন্নতির জন্য শেখো।": { native: "Learn for improvement. (familiar)", bases: { "উন্নতির": "progress; improvement", "জন্য": "for" } }
  "bn-3346":
    native: "skilled"
    notes:
      "n1": "{1}: Skilled: good at doing a job."
    examples:
      "সে একজন দক্ষ কর্মী।": { native: "She is a skilled worker.", bases: { "একজন": "one", "কর্মী": "worker" } }
      "দক্ষ শ্রমিক দরকার।": { native: "Skilled workers are needed.", bases: { "শ্রমিক": "workers" } }
  "bn-3347":
    native: "successful"
    notes:
      "n1": "{1}: Successful: having achieved what one wanted."
    examples:
      "সে খুব সফল।": "She is very successful."
      "সফল মানুষ পরিশ্রম করে।": { native: "Successful people work hard.", bases: { "মানুষ": "people", "পরিশ্রম": "hard work" } }
  "bn-3348":
    native: "suitable"
    notes:
      "n1": "{1}: Suitable: right for a purpose."
    examples:
      "এটা কাজের জন্য উপযুক্ত।": { native: "This is suitable for the work.", bases: { "জন্য": "for" } }
      "উপযুক্ত লোক খুঁজছি।": { native: "I am looking for a suitable person.", bases: { "লোক": "person", "খুঁজছি": "looking" } }
  "bn-3349":
    native: "unemployed"
    notes:
      "n1": "{1}: Unemployed: without a job."
    examples:
      "সে এখন বেকার।": { native: "He is unemployed now.", bases: { "এখন": "now" } }
      "বেকার যুবক অনেক।": { native: "There are many unemployed young men.", bases: { "যুবক": "young men" } }
  "bn-3350":
    native: "professional"
    notes:
      "n1": "{1}: Professional: doing work as a trained expert."
    examples:
      "সে একজন পেশাদার শিক্ষক।": { native: "She is a professional teacher.", bases: { "একজন": "one" } }
      "পেশাদার আচরণ করো।": { native: "Behave professionally. (familiar)", bases: { "আচরণ": "behaviour" } }
  "bn-3351":
    native: "to look for a job"
    notes:
      "n1": "{1}: To look for a job: to search for work."
    examples:
      "আমি চাকরি খুঁজছি।": { native: "I am looking for a job.", bases: { "খুঁজছি": "looking" } }
      "চাকরি খোঁজো।": "Look for a job. (familiar)"
  "bn-3352":
    native: "to hire"
    notes:
      "n1": "{1}: To hire: to give someone a job."
    examples:
      "কোম্পানিটা দশজনকে নিয়োগ দিয়েছে।": { native: "The company has hired ten people.", bases: { "দশজনকে": "ten people" } }
      "আমাকে নিয়োগ দাও।": { native: "Hire me. (familiar)", bases: { "আমাকে": "me" } }
  "bn-3353":
    native: "to take training"
    notes:
      "n1": "{1}: To take training: to learn a skill formally."
    examples:
      "আমি কম্পিউটারের প্রশিক্ষণ নিয়েছি।": { native: "I have taken computer training.", bases: { "প্রশিক্ষণ": "training" } }
      "প্রশিক্ষণ নিতে এসো।": { native: "Come to take training. (familiar)", bases: { "প্রশিক্ষণ": "training" } }
  "bn-3354":
    native: "to retire"
    notes:
      "n1": "{1}: To retire: to stop working at the end of a career."
    examples:
      "বাবা অবসর নিয়েছেন।": "Dad has retired."
      "অবসর নেওয়ার পরে ঘুরবেন।": { native: "After retiring you will travel.", bases: { "পরে": "after", "ঘুরবেন": "will travel" } }
  "bn-3355":
    native: "to start a business"
    notes:
      "n1": "{1}: To start a business: to open a new trade."
    examples:
      "সে একটা ব্যবসা শুরু করেছে।": { native: "She has started a business.", bases: { "শুরু": "started" } }
      "ব্যবসা শুরু করার আগে ভাবো।": { native: "Think before starting a business. (familiar)", bases: { "শুরু": "starting", "ভাবো": "think" } }
  "bn-3356":
