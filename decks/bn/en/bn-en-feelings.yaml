schema: 1
id: "bn-en-feelings"
kind: "layer"
core: "bn-feelings"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Feelings"
description: "Words for how people feel and what they say about it: hope, shame, pride, worry, and the phrases for them. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-2813":
    native: "sorry; sad"
    notes:
      "n1": "{1}: Sorry, or sad: feeling regret for something."
    examples:
      "আমি দুঃখিত।": "I am sorry."
      "তোমার খবরে আমি দুঃখিত হলাম।": { native: "I was sad at your news.", bases: { "খবরে": "at the news" } }
  "bn-2814":
    native: "sad"
    notes:
      "n1": "{1}: Sad, unhappy: a person who is often sorrowful."
    examples:
      "ছোট বাচ্চাটা দুঃখী।": { native: "The little child is sad.", bases: { "বাচ্চাটা": "the child" } }
      "দুঃখী মানুষকে সাহায্য করো।": { native: "Help a sad person. (familiar)", bases: { "মানুষকে": "to a person" } }
  "bn-2815":
    native: "short-tempered"
    notes:
      "n1": "{1}: Short-tempered: a person who gets angry easily."
    examples:
      "আমাদের প্রতিবেশী খুব রাগী।": { native: "Our neighbour is very short-tempered.", bases: { "প্রতিবেশী": "neighbour" } }
      "রাগী মানুষের সঙ্গে কথা বলো না।": { native: "Do not talk with an angry person. (familiar)", bases: { "মানুষের": "of a person", "সঙ্গে": "with", "না": "not" } }
  "bn-2816":
    native: "worried"
    notes:
      "n1": "{1}: Worried: thinking anxiously about something."
    examples:
      "মা খুব চিন্তিত।": { native: "Mum is very worried.", bases: { "মা": "mum" } }
      "তুমি এত চিন্তিত কেন?": { native: "Why are you so worried?", bases: { "এত": "so", "কেন": "why" } }
  "bn-2817":
    native: "surprised"
    notes:
      "n1": "{1}: Surprised: astonished by something unexpected."
    examples:
      "আমি অবাক হলাম।": "I was surprised."
      "এত দ্রুত কাজ হয়েছে, সবাই অবাক।": { native: "The work was done so fast that everyone is surprised.", bases: { "এত": "so", "দ্রুত": "fast", "সবাই": "everyone" } }
  "bn-2818":
    native: "annoyed"
    notes:
      "n1": "{1}: Annoyed: fed up with something or someone."
    examples:
      "বাবা বিরক্ত হয়ে গেছেন।": "Dad has become annoyed."
      "এত শব্দে সবাই বিরক্ত।": { native: "Everyone is annoyed by so much noise.", bases: { "শব্দে": "with noise", "এত": "so", "সবাই": "everyone" } }
  "bn-2819":
    native: "boring"
    notes:
      "n1": "{1}: Boring and the same all the time."
    examples:
      "কাজটা খুব একঘেয়ে।": "The work is very boring."
      "একঘেয়ে দিন কাটে।": { native: "The days pass in a boring way.", bases: { "কাটে": "pass" } }
  "bn-2820":
    native: "excited"
    notes:
      "n1": "{1}: Excited: full of eager feelings, or agitated."
    examples:
      "বাচ্চারা উত্তেজিত।": { native: "The children are excited.", bases: { "বাচ্চারা": "children" } }
      "সে খবর শুনে খুব উত্তেজিত হলো।": { native: "She became very excited on hearing the news.", bases: { "খবর": "news", "শুনে": "on hearing" } }
  "bn-2821":
    native: "envious"
    notes:
      "n1": "{1}: Envious: wanting what others have."
    examples:
      "ও খুব হিংসুটে।": "He is very envious."
      "হিংসুটে মানুষ সুখী হয় না।": { native: "An envious person is not happy.", bases: { "মানুষ": "person", "সুখী": "happy", "না": "not" } }
  "bn-2822":
    native: "proud"
    notes:
      "n1": "{1}: Proud: pleased with someone or something good."
    examples:
      "আমি আমার ছেলের জন্য গর্বিত।": { native: "I am proud of my son.", bases: { "ছেলের": "son's", "জন্য": "for" } }
      "তোমাকে নিয়ে আমরা গর্বিত।": { native: "We are proud of you.", bases: { "নিয়ে": "about" } }
  "bn-2823":
    native: "ashamed"
    notes:
      "n1": "{1}: Ashamed or embarrassed by something one did."
    examples:
      "ভুলের জন্য সে লজ্জিত।": { native: "She is ashamed of her mistake.", bases: { "জন্য": "for" } }
      "লজ্জিত হয়ে ক্ষমা চাইলাম।": { native: "Ashamed, I asked for forgiveness.", bases: { "চাইলাম": "to want" } }
  "bn-2824":
    native: "panicked; flustered"
    notes:
      "n1": "{1}: Panicked or flustered: losing one's calm."
    examples:
      "পরীক্ষার আগে ছেলেটা ঘাবড়ানো।": { native: "Before the exam the boy is flustered.", bases: { "ছেলেটা": "the boy" } }
      "ঘাবড়ানো না, সব ঠিক হবে।": { native: "Do not panic, all will be fine. (familiar)", bases: { "না": "not", "ঠিক": "fine" } }
  "bn-2825":
    native: "satisfied"
    notes:
      "n1": "{1}: Satisfied and content with what one has."
    examples:
      "আমি সন্তুষ্ট।": "I am satisfied."
      "সে কাজে সন্তুষ্ট না।": { native: "She is not satisfied with the work.", bases: { "না": "not" } }
  "bn-2826":
    native: "grateful"
    notes:
      "n1": "{1}: Grateful: thankful for a kindness."
    examples:
      "আমি তোমার জন্য কৃতজ্ঞ।": { native: "I am grateful to you.", bases: { "জন্য": "for" } }
      "কৃতজ্ঞ থাকো।": "Stay grateful. (familiar)"
  "bn-2827":
    native: "nervous"
    notes:
      "n1": "{1}: Nervous: anxious and tense before something."
    examples:
      "প্রথম দিনে সবাই নার্ভাস।": { native: "On the first day everyone is nervous.", bases: { "দিনে": "on the day", "সবাই": "everyone" } }
      "আমি একটু নার্ভাস।": "I am a little nervous."
  "bn-2828":
    native: "surprising"
    notes:
      "n1": "{1}: Surprising: astonishing and strange."
    examples:
      "এটা আশ্চর্য খবর!": { native: "This is surprising news!", bases: { "খবর": "news" } }
      "আশ্চর্য কিন্তু সত্যি।": "Surprising, but true."
  "bn-2829":
    native: "afraid"
    notes:
      "n1": "{1}: Afraid: frightened of something."
    examples:
      "শিশুটি রাতে ভীত হয়।": { native: "The child is afraid at night.", bases: { "শিশুটি": "the child" } }
      "আমি অন্ধকারে ভীত।": "I am afraid in the dark."
  "bn-2830":
    native: "happy"
    notes:
      "n1": "{1}: Happy: content, living well and cheerful."
    examples:
      "আমরা সবাই সুখী।": { native: "We are all happy.", bases: { "সবাই": "everyone" } }
      "সুখী মানুষ হাসে।": { native: "A happy person laughs.", bases: { "মানুষ": "person", "হাসে": "laughs" } }
  "bn-2831":
    native: "gloomy"
    notes:
      "n1": "{1}: Gloomy and sad: low in spirits."
    examples:
      "আজ আকাশ বিষণ্ণ।": { native: "Today the sky is gloomy.", bases: { "আজ": "today", "আকাশ": "sky" } }
      "বিষণ্ণ মনে কেউ বসে আছে।": { native: "Someone sits with a sad heart.", bases: { "মনে": "in the heart", "কেউ": "someone", "আছে": "is" } }
  "bn-2832":
    native: "keen; enthusiastic"
    notes:
      "n1": "{1}: Keen and enthusiastic: eager to do something."
    examples:
      "ছেলেমেয়েরা খুব উৎসাহী।": { native: "The boys and girls are very keen.", bases: { "ছেলেমেয়েরা": "children" } }
      "নতুন কাজে সে উৎসাহী।": "She is keen on the new work."
  "bn-2833":
    native: "delighted"
    notes:
      "n1": "{1}: Delighted: full of joy at something."
    examples:
      "আমরা আনন্দিত।": "We are delighted."
      "খবরটা শুনে সবাই আনন্দিত।": { native: "Everyone is delighted to hear the news.", bases: { "খবরটা": "the news", "শুনে": "on hearing", "সবাই": "everyone" } }
  "bn-2834":
    native: "furious"
    notes:
      "n1": "{1}: Furious: very angry."
    examples:
      "বাবা ক্রুদ্ধ হয়ে গেছেন।": "Dad has become furious."
      "ক্রুদ্ধ মুখে কথা বলো না।": { native: "Do not speak with a furious face. (familiar)", bases: { "না": "not" } }
  "bn-2835":
    native: "hope"
    notes:
      "n1": "{1}: Hope: a wish for something good to happen."
    examples:
      "আমার আশা ভালো হবে।": "My hope is that it will be good."
      "আশা ছেড়ো না।": { native: "Do not give up hope. (familiar)", bases: { "ছেড়ো": "give up", "না": "not" } }
  "bn-2836":
    native: "hatred"
    notes:
      "n1": "{1}: Hatred or disgust towards someone or something."
    examples:
      "তার প্রতি ঘৃণা নেই।": { native: "I have no hatred for him.", bases: { "প্রতি": "towards", "নেই": "there is not" } }
      "ঘৃণা ভালো নয়।": "Hatred is not good."
  "bn-2837":
    native: "relief"
    notes:
      "n1": "{1}: Relief: the feeling after a worry has gone."
    examples:
      "খবরটা শুনে স্বস্তি পেলাম।": { native: "I felt relieved on hearing the news.", bases: { "খবরটা": "the news", "শুনে": "on hearing" } }
      "তোমার স্বস্তির জন্য কথা দিচ্ছি।": { native: "I promise, for your relief.", bases: { "স্বস্তির": "of relief", "জন্য": "for" } }
  "bn-2838":
    native: "disappointment"
    notes:
      "n1": "{1}: Disappointment or despair: a loss of hope."
    examples:
      "ফলাফলে হতাশা।": { native: "Disappointment at the result.", bases: { "ফলাফলে": "at the result" } }
      "হতাশা কাটিয়ে ওঠো।": { native: "Overcome the disappointment. (familiar)", bases: { "কাটিয়ে": "overcoming", "ওঠো": "rise" } }
  "bn-2839":
    native: "sympathy"
    notes:
      "n1": "{1}: Sympathy: feeling for another person's trouble."
    examples:
      "তার জন্য আমার সহানুভূতি আছে।": { native: "I have sympathy for him.", bases: { "জন্য": "for", "আছে": "there is" } }
      "সহানুভূতি দেখাও।": "Show sympathy. (familiar)"
  "bn-2840":
    native: "peace"
    notes:
      "n1": "{1}: Peace: calm, with no fighting or worry."
    examples:
      "গ্রামে শান্তি আছে।": { native: "There is peace in the village.", bases: { "আছে": "there is" } }
      "মনে শান্তি চাই।": { native: "I want peace in my heart.", bases: { "মনে": "in the heart", "চাই": "to want" } }
  "bn-2841":
    native: "courage"
    notes:
      "n1": "{1}: Courage: the strength to face danger or fear."
    examples:
      "তার সাহস বেশি।": "He has a lot of courage."
      "সাহস নিয়ে কথা বলো।": { native: "Speak with courage. (familiar)", bases: { "নিয়ে": "with" } }
  "bn-2842":
    native: "patience"
    notes:
      "n1": "{1}: Patience: staying calm while waiting or struggling."
    examples:
      "ধৈর্য রাখো।": "Be patient. (familiar)"
      "ধৈর্য ধরে অপেক্ষা করো।": { native: "Wait with patience. (familiar)", bases: { "ধরে": "holding", "অপেক্ষা": "waiting" } }
  "bn-2843":
    native: "memory"
    notes:
      "n1": "{1}: Memory: something one remembers from the past."
    examples:
      "ছোটবেলার স্মৃতি মনে আছে।": { native: "I remember a memory from childhood.", bases: { "ছোটবেলার": "of childhood", "মনে": "in the mind", "আছে": "there is" } }
      "এই জায়গায় অনেক স্মৃতি।": { native: "There are many memories in this place.", bases: { "এই": "this", "জায়গায়": "in the place" } }
  "bn-2844":
    native: "dream; hope"
    notes:
      "n1": "{1}: A dream: a hope for the future, or what one sees asleep."
    examples:
      "আমার স্বপ্ন ডাক্তার হওয়া।": "My dream is to become a doctor."
      "রাতে ভালো স্বপ্ন দেখেছি।": "I had a good dream at night."
  "bn-2845":
    native: "mood; temper"
    notes:
      "n1": "{1}: Mood or temper: how a person feels at a time."
    examples:
      "আজ তার মেজাজ ভালো।": { native: "Today his mood is good.", bases: { "আজ": "today" } }
      "মেজাজ ঠিক রাখো।": { native: "Keep your mood right. (familiar)", bases: { "ঠিক": "right" } }
  "bn-2846":
    native: "mind; heart"
    notes:
      "n1": "{1}: The mind or heart: where feelings are."
    examples:
      "আমার মন ভালো নেই।": { native: "My mind is not well.", bases: { "নেই": "is not" } }
      "মন খুলে কথা বলো।": { native: "Speak your mind freely. (familiar)", bases: { "খুলে": "openly" } }
  "bn-2847":
    native: "crying"
    notes:
      "n1": "{1}: Crying: tears and the sound of crying."
    examples:
      "বাচ্চাটার কান্না থামে না।": { native: "The child's crying does not stop.", bases: { "বাচ্চাটার": "of the child", "থামে": "stops", "না": "not" } }
      "কান্না শুনে সবাই এলো।": { native: "Hearing the crying, everyone came.", bases: { "শুনে": "on hearing", "সবাই": "everyone" } }
  "bn-2848":
    native: "wish; desire"
    notes:
      "n1": "{1}: Wish or desire: wanting to do something."
    examples:
      "আমার ইচ্ছা বই পড়া।": { native: "My wish is to read books.", bases: { "পড়া": "reading" } }
      "তোমার ইচ্ছা কী?": { native: "What is your wish?", bases: { "কী": "what" } }
  "bn-2849":
    native: "interest"
    notes:
      "n1": "{1}: Interest: a wish to know about or join in."
    examples:
      "গানে তার আগ্রহ বেশি।": { native: "He has a great interest in music.", bases: { "গানে": "in music" } }
      "আগ্রহ নিয়ে পড়ো।": { native: "Read with interest. (familiar)", bases: { "নিয়ে": "with", "পড়ো": "read" } }
  "bn-2850":
    native: "forgiveness"
    notes:
      "n1": "{1}: Forgiveness: letting go of anger at a wrong done."
    examples:
      "আমাকে ক্ষমা করো।": { native: "Forgive me. (familiar)", bases: { "আমাকে": "me" } }
      "ক্ষমার কথা বলো।": { native: "Speak of forgiveness. (familiar)", bases: { "ক্ষমার": "forgiveness" } }
  "bn-2851":
    native: "feeling"
    notes:
      "n1": "{1}: A feeling: something one senses or feels inside."
    examples:
      "তার অনুভূতি বোঝা কঠিন।": { native: "His feelings are hard to understand.", bases: { "বোঝা": "to understand", "কঠিন": "hard" } }
      "একটা নতুন অনুভূতি হলো।": "A new feeling came."
  "bn-2852":
    native: "emotion"
    notes:
      "n1": "{1}: Emotion: a strong feeling that moves a person."
    examples:
      "আবেগে সে কাঁদল।": { native: "In her emotion, she cried.", bases: { "আবেগে": "in emotion" } }
      "আবেগ আর যুক্তি আলাদা।": { native: "Emotion and reason are different.", bases: { "যুক্তি": "reason", "আলাদা": "different" } }
  "bn-2853":
    native: "anxiety"
    notes:
      "n1": "{1}: Anxiety: a worried feeling about what may happen."
    examples:
      "পরীক্ষার উদ্বেগ বেশি।": "The worry about the exam is great."
      "উদ্বেগ কমাতে হাঁটো।": { native: "To lessen anxiety, walk. (familiar)", bases: { "কমাতে": "to lessen" } }
  "bn-2854":
    native: "annoyance"
    notes:
      "n1": "{1}: Annoyance: the feeling of being fed up."
    examples:
      "তার মুখে বিরক্তি।": "Annoyance on his face."
      "বিরক্তি চেপে রাখো।": { native: "Hide your annoyance. (familiar)", bases: { "চেপে": "hiding" } }
  "bn-2855":
    native: "loneliness"
    notes:
      "n1": "{1}: Loneliness: the sadness of being alone."
    examples:
      "একাকীত্ব কষ্টের।": { native: "Loneliness is painful.", bases: { "কষ্টের": "painful" } }
      "বৃদ্ধ মানুষের একাকীত্ব।": { native: "The loneliness of an old person.", bases: { "বৃদ্ধ": "old", "মানুষের": "of a person" } }
  "bn-2856":
    native: "to feel"
    bases: { "অনুভব": "to feel" }
    notes:
      "n1": "{1}: To feel: to sense something in the body or mind."
    examples:
      "আমি ভয় অনুভব করি।": { native: "I feel fear.", bases: { "অনুভব": "to feel" } }
      "তুমি কি কিছু অনুভব করো?": { native: "Do you feel anything? (familiar)", bases: { "অনুভব": "to feel", "কি": "whether", "কিছু": "anything" } }
  "bn-2857":
    native: "to miss"
    bases: { "মিস": "miss" }
    notes:
      "n1": "{1}: To miss: to feel the loss of someone or something."
    examples:
      "আমি বাড়ি মিস করি।": { native: "I miss home.", bases: { "মিস": "miss" } }
      "তোমাকে খুব মিস করছি।": { native: "I miss you very much.", bases: { "মিস": "miss" } }
  "bn-2858":
    native: "to get angry"
    notes:
      "n1": "{1}: To get angry: to become angry."
    examples:
      "বাবা হঠাৎ রেগে গেলেন।": { native: "Dad suddenly got angry.", bases: { "রেগে": "angrily" } }
