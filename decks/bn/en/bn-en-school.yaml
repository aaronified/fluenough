"id": "bn-en-school"
"kind": "layer"
"core": "bn-school"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "School"
"description": "Words of school: lessons and subjects, the classroom and what is in it, and what pupils and teachers do. Not yet checked by a Bengali speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "bn-1888":
    "native": "class; lesson"
    "notes":
      "n1": "A lesson at school or college, and the group of pupils who sit through it. For the room itself, use ক্লাসরুম (klāsorum)."
    "examples":
      "আজ ক্লাস নেই।":
        "native": "There is no class today."
        "bases":
          "ক্লাস": "class; lesson"
          "নেই": "there is not"
      "ক্লাস শুরু হয়েছে।":
        "native": "The class has started."
        "bases":
          "ক্লাস": "class; lesson"
          "শুরু": "start; beginning"
  "bn-1889":
    "native": "classroom"
    "notes":
      "n1": "The room where a class is held, with its desks, chairs and blackboard."
    "examples":
      "ক্লাসরুমটা পরিষ্কার।":
        "native": "The classroom is clean."
        "bases":
          "ক্লাসরুমটা": "classroom"
      "ক্লাসরুমে ডেস্কগুলো সাজানো আছে।":
        "native": "The desks are set out in the classroom."
        "bases":
          "ক্লাসরুমে": "classroom"
          "সাজানো": "to arrange; to set out"
          "আছে": "there is; to be"
  "bn-1890":
    "native": "teacher (a woman)"
    "notes":
      "n1": "A woman who teaches. The man is শিক্ষক (śikkhok), and both words are used for a teacher in school."
    "examples":
      "শিক্ষিকা ক্লাসে আসছেন।":
        "native": "The teacher is coming to class."
        "bases":
          "শিক্ষিকা": "teacher (a woman)"
      "শিক্ষিকার নাম কী?":
        "native": "What is the (female) teacher's name?"
        "bases":
          "শিক্ষিকার": "teacher (a woman)"
  "bn-1891":
    "native": "pupil (a girl or a woman)"
    "notes":
      "n1": "A female student. The male form is ছাত্র (chātro)."
    "examples":
      "ছাত্রীটি খুব ভালো।":
        "native": "The (girl) student is very good."
        "bases":
          "ছাত্রীটি": "pupil (a girl or a woman)"
      "ছাত্রীরা বই পড়ছে।":
        "native": "The girl students are reading books."
        "bases":
          "ছাত্রীরা": "pupil (a girl or a woman)"
          "পড়ছে": "to read; to study"
  "bn-1892":
    "native": "eraser; rubber"
    "notes":
      "n1": "A soft piece of rubber that rubs out pencil marks."
    "examples":
      "রাবারটা কোথায়?":
        "native": "Where is the eraser?"
        "bases":
          "রাবারটা": "eraser; rubber"
      "পেন্সিলের ভুল রাবার দিয়ে ঠিক করো।":
        "native": "Correct the pencil mistake with the eraser."
        "bases":
          "রাবার": "eraser; rubber"
  "bn-1893":
    "native": "desk"
    "notes":
      "n1": "A table with a seat, where a pupil sits to write, often with a space inside for books."
    "examples":
      "ডেস্কটা পরিষ্কার করো।":
        "native": "Clean the desk."
        "bases":
          "ডেস্কটা": "desk"
      "আমার ডেস্কে একটা বই আছে।":
        "native": "There is a book on my desk."
        "bases":
          "আমার": "my"
          "ডেস্কে": "desk"
          "আছে": "there is; to be"
  "bn-1894":
    "native": "bench"
    "notes":
      "n1": "A long seat for two or more people, such as the pupils in a classroom."
    "examples":
      "বেঞ্চটা ভাঙা।":
        "native": "The bench is broken."
        "bases":
          "বেঞ্চটা": "bench"
      "ছাত্ররা বেঞ্চে বসে।":
        "native": "The students sit on the bench."
        "bases":
          "বেঞ্চে": "bench"
  "bn-1895":
    "native": "blackboard"
    "notes":
      "n1": "The dark board that a teacher writes on with chalk."
    "examples":
      "ব্ল্যাকবোর্ডটা খুব বড়।":
        "native": "The blackboard is very big."
        "bases":
          "ব্ল্যাকবোর্ডটা": "blackboard"
          "বড়": "big"
      "ব্ল্যাকবোর্ডের পাশে একটা মানচিত্র আছে।":
        "native": "There is a map beside the blackboard."
        "bases":
          "ব্ল্যাকবোর্ডের": "blackboard"
          "আছে": "there is; to be"
  "bn-1896":
    "native": "chalk"
    "notes":
      "n1": "A soft stick of white or coloured chalk, used to write on a blackboard."
    "examples":
      "চকটা কোথায়?":
        "native": "Where is the chalk?"
        "bases":
          "চকটা": "chalk"
      "চক দিয়ে ব্ল্যাকবোর্ডে নাম লেখো।":
        "native": "Write the name on the blackboard with chalk."
        "bases":
          "চক": "chalk"
  "bn-1897":
    "native": "homework"
    "notes":
      "n1": "Work that a teacher sets for a pupil to finish at home."
    "examples":
      "আজকের হোমওয়ার্কটা কঠিন।":
        "native": "Today's homework is difficult."
        "bases":
          "হোমওয়ার্কটা": "homework"
      "হোমওয়ার্ক শেষ করেছ?":
        "native": "Have you finished the homework?"
        "bases":
          "হোমওয়ার্ক": "homework"
          "শেষ": "end; finished"
  "bn-1898":
    "native": "question"
    "notes":
      "n1": "A question asked in class or in an exam. Its answer is উত্তর (uttor)."
    "examples":
      "এই প্রশ্নের উত্তর জানো?":
        "native": "Do you know the answer to this question?"
        "bases":
          "এই": "this"
          "প্রশ্নের": "question"
          "উত্তর": "answer"
      "শিক্ষক একটা সহজ প্রশ্ন করলেন।":
        "native": "The teacher asked an easy question."
        "bases":
          "প্রশ্ন": "question"
  "bn-1899":
    "native": "subject"
    "notes":
      "n1": "A school subject, such as maths, science or history."
    "examples":
      "তোমার প্রিয় বিষয় কী?":
        "native": "What is your favourite subject?"
        "bases":
          "তোমার": "your"
          "বিষয়": "subject"
      "এই বিষয়টা খুব মজার।":
        "native": "This subject is very fun."
        "bases":
          "এই": "this"
          "বিষয়টা": "subject"
  "bn-1900":
    "native": "arithmetic; a sum"
    "notes":
      "n1": "Maths as a school subject, or a sum to work out in a maths lesson."
    "examples":
      "অঙ্কটা খুব কঠিন।":
        "native": "The maths sum is very difficult."
        "bases":
          "অঙ্কটা": "arithmetic; a sum"
      "অঙ্কগুলো করো।":
        "native": "Do the sums."
        "bases":
          "অঙ্কগুলো": "arithmetic; a sum"
  "bn-1901":
    "native": "science"
    "notes":
      "n1": "Science as a school subject: the study of nature and of how things work."
    "examples":
      "বিজ্ঞান আমার প্রিয় বিষয়।":
        "native": "Science is my favourite subject."
        "bases":
          "বিজ্ঞান": "science"
          "আমার": "my"
      "বিজ্ঞানের বই কোথায়?":
        "native": "Where is the science book?"
        "bases":
          "বিজ্ঞানের": "science"
  "bn-1902":
    "native": "history"
    "notes":
      "n1": "History as a school subject. The same word also means the history of the past."
    "examples":
      "ইতিহাস আমার ভালো লাগে।":
        "native": "I like history."
        "bases":
          "ইতিহাস": "history"
          "আমার": "my"
          "লাগে": "to feel; to seem"
      "ইতিহাসের বইটা পড়ো।":
        "native": "Read the history book."
        "bases":
          "ইতিহাসের": "history"
          "পড়ো": "to read; to study"
  "bn-1903":
    "native": "geography"
    "notes":
      "n1": "Geography as a school subject: the land, rivers and places of the world."
    "examples":
      "ভূগোলের খাতাটা কোথায়?":
        "native": "Where is the geography notebook?"
        "bases":
          "ভূগোলের": "geography"
      "ভূগোলের বিষয়টা সহজ।":
        "native": "The geography subject is easy."
        "bases":
          "ভূগোলের": "geography"
  "bn-1904":
    "native": "map"
    "notes":
      "n1": "A drawing of the land, rivers and towns of a place. A geography lesson often uses one."
    "examples":
      "ভূগোলের মানচিত্রটা বড়।":
        "native": "The geography map is big."
        "bases":
          "মানচিত্রটা": "map"
          "বড়": "big"
      "মানচিত্রে নদীটা কোথায়?":
        "native": "Where is the river on the map?"
        "bases":
          "মানচিত্রে": "map"
  "bn-1905":
    "native": "timetable"
    "notes":
      "n1": "A list of the lessons of the day or the week, and the time each one happens."
    "examples":
      "সময়সূচিটা দেখুন।":
        "native": "Look at the timetable."
        "bases":
          "সময়সূচিটা": "timetable"
      "আজকের সময়সূচি কোথায়?":
        "native": "Where is today's timetable?"
        "bases":
          "সময়সূচি": "timetable"
  "bn-1906":
    "native": "school uniform"
    "notes":
      "n1": "The set of clothes that pupils wear at school, the same for all the pupils of a school."
    "examples":
      "ইউনিফর্মটা নীল।":
        "native": "The uniform is blue."
        "bases":
          "ইউনিফর্মটা": "school uniform"
      "আজ ইউনিফর্ম পরো।":
        "native": "Wear your uniform today."
        "bases":
          "ইউনিফর্ম": "school uniform"
          "পরো": "to wear"
  "bn-1907":
    "native": "attendance; roll call"
    "notes":
      "n1": "The record of who is at school that day. A teacher takes হাজিরা (hājirā) at the start of a class."
    "examples":
      "হাজিরা নেওয়া হয়েছে।":
        "native": "Attendance has been taken."
        "bases":
          "হাজিরা": "attendance; roll call"
      "শিক্ষক প্রতিদিন হাজিরা নেন।":
        "native": "The teacher takes attendance every day."
        "bases":
          "হাজিরা": "attendance; roll call"
  "bn-1908":
    "native": "studies; schooling"
    "notes":
      "n1": "Reading and writing as a pupil does; the work of school in general."
    "examples":
      "লেখাপড়ায় মন দাও।":
        "native": "Pay attention to your studies."
        "bases":
          "লেখাপড়ায়": "studies; schooling"
          "মন": "mind"
      "লেখাপড়ার জন্য শান্ত জায়গা দরকার।":
        "native": "For studies, a quiet place is needed."
        "bases":
          "লেখাপড়ার": "studies; schooling"
          "জায়গা": "place"
  "bn-1909":
    "native": "chapter"
    "notes":
      "n1": "A part of a book, with a title or number, which a teacher sets for study."
    "examples":
      "আজ আমরা দ্বিতীয় অধ্যায় পড়ব।":
        "native": "Today we will read the second chapter."
        "bases":
          "অধ্যায়": "chapter"
          "পড়ব": "to read; to study"
      "পরের অধ্যায়টা কঠিন।":
        "native": "The next chapter is difficult."
        "bases":
          "পরের": "next; after"
          "অধ্যায়টা": "chapter"
  "bn-1910":
    "native": "break for a snack or lunch at school"
    "notes":
      "n1": "The break in the middle of the school day, and the snack or lunch eaten then."
    "examples":
      "টিফিনের সময় হয়ে গেছে।":
        "native": "It is tiffin time now."
        "bases":
          "টিফিনের": "break for a snack or lunch at school"
          "সময়": "time"
      "টিফিনে কী খাও?":
        "native": "What do you eat at tiffin?"
        "bases":
          "টিফিনে": "break for a snack or lunch at school"
  "bn-1911":
    "native": "rule"
    "notes":
      "n1": "A rule that people follow. A class has its own rules at school."
    "examples":
      "ক্লাসের একটা নিয়ম আছে।":
        "native": "There is one rule in the class."
        "bases":
          "নিয়ম": "rule"
          "আছে": "there is; to be"
      "সবাইকে নিয়ম মানতে হবে।":
        "native": "Everyone has to follow the rules."
        "bases":
          "নিয়ম": "rule"
          "মানতে": "to follow; to obey"
  "bn-1912":
    "native": "strict"
    "notes":
      "n1": "Strict, and hard on people who do not follow the rules. The opposite is নরম (nôrom)."
    "examples":
      "আমাদের শিক্ষক খুব কড়া।":
        "native": "Our teacher is very strict."
        "bases":
          "কড়া": "strict"
      "এই নিয়মটা খুব কড়া।":
        "native": "This rule is very strict."
        "bases":
          "এই": "this"
          "কড়া": "strict"
