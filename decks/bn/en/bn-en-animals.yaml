schema: 1
id: "bn-en-animals"
kind: "layer"
core: "bn-animals"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Animals"
description: "The animals of the farm, the forest, the house and the sky: the names to say what lives where. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-1273":
    native: "cow; cattle"
    wiktionary: true
    notes:
      "n1": "The cow is sacred to many Hindus, who do not eat beef. In the countryside cattle pull the plough and the cart."
      "n2": "Also spelled {1}. It is singular in form and names the animal, male or female."
    "examples": {
      "খামারে গরু আছে।": {"native": "There are cows on the farm.", "bases": {"খামারে": "farm", "আছে": "there are", "গরু": "cow; cattle"}},
      "গরু দুধ দেয়।": {"native": "The cow gives milk.", "bases": {}}
    }
  "bn-1274":
    native: "buffalo"
    notes:
      "n1": "The water buffalo, kept in the countryside to plough wet fields and to pull carts."
  "bn-1275":
    native: "goat"
    wiktionary: true
    notes:
      "n1": "Said of a person, it means a fool, and is not polite."
    "examples": {
      "ছেলেটা ছাগলকে ডাকে।": {"native": "The boy calls the goat.", "bases": {"ছাগলকে": "goat"}}
    }
  "bn-1276":
    native: "sheep"
    wiktionary: true
    notes:
      "n1": "In Bengal 'mutton' usually means goat meat, {1}, more than sheep."
  "bn-1277":
    native: "dog"
    wiktionary: true
    notes:
      "n1": "A pet and a street dog are alike {1}. Used of a person, it is an insult."
    "examples": {
      "কুকুরটাকে তাড়াল।": {"native": "He chased the dog away.", "bases": {"তাড়াল": "to chase away", "কুকুরটাকে": "dog"}},
      "কুকুরটা রাস্তায় দৌড়ায়।": {"native": "The dog runs in the road.", "bases": {"কুকুরটা": "dog"}}
    }
  "bn-1278":
    native: "cat"
    wiktionary: true
    notes:
      "n1": "Also spelled {1}, which is how many people say it."
    "examples": {
      "বিড়ালটা দুধ খায়।": {"native": "The cat drinks milk.", "bases": {"বিড়ালটা": "cat"}},
      "বিড়ালটা দুধ চাটল।": {"native": "The cat licked the milk.", "bases": {"চাটল": "to lick", "বিড়ালটা": "cat"}}
    }
  "bn-1279":
    native: "horse"
    wiktionary: true
    notes:
      "n1": "It is also the knight in chess."
    "examples": {
      "ঘোড়াগুলো মাঠে আছে।": {"native": "The horses are in the field.", "bases": {"আছে": "to be; there is", "ঘোড়াগুলো": "horse"}}
    }
  "bn-1280":
    native: "elephant"
    wiktionary: true
    notes:
      "n1": "It is also the bishop in chess."
    "examples": {
      "হাতিটা অনেক বড়।": {"native": "The elephant is very big.", "bases": {"হাতিটা": "elephant"}}
    }
  "bn-1281":
    native: "tiger"
    wiktionary: true
    notes:
      "n1": "The Bengal tiger is the national animal of both Bangladesh and India. The largest number of them live in the Sundarbans, the mangrove forest of the delta, shared by the two countries."
      "pair": "Only the aspirate moves: {1}, tiger, ends in the aspirated [gh]; {2}, share, begins with the aspirated [bh]."
    "examples": {
      "চিড়িয়াখানায় বাঘ আছে।": {"native": "There are tigers in the zoo.", "bases": {"চিড়িয়াখানায়": "zoo", "বাঘ": "tiger", "আছে": "there are"}},
      "বাঘ বিপন্ন প্রাণী।": {"native": "The tiger is an endangered animal.", "bases": {"বাঘ": "tiger"}}
    }
  "bn-1282":
    native: "lion"
    wiktionary: true
    notes:
      "n1": "A word from Sanskrit. It is also a common family name: {1} or {2}."
  "bn-1283":
    native: "bear"
    wiktionary: true
    notes:
      "n1": "A word from Sanskrit."
  "bn-1284":
    native: "monkey"
    wiktionary: true
    notes:
      "n1": "Said of a naughty child, it means a little monkey, a rascal."
    "examples": {
      "বাঁদরটা গাছে ওঠে।": {"native": "The monkey climbs the tree.", "bases": {"গাছে": "tree", "বাঁদরটা": "monkey"}}
    }
  "bn-1285":
    native: "deer"
    wiktionary: true
    notes:
      "n1": "The spotted deer of the Sundarbans is the {1}."
  "bn-1286":
    native: "jackal; fox"
    wiktionary: true
    notes:
      "n1": "The animal of the Bengal countryside is the jackal. The same word is used for a fox."
  "bn-1287":
    native: "snake"
    wiktionary: true
    notes:
      "n1": "Snakes are respected in Bengal and many villages honour Manasa, the goddess of snakes, in the rainy season."
    "examples": {
      "ঝোপের পাশে সাপ।": {"native": "There is a snake by the bush.", "bases": {"ঝোপের": "bush"}},
      "আমি সাপকে ভয় পাই।": {"native": "I am afraid of snakes.", "bases": {"সাপকে": "snake"}}
    }
  "bn-1288":
    native: "mouse; rat"
    wiktionary: true
    notes:
      "n1": "The same word covers a mouse and a rat."
  "bn-1289":
    native: "bird"
    wiktionary: true
    notes:
      "n1": "It is also a girl's name."
    "examples": {
      "জলাভূমিতে পাখি থাকে।": {"native": "Birds live in the wetland.", "bases": {"জলাভূমিতে": "wetland", "পাখি": "bird"}}
    }
  "bn-1290":
    native: "duck; goose"
    wiktionary: true
    notes:
      "n1": "The same word is for a duck and a goose."
    "examples": {
      "গ্রামে অনেক হাঁস আছে।": {"native": "There are many ducks in the village.", "bases": {"আছে": "to be; there is"}}
    }
  "bn-1291":
    native: "crow"
    wiktionary: true
    notes:
      "pair": "Only the last vowel differs: {1} is a crow and {2} an uncle."
  "bn-1292":
    native: "peacock"
    wiktionary: true
    notes:
      "n1": "A word from Sanskrit."
    "examples": {
      "ময়ূরটা খুব সুন্দর।": {"native": "The peacock is very beautiful.", "bases": {"ময়ূরটা": "peacock"}}
    }
  "bn-1293":
    native: "parrot"
    wiktionary: true
    notes:
      "n1": "The green parrot, {1}."
  "bn-1294":
    native: "frog"
    wiktionary: true
    notes:
      "n1": "Also spelled {1}. Frogs croak loudest in the rainy season."
  "bn-1295":
    native: "mosquito"
    wiktionary: true
    notes:
      "n1": "{1} is a mosquito net."
    "examples": {
      "মশা কামড়ায়।": {"native": "Mosquitoes bite.", "bases": {"কামড়ায়": "to bite", "মশা": "mosquito"}},
      "ঘরে কোনো মশা নেই।": {"native": "There are no mosquitoes in the room.", "bases": {"নেই": "there is not"}}
    }
  "bn-1296":
    native: "butterfly"
    wiktionary: true
    notes:
      "n1": "A word from Sanskrit: the lord of creatures. Bengali uses it for a butterfly."
