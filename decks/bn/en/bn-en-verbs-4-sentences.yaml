schema: 1
id: "bn-en-verbs-4-sentences"
kind: "layer"
core: "bn-verbs-4-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Story actions: sentences"
description: "Short sentences that tell what happened, one action after another. They unlock once their words and rules are known. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-4209":
    native: "The boy hit the ball and the ball flew away."
    bases: { "মারল": "hit", "উড়ে": "flew" }
    notes:
      "n1": "উড়ে গেল (uṛe gel), flew away, is a compound verb: উড়ে (uṛe), flying, with গেল (gel), went, which adds 'away'."
    confusables: { "c1": { why: "threw: a different action with the ball" }, "c2": { why: "caught: the opposite action" } }
  "bn-4210":
    native: "The mother laid the child down on the bed."
    bases: { "শিশুকে": "the child" }
    notes:
      "n1": "শোয়াল (śoyāl) is the causative of শোয়া (śoyā), to lie: -আল (-āl) makes 'to make lie down', so 'laid down'."
    confusables: { "c1": { why: "woke: the opposite of laying down" }, "c2": { why: "seated: a different position" } }
  "bn-4211":
    native: "Why are you shouting so loudly? (familiar)"
    bases: { "এত": "so" }
    notes:
      "n1": "করছ (kôroch) is the familiar present continuous of করা (kôrā), with -ছ (-ch) for 'you are'."
    confusables: { "c1": { why: "whispering: the opposite of shouting" }, "c2": { why: "laughing: a different action" } }
  "bn-4212":
    native: "The leaves are falling down."
    bases: { "ঝরে": "falling" }
    notes:
      "n1": "ঝরে পড়ছে (jhôre pôṛoche), falling down, is a compound: ঝরে (jhôre) with পড়ছে (pôṛoche), is falling."
    confusables: { "c1": { why: "growing: the opposite of falling" }, "c2": { why: "flying: a different movement" } }
  "bn-4213":
    native: "In the rain the road is slippery."
    confusables: { "c1": { why: "dry: the opposite of slippery" }, "c2": { why: "wet: a related but different word" } }
  "bn-4214":
    native: "A new house was built."
    confusables: { "c1": { why: "broken: the opposite of built" }, "c2": { why: "repair: a different action" } }
  "bn-4215":
    native: "The shirt tore."
    bases: { "ছিঁড়ে": "tore" }
    confusables: { "c1": { why: "sewing: the repair, not the tear" }, "c2": { why: "washing: a different action" } }
  "bn-4216":
    native: "She made me laugh."
    notes:
      "n1": "হাসাল (hāsāl), made laugh, is the causative of হাসা (hāsā), to laugh: -আল (-āl)."
    confusables: { "c1": { why: "made cry: the opposite effect" }, "c2": { why: "made think: a different effect" } }
  "bn-4217":
    native: "In the very cold, the hands are shaking."
    confusables: { "c1": { why: "hot: the opposite of cold" }, "c2": { why: "calm: the opposite of shaking" } }
  "bn-4218":
    native: "The teacher explained the topic."
    notes:
      "n1": "করলেন (kôrolen) takes the -লেন (-len) respect ending, for the teacher."
    confusables: { "c1": { why: "asked: the question, not the explanation" }, "c2": { why: "wrote: a different action" } }
  "bn-4219":
    native: "The father scolded the son."
    confusables: { "c1": { why: "caring: the opposite of scolding" }, "c2": { why: "hit: a different and harsher action" } }
  "bn-4220":
    native: "The flood could not be stopped."
    notes:
      "n1": "যায়নি (jāyoni), did not go, after a verb stem ঠেকানো (ṭhekāno) means 'could not be stopped'."
    confusables: { "c1": { why: "to halt: close, but a different verb" }, "c2": { why: "an embankment: a thing, not an action" } }
