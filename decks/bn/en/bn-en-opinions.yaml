schema: 1
id: "bn-en-opinions"
kind: "layer"
core: "bn-opinions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Opinions"
description: "Saying what you think, agreeing and disagreeing, and giving reasons. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-2956":
    native: "opinion"
    notes:
      "n1": "{1}: Opinion: what someone thinks about something."
    examples:
      "তোমার মতামত কী?": { native: "What is your opinion?", bases: { "কী": "what" } }
      "সবার মতামত শুনলাম।": { native: "I heard everyone's opinion.", bases: { "সবার": "of everyone", "শুনলাম": "heard" } }
  "bn-2957":
    native: "view"
    notes:
      "n1": "{1}: A view or opinion: what one holds to be true."
    examples:
      "এটা আমার মত।": "This is my view."
      "মতগুলো আলাদা।": { native: "The views are different.", bases: { "মতগুলো": "view", "আলাদা": "different" } }
  "bn-2958":
    native: "argument"
    notes:
      "n1": "{1}: An argument: a heated discussion where people disagree."
    examples:
      "ওদের মধ্যে তর্ক হচ্ছে।": { native: "There is an argument between them.", bases: { "ওদের": "of them", "মধ্যে": "between" } }
      "তর্কে কাজ হয় না।": { native: "Work does not get done by arguing.", bases: { "তর্কে": "argument", "না": "not" } }
  "bn-2959":
    native: "reason"
    notes:
      "n1": "{1}: A reason: the grounds for thinking something is right."
    examples:
      "তোমার যুক্তি ঠিক।": { native: "Your reason is right.", bases: { "ঠিক": "right" } }
      "যুক্তিটা বুঝেছি।": { native: "I understand the reason.", bases: { "যুক্তিটা": "reason", "বুঝেছি": "understood" } }
  "bn-2960":
    native: "belief"
    notes:
      "n1": "{1}: Belief: holding something to be true."
    examples:
      "আমার বিশ্বাস সে ভালো।": "I believe she is good."
      "বিশ্বাসের কারণ কী?": { native: "What is the reason for the belief?", bases: { "বিশ্বাসের": "belief", "কী": "what" } }
  "bn-2961":
    native: "idea; notion"
    notes:
      "n1": "{1}: An idea or a notion: a view of how something is."
    examples:
      "এই ধারণাটা ভুল।": { native: "This idea is wrong.", bases: { "এই": "this", "ধারণাটা": "idea; notion" } }
      "নতুন ধারণা আনো।": { native: "Bring a new idea. (familiar)", bases: { "আনো": "bring" } }
  "bn-2962":
    native: "advice; a lesson"
    notes:
      "n1": "{1}: Advice given as a lesson on how to behave."
    examples:
      "বাবার উপদেশ মনে রেখো।": "Remember your father's advice. (familiar)"
      "উপদেশ দিও না।": { native: "Do not preach. (familiar)", bases: { "না": "not" } }
  "bn-2963":
    native: "dislike"
    notes:
      "n1": "{1}: Dislike: not liking something."
    examples:
      "আমার অপছন্দ ঠান্ডা খাবার।": { native: "I dislike cold food.", bases: { "খাবার": "food" } }
      "কেন এই অপছন্দ?": { native: "Why this dislike?", bases: { "এই": "this" } }
  "bn-2964":
    native: "criticism"
    notes:
      "n1": "{1}: Criticism: pointing out what is wrong or weak."
    examples:
      "সমালোচনা শুনতে ভালো লাগে না।": { native: "I do not like to hear criticism.", bases: { "শুনতে": "to hear", "না": "not" } }
      "তার সমালোচনা ন্যায্য।": "His criticism is fair."
  "bn-2965":
    native: "praise"
    notes:
      "n1": "{1}: Praise: saying good things about someone's work."
    examples:
      "সবাই তার প্রশংসা করল।": { native: "Everyone praised him.", bases: { "সবাই": "everyone" } }
      "প্রশংসার কথা শুনে খুশি।": { native: "Pleased at hearing the praise.", bases: { "প্রশংসার": "praise", "শুনে": "hearing", "খুশি": "pleased" } }
  "bn-2966":
    native: "support"
    notes:
      "n1": "{1}: Support: backing for a view or a person."
    examples:
      "তার সমর্থন দরকার।": "I need his support."
      "সমর্থনের জন্য ধন্যবাদ।": { native: "Thank you for the support.", bases: { "সমর্থনের": "support", "জন্য": "for", "ধন্যবাদ": "thank you" } }
  "bn-2967":
    native: "opposition"
    notes:
      "n1": "{1}: Opposition: acting or speaking against something."
    examples:
      "এই প্রস্তাবের বিরোধিতা হচ্ছে।": { native: "This proposal is being opposed.", bases: { "এই": "this" } }
      "বিরোধিতা সত্ত্বেও কাজ শুরু হলো।": { native: "The work started despite the opposition.", bases: { "সত্ত্বেও": "despite", "শুরু": "start" } }
  "bn-2968":
    native: "discussion"
    notes:
      "n1": "{1}: A discussion: talking a matter through with others."
    examples:
      "আলোচনা শুরু হলো।": { native: "The discussion has started.", bases: { "শুরু": "start" } }
      "আলোচনার বিষয় কী?": { native: "What is the topic of the discussion?", bases: { "আলোচনার": "discussion", "কী": "what" } }
  "bn-2969":
    native: "purpose; aim"
    notes:
      "n1": "{1}: Purpose: the aim one has in doing something."
    examples:
      "তোমার উদ্দেশ্য কী?": { native: "What is your purpose?", bases: { "কী": "what" } }
      "আমাদের উদ্দেশ্য ভালো।": "Our purpose is good."
  "bn-2970":
    native: "result; outcome"
    notes:
      "n1": "{1}: Result: what comes at the end of something."
    examples:
      "এর পরিণতি ভালো হয়নি।": { native: "The outcome was not good.", bases: { "এর": "its" } }
      "পরিণতির কথা ভাবো।": { native: "Think about the consequences. (familiar)", bases: { "পরিণতির": "result; outcome", "ভাবো": "think" } }
  "bn-2971":
    native: "decision"
    notes:
      "n1": "{1}: A decision: a choice made after thinking."
    examples:
      "সে একটা সিদ্ধান্ত নিয়েছে।": "She has made a decision."
      "সিদ্ধান্তটা ঠিক।": { native: "The decision is right.", bases: { "সিদ্ধান্তটা": "decision", "ঠিক": "right" } }
  "bn-2972":
    native: "proposal; suggestion"
    notes:
      "n1": "{1}: A proposal or suggestion put forward for others to consider."
    examples:
      "একটা নতুন প্রস্তাব আছে।": { native: "There is a new proposal.", bases: { "আছে": "there is" } }
      "প্রস্তাবটা সবাই মেনেছে।": { native: "Everyone has accepted the proposal.", bases: { "প্রস্তাবটা": "proposal; suggestion", "সবাই": "everyone", "মেনেছে": "accepted" } }
  "bn-2973":
    native: "solution"
    notes:
      "n1": "{1}: A solution: a way to end a problem."
    examples:
      "সমস্যার সমাধান কী?": { native: "What is the solution to the problem?", bases: { "কী": "what" } }
      "এটাই সমাধান।": { native: "This is the solution.", bases: { "এটাই": "this" } }
  "bn-2974":
    native: "problem"
    notes:
      "n1": "{1}: A problem: something hard to deal with."
    examples:
      "আমার একটা সমস্যা আছে।": { native: "I have a problem.", bases: { "আছে": "have" } }
      "সমস্যাগুলো বড়।": { native: "The problems are big.", bases: { "সমস্যাগুলো": "problem" } }
  "bn-2975":
    native: "point of view"
    notes:
      "n1": "{1}: A point of view: the way one looks at a matter."
    examples:
      "তোমার দৃষ্টিভঙ্গি আলাদা।": { native: "Your point of view is different.", bases: { "আলাদা": "different" } }
      "দুজনের দৃষ্টিভঙ্গি এক।": { native: "The two of them have the same point of view.", bases: { "দুজনের": "of the two", "এক": "same" } }
  "bn-2976":
    native: "opinion (formal)"
    notes:
      "n1": "{1}: An opinion, a formal word for what one thinks."
    examples:
      "আপনার অভিমত জানান।": { native: "Please give your opinion. (respectful)", bases: { "আপনার": "your (respectful)", "জানান": "tell" } }
      "অভিমতটা লিখে দিন।": { native: "Please write down the opinion. (respectful)", bases: { "অভিমতটা": "opinion (formal)", "লিখে": "writing" } }
  "bn-2977":
    native: "explanation"
    notes:
      "n1": "{1}: An explanation: making something clear."
    examples:
      "এর ব্যাখ্যা দাও।": { native: "Give an explanation of this. (familiar)", bases: { "এর": "of this" } }
      "ব্যাখ্যাটা সহজ।": { native: "The explanation is simple.", bases: { "ব্যাখ্যাটা": "explanation", "সহজ": "simple" } }
  "bn-2978":
    native: "disagreement"
    notes:
      "n1": "{1}: A disagreement: a difference of opinion."
    examples:
      "আমাদের মধ্যে মতভেদ আছে।": { native: "There is a difference of opinion between us.", bases: { "মধ্যে": "between", "আছে": "there is" } }
      "মতভেদ থাকলেও বন্ধু থাকি।": { native: "Even with a disagreement we stay friends.", bases: { "থাকলেও": "even if there is", "থাকি": "stay" } }
  "bn-2979":
    native: "agreed"
    notes:
      "n1": "{1}: Agreed: of the same opinion."
    examples:
      "আমি তোমার সঙ্গে একমত।": { native: "I agree with you.", bases: { "সঙ্গে": "with" } }
      "সবাই একমত হলো।": { native: "Everyone agreed.", bases: { "সবাই": "everyone" } }
  "bn-2980":
    native: "useful; helpful"
    notes:
      "n1": "{1}: Useful or helpful."
    examples:
      "এই বইটা খুব উপকারী।": { native: "This book is very useful.", bases: { "এই": "this" } }
      "উপকারী পরামর্শ দিলে।": "You gave helpful advice."
  "bn-2981":
    native: "reasonable"
    notes:
      "n1": "{1}: Reasonable: sensible and fair."
    examples:
      "তোমার কথা যুক্তিসঙ্গত।": "What you say is reasonable."
      "এই দাম যুক্তিসঙ্গত।": { native: "This price is reasonable.", bases: { "এই": "this" } }
  "bn-2982":
    native: "unfair"
    notes:
      "n1": "{1}: Unfair: not right or just."
    examples:
      "এটা অন্যায্য।": "This is unfair."
      "অন্যায্য আচরণ ভালো না।": { native: "Unfair behaviour is not good.", bases: { "আচরণ": "behaviour", "না": "not" } }
  "bn-2983":
    native: "fair"
    notes:
      "n1": "{1}: Fair: just, right, and equal."
    examples:
      "তোমার সিদ্ধান্ত ন্যায্য।": "Your decision is fair."
      "ন্যায্য বিচার চাই।": { native: "I want a fair judgement.", bases: { "বিচার": "judgement", "চাই": "to want" } }
  "bn-2984":
    native: "honest"
    notes:
      "n1": "{1}: Honest: truthful and not lying."
    examples:
      "সে খুব সৎ মানুষ।": { native: "She is a very honest person.", bases: { "মানুষ": "person" } }
      "সৎ থাকো।": "Stay honest. (familiar)"
  "bn-2985":
    native: "clever; wise"
    notes:
      "n1": "{1}: Clever and wise: quick to understand."
    examples:
      "তোমার বোন খুব বুদ্ধিমান।": "Your sister is very clever."
      "বুদ্ধিমান মানুষ ভেবে কথা বলে।": { native: "A wise person speaks after thinking.", bases: { "মানুষ": "person", "ভেবে": "thinking", "বলে": "speaks" } }
  "bn-2986":
    native: "foolish"
    notes:
      "n1": "{1}: Foolish: not thinking well."
    examples:
      "ওটা বোকা কাজ।": { native: "That is a foolish act.", bases: { "ওটা": "that" } }
      "বোকার মতো কথা বোলো না।": { native: "Do not talk like a fool. (familiar)", bases: { "বোকার": "of a fool", "মতো": "like", "বোলো": "talk", "না": "not" } }
  "bn-2987":
    native: "ugly"
    notes:
      "n1": "{1}: Ugly: not pleasant to see."
    examples:
      "ঘরের রংটা কুৎসিত।": "The room's colour is ugly."
      "কুৎসিত জিনিস ফেলে দাও।": "Throw away ugly things. (familiar)"
  "bn-2988":
    native: "proper; right"
    notes:
      "n1": "{1}: Proper or right: what ought to be done."
    examples:
      "তোমার ক্ষমা চাওয়া উচিত।": { native: "You ought to apologise.", bases: { "ক্ষমা": "forgiveness", "চাওয়া": "to want" } }
      "এটা করা উচিত নয়।": "This should not be done."
  "bn-2989":
    native: "certain"
    notes:
      "n1": "{1}: Certain: sure about something."
    examples:
      "আমি নিশ্চিত।": "I am certain."
      "তুমি কি নিশ্চিত?": { native: "Are you certain?", bases: { "কি": "whether" } }
  "bn-2990":
    native: "certainly; of course"
    notes:
      "n1": "{1}: Certainly, of course: without doubt."
    examples:
      "অবশ্যই যাব।": "I will certainly go."
      "আমি অবশ্যই একমত।": { native: "I certainly agree.", bases: { "একমত": "agreed" } }
  "bn-2991":
    native: "surely"
    notes:
      "n1": "{1}: Surely: without doubt."
    examples:
      "নিশ্চয় সে জানে।": { native: "Surely she knows.", bases: { "জানে": "knows" } }
      "নিশ্চয় ভালো হবে।": "It will surely be good."
  "bn-2992":
    native: "therefore"
    notes:
      "n1": "{1}: Therefore: so, as a result."
    examples:
      "সুতরাং আমি যাব না।": { native: "Therefore I will not go.", bases: { "না": "not" } }
      "কাজটা শেষ, সুতরাং বাড়ি যাও।": { native: "The work is finished, therefore go home. (familiar)", bases: { "শেষ": "finished" } }
  "bn-2993":
    native: "actually"
    notes:
      "n1": "{1}: Actually, in fact: the real truth is."
    examples:
      "আসলে ও ভুল বলেছে।": { native: "Actually, he was wrong.", bases: { "বলেছে": "said" } }
      "আসলে কী হয়েছিল?": { native: "What actually happened?", bases: { "কী": "what" } }
  "bn-2994":
    native: "that is to say"
    notes:
      "n1": "{1}: That is to say, in other words."
    examples:
      "সে দশটায় আসবে, অর্থাৎ সকালে।": { native: "She will come at ten, that is, in the morning.", bases: { "দশটায়": "at ten" } }
      "অর্থাৎ আমরা যাব না।": { native: "That is to say, we will not go.", bases: { "না": "not" } }
  "bn-2995":
    native: "of course, though"
    notes:
      "n1": "{1}: Of course, though: a qualification."
    examples:
      "অবশ্য তোমার কথা ঠিক।": { native: "Of course, what you say is right.", bases: { "ঠিক": "right" } }
      "আমি যাব, অবশ্য দেরিতে।": { native: "I will go, though late.", bases: { "দেরিতে": "late" } }
  "bn-2996":
    native: "not at all"
    notes:
      "n1": "{1}: Not at all: used to strengthen a no."
    examples:
      "আমি মোটেও রাগ করিনি।": "I was not angry at all."
      "এটা মোটেও ঠিক নয়।": { native: "This is not right at all.", bases: { "ঠিক": "right" } }
  "bn-2997":
    native: "in reality"
    notes:
      "n1": "{1}: In reality: as things actually are."
    examples:
      "বাস্তবে কাজটা কঠিন।": { native: "In reality the work is hard.", bases: { "কঠিন": "hard" } }
      "বাস্তবে সে এখানে নেই।": { native: "In reality she is not here.", bases: { "নেই": "is not" } }
  "bn-2998":
    native: "to give an opinion"
    notes:
      "n1": "{1}: To give an opinion: to say what one thinks."
    examples:
      "আমি একটা মত দিই।": "I give a view."
      "এ বিষয়ে তুমি মত দাও।": { native: "Give your view on this matter. (familiar)", bases: { "এ": "this" } }
  "bn-2999":
    native: "to agree"
    notes:
      "n1": "{1}: To agree: to hold the same opinion."
    examples:
      "আমরা সবাই একমত হলাম।": { native: "We all agreed.", bases: { "সবাই": "all" } }
      "তুমি কেন একমত হও না?": { native: "Why do you not agree? (familiar)", bases: { "না": "not" } }
  "bn-3000":
    native: "to think"
    notes:
      "n1": "{1}: To think: to consider something to be so."
    examples:
      "আমি মনে করি এটা ভালো।": "I think this is good."
      "তুমি কী মনে করো?": { native: "What do you think? (familiar)", bases: { "কী": "what" } }
  "bn-3001":
    native: "to argue"
    notes:
      "n1": "{1}: To argue: to dispute something with someone."
    examples:
      "ওরা রোজ তর্ক করে।": "They argue every day."
      "তর্ক না করে কথা বলো।": { native: "Speak without arguing. (familiar)", bases: { "না": "not" } }
  "bn-3002":
    native: "to suggest"
    notes:
      "n1": "{1}: To suggest: to put forward a proposal."
    examples:
      "আমি একটা প্রস্তাব করি।": "I make a proposal."
      "সে ছুটির প্রস্তাব করেছে।": "She has proposed a holiday."
  "bn-3003":
    native: "to advise"
    notes:
      "n1": "{1}: To advise: to give someone advice."
    examples:
      "ডাক্তার আমাকে পরামর্শ দিলেন।": { native: "The doctor advised me.", bases: { "আমাকে": "me" } }
      "আমার পরামর্শ নাও।": "Take my advice. (familiar)"
  "bn-3004":
    native: "to support"
    notes:
      "n1": "{1}: To support: to back someone or a view."
    examples:
