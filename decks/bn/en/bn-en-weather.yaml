  "bn-1613":
    native: "The six seasons"
    explanation: "The six seasons of the Bengali calendar, in the order a year turns: গ্রীষ্ম (griśm), বর্ষা (bôrśā), শরৎ (śôrot), হেমন্ত (hemonto), শীত (śit), বসন্ত (bôśonto). Each is about two months."
