core: "bn-pronouns-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Pronouns: sentences"
description: "Short sentences with the pronouns and the words of the first units: who is who, whose it is. They unlock once their words and rules are known. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-0856":
    native: "This is my elder brother. (respectful)"
    notes:
      "n1": "ইনি (ini) is the respectful word for 'this person', said of someone you respect, as in ইনি আমার দাদা (ini āmār dādā)."
  "bn-0857":
    native: "That is my elder sister, over there. (respectful)"
    notes:
      "n1": "উনি (uni) is the respectful 'that person', as in উনি আমার দিদি (uni āmār didi)."
  "bn-0858":
    native: "He is my friend.; She is my friend."
  "bn-0859":
    native: "Those are our friends."
    notes:
      "n1": "ওরা (orā) is the plural of ও (o), so it means 'they' for people; আমাদের (āmāder) is 'our'."
  "bn-0860":
    native: "He is my brother."
  "bn-0861":
    native: "What are these?"
    notes:
      "n1": "এগুলো (egulo) is the plural of এটা (eṭā), 'this', for things: 'these'."
  "bn-0862":
    native: "Whose is that?"
    notes:
      "n1": "কার (kār), 'whose', asks who something belongs to, as in ওটা কার (oṭā kār)."
  "bn-0863":
    native: "Whose are those?"
    notes:
      "n1": "ওগুলো (ogulo) is the plural of ওটা (oṭā), 'that', so it means 'those'."
  "bn-0864":
    native: "This isn't yours. (familiar)"
    notes:
      "n1": "না (nā) goes at the end of a statement to make it a 'not', as in এটা তোমার না (eṭā tomār nā), this is not yours."
  "bn-0865":
    native: "That isn't mine."
  "bn-0866":
    native: "Where is your friend? (familiar)"
    notes:
      "n1": "তোমার (tomār), 'your', is the familiar form; the respectful one is আপনার (āpnār), in the next card."
  "bn-0867":
    native: "Who is your friend? (respectful)"
    notes:
      "n1": "আপনার (āpnār), 'your', is the respectful form; the card before has the familiar তোমার (tomār)."
  "bn-0868":
    native: "Where is everybody?"
    notes:
      "n1": "সবাই (śôbāi), 'everybody', is built on সব (śôb), 'all'."
  "bn-0869":
    native: "Who are they?"
    notes:
      "n1": "কারা (kārā) is the plural of কে (ke), 'who', for more than one person: তারা কারা (tārā kārā), who are they?"
  "bn-0870":
    native: "We are friends."
    notes:
      "n1": "No word for 'are' is written: আমরা বন্ধু (āmrā bondhu) is a complete sentence, 'we are friends'."
  "bn-0871":
    native: "How are you all? (respectful)"
    notes:
      "n1": "আপনারা (āpnārā) is the respectful 'you all', and its verb আছেন (āchen) ends in -ন (-en), the respectful ending."
    bases:
      "আছেন": "to be; there is"
