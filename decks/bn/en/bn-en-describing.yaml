schema: 1
id: "bn-en-describing"
kind: "layer"
core: "bn-describing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing things and feelings"
description: "Hot and dry, wet and empty, wide and narrow, true and false, ill and well, and the words of hunger, thirst, fear, anger, sorrow and joy. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-0060":
    notes:
      "n1": "It is for weather, food, drinks and tempers: {1}, hot tea. A word from Persian."
  "bn-1227":
    native: "rich"
    wiktionary: true
    notes:
      "n1": "From {1}, wealth, with {2}: 'having wealth'. The opposite is {3}, poor."
  "bn-1228":
    native: "empty; bare"
    wiktionary: true
    notes:
      "n1": "It means empty and bare: {1}, barefoot; {2}, empty-handed."
    "examples": {
      "খালি পেটে": {"native": "on an empty stomach", "bases": {"খালি": "empty; bare"}},
      "গ্যারেজটা খালি।": {"native": "The garage is empty.", "bases": {"গ্যারেজটা": "garage", "খালি": "empty; bare"}}
    }
  "bn-1229":
    native: "full"
    wiktionary: true
    notes:
      "n1": "It is the adjective 'full' and also the verb 'to fill': {1}, a full stomach."
    "examples": {
      "আবেদনপত্রটা ভরো।": {"native": "Fill in the application form. (familiar)", "bases": {"আবেদনপত্রটা": "application form", "ভরো": "fill"}},
      "বোতলটা ভরা।": {"native": "The bottle is full.", "bases": {}}
    }
  "bn-1230":
    native: "closed; shut; stopped"
    wiktionary: true
    notes:
      "pair": "Not {1}, friend: {2} ends in the vowel [o], {1} in [u]."
      "n2": "A shut shop, a blocked road and a general strike are all {1}."
    "examples": {
      "কাউন্টারটা বন্ধ।": {"native": "The counter is closed.", "bases": {"কাউন্টারটা": "counter", "বন্ধ": "closed; shut; stopped"}},
      "কার্যালয় বন্ধ।": {"native": "The office is closed.", "bases": {"বন্ধ": "closed; shut; stopped"}}
    }
  "bn-1231":
    native: "wet"
    wiktionary: true
    notes:
      "n1": "{1} is to get wet, as in the rain."
    "examples": {
      "বৃষ্টিতে ভিজে ঠান্ডা লেগেছে।": {"native": "I got wet in the rain and caught a cold.", "bases": {}},
      "শিশিরে পা ভিজে গেল।": {"native": "My feet got wet with the dew.", "bases": {}}
    }
  "bn-1232":
    native: "dry"
    notes:
      "n1": "{1} is dry food, such as puffed rice or biscuits."
    "examples": {
      "খড় শুকনো।": {"native": "The straw is dry.", "bases": {"শুকনো": "dry"}},
      "আমার ছাতাটা শুকনো।": {"native": "My umbrella is dry.", "bases": {}}
    }
  "bn-1233":
    native: "thin (cloth, paper, liquid)"
    wiktionary: true
    notes:
      "n1": "It is thin for cloth, paper and soup, as against {1}, thick."
    "examples": {
      "ওজোন স্তর পাতলা।": {"native": "The ozone layer is thin.", "bases": {"স্তর": "layer"}}
    }
  "bn-1234":
    native: "wide"
    wiktionary: true
    notes:
      "n1": "{1} is a wide road."
    "examples": {
      "রাস্তাটা চওড়া।": {"native": "The road is wide.", "bases": {"রাস্তাটা": "the road"}}
    }
  "bn-1235":
    native: "narrow; thin"
    wiktionary: true
    notes:
      "n1": "A narrow lane is a {1}; a thin thread is a {2}."
    "examples": {
      "গলিটা সরু।": {"native": "The lane is narrow.", "bases": {}}
    }
  "bn-1236":
    native: "high; tall (of things)"
    notes:
      "n1": "{1} is a tall building. For a tall person Bengali says {2}."
    "examples": {
      "চূড়াটা উঁচু।": {"native": "The peak is high.", "bases": {"চূড়াটা": "peak (of a mountain)"}}
    }
  "bn-1237":
    native: "true; real"
    wiktionary: true
    notes:
      "n1": "It is also how you ask 'really?': {1}. It comes from Sanskrit {2}, truth."
    "examples": {
      "এটা সত্যি।": {"native": "This is true.", "bases": {}}
    }
  "bn-1238":
    native: "false; a lie"
    wiktionary: true
    notes:
      "n1": "{1} is a lie. The formal spelling is {2}."
    "examples": {
      "এটা মিথ্যে।": {"native": "This is false.", "bases": {}}
    }
  "bn-1239":
    native: "quiet; calm"
    wiktionary: true
    notes:
      "n1": "It is for a street, a child, a river or a mind: {1}, a quiet neighbourhood."
    "examples": {
      "অঞ্চলটা শান্ত।": {"native": "The region is calm.", "bases": {"অঞ্চলটা": "region", "শান্ত": "quiet; calm"}},
      "ঢেউগুলো শান্ত।": {"native": "The waves are calm.", "bases": {"ঢেউগুলো": "wave"}}
    }
  "bn-1240":
    native: "ill; unwell"
    wiktionary: true
    notes:
      "n1": "The formal word. In speech people say {1}, 'the body is bad'."
  "bn-1241":
    native: "well; healthy"
    wiktionary: true
    notes:
      "n1": "The opposite of {1}. {2} is 'keep well'."
    "examples": {
      "আপনি সুস্থ আছেন।": {"native": "You are well. (respectful)", "bases": {"আছেন": "to be; there is"}}
    }
  "bn-1242":
    native: "fun; funny"
    wiktionary: true
    notes:
      "n1": "From {1}, fun, with {2}: 'of fun'. It also means tasty."
    "examples": {
      "সংলাপগুলো মজার।": {"native": "The dialogues are funny.", "bases": {"সংলাপগুলো": "dialogue", "মজার": "fun; funny"}},
      "ছড়াটা খুব মজার।": {"native": "The rhyme is very funny.", "bases": {"ছড়াটা": "nursery rhyme; a short rhyme"}}
    }
  "bn-1243":
    native: "right; correct; exact"
    wiktionary: true
    notes:
      "n1": "{1} is 'all right'; {2} is 'at exactly the right time'."
    "examples": {
      "এটা ঠিক।": {"native": "This is right.", "bases": {}}
    }
  "bn-1244":
    native: "wrong; a mistake"
    wiktionary: true
    notes:
      "n1": "It is the adjective 'wrong' and the noun 'mistake': {1}, to make a mistake."
    "examples": {
      "এটা ভুল।": {"native": "This is wrong.", "bases": {}},
      "কোডটা ভুল।": {"native": "The code is wrong.", "bases": {"কোডটা": "code", "ভুল": "wrong; a mistake"}}
    }
  "bn-1245":
    native: "hunger"
    notes:
      "n1": "Bengali 'gets' hunger: {1}. Also spelled {2}."
    "examples": {
      "আমার খিদে নেই।": {"native": "I'm not hungry.", "bases": {"নেই": "there is not"}},
      "আমার খিদে পেয়েছে।": {"native": "I'm hungry.", "bases": {"খিদে": "hunger"}}
    }
  "bn-1246":
    native: "thirst"
    notes:
      "n1": "{1}, 'thirst is got', is to be thirsty. The formal word is {2}."
  "bn-1247":
    native: "sleep"
    notes:
      "n1": "{1} is to feel sleepy; the verb to sleep is {2}."
    "examples": {
      "ঘুম থেকে ওঠা": {"native": "to get up", "bases": {"ঘুম": "sleep"}}
    }
  "bn-1248":
    native: "fear"
    wiktionary: true
    notes:
      "n1": "{1} is to be afraid, and {2} is 'don't be afraid'."
    "examples": {
      "আমার ভয় করে।": {"native": "I'm afraid.", "bases": {}},
      "ভয় পেও না।": {"native": "Do not be afraid. (familiar)", "bases": {"না": "not", "ভয়": "fear"}}
    }
  "bn-1249":
    native: "anger"
    wiktionary: true
    notes:
      "n1": "{1} is to get angry. The same word is also a raga, a melody of Indian classical music."
    "examples": {
      "রাগে সংযম রাখো।": {"native": "Keep control in anger. (familiar)", "bases": {"রাগে": "anger"}},
      "আমি মোটেও রাগ করিনি।": {"native": "I was not angry at all.", "bases": {"রাগ": "anger"}}
    }
  "bn-1250":
    native: "sorrow; sadness"
    wiktionary: true
    notes:
      "n1": "{1} is to be sad; {2} is 'sorry'."
    "examples": {
      "সংবাদটা খুব দুঃখের।": {"native": "The news is very sad.", "bases": {"সংবাদটা": "news (formal)", "দুঃখের": "sad"}},
      "দুঃখের কথা আমাকে কাঁদাল।": {"native": "The sad words made me cry.", "bases": {"কাঁদাল": "to make cry", "দুঃখের": "sorrow; sadness"}}
    }
  "bn-1251":
    native: "joy; delight"
    wiktionary: true
    notes:
      "n1": "{1} is to enjoy oneself and to celebrate. It is also a man's name."
    "examples": {
      "মিলনের আনন্দ অনেক।": {"native": "The joy of the reunion is great.", "bases": {"মিলনের": "union; reunion", "আনন্দ": "joy; delight"}},
      "সাক্ষাৎ খুব আনন্দের।": {"native": "The meeting is very happy.", "bases": {"আনন্দের": "joy; delight"}}
    }
  "bn-1252":
    native: "fun; tastiness"
    wiktionary: true
    notes:
      "pair": "Not {1}, socks: the first vowel of {2} is the open [ô], that of {1} a closed [o]."
      "n2": "{1} is to joke or to have fun. A word from Persian."
    "examples": {
      "বিজ্ঞান ক্লাস মজার।": {"native": "The science class is fun.", "bases": {"মজার": "fun; tastiness"}},
      "ভ্রমণ খুব মজার।": {"native": "Travel is very fun.", "bases": {"মজার": "fun; tastiness"}}
    }
  "bn-1253":
    native: "worry; thought"
    wiktionary: true
    notes:
      "n1": "{1} is to worry, or to think a matter over. {2} is 'no worry'."
    "examples": {
      "চিন্তা করবেন না।": {"native": "Don't worry.", "bases": {"চিন্তা": "worry; thought"}},
      "এত চিন্তা করো না।": {"native": "Do not worry so much. (familiar)", "bases": {"এত": "so", "না": "not"}}
    }
