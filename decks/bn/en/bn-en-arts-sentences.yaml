schema: 1
id: "bn-en-arts-sentences"
kind: "layer"
core: "bn-arts-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Arts: sentences"
description: "Short sentences about painting, music, dance and galleries. They unlock once their words and rules are known. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-3654":
    native: "I will go to the gallery this afternoon."
    notes:
      "n1": "যাব (jāb) is the first-person future of যাওয়া (jāoyā), to go."
    confusables: { "c1": { why: "a museum: old things, not an art gallery" }, "c2": { why: "a school: a place of lessons, not an exhibition" } }
  "bn-3655":
    native: "The picture looked very beautiful."
    confusables: { "c1": { why: "ugly: the opposite of beautiful" }, "c2": { why: "old: a different quality" } }
  "bn-3656":
    native: "The dancer danced on the stage."
    notes:
      "n1": "নাচল (nācol) is the plain past of নাচা (nācā), to dance, for a third person: 'danced'."
    confusables: { "c1": { why: "singer: sings, does not dance" }, "c2": { why: "writer: writes, does not dance" } }
  "bn-3657":
    native: "The sitar's tune is very sweet."
    notes:
      "n1": "সেতারের (setārer) is সেতার (setār), sitar, with the genitive -এর (-er), 'of the sitar'."
    confusables: { "c1": { why: "flute: a different instrument" }, "c2": { why: "a large drum: a different instrument" } }
  "bn-3658":
    native: "The artists are drawing new pictures."
    notes:
      "n1": "আঁকছেন (ām̐kochen) is the continuous form of আঁকা (ām̐kā), to draw, with the respectful ending -ছেন (-chen)."
    confusables: { "c1": { why: "writes: writing words, not drawing" }, "c2": { why: "reads: a different act" } }
  "bn-3659":
    native: "The craftsman makes statues by hand."
    bases: { "বানান": "makes" }
    notes:
      "n1": "বানান (bānān) is the respectful present of বানানো (bānāno), to make, with the -ন (-n) ending used for a person one respects."
    confusables: { "c1": { why: "buys: the opposite of making" }, "c2": { why: "breaks: the opposite of making" } }
  "bn-3660":
    native: "The portrait is my father's."
    confusables: { "c1": { why: "the picture: a picture, not a portrait of a person" }, "c2": { why: "mother: a different family member" } }
  "bn-3661":
    native: "The costume of the play is beautiful."
    confusables: { "c1": { why: "shoes: clothes for the feet, not a costume" }, "c2": { why: "a hat: a single item, not the whole costume" } }
  "bn-3662":
    native: "The critic praised the show."
    notes:
      "n1": "করলেন (kôrolen) is the respectful past of করা (kôrā), to do, with the -লেন (-len) ending for a person one respects."
    confusables: { "c1": { why: "blame: the opposite of praise" }, "c2": { why: "a mistake: a different thing" } }
  "bn-3663":
    native: "The picture was sold at the auction for a high price."
    notes:
      "n1": "বিক্রি হলো (bikri hôlo), was sold, joins the noun বিক্রি (bikri), sale, with হলো (hôlo), became."
    confusables: { "c1": { why: "a gift: given, not sold" }, "c2": { why: "a loan: borrowed, not sold" } }
  "bn-3664":
    native: "Protecting the heritage of the fine arts is important."
    bases: { "রক্ষা": "protecting" }
    notes:
      "n1": "রক্ষা করা (rôkkhā kôrā) means 'to protect': the noun রক্ষা (rôkkhā), protection, with করা (kôrā), to do."
    confusables: { "c1": { why: "destruction: the opposite of protecting" }, "c2": { why: "neglect: a related but different act" } }
