schema: 1
id: "bn-en-grammar-can-must"
kind: "layer"
core: "bn-grammar-can-must"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Can, want to, have to"
description: "The verb's -তে (-te) form with পারা (pārā), চাওয়া (cāoā) and হবে (hôbe). Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "grammar"]
cards:
  "bn-0736":
    native: "to be able; can"
    notes:
      "n1": "After the verb's -তে (-te) form: বলতে পারি (bôlote pāri), I can speak."
  "bn-0737":
    native: "I can speak Bengali."
    notes:
      "n1": "'Can' is পারা (pārā) after the verb's -তে (-te) form: বলতে (bôlote), করতে (kôrote), but যেতে (jete), খেতে (khete), দিতে (dite), নিতে (nite) and হতে (hôte)."
    bases:
      "বাংলা": "Bengali (the language); Bengal"
  "bn-0738":
    native: "I can't swim."
    notes:
      "n1": "না (nā) goes after পারি (pāri). Swimming is সাঁতার কাটা (sām̐tār kāṭā), 'to cut a swim'."
    bases:
      "সাঁতার": "swimming"
  "bn-0739":
    native: "I couldn't go."
    notes:
      "n1": "'Couldn't' is পারিনি (pārini), the present with -নি (-ni)."
  "bn-0740":
    native: "Could you help me a little?"
    notes:
      "n1": "The future পারবেন (pāroben) makes the request polite. পারেন (pāren)? is also right."
  "bn-0741":
    native: "to want"
    notes:
      "n1": "A thing wanted comes before it: আমি চা চাই (āmi cā cāi), I want tea."
  "bn-0742":
    native: "I want to go home."
    notes:
      "n1": "'Want to': the -তে (-te) form, then চাওয়া (cāoā)."
  "bn-0743":
    native: "I have to go to work tomorrow."
    notes:
      "n1": "'Have to': the one who must takes -কে (-ke), then the -তে (-te) form and হবে (hôbe)."
  "bn-0744":
    native: "You don't have to come."
    notes:
      "n1": "না (nā) after হবে (hôbe): no need."
  "bn-0745":
    native: "Can one take photos here?"
    notes:
      "n1": "'Can one': the verbal noun (তোলা) with যায় (jāy)."
  "bn-0746":
    native: "You should rest."
    notes:
      "n1": "'Should': the one who should takes -র (-rô), then the verbal noun and উচিত (ucit)."
    bases:
      "বিশ্রাম": "rest"
      "উচিত": "proper; should"
