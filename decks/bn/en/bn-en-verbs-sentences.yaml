schema: 1
id: "bn-en-verbs-sentences"
kind: "layer"
core: "bn-verbs-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Everyday verbs: sentences"
description: "Short sentences with the present tense: what people eat, where they live, what they say, and polite requests. They unlock once their words and rules are known. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-0900":
    native: "We eat rice."
    notes:
      "n1": "খাই (khāi), 'I eat' or 'we eat', takes the -ি (-i) ending that serves আমি (āmi) and আমরা (āmrā) alike."
  "bn-0901":
    native: "What do you eat? (familiar)"
    notes:
      "n1": "খাও (khāo) takes -ো (-o) for তুমি (tumi), the familiar 'you'; the respectful form is খান (khān), in the next card."
  "bn-0902":
    native: "What do you eat? (respectful)"
  "bn-0903":
    native: "Where do you go? (familiar)"
  "bn-0904":
    native: "Where do you go? (respectful)"
  "bn-0905":
    native: "Where does he live?; Where does she live?"
    notes:
      "n1": "থাকে (thāke), 'lives', takes -ে (-e) for someone who is not there, such as সে (śe), 'he or she'."
  "bn-0906":
    native: "Where do you live? (respectful)"
    notes:
      "n1": "থাকেন (thāken) takes -েন (-en) for আপনি (āpni), the respectful 'you'; for সে (śe) the verb ends in -ে (-e)."
  "bn-0907":
    native: "I speak Bengali."
    bases:
      "বাংলা": "Bengali (the language); Bengal"
  "bn-0908":
    native: "You speak Bengali. (respectful)"
    bases:
      "বাংলা": "Bengali (the language); Bengal"
  "bn-0909":
    native: "I learn Bengali."
    bases:
      "বাংলা": "Bengali (the language); Bengal"
  "bn-0910":
    native: "He learns Bengali.; She learns Bengali."
    bases:
      "বাংলা": "Bengali (the language); Bengal"
  "bn-0911":
    native: "Do you know Bengali? (respectful)"
    bases:
      "বাংলা": "Bengali (the language); Bengal"
  "bn-0912":
    native: "I understand Bengali."
    bases:
      "বাংলা": "Bengali (the language); Bengal"
  "bn-0913":
    native: "What does he do?; What does she do? (respectful)"
    notes:
      "n1": "তিনি (tini), the respectful 'he or she', takes the respectful ending -েন (-en): করেন (kôren), 'does'."
  "bn-0914":
    native: "What does he say?; What does she say?"
  "bn-0915":
    native: "What do you do? (intimate)"
    notes:
      "n1": "করিস (koriś) takes -িস (-iś), the ending for তুই (tui), the most intimate 'you'."
  "bn-0916":
    native: "He calls me.; She calls me."
    notes:
      "n1": "আমাকে (āmāke), 'me', is the object form of আমি (āmi), with the -কে (-ke) ending."
  "bn-0917":
    native: "I call him.; I call her."
    notes:
      "n1": "তাকে (tāke) is 'him' or 'her' as the object: one word for both, as the English shows."
  "bn-0918":
    native: "Father calls me. (respectful)"
  "bn-0919":
    native: "Mother looks at me. (respectful)"
  "bn-0923":
    native: "Please listen. (respectful)"
    notes:
      "n1": "শুনুন (śunun) takes the polite request ending -ুন (-un) for আপনি (āpni): 'please listen'."
  "bn-0921":
    native: "Please go ahead and say it. (respectful)"
  "bn-0922":
    native: "Please give it to me."
    notes:
      "n1": "দিন (din) is the polite request form of দেওয়া (deoā), 'to give', and আমাকে দিন (āmāke din) means 'give me'."
