  "bn-1071":
    native: "side"
    notes:
      "n1": "It is also the English 'pass': {1}, to pass an exam."
  "bn-1072":
    native: "beside; next to"
    wiktionary: true
    notes:
      "n1": "It is the locative of {1}, side, and follows a possessive: {2}, beside the river."
  "bn-1073":
    native: "the middle"
    notes:
      "n1": "From {1}, middle, and {2}, 'part'."
  "bn-1074":
    native: "in the middle"
    notes:
      "n1": "The locative of {1}. It follows a possessive: {2}, in the middle of the room."
  "bn-1075":
    native: "corner"
    wiktionary: true
    notes:
      "n1": "It is said exactly like {1}, 'which': Bengali says the {2} as an ordinary {3}, so only the spelling tells them apart."
  "bn-1076":
    native: "direction; side"
    wiktionary: true
    notes:
      "n1": "{1}, 'in which direction', is how you ask the way."
  "bn-1077":
    native: "north"
    wiktionary: true
    notes:
      "n1": "The same word is also 'answer': {1}, the answer to a question."
  "bn-1078":
    native: "south"
    wiktionary: true
    notes:
      "n1": "It is often said with {1}: {2}, to the south."
  "bn-1079":
    native: "east"
    wiktionary: true
    notes:
      "n1": "In speech the east is also {1}. The same word also means 'earlier'."
  "bn-1080":
    native: "west"
    wiktionary: true
    notes:
      "n1": "{1} is West Bengal, the state of India where Bengali is the main language."
  "bn-1081":
    native: "opposite; on the other side"
    notes:
      "n1": "From {1}, 'the other way round', and {2}, side."
  "bn-1082":
    native: "nearby; close together"
    notes:
      "n1": "It repeats {1}, near, to mean 'close to one another'."
  "bn-1083":
    native: "all around"
    notes:
      "n1": "Literally 'on four sides': {1}, four, and {2}, side."
  "bn-1084":
    native: "on the other side; across"
    notes:
      "n1": "It means across a river or a road. {1} is on this side."
