schema: 1
id: "bn-en-grammar-comparison"
kind: "layer"
core: "bn-grammar-comparison"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Comparison: bigger, biggest, than"
description: "An adjective does not change for comparison. Say আরও (āro), still more, before it for -er, and সবচেয়ে (śôbceye), than all, for -est; for 'than', put the other thing with its possessive before চেয়ে (ceye). Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "more": "{meaning}, with আরও (āro) before it"
    "most": "{meaning}, with সবচেয়ে (śôbceye) before it"
rules:
  "bn-rule-comparison-more":
    name: "Still more: আরও (āro) before an adjective, or চেয়ে (ceye) for 'than'"
    explanation: "{1} before an adjective makes it bigger, when nothing is compared. The adjective never changes. To say 'than', put the other thing with a possessive before {2}: আমার চেয়ে (āmār ceye), than me."
  "bn-rule-comparison-most":
    name: "The most: সবচেয়ে (śôbceye) before an adjective"
    explanation: "{1} means 'than all'. Before an adjective it makes the most of its kind: the biggest, the best. The adjective never changes."
