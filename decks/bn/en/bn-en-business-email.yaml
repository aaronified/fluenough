schema: 1
id: "bn-en-business-email"
kind: "layer"
core: "bn-business-email"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Business: writing an email"
license: "CC-BY-SA-4.0"
description: "Phrases and words for a formal work email: the greeting, the request, the attachment, the reply and the closing."
cards:
  "bn-7180":
    native: "Dear Sir,"
    notes: { n1: "মাননীয় (mānoniyo) is honourable and মহাশয় (môhāśoy) is a respectful form of address for a man; the pair opens a formal letter or email to someone you do not know by name." }
  "bn-7181":
    native: "I have received your email."
  "bn-7182":
    native: "I have attached the file to the email."
    notes: { n1: "সংযুক্ত করা (soṅjukto kôrā) is to attach, from সংযুক্ত (soṅjukto), joined, with করা (kôrā), to do; a phrase of attested words." }
  "bn-7183":
    native: "Please send the file."
    notes: { n1: "অনুগ্রহ করে (ônugroho kôre) is a more formal please than দয়া করে (dôyā kôre); পাঠিয়ে দিন (pāṭhiye din) is the polite command for আপনি (āpni)." }
  "bn-7184":
    native: "Subject: the meeting schedule"
  "bn-7185":
    native: "I am sorry to be late in replying."
    notes: { n1: "ক্ষমা করবেন (khômā kôrben) is please forgive me, said with the polite future of করা (kôrā) for আপনি (āpni); it asks politely rather than commands." }
  "bn-7186":
    native: "Thank you for your cooperation."
    notes: { n1: "সহযোগিতা (sôhojogitā) is cooperation and help, attested in the Bengali Wiktionary." }
  "bn-7187":
    native: "I am waiting for your reply."
  "bn-7188":
    native: "With thanks,"
    notes: { n1: "ধন্যবাদান্তে (dhonnobādānte) is a closing written at the end of a letter, meaning with thanks; the Bengali Wiktionary lists it for the end of a letter." }
  "bn-7189":
    native: "Please tell me your view on this matter."
