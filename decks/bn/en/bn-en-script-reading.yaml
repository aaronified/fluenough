cards:
  "bn-0051":
    notes:
      "n1": "Two letters under one headline. ঘ (ghô) is gho and র (rô) is ro, but the last o isn't said: ghor."
  "bn-0350":
    notes:
      "n1": "The headline runs on over both letters; the final o is quiet."
  "bn-0052":
    native: "pen"
    notes:
      "n1": "Three letters and no vowel written: ko-lo-m."
  "bn-0053":
    native: "forest"
    notes:
      "n1": "ব (bô) has no dot below. With one it would be র (rô)."
  "bn-0054":
    native: "chariot"
    notes:
      "n1": "র (rô) is ব (bô) with a dot below. থ (thô) has only half a headline."
  "bn-0055":
    native: "ball"
    notes:
      "n1": "ব (bô) and ল (lô) under one headline; the last o is quiet."
  "bn-0056":
    notes:
      "n1": "ফ (phô) is প (pô) with a curl and a breath after it: ph."
  "bn-0057":
    native: "way; path"
    notes:
      "n1": "প (pô) and থ (thô) both have only half a headline, so the line breaks over them."
  "bn-0058":
    native: "nail (of a finger)"
    notes:
      "n1": "খ (khô) has only half a headline."
  "bn-0211":
    native: "ten"
    notes:
      "n1": "শ (śô) has half a headline; it is said sh."
  "bn-0059":
    native: "liquid"
    notes:
      "n1": "ত (tô), র (rô) and ল (lô) each carry their o, and the last one is quiet."
  "bn-0060":
    native: "hot"
    notes:
      "n1": "গ (gô) has half a headline; then র (rô) and ম (mô)."
  "bn-0199":
    native: "city"
    notes:
      "n1": "শ (śô), হ (hô) and র (rô): no vowel written, and the last o is quiet."
  "bn-0061":
    native: "time"
    notes:
      "n1": "য় (yô) is য (jô) with a dot below, said y."
  "bn-0062":
    native: "big"
    notes:
      "n1": "ড় (ṛô) is ড (ḍô) with a dot below: the tongue is placed as for ড (ḍô), but doesn't touch the roof of the mouth. This word keeps its last o: boro."
  "bn-0202":
    native: "one"
    notes:
      "n1": "এ (e) has no headline, so the line starts only over ক (kô). এ (e) is a vowel letter, written in full at the start of a word."
