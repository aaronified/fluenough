schema: 1
id: "bn-en-script-reading"
kind: "layer"
core: "bn-script-reading"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words to read"
description: "Short everyday words written with letters alone, no vowel signs: the headline, the dot below and the vowel you do not see, at work. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "bn-0051":
    notes:
      "n1": "Two letters under one headline. ঘ (ghô) is gho and র (rô) is ro, but the last o isn't said: ghor."
    "examples": {
      "ঘরটা অন্ধকার।": {"native": "The room is dark.", "bases": {"ঘরটা": "room"}}
    }
  "bn-0350":
    notes:
      "n1": "The headline runs on over both letters; the final o is quiet."
  "bn-0052":
    native: "pen"
    notes:
      "n1": "Three letters and no vowel written: ko-lo-m."
  "bn-0053":
    native: "forest"
    notes:
      "n1": "ব (bô) has no dot below. With one it would be র (rô)."
    "examples": {
      "বন দক্ষিণে আছে।": {"native": "The forest is to the south.", "bases": {"আছে": "is", "বন": "forest"}},
      "বন সংরক্ষণ করো।": {"native": "Conserve the forest. (familiar)", "bases": {"বন": "forest"}}
    }
  "bn-0054":
    native: "chariot"
    notes:
      "n1": "র (rô) is ব (bô) with a dot below. থ (thô) has only half a headline."
  "bn-0055":
    native: "ball"
    notes:
      "n1": "ব (bô) and ল (lô) under one headline; the last o is quiet."
    "examples": {
      "সে বল ছুঁড়ল।": {"native": "He threw the ball.", "bases": {"ছুঁড়ল": "to throw", "বল": "ball"}},
      "সে বল ঠেকাল।": {"native": "He stopped the ball.", "bases": {"ঠেকাল": "to stop; to block", "বল": "ball"}}
    }
  "bn-0056":
    notes:
      "n1": "ফ (phô) is প (pô) with a curl and a breath after it: ph."
    "examples": {
      "অনুসন্ধানের ফল কী?": {"native": "What is the result of the search?", "bases": {"অনুসন্ধানের": "search", "কী": "what", "ফল": "fruit"}}
    }
  "bn-0057":
    native: "way; path"
    notes:
      "n1": "প (pô) and থ (thô) both have only half a headline, so the line breaks over them."
    "examples": {
      "ন্যায়ের পথে চলো।": {"native": "Walk the path of justice. (familiar)", "bases": {"ন্যায়ের": "justice; fairness", "পথে": "way; path"}},
      "সংযমই শান্তির পথ।": {"native": "Self-control is the path to peace.", "bases": {"সংযমই": "self-control", "পথ": "way; path"}}
    }
  "bn-0058":
    native: "nail (of a finger)"
    notes:
      "n1": "খ (khô) has only half a headline."
  "bn-0211":
    native: "ten"
    notes:
      "n1": "শ (śô) has half a headline; it is said sh."
    "examples": {
      "দশম পৃষ্ঠা খোলো।": {"native": "Open page ten. (familiar)", "bases": {"দশম": "ten"}}
    }
  "bn-0059":
    native: "liquid"
    notes:
      "n1": "ত (tô), র (rô) and ল (lô) each carry their o, and the last one is quiet."
  "bn-0060":
    native: "hot"
    notes:
      "n1": "গ (gô) has half a headline; then র (rô) and ম (mô)."
    "examples": {
      "জ্যাকেটটা গরম।": {"native": "The jacket is warm.", "bases": {"জ্যাকেটটা": "jacket", "গরম": "hot"}},
      "আজ খুব গরম।": {"native": "It's very hot today.", "bases": {}}
    }
  "bn-0199":
    native: "city"
    notes:
      "n1": "শ (śô), হ (hô) and র (rô): no vowel written, and the last o is quiet."
    "examples": {
      "গ্যালারিটা শহরের মাঝখানে।": {"native": "The gallery is in the middle of the town.", "bases": {"গ্যালারিটা": "gallery", "শহরের": "city"}}
    }
  "bn-0061":
    native: "time"
    notes:
      "n1": "য় (yô) is য (jô) with a dot below, said y."
    "examples": {
      "অবসর সময় খেলি।": {"native": "I play in my free time.", "bases": {"সময়": "time"}},
      "অ্যাপয়েন্টমেন্টের সময় দশটা।": {"native": "The appointment is at ten.", "bases": {"অ্যাপয়েন্টমেন্টের": "appointment", "দশটা": "ten o'clock", "সময়": "time"}}
    }
  "bn-0062":
    native: "big"
    notes:
      "n1": "ড় (ṛô) is ড (ḍô) with a dot below: the tongue is placed as for ড (ḍô), but doesn't touch the roof of the mouth. This word keeps its last o: boro."
    "examples": {
      "কোম্পানিটা বড়।": {"native": "The company is big.", "bases": {"কোম্পানিটা": "company", "বড়": "big"}},
      "কোর্টটা বড়।": {"native": "The court is big.", "bases": {"কোর্টটা": "court", "বড়": "big"}}
    }
  "bn-0202":
    native: "one"
    notes:
      "n1": "এ (e) has no headline, so the line starts only over ক (kô). এ (e) is a vowel letter, written in full at the start of a word."
