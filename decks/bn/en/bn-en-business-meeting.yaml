id: "bn-en-business-meeting"
kind: "layer"
core: "bn-business-meeting"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Business: a meeting"
license: "CC-BY-SA-4.0"
description: "Phrases and words for a work meeting: the agenda, the deadline, the proposal, the budget, agreeing and postponing."
cards:
  "bn-7190":
    native: "This is today's meeting agenda."
    notes: { n1: "কার্যসূচি (kārjosuci) is a list of the work to be done, an agenda; it is attested in the Bengali Wiktionary." }
  "bn-7191":
    native: "The deadline for the report is Monday."
  "bn-7192":
    native: "I will send the minutes of the meeting."
    notes: { n1: "কার্যবিবরণী (kārjobiboroni) is the written record of the work of a meeting, the minutes, as the Bengali Wiktionary has it; দেব (debo) with পাঠিয়ে (pāṭhiye) is I will send it along." }
  "bn-7193":
    native: "I have a proposal."
  "bn-7194":
    native: "The budget has been approved."
    notes: { n1: "বাজেট (bājeṭ) is a plan of income and spending, attested in the Bengali Wiktionary; করা হয়েছে (kôrā hôyeche) is the passive, has been done, as in the course's passive sentences." }
  "bn-7195":
    native: "The meeting has been postponed."
    notes: { n1: "স্থগিত (sthogito) means put off; করা হলো (kôrā hôlo) is the passive, was done, so the speaker does not say who postponed it." }
  "bn-7196":
    native: "I agree to this proposal."
    notes: { n1: "সম্মত (sômmoto) is agreed, consenting, and is a little more formal than একমত (ekmot), of one opinion." }
  "bn-7197":
    native: "I will be present at the meeting."
  "bn-7198":
    native: "When is the next meeting?"
    notes: { n1: "পরবর্তী (pôrborti) is next, the one that comes after, as the Bengali Wiktionary has it." }
  "bn-7199":
    native: "I do not agree on this matter."
    notes: { n1: "নই (noi) is the negative of হওয়া (hôoyā), to be, for আমি (āmi); with একমত (ekmot) it says I am not of one opinion." }
