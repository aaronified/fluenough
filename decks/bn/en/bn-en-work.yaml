schema: 1
id: "bn-en-work"
kind: "layer"
core: "bn-work"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Work"
description: "Jobs, and how to say what you do and where you work. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-0449":
    native: "job (employment)"
    notes:
      "n1": "আমি চাকরি করি (āmi cākri kori), I have a job. কাজ (kāj) is work of any kind."
    "examples": {
      "অস্থায়ীভাবে চাকরি পেয়েছি।": {"native": "I have got a temporary job.", "bases": {"চাকরি": "job (employment)"}},
      "আমি একটা চাকরি খুঁজছি।": {"native": "I am looking for a job.", "bases": {"খুঁজছি": "looking", "চাকরি": "job (employment)"}}
    }
  "bn-0450":
    native: "office"
    "examples": {
      "এটা সরকারি অফিস।": {"native": "This is a government office.", "bases": {"অফিস": "office"}},
      "পৌরসভার অফিস কোথায়?": {"native": "Where is the municipality office?", "bases": {"পৌরসভার": "municipality", "অফিস": "office"}}
    }
  "bn-0451":
    native: "teacher"
    notes:
      "n1": "A woman teacher is শিক্ষিকা (śikkhikā). A few job words have a feminine like this; most, like ডাক্তার (ḍāktār), do not."
    "examples": {
      "আমি একজন শিক্ষক।": {"native": "I'm a teacher.", "bases": {}},
      "ইতিহাসের শিক্ষক ভালো।": {"native": "The history teacher is good.", "bases": {"ইতিহাসের": "history", "শিক্ষক": "teacher"}}
    }
  "bn-0452":
    native: "shopkeeper"
    notes:
      "n1": "দোকান (dokān), shop, and -দার (-dār), the one who has it."
    "examples": {
      "দোকানদার টাকা ফেরাল।": {"native": "The shopkeeper gave the change back.", "bases": {"ফেরাল": "to return", "দোকানদার": "shopkeeper"}},
      "দোকানদার আমাকে ধার দিয়েছে।": {"native": "The shopkeeper has given me credit.", "bases": {}}
    }
  "bn-0453":
    native: "driver"
    notes:
      "n1": "In writing also চালক (cālok)."
  "bn-0454":
    native: "engineer"
  "bn-0455":
    native: "lawyer"
    notes:
      "n1": "The formal word is আইনজীবী (āinjibi)."
    "examples": {
      "বিবাদী উকিল নিলেন।": {"native": "The defendant hired a lawyer.", "bases": {"উকিল": "lawyer"}}
    }
  "bn-0456":
    native: "nurse"
  "bn-0457":
    native: "employee; clerk"
  "bn-0458":
    native: "mechanic; workman"
    notes:
      "n1": "Anyone who builds or mends: কাঠমিস্ত্রি (kāṭhmistri) is a carpenter."
  "bn-0459":
    native: "farmer"
    notes:
      "n1": "In everyday speech also চাষি (cāśi)."
    "examples": {
      "কৃষকের শ্রমে ধান হয়।": {"native": "Rice grows through the farmer's labour.", "bases": {"শ্রমে": "labour", "কৃষকের": "farmer"}}
    }
  "bn-0460":
    native: "cook"
  "bn-0461":
    native: "writer"
    notes:
      "n1": "From লেখা (lekhā), to write."
    "examples": {
      "হাস্যরসের লেখক তিনি।": {"native": "He is a writer of humour.", "bases": {"হাস্যরসের": "humour", "লেখক": "writer"}},
      "লেখকের পাণ্ডুলিপি হারিয়ে গেল।": {"native": "The writer's manuscript was lost.", "bases": {"লেখকের": "writer"}}
    }
  "bn-0462":
    native: "journalist"
    notes:
      "n1": "From সংবাদ (śôṅbād), news."
  "bn-0463":
    native: "day off; holiday; leave"
    notes:
      "n1": "আজ আমার ছুটি (āj āmār chuṭi), I'm off today."
    "examples": {
      "আমরা ছুটি কাটালাম।": {"native": "We spent the holiday.", "bases": {"কাটালাম": "to spend (time)", "ছুটি": "day off; holiday; leave"}},
      "ছুটিতে ভ্রমণে যাব।": {"native": "I will go travelling on holiday.", "bases": {"ভ্রমণে": "travel; a trip", "ছুটিতে": "day off; holiday; leave"}}
    }
  "bn-0464":
    native: "What do you do (for a living)?"
    notes:
      "n1": "কী (ki), with the long ই (i), is 'what'."
  "bn-0465":
    native: "I'm a teacher."
    notes:
      "n1": "একজন (ekjon), 'one person', is optional: আমি শিক্ষক (āmi śikkhok) is just as right. There is no 'am'."
  "bn-0466":
    native: "Where do you work?"
  "bn-0467":
    native: "I work in an office."
    notes:
      "n1": "The place takes -এ (-e): অফিসে (ôphise), in an office."
  "bn-0468":
    native: "He is a doctor.; She is a doctor."
    notes:
      "n1": "উনি (uni) is a respectful he or she for someone over there; ইনি (ini) for someone right here. No 'is'."
  "bn-0375":
    native: "police; police officer"
    "examples": {
      "পুলিশ সতর্ক আছে।": {"native": "The police are alert.", "bases": {"আছে": "are", "পুলিশ": "police; police officer"}},
      "আমি পুলিশে অভিযোগ করলাম।": {"native": "I made a complaint to the police.", "bases": {"পুলিশে": "police; police officer"}}
    }
  "bn-0470":
    native: "student"
    notes:
      "n1": "A woman student is ছাত্রী (chātri)."
    "examples": {
      "অনেক ছাত্র অনুপস্থিত।": {"native": "Many students are absent.", "bases": {"ছাত্র": "student"}},
      "ক্লাসরুমে অনেক ছাত্র।": {"native": "There are many students in the classroom.", "bases": {"ক্লাসরুমে": "classroom", "ছাত্র": "student"}}
    }
  "bn-0471":
    native: "business"
    "examples": {
      "ব্যবসার মূলধন কম।": {"native": "The business's capital is small.", "bases": {"ব্যবসার": "business"}},
      "এই ব্যবসায় ভালো লাভ হলো।": {"native": "This business made good profit.", "bases": {"এই": "this", "ব্যবসায়": "business"}}
    }
  "bn-0472":
    native: "salary; pay"
    notes:
      "n1": "Also মাইনে (māine), in everyday speech."
    "examples": {
      "মাসিক বেতন কত?": {"native": "What is the monthly salary? (familiar)", "bases": {"বেতন": "salary; pay"}},
      "সে বেতন বাড়ানোর দাবি করল।": {"native": "She demanded a pay rise.", "bases": {"বাড়ানোর": "raising", "দাবি": "claim", "বেতন": "salary; pay"}}
    }
