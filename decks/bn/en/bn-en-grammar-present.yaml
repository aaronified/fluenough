  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "kora": "to do"
    "jaoa": "to go"
    "khaoa": "to eat"
    "bola": "to say"
    "lekha": "to write"
    "dekha": "to see"
    "bojha": "to understand"
    "thaka": "to stay; to live"
    "deoa": "to give"
    "hoa": "to be; to become"
  notes: "The verb changes for person and for respect, never for gender or number: আমি (āmi) and আমরা (āmorā) take the same form. The endings are -ই (-i), -িস (-is), -ও (-o), -েন (-en), -ে (e), -েন (-en). After a vowel, as in যা- (jā-) and খা- (khā-), they are -ই (-i), -স (-śô), -ও (-o), -ন (-nô), -য় (-yô), -ন (-nô): যাই (jāi), যাস (jās), যাও (jāo), যান (jān), যায় (jāy), যান (jān). In লেখা (lekhā) and বোঝা (bojhā) the stem's vowel rises for আমি (āmi) and তুই (tui): লিখি (likhi) but লেখে (lekhe), বুঝি (bujhi) but বোঝে (bojhe). দেখা (dekhā) keeps its এ (e): দেখি (dekhi). দেওয়া (deoyā) shifts by person: দিই (dii), দাও (dāo), দেয় (dey). তুমি করো (tumi kôro) is also written কর (kôr), and both are accepted."
