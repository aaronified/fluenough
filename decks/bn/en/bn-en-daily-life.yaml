schema: 1
id: "bn-en-daily-life"
kind: "layer"
core: "bn-daily-life"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "A day"
description: "Getting up, meals, work and bed, and how often you do each. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-0657":
    native: "to get up"
    notes:
      "n1": "'To rise from sleep'. ওঠা (oṭhā) is to rise: আমি উঠি (āmi uṭhi), I get up."
  "bn-0658":
    native: "to wash one's face"
    notes:
      "n1": "ধোয়া (dhoyā), to wash: আমি মুখ ধুই (āmi mukh dhui), I wash my face."
  "bn-0659":
    native: "to brush one's teeth"
    bases:
      "মাজা": "to scrub; to brush (teeth)"
  "bn-0660":
    native: "to bathe; to have a shower"
    notes:
      "n1": "Also গোসল করা (gośol kôrā)."
    bases:
      "স্নান": "a bath; bathing"
  "bn-0661":
    native: "breakfast; a light meal"
    notes:
      "n1": "Also নাশ্তা (nāśtā), also written নাস্তা (nāstā)."
  "bn-0662":
    native: "lunch"
    notes:
      "n1": "'Midday's food': দুপুর (dupur), midday, takes -এর (-er)."
  "bn-0663":
    native: "dinner"
    notes:
      "n1": "'Night's food'."
  "bn-0664":
    native: "to go to work"
    notes:
      "n1": "কাজ (kāj), work, takes -এ (-e) for 'to': কাজে (kāje)."
  "bn-0665":
    native: "to come home"
    notes:
      "n1": "ফেরা (pherā) is to return. Also বাসায় ফেরা (bāśāy pherā)."
  "bn-0666":
    native: "to cook"
    bases:
      "রান্না": "cooking"
  "bn-0667":
    native: "to go to bed"
    notes:
      "n1": "Also ঘুমাতে যাওয়া (ghumāte jāoā), the form usually written."
  "bn-0668":
    native: "every day"
    notes:
      "n1": "In speech often রোজ (roj)."
  "bn-0669":
    native: "sometimes"
    bases:
      "মাঝে": "in the middle; at times"
  "bn-0670":
    native: "always"
    notes:
      "n1": "Also written as two words, সব সময় (śôb śômoy): 'all the time'."
  "bn-0671":
    native: "usually"
  "bn-0672":
    native: "then; after that"
    notes:
      "n1": "The word that strings a day together: তারপর (tārpor) … তারপর (tārpor) …"
  "bn-0673":
    native: "I get up at seven every day."
    notes:
      "n1": "-টায় (-ṭāy) is 'at' with a time: সাতটায় (śātṭāy), at seven. কটায়? (kotay?), at what time? ওঠা (oṭhā) changes its stem vowel here: উঠ- (uṭh-)."
  "bn-0674":
    native: "Then I go to work."
  "bn-0675":
    native: "I go to bed at eleven at night."
    notes:
      "n1": "The part of the day comes before the hour: রাত এগারোটায় (rāt egāroṭāy), at eleven at night; সকাল সাতটায় (śôkāl śātṭāy), at seven in the morning."
  "bn-0676":
    native: "I'm never late."
    notes:
      "n1": "'Never' is কখনও (kôkhono), also written কখনো (kôkhono), with না (nā) after the verb. দেরি (deri) is delay."
    bases:
      "কখনও": "ever; at any time"
      "দেরি": "delay; lateness"
