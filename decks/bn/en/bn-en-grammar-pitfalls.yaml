tags: ["beginner", "grammar"]
cards:
  "bn-0383":
    native: "Please sit down."
    notes:
      "n1": "With আপনি (āpni), the verb takes its respectful form. তুমি বসো (tumi bôso) is for friends; তুই বস (tui bôs) for the very close, and rude to a stranger."
  "bn-0384":
    native: "I don't know."
    notes:
      "n1": "না (nā) comes after the verb, never before it as 'not' does in English."
  "bn-0385":
    native: "I drink water."
    notes:
      "n1": "Bengali eats water and tea, and even cigarettes: খাওয়া (khāoyā) covers drinking and smoking. Also পানি (pāni): আমি পানি খাই (āmi pāni khāi)."
  "bn-0386":
    native: "I'm hungry."
    notes:
      "n1": "'Hunger has come to me'. So too আমার তেষ্টা পেয়েছে (āmār teśṭā peyeche), I'm thirsty. Also আমার ক্ষুধা লেগেছে (āmār khudhā legeche) and আমার পিপাসা লেগেছে (āmār pipāśā legeche)."
  "bn-0387":
    native: "I have to go."
    notes:
      "n1": "'To me, going will be': the one who must takes -কে (-ke)."
  "bn-0388":
    native: "She is my sister."
    notes:
      "n1": "ও (o) is he or she. Only বোন (bon), sister, says it is a woman."
  "bn-0389":
    native: "I'll come tomorrow."
    notes:
      "n1": "The doer is often left out: the verb's ending already says 'I'."
  "bn-0390":
    native: "Excuse me, could you move a little?"
    notes:
      "n1": "A request to a stranger often starts with an address: দাদা (dādā) or দিদি (didi), also ভাই (bhāi) or আপা (āpā). In many families দাদা (dādā) means grandfather. Without an address, a request can sound curt."
    bases:
      "সরুন": "to move aside"
  "bn-0747":
    native: "to smoke a cigarette"
    notes:
      "n1": "Cigarettes are eaten too: ও সিগারেট খায় না (o sigāreṭ khāy nā), he or she doesn't smoke. Also তামাক সেবন (tāmāk śebon), the slang for it."
    bases:
      "সিগারেট": "cigarette"
