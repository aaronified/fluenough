cards:
  "bn-5950":
    native: "Pride lives in the mind, not in money."
    notes:
      "literal": "Word for word: Pride is not in wealth; pride is in the mind."
      "spelling": "The old literary spelling is kept here, as it is printed in the source."
  "bn-5951":
    native: "Honour goes to the rich, while people of good family are kicked aside."
    notes:
      "literal": "Word for word: Hold the umbrella over the head of wealth; kick the head of a good family."
  "bn-5952":
    native: "Wanting a lot with nothing to back it up."
    notes:
      "literal": "Word for word: Nothing in the house, and a big appetite."
      "usage": "Said of someone who asks for far more than he has the means to take."
  "bn-5953":
    native: "The heart wants money, but who will hand it over?"
    notes:
      "literal": "Word for word: The mind wants wealth; which person gives it?"
  "bn-5954":
    native: "Slow and steady work wins in the end."
    notes:
      "literal": "Word for word: Weaving slowly, the weaver wins everything."
  "bn-5955":
    native: "A day lost to work that leads nowhere."
    notes:
      "literal": "Word for word: The day went on pointless work."
  "bn-5956":
    native: "Time passes, but what is said remains."
    notes:
      "literal": "Word for word: The days go; the words stay."
  "bn-5957":
    native: "Fortune comes and goes, and no one knows whose good days will pass."
    notes:
      "literal": "Word for word: Every night a tiger eats you in a dream; on which day does someone's good luck pass?"
  "bn-5958":
    native: "What fate has decided, no one can change."
    notes:
      "literal": "Word for word: If Krishna strikes, who protects? If Krishna protects, who strikes?"
  "bn-5959":
    native: "Say what you really think and people call you mad."
    notes:
      "literal": "Word for word: If you reveal what is in your mind, people call you mad."
      "spelling": "The old literary spelling is kept here, as it is printed in the source."
  "bn-5960":
    native: "Saying one thing and meaning another."
    notes:
      "literal": "Word for word: One thing in the mouth, another in the belly."
  "bn-5961":
    native: "Better to keep quiet, since speaking brings trouble."
    notes:
      "literal": "Word for word: Neither good nor bad; if you speak, it becomes bad."
  "bn-5962":
    native: "Study pays; neglect brings punishment."
    notes:
      "literal": "Word for word: If you study and listen, curds and rice; if you do not study, a poke from the stick."
      "spelling": "The old literary spelling is kept here, as it is printed in the source."
  "bn-5963":
    native: "Knowledge that is kept hidden and of no use to anyone."
    notes:
      "literal": "Word for word: Learning that is buried in the ground."
  "bn-5964":
    native: "People who share one house are bound to clash."
    notes:
      "literal": "Word for word: When two pots are kept together, they knock against each other."
      "usage": "Said of two people, or two households, who live under one roof and keep quarrelling."
      "spelling": "The old literary spelling is kept here, as it is printed in the source."
  "bn-5965":
    native: "Letting an outsider into the home ruins the family."
    notes:
      "literal": "Word for word: Keeping an outsider, the house is ruined."
  "bn-5966":
    native: "Said of a man with two wives, who is never at peace at home."
    notes:
      "literal": "Word for word: Whoever has two wives has great sorrow."
      "usage": "Said of a man with two wives, and of the trouble it brings to the home."
      "attitude": "The saying reflects an older attitude to marriage, and it is kept only as part of the source."
  "bn-5967":
    native: "A new authority brings new rules and new verdicts."
    notes:
      "literal": "Word for word: A new king's new judgement."
  "bn-5968":
    native: "Right wins in the end and wrongdoing wears away."
    notes:
      "literal": "Word for word: The victory of right; the decay of wrong."
  "bn-5969":
    native: "Wealth won by wrongdoing is lost in penance."
    notes:
      "literal": "Word for word: Money got by sin goes in atonement."
