id: "bn-en-describing-sentences"
kind: "layer"
core: "bn-describing-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing things and feelings: sentences"
description: "Short sentences that describe a place, a thing or a feeling. They unlock once their words and rules are known. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-1254":
    native: "It's very hot here."
    notes:
      "n1": "There is no verb: in Bengali the present 'is' is left out, so the sentence means 'it is very hot here'."
  "bn-1255":
    native: "I get very hungry."
    notes:
      "n1": "Literally 'hunger comes to me': খিদে (khide), hunger, is the subject and পায় (pāy), comes, is the verb."
  "bn-1256":
    native: "I'm not hungry."
    notes:
      "n1": "নেই (nei) is the negative of আছে (āche), there is; so খিদে (khide) নেই (nei) is literally 'hunger is not'."
    bases:
      "নেই": "there is not"
  "bn-1257":
    native: "I'm afraid."
    notes:
      "n1": "Literally 'my fear does': ভয় (bhôy), fear, with করে (kôre), does, means 'I am afraid'."
  "bn-1258":
    native: "The room is empty."
    notes:
      "n1": "-টা (-ṭā) marks one known thing, as in ঘরটা (ghôrṭā), the room."
  "bn-1259":
    native: "The shop is closed."
  "bn-1260":
    native: "The road is wide."
  "bn-1261":
    native: "The lane is narrow."
  "bn-1262":
    native: "The building is very tall."
  "bn-1263":
    native: "The shirt is wet."
  "bn-1264":
    native: "My umbrella is dry."
  "bn-1265":
    native: "The bottle is full."
  "bn-1266":
    native: "This is true."
    notes:
      "n1": "সত্যি (śotti), true, is the opposite of মিথ্যে (mitthe), false."
  "bn-1267":
    native: "This is false."
  "bn-1268":
    native: "He is ill.; She is ill. (respectful)"
    notes:
      "n1": "তিনি (tini) means he or she, and is also the respectful form for a person you respect."
  "bn-1269":
    native: "You are well. (respectful)"
    notes:
      "n1": "আছেন (āchen) is the respectful form of আছে (āche), to be, used with আপনি (āpni)."
    bases:
      "আছেন": "to be; there is"
  "bn-1270":
    native: "The boy is very quiet."
  "bn-1271":
    native: "This is right."
    notes:
      "n1": "ঠিক (ṭhik), right or correct, is the opposite of ভুল (bhul), wrong."
  "bn-1272":
    native: "This is wrong."
