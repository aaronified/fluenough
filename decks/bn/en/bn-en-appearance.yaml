schema: 1
id: "bn-en-appearance"
kind: "layer"
core: "bn-appearance"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Appearance: looks, height and age"
description: "Words for how people look: height, build, hair, face and skin, and age. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-2301":
    native: "short (of height)"
    notes:
      "n1": "Said of a short person or a short thing. For a short person, বেঁটে (bem̐ṭe) is also said."
    examples:
      "এই টেবিলটা খাটো।": { native: "This table is short.", bases: { "টেবিলটা": "the table" } }
      "আমি খাটো।": "I am short."
  "bn-2302":
    native: "old (of a person; informal)"
    notes:
      "n1": "Of a person, and informal. The formal word is বয়স্ক (bôyośko). The word for an old woman is বুড়ি (buṛi)."
    examples:
      "আমার দাদু বুড়ো হয়েছেন।": { native: "My grandfather has grown old.", bases: { "হয়েছেন": "has become (respectful)" } }
      "বুড়ো মানুষটি হাসছেন।": { native: "The old man is smiling. (respectful)", bases: { "মানুষটি": "the person", "হাসছেন": "is smiling (respectful)" } }
  "bn-2303":
    native: "young (of a person)"
    notes:
      "n1": "Of a person: young. A little more formal than the plain word for young. The opposite is বুড়ো (buṛo)."
    examples:
      "সে এখনো তরুণ।": "He is still young."
      "তরুণ ছেলেটি কাজ করছে।": "The young boy is working."
  "bn-2304":
    native: "elderly; grown-up (formal)"
    notes:
      "n1": "A formal word for an older person: বয়স্ক মানুষ (bôyośko ), an older person. The everyday word is বুড়ো (buṛo)."
    examples:
      "বয়স্ক মানুষদের সম্মান করো।": { native: "Respect older people.", bases: { "মানুষদের": "people" } }
      "উনি খুব বয়স্ক।": "He is very elderly. (respectful)"
  "bn-2305":
    native: "middle-aged"
    notes:
      "n1": "Of a person between young and old. For someone older, use বয়স্ক (bôyośko)."
    examples:
      "আমার কাকা মাঝবয়সী।": "My uncle is middle-aged."
      "মাঝবয়সী মহিলাটি হাসছেন।": { native: "The middle-aged woman is smiling. (respectful)", bases: { "মহিলাটি": "the woman", "হাসছেন": "is smiling (respectful)" } }
  "bn-2306":
    native: "young man"
    notes:
      "n1": "A young man. A young woman is যুবতী (juboti)."
    examples:
      "যুবক ছেলেটি খুব লম্বা।": "The young man is very tall."
      "একজন যুবক এসেছে।": { native: "A young man has come.", bases: { "এসেছে": "has come" } }
  "bn-2307":
    native: "young woman"
    notes:
      "n1": "A young woman. The young man is যুবক (jubok)."
    examples:
      "যুবতী মেয়েটি হাসছে।": { native: "The young woman is smiling.", bases: { "হাসছে": "is smiling" } }
      "একজন যুবতী এসেছেন।": { native: "A young woman has come. (respectful)", bases: { "এসেছেন": "has come (respectful)" } }
  "bn-2308":
    native: "fair-skinned"
    notes:
      "n1": "Said of skin: light in colour. The opposite is কালো (kālo)."
    examples:
      "তার রং ফর্সা।": "Her skin is fair."
      "সে ফর্সা।": "He is fair-skinned."
  "bn-2309":
    native: "grey (of hair); ripe (of fruit)"
    notes:
      "n1": "Of hair: grey, as in পাকা চুল (pākā cul), grey hair. Of fruit: ripe, as in পাকা ফল (pākā phôl), ripe fruit."
    examples:
      "মায়ের চুল পাকা।": "Mother's hair is grey."
      "এই পাকা ফলটা মিষ্টি।": { native: "This ripe fruit is sweet.", bases: { "ফলটা": "the fruit" } }
  "bn-2310":
    native: "appearance; look (face and build)"
    notes:
      "n1": "How a person looks: their face, height and build. In looks, চেহারায় (cehārāy), as in চেহারায় বাবার মতো (cehārāy bābār môto), like Father in looks."
    examples:
      "তার চেহারা ভালো।": "He looks good."
      "ওর চেহারা বাবার মতো।": { native: "He looks like Father.", bases: { "ওর": "his; her", "মতো": "like" } }
  "bn-2311":
    native: "features; the look of a face"
    notes:
      "n1": "The features of a face and how they look together, as in সুন্দর মুখশ্রী (śundor mukhośri), a lovely face."
    examples:
      "তোমার মুখশ্রী সুন্দর।": "Your features are lovely."
      "মেয়েটির মুখশ্রী খুব মিষ্টি।": "The girl has a very sweet face."
  "bn-2312":
    native: "smile; laugh"
    notes:
      "n1": "A smile, or a laugh. To smile is হাসা (hāśā)."
    examples:
      "তার মুখে হাসি আছে।": "There is a smile on her face."
      "ওর হাসি খুব সুন্দর।": { native: "Her smile is very lovely.", bases: { "ওর": "his; her" } }
  "bn-2313":
    native: "height (how tall someone is)"
    notes:
      "n1": "How tall someone or something is. The adjectives are লম্বা (lômbā), tall, and খাটো (khāṭo), short."
    examples:
      "তার উচ্চতা কত?": "How tall is he?"
      "আমার উচ্চতা পাঁচ ফুট।": "My height is five feet."
  "bn-2314":
    native: "medium; average"
    notes:
      "n1": "Between big and small: মাঝারি লম্বা (mājhāri lômbā), of medium height."
    examples:
      "আমি মাঝারি লম্বা।": "I am of medium height."
      "মাঝারি সাইজের জামা দাও।": { native: "Give me a medium-size shirt.", bases: { "সাইজের": "of size" } }
  "bn-2315":
    native: "moustache"
    notes:
      "n1": "A moustache. A beard is দাড়ি (dāṛi)."
    examples:
      "তার গোঁফ ঘন।": "His moustache is thick."
      "বাবার গোঁফ আছে।": "Father has a moustache."
  "bn-2316":
    native: "bald patch; baldness"
    notes:
      "n1": "A bald patch on the head: মাথায় টাক (māthāy ṭāk), a bald patch on the head."
    examples:
      "তার মাথায় টাক আছে।": "He has a bald patch on his head."
      "দাদুর মাথায় টাক পড়েছে।": { native: "Grandfather has started to go bald.", bases: { "পড়েছে": "has appeared" } }
  "bn-2317":
    native: "thick; dense (of hair or a beard)"
    notes:
      "n1": "Of hair, a beard or a moustache: thick. The opposite is পাতলা (pātlā), thin."
    examples:
      "তার চুল খুব ঘন।": "Her hair is very thick."
      "দাড়িটা ঘন।": "The beard is thick."
  "bn-2318":
    native: "curly"
    notes:
      "n1": "Of hair: curly. Straight hair is সোজা (śojā)."
    examples:
      "ওর চুল কোঁকড়া।": { native: "Her hair is curly.", bases: { "ওর": "his; her" } }
      "ছেলেটির কোঁকড়া চুল।": "The boy has curly hair."
  "bn-2319":
    native: "straight"
    notes:
      "n1": "Of hair, a line or a back: straight. Curly hair is কোঁকড়া (kom̐koṛā)."
    examples:
      "তার চুল সোজা।": "His hair is straight."
      "সোজা হয়ে দাঁড়াও।": { native: "Stand up straight. (familiar)", bases: { "হয়ে": "having become", "দাঁড়াও": "stand (familiar)" } }
  "bn-2320":
    native: "plait; braid"
    notes:
      "n1": "A plait of hair, as in বেণি করা (beni kôrā), to plait the hair."
    examples:
      "মেয়েটির বেণি লম্বা।": "The girl's plait is long."
      "মা আমার বেণি করেন।": "Mother plaits my hair."
  "bn-2321":
    native: "bun (hair knotted at the back)"
    notes:
      "n1": "Hair knotted at the back of the head, as in খোঁপা বাঁধা (khom̐pā bām̐dhā), to tie a bun."
    examples:
      "মায়ের খোঁপা ছোট।": "Mother's bun is small."
      "খোঁপা বাঁধো।": { native: "Tie your hair in a bun. (familiar)", bases: { "বাঁধো": "tie (familiar)" } }
  "bn-2322":
    native: "round and plump (of a face)"
    notes:
      "n1": "Of a face, a cheek or a child: round and plump. Not the same as মোটা (moṭā), fat."
    examples:
      "শিশুটির মুখ গোলগাল।": { native: "The baby's face is round and plump.", bases: { "শিশুটির": "the baby's" } }
      "তোমার গালটা গোলগাল।": "Your cheek is round and plump."
  "bn-2323":
    native: "plump; chubby (kindly)"
    notes:
      "n1": "A kinder word than মোটা (moṭā), fat: a plump, round body or child."
    examples:
      "দাদা মোটাসোটা।": "Elder brother is plump."
      "বাচ্চাটা খুব মোটাসোটা।": { native: "The child is very chubby.", bases: { "বাচ্চাটা": "the child" } }
  "bn-2324":
    native: "heavy; stocky (of a person)"
    notes:
      "n1": "Heavy in weight. Said of a person: stocky and heavy, more polite than মোটা (moṭā). ভারী শরীর (bhāri śorir), a heavy build."
    examples:
      "তিনি একটু ভারী।": "He is a little heavy-set."
      "ওর শরীর ভারী।": { native: "His build is stocky.", bases: { "ওর": "his; her" } }
  "bn-2325":
    native: "broad; wide"
    notes:
      "n1": "Of shoulders, a face or a road: broad, wide."
    examples:
      "তার কাঁধ চওড়া।": "His shoulders are broad."
      "রাস্তাটা চওড়া।": { native: "The road is wide.", bases: { "রাস্তাটা": "the road" } }
  "bn-2326":
    native: "sweet; pretty (of a child's face)"
    notes:
      "n1": "Of food, sweet. Of a child's face or smile, pretty and sweet, as in মিষ্টি মুখ (miśṭi mukh), a sweet face."
    examples:
      "ওর মুখটা মিষ্টি।": { native: "Her face is sweet.", bases: { "ওর": "his; her" } }
      "খাবারটা মিষ্টি।": { native: "The food is sweet.", bases: { "খাবারটা": "the food" } }
  "bn-2327":
    native: "beautiful (of a woman)"
    notes:
      "n1": "The feminine of সুন্দর (śundor) for a woman. For a man or a thing, use সুন্দর (śundor)."
    examples:
      "মেয়েটি সুন্দরী।": "The girl is beautiful."
      "একজন সুন্দরী মহিলা।": "A beautiful woman."
  "bn-2328":
    native: "mark; spot; scar"
    notes:
      "n1": "A mark on the skin: a scar, or a birthmark, as in জন্মদাগ (jônmodāg)."
    examples:
      "তার গালে একটা দাগ আছে।": "He has a mark on his cheek."
      "বাবার হাতে কালো দাগ।": "Father has a black mark on his hand."
  "bn-2329":
    native: "skin colour"
    notes:
      "n1": "The colour of the skin. গা (gā) is the body; গায়ের (gāyer) is of the body."
    bases: { "গায়ের": "of the body" }
    examples:
      "তার গায়ের রং ফর্সা।": { native: "Her skin is fair.", bases: { "গায়ের": "of the body" } }
      "আমার গায়ের রং কালো।": { native: "My skin is dark.", bases: { "গায়ের": "of the body" } }
  "bn-2330":
    native: "to look (like); to seem"
    notes:
      "n1": "How someone looks: দেখতে ভালো (dekhte bhālo), looks good. The stem is দেখ (dekh), and -তে (-te) is added to it. The verb is দেখা (dekhā)."
    examples:
      "ওকে দেখতে বাবার মতো।": { native: "He looks like Father.", bases: { "ওকে": "him; her" } }
      "তুমি দেখতে ভালো।": "You look good."
