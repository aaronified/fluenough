schema: 1
id: "bn-en-things-sentences"
kind: "layer"
core: "bn-things-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Things around you: sentences"
description: "Short sentences about what is where and whose it is. They unlock once their words and rules are known. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-1169":
    native: "This is my book."
    notes:
      "n1": "আমার (āmār), my, is the possessive form of আমি (āmi), I."
  "bn-1170":
    native: "There is a book on the table."
    notes:
      "n1": "টেবিলে (ṭebile) is টেবিল (ṭebil), table, with the locative ending -ে (-e), 'on the table'."
    bases:
      "আছে": "to be; there is"
  "bn-1171":
    native: "I don't have a pen."
    notes:
      "n1": "নেই (nei) is the negative of আছে (āche), there is, so আমার কলম নেই (āmār kôlom nei) means 'I don't have a pen'."
    bases:
      "নেই": "there is not"
  "bn-1172":
    native: "There is an umbrella in the bag."
    notes:
      "n1": "ব্যাগে (bêge) is ব্যাগ (bêg), bag, with the locative ending -ে (-e), 'in the bag'."
    bases:
      "আছে": "to be; there is"
  "bn-1173":
    native: "I have a mobile phone."
    bases:
      "আছে": "to be; there is"
  "bn-1174":
    native: "He has a watch on his wrist.; She has a watch on her wrist."
    notes:
      "n1": "ওর (or) is the possessive of ও (o), that person, so it means 'his' or 'her'."
  "bn-1175":
    native: "Please lock the door."
    notes:
      "n1": "লাগান (lāgān) is the polite imperative of লাগানো (lāgāno), to fix; তালা লাগান (tālā lāgān) is 'lock' in the sense of fixing a lock."
    bases:
      "লাগান": "to fix; to put on; to apply"
  "bn-1176":
    native: "Where is the key?"
  "bn-1177":
    native: "I write on paper."
    notes:
      "n1": "কাগজে (kāgoje) is কাগজ (kāgoj), paper, with the locative ending -ে (-e), 'on paper'."
  "bn-1178":
    native: "You write with a pen. (respectful)"
    notes:
      "n1": "দিয়ে (diye) means 'with' for a tool: কলম দিয়ে (kôlom diye) is 'with a pen'."
  "bn-1179":
    native: "My watch is new."
    notes:
      "n1": "ঘড়িটা (ghoṛiṭā) is ঘড়ি (ghoṛi), watch, with -টা (ṭā) marking a specific one."
  "bn-1180":
    native: "That bag is heavy."
    notes:
      "n1": "ওই (oi), that, comes before the noun, and ব্যাগটা (bêgṭā) adds -টা (ṭā) to mark a specific bag."
    bases:
      "ওই": "that"
  "bn-1181":
    native: "This book is old."
    notes:
      "n1": "এই (ei), this, comes before the noun, and বইটা (boiṭā) adds -টা (ṭā) to mark a specific book."
    bases:
      "এই": "this"
  "bn-1182":
    native: "I go by train."
    notes:
      "n1": "ট্রেনে (ṭrene) is ট্রেন (ṭren), train, with the locative ending -ে (-e), here 'by train'."
  "bn-1183":
    native: "He goes to work by bicycle.; She goes to work by bicycle."
    notes:
      "n1": "সাইকেলে (sāikele) is সাইকেল (sāikel), bicycle, with the locative ending -ে (-e), here 'by bicycle'."
  "bn-1184":
    native: "Where is your umbrella? (respectful)"
    notes:
      "n1": "আপনার (āpnār) is the respectful 'your', from আপনি (āpni), you (respectful)."
  "bn-1185":
    native: "We watch television."
  "bn-1186":
    native: "There is water in the bottle."
    notes:
      "n1": "বোতলে (botole) is বোতল (botol), bottle, with the locative ending -ে (-e), 'in the bottle'."
    bases:
      "আছে": "to be; there is"
  "bn-1187":
    native: "There is no water in the bucket."
    notes:
      "n1": "বালতিতে (bāltite) is বালতি (bālti), bucket, with the locative ending -তে (-te), 'in the bucket'."
    bases:
      "নেই": "there is not"
