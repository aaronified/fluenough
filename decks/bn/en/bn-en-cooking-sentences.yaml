"cards":
  "bn-1865":
    "native": "First, add the tempering to the oil."
    "confusables":
      "strainer":
        "why": "A strainer is used after cooking, not to add to the oil."
      "stir":
        "why": "Stirring comes after the tempering goes in, and this step does not ask for it."
  "bn-1866":
    "native": "Boil the meat for half an hour."
    "confusables":
      "fry":
        "why": "Frying is a different way of cooking; this step boils the meat."
      "stir":
        "why": "Stirring is not part of this step."
  "bn-1867":
    "native": "Boil the dal well."
    "confusables":
      "knife":
        "why": "A knife is for cutting, not for boiling."
      "form":
        "why": "The intransitive form says the dal boils by itself; here the cook boils it."
  "bn-1868":
    "native": "Wash the rice well, please."
    "confusables":
      "sugar":
        "why": "Sugar is not washed off rice; this step is about rice."
      "dust":
        "why": "Dust is what is washed off, not an ingredient of the rice."
  "bn-1869":
    "native": "Rub the fish with salt and turmeric."
    "confusables":
      "oil":
        "why": "Oil is not rubbed in here; the step uses salt and turmeric."
      "egg":
        "why": "An egg is not part of this dish's step."
  "bn-1870":
    "native": "Fry the cardamom and bay leaf in ghee."
    "confusables":
      "coriander":
        "why": "Coriander leaves go in at the end as a garnish, not in the ghee."
      "sweet":
        "why": "Sweet is a taste, not something you fry."
    "bases":
      "ভাজুন": "to fry"
  "bn-1871":
    "native": "Sprinkle the coriander leaves."
    "confusables":
      "knife":
        "why": "A knife is for cutting, not for sprinkling."
      "open":
        "why": "Open is a different verb: it does not mean sprinkle."
  "bn-1872":
    "native": "Sprinkle a little sugar on top."
    "confusables":
      "salt":
        "why": "Salt is not sugar; this step is about a sweet topping."
      "oil":
        "why": "Oil is poured, not sprinkled."
    "bases":
      "উপরে": "on top; above"
