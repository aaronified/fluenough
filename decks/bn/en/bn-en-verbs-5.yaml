schema: 1
id: "bn-en-verbs-5"
kind: "layer"
core: "bn-verbs-5"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "What happened next"
description: "Verbs for telling a story in order, step by step: fixing, joining, collecting, discussing and setting up. Not yet checked by a Bengali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "bn-4480":
    native: "to join"
    notes:
      "n1": "{1}: To join or to fit together: to make two things meet."
    examples:
      "সে দুটো তার জোড়াল।": { native: "He joined the two wires.", bases: { "দুটো": "two", "জোড়াল": "to join" } }
      "ভাঙা কাপটা জোড়ানো যাবে?": { native: "Can the broken cup be joined? (familiar)", bases: { "কাপটা": "the cup", "জোড়ানো": "to join" } }
  "bn-4481":
    native: "to have broken; to change money"
    notes:
      "n1": "{1}: To have something broken, or to break money into smaller notes."
    examples:
      "এক শো টাকা ভাঙাল।": { native: "She broke a hundred rupee note into change.", bases: { "শো": "hundred", "ভাঙাল": "to have broken; to change money" } }
      "পাঁচ টাকার খুচরো ভাঙিয়ে দাও।": { native: "Change the five rupees into small coins. (familiar)", bases: { "ভাঙিয়ে": "to have broken; to change money" } }
  "bn-4482":
    native: "to match"
    notes:
      "n1": "{1}: To match or to compare two things so that they agree."
    examples:
      "সে হিসাবটা মেলাল।": { native: "She checked the accounts so they agreed.", bases: { "মেলাল": "to match" } }
      "ছবির সঙ্গে মেলাও।": { native: "Match it with the picture. (familiar)", bases: { "মেলাও": "to match" } }
  "bn-4483":
    native: "to have called"
    notes:
      "n1": "{1}: To have someone called."
    examples:
      "আমি ডাক্তার ডাকালাম।": { native: "I had the doctor called.", bases: { "ডাকালাম": "to have called" } }
      "দাদাকে ডাকাও।": { native: "Have the elder brother called. (familiar)", bases: { "ডাকাও": "to have called" } }
  "bn-4484":
    native: "to return"
    notes:
      "n1": "{1}: To send back or to return something."
    examples:
      "দোকানদার টাকা ফেরাল।": { native: "The shopkeeper gave the change back.", bases: { "ফেরাল": "to return" } }
      "বইটা ফিরিয়ে দাও।": { native: "Return the book. (familiar)", bases: { "ফিরিয়ে": "to return" } }
  "bn-4485":
    native: "to have opened"
    notes:
      "n1": "{1}: To have something opened."
    examples:
      "সে দরজা খোলাল।": { native: "She had the door opened.", bases: { "খোলাল": "to have opened" } }
      "গেটটা খোলাও।": { native: "Have the gate opened. (familiar)", bases: { "খোলাও": "to have opened" } }
  "bn-4486":
    native: "to have tied; to frame"
    notes:
      "n1": "{1}: To have something tied, or to have a picture framed."
    examples:
      "ছবিটা ফ্রেমে বাঁধানো হলো।": { native: "The picture was framed.", bases: { "ফ্রেমে": "in a frame", "বাঁধানো": "to have tied; to frame" } }
      "গাছে দড়ি বাঁধাও।": { native: "Have a rope tied to the tree. (familiar)", bases: { "বাঁধাও": "to have tied; to frame" } }
  "bn-4487":
    native: "to save up"
    notes:
      "n1": "{1}: To save up or to collect money or things."
    examples:
      "সে প্রতি মাসে টাকা জমাল।": { native: "She saved money every month.", bases: { "জমাল": "to save up" } }
      "টাকাগুলো জমিয়ে রাখো।": { native: "Save the money and keep it. (familiar)", bases: { "জমিয়ে": "to save up" } }
  "bn-4488":
    native: "to put in"
    notes:
      "n1": "{1}: To put something inside, or to let someone in."
    examples:
      "সে চাবিটা তালায় ঢোকাল।": { native: "She put the key into the lock.", bases: { "ঢোকাল": "to put in" } }
      "ব্যাগে বইটা ঢোকাও।": { native: "Put the book into the bag. (familiar)", bases: { "ঢোকাও": "to put in" } }
  "bn-4489":
    native: "to have swept"
    notes:
      "n1": "{1}: To have something swept or shaken clean."
    examples:
      "ঘরটা ঝাড়িয়ে নিলাম।": { native: "I had the room swept.", bases: { "ঝাড়িয়ে": "to have swept" } }
      "কাপড়গুলো ঝাড়িয়ে দাও।": { native: "Have the clothes shaken out. (familiar)", bases: { "ঝাড়িয়ে": "to have swept" } }
  "bn-4490":
    native: "to have rubbed on"
    notes:
      "n1": "{1}: To have something spread or rubbed on."
    examples:
      "মা শিশুর গায়ে তেল মাখাল।": { native: "The mother had oil rubbed on the child's body.", bases: { "শিশুর": "child's", "গায়ে": "on the body", "মাখাল": "to have rubbed on" } }
      "মুখে ক্রিম মাখাও।": { native: "Have cream put on your face. (familiar)", bases: { "ক্রিম": "cream", "মাখাও": "to have rubbed on" } }
  "bn-4491":
    native: "to have cooked"
    notes:
      "n1": "{1}: To have food cooked by someone else."
    examples:
      "মা লোক দিয়ে রাঁধালেন।": { native: "Mother had a cook prepare the food.", bases: { "লোক": "cook", "রাঁধালেন": "to have cooked" } }
      "আজ ভাত রাঁধিয়ে নাও।": { native: "Have the rice cooked today. (familiar)", bases: { "রাঁধিয়ে": "to have cooked" } }
  "bn-4492":
    native: "to set alight"
    notes:
      "n1": "{1}: To set alight, or to have something caught."
    examples:
      "সে আগুন ধরাল।": { native: "He set the fire alight.", bases: { "ধরাল": "to set alight" } }
      "সিগারেট ধরিয়ো না।": { native: "Do not light a cigarette. (familiar)", bases: { "সিগারেট": "cigarette", "ধরিয়ো": "to set alight" } }
  "bn-4493":
    native: "to release; to pull away"
    notes:
      "n1": "{1}: To release or to pull away from something, or to let go."
    examples:
      "সে হাত ছাড়াল।": { native: "She pulled her hand away.", bases: { "ছাড়াল": "to release; to pull away" } }
      "কুকুরটাকে শিকল থেকে ছাড়াও।": { native: "Let the dog off the chain. (familiar)", bases: { "শিকল": "chain", "ছাড়াও": "to release; to pull away" } }
  "bn-4494":
    native: "to move aside"
    notes:
      "n1": "{1}: To move aside or to shift from a place."
    examples:
      "গাড়িটা একটু সরো।": { native: "Move the car a little. (familiar)", bases: { "সরো": "to move aside" } }
      "সে পথ থেকে সরে গেল।": { native: "He moved off the path.", bases: { "সরে": "to move aside" } }
  "bn-4495":
    native: "to discuss"
    notes:
      "n1": "{1}: To discuss: to talk over a matter with others."
    examples:
      "আমরা বিষয়টা নিয়ে আলোচনা করলাম।": "We discussed the matter."
      "এখন আলোচনা করা যাক।": "Let us discuss now. (familiar)"
  "bn-4496":
    native: "to test"
    notes:
      "n1": "{1}: To test: to check something to see if it works."
    examples:
      "ডাক্তার রোগী পরীক্ষা করলেন।": "The doctor examined the patient."
      "যন্ত্রটা পরীক্ষা করো।": "Test the machine. (familiar)"
  "bn-4497":
    native: "to verify"
    notes:
      "n1": "{1}: To verify: to check that something is true."
    examples:
      "খবরটা যাচাই করা হলো।": "The news was verified."
      "তথ্য যাচাই করে দেখো।": { native: "Verify the facts and see. (familiar)", bases: { "যাচাই": "to verify" } }
  "bn-4498":
    native: "to prepare"
    notes:
      "n1": "{1}: To prepare: to get something ready."
    examples:
      "সে খাবার প্রস্তুত করল।": "She prepared the food."
      "পরীক্ষার জন্য প্রস্তুত হও।": "Get ready for the exam. (familiar)"
  "bn-4499":
    native: "to plan"
    notes:
      "n1": "{1}: To plan: to decide in advance what to do."
    examples:
      "আমরা ছুটির পরিকল্পনা করলাম।": "We planned the holiday."
      "কাজের পরিকল্পনা করো।": "Make a plan for the work. (familiar)"
  "bn-4500":
    native: "to practise"
    notes:
      "n1": "{1}: To practise: to repeat an activity to get better at it."
    examples:
      "সে রোজ গান অনুশীলন করে।": "She practises singing every day."
      "আরো অনুশীলন করো।": { native: "Practise more. (familiar)", bases: { "আরো": "more" } }
  "bn-4501":
    native: "to complete"
    notes:
      "n1": "{1}: To complete: to finish a task."
    examples:
      "কাজটা সম্পন্ন হলো।": "The work was completed."
      "সে সব কাজ সম্পন্ন করল।": "She completed all the work."
  "bn-4502":
    native: "to select"
    notes:
      "n1": "{1}: To select: to choose one from a group."
    examples:
      "দল একজন নেতা নির্বাচন করল।": { native: "The team selected a leader.", bases: { "একজন": "one" } }
      "সঠিক উত্তরটা নির্বাচন করো।": { native: "Select the correct answer. (familiar)", bases: { "সঠিক": "correct" } }
  "bn-4503":
    native: "to assess"
    notes:
      "n1": "{1}: To assess or to evaluate: to judge the value or quality of something."
    examples:
      "শিক্ষক খাতা মূল্যায়ন করলেন।": "The teacher assessed the papers."
      "কাজটা ভালো মূল্যায়ন হলো।": "The work was assessed well."
  "bn-4504":
    native: "to solve"
    notes:
      "n1": "{1}: To solve: to find an answer to a problem."
    examples:
      "সে অঙ্কটা সমাধান করল।": "She solved the sum."
      "সমস্যাটা সমাধান করো।": "Solve the problem. (familiar)"
  "bn-4505":
    native: "to accept"
    notes:
      "n1": "{1}: To accept or to receive: to take something offered."
    examples:
      "তিনি উপহারটা গ্রহণ করলেন।": "He accepted the gift."
      "আমার অনুরোধ গ্রহণ করো।": { native: "Accept my request. (familiar)", bases: { "অনুরোধ": "request" } }
  "bn-4506":
    native: "to reject"
    notes:
      "n1": "{1}: To reject or to give up: to refuse to use or keep something."
    examples:
      "সে প্রস্তাবটা বর্জন করল।": "He rejected the proposal."
      "ক্ষতিকর জিনিস বর্জন করো।": { native: "Give up harmful things. (familiar)", bases: { "ক্ষতিকর": "harmful" } }
  "bn-4507":
    native: "to achieve"
    notes:
      "n1": "{1}: To achieve: to gain something through effort."
    examples:
      "সে পদক অর্জন করল।": "She achieved a medal."
      "জ্ঞান অর্জন করা কঠিন নয়।": "Gaining knowledge is not hard."
  "bn-4508":
    native: "to enjoy"
    notes:
      "n1": "{1}: To enjoy: to take pleasure in something."
    examples:
      "আমরা ছুটিটা উপভোগ করলাম।": "We enjoyed the holiday."
      "গানটা উপভোগ করো।": "Enjoy the song. (familiar)"
  "bn-4509":
    native: "to collect"
    notes:
      "n1": "{1}: To collect: to gather things together."
    examples:
      "সে পুরোনো মুদ্রা সংগ্রহ করে।": "She collects old coins."
      "তথ্য সংগ্রহ করো।": "Collect the information. (familiar)"
  "bn-4510":
    native: "to consider"
    notes:
      "n1": "{1}: To consider: to think carefully about a matter."
    examples:
      "আমরা প্রস্তাবটা বিবেচনা করব।": "We will consider the proposal."
      "সবকিছু বিবেচনা করে দেখো।": { native: "Consider everything and see. (familiar)", bases: { "সবকিছু": "everything", "বিবেচনা": "to consider" } }
  "bn-4511":
    native: "to correct"
    notes:
      "n1": "{1}: To correct or to revise: to make something right."
    examples:
      "শিক্ষক ভুলগুলো সংশোধন করলেন।": "The teacher corrected the mistakes."
      "লেখাটা সংশোধন করো।": "Correct the writing. (familiar)"
  "bn-4512":
    native: "to guess"
    notes:
      "n1": "{1}: To guess or to estimate: to judge something without full proof."
    examples:
      "সে সময়টা অনুমান করল।": "She estimated the time."
      "কী অনুমান করছ?": "What are you guessing? (familiar)"
  "bn-4513":
    native: "to admit"
    notes:
      "n1": "{1}: To admit: to accept that something is true."
    examples:
      "সে ভুল স্বীকার করল।": "He admitted the mistake."
      "ভুলটা স্বীকার করো।": "Admit the mistake. (familiar)"
  "bn-4514":
    native: "to observe"
    notes:
      "n1": "{1}: To observe: to watch closely and note what happens."
    examples:
      "বিজ্ঞানী পাখিদের পর্যবেক্ষণ করলেন।": "The scientist observed the birds."
      "নিয়মিত পর্যবেক্ষণ করো।": "Observe regularly. (familiar)"
  "bn-4515":
    native: "to inspect"
    notes:
      "n1": "{1}: To inspect or to visit officially: to look over a place carefully."
    examples:
      "কর্মকর্তা স্কুল পরিদর্শন করলেন।": "The officer inspected the school."
      "কাজটা পরিদর্শন করা হবে।": "The work will be inspected."
  "bn-4516":
    native: "to establish"
    notes:
      "n1": "{1}: To establish or to set up: to place or start something firmly."
    examples:
      "তারা নতুন বিদ্যালয় স্থাপন করল।": "They established a new school."
      "একটা স্মারক স্থাপন করা হলো।": { native: "A memorial was set up.", bases: { "একটা": "a" } }
  "bn-4517":
    native: "to arrange"
    notes:
      "n1": "{1}: To arrange or to organise an event."
    examples:
      "ক্লাব একটা অনুষ্ঠান আয়োজন করল।": { native: "The club arranged an event.", bases: { "একটা": "an" } }
      "সভার আয়োজন করো।": "Arrange the meeting. (familiar)"
  "bn-4518":
    native: "to apply"
    notes:
      "n1": "{1}: To apply: to use a rule or a method in practice."
    examples:
      "সে নিয়মটা প্রয়োগ করল।": "She applied the rule."
      "শিখে নেওয়া জ্ঞান প্রয়োগ করো।": "Apply the knowledge you have learnt. (familiar)"
  "bn-4519":
    native: "to analyse"
    notes:
      "n1": "{1}: To analyse: to examine the parts of something in detail."
    examples:
      "সে তথ্যগুলো বিশ্লেষণ করল।": "She analysed the data."
      "ফলাফল বিশ্লেষণ করো।": { native: "Analyse the results. (familiar)", bases: { "ফলাফল": "results" } }
  "bn-4520":
    native: "to mention"
    notes:
      "n1": "{1}: To mention: to refer to something in speech or writing."
    examples:
      "তিনি তার নাম উল্লেখ করলেন।": "He mentioned his name."
      "এই বিষয়টা উল্লেখ করো না।": { native: "Do not mention this matter. (familiar)", bases: { "এই": "this" } }
  "bn-4521":
    native: "to review"
    notes:
      "n1": "{1}: To review: to look again at a piece of work and judge it."
    examples:
      "সম্পাদক লেখাটা পর্যালোচনা করলেন।": "The editor reviewed the piece."
      "বইটা পর্যালোচনা করো।": "Review the book. (familiar)"
  "bn-4522":
    native: "to distribute"
    notes:
      "n1": "{1}: To distribute: to share out things among people."
    examples:
      "স্বেচ্ছাসেবকরা খাবার বিতরণ করল।": "The volunteers distributed food."
      "বই বিতরণ করা হলো।": "Books were distributed."
  "bn-4523":
    native: "to add"
    notes:
      "n1": "{1}: To add: to put something into a larger whole."
    examples:
      "লেখকরা একটা নতুন অধ্যায় সংযোজন করলেন।": { native: "The writers added a new chapter.", bases: { "একটা": "a" } }
      "এই তথ্যটা সংযোজন করো।": { native: "Add this information. (familiar)", bases: { "এই": "this" } }
  "bn-4524":
    native: "to found"
    notes:
      "n1": "{1}: To found or to establish an institution."
    examples:
      "তিনি একটা সংস্থা প্রতিষ্ঠা করলেন।": { native: "He founded an organisation.", bases: { "একটা": "an" } }
      "বিদ্যালয়টি প্রতিষ্ঠা করা হয়েছে।": "The school has been founded."
