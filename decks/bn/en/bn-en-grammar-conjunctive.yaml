rules:
  "bn-rule-conjunctive":
    name: "-ে (-e), -িয়ে (-iye): doing and then"
    explanation: "A verb stem takes {1} to join one action to the next, in order: {2}, doing and then; {3}, going and then. Some stems change first: {4} gives {3}, and {6} gives {5}. Verbs whose stem ends in -ানো (-ānō) take {7}. The negative puts {8} before the form: {9}, without doing it."
