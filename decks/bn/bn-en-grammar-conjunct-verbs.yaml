    alt_target: ["বিশ্রাম নেওয়া"]
    pos: "verb"
    notes: "Also বিশ্রাম নেওয়া (bisrām neoā), with নেওয়া, to take."
  - id: bn-0682
    target: "ব্যায়াম করা"
