schema: 1
id: bn-en-grammar-conjunct-verbs
name: "Noun + করা"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Many Bengali verbs are a noun and করা, and only করা changes: রান্না করি, রান্না করেছি. Not yet checked by a Bengali speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - ref: bn-0666
    modes: [recognition, production, listening, speaking]
    notes: "Only করা changes: আমি রান্না করি, ও রান্না করছে. Basic Bangla 8.4 lists these noun + করা verbs."
  - id: bn-0677
    target: "কাজ করা"
    native: "to work"
    reading: "kaj kora"
    pos: "verb"
  - id: bn-0678
    target: "বাজার করা"
    native: "to do the shopping"
    reading: "bajar kora"
    pos: "verb"
    notes: "Food shopping, at the market."
  - ref: bn-0660
    modes: [recognition, production, listening, speaking]
    native: "to have a bath; to shower"
    notes: "Also গোসল করা (goshol kora)."
  - id: bn-0679
    target: "ফোন করা"
    native: "to phone"
    reading: "phon kora"
    pos: "verb"
    notes: "The one phoned takes -কে: মাকে ফোন করো, phone Mum."
  - id: bn-0680
    target: "গল্প করা"
    native: "to chat"
    reading: "golpo kora"
    pos: "verb"
    notes: "গল্প is a story; গল্প করা is a long, easy talk."
  - id: bn-0681
    target: "বিশ্রাম করা"
    native: "to rest"
    reading: "bisram kora"
    alt_target: ["বিশ্রাম নেওয়া"]
    pos: "verb"
    notes: "Also বিশ্রাম নেওয়া (bisram neoa), with নেওয়া, to take."
  - id: bn-0682
    target: "ব্যায়াম করা"
    native: "to exercise"
    reading: "byayam kora"
    pos: "verb"
  - id: bn-0683
    target: "পরিষ্কার করা"
    native: "to clean"
    reading: "porishkar kora"
    pos: "verb"
  - id: bn-0684
    target: "বিয়ে করা"
    native: "to marry"
    reading: "biye kora"
    pos: "verb"
  - id: bn-0685
    target: "জিজ্ঞেস করা"
    native: "to ask"
    reading: "jiggesh kora"
    alt_target: ["জিজ্ঞাসা করা"]
    pos: "verb"
    notes: "The one asked takes -কে: ওকে জিজ্ঞেস করুন, ask him. জিজ্ঞাসা করা (jiggasha kora) is the more formal form."
  - id: bn-0686
    target: "শুরু করা"
    native: "to start"
    reading: "shuru kora"
    pos: "verb"
  - id: bn-0687
    target: "শেষ করা"
    native: "to finish"
    reading: "shesh kora"
    pos: "verb"
  - id: bn-0688
    target: "ভুল করা"
    native: "to make a mistake"
    reading: "bhul kora"
    pos: "verb"
  - id: bn-0689
    target: "ঠিক করা"
    native: "to decide; to fix"
    reading: "thik kora"
    pos: "verb"
  - id: bn-0690
    target: "সাহায্য করা"
    native: "to help"
    reading: "shahajjo kora"
    pos: "verb"
    notes: "The one helped takes -কে: আমাকে সাহায্য করুন, help me."
  - id: bn-0691
    target: "চেষ্টা করা"
    native: "to try"
    reading: "cheshta kora"
    pos: "verb"
  - id: bn-0692
    target: "অপেক্ষা করা"
    native: "to wait"
    reading: "opekkha kora"
    pos: "verb"
    notes: "Waiting for someone is -র জন্য: তোমার জন্য অপেক্ষা করছি, I'm waiting for you."
  - id: bn-0693
    target: "পছন্দ করা"
    native: "to like"
    reading: "pochhondo kora"
    pos: "verb"
    notes: "আমি চা পছন্দ করি, I like tea."
  - id: bn-0694
    target: "গান করা"
    native: "to sing"
    reading: "gan kora"
    alt_target: ["গান গাওয়া"]
    pos: "verb"
    notes: "Also গান গাওয়া (gan gaoa)."
  - id: bn-0695
    target: "রাগ করা"
    native: "to get angry"
    reading: "rag kora"
    pos: "verb"
  - id: bn-0696
    target: "মনে পড়া"
    native: "to remember (to come to mind)"
    reading: "mone pora"
    pos: "verb"
    notes: "With পড়া, not করা, and the one who remembers takes -র: আমার মনে পড়েছে, I've remembered."
  - id: bn-0697
    target: "দেরি হওয়া"
    native: "to be late"
    reading: "deri hoa"
    pos: "verb"
    notes: "With হওয়া, and the one who is late takes -র: আমার দেরি হয়ে গেছে, I'm late."
