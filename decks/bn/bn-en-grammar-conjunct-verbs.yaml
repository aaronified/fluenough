description: "Many Bengali verbs are a noun and করা (kôrā), and only করা (kôrā) changes: রান্না করি (rānnā kori), রান্না করেছি (rānnā kôrechi). Not yet checked by a Bengali speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
