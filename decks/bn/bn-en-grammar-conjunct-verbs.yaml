description: "Many Bengali verbs are a noun and করা, and only করা changes: রান্না করি, রান্না করেছি. Not yet checked by a Bengali speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - ref: bn-0666
    modes: [recognition, production, listening, speaking]
    notes: "Only করা changes: আমি রান্না করি, ও রান্না করছে. Basic Bangla 8.4 lists these noun + করা verbs."
  - id: bn-0677
    target: "কাজ করা"
    native: "to work"
    reading: "kāj kôrā"
    ipa: "kadʒ kɔra"
    pos: "verb"
  - id: bn-0678
    target: "বাজার করা"
    native: "to do the shopping"
    reading: "bājār kôrā"
    ipa: "badʒar kɔra"
    pos: "verb"
    notes: "Food shopping, at the market."
  - ref: bn-0660
    modes: [recognition, production, listening, speaking]
    native: "to have a bath; to shower"
    notes: "Also গোসল করা (gośol kôrā)."
  - id: bn-0679
    target: "ফোন করা"
    native: "to phone"
    reading: "phon kôrā"
    ipa: "pʰon kɔra"
    pos: "verb"
    notes: "The one phoned takes -কে: মাকে ফোন করো, phone Mum."
  - id: bn-0680
    target: "গল্প করা"
    native: "to chat"
    reading: "gôlpo kôrā"
    ipa: "ɡɔlpo kɔra"
    pos: "verb"
    notes: "গল্প is a story; গল্প করা is a long, easy talk."
  - id: bn-0681
    target: "বিশ্রাম করা"
