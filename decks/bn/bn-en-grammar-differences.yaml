schema: 1
id: bn-en-grammar-differences
name: "How Bengali grammar differs from English"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Before any theme: the verb last, no is, endings for in and of, no gender, three yous, no articles, and how Bengali says have, not and questions. Not yet checked by a Bengali speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: bn-0121
    target: "আমি ভাত খাই।"
    native: "I eat rice."
    reading: "ami bhat khai."
    tags: ["grammar", "word-order"]
    notes: "The verb comes last: subject, object, verb. Word for word, 'I rice eat'."
  - id: bn-0122
    target: "আপনি ডাক্তার।"
    native: "You are a doctor."
    reading: "apni daktar."
    tags: ["grammar", "no-is"]
    notes: "No word for 'am', 'is' or 'are' when saying what someone is, in the present: 'you doctor'. Where someone is, or how they are, takes আছে: ভালো আছি, I'm fine."
  - id: bn-0123
    target: "স্কুলে"
    native: "at school; to school"
    reading: "skule"
    tags: ["grammar", "postpositions"]
    notes: "Bengali puts 'in', 'at' and 'to' after the noun, as an ending: স্কুল (skul) + -এ."
  - id: bn-0124
    target: "বাড়িতে"
    native: "at home"
    reading: "barite"
    tags: ["grammar", "postpositions"]
    notes: "After a vowel the ending is usually -তে: বাড়ি (bari) + -তে. After আ it is often -য়: ঢাকায় (dhakay, in Dhaka)."
  - id: bn-0125
    target: "বাবার বই"
    native: "father's book"
    reading: "babar boi"
    tags: ["grammar", "postpositions"]
    notes: "'Of' is an ending on the owner, which comes first: বাবা (baba) + -র. It is -র after a vowel sign, -এর after a consonant (ঘরের), and -য়ের after a full vowel letter (বইয়ের)."
  - id: bn-0126
    target: "সে যায়।"
    native: "He goes. / She goes."
    reading: "she jay."
    tags: ["grammar", "no-gender"]
    notes: "No grammatical gender: সে is both 'he' and 'she', and nothing else in the sentence changes."
  - id: bn-0127
    target: "আপনি যান।"
    native: "You go. (respectful)"
    reading: "apni jan."
    tags: ["grammar", "three-yous"]
    notes: "Three words for 'you', each with its own verb ending: আপনি for strangers and elders takes -ন."
  - id: bn-0128
    target: "তুমি যাও।"
    native: "You go. (familiar)"
    reading: "tumi jao."
    tags: ["grammar", "three-yous"]
    notes: "তুমি, for friends and family, takes -ও."
  - id: bn-0129
    target: "তুই যাস।"
    native: "You go. (intimate)"
    reading: "tui jash."
    tags: ["grammar", "three-yous"]
    notes: "তুই, only for the very close or a child, takes -স. To anyone else it is rude."
  - id: bn-0130
    target: "একটা বই"
    native: "a book; one book"
    reading: "ekta boi"
    tags: ["grammar", "classifiers"]
    notes: "No word for 'a': a number takes the classifier -টা, and একটা is 'one' or 'a'."
  - id: bn-0131
    target: "বইটা"
    native: "the book"
    reading: "boita"
    tags: ["grammar", "classifiers"]
    notes: "No word for 'the' either: -টা on the noun makes it definite."
  - id: bn-0132
    target: "আমার একটা বই আছে।"
    native: "I have a book."
    reading: "amar ekta boi achhe."
    tags: ["grammar", "have"]
    notes: "No verb 'have': 'of me a book there is', with আছে, 'there is'."
  - id: bn-0133
    target: "আমি যাই না।"
    native: "I don't go."
    reading: "ami jai na."
    tags: ["grammar", "negation"]
    notes: "না comes after the verb: 'I go not'."
  - id: bn-0134
    target: "খাবার নেই।"
    native: "There is no food."
    reading: "khabar nei."
    tags: ["grammar", "negation"]
    notes: "নেই is 'there is not', the opposite of আছে."
  - id: bn-0135
    target: "আপনি কি যাবেন?"
    native: "Will you go?"
    reading: "apni ki jaben?"
    tags: ["grammar", "questions"]
    notes: "A yes-or-no question adds কি and keeps the statement's word order: আপনি যাবেন (you will go). Don't confuse it with কী, 'what'."
