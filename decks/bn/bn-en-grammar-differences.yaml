schema: 1
id: bn-en-grammar-differences
name: "How Bengali grammar differs from English"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Before any theme: the verb last, no is, endings for in and of, no gender, three yous, no articles, and how Bengali says have, not and questions."
tags: [beginner, unreviewed, grammar]
cards:
  - id: bn-en-grammar-differences-0001
    target: "আমি ভাত খাই।"
    native: "I eat rice."
    reading: "ami bhat khai."
    tags: ["grammar", "word-order"]
    notes: "The verb comes last: subject, object, verb. Word for word, 'I rice eat'."
  - id: bn-en-grammar-differences-0002
    target: "আপনি ডাক্তার।"
    native: "You are a doctor."
    reading: "apni daktar."
    tags: ["grammar", "no-is"]
    notes: "No word for 'am', 'is' or 'are' in a simple present sentence: 'you doctor'."
  - id: bn-en-grammar-differences-0003
    target: "স্কুলে"
    native: "at school; to school"
    reading: "skule"
    tags: ["grammar", "postpositions"]
    notes: "Bengali puts 'in', 'at' and 'to' after the noun, as an ending: স্কুল (skul) + -এ."
  - id: bn-en-grammar-differences-0004
    target: "বাড়িতে"
    native: "at home"
    reading: "barite"
    tags: ["grammar", "postpositions"]
    notes: "After a vowel the ending is -তে: বাড়ি (bari) + -তে."
  - id: bn-en-grammar-differences-0005
    target: "বাবার বই"
    native: "father's book"
    reading: "babar boi"
    tags: ["grammar", "postpositions"]
    notes: "'Of' is the ending -র (or -এর after a consonant), on the owner, which comes first: বাবা (baba) + -র."
  - id: bn-en-grammar-differences-0006
    target: "সে যায়।"
    native: "He goes. / She goes."
    reading: "she jay."
    tags: ["grammar", "no-gender"]
    notes: "No grammatical gender: সে is both 'he' and 'she', and nothing else in the sentence changes."
  - id: bn-en-grammar-differences-0007
    target: "আপনি যান।"
    native: "You go. (respectful)"
    reading: "apni jan."
    tags: ["grammar", "three-yous"]
    notes: "Three words for 'you', each with its own verb ending: আপনি for strangers and elders takes -ন."
  - id: bn-en-grammar-differences-0008
    target: "তুমি যাও।"
    native: "You go. (familiar)"
    reading: "tumi jao."
    tags: ["grammar", "three-yous"]
    notes: "তুমি, for friends and family, takes -ও."
  - id: bn-en-grammar-differences-0009
    target: "তুই যাস।"
    native: "You go. (intimate)"
    reading: "tui jash."
    tags: ["grammar", "three-yous"]
    notes: "তুই, only for the very close or a child, takes -স. To anyone else it is rude."
  - id: bn-en-grammar-differences-0010
    target: "একটা বই"
    native: "a book; one book"
    reading: "ekta boi"
    tags: ["grammar", "classifiers"]
    notes: "No word for 'a': a number takes the classifier -টা, and একটা is 'one' or 'a'."
  - id: bn-en-grammar-differences-0011
    target: "বইটা"
    native: "the book"
    reading: "boita"
    tags: ["grammar", "classifiers"]
    notes: "No word for 'the' either: -টা on the noun makes it definite."
  - id: bn-en-grammar-differences-0012
    target: "আমার বই আছে।"
    native: "I have a book."
    reading: "amar boi achhe."
    tags: ["grammar", "have"]
    notes: "No verb 'have': 'my book there is', with আছে, 'there is'."
  - id: bn-en-grammar-differences-0013
    target: "আমি যাই না।"
    native: "I don't go."
    reading: "ami jai na."
    tags: ["grammar", "negation"]
    notes: "না comes after the verb: 'I go not'."
  - id: bn-en-grammar-differences-0014
    target: "খাবার নেই।"
    native: "There is no food."
    reading: "khabar nei."
    tags: ["grammar", "negation"]
    notes: "নেই is 'there is not', the opposite of আছে."
  - id: bn-en-grammar-differences-0015
    target: "আপনি কি যাবেন?"
    native: "Will you go?"
    reading: "apni ki jaben?"
    tags: ["grammar", "questions"]
    notes: "A yes-or-no question adds কি and keeps the statement's word order: আপনি যাবেন (you will go). Don't confuse it with কী, 'what'."
