schema: 1
id: bn-en-grammar-differences
name: "How Bengali grammar differs from English"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Before any theme: the verb last, no is, endings for in and of, no gender, three yous, no articles, and how Bengali says have, not and questions. Not yet checked by a Bengali speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
cards:
  - id: bn-0121
    target: "আমি ভাত খাই।"
    native: "I eat rice."
    reading: "āmi bhāt khāi."
    ipa: "ami bʱat̪ kʰai"
    tags: ["grammar", "word-order"]
    notes: "The verb comes last: subject, object, verb. Word for word, 'I rice eat'."
    bases:
      - { word: "আমি", base: "আমি", reading: "āmi", meaning: "I" }
      - { word: "খাই", base: "খাওয়া", reading: "khāoā", meaning: "to eat; to drink" }
  - id: bn-0122
    target: "আপনি ডাক্তার।"
    native: "You are a doctor."
    reading: "āpni ḍāktār."
    ipa: "apni ɖakt̪ar"
    tags: ["grammar", "no-is"]
    notes: "No word for 'am', 'is' or 'are' when saying what someone is, in the present: 'you doctor'. Where someone is, or how they are, takes আছে (āche): ভালো আছি (bhālo āchi), I'm fine."
  - id: bn-0123
    target: "স্কুলে"
    native: "at school; to school"
    reading: "skule"
    ipa: "skule"
    tags: ["grammar", "postpositions"]
    notes: "Bengali puts 'in', 'at' and 'to' after the noun, as an ending: স্কুল (skul) + -এ (-e)."
  - id: bn-0124
    target: "বাড়িতে"
    native: "at home"
    reading: "bāṛite"
    ipa: "baɽit̪e"
    tags: ["grammar", "postpositions"]
    notes: "After a vowel the ending is usually -তে (-te): বাড়ি (bāṛi) + -তে (-te). After আ (ā) it is often -য় (-yô): ঢাকায় (ḍhākāy, in Dhaka)."
  - id: bn-0125
    target: "বাবার বই"
    native: "father's book"
    reading: "bābār boi"
    ipa: "babar boi"
    tags: ["grammar", "postpositions"]
    notes: "'Of' is an ending on the owner, which comes first: বাবা (bābā) + -র (-rô). It is -র (-rô) after a vowel sign, -এর (-er) after a consonant (ঘরের), and -য়ের (-yer) after a full vowel letter (বইয়ের)."
    bases:
      - { word: "বাবার", ref: "bn-0423" }
      - { word: "বই", base: "বই", reading: "boi", meaning: "book" }
  - id: bn-0126
    target: "সে যায়।"
    native: "He goes. / She goes."
    reading: "śe jāy."
    ipa: "ʃe dʒaj"
    tags: ["grammar", "no-gender"]
    notes: "No grammatical gender: সে (se) is both 'he' and 'she', and nothing else in the sentence changes."
    bases:
      - { word: "সে", base: "সে", reading: "śe", meaning: "he; she" }
      - { word: "যায়", base: "যাওয়া", reading: "jāoā", meaning: "to go" }
  - id: bn-0127
    target: "আপনি যান।"
    native: "You go. (respectful)"
    reading: "āpni jān."
    ipa: "apni dʒan"
    tags: ["grammar", "three-yous"]
    notes: "Three words for 'you', each with its own verb ending: আপনি (āpni) for strangers and elders takes -ন (-nô)."
    bases:
      - { word: "যান", base: "যাওয়া", reading: "jāoā", meaning: "to go" }
  - id: bn-0128
    target: "তুমি যাও।"
    native: "You go. (familiar)"
    reading: "tumi jāo."
    ipa: "t̪umi dʒao"
    tags: ["grammar", "three-yous"]
    notes: "তুমি (tumi), for friends and family, takes -ও (-o)."
    bases:
      - { word: "তুমি", base: "তুমি", reading: "tumi", meaning: "you (familiar)" }
      - { word: "যাও", base: "যাওয়া", reading: "jāoā", meaning: "to go" }
  - id: bn-0129
    target: "তুই যাস।"
    native: "You go. (intimate)"
    reading: "tui jāś."
    ipa: "t̪ui dʒaʃ"
    tags: ["grammar", "three-yous"]
    notes: "তুই (tui), only for the very close or a child, takes -স (-śô). To anyone else it is rude."
    bases:
      - { word: "তুই", base: "তুই", reading: "tui", meaning: "you (intimate)" }
      - { word: "যাস", base: "যাওয়া", reading: "jāoā", meaning: "to go" }
  - id: bn-0130
    target: "একটা বই"
    native: "a book; one book"
    picture: "📖"
    reading: "ekṭā boi"
    ipa: "ekʈa boi"
    tags: ["grammar", "classifiers"]
    notes: "No word for 'a': a number takes the classifier -টা (-ṭā), and একটা (ekoṭā) is 'one' or 'a'."
    bases:
      - { word: "একটা", ref: "bn-0202" }
      - { word: "বই", base: "বই", reading: "boi", meaning: "book" }
  - id: bn-0131
    target: "বইটা"
    native: "the book"
    picture: "📖"
    reading: "boiṭā"
    ipa: "boiʈa"
    tags: ["grammar", "classifiers"]
    notes: "No word for 'the' either: -টা (-ṭā) on the noun makes it definite."
  - id: bn-0132
    target: "আমার একটা বই আছে।"
    native: "I have a book."
    reading: "āmār ekṭā boi āche."
    ipa: "amar ekʈa boi atʃʰe"
    tags: ["grammar", "have"]
    notes: "No verb 'have': 'of me a book there is', with আছে (āche), 'there is'."
    bases:
      - { word: "আমার", base: "আমি", reading: "āmi", meaning: "I" }
      - { word: "একটা", ref: "bn-0202" }
      - { word: "বই", base: "বই", reading: "boi", meaning: "book" }
      - { word: "আছে", base: "আছে", reading: "āche", meaning: "to be; there is" }
  - id: bn-0133
    target: "আমি যাই না।"
    native: "I don't go."
    reading: "āmi jāi nā."
    ipa: "ami dʒai na"
    tags: ["grammar", "negation"]
    notes: "না (nā) comes after the verb: 'I go not'."
    bases:
      - { word: "আমি", base: "আমি", reading: "āmi", meaning: "I" }
      - { word: "যাই", base: "যাওয়া", reading: "jāoā", meaning: "to go" }
  - id: bn-0134
    target: "খাবার নেই।"
    native: "There is no food."
    reading: "khābār nei."
    ipa: "kʰabar nei"
    tags: ["grammar", "negation"]
    notes: "নেই (nei) is 'there is not', the opposite of আছে (āche)."
    bases:
      - { word: "নেই", base: "নেই", reading: "nei", meaning: "there is not" }
  - id: bn-0135
    target: "আপনি কি যাবেন?"
    native: "Will you go?"
    reading: "āpni ki jāben?"
    ipa: "apni ki dʒaben"
    tags: ["grammar", "questions"]
    notes: "A yes-or-no question adds কি (ki) and keeps the statement's word order: আপনি যাবেন (you will go). Don't confuse it with কী (ki), 'what'."
    bases:
      - { word: "যাবেন", base: "যাওয়া", reading: "jāoā", meaning: "to go" }
