schema: 1
id: "bn-en-reading-weather"
name: "Reading: the weather"
kind: reading
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: "CC-BY-SA-4.0"
source: "Written for the Fluenough Bengali course"
description: "A radio weather forecast, to be heard, and a short message about the first monsoon rain, each with questions. Not yet checked by a Bengali speaker: please report any mistake."
tags: [reading, unreviewed]
passages:
  - id: "bn-radio-forecast"
    title: "A radio weather forecast"
    theme: "weather"
    sentences:
      - { text: "এখন আবহাওয়ার খবর।", reading: "ekhon ābohāoyār khôbor.", ipa: "ekʰon aboɦaojar kʰɔbor" }
      - { text: "আজ ঢাকায় সকালে রোদ থাকবে।", reading: "āj ḍhākāy śôkāle rod thākbe.", ipa: "adʒ ɖʱakaj ʃɔkale rod̪ t̪ʰakbe" }
      - { text: "দুপুরের পর আকাশ মেঘলা হবে।", reading: "dupurer pôr ākāś meghlā hôbe.", ipa: "d̪upurer pɔr akaʃ meɡʱla ɦɔbe" }
      - { text: "বিকেলে সুন্দরবনে ঝড় আর বৃষ্টি হতে পারে।", reading: "bikele śundorbone jhôṛ ār briśṭi hôte pāre.", ipa: "bikele ʃund̪orbone dʒʱɔɽ ar briʃʈi ɦɔt̪e pare" }
      - { text: "ছাতা নিতে ভুলবেন না।", reading: "chātā nite bhulben nā.", ipa: "tʃʰat̪a nit̪e bʱulben na" }
    questions:
      - id: "bn-1622"
        prompt: { "en": "Dhaka will have sunshine in the morning." }
        answer: true
      - id: "bn-1623"
        prompt: { "en": "What may happen in the afternoon?" }
        options: [{ "en": "A storm and rain in the Sundarbans" }, { "en": "Snow in the hills" }]
        answer: 1
      - id: "bn-1624"
        prompt: { "en": "What should listeners not forget?" }
        options: [{ "en": "An umbrella" }, { "en": "A map" }]
        answer: 1
  - id: "bn-monsoon-message"
    title: "The first monsoon rain"
    theme: "weather"
    sentences:
      - { text: "প্রিয় রিনা,", reading: "priyo rinā,", ipa: "prijo rina" }
      - { text: "আজ বর্ষার প্রথম বৃষ্টি হলো।", reading: "āj bôrśār prôthom briśṭi hôlo.", ipa: "adʒ bɔrʃar prɔt̪ʰom briʃʈi ɦɔlo" }
      - { text: "মাঠে জল জমেছে, আর ঠান্ডা বাতাস বইছে।", reading: "māṭhe jôl jômeche, ār ṭhānḍā bātās boiche.", ipa: "maʈʰe dʒɔl dʒɔmetʃʰe ar ʈʰanɖa bat̪as boitʃʰe" }
      - { text: "আমি বারান্দায় বসে বৃষ্টি দেখছি।", reading: "āmi bārāndāy bôśe briśṭi dekhchi.", ipa: "ami barand̪aj bɔʃe briʃʈi d̪ekʰtʃʰi" }
      - { text: "তুমি কবে আসবে? ছাতা এনো।", reading: "tumi kôbe āśbe? chātā eno.", ipa: "t̪umi kɔbe aʃbe tʃʰat̪a eno" }
      - { text: "ইতি, তোমার সুমন।", reading: "iti, tomār sumon.", ipa: "it̪i t̪omar sumon" }
    questions:
      - id: "bn-1625"
        prompt: { "en": "The first rain of the monsoon fell today." }
        answer: true
      - id: "bn-1626"
        prompt: { "en": "What is the writer doing?" }
        options: [{ "en": "Going to the market" }, { "en": "Watching the rain from the veranda" }]
        answer: 2
