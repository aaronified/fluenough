      - { id: "n1", kind: "usage", words: [{ word: "বিচার", reading: "bicār" }] }
    examples:
      - { target: "বিচার কাল শুরু হবে।", reading: "bicār kāl śuru hôbe.", ipa: "bitʃar kal ʃuru ɦɔbe", bases: [{ word: "কাল", ref: "bn-0316" }, { word: "শুরু", ref: "bn-2480" }, { word: "হবে", ref: "bn-0874" }] }
      - { target: "বিচারের রায় কী হলো?", reading: "bicārer rāy ki hôlo?", ipa: "bitʃarer raj ki ɦɔlo", bases: [{ word: "বিচারের", base: "বিচার", reading: "bicārer" }, { word: "রায়", ref: "bn-4100" }, { word: "কী", ref: "bn-0161" }, { word: "হলো", ref: "bn-0812" }] }
  - id: "bn-4100"
