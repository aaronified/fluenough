      - { target: "হলফনামাটা আদালতে জমা দেওয়া হলো।", reading: "hôlophonāmāṭā ādālote jômā deoyā hôlo.", ipa: "ɦɔlopʰonamaʈa ad̪alot̪e dʒɔma d̪eoja ɦɔlo", bases: [{ word: "হলফনামাটা", base: "হলফনামা", reading: "hôlophonāmāṭā" }, { word: "আদালতে", ref: "bn-1065" }, { word: "জমা", ref: "bn-3998" }, { word: "দেওয়া", ref: "bn-0888" }, { word: "হলো", ref: "bn-0812" }] }
