      - { id: "n1", kind: "usage", words: [{ word: "অভিযোগ", reading: "ôbhijog" }] }
    examples:
      - { target: "আমার একটা অভিযোগ আছে।", reading: "āmār ekoṭā ôbhijog āche.", ipa: "amar ekoʈa ɔbʱidʒoɡ atʃʰe", bases: [{ word: "আমার", ref: "bn-0833" }, { word: "একটা", base: "একটা", reading: "ekoṭā" }, { word: "আছে", base: "আছে", reading: "āche" }] }
      - { target: "অভিযোগটা লিখে দিন।", reading: "ôbhijogoṭā likhe din.", ipa: "ɔbʱidʒoɡoʈa likʰe d̪in", bases: [{ word: "অভিযোগটা", base: "অভিযোগ", reading: "ôbhijogoṭā" }, { word: "লিখে", ref: "bn-0880" }, { word: "দিন", ref: "bn-0251" }] }
  - id: "bn-4098"
    target: "অভিযুক্ত"
    reading: "ôbhijukt"
    ipa: "ɔbʱidʒukt̪"
    pos: "noun"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "অভিযুক্ত", reading: "ôbhijukt" }] }
    examples:
      - { target: "অভিযুক্ত ব্যক্তি আদালতে এলেন।", reading: "ôbhijukt bêkti ādālote elen.", ipa: "ɔbʱidʒukt̪ bækt̪i ad̪alot̪e elen", bases: [{ word: "ব্যক্তি", base: "ব্যক্তি", reading: "bêkti" }, { word: "আদালতে", ref: "bn-1065" }, { word: "এলেন", ref: "bn-0872" }] }
      - { target: "অভিযুক্তের নাম কী?", reading: "ôbhijukter nām ki?", ipa: "ɔbʱidʒukt̪er nam ki", bases: [{ word: "অভিযুক্তের", base: "অভিযুক্ত", reading: "ôbhijukter" }, { word: "নাম", ref: "bn-0191" }, { word: "কী", ref: "bn-0161" }] }
  - id: "bn-4099"
