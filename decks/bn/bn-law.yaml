cards:
  - id: "bn-4091"
    target: "অপরাধী"
    reading: "ôporādhi"
    ipa: "ɔporad̪ʱi"
    pos: "noun"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "অপরাধী", reading: "ôporādhi" }] }
    examples:
      - { target: "অপরাধী ধরা পড়ল।", reading: "ôporādhi dhôrā pôṛol.", ipa: "ɔporad̪ʱi d̪ʱɔra pɔɽol", bases: [{ word: "ধরা", ref: "bn-1107" }, { word: "পড়ল", ref: "bn-0119" }] }
      - { target: "অপরাধীর শাস্তি হওয়া উচিত।", reading: "ôporādhir śāsti hôoyā ucit.", ipa: "ɔporad̪ʱir ʃast̪i ɦɔoja utʃit̪", bases: [{ word: "অপরাধীর", base: "অপরাধী", reading: "ôporādhir" }, { word: "শাস্তি", ref: "bn-4093" }, { word: "হওয়া", ref: "bn-0874" }, { word: "উচিত", ref: "bn-2988" }] }
  - id: "bn-4092"
    target: "সাক্ষ্য"
    reading: "sākkkh"
    ipa: "sakkkʰ"
    pos: "noun"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "সাক্ষ্য", reading: "sākkkh" }] }
    examples:
      - { target: "সাক্ষ্য দিতে হবে।", reading: "sākkkh dite hôbe.", ipa: "sakkkʰ d̪it̪e ɦɔbe", bases: [{ word: "দিতে", ref: "bn-0888" }, { word: "হবে", ref: "bn-0874" }] }
      - { target: "সাক্ষ্যের জন্য কে এসেছে?", reading: "sākkkher jonn ke eseche?", ipa: "sakkkʰer dʒonn ke esetʃʰe", bases: [{ word: "সাক্ষ্যের", base: "সাক্ষ্য", reading: "sākkkher" }, { word: "জন্য", ref: "bn-0297" }, { word: "কে", ref: "bn-0162" }, { word: "এসেছে", ref: "bn-0872" }] }
  - id: "bn-4093"
    target: "শাস্তি"
    reading: "śāsti"
    ipa: "ʃast̪i"
    pos: "noun"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "শাস্তি", reading: "śāsti" }] }
    examples:
      - { target: "শাস্তি কঠিন হওয়া উচিত।", reading: "śāsti koṭhin hôoyā ucit.", ipa: "ʃast̪i koʈʰin ɦɔoja utʃit̪", bases: [{ word: "কঠিন", ref: "bn-0624" }, { word: "হওয়া", ref: "bn-0874" }, { word: "উচিত", ref: "bn-2988" }] }
      - { target: "তাকে শাস্তি দেওয়া হলো।", reading: "tāke śāsti deoyā hôlo.", ipa: "t̪ake ʃast̪i d̪eoja ɦɔlo", bases: [{ word: "তাকে", ref: "bn-0839" }, { word: "দেওয়া", ref: "bn-0888" }, { word: "হলো", ref: "bn-0812" }] }
  - id: "bn-4094"
    target: "জেল"
    reading: "jel"
    ipa: "dʒel"
    pos: "noun"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "জেল", reading: "jel" }] }
    examples:
      - { target: "সে জেলে আছে।", reading: "se jele āche.", ipa: "se dʒele atʃʰe", bases: [{ word: "সে", ref: "bn-0839" }, { word: "জেলে", base: "জেল", reading: "jele" }, { word: "আছে", base: "আছে", reading: "āche" }] }
      - { target: "জেল থেকে ছাড়া পেল।", reading: "jel theke chāṛā pel.", ipa: "dʒel t̪ʰeke tʃʰaɽa pel", bases: [{ word: "থেকে", ref: "bn-0294" }, { word: "ছাড়া", ref: "bn-0589" }, { word: "পেল", ref: "bn-0891" }] }
  - id: "bn-4095"
    target: "কারাগার"
    reading: "kārāgār"
    ipa: "karaɡar"
    pos: "noun"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "কারাগার", reading: "kārāgār" }] }
    examples:
      - { target: "কারাগারে অনেক লোক।", reading: "kārāgāre ônek lok.", ipa: "karaɡare ɔnek lok", bases: [{ word: "কারাগারে", base: "কারাগার", reading: "kārāgāre" }, { word: "অনেক", ref: "bn-0550" }, { word: "লোক", base: "লোক", reading: "lok" }] }
      - { target: "কারাগারের দরজা বন্ধ।", reading: "kārāgārer dôrojā bôndh.", ipa: "karaɡarer d̪ɔrodʒa bɔnd̪ʱ", bases: [{ word: "কারাগারের", base: "কারাগার", reading: "kārāgārer" }, { word: "দরজা", ref: "bn-0599" }, { word: "বন্ধ", ref: "bn-1230" }] }
  - id: "bn-4096"
    target: "জামিন"
    reading: "jāmin"
    ipa: "dʒamin"
    pos: "noun"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "জামিন", reading: "jāmin" }] }
    examples:
      - { target: "জামিন পেয়ে সে বাড়ি গেল।", reading: "jāmin peye se bāṛi gel.", ipa: "dʒamin peje se baɽi ɡel", bases: [{ word: "পেয়ে", ref: "bn-0891" }, { word: "সে", ref: "bn-0839" }, { word: "বাড়ি", ref: "bn-0196" }, { word: "গেল", ref: "bn-0873" }] }
      - { target: "জামিনের টাকা কত?", reading: "jāminer ṭākā kôt?", ipa: "dʒaminer ʈaka kɔt̪", bases: [{ word: "জামিনের", base: "জামিন", reading: "jāminer" }, { word: "টাকা", ref: "bn-0245" }, { word: "কত", ref: "bn-0167" }] }
  - id: "bn-4097"
