schema: 1
id: bn-en-grammar-sentences
name: "Basic sentences"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Word order, no 'is', and how Bengali says 'have' and 'like'."
tags: [beginner, grammar]
cards:
  - id: bn-0149
    target: "আমি ছাত্র।"
    native: "I am a student."
    reading: "āmi chātro."
    ipa: "ami tʃʰat̪ro"
    pos: "phrase"
    notes: "No 'is' in the present: 'I student'. A woman says আমি ছাত্রী (chhatri)."
  - id: bn-0150
    target: "এটা আমার বাড়ি।"
    native: "This is my house."
    reading: "eṭā āmār bāṛi."
    ipa: "eʈa amar baɽi"
    pos: "phrase"
  - id: bn-0151
    target: "আমি চা খাই।"
    native: "I drink tea."
    reading: "āmi cā khāi."
    ipa: "ami tʃa kʰai"
    pos: "phrase"
    notes: "Subject, object, verb. Bengali 'eats' tea: খাওয়া covers drinking too."
  - id: bn-0152
    target: "ও বাংলা শিখছে।"
    native: "She is learning Bengali. / He is learning Bengali."
    reading: "o bāṅlā śikhche."
    ipa: "o baŋla ʃikʰtʃʰe"
    pos: "phrase"
  - id: bn-0153
    target: "আমার বাংলা ভালো লাগে।"
    native: "I like Bengali."
    reading: "āmār bāṅlā bhālo lāge."
    ipa: "amar baŋla bʱalo laɡe"
    pos: "phrase"
    notes: "'To me, Bengali feels good': the liker takes the possessive."
  - id: bn-0154
    target: "আমার একটা গাড়ি আছে।"
    native: "I have a car."
    reading: "āmār ekṭā gāṛi āche."
    ipa: "amar ekʈa ɡaɽi atʃʰe"
    pos: "phrase"
    notes: "'Of me there is a car': আছে, 'there is', with the owner's possessive."
  - id: bn-0155
    target: "আমার টাকা নেই।"
    native: "I don't have money."
    reading: "āmār ṭākā nei."
    ipa: "amar ʈaka nei"
    pos: "phrase"
    notes: "নেই, 'there isn't', is the negative of আছে."
  - id: bn-0156
    target: "এটা ভালো না।"
    native: "This isn't good."
    reading: "eṭā bhālo nā."
    ipa: "eʈa bʱalo na"
    pos: "phrase"
    notes: "না comes at the end: 'this good not'."
  - id: bn-0157
    target: "যাবেন না।"
    native: "Please don't go."
    reading: "jāben nā."
    ipa: "dʒaben na"
    pos: "phrase"
    notes: "না comes after the verb, even for 'don't'."
  - id: bn-0158
    target: "আজ খুব গরম।"
    native: "It's very hot today."
    reading: "āj khub gôrom."
    ipa: "adʒ kʰub ɡɔrom"
    pos: "phrase"
    notes: "No 'it', and no 'is'."
