schema: 1
id: bn-en-grammar-sentences
name: "Basic sentences"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Word order, no 'is', and how Bengali says 'have' and 'like'."
tags: [beginner, grammar]
cards:
  - id: bn-0149
    target: "আমি ছাত্র।"
    native: "I am a student."
    reading: "āmi chātro."
    ipa: "ami tʃʰat̪ro"
    pos: "phrase"
    notes: "No 'is' in the present: 'I student'. A woman says আমি ছাত্রী (chhatri)."
    bases:
      - { word: "আমি", ref: "bn-0833" }
  - id: bn-0150
    target: "এটা আমার বাড়ি।"
    native: "This is my house."
    reading: "eṭā āmār bāṛi."
    ipa: "eʈa amar baɽi"
    pos: "phrase"
    bases:
      - { word: "এটা", ref: "bn-0849" }
      - { word: "আমার", ref: "bn-0833" }
  - id: bn-0151
    target: "আমি চা খাই।"
    native: "I drink tea."
    reading: "āmi cā khāi."
    ipa: "ami tʃa kʰai"
    pos: "phrase"
    notes: "Subject, object, verb. Bengali 'eats' tea: খাওয়া (khāoyā) covers drinking too."
    bases:
      - { word: "আমি", ref: "bn-0833" }
      - { word: "খাই", ref: "bn-0876" }
  - id: bn-0152
    target: "ও বাংলা শিখছে।"
    native: "She is learning Bengali. / He is learning Bengali."
    reading: "o bāṅlā śikhche."
    ipa: "o baŋla ʃikʰtʃʰe"
    pos: "phrase"
    bases:
      - { word: "বাংলা", base: "বাংলা", reading: "bāṅlā", meaning: "Bengali (the language); Bengal" }
      - { word: "শিখছে", ref: "bn-0883" }
  - id: bn-0153
    target: "আমার বাংলা ভালো লাগে।"
    native: "I like Bengali."
    reading: "āmār bāṅlā bhālo lāge."
    ipa: "amar baŋla bʱalo laɡe"
    pos: "phrase"
    notes: "'To me, Bengali feels good': the liker takes the possessive."
    bases:
      - { word: "আমার", ref: "bn-0833" }
      - { word: "বাংলা", base: "বাংলা", reading: "bāṅlā", meaning: "Bengali (the language); Bengal" }
      - { word: "লাগে", base: "লাগা", reading: "lāgā", meaning: "to feel; to be needed; to take (of time)" }
  - id: bn-0154
    target: "আমার একটা গাড়ি আছে।"
    native: "I have a car."
    reading: "āmār ekṭā gāṛi āche."
    ipa: "amar ekʈa ɡaɽi atʃʰe"
    pos: "phrase"
    notes: "'Of me there is a car': আছে (āche), 'there is', with the owner's possessive."
    bases:
      - { word: "আমার", ref: "bn-0833" }
      - { word: "একটা", ref: "bn-0202" }
      - { word: "গাড়ি", ref: "bn-1163" }
      - { word: "আছে", base: "আছে", reading: "āche", meaning: "to be; there is" }
  - id: bn-0155
    target: "আমার টাকা নেই।"
    native: "I don't have money."
    reading: "āmār ṭākā nei."
    ipa: "amar ʈaka nei"
    pos: "phrase"
    notes: "নেই (nei), 'there isn't', is the negative of আছে (āche)."
    bases:
      - { word: "আমার", ref: "bn-0833" }
      - { word: "নেই", base: "নেই", reading: "nei", meaning: "there is not" }
  - id: bn-0156
    target: "এটা ভালো না।"
    native: "This isn't good."
    reading: "eṭā bhālo nā."
    ipa: "eʈa bʱalo na"
    pos: "phrase"
    notes: "না (nā) comes at the end: 'this good not'."
    bases:
      - { word: "এটা", ref: "bn-0849" }
  - id: bn-0157
    target: "যাবেন না।"
    native: "Please don't go."
    reading: "jāben nā."
    ipa: "dʒaben na"
    pos: "phrase"
    notes: "না (nā) comes after the verb, even for 'don't'."
    bases:
      - { word: "যাবেন", ref: "bn-0873" }
  - id: bn-0158
    target: "আজ খুব গরম।"
    native: "It's very hot today."
    reading: "āj khub gôrom."
    ipa: "adʒ kʰub ɡɔrom"
    pos: "phrase"
    notes: "No 'it', and no 'is'."
