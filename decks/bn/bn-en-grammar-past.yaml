        "তুই / তোরা": "বললি"
        "তুমি / তোমরা": "বললে"
        "আপনি / আপনারা": "বললেন"
        "সে / তারা": "বলল"
        "তিনি / তাঁরা": "বললেন"
      readings:
        "আমি / আমরা": "bôllām"
        "তুই / তোরা": "bôlli"
        "তুমি / তোমরা": "bôlle"
        "আপনি / আপনারা": "bôllen"
        "সে / তারা": "bôllo"
        "তিনি / তাঁরা": "bôllen"
      ipas:
        "আমি / আমরা": "bɔllam"
        "তুই / তোরা": "bɔlli"
        "তুমি / তোমরা": "bɔlle"
