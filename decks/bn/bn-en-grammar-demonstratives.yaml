schema: 1
id: bn-en-grammar-demonstratives
name: "This, that and the one not here"
kind: grammar
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Bengali points three ways: এ- near you, ও- over there, সে- out of sight or already mentioned. Not yet checked by a Bengali speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Pointing words"
  slot_name: "where"
  slots: ["near: এ-", "over there: ও-", "not here, or already mentioned: সে-"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "এ- is near you, ও- is over there, and সে- is out of sight or the one already talked about, though speakers don't keep strictly to near and far (Basic Bangla 2.4). For people, সে-'s other forms start with ত-: তারা, তার, তাকে. ইনি, উনি and তিনি are the respectful forms; their forms with ঁ are also said with ন, as in এনারা, ওনার, ওনাকে, and the drill accepts both. A thing takes -টা: এটা, and before a noun এই বইটা, this book. ওই is also written ঐ, and both are accepted."
  entries:
    - lemma: "he, she"
      key: person
      gloss: "a person"
      forms:
        "near: এ-": "এ"
        "over there: ও-": "ও"
        "not here, or already mentioned: সে-": "সে"
      readings:
        "near: এ-": "e"
        "over there: ও-": "o"
        "not here, or already mentioned: সে-": "she"
    - lemma: "he, she, respectful"
      key: person-respectful
      gloss: "a person"
      forms:
        "near: এ-": "ইনি"
        "over there: ও-": "উনি"
        "not here, or already mentioned: সে-": "তিনি"
      readings:
        "near: এ-": "ini"
        "over there: ও-": "uni"
        "not here, or already mentioned: সে-": "tini"
    - lemma: "they"
      key: people
      gloss: "people"
      forms:
        "near: এ-": "এরা"
        "over there: ও-": "ওরা"
        "not here, or already mentioned: সে-": "তারা"
      readings:
        "near: এ-": "era"
        "over there: ও-": "ora"
        "not here, or already mentioned: সে-": "tara"
    - lemma: "they, respectful"
      key: people-respectful
      gloss: "people"
      forms:
        "near: এ-": ["এঁরা", "এনারা"]
        "over there: ও-": ["ওঁরা", "ওনারা"]
        "not here, or already mentioned: সে-": "তাঁরা"
      readings:
        "near: এ-": ["enra", "enara"]
        "over there: ও-": ["onra", "onara"]
        "not here, or already mentioned: সে-": "tanra"
    - lemma: "his, her"
      key: possessive
      gloss: "of a person"
      forms:
        "near: এ-": "এর"
        "over there: ও-": "ওর"
        "not here, or already mentioned: সে-": "তার"
      readings:
        "near: এ-": "er"
        "over there: ও-": "or"
        "not here, or already mentioned: সে-": "tar"
    - lemma: "his, her, respectful"
      key: possessive-respectful
      gloss: "of a person"
      forms:
        "near: এ-": ["এঁর", "এনার"]
        "over there: ও-": ["ওঁর", "ওনার"]
        "not here, or already mentioned: সে-": "তাঁর"
      readings:
        "near: এ-": ["enr", "enar"]
        "over there: ও-": ["onr", "onar"]
        "not here, or already mentioned: সে-": "tanr"
    - lemma: "him, her"
      key: object
      gloss: "a person, as object"
      forms:
        "near: এ-": "একে"
        "over there: ও-": "ওকে"
        "not here, or already mentioned: সে-": "তাকে"
      readings:
        "near: এ-": "eke"
        "over there: ও-": "oke"
        "not here, or already mentioned: সে-": "take"
    - lemma: "this one, that one"
      key: thing
      gloss: "a thing"
      forms:
        "near: এ-": "এটা"
        "over there: ও-": "ওটা"
        "not here, or already mentioned: সে-": "সেটা"
      readings:
        "near: এ-": "eta"
        "over there: ও-": "ota"
        "not here, or already mentioned: সে-": "sheta"
    - lemma: "these, those"
      key: things
      gloss: "things"
      forms:
        "near: এ-": "এগুলো"
        "over there: ও-": "ওগুলো"
        "not here, or already mentioned: সে-": "সেগুলো"
      readings:
        "near: এ-": "egulo"
        "over there: ও-": "ogulo"
        "not here, or already mentioned: সে-": "shegulo"
    - lemma: "this, that"
      key: before-noun
      gloss: "before a noun"
      forms:
        "near: এ-": "এই"
        "over there: ও-": ["ওই", "ঐ"]
        "not here, or already mentioned: সে-": "সেই"
      readings:
        "near: এ-": "ei"
        "over there: ও-": ["oi", "oi"]
        "not here, or already mentioned: সে-": "shei"
    - lemma: "here, there"
      key: place
      gloss: "a place"
      forms:
        "near: এ-": "এখানে"
        "over there: ও-": "ওখানে"
        "not here, or already mentioned: সে-": "সেখানে"
      readings:
        "near: এ-": "ekhane"
        "over there: ও-": "okhane"
        "not here, or already mentioned: সে-": "shekhane"
    - lemma: "this way, that way"
      key: way
      gloss: "a direction"
      forms:
        "near: এ-": "এদিকে"
        "over there: ও-": "ওদিকে"
        "not here, or already mentioned: সে-": "সেদিকে"
      readings:
        "near: এ-": "edike"
        "over there: ও-": "odike"
        "not here, or already mentioned: সে-": "shedike"
    - lemma: "like this, like that"
      key: kind
      gloss: "a kind"
      forms:
        "near: এ-": "এরকম"
        "over there: ও-": "ওরকম"
        "not here, or already mentioned: সে-": "সেরকম"
      readings:
        "near: এ-": "erokom"
        "over there: ও-": "orokom"
        "not here, or already mentioned: সে-": "sherokom"
