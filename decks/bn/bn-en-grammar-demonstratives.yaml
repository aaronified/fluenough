schema: 1
id: bn-en-grammar-demonstratives
name: "This, that and the one not here"
kind: grammar
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Bengali points three ways: এ- near you, ও- over there, সে- out of sight or already mentioned. Not yet checked by a Bengali speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Pointing words"
  slot_name: "where"
  slots: ["near: এ-", "over there: ও-", "not here, or already mentioned: সে-"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "এ- is near you, ও- is over there, and সে- is out of sight or the one already talked about, though speakers don't keep strictly to near and far (Basic Bangla 2.4). For people, সে-'s other forms start with ত-: তারা, তার, তাকে. ইনি, উনি and তিনি are the respectful forms; their forms with ঁ are also said with ন, as in এনারা, ওনার, ওনাকে, and the drill accepts both. A thing takes -টা: এটা, and before a noun এই বইটা, this book. ওই is also written ঐ, and both are accepted."
  entries:
    - lemma: "he, she"
      key: person
      gloss: "a person"
      forms:
        "near: এ-": "এ"
        "over there: ও-": "ও"
        "not here, or already mentioned: সে-": "সে"
      readings:
        "near: এ-": "e"
        "over there: ও-": "o"
        "not here, or already mentioned: সে-": "śe"
      ipas:
        "near: এ-": "e"
        "over there: ও-": "o"
        "not here, or already mentioned: সে-": "ʃe"
    - lemma: "he, she, respectful"
      key: person-respectful
      gloss: "a person"
      forms:
        "near: এ-": "ইনি"
        "over there: ও-": "উনি"
        "not here, or already mentioned: সে-": "তিনি"
      readings:
        "near: এ-": "ini"
        "over there: ও-": "uni"
        "not here, or already mentioned: সে-": "tini"
      ipas:
        "near: এ-": "ini"
        "over there: ও-": "uni"
        "not here, or already mentioned: সে-": "t̪ini"
    - lemma: "they"
      key: people
      gloss: "people"
      forms:
        "near: এ-": "এরা"
        "over there: ও-": "ওরা"
        "not here, or already mentioned: সে-": "তারা"
      readings:
        "near: এ-": "erā"
        "over there: ও-": "orā"
        "not here, or already mentioned: সে-": "tārā"
      ipas:
        "near: এ-": "era"
        "over there: ও-": "ora"
        "not here, or already mentioned: সে-": "t̪ara"
    - lemma: "they, respectful"
      key: people-respectful
      gloss: "people"
      forms:
        "near: এ-": ["এঁরা", "এনারা"]
        "over there: ও-": ["ওঁরা", "ওনারা"]
        "not here, or already mentioned: সে-": "তাঁরা"
      readings:
        "near: এ-": ["em̐rā", "enārā"]
        "over there: ও-": ["om̐rā", "onārā"]
        "not here, or already mentioned: সে-": "tām̐rā"
      ipas:
        "near: এ-": "ẽra"
        "over there: ও-": "õra"
        "not here, or already mentioned: সে-": "t̪ãra"
    - lemma: "his, her"
      key: possessive
      gloss: "of a person"
      forms:
        "near: এ-": "এর"
        "over there: ও-": "ওর"
        "not here, or already mentioned: সে-": "তার"
      readings:
        "near: এ-": "er"
        "over there: ও-": "or"
        "not here, or already mentioned: সে-": "tār"
      ipas:
        "near: এ-": "er"
        "over there: ও-": "or"
        "not here, or already mentioned: সে-": "t̪ar"
    - lemma: "his, her, respectful"
      key: possessive-respectful
      gloss: "of a person"
      forms:
        "near: এ-": ["এঁর", "এনার"]
        "over there: ও-": ["ওঁর", "ওনার"]
        "not here, or already mentioned: সে-": "তাঁর"
      readings:
        "near: এ-": ["em̐r", "enār"]
        "over there: ও-": ["om̐r", "onār"]
        "not here, or already mentioned: সে-": "tām̐r"
      ipas:
        "near: এ-": "ẽr"
        "over there: ও-": "õr"
        "not here, or already mentioned: সে-": "t̪ãr"
    - lemma: "him, her"
      key: object
      gloss: "a person, as object"
      forms:
        "near: এ-": "একে"
        "over there: ও-": "ওকে"
        "not here, or already mentioned: সে-": "তাকে"
      readings:
        "near: এ-": "eke"
        "over there: ও-": "oke"
        "not here, or already mentioned: সে-": "tāke"
      ipas:
        "near: এ-": "eke"
        "over there: ও-": "oke"
        "not here, or already mentioned: সে-": "t̪ake"
    - lemma: "this one, that one"
      key: thing
      gloss: "a thing"
      forms:
        "near: এ-": "এটা"
        "over there: ও-": "ওটা"
        "not here, or already mentioned: সে-": "সেটা"
      readings:
        "near: এ-": "eṭā"
        "over there: ও-": "oṭā"
        "not here, or already mentioned: সে-": "śeṭā"
      ipas:
        "near: এ-": "eʈa"
        "over there: ও-": "oʈa"
        "not here, or already mentioned: সে-": "ʃeʈa"
    - lemma: "these, those"
      key: things
      gloss: "things"
      forms:
        "near: এ-": "এগুলো"
        "over there: ও-": "ওগুলো"
        "not here, or already mentioned: সে-": "সেগুলো"
      readings:
        "near: এ-": "egulo"
        "over there: ও-": "ogulo"
        "not here, or already mentioned: সে-": "śegulo"
      ipas:
        "near: এ-": "eɡulo"
        "over there: ও-": "oɡulo"
        "not here, or already mentioned: সে-": "ʃeɡulo"
    - lemma: "this, that"
      key: before-noun
      gloss: "before a noun"
      forms:
        "near: এ-": "এই"
        "over there: ও-": ["ওই", "ঐ"]
        "not here, or already mentioned: সে-": "সেই"
      readings:
        "near: এ-": "ei"
        "over there: ও-": ["oi", "oi"]
        "not here, or already mentioned: সে-": "śei"
      ipas:
        "near: এ-": "ei"
        "over there: ও-": "oi"
        "not here, or already mentioned: সে-": "ʃei"
    - lemma: "here, there"
      key: place
      gloss: "a place"
      forms:
        "near: এ-": "এখানে"
        "over there: ও-": "ওখানে"
        "not here, or already mentioned: সে-": "সেখানে"
      readings:
        "near: এ-": "ekhāne"
        "over there: ও-": "okhāne"
        "not here, or already mentioned: সে-": "śekhāne"
      ipas:
        "near: এ-": "ekʰane"
        "over there: ও-": "okʰane"
        "not here, or already mentioned: সে-": "ʃekʰane"
    - lemma: "this way, that way"
      key: way
      gloss: "a direction"
      forms:
        "near: এ-": "এদিকে"
        "over there: ও-": "ওদিকে"
        "not here, or already mentioned: সে-": "সেদিকে"
      readings:
        "near: এ-": "edike"
        "over there: ও-": "odike"
        "not here, or already mentioned: সে-": "śedike"
      ipas:
        "near: এ-": "ed̪ike"
        "over there: ও-": "od̪ike"
        "not here, or already mentioned: সে-": "ʃed̪ike"
    - lemma: "like this, like that"
      key: kind
      gloss: "a kind"
      forms:
        "near: এ-": "এরকম"
        "over there: ও-": "ওরকম"
        "not here, or already mentioned: সে-": "সেরকম"
      readings:
        "near: এ-": "erokom"
        "over there: ও-": "orokom"
        "not here, or already mentioned: সে-": "śerokom"
      ipas:
        "near: এ-": "erokom"
        "over there: ও-": "orokom"
        "not here, or already mentioned: সে-": "ʃerokom"
