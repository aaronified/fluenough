schema: 1
id: bn-en-questions
name: "Yes, no and questions"
kind: vocab
theme: questions
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Yes and no, the question words, and how a sentence becomes a question."
tags: [beginner]
cards:
  - id: bn-0159
    target: "হ্যাঁ"
    native: "yes"
    reading: "hyan"
    pos: "other"
    notes: "Said softly, also হুঁ (hun)."
  - id: bn-0160
    target: "না"
    native: "no; not"
    reading: "na"
    pos: "other"
    notes: "As 'not' it comes after the verb: আমি জানি না, I don't know."
  - id: bn-0161
    target: "কী"
    native: "what"
    reading: "ki"
    pos: "other"
    notes: "Spelled with a long ী as 'what'. With a short ি, কি turns a sentence into a yes/no question: আপনি কি বাংলা বলেন? Do you speak Bengali?"
  - id: bn-0162
    target: "কে"
    native: "who"
    reading: "ke"
    pos: "other"
  - id: bn-0163
    target: "কোথায়"
    native: "where"
    reading: "kothay"
    pos: "other"
  - id: bn-0164
    target: "কখন"
    native: "when; at what time"
    reading: "kokhon"
    pos: "other"
    notes: "কবে (kobe) is 'when' as in 'on which day'."
  - id: bn-0165
    target: "কেন"
    native: "why"
    reading: "keno"
    pos: "other"
  - id: bn-0166
    target: "কেমন"
    native: "how; what … like"
    reading: "kemon"
    pos: "other"
    notes: "কীভাবে (kibhabe) is 'how' as in 'in what way'."
  - id: bn-0167
    target: "কত"
    native: "how much; how many"
    reading: "koto"
    pos: "other"
    notes: "কত দাম? How much does it cost?"
  - id: bn-0168
    target: "কোনটা"
    native: "which one"
    reading: "konta"
    pos: "other"
  - id: bn-0169
    target: "ঠিক আছে?"
    native: "Is that OK? / OK?"
    reading: "thik achhe?"
    pos: "phrase"
    notes: "As a reply, ঠিক আছে means 'OK, fine'."
  - id: bn-0170
    target: "সত্যি?"
    native: "Really?"
    reading: "shotti?"
    pos: "phrase"
