schema: 1
id: bn-en-questions
name: "Yes, no and questions"
kind: vocab
theme: questions
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN, icon: "বা" }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Yes and no, the question words, and how a sentence becomes a question."
tags: [beginner]
cards:
  - id: bn-0159
    target: "হ্যাঁ"
    native: "yes"
    reading: "hyan"
    alt_target: ["জি"]
    pos: "other"
    notes: "Said softly, also হুঁ (hun). A polite yes is also জি (ji)."
  - id: bn-0160
    target: "না"
    native: "no; not"
    reading: "na"
    pos: "other"
    notes: "As 'not' it comes after the verb: আমি জানি না, I don't know."
  - id: bn-0161
    target: "কী"
    native: "what"
    reading: "ki"
    pos: "other"
    notes: "Spelled with a long ী as 'what'. With a short ি, কি turns a sentence into a yes/no question: আপনি কি বাংলা বলেন? Do you speak Bengali?"
  - id: bn-0162
    target: "কে"
    native: "who"
    reading: "ke"
    pos: "other"
  - id: bn-0163
    target: "কোথায়"
    native: "where"
    reading: "kothay"
    pos: "other"
  - id: bn-0164
    target: "কখন"
    native: "when; at what time"
    reading: "kokhon"
    alt_target: ["কটায়", "কয়টায়"]
    pos: "other"
    notes: "কবে (kobe) is 'when' as in 'on which day'."
  - id: bn-0165
    target: "কেন"
    native: "why"
    reading: "keno"
    pos: "other"
  - id: bn-0166
    target: "কেমন"
    native: "how; what … like"
    reading: "kemon"
    pos: "other"
    notes: "কীভাবে (kibhabe) is 'how' as in 'in what way'."
  - id: bn-0167
    target: "কত"
    native: "how much; how many"
    reading: "koto"
    pos: "other"
    notes: "কত দাম? How much does it cost?"
  - id: bn-0168
    target: "কোনটা"
    native: "which one"
    reading: "konta"
    pos: "other"
  - id: bn-0169
    target: "ঠিক আছে?"
    native: "Is that OK? / OK?"
    reading: "thik achhe?"
    pos: "phrase"
    notes: "As a reply, ঠিক আছে means 'OK, fine'."
  - id: bn-0170
    target: "সত্যি?"
    native: "Really?"
    reading: "shotti?"
    pos: "phrase"
  - id: bn-0406
    target: "কবে"
    native: "when (on what day)"
    reading: "kobe"
    pos: "other"
    notes: "কখন is the hour, কবে the day: কবে আসবেন? When will you come?"
  - id: bn-0407
    target: "কার"
    native: "whose"
    reading: "kar"
    pos: "other"
    notes: "কার বই? Whose book?"
  - id: bn-0408
    target: "কাকে"
    native: "whom; to whom"
    reading: "kake"
    pos: "other"
  - id: bn-0409
    target: "কারা"
    native: "who (more than one)"
    reading: "kara"
    pos: "other"
  - id: bn-0410
    target: "কীভাবে"
    native: "how; in what way"
    reading: "kibhabe"
    alt_target: ["কী করে"]
    pos: "other"
    notes: "Also কী করে (ki kore)."
  - id: bn-0411
    target: "কটা"
    native: "how many (things you count)"
    reading: "kota"
    alt_target: ["কয়টা"]
    pos: "other"
    notes: "কটা বই? How many books? কত is for amounts: কত টাকা? Also কয়টা (koyta)."
  - id: bn-0412
    target: "কোন"
    native: "which"
    reading: "kon"
    pos: "other"
    notes: "Before a noun: কোন বাস? Which bus? On its own: কোনটা."
  - id: bn-0413
    target: "কোথা থেকে"
    native: "from where"
    reading: "kotha theke"
    pos: "phrase"
    notes: "আপনি কোথা থেকে এসেছেন? Where have you come from?"
