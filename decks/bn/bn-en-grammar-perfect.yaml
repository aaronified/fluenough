schema: 1
id: bn-en-grammar-perfect
name: "Present perfect"
kind: grammar
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "I have done, she has gone: -এছি, which Bengali also uses for anything just done. Not yet checked by a Bengali speaker: please report any mistake."
tags: [beginner, unreviewed, grammar]
pattern:
  name: "Present perfect"
  slot_name: "person and respect"
  slots: ["আমি / আমরা", "তুই / তোরা", "তুমি / তোমরা", "আপনি / আপনারা", "সে / তারা", "তিনি / তাঁরা"]
  prompt: "{lemma} ({gloss}) — {slot}"
  notes: "The endings are -এছি, -এছিস, -এছো, -এছেন, -এছে, -এছেন. It is 'have done', and also the everyday past for something recent: আমি খেয়েছি, I've eaten, or I ate. -লাম (খেলাম) says the same, and speakers choose freely. Some verbs change their vowel: খাওয়া gives খেয়েছি, বোঝা gives বুঝেছি, আসা gives এসেছি. যাওয়া is গিয়েছি, said গেছি in everyday speech, and the drill accepts both. ও and এ take the same form as সে, and উনি and ইনি the same as তিনি. করেছো is also written করেছ, and both are accepted."
  entries:
    - lemma: "করা"
      key: kora
      reading: "kora"
      gloss: "to do"
      forms:
        "আমি / আমরা": "করেছি"
        "তুই / তোরা": "করেছিস"
        "তুমি / তোমরা": ["করেছো", "করেছ"]
        "আপনি / আপনারা": "করেছেন"
        "সে / তারা": "করেছে"
        "তিনি / তাঁরা": "করেছেন"
      readings:
        "আমি / আমরা": "korechhi"
        "তুই / তোরা": "korechhish"
        "তুমি / তোমরা": ["korechho", "korechho"]
        "আপনি / আপনারা": "korechhen"
        "সে / তারা": "korechhe"
        "তিনি / তাঁরা": "korechhen"
    - lemma: "যাওয়া"
      key: jaoa
      reading: "jaoa"
      gloss: "to go"
      forms:
        "আমি / আমরা": ["গিয়েছি", "গেছি"]
        "তুই / তোরা": ["গিয়েছিস", "গেছিস"]
        "তুমি / তোমরা": ["গিয়েছো", "গিয়েছ", "গেছো", "গেছ"]
        "আপনি / আপনারা": ["গিয়েছেন", "গেছেন"]
        "সে / তারা": ["গিয়েছে", "গেছে"]
        "তিনি / তাঁরা": ["গিয়েছেন", "গেছেন"]
      readings:
        "আমি / আমরা": ["giyechhi", "gechhi"]
        "তুই / তোরা": ["giyechhish", "gechhish"]
        "তুমি / তোমরা": ["giyechho", "giyechho", "gechho", "gechho"]
        "আপনি / আপনারা": ["giyechhen", "gechhen"]
        "সে / তারা": ["giyechhe", "gechhe"]
        "তিনি / তাঁরা": ["giyechhen", "gechhen"]
    - lemma: "খাওয়া"
      key: khaoa
