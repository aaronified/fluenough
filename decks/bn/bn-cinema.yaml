      - { target: "অভিনেত্রীর গান শুনলাম।", reading: "ôbhinetrir gān śunolām.", ipa: "ɔbʱinet̪rir ɡan ʃunolam", bases: [{ word: "অভিনেত্রীর", base: "অভিনেত্রী", reading: "ôbhinetrir" }, { word: "গান", ref: "bn-1668" }, { word: "শুনলাম", ref: "bn-0878" }] }
  - id: "bn-3540"
