      - { target: "নায়িকার চরিত্র ভালো।", reading: "nāyikār coritr bhālo.", ipa: "najikar tʃorit̪r bʱalo", bases: [{ word: "নায়িকার", base: "নায়িকা", reading: "nāyikār" }, { word: "চরিত্র", ref: "bn-3543" }, { word: "ভালো", ref: "bn-0617" }] }
