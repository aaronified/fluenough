  - id: "bn-3537"
    target: "পরিচালক"
    reading: "poricālok"
    ipa: "poritʃalok"
    pos: "noun"
    notes:
      - { id: "n1", kind: "usage", words: [{ word: "পরিচালক", reading: "poricālok" }] }
    examples:
      - { target: "পরিচালক নতুন ছবি বানাচ্ছেন।", reading: "poricālok notun chobi bānācchen.", ipa: "poritʃalok not̪un tʃʰobi banatʃtʃʰen", bases: [{ word: "নতুন", ref: "bn-0620" }, { word: "ছবি", ref: "bn-1145" }, { word: "বানাচ্ছেন", base: "বানানো", reading: "bānācchen" }] }
      - { target: "পরিচালকের সঙ্গে কথা হলো।", reading: "poricāloker sôṅge kôthā hôlo.", ipa: "poritʃaloker sɔŋɡe kɔt̪ʰa ɦɔlo", bases: [{ word: "পরিচালকের", base: "পরিচালক", reading: "poricāloker" }, { word: "সঙ্গে", ref: "bn-0296" }, { word: "কথা", ref: "bn-2409" }, { word: "হলো", ref: "bn-0874" }] }
