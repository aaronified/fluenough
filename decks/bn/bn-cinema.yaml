      - { target: "অভিনেতাকে চেনো?", reading: "ôbhinetāke ceno?", ipa: "ɔbʱinet̪ake tʃeno", bases: [{ word: "অভিনেতাকে", base: "অভিনেতা", reading: "ôbhinetāke" }, { word: "চেনো", ref: "bn-2357" }] }
