description: "Jobs, and how to say what you do and where you work. Not yet checked by a Bengali speaker: please report any mistake."
tags: [beginner, unreviewed]
cards:
  - id: bn-0449
    target: "চাকরি"
    native: "job (employment)"
    reading: "cākri"
    ipa: "tʃakri"
    pos: "noun"
    notes: "আমি চাকরি করি (āmi cākri kori), I have a job. কাজ (kāj) is work of any kind."
  - ref: bn-0198
  - id: bn-0450
    target: "অফিস"
    native: "office"
    picture: "🏢"
    reading: "ôphis"
    ipa: "ɔpʰis"
    pos: "noun"
  - id: bn-0451
    target: "শিক্ষক"
    native: "teacher"
    picture: "🧑‍🏫"
    reading: "śikkhok"
    ipa: "ʃikkʰok"
    pos: "noun"
    notes: "A woman teacher is শিক্ষিকা (śikkhikā). A few job words have a feminine like this; most, like ডাক্তার (ḍāktār), do not."
  - id: bn-0452
    target: "দোকানদার"
    native: "shopkeeper"
    reading: "dokāndār"
    ipa: "d̪okand̪ar"
    pos: "noun"
    notes: "দোকান (dokān), shop, and -দার (-dār), the one who has it."
  - id: bn-0453
    target: "ড্রাইভার"
    native: "driver"
    reading: "ḍrāibhār"
    ipa: "ɖraibʱar"
    alt_target: ["চালক"]
    pos: "noun"
    notes: "In writing also চালক (cālok)."
  - id: bn-0454
    target: "ইঞ্জিনিয়ার"
    native: "engineer"
    reading: "injiniyār"
    ipa: "indʒinijar"
    pos: "noun"
  - id: bn-0455
    target: "উকিল"
    native: "lawyer"
    reading: "ukil"
    ipa: "ukil"
    alt_target: ["আইনজীবী"]
    pos: "noun"
    notes: "The formal word is আইনজীবী (āinjibi)."
  - id: bn-0456
    target: "নার্স"
    native: "nurse"
    reading: "nārs"
    ipa: "nars"
    pos: "noun"
  - id: bn-0457
    target: "কর্মচারী"
    native: "employee; clerk"
    reading: "kôrmocāri"
    ipa: "kɔrmotʃari"
    pos: "noun"
  - id: bn-0458
    target: "মিস্ত্রি"
    native: "mechanic; workman"
    picture: "🧑‍🔧"
    reading: "mistri"
    ipa: "mist̪ri"
    pos: "noun"
    notes: "Anyone who builds or mends: কাঠমিস্ত্রি (kāṭhmistri) is a carpenter."
  - id: bn-0459
    target: "কৃষক"
    native: "farmer"
    picture: "🧑‍🌾"
    reading: "kriśok"
    ipa: "kriʃok"
    alt_target: ["চাষি"]
    pos: "noun"
    notes: "In everyday speech also চাষি (cāśi)."
  - id: bn-0460
    target: "রাঁধুনি"
    native: "cook"
    picture: "🧑‍🍳"
    reading: "rām̐dhuni"
    ipa: "rãd̪ʱuni"
    pos: "noun"
  - id: bn-0461
    target: "লেখক"
    native: "writer"
    reading: "lekhok"
    ipa: "lekʰok"
    pos: "noun"
    notes: "From লেখা (lekhā), to write."
  - id: bn-0462
    target: "সাংবাদিক"
    native: "journalist"
    reading: "śāṅbādik"
    ipa: "ʃaŋbad̪ik"
    pos: "noun"
    notes: "From সংবাদ (śôṅbād), news."
  - id: bn-0463
    target: "ছুটি"
    native: "day off; holiday; leave"
    reading: "chuṭi"
    ipa: "tʃʰuʈi"
    pos: "noun"
    notes: "আজ আমার ছুটি (āj āmār chuṭi), I'm off today."
  - id: bn-0464
    target: "আপনি কী করেন?"
    native: "What do you do (for a living)?"
    reading: "āpni ki kôren?"
    ipa: "apni ki kɔren"
    pos: "phrase"
    notes: "কী (ki), with the long ই (i), is 'what'."
  - id: bn-0465
    target: "আমি একজন শিক্ষক।"
    native: "I'm a teacher."
    reading: "āmi ekjon śikkhok."
    ipa: "ami ekdʒon ʃikkʰok"
    alt_target: ["আমি শিক্ষক।"]
    pos: "phrase"
    notes: "একজন (ekjon), 'one person', is optional: আমি শিক্ষক (āmi śikkhok) is just as right. There is no 'am'."
  - id: bn-0466
    target: "আপনি কোথায় কাজ করেন?"
    native: "Where do you work?"
    reading: "āpni kothāy kāj kôren?"
    ipa: "apni kot̪ʰaj kadʒ kɔren"
    pos: "phrase"
  - id: bn-0467
    target: "আমি একটা অফিসে কাজ করি।"
    native: "I work in an office."
    reading: "āmi ekṭā ôphise kāj kori."
    ipa: "ami ekʈa ɔpʰise kadʒ kori"
    pos: "phrase"
    notes: "The place takes -এ (-e): অফিসে (ôphise), in an office."
  - id: bn-0468
    target: "উনি ডাক্তার।"
    native: "He is a doctor. / She is a doctor."
    reading: "uni ḍāktār."
    ipa: "uni ɖakt̪ar"
    pos: "phrase"
    notes: "উনি (uni) is a respectful he or she for someone over there; ইনি (ini) for someone right here. No 'is'."
  - ref: bn-0376
  - id: bn-0375
    target: "পুলিশ"
    native: "police; police officer"
    picture: "👮"
    reading: "puliś"
    ipa: "puliʃ"
    pos: "noun"
  - id: bn-0470
    target: "ছাত্র"
    native: "student"
    picture: "🧑‍🎓"
    reading: "chātro"
    ipa: "tʃʰat̪ro"
    alt_target: ["ছাত্রী"]
    pos: "noun"
    notes: "A woman student is ছাত্রী (chātri)."
  - id: bn-0471
    target: "ব্যবসা"
    native: "business"
    reading: "bêbśā"
    ipa: "bæbʃa"
    pos: "noun"
  - id: bn-0472
    target: "বেতন"
    native: "salary; pay"
    reading: "beton"
    ipa: "bet̪on"
    alt_target: ["মাইনে"]
    pos: "noun"
    notes: "Also মাইনে (māine), in everyday speech."
