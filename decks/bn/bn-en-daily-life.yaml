cards:
  - id: bn-0657
    target: "ঘুম থেকে ওঠা"
    native: "to get up"
    reading: "ghum theke oṭhā"
    ipa: "ɡʱum t̪ʰeke oʈʰa"
    pos: "phrase"
    notes: "'To rise from sleep'. ওঠা (oṭhā) is to rise: আমি উঠি (āmi uṭhi), I get up."
    bases:
      - { word: "ঘুম", ref: "bn-1247" }
      - { word: "ওঠা", ref: "bn-0885" }
  - id: bn-0658
    target: "মুখ ধোয়া"
    native: "to wash one's face"
    reading: "mukh dhoyā"
    ipa: "mukʰ d̪ʱoja"
    pos: "phrase"
    notes: "ধোয়া (dhoyā), to wash: আমি মুখ ধুই (āmi mukh dhui), I wash my face."
    bases:
      - { word: "মুখ", ref: "bn-1002" }
      - { word: "ধোয়া", ref: "bn-1100" }
  - id: bn-0659
    target: "দাঁত মাজা"
    native: "to brush one's teeth"
    reading: "dām̐t mājā"
    ipa: "d̪ãt̪ madʒa"
    pos: "phrase"
    bases:
      - { word: "মাজা", base: "মাজা", reading: "mājā", meaning: "to scrub; to brush (teeth)" }
  - id: bn-0660
    target: "স্নান করা"
    native: "to bathe; to have a shower"
    reading: "snān kôrā"
    ipa: "snan kɔra"
    alt_target: ["গোসল করা"]
    pos: "phrase"
    notes: "Also গোসল করা (gośol kôrā)."
    bases:
      - { word: "স্নান", base: "স্নান", reading: "snān", meaning: "a bath; bathing" }
  - id: bn-0661
    target: "জলখাবার"
    native: "breakfast; a light meal"
    reading: "jôlkhābār"
    ipa: "dʒɔlkʰabar"
    alt_target: ["নাশ্তা", "নাশতা", "নাস্তা"]
    pos: "noun"
    notes: "Also নাশ্তা (nāśtā), also written নাস্তা (nāstā)."
  - id: bn-0662
    target: "দুপুরের খাবার"
    native: "lunch"
    reading: "dupurer khābār"
    ipa: "d̪upurer kʰabar"
    pos: "phrase"
    notes: "'Midday's food': দুপুর (dupur), midday, takes -এর (-er)."
    bases:
      - { word: "দুপুরের", ref: "bn-0645" }
  - id: bn-0663
    target: "রাতের খাবার"
    native: "dinner"
    reading: "rāter khābār"
    ipa: "rat̪er kʰabar"
    pos: "phrase"
    notes: "'Night's food'."
    bases:
      - { word: "রাতের", ref: "bn-0321" }
  - id: bn-0664
    target: "কাজে যাওয়া"
    native: "to go to work"
    reading: "kāje jāoā"
    ipa: "kadʒe dʒaoa"
    pos: "phrase"
    notes: "কাজ (kāj), work, takes -এ (-e) for 'to': কাজে (kāje)."
    bases:
      - { word: "কাজে", ref: "bn-0198" }
      - { word: "যাওয়া", ref: "bn-0873" }
  - id: bn-0665
    target: "বাড়ি ফেরা"
    native: "to come home"
    reading: "bāṛi pherā"
    ipa: "baɽi pʰera"
    alt_target: ["বাসায় ফেরা"]
    pos: "phrase"
    notes: "ফেরা (pherā) is to return. Also বাসায় ফেরা (bāśāy pherā)."
    bases:
      - { word: "ফেরা", ref: "bn-1110" }
  - id: bn-0666
    target: "রান্না করা"
    native: "to cook"
    reading: "rānnā kôrā"
    ipa: "ranna kɔra"
    pos: "phrase"
    bases:
      - { word: "রান্না", base: "রান্না", reading: "rānnā", meaning: "cooking" }
  - id: bn-0667
    target: "ঘুমোতে যাওয়া"
    native: "to go to bed"
    reading: "ghumote jāoā"
    ipa: "ɡʱumot̪e dʒaoa"
    alt_target: ["ঘুমাতে যাওয়া"]
    pos: "phrase"
    notes: "Also ঘুমাতে যাওয়া (ghumāte jāoā), the form usually written."
    bases:
      - { word: "ঘুমোতে", ref: "bn-0887" }
      - { word: "যাওয়া", ref: "bn-0873" }
  - id: bn-0668
    target: "প্রতিদিন"
    native: "every day"
    reading: "protidin"
    ipa: "prot̪id̪in"
    alt_target: ["রোজ"]
    pos: "adv"
    notes: "In speech often রোজ (roj)."
  - id: bn-0669
    target: "মাঝে মাঝে"
    native: "sometimes"
    reading: "mājhe mājhe"
    ipa: "madʒʱe madʒʱe"
    pos: "phrase"
    bases:
      - { word: "মাঝে", base: "মাঝে", reading: "mājhe", meaning: "in the middle; at times" }
  - id: bn-0670
    target: "সবসময়"
    native: "always"
    reading: "śôbśomoy"
    ipa: "ʃɔbʃomoj"
    alt_target: ["সব সময়"]
    pos: "adv"
    notes: "Also written as two words, সব সময় (śôb śômoy): 'all the time'."
  - id: bn-0671
    target: "সাধারণত"
    native: "usually"
    reading: "śādhāronoto"
    ipa: "ʃad̪ʱaronot̪o"
    pos: "adv"
  - id: bn-0672
    target: "তারপর"
    native: "then; after that"
    reading: "tārpor"
    ipa: "t̪arpor"
    pos: "adv"
    notes: "The word that strings a day together: তারপর (tārpor) … তারপর (tārpor) …"
  - id: bn-0673
    target: "আমি রোজ সাতটায় উঠি।"
    native: "I get up at seven every day."
    reading: "āmi roj śātṭāy uṭhi."
    ipa: "ami rodʒ ʃat̪ʈaj uʈʰi"
    alt_target: ["আমি প্রতিদিন সাতটায় উঠি।"]
    pos: "phrase"
    notes: "-টায় (-ṭāy) is 'at' with a time: সাতটায় (śātṭāy), at seven. কটায়? (kotay?), at what time?"
    bases:
      - { word: "আমি", ref: "bn-0833" }
      - { word: "সাতটায়", ref: "bn-0208" }
      - { word: "উঠি", ref: "bn-0885" }
  - id: bn-0674
    target: "তারপর আমি কাজে যাই।"
    native: "Then I go to work."
    reading: "tārpor āmi kāje jāi."
    ipa: "t̪arpor ami kadʒe dʒai"
    pos: "phrase"
    bases:
      - { word: "আমি", ref: "bn-0833" }
      - { word: "কাজে", ref: "bn-0198" }
      - { word: "যাই", ref: "bn-0873" }
  - id: bn-0675
    target: "আমি রাত এগারোটায় ঘুমোতে যাই।"
    native: "I go to bed at eleven at night."
    reading: "āmi rāt egāroṭāy ghumote jāi."
    ipa: "ami rat̪ eɡaroʈaj ɡʱumot̪e dʒai"
    alt_target: ["আমি রাত এগারোটায় ঘুমাতে যাই।"]
    pos: "phrase"
    notes: "The part of the day comes before the hour: রাত এগারোটায় (rāt egāroṭāy), at eleven at night; সকাল সাতটায় (śôkāl śātṭāy), at seven in the morning."
    bases:
      - { word: "আমি", ref: "bn-0833" }
      - { word: "এগারোটায়", ref: "bn-0212" }
      - { word: "ঘুমোতে", ref: "bn-0887" }
      - { word: "যাই", ref: "bn-0873" }
  - id: bn-0676
    target: "আমি কখনও দেরি করি না।"
    native: "I'm never late."
    reading: "āmi kôkhono deri kori nā."
    ipa: "ami kɔkʰono d̪eri kori na"
    alt_target: ["আমি কখনো দেরি করি না।"]
    pos: "phrase"
    notes: "'Never' is কখনও (kôkhono), also written কখনো (kôkhono), with না (nā) after the verb. দেরি (deri) is delay."
    bases:
      - { word: "আমি", ref: "bn-0833" }
      - { word: "কখনও", base: "কখনও", reading: "kôkhono", meaning: "ever; at any time" }
      - { word: "দেরি", base: "দেরি", reading: "deri", meaning: "delay; lateness" }
      - { word: "করি", ref: "bn-0102" }
