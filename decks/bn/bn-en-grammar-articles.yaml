schema: 1
id: bn-en-grammar-articles
name: "Classifiers: a and the"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Bengali has no 'a' or 'the'. -টা, -টি and -গুলো do their work, -জন counts people, and -খানা is for flat things."
tags: [beginner, grammar]
cards:
  - id: bn-0254
    target: "বইটা টেবিলের ওপর।"
    native: "The book is on the table."
    reading: "boita tebiler opor."
    pos: "phrase"
    alt_target: ["বইটা টেবিলের ওপরে আছে।"]
    notes: "Bengali has no 'the': -টা after the noun does its work. In speech the 'is' can be left out here; in full, বইটা টেবিলের ওপরে আছে."
  - id: bn-0255
    target: "একটা বই দিন।"
    native: "A book, please."
    reading: "ekta boi din."
    pos: "phrase"
    notes: "একটা, 'one' with -টা, does the work of 'a'."
  - id: bn-0256
    target: "ছেলেটা এসেছে।"
    native: "The boy has come."
    reading: "chheleta eshechhe."
    pos: "phrase"
  - id: bn-0257
    target: "একটি মেয়ে গান গাইছে।"
    native: "A girl is singing."
    reading: "ekti meye gan gaichhe."
    pos: "phrase"
    notes: "-টি is a gentler, more formal -টা, often used for people and small things."
  - id: bn-0258
    target: "বইগুলো কোথায়?"
    native: "Where are the books?"
    reading: "boigulo kothay?"
    pos: "phrase"
    notes: "-গুলো, 'the several', makes a plural."
  - id: bn-0259
    target: "দুটো চা দিন।"
    native: "Two teas, please."
    reading: "duto cha din."
    alt_target: ["দুইটা চা দিন।"]
    pos: "phrase"
    notes: "Numbers take the classifier too: দুটো, তিনটে, চারটে (duto, tinte, charte), also দুইটা, তিনটা, চারটা (duita, tinta, charta)."
  - id: bn-0557
    target: "একজন লোক"
    native: "a man; one person"
    reading: "ekjon lok"
    pos: "phrase"
    notes: "-জন counts people: একজন, দুজন, কয়েকজন. Not for things, and not usually for small children."
  - id: bn-0558
    target: "কয়েকজন বন্ধু"
    native: "a few friends"
    reading: "koyekjon bondhu"
    pos: "phrase"
  - id: bn-0559
    target: "দু কেজি আলু"
    native: "two kilos of potatoes"
    reading: "du keji alu"
    alt_target: ["দুই কেজি আলু"]
    pos: "phrase"
    notes: "With a unit (a kilo, a day, a metre) the number takes no -টা: দু কেজি, তিন দিন. দু (du) and দুই (dui) are both right here."
  - id: bn-0560
    target: "বইখানা"
    native: "the book (-খানা)"
    reading: "boikhana"
    pos: "noun"
    notes: "-খানা is used mostly for flat, thin things like a book or a letter: চিঠিখানা, the letter. -টা is always right too."
