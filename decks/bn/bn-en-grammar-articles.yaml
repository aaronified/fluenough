schema: 1
id: bn-en-grammar-articles
name: "Classifiers: a and the"
kind: vocab
language: { code: bn, iso639_3: ben, name: Bengali, script: bengali, tts: bn-IN }
native:   { code: en, iso639_3: eng, name: English }
license: CC0-1.0
description: "Bengali has no 'a' or 'the'. -টা, -টি and -গুলো do their work."
tags: [beginner, grammar]
cards:
  - id: bn-en-grammar-articles-0001
    target: "বইটা টেবিলের ওপর।"
    native: "The book is on the table."
    reading: "boita tebiler opor."
    pos: "phrase"
    notes: "Bengali has no 'the': -টা after the noun does its work. There is no 'is' either."
  - id: bn-en-grammar-articles-0002
    target: "একটা বই দিন।"
    native: "A book, please."
    reading: "ekta boi din."
    pos: "phrase"
    notes: "একটা, 'one' with -টা, does the work of 'a'."
  - id: bn-en-grammar-articles-0003
    target: "ছেলেটা এসেছে।"
    native: "The boy has come."
    reading: "chheleta eshechhe."
    pos: "phrase"
  - id: bn-en-grammar-articles-0004
    target: "একটি মেয়ে গান গাইছে।"
    native: "A girl is singing."
    reading: "ekti meye gan gaichhe."
    pos: "phrase"
    notes: "-টি is a gentler, more formal -টা, often used for people and small things."
  - id: bn-en-grammar-articles-0005
    target: "বইগুলো কোথায়?"
    native: "Where are the books?"
    reading: "boigulo kothay?"
    pos: "phrase"
    notes: "-গুলো, 'the several', makes a plural."
  - id: bn-en-grammar-articles-0006
    target: "দুটো চা দিন।"
    native: "Two teas, please."
    reading: "duto cha din."
    pos: "phrase"
    notes: "Numbers take the classifier too: একটা, দুটো, তিনটে, চারটে."
