    reading: "panthar mangsho"
    alt_target: ["খাসির মাংস"]
    pos: "phrase"
    notes: "What to ask for at the butcher. In South Asia 'mutton' almost always means goat. Also খাসির মাংস (khashir mangsho), the more common word in many places."
