  - id: bn-en-groceries-0004
    target: "টমেটো"
    native: "tomato"
    reading: "tometo"
    pos: "noun"
  - id: bn-en-groceries-0005
    target: "লঙ্কা"
    native: "chilli"
    reading: "lonka"
    pos: "noun"
    notes: "Green chillies are কাঁচা লঙ্কা (kancha lonka). In Bangladesh the word is মরিচ (morich)."
  - id: bn-en-groceries-0006
    target: "রসুন"
    native: "garlic"
    reading: "roshun"
    pos: "noun"
  - id: bn-en-groceries-0007
    target: "মাছ"
    native: "fish"
    reading: "machh"
    pos: "noun"
    notes: "Fish is at the heart of Bengali food. Ask for it by name: রুই (rui), ইলিশ (ilish), চিংড়ি (chingri, prawns)."
  - id: bn-en-groceries-0008
    target: "মাংস"
    native: "meat; mutton"
    reading: "mangsho"
    pos: "noun"
    notes: "On its own, মাংস at home usually means goat meat."
  - id: bn-en-groceries-0009
    target: "পাঁঠার মাংস"
    native: "goat meat (mutton)"
    reading: "panthar mangsho"
    pos: "phrase"
    notes: "What to ask for at the butcher. In India 'mutton' almost always means goat."
  - id: bn-en-groceries-0010
    target: "মুরগি"
    native: "chicken"
    reading: "murgi"
    pos: "noun"
    notes: "Chicken meat is মুরগির মাংস (murgir mangsho); in shops people also just say 'chicken'."
  - id: bn-en-groceries-0011
    target: "ডিম"
    native: "egg"
    reading: "dim"
    pos: "noun"
    notes: "Sold by the piece or the dozen, ডজন (dozon)."
  - id: bn-en-groceries-0012
    target: "দুধ"
    native: "milk"
    reading: "dudh"
    pos: "noun"
  - id: bn-en-groceries-0013
    target: "চাল"
    native: "rice (uncooked)"
    reading: "chal"
    pos: "noun"
    notes: "Uncooked rice is চাল; cooked rice is ভাত (bhat)."
  - id: bn-en-groceries-0014
