# The order Bengali is taught in, one unit per line, from every language
# it is taught from: each deck is named by its core id, and a learner
# from English is taught bn-en-home for bn-home (ADR-0013, ADR-0036).
#
# This is also Bengali's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"): every
# unit from the first words to B1, written or planned, with its size in
# words, its grammar topics, the three milestones, and for each planned unit
# its listening and reading passages, described in English. The existing
# units keep their places and ids; the units written for A1 are placed among
# them where their words and rules are first needed. A2 and B1 units stay
# planned until a deck is written: the course teaches them as "Coming" until
# then. Sizes follow the plan's levels (about 700, 900 and 1,200 words; low
# confidence) and are one number for every native language. A theme named
# here that decks/themes.yaml does not list yet is added to it with its
# first deck.
#
# First a few words and basic sentences, the sounds the learner's language
# lacks and how Bengali grammar differs from it; then themes, each with the
# grammar that goes with it; the script comes after the first themes, before
# the rest. The grammar follows the Indo-Aryan order of
# docs/plans/language-paths-scheme.md, less the gender agreement and the
# ergative Bengali does not have, and with the classifiers it adds: be,
# postpositions, the present, the case endings, the past, compound and
# conjunct verbs, then the relative-correlative clauses and the rest of
# B1. Every deck of Bengali is listed exactly once.
schema: 1
kind: "path"
id: "bn-path"
language: "bn"
# Where Bengali is spoken, for a rater's region and a card's region note
# (ADR-0036): its dialect groups, after Chatterji (1926) and his
# successors, each named with example districts so that a rater who does
# not know the terms can place themselves. Low confidence at each group's
# edges, and on Sylheti and Chittagonian in one group: a native reviewer
# checks this list before any rating names a region. The ids are
# permanent, as card ids are; rename a name, never an id. The app adds
# "Elsewhere" after them.
regions:
  - id: "rarhi"
    name: { "en": "Rāṛhī (west-central: Kolkata, Nadia, Bardhaman)" }
  - id: "vangiya"
    name: { "en": "Vaṅgīya (east: Dhaka, Mymensingh, Barishal)" }
  - id: "varendri"
    name: { "en": "Varendrī (north-central: Rajshahi, Malda, Dinajpur)" }
  - id: "kamrupi"
    name: { "en": "Kāmarūpī or Rangpuri (north: Rangpur, Cooch Behar, Jalpaiguri)" }
  - id: "manbhumi"
    name: { "en": "Mānbhūmī (west: Purulia, Bankura, Bengali-speaking Jharkhand)" }
  - id: "south-eastern"
    name: { "en": "South-eastern (Chittagong, Noakhali, Sylhet, Tripura, Assam's Barak Valley)" }
# The decks that need the alphabet: a learner who learns without it
# skips them.
alphabet:
  - "bn-script-vowels"
  - "bn-script-consonants"
  - "bn-script-reading"
  - "bn-script-vowel-signs"
  - "bn-script-conjuncts"
  - "bn-reading-sahaj-path-1"
  - "bn-spelling"
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
units:
