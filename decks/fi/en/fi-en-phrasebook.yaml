schema: 1
id: "fi-en-phrasebook"
kind: "layer"
core: "fi-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty survival phrases to say whole from the first lesson, before their words are taught: greetings and goodbyes, sorry, not understanding, asking the way and the price, and asking for help. Not yet checked by a Finnish speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "fi-0011":
    native: "Good morning."
    notes:
      "n1": "Said in the morning, until about noon."
    bases:
      "huomenta": "morning"
  "fi-0012":
    native: "Good night."
    notes:
      "n1": "Said at bedtime, and when leaving at night."
    bases:
      "yötä": "night"
  "fi-0013":
    native: "Goodbye."
    notes:
      "n1": "The formal goodbye. Casually, say moi or hei."
    bases:
      "Näkemiin": "goodbye"
  "fi-0014":
    native: "Sorry; excuse me."
    notes:
      "n1": "Used to get attention, to get past someone, or to apologise."
    bases:
      "Anteeksi": "sorry; excuse me"
  "fi-0015":
    native: "Excuse me, where is the toilet?"
    notes:
      "n1": "Vessa is a toilet, in everyday speech. Put another place in for vessa."
    bases:
      "Anteeksi": "sorry; excuse me"
      "missä": "where"
      "on": "is"
      "vessa": "toilet"
  "fi-0016":
    native: "I don't understand."
    notes:
      "n1": "En is the I form of the negative verb."
    bases:
      "ymmärrä": "to understand"
  "fi-0017":
    native: "I don't speak Finnish."
    notes:
      "n1": "Suomea is Finnish, the language."
    bases:
      "puhu": "to speak"
      "suomea": "Finnish (the language)"
  "fi-0018":
    native: "Do you speak English?"
    notes:
      "n1": "The -ko ending turns the verb into a question. Puhut is you speak."
    bases:
      "Puhutko": "to speak"
      "englantia": "English (the language)"
  "fi-0019":
    native: "Please speak more slowly."
    notes:
      "n1": "Ole hyvä is please, and also here you are."
    bases:
      "Puhu": "to speak (command)"
      "hitaammin": "more slowly"
      "ole": "be (command)"
  "fi-0020":
    native: "Please, sit down."
    notes:
      "n1": "Istu is the command form of istua, to sit."
    bases:
      "Ole": "be (command)"
      "istu": "to sit (command)"
  "fi-0021":
    native: "How much does this cost?"
    notes:
      "n1": "Paljonko is how much; maksaa is it costs."
    bases:
      "Paljonko": "how much"
      "tämä": "this"
      "maksaa": "to cost"
  "fi-0022":
    native: "The bill, please."
    notes:
      "n1": "Lasku is the bill, and also an invoice."
    bases:
      "Lasku": "bill; invoice"
  "fi-0023":
    native: "Help!"
    notes:
      "n1": "A cry for help. It is the partitive of apu, help."
    bases:
      "Apua": "help"
  "fi-0024":
    native: "Where is the railway station?"
    notes:
      "n1": "Asema is a station. Put another place in for rautatieasema."
    bases:
      "Missä": "where"
      "on": "is"
      "rautatieasema": "railway station"
  "fi-0025":
    native: "What does that mean?"
    notes:
      "n1": "Tarkoittaa is the verb to mean."
    bases:
      "Mitä": "what"
      "tuo": "that"
      "tarkoittaa": "to mean"
  "fi-0026":
    native: "My name is Anna."
    notes:
      "n1": "Literally: my name is Anna."
    bases:
      "Nimeni": "name"
      "on": "is"
      "Anna": "Anna (a first name)"
  "fi-0027":
    native: "Nice to meet you."
    notes:
      "n1": "Literally: nice to get to know you."
    bases:
      "Hauska": "nice; fun"
      "tutustua": "to get to know"
  "fi-0028":
    native: "Where are you from?"
    notes:
      "n1": "Kotoisin means from, as in where you come from."
    bases:
      "Mistä": "from where"
      "olet": "to be"
      "kotoisin": "from; originally from"
  "fi-0029":
    native: "Everything is fine."
    notes:
      "n1": "Hyvin here means well."
    bases:
      "Kaikki": "everything"
      "on": "is"
  "fi-0030":
    native: "Enjoy your meal!"
    notes:
      "n1": "Literally: good appetite."
    bases:
      "ruokahalua": "appetite"
