schema: 1
id: "hbs-en-phrasebook"
kind: "layer"
core: "hbs-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty survival phrases to say whole from the first lesson, before their words are taught: greetings and goodbyes, sorry, not understanding, asking the way and the price, and asking for help. Latin, with the Serbian Cyrillic beside it. Not yet checked by a Serbo-Croatian speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "hbs-0011":
    native: "Good morning."
    notes:
      "n1": "Said in the morning, until about noon."
    bases:
      "Dobro": "good"
      "jutro": "morning"
  "hbs-0012":
    native: "See you."
    notes:
      "n1": "Literally: we see each other."
    bases:
      "Vidimo": "to see (we)"
      "se": "each other"
  "hbs-0013":
    native: "Goodbye."
    notes:
      "n1": "The formal goodbye. It means until seeing again. Croatian writes it the same way."
    bases:
      "Doviđenja": "goodbye; until seeing again"
  "hbs-0014":
    native: "Excuse me; sorry."
    notes:
      "n1": "The polite form. To a friend say oprosti."
    bases:
      "Oprostite": "to forgive; excuse me (polite you)"
  "hbs-0015":
    native: "I'm sorry."
    notes:
      "n1": "Literally: it is a pity to me."
    bases:
      "Žao": "pity; sorry"
      "mi": "to me"
      "je": "is"
  "hbs-0016":
    native: "I don't understand."
    notes:
      "n1": "Croatian says ne razumijem. Both are understood."
    bases:
      "razumem": "to understand"
  "hbs-0017":
    native: "I don't speak Serbian."
    notes:
      "n1": "A Croatian speaker says hrvatski, Croatian, in its place."
    bases:
      "govorim": "to speak"
      "srpski": "Serbian"
  "hbs-0018":
    native: "Do you speak English?"
    notes:
      "n1": "The polite form, to one person or to several."
    bases:
      "Govorite": "to speak (polite you)"
      "li": "question particle"
      "engleski": "English"
  "hbs-0019":
    native: "Speak more slowly, please."
    notes:
      "n1": "Sporije is more slowly."
    bases:
      "Govorite": "to speak (polite you)"
      "sporije": "slowly"
  "hbs-0020":
    native: "Once more, please."
    notes:
      "n1": "Još jednom means once more."
    bases:
      "Još": "still; yet; more"
      "jednom": "once"
  "hbs-0021":
    native: "How much does it cost?"
    notes:
      "n1": "Koliko is how much."
    bases:
      "Koliko": "how much"
      "košta": "to cost"
  "hbs-0022":
    native: "The bill, please."
    notes:
      "n1": "Račun is the bill, and also an account."
    bases:
      "Račun": "bill; account"
  "hbs-0023":
    native: "Help!"
    notes:
      "n1": "A cry for help."
    bases:
      "Upomoć": "help"
  "hbs-0024":
    native: "Where is the station?"
    notes:
      "n1": "Gde is where in Serbian; Croatian says gdje. Put another place in for stanica."
    bases:
      "Gde": "where"
      "je": "is"
      "stanica": "station"
  "hbs-0025":
    native: "What does that mean?"
    notes:
      "n1": "Croatian says što. Znači is the verb to mean."
    bases:
      "Šta": "what"
      "to": "it; this"
      "znači": "to mean"
  "hbs-0026":
    native: "My name is Ana."
    notes:
      "n1": "Literally: I call myself Ana. Put any name after se."
    bases:
      "Zovem": "to call (I form)"
      "se": "oneself"
      "Ana": "Ana (a first name)"
  "hbs-0027":
    native: "Nice to meet you."
    notes:
      "n1": "Literally: it is a pleasure to me."
    bases:
      "Drago": "glad; pleased"
      "mi": "to me"
      "je": "is"
  "hbs-0028":
    native: "Where are you from?"
    notes:
      "n1": "Answer with iz and a place: Iz Beograda, from Belgrade."
    bases:
      "Odakle": "from where"
      "si": "are"
  "hbs-0029":
    native: "It's all right."
    notes:
      "n1": "Literally: it is in order."
    bases:
      "U": "in"
      "redu": "order"
      "je": "is"
  "hbs-0030":
    native: "Enjoy your meal!"
    notes:
      "n1": "Said to someone about to eat, or eating."
    bases:
      "Prijatno": "pleasant"
