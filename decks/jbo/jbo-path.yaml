# The order Lojban is taught in, one unit per line, from every language
# it is taught from: each deck is named by its core id, and a learner
# from English is taught jbo-en-home for jbo-home (ADR-0013, ADR-0036).
#
# This is also Lojban's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"):
# every unit from the first words to B1, with its size in words, its
# grammar topics, the three milestones, and for each planned unit its
# listening and reading passages. No Lojban deck is written yet, so every
# unit is planned: the course teaches each as "Coming" until its deck is
# written. One size for every native language.
#
# What a word is, in Lojban. The language has four kinds of word:
# - gismu, the about 1,350 root predicates (klama, citka, prenu), each
#   with a fixed place structure: klama is "x1 goes to x2 from x3 by
#   route x4 using x5";
# - cmavo, the structure words (lo, cu, mi, pu, .ui), grouped by grammar
#   into selma'o (LE, KOhA, PU, UI);
# - lujvo, compounds built from the gismu's rafsi (short combining forms):
#   bavlamdei, "tomorrow", from balvi, lamji and djedi;
# - cmevla, names, which end in a consonant and a pause (la .djan.); with
#   fu'ivla, predicates borrowed from other languages (spageti).
# A unit's words are its gismu and its cmavo, and the lujvo and fu'ivla
# that are learnt as words: a lujvo whose meaning or place structure the
# learner cannot build from its parts by the lujvo rules (bavlamdei,
# jbobau). A lujvo the learner
# builds from known gismu by those rules, with the places the rules give
# it, is practised in the rules' tables and counts no word, as Esperanto's
# affixed words do (eo-path.yaml).
#
# The sizes are honest, not the plan's. The plan's levels are about 700,
# 900 and 1,200 words (owner, 2026-10-09; low confidence). Lojban's whole
# root vocabulary is about 1,350 gismu and a few hundred common cmavo, so
# a B1 plan of about 2,800 words cannot be filled from roots. This plan
# teaches about 1,050 gismu, 430 cmavo and 650 lujvo and fu'ivla learnt as
# words, about 100 of them names and borrowings: 666, 725 and 850 words a
# level, 2,241 in all. That is inside the validator's warning bounds
# (half to one and a half times each level, 2,000-3,500 in all) only
# because established lujvo are counted as words; counting gismu and cmavo
# alone, the total would be about 1,500 and warned of. The owner is asked
# which to count (#582). These figures are estimates by judgement; no
# Lojban frequency count was fetched here (tools/wikipedia_frequency.py,
# #516: jbo.wikipedia is small).
#
# Lojban is on no FSI list, so its tier in docs/plans/language-paths-scheme.md
# is not set. Its grammar is regular and has no exceptions, but its words
# have few cognates a learner from English recognises (each gismu is a
# blend of Mandarin, English, Hindi, Spanish, Russian and Arabic), and
# its logic is unlike any natural language's. Tier II or III (x1.5) is a
# guess, for pacing only; the sizes above are bounded by the lexicon, not
# by the tier. To confirm with the owner.
#
# The order follows docs/plans/words-rules-sentences.md (owner, 2026-10-07,
# and 2026-10-17: "build the path files for all present languages via an
# opus agent, as per our current path design"):
# 1. the phrasebook, taught whole from the first lesson;
# 2. the first word units: the sounds first, then how the grammar differs
#    (a predicate and its places, in place of nouns and verbs), then five
#    themes;
# 3. no script units: Lojban is written in Latin letters, six vowels
#    (a e i o u y) and seventeen consonants (b c d f g j k l m n p r s t v
#    x z), with the apostrophe (said as h, between vowels), the period (a
#    pause, before a word that starts with a vowel and after a name) and
#    the comma (a syllable break). These are taught in the sounds unit and
#    the script guide (jbo-script.yaml), not in alphabet decks, so the path
#    has no `alphabet`. Zbalermorna, Lojban's own script in the private use
#    area (UCSUR), is a later option, not part of this plan;
# 4. a core of about 200 common words in themed units, before the large
#    tables ("Yes, smaller (~200)");
# 5. rules as forms, practised on the words already known;
# 6. sentences, each after its words and rules; then the other themes,
#    each its words, then its rules, then its sentences.
#
# Lojban's grammar has no section of its own in
# docs/plans/language-paths-scheme.md. It follows the constructed-language
# pattern of Esperanto's (2.15): the sounds and the word shapes first,
# then the system the rest is built on, then word building. Its order:
# 1. the gismu and their place structures: the bridi (selbri and sumti),
#    cu, lo ... ku, zo'e, the place tags fa fe fi fo fu, and conversion
#    with se te ve xe, each a table over every gismu known;
# 2. the cmavo by selma'o, as each is needed: COI and DOI (addressing),
#    KOhA (pronouns), PA (numbers), LE and LA (descriptions and names), NA
#    (negation), PU (the first tense), FAhA and VA (space), NOI (relative
#    clauses), BAI (modal tags);
# 3. lujvo building, as rules over the gismu known, from their rafsi:
#    the rafsi of each gismu, the joining rules and hyphen letters, then
#    the places a lujvo takes;
# 4. the logical connectives: A (.e .a .o .u) between sumti, JA (je ja jo
#    ju) in tanru, GIhA between bridi tails, .ije between sentences, then
#    forethought (ge ... gi) and the non-logical JOI;
# 5. tense in full: ZI and VA, ZEhA, ROI, the ZAhO event contours, and
#    intervals;
# 6. the attitudinals: UI indicators, their scale (nai, cu'i, sai, ru'e),
#    then evidentials and discursives;
# 7. the abstractions: nu and du'u at A2, ka, ni and si'o at B1, then the
#    rest of NU.
# Grammar topic ids are ASCII and write the apostrophe as h, as Lojban's
# own URLs and file names do: zohe for zo'e, gihe for gi'e. Topic names
# are not shown to learners.
#
# Lojban has no grammatical gender, so `genders` is empty. nakni (male)
# and fetsi (female) are gismu like any other, and a lujvo such as
# nakybe'e is built by rule, not by a gender class.
#
# Lojban has no regional dialects: one baseline, set by The Complete
# Lojban Language (1997) and the baselined gismu and cmavo lists, spoken
# by a small community spread over many countries and met mostly online.
# What differs between speakers is the accent of their first language
# and, more, which proposals beyond the baseline (xorlo, now in use, and
# the experimental cmavo) they accept: a matter of usage, not of region.
# A region question ("Where you speak Lojban") would not group raters by
# anything their answers share, as in Esperanto's path (PR #598). The
# path lists no `regions` (the validator refuses an empty list), and the
# app asks no region question. To confirm with the owner (#582).
#
# The core's order is by judgement, most common first: about me, everyday
# predicates, time and frequency words, how much and how many, describing
# words, where things are, more predicates. It was meant to come from
# Wikipedia's counts (tools/wikipedia_frequency.py, #516); no Lojban dump
# was fetched here (2026-10-18): order the core again from the counts, or
# from a corpus count of the community's texts, once one is written.
#
# A planned unit holds one core id. Where a written unit will hold more
# than one deck, the others are named in a comment over the unit they
# join; a theme's sentence deck, jbo-<theme>-sentences, joins its theme's
# unit once written.
#
# Every deck of Lojban is listed exactly once.
schema: 1
kind: "path"
id: "jbo-path"
language: "jbo"
# The gender classes a noun's gender is one of (#512; DECK-FORMAT.md, Card
# data): none, since Lojban has no grammatical gender.
genders: []
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
units:
  # 1. The phrasebook, taught whole from the first lesson: coi, co'o,
  # ki'e, je'e, .e'o, .u'u, mi'e, do mo, mi na jimpe.
  # jbo-first-words joins it when written.
  # The first words are written: jbo-first-words is taught with the
  # phrasebook (10 words).
  - decks: ["jbo-phrasebook", "jbo-first-words", "*"]
    words: 10
  # 2. The first word units. The sounds first: c said as in "ship", j as
  # in "measure", x as in Scottish "loch", the apostrophe said h and only
  # between vowels, y the neutral vowel of "sofa", the tapped or trilled
  # r, the diphthongs ai ei oi au, and the stress always on the next-to-
  # last syllable, a y syllable not counted. Then the pause: the period
  # before every word that starts with a vowel (.i, .ui) and after every
  # name (la .djan.), and the comma inside a word. Every word is read as
  # written.
  - planned: { id: "jbo-sound-differences", grammar: ["sound-differences", "penultimate-stress", "pauses"], words: 12 }
    listening_passages:
      - { id: "sounds-alike", text: { "en": "Pairs said one after the other: cinta and sinta, ja'i and jai, xu and ku, .ui and .u'i" } }
    reading_passages:
      - { id: "letters-and-pauses", text: { "en": "A short list of everyday words with the apostrophe, the period and y, each said the way it is written" } }
  # How the grammar differs from English's: no nouns and no verbs, but
  # predicates with numbered places; a sentence is a bridi, its selbri and
  # its sumti; tense is optional; the order x1 cu selbri x2 x3.
  - planned: { id: "jbo-grammar-differences", grammar: ["bridi", "place-structure"] }
    listening_passages:
      - { id: "mi-klama", text: { "en": "A teacher fills the places of klama one at a time: mi klama, mi klama lo zarci, mi klama lo zarci lo zdani" } }
    reading_passages:
      - { id: "place-chart", text: { "en": "A chart of klama's five places, x1 to x5, with a word in each" } }
  # xu, ma, mo, xo and the answers go'i and na go'i.
  - planned: { id: "jbo-questions", theme: "questions", words: 12 }
    listening_passages:
      - { id: "asking-around", text: { "en": "Asking who, what and how many with ma, mo and xo, and answering go'i" } }
    reading_passages:
      - { id: "question-card", text: { "en": "A card of short questions a newcomer asks, each with its answer" } }
  # COI and DOI, the vocatives: coi, co'o, doi, fi'i, re'i, mu'o, be'e,
  # ju'i, je'e, ki'e, ta'a, nu'e; and the names that follow la and doi.
  - planned: { id: "jbo-addressing", theme: "addressing", words: 15 }
    listening_passages:
      - { id: "meeting-a-speaker", text: { "en": "Greeting a new speaker, giving your name with mi'e and asking theirs" } }
    reading_passages:
      - { id: "name-badges", text: { "en": "Name badges at a meeting, each a name in Lojban spelling with its pauses" } }
  # KOhA: mi, do, mi'o, mi'a, ma'a, do'o, ti, ta, tu, ko'a to ko'u, ri, ra,
  # ru; and prenu, nanmu, ninmu, verba, nakni, fetsi.
  - planned: { id: "jbo-pronouns", theme: "pronouns", words: 25 }
    listening_passages:
      - { id: "who-is-who", text: { "en": "Pointing out who is who at a family gathering: ti, ta and tu, mi and do" } }
    reading_passages:
      - { id: "seating-chart", text: { "en": "A seating chart for a party, with names and who sits where" } }
  # The family's gismu: mamta, patfu, bersa, tixnu, bruna, mensi, tamne,
  # rirni, speni, famti, dzena. Their lujvo (e.g. for grandparents) are
  # built in A2's lujvo rules and counted there as forms.
  - planned: { id: "jbo-family", theme: "family", words: 25 }
    listening_passages:
      - { id: "my-family", text: { "en": "Someone describes the people in a family photo, each with its place: x1 is the mother of x2" } }
    reading_passages:
      - { id: "family-tree", text: { "en": "A small family tree with names and relations" } }
  # PA: no, pa, re, ci, vo, mu, xa, ze, bi, so; bigger numbers are digit
  # strings (pano is ten, pare twelve, reno twenty).
  - planned: { id: "jbo-numbers-1-20", theme: "numbers-1-20", words: 12 }
    listening_passages:
      - { id: "counting-aloud", text: { "en": "Counting objects aloud, from one to twenty, digit by digit" } }
    reading_passages:
      - { id: "room-numbers", text: { "en": "Room numbers on a row of doors, written as digits and as Lojban words" } }
  # 3. No script units: Lojban is written in Latin letters.
  # 4. The core: about 200 common words, most common first (by judgement
  # until a count is written, #516).
  - planned: { id: "jbo-about-me", theme: "about-me", words: 25 }
    listening_passages:
      - { id: "introducing-yourself", text: { "en": "Introducing yourself to a new member of a Lojban chat: name, home, languages" } }
    reading_passages:
      - { id: "registration-form", text: { "en": "A simple registration form: cmene, xabju, bangu" } }
  # The commonest gismu, each with its places: klama, citka, pinxe,
  # viska, tirna, tavla, cusku, djuno, jimpe, djica, nelci, gasnu, zbasu,
  # dunda, lebna, ponse, sipna, tadni, ctuca, gunka.
  - planned: { id: "jbo-everyday-verbs", theme: "everyday-verbs", words: 45 }
    listening_passages:
      - { id: "morning-routine", text: { "en": "A mother says what each person in the house does in the morning" } }
    reading_passages:
      - { id: "fridge-note", text: { "en": "A note on the fridge: what to eat, what to drink and where things are" } }
  # Lojban has no adverbs as a word class. This unit's words are the
  # cmavo English says with adverbs: the tenses pu, ca, ba, the distances
  # zi, za, zu, the frequencies roi, reroi, so'iroi, and ji'a, ku'i, za'u.
  # Their grammar comes in A1 and A2's tense rules.
  - planned: { id: "jbo-adverbs", theme: "adverbs", words: 25 }
    listening_passages:
      - { id: "how-often", text: { "en": "Saying when and how often things are done: pu, ca, ba, roi" } }
    reading_passages:
      - { id: "habit-survey", text: { "en": "A short survey about everyday habits" } }
  # The quantifiers of PA: ro, su'o, so'i, so'u, so'a, piro, pisu'o, du'e,
  # mo'a, rau; and klani, mutce, cmalu.
  - planned: { id: "jbo-quantities", theme: "quantities", words: 25 }
    listening_passages:
      - { id: "at-the-grocers", text: { "en": "Asking how much and how many at a grocer's" } }
    reading_passages:
      - { id: "recipe-amounts", text: { "en": "A recipe card with amounts" } }
  # Property gismu: barda, cmalu, melbi, xamgu, xlali, glare, lenku,
  # clani, tordu, sutra, masno, nandu, frili, cnino, slabu, gleki, badri.
  - planned: { id: "jbo-describing", theme: "describing", words: 45 }
    listening_passages:
      - { id: "how-are-you-feeling", text: { "en": "A friend asks how you feel today, and you answer" } }
    reading_passages:
      - { id: "postcard-from-the-coast", text: { "en": "A short postcard: the weather and the food" } }
  # FAhA and VA: zu'a, ri'u, ga'u, ni'a, ne'a, ne'i, be'a, ca'u, ti'a, vi,
  # va, vu; and nenri, sruri, crane, trixe.
  - planned: { id: "jbo-location", theme: "location", words: 25 }
    listening_passages:
      - { id: "where-are-my-keys", text: { "en": "Looking for keys: here, there, in, on, under, beside" } }
    reading_passages:
      - { id: "room-description", text: { "en": "A short description of a room and where its furniture is" } }
  - planned: { id: "jbo-more-verbs", theme: "more-verbs", words: 35 }
    listening_passages:
      - { id: "after-work", text: { "en": "Two friends say what they do after work" } }
    reading_passages:
      - { id: "weekly-plan", text: { "en": "A weekly plan for a household: who goes where and does what" } }
  # 5. Rules as forms, practised on the words known. First the word shapes:
  # a brivla (CVCCV or CCVCV, a gismu) from a cmavo (CV, CVV) from a cmevla
  # (ending in a consonant), the way a reader tells a word's class from its
  # letters.
  - planned: { id: "jbo-grammar-word-shapes", grammar: ["brivla-shape", "cmavo-shape", "cmevla-shape"] }
    listening_passages:
      - { id: "which-kind-of-word", text: { "en": "A teacher reads words aloud and the class says gismu, cmavo or name" } }
    reading_passages:
      - { id: "word-shape-chart", text: { "en": "A chart of known words sorted by their shape: CVCCV, CCVCV, CV, CVV, and names" } }
  # The bridi in full: lo ... ku over every gismu known, cu, and zo'e for
  # a place left empty.
  - planned: { id: "jbo-grammar-descriptions", grammar: ["lo-ku", "cu", "zohe"] }
    listening_passages:
      - { id: "the-goer", text: { "en": "Turning predicates into things: lo klama, the goer; lo zarci, the market; lo se citka, the food" } }
    reading_passages:
      - { id: "label-cards", text: { "en": "Labels on things in a room, each lo and a known gismu" } }
  # The place tags FA, over every gismu known: fa, fe, fi, fo, fu, to fill
  # places out of order.
  - planned: { id: "jbo-grammar-place-tags", grammar: ["fa-fe-fi-fo-fu"] }
    listening_passages:
      - { id: "out-of-order", text: { "en": "The same sentence of klama said in three orders with fa, fe and fi, all meaning the same" } }
    reading_passages:
      - { id: "place-tag-notes", text: { "en": "Short notes that fill only the third or fourth place of a known gismu" } }
  # SE conversion, a table over every gismu known: se, te, ve and xe swap
  # the first place with the second to fifth (se dunda, a gift; te dunda,
  # a receiver). A form is null where the gismu has no such place.
  - planned: { id: "jbo-grammar-conversion", grammar: ["se", "te", "ve", "xe"] }
    listening_passages:
      - { id: "giver-and-gift", text: { "en": "A child names lo dunda, lo se dunda and lo te dunda at a birthday" } }
    reading_passages:
      - { id: "conversion-chart", text: { "en": "A chart of known gismu with their se, te, ve and xe forms, and what each names" } }
  # NA and the first questions: na, na'e, xu, and the answers go'i, na
  # go'i, je'e.
  - planned: { id: "jbo-grammar-negation-questions", grammar: ["na", "nahe", "xu-gohi"] }
    listening_passages:
      - { id: "yes-or-no", text: { "en": "Asking xu questions and answering go'i and na go'i" } }
    reading_passages:
      - { id: "quiz-card", text: { "en": "A short yes-or-no quiz on a café table" } }
  # The first tense, PU, optional in Lojban: pu, ca, ba.
  - planned: { id: "jbo-grammar-tense-pu-ca-ba", grammar: ["pu", "ca", "ba"] }
    listening_passages:
      - { id: "before-now-after", text: { "en": "Saying what you did, do and will do, and that the same bridi without a tense can mean any" } }
    reading_passages:
      - { id: "status-messages", text: { "en": "Short status messages: who is where, doing what, and when" } }
  # 6. Then the other A1 themes, each its words, its rules, then its
  # sentences.
  - planned: { id: "jbo-work", theme: "work", words: 30 }
    listening_passages:
      - { id: "what-do-you-do", text: { "en": "Two people ask each other what they do for a living" } }
    reading_passages:
      - { id: "business-card", text: { "en": "A business card and a short job description" } }
  # Few new cmavo (ki'o, pi, ni'u, ma'u); the rest is digit strings.
  - planned: { id: "jbo-numbers-big", theme: "numbers-big", words: 10 }
    listening_passages:
      - { id: "big-numbers", text: { "en": "Hearing prices, years and phone numbers digit by digit" } }
    reading_passages:
      - { id: "price-tags", text: { "en": "Price tags and a bus-route number board" } }
  # A number on a sumti (re lo prenu), ordinals with moi and the count of
  # a set with mei.
  - planned: { id: "jbo-grammar-numbers", grammar: ["quantified-sumti", "moi-ordinals"] }
    listening_passages:
      - { id: "first-second-third", text: { "en": "A race is announced: who came pamoi, remoi and cimoi" } }
    reading_passages:
      - { id: "floor-guide", text: { "en": "A floor guide in a building: the first floor, the second floor" } }
  - planned: { id: "jbo-market", theme: "market", words: 30 }
    listening_passages:
      - { id: "at-the-market", text: { "en": "Buying fruit and vegetables at a market stall: lo vecnu, lo te vecnu, lo jdima" } }
    reading_passages:
      - { id: "market-price-board", text: { "en": "A price board at a market" } }
  - planned: { id: "jbo-groceries", theme: "groceries", words: 30 }
    listening_passages:
      - { id: "shopping-list-aloud", text: { "en": "Two people go through a shopping list" } }
    reading_passages:
      - { id: "shopping-list", text: { "en": "A handwritten shopping list" } }
  # The food gismu (cidja, rectu, nanba, ladru, djacu, tcati, ckafi,
  # grute, plise, badna) and the fu'ivla for foods no gismu names.
  - planned: { id: "jbo-food", theme: "food", words: 40 }
    listening_passages:
      - { id: "ordering-a-meal", text: { "en": "Choosing dishes from a menu" } }
    reading_passages:
      - { id: "menu-card", text: { "en": "A restaurant menu card with dishes and prices" } }
  # LE and LA: la before a name, la with a gismu as a name (la cribe),
  # and le, the described, against lo.
  - planned: { id: "jbo-grammar-names", grammar: ["la-names", "le-lo"] }
    listening_passages:
      - { id: "a-dog-called-bear", text: { "en": "A child introduces a dog named la cribe, and says lo cribe means any bear" } }
    reading_passages:
      - { id: "guest-list", text: { "en": "A guest list of names in Lojban spelling, each after la" } }
  - planned: { id: "jbo-transport", theme: "transport", words: 25 }
    listening_passages:
      - { id: "bus-stop", text: { "en": "Asking which bus goes to the centre: the fifth place of klama" } }
    reading_passages:
      - { id: "timetable", text: { "en": "A bus and tram timetable" } }
  - planned: { id: "jbo-directions", theme: "directions", words: 20 }
    listening_passages:
      - { id: "asking-the-way", text: { "en": "Asking the way to the station and being told" } }
    reading_passages:
      - { id: "simple-map", text: { "en": "A simple map with a route in words" } }
  # FAhA and VA as spatial tenses on a bridi: ne'i, zu'a, ri'u, vi, va, vu.
  - planned: { id: "jbo-grammar-space-tense", grammar: ["faha", "vi-va-vu"] }
    listening_passages:
      - { id: "where-it-is", text: { "en": "Saying where things happen: vi, va, vu, ne'i, zu'a" } }
    reading_passages:
      - { id: "museum-plan", text: { "en": "A museum plan: what is beside, above and behind what" } }
  - planned: { id: "jbo-body", theme: "body", words: 35 }
    listening_passages:
      - { id: "at-the-doctors", text: { "en": "Telling a doctor where it hurts" } }
    reading_passages:
      - { id: "stretching-chart", text: { "en": "A chart of simple morning stretches" } }
  - planned: { id: "jbo-places", theme: "places", words: 35 }
    listening_passages:
      - { id: "walk-to-the-market", text: { "en": "A neighbour names the places you pass on the way to the market" } }
    reading_passages:
      - { id: "street-signs", text: { "en": "Signs along a street: pharmacy, school, bank, post office" } }
  # The first tanru: two predicates, the first modifying the second
  # (melbi zdani, a beautiful house). Grouping with bo and ke comes in A2.
