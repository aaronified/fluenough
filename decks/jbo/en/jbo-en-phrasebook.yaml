schema: 1
id: jbo-en-phrasebook
kind: layer
core: jbo-phrasebook
native:
  code: en
  iso639_3: eng
  name: English
name: 'Phrasebook: first phrases'
description: 'Twenty phrases to say whole from the first day: greetings and goodbye, thanks and sorry, please, saying you are still learning Lojban, and asking someone to stop. Not yet checked by a Lojban speaker: please report any mistake.'
license: CC-BY-SA-4.0
tags:
- unreviewed
cards:
  jbo-0011:
    native: hello
    notes:
      n1: Said to greet someone.
    bases:
      coi: hello
  jbo-0012:
    native: goodbye
    notes:
      n1: Said when leaving, or when ending a talk.
    bases:
      co'o: goodbye
  jbo-0013:
    native: thank you; thanks
    notes:
      n1: Common and polite. Among close friends, thanks is often left out.
    bases:
      ki'e: thank you
  jbo-0014:
    native: sorry; I regret it
    notes:
      n1: Said to apologise, or to show regret.
    bases:
      u'u: sorry; regret
  jbo-0015:
    native: please
    notes:
      n1: Said before a request or an order.
    bases:
      e'o: please
  jbo-0016:
    native: yes; I agree
    notes:
      n1: Says that you agree or understand. go'i says that what was said is so.
    bases:
      je'e: yes; I agree
  jbo-0017:
    native: My name is Alice.
    notes:
      n1: 'mi''e comes before your name, which is said with a pause before and after: mi''e .alis., my name is Alice.'
    bases:
      mi'e: my name is (introduces a name)
      alis: Alice (a name)
  jbo-0018:
    native: What are you? (what kind of thing are you?)
    notes:
      n1: mo asks what a thing is. Used as a question, do mo asks what you are, as a kind of thing.
    bases:
      mo: what?
  jbo-0019:
    native: I don't understand.
    notes:
      n1: 'na goes before the word it negates: na jimpe, does not understand. jimpe is ''understands''.'
    bases:
      na: not
      jimpe: to understand
  jbo-0020:
    native: I don't know.
    notes:
      n1: 'The same na as in mi na jimpe: it comes before the word it negates.'
    bases:
      na: not
      djuno: to know
  jbo-0021:
    native: happy; glad
    notes:
      n1: 'An attitude word: it shows that you are happy or glad.'
    bases:
      ui: happy; glad
  jbo-0022:
    native: Come to me!
    notes:
      n1: 'ko makes a command to ''you''. The second place of klama is the destination: do.'
    bases:
      ko: you (in a command)
  jbo-0023:
    native: Are you good?
    notes:
      n1: xu comes first and makes a question that is answered yes or no.
    bases:
      xu: a question marker
  jbo-0024:
    native: I like you.
    notes:
      n1: 'nelci is ''x1 likes x2'': the one who likes comes first.'
    bases:
      nelci: likes
  jbo-0025:
    native: I drink water.
    notes:
      n1: pinxe is 'x1 drinks x2'. The thing drunk comes after it.
    bases:
      pinxe: to drink
  jbo-0026:
    native: I am coming to you.
    notes:
      n1: The destination comes after klama, as do is here.
  jbo-0027:
    native: I will go.
    notes:
      n1: 'ba before the verb marks the future: later.'
    bases:
      ba: later; in the future
  jbo-0028:
    native: I went.
    notes:
      n1: 'pu before the verb marks the past: earlier.'
    bases:
      pu: earlier; in the past
  jbo-0029:
    native: I am talking to you.
    notes:
      n1: tavla is 'x1 talks to x2 about x3'. The one spoken to comes after it.
    bases:
      tavla: talks to
  jbo-0030:
    native: Stop!
    notes:
      n1: A command. sisti is 'stops'.
    bases:
      ko: you (in a command)
      sisti: to stop
