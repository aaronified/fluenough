native:
  code: en
  iso639_3: eng
  name: English
name: 'Phrasebook: first phrases'
description: 'Twenty phrases to say whole from the first day: greetings and goodbye, thanks and sorry, asking for help, asking where the toilet is, and saying you are still learning Punjabi. Eastern Punjabi in Gurmukhi. Not yet checked by a Punjabi speaker: please report any mistake.'
