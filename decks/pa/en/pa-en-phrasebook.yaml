tags:
- unreviewed
cards:
  pa-0011:
    native: hello (a Sikh greeting)
    notes:
      n1: The common greeting of Sikhs, and heard across Punjabi speakers. ਨਮਸਤੇ (namaste) is also said.
    bases:
      ਸਤਿ: truth
      ਸ੍ਰੀ: sir; revered
      ਅਕਾਲ: timeless
  pa-0012:
    native: goodbye (see you again)
    notes:
      n1: Literally 'we will meet again'.
    bases:
      ਫਿਰ: again
      ਮਿਲਾਂਗੇ: to meet
  pa-0013:
    native: thank you; thanks
    notes:
      n1: Common and polite. Among close friends, thanks is often left out.
    bases:
      ਧੰਨਵਾਦ: thanks
  pa-0014:
    native: excuse me; sorry
    notes:
      n1: Literally 'to forgive'. Said to get past someone, or to apologise.
    bases:
      ਮਾਫ਼: forgiveness
      ਕਰਨਾ: to do
  pa-0015:
    native: I didn't understand.
    notes:
      n1: ਸਮਝ ਆਉਣਾ (samajh āuṇā) is 'to understand', literally 'understanding comes'. ਮੈਨੂੰ (mainūṁ) is 'to me'.
    bases:
      ਸਮਝ: understanding
      ਆਈ: to come
  pa-0016:
    native: Please speak slowly.
    notes:
      n1: ਕਿਰਪਾ ਕਰਕੇ (kirpā karke) is 'please'. ਬੋਲੋ (bolo) is 'speak', said politely.
    bases:
      ਕਿਰਪਾ: kindness
      ਕਰਕੇ: to do
      ਹੌਲੀ: slowly
      ਬੋਲੋ: to speak
  pa-0017:
    native: please
    notes:
      n1: Said before a request, as a polite word.
    bases:
      ਕਿਰਪਾ: kindness
      ਕਰਕੇ: to do
  pa-0018:
    native: Help!
    notes:
      n1: Said when you need help. Say it loudly to attract attention.
    bases:
      ਮਦਦ: help
      ਕਰੋ: to do
  pa-0019:
    native: Where is the toilet?
    notes:
      n1: Literally 'toilet, where is it?'. ਕਿੱਥੇ (kithe) means 'where'.
    bases:
      ਬਾਥਰੂਮ: toilet
      ਕਿੱਥੇ: where
      ਹੈ: to be
  pa-0020:
    native: How much is this?
    notes:
      n1: Literally 'this, of how much is it?'. ਕਿੰਨੇ (kinne) asks for an amount or a price.
    bases:
      ਇਹ: this
      ਕਿੰਨੇ: how much
      ਦਾ: of
      ਹੈ: to be
  pa-0021:
    native: I don't know Punjabi.
    notes:
      n1: 'ਆਉਣਾ (āuṇā) is ''to come''. With a language, it means ''to know'': ਆਉਂਦੀ (āuṁdī) is ''it comes''.'
    bases:
      ਪੰਜਾਬੀ: Punjabi
      ਆਉਂਦੀ: to come; to know (a language)
  pa-0022:
    native: I know a little Punjabi.
    notes:
      n1: ਥੋੜ੍ਹੀ (thoṛī) is 'a little'.
    bases:
      ਥੋੜ੍ਹੀ: a little
      ਪੰਜਾਬੀ: Punjabi
      ਆਉਂਦੀ: to come; to know (a language)
      ਹੈ: to be
  pa-0023:
    native: OK; all right
    notes:
      n1: Also 'right' or 'correct'. Said to agree, or to close a topic.
    bases:
      ਠੀਕ: right; OK
      ਹੈ: to be
  pa-0024:
    native: one moment
    notes:
      n1: Literally 'one minute'. Used to ask someone to wait.
    bases:
      ਮਿੰਟ: minute
  pa-0025:
    native: no problem; it's all right
    notes:
      n1: Said to someone who apologises, or to refuse something politely. Literally 'no matter'.
    bases:
      ਕੋਈ: any
      ਗੱਲ: matter
  pa-0026:
    native: One tea, please.
    notes:
      n1: ਚਾਹ (cāh) is tea. Say it when you order.
    bases:
      ਚਾਹ: tea
      ਕਿਰਪਾ: kindness
      ਕਰਕੇ: to do
  pa-0027:
    native: Say it once more.
    notes:
      n1: Said when you did not catch what was said. ਵਾਰ (vār) is 'time'.
    bases:
      ਵਾਰ: time
      ਫਿਰ: again
      ਦੱਸੋ: to tell; to say
  pa-0028:
    native: Thanks for the help.
    notes:
      n1: Literally 'thanks for help'. ਲਈ (laī) is 'for'.
    bases:
      ਮਦਦ: help
      ਲਈ: for
      ਧੰਨਵਾਦ: thanks
  pa-0029:
    native: OK, thanks.
    notes:
      n1: A quick way to say that something is fine and to thank someone.
    bases:
      ਠੀਕ: right; OK
      ਹੈ: to be
      ਧੰਨਵਾਦ: thanks
  pa-0030:
    native: Let's go!
    notes:
      n1: ਚੱਲੀਏ (callīe) is 'let's go', from ਚੱਲਣਾ (callṇā), to go.
    bases:
      ਚੱਲੀਏ: to go
