# The order Punjabi is taught in, one unit per line, from every language it
# is taught from: each deck is named by its core id, and a learner from
# English is taught pa-en-home for pa-home (ADR-0013, ADR-0036).
#
# This is Punjabi's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"; issue
# #351), written before any Punjabi deck: every unit from the first words to
# B1 is planned, with its size in words, its grammar topics, the three
# milestones and its listening and reading passages. The course teaches
# every unit as "Coming" until its first deck is written; the unit's
# `planned` then turns into `decks` in the same change. Sizes follow the
# plan's levels (about 700, 900 and 1,200 words; low confidence) and are one
# number for every native language. Punjabi is tier IV (1,100 hours, not
# confirmed on the FSI list: docs/plans/language-paths-scheme.md); the tier
# sets the pacing, in days, not the words a level needs, so the sizes are
# close to Hindi's. A theme named here that decks/themes.yaml does not list
# yet is added to it with its first deck.
#
# What is taught: Eastern Punjabi, as spoken and written in Indian Punjab,
# in Gurmukhi, with the Majhi-based standard of print, radio and school.
# Western Punjabi and Shahmukhi, the Perso-Arabic script of Pakistan's
# Punjab, are an open question: the owner's answer on variants
# (docs/plans/language-paths.md: "The learner chooses", each variant a set
# of decks of its own) would make them a second set of decks with a path of
# its own, not units of this one.
#
# A planned unit names one core id. Where a unit will hold more than one
# deck, as Hindi's do, the comment above it names the others: they join the
# unit when they are written. Sentence decks have no theme, so they are not
# planned units of their own: each joins the unit named in its comment,
# after its words and rules.
#
# The order follows docs/plans/words-rules-sentences.md (owner, 2026-10-07,
# and 2026-10-17: "build the path files for all present languages via an
# opus agent, as per our current path design"), Hindi's path as the closest
# model, and the Indo-Aryan order of docs/plans/language-paths-scheme.md
# (aspirated and retroflex sounds, script, greetings, numbers, pronouns, be,
# SOV, postpositions, the present habitual, gender agreement, the oblique,
# the past, the ergative, compound and conjunct verbs, the subjunctive, the
# relative-correlative clauses), with its Punjabi adjustment, "Add tones in
# sounds step":
# 1. the phrasebook, taught whole from the first lesson;
# 2. the first word units, with the sounds and the tones;
# 3. the script, after the first six units ("After units 4-6"); a learner
#    who already reads it skips it (#554);
# 4. a core of about 200 common words in themed units ("Yes, smaller
#    (~200)"), by judgement, most common first, until Punjabi Wikipedia's
#    counts are written (tools/wikipedia_frequency.py, #516);
# 5. rules as forms: noun forms (the plural and the oblique), the
#    postpositions, then pronoun and verb forms, practised on known words;
# 6. sentences, each after its words and rules; then the other themes, each
#    its words, its rules, then its sentences.
#
# What is Punjabi's own, against Hindi's model:
# - Lexical tone. Punjabi lost the voiced aspirates' breath and kept it as
#   a tone: a low tone where ਘ (gh), ਝ (jh), ਢ (ḍh), ਧ (dh) or ਭ (bh)
#   starts a stressed syllable, said as k, c, ṭ, t or p; a high tone where
#   one, or ਹ (h), follows the stressed vowel; a level tone elsewhere. So
#   ਕੋੜਾ (koṛā, "whip") is level and ਘੋੜਾ (ghoṛā, "horse") is low, and
#   ਚਾਹ (cāh, "tea") is high. The tones get a sounds unit of their own,
#   pa-tones, after the other sound differences.
# - Doubled consonants change a word: ਪਤਾ (patā, "address") and ਪੱਤਾ
#   (pattā, "leaf"). They are drilled in the sounds unit and written with
#   the addak (ੱ) in the script.
# - The script: Gurmukhi's 35 letters (ਪੈਂਤੀ (paintī)), its vowel signs,
#   the nasal signs tippi (ੰ) and bindi (ਂ), the addak (ੱ), the three
#   subjoined letters (pairin ਹ, ਰ and ਵ: ਪੜ੍ਹ (paṛh), ਪ੍ਰੀਤ (prīt)), the
#   nukta letters ਸ਼ (ś), ਖ਼ (k͟h), ਗ਼ (ġ), ਜ਼ (z), ਫ਼ (f) and ਲ਼ (ḷ), and
#   how the spelling marks the tone. Gurmukhi has few conjuncts, so the
#   third script unit teaches the subjoined letters, the nukta and the tone
#   spelling instead.
# - The postpositions ਨੂੰ (nū̃), ਵਿੱਚ (vicc), ਤੋਂ (tõ), ਨਾਲ (nāl), ਉੱਤੇ
#   (utte) and ਕੋਲ (kol); the genitive ਦਾ (dā), which agrees as ਦੇ (de), ਦੀ
#   (dī) and ਦੀਆਂ (dīā̃); and the old case endings kept on some nouns,
#   ਘਰੋਂ (gharõ, "from home") and ਘਰੇ (ghare, "at home").
# - The ergative ਨੇ (ne) in the past of a transitive verb, but not after ਮੈਂ
#   (maĩ), ਤੂੰ (tū̃), ਅਸੀਂ (asī̃) or ਤੁਸੀਂ (tusī̃): ਮੈਂ ਰੋਟੀ ਖਾਧੀ (maĩ
#   roṭī khādhī, "I ate the bread") against ਉਸ ਨੇ ਰੋਟੀ ਖਾਧੀ (us ne roṭī
#   khādhī).
# - Gender agreement reaches the future too: ਜਾਵਾਂਗਾ (jāvā̃gā) and
#   ਜਾਵਾਂਗੀ (jāvā̃gī), "I will go", said by a man and by a woman.
# - Obligation with the subject as it is: ਮੈਂ ਜਾਣਾ ਹੈ (maĩ jāṇā hai, "I
#   have to go"), where Hindi says मुझे जाना है (mujhe jānā hai).
# - Numbers 1-100 are irregular (the scheme, for Hindi), so they are learnt
#   as words: 20 in pa-numbers-1-20, the rest in pa-numbers-big.
#
# No Punjabi deck is written yet, so the path lists no deck and `alphabet`
# is empty: the validator takes only written decks there. When the script
# decks are written, `alphabet` lists pa-script-vowels,
# pa-script-consonants, pa-script-reading, pa-script-vowel-signs,
# pa-script-subjoined, pa-spelling and the first reader, and the three
# script units become lists of them, as Hindi's are. Until then each script
# unit is planned with grammar topics, since a planned unit names a theme or
# a grammar topic. Spelling and the first reader come after B1, as Hindi's
# do; they are added to the path when written, since nothing is planned
# after B1.
schema: 1
kind: "path"
id: "pa-path"
language: "pa"
# The gender classes a noun's gender is one of (#512; DECK-FORMAT.md, Card
# data): Punjabi's two, masculine and feminine, as Hindi's. Every noun has
# one, and adjectives, verbs and the genitive ਦਾ (dā) agree with it.
genders: ["m", "f"]
# Where Punjabi is spoken, for a rater's region and a card's region note
# (ADR-0036): the four dialect areas of Indian Punjab that Eastern Punjabi
# is usually grouped into. Majha's speech is the base of the standard.
# Pakistan's Western Punjabi (Lahnda, with Pothohari, Saraiki and Hindko)
# is not a region here: it would come with its own set of decks, if the
# owner chooses it, and a speaker from there or from the diaspora answers
# "Elsewhere", which the app adds. The ids are permanent, as card ids are;
# rename a name, never an id.
regions:
  - id: "majhi"
    name: { "en": "Majha (Amritsar, Gurdaspur, Tarn Taran)" }
  - id: "doabi"
    name: { "en": "Doaba (Jalandhar, Hoshiarpur, Kapurthala, Nawanshahr)" }
  - id: "malwai"
    name: { "en": "Malwa (Ludhiana, Patiala, Bathinda, Sangrur, Moga)" }
  - id: "puadhi"
    name: { "en": "Puadh (Mohali, Rupnagar, Fatehgarh Sahib, Ambala)" }
# The decks that need the alphabet: empty until the script decks are
# written (see above).
alphabet: []
units:
  # 1. The phrasebook, taught whole from the first lesson. pa-first-words
  # joins this unit.
  # The first words are written: pa-first-words is taught with the
  # phrasebook (10 words).
  - decks: ["pa-phrasebook", "pa-first-words", "*"]
    words: 10
  # 2. The first word units: the sounds, the tones, then the first words.
  - planned: { id: "pa-sound-differences", grammar: "sound-differences", words: 12 }
    listening_passages:
      - { id: "sound-pairs", text: { "en": "Pairs of words that differ in one sound, said slowly: breath, tongue curled back, a doubled consonant" } }
    reading_passages:
      - { id: "sound-pairs-list", text: { "en": "A list of word pairs with their readings" } }
  - planned: { id: "pa-tones", grammar: "tones", words: 10 }
    listening_passages:
      - { id: "high-low-level", text: { "en": "Words said with a high, a low and a level tone, and a horse and a whip told apart" } }
    reading_passages:
      - { id: "tone-pairs-list", text: { "en": "A list of words grouped by their tone, with their readings" } }
  - planned: { id: "pa-questions", theme: "questions", words: 11 }
    listening_passages:
      - { id: "yes-or-no", text: { "en": "Short questions answered with yes and no" } }
    reading_passages:
      - { id: "question-cards", text: { "en": "Cards with who, what, where and when" } }
  # pa-addressing joins this unit.
  - planned: { id: "pa-pronouns", theme: "pronouns", words: 26 }
    listening_passages:
      - { id: "who-is-who", text: { "en": "Pointing out who is who at a family gathering: he, she, they" } }
    reading_passages:
      - { id: "seating-chart", text: { "en": "A seating chart for a wedding lunch, with names and who is related to whom" } }
  - planned: { id: "pa-family", theme: "family", words: 25 }
    listening_passages:
      - { id: "family-photo", text: { "en": "Someone names the people in a family photo: father's and mother's side" } }
    reading_passages:
      - { id: "family-tree", text: { "en": "A family tree with its labels" } }
  # 3. The script, after the first six units (#554: skipped by a learner
  # who already reads it). pa-script-consonants and pa-script-reading join
  # the first unit.
  - planned: { id: "pa-script-vowels", grammar: "script-letters", words: 0 }
    listening_passages:
      - { id: "letter-names", text: { "en": "The 35 letters said in order, by their names" } }
    reading_passages:
      - { id: "first-signs", text: { "en": "Short words on shop signs, letter by letter" } }
  - planned: { id: "pa-script-vowel-signs", grammar: ["script-vowel-signs", "script-nasals", "script-addak"], words: 0 }
    listening_passages:
      - { id: "syllable-rows", text: { "en": "One consonant with each vowel sign, said in a row, then with tippi, bindi and addak" } }
    reading_passages:
      - { id: "name-boards", text: { "en": "Name boards with nasal vowels and doubled consonants" } }
  # pa-script-subjoined: the subjoined letters, the nukta letters and how
  # the spelling marks the tone.
  - planned: { id: "pa-script-subjoined", grammar: ["script-subjoined", "script-nukta", "script-tone-spelling"], words: 0 }
    listening_passages:
      - { id: "spelled-and-said", text: { "en": "Words read aloud whose spelling shows a breath but whose sound is a tone" } }
    reading_passages:
      - { id: "school-board", text: { "en": "A school notice board with borrowed words and subjoined letters" } }
  # Numbers 1-20 follow the script, as Hindi's do.
  - planned: { id: "pa-numbers-1-20", theme: "numbers-1-20", words: 20 }
    listening_passages:
      - { id: "phone-number", text: { "en": "Someone reads out a phone number" } }
    reading_passages:
      - { id: "price-tags", text: { "en": "Price tags on small things" } }
  # 4. The core: about 200 common words, most common first (by judgement
  # until the Wikipedia counts are written, #516).
  - planned: { id: "pa-about-me", theme: "about-me", words: 7 }
    listening_passages:
      - { id: "introducing-myself", text: { "en": "Someone says their name, village or town, and work" } }
    reading_passages:
      - { id: "profile-card", text: { "en": "A short profile card" } }
  - planned: { id: "pa-verbs", theme: "everyday-verbs", words: 30 }
    listening_passages:
      - { id: "morning-routine", text: { "en": "A mother says what each person in the house does in the morning" } }
    reading_passages:
      - { id: "fridge-note", text: { "en": "A note on the fridge: what to eat, what to drink and where things are" } }
  - planned: { id: "pa-adverbs", theme: "adverbs", words: 45 }
    listening_passages:
      - { id: "how-often", text: { "en": "Saying how often and how well things are done" } }
    reading_passages:
      - { id: "habit-survey", text: { "en": "A short survey about everyday habits" } }
  - planned: { id: "pa-quantities", theme: "quantities", words: 23 }
    listening_passages:
      - { id: "at-the-grocers", text: { "en": "Asking how much and how many at a grocer's" } }
    reading_passages:
      - { id: "shopping-amounts", text: { "en": "A shopping list with amounts" } }
  - planned: { id: "pa-describing", theme: "describing", words: 28 }
    listening_passages:
      - { id: "how-are-you-feeling", text: { "en": "A friend asks how you feel today, and you answer" } }
    reading_passages:
      - { id: "postcard-from-the-hills", text: { "en": "A short postcard: the weather and the food" } }
  - planned: { id: "pa-time", theme: "time", words: 17 }
    listening_passages:
      - { id: "what-time", text: { "en": "Asking and telling the time" } }
    reading_passages:
      - { id: "opening-hours", text: { "en": "A shop's opening hours" } }
  - planned: { id: "pa-location", theme: "location", words: 14 }
    listening_passages:
      - { id: "where-is-it", text: { "en": "Saying where things are in a room" } }
    reading_passages:
      - { id: "room-labels", text: { "en": "Labels: on, under, inside and near" } }
  - planned: { id: "pa-more-verbs", theme: "more-verbs", words: 25 }
    listening_passages:
      - { id: "kitchen-help", text: { "en": "Someone tells a helper what to do in the kitchen" } }
    reading_passages:
      - { id: "how-to-make-tea", text: { "en": "A short card on how to make tea" } }
  - planned: { id: "pa-work", theme: "work", words: 19 }
    listening_passages:
      - { id: "what-do-you-do", text: { "en": "People say what work they do" } }
    reading_passages:
      - { id: "name-tags", text: { "en": "Name tags at a meeting: who is who and what they do" } }
  # 5. Rules as forms, practised on the words known: noun forms and the
  # postpositions first, then pronoun and verb forms.
  # pa-grammar-nouns: the plural and the oblique, ਮੁੰਡਾ (muṇḍā) → ਮੁੰਡੇ
  # (muṇḍe) → ਮੁੰਡਿਆਂ (muṇḍiā̃), as a step of its own (the scheme).
  - planned: { id: "pa-grammar-nouns", grammar: ["plural", "oblique"], words: 0 }
    listening_passages:
      - { id: "one-boy-two-boys", text: { "en": "Counting children in a playground: one boy, two boys, to the boys" } }
    reading_passages:
      - { id: "class-list", text: { "en": "A class list of boys and girls" } }
  - planned: { id: "pa-grammar-postpositions", grammar: ["postpositions", "genitive", "synthetic-cases"], words: 6 }
    listening_passages:
      - { id: "from-home-to-school", text: { "en": "A child says where they go from home, with whom, and whose bag it is" } }
    reading_passages:
      - { id: "route-note", text: { "en": "A note on how to reach a house: from the bus stop, near the gurdwara, in the lane" } }
  - planned: { id: "pa-grammar-conjunctions", grammar: "conjunctions", words: 8 }
    listening_passages:
      - { id: "this-and-that", text: { "en": "Choosing this or that, and saying but and so" } }
    reading_passages:
      - { id: "two-plans", text: { "en": "A note with two plans joined by and, or and but" } }
  # pa-grammar-possessives joins this unit.
  - planned: { id: "pa-grammar-pronouns", grammar: ["pronouns", "possessives"], words: 0 }
    listening_passages:
      - { id: "whose-is-it", text: { "en": "Asking whose things are whose: mine, yours, ours" } }
    reading_passages:
      - { id: "we-and-you", text: { "en": "A message to a group: we, you and they" } }
  - planned: { id: "pa-grammar-be", grammar: "be", words: 0 }
    listening_passages:
      - { id: "who-and-where", text: { "en": "Saying who someone is and where they are" } }
    reading_passages:
      - { id: "is-there", text: { "en": "A note: what there is at home and what there is not" } }
  - planned: { id: "pa-grammar-present", grammar: "present", words: 0 }
    listening_passages:
      - { id: "every-day", text: { "en": "A farmer says what he does every day, and his daughter what she does" } }
    reading_passages:
      - { id: "weekly-routine", text: { "en": "A weekly routine pinned to a wall" } }
  # pa-grammar-adjectives joins this unit.
  - planned: { id: "pa-grammar-gender-agreement", grammar: ["gender-agreement", "adjectives"], words: 0 }
    listening_passages:
      - { id: "good-boy-good-girl", text: { "en": "Describing a boy, a girl and their friends: how the endings change" } }
    reading_passages:
      - { id: "for-sale-note", text: { "en": "A note describing things for sale: a big table, a small chair" } }
  - planned: { id: "pa-grammar-demonstratives", grammar: "demonstratives", words: 0 }
    listening_passages:
      - { id: "this-one-that-one", text: { "en": "Pointing at things: this one, that one, which one" } }
    reading_passages:
      - { id: "shop-labels", text: { "en": "Labels in a shop: this here, that there" } }
  # 6. Sentences, each after its words and rules; then the other A1
  # themes, each its words, its rules, then its sentences.
  - planned: { id: "pa-numbers-big", theme: "numbers-big", words: 83 }
    listening_passages:
      - { id: "how-much-is-it", text: { "en": "Prices said aloud at a stall" } }
    reading_passages:
      - { id: "bill", text: { "en": "A shop bill with its total" } }
  # pa-food-sentences joins this unit.
  - planned: { id: "pa-food", theme: "food", words: 59 }
    listening_passages:
      - { id: "at-the-dhaba", text: { "en": "Ordering a meal at a roadside dhaba" } }
    reading_passages:
      - { id: "menu-card", text: { "en": "A dhaba's menu card with dishes and prices" } }
  # pa-grammar-needs follows this unit.
  - planned: { id: "pa-groceries", theme: "groceries", words: 15 }
    listening_passages:
      - { id: "what-we-need", text: { "en": "Two people say what they need from the shop" } }
    reading_passages:
      - { id: "grocery-list", text: { "en": "A grocery list" } }
  - planned: { id: "pa-grammar-needs", grammar: "needs" }
    listening_passages:
      - { id: "needs-heard", text: { "en": "A short exchange that uses needs, after the groceries unit" } }
    reading_passages:
      - { id: "needs-read", text: { "en": "A short text that uses needs, after the groceries unit" } }
  - planned: { id: "pa-market", theme: "market", words: 9 }
    listening_passages:
      - { id: "at-the-market", text: { "en": "Buying vegetables at a market" } }
    reading_passages:
      - { id: "market-board", text: { "en": "A market stall's board" } }
  - planned: { id: "pa-grammar-questions", grammar: "questions", words: 0 }
    listening_passages:
      - { id: "asking-the-way", text: { "en": "Asking a stranger short questions" } }
    reading_passages:
      - { id: "a-form-to-fill", text: { "en": "A short form: name, age and where you live" } }
  - planned: { id: "pa-grammar-likes", grammar: "likes", words: 3 }
    listening_passages:
      - { id: "what-do-you-like", text: { "en": "Friends say what they like and do not like" } }
    reading_passages:
      - { id: "likes-poll", text: { "en": "A poll of favourite foods" } }
  # pa-pronouns-sentences, pa-verbs-sentences and pa-nouns-sentences join
  # this unit.
  - planned: { id: "pa-grammar-sentences", grammar: "sentences", words: 0 }
    listening_passages:
      - { id: "introducing-friends", text: { "en": "Introducing two friends: who is who, he and she" } }
    reading_passages:
      - { id: "a-short-diary", text: { "en": "A few lines about a day: who did what, and where" } }
  - planned: { id: "pa-grammar-differences", grammar: "differences", words: 0 }
    listening_passages:
      - { id: "easy-to-mix-up", text: { "en": "Two words that are easy to mix up, each said in a sentence" } }
    reading_passages:
      - { id: "mix-up-note", text: { "en": "A note in which one word is used in its two senses" } }
  # pa-grammar-continuous follows this unit.
  - planned: { id: "pa-directions", theme: "directions", words: 12 }
    listening_passages:
      - { id: "turn-left", text: { "en": "Directions to a gurdwara: left, right and straight on" } }
    reading_passages:
      - { id: "street-signs", text: { "en": "Street signs and an arrow board" } }
  - planned: { id: "pa-grammar-continuous", grammar: "continuous" }
    listening_passages:
      - { id: "continuous-heard", text: { "en": "A short exchange that uses continuous, after the directions unit" } }
    reading_passages:
      - { id: "continuous-read", text: { "en": "A short text that uses continuous, after the directions unit" } }
  - planned: { id: "pa-transport", theme: "transport", words: 8 }
    listening_passages:
      - { id: "auto-fare", text: { "en": "Agreeing a fare with an auto driver" } }
    reading_passages:
      - { id: "bus-board", text: { "en": "The destination board on a bus" } }
  - planned: { id: "pa-body", theme: "body", words: 35 }
    listening_passages:
      - { id: "at-the-doctors", text: { "en": "Telling a doctor where it hurts" } }
    reading_passages:
      - { id: "stretching-chart", text: { "en": "A chart of simple morning stretches" } }
  - planned: { id: "pa-places", theme: "places", words: 45 }
    listening_passages:
      - { id: "walk-to-the-market", text: { "en": "A neighbour names the places you pass on the way to the market" } }
    reading_passages:
      - { id: "map-labels", text: { "en": "Labels on a simple town map: pharmacy, school, bank, gurdwara" } }
  - planned: { id: "pa-things", theme: "things", words: 32 }
    listening_passages:
      - { id: "packing-for-a-trip", text: { "en": "Two people pack a bag for a trip to the hills" } }
    reading_passages:
      - { id: "lost-property-list", text: { "en": "A lost-property list at a railway station" } }
  # pa-things-sentences and pa-more-verbs-sentences join this unit.
  - planned: { id: "pa-home", theme: "home", words: 21 }
    listening_passages:
      - { id: "a-house-in-the-village", text: { "en": "Someone shows a visitor round a house in the village" } }
    reading_passages:
      - { id: "house-rules", text: { "en": "A short list of house rules" } }
  - planned: { id: "pa-grammar-articles", grammar: "articles", words: 0 }
    listening_passages:
