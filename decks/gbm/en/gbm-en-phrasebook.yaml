schema: 1
id: "gbm-en-phrasebook"
kind: "layer"
core: "gbm-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty phrases to say whole from the first day, before their words are taught: greetings and goodbye, thanks and sorry, asking for slower speech, asking for help and where the toilet is. Not yet checked by a Garhwali speaker: please report any mistake."
license: "CC-BY-SA-4.0"
cards:
  "gbm-0001":
    native: "hello; goodbye"
    notes:
      "n1": "The usual greeting, said with the palms pressed together."
    bases:
      "नमस्कार": "hello; goodbye"
  "gbm-0002":
    native: "good morning"
    notes:
      "n1": "Said in the morning."
    bases:
      "सुप्रभात": "good morning"
  "gbm-0003":
    native: "good evening"
    notes:
      "n1": "Said in the evening. सांझ (sānjh) is 'evening'."
    bases:
      "शुभ": "auspicious; good"
      "सांझ": "evening"
  "gbm-0004":
    native: "good night"
    notes:
      "n1": "Said at bedtime. रात (rāt) is 'night'."
    bases:
      "शुभ": "auspicious; good"
      "रात": "night"
  "gbm-0005":
    native: "see you again"
    notes:
      "n1": "Literally 'we will meet again'. Said when leaving."
    bases:
      "फेर": "again"
      "भेटला": "we will meet"
  "gbm-0006":
    native: "please"
    notes:
      "n1": "Put before a request."
    bases:
      "किरपा": "kindness"
      "करि": "do"
  "gbm-0007":
    native: "thank you"
    notes:
      "n1": "Polite and common."
    bases:
      "धन्यवाद": "thank you"
  "gbm-0008":
    native: "you're welcome; no problem"
    notes:
      "n1": "Literally 'there is no matter'. Said in reply to thanks."
    bases:
      "कै": "any"
      "बात": "matter"
  "gbm-0009":
    native: "sorry"
    notes:
      "n1": "Said to say sorry."
    bases:
      "माफ": "forgiveness"
      "करा": "please do"
  "gbm-0010":
    native: "excuse me"
    notes:
      "n1": "Literally 'please listen'. Said to get someone's attention."
    bases:
      "सुणा": "excuse me"
  "gbm-0011":
    native: "I don't understand"
    notes:
      "n1": "Literally 'understanding has not come to me'."
    bases:
      "मेकु": "to me"
      "समझ": "understanding"
      "आई": "came"
  "gbm-0012":
    native: "I don't know Garhwali"
    notes:
      "n1": "Put another language's name in place of गढ़वळि (garhwaḷi)."
    bases:
      "मेकु": "to me"
      "गढ़वळि": "Garhwali"
      "औन्दी": "comes"
  "gbm-0013":
    native: "please speak slowly"
    notes:
      "n1": "धीरा (dhīrā) is 'slowly'."
    bases:
      "धीरा": "slowly"
      "बोला": "speak"
  "gbm-0014":
    native: "do you speak English?"
    notes:
      "n1": "Respectful."
    bases:
      "तुम": "you"
      "अंग्रेजी": "English"
      "बोल": "speak"
      "सकदा": "can"
  "gbm-0015":
    native: "how are you?"
    notes:
      "n1": "Respectful."
    bases:
      "तुम": "you"
      "कनके": "how"
      "छै": "is; are"
  "gbm-0016":
    native: "I'm fine"
    notes:
      "n1": "The answer to how are you. ठीक (ṭhīk) is 'fine'."
    bases:
      "ठीक": "fine"
      "छौं": "am; are"
  "gbm-0017":
    native: "what is your name?"
    notes:
      "n1": "Respectful. The answer is मेरु (meru) नौं (naun) ... छ (cha)."
    bases:
      "तुमारु": "what is your name?"
  "gbm-0018":
    native: "my name is ..."
    notes:
      "n1": "Put your name where the dots are."
    bases:
      "मेरु": "my name is ..."
  "gbm-0019":
    native: "where is the toilet?"
    notes:
      "n1": "शौचालय (śauchālay) is 'toilet'."
    bases:
      "शौचालय": "where is the toilet?"
  "gbm-0020":
    native: "help!"
    notes:
      "n1": "Shouted in an emergency."

    bases:
      "बचाओ": "help!"