schema: 1
id: "brx-en-first-words"
kind: "layer"
core: "brx-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "Four Bodo words that could be checked from the sources: one, mother, father and water. Bodo has too few attested words in the sources reached so far, so this deck is short on purpose. Not yet checked by a Bodo speaker: please report any mistake."
cards:
  "brx-0001":
    native: "one"
    notes:
      "n1": "से (se) is 'one'. It matches the Roman form Se in Wikipedia's Boro article, but the\
  \ Devanagari comes from one commercial translation table, so check it with a speaker."
  "brx-0002":
    native: "mother"
    notes:
      "n1": "बिमा (bima) is 'mother'. One dictionary-style source gives it as his or her mother,\
  \ and a commercial table as mother, so check it with a speaker."
  "brx-0003":
    native: "father"
    notes:
      "n1": "बिपा (bipa) is 'father'. It comes from one commercial translation table only, so\
  \ check it with a speaker."
  "brx-0004":
    native: "water"
    notes:
      "n1": "द्वि (dwi) is 'water'. Two sources agree on it, and a learner's blog uses it in a\
  \ sentence."
