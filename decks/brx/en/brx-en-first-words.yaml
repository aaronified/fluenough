schema: 1
id: "brx-en-first-words"
kind: "layer"
core: "brx-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "Bodo words for one to ten, mother, my mother, father, water, I, name, woman, man, child, tea, good, here, what and rice. The Devanagari spellings of two and four to nine are not yet confirmed; the other words are from Wiktionary. Not yet checked by a Bodo speaker: please report any mistake."
cards:
  "brx-0001":
    native: "one"
    notes:
      "n1": "से (se) is \"one\". Wiktionary gives it."
  "brx-0002":
    native: "mother"
    notes:
      "n1": "बिमा (bima) is \"his or her mother\". Wiktionary gives it. आइ (āi) is \"my mother\"."
  "brx-0003":
    native: "father"
    notes:
      "n1": "बिफा (bipha) is 'father', his or her father. Wiktionary gives it; the form बिपा (bipā) is not attested."
  "brx-0004":
    native: "water"
    notes:
      "n1": "दै (dôi) is 'water'. Wiktionary and a Bodo dictionary snippet give it."
  "brx-0005":
    native: "two"
    notes:
      "n1": "नै (nwi) is 'two'. Wikipedia's article on the Boro language gives the Roman form Nwi for 'two'; the Devanagari spelling is a conversion that no dictionary was reached to confirm, so check it with a speaker."
  "brx-0006":
    native: "three"
    notes:
      "n1": "थाम (tham) is 'three'. Wikipedia's article on the Boro language gives the Roman form Tham for 'three'; the Devanagari spelling is a conversion. Wiktionary confirms it."
  "brx-0007":
    native: "four"
    notes:
      "n1": "ब्रै (brwi) is 'four'. Wikipedia's article on the Boro language gives the Roman form Brwi for 'four'; the Devanagari spelling is a conversion that no dictionary was reached to confirm, so check it with a speaker."
  "brx-0008":
    native: "five"
    notes:
      "n1": "बा (ba) is 'five'. Wikipedia's article on the Boro language gives the Roman form Ba for 'five'; the Devanagari spelling is a conversion that no dictionary was reached to confirm, so check it with a speaker."
  "brx-0009":
    native: "six"
    notes:
      "n1": "दो (do) is 'six'. Wikipedia's article on the Boro language gives the Roman form Do for 'six'; the Devanagari spelling is a conversion that no dictionary was reached to confirm, so check it with a speaker."
  "brx-0010":
    native: "seven"
    notes:
      "n1": "स्नि (sni) is 'seven'. Wikipedia's article on the Boro language gives the Roman form Sni for 'seven'; the Devanagari spelling is a conversion that no dictionary was reached to confirm, so check it with a speaker."
  "brx-0011":
    native: "eight"
    notes:
      "n1": "दैन (daen) is 'eight'. Wikipedia's article on the Boro language gives the Roman form Daen for 'eight'; the Devanagari spelling is a conversion that no dictionary was reached to confirm, so check it with a speaker."
  "brx-0012":
    native: "nine"
    notes:
      "n1": "गु (gu) is 'nine'. Wikipedia's article on the Boro language gives the Roman form Gu for 'nine'; the Devanagari spelling is a conversion that no dictionary was reached to confirm, so check it with a speaker."
  "brx-0013":
    native: "ten"
    notes:
      "n1": "जि (zi) is 'ten'. Wikipedia's article on the Boro language gives the Roman form Zi for 'ten'; the Devanagari spelling is a conversion. Wiktionary confirms it."
  "brx-0014":
    native: "I"
    notes:
      "n1": "आं (āṁ) is 'I'."
  "brx-0015":
    native: "my mother"
    notes:
      "n1": "आइ (āi) is 'my mother'. बिमा (bimā) is his or her mother."
  "brx-0016":
    native: "name"
    notes:
      "n1": "मुं (muṁ) is 'name'."
  "brx-0017":
    native: "woman"
    notes:
      "n1": "हिनजाव (hinjāv) is 'woman', also 'wife'."
  "brx-0018":
    native: "man"
    notes:
      "n1": "मानसि (mānsi) is 'man', also 'person'."
  "brx-0019":
    native: "child"
    notes:
      "n1": "गथ (gôthô) is 'child', also 'baby' or 'infant'."
  "brx-0020":
    native: "tea"
    notes:
      "n1": "साहा (sāhā) is 'tea'."
  "brx-0021":
    native: "good"
    notes:
      "n1": "मोजां (mojāṁ) is 'good'."
  "brx-0022":
    native: "here"
    notes:
      "n1": "बेयाव (beyāv) is 'here', at this place."
  "brx-0023":
    native: "what"
    notes:
      "n1": "मा (mā) is 'what'."
  "brx-0024":
    native: "rice"
    notes:
      "n1": "मायरं (māyraṁ) is 'rice', husked rice."
