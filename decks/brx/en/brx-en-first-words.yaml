native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "Bodo words for one to ten, mother, father and water. The numbers come from Wikipedia's article on the Boro language in Roman letters; the Devanagari spellings are not yet confirmed. Not yet checked by a Bodo speaker: please report any mistake."
cards:
  "brx-0001":
    native: "one"
    notes:
      "n1": "से (se) is 'one'. It matches the Roman form Se in Wikipedia's Boro article, but the\
  \ Devanagari comes from one commercial translation table, so check it with a speaker."
  "brx-0002":
    native: "mother"
    notes:
      "n1": "बिमा (bima) is 'mother'. One dictionary-style source gives it as his or her mother,\
  \ and a commercial table as mother, so check it with a speaker."
  "brx-0003":
    native: "father"
    notes:
      "n1": "बिपा (bipa) is 'father'. It comes from one commercial translation table only, so\
  \ check it with a speaker."
  "brx-0004":
    native: "water"
    notes:
      "n1": "द्वि (dwi) is 'water'. Two sources agree on it, and a learner's blog uses it in a\
  \ sentence."
  "brx-0005":
    native: "two"
    notes:
      "n1": "नै (nwi) is 'two'. Wikipedia's article on the Boro language gives the Roman form Nwi for 'two'; the Devanagari spelling is a conversion that no dictionary was reached to confirm, so check it with a speaker."
