description: "The first words of Rajasthani: the pronouns, yes and no, the numbers 1 to 10, the family, and the everyday words for food, house, name and time. Not yet checked by a Rajasthani speaker: please report any mistake."
cards:
  "raj-0101":
    native: "yes"
    notes:
      "n1": "The usual 'yes'. The Survey's list of words gives hā. Source: Grierson, Linguistic Survey of India, vol. IX part 2 (1908), the Marwari section and the list of standard words."
    examples:
      "हाँ, यो पाणी है।":
        native: "Yes, this is water."
        bases:
          "हाँ": "yes"
          "यो": "this"
          "पाणी": "water"
          "है": "is"
  "raj-0102":
    native: "no; not"
    notes:
      "n1": "The Survey says the Rajasthani negative ko-ni (or koy-ni) is common. Source: Grierson, Linguistic Survey of India, vol. IX part 2 (1908), the Marwari section and the list of standard words."
    examples:
      "यो घर कोनी।":
        native: "This is not a house."
        bases:
          "यो": "this"
          "घर": "home"
          "कोनी": "not"
      "वो अठै कोनी।":
        native: "He is not here."
        bases:
          "वो": "he"
          "अठै": "here"
          "कोनी": "not"
  "raj-0103":
    native: "I"
    notes:
      "n1": "The first person. The Survey gives hu or mhu for 'I', and mhai for the agent case. म्हैं (mhaiṁ) as the ordinary 'I' is not attested there. Source: Grierson, Linguistic Survey of India, vol. IX part 2 (1908), the Marwari section and the list of standard words."
    examples:
      "म्हैं डॉक्टर हूँ।":
        native: "I am a doctor."
        bases:
          "म्हैं": "I"
          "डॉक्टर": "doctor"
          "हूँ": "am"
      "म्हैं ठीक हूँ।":
        native: "I am fine."
        bases:
          "म्हैं": "I"
          "ठीक": "fine"
          "हूँ": "am"
  "raj-0104":
    native: "you (respectful)"
    notes:
      "n1": "The Survey's table gives the (thē) and tamē for 'you', with tharo for 'your'. Source: Grierson, Linguistic Survey of India, vol. IX part 2 (1908), the Marwari section and the list of standard words."
    examples:
      "थारो घर।":
        native: "Your house."
        bases:
          "थारो": "your"
          "घर": "home"
      "थे अर म्हे।":
        native: "You and we."
        bases:
          "थे": "you"
          "अर": "and"
          "म्हे": "we"
  "raj-0105":
    native: "he; she"
    notes:
      "n1": "One word for he and she. The Survey gives wo for 'that, he', with a separate feminine form in the nominative singular. Source: Grierson, Linguistic Survey of India, vol. IX part 2 (1908), the Marwari section and the list of standard words."
    examples:
      "वो अठै है।":
        native: "He is here."
        bases:
          "वो": "he"
          "अठै": "here"
          "है": "is"
      "वो कुण है?":
        native: "Who is he?"
        bases:
          "वो": "he"
          "कुण": "who"
          "है": "is"
  "raj-0106":
    native: "we"
    notes:
      "n1": "The Survey gives mhe (or me) for 'we', and āpā for 'we, including you'. Source: Grierson, Linguistic Survey of India, vol. IX part 2 (1908), the Marwari section and the list of standard words."
    examples:
      "म्हे अठै हां।":
        native: "We are here."
