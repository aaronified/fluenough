schema: 1
id: "raj-en-phrasebook"
kind: "layer"
core: "raj-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty phrases to say whole from the first day, before their words are taught: greetings and goodbye, thanks and sorry, asking for slower speech, asking for help and where the toilet is. Not yet checked by a Rajasthani speaker: please report any mistake."
license: "CC-BY-SA-4.0"
cards:
  "raj-0001":
    native: "hello"
    notes:
      "n1": "The usual greeting in Rajasthan."
    bases:
      "राम": "hello"
  "raj-0002":
    native: "good morning"
    notes:
      "n1": "Said in the morning."
    bases:
      "सुप्रभात": "good morning"
  "raj-0003":
    native: "good evening"
    notes:
      "n1": "Said in the evening."
    bases:
      "शुभ": "auspicious; good"
      "संध्या": "evening"
  "raj-0004":
    native: "good night"
    notes:
      "n1": "Said at bedtime. रात (rāt) is 'night'."
    bases:
      "शुभ": "auspicious; good"
      "रात": "night"
  "raj-0005":
    native: "see you again"
    notes:
      "n1": "Literally 'we will meet again'. Said when leaving."
    bases:
      "फेर": "again"
      "मिलांला": "we will meet"
  "raj-0006":
    native: "please"
    notes:
      "n1": "Put before a request."
    bases:
      "कृपा": "kindness"
      "करी": "do"
  "raj-0007":
    native: "thank you"
    notes:
      "n1": "Polite and common."
    bases:
      "धन्यवाद": "thank you"
  "raj-0008":
    native: "you're welcome; no problem"
    notes:
      "n1": "Literally 'there is no matter'. Said in reply to thanks."
    bases:
      "कोई": "any"
      "बात": "matter"
  "raj-0009":
    native: "sorry"
    notes:
      "n1": "Said to say sorry."
    bases:
      "माफ": "forgiveness"
      "करज्यो": "please do"
  "raj-0010":
    native: "excuse me"
    notes:
      "n1": "Literally 'please listen'. Said to get someone's attention."
    bases:
      "सुणज्यो": "excuse me"
  "raj-0011":
    native: "I don't understand"
    notes:
      "n1": "Literally 'understanding has not come to me'."
    bases:
      "म्हानै": "to me"
      "समझ": "understanding"
      "आई": "came"
  "raj-0012":
    native: "I don't know Rajasthani"
    notes:
      "n1": "Put another language's name in place of राजस्थानी (rājasthānī)."
    bases:
      "म्हानै": "to me"
      "राजस्थानी": "Rajasthani"
      "आवै": "comes"
  "raj-0013":
    native: "please speak slowly"
    notes:
      "n1": "धीमै (dhīmai) is 'slowly'."
    bases:
      "धीमै": "slowly"
      "बोलज्यो": "please speak"
  "raj-0014":
    native: "do you speak English?"
    notes:
      "n1": "Respectful."
    bases:
      "अंग्रेजी": "English"
      "बोल": "speak"
      "सको": "can"
  "raj-0015":
    native: "how are you?"
    notes:
      "n1": "Respectful."
    bases:
      "कियां": "how"
      "हो": "is; are"
  "raj-0016":
    native: "I'm fine"
    notes:
      "n1": "The answer to how are you. ठीक (ṭhīk) is 'fine'."
    bases:
      "ठीक": "fine"
      "हूँ": "am"
  "raj-0017":
    native: "what is your name?"
    notes:
      "n1": "Respectful. The answer is म्हारो (mhāro) नाम (nām) ... है (hai)."
    bases:
      "थारो": "your"
      "है": "isn't it (softener); is"
  "raj-0018":
    native: "my name is ..."
    notes:
      "n1": "Put your name where the dots are."
    bases:
      "म्हारो": "my"
      "है": "isn't it (softener); is"
  "raj-0019":
    native: "where is the toilet?"
    notes:
      "n1": "सौचालय (saucālay) is 'toilet'."
    bases:
      "सौचालय": "toilet"
      "है": "isn't it (softener); is"
  "raj-0020":
    native: "help!"
    notes:
      "n1": "Shouted in an emergency."

    bases:
      "बचाओ": "help!"