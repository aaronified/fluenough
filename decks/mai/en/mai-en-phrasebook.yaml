schema: 1
id: mai-en-phrasebook
kind: layer
core: mai-phrasebook
native:
  code: en
  iso639_3: eng
  name: English
name: 'Phrasebook: first phrases'
description: 'Twenty phrases to say whole from the first day: greetings and goodbye, thanks and sorry, asking for help, asking where the toilet is, and saying you are still learning Maithili. Not yet checked by a Maithili speaker: please report any mistake.'
license: CC-BY-SA-4.0
tags:
- unreviewed
cards:
  mai-0011:
    native: hello
    notes:
      n1: The common greeting, said with the hands pressed together.
    bases:
      प्रणाम: hello
  mai-0012:
    native: goodbye (said by the one leaving)
    notes:
      n1: Literally 'I am going'. Said when leaving.
    bases:
      जाइ: to go
      छी: to be
  mai-0013:
    native: thank you; thanks
    notes:
      n1: Common and polite. Among close friends, thanks is often left out.
    bases:
      धन्यवाद: thanks
  mai-0014:
    native: excuse me; sorry
    notes:
      n1: Literally 'do forgiveness'. Said to get past someone, or to apologise.
    bases:
      क्षमा: forgiveness
      करू: to do
  mai-0015:
    native: I didn't understand.
    notes:
      n1: The past of 'I' ends in -हुँ (-hū̃), as in देखलहुँ (dekhalahũ), I saw.
    bases:
      नहि: not
      बुझलहुँ: to understand
  mai-0016:
    native: Please speak slowly.
    notes:
      n1: कृपया (kṛpayā) is 'please'. धीरे (dhīre) is 'slowly'.
    bases:
      कृपया: please
      धीरे: slowly
      बाजू: to speak
  mai-0017:
    native: please
    notes:
      n1: Said before a request, as a polite word.
    bases:
      कृपया: please
  mai-0018:
    native: Help!
    notes:
      n1: Said when you need help. Say it loudly to attract attention.
    bases:
      सहायता: help
      करू: to do
  mai-0019:
    native: Where is the toilet?
    notes:
      n1: Literally 'toilet, where is it?'. कतय (kataya) means 'where'.
    bases:
      शौचालय: toilet
      कतय: where
      अछि: to be
  mai-0020:
    native: How much is this?
    notes:
      n1: Literally 'of this, the price, how much?'. कत्ते (katte) asks for an amount or a price.
    bases:
      एकर: of this
      दाम: price
      कत्ते: how much
  mai-0021:
    native: I don't know Maithili.
    notes:
      n1: जनैत (janait) is 'knows', from जान (jān), to know.
    bases:
      मैथिली: Maithili
      नहि: not
      जनैत: to know
      छी: to be
  mai-0022:
    native: I know a little Maithili.
    notes:
      n1: थोड़ (thoṛ) is 'a little'.
    bases:
      थोड़: a little
      मैथिली: Maithili
      जनैत: to know
      छी: to be
  mai-0023:
    native: OK; all right
    notes:
      n1: Also 'right' or 'correct'. Said to agree, or to close a topic.
    bases:
      ठीक: right; OK
      अछि: to be
  mai-0024:
    native: one moment
    notes:
      n1: Literally 'one minute'. Used to ask someone to wait.
    bases:
      मिनट: minute
  mai-0025:
    native: no problem; it's all right
    notes:
      n1: Said to someone who apologises, or to refuse something politely. Literally 'no matter'.
    bases:
      कोनो: any
      बात: matter
      नहि: not
  mai-0026:
    native: One cup of tea, please.
    notes:
      n1: Say it when you order.
    bases:
      कप: cup
      चाह: tea
      कृपया: please
  mai-0027:
    native: Say it again.
    notes:
      n1: Said when you did not catch what was said. फेर (pher) is 'again'; बेर (ber) is 'time'.
    bases:
      फेर: again
      बेर: time
      कहू: to say
  mai-0028:
    native: Thanks for the help.
    notes:
      n1: Literally 'thanks for the help'. लेल (lel) is 'for'.
    bases:
      सहायताक: help
      लेल: for
      धन्यवाद: thanks
  mai-0029:
    native: OK, thanks.
    notes:
      n1: A quick way to say that something is fine and to thank someone.
    bases:
      ठीक: right; OK
      अछि: to be
      धन्यवाद: thanks
  mai-0030:
    native: Let's go.
    notes:
      n1: चलू (calū) is 'let's go', from चल (cal), to go.
    bases:
      चलू: to go
