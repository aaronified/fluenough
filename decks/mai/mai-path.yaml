# The order Maithili is taught in, one unit per line, from every language
# it is taught from: each deck is named by its core id, and a learner from
# English is taught mai-en-home for mai-home (ADR-0013, ADR-0036).
#
# This is Maithili's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"; issue
# #572), written before any Maithili deck: every unit from the first words
# to B1 is planned, with its size in words, its grammar topics, the three
# milestones and its listening and reading passages. The course teaches
# every unit as "Coming" until its first deck is written; the unit's
# `planned` then turns into `decks` in the same change. Sizes follow the
# plan's levels (about 700, 900 and 1,200 words; low confidence) and are one
# number for every native language. Maithili is not in the scheme's tier
# table; it is taken as tier IV (1,100 hours), as Hindi, Bengali and Nepali
# are, inferred from typology and not on the FSI list
# (docs/plans/language-paths-scheme.md). The tier sets the pacing, in days,
# not the words a level needs, so the sizes are Hindi's and Odia's. A theme
# named here that decks/themes.yaml does not list yet is added to it with
# its first deck.
#
# The language's code is "mai", its ISO 639-3 code, as assets/languages.yaml
# has it: Maithili has no two-letter ISO 639-1 code, and the validator takes
# two or three letters (LANG_RE). Its cards will be mai-0001 and on.
#
# A planned unit names one core id. Where a unit will hold more than one
# deck, as Hindi's do, the comment above it names the others: they join the
# unit when they are written. Sentence decks have no theme, so they are not
# planned units of their own: each joins the unit named in its comment,
# after its words and rules.
#
# The order follows docs/plans/words-rules-sentences.md (owner, 2026-10-07,
# and 2026-10-17: "build the path files for all present languages via an
# opus agent, as per our current path design"), Hindi's path as the closest
# model, and the Indo-Aryan order of docs/plans/language-paths-scheme.md,
# less the gender agreement and the ergative Maithili does not have, and
# with the classifiers and the agreement with the object it adds: be,
# postpositions, the present, the case endings, the past, the agreement
# with the object, the conjunctive participle, compound and conjunct verbs,
# then the subjunctive, the relative-correlative clauses and the rest of B1:
# 1. the phrasebook, taught whole from the first lesson;
# 2. the first word units;
# 3. the script, after the first six units ("After units 4-6"); a learner
#    who already reads Devanagari skips it (#554);
# 4. a core of about 200 common words in themed units ("Yes, smaller
#    (~200)"), by judgement, most common first, until Maithili Wikipedia's
#    counts are written (tools/wikipedia_frequency.py, #516);
# 5. rules as forms: noun endings (the plural, the case endings), the
#    postpositions and conjunctions, then pronoun and verb forms, practised
#    on known words;
# 6. sentences, each after its words and rules; then the other themes, each
#    its words, its rules, then its sentences.
#
# What is Maithili's own, against Hindi's model. Maithili is Eastern
# Indo-Aryan, closest to Bhojpuri and Magahi, and shares more of its
# grammar with Bengali and Odia than with Hindi:
# - No ergative: the past takes no ने (ne), so Hindi's ne unit has no
#   counterpart.
# - Weak gender (see `genders` below): no gender on things, and no
#   agreement in gender in the genitive, which is one form, -क (-k) or केर
#   (ker), where Hindi's has three (kā, kī, ke).
# - The verb agrees with its subject in person and in honour, and also with
#   a second person, the object, or someone else in the sentence:
#   देखलहुँ (dekhalahũ, "I saw"), देखलिअनि (dekhalian(i), "I saw him",
#   to someone honoured), देखलिऐक (dekhaliaik, "I saw him", to someone not
#   honoured). The subject's agreement comes with the present in A1; the
#   object's is a rule of its own in A2, after the past it shows most in;
#   the whole honorific system is B1's last rule.
# - Three levels of "you": तोँ (tõ, intimate), अहाँ (ahā̃, honoured) and
#   अपने (apane, most honoured), with a middle one in some regions (to
#   confirm); the third person ऊ (ū, not honoured) and ओ (o, honoured). They come with the pronoun forms in
#   A1, again with the imperatives in A2, and in full in B1.
# - Be: अछि (achi, "is"), छी (chī), छथि (chathi, honoured), छै (chai, in
#   speech); the past छल (chal); the negative नहि (nahi), नै (nai) in
#   speech.
# - The classifiers टा (ṭā) and गोट (goṭ), एकटा (ekṭā, "one"), and the
#   plurals -सभ (-sabh) and the honorific -लोकनि (-lokani), take the place
#   of Hindi's gender and number.
# - The conjunctive participle in -इ (-i), देखि (dekhi, "having seen"), and
#   कऽ (ka), comes before the compound verbs built on it.
# - The past continuous in -ैत छल (-ait chal) is also the habitual past
#   ("was doing", "used to do"), so one unit teaches both, as Odia's does.
#
# The script is Devanagari, as assets/languages.yaml has it, and as
# Maithili is written today in India and Nepal. Tirhuta (Mithilākṣar), its
# historic script, in Unicode since 2014 (U+11480 to U+114DF), is out of
# scope unless the owner decides otherwise (#572). The script units teach
# Devanagari as Hindi's do, with Maithili's own mark: the avagraha ऽ, which
# marks a final a that is said, as in कऽ (ka).
#
# No Maithili deck is written yet, so the path lists no deck and `alphabet`
# is empty: the validator takes only written decks there. When the script
# decks are written, `alphabet` lists mai-script-vowels,
# mai-script-consonants, mai-script-reading, mai-script-vowel-signs,
# mai-script-conjuncts, mai-spelling and the first reader, and the two
# script units become lists of them, as Hindi's are. Until then each script
# unit is planned with grammar topics, since a planned unit names a theme or
# a grammar topic. Spelling and the first reader come after B1, as Hindi's
# do; they are added to the path when written, since nothing is planned
# after B1.
schema: 1
kind: "path"
id: "mai-path"
language: "mai"
# No gender classes. Things take no gender in Maithili: nothing agrees with
# the gender of पोथी (pothī, "book") or घर (ghar, "house"), and the
# genitive, the postpositions and most adjectives do not change. Gender is
# natural, in the words themselves, such as बेटा (beṭā, "son") and बेटी
# (beṭī, "daughter"); with a woman as subject the verb may take a feminine
# form, गेलीह (gelīh, "she went", honoured), and a few adjectives in -आ
# (-ā) may take -ई (-ī), but this is optional, and absent in much speech.
# What the verb does track is person and honour, of the subject and of the
# object. So, as Bengali's and Odia's do, the path lists no classes, and a
# noun card carries no `gender`: a class on every noun, ["m", "f"] as
# Hindi's has, would ask a gender of every thing that nothing in the
# sentence shows. The natural gender, with its optional agreement, is a
# grammar topic (natural-gender, with the classifiers), and the honour is
# the honorific topics. To confirm with a native reviewer (#512;
# DECK-FORMAT.md, Card data).
genders: []
# Where Maithili is spoken, for a rater's region and a card's region note
# (ADR-0036): Mithila, in north Bihar and Nepal's eastern Terai, by its
# usual dialect areas, each named with example districts so that a rater
# who does not know the terms can place themselves. The standard, the
# speech of Darbhanga and Madhubani, comes first, then the areas around it,
# then Nepal's Terai, where Maithili is Nepal's second language. Bajjika
# (western) and Angika (south-eastern) are listed as dialect areas, since
# they are widely counted ones and Maithili is their written standard,
# though many of their speakers call them languages of their own. Low
# confidence at each area's edges: a native reviewer checks this list
# before any rating names a region. The ids are permanent, as card ids
# are; rename a name, never an id. The app adds "Elsewhere" after them.
regions:
  - id: "central"
    name: { "en": "Central, the standard (Darbhanga, Madhubani, Samastipur)" }
  - id: "southern"
    name: { "en": "Southern (Begusarai, Khagaria, and Munger north of the Ganges)" }
  - id: "eastern"
    name: { "en": "Eastern (Saharsa, Supaul, Madhepura, Purnia, Araria, Katihar)" }
  - id: "nepal-terai"
    name: { "en": "Nepal's Terai (Janakpur, and Dhanusha, Mahottari, Siraha, Saptari, Sarlahi, Morang)" }
  - id: "western"
    name: { "en": "Western, Bajjika (Muzaffarpur, Sitamarhi, Sheohar, Vaishali)" }
  - id: "south-eastern"
    name: { "en": "South-eastern, Angika (Bhagalpur, Banka, and Godda in Jharkhand)" }
# The decks that need the alphabet: empty until the script decks are
# written (see above).
alphabet: []
units:
  # 1. The phrasebook, taught whole from the first lesson. mai-first-words
  # joins this unit.
  - planned: { id: "mai-phrasebook", theme: "first-words", words: 8 }
    listening_passages:
      - { id: "first-meeting", text: { "en": "Two people greet each other with pranam and say their names" } }
    reading_passages:
      - { id: "welcome-card", text: { "en": "A welcome card: hello, thank you and please" } }
  # 2. The first word units. The sounds: the retroflex against the dental,
  # the aspirates, ड़ (ṛa) against ड (ḍa), the vowels ऐ (ai) and औ (au), the
  # nasal vowels of अहाँ (ahā̃), the short final -i of अछि (achi), and the
  # a Maithili keeps inside a word where Hindi drops it, देखलहुँ
  # (dekhalahũ).
  - planned: { id: "mai-sound-differences", grammar: "sound-differences", words: 10 }
    listening_passages:
      - { id: "sound-pairs", text: { "en": "Pairs of words that differ in one sound, said slowly" } }
    reading_passages:
      - { id: "sound-pairs-list", text: { "en": "A list of word pairs with their readings" } }
  - planned: { id: "mai-questions", theme: "questions", words: 11 }
    listening_passages:
      - { id: "yes-or-no", text: { "en": "Short questions answered with yes and no" } }
    reading_passages:
      - { id: "question-cards", text: { "en": "Cards with who, what, where and when" } }
  # mai-addressing joins this unit.
  - planned: { id: "mai-pronouns", theme: "pronouns", words: 30 }
    listening_passages:
      - { id: "the-yous", text: { "en": "Speaking to a younger cousin, a friend and an elder: the words for you" } }
    reading_passages:
      - { id: "who-to-call-what", text: { "en": "A short list of people and how to address them" } }
  - planned: { id: "mai-family", theme: "family", words: 25 }
    listening_passages:
      - { id: "family-photo", text: { "en": "Someone names the people in a family photo" } }
    reading_passages:
      - { id: "family-tree", text: { "en": "A family tree with its labels" } }
  - planned: { id: "mai-numbers-1-20", theme: "numbers-1-20", words: 20 }
    listening_passages:
      - { id: "phone-number", text: { "en": "Someone reads out a phone number" } }
    reading_passages:
      - { id: "price-tags", text: { "en": "Price tags on small things" } }
  # 3. The script, after the first six units (#554: skipped by a learner
  # who already reads Devanagari). mai-script-consonants and
  # mai-script-reading join the first; mai-script-conjuncts joins the
  # second, with the avagraha ऽ.
  - planned: { id: "mai-script-vowels", grammar: "script-letters", words: 0 }
    listening_passages:
      - { id: "letter-names", text: { "en": "The vowels and consonants said in order" } }
    reading_passages:
      - { id: "first-signs", text: { "en": "Short words on shop signs, letter by letter" } }
  - planned: { id: "mai-script-vowel-signs", grammar: ["script-vowel-signs", "script-conjuncts", "avagraha"], words: 0 }
    listening_passages:
      - { id: "syllable-rows", text: { "en": "One consonant with each vowel sign, said in a row" } }
    reading_passages:
      - { id: "name-boards", text: { "en": "Name boards with joined letters, the nasal signs and the avagraha" } }
  # 4. The core: about 200 common words, most common first (by judgement
  # until the Wikipedia counts are written, #516).
  - planned: { id: "mai-about-me", theme: "about-me", words: 8 }
    listening_passages:
      - { id: "introducing-myself", text: { "en": "Someone says their name, home town and work" } }
    reading_passages:
      - { id: "profile-card", text: { "en": "A short profile card" } }
  - planned: { id: "mai-verbs", theme: "everyday-verbs", words: 32 }
    listening_passages:
      - { id: "morning-routine", text: { "en": "A mother says what each person in the house does in the morning" } }
    reading_passages:
      - { id: "to-do-list", text: { "en": "A short to-do list" } }
  - planned: { id: "mai-adverbs", theme: "adverbs", words: 50 }
    listening_passages:
      - { id: "how-often", text: { "en": "Saying how often and how well things are done" } }
    reading_passages:
      - { id: "habit-survey", text: { "en": "A short survey about everyday habits" } }
  - planned: { id: "mai-quantities", theme: "quantities", words: 28 }
    listening_passages:
      - { id: "a-little-more", text: { "en": "Asking for a little more and a little less" } }
    reading_passages:
      - { id: "shopping-amounts", text: { "en": "A shopping list with amounts" } }
  - planned: { id: "mai-describing", theme: "describing", words: 38 }
    listening_passages:
      - { id: "big-and-small", text: { "en": "Describing things: big, small, hot and cold" } }
    reading_passages:
      - { id: "for-sale-note", text: { "en": "A note describing something for sale" } }
  - planned: { id: "mai-time", theme: "time", words: 18 }
    listening_passages:
      - { id: "what-time", text: { "en": "Asking and telling the time" } }
    reading_passages:
      - { id: "opening-hours", text: { "en": "A shop's opening hours" } }
  - planned: { id: "mai-location", theme: "location", words: 14 }
    listening_passages:
      - { id: "where-is-it", text: { "en": "Saying where things are in a room" } }
    reading_passages:
      - { id: "room-labels", text: { "en": "Labels: on, under, inside and near" } }
  - planned: { id: "mai-more-verbs", theme: "more-verbs", words: 30 }
    listening_passages:
      - { id: "helping-out", text: { "en": "Asking someone to bring, give and keep things" } }
    reading_passages:
      - { id: "house-rules", text: { "en": "A short list of house rules" } }
  # 5. Rules as forms, practised on the words known: noun endings,
  # postpositions and conjunctions first, then pronoun and verb forms. The
  # topics are the plural (-सभ (-sabh), and -लोकनि (-lokani) for people
  # honoured) and the endings -केँ (-kẽ) for the object and the dative, -क
  # (-k) or केर (ker) for the genitive, one form for every noun, -मे (-me)
  # for "in" and -सँ (-sã) for "from", "with" and "by".
  - planned: { id: "mai-grammar-noun-forms", grammar: ["plural", "ke", "genitive", "me", "san"], words: 0 }
    listening_passages:
      - { id: "which-way-home", text: { "en": "Two people say where they go, with whom, and where from" } }
    reading_passages:
      - { id: "class-notice", text: { "en": "A class notice: where, with whom and when" } }
  # पर (par, "on"), लेल (lel, "for"), लग (lag, "near"), संग (saṅg, "with")
  # and धरि (dhari, "until").
  - planned: { id: "mai-grammar-postpositions", grammar: "postpositions", words: 6 }
    listening_passages:
      - { id: "by-bus-for-whom", text: { "en": "Saying how and for whom things are done: by bus, for mother, near the temple" } }
    reading_passages:
      - { id: "route-note", text: { "en": "A note on how to reach a house: past, behind and near" } }
  # आ (ā, "and"), मुदा (mudā, "but"), वा (vā, "or"), तेँ (tẽ, "so") and जे
  # (je, "that").
  - planned: { id: "mai-grammar-conjunctions", grammar: "conjunctions", words: 8 }
    listening_passages:
      - { id: "this-and-that", text: { "en": "Choosing this or that, and saying but and so" } }
    reading_passages:
      - { id: "two-plans", text: { "en": "A note with two plans joined by and, or and but" } }
  # mai-grammar-pronouns joins this unit. The levels of "you", तोँ (tõ),
  # अहाँ (ahā̃) and अपने (apane), and of "he" and "she", ऊ (ū) and ओ (o);
  # the genitives हमर (hamar), अहाँक (ahā̃k), हुनकर (hunkar), and the object
  # forms हमरा (hamarā), हुनका (hunkā), ओकरा (okarā).
  - planned: { id: "mai-grammar-pronoun-forms", grammar: ["pronouns", "honorific-levels", "pronoun-gen", "pronoun-obj"], words: 0 }
    listening_passages:
      - { id: "whose-is-it", text: { "en": "Asking whose things are whose, to a friend and to an elder" } }
    reading_passages:
      - { id: "we-and-you", text: { "en": "A message to a group: we, all of us, and you" } }
  # Be: अछि (achi), छी (chī), छथि (chathi), छै (chai); the negative नहि
  # (nahi), and नहि अछि (nahi achi), "is not there".
  - planned: { id: "mai-grammar-be", grammar: ["be", "be-negative"], words: 0 }
    listening_passages:
      - { id: "who-and-where", text: { "en": "Saying who someone is and where they are, and who they are not" } }
    reading_passages:
      - { id: "is-there", text: { "en": "A note: what there is at home and what there is not" } }
  # mai-grammar-present joins this unit: the present in -ैत (-ait) with छी
  # (chī), देखैत छी (dekhait chī, "I see"), in each person and each level
  # of honour of the subject.
  - planned: { id: "mai-grammar-verb-present", grammar: ["present", "present-first", "present-second", "present-third"], words: 0 }
    listening_passages:
      - { id: "morning-at-home", text: { "en": "A family member says what she does every morning" } }
    reading_passages:
      - { id: "note-on-the-fridge", text: { "en": "A short note: what to eat and drink" } }
  # ई (ī, "this"), ऊ (ū, "that"), and their honoured forms ए (e) and ओ
  # (o); एतय (etay, "here") and ओतय (otay, "there").
  - planned: { id: "mai-grammar-demonstratives", grammar: "demonstratives", words: 0 }
    listening_passages:
      - { id: "this-one-that-one", text: { "en": "Pointing at things: this one, that one, which one" } }
    reading_passages:
      - { id: "shop-labels", text: { "en": "Labels in a shop: this here, that there" } }
  - planned: { id: "mai-grammar-adjectives", grammar: "adjectives", words: 10 }
    listening_passages:
      - { id: "a-new-house", text: { "en": "A friend describes a new house: new, big, clean and bright" } }
    reading_passages:
      - { id: "house-advert", text: { "en": "A short advert for a house" } }
  # 6. Sentences, each after its words and rules; then the other A1
  # themes, each its words, its rules, then its sentences.
  - planned: { id: "mai-work", theme: "work", words: 19 }
    listening_passages:
      - { id: "what-do-you-do", text: { "en": "People say what work they do" } }
    reading_passages:
      - { id: "name-tags", text: { "en": "Name tags at a meeting: who is who and what they do" } }
  - planned: { id: "mai-numbers-big", theme: "numbers-big", words: 14 }
    listening_passages:
      - { id: "how-much-is-it", text: { "en": "Prices said aloud at a stall" } }
    reading_passages:
      - { id: "bill", text: { "en": "A shop bill with its total" } }
  # mai-food-sentences joins this unit.
  - planned: { id: "mai-food", theme: "food", words: 64 }
    listening_passages:
      - { id: "fish-and-makhana", text: { "en": "A family sits down to a meal of rice, fish curry and makhana, fox nuts" } }
    reading_passages:
      - { id: "menu-board", text: { "en": "A menu board with dishes and prices" } }
  # mai-grammar-needs joins this unit: चाही (cāhī), "is needed".
  - planned: { id: "mai-groceries", theme: "groceries", words: 16 }
    grammar: ["needs"]
    listening_passages:
      - { id: "what-we-need", text: { "en": "Two people say what they need from the shop" } }
    reading_passages:
      - { id: "grocery-list", text: { "en": "A grocery list" } }
  # mai-grammar-nouns joins this unit: the bare noun, with no gender on
  # things and no article.
  - planned: { id: "mai-market", theme: "market", words: 8 }
    grammar: ["nouns"]
    listening_passages:
      - { id: "at-the-market", text: { "en": "Buying vegetables at a market" } }
    reading_passages:
      - { id: "market-board", text: { "en": "A market stall's board" } }
  # की (kī, "what"), के (ke, "who"), कतय (katay, "where"), कहिया (kahiyā,
  # "when"), किएक (kiek, "why"), कोना (konā, "how").
  - planned: { id: "mai-grammar-questions", grammar: "questions", words: 0 }
    listening_passages:
      - { id: "asking-a-stranger", text: { "en": "Asking a stranger short questions" } }
    reading_passages:
      - { id: "a-form-to-fill", text: { "en": "A short form: name, age and where you live" } }
  # नीक लगैत अछि (nīk lagait achi, "it seems good", "I like").
  - planned: { id: "mai-grammar-likes", grammar: "likes", words: 2 }
    listening_passages:
      - { id: "what-do-you-like", text: { "en": "Friends say what they like and do not like" } }
    reading_passages:
      - { id: "likes-poll", text: { "en": "A poll of favourite foods" } }
  # mai-pronouns-sentences, mai-verbs-sentences and mai-noun-forms-sentences
  # join this unit.
  - planned: { id: "mai-grammar-sentences", grammar: "sentences", words: 0 }
    listening_passages:
      - { id: "introducing-friends", text: { "en": "Introducing two friends: who is who, and what they do" } }
    reading_passages:
      - { id: "a-short-diary", text: { "en": "A few lines about a day: who did what, and where" } }
  # mai-grammar-continuous joins this unit: देखि रहल छी (dekhi rahal chī),
  # "I am looking".
  - planned: { id: "mai-directions", theme: "directions", words: 12 }
    grammar: ["continuous"]
    listening_passages:
      - { id: "turn-left", text: { "en": "Directions to a temple: left, right and straight on" } }
    reading_passages:
      - { id: "street-signs", text: { "en": "Street signs and an arrow board" } }
  - planned: { id: "mai-transport", theme: "transport", words: 9 }
    listening_passages:
      - { id: "rickshaw-fare", text: { "en": "Agreeing a fare with a rickshaw driver" } }
    reading_passages:
      - { id: "bus-board", text: { "en": "The destination board on a bus" } }
  # mai-body-sentences joins this unit.
  - planned: { id: "mai-body", theme: "body", words: 30 }
    listening_passages:
      - { id: "where-it-hurts", text: { "en": "Telling a doctor where it hurts" } }
    reading_passages:
