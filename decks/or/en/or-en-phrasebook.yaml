id: or-en-phrasebook
kind: layer
core: or-phrasebook
native:
  code: en
  iso639_3: eng
  name: English
name: 'Phrasebook: first phrases'
description: 'Twenty phrases to say whole from the first day: greetings and goodbye, thanks and sorry, asking for help, asking where the toilet is, and saying you are still learning Odia. Not yet checked by an Odia speaker: please report any mistake.'
license: CC-BY-SA-4.0
tags:
- unreviewed
cards:
  or-0011:
    native: hello
    notes:
      n1: Said to anyone, at any time of day, with the palms pressed together.
    bases:
      ନମସ୍କାର: hello
  or-0012:
    native: goodbye (said by the one leaving)
    notes:
      n1: Literally 'I am going'. Said when leaving, as a goodbye.
    bases:
      ଯାଉଛି: to go
  or-0013:
    native: thank you; thanks
    notes:
      n1: Common and polite. Among close friends, thanks is often left out.
    bases:
      ଧନ୍ୟବାଦ: thanks
  or-0014:
    native: excuse me; sorry
    notes:
      n1: Literally 'do forgiveness'. Said to get past someone, or to apologise.
    bases:
      କ୍ଷମା: forgiveness
      କରନ୍ତୁ: to do
  or-0015:
    native: I didn't understand.
    notes:
      n1: The negative is ନାହିଁ (nāhiṁ), placed after the verb.
    bases:
      ବୁଝିପାରିଲି: to understand
      ନାହିଁ: no; not
  or-0016:
    native: Please speak slowly.
    notes:
      n1: ଦୟାକରି (dayākari) is 'please'. କୁହନ୍ତୁ (kuhantu) is 'say', said politely.
    bases:
      ଦୟାକରି: please
      ଧୀରେ: slowly
      କୁହନ୍ତୁ: to say; to speak
  or-0017:
    native: please
    notes:
      n1: Said before a request, as a polite word.
    bases:
      ଦୟାକରି: please
  or-0018:
    native: Help!
    notes:
      n1: Literally 'do help'. Say it loudly when you need help.
    bases:
      ସାହାଯ୍ୟ: help
      କରନ୍ତୁ: to do
  or-0019:
    native: Where is the toilet?
    notes:
      n1: Literally 'toilet, where?'. କୁଆଡ଼େ (kuāṛe) means 'where'.
    bases:
      ଶୌଚାଳୟ: toilet
      କୁଆଡ଼େ: where
  or-0020:
    native: How much is this?
    notes:
      n1: Literally 'this, how much?'. କେତେ (kete) asks for a price or an amount.
    bases:
      ଏହା: this
      କେତେ: how much
  or-0021:
    native: I don't know Odia.
    notes:
      n1: ଜାଣିବା (jāṇibā) is 'to know'. ଜାଣେ (jāṇe) is 'I know'; ନାହିଁ (nāhiṁ) makes it negative.
    bases:
      ଓଡ଼ିଆ: Odia
      ଜାଣେ: to know
      ନାହିଁ: no; not
  or-0022:
    native: I know a little Odia.
    notes:
      n1: ଟିକେ (ṭike) is 'a little'.
    bases:
      ଟିକେ: a little
      ଓଡ଼ିଆ: Odia
      ଜାଣେ: to know
  or-0023:
    native: OK; all right
    notes:
      n1: Also 'right' or 'correct'. Said to agree, or to close a topic.
    bases:
      ଠିକ୍: right; OK
      ଅଛି: to be
  or-0024:
    native: one moment
    notes:
      n1: Literally 'one minute'. Used to ask someone to wait.
    bases:
      ମିନିଟ୍: minute
  or-0025:
    native: no problem; it's all right
    notes:
      n1: Said to someone who apologises, or to refuse something politely.
    bases:
      ଅସୁବିଧା: trouble; problem
      ନାହିଁ: no; not
  or-0026:
    native: One tea, please.
    notes:
      n1: ଗୋଟିଏ (goṭie) counts one thing. Say it when you order.
    bases:
      ଗୋଟିଏ: one (of a thing)
      ଚା: tea
      ଦୟାକରି: please
  or-0027:
    native: Say it again.
    notes:
      n1: Said when you did not catch what was said. ଆଉ ଥରେ (āu thare) is 'one more time'.
    bases:
      ଆଉ: again
      ଥରେ: time
      କୁହନ୍ତୁ: to say
  or-0028:
    native: Thanks for the help.
    notes:
      n1: ପାଇଁ (pāṅi) is 'for'.
    bases:
      ସାହାଯ୍ୟ: help
      ପାଇଁ: for
      ଧନ୍ୟବାଦ: thanks
  or-0029:
    native: OK, thanks.
    notes:
      n1: A quick way to say that something is fine and to thank someone.
    bases:
      ଠିକ୍: right; OK
      ଧନ୍ୟବାଦ: thanks
  or-0030:
    native: Let's go.
    notes:
      n1: ଚାଲନ୍ତୁ (cālantu) is 'let's'. ଯିବା (yibā) is 'to go'.
    bases:
      ଚାଲନ୍ତୁ: let's
      ଯିବା: to go
