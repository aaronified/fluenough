# The order Odia is taught in, one unit per line, from every language it
# is taught from: each deck is named by its core id, and a learner from
# English is taught or-en-home for or-home (ADR-0013, ADR-0036).
#
# This is Odia's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"; issue #352),
# written before any Odia deck: every unit from the first words to B1 is
# planned, with its size in words, its grammar topics, the three milestones
# and its listening and reading passages. The course teaches every unit as
# "Coming" until its first deck is written; the unit's `planned` then turns
# into `decks` in the same change. Sizes follow the plan's levels (about
# 700, 900 and 1,200 words; low confidence) and are one number for every
# native language. Odia is tier IV (1,100 hours; not on the FSI list, the
# tier inferred from typology: docs/plans/language-paths-scheme.md); the
# tier sets the pacing, in days, not the words a level needs, so the sizes
# are Bengali's and Assamese's. A theme named here that decks/themes.yaml
# does not list yet is added to it with its first deck.
#
# A planned unit names one core id. Where a unit will hold more than one
# deck, as Bengali's do, the comment above it names the others: they join
# the unit when they are written. Sentence decks have no theme, so they are
# not planned units of their own: each joins the unit named in its comment,
# after its words and rules.
#
# The order follows docs/plans/words-rules-sentences.md (owner, 2026-10-07,
# and 2026-10-17: "build the path files for all present languages via an
# opus agent, as per our current path design"), Bengali's and Assamese's
# paths as the closest models, and the Indo-Aryan order of
# docs/plans/language-paths-scheme.md, less the gender agreement and the
# ergative Odia does not have ("No grammatical gender (natural/lexical
# only); skip ergative"), and with the classifiers it adds, as Bengali and
# Assamese do: be, postpositions, the present, the case endings, the past,
# the conjunctive participle, compound and conjunct verbs, then the
# subjunctive, the relative-correlative clauses and the rest of B1:
# 1. the phrasebook, taught whole from the first lesson;
# 2. the first word units;
# 3. the script, after the first six units ("After units 4-6"); a learner
#    who already reads it skips it (#554);
# 4. a core of about 200 common words in themed units ("Yes, smaller
#    (~200)"), by judgement, most common first, until Odia Wikipedia's
#    counts are written (tools/wikipedia_frequency.py, #516);
# 5. rules as forms: noun endings (the plural, the case endings), the
#    postpositions and conjunctions, then pronoun and verb forms, practised
#    on known words;
# 6. sentences, each after its words and rules; then the other themes, each
#    its words, its rules, then its sentences.
#
# What is Odia's own, against Bengali's and Assamese's models:
# - The sounds unit drills ଳ (ḷa) against ଲ (la), ଡ଼ (ṛa) against ଡ (ḍa),
#   the retroflex against the dental (ଟ (ṭa), ତ (ta)), the aspirates, and
#   the inherent vowel, which Odia keeps at a word's end: ଘର (ghara,
#   "house") has two syllables, where Bengali's ঘর (ghor) has one.
# - The script (Odia, #551) is taught in two units: the letters, then the
#   vowel signs with the conjuncts, such as କ୍ଷ (kṣa), the ya-phalā and
#   the ra-phalā, and the signs ଁ (candrabindu), ଂ (anusvāra) and ୍
#   (hasanta).
# - The case endings, on the noun or its plural: -ମାନେ (-māne) for people
#   and -ଗୁଡ଼ିକ (-guṛika) for things, -କୁ (-ku) for the object and the
#   dative, -ର (-ra) for the genitive (-ଙ୍କ (-ṅka) for the plural and the
#   honorific), -ରେ (-re) for the locative and the instrument, -ରୁ (-ru)
#   for the ablative, and ସହିତ (sahita) or ସାଙ୍ଗରେ (sāṅgare), "with".
# - The pronouns' three honorific levels, which the verb agrees with: ତୁ
#   (tu, intimate), ତୁମେ (tume, familiar) and ଆପଣ (āpaṇa, polite); in the
#   third person ସେ (se) takes a plain or an honorific verb. ଆମେ (āme,
#   "we") also serves for "I" in much speech. They come with the pronoun
#   forms in A1, again with the imperatives in A2, and in full in B1's
#   honorifics.
# - Be: ଅଛି (achi) for being somewhere, ଅଟେ (aṭe) or nothing for being
#   something, and their negatives ନାହିଁ (nāhim̐) and ନୁହେଁ (nuhem̐).
# - The classifiers ଟା (ṭā), ଟି (ṭi), ଜଣ (jaṇa) and ଖଣ୍ଡ (khaṇḍa), with
#   the plural's split between people and things, take the place of
#   Bengali's gender and number unit (gender-number).
# - The conjunctive participle in -ଇ (-i), ଖାଇ (khāi, "having eaten"),
#   comes before the compound verbs, which are built on it: ଖାଇଦେବା
#   (khāi debā).
# - The past continuous in -ଉଥିଲା (-uthilā) is also the habitual past
#   ("was doing", "used to do"), so one unit teaches both, where Bengali's
#   path has two.
#
# No Odia deck is written yet, so the path lists no deck and `alphabet` is
# empty: the validator takes only written decks there. When the script
# decks are written, `alphabet` lists or-script-vowels,
# or-script-consonants, or-script-reading, or-script-vowel-signs,
# or-script-conjuncts, or-spelling and the first reader, and the two script
# units become lists of them, as Bengali's are. Until then each script unit
# is planned with grammar topics, since a planned unit names a theme or a
# grammar topic. Spelling and the first reader come after B1, as Bengali's
# do; they are added to the path when written, since nothing is planned
# after B1.
schema: 1
kind: "path"
id: "or-path"
language: "or"
# No gender classes: a noun takes no gender, and neither verbs nor
# adjectives agree in gender (#512; DECK-FORMAT.md, Card data; the scheme's
# "No grammatical gender (natural/lexical only)"). Natural gender is in the
# words themselves, such as ପୁଅ (pua, "son") and ଝିଅ (jhia, "daughter"),
# and a few borrowed feminine forms in -ଈ (-ī) do not change the verb. What
# the grammar does track is people against things (the plural -ମାନେ
# (-māne) against -ଗୁଡ଼ିକ (-guṛika), the classifier ଜଣ (jaṇa) for people)
# and the honorific level; neither is a gender class, so they are taught as
# grammar topics and not listed here, as Bengali's and Assamese's are not.
genders: []
# Where Odia is spoken, for a rater's region and a card's region note
# (ADR-0036): its main dialect areas, each named with example districts so
# that a rater who does not know the terms can place themselves. The
# standard, the speech of the coastal and central districts (Mughalbandi),
# comes first. Western Odia, Sambalpuri or Kosli, is listed as a dialect
# area, since it is widely counted one and Odia is its written standard,
# though many of its speakers call it a language of its own; Desia, the
# Odia of the Koraput hills, is listed beside it. Low confidence at each
# area's edges: a native reviewer checks this list before any rating names
# a region. The ids are permanent, as card ids are; rename a name, never an
# id. The app adds "Elsewhere" after them.
regions:
  - id: "coastal"
    name: { "en": "Coastal and central, the standard (Cuttack, Puri, Khordha, Bhubaneswar)" }
  - id: "northern"
    name: { "en": "Northern, Baleswari (Balasore, Bhadrak, Mayurbhanj, and Odia-speaking Medinipur)" }
  - id: "southern"
    name: { "en": "Southern, Ganjami (Ganjam, Gajapati, and Odia-speaking Srikakulam)" }
  - id: "western"
    name: { "en": "Western, Sambalpuri or Kosli (Sambalpur, Bargarh, Bolangir, Kalahandi)" }
  - id: "south-western"
    name: { "en": "South-western, Desia (Koraput, Rayagada, Nabarangpur)" }
# The decks that need the alphabet: empty until the script decks are
# written (see above).
alphabet: []
units:
  # 1. The phrasebook, taught whole from the first lesson. or-first-words
  # joins this unit.
  - planned: { id: "or-phrasebook", theme: "first-words", words: 8 }
    listening_passages:
      - { id: "first-meeting", text: { "en": "Two people greet each other with namaskar and say their names" } }
    reading_passages:
      - { id: "welcome-card", text: { "en": "A welcome card: hello, thank you and please" } }
  # 2. The first word units.
  - planned: { id: "or-sound-differences", grammar: "sound-differences", words: 10 }
    listening_passages:
      - { id: "sound-pairs", text: { "en": "Pairs of words that differ in one sound, said slowly" } }
    reading_passages:
      - { id: "sound-pairs-list", text: { "en": "A list of word pairs with their readings" } }
  - planned: { id: "or-questions", theme: "questions", words: 11 }
    listening_passages:
      - { id: "yes-or-no", text: { "en": "Short questions answered with yes and no" } }
    reading_passages:
      - { id: "question-cards", text: { "en": "Cards with who, what, where and when" } }
  # or-addressing joins this unit.
  - planned: { id: "or-pronouns", theme: "pronouns", words: 30 }
    listening_passages:
      - { id: "three-yous", text: { "en": "Speaking to a younger cousin, a friend and an elder: the three words for you" } }
    reading_passages:
      - { id: "who-to-call-what", text: { "en": "A short list of people and how to address them" } }
  - planned: { id: "or-family", theme: "family", words: 25 }
    listening_passages:
      - { id: "family-photo", text: { "en": "Someone names the people in a family photo" } }
    reading_passages:
      - { id: "family-tree", text: { "en": "A family tree with its labels" } }
  - planned: { id: "or-numbers-1-20", theme: "numbers-1-20", words: 20 }
    listening_passages:
      - { id: "phone-number", text: { "en": "Someone reads out a phone number" } }
    reading_passages:
      - { id: "price-tags", text: { "en": "Price tags on small things" } }
  # 3. The script, after the first six units (#554: skipped by a learner
  # who already reads it). or-script-consonants and or-script-reading join
  # the first; or-script-conjuncts joins the second.
  - planned: { id: "or-script-vowels", grammar: "script-letters", words: 0 }
    listening_passages:
      - { id: "letter-names", text: { "en": "The vowels and consonants said in order" } }
    reading_passages:
      - { id: "first-signs", text: { "en": "Short words on shop signs, letter by letter" } }
  - planned: { id: "or-script-vowel-signs", grammar: ["script-vowel-signs", "script-conjuncts"], words: 0 }
    listening_passages:
      - { id: "syllable-rows", text: { "en": "One consonant with each vowel sign, said in a row" } }
    reading_passages:
      - { id: "name-boards", text: { "en": "Name boards with joined letters, such as kṣa, and the nasal signs" } }
  # 4. The core: about 200 common words, most common first (by judgement
  # until the Wikipedia counts are written, #516).
  - planned: { id: "or-about-me", theme: "about-me", words: 8 }
    listening_passages:
      - { id: "introducing-myself", text: { "en": "Someone says their name, home town and work" } }
    reading_passages:
      - { id: "profile-card", text: { "en": "A short profile card" } }
  - planned: { id: "or-verbs", theme: "everyday-verbs", words: 32 }
    listening_passages:
      - { id: "morning-routine", text: { "en": "A mother says what each person in the house does in the morning" } }
    reading_passages:
      - { id: "to-do-list", text: { "en": "A short to-do list" } }
  - planned: { id: "or-adverbs", theme: "adverbs", words: 50 }
    listening_passages:
      - { id: "how-often", text: { "en": "Saying how often and how well things are done" } }
    reading_passages:
      - { id: "habit-survey", text: { "en": "A short survey about everyday habits" } }
  - planned: { id: "or-quantities", theme: "quantities", words: 28 }
    listening_passages:
      - { id: "a-little-more", text: { "en": "Asking for a little more and a little less" } }
    reading_passages:
      - { id: "shopping-amounts", text: { "en": "A shopping list with amounts" } }
  - planned: { id: "or-describing", theme: "describing", words: 38 }
    listening_passages:
      - { id: "big-and-small", text: { "en": "Describing things: big, small, hot and cold" } }
    reading_passages:
      - { id: "for-sale-note", text: { "en": "A note describing something for sale" } }
  - planned: { id: "or-time", theme: "time", words: 18 }
    listening_passages:
      - { id: "what-time", text: { "en": "Asking and telling the time" } }
    reading_passages:
      - { id: "opening-hours", text: { "en": "A shop's opening hours" } }
  - planned: { id: "or-location", theme: "location", words: 14 }
    listening_passages:
      - { id: "where-is-it", text: { "en": "Saying where things are in a room" } }
    reading_passages:
      - { id: "room-labels", text: { "en": "Labels: on, under, inside and near" } }
  - planned: { id: "or-more-verbs", theme: "more-verbs", words: 30 }
    listening_passages:
      - { id: "helping-out", text: { "en": "Asking someone to bring, give and keep things" } }
    reading_passages:
      - { id: "house-rules", text: { "en": "A short list of house rules" } }
  # 5. Rules as forms, practised on the words known: noun endings,
  # postpositions and conjunctions first, then pronoun and verb forms. The
  # topics are the plural (-māne for people, -guṛika for things) and the
  # endings -ku, -ra (-ṅka), -re, -ru, and sahita or sāṅgare, "with".
  - planned: { id: "or-grammar-noun-forms", grammar: ["plural", "ku", "ra", "re", "ru", "sahita"], words: 0 }
    listening_passages:
      - { id: "which-way-home", text: { "en": "Two people say where they go, with whom, and where from" } }
    reading_passages:
      - { id: "class-notice", text: { "en": "A class notice: where, with whom and when" } }
  - planned: { id: "or-grammar-postpositions", grammar: "postpositions", words: 6 }
    listening_passages:
      - { id: "by-bus-for-whom", text: { "en": "Saying how and for whom things are done: by bus, for mother, near the temple" } }
    reading_passages:
      - { id: "route-note", text: { "en": "A note on how to reach a house: past, behind and near" } }
  - planned: { id: "or-grammar-conjunctions", grammar: "conjunctions", words: 8 }
    listening_passages:
      - { id: "this-and-that", text: { "en": "Choosing this or that, and saying but and so" } }
    reading_passages:
      - { id: "two-plans", text: { "en": "A note with two plans joined by and, or and but" } }
  # or-grammar-pronouns joins this unit. The honorific levels are tu,
  # tume and āpaṇa, and se with a plain or an honorific verb.
  - planned: { id: "or-grammar-pronoun-forms", grammar: ["pronouns", "honorific-levels", "pronoun-gen", "pronoun-obj"], words: 0 }
    listening_passages:
      - { id: "whose-is-it", text: { "en": "Asking whose things are whose, to a friend and to an elder" } }
    reading_passages:
      - { id: "we-and-you", text: { "en": "A message to a group: we, all of us, and you" } }
  # Be: achi for being somewhere, aṭe or nothing for being something;
  # nāhim̐ and nuhem̐ for their negatives.
  - planned: { id: "or-grammar-be", grammar: ["be", "be-negative"], words: 0 }
    listening_passages:
      - { id: "who-and-where", text: { "en": "Saying who someone is and where they are, and who they are not" } }
    reading_passages:
      - { id: "is-there", text: { "en": "A note: what there is at home and what there is not" } }
  # or-grammar-present joins this unit: the present in each person and each
  # honorific level.
  - planned: { id: "or-grammar-verb-present", grammar: ["present", "present-first", "present-second", "present-third"], words: 0 }
    listening_passages:
      - { id: "morning-at-home", text: { "en": "A family member says what she does every morning" } }
    reading_passages:
      - { id: "note-on-the-fridge", text: { "en": "A short note: what to eat and drink" } }
  - planned: { id: "or-grammar-demonstratives", grammar: "demonstratives", words: 0 }
    listening_passages:
      - { id: "this-one-that-one", text: { "en": "Pointing at things: this one, that one, which one" } }
    reading_passages:
      - { id: "shop-labels", text: { "en": "Labels in a shop: this here, that there" } }
  - planned: { id: "or-grammar-adjectives", grammar: "adjectives", words: 10 }
    listening_passages:
      - { id: "a-new-house", text: { "en": "A friend describes a new house: new, big, clean and bright" } }
    reading_passages:
      - { id: "house-advert", text: { "en": "A short advert for a house" } }
  # 6. Sentences, each after its words and rules; then the other A1
  # themes, each its words, its rules, then its sentences.
  - planned: { id: "or-work", theme: "work", words: 19 }
    listening_passages:
      - { id: "what-do-you-do", text: { "en": "People say what work they do" } }
    reading_passages:
      - { id: "name-tags", text: { "en": "Name tags at a meeting: who is who and what they do" } }
  - planned: { id: "or-numbers-big", theme: "numbers-big", words: 14 }
    listening_passages:
      - { id: "how-much-is-it", text: { "en": "Prices said aloud at a stall" } }
    reading_passages:
      - { id: "bill", text: { "en": "A shop bill with its total" } }
  # or-food-sentences joins this unit.
  - planned: { id: "or-food", theme: "food", words: 64 }
    listening_passages:
      - { id: "a-summer-lunch", text: { "en": "A family sits down to a summer lunch of pakhāḷa, water rice, and fried fish" } }
    reading_passages:
      - { id: "menu-board", text: { "en": "A menu board with dishes and prices" } }
  # or-grammar-needs joins this unit.
  - planned: { id: "or-groceries", theme: "groceries", words: 16 }
    grammar: ["needs"]
    listening_passages:
      - { id: "what-we-need", text: { "en": "Two people say what they need from the shop" } }
    reading_passages:
      - { id: "grocery-list", text: { "en": "A grocery list" } }
  # or-grammar-nouns joins this unit: the bare noun, with no gender and no
  # article.
  - planned: { id: "or-market", theme: "market", words: 8 }
    grammar: ["nouns"]
    listening_passages:
      - { id: "at-the-market", text: { "en": "Buying vegetables at a market" } }
    reading_passages:
      - { id: "market-board", text: { "en": "A market stall's board" } }
  - planned: { id: "or-grammar-questions", grammar: "questions", words: 0 }
    listening_passages:
      - { id: "asking-a-stranger", text: { "en": "Asking a stranger short questions" } }
    reading_passages:
      - { id: "a-form-to-fill", text: { "en": "A short form: name, age and where you live" } }
  - planned: { id: "or-grammar-likes", grammar: "likes", words: 2 }
    listening_passages:
      - { id: "what-do-you-like", text: { "en": "Friends say what they like and do not like" } }
    reading_passages:
      - { id: "likes-poll", text: { "en": "A poll of favourite foods" } }
  # or-pronouns-sentences, or-verbs-sentences and or-noun-forms-sentences
  # join this unit.
  - planned: { id: "or-grammar-sentences", grammar: "sentences", words: 0 }
    listening_passages:
      - { id: "introducing-friends", text: { "en": "Introducing two friends: who is who, and what they do" } }
    reading_passages:
      - { id: "a-short-diary", text: { "en": "A few lines about a day: who did what, and where" } }
  # or-grammar-continuous joins this unit.
  - planned: { id: "or-directions", theme: "directions", words: 12 }
    grammar: ["continuous"]
    listening_passages:
      - { id: "turn-left", text: { "en": "Directions to a temple: left, right and straight on" } }
    reading_passages:
      - { id: "street-signs", text: { "en": "Street signs and an arrow board" } }
  - planned: { id: "or-transport", theme: "transport", words: 9 }
    listening_passages:
      - { id: "auto-fare", text: { "en": "Agreeing a fare with an auto driver" } }
    reading_passages:
      - { id: "bus-board", text: { "en": "The destination board on a bus" } }
  # or-body-sentences joins this unit.
  - planned: { id: "or-body", theme: "body", words: 30 }
    listening_passages:
      - { id: "where-it-hurts", text: { "en": "Telling a doctor where it hurts" } }
    reading_passages:
      - { id: "exercise-poster", text: { "en": "A poster of simple morning stretches" } }
  # or-places-sentences joins this unit.
  - planned: { id: "or-places", theme: "places", words: 48 }
    listening_passages:
      - { id: "town-walk", text: { "en": "A neighbour names the places on the way to the market" } }
    reading_passages:
      - { id: "map-labels", text: { "en": "Labels on a simple town map" } }
  - planned: { id: "or-things", theme: "things", words: 38 }
    listening_passages:
      - { id: "packing-a-bag", text: { "en": "Two people pack a bag for a trip to Puri" } }
    reading_passages:
      - { id: "lost-property-list", text: { "en": "A lost-property list at a railway station" } }
  # or-things-sentences and or-more-verbs-sentences join this unit.
  - planned: { id: "or-home", theme: "home", words: 20 }
    listening_passages:
      - { id: "kitchen-instructions", text: { "en": "Someone tells a helper what to do in the kitchen" } }
    reading_passages:
      - { id: "how-to-card", text: { "en": "A short card on how to make tea" } }
  # or-quantities-sentences joins this unit.
  - planned: { id: "or-grammar-differences", grammar: "differences", words: 5 }
    listening_passages:
      - { id: "how-much-how-many", text: { "en": "Asking how much and how many at a stall" } }
    reading_passages:
      - { id: "recipe-amounts", text: { "en": "A recipe card with amounts" } }
  # In place of Bengali's gender and number unit: the classifiers ṭā, ṭi,
  # jaṇa and khaṇḍa, and the plural's split between people and things.
  - planned: { id: "or-grammar-classifiers", grammar: ["classifiers", "number-animacy"], words: 6 }
    listening_passages:
      - { id: "two-people-three-things", text: { "en": "Counting people and things: two people, three mangoes, one sheet of paper" } }
    reading_passages:
      - { id: "class-photo", text: { "en": "A caption under a class photo: how many boys, girls and teachers" } }
  # or-clothes-sentences and or-describing-sentences join this unit.
  - planned: { id: "or-clothes", theme: "clothes", words: 27 }
    listening_passages:
      - { id: "choosing-a-sari", text: { "en": "Choosing a colour and a size in a clothes shop" } }
    reading_passages:
      - { id: "shop-sign", text: { "en": "A clothes shop's sign with its offers" } }
  # or-animals-sentences joins this unit.
  - planned: { id: "or-animals", theme: "animals", words: 30 }
    listening_passages:
      - { id: "village-visit", text: { "en": "A child names the animals seen on a visit to a village" } }
    reading_passages:
      - { id: "zoo-board", text: { "en": "A zoo board at Nandankanan with each animal and what it eats" } }
