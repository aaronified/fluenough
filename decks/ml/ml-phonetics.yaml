"schema": 1
"kind": "phonetics"
"id": "ml-phonetics"
"language": "ml"
"variety": "Standard Malayalam, as the course's broad ipa writes it: the literary standard's regular voicing and allophones, not northern, Mappila or other dialectal speech"
"description": "Rules that turn a card's broad ipa into its narrow [ ] form, in order. Written for tools/derive_phonetic.py, never read by the app. Each rule applies the regular expression to the whole ipa string and replaces every match; the next rule works on the result. Only rules that are attested are here. The course's broad ipa for Malayalam (tools/transcribe.py malayalam()) writes every stop by its letter (voiceless k tʃ ʈ t̪ p, voiced ɡ dʒ ɖ d̪ b, aspirates), the inherent a as ə (and a before the word's last vowel), ന ൻ and ന്ന as a plain n, ര and റ both as the tap ɾ, റ്റ as tt, vowel length (ː) and geminates (doubled letters). So the rules add what it does not say: the dental nasal before a dental stop (ml-n-dental, first), the voicing of a single voiceless stop between vowels and after a nasal (the five -voiced rules, the palatal one writing dʒ), and the central open [ɐ] for the short a (ml-a-central, ml-a-final-central, last). Sources: Wikipedia, Malayalam phonology, Help:IPA/Malayalam and Malayalam (section Phonology) (CC BY-SA 4.0), all fetched 2026-11-23 (raw wikitext); Wiktionary's narrow Malayalam forms (kaikki.org dump, 23.9 MB, read 2026-11-23: 1,350 narrow forms, 1,344 with no note and no tag) were read as a check, not as a source: see tools/phonetic_languages.yaml, entry ml. Left out, on purpose, and why: (0) the word-final samvruthokaram [ɨ̆] (the u-less virama ് at the end of a word: ആറ്, വീട്, പാമ്പ്): the broad ipa drops it entirely and writes the same final consonant for ് and for the chillu letters (ൻ ൺ ർ ൽ ൾ) and for a final ം/മ്, so no rule on the ipa can tell where a vowel is to be added; the broad ipa (the engine, which sees the letters) must write it first; (1) the unreleased m n ɳ l ɭ at the end of a word (Wikipedia, citing Jiang 2010), for the same reason: a final n in the broad ipa may be ൻ (really final) or ന് (n + [ɨ̆], not final); (2) ന്റ: Wikipedia says it is [nd] with an alveolar d, but the broad ipa writes it nt̪ɾ, the same string as ന്ത്ര (mantram: Wiktionary n̪d̪r), so neither is written; (3) ര against റ (tap [ɾ] against trill [r], Help:IPA/Malayalam and the phonology page): the broad ipa writes both ɾ; (4) the palatalised geminates kkʲ ŋŋʲ after i e j (the page: distribution unpredictable); (5) the lenition of a medial k, the voicing of the aspirates (mukham as mogam), loss of aspiration, i u lowered to e o before Ca, final long vowels shortened, ḻ merged with y, l ḷ ḻ dropped in a coda, the fast-speech reductions: all colloquial or dialectal (the page's own section Colloquial and dialectal language); (6) the variants of ʋ ([v w β̞]) and of ʃ tʃ dʒ (postalveolar or alveolo-palatal, free variation); (7) the nasal assimilation Old Malayalam ntu, ñcu to nn, ññ, which is already in the spelling (the broad ipa writes nn); (8) ഫ as [f] or [pʰ] by speaker (the broad ipa already writes f where the card's hint has one); (9) the alveolar n of ന at the start of a word and in geminates (eṉṉāl against ennāl): the sources give no rule that the letters can follow; (10) the English loan sounds [æː ɔː ə] some speakers use. A rule left out is not a claim that it does not exist. The rules ship unreviewed: the central [ɐ] and the voicing are attested in three sources, but the voicing of every medial stop is a tendency of careful speech that a phonetician should confirm for the standard the course teaches."
"rules":
- "id": "ml-n-dental"
  "pattern": "n(?=t̪(?!ɾ)|d̪)"
  "replace": "n̪"
  "source": "Wikipedia, Help:IPA/Malayalam (CC BY-SA 4.0), fetched 2026-11-23: ന is dental [n̪] (alveolar [n] is ഩ, ന or the chillu ൻ); Wikipedia, Malayalam phonology, fetched 2026-11-23, Sample text: the IPA of antassōṭuṁ and tantryattōṭuṅ is /an̪t̪assoːʈum/ and /t̪an̪t̪rjat̪t̪oːʈuŋ/, the nasal before a dental stop being dental; Wiktionary's narrow forms (kaikki.org dump, read 2026-11-23) write the same: വസന്തം [ʋɐsɐn̪d̪ɐm], ചന്തി [t͡ʃɐn̪d̪i], ഏന്ത്രം [eːn̪d̪rɐm]. The broad ipa writes both ന and ൻ as a plain n, so the rule changes only an n before a dental stop (t̪ or d̪). It leaves alone an n before t̪ɾ, which the broad ipa writes both for ന്റ (an alveolar [nd] on the same page: \"ന്റ is pronounced as [nd]\") and for ന്ത്ര: the two cannot be told apart. First rule, so the voicing rules below can name n̪."
- "id": "ml-velar-voiced"
  "pattern": "(?:(?<=[aəeiouːmnɳŋɲ])|(?<=n̪))k(?=[aəeiou])"
  "replace": "ɡ"
  "source": "Wikipedia, Malayalam phonology (CC BY-SA 4.0), fetched 2026-11-23, section Consonants: \"All non-geminated voiceless stops and affricate become voiced intervocalically and after a nasal as in Tamil\" (citing Jiang 2010 and Krishnamurti 2003); Wiktionary's narrow forms (kaikki.org dump, read 2026-11-23) agree: പറങ്കി [pɐrɐŋɡi], മുള്ളങ്കി [muɭɭɐŋɡi] (after a nasal); the geminate stays in ഇക്കരെ [ikkɐɾe]. Applies to a single k between two vowels or after a nasal (m, n, ɳ, ŋ, ɲ or the dental n̪ written by ml-n-dental) and before a vowel, so a geminate (kk, ʈʈ, tt, pp, tʃtʃ, the doubled letters of the broad ipa) and a stop in a cluster or at the end of a word stay voiceless. The broad ipa writes the voiceless letter; the voiced letters (ഗ ഡ ദ ബ ജ) are already ɡ ɖ d̪ b dʒ in it, so only a voiceless stop is changed. Fricative and lost variants of a medial k (ɣ, zero) are colloquial and are not taken."
- "id": "ml-retroflex-voiced"
  "pattern": "(?:(?<=[aəeiouːmnɳŋɲ])|(?<=n̪))ʈ(?=[aəeiou])"
  "replace": "ɖ"
  "source": "Wikipedia, Malayalam phonology (CC BY-SA 4.0), fetched 2026-11-23, section Consonants: \"All non-geminated voiceless stops and affricate become voiced intervocalically and after a nasal as in Tamil\" (citing Jiang 2010 and Krishnamurti 2003); Wiktionary's narrow forms (kaikki.org dump, read 2026-11-23) have no word that shows a single ട between vowels or after a nasal before a vowel, so for the retroflex the page's general statement stands alone (Wiktionary's other stops agree). Applies to a single ʈ between two vowels or after a nasal (m, n, ɳ, ŋ, ɲ or the dental n̪ written by ml-n-dental) and before a vowel, so a geminate (kk, ʈʈ, tt, pp, tʃtʃ, the doubled letters of the broad ipa) and a stop in a cluster or at the end of a word stay voiceless. The broad ipa writes the voiceless letter; the voiced letters (ഗ ഡ ദ ബ ജ) are already ɡ ɖ d̪ b dʒ in it, so only a voiceless stop is changed. The flap ɽ is not taken."
- "id": "ml-dental-voiced"
  "pattern": "(?:(?<=[aəeiouːmnɳŋɲ])|(?<=n̪))t̪(?=[aəeiou])"
  "replace": "d̪"
  "source": "Wikipedia, Malayalam phonology (CC BY-SA 4.0), fetched 2026-11-23, section Consonants: \"All non-geminated voiceless stops and affricate become voiced intervocalically and after a nasal as in Tamil\" (citing Jiang 2010 and Krishnamurti 2003); Wiktionary's narrow forms (kaikki.org dump, read 2026-11-23) agree: കൈതച്ചക്ക [kɐid̪ɐt̚t͡ʃɐkkɐ] and ചെറുതേനീച്ച [t͡ʃerud̪eːniːt̚t͡ʃɐ] (between vowels), വസന്തം [ʋɐsɐn̪d̪ɐm] and ചന്തി [t͡ʃɐn̪d̪i] (after a nasal). Applies to a single t̪ between two vowels or after a nasal (m, n, ɳ, ŋ, ɲ or the dental n̪ written by ml-n-dental) and before a vowel, so a geminate (kk, ʈʈ, tt, pp, tʃtʃ, the doubled letters of the broad ipa) and a stop in a cluster or at the end of a word stay voiceless. The broad ipa writes the voiceless letter; the voiced letters (ഗ ഡ ദ ബ ജ) are already ɡ ɖ d̪ b dʒ in it, so only a voiceless stop is changed. The fricative ð is not taken."
- "id": "ml-labial-voiced"
  "pattern": "(?:(?<=[aəeiouːmnɳŋɲ])|(?<=n̪))p(?=[aəeiou])"
  "replace": "b"
  "source": "Wikipedia, Malayalam phonology (CC BY-SA 4.0), fetched 2026-11-23, section Consonants: \"All non-geminated voiceless stops and affricate become voiced intervocalically and after a nasal as in Tamil\" (citing Jiang 2010 and Krishnamurti 2003); Wiktionary's narrow forms (kaikki.org dump, read 2026-11-23) agree: ചുണ്ണാമ്പ് [t͡ʃuɳɳaːmbɨ] (after a nasal). Applies to a single p between two vowels or after a nasal (m, n, ɳ, ŋ, ɲ or the dental n̪ written by ml-n-dental) and before a vowel, so a geminate (kk, ʈʈ, tt, pp, tʃtʃ, the doubled letters of the broad ipa) and a stop in a cluster or at the end of a word stay voiceless. The broad ipa writes the voiceless letter; the voiced letters (ഗ ഡ ദ ബ ജ) are already ɡ ɖ d̪ b dʒ in it, so only a voiceless stop is changed. The fricative β is not taken."
- "id": "ml-palatal-voiced"
  "pattern": "(?:(?<=[aəeiouːmnɳŋɲ])|(?<=n̪))tʃ(?=[aəeiou])"
  "replace": "dʒ"
  "source": "Wikipedia, Malayalam phonology (CC BY-SA 4.0), fetched 2026-11-23, section Consonants: \"All non-geminated voiceless stops and affricate become voiced intervocalically and after a nasal as in Tamil\" (citing Jiang 2010 and Krishnamurti 2003); Wiktionary's narrow forms (kaikki.org dump, read 2026-11-23) agree: the geminate stays (കൈതച്ചക്ക [kɐid̪ɐt̚t͡ʃɐkkɐ]); the page's statement covers the single affricate. Applies to a single tʃ between two vowels or after a nasal (m, n, ɳ, ŋ, ɲ or the dental n̪ written by ml-n-dental) and before a vowel, so a geminate (kk, ʈʈ, tt, pp, tʃtʃ, the doubled letters of the broad ipa) and a stop in a cluster or at the end of a word stay voiceless. The broad ipa writes the voiceless letter; the voiced letters (ഗ ഡ ദ ബ ജ) are already ɡ ɖ d̪ b dʒ in it, so only a voiceless stop is changed. The alveolo-palatal dʑ is free variation on the page and is not taken."
- "id": "ml-a-central"
  "pattern": "ə"
  "replace": "ɐ"
  "source": "Wikipedia, Help:IPA/Malayalam (CC BY-SA 4.0), fetched 2026-11-23: the short vowel അ is [ɐ] (\"fun\"); the Malayalam article's [mɐlɐjaːɭɐm] (Malayalam, section Phonology, fetched 2026-11-23) and the phonology page's example [kiɖɐk:ugɐ] (Malayalam phonology, fetched 2026-11-23) write ɐ. The broad ipa (tools/transcribe.py malayalam()) writes the inherent a as ə before the word's last vowel; the rule writes it ɐ. The page's phonetic [ä] for /a/ and the allophone [ə] that Help:IPA allows in some medial and final positions are not taken (three sources write ɐ)."
- "id": "ml-a-final-central"
  "pattern": "a(?![ːiu])"
  "replace": "ɐ"
  "source": "As ml-a-central: the broad ipa keeps the word's last short a as a (malayalam() in tools/transcribe.py), and Wikipedia writes ɐ for it too (kiɖɐk:ugɐ on the phonology page). Only a short a that is not the start of a long vowel (aː), of ai or of au is changed, so the long [aː] and the diphthongs ai and au stay; the page and Wiktionary write them with a plain a (ai̯, au̯). Last, so the voicing rules above, which name a as a vowel, have run."
