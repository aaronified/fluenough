  # ml-grammar-adjectives and ml-grammar-articles join this unit.
  - planned: { id: "ml-grammar-gender-number", grammar: ["articles", "gender-number", "adjectives"], words: 10 }
    listening_passages:
      - { id: "he-she-it", text: { "en": "Talking about a man, a woman and a thing: the pronoun changes, the verb does not" } }
    reading_passages:
      - { id: "class-photo", text: { "en": "A caption under a class photo" } }
  # ml-clothes-sentences and ml-describing-sentences join this unit.
  - planned: { id: "ml-clothes", theme: "clothes", words: 26 }
    listening_passages:
