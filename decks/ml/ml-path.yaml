# The order Malayalam is taught in, one unit per line, from every language
# it is taught from: each deck is named by its core id, and a learner from
# English is taught ml-en-home for ml-home (ADR-0013, ADR-0036).
#
# This is Malayalam's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"; issue
# #355), written before any Malayalam deck: every unit from the first words
# to B1 is planned, with its size in words, its grammar topics, the three
# milestones and its listening and reading passages. The course teaches
# every unit as "Coming" until its first deck is written; the unit's
# `planned` then turns into `decks` in the same change. Sizes follow the
# plan's levels (about 700, 900 and 1,200 words; low confidence) and are
# one number for every native language. Malayalam is taken as tier IV, as
# Telugu and Tamil are: it is not on the FSI list, so its tier is inferred
# (docs/plans/language-paths.md). The tier sets the pacing, in days, not
# the words a level needs, so the sizes are Telugu's. A theme named here
# that decks/themes.yaml does not list yet is added to it with its first
# deck.
#
# A planned unit names one core id. Where a unit will hold more than one
# deck, as Telugu's do, the comment above it names the others: they join
# the unit when they are written. Sentence decks have no theme, so they are
# not planned units of their own: each joins the unit named in its comment,
# after its words and rules.
#
# The order follows docs/plans/words-rules-sentences.md (owner, 2026-10-07,
# and 2026-10-17: "build the path files for all present languages via an
# opus agent, as per our current path design"), Telugu's path and Tamil's
# plan (#578) as the closest models, and the Dravidian order of
# docs/plans/language-paths-scheme.md (retroflex sounds, script, greetings,
# numbers, pronouns, SOV, suffixes, cases, present, past and future,
# negatives, verbal participles, relative participles, conditionals,
# honorifics; for Malayalam "Many conjunct forms; long compounds; sound
# ഴ"):
# 1. the phrasebook, taught whole from the first lesson;
# 2. the first word units;
# 3. the script, after the first six units ("After units 4-6"); a learner
#    who already reads it skips it (#554);
# 4. a core of about 200 common words in themed units ("Yes, smaller
#    (~200)"), by judgement, most common first, until Malayalam
#    Wikipedia's counts are written (tools/wikipedia_frequency.py, #516);
# 5. rules as forms: noun endings (the plurals, the oblique stem, the case
#    suffixes), then pronoun and verb forms, practised on known words;
# 6. sentences, each after its words and rules; then the other themes, each
#    its words, its rules, then its sentences.
#
# What is Malayalam's own, against Telugu's and Tamil's:
# - A verb does not mark person, number or gender: ഞാൻ പോകുന്നു (ñān
#   pōkunnu, "I go") and അവൾ പോകുന്നു (avaḷ pōkunnu, "she goes") take the
#   same form. So the present is one topic, `present`, not Telugu's three
#   by person, and a tense is taught once for every subject.
# - The sounds unit drills ഴ (ḻa) against ള (ḷa) and ല (la), റ (ṟa)
#   against ര (ra), the retroflex ണ (ṇa) against ന (na), and the double
#   consonants, such as കട (kaṭa, "shop") against കട്ട (kaṭṭa, "block").
# - The script has many conjuncts, and both the traditional and the 1971
#   reformed forms are in print. It takes three units, not two: the
#   letters; the vowel signs, the chandrakkala (്) and the chillu letters
#   ൽ (l), ൾ (ḷ), ൻ (n), ർ (r) and ൺ (ṇ); then the conjuncts, such as ക്ക
#   (kka), ന്റ (nṟa) and ക്ഷ (kṣa), in their two forms.
# - The case suffixes: plural -കൾ (-kaḷ), and -മാർ (-mār) for people, as in
#   അമ്മമാർ (ammamār, "mothers"); the oblique stem (മരം (maram) → മരത്ത്-
#   (maratt-), വീട് (vīṭŭ) → വീട്ട്- (vīṭṭ-)); accusative -എ (-e);
#   dative -ക്ക് (-kkŭ) or -ന് (-nŭ); genitive -ന്റെ (-nṟe) or -ഉടെ (-uṭe);
#   locative -ഇൽ (-il); ablative -ഇൽ നിന്ന് (-il ninnŭ); sociative -ഓട്
#   (-ōṭŭ); and the instrumental -ആൽ (-āl) with the postpositions.
# - Two verbs "to be": ആണ് (āṇŭ, "is", what a thing is) and ഉണ്ട് (uṇṭŭ,
#   "there is", where it is and what one has), with their negatives അല്ല
#   (alla) and ഇല്ല (illa). Liking, wanting and knowing take a dative
#   subject: എനിക്ക് ഇഷ്ടമാണ് (enikkŭ iṣṭamāṇŭ, "I like it").
# - We, inclusive and exclusive: നമ്മൾ (nammaḷ) and ഞങ്ങൾ (ñaṅṅaḷ).
# - Spoken first, written later, as Tamil's plan does, though the gap is
#   smaller: the course teaches common spoken forms where they differ, such
#   as എന്താ (entā) for എന്താണ് (entāṇŭ, "what is it") and വരണില്ല
#   (varaṇilla) for വരുന്നില്ല (varunnilla, "is not coming"). Reading
#   passages are written Malayalam from the start, since signs and notices
#   are; the written forms are taught in the B1 unit ml-registers.
# - Words run together in writing (sandhi): വരുന്നുണ്ട് (varunnuṇṭŭ),
#   പോയില്ല (pōyilla). A rule of its own in A2, after the negative; long
#   compounds come in B1.
# - The verbal participle (-ഇട്ട് (-iṭṭŭ), -ഉ (-u)) comes in A2, before the
#   compound verbs, which are built on it: കളയുക (kaḷayuka, "do away"),
#   വെക്കുക (vekkuka, "do ahead"). The past's verb classes follow the
#   past. Reported speech is the quotative എന്ന് (ennŭ).
#
# No Malayalam deck is written yet, so the path lists no deck and
# `alphabet` is empty: the validator takes only written decks there. When
# the script decks are written, `alphabet` lists ml-script-vowels,
# ml-script-consonants, ml-script-reading, ml-script-vowel-signs,
# ml-script-chillu, ml-script-conjuncts, ml-spelling and the first reader,
# and the three script units become lists of them, as Telugu's are. Until
# then each script unit is planned with a grammar topic, since a planned
# unit names a theme or a grammar topic. Spelling and the first reader come
# after B1, as Telugu's do; they are added to the path when written, since
# nothing is planned after B1.
schema: 1
kind: "path"
id: "ml-path"
language: "ml"
# The gender classes a noun's gender is one of (#512; DECK-FORMAT.md, Card
# data): Malayalam's three, masculine, feminine and neuter, written "m",
# "f" and "n" as Kannada's are. The class follows the meaning: men and
# male gods are masculine, women and goddesses feminine, and everything
# else, animals too, neuter. A verb does not agree with it, but it decides
# which pronoun stands for the noun, അവൻ (avan), അവൾ (avaḷ) or അത് (atŭ),
# the forms of a noun made from a describing word, നല്ലവൻ (nallavan),
# നല്ലവൾ (nallavaḷ) or നല്ലത് (nallatŭ), and whether a noun takes the
# plural -മാർ (-mār). A native reviewer confirms this, or [] as for
# Bengali.
genders: ["m", "f", "n"]
# Where Malayalam is spoken, for a rater's region and a card's region note
# (ADR-0036): Kerala's three dialect regions, each named with example
# districts, then Lakshadweep, whose speech (Jeseri) is the most distinct.
# Speakers in the Gulf and elsewhere speak their home region's Malayalam,
# so they have no region of their own; the app adds "Elsewhere" after
# these. The ids are permanent, as card ids are; rename a name, never an
# id.
regions:
  - id: "north"
    name: { "en": "North Kerala, Malabar (Kozhikode, Kannur, Malappuram, Palakkad)" }
  - id: "central"
    name: { "en": "Central Kerala (Thrissur, Ernakulam, Kottayam)" }
  - id: "south"
    name: { "en": "South Kerala, Travancore (Thiruvananthapuram, Kollam)" }
  - id: "lakshadweep"
    name: { "en": "Lakshadweep" }
# The decks that need the alphabet: empty until the script decks are
# written (see above).
alphabet: []
units:
  # 1. The phrasebook, taught whole from the first lesson. ml-first-words
  # joins this unit.
  # The first words are written: ml-first-words is taught with the
  # phrasebook (10 words).
  - decks: ["ml-phrasebook", "ml-first-words", "*"]
    words: 10
  # 2. The first word units.
  - planned: { id: "ml-sound-differences", grammar: "sound-differences", words: 12 }
    listening_passages:
      - { id: "sound-pairs", text: { "en": "Pairs of words that differ in one sound, said slowly" } }
    reading_passages:
      - { id: "sound-pairs-list", text: { "en": "A list of word pairs with their readings" } }
  - planned: { id: "ml-questions", theme: "questions", words: 11 }
    listening_passages:
      - { id: "yes-or-no", text: { "en": "Short questions answered with yes and no" } }
    reading_passages:
      - { id: "question-cards", text: { "en": "Cards with who, what, where and when" } }
  # ml-addressing joins this unit.
  - planned: { id: "ml-pronouns", theme: "pronouns", words: 33 }
    listening_passages:
      - { id: "polite-or-not", text: { "en": "Speaking to a friend, an elder and a shopkeeper" } }
    reading_passages:
      - { id: "who-is-who", text: { "en": "A short list of people and how to address them" } }
  - planned: { id: "ml-family", theme: "family", words: 25 }
    listening_passages:
      - { id: "family-photo", text: { "en": "Someone names the people in a family photo" } }
    reading_passages:
      - { id: "family-tree", text: { "en": "A family tree with its labels" } }
  - planned: { id: "ml-numbers-1-20", theme: "numbers-1-20", words: 20 }
    listening_passages:
      - { id: "phone-number", text: { "en": "Someone reads out a phone number" } }
    reading_passages:
      - { id: "price-tags", text: { "en": "Price tags on small things" } }
  # 3. The script, after the first six units (#554: skipped by a learner
  # who already reads it). ml-script-consonants and ml-script-reading join
  # the first; ml-script-chillu joins the second.
  - planned: { id: "ml-script-vowels", grammar: "script-letters", words: 0 }
    listening_passages:
      - { id: "letter-names", text: { "en": "The vowels and consonants said in order" } }
    reading_passages:
      - { id: "first-signs", text: { "en": "Short words on shop signs, letter by letter" } }
  - planned: { id: "ml-script-vowel-signs", grammar: ["script-vowel-signs", "script-chillu"], words: 0 }
    listening_passages:
      - { id: "syllable-rows", text: { "en": "One consonant with each vowel sign, said in a row" } }
    reading_passages:
      - { id: "name-boards", text: { "en": "Name boards with chillu letters and the chandrakkala" } }
  - planned: { id: "ml-script-conjuncts", grammar: "script-conjuncts", words: 0 }
    listening_passages:
      - { id: "double-letters", text: { "en": "Words with double consonants and joined letters, said slowly" } }
    reading_passages:
      - { id: "old-and-new-letters", text: { "en": "The same words in the traditional and the reformed script" } }
  # 4. The core: about 200 common words, most common first (by judgement
  # until the Wikipedia counts are written, #516).
  - planned: { id: "ml-about-me", theme: "about-me", words: 7 }
    listening_passages:
      - { id: "introducing-myself", text: { "en": "Someone says their name, home town and work" } }
    reading_passages:
      - { id: "profile-card", text: { "en": "A short profile card" } }
  - planned: { id: "ml-verbs", theme: "everyday-verbs", words: 33 }
    listening_passages:
      - { id: "what-i-do", text: { "en": "Someone lists what they do each day" } }
    reading_passages:
      - { id: "to-do-list", text: { "en": "A short to-do list" } }
  - planned: { id: "ml-adverbs", theme: "adverbs", words: 50 }
    listening_passages:
      - { id: "how-often", text: { "en": "Saying how often and how well things are done" } }
    reading_passages:
      - { id: "habit-survey", text: { "en": "A short survey about everyday habits" } }
  - planned: { id: "ml-quantities", theme: "quantities", words: 30 }
    listening_passages:
      - { id: "a-little-more", text: { "en": "Asking for a little more and a little less" } }
    reading_passages:
      - { id: "shopping-amounts", text: { "en": "A shopping list with amounts" } }
  - planned: { id: "ml-describing", theme: "describing", words: 40 }
    listening_passages:
      - { id: "big-and-small", text: { "en": "Describing things: big, small, hot and cold" } }
    reading_passages:
      - { id: "for-sale-note", text: { "en": "A note describing something for sale" } }
  - planned: { id: "ml-time", theme: "time", words: 18 }
    listening_passages:
      - { id: "what-time", text: { "en": "Asking and telling the time" } }
    reading_passages:
      - { id: "opening-hours", text: { "en": "A shop's opening hours" } }
  - planned: { id: "ml-location", theme: "location", words: 14 }
    listening_passages:
      - { id: "where-is-it", text: { "en": "Saying where things are in a room" } }
    reading_passages:
      - { id: "room-labels", text: { "en": "Labels: on, under, inside and near" } }
  - planned: { id: "ml-more-verbs", theme: "more-verbs", words: 32 }
    listening_passages:
      - { id: "helping-out", text: { "en": "Asking someone to bring, give and keep things" } }
    reading_passages:
      - { id: "house-rules", text: { "en": "A short list of house rules" } }
  # 5. Rules as forms, practised on the words known: noun endings and
  # conjunctions first, then pronoun and verb forms.
  - planned: { id: "ml-grammar-noun-forms", grammar: ["plural", "plural-mar", "oblique", "e", "kku", "nte", "il", "ninnu", "otu"], words: 0 }
    listening_passages:
      - { id: "which-way-home", text: { "en": "Two people say where they go, with whom, and where from" } }
    reading_passages:
      - { id: "class-notice", text: { "en": "A class notice: where, with whom and when" } }
  - planned: { id: "ml-grammar-conjunctions", grammar: "conjunctions", words: 8 }
    listening_passages:
      - { id: "this-and-that", text: { "en": "Choosing this or that, and saying but and so" } }
    reading_passages:
      - { id: "two-plans", text: { "en": "A note with two plans joined by and, or and but" } }
  # ml-grammar-pronouns joins this unit.
  - planned: { id: "ml-grammar-pronoun-forms", grammar: ["pronouns", "inclusive-we", "pronoun-gen", "pronoun-dat", "pronoun-acc", "pronoun-with"], words: 0 }
    listening_passages:
      - { id: "whose-is-it", text: { "en": "Asking whose things are whose" } }
    reading_passages:
      - { id: "we-and-you", text: { "en": "A message to a group: we, all of us, and you" } }
  - planned: { id: "ml-grammar-be", grammar: ["be", "have"], words: 0 }
    listening_passages:
      - { id: "who-and-where", text: { "en": "Saying who someone is, where they are, and what they have" } }
    reading_passages:
      - { id: "is-there", text: { "en": "A note: what there is at home and what there is not" } }
  - planned: { id: "ml-grammar-verb-present", grammar: "present", words: 0 }
    listening_passages:
      - { id: "morning-at-home", text: { "en": "A family member says what she does every morning" } }
    reading_passages:
      - { id: "note-on-the-fridge", text: { "en": "A short note: what to eat and drink" } }
  - planned: { id: "ml-grammar-demonstratives", grammar: "demonstratives", words: 0 }
    listening_passages:
      - { id: "this-one-that-one", text: { "en": "Pointing at things: this one, that one, which one" } }
    reading_passages:
      - { id: "shop-labels", text: { "en": "Labels in a shop: this here, that there" } }
  # 6. Sentences, each after its words and rules; then the other A1
  # themes, each its words, its rules, then its sentences.
  - planned: { id: "ml-work", theme: "work", words: 19 }
    listening_passages:
      - { id: "what-do-you-do", text: { "en": "People say what work they do" } }
    reading_passages:
      - { id: "name-tags", text: { "en": "Name tags at a meeting: who is who and what they do" } }
  - planned: { id: "ml-numbers-big", theme: "numbers-big", words: 13 }
    listening_passages:
      - { id: "how-much-is-it", text: { "en": "Prices said aloud at a stall" } }
    reading_passages:
      - { id: "bill", text: { "en": "A shop bill with its total" } }
  # ml-food-sentences joins this unit.
  - planned: { id: "ml-food", theme: "food", words: 64 }
    listening_passages:
      - { id: "at-the-tea-shop", text: { "en": "Ordering tea and a snack at a tea shop" } }
    reading_passages:
      - { id: "menu-board", text: { "en": "A menu board with dishes and prices" } }
  # ml-grammar-needs follows this unit.
  - planned: { id: "ml-groceries", theme: "groceries", words: 16 }
    listening_passages:
      - { id: "what-we-need", text: { "en": "Two people say what they need from the shop" } }
    reading_passages:
      - { id: "grocery-list", text: { "en": "A grocery list" } }
  - planned: { id: "ml-grammar-needs", grammar: "needs" }
    listening_passages:
      - { id: "needs-heard", text: { "en": "A short exchange that uses needs, after the groceries unit" } }
    reading_passages:
      - { id: "needs-read", text: { "en": "A short text that uses needs, after the groceries unit" } }
  # ml-grammar-nouns follows this unit.
  - planned: { id: "ml-market", theme: "market", words: 7 }
    listening_passages:
      - { id: "at-the-market", text: { "en": "Buying fish and vegetables at a market" } }
    reading_passages:
      - { id: "market-board", text: { "en": "A market stall's board" } }
  - planned: { id: "ml-grammar-nouns", grammar: "noun-classes" }
    listening_passages:
      - { id: "noun-classes-heard", text: { "en": "A short exchange that uses noun classes, after the market unit" } }
    reading_passages:
      - { id: "noun-classes-read", text: { "en": "A short text that uses noun classes, after the market unit" } }
  - planned: { id: "ml-grammar-questions", grammar: "questions", words: 0 }
    listening_passages:
      - { id: "asking-the-way", text: { "en": "Asking a stranger short questions" } }
    reading_passages:
      - { id: "a-form-to-fill", text: { "en": "A short form: name, age and where you live" } }
  - planned: { id: "ml-grammar-likes", grammar: "likes", words: 2 }
    listening_passages:
      - { id: "what-do-you-like", text: { "en": "Friends say what they like and do not like" } }
    reading_passages:
      - { id: "likes-poll", text: { "en": "A poll of favourite foods" } }
  # ml-pronouns-sentences, ml-verbs-sentences and ml-noun-forms-sentences
  # join this unit.
  - planned: { id: "ml-grammar-sentences", grammar: "sentences", words: 0 }
    listening_passages:
      - { id: "introducing-friends", text: { "en": "Introducing two friends: who is who, he and she" } }
    reading_passages:
      - { id: "a-short-diary", text: { "en": "A few lines about a day: who did what, and where" } }
  # ml-grammar-continuous follows this unit.
  - planned: { id: "ml-directions", theme: "directions", words: 12 }
    listening_passages:
      - { id: "turn-left", text: { "en": "Directions to a temple: left, right and straight on" } }
    reading_passages:
      - { id: "street-signs", text: { "en": "Street signs and an arrow board" } }
  - planned: { id: "ml-grammar-continuous", grammar: "continuous" }
    listening_passages:
      - { id: "continuous-heard", text: { "en": "A short exchange that uses continuous, after the directions unit" } }
    reading_passages:
      - { id: "continuous-read", text: { "en": "A short text that uses continuous, after the directions unit" } }
  - planned: { id: "ml-transport", theme: "transport", words: 8 }
    listening_passages:
      - { id: "auto-fare", text: { "en": "Agreeing a fare with an auto driver" } }
    reading_passages:
      - { id: "bus-board", text: { "en": "The destination board on a bus" } }
  # ml-body-sentences joins this unit.
  - planned: { id: "ml-body", theme: "body", words: 28 }
    listening_passages:
      - { id: "where-it-hurts", text: { "en": "Pointing to where it hurts" } }
    reading_passages:
      - { id: "exercise-poster", text: { "en": "A poster of simple exercises" } }
  # ml-places-sentences joins this unit.
  - planned: { id: "ml-places", theme: "places", words: 42 }
    listening_passages:
      - { id: "town-walk", text: { "en": "A guide names the places on a short walk through town" } }
    reading_passages:
      - { id: "map-labels", text: { "en": "Labels on a simple town map" } }
  - planned: { id: "ml-things", theme: "things", words: 39 }
    listening_passages:
      - { id: "packing-a-bag", text: { "en": "Two people pack a bag for a trip" } }
    reading_passages:
      - { id: "lost-property-list", text: { "en": "A lost-property list at a bus station" } }
  # ml-things-sentences and ml-more-verbs-sentences join this unit.
  - planned: { id: "ml-home", theme: "home", words: 19 }
    listening_passages:
      - { id: "kitchen-instructions", text: { "en": "Someone tells a helper what to do in the kitchen" } }
    reading_passages:
      - { id: "how-to-card", text: { "en": "A short how-to card for making tea" } }
  # ml-quantities-sentences joins this unit.
  - planned: { id: "ml-grammar-differences", grammar: "differences", words: 6 }
