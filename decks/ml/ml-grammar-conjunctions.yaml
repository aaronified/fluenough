    bases: "self"
    examples:
      - target: "അമ്മയും അച്ഛനും ഇവിടെ ഉണ്ട്."
        reading: "ammayuṁ acchanuṁ iviṭe uṇṭ."
        ipa: "əmməjum ətʃtʃənum iʋiʈe uɳʈ"
        bases: [{ word: "അമ്മയും", ref: "ml-0071" }, { word: "അച്ഛനും", ref: "ml-0070" }, { word: "ഇവിടെ", ref: "ml-0048" }, { word: "ഉണ്ട്", base: "ഉണ്ട്", reading: "uṇṭ" }]
