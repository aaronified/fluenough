  - id: "ml-0740"
    target: "പക്ഷേ"
    reading: "pakṣē"
    ipa: "pəkʂeː"
    pos: "other"
    notes:
      - { id: "n1", kind: "usage" }
    bases: "self"
    examples:
      - target: "ഞാൻ വരും, പക്ഷേ എനിക്ക് സമയം ഇല്ല."
        reading: "ñāṉ varuṁ, pakṣē enikk samayaṁ illa."
        ipa: "ɲaːn ʋəɾum pəkʂeː enikk səməjam illa"
        bases: [{ word: "ഞാൻ", ref: "ml-0003" }, { word: "വരും", base: "വരിക", reading: "varika" }, { word: "പക്ഷേ", base: "പക്ഷേ", reading: "pakṣē" }, { word: "എനിക്ക്", ref: "ml-0107" }, { word: "സമയം", ref: "ml-0137" }, { word: "ഇല്ല", ref: "ml-0002" }]
      - target: "വീട് വലുതാണ്, പക്ഷേ പഴയതാണ്."
        reading: "vīṭ valutāṇ, pakṣē paḻayatāṇ."
        ipa: "ʋiːʈ ʋəlut̪aːɳ pəkʂeː pəɻəjət̪aːɳ"
        bases: [{ word: "വീട്", ref: "ml-0009" }, { word: "വലുതാണ്", ref: "ml-0008" }, { word: "പക്ഷേ", base: "പക്ഷേ", reading: "pakṣē" }, { word: "പഴയതാണ്", ref: "ml-0478" }]
