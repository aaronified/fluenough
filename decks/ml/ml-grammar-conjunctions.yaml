    examples:
      - target: "ചായ വേണം. കൂടാതെ ഒരു പഴവും വേണം."
        reading: "cāya vēṇaṁ. kūṭāte oru paḻavuṁ vēṇaṁ."
        ipa: "tʃaːja ʋeːɳam kuːʈaːt̪e oɾu pəɻəʋum ʋeːɳam"
