      - target: "അരി വേണം. കൂടാതെ പാലും വേണം."
        reading: "ari vēṇaṁ. kūṭāte pāluṁ vēṇaṁ."
        ipa: "əɾi ʋeːɳam kuːʈaːt̪e paːlum ʋeːɳam"
