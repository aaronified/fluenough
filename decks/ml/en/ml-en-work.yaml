id: "ml-en-work"
kind: "layer"
core: "ml-work"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Work"
description: "Jobs and workplaces: office, hospital, school, teacher, doctor, nurse, farmer, cook, trader, mechanic, engineer, policeman, bank, factory, work, salary, student and worker. Not yet checked by a Malayalam speaker: please report any mistake."
