tags: ["unreviewed"]
cards:
  "ml-0185":
    native: "office"
    notes:
      n1: "office"
    examples:
      "ഓഫീസ് ഇവിടെ.":
        native: "The office is here."
      "ഞാൻ ഓഫീസിൽ പോകുന്നു":
        native: "I go to the office."
        bases:
          "പോകുന്നു": "go"
  "ml-0186":
    native: "hospital"
    notes:
      n1: "hospital"
    examples:
      "ആശുപത്രി എവിടെ?":
        native: "Where is the hospital?"
      "അമ്മ ആശുപത്രിയിൽ":
        native: "Mother is at the hospital."
  "ml-0187":
    native: "school"
    notes:
      n1: "school"
    examples:
      "കുട്ടി സ്കൂളിൽ പോകുന്നു":
        native: "The child goes to school."
        bases:
          "പോകുന്നു": "goes"
      "സ്കൂൾ അകലെ":
        native: "The school is far."
  "ml-0188":
    native: "teacher (man)"
    notes:
      n1: "teacher (man)"
    examples:
      "എന്റെ അച്ഛൻ അധ്യാപകൻ.":
        native: "My father is a teacher."
      "അധ്യാപകൻ ഇവിടെ.":
        native: "The teacher is here."
  "ml-0189":
    native: "teacher (woman)"
    notes:
      n1: "teacher (woman)"
    examples:
      "എന്റെ അമ്മ അധ്യാപിക.":
        native: "My mother is a teacher."
      "അധ്യാപിക വരുന്നു":
        native: "The teacher is coming."
        bases:
          "വരുന്നു": "is coming"
  "ml-0190":
    native: "doctor"
    notes:
      n1: "doctor"
    examples:
      "ഡോക്ടർ ഇവിടെ.":
        native: "The doctor is here."
      "എന്റെ ചേച്ചി ഡോക്ടർ.":
        native: "My older sister is a doctor."
  "ml-0191":
    native: "nurse"
    notes:
      n1: "nurse"
    examples:
      "ചേച്ചി നഴ്സ്.":
        native: "My older sister is a nurse."
      "നഴ്സ് ആശുപത്രിയിൽ":
        native: "The nurse is at the hospital."
  "ml-0192":
    native: "farmer"
    notes:
      n1: "farmer"
    examples:
      "അച്ഛൻ കർഷകൻ.":
        native: "Father is a farmer."
      "കർഷകൻ വയലിൽ":
        native: "The farmer is in the field."
        bases:
          "വയലിൽ": "in the field"
  "ml-0193":
    native: "cook (man)"
    notes:
      n1: "cook (man)"
    examples:
      "പാചകക്കാരൻ ഇവിടെ.":
        native: "The cook is here."
      "എന്റെ അമ്മാവൻ പാചകക്കാരൻ.":
        native: "My uncle is a cook."
  "ml-0194":
    native: "trader; shopkeeper (man)"
    notes:
      n1: "trader; shopkeeper (man)"
    examples:
      "എന്റെ ചേട്ടൻ കച്ചവടക്കാരൻ.":
        native: "My older brother is a trader."
      "കച്ചവടക്കാരൻ കടയിൽ":
        native: "The trader is in the shop."
        bases:
          "കടയിൽ": "in the shop"
  "ml-0195":
    native: "mechanic"
    notes:
      n1: "mechanic"
    examples:
      "മെക്കാനിക്ക് വണ്ടി നന്നാക്കുന്നു":
        native: "The mechanic repairs the vehicle."
        bases:
          "വണ്ടി": "vehicle"
          "നന്നാക്കുന്നു": "repairs"
      "എന്റെ ചേട്ടൻ മെക്കാനിക്ക്.":
        native: "My older brother is a mechanic."
  "ml-0196":
    native: "engineer"
    notes:
      n1: "engineer"
    examples:
      "എന്റെ ചേച്ചി എഞ്ചിനീയർ.":
        native: "My older sister is an engineer."
      "എഞ്ചിനീയർ ഓഫീസിൽ":
        native: "The engineer is at the office."
  "ml-0197":
    native: "policeman"
    notes:
      n1: "policeman"
    examples:
      "പോലീസുകാരൻ ഇവിടെ.":
        native: "The policeman is here."
      "എന്റെ അനിയൻ പോലീസുകാരൻ.":
        native: "My younger brother is a policeman."
  "ml-0198":
    native: "bank"
    notes:
      n1: "bank"
    examples:
      "ബാങ്ക് എവിടെ?":
        native: "Where is the bank?"
      "ഞാൻ ബാങ്കിൽ പോകുന്നു":
        native: "I go to the bank."
        bases:
          "പോകുന്നു": "go"
  "ml-0199":
    native: "factory"
    notes:
      n1: "factory"
    examples:
      "ഫാക്ടറി ഇവിടെ.":
        native: "The factory is here."
      "അച്ഛൻ ഫാക്ടറിയിൽ ജോലി ചെയ്യുന്നു":
        native: "Father works at the factory."
        bases:
          "ചെയ്യുന്നു": "works"
  "ml-0200":
    native: "work; employment"
    notes:
      n1: "work; employment"
    examples:
      "നല്ല തൊഴിൽ.":
        native: "A good job."
      "തൊഴിൽ ഇല്ല.":
        native: "There is no work."
  "ml-0201":
    native: "salary; pay"
    notes:
      n1: "salary; pay"
    examples:
      "ശമ്പളം നല്ലത്":
        native: "The salary is good."
      "ശമ്പളം എത്ര?":
        native: "How much is the salary?"
  "ml-0202":
    native: "student"
    notes:
      n1: "student"
    examples:
      "ചേട്ടൻ വിദ്യാർത്ഥി.":
        native: "My older brother is a student."
      "വിദ്യാർത്ഥി സ്കൂളിൽ":
        native: "The student is at school."
  "ml-0203":
    native: "worker (man)"
    notes:
      n1: "worker (man)"
    examples:
      "ജോലിക്കാരൻ വരുന്നു":
        native: "The worker is coming."
        bases:
          "വരുന്നു": "is coming"
      "ജോലിക്കാരൻ ഓഫീസിൽ":
        native: "The worker is at the office."
