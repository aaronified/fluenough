native:
  code: en
  iso639_3: eng
  name: English
name: 'Phrasebook: first phrases'
description: 'Twenty phrases to say whole from the first day: greetings and goodbye, thanks and sorry, asking for help, asking where the toilet is, and saying you are still learning Malayalam. Not yet checked by a Malayalam speaker: please report any mistake.'
license: CC-BY-SA-4.0
tags:
- unreviewed
cards:
  ml-0011:
    native: hello
    notes:
      n1: Said to anyone, at any time of day, with the palms pressed together.
    bases:
      നമസ്കാരം: hello
  ml-0012:
    native: goodbye (said by the one leaving)
    notes:
      n1: Literally 'I will go and come back'. The one staying says പോയി വരൂ (pōyi varū), go and come back.
    bases:
      പോയി: to go (and then)
      വരാം: to come (back)
  ml-0013:
    native: thank you; thanks
    notes:
      n1: Common and polite. Among close friends, thanks is often left out.
    bases:
      നന്ദി: thanks
  ml-0014:
    native: excuse me; sorry
    notes:
      n1: Said to get past someone, to get attention, or to apologise.
    bases:
      ക്ഷമിക്കണം: excuse me; sorry
  ml-0015:
    native: I didn't understand.
    notes:
      n1: 'എനിക്ക് (eṉikku) is ''to me'', from ഞാൻ (ñāṉ), I. The negative is in the verb: മനസ്സിലായില്ല (manassilāyilla).'
    bases:
      മനസ്സിലായില്ല: to understand
  ml-0016:
    native: Please speak slowly.
    notes:
      n1: ദയവായി (dayavāyi) is 'please'. സംസാരിക്കൂ (saṁsārikkū) is 'speak', said politely.
    bases:
      ദയവായി: please
      പതുക്കെ: slowly
      സംസാരിക്കൂ: to speak
  ml-0017:
    native: please
    notes:
      n1: Said before a request, as a polite word.
    bases:
      ദയവായി: please
  ml-0018:
    native: Help!
    notes:
      n1: Said when you need help. Say it loudly to attract attention.
    bases:
      സഹായിക്കൂ: to help
  ml-0019:
    native: Where is the toilet?
    notes:
      n1: Literally 'toilet, where?'. എവിടെ (eviṭe) means 'where'.
    bases:
      ശൗചാലയം: toilet
      എവിടെ: where
  ml-0020:
    native: How much is this?
    notes:
      n1: Literally 'for this, how much?'. എത്ര (etra) asks for a price or an amount.
    bases:
      ഇതിന്: this (for this)
      എത്ര: how much
  ml-0021:
    native: I don't know Malayalam.
    notes:
      n1: അറിയുക (aṟiyuka) is 'to know'. Its negative is അറിയില്ല (aṟiyilla).
    bases:
      മലയാളം: Malayalam
      അറിയില്ല: to know
  ml-0022:
    native: I know a little Malayalam.
    notes:
      n1: കുറച്ച് (kuṟacc) is 'a little'. അറിയാം (aṟiyāṁ) is 'I know', from അറിയുക (aṟiyuka).
    bases:
      കുറച്ച്: a little
      മലയാളം: Malayalam
      അറിയാം: to know
  ml-0023:
    native: OK; all right
    notes:
      n1: Also 'right' or 'correct'. Said to agree, or to close a topic.
    bases:
      ശരി: OK; right
  ml-0024:
    native: one moment
    notes:
      n1: Literally 'one moment'. Used to ask someone to wait.
    bases:
      ഒരു: one (before a noun)
      നിമിഷം: moment
  ml-0025:
    native: it's all right; no problem
    notes:
      n1: Said to someone who apologises, or to refuse something politely.
    bases:
      കുഴപ്പമില്ല: it's all right
  ml-0026:
    native: One tea, please.
    notes:
      n1: ചായ (cāya) is tea. Say it when you order.
    bases:
      ഒരു: one (before a noun)
      ചായ: tea
      ദയവായി: please
  ml-0027:
    native: Say it again.
    notes:
      n1: Said when you did not catch what was said. വീണ്ടും (vīṇṭuṁ) means 'again'.
    bases:
      വീണ്ടും: again
      പറയൂ: to say
  ml-0028:
    native: Thanks for the help.
    notes:
      n1: Literally 'thanks for the help'. സഹായം (sahāyaṁ) is 'help'.
    bases:
      സഹായത്തിന്: help
      നന്ദി: thanks
  ml-0029:
    native: OK, thanks.
    notes:
      n1: A quick way to say that something is fine and to thank someone.
    bases:
      ശരി: OK; right
      നന്ദി: thanks
  ml-0030:
    native: Let's go.
    notes:
      n1: പോകാം (pōkāṁ) is 'let's go', from പോകുക (pōkuka), to go.
    bases:
      പോകാം: to go
