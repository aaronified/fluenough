kind: "layer"
core: "ml-grammar-pronoun-forms"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Pronouns: my, to, with"
description: "How I, you, he, she, it, we, they and who change before a noun, and with to, the one acted on and with. Not yet checked by a Malayalam speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "gen": "{meaning}: of, the form before a noun"
    "dat": "{meaning}: to, for"
    "acc": "{meaning}: the one acted on"
    "with": "{meaning}: with"
rules:
  "ml-rule-pronoun-gen":
    name: "Of: my, your, her (before a noun)"
    explanation: "Before a noun the pronoun changes: {1}, I, becomes {2}, {3}, you, becomes {4}, and {5}, she, becomes {6}. A word in -ൾ (-ḷ) takes -ഉടെ (-uṭe), as {6}; a thing takes -ിന്റെ (-inṟe): {7}, that, becomes {8}. Examples: എന്റെ കുടുംബം (enṟe kuṭuṁbaṁ), my family; നിങ്ങളുടെ പേര് (niṅṅaḷuṭe pēr), your name. Source: English Wikipedia, Malayalam grammar (the declension of the pronouns)."
  "ml-rule-pronoun-dat":
    name: "-ക്ക് (-kk), -ന് (-n): to, for"
    explanation: "{1}, I, becomes {2}, to me, {3} becomes {4}, and {5}, she, becomes {6}; {7}, he, becomes {8}. Malayalam uses this form for what someone has, likes, needs or knows: എനിക്ക് ഒരു പുസ്തകം ഉണ്ട് (enikk oru pustakaṁ uṇṭ), I have a book. Source: English Wikipedia, Malayalam grammar (the declension of the pronouns)."
  "ml-rule-pronoun-acc":
    name: "-എ (-e): the one acted on"
    explanation: "{1}, I, becomes {2}, {3}, you, becomes {4}, and {5}, they, or he or she in polite speech, becomes {6}: the person the verb acts on. The ending is -എ (-e). The stems of {1} and {3} change, to എന്ന (enna) and നിന്ന (ninna). Source: English Wikipedia, Malayalam grammar (the declension of the pronouns)."
  "ml-rule-pronoun-with":
    name: "-ഓട് (-ōṭ): with, to"
    explanation: "{1}, I, becomes {2}, with me, {3} becomes {4}, and {5}, we including you, becomes {6}, with us. After a word for speaking it means to a person: അമ്മയോട് പറയൂ (ammayōṭ paṟayū), tell mother. Source: English Wikipedia, Malayalam grammar (the declension of the pronouns; the sociative case)."
