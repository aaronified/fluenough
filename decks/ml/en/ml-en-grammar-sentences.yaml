  entries:
    "kudikkuka": "to drink"
    "kazhikkuka": "to eat"
    "vangunka": "to buy"
    "vayikkuka": "to read"
    "thurakkuka": "to open"
    "vilikkuka": "to call"
  notes: "The verb comes last: doer, thing, verb, so ഞാൻ ചായ കുടിക്കുന്നു (ñāṉ cāya kuṭikkunnu) is, word for word, I tea drink. The verb does not change for the doer: കുടിക്കുന്നു (kuṭikkunnu) serves I, you, he and she. A person or an animal that is acted on takes the ending -എ (-e), as അമ്മയെ (ammaye), mother, the one called, while a thing usually takes none, as ചായ (cāya). A word that describes comes before the word it describes. There is no word for the, and ആണ് (āṇ), is, joins the word before it when you say what something is. Source: English Wikipedia, Malayalam grammar (the order subject, object, verb; the accusative -എ (-e))."
