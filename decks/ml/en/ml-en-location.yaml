schema: 1
id: "ml-en-location"
kind: "layer"
core: "ml-location"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Location"
description: "Where things are: on top, under, inside, outside, near, far, in front, behind, between, beside, there, in a corner, in the middle and opposite. Not yet checked by a Malayalam speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ml-0139":
    native: "on top; above"
    notes:
      n1: "The place above something. With a noun in the genitive it means on it: മേശയുടെ (meśayuṭe) മുകളിൽ (mukaḷil), on the table."
    examples:
      "മേശയുടെ മുകളിൽ.":
        native: "On the table."
        bases:
          "മേശയുടെ": "the table's"
          "മുകളിൽ": "on top; above"
      "പുസ്തകം മുകളിൽ.":
        native: "The book is on top."
        bases:
          "പുസ്തകം": "book"
          "മുകളിൽ": "on top; above"
  "ml-0140":
    native: "under; below; down"
    notes:
      n1: "The place below something, as in under the chair."
    examples:
      "കസേരയുടെ താഴെ.":
        native: "Under the chair."
        bases:
          "കസേരയുടെ": "the chair's"
          "താഴെ": "under; below; down"
      "പുസ്തകം മേശയുടെ താഴെ.":
        native: "The book is under the table."
        bases:
          "പുസ്തകം": "book"
          "മേശയുടെ": "the table's"
          "താഴെ": "under; below; down"
  "ml-0141":
    native: "inside"
    notes:
      n1: "Inside a place. The genitive comes before it, as in പെട്ടിയുടെ (peṭṭiyuṭe) അകത്ത് (akatt), inside the box."
    examples:
      "പെട്ടിയുടെ അകത്ത്.":
        native: "Inside the box."
        bases:
          "പെട്ടിയുടെ": "the box's"
          "അകത്ത്": "inside"
      "വീടിന്റെ അകത്ത്.":
        native: "Inside the house."
        bases:
          "അകത്ത്": "inside"
  "ml-0142":
    native: "outside"
    notes:
      n1: "Outside a place, the opposite of inside."
    examples:
      "വീടിന്റെ പുറത്ത്.":
        native: "Outside the house."
        bases:
          "പുറത്ത്": "outside"
      "പുറത്ത് പോകാം":
        native: "Let's go outside."
        bases:
          "പുറത്ത്": "outside"
          "പോകാം": "go"
  "ml-0143":
    native: "near; next to"
    notes:
      n1: "Close to a place, with no gap between them."
    examples:
      "സ്കൂളിന്റെ അടുത്ത്.":
        native: "Near the school."
        bases:
          "സ്കൂളിന്റെ": "the school's"
          "അടുത്ത്": "near; next to"
      "വീടിന്റെ അടുത്ത് കട.":
        native: "A shop near the house."
        bases:
          "അടുത്ത്": "near; next to"
          "കട": "shop"
  "ml-0144":
    native: "far; far away"
    notes:
      n1: "A long way off. The opposite of അടുത്ത് (aṭutt), near."
    examples:
      "കടൽ അകലെ.":
        native: "The sea is far."
        bases:
          "കടൽ": "sea"
          "അകലെ": "far; far away"
      "സ്കൂൾ അകലെ.":
        native: "The school is far away."
        bases:
          "സ്കൂൾ": "school"
          "അകലെ": "far; far away"
  "ml-0145":
    native: "in front"
    notes:
      n1: "In front of something. The opposite is പിന്നിൽ (pinnil), behind."
    examples:
      "വീടിന്റെ മുന്നിൽ.":
        native: "In front of the house."
        bases:
          "മുന്നിൽ": "in front"
      "വണ്ടി മുന്നിൽ.":
        native: "The vehicle is in front."
        bases:
          "വണ്ടി": "vehicle"
          "മുന്നിൽ": "in front"
  "ml-0146":
    native: "behind"
    notes:
      n1: "At the back of something."
    examples:
      "വീടിന്റെ പിന്നിൽ.":
        native: "Behind the house."
        bases:
          "പിന്നിൽ": "behind"
      "പൂച്ച കസേരയുടെ പിന്നിൽ.":
        native: "The cat is behind the chair."
        bases:
          "പൂച്ച": "cat"
          "കസേരയുടെ": "the chair's"
          "പിന്നിൽ": "behind"
  "ml-0147":
    native: "between; among"
    notes:
      n1: "Between two things, or among several."
    examples:
      "രണ്ട് വീടുകളുടെ ഇടയിൽ കട.":
        native: "A shop between two houses."
        bases:
          "വീടുകളുടെ": "the houses'"
          "ഇടയിൽ": "between; among"
          "കട": "shop"
      "പേന പുസ്തകങ്ങൾക്ക് ഇടയിൽ.":
        native: "The pen is among the books."
        bases:
          "പേന": "pen"
          "പുസ്തകങ്ങൾക്ക്": "among the books"
          "ഇടയിൽ": "between; among"
  "ml-0148":
    native: "at the side; beside"
    notes:
      n1: "Beside something, on one of its sides."
    examples:
      "മേശയുടെ വശത്ത്.":
        native: "At the side of the table."
        bases:
          "മേശയുടെ": "the table's"
          "വശത്ത്": "at the side; beside"
      "കസേര മേശയുടെ വശത്ത്.":
        native: "The chair is beside the table."
        bases:
          "കസേര": "chair"
          "മേശയുടെ": "the table's"
          "വശത്ത്": "at the side; beside"
  "ml-0149":
    native: "there"
    notes:
      n1: "That place, away from the speaker. The pair of ഇവിടെ (iviṭe), here."
    examples:
      "അവിടെ പോകൂ.":
        native: "Go there."
        bases:
          "അവിടെ": "there"
      "പുസ്തകം അവിടെ.":
        native: "The book is there."
        bases:
          "പുസ്തകം": "book"
          "അവിടെ": "there"
  "ml-0150":
    native: "in the corner"
    notes:
      n1: "In the angle where two walls meet."
    examples:
      "മുറിയുടെ കോണിൽ.":
        native: "In the corner of the room."
        bases:
          "മുറിയുടെ": "the room's"
          "കോണിൽ": "in the corner"
      "കസേര മുറിയുടെ കോണിൽ.":
        native: "The chair is in the corner of the room."
        bases:
          "കസേര": "chair"
          "മുറിയുടെ": "the room's"
          "കോണിൽ": "in the corner"
  "ml-0151":
    native: "in the middle"
    notes:
      n1: "At the centre of a place."
    examples:
      "മുറിയുടെ നടുവിൽ.":
        native: "In the middle of the room."
        bases:
          "മുറിയുടെ": "the room's"
          "നടുവിൽ": "in the middle"
      "മേശ മുറിയുടെ നടുവിൽ.":
        native: "The table is in the middle of the room."
        bases:
          "മേശ": "table"
          "മുറിയുടെ": "the room's"
          "നടുവിൽ": "in the middle"
  "ml-0152":
    native: "opposite"
    notes:
      n1: "On the other side of the road or the space, facing something."
    examples:
      "വീടിന് എതിരെ.":
        native: "Opposite the house."
        bases:
          "എതിരെ": "opposite"
      "പള്ളിക്ക് എതിരെ കട.":
        native: "A shop opposite the church."
        bases:
          "പള്ളിക്ക്": "the church"
          "എതിരെ": "opposite"
          "കട": "shop"
