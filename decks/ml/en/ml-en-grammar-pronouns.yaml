pattern:
  name: "Personal pronouns"
  slot_name: "number"
  slots:
    "one": "one"
    "more": "more than one"
  entries:
    "njaan": "I"
    "nee": "you, to a friend or a child"
    "ningal": "you, polite"
    "avan": "he"
    "aval": "she"
    "athu": "it, that"
  notes: "Malayalam has two plurals of ഞാൻ (ñāṉ): ഞങ്ങൾ (ñaṅṅaḷ) leaves out the person you speak to and നമ്മൾ (nammaḷ) includes them. നിങ്ങൾ (niṅṅaḷ) is you for several people and also, with respect, for one person; നീ (nī) is for a friend or a child. അവൻ (avaṉ) is a man and അവൾ (avaḷ) a woman; both have the plural അവർ (avar), which is also respectful for one person. A thing or an animal is അത് (at), and several are അവ (ava). Source: English Wikipedia, Malayalam grammar (the personal pronouns)."
