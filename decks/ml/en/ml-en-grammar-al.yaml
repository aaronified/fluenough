    "al": "by {meaning} (written): the ending -ആൽ (-āl)"
  entries:
    "pena": "pen"
    "kai": "hand"
    "katti": "knife"
    "maram": "tree; wood"
  notes: "-ആൽ (-āl) says by what means or tool something is done, as in പേനയാൽ (pēnayāl), with a pen. It is written, and it joins the noun as the other endings do: after a vowel with a glide, as പേന (pēna) becomes പേനയാൽ (pēnayāl), and a word in -ം (-ṁ) changes it to -ത്ത് (-tt), as മരം (maraṁ) becomes മരത്താൽ (marattāl). In speech the word കൊണ്ട് (koṇṭ) is used after the plain noun: പേന കൊണ്ട് (pēna koṇṭ). For a vehicle Malayalam says in, with the ending -ഇൽ (-il), as ബസിൽ (basil). Source: English Wikipedia, Malayalam grammar (the instrumental case, the declension of മരം (maraṁ))."
