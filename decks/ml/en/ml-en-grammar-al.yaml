name: "By and with: കൊണ്ട് (koṇṭ) and -ആൽ (-āl)"
description: "By a pen, by hand, with a knife: the spoken word കൊണ്ട് (koṇṭ) and the written ending -ആൽ (-āl). Not yet checked by a Malayalam speaker: please report any mistake."
