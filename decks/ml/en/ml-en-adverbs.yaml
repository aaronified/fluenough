tags: ["unreviewed"]
cards:
  "ml-0508":
    native: "sometimes; now and then"
    notes:
      n1: "sometimes; now and then"
    examples:
      "ഇടയ്ക്ക് ചായ കുടിക്കും":
        native: "I drink tea sometimes."
        bases:
          "ഇടയ്ക്ക്": "sometimes; now and then"
      "ഇടയ്ക്ക് മഴയുണ്ട്.":
        native: "It rains now and then."
        bases:
          "ഇടയ്ക്ക്": "sometimes; now and then"
          "മഴയുണ്ട്": "it rains"
  "ml-0509":
    native: "always"
    notes:
      n1: "always"
    examples:
      "അവൻ എപ്പോഴും ജോലി ചെയ്യും":
