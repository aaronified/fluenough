schema: 1
id: "ml-en-adverbs"
kind: "layer"
core: "ml-adverbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Adverbs"
description: "How often, how well and when: sometimes, always, never, often, very, only, still, already, again, together, alone, well, badly, quickly, slowly, every day, first, then, soon, suddenly, about, usually, not at all, really and so. Not yet checked by a Malayalam speaker: please report any mistake."
