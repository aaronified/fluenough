schema: 1
id: "ml-en-about-me"
kind: "layer"
core: "ml-about-me"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "About me"
description: "Saying your name, your age, where you are from, your work and where you are now. Not yet checked by a Malayalam speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ml-0042":
    native: "name"
    notes:
      n1: "A name, as in my name is."
    examples:
      "എന്റെ പേര് രവി.":
        native: "My name is Ravi."
        bases:
          "പേര്": "name"
          "രവി": "Ravi"
      "പേര് എന്ത്?":
        native: "What is the name?"
        bases:
          "പേര്": "name"
  "ml-0043":
    native: "my"
    notes:
      n1: "The word for my. It comes before the thing that is owned."
    examples:
      "എന്റെ വീട്.":
        native: "My house."
      "ഇത് എന്റെ വീടാണ്.":
        native: "This is my house."
        bases:
          "ഇത്": "this"
  "ml-0044":
    native: "age"
    notes:
      n1: "How old someone is, in years."
    examples:
      "എന്റെ വയസ്സ് ഇരുപത്.":
        native: "My age is twenty."
        bases:
          "വയസ്സ്": "age"
      "നിങ്ങളുടെ വയസ്സ് എത്ര?":
        native: "How old are you?"
        bases:
          "വയസ്സ്": "age"
  "ml-0045":
    native: "home country; home town"
    notes:
      n1: "The place a person comes from."
    examples:
      "എന്റെ നാട് കേരളം.":
        native: "My home is Kerala."
        bases:
          "നാട്": "home country"
          "കേരളം": "Kerala"
      "നാട് എവിടെ?":
        native: "Where is your home?"
        bases:
          "നാട്": "home country"
  "ml-0046":
    native: "job; work"
    notes:
      n1: "The work a person does for money."
    examples:
      "എന്റെ ജോലി ഡോക്ടർ.":
        native: "My job is doctor."
        bases:
          "ജോലി": "job"
          "ഡോക്ടർ": "doctor"
      "നിങ്ങളുടെ ജോലി എന്ത്?":
        native: "What is your job?"
        bases:
          "ജോലി": "job"
  "ml-0047":
    native: "place"
    notes:
      n1: "A place or a spot, as in a good place."
    examples:
      "ഇത് നല്ല സ്ഥലം.":
        native: "This is a good place."
        bases:
          "ഇത്": "this"
          "സ്ഥലം": "place"
      "ഇത് ഏത് സ്ഥലം?":
        native: "Which place is this?"
        bases:
          "ഇത്": "this"
          "സ്ഥലം": "place"
  "ml-0048":
    native: "here"
    notes:
      n1: "The place where the speaker is."
    examples:
      "ഞാൻ ഇവിടെ.":
        native: "I am here."
        bases:
          "ഇവിടെ": "here"
      "ഇവിടെ വെള്ളം ഉണ്ട്.":
        native: "There is water here."
        bases:
          "ഇവിടെ": "here"
          "ഉണ്ട്": "is"
