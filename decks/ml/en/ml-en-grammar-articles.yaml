schema: 1
id: "ml-en-grammar-articles"
kind: "layer"
core: "ml-grammar-articles"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "A and the: ഒരു (oru)"
description: "Malayalam has no the and uses ഒരു (oru) for a. Not yet checked by a Malayalam speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar", "unreviewed"]
pattern:
  name: "No articles"
  slot_name: "form"
  slots:
    "a": "a, an: ഒരു (oru) before the noun"
    "the": "the: a bare noun"
  entries:
    "veedu": "house"
    "pena": "pen"
    "kutti": "child"
    "mesa": "table"
    "aal": "person"
  notes: "Malayalam has no word for the. A noun on its own means the one you both know, or the thing in general: വീട് (vīṭ). ഒരു (oru), one, is used as a: ഒരു വീട് (oru vīṭ), a house. Before a word that starts with a vowel the two join: ഒരു (oru) plus ആൾ (āḷ) is ഒരാൾ (orāḷ), a person. Source: English Wiktionary, the entry ഒരു (oru) (one) and its use before ആൾ (āḷ)."
