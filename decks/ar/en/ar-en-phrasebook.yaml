description: "Twenty things to say from the first day, in Modern Standard Arabic (readings in the ALA-LC style, short vowels written out), before their words are taught: greetings, goodbyes, thanks and sorry, please, the way to say you do not understand, to ask a price or a place, to ask for help, and how to say your name. Forms said to a man are marked. Not yet checked by an Arabic speaker: please report any mistake."
