# The order Urdu is taught in, one unit per line, from every language it
# is taught from: each deck is named by its core id, and a learner from
# English is taught ur-en-home for ur-home (ADR-0013, ADR-0036).
#
# This is Urdu's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"; issue #571),
# written before any Urdu deck: every unit from the first words to B1 is
# planned, with its size in words, its grammar topics, the three milestones
# and its listening and reading passages. The course teaches every unit as
# "Coming" until its first deck is written; the unit's `planned` then turns
# into `decks` in the same change. Sizes follow the plan's levels (about
# 700, 900 and 1,200 words; low confidence) and are one number for every
# native language. Urdu is FSI tier IV (1,100 hours, on the FSI list:
# docs/plans/language-paths-scheme.md); the tier sets the pacing, in days,
# not the words a level needs, so the sizes are near Hindi's. A theme named
# here that decks/themes.yaml does not list yet is added to it with its
# first deck.
#
# A planned unit names one core id. Where a unit will hold more than one
# deck, as Hindi's do, the comment above it names the others: they join the
# unit when they are written. Sentence decks have no theme, so they are not
# planned units of their own: each joins the unit named in its comment,
# after its words and rules.
#
# The order follows docs/plans/words-rules-sentences.md (owner, 2026-10-07,
# and 2026-10-17: "build the path files for all present languages via an
# opus agent, as per our current path design"), Hindi's path as the closest
# model ("Spoken grammar ≈ Hindi; add Perso-Arabic vocabulary"), and the
# Indo-Aryan order of docs/plans/language-paths-scheme.md: aspirated and
# retroflex sounds, the script, greetings, numbers, pronouns with their
# levels of formality, be, postpositions, the present, gender agreement,
# the oblique, the past with its ergative ne, compound and conjunct verbs,
# then the subjunctive, the relative-correlative clauses and the rest of B1:
# 1. the phrasebook, taught whole from the first lesson;
# 2. the first word units;
# 3. the script, after the first six units ("After units 4-6"); a learner
#    who already reads it skips it (#554);
# 4. a core of about 200 common words in themed units ("Yes, smaller
#    (~200)"), by judgement, most common first, until Urdu Wikipedia's
#    counts are written (tools/wikipedia_frequency.py, #516);
# 5. rules as forms: noun forms (gender, the plural), postpositions and
#    conjunctions, then pronoun and verb forms, agreement and the oblique,
#    practised on known words;
# 6. sentences, each after its words and rules; then the other themes, each
#    its words, its rules, then its sentences.
#
# What is Urdu's own, against Hindi's model:
# - The sounds unit drills, beside the aspirates and the retroflex row (ٹ
#   (ṭ) against ت (t), ڈ (ḍ) against د (d), and ڑ (ṛ)), the five sounds
#   Urdu has from Persian and Arabic: ق (q) against ک (k), خ (k͟h) against
#   کھ (kh), غ (ġ) against گ (g), ز (z) against ج (j), and ف (f) against
#   پھ (ph). Hindi teaches them only as letters with a nukta; in Urdu they
#   are everyday sounds, as in خدا حافظ (k͟hudā hāfiz).
# - The script is Perso-Arabic (`arabic`, named "Perso-Arabic" by its own
#   name, #551), written right to left in the Nastaliq style. Its first
#   unit teaches the letters and their joining forms: most letters take an
#   initial, a medial, a final and an alone form, as ب (b) does in بات
#   (bāt) and کتاب (kitāb), and nine join only to the letter before them
#   (ا د ڈ ذ ر ڑ ز ژ و). Its second unit teaches the vowels: the short
#   vowels are left unwritten, so کتاب (kitāb) is written k-t-ā-b, and
#   their marks, زبر (zabar, a), زیر (zer, i) and پیش (peś, u), appear only
#   in teaching texts; the long vowels are written with ا (ā), و (ū, ō,
#   au), ی (ī) and ے (ē, ai). It also teaches ں (nūn ġunna) for a nasal
#   vowel, ھ (do-cashmī he) for the aspirates against ہ (h), ء (hamza), ع
#   (ʿain), the doubling mark ّ (taśdīd), and the izafat: the -e- that
#   joins two Persian words, written with a zer, وزیرِ اعظم (vazīr-e aʿzam,
#   "prime minister"), with ۂ after a silent he, نقطۂ نظر (nuqta-e nazar,
#   "point of view"), and with ئے after a long vowel, دریائے سندھ (dariyā-e
#   sindh, "the river Indus").
# - Gender agreement is taught early, as the scheme orders: a noun is
#   masculine or feminine, and a borrowed Persian or Arabic noun takes one
#   of the two, with no ending to show it: کتاب (kitāb, "book") is
#   feminine, مکان (makān, "house") masculine. Adjectives in -ā and the
#   verb agree: اچھا لڑکا (acchā laṛkā, "a good boy"), اچھی لڑکی (acchī
#   laṛkī, "a good girl").
# - The ergative نے (ne) in the past of a transitive verb, with the verb
#   agreeing with its object, not its subject: لڑکی نے روٹی کھائی (laṛkī ne
#   roṭī khāī, "the girl ate the bread", feminine for روٹی (roṭī)). With
#   کو (ko) on the object, the verb takes the masculine singular.
# - Persian and Arabic loan patterns, in two units of their own. In A2,
#   Persian word-building: بے- (bē-, "without"), نا- (nā-, "un-"), -دار
#   (-dār, "holder": دکاندار (dukāndār, "shopkeeper")), -خانہ (-k͟hāna,
#   "house of": ڈاکخانہ (ḍākk͟hāna, "post office")), the abstract -ی (-ī),
#   the izafat as grammar, and the Persian "and", -o-, in pairs such as صبح
#   و شام (subh-o-śām, "morning and evening"). In B1, Arabic roots and
#   plurals: one root's family, علم (ʿilm, "knowledge"), عالم (ʿālim,
#   "scholar"), معلوم (maʿlūm, "known"), تعلیم (taʿlīm, "education"); the
#   plural -ات (-āt), کاغذات (kāġazāt, "papers"); and the broken plural,
#   خبر (k͟habar, "news") and اخبار (ak͟hbār, "newspaper").
# - Conjunct verbs are where the borrowed nouns are used most: انتظار کرنا
#   (intizār karnā, "to wait"), شروع کرنا (śurūʿ karnā, "to begin").
# - The registers unit in B1 sets the Perso-Arabic words of formal Urdu
#   beside the everyday words Urdu shares with Hindi, and the honorifics
#   teach Urdu's polite forms, such as تشریف رکھیے (taśrīf rakhiye, "please
#   sit down").
# - Numbers 1 to 100 are learnt as words, as Hindi's are, and are written
#   with Urdu's own digits, ۱ ۲ ۳ (1, 2, 3).
#
# No Urdu deck is written yet, so the path lists no deck and `alphabet` is
# empty: the validator takes only written decks there. When the script
# decks are written, `alphabet` lists ur-script-letters,
# ur-script-joining, ur-script-reading, ur-script-vowels,
# ur-script-marks, ur-spelling and the first reader, and the two script
# units become lists of them, as Hindi's are. Until then each script unit
# is planned with grammar topics, since a planned unit names a theme or a
# grammar topic. Spelling and the first reader come after B1, as Hindi's
# do; they are added to the path when written, since nothing is planned
# after B1.
schema: 1
kind: "path"
id: "ur-path"
language: "ur"
# The gender classes a noun's gender is one of (#512; DECK-FORMAT.md, Card
# data): masculine and feminine, as Hindi's. Urdu has no neuter, and every
# noun, a borrowed one too, is one of the two; adjectives in -ā, the
# possessive کا (kā) and the verb agree with it (کا (kā), کی (kī), کے
# (ke)).
genders: ["m", "f"]
# Where Urdu is spoken, for a rater's region and a card's region note
# (ADR-0036): the main areas where it is spoken, each named with example
# cities so that a rater can place themselves. In Pakistan, Karachi, where
# most of the speakers who have Urdu as their first language live, first,
# since the course teaches the standard of Pakistan's schools and media;
# then Pakistani Punjab and Islamabad, where most people speak Urdu beside
# Punjabi. In India, the two old centres of the language, Delhi (Dehlavi)
# and Lucknow (Lakhnavi), as two regions, since their speech and usage
# differ and an id can be merged by its name later but never split; then
# Deccani, the Urdu of Hyderabad and the Deccan, the most different of
# them, with words such as نکو (nakko, "don't") and ہاؤ (hāu, "yes").
# Low confidence at the edges: a native reviewer checks this list before
# any rating names a region. The ids are permanent, as card ids are;
# rename a name, never an id. The app adds "Elsewhere" after them.
regions:
  - id: "karachi"
    name: { "en": "Karachi and urban Sindh, Pakistan" }
  - id: "punjab-pakistan"
    name: { "en": "Pakistani Punjab and Islamabad (Lahore, Rawalpindi, Islamabad)" }
  - id: "delhi"
    name: { "en": "Delhi and western Uttar Pradesh (Delhi, Meerut, Aligarh)" }
  - id: "lucknow"
    name: { "en": "Lucknow and Awadh (Lucknow, Prayagraj, Faizabad)" }
  - id: "deccan"
    name: { "en": "Deccani, Hyderabad and the Deccan (Hyderabad, Aurangabad, Gulbarga)" }
# The decks that need the alphabet: empty until the script decks are
# written (see above).
alphabet: []
units:
  # 1. The phrasebook, taught whole from the first lesson: آداب (ādāb),
  # السلام علیکم (assalāmu ʿalaikum), خدا حافظ (k͟hudā hāfiz), شکریہ
  # (śukriyā), جی ہاں (jī hām̐). ur-first-words joins this unit.
  - planned: { id: "ur-phrasebook", theme: "first-words", words: 8 }
    listening_passages:
      - { id: "first-meeting", text: { "en": "Two people greet each other with adab and salaam and say their names" } }
    reading_passages:
      - { id: "welcome-card", text: { "en": "A welcome card: hello, thank you, please and goodbye" } }
  # 2. The first word units. The sounds: the aspirates, the retroflex row,
  # and q, k͟h, ġ, z and f against k, kh, g, j and ph.
  - planned: { id: "ur-sound-differences", grammar: "sound-differences", words: 12 }
    listening_passages:
      - { id: "sound-pairs", text: { "en": "Pairs of words that differ in one sound, said slowly" } }
    reading_passages:
      - { id: "sound-pairs-list", text: { "en": "A list of word pairs with their readings" } }
  - planned: { id: "ur-questions", theme: "questions", words: 11 }
    listening_passages:
      - { id: "yes-or-no", text: { "en": "Short questions answered with jī hām̐ and jī nahīm̐" } }
    reading_passages:
      - { id: "question-cards", text: { "en": "Cards with who, what, where and when" } }
  # tū, tum and āp, and the jī and sāhab that make a name polite.
  - planned: { id: "ur-addressing", theme: "addressing", words: 9 }
    listening_passages:
      - { id: "polite-or-not", text: { "en": "Speaking to a friend, an elder and a shopkeeper" } }
    reading_passages:
      - { id: "how-to-address", text: { "en": "A short list of people and how to address them" } }
  - planned: { id: "ur-pronouns", theme: "pronouns", words: 24 }
    listening_passages:
      - { id: "who-is-who", text: { "en": "Pointing out who is who at a family gathering: he, she, they" } }
    reading_passages:
      - { id: "seating-chart", text: { "en": "A seating chart for a wedding lunch, with names and who is related to whom" } }
  - planned: { id: "ur-family", theme: "family", words: 25 }
    listening_passages:
      - { id: "family-photo", text: { "en": "Someone names the people in a family photo" } }
    reading_passages:
      - { id: "family-tree", text: { "en": "A family tree with its labels" } }
  # 3. The script, after the first six units (#554: skipped by a learner
  # who already reads it). ur-script-joining and ur-script-reading join
  # the first: the letters, right to left, and their joining forms.
  - planned: { id: "ur-script-letters", grammar: ["script-letters", "joining-forms"], words: 0 }
    listening_passages:
      - { id: "letter-names", text: { "en": "The letters said in order, alif to baṛī ye" } }
    reading_passages:
      - { id: "shop-signs", text: { "en": "Short shop signs in Nastaliq, one word each" } }
  # ur-script-marks joins the second: the short vowels left unwritten and
  # their marks, the long vowels, ں, ھ against ہ, ء, ع, the taśdīd, and
  # how the izafat is written.
  - planned: { id: "ur-script-vowels", grammar: ["short-vowels", "script-marks", "izafat"], words: 0 }
    listening_passages:
      - { id: "guess-the-vowel", text: { "en": "Words read aloud whose short vowels are not written" } }
    reading_passages:
      - { id: "street-names", text: { "en": "Street and road names with the izafat, as on a city map" } }
  # Numbers 1–20 follow the script, written with Urdu's digits.
  - planned: { id: "ur-numbers-1-20", theme: "numbers-1-20", words: 20 }
    listening_passages:
      - { id: "phone-number", text: { "en": "Someone reads out a phone number" } }
    reading_passages:
      - { id: "price-tags", text: { "en": "Price tags on small things, in Urdu digits" } }
  # 4. The core: about 200 common words, most common first (by judgement
  # until the Wikipedia counts are written, #516).
  - planned: { id: "ur-about-me", theme: "about-me", words: 8 }
    listening_passages:
      - { id: "introducing-yourself", text: { "en": "Someone says their name, where they are from and what they do" } }
    reading_passages:
      - { id: "profile-card", text: { "en": "A short profile card on a messaging app" } }
  - planned: { id: "ur-verbs", theme: "everyday-verbs", words: 32 }
    listening_passages:
      - { id: "morning-routine", text: { "en": "A mother says what each person in the house does in the morning" } }
    reading_passages:
      - { id: "fridge-note", text: { "en": "A note on the fridge: what to eat, what to drink and where things are" } }
  - planned: { id: "ur-adverbs", theme: "adverbs", words: 48 }
    listening_passages:
      - { id: "how-often", text: { "en": "Saying how often and how well things are done" } }
    reading_passages:
      - { id: "habit-survey", text: { "en": "A short survey about everyday habits" } }
  - planned: { id: "ur-quantities", theme: "quantities", words: 26 }
    listening_passages:
      - { id: "at-the-grocers", text: { "en": "Asking how much and how many at a grocer's" } }
    reading_passages:
      - { id: "recipe-amounts", text: { "en": "A recipe card with amounts" } }
  - planned: { id: "ur-describing", theme: "describing", words: 36 }
    listening_passages:
      - { id: "how-are-you-feeling", text: { "en": "A friend asks how you feel today, and you answer" } }
    reading_passages:
      - { id: "postcard-from-murree", text: { "en": "A short postcard from the hills at Murree: the weather and the food" } }
  - planned: { id: "ur-time", theme: "time", words: 18 }
    listening_passages:
      - { id: "what-time-is-it", text: { "en": "Asking the time and when a shop opens" } }
    reading_passages:
      - { id: "opening-hours", text: { "en": "A shop's opening hours on its door" } }
  - planned: { id: "ur-more-verbs", theme: "more-verbs", words: 30 }
    listening_passages:
      - { id: "kitchen-help", text: { "en": "Someone tells a helper what to do in the kitchen" } }
    reading_passages:
      - { id: "how-to-make-chai", text: { "en": "A short card on how to make chai" } }
  - planned: { id: "ur-work", theme: "work", words: 19 }
    listening_passages:
      - { id: "what-do-you-do", text: { "en": "Neighbours ask each other what work they do" } }
    reading_passages:
      - { id: "business-cards", text: { "en": "A few business cards with jobs on them" } }
  # 5. Rules as forms, practised on the words known: noun forms,
  # postpositions and conjunctions first, then pronoun and verb forms. The
  # noun forms: masculine and feminine, the borrowed nouns' gender learnt
  # with the word, and the plural (laṛkā, laṛke; laṛkī, laṛkiyām̐).
  - planned: { id: "ur-grammar-nouns", grammar: ["nouns", "gender", "plural"], words: 0 }
    listening_passages:
      - { id: "one-or-many", text: { "en": "Counting one and many things on a table" } }
    reading_passages:
      - { id: "classroom-labels", text: { "en": "Labels on things in a classroom" } }
  - planned: { id: "ur-grammar-postpositions", grammar: "postpositions", words: 6 }
    listening_passages:
      - { id: "where-is-it", text: { "en": "Finding keys: on the table, in the bag, under the bed" } }
    reading_passages:
      - { id: "room-plan", text: { "en": "A plan of a room with where things are" } }
  - planned: { id: "ur-grammar-conjunctions", grammar: "conjunctions", words: 8 }
    listening_passages:
      - { id: "and-but-or", text: { "en": "Choosing between tea and coffee, and saying why" } }
    reading_passages:
      - { id: "short-message", text: { "en": "A short message joined with and, but and because" } }
  # ur-grammar-possessives joins this unit: merā, terā, tumhārā, āpkā,
  # agreeing as kā does.
  - planned: { id: "ur-grammar-pronouns", grammar: ["pronouns", "possessives"], words: 0 }
    listening_passages:
      - { id: "whose-is-it", text: { "en": "Sorting out whose bag and whose phone is whose" } }
    reading_passages:
      - { id: "name-tags", text: { "en": "Name tags on bags at a station" } }
  # Be: hai, haim̐, hūm̐, ho, the past thā, and the negative nahīm̐.
  - planned: { id: "ur-grammar-be", grammar: "be", words: 0 }
    listening_passages:
      - { id: "who-is-home", text: { "en": "Asking who is at home and who is not" } }
    reading_passages:
      - { id: "class-register", text: { "en": "A class register: who is here and who is not" } }
  # The present habitual: jātā hai, jātī hai, jāte haim̐.
  - planned: { id: "ur-grammar-present", grammar: "present", words: 0 }
    listening_passages:
      - { id: "every-day", text: { "en": "Saying what someone does every day" } }
    reading_passages:
      - { id: "a-weekday", text: { "en": "A short text about a shopkeeper's weekday" } }
  - planned: { id: "ur-grammar-demonstratives", grammar: "demonstratives", words: 0 }
    listening_passages:
      - { id: "this-one-that-one", text: { "en": "Choosing this one or that one at a fruit stall" } }
    reading_passages:
      - { id: "photo-captions", text: { "en": "Captions under photos: this is, that is" } }
  # Gender agreement, as the scheme orders it after the present: the
  # adjective in -ā, the possessive and the verb.
  - planned: { id: "ur-grammar-adjectives", grammar: ["adjectives", "agreement"], words: 0 }
    listening_passages:
      - { id: "big-and-small", text: { "en": "Describing a big house, a small car and a new shirt" } }
    reading_passages:
      - { id: "for-sale", text: { "en": "Short for-sale notices: an old bicycle, a new table" } }
  # The oblique before a postposition: laṛkā, but laṛke ko; yah, but is
  # ko.
  - planned: { id: "ur-grammar-oblique", grammar: "oblique", words: 0 }
    listening_passages:
      - { id: "to-the-boy", text: { "en": "Giving things to the boy, the girls and the children" } }
    reading_passages:
      - { id: "gift-list", text: { "en": "A list of gifts and who each is for" } }
  # 6. Sentences, each after its words and rules; then the other A1
  # themes, each its words, its rules, then its sentences. Numbers 21 to
  # 100, learnt as words.
  - planned: { id: "ur-numbers-big", theme: "numbers-big", words: 80 }
    listening_passages:
      - { id: "how-much-is-it", text: { "en": "Prices said aloud at a market stall" } }
    reading_passages:
      - { id: "bus-numbers", text: { "en": "Bus numbers and house numbers on a street" } }
  # ur-food-sentences joins this unit.
  - planned: { id: "ur-food", theme: "food", words: 59 }
    listening_passages:
      - { id: "at-the-dhaba", text: { "en": "Ordering nihari, naan and chai at a roadside dhaba" } }
    reading_passages:
      - { id: "menu-card", text: { "en": "A restaurant menu card with dishes and prices" } }
  # ur-grammar-needs joins this unit: cāhiye, "is needed".
  - planned: { id: "ur-groceries", theme: "groceries", words: 15 }
    grammar: ["needs"]
    listening_passages:
      - { id: "shopping-list-call", text: { "en": "A phone call about what to bring from the shop" } }
    reading_passages:
      - { id: "shopping-list", text: { "en": "A handwritten shopping list" } }
  - planned: { id: "ur-market", theme: "market", words: 9 }
    listening_passages:
      - { id: "at-the-bazaar", text: { "en": "Asking the price of fruit at a bazaar" } }
    reading_passages:
      - { id: "stall-signs", text: { "en": "Signs over the stalls in a bazaar" } }
  - planned: { id: "ur-grammar-questions", grammar: "questions", words: 0 }
    listening_passages:
      - { id: "kya-questions", text: { "en": "Questions made with kyā at the start and by the voice alone" } }
    reading_passages:
      - { id: "form-questions", text: { "en": "The questions on a simple form" } }
  # Likes: mujhe ... pasand hai, with the liker in ko.
  - planned: { id: "ur-grammar-likes", grammar: "likes", words: 3 }
    listening_passages:
      - { id: "what-do-you-like", text: { "en": "Friends say what food and music they like" } }
    reading_passages:
      - { id: "likes-and-dislikes", text: { "en": "A short profile: likes and dislikes" } }
  # ur-pronouns-sentences, ur-verbs-sentences and ur-nouns-sentences join
  # this unit.
  - planned: { id: "ur-grammar-sentences", grammar: "sentences", words: 0 }
    listening_passages:
      - { id: "a-day-in-sentences", text: { "en": "Short sentences about a day: subject, object, verb" } }
    reading_passages:
      - { id: "a-short-note", text: { "en": "A short note to a neighbour" } }
  # Words easily mixed up, such as the two "and"s, aur and -o-, and the
  # everyday and the formal word for one thing.
  - planned: { id: "ur-grammar-differences", grammar: "differences", words: 0 }
    listening_passages:
      - { id: "which-word", text: { "en": "Two speakers use two words for one thing" } }
    reading_passages:
      - { id: "word-pairs", text: { "en": "Pairs of words that are easily mixed up" } }
  # ur-grammar-continuous joins this unit: rahā hai.
  - planned: { id: "ur-directions", theme: "directions", words: 12 }
    grammar: ["continuous"]
    listening_passages:
      - { id: "the-way-to-the-station", text: { "en": "Asking the way to the railway station" } }
    reading_passages:
      - { id: "directions-text", text: { "en": "A message with directions to a house" } }
  - planned: { id: "ur-transport", theme: "transport", words: 8 }
    listening_passages:
      - { id: "rickshaw-fare", text: { "en": "Agreeing a fare with a rickshaw driver" } }
    reading_passages:
      - { id: "bus-stop-board", text: { "en": "A bus stop board with routes" } }
  # ur-body-sentences joins this unit.
