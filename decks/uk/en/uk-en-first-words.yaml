schema: 1
id: "uk-en-first-words"
kind: "layer"
core: "uk-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "Yes and no, the pronouns, the numbers one to ten, the family and a few everyday words (water, food, house, name, good, big, small, here, there, what). Greetings and thank you are in the phrasebook. Not yet checked by a Ukrainian speaker: please report any mistake."
cards:
  "uk-0101":
    native: "yes"
    notes:
      "n1": "Так (tak) is 'yes'. It is also said to agree or to mean 'right'."
    examples:
      "Так, дякую.":
        native: "Yes, thank you."
        bases:
          "Так": "yes"
          "дякую": "thank you"
      "Так, я розумію.":
        native: "Yes, I understand."
        bases:
          "Так": "yes"
          "я": "I"
          "розумію": "understand"
  "uk-0102":
    native: "no"
    notes:
      "n1": "Ні (ni) is 'no'. Не (ne), 'not', comes before the verb: я не знаю (ya ne znaiu), I don't know."
    examples:
      "Ні, дякую.":
        native: "No, thank you."
        bases:
          "Ні": "no"
          "дякую": "thank you"
      "Ні, я не знаю.":
        native: "No, I don't know."
        bases:
          "Ні": "no"
          "я": "I"
          "не": "not"
          "знаю": "know"
  "uk-0103":
    native: "I"
    notes:
      "n1": "Я (ya) is 'I'. It is often left out, because the verb ending shows the person."
    examples:
      "Я студент.":
        native: "I am a student."
        bases:
          "Я": "I"
          "студент": "student"
      "Я не розумію.":
        native: "I don't understand."
        bases:
          "Я": "I"
          "не": "not"
          "розумію": "understand"
  "uk-0104":
    native: "you"
    notes:
      "n1": "Ти (ty) is 'you' for one person, informally. Ви (vy) is the polite 'you', and is also used for more than one person."
    examples:
      "Ти говориш англійською?":
        native: "Do you speak English?"
        bases:
          "Ти": "you"
          "говориш": "speak"
          "англійською": "in English"
      "Ти тут.":
        native: "You are here."
        bases:
          "Ти": "you"
          "тут": "here"
  "uk-0105":
    native: "he"
    notes:
      "n1": "Він (vin) is 'he'. Ukrainian nouns have gender, so він is also 'it' for a masculine noun, as in будинок (budynok), a house. Вона (vona) is feminine and воно (vono) is neuter."
    examples:
      "Він мій батько.":
        native: "He is my father."
        bases:
          "Він": "he"
          "мій": "my"
          "батько": "father"
      "Він великий.":
        native: "He is big."
        bases:
          "Він": "he"
          "великий": "big"
  "uk-0106":
    native: "she"
    notes:
      "n1": "Вона (vona) is 'she', and also 'it' for a feminine noun such as вода (voda), water. Її (yii) is 'her' and 'hers'."
    examples:
      "Вона моя мама.":
        native: "She is my mother."
        bases:
          "Вона": "she"
          "моя": "my"
          "мама": "mother"
      "Дитина мала.":
        native: "The child is small."
        bases:
          "Дитина": "child"
          "мала": "small"
  "uk-0107":
    native: "we"
    notes:
      "n1": "Ми (my) is 'we'."
    examples:
      "Ми тут.":
        native: "We are here."
        bases:
          "Ми": "we"
          "тут": "here"
      "Ми говоримо українською.":
        native: "We speak Ukrainian."
        bases:
          "Ми": "we"
          "говоримо": "speak"
          "українською": "in Ukrainian"
  "uk-0108":
    native: "they"
    notes:
      "n1": "Вони (vony) is 'they'."
    examples:
      "Вони тут.":
        native: "They are here."
        bases:
          "Вони": "they"
          "тут": "here"
      "Вони великі.":
        native: "They are big."
        bases:
          "Вони": "they"
          "великі": "big"
  "uk-0109":
    native: "one"
    notes:
      "n1": "Один (odyn) is 'one'. Before a feminine noun it is одна (odna): одна вода (odna voda), one water."
    examples:
      "Один, два, три.":
        native: "One, two, three."
        bases:
          "Один": "one"
          "два": "two"
          "три": "three"
      "Одна вода, будь ласка.":
        native: "One water, please."
        bases:
          "Одна": "one"
          "вода": "water"
          "будь": "be"
          "ласка": "kindness"
  "uk-0110":
    native: "two"
    notes:
      "n1": "Два (dva) is 'two' for a masculine or neuter noun: два будинки (dva budynky). For a feminine noun it is дві (dvi): дві гривні (dvi hryvni), two hryvnias. After два (dva), три (try) and чотири (chotyry) the noun is plural."
    examples:
      "Два, три, чотири.":
        native: "Two, three, four."
        bases:
          "Два": "two"
          "три": "three"
          "чотири": "four"
      "Це коштує дві гривні.":
        native: "It costs two hryvnias."
        bases:
          "Це": "this"
          "коштує": "costs"
          "дві": "two"
          "гривні": "hryvnias"
  "uk-0111":
    native: "three"
    notes:
      "n1": "Три (try) is 'three'."
    examples:
      "Один, два, три.":
        native: "One, two, three."
        bases:
          "Один": "one"
          "два": "two"
          "три": "three"
      "Це коштує три гривні.":
        native: "It costs three hryvnias."
        bases:
          "Це": "this"
          "коштує": "costs"
          "три": "three"
          "гривні": "hryvnias"
  "uk-0112":
    native: "four"
    notes:
      "n1": "Чотири (chotyry) is 'four'."
    examples:
      "Три, чотири, п'ять.":
        native: "Three, four, five."
        bases:
          "Три": "three"
          "чотири": "four"
          "п'ять": "five"
      "Це коштує чотири гривні.":
        native: "It costs four hryvnias."
        bases:
          "Це": "this"
          "коштує": "costs"
          "чотири": "four"
          "гривні": "hryvnias"
  "uk-0113":
    native: "five"
    notes:
      "n1": "П'ять (piat) is 'five'. From five upwards the noun takes the genitive plural: п'ять гривень (piat hryven), five hryvnias."
    examples:
      "Чотири, п'ять, шість.":
        native: "Four, five, six."
        bases:
          "Чотири": "four"
          "п'ять": "five"
          "шість": "six"
      "Це коштує п'ять гривень.":
        native: "It costs five hryvnias."
        bases:
          "Це": "this"
          "коштує": "costs"
          "п'ять": "five"
          "гривень": "hryvnias"
  "uk-0114":
    native: "six"
    notes:
      "n1": "Шість (shist) is 'six'."
    examples:
      "П'ять, шість, сім.":
        native: "Five, six, seven."
        bases:
          "П'ять": "five"
          "шість": "six"
          "сім": "seven"
      "Це коштує шість гривень.":
        native: "It costs six hryvnias."
        bases:
          "Це": "this"
          "коштує": "costs"
          "шість": "six"
          "гривень": "hryvnias"
  "uk-0115":
    native: "seven"
    notes:
      "n1": "Сім (sim) is 'seven'."
    examples:
      "Шість, сім, вісім.":
        native: "Six, seven, eight."
        bases:
          "Шість": "six"
          "сім": "seven"
          "вісім": "eight"
      "Це коштує сім гривень.":
        native: "It costs seven hryvnias."
        bases:
          "Це": "this"
          "коштує": "costs"
          "сім": "seven"
          "гривень": "hryvnias"
  "uk-0116":
    native: "eight"
    notes:
      "n1": "Вісім (visim) is 'eight'."
    examples:
      "Сім, вісім, дев'ять.":
        native: "Seven, eight, nine."
        bases:
          "Сім": "seven"
          "вісім": "eight"
          "дев'ять": "nine"
      "Це коштує вісім гривень.":
        native: "It costs eight hryvnias."
        bases:
          "Це": "this"
          "коштує": "costs"
          "вісім": "eight"
          "гривень": "hryvnias"
  "uk-0117":
    native: "nine"
    notes:
      "n1": "Дев'ять (deviat) is 'nine'."
    examples:
      "Вісім, дев'ять, десять.":
        native: "Eight, nine, ten."
        bases:
          "Вісім": "eight"
          "дев'ять": "nine"
          "десять": "ten"
      "Це коштує дев'ять гривень.":
        native: "It costs nine hryvnias."
        bases:
          "Це": "this"
          "коштує": "costs"
          "дев'ять": "nine"
          "гривень": "hryvnias"
  "uk-0118":
    native: "ten"
    notes:
      "n1": "Десять (desiat) is 'ten'."
    examples:
      "Від одного до десяти.":
        native: "From one to ten."
        bases:
          "Від": "from"
          "одного": "one"
          "до": "to"
          "десяти": "ten"
      "Це коштує десять гривень.":
        native: "It costs ten hryvnias."
        bases:
          "Це": "this"
          "коштує": "costs"
          "десять": "ten"
          "гривень": "hryvnias"
  "uk-0119":
    native: "mother"
    notes:
      "n1": "Мама (mama) is 'mother' (informal, as Mum). In the vocative, as when you speak to her, it is мамо (mamo)."
    examples:
      "Вона моя мама.":
        native: "She is my mother."
        bases:
          "Вона": "she"
          "моя": "my"
          "мама": "mother"
      "Привіт, мамо.":
        native: "Hi, Mum."
        bases:
          "Привіт": "hi"
          "мамо": "Mum"
  "uk-0120":
    native: "father"
    notes:
      "n1": "Батько (batko) is 'father'. With з (z), 'with', it takes the instrumental: з батьком (z batkom), with the father."
    examples:
      "Він мій батько.":
        native: "He is my father."
        bases:
          "Він": "he"
          "мій": "my"
          "батько": "father"
      "Я говорю з батьком.":
        native: "I speak with my father."
        bases:
          "Я": "I"
          "говорю": "speak"
          "з": "with"
          "батьком": "father"
  "uk-0121":
    native: "water"
    notes:
      "n1": "Вода (voda) is 'water'. As the thing asked for it takes the accusative воду (vodu): воду, будь ласка (vodu, bud laska), water, please."
    examples:
      "Воду, будь ласка.":
        native: "Water, please."
        bases:
          "Воду": "water"
          "будь": "be"
          "ласка": "kindness"
      "Це вода.":
        native: "This is water."
        bases:
          "Це": "this"
          "вода": "water"
  "uk-0122":
    native: "food"
    notes:
      "n1": "Їжа (yizha) is 'food'. Їсти (yisty) is 'to eat'."
    examples:
      "Їжа смачна.":
        native: "The food is tasty."
        bases:
          "Їжа": "food"
          "смачна": "tasty"
      "Я їм удома.":
        native: "I eat at home."
        bases:
          "Я": "I"
          "їм": "eat"
          "удома": "at home"
  "uk-0123":
    native: "house"
    notes:
      "n1": "Будинок (budynok) is 'house'. It is also used for 'building'."
    examples:
      "Це мій будинок.":
        native: "This is my house."
        bases:
          "Це": "this"
          "мій": "my"
          "будинок": "house"
      "Наш будинок великий.":
        native: "Our house is big."
        bases:
          "Наш": "our"
          "будинок": "house"
          "великий": "big"
  "uk-0124":
    native: "name"
    notes:
      "n1": "Ім'я (imia) is 'name'. It is a neuter noun, written with an apostrophe."
    examples:
      "Моє ім'я Олена.":
        native: "My name is Olena."
        bases:
          "Моє": "my"
          "ім'я": "name"
          "Олена": "Olena"
      "Як вас звати?":
        native: "What is your name?"
        bases:
          "Як": "how"
          "вас": "you"
          "звати": "to be called"
  "uk-0125":
    native: "good"
    notes:
      "n1": "Добрий (dobryi) is 'good' before a noun. Добре (dobre), the adverb, is also 'well' and 'it is good'."
    examples:
      "Це добре.":
        native: "This is good."
        bases:
          "Це": "this"
          "добре": "good"
      "Добрий день!":
        native: "Good day!"
        bases:
          "Добрий": "good"
          "день": "day"
  "uk-0126":
    native: "big"
    notes:
      "n1": "Великий (velykyi) is 'big'. It changes with the noun's gender: велике місто (velyke misto), a big city."
    examples:
      "Велике місто.":
        native: "A big city."
        bases:
          "Велике": "big"
          "місто": "city"
      "Він великий.":
        native: "He is big."
        bases:
          "Він": "he"
          "великий": "big"
  "uk-0127":
    native: "small"
    notes:
      "n1": "Малий (malyi) is 'small' (masculine). The feminine is мала (mala), and the neuter is мале (male)."
    examples:
      "Дитина мала.":
        native: "The child is small."
        bases:
          "Дитина": "child"
          "мала": "small"
      "Малий будинок.":
        native: "A small house."
        bases:
          "Малий": "small"
          "будинок": "house"
  "uk-0128":
    native: "here"
    notes:
      "n1": "Тут (tut) is 'here'. Там (tam) is 'there'."
    examples:
      "Ми тут.":
        native: "We are here."
        bases:
          "Ми": "we"
          "тут": "here"
      "Сідай тут.":
        native: "Sit here."
        bases:
          "Сідай": "sit"
          "тут": "here"
  "uk-0129":
    native: "there"
    notes:
      "n1": "Там (tam) is 'there', the opposite of тут (tut), 'here'."
    examples:
      "Туалет там.":
        native: "The toilet is there."
        bases:
          "Туалет": "toilet"
          "там": "there"
      "Будинок там.":
        native: "The house is there."
        bases:
          "Будинок": "house"
          "там": "there"
  "uk-0130":
    native: "what"
    notes:
      "n1": "Що (shcho) is 'what'. It starts most questions about a thing, as Що це? (Shcho tse?), What is this?"
    examples:
      "Що це?":
        native: "What is this?"
        bases:
          "Що": "what"
          "це": "this"
      "Що ти робиш?":
        native: "What are you doing?"
        bases:
          "Що": "what"
          "ти": "you"
          "робиш": "do"
