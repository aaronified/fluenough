schema: 1
id: "vi-en-first-words"
kind: "layer"
core: "vi-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "Yes, no, I, you, and, or, but, good, one and water: the small words that answer, link and begin a sentence. Vietnamese writes its tones as marks on the vowels, and a learner should hear them. Greetings and thanks are in the phrasebook. Not yet checked by a Vietnamese speaker: please report any mistake."
cards:
  "vi-0001":
    native: "yes (polite)"
    notes:
      "n1": "Vâng is a polite yes, the usual answer to an older person, a teacher or a shop assistant. Dạ, said to an elder, is also yes."
    examples:
      "Vâng, cảm ơn.":
        native: "Yes, thank you."
        bases:
          "cảm": "to feel"
          "ơn": "kindness"
      "Vâng, tôi hiểu.":
        native: "Yes, I understand."
        bases:
          "tôi": "I"
          "hiểu": "understand"
  "vi-0002":
    native: "no; not"
    notes:
      "n1": "Không is no, and it is also the word for not: không biết (does not know) is said with the verb after it."
    examples:
      "Không, cảm ơn.":
        native: "No, thank you."
        bases:
          "cảm": "to feel"
          "ơn": "kindness"
      "Tôi không hiểu.":
        native: "I don't understand."
        bases:
          "Tôi": "I"
          "hiểu": "understand"
  "vi-0003":
    native: "I"
    notes:
      "n1": "Tôi is I, the polite and neutral word. Friends often say mình; a learner should use tôi."
    examples:
      "Tôi đói.":
        native: "I am hungry."
        bases:
          "Tôi": "I"
          "đói": "hungry"
      "Tôi nói tiếng Anh.":
        native: "I speak English."
        bases:
          "Tôi": "I"
          "nói": "speak"
          "tiếng": "language"
          "Anh": "English"
  "vi-0004":
    native: "you (to a friend)"
    notes:
      "n1": "Bạn is you between friends and people of your own age. An older person is called anh (an older man) or chị (an older woman)."
    examples:
      "Bạn có khỏe không?":
        native: "How are you?"
        bases:
          "có": "have"
          "khỏe": "healthy"
      "Bạn đi đâu?":
        native: "Where are you going?"
        bases:
          "đi": "go"
          "đâu": "where"
  "vi-0005":
    native: "and"
    notes:
      "n1": "Và is and. It joins two nouns or two parts of a sentence."
    examples:
      "Trà và nước.":
        native: "Tea and water."
        bases:
          "Trà": "tea"
          "nước": "water"
      "Tôi và bạn.":
        native: "Me and you."
        bases:
          "Tôi": "I"
          "bạn": "you"
  "vi-0006":
    native: "or"
    notes:
      "n1": "Hoặc is or. In a question it asks the listener to choose between two things."
    examples:
      "Trà hoặc nước?":
        native: "Tea or water?"
        bases:
          "Trà": "tea"
          "nước": "water"
      "Hôm nay hoặc mai?":
        native: "Today or tomorrow?"
        bases:
          "Hôm": "day"
          "nay": "this"
          "mai": "tomorrow"
  "vi-0007":
    native: "but"
    notes:
      "n1": "Nhưng is but. It comes before the second part of a sentence that goes against the first."
    examples:
      "Ngon, nhưng đắt.":
        native: "Tasty, but expensive."
        bases:
          "Ngon": "tasty"
          "đắt": "expensive"
      "Tôi thích, nhưng mệt.":
        native: "I like it, but I am tired."
        bases:
          "Tôi": "I"
          "thích": "like"
          "mệt": "tired"
  "vi-0008":
    native: "good"
    notes:
      "n1": "Tốt is good in general. Ngon is tasty, for food, and khỏe is well, for a person's health."
    examples:
      "Trà này tốt.":
        native: "This tea is good."
        bases:
          "Trà": "tea"
          "này": "this"
      "Tôi khỏe, cảm ơn.":
        native: "I am well, thank you."
        bases:
          "Tôi": "I"
          "khỏe": "well"
          "cảm": "to feel"
          "ơn": "kindness"
  "vi-0009":
    native: "one"
    notes:
      "n1": "Một is one. Before a noun it is followed by a classifier, a word for the kind of thing counted: một ly trà (one glass of tea)."
    examples:
      "Một ly trà, làm ơn.":
        native: "One glass of tea, please."
        bases:
          "ly": "glass"
          "trà": "tea"
          "làm": "do"
          "ơn": "kindness"
      "Một, hai, ba.":
        native: "One, two, three."
        bases:
          "hai": "two"
          "ba": "three"
  "vi-0010":
    native: "water"
    notes:
      "n1": "Nước is water. It is also the word for country."
    examples:
      "Nước, làm ơn.":
        native: "Water, please."
        bases:
          "làm": "do"
          "ơn": "kindness"
      "Tôi muốn uống nước.":
        native: "I want to drink water."
        bases:
          "Tôi": "I"
          "muốn": "want"
          "uống": "drink"
