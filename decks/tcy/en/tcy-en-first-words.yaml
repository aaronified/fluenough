id: "tcy-en-first-words"
kind: "layer"
core: "tcy-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "The pronouns, the numbers one to five, the family words mother, father, child, man and woman, and words for water, rice, small, big, here, there, who, where and yes. Written in the Kannada script. Only words that a source could give are taught here, so the deck is short. Not yet checked by a Tulu speaker: please report any mistake."
cards:
  "tcy-0001":
    native: "I"
    notes:
      "n1": "ಯಾನು (yānu) is 'I'. The Swadesh list gives it, but the dictionary does not confirm\
  \ it, so check it with a speaker."
  "tcy-0002":
    native: "you (singular)"
    notes:
      "n1": "ಈರ್ (īrŭ) is 'you' for one person. It comes from the Swadesh list only, so check\
  \ it with a speaker."
  "tcy-0003":
    native: "he; she"
    notes:
      "n1": "ಆಯೆ (āye) is 'he' or 'she'. The Swadesh list gives several forms, so check it with\
  \ a speaker."
  "tcy-0004":
    native: "we"
    notes:
      "n1": "ಎಂಕುಲು (eṅkulu) is 'we'. The Swadesh list and the Tulu-English dictionary both give\
  \ it."
  "tcy-0005":
    native: "one"
    notes:
      "n1": "ಒಂಜಿ (oñji) is 'one'."
  "tcy-0006":
    native: "two"
    notes:
      "n1": "ರಡ್ಡ್ (raḍḍŭ) is 'two'."
  "tcy-0007":
    native: "three"
    notes:
      "n1": "ಮೂಜಿ (mūji) is 'three'."
  "tcy-0008":
    native: "four"
    notes:
      "n1": "ನಾಲ್ (nālŭ) is 'four'."
  "tcy-0009":
    native: "five"
    notes:
      "n1": "ಐನ್ (ainŭ) is 'five'. The Swadesh list and the Tulu-English dictionary both give\
  \ it."
  "tcy-0010":
    native: "mother"
    notes:
      "n1": "ಅಪ್ಪೆ (appe) is 'mother'. The Swadesh list and the Tulu-English dictionary both give\
  \ it."
  "tcy-0011":
    native: "father"
    notes:
      "n1": "ಅಮ್ಮೆ (amme) is 'father'. The Tulu-English dictionary glosses it as father."
  "tcy-0012":
    native: "child"
    notes:
      "n1": "ಬಾಲೆ (bāle) is 'child'. It comes from the Swadesh list only, so check it with a speaker."
  "tcy-0013":
    native: "man"
    notes:
      "n1": "ಅಂಜೊವ್ (añjovŭ) is 'man', an adult male. The Swadesh list and the Tulu-English dictionary\
  \ both give it."
  "tcy-0014":
    native: "woman"
    notes:
      "n1": "ಪೊಂಜೋವು (poñjōvu) is 'woman'. It comes from the Swadesh list only, so check it with\
  \ a speaker."
  "tcy-0015":
    native: "water"
    notes:
      "n1": "ಅಂಬು (ambu) is 'water'. The Tulu-English dictionary gives it, but the Swadesh list\
  \ does not, so check it with a speaker."
  "tcy-0016":
    native: "rice"
    notes:
      "n1": "ಅಕ್ಕಿ (akki) is 'rice'. The Tulu-English dictionary gives it."
  "tcy-0017":
    native: "small"
    notes:
      "n1": "ಎಲ್ಯ (elya) is 'small'. The Swadesh list and the Tulu-English dictionary both give\
  \ it."
  "tcy-0018":
    native: "big"
    notes:
      "n1": "ಮಲ್ಲ (malla) is 'big'. It comes from the Swadesh list only, so check it with a speaker."
  "tcy-0019":
    native: "here"
    notes:
      "n1": "ಮೂಲು (mūlu) is 'here'. It comes from the Swadesh list only, so check it with a speaker."
  "tcy-0020":
    native: "there"
    notes:
      "n1": "ಅದೆ (ade) is 'there'. The Swadesh list and the Tulu-English dictionary both give\
  \ it."
  "tcy-0021":
    native: "what"
    notes:
      "n1": "ಎಂಚಿನ (eñcina) is 'what'. It comes from the Swadesh list only, so check it with a\
  \ speaker."
  "tcy-0022":
    native: "who"
    notes:
      "n1": "ಏರ್ (ērŭ) is 'who'. The Swadesh list and the Tulu-English dictionary both give it."
  "tcy-0023":
    native: "where"
    notes:
      "n1": "ಏಪ (ēpa) is 'where'. It comes from the Swadesh list only, so check it with a speaker."
  "tcy-0024":
    native: "yes"
    notes:
      "n1": "ಅಂದು (andu) is 'yes'. The Tulu-English dictionary gives it, but no other source does,\
  \ so check it with a speaker."
