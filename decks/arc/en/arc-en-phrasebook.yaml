"tags":
- "unreviewed"
"cards":
  "arc-0011":
    "native": "Peace; greetings."
    "notes":
      "n1": "Šlām, peace, is the greeting that opens letters in the papyri and in Ezra 4:17 (šlām ūkʿenet). Attested."
  "arc-0012":
    "native": "May your peace increase."
    "notes":
      "n1": "Daniel 3:31 (4:1 in some Bibles): the king's greeting to all peoples. Attested; the verb spelling is to be confirmed."
  "arc-0013":
    "native": "O king, live for ever."
    "notes":
      "n1": "The courtiers' greeting to the king (Daniel 2:4, 3:9, 5:10, 6:22). Attested."
  "arc-0014":
    "native": "Blessed be the name of God from age to age."
    "notes":
      "n1": "Daniel 2:20, Daniel's praise. Attested; a prayer, not an everyday phrase."
  "arc-0015":
    "native": "The God of heaven."
    "notes":
      "n1": "The Persian-period title of the God of Israel (Ezra 5:12 and Daniel 2:18). Attested."
  "arc-0016":
    "native": "We are the servants of the God of heaven and earth."
    "notes":
      "n1": "Ezra 5:11, the Jews' answer to the Persian governor. Attested."
  "arc-0017":
    "native": "Mene, mene, tekel, upharsin."
    "notes":
      "n1": "The writing on the wall (Daniel 5:25). Attested; the words are read as numbered, weighed and divided."
  "arc-0018":
    "native": "Greetings; and now."
    "notes":
      "n1": "The formula that opens an official letter (Ezra 4:17; 7:12 has gĕmīr ūkʿenet). Attested; ūkʿenet marks the start of the letter's business."
  "arc-0019":
    "native": "My lord."
    "notes":
      "n1": "The respectful address to a king or a superior (Daniel 4:16). Attested; Elephantine letters use mārān, our lord."
  "arc-0020":
    "native": "If it seems good to the king."
    "notes":
      "n1": "The polite way to open a petition (Ezra 5:17). Attested."
  "arc-0021":
    "native": "I do not know."
    "notes":
      "n1": "Not a quoted line: composed from attested words (ʾănā, lā, yādaʿ) and therefore conventional."
  "arc-0022":
    "native": "Behold; look."
    "notes":
      "n1": "ʾĂrū opens each of Daniel's visions (Daniel 7:2). Attested."
  "arc-0023":
    "native": "What have you done?"
    "notes":
      "n1": "Daniel 4:32 (4:35 in some Bibles), What are you doing? Attested; the verb is a past form with the second person ending."
  "arc-0024":
    "native": "Who are you?"
    "notes":
      "n1": "Not a quoted line: composed from attested words (man, ʾant) and therefore conventional."
  "arc-0025":
    "native": "Lord of kings."
    "notes":
      "n1": "Daniel 2:47, said to the God of heaven. Attested."
