description: "Eighteen things to say from the first day, before their words are taught: greetings and goodbye, please and thank you, sorry, yes and no, asking for slower speech, how are you, and how to give your name and ask for help. Not yet checked by an Imperial Aramaic speaker: please report any mistake."
