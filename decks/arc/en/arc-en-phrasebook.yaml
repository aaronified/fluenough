"name": "Phrasebook: first phrases"
"description": "Fifteen phrases from Biblical Aramaic (Ezra and Daniel), as a window on the Imperial language: greetings, blessings, a petition, the writing on the wall, and a letter's opening. Phrases from the Elephantine papyri and from Ashoka's Aramaic inscriptions at Kandahar and Taxila are not included yet, because their exact wording must be checked by a scholar first. Hebrew square script, unpointed, with the same reading and IPA as the first-words deck. Not yet checked by an Aramaicist: please report any mistake."
