"name": "First words"
"description": "Thirty words of Imperial Aramaic, the administrative language of the Persian empire, about 700 to 300 BCE, from the Elephantine papyri and the letters of Egypt. The text is in the square Hebrew letters, unpointed, and the reading is a scholarly transliteration. Nine forms are from the general Aramaic Swadesh list; the rest are marked doubtful until checked against the Textbook of Aramaic Documents from Ancient Egypt. The IPA is broad and reconstructed. Not yet checked by an Aramaic scholar: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
