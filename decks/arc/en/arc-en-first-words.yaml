"id": "arc-en-first-words"
"kind": "layer"
"core": "arc-first-words"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "First words"
"description": "Ten words to start with: no, I, you, water, good, one, two, there, king and god. Imperial (Official) Aramaic, the language of the Persian empire, as in the Elephantine papyri, Ezra and Daniel. The target is in the Hebrew square script, unpointed as the Imperial Aramaic papyri are written (the Imperial Aramaic script itself, Unicode U+10840 to 1085F, is not used, because the Hebrew script is already supported and has system fonts). Right to left. The reading is a Latin transliteration in the scholarly style (ʾ and ʿ for the aleph and ayin, š ṭ ḥ and so on). The IPA is broad and reconstructed, and the vowels follow the Tiberian vocalisation of Biblical Aramaic, which is later than the unpointed Imperial text, so they are conventional: Imperial Aramaic itself was written without vowels. Not yet checked by an Aramaicist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "arc-0001":
    "native": "not; no"
    "notes":
      "n1": "Lā is not and no, the usual negative of Aramaic (Daniel and the papyri). The reading here follows the Tiberian vocalisation of Biblical Aramaic, which is later than the unpointed Imperial text. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "לא טב.":
        "native": "It is not good."
        "bases":
          "לא": "not"
          "טב": "good"
      "לא ידע אנה.":
        "native": "I do not know."
        "bases":
          "לא": "not"
          "ידע": "to know (knowing)"
          "אנה": "I"
  "arc-0002":
    "native": "I"
    "notes":
      "n1": "ʾAnā is I (Daniel 2:8 has yādaʿ ʾănā, I know). Attested; the participle plus the pronoun is the normal way to say I know. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "אנה ידע.":
        "native": "I know."
        "bases":
          "אנה": "I"
          "ידע": "to know (knowing)"
      "אנה תמה.":
        "native": "I am there."
        "bases":
          "אנה": "I"
          "תמה": "there"
  "arc-0003":
    "native": "you"
    "notes":
      "n1": "ʾAnt is you, one man (the written form is ʾnth). Attested in Daniel 2:37, ʾant malkā, you, O king. Example 1 is quoted from a text (Ezra and Daniel); example 2 is composed from attested words."
    "examples":
      "אנתה מלכא.":
        "native": "You are the king."
        "bases":
          "אנתה": "you"
          "מלכא": "the king"
      "אנתה לא ידע.":
        "native": "You do not know."
        "bases":
          "אנתה": "you"
          "לא": "not"
          "ידע": "to know (knowing)"
  "arc-0004":
    "native": "water"
    "notes":
      "n1": "Mayyā is the water. The plural form with the emphatic ending is regular in Targumic Aramaic (the Targum of Genesis 1:2); it is not found in Biblical Aramaic, so a scholar should confirm it for the Imperial period. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "מיא תמה.":
        "native": "The water is there."
        "bases":
          "מיא": "water"
          "תמה": "there"
      "מיא טבין.":
        "native": "The water is good."
        "bases":
          "מיא": "water"
          "טבין": "good (plural)"
  "arc-0005":
    "native": "good"
    "notes":
      "n1": "Ṭāb is good, as in Ezra 5:17, hēn ʿal malkā ṭāb, if it seems good to the king. Attested; the plural ṭābīn is a conventional form. Example 1 is quoted from a text (Ezra and Daniel); example 2 is composed from attested words."
    "examples":
      "הן על מלכא טב.":
        "native": "If it seems good to the king."
        "bases":
          "הן": "if"
          "על": "upon, to"
          "מלכא": "the king"
          "טב": "good"
      "מלכא טב.":
        "native": "The king is good."
        "bases":
          "מלכא": "the king"
          "טב": "good"
  "arc-0006":
    "native": "one"
    "notes":
      "n1": "Ḥad is one, masculine (Daniel 2:9 and the papyri). Attested. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "מלך חד.":
        "native": "One king."
        "bases":
          "מלך": "king"
          "חד": "one"
      "חד ותרין.":
        "native": "One and two."
        "bases":
          "חד": "one"
          "ותרין": "and two"
  "arc-0007":
    "native": "two"
    "notes":
      "n1": "Tĕrēn is two, masculine (Ezra 6:17 and Daniel). Attested. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "תרין מלכין.":
        "native": "Two kings."
        "bases":
          "תרין": "two"
          "מלכין": "kings"
      "תרין אלהין.":
        "native": "Two gods."
        "bases":
          "תרין": "two"
          "אלהין": "gods"
  "arc-0008":
    "native": "there"
    "notes":
      "n1": "Tammā is there. Attested in Ezra 5:17; Aramaic has no common word for here in the Biblical texts, so the course starts with there. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "אנתה תמה.":
        "native": "You are there."
        "bases":
          "אנתה": "you"
          "תמה": "there"
      "מלכא תמה.":
        "native": "The king is there."
        "bases":
          "מלכא": "the king"
          "תמה": "there"
  "arc-0009":
    "native": "king"
    "notes":
      "n1": "Melek is king (Daniel 2:37 and the papyri); the emphatic form is malkā, the king. Attested. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "מלך אנה.":
        "native": "I am a king."
        "bases":
          "מלך": "king"
          "אנה": "I"
      "מלכא טב.":
        "native": "The king is good."
        "bases":
          "מלכא": "the king"
          "טב": "good"
  "arc-0010":
    "native": "god"
    "notes":
      "n1": "ʾĕlāh is god; the emphatic form is ʾĕlāhā and the plural ʾĕlāhīn (Daniel 2:47). Attested. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "אלה טב.":
        "native": "The god is good."
        "bases":
          "אלה": "god"
          "טב": "good"
      "אלה תמה.":
        "native": "The god is there."
        "bases":
          "אלה": "god"
          "תמה": "there"
