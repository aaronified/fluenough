"name": "First words"
"description": "Thirty words of Imperial Aramaic, the administrative language of the Persian empire, about 700 to 300 BCE, as in the Elephantine papyri of Egypt. The text is in the square Hebrew letters, unpointed, and the reading is a scholarly transliteration. Glosses are checked in the Aramaic entries of Wiktionary, which cover Aramaic generally and are pointed; the Elephantine formulae (the God of heaven, the greetings) are from the English translations in Cowley, Aramaic Papyri of the Fifth Century B.C. (1923). Five words are still marked doubtful. Not yet checked by an Aramaicist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "arc-0001":
    "native": "I"
    "notes":
      "n1": "ʾnʾ, I. Source: Wiktionary, Aramaic Swadesh list (item 1), pointed as listed and written here unpointed as in the papyri. The Swadesh list is general Aramaic, not Imperial only."
  "arc-0002":
    "native": "you (masculine singular)"
    "notes":
      "n1": "ʾnt, you (masculine). Source: Wiktionary, Aramaic Swadesh list (item 2); the feminine is ʾnty (ʾantī). The list is general Aramaic."
  "arc-0003":
    "native": "we"
    "notes":
      "n1": "ʾnḥnʾ, we. Source: Wiktionary, Aramaic Swadesh list (item 4), pointed as listed."
  "arc-0004":
    "native": "water"
    "notes":
      "n1": "mʾyʾ, water. Source: Wiktionary, Aramaic Swadesh list (item 150), pointed as listed and written unpointed here."
  "arc-0005":
    "native": "one"
    "notes":
      "n1": "ḥd, one (masculine). Source: Wiktionary, Aramaic Swadesh list (item 22)."
  "arc-0006":
    "native": "two"
    "notes":
      "n1": "trn, two (masculine). Source: Wiktionary, Aramaic Swadesh list (item 23)."
  "arc-0007":
    "native": "three"
    "notes":
      "n1": "tlṯʾ, three (masculine). Source: Wiktionary, Aramaic Swadesh list (item 24)."
  "arc-0008":
    "native": "four"
    "notes":
      "n1": "ʾrbʿʾ, four (masculine). Source: Wiktionary, Aramaic Swadesh list (item 25)."
  "arc-0009":
    "native": "five"
    "notes":
      "n1": "ḥmšʾ, five (masculine). Source: Wiktionary, Aramaic Swadesh list (item 26)."
  "arc-0010":
    "native": "house"
    "notes":
      "n1": "bayt, house (a construct form, as in bayt X, house of X). Wiktionary lists the bare spelling as the construct form of bayṯā, house, home. Wiktionary's Aramaic entries are not limited to Imperial Aramaic and are pointed; the unpointed spelling here is the usual papyrus spelling, which was not checked letter by letter against the papyri (the scanned Cowley edition read lost its Hebrew letters)."
  "arc-0011":
    "native": "king"
    "notes":
      "n1": "Malkā, king (masculine). Wiktionary,. Cowley's English translations of the Elephantine papyri (1923) have kings and the king of Persia among the dated formulae. Wiktionary's Aramaic entries are not limited to Imperial Aramaic and are pointed; the unpointed spelling here is the usual papyrus spelling, which was not checked letter by letter against the papyri (the scanned Cowley edition read lost its Hebrew letters)."
  "arc-0012":
    "native": "son"
    "notes":
      "n1": "Bar, son (the form before a name, bar X, son of X, as in Cowley's translations of the papyri, where each person is named with a patronymic). Wiktionary lists the bare spelling as the absolute and construct form of bərā, son, child. Wiktionary's Aramaic entries are not limited to Imperial Aramaic and are pointed; the unpointed spelling here is the usual papyrus spelling, which was not checked letter by letter against the papyri (the scanned Cowley edition read lost its Hebrew letters)."
  "arc-0013":
    "native": "daughter"
    "notes":
      "n1": "Bat, daughter. No Wiktionary entry for this spelling was found; doubtful until checked against a papyrus edition."
  "arc-0014":
    "native": "father"
    "notes":
      "n1": "ʾAb, father (the absolute form). Wiktionary lists the bare spelling as the absolute form of ʾabbā, father, ancestor. Wiktionary's Aramaic entries are not limited to Imperial Aramaic and are pointed; the unpointed spelling here is the usual papyrus spelling, which was not checked letter by letter against the papyri (the scanned Cowley edition read lost its Hebrew letters)."
  "arc-0015":
    "native": "mother"
    "notes":
      "n1": "ʾIm, mother. Wiktionary has the emphatic form ʾimmā, mother, but not this spelling; doubtful until checked against a papyrus edition."
  "arc-0016":
    "native": "man (adult male)"
    "notes":
      "n1": "Gabrā, man, husband. Wiktionary, gaḇrā, with the feminine woman, wife. Wiktionary's Aramaic entries are not limited to Imperial Aramaic and are pointed; the unpointed spelling here is the usual papyrus spelling, which was not checked letter by letter against the papyri (the scanned Cowley edition read lost its Hebrew letters)."
  "arc-0017":
    "native": "god"
    "notes":
      "n1": "ʾElāhā, god (the emphatic form; the bare form is ʾelāh, ʾlh). Wiktionary,: god, deity. In Cowley's translations a letter prays that the God of heaven seek a brother's welfare at all times, the formula ʾlh šmyʾ. Wiktionary's Aramaic entries are not limited to Imperial Aramaic and are pointed; the unpointed spelling here is the usual papyrus spelling, which was not checked letter by letter against the papyri (the scanned Cowley edition read lost its Hebrew letters)."
  "arc-0018":
    "native": "heaven; sky"
    "notes":
      "n1": "Šmayyā, heaven, sky. Wiktionary, šmayā. Cowley's translations have the God of heaven in the greeting of an Elephantine letter. Wiktionary's Aramaic entries are not limited to Imperial Aramaic and are pointed; the unpointed spelling here is the usual papyrus spelling, which was not checked letter by letter against the papyri (the scanned Cowley edition read lost its Hebrew letters)."
  "arc-0019":
    "native": "peace; greeting"
    "notes":
      "n1": "Šlāmā, peace; also a greeting. Wiktionary,: peace, perfection, and a greeting like hello. The letters of the papyri begin with a greeting, rendered greeting in Cowley's translations; the root šlm also forms the verb to be whole (Wiktionary,). Wiktionary's Aramaic entries are not limited to Imperial Aramaic and are pointed; the unpointed spelling here is the usual papyrus spelling, which was not checked letter by letter against the papyri (the scanned Cowley edition read lost its Hebrew letters)."
  "arc-0020":
    "native": "good"
    "notes":
      "n1": "Ṭāb, good (masculine). Wiktionary, ṭāḇ. Wiktionary's Aramaic entries are not limited to Imperial Aramaic and are pointed; the unpointed spelling here is the usual papyrus spelling, which was not checked letter by letter against the papyri (the scanned Cowley edition read lost its Hebrew letters)."
  "arc-0021":
    "native": "great; big"
    "notes":
      "n1": "Rab, great, big. No Wiktionary Aramaic entry for this spelling was found; doubtful until checked against a papyrus edition."
  "arc-0022":
    "native": "small"
    "notes":
      "n1": "Zaʿīr, small. No Wiktionary Aramaic entry for this spelling was found; doubtful until checked against a papyrus edition."
  "arc-0023":
    "native": "here"
    "notes":
      "n1": "Hākā, here. Wiktionary, hāḵā. Wiktionary's Aramaic entries are not limited to Imperial Aramaic and are pointed; the unpointed spelling here is the usual papyrus spelling, which was not checked letter by letter against the papyri (the scanned Cowley edition read lost its Hebrew letters)."
  "arc-0024":
    "native": "there"
    "notes":
      "n1": "Tammān, there, yonder. Wiktionary,. Wiktionary's Aramaic entries are not limited to Imperial Aramaic and are pointed; the unpointed spelling here is the usual papyrus spelling, which was not checked letter by letter against the papyri (the scanned Cowley edition read lost its Hebrew letters)."
  "arc-0025":
    "native": "what"
    "notes":
      "n1": "Māh, what. Wiktionary lists the bare spelling as an alternative spelling of maʾ, what. Wiktionary's Aramaic entries are not limited to Imperial Aramaic and are pointed; the unpointed spelling here is the usual papyrus spelling, which was not checked letter by letter against the papyri (the scanned Cowley edition read lost its Hebrew letters)."
  "arc-0026":
    "native": "who"
    "notes":
      "n1": "Man, who (interrogative); the same letters also write the preposition from. Wiktionary, two entries. Wiktionary's Aramaic entries are not limited to Imperial Aramaic and are pointed; the unpointed spelling here is the usual papyrus spelling, which was not checked letter by letter against the papyri (the scanned Cowley edition read lost its Hebrew letters)."
  "arc-0027":
    "native": "all; every"
    "notes":
      "n1": "Kull, all, every, whole. Wiktionary, kol. Wiktionary's Aramaic entries are not limited to Imperial Aramaic and are pointed; the unpointed spelling here is the usual papyrus spelling, which was not checked letter by letter against the papyri (the scanned Cowley edition read lost its Hebrew letters)."
  "arc-0028":
    "native": "and"
    "notes":
      "n1": "Wa, and, the conjunction written as one letter joined to the next word. No Wiktionary entry was found for it; doubtful until checked against a papyrus edition."
  "arc-0029":
    "native": "not"
    "notes":
      "n1": "Lāʾ, no, not. Wiktionary, lā, an adverb. Wiktionary's Aramaic entries are not limited to Imperial Aramaic and are pointed; the unpointed spelling here is the usual papyrus spelling, which was not checked letter by letter against the papyri (the scanned Cowley edition read lost its Hebrew letters)."
  "arc-0030":
    "native": "yes; so"
    "notes":
      "n1": "Kēn, thus, so; also yes. Wiktionary,: thus, so, then, yes. Wiktionary's Aramaic entries are not limited to Imperial Aramaic and are pointed; the unpointed spelling here is the usual papyrus spelling, which was not checked letter by letter against the papyri (the scanned Cowley edition read lost its Hebrew letters)."
