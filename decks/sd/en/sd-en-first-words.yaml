schema: 1
id: "sd-en-first-words"
kind: "layer"
core: "sd-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "Yes and no, the pronouns, the numbers one to ten, the family words mother, father, brother, sister, child, man and woman, and a few everyday words such as water, name, good and today. Written in the Perso-Arabic script, read from right to left. Not yet checked by a Sindhi speaker: please report any mistake."
cards:
  "sd-0001":
    native: "yes"
    notes:
      "n1": "ها (ha) is 'yes'. It comes from a phrasebook list only, so check it with a speaker."
  "sd-0002":
    native: "no"
    notes:
      "n1": "نه (na) is 'no'. The same word also means 'not', so check the answer use with a speaker. Wiktionary's Sindhi entry gives it as 'not', and Trumpp's Grammar of the Sindhi Language (1872) lists na as 'no'."
  "sd-0003":
    native: "I"
    notes:
      "n1": "آئون (āū̃) is 'I' in standard Sindhi. A northern form, مان (mā̃), is also used."
  "sd-0004":
    native: "you (singular)"
    notes:
      "n1": "تون (tū̃) is 'you' for one person."
  "sd-0005":
    native: "he"
    notes:
      "n1": "هو (hū) is 'he'. Wiktionary's Sindhi entry lists it as 'he' or 'that', the far form."
  "sd-0006":
    native: "she"
    notes:
      "n1": "هوءَ (hūa) is 'she'. Wiktionary's Sindhi entry lists it as 'she' or 'that', the far feminine form."
  "sd-0007":
    native: "we"
    notes:
      "n1": "اسين (asī̃) is 'we'."
  "sd-0008":
    native: "they"
    notes:
      "n1": "هي (hī) is 'they', for people near the speaker. The far form is هو (hū). Wiktionary's Sindhi entry also lists it as 'he' or 'this'; it is the near form."
  "sd-0009":
    native: "one"
    notes:
      "n1": "هڪ (hiku) is 'one' (masculine)."
  "sd-0010":
    native: "two"
    notes:
      "n1": "ٻه (ḇa) is 'two'. Trumpp's grammar (1872) lists ba as 'two'; Wiktionary has the entry too."
  "sd-0011":
    native: "three"
    notes:
      "n1": "ٽي (ṭe) is 'three'. Wiktionary's Sindhi entry lists it as 'three'; Trumpp's grammar (1872) writes it tre."
  "sd-0012":
    native: "four"
    notes:
      "n1": "چار (cāri) is 'four'."
  "sd-0013":
    native: "five"
    notes:
      "n1": "پنج (panja) is 'five'."
  "sd-0014":
    native: "six"
    notes:
      "n1": "ڇهه (chhah) is 'six'. Wiktionary's Sindhi entry lists it as 'six'; Trumpp's grammar (1872) writes cha or chaha."
  "sd-0015":
    native: "seven"
    notes:
      "n1": "ست (sat) is 'seven'. Wiktionary's Sindhi entry and Trumpp's grammar (1872) list it as 'seven'."
  "sd-0016":
    native: "eight"
    notes:
      "n1": "اٺ (ath) is 'eight'. Wiktionary's Sindhi entry and Trumpp's grammar (1872) list it as 'eight'."
  "sd-0017":
    native: "nine"
    notes:
      "n1": "نو (nao) is 'nine'. Wiktionary's Sindhi entry lists it as 'nine'; Trumpp's grammar (1872) writes it nava."
  "sd-0018":
    native: "ten"
    notes:
      "n1": "ڏھ (dah) is 'ten'. Wiktionary's Sindhi entry (spelled ڏهه (ḏaha)) lists it as 'ten'; Trumpp's grammar (1872) writes it daha."
  "sd-0019":
    native: "mother"
    notes:
      "n1": "ماءُ (māu) is 'mother'."
  "sd-0020":
    native: "father"
    notes:
      "n1": "پيءُ (pīu) is 'father'."
  "sd-0021":
    native: "brother"
    notes:
      "n1": "ڀاءُ (bhāu) is 'brother'."
  "sd-0022":
    native: "sister"
    notes:
      "n1": "ڀيڻ (bheṇa) is 'sister'."
  "sd-0023":
    native: "child"
    notes:
      "n1": "ٻار (ḇāri) is 'child'."
  "sd-0024":
    native: "man"
    notes:
      "n1": "ماڻهو (māṇhū) is 'man'."
  "sd-0025":
    native: "woman"
    notes:
      "n1": "عورت ('aurat) is 'woman'. A second word, زال (zāl), is also given. Wiktionary's Sindhi entry lists it as 'woman'; Trumpp's grammar (1872) has it as aurata."
  "sd-0026":
    native: "water"
    notes:
      "n1": "پاڻي (pānī) is 'water'."
  "sd-0027":
    native: "name"
    notes:
      "n1": "نالو (nālo) is 'name'."
  "sd-0028":
    native: "good"
    notes:
      "n1": "سُٺو (suṭho) is 'good'. A second word, ڀلو (bhalo), is also given."
  "sd-0029":
    native: "big"
    notes:
      "n1": "وڏو (vaḏo) is 'big'."
  "sd-0030":
    native: "small"
    notes:
      "n1": "ننڍو (naṇḍho) is 'small'."
  "sd-0031":
    native: "here"
    notes:
      "n1": "هتي (hite) is 'here'. Wiktionary's Sindhi entry gives the gloss 'there' but derives the word from هِي (hī, this), so 'here' is likely; check it with a speaker."
  "sd-0032":
    native: "there"
    notes:
      "n1": "هُتي (hute) is 'there'. No dictionary entry for the spelling with the vowel mark was reached, so check it with a speaker."
  "sd-0033":
    native: "what"
    notes:
      "n1": "ڇا (chā) is 'what'. Wiktionary's Sindhi entry lists it as 'what', also a particle that opens a yes-or-no question."
  "sd-0034":
    native: "who"
    notes:
      "n1": "ڪيرُ (keru) is 'who'. Wiktionary's Sindhi entry lists it as the interrogative 'who'."
  "sd-0035":
    native: "where"
    notes:
      "n1": "ڪٿي (kithe) is 'where'."
  "sd-0036":
    native: "today"
    notes:
      "n1": "اڄ (aj̄u) is 'today'."
