# The order Japanese is taught from English in: hiragana, which everything
# else in Japanese assumes. See ADR-0013 and docs/DECK-FORMAT.md.
schema: 1
kind: path
id: ja-en-path
language: ja
native: en
# The decks that need the alphabet: a learner who learns without it
# skips them.
alphabet:
  - ja-en-hiragana
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
units:
  - [ja-en-hiragana]
  - ["*"]
