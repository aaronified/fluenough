  - id: "ja-rule-mashita"
    slots: ["mashita"]
    words:
      - { word: "ました", reading: "mashita" }
      - { word: "たべました", reading: "tabemashita" }
  - id: "ja-rule-masen-deshita"
    slots: ["masen-deshita"]
    words:
      - { word: "ませんでした", reading: "masen deshita" }
      - { word: "たべませんでした", reading: "tabemasen deshita" }
