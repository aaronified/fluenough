kind: "layer"
core: "ja-culture-2"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: poems, haiku and plays"
description: "Eighteen short items from Japanese poetry, prose, noh and kabuki, from the Heian period to the Edo period, in the public domain. Each shows who wrote it, when, and where it comes from. The texts are in modern kana. The English is the builder's own plain rendering. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ja-4600":
    native: "Men are said to keep a diary, so I, a woman, will also try to write one, and so I do."
    notes:
      "n1": "The opening of a diary written in kana by Ki no Tsurayuki, who pretends to be a woman. The diary is written as if by a woman and the joke is on the reader."
    bases:
      "おとこ": { meaning: "man" }
      "も": { meaning: "(also, too)" }
      "すなる": { meaning: "it is said that people do (a custom)" }
      "にっき": { meaning: "diary" }
      "という": { meaning: "(is) called" }
      "もの": { meaning: "thing" }
      "を": { meaning: "(marks the object)" }
      "おんな": { meaning: "woman" }
      "して": { meaning: "(having) done" }
      "みむ": { meaning: "to try (old form)" }
      "とて": { meaning: "(with the intention of)" }
      "する": { meaning: "to do" }
      "なり": { meaning: "(it is; old copula)" }
  "ja-4601":
    native: "The water that I dipped my sleeve in and scooped up has frozen; tonight the spring wind will melt it."
    notes:
      "n1": "The first poem of spring in the Kokin Wakashu. It is about a winter that has not yet let go, and the wind that will break it."
    bases:
      "そで": { meaning: "sleeve" }
      "ひちて": { meaning: "to be soaked (old)" }
      "むすび": { meaning: "scooping up (with the hands)" }
      "し": { meaning: "(past, old)" }
      "みず": { meaning: "water" }
      "の": { meaning: "(of)" }
      "こおれる": { meaning: "to freeze" }
      "を": { meaning: "(marks the object)" }
      "はる": { meaning: "spring" }
      "たつ": { meaning: "to begin (spring begins)" }
      "きょう": { meaning: "today" }
      "かぜ": { meaning: "wind" }
      "や": { meaning: "(a question or a wish)" }
      "とくらん": { meaning: "will melt (old)" }
  "ja-4602":
    native: "The cherry petals have scattered in the wind, and their wake is left on a sky with no water: waves rise on the empty sky."
    notes:
      "n1": "A poem in the Kokin Wakashu. The petals blown by the wind leave a trail that looks like waves in the sky."
    bases:
      "さくらばな": { meaning: "cherry blossoms" }
      "ちりぬる": { meaning: "to scatter (the petals have scattered)" }
      "かぜ": { meaning: "wind" }
      "なごり": { meaning: "trace, wake" }
      "には": { meaning: "(in, on)" }
      "みず": { meaning: "water" }
      "なき": { meaning: "without (old)" }
      "の": { meaning: "(of)" }
      "そら": { meaning: "sky" }
      "に": { meaning: "(in, on)" }
      "なみ": { meaning: "wave" }
      "ぞ": { meaning: "(adds emphasis)" }
      "たちける": { meaning: "to rise (it rose)" }
  "ja-4603":
    native: "The river of Yoshino runs fast, with high waves; I have begun to think of you, and I cannot stop."
    notes:
      "n1": "A love poem in the Kokin Wakashu. The fast river stands for a feeling that cannot be held back."
    bases:
      "よしのがわ": { meaning: "the Yoshino River" }
      "いはなみ": { meaning: "waves against rocks" }
      "たかく": { meaning: "high" }
      "ゆく": { meaning: "to go, to run" }
      "みず": { meaning: "water" }
      "の": { meaning: "(of)" }
      "はやく": { meaning: "quickly, fast" }
      "ぞ": { meaning: "(adds emphasis)" }
      "ひと": { meaning: "person" }
      "を": { meaning: "(marks the object)" }
      "おもひそめ": { meaning: "to begin to think of (someone)" }
      "てし": { meaning: "(has done; old)" }
  "ja-4604":
    native: "The colour of the flowers has faded, in vain; while I was gazing, my own life has grown old in the world."
    notes:
      "n1": "A famous poem about fading. The flower's colour and the poet's looks fade together during long rains of thought. It is also in the Ogura Hyakunin Isshu."
    bases:
      "はなの": { meaning: "of the flowers" }
      "いろ": { meaning: "colour" }
      "は": { meaning: "(marks the topic)" }
      "うつり": { meaning: "to fade, to change" }
      "に": { meaning: "(has)" }
      "けりな": { meaning: "(it has, sadly; old)" }
      "いたづらに": { meaning: "in vain" }
      "わが": { meaning: "my" }
      "み": { meaning: "body, life" }
      "よに": { meaning: "in the world" }
      "ふる": { meaning: "to grow old, to pass" }
      "ながめ": { meaning: "gazing, long thought" }
      "せし": { meaning: "(while doing; old)" }
      "まに": { meaning: "while" }
  "ja-4605":
    native: "I shall soon be gone from this world; for a memory, let me meet you once more."
    notes:
      "n1": "Izumi Shikibu's poem, written near the end of her life, in the Ogura Hyakunin Isshu. The poem asks for a meeting before death."
    bases:
      "あらざらむ": { meaning: "when I am no longer here" }
      "この": { meaning: "this" }
      "よ": { meaning: "world, life" }
      "の": { meaning: "(of)" }
      "ほか": { meaning: "other, outside" }
      "おもひで": { meaning: "memory" }
      "に": { meaning: "(for, as)" }
      "いまひとたび": { meaning: "once more" }
      "あふ": { meaning: "to meet" }
      "こと": { meaning: "thing, (the fact of)" }
      "もがな": { meaning: "I wish that there were (old)" }
  "ja-4606":
    native: "Like a rock azalea: if I keep silent I feel distant, and if I speak my thoughts only grow; that is what I think."
    notes:
      "n1": "From the Izumi Shikibu Shu, poem 698. The azalea grows among rocks and is a plain image for a feeling that does not settle either way."
    bases:
      "いは": { meaning: "rock" }
      "つつじ": { meaning: "azalea" }
      "いはねば": { meaning: "if (I) do not say (old)" }
      "うとし": { meaning: "distant, lonely" }
      "かけて": { meaning: "(to have said, and) so" }
      "いへば": { meaning: "if (I) say" }
      "もの": { meaning: "thing, (the) feeling" }
      "おもひ": { meaning: "thought, feeling" }
      "まさる": { meaning: "to grow greater" }
      "ものを": { meaning: "(though; a sigh of feeling)" }
      "こそ": { meaning: "(emphasis)" }
      "おもへ": { meaning: "I think (old)" }
  "ja-4607":
    native: "We met, and then it was unclear whether it was you or not; then you hid behind the clouds, like the moon at night."
    notes:
      "n1": "Murasaki Shikibu's poem in the Ogura Hyakunin Isshu. It is about a brief meeting with a friend, after which the friend was gone, like the moon behind the clouds."
    bases:
      "めぐりあひて": { meaning: "to meet by chance (and)" }
      "みし": { meaning: "(that I) saw (old)" }
      "や": { meaning: "(a question)" }
      "それ": { meaning: "that, it" }
      "とも": { meaning: "(even)" }
      "わかぬ": { meaning: "not to know, not be clear" }
      "まに": { meaning: "while" }
      "くも": { meaning: "cloud" }
      "がくれ": { meaning: "to hide (behind)" }
      "に": { meaning: "(in, behind)" }
      "し": { meaning: "(past; old)" }
      "よはの": { meaning: "of the night" }
      "つきかげ": { meaning: "moonlight" }
  "ja-4608":
    native: "I did not really fall asleep, yet I thought I saw you come: was it a dream, or was it real?"
    notes:
      "n1": "A poem from Yoshida Kenko's family collection, poem 57. It is about a dream, with a play on the words for waking and reality."
    bases:
      "うちとけて": { meaning: "to relax completely" }
      "まどろむ": { meaning: "to doze" }
      "と": { meaning: "(marks a quotation or a limit)" }
      "しも": { meaning: "(emphasis: even)" }
      "なき": { meaning: "without (old)" }
      "ものを": { meaning: "though (old)" }
      "あふ": { meaning: "to meet" }
      "みつる": { meaning: "(I) saw (old)" }
      "や": { meaning: "(a question)" }
      "うつつ": { meaning: "reality, waking" }
      "なるらん": { meaning: "I wonder whether it is (old)" }
  "ja-4609":
    native: "Like the long tail of a mountain pheasant, the night is so long, and I sleep alone."
    notes:
      "n1": "A poem in the Ogura Hyakunin Isshu, attributed to Kakinomoto no Hitomaro. The long tail of the pheasant stands for the long night."
    bases:
      "あしびき": { meaning: "a word that goes with mountains (a pillow word)" }
      "の": { meaning: "(of)" }
      "やまどり": { meaning: "mountain pheasant" }
      "を": { meaning: "(tail, as in the tail of a bird)" }
      "しだり": { meaning: "hanging down" }
      "ながながし": { meaning: "long" }
      "よ": { meaning: "night" }
      "ひとり": { meaning: "alone" }
      "かも": { meaning: "I wonder (old)" }
      "ねむ": { meaning: "to sleep" }
  "ja-4610":
    native: "At the Misaka shrine I offer cloth to the gods of the sword and pray; my life is for my mother and father."
    notes:
      "n1": "A poem from the Manyoshu, Book 20, by a sakimori, a soldier sent to guard the frontier. The poem is from a monument at the Kamisaka shrine, and its author is not known."
    bases:
      "ちはやぶる": { meaning: "a word that goes with the gods (a pillow word)" }
      "かみ": { meaning: "god" }
      "の": { meaning: "(of)" }
      "みさか": { meaning: "the Misaka (a place name, a sacred slope)" }
      "に": { meaning: "(at)" }
      "ぬさ": { meaning: "offering of cloth" }
      "まつり": { meaning: "to offer, to make offering" }
      "いはふ": { meaning: "to pray for safety" }
      "いのち": { meaning: "life" }
      "は": { meaning: "(marks the topic)" }
      "おもちち": { meaning: "mother and father" }
      "が": { meaning: "(of)" }
      "ため": { meaning: "for the sake of" }
  "ja-4611":
    native: "Again and again: never forget the beginner's mind."
    notes:
      "n1": "From the Fushikaden, Zeami's treatise on noh. The beginner's mind is the first feeling that the actor should keep at every stage of his art."
    bases:
      "ただ": { meaning: "just, only" }
      "かえすがえす": { meaning: "again and again" }
      "しょしん": { meaning: "the beginner's mind" }
      "わするべからず": { meaning: "must not forget" }
  "ja-4612":
    native: "Keeping it secret is the flower; not keeping it secret is not the flower."
    notes:
      "n1": "From the Fushikaden. The flower is the charm of noh, which the actor must hide to keep it fresh."
    bases:
      "ひすれば": { meaning: "if (one) keeps it secret" }
      "はな": { meaning: "flower (the charm of noh)" }
      "なり": { meaning: "is" }
      "ひせず": { meaning: "if (one) does not keep it secret" }
      "は": { meaning: "(marks the topic)" }
      "なるべからず": { meaning: "must not be" }
  "ja-4613":
    native: "The year's end: the water flows, and so does the human body."
    notes:
      "n1": "A haiku by Kikaku, which he wrote on the night before the Ako raid of 1702. The image of flowing water and a passing life is a common image in haiku."
    bases:
      "とし": { meaning: "year" }
      "の": { meaning: "(of)" }
      "せ": { meaning: "end (the end of the year)" }
      "や": { meaning: "(a cutting word: a pause)" }
      "みず": { meaning: "water" }
      "ながれ": { meaning: "flow" }
      "と": { meaning: "(and, like)" }
      "ひと": { meaning: "person" }
      "み": { meaning: "body" }
      "は": { meaning: "(marks the topic)" }
  "ja-4614":
    native: "This world's farewell, and the night's farewell too: a person going to die is like the frost on the road of the field of the unknown dead."
    notes:
      "n1": "The beginning of the michiyuki, the lovers' journey, in Sonezaki Shinju. The lovers walk toward death, and the frost on the road marks the way of the dead."
    bases:
      "この": { meaning: "this" }
      "よ": { meaning: "world" }
      "の": { meaning: "(of)" }
      "なごり": { meaning: "farewell, what is left behind" }
      "も": { meaning: "(also)" }
      "し": { meaning: "(emphasis)" }
      "にゆく": { meaning: "to go (to die)" }
      "み": { meaning: "person, body" }
      "を": { meaning: "(marks the object)" }
      "たとえれば": { meaning: "if one compares (it to)" }
      "あだしがはら": { meaning: "the field of the unknown dead" }
      "みち": { meaning: "road" }
      "しも": { meaning: "frost" }
  "ja-4615":
    native: "They became a model of love with no doubt of rebirth in the Pure Land."
    notes:
      "n1": "The closing line of the michiyuki in Sonezaki Shinju. It says the lovers will be reborn together without doubt."
    bases:
      "みらい": { meaning: "future" }
      "じょうぶつ": { meaning: "to become a Buddha, be reborn in paradise" }
      "うたがい": { meaning: "doubt" }
      "なき": { meaning: "without (old)" }
      "こい": { meaning: "love" }
      "の": { meaning: "(of)" }
      "てほん": { meaning: "model, example" }
      "と": { meaning: "(as)" }
      "なり": { meaning: "to become" }
      "にけり": { meaning: "(has become; old)" }
  "ja-4616":
    native: "How happy I am, that is about the middle; my year in my home village."
    notes:
      "n1": "The title line of Issa's diary, Oraga Haru. Issa wrote it in 1819, and the title means something like my spring at home. It is also a joke about the middle of his life."
    bases:
      "めでたさ": { meaning: "happiness, joy" }
      "も": { meaning: "(even)" }
      "ちゅう": { meaning: "middle" }
      "ぐらい": { meaning: "about, degree" }
      "なり": { meaning: "is" }
      "おらが": { meaning: "our, my (dialect)" }
      "はる": { meaning: "spring, year" }
  "ja-4617":
    native: "The mist rises, the buds are not yet out, and the spring snow falls: flowers without flowers have scattered in the villages."
    notes:
      "n1": "A spring poem in the Kokin Wakashu, poem 9. The snow falls on the trees so that they look as if they are in flower, though there are no flowers."
    bases:
      "かすみ": { meaning: "mist" }
      "たち": { meaning: "to rise" }
      "この": { meaning: "these" }
      "め": { meaning: "bud, shoot" }
      "も": { meaning: "(also)" }
      "はる": { meaning: "spring" }
      "の": { meaning: "(of)" }
      "ゆき": { meaning: "snow" }
      "ふれば": { meaning: "when it falls" }
      "はな": { meaning: "flower" }
      "なき": { meaning: "without (old)" }
      "さとも": { meaning: "in the villages" }
      "ぞ": { meaning: "(emphasis)" }
      "ちりける": { meaning: "to scatter (have scattered)" }
