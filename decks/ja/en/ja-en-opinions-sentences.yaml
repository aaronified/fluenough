"cards":
  "ja-9640":
    "native": "I agree with the opinion."
    "bases":
      "は":
        "meaning": "(topic particle)"
      "に":
        "meaning": "(marks the thing agreed with)"
      "します":
        "meaning": "do (polite)"
    "confusables":
      "w1":
        "why": "denial, not agreement"
      "w2":
        "why": "criticism, not agreement"
    "notes":
      "n1": "The particle に (ni) marks the thing you agree with."
  "ja-9641":
    "native": "What is your opinion?"
    "bases":
      "の":
        "meaning": "(of, possessive)"
      "は":
        "meaning": "(topic particle)"
      "です":
        "meaning": "(to be, polite)"
      "か":
        "meaning": "(question particle)"
    "confusables":
      "w1":
        "why": "an idea of your own, not the opinion asked for"
      "w2":
        "why": "an official stance, not a personal opinion"
  "ja-9642":
    "native": "The result is certain."
    "bases":
      "は":
        "meaning": "(topic particle)"
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "a guess about what will probably happen"
      "w2":
        "why": "maybe, which is not yet certain"
  "ja-9643":
    "native": "I probably agree."
    "bases":
      "は":
        "meaning": "(topic particle)"
      "します":
        "meaning": "do (polite)"
    "confusables":
      "w1":
        "why": "surely, a certainty rather than a guess"
      "w2":
        "why": "certainly, not probably"
  "ja-9644":
    "native": "I believe the result."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "しんじます":
        "meaning": "believe (polite)"
    "confusables":
      "w1":
        "why": "a forecast, not a result"
      "w2":
        "why": "an explanation, not a result"
  "ja-9645":
    "native": "I explain the reason."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "します":
        "meaning": "do (polite)"
    "confusables":
      "w1":
        "why": "a problem, not a reason"
      "w2":
        "why": "a result, not a reason"
  "ja-9646":
    "native": "I think about how to solve the problem."
    "bases":
      "の":
        "meaning": "(of, possessive)"
      "を":
        "meaning": "(marks the thing acted on)"
      "かんがえます":
        "meaning": "think (polite)"
    "confusables":
      "w1":
        "why": "a method, a way to reach a solution"
      "w2":
        "why": "a proposal, not a solution itself"
  "ja-9647":
    "native": "I read the paper."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "よみます":
        "meaning": "read (polite)"
    "confusables":
      "w1":
        "why": "a debate, not a written paper"
      "w2":
        "why": "an explanation, not a written paper"
  "ja-9648":
    "native": "The debate is interesting."
    "bases":
      "が":
        "meaning": "(marks the subject)"
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "a counter-argument, not the debate itself"
      "w2":
        "why": "a difference, not a debate"
  "ja-9649":
    "native": "Criticism is important."
    "bases":
      "は":
        "meaning": "(topic particle)"
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "a complaint, not criticism of a view"
      "w2":
        "why": "a denial, not criticism"
  "ja-9650":
    "native": "I speak my true feelings."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "はなします":
        "meaning": "speak, talk (polite)"
    "confusables":
      "w1":
        "why": "an official face, not true feelings"
      "w2":
        "why": "a complaint, not a true feeling"
  "ja-9651":
    "native": "There is a lot of dissatisfaction."
    "bases":
      "が":
        "meaning": "(marks the subject)"
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "a complaint, one act of protest"
      "w2":
        "why": "criticism, not dissatisfaction"
  "ja-9652":
    "native": "I refuse firmly."
    "bases":
      "と":
        "meaning": "(adverb ending, after きっぱり (kippari))"
      "ことわります":
        "meaning": "refuse (polite)"
    "confusables":
      "w1":
        "why": "clearly, not firmly refusing"
      "w2":
        "why": "as expected, not a refusal"
  "ja-9653":
    "native": "As I thought, I understood."
    "bases":
      "わかりました":
        "meaning": "understood (polite)"
    "confusables":
      "w1":
        "why": "rather, not as expected"
      "w2":
        "why": "in short, not as I thought"
  "ja-9654":
    "native": "The judgement was wrong."
    "bases":
      "は":
        "meaning": "(topic particle)"
      "まちがえました":
        "meaning": "was wrong, made a mistake (polite)"
    "confusables":
      "w1":
        "why": "a conviction, not a judgement"
      "w2":
        "why": "a result, not a judgement"
  "ja-9655":
    "native": "However, I will not stop."
    "bases":
      "は":
        "meaning": "(topic particle)"
      "やめません":
        "meaning": "stop (polite, negative)"
    "confusables":
      "w1":
        "why": "in short, not a contrast"
      "w2":
        "why": "so, a result rather than a contrast"
  "ja-9656":
    "native": "I listen to all the opinions."
    "bases":
      "の":
        "meaning": "(of, possessive)"
      "を":
        "meaning": "(marks the thing acted on)"
      "ききます":
        "meaning": "listen, ask (polite)"
    "confusables":
      "w1":
        "why": "a debate, not listening"
      "w2":
        "why": "a method, not an opinion"
