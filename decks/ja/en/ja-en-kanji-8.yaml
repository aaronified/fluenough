schema: 1
id: "ja-en-kanji-8"
kind: "layer"
core: "ja-kanji-8"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 8: grade 2, part 4"
description: "Thirty-two kanji of the second school grade, each taught by the kana reading of the word it stands for. Some have one example or none yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-5360":
    native: "front; before"
    notes:
      "n1": "前 (mae): on reading ゼン (zen); kun reading まえ (mae). It is in 午前 (gozen), morning."
    examples:
      "えきの前にこうえんがあります。": "There is a park in front of the station."
      "午前にがっこうへいきます。": "I go to school in the morning."
  "ja-5361":
    native: "group; class; set"
    notes:
      "n1": "組 (kumi): on reading ソ (so); kun readings くむ (kumu) and くみ (kumi). It is in 組合 (kumiai), an association."
  "ja-5362":
    native: "run"
    notes:
      "n1": "走 (hashiru): on reading ソウ (sou); kun reading はしる (hashiru). It is in 競走 (kyousou), a race."
    examples:
      "わたしはこうえんで走ります。": "I run in the park."
  "ja-5363":
    native: "many; much"
    notes:
      "n1": "多 (ooi): on reading タ (ta); kun reading おおい (ooi). It is in 多分 (tabun), probably."
    examples:
      "ひとが多いです。": "There are many people."
  "ja-5364":
    native: "fat; thick"
    notes:
      "n1": "太 (futoi): on readings タイ (tai) and タ (ta); kun readings ふとい (futoi) and ふとる (futoru). It is in 太陽 (taiyou), the sun."
  "ja-5365":
    native: "body"
    notes:
      "n1": "体 (karada): on readings タイ (tai) and テイ (tei); kun reading からだ (karada). It is in 体育 (taiiku), physical education."
    examples:
      "体がいたいです。": "My body hurts."
  "ja-5366":
    native: "stand; platform"
    notes:
      "n1": "台 (dai): on readings ダイ (dai) and タイ (tai); no kun reading. It is in 台所 (daidokoro), kitchen."
  "ja-5367":
    native: "ground; land"
    notes:
      "n1": "地 (chi): on readings チ (chi) and ジ (ji); no kun reading. It is in 地図 (chizu), map."
    examples:
      "地図をみます。": "I look at a map."
  "ja-5368":
    native: "pond"
    notes:
      "n1": "池 (ike): on reading チ (chi); kun reading いけ (ike). It is in 電池 (denchi), battery."
    examples:
      "こうえんに池があります。": "There is a pond in the park."
  "ja-5369":
    native: "know"
    notes:
      "n1": "知 (shiru): on reading チ (chi); kun reading しる (shiru). It is in 知識 (chishiki), knowledge."
    examples:
      "わたしは知りません。": "I don't know."
  "ja-5370":
    native: "tea"
    notes:
      "n1": "茶 (cha): on readings チャ (cha) and サ (sa); no kun reading. It is in 紅茶 (koucha), black tea."
    examples:
      "お茶をのみます。": "I drink tea."
  "ja-5371":
    native: "daytime; noon"
    notes:
      "n1": "昼 (hiru): on reading チュウ (chuu); kun reading ひる (hiru). It is in 昼食 (chuushoku), lunch."
    examples:
      "昼にごはんをたべます。": "I eat lunch at noon."
  "ja-5372":
    native: "long; chief"
    notes:
      "n1": "長 (nagai): on reading チョウ (chou); kun reading ながい (nagai). It is in 社長 (shachou), company president."
    examples:
      "みちが長いです。": "The road is long."
  "ja-5373":
    native: "bird"
    notes:
      "n1": "鳥 (tori): on reading チョウ (chou); kun reading とり (tori). It is in 小鳥 (kotori), a small bird."
    examples:
      "わたしは鳥がすきです。": "I like birds."
  "ja-5374":
    native: "morning"
    notes:
      "n1": "朝 (asa): on reading チョウ (chou); kun reading あさ (asa). It is in 毎朝 (maiasa), every morning."
    examples:
      "朝ははやくおきます。": "I get up early in the morning."
  "ja-5375":
    native: "straight; direct; at once"
    notes:
      "n1": "直 (tadachini): on readings チョク (choku) and ジキ (jiki); kun readings ただちに (tadachini), なおす (naosu) and なおる (naoru). It is in 直接 (chokusetsu), direct."
  "ja-5376":
    native: "pass through; traffic; street"
    notes:
      "n1": "通 (tooru): on readings ツウ (tsuu) and (ツ) (tsu); kun readings とおる (tooru), とおす (toosu) and かよう (kayou). It is in 交通 (koutsuu), traffic."
    examples:
      "この通りはしずかです。": "This street is quiet."
      "交通がべんりです。": "Transport is convenient."
  "ja-5377":
    native: "younger brother"
    notes:
      "n1": "弟 (otouto): on readings テイ (tei), (ダイ) (dai) and (デ) (de); kun reading おとうと (otouto). It is in 兄弟 (kyoudai), brothers."
    examples:
      "弟はがくせいです。": "My younger brother is a student."
  "ja-5378":
    native: "shop"
    notes:
      "n1": "店 (mise): on reading テン (ten); kun reading みせ (mise). It is in 書店 (shoten), bookshop."
    examples:
      "店はちかいです。": "The shop is near."
  "ja-5379":
    native: "point; dot; mark"
    notes:
      "n1": "点 (ten): on reading テン (ten); no kun reading. It is in 点数 (tensuu), score."
  "ja-5380":
    native: "electricity"
    notes:
      "n1": "電 (denki): on reading デン (den); no kun reading. It is in 電話 (denwa), telephone."
    examples:
      "電気はたかいです。": "Electricity is expensive."
      "電車でこうえんへいきます。": "I go to the park by train."
  "ja-5381":
    native: "sword; knife"
    notes:
      "n1": "刀 (katana): on reading トウ (tou); kun reading かたな (katana). It is in 日本刀 (nihontou), a Japanese sword."
  "ja-5382":
    native: "winter"
    notes:
      "n1": "冬 (fuyu): on reading トウ (tou); kun reading ふゆ (fuyu). It is in 冬休み (fuyuyasumi), winter holiday."
    examples:
      "冬はさむいです。": "Winter is cold."
      "冬休みはたのしいです。": "The winter holiday is fun."
  "ja-5383":
    native: "hit; be due; this"
    notes:
      "n1": "当 (ataru): on reading トウ (tou); kun readings あたる (ataru) and あてる (ateru). It is in 当然 (touzen), natural."
    examples:
      "本当にたのしいです。": "It is really fun."
  "ja-5384":
    native: "east"
    notes:
      "n1": "東 (higashi): on reading トウ (tou); kun reading ひがし (higashi). It is in 東京 (toukyou), Tokyo."
    examples:
      "東に山があります。": "There is a mountain to the east."
      "東京は大きいです。": "Tokyo is big."
  "ja-5385":
    native: "answer; reply"
    notes:
      "n1": "答 (kotae): on reading トウ (tou); kun readings こたえる (kotaeru) and こたえ (kotae). It is in 解答 (kaitou), answer."
  "ja-5386":
    native: "head"
    notes:
      "n1": "頭 (atama): on readings トウ (tou), ズ (zu) and (ト) (to); kun readings あたま (atama) and かしら (kashira). It is in 先頭 (sentou), the front."
    examples:
      "頭がいたいです。": "My head hurts."
  "ja-5387":
    native: "same; together"
    notes:
      "n1": "同 (onaji): on reading ドウ (dou); kun reading おなじ (onaji). It is in 同時 (douji), at the same time."
  "ja-5388":
    native: "road; way"
    notes:
      "n1": "道 (michi): on readings ドウ (dou) and (トウ) (tou); kun reading みち (michi). It is in 道路 (douro), road."
    examples:
      "道をあるきます。": "I walk along the road."
      "近道でいきます。": "I go by the shortcut."
  "ja-5389":
    native: "read"
    notes:
      "n1": "読 (yomu): on readings ドク (doku), トク (toku) and (トウ) (tou); kun reading よむ (yomu). It is in 読書 (dokusho), reading books."
    examples:
      "本を読みます。": "I read books."
  "ja-5390":
    native: "inside; within"
    notes:
      "n1": "内 (uchi): on readings ナイ (nai) and (ダイ) (dai); kun reading うち (uchi). It is in 内容 (naiyou), contents."
  "ja-5391":
    native: "south"
    notes:
      "n1": "南 (minami): on readings ナン (nan) and (ナ) (na); kun reading みなみ (minami). It is in 南極 (nankyoku), the South Pole."
    examples:
      "南にうみがあります。": "There is a sea to the south."
