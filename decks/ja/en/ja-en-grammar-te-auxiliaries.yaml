native: { code: "en", iso639_3: "eng", name: "English" }
name: "Helper verbs after the te-form: しまう (shimau), おく (oku) and みる (miru)"
description: "After the te-form, しまいます (shimaimasu) says that something is done completely, おきます (okimasu) that it is done in advance, and みます (mimasu) that you try it: たべてみます (tabete mimasu), I try eating it. Every verb a course deck teaches has a row. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "te-shimau": "{meaning} completely"
    "te-oku": "{meaning} in advance"
    "te-miru": "try to {meaning}"
rules:
  "ja-rule-te-shimau":
    name: "てしまう (te shimau): do completely"
    explanation: "{1} follows the te-form to say that something is done completely, or done by mistake: {2} means I eat it all up."
  "ja-rule-te-oku":
    name: "ておく (te oku): do in advance"
    explanation: "{1} follows the te-form to say that you do something in advance: {2} means I write it in advance."
  "ja-rule-te-miru":
    name: "てみる (te miru): try"
    explanation: "{1} follows the te-form to say that you try doing something: {2} means I try eating it."
