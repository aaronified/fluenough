schema: 1
id: "ja-en-help"
kind: "layer"
core: "ja-help"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Help"
description: "Twenty-five words for asking for help: the police, the ambulance and the fire service, danger and caution, being lost and in trouble, and the verbs to call, help and protect. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "ja-1218":
    native: "police"
    notes:
      "n1": "けいさつ (keisatsu) is the police."
    examples:
      "けいさつをよびます。":
        native: "I call the police."
        bases:
          "を":
            meaning: "(marks the thing acted on)"
          "よびます":
            meaning: "to call"
      "けいさつはどこですか。":
        native: "Where is the police?"
        bases:
          "は":
            meaning: "(marks the topic)"
          "です":
            meaning: "is (polite)"
          "か":
            meaning: "(marks a question)"
