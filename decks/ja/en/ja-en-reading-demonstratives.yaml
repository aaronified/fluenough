passages:
  - id: "ja-demonstratives-1"
    title: "A desk and a dog"
    sentences:
      - text: "これはつくえです。"
        reading: "kore wa tsukue desu."
      - text: "あれはとうきょうです。"
        reading: "are wa toukyou desu."
      - text: "そのいぬはおおきいです。"
        reading: "sono inu wa ookii desu."
      - text: "どのいぬですか。"
        reading: "dono inu desu ka."
    questions:
      - id: "ja-0673"
        prompt:
          en: "Which line says that this is a desk?"
        options:
          - en: "The first line"
          - en: "The second line"
        answer: 1
      - id: "ja-0674"
        prompt:
          en: "The second line says that the thing over there is Tokyo."
        answer: true
      - id: "ja-0675"
        prompt:
          en: "Which line asks which dog?"
        options:
          - en: "The third line"
          - en: "The fourth line"
        answer: 2
  - id: "ja-demonstratives-2"
    title: "A lost key"
    sentences:
      - text: "このかぎはどこですか。"
        reading: "kono kagi wa doko desu ka."
      - text: "そのひとはせんせいです。"
        reading: "sono hito wa sensei desu."
      - text: "あのがっこうはしずかです。"
        reading: "ano gakkou wa shizuka desu."
      - text: "それはりんごですか。"
        reading: "sore wa ringo desu ka."
    questions:
      - id: "ja-0676"
        prompt:
          en: "Which line asks where the key is?"
        options:
          - en: "The first line"
          - en: "The second line"
        answer: 1
      - id: "ja-0677"
        prompt:
          en: "The third line says that the school over there is quiet."
        answer: true
      - id: "ja-0678"
        prompt:
          en: "Which line asks whether that is an apple?"
        options:
          - en: "The third line"
          - en: "The fourth line"
        answer: 2
