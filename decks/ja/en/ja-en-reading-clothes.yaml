  - "id": "ja-clothes-2"
    "title": "A shopping trip"
    "sentences":
      - "text": "きょうは、くつをかいにいきます。"
        "reading": "kyou wa, kutsu o kai ni ikimasu."
      - "text": "くろのズボンがきつかったので、おおきいサイズをみました。"
        "reading": "kuro no zubon ga kitsukatta node, ookii saizu o mimashita."
