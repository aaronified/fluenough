id: "ja-en-grammar-te-auxiliaries-sentences"
kind: "layer"
core: "ja-grammar-te-auxiliaries-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Helper verbs after the te-form, in sentences"
description: "Sentences with しまう (shimau), おく (oku) and みる (miru) after the te-form, to put in order, each with the words it could be mistaken for. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "ja-4479":
    native: "I have eaten all the food."
    notes:
      "n1": "しまいました (shimaimashita) is from しまう (shimau). Here it is a helper verb, not the verb 'to put away'."
    bases:
      "を": { meaning: "(marks the thing acted on)" }
      "しまいました": { meaning: "to finish; to end up doing" }
    confusables:
      w1: { why: "たべる (taberu) means to eat." }
      w2: { why: "のむ (nomu) means to drink." }
  "ja-4480":
    native: "I will read the book in advance."
    notes:
      "n1": "おきます (okimasu) is from おく (oku), 'to put'. After a te-form it is a helper verb and means 'in advance'."
    bases:
      "を": { meaning: "(marks the thing acted on)" }
      "おきます": { meaning: "to put; to do in advance" }
    confusables:
      w1: { why: "よむ (yomu) means to read." }
      w2: { why: "かく (kaku) means to write." }
  "ja-4481":
    native: "I will try reading this book."
    notes:
      "n1": "The te form with みます (mimasu) means try doing: よんで (yonde), reading, + みます (mimasu)."
    bases:
      "この": { meaning: "this" }
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "よむ (yomu) means to read." }
      w2: { why: "かく (kaku) means to write." }
  "ja-4482":
    native: "I will try drinking the coffee."
    bases:
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "のむ (nomu) means to drink." }
      w2: { why: "たべる (taberu) means to eat." }
  "ja-4483":
    native: "I will cook in advance."
    notes:
      "n1": "ておきます (te okimasu) means to do something in advance so that it is ready: つくって (tsukutte), cook."
    bases:
      "を": { meaning: "(marks the thing acted on)" }
      "おきます": { meaning: "to put; to do in advance" }
    confusables:
      w1: { why: "つくる (tsukuru) means to make; to create." }
      w2: { why: "たべる (taberu) means to eat." }
  "ja-4484":
    native: "I ended up going to bed early today."
    notes:
      "n1": "てしまいました (te shimaimashita) often shows regret over an outcome: ねてしまいました (nete shimaimashita), I ended up sleeping."
    bases:
      "は": { meaning: "(marks the topic)" }
      "しまいました": { meaning: "to finish; to end up doing" }
    confusables:
      w1: { why: "ねる (neru) means to sleep; to go to bed." }
      w2: { why: "おきる (okiru) means to get up; to wake up." }
  "ja-4485":
    native: "I will finish writing the letter."
    notes:
      "n1": "Here てしまいます (te shimaimasu) marks the action as complete, not regretted: かいて (kaite), write, + しまいます (shimaimasu)."
    bases:
      "を": { meaning: "(marks the thing acted on)" }
      "しまいます": { meaning: "to finish; to end up doing" }
    confusables:
      w1: { why: "かく (kaku) means to write." }
      w2: { why: "よむ (yomu) means to read." }
  "ja-4486":
    native: "I will try the cake."
    bases:
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "たべる (taberu) means to eat." }
      w2: { why: "のむ (nomu) means to drink." }
