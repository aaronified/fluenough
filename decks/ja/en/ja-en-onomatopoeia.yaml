"name": "Onomatopoeia"
"description": "Fifty sound and state words, the mimetic adverbs of Japanese: the sounds of speech and rain, the looks and the feel of things, the movements of people, and the moods such as happy, sad and bored. The unit is filed under the idioms theme, as there is no onomatopoeia theme yet. Not yet checked by a Japanese speaker: please report any mistake."
