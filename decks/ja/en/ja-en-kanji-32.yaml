kind: "layer"
core: "ja-kanji-32"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 32: grade 6, part 1"
description: "Twenty-seven kanji of the sixth school grade, each taught by the kana reading of the word it stands for. Eighteen have no example yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-6800":
    native: "to pass away"
    notes:
      "n1": "亡 (nakunaru): on reading ボウ (bou); the reading モウ (mou) is a special or very narrow use. Kun reading な-い (na-i). Its kana なくなる (nakunaru), to pass away, is the word it stands for in its kun reading, written 亡くなる (nakunaru). No taught card has that kana. The taught card しぼう (shibou) is 志望 (shibou), application; wish, a different word from 死亡 (shibou), death, so it is not used. No taught word card is written with 亡 (bou) and only taught kanji, so it has no example yet."
  "ja-6801":
    native: "a sun, a unit of length"
    notes:
      "n1": "寸 (sun): on reading スン (sun). No kun reading. Its kana すん (sun), a sun, a unit of length of about three centimetres, is the word it stands for alone. No taught card has that kana. No taught word card is written with 寸 (sun) and only taught kanji, so it has no example yet."
  "ja-6802":
    native: "oneself; self"
    notes:
      "n1": "己 (onore): on readings コ (ko) and キ (ki); kun reading おのれ (onore). Its kana おのれ (onore), oneself, is the word it stands for in its kun reading, written 己 (onore). No taught card has that kana. The taught card じこ (jiko) is 事故 (jiko), accident, a different word from 自己 (jiko), self, so it is not used. No taught word card is written with 己 (onore) and only taught kanji, so it has no example yet."
  "ja-6803":
    native: "to hang out to dry"
    notes:
      "n1": "干 (hosu): on reading カン (kan); kun readings ほ-す (ho-su) and ひ-る (hi-ru). Its kana ほす (hosu), to hang out to dry, is the word it stands for in its kun reading ほ-す (ho-su), written 干す (hosu). The taught card ほす (hosu) is the same word, 干す (hosu). It is in 干します (hoshimasu), to hang out to dry."
    examples:
      "せんたくを干します。": "I hang the laundry out to dry."
      "ふとんを物干しにかけます。": "I hang the futon on the drying rack."
  "ja-6804":
    native: "benevolence; humanity"
    notes:
      "n1": "仁 (jin): on reading ジン (jin). The reading ニ (ni), given in parentheses in the table, is a special or very narrow use. No kun reading. Its kana じん (jin), benevolence, is the word it stands for alone. No taught card has that kana. No taught word card is written with 仁 (jin) and only taught kanji, so it has no example yet."
  "ja-6805":
    native: "to put away; to store"
    notes:
      "n1": "収 (osameru): on reading シュウ (shuu); kun readings おさ-める (osa-meru) and おさ-まる (osa-maru). Its kana おさめる (osameru), to put away; to store, is the word it stands for in its kun reading, written 収める (osameru). No taught card has that kana. It is in 収入 (shuunyuu), income."
    examples:
      "収入は大切です。": "Income is important."
      "領収書をもらいます。": "I get a receipt."
  "ja-6806":
    native: "shaku, a unit of length"
    notes:
      "n1": "尺 (shaku): on reading シャク (shaku). No kun reading. Its kana しゃく (shaku), a shaku, a unit of length of about thirty centimetres, is the word it stands for alone. No taught card has that kana. No taught word card is written with 尺 (shaku), so it has no example yet."
  "ja-6807":
    native: "one of a pair; one side"
    notes:
      "n1": "片 (kata): on reading ヘン (hen); kun reading かた (kata). Its kana かた (kata), one of a pair, is the word it stands for in its kun reading, written 片 (kata). Taught cards have the same kana for different words: 方 (kata), person (polite) and direction; 型 (kata), form; 潟 (kata), lagoon; and かた (kata), shoulder. None is the same word as 片 (kata). The example uses the taught card かたづける (katazukeru), to tidy up, written 片付ける (katazukeru), with the taught card へや (heya), room, written 部屋 (heya), を (o) and the masu form 片付けます (katazukemasu). 部屋 (heya) is a jukujikun, a whole-word reading that is not built from its kanji one by one. The second example uses the taught card あとかたづけ (atokatadzuke), clearing up afterwards, written 後片付け (atokatadzuke), with は (wa), 大変 (taihen), hard; tough, and です (desu)."
    examples:
      "部屋を片付けます。": "I tidy up the room."
      "後片付けは大変です。": "Clearing up afterwards is hard."
  "ja-6808":
    native: "counter for books"
    notes:
      "n1": "冊 (satsu): on readings サツ (satsu) and サク (saku). No kun reading. Its kana さつ (satsu), the counter for bound items such as books, is the word it stands for alone. No taught card has that kana, so it has no example yet."
  "ja-6809":
    native: "processing; handling"
    notes:
      "n1": "処 (shori): on reading ショ (sho). No kun reading. Alone 処 (sho) is not a word, so the card uses its compound 処理 (shori), processing; handling, the commonest word it appears in. No taught card has that kana, so it has no example yet."
  "ja-6810":
    native: "young; small"
    notes:
      "n1": "幼 (osanai): on reading ヨウ (you); kun reading おさな-い (osana-i). Its kana おさない (osanai), young; small, is the word it stands for in its kun reading, written 幼い (osanai). No taught card has that kana. The taught card ようじ (youji) is 用事 (youji), an errand; business matter, a different word from 幼児 (youji), young child, so it is not used. No taught word card is written with 幼 (you) and only taught kanji, so it has no example yet."
  "ja-6811":
    native: "government office"
    notes:
      "n1": "庁 (kanchou): on reading チョウ (chou). No kun reading. Alone 庁 (chou) is not a word, so the card uses its compound 官庁 (kanchou), government office, the commonest word it appears in. No taught card has that kana, so it has no example yet."
  "ja-6812":
    native: "hole"
    notes:
      "n1": "穴 (ana): on reading ケツ (ketsu); kun reading あな (ana). Its kana あな (ana), hole, is the word it stands for in its kun reading, written 穴 (ana). No taught card has that kana, so it has no example yet."
  "ja-6813":
    native: "dangerous; unsafe"
    notes:
      "n1": "危 (abunai): on reading キ (ki); kun readings あぶ-ない (abu-nai), あや-うい (aya-ui) and あや-ぶむ (aya-bumu). Its kana あぶない (abunai), dangerous; unsafe, is the word it stands for in its kun reading, written 危ない (abunai). The taught card あぶない (abunai) is the same word, 危ない (abunai). The first example uses the taught card きけん (kiken), danger, written 危険 (kiken), with ここ (koko), here, は (wa) and です (desu). The second example uses the same taught card with いぬ (inu), dog, written 犬 (inu), with は (wa) and です (desu)."
    examples:
      "ここは危険です。": "This place is dangerous."
      "犬は危ないです。": "The dog is dangerous."
  "ja-6814":
    native: "empress"
    notes:
      "n1": "后 (kougou): on reading コウ (kou). No kun reading. Alone 后 (kou) is not a word, so the card uses its compound 皇后 (kougou), empress, the commonest word it appears in. No taught card has that kana, so it has no example yet."
  "ja-6815":
    native: "to breathe in"
    notes:
      "n1": "吸 (suu): on reading キュウ (kyuu); kun reading す-う (su-u). Its kana すう (suu), to breathe in, is the word it stands for in its kun reading, written 吸う (suu). The taught card すう (suu) is a different word, 数 (suu), a number; several, so it is not used. The compound 呼吸 (kokyuu), breathing, is not used because 呼 (ko) is not taught yet. No taught word card is written with 吸 (kyuu) and only taught kanji, so it has no example yet."
  "ja-6816":
    native: "existence; to exist"
    notes:
      "n1": "存 (sonzai): on readings ソン (son) and ゾン (zon). No kun reading. Alone 存 (son) is not a word, so the card uses its compound 存在 (sonzai), existence, the commonest word it appears in. No taught card has that kana, so it has no example yet."
  "ja-6817":
    native: "one's home"
    notes:
      "n1": "宅 (taku): on reading タク (taku). No kun reading. Its kana たく (taku), one's home, is the word it stands for in its polite sense. No taught card has that kana. The first example uses the taught card じゅうたく (juutaku), house; dwelling, written 住宅 (juutaku), with は (wa), 大きい (ookii), big, and です (desu). The second example uses the taught card たくはいびん (takuhaibin), home delivery service, written 宅配便 (takuhaibin), with は (wa), 高い (takai), expensive, and です (desu)."
    examples:
      "住宅は大きいです。": "The house is big."
      "宅配便は高いです。": "Home delivery is expensive."
  "ja-6818":
    native: "universe; space"
    notes:
      "n1": "宇 (uchuu): on reading ウ (u). No kun reading. Alone 宇 (u) is not a word, so the card uses its compound 宇宙 (uchuu), space; universe, the commonest word it appears in. The taught card うちゅう (uchuu) is the same word, 宇宙 (uchuu). No taught word card is written 宇宙 (uchuu) with only taught kanji, because 宙 (chuu) is not taught yet, so it has no example yet."
  "ja-6819":
    native: "desk"
    notes:
      "n1": "机 (tsukue): on reading キ (ki); kun reading つくえ (tsukue). Its kana つくえ (tsukue), desk, is the word it stands for in its kun reading, written 机 (tsukue). The taught card つくえ (tsukue) is the same word, 机 (tsukue). The example uses that card with は (wa), 古い (furui), old, and です (desu)."
    examples:
      "机は古いです。": "The desk is old."
  "ja-6820":
    native: "ash"
    notes:
      "n1": "灰 (hai): on reading カイ (kai); kun reading はい (hai). Its kana はい (hai), ash, is the word it stands for in its kun reading, written 灰 (hai). The taught card はい (hai) in the phrasebook is a different word, はい (hai), yes, so it is not used. No taught word card is written with 灰 (hai) and only taught kanji, so it has no example yet."
  "ja-6821":
    native: "to reach; to arrive at"
    notes:
      "n1": "至 (itaru): on reading シ (shi); kun reading いた-る (ita-ru). Its kana いたる (itaru), to reach; to arrive at, is the word it stands for in its kun reading, written 至る (itaru). No taught card has that kana, so it has no example yet."
  "ja-6822":
    native: "tongue"
    notes:
      "n1": "舌 (shita): on reading ゼツ (zetsu); kun reading した (shita). Its kana した (shita), tongue, is the word it stands for in its kun reading, written 舌 (shita). The taught card した (shita) is a different word, 下 (shita), below; under, so it is not used. No taught word card is written with 舌 (shita) and only taught kanji, so it has no example yet."
  "ja-6823":
    native: "to be in disorder"
    notes:
      "n1": "乱 (midareru): on reading ラン (ran); kun readings みだ-れる (mida-reru) and みだ-す (mida-su). Its kana みだれる (midareru), to be in disorder, is the word it stands for in its kun reading, written 乱れる (midareru). No taught card has that kana, so it has no example yet."
  "ja-6824":
    native: "egg"
    notes:
      "n1": "卵 (tamago): on reading ラン (ran); kun reading たまご (tamago). Its kana たまご (tamago), egg, is the word it stands for in its kun reading, written 卵 (tamago). The taught card たまご (tamago) is the same word, 卵 (tamago). The first example uses that card with は (wa), 高い (takai), expensive, and です (desu). The second example uses the taught card たまごやき (tamagoyaki), rolled omelette, written 卵焼き (tamagoyaki), with を (o) and the masu form 食べます (tabemasu) of 食べる (taberu)."
    examples:
      "卵は高いです。": "Eggs are expensive."
      "卵焼きを食べます。": "I eat a rolled omelette."
  "ja-6825":
    native: "no; not so"
    notes:
      "n1": "否 (ina): on reading ヒ (hi); kun reading いな (ina). Its kana いな (ina), no; not so, is the word it stands for in its kun reading, written 否 (ina). No taught card has that kana. The example uses the taught card ひてい (hitei), denial, written 否定 (hitei), with は (wa), 悪い (warui), bad, and です (desu)."
    examples:
      "否定は悪いです。": "Denial is bad."
  "ja-6826":
    native: "to be in trouble"
    notes:
      "n1": "困 (komaru): on reading コン (kon); kun reading こま-る (koma-ru). Its kana こまる (komaru), to be in trouble, is the word it stands for in its kun reading, written 困る (komaru). The taught card こまる (komaru) is the same word, 困る (komaru). The first example uses the masu form 困ります (komarimasu) with 先生 (sensei), teacher, written 先生 (sensei), and は (wa). The second uses the same masu form with それ (sore), that, and は (wa)."
    examples:
      "先生は困ります。": "The teacher is in trouble."
      "それは困ります。": "That is a problem for me."
