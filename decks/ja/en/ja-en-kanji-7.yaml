schema: 1
id: "ja-en-kanji-7"
kind: "layer"
core: "ja-kanji-7"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 7: grade 2, part 3"
description: "Thirty-two kanji of the second school grade, each taught by the kana reading of the word it stands for. Some have one example or none yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-5300":
    native: "arrow"
    notes:
      "n1": "矢 (ya): on reading シ (shi); kun reading や (ya). It is in 弓矢 (yumiya), bow and arrow."
  "ja-5301":
    native: "older sister"
    notes:
      "n1": "姉 (ane): on reading シ (shi); kun reading あね (ane). It is in お姉さん (oneesan), an older sister."
    examples:
      "姉は学生です。": "My older sister is a student."
      "お姉さんは元気ですか。": "Is your older sister well?"
  "ja-5302":
    native: "to think"
    notes:
      "n1": "思 (omou): on reading シ (shi); kun reading おもう (omou). It is in 思う (omou), to think."
  "ja-5303":
    native: "paper"
    notes:
      "n1": "紙 (kami): on reading シ (shi); kun reading かみ (kami). It is in 手紙 (tegami), a letter."
    examples:
      "手紙はどこですか。": "Where is the letter?"
      "手紙を書きます。": "I write a letter."
  "ja-5304":
    native: "temple"
    notes:
      "n1": "寺 (tera): on reading ジ (ji); kun reading てら (tera). It is in お寺 (otera), a temple."
  "ja-5305":
    native: "self; oneself"
    notes:
      "n1": "自 (mizukara): on readings ジ (ji) and シ (shi); kun reading みずから (mizukara). It is in 自ら (mizukara), oneself."
  "ja-5306":
    native: "time; hour; when"
    notes:
      "n1": "時 (toki): on reading ジ (ji); kun reading とき (toki). It is in 時間 (jikan), time."
    examples:
      "時間が少ないです。": "There is little time."
      "時間はいそがしいです。": "I am busy."
  "ja-5307":
    native: "room"
    notes:
      "n1": "室 (muro): on reading シツ (shitsu); kun reading むろ (muro). It is in 教室 (kyoushitsu), a classroom."
    examples:
      "教室はどこですか。": "Where is the classroom?"
  "ja-5308":
    native: "company; shrine"
    notes:
      "n1": "社 (yashiro): on reading シャ (sha); kun reading やしろ (yashiro). It is in 会社 (kaisha), a company."
    examples:
      "会社はどこですか。": "Where is the company?"
      "ちちは会社にいきます。": "My father goes to the company."
  "ja-5309":
    native: "weak"
    notes:
      "n1": "弱 (yowai): on reading ジャク (jaku); kun readings よわい (yowai), よわる (yowaru), よわまる (yowamaru) and よわめる (yowameru). It is in 弱い (yowai), weak."
    examples:
      "うさぎは弱いです。": "The rabbit is weak."
      "おじいさんは弱いです。": "Grandfather is weak."
  "ja-5310":
    native: "neck; head"
    notes:
      "n1": "首 (kubi): on reading シュ (shu); kun reading くび (kubi). It is in 手首 (tekubi), a wrist."
    examples:
      "首がいたいです。": "My neck hurts."
  "ja-5311":
    native: "autumn"
    notes:
      "n1": "秋 (aki): on reading シュウ (shuu); kun reading あき (aki). It is in 中秋 (chuushuu), mid-autumn."
    examples:
      "秋はすずしいです。": "Autumn is cool."
      "わたしは秋がすきです。": "I like autumn."
  "ja-5312":
    native: "week"
    notes:
      "n1": "週 (shuu): on reading シュウ (shuu). It is in 先週 (senshuu), last week."
    examples:
      "今週はいそがしいです。": "I am busy this week."
      "先週はやすみです。": "Last week was a day off."
  "ja-5313":
    native: "spring"
    notes:
      "n1": "春 (haru): on reading シュン (shun); kun reading はる (haru). It is in 春休み (harukyuu), the spring holiday."
    examples:
      "春は花がきれいです。": "Spring has pretty flowers."
      "春はあたたかいです。": "Spring is warm."
  "ja-5314":
    native: "to write"
    notes:
      "n1": "書 (kaku): on reading ショ (sho); kun reading かく (kaku). It is in 書く (kaku), to write."
    examples:
      "先生は本を書きます。": "The teacher writes a book."
      "手紙を書きます。": "I write a letter."
  "ja-5315":
    native: "few; little"
    notes:
      "n1": "少 (sukunai): on reading ショウ (shou); kun readings すくない (sukunai) and すこし (sukoshi). It is in 少し (sukoshi), a little."
    examples:
      "お金が少ないです。": "There is little money."
      "やすみが少ないです。": "There are few days off."
  "ja-5316":
    native: "place; field"
    notes:
      "n1": "場 (ba): on reading ジョウ (jou); kun reading ば (ba). It is in 工場 (koujou), a factory."
    examples:
      "工場はとおいです。": "The factory is far."
      "工場ではたらきます。": "I work at the factory."
  "ja-5317":
    native: "colour"
    notes:
      "n1": "色 (iro): on readings ショク (shoku) and シキ (shiki); kun reading いろ (iro). It is in 黄色 (kiiro), yellow."
    examples:
      "色はあかです。": "The colour is red."
      "この色がすきです。": "I like this colour."
  "ja-5318":
    native: "food; to eat"
    notes:
      "n1": "食 (taberu): on readings ショク (shoku) and (ジキ) (jiki); kun readings くう (kuu), くらう (kurau) and たべる (taberu). It is in 食べる (taberu), to eat."
    examples:
      "ごはんを食べます。": "I eat rice."
      "さかなを食べます。": "I eat fish."
  "ja-5319":
    native: "heart; mind"
    notes:
      "n1": "心 (kokoro): on reading シン (shin); kun reading こころ (kokoro). It is in 中心 (chuushin), a centre."
  "ja-5320":
    native: "new"
    notes:
      "n1": "新 (atarashii): on reading シン (shin); kun readings あたらしい (atarashii), あらた (arata) and にい (nii). It is in 新しい (atarashii), new."
    examples:
      "新しい車です。": "It is a new car."
      "これは新しい本です。": "This is a new book."
  "ja-5321":
    native: "parent; close"
    notes:
      "n1": "親 (oya): on reading シン (shin); kun readings おや (oya), したしい (shitashii) and したしむ (shitashimu). It is in 親切 (shinsetsu), kind."
    examples:
      "わたしの親はかいしゃいんです。": "My parent is a company employee."
      "親は元気です。": "My parent is well."
  "ja-5322":
    native: "diagram; figure"
    notes:
      "n1": "図 (zu): on readings ズ (zu) and ト (to); kun reading はかる (hakaru). It is in 図る (hakaru), to plan."
  "ja-5323":
    native: "number; to count"
    notes:
      "n1": "数 (kazoeru): on readings スウ (suu) and (ス) (su); kun readings かず (kazu) and かぞえる (kazoeru). It is in 数える (kazoeru), to count."
    examples:
      "お金を数えます。": "I count the money."
      "ゆびを数えます。": "I count on my fingers."
  "ja-5324":
    native: "west"
    notes:
      "n1": "西 (nishi): on readings セイ (sei) and サイ (sai); kun reading にし (nishi). It is in 西口 (nishiguchi), a west exit."
    examples:
      "西はさむいです。": "The west is cold."
  "ja-5325":
    native: "voice"
    notes:
      "n1": "声 (koe): on readings セイ (sei) and (ショウ) (shou); kun readings こえ (koe) and (こわ) (kowa). It is in 大声 (oogoe), a loud voice."
  "ja-5326":
    native: "star"
    notes:
      "n1": "星 (hoshi): on readings セイ (sei) and (ショウ) (shou); kun reading ほし (hoshi). It is in 星空 (hoshizora), a starry sky."
    examples:
      "星空がきれいです。": "The starry sky is pretty."
      "星空がすきです。": "I like the starry sky."
  "ja-5327":
    native: "clear; fine (weather)"
    notes:
      "n1": "晴 (hareru): on reading セイ (sei); kun readings はれる (hareru) and はらす (harasu). It is in 晴れ (hare), clear weather."
    examples:
      "あしたは晴れです。": "Tomorrow will be sunny."
      "天気は晴れです。": "The weather is sunny."
  "ja-5328":
    native: "to cut; a piece"
    notes:
      "n1": "切 (kiru): on readings セツ (setsu) and (サイ) (sai); kun readings きる (kiru) and きれる (kireru). It is in 切る (kiru), to cut."
    examples:
      "ともだちは親切です。": "My friend is kind."
  "ja-5329":
    native: "snow"
    notes:
      "n1": "雪 (yuki): on reading セツ (setsu); kun reading ゆき (yuki). It is in 大雪 (oyuki), heavy snow."
    examples:
      "雪はさむいです。": "Snow is cold."
      "わたしは雪がすきです。": "I like snow."
  "ja-5330":
    native: "ship; boat"
    notes:
      "n1": "船 (fune): on reading セン (sen); kun readings ふね (fune) and (ふな) (funa). It is in 汽船 (kisen), a steamship."
    examples:
      "船にのります。": "I get on the ship."
      "船は大きいです。": "The ship is big."
  "ja-5331":
    native: "line"
    notes:
      "n1": "線 (sen): on reading セン (sen). It is in 光線 (kousen), a ray of light."
