      - { text: "わたしはまいにちがっこうにかよいます。", reading: "watashi wa mainichi gakkou ni kayoimasu." }
      - { text: "ともだちはえきでわたしをむかえました。", reading: "tomodachi wa eki de watashi o mukaemashita." }
