        prompt: { en: "The writer goes to school every day." }
        answer: true
      - id: "ja-2296"
        prompt: { en: "Which line says that the writer apologised?" }
        options:
          - { en: "The first line" }
          - { en: "The third line" }
          - { en: "The fourth line" }
        answer: 3
