id: "ja-en-kanji-34"
kind: "layer"
core: "ja-kanji-34"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 34: grade 6, part 3"
description: "Twenty-seven kanji of the sixth school grade, each taught by the kana reading of the word it stands for. Nine have no example yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-6920":
    native: "figure; appearance"
    notes:
      "n1": "姿 (sugata): on reading シ (shi); kun reading すがた (sugata). The kun reading is the word it stands for alone: すがた (sugata), figure; appearance. No taught card has that kana. No taught word is written with 姿 (shi) and has a card, so it has no example yet."
  "ja-6921":
    native: "declaration"
    notes:
      "n1": "宣 (sengen): on reading セン (sen); no kun reading. It is not a word on its own, so its kana せんげん (sengen), declaration, is the commonest word it begins, written 宣言 (sengen). No taught card has that kana. No taught word is written with 宣 (sen) and has a card, so it has no example yet."
  "ja-6922":
    native: "mainly; exclusively"
    notes:
      "n1": "専 (moppara): on reading セン (sen); kun reading もっぱ-ら (moppa-ra). The kun reading is the word it stands for alone: もっぱら (moppara), mainly; exclusively. No taught card has that kana. The taught card せんもん (senmon), speciality; field of expertise, from ja-work, is written 専門 (senmon), which uses 専 (sen) and the taught kanji 門 (mon). Its example is 専門は必要です (senmon wa hitsuyou desu), where 専門 (senmon) is that taught card, 必要 (hitsuyou), necessary, is the taught card ひつよう (hitsuyou), and は (wa) and です (desu) are taught."
    examples:
      "専門は必要です。": "A speciality is necessary."
      "専門を学びます。": "I study my speciality."
  "ja-6923":
    native: "roll; scroll"
    notes:
      "n1": "巻 (maki): on reading カン (kan); kun readings ま-く (ma-ku) and まき (maki). The kun reading まき (maki) is the word it stands for alone: まき (maki), roll; scroll. No taught card has that kana. The taught card ねまき (nemaki), from ja-daily-life, is written 寝巻 (nemaki) with 寝 (ne), a kanji not yet taught, so it does not qualify. No taught word is written with 巻 (kan) and has a card, so it has no example yet."
  "ja-6924":
    native: "law"
    notes:
      "n1": "律 (houritsu): on reading リツ (ritsu); the table gives the reading リチ (richi) in parentheses, as special or very narrow use, and it is not used for the card; no kun reading. It is not a word on its own, so its kana ほうりつ (houritsu), law, is the commonest word it ends, written 法律 (houritsu). The taught kanji card 法 (hou), from ja-kanji-20, has the same kana, ほうりつ (houritsu), law, and is the same word. Its example is 法律は大切です (houritsu wa taisetsu desu), where 法律 (houritsu) is that taught kanji card's word, with the taught kanji 法 (hou), and 大切 (taisetsu), important, is the taught card たいせつ (taisetsu), and は (wa) and です (desu) are taught."
    examples:
      "法律は大切です。": "Law is important."
  "ja-6925":
    native: "to be reflected; to be projected"
    notes:
      "n1": "映 (utsuru): on reading エイ (ei); kun readings うつ-る (utsu-ru), うつ-す (utsu-su) and は-える (ha-eru). The kun reading うつ-る (utsu-ru) is the word it stands for alone: 映る (utsuru), to be reflected; to be projected. The taught kanji card 移 (utsuru), from ja-kanji-28, and the taught card うつる (utsuru), from ja-illness, have the same kana, but they are different words, 移る (utsuru), to move; to be passed on. Its examples are 映画を見ます (eiga o mimasu), where 映画 (eiga), movie, is the taught card えいが (eiga), 見ます (mimasu) is the masu form of the taught verb みる (miru), and を (o) is taught; and 映画館は近いです (eigakan wa chikai desu), where 映画館 (eigakan), cinema, is the taught card えいがかん (eigakan), with the taught kanji 館 (kan), and は (wa), 近い (chikai), near, and です (desu) are taught."
    examples:
      "映画を見ます。": "I watch a movie."
      "映画館は近いです。": "The cinema is near."
  "ja-6926":
    native: "to dye"
    notes:
      "n1": "染 (someru): on reading セン (sen); kun readings そ-める (so-meru), そ-まる (so-maru), し-みる (shi-miru) and し-み (shi-mi). The kun reading そ-める (so-meru) is the word it stands for alone: 染める (someru), to dye. No taught card has that kana. It is in 感染 (kansen), infection."
    examples:
      "病気が感染します。": "The disease spreads."
  "ja-6927":
    native: "stairs"
    notes:
      "n1": "段 (kaidan): on reading ダン (dan); no kun reading. It is not a word on its own, so its kana かいだん (kaidan), stairs, is the commonest word it ends, written 階段 (kaidan). The taught kanji card 階 (kai), from ja-kanji-16, has the same kana, かいだん (kaidan), and is the same word. Its examples are 階段はせまいです (kaidan wa semai desu), where 階段 (kaidan) is that taught card, with the taught kanji 階 (kai), and は (wa), せまい (semai), narrow, and です (desu) are taught; and 値段は高いです (nedan wa takai desu), where 値段 (nedan), price, is the taught card ねだん (nedan), with 値 (chi), a kanji of this deck, and は (wa), 高い (takai), high, and です (desu) are taught."
    examples:
      "階段はせまいです。": "The stairs are narrow."
      "値段は高いです。": "The price is high."
  "ja-6928":
    native: "spring; fountain"
    notes:
      "n1": "泉 (izumi): on reading セン (sen); kun reading いずみ (izumi). The kun reading is the word it stands for alone: いずみ (izumi), spring; fountain. No taught card has that kana. No taught word is written with 泉 (sen) and has a card, so it has no example yet."
  "ja-6929":
    native: "to wash"
    notes:
      "n1": "洗 (arau): on reading セン (sen); kun reading あら-う (ara-u). The kun reading is the word it stands for alone: 洗う (arau), to wash. The taught card あらう (arau), from ja-everyday-verbs, is the same word, 洗う (arau). Its examples are お手洗いはきれいです (otearai wa kirei desu), where お手洗い (otearai), toilet, is the taught card おてあらい (otearai), with the taught kanji 手 (te), and は (wa), きれい (kirei), clean; pretty, and です (desu) are taught; and 顔を洗います (kao o araimasu), where 顔 (kao), face, is the taught card かお (kao), 洗います (araimasu) is the masu form of the taught verb あらう (arau), and を (o) is taught."
    examples:
      "お手洗いはきれいです。": "The toilet is clean."
      "顔を洗います。": "I wash my face."
  "ja-6930":
    native: "flashy; showy"
    notes:
      "n1": "派 (hade): on reading ハ (ha); no kun reading. It is not a word on its own, so its kana はで (hade), flashy; showy, is the commonest word it begins, written 派手 (hade). The taught card はで (hade), from ja-appearance, is the same word, 派手 (hade). Its example is 服は派手です (fuku wa hade desu), where 服 (fuku) is the taught card ふく (fuku), with the taught kanji 服 (fuku), 派手 (hade) is that taught card, and は (wa) and です (desu) are taught."
    examples:
      "服は派手です。": "The clothes are flashy."
      "色が派手です。": "The colour is flashy."
  "ja-6931":
    native: "emperor"
    notes:
      "n1": "皇 (tennou): on readings コウ (kou) and オウ (ou); no kun reading. It is not a word on its own, so its kana てんのう (tennou), emperor, is the commonest word it ends, written 天皇 (tennou). The taught card てんのう (tennou), from ja-history, is the same word, 天皇 (tennou). In 天皇 (tennou) the オウ (ou) reading is heard as のう (nou), a sound change like the ッ (tsu) of 納豆 (nattou). Its example is 天皇は日本にいます (tennou wa nihon ni imasu), where 天皇 (tennou) is that taught card, 日本 (nihon), Japan, is the taught card にほん (nihon), with the taught kanji 日 (nichi) and 本 (hon), は (wa) and に (ni) are taught, and います (imasu) is the masu form of the taught verb いる (iru), which is the kana word of the taught kanji card 居 (i), from ja-kanji-26."
    examples:
      "天皇は日本にいます。": "The emperor is in Japan."
      "皇子は若いです。": "The imperial prince is young."
  "ja-6932":
    native: "nursing"
    notes:
      "n1": "看 (kango): on reading カン (kan); no kun reading. It is not a word on its own, so its kana かんご (kango), nursing, is the commonest word it begins, written 看護 (kango). The taught card かんご (kango), from ja-health, is the same word, 看護 (kango). The kanji 護 (go) is taught by kanji 31, so 看護 (kango) is written with taught kanji. Its example is 看護師は親切です (kangoshi wa shinsetsu desu), where 看護師 (kangoshi), nurse, is the taught card かんごし (kangoshi), from ja-work, with the taught kanji 護 (go) and 師 (shi), and は (wa), 親切 (shinsetsu), kind, and です (desu) are taught."
    examples:
      "看護師は親切です。": "The nurse is kind."
      "家族を看護します。": "I care for my family."
  "ja-6933":
    native: "sand"
    notes:
      "n1": "砂 (suna): on readings サ (sa) and シャ (sha); kun reading すな (suna). The kun reading is the word it stands for alone: すな (suna), sand. The taught card すな (suna), from ja-nature, is the same word, 砂 (suna). Its example is 砂は暑いです (suna wa atsui desu), where 砂 (suna) is that taught card, 暑い (atsui), hot, is the taught card あつい (atsui), with the taught kanji 暑 (atsu), and は (wa) and です (desu) are taught."
    examples:
      "砂は暑いです。": "The sand is hot."
      "砂で遊びます。": "I play in the sand."
  "ja-6934":
    native: "black tea"
    notes:
      "n1": "紅 (koucha): on reading コウ (kou); the table gives ク (ku) in parentheses as special or very narrow use, and it is not used for the card; kun readings べに (beni) and くれない (kurenai) are not used for the card. It is not a word on its own, so its kana こうちゃ (koucha), black tea, is the commonest word it begins, written 紅茶 (koucha). The taught card こうちゃ (koucha), from ja-food, is the same word, 紅茶 (koucha), with the taught kanji 茶 (cha). Its example is 紅茶を飲みます (koucha o nomimasu), where 紅茶 (koucha) is that taught card, 飲みます (nomimasu) is the masu form of the taught verb のむ (nomu), and を (o) is taught."
    examples:
      "紅茶を飲みます。": "I drink black tea."
      "紅葉がきれいです。": "The autumn leaves are beautiful."
  "ja-6935":
    native: "lung"
    notes:
      "n1": "肺 (hai): on reading ハイ (hai); no kun reading. The kanji stands alone for the word lung, so its kana はい (hai), lung, is the card. The taught card はい (hai), yes, from ja-phrasebook, has the same kana and is a different word. The taught kanji card 灰 (hai), from ja-kanji-32, has the same kana, はい (hai), ash, and is also a different word. No taught word is written with 肺 (hai) and has a card, so it has no example yet."
  "ja-6936":
    native: "stomach"
    notes:
      "n1": "胃 (i): on reading イ (i); no kun reading. The kanji stands alone for the word stomach, so its kana い (i), stomach, is the card, a single kana as こ (ko) is for 個 (ko). The taught kanji card 医 (i), from ja-kanji-11, has the same kana but is a different word, 医 (i), medicine. The taught kana letter card い (i), from ja-hiragana, is a different word too. No taught word is written with 胃 (i) and has a card, so it has no example yet."
  "ja-6937":
    native: "height; stature"
    notes:
      "n1": "背 (se): on reading ハイ (hai); kun readings せ (se), せい (sei), そむ-く (somu-ku) and そむ-ける (somu-keru). The kun reading せ (se) is the word it stands for alone: せ (se), height; stature. The taught kana letter card せ (se), from ja-hiragana, has the same kana and is a different word. Its example is 背中は広いです (senaka wa hiroi desu), where 背中 (senaka), back (of the body), is the taught card せなか (senaka), with the taught kanji 中 (naka), and は (wa), 広い (hiroi), wide; spacious, and です (desu) are taught."
    examples:
      "背中は広いです。": "The back is broad."
      "背中が痛いです。": "My back hurts."
  "ja-6938":
    native: "bored; tedious"
    notes:
      "n1": "退 (taikutsu): on reading タイ (tai); kun readings しりぞ-く (shirizo-ku) and しりぞ-ける (shirizo-keru), neither of which is used for the card. It is not a word on its own, so its kana たいくつ (taikutsu), bored; tedious, is the commonest word it begins, written 退屈 (taikutsu). No taught card has that kana. The taught card たいしょく (taishoku), from ja-careers, is written 退職 (taishoku), with the taught kanji 職 (shoku). Its example is 私は退職しました (watashi wa taishoku shimashita), where 私 (watashi), I, is the taught card わたし (watashi), 退職 (taishoku) is that taught card, しました (shimashita) is the past masu form of the taught verb する (suru), and は (wa) is taught."
    examples:
      "私は退職しました。": "I left my job."
      "今日は退社します。": "I leave the office today."
  "ja-6939":
    native: "leather"
    notes:
      "n1": "革 (kawa): on reading カク (kaku); kun reading かわ (kawa). The kun reading is the word it stands for alone: かわ (kawa), leather. The taught kanji cards 川 (kawa), from ja-kanji-3, 皮 (kawa), from ja-kanji-10, and 河 (kawa), from ja-kanji-26, and the taught card かわ (kawa), river, from ja-places, have the same kana, but they are different words. Its example is 革命は大変です (kakumei wa taihen desu), where 革命 (kakumei), revolution, is the taught card かくめい (kakumei), from ja-history, with the taught kanji 命 (mei), and は (wa), 大変 (taihen), terrible; difficult, and です (desu) are taught."
    examples:
      "革命は大変です。": "A revolution is difficult."
      "革命の本を読みます。": "I read a book about revolution."
  "ja-6940":
    native: "actor"
    notes:
      "n1": "俳 (haiyuu): on reading ハイ (hai); no kun reading. It is not a word on its own, so its kana はいゆう (haiyuu), actor, is the commonest word it begins, written 俳優 (haiyuu). The taught card はいゆう (haiyuu), from ja-careers, is the same word, 俳優 (haiyuu). Its kanji 優 (yuu) is not yet taught, so 俳優 (haiyuu) does not qualify for an example. Its example is 俳句は短いです (haiku wa mijikai desu), where 俳句 (haiku), haiku, is the kana word はいく (haiku) of the taught kanji card 句 (ku), from ja-kanji-25, with the taught kanji 句 (ku), and 短い (mijikai), short, is the taught card みじかい (mijikai), with the taught kanji 短 (mijika), and は (wa) and です (desu) are taught."
    examples:
      "俳句は短いです。": "A haiku is short."
  "ja-6941":
    native: "straw bag"
    notes:
      "n1": "俵 (tawara): on reading ヒョウ (hyou); kun reading たわら (tawara). The kun reading is the word it stands for alone: たわら (tawara), straw bag. No taught card has that kana. No taught word is written with 俵 (hyou) and has a card, so it has no example yet."
  "ja-6942":
    native: "price"
    notes:
      "n1": "値 (ne): on reading チ (chi); kun readings ね (ne) and あたい (atai). The kun reading ね (ne) is the word it stands for alone: ね (ne), price. The taught kana letter card ね (ne), from ja-hiragana, and the taught kanji card 根 (ne), from ja-kanji-14, which means root, are different words. Its examples are 値段は安いです (nedan wa yasui desu), where 値段 (nedan), price, is the taught card ねだん (nedan), with 段 (dan), a kanji of this deck, and は (wa), 安い (yasui), cheap, and です (desu) are taught; and 値札は小さいです (nefuda wa chiisai desu), where 値札 (nefuda), price tag, is the taught card ねふだ (nefuda), with the taught kanji 札 (fuda), and は (wa), 小さい (chiisai), small, and です (desu) are taught."
    examples:
      "値段は安いです。": "The price is low."
      "値札は小さいです。": "The price tag is small."
  "ja-6943":
    native: "political party"
    notes:
      "n1": "党 (seitou): on reading トウ (tou); no kun reading. It is not a word on its own, so its kana せいとう (seitou), political party, is the commonest word it ends, written 政党 (seitou). No taught card has that kana. No taught word is written with 党 (tou) and has a card, so it has no example yet."
  "ja-6944":
    native: "injection"
    notes:
      "n1": "射 (chuusha): on reading シャ (sha); kun reading い-る (i-ru), which is not used for the card. It is not a word on its own, so its kana ちゅうしゃ (chuusha), injection, is the commonest word it ends, written 注射 (chuusha). The taught card ちゅうしゃ (chuusha), from ja-body, is the same word, 注射 (chuusha). Its example is 注射はこわいです (chuusha wa kowai desu), where 注射 (chuusha) is that taught card, with the taught kanji 注 (chuu), and は (wa), こわい (kowai), scary, and です (desu) are taught."
    examples:
      "注射はこわいです。": "Injections are scary."
      "注射をします。": "I get an injection."
  "ja-6945":
    native: "future"
    notes:
      "n1": "将 (shourai): on reading ショウ (shou); no kun reading. It is not a word on its own, so its kana しょうらい (shourai), future, is the commonest word it begins, written 将来 (shourai). The taught card しょうらい (shourai), from ja-careers, is the same word, 将来 (shourai). Its example is 将来は明るいです (shourai wa akarui desu), where 将来 (shourai) is that taught card, with the taught kanji 来 (rai), and は (wa), 明るい (akarui), bright, and です (desu) are taught."
    examples:
      "将来は明るいです。": "The future is bright."
      "将軍は強いです。": "The general is strong."
  "ja-6946":
    native: "exhibition; display"
    notes:
      "n1": "展 (tenji): on reading テン (ten); no kun reading. It is not a word on its own, so its kana てんじ (tenji), exhibition; display, is the commonest word it begins, written 展示 (tenji). The taught card てんじ (tenji), from ja-arts, is the same word, 展示 (tenji). Its example is 展示を見ます (tenji o mimasu), where 展示 (tenji) is that taught card, with the taught kanji 示 (ji), 見ます (mimasu) is the masu form of the taught verb みる (miru), and を (o) is taught."
    examples:
      "展示を見ます。": "I look at the exhibits."
      "展示は広いです。": "The exhibition is large."
