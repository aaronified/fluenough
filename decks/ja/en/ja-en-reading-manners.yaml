  - "id": "ja-manners-1"
    "title": "A dinner with a host"
    "sentences":
      - "text": "おきゃくさんとして、いえにまねかれました。"
        "reading": "okyakusan toshite, ie ni manekaremashita."
      - "text": "ついたとき、おじぎをして、おれいをいいました。"
        "reading": "tsuita toki, ojigi o shite, orei o iimashita."
      - "text": "ホストは、おもてなしを、たくさんしてくれました。"
        "reading": "hosuto wa, omotenashi o, takusan shite kuremashita."
      - "text": "すこし、えんりょしましたが、たべました。"
        "reading": "sukoshi, enryo shimashita ga, tabemashita."
    "questions":
      - "id": "ja-3337"
