  - "id": "ja-manners-2"
    "title": "A busy station"
    "sentences":
      - "text": "えきで、れつにならびました。"
        "reading": "eki de, retsu ni narabimashita."
      - "text": "おとしよりに、せきをゆずりました。"
        "reading": "otoshiyori ni, seki o yuzurimashita."
      - "text": "じゅんばんをまもるのが、たいせつです。"
        "reading": "junban o mamoru no ga, taisetsu desu."
      - "text": "ひとにめいわくをかけないように、つつしみます。"
        "reading": "hito ni meiwaku o kakenai yō ni, tsutsushimimasu."
