"schema": 1
"id": "ja-en-abstract-words"
"kind": "layer"
"core": "ja-abstract-words"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Abstract words"
"description": "Abstract words: 55 nouns and adjectives of kind, degree, process, reason and possibility, such as reason, means, state and possibility. Not yet checked by a Japanese speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "ja-8900":
    "native": "thing; matter; fact"
    "notes":
      "n1": "こと (koto) is the general word for a thing, a matter or an event; a verb plus こと (koto) names the act or fact of doing it."
    "examples":
      "そのことをしりました。":
        "native": "I learned about that matter."
        "bases":
          "しりました":
            "meaning": "knew; learned (polite past)"
      "たのしいことがあります。":
        "native": "There are fun things."
        "bases":
          "あります":
            "meaning": "there is; to have (polite)"
  "ja-8901":
    "native": "reason; meaning; circumstances"
    "notes":
      "n1": "わけ (wake) is the reason or the circumstances behind something; わけがない (wake ga nai) means there is no way that it is so."
    "examples":
      "そのわけはありません。":
        "native": "There is no reason for that."
        "bases":
          "ありません":
            "meaning": "there is not (polite)"
      "わけをおしえてください。":
        "native": "Please tell me the reason."
        "bases":
          "おしえて":
            "meaning": "tell (te-form)"
          "ください":
            "meaning": "please (polite request)"
  "ja-8902":
    "native": "should; expected to; supposed to"
    "notes":
      "n1": "はず (hazu) is what is expected by reasoning: はずです (hazu desu) means it should be so, and はずがない (hazu ga nai) means it should not be."
    "examples":
      "かれはもうかえったはずです。":
        "native": "He should have gone home already."
        "bases":
          "かえった":
            "meaning": "went back (past)"
          "です":
            "meaning": "(to be, polite)"
      "きょうはやすみのはずです。":
        "native": "Today should be a day off."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-8903":
    "native": "intention; plan; meaning to"
    "notes":
      "n1": "つもり (tsumori) names an intention; a verb plus つもりです (tsumori desu) means I intend to do it, and つもりでいる (tsumori de iru) means one plans to."
    "examples":
      "あしたはがっこうにいくつもりです。":
        "native": "I intend to go to school tomorrow."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "かれにあやまるつもりはありません。":
        "native": "I have no intention of apologising to him."
        "bases":
          "あやまる":
            "meaning": "to apologise"
          "ありません":
            "meaning": "there is not (polite)"
  "ja-8904":
    "native": "sake; purpose; benefit"
    "notes":
      "n1": "ため (tame) means for the sake of someone or something, or for a purpose; a verb plus ために (tame ni) means in order to do it."
    "examples":
      "かぞくのためにはたらく。": "I work for my family's sake."
      "からだのためにやさいをたべます。":
        "native": "I eat vegetables for my health."
        "bases":
          "たべます":
            "meaning": "eat (polite)"
  "ja-8905":
    "native": "manner; appearance; seems like"
    "notes":
      "n1": "よう (you) names the look or manner of something; with です (desu) it means it seems or looks as if it is so."
    "examples":
      "あめがふるようです。":
        "native": "It looks like it will rain."
        "bases":
          "ふる":
            "meaning": "fall (of rain)"
          "です":
            "meaning": "(to be, polite)"
      "しごとのようにみえます。":
        "native": "It looks like work."
        "bases":
          "みえます":
            "meaning": "look; appear (polite)"
  "ja-8906":
    "native": "place; point; stage"
    "notes":
      "n1": "ところ (tokoro) is a place or a point in a process; a verb plus ところです (tokoro desu) means one is just about to do it."
    "examples":
      "いまちょうどかえるところです。":
        "native": "I am just about to go home now."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "きょうはいいところにいきます。":
        "native": "Today I am going to a good place."
        "bases":
          "いきます":
            "meaning": "go (polite)"
  "ja-8907":
    "native": "pretence; pretending"
    "notes":
      "n1": "ふり (furi) is a pretence; a plain verb form before ふりをする (furi o suru) says what is pretended, as in しらないふり (shiranai furi), pretending not to know."
    "examples":
      "しらないふりをしました。":
        "native": "I pretended not to know."
        "bases":
          "しらない":
            "meaning": "do not know"
          "しました":
            "meaning": "did (polite)"
      "ねているふりをしました。":
        "native": "I pretended to be asleep."
        "bases":
          "ねている":
            "meaning": "sleep (progressive)"
          "しました":
            "meaning": "did (polite)"
  "ja-8908":
    "native": "inside; within; among"
    "notes":
      "n1": "うち (uchi) is the inside of a range, so いっかげつのうちに (ikkagetsu no uchi ni) means within a month; in speech うちの (uchi no) means my own family or group."
    "examples":
      "いっかげつのうちにかえってください。":
        "native": "Please come back within a month."
        "bases":
          "いっかげつ":
            "meaning": "one month"
          "かえって":
            "meaning": "come back (te-form)"
          "ください":
            "meaning": "please (polite request)"
      "うちのかぞくはげんきです。":
        "native": "My family is well."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-8909":
    "native": "other; besides; the rest"
    "notes":
      "n1": "ほか (hoka) means the other one or the rest; ほかの (hoka no) is 'other' before a noun, and ほかに (hoka ni) means 'besides' or 'apart from'."
    "examples":
      "ほかのひとにきいてください。":
        "native": "Please ask the other people."
        "bases":
          "きいて":
            "meaning": "ask (te-form)"
          "ください":
            "meaning": "please (polite request)"
      "ほかのほうがいいです。":
        "native": "The other one is better."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-8910":
    "native": "case; occasion; situation"
    "notes":
      "n1": "ばあい (baai) is a case or an occasion; a noun plus のばあい (no baai) means in the case of that noun."
    "examples":
      "あめのばあいはでかけません。":
        "native": "In case of rain, I will not go out."
        "bases":
          "でかけません":
            "meaning": "go out (polite negative)"
      "ばあいにはでんわをします。":
        "native": "In that case, I will call."
        "bases":
          "します":
            "meaning": "do (polite)"
  "ja-8911":
    "native": "whole; entire; in general"
    "notes":
      "n1": "ぜんたい (zentai) is the whole of something, as against its parts, ぶぶん (bubun); ぜんたいで (zentai de) means on the whole or overall."
    "examples":
      "ぜんたいのようすがわかりました。":
        "native": "I understood the whole situation."
        "bases":
          "わかりました":
            "meaning": "understood (polite past)"
      "へやぜんたいがあたたかいです。":
        "native": "The whole room is warm."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-8912":
    "native": "part; portion"
    "notes":
      "n1": "ぶぶん (bubun) is a part of a whole; it is the opposite of ぜんたい (zentai), and ぶぶんてきに (bubunteki ni) means partly or in part."
    "examples":
      "このぶぶんはむずかしいです。":
        "native": "This part is difficult."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "そのぶぶんをよみました。":
        "native": "I read that part."
        "bases":
          "よみました":
            "meaning": "read (polite past)"
  "ja-8913":
    "native": "process; course of events"
    "notes":
      "n1": "かてい (katei) is the process by which something happens, as against its result; it is used in work, study and science."
    "examples":
      "しごとのかていをみます。":
        "native": "I watch the process of the work."
        "bases":
          "みます":
            "meaning": "watch (polite)"
      "かていはむずかしいです。":
        "native": "The process is difficult."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-8914":
    "native": "means; method; way"
    "notes":
      "n1": "しゅだん (shudan) is a means to reach a goal; it is close in meaning to ほうほう (houhou), a way of doing something."
    "examples":
      "しゅだんをかんがえます。":
        "native": "I will think of a way."
        "bases":
          "かんがえます":
            "meaning": "think (polite)"
      "でんわはれんらくのしゅだんです。":
        "native": "The phone is a means of contact."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-8915":
    "native": "state; condition"
    "notes":
      "n1": "じょうたい (joutai) is the state or condition of a thing or a person, such as health or readiness; ようす (yousu) is closer to how it looks."
    "examples":
      "からだのじょうたいはいいです。":
        "native": "My physical condition is good."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "じょうたいをしらせてください。":
        "native": "Please let me know the condition."
        "bases":
          "しらせて":
            "meaning": "let know (te-form)"
          "ください":
            "meaning": "please (polite request)"
  "ja-8916":
    "native": "situation; circumstances"
    "notes":
      "n1": "じょうきょう (joukyou) is the situation at a given moment, the circumstances around an event; it is common in news and at work."
    "examples":
      "じょうきょうをせつめいします。":
        "native": "I will explain the situation."
        "bases":
          "せつめい":
            "meaning": "explanation"
          "します":
            "meaning": "do (polite)"
      "じょうきょうがかわりました。":
        "native": "The situation has changed."
        "bases":
          "かわりました":
            "meaning": "changed (polite past)"
  "ja-8917":
    "native": "fact; actual fact"
    "notes":
      "n1": "じじつ (jijitsu) is a fact, something that is actually so; it is set against a rumour or an opinion."
    "examples":
      "それはじじつです。":
        "native": "That is a fact."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "じじつをみとめました。":
        "native": "I admitted the fact."
        "bases":
          "みとめました":
            "meaning": "admit (polite past)"
  "ja-8918":
    "native": "truth; the true story"
    "notes":
      "n1": "しんじつ (shinjitsu) is the truth in the deep sense of what is really so; it is a weightier word than じじつ (jijitsu), a single fact."
    "examples":
      "しんじつをいってください。":
        "native": "Please tell the truth."
        "bases":
          "いって":
            "meaning": "say (te-form)"
          "ください":
            "meaning": "please (polite request)"
      "しんじつはひとつです。":
        "native": "There is only one truth."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-8919":
    "native": "kind; type; sort"
    "notes":
      "n1": "しゅるい (shurui) is a kind or a type of thing, a category; it is used in shops and in talk about classes of things."
    "examples":
      "ほんのしゅるいがおおいです。":
        "native": "There are many kinds of books."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "このしゅるいのくだものがすきです。":
        "native": "I like this kind of fruit."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-8920":
    "native": "nature; quality; property"
    "notes":
      "n1": "せいしつ (seishitsu) is the character or inherent nature of a thing or a person; it is used in science and for personality."
    "examples":
      "ひとのせいしつはむずかしいです。":
        "native": "A person's nature is hard to know."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "このくすりのせいしつはつよいです。":
        "native": "This medicine's properties are strong."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-8921":
    "native": "feature; characteristic"
    "notes":
      "n1": "とくちょう (tokuchou) is a distinctive feature that sets a thing apart; it is used to describe products, places and people."
    "examples":
      "このまちのとくちょうはしずかです。":
        "native": "The feature of this town is that it is quiet."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "わたしのとくちょうはやさしいです。":
        "native": "My characteristic is kindness."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-8922":
    "native": "shape; form; appearance"
    "notes":
      "n1": "かたち (katachi) is the shape or form of a thing; it can also mean a formal way of doing something."
    "examples":
      "かたちはまるいです。":
        "native": "The shape is round."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "かたちをかえます。":
        "native": "I change the shape."
        "bases":
          "かえます":
            "meaning": "change (polite)"
  "ja-8923":
    "native": "state; appearance; how things are"
    "notes":
      "n1": "ようす (yousu) is the look or state of a situation or a person; it is used when asking how something is going."
    "examples":
      "かれのようすはげんきです。":
        "native": "His condition is good."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "ようすをみてきます。":
        "native": "I will go and see how it is."
        "bases":
          "みて":
            "meaning": "see (te-form)"
          "きます":
            "meaning": "come (polite)"
  "ja-8924":
    "native": "ability; capacity; skill"
    "notes":
      "n1": "のうりょく (nouryoku) is a general ability or capacity, often a skill that can be measured; it is used in education and work."
    "examples":
      "かれののうりょくはすごいです。":
        "native": "His ability is amazing."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "のうりょくをのばします。":
        "native": "I develop my ability."
        "bases":
          "のばします":
            "meaning": "extend; develop (polite)"
  "ja-8925":
    "native": "possibility; likelihood"
    "notes":
      "n1": "かのうせい (kanousei) is a possibility, a chance that something may happen; it is often used with ある (aru)."
    "examples":
      "あめがふるかのうせいがあります。":
        "native": "There is a possibility of rain."
        "bases":
          "ふる":
            "meaning": "fall (of rain)"
          "あります":
            "meaning": "there is; to have (polite)"
      "かのうせいはひくいです。":
        "native": "The possibility is low."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-8926":
    "native": "life; a person's lifetime"
    "notes":
      "n1": "じんせい (jinsei) is a whole life, the course of a person's life; it is more reflective than せいかつ (seikatsu), which is daily life."
    "examples":
      "じんせいはみじかいです。":
        "native": "Life is short."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "じんせいをたのしみます。":
        "native": "I enjoy life."
        "bases":
          "たのしみます":
            "meaning": "enjoy (polite)"
  "ja-8927":
    "native": "reality; the real world"
    "notes":
      "n1": "げんじつ (genjitsu) is the real world as it is, in contrast to dreams, hopes or ideals, りそう (risou)."
    "examples":
      "げんじつはむずかしいです。":
        "native": "Reality is difficult."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "ゆめとげんじつはちがいます。":
        "native": "Dreams and reality are different."
        "bases":
          "ちがいます":
            "meaning": "differ (polite)"
  "ja-8928":
    "native": "ideal; dream; what one hopes for"
    "notes":
      "n1": "りそう (risou) is an ideal, a picture of how things should be; the adjective りそうてき (risouteki) means ideal."
    "examples":
      "りそうのしごとをさがしています。":
        "native": "I am looking for my ideal job."
        "bases":
          "さがして":
            "meaning": "search (te-form)"
          "います":
            "meaning": "am; is (polite)"
      "りそうはたかいです。":
        "native": "Ideals are high."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-8929":
    "native": "thought; ideology; way of thinking"
    "notes":
      "n1": "しそう (shisou) is a system of thought or a worldview; it is used for philosophies and for a person's way of thinking."
    "examples":
      "ふるいしそうをよみました。":
        "native": "I read an old philosophy."
        "bases":
          "よみました":
            "meaning": "read (polite past)"
      "そのしそうはおもしろいです。":
        "native": "That thought is interesting."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-8930":
    "native": "value; worth"
    "notes":
      "n1": "かち (kachi) is the value or worth of a thing; かちがある (kachi ga aru) means it is worth something or worth doing."
    "examples":
      "このほんはかちがあります。":
        "native": "This book has value."
        "bases":
          "あります":
            "meaning": "there is; to have (polite)"
      "じかんのかちはたかいです。":
        "native": "The value of time is high."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-8931":
    "native": "significance; meaning; importance"
    "notes":
      "n1": "いぎ (igi) is the significance or meaning of a thing, what it stands for; it is used of events, words and actions."
    "examples":
      "そのいぎはおおきいです。":
        "native": "The significance is great."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "いぎのあるしごとです。":
        "native": "It is meaningful work."
        "bases":
          "ある":
            "meaning": "having; existing (attributive)"
          "です":
            "meaning": "(to be, polite)"
  "ja-8932":
    "native": "range; scope; extent"
    "notes":
      "n1": "はんい (han'i) is the range or scope that something covers; it is used for the limits of a plan, a rule or an area."
    "examples":
      "はんいをきめます。":
        "native": "I will set the scope."
        "bases":
          "きめます":
            "meaning": "decide (polite)"
      "はんいがひろいです。":
        "native": "The range is wide."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-8933":
    "native": "degree; extent; level"
    "notes":
      "n1": "ていど (teido) is a degree or extent, a measure of how much; after a number it also means about or roughly."
    "examples":
      "すこしのていどです。":
        "native": "It is only to a small degree."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "べんきょうのていどはふつうです。":
        "native": "The level of study is normal."
        "bases":
          "べんきょう":
            "meaning": "study"
          "です":
            "meaning": "(to be, polite)"
  "ja-8934":
    "native": "proportion; ratio"
    "notes":
      "n1": "わりあい (wariai) is a proportion or ratio, a share of a whole; わりあいに (wariai ni) means relatively or comparatively."
    "examples":
      "わりあいがおおきいです。":
        "native": "The proportion is large."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "わりあいにやすいです。":
        "native": "It is relatively cheap."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-8935":
    "native": "existence; being"
    "notes":
      "n1": "そんざい (sonzai) is the existence of a thing or a being; そんざいする (sonzai suru) means to exist."
    "examples":
      "かみのそんざいをしんじます。":
        "native": "I believe in the existence of God."
        "bases":
          "しんじます":
            "meaning": "believe in (polite)"
      "そんざいしません。":
        "native": "It does not exist."
        "bases":
          "しません":
            "meaning": "do (polite negative)"
  "ja-8936":
    "native": "question; doubt; query"
    "notes":
      "n1": "ぎもん (gimon) is a question or a doubt, a point one is not sure of; it is often used with ある (aru)."
    "examples":
      "ぎもんがあります。":
        "native": "I have a question."
        "bases":
          "あります":
            "meaning": "there is; to have (polite)"
      "そのぎもんにこたえてください。":
        "native": "Please answer that question."
        "bases":
          "こたえて":
            "meaning": "answer (te-form)"
          "ください":
            "meaning": "please (polite request)"
  "ja-8937":
    "native": "probability; chance"
    "notes":
      "n1": "かくりつ (kakuritsu) is the probability of an event, given as a percentage; it is used in weather and statistics."
    "examples":
      "かくりつはひくいです。":
        "native": "The probability is low."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "あめのかくりつはたかいです。":
        "native": "The chance of rain is high."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-8938":
    "native": "premise; precondition; assumption"
    "notes":
      "n1": "ぜんてい (zentei) is a premise, something that must be assumed before an argument can hold; it is used in logic and in discussion."
    "examples":
      "ぜんていをかくにんします。":
        "native": "I check the premise."
        "bases":
          "かくにん":
            "meaning": "check (noun)"
          "します":
            "meaning": "do (polite)"
      "そのぜんていがちがいます。":
        "native": "That premise is wrong."
        "bases":
          "ちがいます":
            "meaning": "differ; be wrong (polite)"
  "ja-8939":
    "native": "decision; judgment"
    "notes":
      "n1": "けってい (kettei) is a decision, a choice that has been made; けっていする (kettei suru) means to decide."
    "examples":
      "けっていをしました。":
        "native": "I made a decision."
        "bases":
          "しました":
            "meaning": "did (polite past)"
