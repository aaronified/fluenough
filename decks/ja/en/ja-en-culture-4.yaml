core: "ja-culture-4"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: court poems and a preface"
description: "Eighteen short items from Japanese poetry of the Asuka, Nara and Heian periods, in the public domain: seventeen poems from the Ogura Hyakunin Isshu and the kana preface of the Kokin Wakashu. Each shows who wrote it, when, and where it comes from. The texts are in modern kana. The English is the builder's own plain rendering. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ja-4700":
    native: "The frost lies white on the bridge of magpies that spans the sky, and when I see it, the night has grown late."
    notes:
      "n1": "Otomo no Yakamochi writes about a bridge of magpies, which in an old story spans the sky. The word しも (shimo) means frost, and しろき (shiroki) is an old form of white. The word ふけ (fuke) means to grow late."
    bases:
      "かささぎ": { meaning: "magpie" }
      "の": { meaning: "(links two nouns: of)" }
      "わたせる": { meaning: "to lay across, to span" }
      "はし": { meaning: "bridge" }
      "に": { meaning: "(on, over)" }
      "おく": { meaning: "to lie, to be laid" }
      "しも": { meaning: "frost" }
      "しろき": { meaning: "white (an old adjective)" }
      "を": { meaning: "(marks the thing seen)" }
      "みれば": { meaning: "to see, when I see" }
      "よ": { meaning: "night" }
      "ぞ": { meaning: "(marks emphasis)" }
      "ふけ": { meaning: "to grow late" }
      "にける": { meaning: "has happened, with the past marker ける (keru)" }
  "ja-4701":
    native: "Wind from heaven, blow shut the paths of the clouds, so that these maidens can stay a little longer."
    notes:
      "n1": "Henjo asks the wind of heaven to close the paths of the clouds, so that the dancing maidens can stay on earth a little longer. The word かよいじ (kayoiji) means a path or route, and おとめ (otome) means a maiden."
    bases:
      "あまつかぜ": { meaning: "wind from heaven" }
      "くも": { meaning: "cloud" }
      "の": { meaning: "(links two nouns: of)" }
      "かよいじ": { meaning: "path, route" }
      "ふきとじ": { meaning: "to blow shut" }
      "よ": { meaning: "(a command word: please do it)" }
      "おとめ": { meaning: "maiden, dancer at court" }
      "すがた": { meaning: "figure, appearance" }
      "しばし": { meaning: "for a little while" }
      "とどめむ": { meaning: "to hold back, to keep" }
  "ja-4702":
    native: "The river falls from the peak of Mount Tsukuba and gathers into the Minano River; the love that piles up in the same way becomes a deep pool."
    notes:
      "n1": "Emperor Yozei compares love to a river that falls from a mountain and piles up into a deep pool. The word ふち (fuchi) means a deep pool in a river, and みね (mine) means a peak."
    bases:
      "つくばね": { meaning: "Mount Tsukuba (a place name)" }
      "の": { meaning: "(of)" }
      "みね": { meaning: "peak" }
      "より": { meaning: "(from)" }
      "おつる": { meaning: "to fall" }
      "みなのがわ": { meaning: "Minano River (a place name)" }
      "こい": { meaning: "love" }
      "ぞ": { meaning: "(marks emphasis)" }
      "つもりて": { meaning: "to pile up" }
      "ふち": { meaning: "deep pool" }
      "と": { meaning: "(to become)" }
      "なりぬる": { meaning: "has become" }
  "ja-4703":
    native: "Because of whom has my heart been thrown into disorder, like the patterned cloth of Michinoku; it is not my own doing."
    notes:
      "n1": "Minamoto no Toru compares his heart to the cloth of Michinoku, whose pattern is blurred. The word しのぶもじずり (shinobu mojizuri) is that cloth, and ゆえ (yue) means reason. The word そめ (some) is an old form that means to begin."
    bases:
      "みちのく": { meaning: "Michinoku, the far north" }
      "の": { meaning: "(of)" }
      "しのぶもじずり": { meaning: "a cloth with a blurred pattern from Michinoku" }
      "たれ": { meaning: "who" }
      "ゆえ": { meaning: "reason" }
      "に": { meaning: "(for, because of)" }
      "みだれ": { meaning: "to be in disorder" }
      "そめ": { meaning: "to begin" }
      "し": { meaning: "(past marker)" }
      "われ": { meaning: "I, me" }
      "なら": { meaning: "(is, am)" }
      "なくに": { meaning: "not, without" }
  "ja-4704":
    native: "In autumn, the thatch of my hut in the rice field is so rough that my sleeves are wet with the dew."
    notes:
      "n1": "Emperor Tenji wrote about a farm hut in autumn, where the roof lets the dew in. The word いお (io) means hut, and とま (toma) is the thatch or mat that covers the roof. The word あらみ (arami) is an old form that means rough."
    bases:
      "あき": { meaning: "autumn" }
      "の": { meaning: "(links two nouns: of)" }
      "た": { meaning: "rice field" }
      "かりほ": { meaning: "hut in a rice field" }
      "いお": { meaning: "hut" }
      "とま": { meaning: "thatch, a rough mat for a roof" }
      "を": { meaning: "(marks the thing that is rough)" }
      "あらみ": { meaning: "rough, coarse, because it is rough" }
      "わが": { meaning: "my" }
      "ころもで": { meaning: "sleeve" }
      "は": { meaning: "(marks the topic)" }
      "つゆ": { meaning: "dew" }
      "に": { meaning: "(here: with, from)" }
      "ぬれつつ": { meaning: "to get wet and keep getting wet" }
  "ja-4705":
    native: "Spring has gone and summer seems to have come, for the white robes are drying on Mount Kagu in heaven."
    notes:
      "n1": "Empress Jito wrote about the first summer days, when the white cloth is hung out to dry on Mount Kagu. The word ちょう (chou) is a short form of という (to iu, it is said that), and the word しろたえ (shirotae) means white cloth."
    bases:
      "はる": { meaning: "spring" }
      "すぎて": { meaning: "to pass" }
      "なつ": { meaning: "summer" }
      "き": { meaning: "to come" }
      "に": { meaning: "(marks that something has happened)" }
      "けらし": { meaning: "it seems that (an old form)" }
      "しろたえ": { meaning: "white cloth" }
      "の": { meaning: "(links two nouns: of)" }
      "ころも": { meaning: "robe, clothes" }
      "ほす": { meaning: "to dry in the sun" }
      "ちょう": { meaning: "it is said that (an old form)" }
      "あま": { meaning: "heaven, the sky" }
      "かぐやま": { meaning: "Mount Kagu (a place name)" }
  "ja-4706":
    native: "Tell the people at home that I have rowed out over the open sea, past the many islands: a fisherman's fishing boat."
    notes:
      "n1": "Ono no Takamura writes as if he were a fishing boat rowing out to sea. The word あまの (amano) here means a fisherman, and つりぶね (tsuribune) is a fishing boat. The word そしま (soshima) means many islands."
    bases:
      "わたのはら": { meaning: "the open sea" }
      "や": { meaning: "(a cutting word: a pause after the first image)" }
      "そしま": { meaning: "many islands" }
      "かけて": { meaning: "to extend across" }
      "こぎいで": { meaning: "to row out" }
      "ぬ": { meaning: "(marks that the action is done)" }
      "と": { meaning: "(marks what is said: that)" }
      "ひと": { meaning: "people" }
      "に": { meaning: "(to)" }
      "は": { meaning: "(marks the topic)" }
      "つげよ": { meaning: "to tell (an order)" }
      "あまの": { meaning: "fisherman" }
      "つりぶね": { meaning: "fishing boat" }
  "ja-4707":
    native: "For your sake I go out into the spring fields to pick young greens, and the snow keeps falling on my sleeves."
    notes:
      "n1": "Emperor Koko writes about picking young greens in early spring, when snow still falls on the sleeves. The word わかな (wakana) means young greens, a food and a sign of the new year. The word いでて (idete) is the form of いづ (izu), to go out."
    bases:
      "きみ": { meaning: "you, my lord" }
      "が": { meaning: "(of)" }
      "ため": { meaning: "for the sake of" }
      "はる": { meaning: "spring" }
      "の": { meaning: "(of; also a field)" }
      "に": { meaning: "(in, to)" }
      "いでて": { meaning: "to go out" }
      "わかな": { meaning: "young greens" }
      "つむ": { meaning: "to pick" }
      "わが": { meaning: "my" }
      "ころもで": { meaning: "sleeve" }
      "ゆき": { meaning: "snow" }
      "は": { meaning: "(marks the topic)" }
      "ふりつつ": { meaning: "to keep falling" }
  "ja-4708":
    native: "The Japanese poem takes the human heart as its seed, and grows into countless words."
    notes:
      "n1": "The kana preface of the Kokin Wakashu, the first imperial collection of Japanese poems, written by Ki no Tsurayuki in 905. The word やまとうた (yamato uta) means Japanese poetry, and ことのは (kotonoha) means words. The text is shown in modern kana; the original was almost all kana."
    bases:
      "やまとうた": { meaning: "Japanese poem, waka" }
      "は": { meaning: "(marks the topic)" }
      "ひと": { meaning: "person, people" }
      "の": { meaning: "(of)" }
      "こころ": { meaning: "heart, mind" }
      "を": { meaning: "(marks the thing: the heart is the seed)" }
      "たね": { meaning: "seed" }
      "として": { meaning: "as, taking as" }
      "よろず": { meaning: "ten thousand, countless" }
      "ことのは": { meaning: "words, the language of poems" }
      "と": { meaning: "(marks what is said: as)" }
      "ぞ": { meaning: "(marks emphasis)" }
      "なれ": { meaning: "to become" }
      "りける": { meaning: "(marks a completed action)" }
  "ja-4709":
    native: "I am leaving here for Inaba, and if I hear that the pine on the mountain peak is waiting for me, I will come back at once."
    notes:
      "n1": "Ariwara no Yukihira plays on the word まつ (matsu), which means both a pine tree and to wait. The word きかば (kikaba) is the conditional of きく (kiku), to hear, and the word し (shi) adds emphasis."
    bases:
      "たちわかれ": { meaning: "to part, to leave" }
      "いなば": { meaning: "Inaba, a province (a place name)" }
      "の": { meaning: "(links two nouns: of)" }
      "やま": { meaning: "mountain" }
      "みね": { meaning: "peak, ridge" }
      "に": { meaning: "(on, at)" }
      "おうる": { meaning: "to grow, to be growing" }
      "まつ": { meaning: "pine tree; to wait (the same word)" }
      "と": { meaning: "(marks what is heard: that)" }
      "し": { meaning: "(marks emphasis)" }
      "きかば": { meaning: "if I hear" }
      "いま": { meaning: "now, at once" }
      "かえりこむ": { meaning: "to come back, I will return" }
  "ja-4710":
    native: "Must I pass this life without meeting you, even for the short length of one reed joint on the Naniwa shore?"
    notes:
      "n1": "Ise writes of a love that cannot meet, not even for the length of one joint of a reed on the Naniwa shore. The word ふし (fushi) means a joint of a reed, and まも (mamo) means a short space of time."
    bases:
      "なにわがた": { meaning: "Naniwa shore, a place name" }
      "みじかき": { meaning: "short" }
      "あし": { meaning: "reed" }
      "の": { meaning: "(links two nouns: of)" }
      "ふし": { meaning: "joint, node" }
      "まも": { meaning: "a short space of time" }
      "あわで": { meaning: "without meeting" }
      "このよ": { meaning: "this life, this world" }
      "を": { meaning: "(marks the time passed)" }
      "すぐして": { meaning: "to pass (time), to spend" }
      "よ": { meaning: "(marks a question: is it so)" }
      "とや": { meaning: "(marks a question: must it be that)" }
  "ja-4711":
    native: "This time I have no cloth to offer, so the red maple leaves of Mount Tamuke are my brocade, given as the gods will."
    notes:
      "n1": "Sugawara no Michizane wrote this on a journey, at a mountain pass where travellers made offerings to the gods. The word ぬさ (nusa) is the cloth that a traveller offered, and にしき (nishiki) is brocade. The word まにまに (manimani) means as someone wills."
    bases:
      "このたび": { meaning: "this time, this journey" }
      "は": { meaning: "(marks the topic)" }
      "ぬさ": { meaning: "cloth offered to the gods on a journey" }
      "も": { meaning: "(also, even)" }
      "とりあえず": { meaning: "without time to get something, hastily" }
      "たむけやま": { meaning: "Tamuke Mountain, a pass (a place name)" }
      "もみじ": { meaning: "autumn maple leaves" }
      "の": { meaning: "(links two nouns: of)" }
      "にしき": { meaning: "brocade" }
      "かみ": { meaning: "god, the gods" }
      "まにまに": { meaning: "as someone wills" }
  "ja-4712":
    native: "If the name of Ōsaka Hill is true, I wish there were a way to come to you unseen by others, like the sanekazura vine."
    notes:
      "n1": "Fujiwara no Sadakata plays on the name of Ōsaka Hill, which contains the word あう (au), to meet. The word さねかずら (sanekazura) is a climbing vine, and よし (yoshi) means a way or a means."
    bases:
      "なにし": { meaning: "true to its name" }
      "おわば": { meaning: "if it bears, if it is" }
      "おうさかやま": { meaning: "Ōsaka Hill, a place name" }
      "の": { meaning: "(links two nouns: of)" }
      "さねかずら": { meaning: "sanekazura, a climbing vine" }
      "ひと": { meaning: "person, people" }
      "に": { meaning: "(to, by)" }
      "しられで": { meaning: "without being known" }
      "くる": { meaning: "to come" }
      "よし": { meaning: "a way, a means" }
      "も": { meaning: "(marks a wish with the next word)" }
      "がな": { meaning: "I wish there were" }
  "ja-4713":
    native: "If the maple leaves on the peak of Mount Ogura have any heart, let them wait for the emperor's visit just once more."
    notes:
      "n1": "Fujiwara no Tadahira speaks to the maple leaves on the peak of Mount Ogura and asks them to wait for the visit of the emperor, みゆき (miyuki). The word あらば (araba) means if there is, and また (mata) is a form of まつ (matsu), to wait."
    bases:
      "おぐらやま": { meaning: "Ogura Hill, a place name" }
      "の": { meaning: "(links two nouns: of)" }
      "みね": { meaning: "peak" }
      "もみじば": { meaning: "maple leaves" }
      "こころ": { meaning: "heart, feeling" }
      "あらば": { meaning: "if there is" }
      "いま": { meaning: "now" }
      "ひとたび": { meaning: "once" }
      "みゆき": { meaning: "the emperor's visit" }
      "また": { meaning: "to wait (a form)" }
      "なむ": { meaning: "(marks a wish: let it be so)" }
  "ja-4714":
    native: "When did I ever see you, that I should long for you so, as the Izumi River flows apart across the Mikano Plain?"
    notes:
      "n1": "Fujiwara no Kanesuke writes about the Izumi River, which flows apart as it crosses the Mikano Plain. The word いつ (itsu) means when, and みき (miki) is the past form of みる (miru), to see. The word わきて (wakite) means apart, separately."
    bases:
      "みかの": { meaning: "Mika Plain (a place name)" }
      "はら": { meaning: "plain, field" }
      "わきて": { meaning: "apart, separately" }
      "ながるる": { meaning: "to flow" }
      "いずみがわ": { meaning: "Izumi River, a place name" }
      "いつ": { meaning: "when" }
      "みき": { meaning: "saw (a past form)" }
      "とてか": { meaning: "(so that, why)" }
      "こいしかる": { meaning: "to long for" }
      "らむ": { meaning: "(it must be that, probably)" }
  "ja-4715":
    native: "Since the parting when the dawn moon looked so cold and cruel, nothing is more painful than the dawn itself."
    notes:
      "n1": "Mibu no Tadamine writes about the moon that still hangs in the sky at dawn after a night with a lover. The word ありあけ (ariake) means the moon still visible at dawn, and つれなく (tsurenaku) means cold and indifferent."
    bases:
      "ありあけ": { meaning: "the moon still visible at dawn" }
      "の": { meaning: "(links two nouns: of)" }
      "つれなく": { meaning: "cold, indifferent" }
      "みえし": { meaning: "looked, appeared" }
      "わかれ": { meaning: "parting" }
      "より": { meaning: "(since, from)" }
      "あかつき": { meaning: "dawn" }
      "ばかり": { meaning: "only, nothing but" }
      "うき": { meaning: "painful, sad" }
      "もの": { meaning: "thing" }
      "は": { meaning: "(marks the topic)" }
      "なし": { meaning: "there is nothing" }
  "ja-4716":
    native: "I try to hide my love, as the thin grass of Ono Moor is hidden, but it overflows; why am I so full of longing for someone?"
    notes:
      "n1": "Minamoto no Hitoshi writes that he tries to hide his love, like the thin grass of Ono Moor, but that it overflows. The word しのぶ (shinobu) means to hide one's feelings, and あまる (amaru) means to overflow."
    bases:
      "あさじう": { meaning: "a thin, low grass" }
      "の": { meaning: "(links two nouns: of)" }
      "おの": { meaning: "Ono, a moor (a place name)" }
      "しのはら": { meaning: "a field of bamboo grass" }
      "しのぶれど": { meaning: "although I hide it" }
      "あまりて": { meaning: "to overflow" }
      "などか": { meaning: "why, how is it that" }
      "ひと": { meaning: "a person, someone" }
      "こいしき": { meaning: "longing, missing" }
  "ja-4717":
    native: "We swore, wiping each other's sleeves with our tears, that the waves would never cross Suenomatsu Mountain."
    notes:
      "n1": "Kiyohara no Motosuke recalls a vow made with a lover, when they wiped each other's sleeves with tears. The word すえ (sue) means the end or the far end, and なみ (nami) means waves. The word こさじ (kosaji) means will not cross, from こす (kosu), to cross."
    bases:
      "ちぎりき": { meaning: "we swore, a promise made" }
      "な": { meaning: "(marks emphasis)" }
      "かたみに": { meaning: "each other, mutually" }
      "そで": { meaning: "sleeve" }
      "を": { meaning: "(marks the thing wiped)" }
      "しぼりつつ": { meaning: "wringing out, wetting with tears" }
      "すえ": { meaning: "end, far end" }
      "の": { meaning: "(links two nouns: of)" }
      "まつやま": { meaning: "Matsu Mountain (a place name)" }
      "なみ": { meaning: "waves" }
      "こさじ": { meaning: "will not cross" }
      "とは": { meaning: "(marks what is said: that)" }
