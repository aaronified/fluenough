rules:
  "ja-rule-i-nakatta":
    name: "くなかった (kunakatta): the plain negative past of an i-adjective"
    explanation: "Take the negative that ends in くない (kunai) and replace ない (nai) with なかった (nakatta): おいしくない (oishikunai) becomes {1}, and さむくない (samukunai) becomes {2}. いい (ii) is irregular and uses よく (yoku): よくない (yokunai) becomes {3}. The plain past かった (katta) and the negative くない (kunai) belong to the first table of describing words and are not repeated here."
  "ja-rule-i-polite-past":
    name: "かったです (katta desu): the polite past of an i-adjective"
    explanation: "Put です (desu) after the plain past to make it polite: おいしかった (oishikatta) becomes {1}, and the negative past おいしくなかった (oishikunakatta) becomes {2}. The polite negative past has a second form with ありませんでした (arimasen deshita): {3}. いい (ii) is irregular: {4} means it was good."
  "ja-rule-na-datta":
    name: "だった (datta): the plain past of a na-adjective"
    explanation: "A na-adjective is followed by だった (datta), the plain past of です (desu): しずか (shizuka) becomes {1}, and きれい (kirei) becomes {2}. It does not take the かった (katta) of an i-adjective, and the な (na) used before a noun is dropped: not しずかなだった (shizukana datta)."
  "ja-rule-na-janakatta":
    name: "じゃなかった (ja nakatta): the plain negative past of a na-adjective"
    explanation: "The plain negative past is じゃなかった (ja nakatta), or ではなかった (de wa nakatta) when it is more formal: しずか (shizuka) becomes {1}, and きれい (kirei) becomes {2}. じゃ (ja) is the spoken form of では (de wa)."
  "ja-rule-na-polite-past":
    name: "でした (deshita): the polite past of a na-adjective"
    explanation: "でした (deshita) is the polite past of です (desu): しずか (shizuka) becomes {1}. The polite negative past is ではありませんでした (de wa arimasen deshita), or in speech じゃありませんでした (ja arimasen deshita): {2} and {3}."
