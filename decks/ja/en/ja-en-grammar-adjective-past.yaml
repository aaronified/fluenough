  slot_name: "form"
  slots:
    "i-nakatta": "was not {meaning}"
    "i-katta-desu": "was {meaning} (polite)"
    "i-nakatta-desu": "was not {meaning} (polite)"
    "na-datta": "was {meaning}"
    "na-janakatta": "was not {meaning}"
    "na-deshita": "was {meaning} (polite)"
    "na-arimasen-deshita": "was not {meaning} (polite)"
