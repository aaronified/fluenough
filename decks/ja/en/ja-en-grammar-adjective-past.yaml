name: "Describing words: the negative past and the polite past"
description: "An i-adjective makes its negative past with くなかった (kunakatta), as おいしくなかった (oishikunakatta), and its polite past by adding です (desu), as おいしかったです (oishikatta desu). A na-adjective takes だった (datta), じゃなかった (ja nakatta) and でした (deshita). The plain past of an i-adjective is taught with the first table of describing words. Every adjective a course deck teaches has a row. Not yet checked by a Japanese speaker: please report any mistake."
