tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "ta-koto-ga-aru": "have {meaning}"
rules:
  "ja-rule-ta-koto-ga-aru":
    name: "たことがあります (ta koto ga arimasu): have done"
    explanation: "{1} follows the past (ta) form to say that you have done something before: {2} means I have eaten it. The past form is the te-form with た (ta) in place of て (te), and だ (da) in place of で (de)."
