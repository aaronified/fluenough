name: "Having done it: たことがあります (ta koto ga arimasu)"
description: "Put ことがあります (koto ga arimasu) after the past (ta) form of a verb to say that you have done something before: たべたことがあります (tabeta koto ga arimasu), I have eaten it. Every verb a course deck teaches has a row. Not yet checked by a Japanese speaker: please report any mistake."
