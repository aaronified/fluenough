passages:
  - id: "ja-grammar-case-particles-1"
    title: "A morning"
    sentences:
      - text: "わたしはがっこうにいきます。"
        reading: "watashi wa gakkou ni ikimasu."
      - text: "ともだちがきます。"
        reading: "tomodachi ga kimasu."
      - text: "わたしはみずをのみます。"
        reading: "watashi wa mizu o nomimasu."
      - text: "でんしゃでいきます。"
        reading: "densha de ikimasu."
    questions:
      - id: "ja-0631"
        prompt:
          en: "Which line says that the speaker drinks water?"
        options:
          - en: "The third line"
          - en: "The fourth line"
        answer: 1
      - id: "ja-0632"
        prompt:
          en: "The second line says that a friend is coming."
        answer: true
      - id: "ja-0633"
        prompt:
          en: "Which line says that the speaker goes somewhere by train?"
        options:
          - en: "The third line"
          - en: "The fourth line"
        answer: 2
  - id: "ja-grammar-case-particles-2"
    title: "Notes on a week"
    sentences:
      - text: "わたしはえいごをならいます。"
        reading: "watashi wa eigo o naraimasu."
      - text: "ははががっこうにいきます。"
        reading: "haha ga gakkou ni ikimasu."
      - text: "せんせいがきます。"
        reading: "sensei ga kimasu."
      - text: "わたしはいぬをみます。"
        reading: "watashi wa inu o mimasu."
    questions:
      - id: "ja-0634"
        prompt:
          en: "Which line says that the speaker learns English?"
        options:
          - en: "The first line"
          - en: "The second line"
        answer: 1
      - id: "ja-0635"
        prompt:
          en: "The second line says that the mother goes to school."
        answer: true
      - id: "ja-0636"
        prompt:
          en: "Which line says that the speaker sees a dog?"
        options:
          - en: "The third line"
          - en: "The fourth line"
        answer: 2
