"id": "ja-en-grammar-te-form-sentences"
"kind": "layer"
"core": "ja-grammar-te-form-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "The te-form in sentences"
"description": "Sentences that join two actions with the te-form, to put in order, each with the words it could be mistaken for. Not yet checked by a Japanese speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "ja-4230":
    "native": "I get up in the morning and wash my face."
    "notes":
      "n1": "The te form links actions in the order they happen: おきて (okite), get up, comes before the washing."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
    "confusables":
      "w1":
        "why": "あらって (aratte) is the te-form of あらう (arau); the sentence ends with the polite あらいます (araimasu)."
      "w2":
        "why": "ねる (neru) is to sleep, not to get up."
  "ja-4231":
    "native": "I eat and then go to school."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "へ":
        "meaning": "to (a direction)"
    "confusables":
      "w1":
        "why": "のむ (nomu) is to drink, not to eat."
      "w2":
        "why": "いって (itte) is the te-form of いく (iku); the sentence ends with the polite いきます (ikimasu)."
  "ja-4232":
    "native": "I read a book and go to bed."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
    "confusables":
      "w1":
        "why": "よむ (yomu) ends in む (mu), so its te-form is よんで (yonde), never よって (yotte)."
      "w2":
        "why": "かく (kaku) is to write, not to read."
  "ja-4233":
    "native": "I meet a friend and we eat together."
    "notes":
      "n1": "The te form of あう (au), to meet, is あって (atte): the う (u) becomes って (tte). The person met is marked with に (ni): ともだちに (tomodachi ni)."
    "bases":
      "に":
        "meaning": "(marks the person met)"
    "confusables":
      "w1":
        "why": "あう (au) ends in う (u), so its te-form is あって (atte), never あいて (aite)."
      "w2":
        "why": "まって (matte) is the te-form of まつ (matsu), to wait."
  "ja-4234":
    "native": "I take the train and go to the office."
    "notes":
      "n1": "のる (noru), to board, takes に (ni) for the vehicle: でんしゃに (densha ni). Its te form is のって (notte)."
    "bases":
      "に":
        "meaning": "(marks what you ride)"
      "へ":
        "meaning": "to (a direction)"
    "confusables":
      "w1":
        "why": "のんで (nonde) is the te-form of のむ (nomu), to drink; のる (noru) ends in る (ru), so it takes って (tte)."
      "w2":
        "why": "おりる (oriru) is to get off, the opposite."
  "ja-4235":
    "native": "I take a shower and go out."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
    "confusables":
      "w1":
        "why": "あびる (abiru) is an ichidan verb: it drops る (ru) and adds て (te), never って (tte)."
      "w2":
        "why": "あらう (arau) is to wash."
  "ja-4236":
    "native": "I shop at the supermarket and go home."
    "bases":
      "で":
        "meaning": "(marks where it happens)"
      "へ":
        "meaning": "to (a direction)"
    "confusables":
      "w1":
        "why": "かいて (kaite) is the te-form of かく (kaku), to write; かう (kau) takes って (tte)."
      "w2":
        "why": "つくる (tsukuru) is to make."
  "ja-4237":
    "native": "I write a letter and send it."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
    "confusables":
      "w1":
        "why": "かって (katte) is the te-form of かう (kau), to buy; かく (kaku) takes いて (ite)."
      "w2":
        "why": "だして (dashite) is the te-form of だす (dasu); the sentence ends with the polite だします (dashimasu)."
  "ja-4238":
    "native": "I learn Japanese and speak it."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
    "confusables":
      "w1":
        "why": "ならう (narau) ends in う (u), so its te-form is ならって (naratte), never ならいて (naraite)."
      "w2":
        "why": "おしえる (oshieru) is to teach."
  "ja-4239":
    "native": "A friend came and we ate together."
    "notes":
      "n1": "くる (kuru), to come, is irregular: its te form is きて (kite), not くて (kute)."
    "bases":
      "が":
        "meaning": "(marks the subject)"
    "confusables":
      "w1":
        "why": "きって (kitte) is a stamp: the te-form きて (kite) has no doubled t sound."
      "w2":
        "why": "きいて (kiite) is the te-form of きく (kiku), to listen."
  "ja-4240":
    "native": "I clean and then cook."
    "notes":
      "n1": "A noun such as そうじ (souji), cleaning, takes する (suru) and its te form して (shite): そうじして (soujishite)."
    "confusables":
      "w1":
        "why": "あそぶ (asobu) is to play."
      "w2":
        "why": "ならう (narau) is to learn."
  "ja-4241":
    "native": "I work at a restaurant and go home."
    "notes":
      "n1": "で (de) marks the place where the work is done: レストランで (resutoran de)."
    "bases":
      "で":
        "meaning": "(marks where it happens)"
      "へ":
        "meaning": "to (a direction)"
    "confusables":
      "w1":
        "why": "はたらく (hataraku) ends in く (ku), so its te-form is はたらいて (hataraite), never はたらって (hataratte)."
      "w2":
        "why": "あるいて (aruite) is the te-form of あるく (aruku), to walk."
