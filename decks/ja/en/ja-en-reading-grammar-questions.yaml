passages:
  - id: "ja-grammar-questions-1"
    title: "Are you?"
    sentences:
      - text: "あなたはがくせいですか。"
        reading: "anata wa gakusei desu ka."
      - text: "あなたはせんせいですか。"
        reading: "anata wa sensei desu ka."
      - text: "かのじょはおんなですか。"
        reading: "kanojo wa onna desu ka."
      - text: "いぬですか。"
        reading: "inu desu ka."
    questions:
      - id: "ja-0715"
        prompt:
          en: "Which line asks whether the person is a student?"
        options:
          - en: "The first line"
          - en: "The second line"
        answer: 1
      - id: "ja-0716"
        prompt:
          en: "The third line asks whether she is a woman."
        answer: true
      - id: "ja-0717"
        prompt:
          en: "Which line asks whether it is a dog?"
        options:
          - en: "The third line"
          - en: "The fourth line"
        answer: 2
  - id: "ja-grammar-questions-2"
    title: "Quiz"
    sentences:
      - text: "はははせんせいですか。"
        reading: "haha wa sensei desu ka."
      - text: "ちちはおとこですか。"
        reading: "chichi wa otoko desu ka."
      - text: "ともだちはがくせいですか。"
        reading: "tomodachi wa gakusei desu ka."
      - text: "これはがっこうですか。"
        reading: "ko re wa gakkou desu ka."
    questions:
      - id: "ja-0718"
        prompt:
          en: "Which line asks whether the mother is a teacher?"
        options:
          - en: "The first line"
          - en: "The second line"
        answer: 1
      - id: "ja-0719"
        prompt:
          en: "The second line asks whether the father is a man."
        answer: true
      - id: "ja-0720"
        prompt:
          en: "Which line asks whether this is a school?"
        options:
          - en: "The third line"
          - en: "The fourth line"
        answer: 2
