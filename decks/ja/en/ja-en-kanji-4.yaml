schema: 1
id: "ja-en-kanji-4"
kind: "layer"
core: "ja-kanji-4"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 4: grade 1, part 4"
description: "Twenty-five kanji of the first school grade, each taught by the kana reading of the word it stands for. Some have one example or none yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-5120":
    native: "grass"
    notes:
      "n1": "草 (kusa): on reading ソウ (sou); kun reading くさ (kusa). No taught word uses it yet, so it has no example."
  "ja-5121":
    native: "foot; to suffice"
    notes:
      "n1": "足 (ashi): on reading ソク (soku); kun readings あし (ashi) and たりる (tariru). It is in 足 (ashi), foot."
    examples:
        "足がいたいです。": "My foot hurts."
        "足が大きいです。": "The feet are big."
  "ja-5122":
    native: "village"
    notes:
      "n1": "村 (mura): on reading ソン (son); kun reading むら (mura). It is in 村 (mura), village."
    examples:
        "村は大きいです。": "The village is big."
        "わたしの村は小さいです。": "My village is small."
  "ja-5123":
    native: "big; large"
    notes:
      "n1": "大 (ookii): on readings ダイ (dai) and タイ (tai); kun readings おおきい (ookii) and おお (oo). It is in 大学 (daigaku), university, and 大きい (ookii), big."
    examples:
        "大学は大きいです。": "The university is big."
        "まどは大きいです。": "The window is big."
  "ja-5124":
    native: "man; male"
    notes:
      "n1": "男 (otoko): on readings ダン (dan) and ナン (nan); kun reading おとこ (otoko). It is in 男 (otoko), man."
    examples:
        "男ですか。": "Is he a man?"
  "ja-5125":
    native: "bamboo"
    notes:
      "n1": "竹 (take): on reading チク (chiku); kun reading たけ (take). No taught word uses it yet, so it has no example."
  "ja-5126":
    native: "middle; inside"
    notes:
      "n1": "中 (naka): on readings チュウ (chuu) and ジュウ (juu); kun reading なか (naka). It is in 中 (naka), inside."
    examples:
        "いぬは中にいます。": "The dog is inside."
        "かばんの中に本があります。": "There is a book in the bag."
  "ja-5127":
    native: "insect"
    notes:
      "n1": "虫 (mushi): on reading チュウ (chuu); kun reading むし (mushi). No taught word uses it yet, so it has no example."
  "ja-5128":
    native: "town"
    notes:
      "n1": "町 (machi): on reading チョウ (chou); kun reading まち (machi). It is in 町 (machi), town."
    examples:
        "町は大きいです。": "The town is big."
  "ja-5129":
    native: "heaven; sky"
    notes:
      "n1": "天 (ten): on reading テン (ten); kun readings あめ (ame) and あま (ama). It is in 天気 (tenki), weather."
    examples:
        "天気はあついです。": "The weather is hot."
        "きょうは天気がいいです。": "The weather is nice today."
  "ja-5130":
    native: "rice field"
    notes:
      "n1": "田 (ta): on reading デン (den); kun readings た (ta) and だ (da). It is in 田中 (tanaka), Tanaka, a family name."
    examples:
        "田中さんは学生です。": "Mr. Tanaka is a student."
        "田中さんのこどもは小さいです。": "Mr. Tanaka's child is small."
  "ja-5131":
    native: "two"
    notes:
      "n1": "二 (ni): on readings ニ (ni) and ジ (ji); kun reading ふたつ (futatsu). It is in 二つ (futatsu), two things."
    examples:
        "二つあります。": "There are two (things)."
        "二つください。": "Two (things), please."
  "ja-5132":
    native: "enter"
    notes:
      "n1": "入 (hairu): on reading ニュウ (nyuu); kun readings はいる (hairu) and いる (iru). It is in 入ります (hairimasu), to enter."
    examples:
        "へやに入ります。": "I enter the room."
  "ja-5133":
    native: "year; age"
    notes:
      "n1": "年 (toshi): on reading ネン (nen); kun reading とし (toshi). It is in 年 (toshi), year."
    examples:
        "年はいくつですか。": "How old are you?"
  "ja-5134":
    native: "white"
    notes:
      "n1": "白 (shiro): on reading ハク (haku); kun readings しろ (shiro) and しら (shira). No taught word uses it yet, so it has no example."
  "ja-5135":
    native: "eight"
    notes:
      "n1": "八 (hachi): on reading ハチ (hachi); kun reading やっつ (yattsu). It is in 八つ (yattsu), eight things."
    examples:
        "八つあります。": "There are eight (things)."
        "八つください。": "Eight (things), please."
  "ja-5136":
    native: "hundred"
    notes:
      "n1": "百 (hyaku): on reading ヒャク (hyaku); kun reading もも (momo). It is in 四百 (yonhyaku), four hundred, and 五百 (gohyaku), five hundred."
    examples:
        "四百はたかいです。": "Four hundred is expensive."
        "五百です。": "It is five hundred."
  "ja-5137":
    native: "text; sentence"
    notes:
      "n1": "文 (bun): on readings ブン (bun) and モン (mon); kun reading ふみ (fumi). No taught word uses it yet, so it has no example."
  "ja-5138":
    native: "book; origin"
    notes:
      "n1": "本 (hon): on reading ホン (hon); kun reading もと (moto). It is in 本 (hon), book."
    examples:
        "本はたなにあります。": "The book is on the shelf."
        "本を見せてください。": "Please show me the book."
  "ja-5139":
    native: "name"
    notes:
      "n1": "名 (na): on readings メイ (mei) and ミョウ (myou); kun reading な (na). It is in 名字 (myouji), family name."
    examples:
        "名字はなんですか。": "What is your family name?"
        "わたしの名字はたなかです。": "My family name is Tanaka."
  "ja-5140":
    native: "eye"
    notes:
      "n1": "目 (me): on reading モク (moku); kun reading め (me). No taught word uses it yet, so it has no example."
  "ja-5141":
    native: "stand up"
    notes:
      "n1": "立 (tatsu): on reading リツ (ritsu); kun reading たつ (tatsu). It is in 立ちます (tachimasu), to stand."
    examples:
        "ここに立ちます。": "I stand here."
  "ja-5142":
    native: "power"
    notes:
      "n1": "力 (chikara): on readings リキ (riki) and リョク (ryoku); kun reading ちから (chikara). No taught word uses it yet, so it has no example."
  "ja-5143":
    native: "woods"
    notes:
      "n1": "林 (hayashi): on reading リン (rin); kun reading はやし (hayashi). No taught word uses it yet, so it has no example."
  "ja-5144":
    native: "six"
    notes:
      "n1": "六 (muttsu): on reading ロク (roku); kun reading むっつ (muttsu). It is in 六つ (muttsu), six things."
    examples:
        "六つあります。": "There are six (things)."
        "六つください。": "Six (things), please."
