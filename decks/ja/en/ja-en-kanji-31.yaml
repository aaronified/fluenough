core: "ja-kanji-31"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 31: grade 5, part 7"
description: "Twenty-five kanji of the fifth school grade, each taught by the kana reading of the word it stands for. Each has at least one example. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-6740":
    native: "copper"
    notes:
      "n1": "銅 (dou): on reading ドウ (dou); no kun reading. The kanji stands alone for the word どう (dou), copper, so the card uses that kana. The taught card どう (dou), how; how is it, from ja-questions, has the same kana but is a different word, a question word, so it is not the same card. Its examples are 銅は重いです (dou wa omoi desu), where 重い (omoi), heavy, is the taught card おもい (omoi), and 銅を買います (dou o kaimasu), where 買います (kaimasu), buys, is the masu form of the taught verb 買う (kau)."
    examples:
      "銅は重いです。": "Copper is heavy."
      "銅を買います。": "I buy copper."
  "ja-6741":
    native: "edge; brink"
    notes:
      "n1": "際 (kiwa): on reading サイ (sai) and kun reading きわ (kiwa). Its kana きわ (kiwa), edge; brink, is the word it stands for alone, written 際 (kiwa). The on reading サイ (sai) appears only in suffix uses such as 〜際 (sai), on the occasion of, which are not words on their own, so the card does not use it. No taught card has the kana きわ (kiwa). Its example is 際を歩きます (kiwa o arukimasu), where 歩きます (arukimasu), walks, is the masu form of the taught verb 歩く (aruku) and を (o) is the taught particle. The word is narrow in use, so it is listed for review."
    examples:
      "際を歩きます。": "I walk along the edge."
  "ja-6742":
    native: "rough; miscellaneous"
    notes:
      "n1": "雑 (zatsu): on readings ザツ (zatsu) and ゾウ (zou); no kun reading. Its kana ざつ (zatsu), rough; miscellaneous, is the word it stands for alone as an adjectival noun, used with な (na) before a noun, written 雑 (zatsu). No taught card has that kana. Its example is 部屋は雑です (heya wa zatsu desu), where 部屋 (heya), room, is the taught card へや (heya), は (wa) is the taught particle, and です (desu) is the taught copula."
    examples:
      "部屋は雑です。": "The room is untidy."
  "ja-6743":
    native: "territory"
    notes:
      "n1": "領 (ryoudo): on reading リョウ (ryou); no kun reading. It is not a word on its own, so the card uses 領土 (ryoudo), territory, the commonest word it begins, written 領土 (ryoudo). No taught card has the kana りょうど (ryoudo). Its examples are 大統領はいそがしいです (daitouryou wa isogashii desu), where 大統領 (daitouryou), president, is the taught card だいとうりょう (daitouryou) with 統 (tou) taught from ja-kanji-29, and いそがしい (isogashii), busy, is written in kana because 忙 (bou) is not yet taught, and 領土は大きいです (ryoudo wa ookii desu), where 大きい (ookii), large, is the taught card おおきい (ookii)."
    examples:
      "大統領はいそがしいです。": "The president is busy."
      "領土は大きいです。": "The territory is large."
  "ja-6744":
    native: "to guide; to lead"
    notes:
      "n1": "導 (michibiku): on reading ドウ (dou); kun reading みちび-く (michibi-ku). Its kana みちびく (michibiku), to guide; to lead, is the word it stands for in its kun reading, written 導く (michibiku). No taught card has that kana. Its example is 先生は学生を導きます (sensei wa gakusei o michibikimasu), where 先生 (sensei), teacher, and 学生 (gakusei), student, are the taught cards せんせい (sensei) and がくせい (gakusei), は (wa) and を (o) are taught particles, and 導きます (michibikimasu) is the masu form of the card."
    examples:
      "先生は学生を導きます。": "The teacher guides the students."
  "ja-6745":
    native: "to rampage; to run wild"
    notes:
      "n1": "暴 (abareru): on reading ボウ (bou); the parenthesised reading バク (baku) is a special or very narrow use; kun readings あば-く (aba-ku) and あば-れる (aba-reru). Its kana あばれる (abareru), to rampage; to run wild, is the word it stands for in its kun reading, written 暴れる (abareru). No taught card has that kana. Its example is 犬は暴れます (inu wa abaremasu), where 犬 (inu), dog, is the taught kanji card いぬ (inu) from ja-kanji-2, は (wa) is the taught particle, and 暴れます (abaremasu) is the masu form of the card."
    examples:
      "犬は暴れます。": "The dog runs wild."
  "ja-6746":
    native: "clean; decisive"
    notes:
      "n1": "潔 (isagiyoi): on reading ケツ (ketsu); kun reading いさぎよ-い (isagiyo-i). Its kana いさぎよい (isagiyoi), clean; pure; decisive, is the word it stands for in its kun reading, written 潔い (isagiyoi). No taught card has that kana. Its example is 台所は清潔です (daidokoro wa seiketsu desu), where 台所 (daidokoro), kitchen, is the taught card だいどころ (daidokoro), and 清潔 (seiketsu), clean, is the taught card せいけつ (seiketsu), which is a different word from 潔い (isagiyoi) and is written with 清 (sei) taught."
    examples:
      "台所は清潔です。": "The kitchen is clean."
  "ja-6747":
    native: "certain; sure"
    notes:
      "n1": "確 (tashika): on reading カク (kaku); kun readings たし-か (tashi-ka) and たし-かめる (tashi-kameru). Its kana たしか (tashika), certain; sure, is the word it stands for in its kun reading, written 確か (tashika). The taught card たしか (tashika), certain; sure, from ja-opinions, is the same word 確か (tashika). Its example is 確かに高いです (tashika ni takai desu), where 確かに (tashika ni), certainly, is the taught card たしかに (tashikani), 高い (takai), expensive, is the taught card たかい (takai), and です (desu) is the taught copula. Only one example is written. The taught word 正確 (seikaku) is not used, because its kana せいかく (seikaku) comes only from the kanji cards 性 (sei) and 格 (kaku), not from a word card."
    examples:
      "確かに高いです。": "It is certainly expensive."
  "ja-6748":
    native: "to knit"
    notes:
      "n1": "編 (amu): on reading ヘン (hen); kun reading あ-む (a-mu). Its kana あむ (amu), to knit, is the word it stands for in its kun reading, written 編む (amu). The taught card あむ (amu), to knit, from ja-hobbies, is the same word 編む (amu). Its example is 母は編みます (haha wa amimasu), where 母 (haha), mother, is the taught kanji card はは (haha) from ja-kanji-9, は (wa) is the taught particle, and 編みます (amimasu) is the masu form of the card."
    examples:
      "母は編みます。": "My mother knits."
  "ja-6749":
    native: "agreement; approval"
    notes:
      "n1": "賛 (sansei): on reading サン (san); no kun reading. It is not a word on its own, so its kana さんせい (sansei), agreement; approval, is the commonest word it begins, written 賛成 (sansei). The taught card さんせい (sansei), agreement; approval, from ja-opinions, is the same word 賛成 (sansei). Its example is わたしは賛成です (watashi wa sansei desu), where わたし (watashi), I, is the taught card わたし (watashi), written in kana because 私 (watashi) is not yet taught, は (wa) is the taught particle, and です (desu) is the taught copula."
    examples:
      "わたしは賛成です。": "I agree."
  "ja-6750":
    native: "prize; award"
    notes:
      "n1": "賞 (shou): on reading ショウ (shou); no kun reading. The kanji stands alone for the word しょう (shou), prize; award, so the card uses that kana. No taught card has that kana. Its example is 賞は大きいです (shou wa ookii desu), where 大きい (ookii), large, is the taught card おおきい (ookii), は (wa) is the taught particle, and です (desu) is the taught copula."
    examples:
      "賞は大きいです。": "The prize is large."
  "ja-6751":
    native: "quality"
    notes:
      "n1": "質 (shitsu): on readings シツ (shitsu) and シチ (shichi); the parenthesised reading チ (chi) is a special or very narrow use; no kun reading. The kanji stands alone for the word しつ (shitsu), quality, so the card uses that kana. No taught card has that kana. Its example is 質はいいです (shitsu wa ii desu), where いい (ii), good, is the taught card いい (ii), は (wa) is the taught particle, and です (desu) is the taught copula."
    examples:
      "質はいいです。": "The quality is good."
  "ja-6752":
    native: "to burn"
    notes:
      "n1": "燃 (moeru): on reading ネン (nen); kun readings も-える (mo-eru), も-やす (mo-yasu) and も-す (mo-su). Its kana もえる (moeru), to burn, is the word it stands for in its kun reading, written 燃える (moeru). No taught card has that kana. Its example is 火は燃えます (hi wa moemasu), where 火 (hi), fire, is the taught kanji card ひ (hi) from ja-kanji-1, は (wa) is the taught particle, and 燃えます (moemasu) is the masu form of the card."
    examples:
      "火は燃えます。": "Fire burns."
  "ja-6753":
    native: "to build"
    notes:
      "n1": "築 (kizuku): on reading チク (chiku); kun reading きず-く (kizu-ku). Its kana きずく (kizuku), to build, is the word it stands for in its kun reading, written 築く (kizuku). No taught card has that kana. Its example is 城を築きます (shiro o kizukimasu), where 城 (shiro), castle, is the taught kanji card しろ (shiro) from ja-kanji-20, を (o) is the taught particle, and 築きます (kizukimasu) is the masu form of the card."
    examples:
      "城を築きます。": "I build a castle."
  "ja-6754":
    native: "interest"
    notes:
      "n1": "興 (kyoumi): on readings コウ (kou) and キョウ (kyou); kun readings おこ-る (oko-ru) and おこ-す (oko-su). Its kana きょうみ (kyoumi), interest, is the commonest word it begins, written 興味 (kyoumi). The taught card きょうみ (kyoumi), interest, from ja-feelings, is the same word 興味 (kyoumi). Its example is 興味を持ちます (kyoumi o mochimasu), where 持ちます (mochimasu) is the masu form of the taught verb 持つ (motsu) from ja-kanji-13, and を (o) is the taught particle."
    examples:
      "興味を持ちます。": "I take an interest."
  "ja-6755":
    native: "hygiene; sanitation"
    notes:
      "n1": "衛 (eisei): on reading エイ (ei); no kun reading. It is not a word on its own, so its kana えいせい (eisei), hygiene; sanitation, is the commonest word it begins, written 衛生 (eisei). No taught card has that kana. Its example is 衛生は大切です (eisei wa taisetsu desu), where 大切 (taisetsu), important, is the taught card たいせつ (taisetsu), は (wa) is the taught particle, and です (desu) is the taught copula."
    examples:
      "衛生は大切です。": "Hygiene is important."
  "ja-6756":
    native: "import"
    notes:
      "n1": "輸 (yunyuu): on reading ユ (yu); no kun reading. It is not a word on its own, so its kana ゆにゅう (yunyuu), import, is the commonest word it begins, written 輸入 (yunyuu). The taught card ゆにゅう (yunyuu), import, from ja-business, is the same word 輸入 (yunyuu). Its examples are ばななは輸入です (banana wa yunyuu desu), where ばなな (banana), banana, is the taught card ばなな (banana), and 車は輸出です (kuruma wa yushutsu desu), where 車 (kuruma), car, is the taught kanji card くるま (kuruma) from ja-kanji-3, and 輸出 (yushutsu), export, is the taught card ゆしゅつ (yushutsu) from ja-business."
    examples:
      "ばななは輸入です。": "Bananas are imports."
      "車は輸出です。": "Cars are exports."
  "ja-6757":
    native: "grades; results"
    notes:
      "n1": "績 (seiseki): on reading セキ (seki); no kun reading. It is not a word on its own, so its kana せいせき (seiseki), grades; results, is the commonest word it begins, written 成績 (seiseki). The taught card せいせき (seiseki), grades, from ja-school, is the same word 成績 (seiseki). Its example is 成績を見ます (seiseki o mimasu), where 成 (sei) is taught, を (o) is the taught particle, and 見ます (mimasu) is the masu form of the taught verb 見る (miru)."
    examples:
      "成績を見ます。": "I check my grades."
  "ja-6758":
    native: "lecture"
    notes:
      "n1": "講 (kougi): on reading コウ (kou); no kun reading. It is not a word on its own, so its kana こうぎ (kougi), lecture, is the commonest word it begins, written 講義 (kougi). 義 (gi) is not yet taught, so 講義 (kougi) is not written with kanji in any example. No taught card has the kana こうぎ (kougi). Its example is 講堂に行きます (koudou ni ikimasu), where 講堂 (koudou), lecture hall, is the taught card こうどう (koudou) with 堂 (dou) taught, に (ni) is the taught particle, and 行きます (ikimasu) is the masu form of the taught verb 行く (iku)."
    examples:
      "講堂に行きます。": "I go to the lecture hall."
  "ja-6759":
    native: "to apologise"
    notes:
      "n1": "謝 (ayamaru): on reading シャ (sha); kun reading あやま-る (ayama-ru). Its kana あやまる (ayamaru), to apologise, is the word it stands for in its kun reading, written 謝る (ayamaru). The taught card あやまる (ayamaru), to apologise, from ja-verbs-3, is the same word 謝る (ayamaru). Its example is 先生に謝ります (sensei ni ayamarimasu), where 先生 (sensei) is the taught card せんせい (sensei), に (ni) is the taught particle, and 謝ります (ayamarimasu) is the masu form of the card."
    examples:
      "先生に謝ります。": "I apologise to the teacher."
  "ja-6760":
    native: "to weave"
    notes:
      "n1": "織 (oru): on readings ショク (shoku) and シキ (shiki); kun reading お-る (o-ru). Its kana おる (oru), to weave, is the word it stands for in its kun reading, written 織る (oru). The taught card おる (oru), to fold; to break, from ja-kanji-19, is 折る (oru), a different word that shares the kana, so it is not the same card. Its example is 母は布を織ります (haha wa nuno o orimasu), where 母 (haha) is the taught kanji card はは (haha), は (wa) and を (o) are taught particles, 布 (nuno), cloth, is the taught kanji card ぬの (nuno) from ja-kanji-25, and 織ります (orimasu) is the masu form of the card."
    examples:
      "母は布を織ります。": "My mother weaves cloth."
  "ja-6761":
    native: "occupation"
    notes:
      "n1": "職 (shokugyou): on reading ショク (shoku); no kun reading. It is not a word on its own, so its kana しょくぎょう (shokugyou), occupation, is the commonest word it begins, written 職業 (shokugyou). The taught card しょくぎょう (shokugyou), occupation, from ja-careers, is the same word 職業 (shokugyou). Its example is 職業は先生です (shokugyou wa sensei desu), where 先生 (sensei) is the taught card せんせい (sensei), は (wa) is the taught particle, and です (desu) is the taught copula."
    examples:
      "職業は先生です。": "My occupation is teacher."
  "ja-6762":
    native: "forehead"
    notes:
      "n1": "額 (hitai): on reading ガク (gaku); kun reading ひたい (hitai), which is the one the card uses. Its kana ひたい (hitai), forehead, is the word it stands for alone, written 額 (hitai). No taught card has that kana. Its example is 額はいたいです (hitai wa itai desu), where いたい (itai) is the taught card いたい (itai) written in kana, は (wa) is the taught particle, and です (desu) is the taught copula."
    examples:
      "額はいたいです。": "My forehead hurts."
  "ja-6763":
    native: "knowledge"
    notes:
      "n1": "識 (chishiki): on reading シキ (shiki); no kun reading. It is not a word on its own, so its kana ちしき (chishiki), knowledge, is the common word it begins, written 知識 (chishiki). No taught card has that kana. Its example is 知識を持ちます (chishiki o mochimasu), where 知 (chi) is taught, を (o) is the taught particle, and 持ちます (mochimasu) is the masu form of the taught verb 持つ (motsu) from ja-kanji-13. The choice of 知識 (chishiki) over other compounds is listed for review."
    examples:
      "知識を持ちます。": "I have knowledge."
  "ja-6764":
    native: "protection"
    notes:
      "n1": "護 (hogo): on reading ゴ (go); no kun reading. It is not a word on its own, so its kana ほご (hogo), protection, is the commonest word it begins, written 保護 (hogo). The taught card ほご (hogo), protection, from ja-news, is the same word 保護 (hogo). Its example is 保護は大切です (hogo wa taisetsu desu), where 大切 (taisetsu), important, is the taught card たいせつ (taisetsu), は (wa) is the taught particle, and です (desu) is the taught copula."
    examples:
      "保護は大切です。": "Protection is important."
