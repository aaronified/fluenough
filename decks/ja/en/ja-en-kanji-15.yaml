schema: 1
id: "ja-en-kanji-15"
kind: "layer"
core: "ja-kanji-15"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 15: grade 3, part 6"
description: "Twenty-five kanji of the third school grade, each taught by the kana reading of the word it stands for. Some have one example or none yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-5780":
    native: "to distribute; to hand out"
    notes:
      "n1": "配 (kubaru): on reading ハイ (hai); kun reading くばる (kubaru). Its kana くばる (kubaru) is the commonest word the kanji stands for, to distribute, and is not yet a taught card. It is in 心配 (shinpai), worry."
  "ja-5781":
    native: "alcoholic drink; sake"
    notes:
      "n1": "酒 (sake): on reading シュ (shu); kun readings さけ (sake) and, in limited use, さか (saka). Its kana さけ (sake) is also the taught card さけ (sake), sake, the same word. It is in お酒 (osake), the polite form."
    examples:
      "わたしは酒をのみます。": "I drink sake."
      "酒はすきです。": "I like sake."
  "ja-5782":
    native: "institution; hospital"
    notes:
      "n1": "院 (byouin): on reading イン (in) only. Its kana びょういん (byouin) is the commonest word the kanji stands for, 病院 (byouin), hospital, and is also the taught card びょういん (byouin), hospital, the same word. It is in 大学院 (daigakuin), graduate school."
    examples:
      "病院にいきます。": "I go to the hospital."
      "病院はあたらしいです。": "The hospital is new."
  "ja-5783":
    native: "to move"
    notes:
      "n1": "動 (ugoku): on reading ドウ (dou); kun readings うごく (ugoku) and うごかす (ugokasu). Its kana うごく (ugoku), to move, is not yet a taught card. It is in 動物園 (doubutsuen), zoo, where it has its on reading ドウ (dou), and in 動物 (doubutsu), animal."
    examples:
      "動物園にいきます。": "I go to the zoo."
      "動物園はおおきいです。": "The zoo is big."
  "ja-5784":
    native: "trade; business"
    notes:
      "n1": "商 (shoubai): on reading ショウ (shou); kun reading あきなう (akinau). Its kana しょうばい (shoubai) is the commonest word the kanji stands for, 商売 (shoubai), business, and is also the taught card しょうばい (shoubai), business, the same word. It is in 商店 (shouten), shop."
    examples:
      "わたしは商売をします。": "I run a business."
      "商売はむずかしいです。": "Business is hard."
  "ja-5785":
    native: "question; to ask"
    notes:
      "n1": "問 (mondai): on reading モン (mon); kun readings とう (tou) and とい (toi); in limited use, とん (ton). Its kana もんだい (mondai), a problem, is the commonest word the kanji stands for and is not yet a taught card. It is in 問う (tou), to ask."
  "ja-5786":
    native: "lodging; inn"
    notes:
      "n1": "宿 (shukudai): on reading シュク (shuku); kun readings やど (yado), やどる (yadoru) and やどす (yadosu). Its kana しゅくだい (shukudai), homework, is the commonest word the kanji stands for, and is also the taught card しゅくだい (shukudai), homework, the same word. It is in 宿屋 (yadoya), inn."
  "ja-5787":
    native: "notebook; ledger"
    notes:
      "n1": "帳 (techou): on reading チョウ (chou) only. Its kana てちょう (techou), a notebook, is the commonest word the kanji stands for. It is in 手帳 (techou), a notebook."
  "ja-5788":
    native: "bad; evil"
    notes:
      "n1": "悪 (warui): on readings アク (aku) and オ (o); kun reading わるい (warui). Its kana わるい (warui) is also the taught card わるい (warui), bad, the same word. It is in 悪人 (akunin), a bad person."
    examples:
      "悪いひとです。": "This person is bad."
      "てんきは悪いです。": "The weather is bad."
  "ja-5789":
    native: "tribe; family"
    notes:
      "n1": "族 (kazoku): on reading ゾク (zoku) only. Its kana かぞく (kazoku) is the commonest word the kanji stands for, 家族 (kazoku), family, and is also the taught card かぞく (kazoku), family, the same word. It is in 一族 (ichizoku), a clan."
    examples:
      "家族はたのしいです。": "Family is fun."
      "わたしの家族はおおきいです。": "My family is big."
  "ja-5790":
    native: "deep; profound"
    notes:
      "n1": "深 (fukai): on reading シン (shin); kun readings ふかい (fukai), ふかまる (fukamaru) and ふかめる (fukameru). Its kana ふかい (fukai), deep, is the commonest word the kanji stands for and is not yet a taught card. It is in 深夜 (shinya), late at night."
  "ja-5791":
    native: "ball; sphere"
    notes:
      "n1": "球 (yakyuu): on reading キュウ (kyuu); kun reading たま (tama). Its kana やきゅう (yakyuu) is the word 野球 (yakyuu), baseball, in which the kanji is written. It is in 地球 (chikyuu), the earth."
    examples:
      "わたしは野球がすきです。": "I like baseball."
      "ともだちは野球をします。": "My friend plays baseball."
  "ja-5792":
    native: "festival"
    notes:
      "n1": "祭 (matsuri): on reading サイ (sai); kun readings まつる (matsuru) and まつり (matsuri). Its kana まつり (matsuri), a festival, is also the taught card まつり (matsuri), festival, the same word. It is in 文化祭 (bunkasai), a culture festival."
    examples:
      "祭りはたのしいです。": "The festival is fun."
      "祭りにいきます。": "I go to the festival."
  "ja-5793":
    native: "chapter; section; badge"
    notes:
      "n1": "章 (bunshou): on reading ショウ (shou) only. Its kana ぶんしょう (bunshou), writing, is the commonest word the kanji stands for, 文章 (bunshou), and is not yet a taught card. It is in 文章 (bunshou), a text."
  "ja-5794":
    native: "flute; whistle"
    notes:
      "n1": "笛 (fue): on reading テキ (teki); kun reading ふえ (fue). Its kana ふえ (fue) is also the taught card ふえ (fue), flute, the same word. It is in 口笛 (kuchibue), a whistle."
    examples:
      "笛はたかいです。": "The flute is expensive."
      "わたしの笛はあたらしいです。": "My flute is new."
  "ja-5795":
    native: "ordinal prefix; number"
    notes:
      "n1": "第 (daiichi): on reading ダイ (dai) only. Its kana だいいち (daiichi), first, is the commonest word the kanji stands for, 第一 (daiichi), and is not yet a taught card. It is in 第二 (daini), second."
  "ja-5796":
    native: "end; to finish"
    notes:
      "n1": "終 (owaru): on reading シュウ (shuu); kun readings おわる (owaru) and おえる (oeru). Its kana おわる (owaru) is also the taught card おわる (owaru), to end, the same word. It is in 終点 (shuuten), the last stop."
    examples:
      "きょうは終わりです。": "Today is the end."
      "がっこうは終わります。": "School ends."
  "ja-5797":
    native: "to learn; to practise"
    notes:
      "n1": "習 (narau): on reading シュウ (shuu); kun reading ならう (narau). Its kana ならう (narau) is also the taught card ならう (narau), to learn, the same word. It is in 習字 (shuuji), calligraphy."
    examples:
      "わたしはにほんごを習います。": "I learn Japanese."
      "がっこうで習います。": "I learn it at school."
  "ja-5798":
    native: "to turn; to roll; to change"
    notes:
      "n1": "転 (unten): on reading テン (ten) only; kun readings ころがる (korogaru), ころげる (korogeru), ころがす (korogasu) and ころぶ (korobu). Its kana うんてん (unten), driving, is the commonest word the kanji stands for and is not yet a taught card. It is in 自転車 (jitensha), bicycle, where it has its on reading テン (ten)."
    examples:
      "自転車はあたらしいです。": "The bicycle is new."
      "わたしは自転車がすきです。": "I like bicycles."
  "ja-5799":
    native: "to advance; to progress"
    notes:
      "n1": "進 (susumu): on reading シン (shin); kun readings すすむ (susumu) and すすめる (susumeru). Its kana すすむ (susumu) is also the taught card すすむ (susumu), to advance, the same word. It is in 進学 (shingaku), going on to a higher school."
    examples:
      "でんしゃは進みます。": "The train moves on."
      "でんしゃはまえへ進みます。": "The train moves forward."
  "ja-5800":
    native: "part; section; department"
    notes:
      "n1": "部 (zenbu): on reading ブ (bu) only. Its kana ぜんぶ (zenbu), all, is the commonest word the kanji stands for, 全部 (zenbu), and is also the taught card ぜんぶ (zenbu), all, the same word. It is in 部屋 (heya), a room."
    examples:
      "全部です。": "That is all."
      "部長はやさしいです。": "The section chief is kind."
  "ja-5801":
    native: "metropolis; capital city"
    notes:
      "n1": "都 (miyako): on readings ト (to) and ツ (tsu); kun reading みやこ (miyako). Its kana みやこ (miyako), a capital city, is the commonest word the kanji stands for and is not yet a taught card. It is in 京都 (kyouto), Kyoto, where it has its on reading ト (to), and in 都会 (tokai), a city."
    examples:
      "京都にいきます。": "I go to Kyoto."
      "京都はおおきいです。": "Kyoto is big."
  "ja-5802":
    native: "to win; victory"
    notes:
      "n1": "勝 (katsu): on reading ショウ (shou); kun readings かつ (katsu) and まさる (masaru). Its kana かつ (katsu) is also the taught card かつ (katsu), to win, the same word. It is in 決勝 (kesshou), a final round."
    examples:
      "わたしはともだちに勝ちます。": "I win against my friend."
      "わたしは勝ちます。": "I win."
  "ja-5803":
    native: "cold (weather)"
    notes:
      "n1": "寒 (samui): on reading カン (kan) only; kun reading さむい (samui). Its kana さむい (samui), cold, is also the taught card さむい (samui), cold, the same word. It is in 寒気 (samuke), a chill."
    examples:
      "きょうは寒いです。": "Today is cold."
      "あしたは寒いです。": "Tomorrow is cold."
  "ja-5804":
    native: "sad; sorrowful"
    notes:
      "n1": "悲 (kanashii): on reading ヒ (hi); kun readings かなしい (kanashii) and かなしむ (kanashimu). Its kana かなしい (kanashii), sad, is also the taught card かなしい (kanashii), sad, the same word. It is in 悲鳴 (himei), a scream."
    examples:
      "わたしは悲しいです。": "I am sad."
      "ともだちは悲しいです。": "My friend is sad."
