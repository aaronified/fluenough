schema: 1
id: "ja-en-culture-3"
kind: "layer"
core: "ja-culture-3"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: poems, songs and prose"
description: "Eighteen short items from Japanese poetry, children's songs and prose, from the Meiji to the early Showa period, in the public domain. Each shows who wrote it, when, and where it comes from. The texts are in modern kana. The English is the builder's own plain rendering. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ja-4650":
    native: "Bell, bird, and I: everything is different, and everything is good."
    notes:
      "n1": "The last verse of the poem Watashi to kotori to suzu to (watashi to kotori to suzu to) by Kaneko Misuzu. The verse says that each of the three is different and each is good, without ranking them."
    bases:
      "すず": { meaning: "bell" }
      "と": { meaning: "(and, with)" }
      "ことり": { meaning: "small bird" }
      "それから": { meaning: "and then, after that" }
      "わたし": { meaning: "I, me" }
      "みんな": { meaning: "everyone, all" }
      "ちがって": { meaning: "being different (te form of to be different)" }
      "いい": { meaning: "good" }
  "ja-4651":
    native: "How sad the sand without life is: when I grasp it, it runs out between my fingers."
    notes:
      "n1": "A tanka by Ishikawa Takuboku from Ichiaku no Suna (ichiaku no suna), his first tanka collection, published in 1910. The last word of the poem is otsu (to fall, old form)."
    bases:
      "いのちなき": { meaning: "lifeless" }
      "すな": { meaning: "sand" }
      "の": { meaning: "(of)" }
      "かなしさ": { meaning: "sadness" }
      "よ": { meaning: "(an exclamation)" }
      "さらさら": { meaning: "(sound or flow of sand)" }
      "と": { meaning: "(in the manner of)" }
      "にぎれば": { meaning: "when (one) grasps" }
      "ゆび": { meaning: "finger" }
      "あいだ": { meaning: "gap, between" }
      "より": { meaning: "from, out of" }
      "おつ": { meaning: "to fall (old)" }
  "ja-4652":
    native: "I work, I work, and still my life does not become easy; I only look at my hands."
    notes:
      "n1": "A tanka by Ishikawa Takuboku from the same collection. The line narazari (did not become) is an old form, kept as written. The poem ends with the single word miru (to look), with nothing added."
    bases:
      "はたらけど": { meaning: "though (one) works" }
      "なお": { meaning: "still, yet" }
      "わが": { meaning: "my (old)" }
      "くらし": { meaning: "livelihood, way of life" }
      "らくに": { meaning: "with ease, comfortably" }
      "ならざり": { meaning: "did not become (old)" }
      "じっと": { meaning: "steadily, fixedly" }
      "て": { meaning: "hand" }
      "を": { meaning: "(marks the object)" }
      "みる": { meaning: "to look" }
  "ja-4653":
    native: "I had a dream like this: I sat with my arms folded beside the pillow, and a woman who lay on her back"
    notes:
      "n1": "The opening of the first night of Natsume Soseki's Yume Juya (yume juuya), Ten Nights of Dreams, serialised in 1908. The line konna yume o mita (I had a dream like this) starts the first, second, third and fifth nights."
    bases:
      "こんな": { meaning: "such, like this" }
      "ゆめ": { meaning: "dream" }
      "を": { meaning: "(marks the object)" }
      "みた": { meaning: "saw (a dream)" }
      "うでぐみ": { meaning: "arms folded" }
      "して": { meaning: "having done" }
      "まくら": { meaning: "pillow" }
      "もと": { meaning: "side, beside" }
      "に": { meaning: "(at, in)" }
      "すわって": { meaning: "sitting (te form of to sit)" }
      "いると": { meaning: "while (one) is (in a state)" }
      "あおむけ": { meaning: "face up, on the back" }
      "ねた": { meaning: "lay down (past)" }
      "おんな": { meaning: "woman" }
      "が": { meaning: "(marks the subject)" }
  "ja-4654":
    native: "Yuaan, yuyoon, yuyayuyon (the sound of a swing in the poem)."
    notes:
      "n1": "A line of sounds from the poem Saakasu (saakasu), Circus, by Nakahara Chuya. It has no meaning of its own: the page calls it an onomatopoeia, and says he sang these sounds with his head back and his eyes closed when he read the poem aloud."
    bases:
      "ゆあーん": { meaning: "(sound of a swing)" }
      "ゆよーん": { meaning: "(sound of a swing)" }
      "ゆやゆよん": { meaning: "(sound of a swing)" }
  "ja-4655":
    native: "This spider's thread is mine!"
    notes:
      "n1": "The line that Kandata shouts in the story Kumo no Ito (kumo no ito), The Spider's Thread, by Akutagawa Ryunosuke, when he sees many sinners climbing up the thread behind him. The thread then breaks. The word ore (ore) is a rough word for I."
    bases:
      "この": { meaning: "this" }
      "くも": { meaning: "spider" }
      "の": { meaning: "(of)" }
      "いと": { meaning: "thread" }
      "は": { meaning: "(marks the topic)" }
      "おれ": { meaning: "I (rough, male speech)" }
      "もの": { meaning: "thing; something that is one's own" }
      "だ": { meaning: "is" }
      "ぞ": { meaning: "(strong ending: I tell you)" }
  "ja-4657":
    native: "The karatachi flowers have bloomed; white, white flowers have bloomed."
    notes:
      "n1": "The first two lines of the children's song Karatachi no hana (karatachi no hana), with words by Kitahara Hakushu and music by Yamada Kosaku. The page says the words came out in Akai Tori in 1924. The next verses of the poem speak of the thorns of the karatachi and of its hedge round a field."
    bases:
      "からたち": { meaning: "karatachi (a thorny hedge shrub)" }
      "の": { meaning: "(of)" }
      "はな": { meaning: "flower" }
      "が": { meaning: "(marks the subject)" }
      "さいた": { meaning: "to bloom" }
      "よ": { meaning: "(ending: I tell you)" }
      "しろい": { meaning: "white" }
  "ja-4658":
    native: "Why does the crow cry; because in the mountains it has a dear child of seven."
    notes:
      "n1": "The first verse of the children's song Nanatsu no ko (nanatsu no ko), with words by Noguchi Ujo and music by Motoori Nagayo. The page says it was printed with the music in the magazine Kin no Fune in July 1921, and that Noguchi made it from an earlier poem of his, Yamagarasu (yamagarasu), from 1907."
    bases:
      "からす": { meaning: "crow" }
      "なぜ": { meaning: "why" }
      "なく": { meaning: "to cry" }
      "の": { meaning: "(ending of a question)" }
      "は": { meaning: "(marks the topic)" }
      "やま": { meaning: "mountain" }
      "に": { meaning: "(in, at)" }
      "かわい": { meaning: "dear, lovable" }
      "ななつ": { meaning: "seven" }
      "こ": { meaning: "child" }
      "が": { meaning: "(marks the subject)" }
      "ある": { meaning: "to be, to have" }
      "から": { meaning: "because" }
      "よ": { meaning: "(ending: I tell you)" }
  "ja-4659":
    native: "This road is a road I have been on before; ah, yes, the acacia flowers are in bloom."
    notes:
      "n1": "The first verse of the children's song Kono michi (kono michi), with words by Kitahara Hakushu and music by Yamada Kosaku. The page says the poem was printed in Akai Tori in 1926 and the song was recorded in 1927. The page says the first two verses are about a road in Hokkaido. The verb kita (kita), came, is the past of kuru (kuru), to come, and its stem changes to ki (ki)."
    bases:
      "この": { meaning: "this" }
      "みち": { meaning: "road" }
      "は": { meaning: "(marks the topic)" }
      "いつか": { meaning: "some time, once" }
      "きた": { meaning: "to come" }
      "ああ": { meaning: "ah" }
      "そうだよ": { meaning: "that's so" }
      "あかしや": { meaning: "acacia (the page says the false acacia)" }
      "の": { meaning: "(of)" }
      "はな": { meaning: "flower" }
      "が": { meaning: "(marks the subject)" }
      "さいてる": { meaning: "to bloom" }
  "ja-4660":
    native: "An unaccountable, ominous lump."
    notes:
      "n1": "A phrase from the story Lemon (remon) by Kajii Motojiro, printed in the magazine Aozora (aozora) in January 1925. The page says that this lump, which the narrator cannot name, pressed on his heart all the time, until he bought a lemon and its cool weight in his hand eased it."
    bases:
      "えたい": { meaning: "true nature (etainoshirenai (etainoshirenai): of unknown nature)" }
      "の": { meaning: "(of)" }
      "しれない": { meaning: "to be known (shirenai (shirenai): unknown)" }
      "ふきつな": { meaning: "ominous, ill-omened" }
      "かたまり": { meaning: "lump" }
  "ja-4661":
    native: "When I wander on the beach in the morning, I am reminded of the old days."
    notes:
      "n1": "The first two lines of the song Hamabe no uta (hamabe no uta), with words by Hayashi Kokei and music by Narita Tamezo. The page says Hayashi printed the words in August 1913 under the title Hamabe (hamabe), marked as a trial for music. The ending of shinobaruru (shinobaruru) is an old form."
    bases:
      "あした": { meaning: "morning" }
      "はまべ": { meaning: "beach" }
      "を": { meaning: "(marks the place passed through)" }
      "さまよえば": { meaning: "to wander" }
      "むかし": { meaning: "old days" }
      "の": { meaning: "(of)" }
      "こと": { meaning: "matter, thing" }
      "ぞ": { meaning: "(old emphatic word)" }
      "しのばるる": { meaning: "to long for, to call to mind (shinobaruru (shinobaruru) is the old passive)" }
  "ja-4662":
    native: "Beside the old castle at Komoro, white clouds drift and the traveller is sad."
    notes:
      "n1": "The first two lines of the first part of the poem Chikumagawa ryojo no uta (chikumagawa ryojo no uta) by Shimazaki Toson. The page says the first part came out under the title Ryojo (ryojo), Travel Feeling, in the magazine Myojo in April 1900. The word yuushi (yuushi), traveller, is given in the page with its reading written beside it. Naru (naru) is an old form here."
    bases:
      "こもろ": { meaning: "Komoro (a place name)" }
      "なる": { meaning: "(old: which is at)" }
      "こじょう": { meaning: "old castle" }
      "の": { meaning: "(of)" }
      "ほとり": { meaning: "side, edge" }
      "くも": { meaning: "cloud" }
      "しろく": { meaning: "white" }
      "ゆうし": { meaning: "traveller (old)" }
      "かなしむ": { meaning: "to be sad" }
  "ja-4663":
    native: "Because of the reckless nature I got from my parents, I have done nothing but lose out since I was a child."
    notes:
      "n1": "The opening of the novel Botchan (botchan) by Natsume Soseki. The page says it was printed in the magazine Hototogisu (hototogisu) in April 1906, and it quotes these words as the start of the story, which is about a boy who is not liked by his family. The verb shite (shite), doing, is the te form of suru (suru), to do, and its stem changes to shi (shi)."
    bases:
      "おやゆずり": { meaning: "inherited from one's parents" }
      "の": { meaning: "(of)" }
      "むてっぽう": { meaning: "recklessness" }
      "で": { meaning: "(by, and)" }
      "こども": { meaning: "child" }
      "ころ": { meaning: "time, age" }
      "から": { meaning: "since" }
      "そん": { meaning: "loss, a bad bargain" }
      "ばかり": { meaning: "only, nothing but" }
      "して": { meaning: "to do" }
      "いる": { meaning: "to be (doing)" }
  "ja-4664":
    native: "On every pine needle white dew gathers; it settles, it spills, and spilling, it settles again."
    notes:
      "n1": "A tanka by Masaoka Shiki about dew on pine needles, listed on the Wikipedia page among his famous tanka. The page gives no year for it. The poem repeats the actions of the dew, okite (okite) and koborete (koborete), in turn, so the dew keeps settling and spilling."
    bases:
      "まつのは": { meaning: "pine needle" }
      "の": { meaning: "(of)" }
      "はごと": { meaning: "each leaf, every leaf" }
      "に": { meaning: "(on)" }
      "むすぶ": { meaning: "to form, to gather" }
      "しらつゆ": { meaning: "white dew" }
      "おきて": { meaning: "to settle (of dew)" }
      "は": { meaning: "(marks contrast)" }
      "こぼれ": { meaning: "to spill" }
      "こぼれて": { meaning: "to spill (te form)" }
      "おく": { meaning: "to settle (of dew)" }
  "ja-4665":
    native: "For fun I carried my mother on my back, and she was so light that I wept and could not walk three steps."
    notes:
      "n1": "A tanka by Ishikawa Takuboku from Ichiaku no Suna (ichiaku no suna), his first tanka collection, published in 1910. The page lists it among the poems of the collection. The old forms karoki (karoki) and nakite (nakite) mean light and weeping; ayumazu (ayumazu) means did not walk."
    bases:
      "たわむれに": { meaning: "play, joking" }
      "はは": { meaning: "mother" }
      "を": { meaning: "(marks the object)" }
      "せおいて": { meaning: "to carry on one's back" }
      "その": { meaning: "that" }
      "あまり": { meaning: "the excess; so very much" }
      "かろきに": { meaning: "light in weight (old form)" }
      "なきて": { meaning: "to weep (old form)" }
      "さんぽ": { meaning: "three steps" }
      "あゆまず": { meaning: "to walk (ayumazu (ayumazu): did not walk)" }
  "ja-4666":
    native: "A brave man's letter of long farewell, written by the light of the water at the bottom of the sea."
    notes:
      "n1": "A tanka by Yosano Akiko. The page says that in 1910 she wrote about ten poems when the Submarine No. 6 sank, and gives this one. The old forms shitatameshi (shitatameshi) and nagaki (nagaki) mean written out and long."
    bases:
      "かいてい": { meaning: "sea bottom" }
      "の": { meaning: "(of)" }
      "みず": { meaning: "water" }
      "あかり": { meaning: "light" }
      "に": { meaning: "(by)" }
      "したためし": { meaning: "to write out (shitatameshi (shitatameshi): the old past form)" }
      "ながき": { meaning: "long (old form)" }
      "わかれ": { meaning: "parting" }
      "ますらお": { meaning: "a brave man" }
      "ふみ": { meaning: "letter" }
  "ja-4667":
    native: "The red rose shoots have grown two shaku long, their thorns are soft, and the spring rain falls."
    notes:
      "n1": "A tanka by Masaoka Shiki, one of three tanka on roses, pines and irises that the Wikipedia page lists among his famous tanka. The page gives no year for it. The old form nobitaru (nobitaru) means have grown. A shaku (shaku) is an old unit of length of about 30 centimetres."
    bases:
      "くれない": { meaning: "deep red" }
      "の": { meaning: "(of)" }
      "にしゃく": { meaning: "two shaku (an old measure of length)" }
      "のびたる": { meaning: "to grow long (nobitaru (nobitaru) is the old form)" }
      "ばら": { meaning: "rose" }
      "め": { meaning: "shoot, bud" }
      "はり": { meaning: "thorn" }
      "やわらかに": { meaning: "soft, gentle" }
      "はるさめ": { meaning: "spring rain" }
      "ふる": { meaning: "to fall (of rain)" }
  "ja-4668":
    native: "Even when I cough, I am alone."
    notes:
      "n1": "A free-verse haiku by Ozaki Hosai (ozaki housai), written in his last years on Shodoshima; the Wikipedia page lists it among his representative haiku. It does not keep the five-seven-five pattern. The word shite (shite) is the te form of suru (to do), so the line says even if (I) cough."
    bases:
      "せき": { meaning: "cough" }
      "を": { meaning: "(marks the object)" }
      "して": { meaning: "doing (te form of to do)" }
      "も": { meaning: "even, also" }
      "ひとり": { meaning: "one person, alone" }
