kind: "layer"
core: "ja-culture-3"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: poems and the opening of a novel"
description: "Four short items from Japanese poetry and prose, from the Meiji and Taisho periods, in the public domain. Each shows who wrote it, when, and where it comes from. The texts are in modern kana. The English is the builder's own plain rendering. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ja-4650":
    native: "Bell, bird, and I: everything is different, and everything is good."
    notes:
      "n1": "The last verse of the poem Watashi to kotori to suzu to (watashi to kotori to suzu to) by Kaneko Misuzu. The verse says that each of the three is different and each is good, without ranking them."
    bases:
      "すず": { meaning: "bell" }
      "と": { meaning: "(and, with)" }
      "ことり": { meaning: "small bird" }
      "それから": { meaning: "and then, after that" }
      "わたし": { meaning: "I, me" }
      "みんな": { meaning: "everyone, all" }
      "ちがって": { meaning: "being different (te form of to be different)" }
      "いい": { meaning: "good" }
  "ja-4651":
    native: "How sad the sand without life is: when I grasp it, it runs out between my fingers."
    notes:
      "n1": "A tanka by Ishikawa Takuboku from Ichiaku no Suna (ichiaku no suna), his first tanka collection, published in 1910. The last word of the poem is otsu (to fall, old form)."
    bases:
      "いのちなき": { meaning: "lifeless" }
      "すな": { meaning: "sand" }
      "の": { meaning: "(of)" }
      "かなしさ": { meaning: "sadness" }
      "よ": { meaning: "(an exclamation)" }
      "さらさら": { meaning: "(sound or flow of sand)" }
      "と": { meaning: "(in the manner of)" }
      "にぎれば": { meaning: "when (one) grasps" }
      "ゆび": { meaning: "finger" }
      "あいだ": { meaning: "gap, between" }
      "より": { meaning: "from, out of" }
      "おつ": { meaning: "to fall (old)" }
  "ja-4652":
    native: "I work, I work, and still my life does not become easy; I only look at my hands."
    notes:
      "n1": "A tanka by Ishikawa Takuboku from the same collection. The line narazari (did not become) is an old form, kept as written. The poem ends with the single word miru (to look), with nothing added."
    bases:
      "はたらけど": { meaning: "though (one) works" }
      "なお": { meaning: "still, yet" }
      "わが": { meaning: "my (old)" }
      "くらし": { meaning: "livelihood, way of life" }
      "らくに": { meaning: "with ease, comfortably" }
      "ならざり": { meaning: "did not become (old)" }
      "じっと": { meaning: "steadily, fixedly" }
      "て": { meaning: "hand" }
      "を": { meaning: "(marks the object)" }
      "みる": { meaning: "to look" }
  "ja-4653":
    native: "I had a dream like this: I sat with my arms folded beside the pillow, and a woman who lay on her back"
    notes:
      "n1": "The opening of the first night of Natsume Soseki's Yume Juya (yume juuya), Ten Nights of Dreams, serialised in 1908. The line konna yume o mita (I had a dream like this) starts the first, second, third and fifth nights."
    bases:
      "こんな": { meaning: "such, like this" }
      "ゆめ": { meaning: "dream" }
      "を": { meaning: "(marks the object)" }
      "みた": { meaning: "saw (a dream)" }
      "うでぐみ": { meaning: "arms folded" }
      "して": { meaning: "having done" }
      "まくら": { meaning: "pillow" }
      "もと": { meaning: "side, beside" }
      "に": { meaning: "(at, in)" }
      "すわって": { meaning: "sitting (te form of to sit)" }
      "いると": { meaning: "while (one) is (in a state)" }
      "あおむけ": { meaning: "face up, on the back" }
      "ねた": { meaning: "lay down (past)" }
      "おんな": { meaning: "woman" }
      "が": { meaning: "(marks the subject)" }
