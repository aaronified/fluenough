native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 1: the days of the week"
description: "The first kanji: the seven that name the days of the week, each taught by the kana reading of the word it stands for. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-1253":
    native: "sun; day"
    notes:
      "n1": "日 (hi): on readings ニチ (nichi) and ジツ (jitsu); kun readings ひ (hi) and か (ka). It is in 日曜日 (nichiyoubi), Sunday."
  "ja-1254":
    native: "moon; month"
    notes:
      "n1": "月 (tsuki): on readings ゲツ (getsu) and ガツ (gatsu); kun reading つき (tsuki). It is in 月曜日 (getsuyoubi), Monday."
  "ja-1255":
    native: "fire"
    notes:
      "n1": "火 (hi): on reading カ (ka); kun reading ひ (hi). It is in 火曜日 (kayoubi), Tuesday."
  "ja-1256":
    native: "water"
    notes:
      "n1": "水 (mizu): on reading スイ (sui); kun reading みず (mizu). It is in 水曜日 (suiyoubi), Wednesday."
  "ja-1257":
    native: "tree; wood"
    notes:
      "n1": "木 (ki): on reading モク (moku); kun reading き (ki). It is in 木曜日 (mokuyoubi), Thursday."
  "ja-1258":
    native: "gold; money"
    notes:
      "n1": "金 (kane): on reading キン (kin); kun reading かね (kane). It is in 金曜日 (kinyoubi), Friday."
  "ja-1259":
    native: "earth; soil"
    notes:
      "n1": "土 (tsuchi): on readings ド (do) and ト (to); kun reading つち (tsuchi). It is in 土曜日 (doyoubi), Saturday."
