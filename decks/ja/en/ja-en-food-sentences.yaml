schema: 1
id: "ja-en-food-sentences"
kind: "layer"
core: "ja-food-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Food and drink in sentences"
description: "Sentences about meals and dishes, to put in order, each with the words it could be mistaken for. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "ja-1301":
    native: "I eat rice porridge for breakfast."
    notes:
      "n1": "おかゆ (okayu) is rice cooked soft in plenty of water; ごはん (gohan) also means a meal, not only cooked rice."
    bases:
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "ひるごはん (hirugohan) is lunch." }
      w2: { why: "おべんとう (obentou) is a boxed lunch." }
  "ja-1302":
    native: "Sushi is delicious."
    notes:
      "n1": "The お (o) in おすし (osushi) is a polite prefix; the plain word is すし (sushi)."
    bases:
      "は": { meaning: "(marks the topic)" }
      "です": { meaning: "is (polite)" }
    confusables:
      w1: { why: "てんぷら (tenpura) is tempura." }
      w2: { why: "やきとり (yakitori) is grilled chicken." }
  "ja-1303":
    native: "The miso soup is salty."
    notes:
      "n1": "しょっぱい (shoppai) is salty; からい (karai) is spicy hot, so the two words are not interchangeable."
    bases:
      "は": { meaning: "(marks the topic)" }
      "です": { meaning: "is (polite)" }
    confusables:
      w1: { why: "すっぱい (suppai) is sour." }
      w2: { why: "にがい (nigai) is bitter." }
  "ja-1304":
    native: "A second coffee, please."
    notes:
      "n1": "おかわり (okawari) is a second helping or a refill, not a new order; ください (kudasai) asks for it."
    bases:
      "の": { meaning: "(links two nouns: of, 's)" }
      "を": { meaning: "(marks the thing acted on)" }
      "ください": { meaning: "please (give me)" }
    confusables:
      w1: { why: "ジュース (juusu) is juice." }
      w2: { why: "おちゃ (ocha) is tea." }
  "ja-4139":
    native: "I eat rice porridge."
    bases:
      "を":
        meaning: "(marks the thing acted on)"
      "たべます":
        meaning: "to eat"
    confusables:
      w1:
        why: "すし (sushi) is sushi, not part of this sentence."
      w2:
        why: "ごはん (gohan) is rice; a meal, not part of this sentence."
  "ja-4140":
    native: "Rice porridge is delicious."
    bases:
      "は":
        meaning: "(marks the topic)"
      "おいしい":
        meaning: "delicious; tasty"
      "です":
        meaning: "is (polite)"
    confusables:
      w1:
        why: "すし (sushi) is sushi, not part of this sentence."
      w2:
        why: "うどん (udon) is udon noodles, not part of this sentence."
  "ja-4141":
    native: "I eat sushi."
    bases:
      "を":
        meaning: "(marks the thing acted on)"
      "たべます":
        meaning: "to eat"
    confusables:
      w1:
        why: "おかゆ (okayu) is rice porridge, not part of this sentence."
      w2:
        why: "うどん (udon) is udon noodles, not part of this sentence."
  "ja-4142":
    native: "The udon is delicious."
    bases:
      "は":
        meaning: "(marks the topic)"
      "おいしい":
