    "title": "A walk by the lake"
    "sentences":
      - "text": "きょう、みずうみのまわりをあるきました。"
        "reading": "kyou, mizuumi no mawari o arukimashita."
      - "text": "ごみが すくなくて、きれいでした。"
        "reading": "gomi ga sukunakute, kirei deshita."
      - "text": "でも、おせんが すこし ふえたと いいます。"
        "reading": "demo, osen ga sukoshi futeta to iimasu."
      - "text": "わたしたちは、たいようこうはつでんを ふやしたいです。"
        "reading": "watashitachi wa, taiyoukouhatsuden o fuyashitai desu."
