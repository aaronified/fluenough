"name": "Verbs 5: what happened next"
"description": "Fifty verbs for telling what happened next: getting over, taking off and coming apart, spreading, filling and burying, setting up, copying, cutting and the actions of a story. Not yet checked by a Japanese speaker: please report any mistake."
