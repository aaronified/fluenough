      "わたしはかべをのりこえました。":
        "native": "I got over the wall."
        "bases":
          "わたし":
            "meaning": "I"
          "は":
            "meaning": "(marks the topic)"
          "かべ":
            "meaning": "wall"
          "を":
            "meaning": "(marks the thing acted on)"
          "のりこえました":
            "meaning": "to overcome (polite, past)"
      "わたしはしごとのもんだいをのりこえます。":
        "native": "I overcome problems at work."
        "bases":
          "わたし":
            "meaning": "I"
          "は":
            "meaning": "(marks the topic)"
          "しごと":
            "meaning": "work"
