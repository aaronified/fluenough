"cards":
  "ja-8800":
    "notes":
      "n1": "ひかって います (hikatte imasu) is the ongoing form of ひかる (hikaru), to shine, so it means is shining."
    "native": "The sky is shining in the evening."
    "bases":
      "ゆうがた":
        "meaning": "evening"
      "そら":
        "meaning": "sky"
      "が":
        "meaning": "(marks the subject)"
      "ひかって":
        "meaning": "to shine (te form)"
      "います":
        "meaning": "(marks an ongoing state; polite)"
    "confusables":
      "w1":
        "why": "to be visible; a different verb"
      "w2":
        "why": "to disappear; the opposite"
  "ja-8801":
    "notes":
      "n1": "ふせぎました (fusegimashita) is the polite past of ふせぐ (fusegu), to prevent, so the rain is kept off."
    "native": "I kept off the rain with an umbrella."
    "bases":
      "かさ":
        "meaning": "umbrella"
      "で":
        "meaning": "(at a place; by means of)"
      "あめ":
        "meaning": "rain"
      "を":
        "meaning": "(marks the thing acted on)"
      "ふせぎました":
        "meaning": "to prevent (polite, past)"
    "confusables":
      "w1":
        "why": "to hold up an umbrella; a different action"
      "w2":
        "why": "to get wet; what happens without it"
  "ja-8802":
    "notes":
      "n1": "もたれて います (motarete imasu) is もたれる (motareru), to lean, in the ongoing form, so the leaning is still going on."
    "native": "I am leaning back on the chair."
    "bases":
      "わたし":
        "meaning": "I"
      "は":
        "meaning": "(marks the topic)"
      "いす":
        "meaning": "chair"
      "に":
        "meaning": "(marks the place or the target)"
      "もたれて":
        "meaning": "to lean (te form)"
      "います":
        "meaning": "(marks an ongoing state; polite)"
    "confusables":
      "w1":
        "why": "to sit down; a different posture"
      "w2":
        "why": "to stand up; the opposite posture"
  "ja-8803":
    "notes":
      "n1": "さがしました (sagashimashita) is the polite past of さがす (sagasu), to search for, so the search is over."
    "native": "I looked for the station on the map."
    "bases":
      "ちず":
        "meaning": "map"
      "で":
        "meaning": "(at a place; by means of)"
      "えき":
        "meaning": "station"
      "を":
        "meaning": "(marks the thing acted on)"
      "さがしました":
        "meaning": "to search for (polite, past)"
    "confusables":
      "w1":
        "why": "to open; a different action"
      "w2":
        "why": "to fold up; the opposite of spreading"
  "ja-8804":
    "notes":
      "n1": "やぶって しまいました (yabutte shimaimashita) adds しまう (shimau) to the te form, so it means the promise was broken with regret."
    "native": "I broke the promise, unfortunately."
    "bases":
      "やくそく":
        "meaning": "promise"
      "を":
        "meaning": "(marks the thing acted on)"
      "やぶって":
        "meaning": "to break (te form)"
      "しまいました":
        "meaning": "to finish; to do completely (polite, past)"
    "confusables":
      "w1":
        "why": "to keep; the opposite of breaking"
      "w2":
        "why": "to talk; a different verb"
  "ja-8805":
    "notes":
      "n1": "もうけました (moukemashita) is the polite past of もうける (moukeru), to set up, used for a room or a rule."
    "native": "They set up a new room."
    "bases":
      "あたらしい":
        "meaning": "new"
      "へや":
        "meaning": "room"
      "を":
        "meaning": "(marks the thing acted on)"
      "もうけました":
        "meaning": "to set up (polite, past)"
    "confusables":
      "w1":
        "why": "to make; a general word for creating"
      "w2":
        "why": "to build; to stand up"
  "ja-8806":
    "notes":
      "n1": "まとまって (matomatte) is まとまる (matomaru), to come together by itself, and よかった (yokatta) is the past of いい (ii), good."
    "native": "I am glad the talks came together."
    "bases":
      "はなし":
        "meaning": "story; talk"
      "が":
        "meaning": "(marks the subject)"
      "まとまって":
        "meaning": "to come together (te form)"
      "よかった":
        "meaning": "was good (past)"
    "confusables":
      "w1":
        "why": "to sum up; the other side of the same verb pair"
      "w2":
        "why": "to talk; a different verb"
  "ja-8807":
    "notes":
      "n1": "さがして います (sagashite imasu) is the ongoing form of さがす (sagasu), to search for, so the search is going on now."
    "native": "I am searching for the key in the dark room."
    "bases":
      "くらい":
        "meaning": "dark"
      "へや":
        "meaning": "room"
      "で":
        "meaning": "(at a place; by means of)"
      "かぎ":
        "meaning": "key"
      "を":
        "meaning": "(marks the thing acted on)"
      "さがして":
        "meaning": "to search for (te form)"
      "います":
        "meaning": "(marks an ongoing state; polite)"
    "confusables":
      "w1":
        "why": "to feel for in the dark; a card of this unit"
      "w2":
        "why": "to find; the result of searching"
