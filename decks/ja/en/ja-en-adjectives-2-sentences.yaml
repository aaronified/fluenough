"cards":
  "ja-2542":
    "native": "I am glad to meet my friend."
    "notes":
      "n1": "あう (au, to meet) takes に (ni) for the person met, so ともだちに (tomodachi ni) is the friend met."
    "bases":
      "あえて":
        "meaning": "met (te-form)"
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "sad, not glad"
      "w2":
        "why": "scary, not glad"
  "ja-2543":
    "native": "Winter nights are lonely."
    "bases":
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "morning, not night"
      "w2":
        "why": "spring, not winter"
  "ja-2544":
    "native": "The film was very scary."
    "notes":
      "n1": "An い (i) adjective becomes かった (katta) in the past: こわい (kowai) becomes こわかった (kowakatta)."
    "bases":
      "こわかった":
        "meaning": "was scary (past)"
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "fun, not scary"
      "w2":
        "why": "sad, not scary"
  "ja-2545":
    "native": "I made a mistake and was embarrassed."
    "notes":
      "n1": "まちがえて (machigaete) is the te-form of まちがえる (machigaeru, to make a mistake), and the te-form links the two clauses."
    "bases":
      "まちがえて":
        "meaning": "made a mistake (te-form)"
      "はずかしかった":
        "meaning": "was embarrassing (past)"
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "glad, not embarrassed"
      "w2":
        "why": "fun, not embarrassed"
  "ja-2546":
    "native": "I failed the exam and was frustrated."
    "notes":
      "n1": "おちる (ochiru, to fail) takes に (ni) for the exam, as in しけんにおちる (shiken ni ochiru)."
    "bases":
      "おちて":
        "meaning": "failed (te-form)"
      "くやしかった":
        "meaning": "was frustrating (past)"
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "grateful, not frustrated"
      "w2":
        "why": "scary, not frustrated"
  "ja-2547":
    "native": "You helped me, and I was grateful."
    "notes":
      "n1": "くれる (kureru) here means someone did something for the speaker, as in てつだってくれる (tetsudatte kureru, to help me)."
    "bases":
      "てつだって":
        "meaning": "helped (te-form)"
      "くれて":
        "meaning": "gave (te-form)"
      "ありがたかった":
        "meaning": "was grateful (past)"
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "enviable, not grateful"
      "w2":
        "why": "deep, not grateful"
  "ja-2548":
    "native": "This town is lively."
    "bases":
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "quiet, not lively"
      "w2":
        "why": "shallow, not lively"
  "ja-2549":
    "native": "This is a famous town."
    "notes":
      "n1": "ゆうめい (yuumei, famous) is a な (na) adjective, so it takes な (na) before a noun: ゆうめいなまち (yuumei na machi)."
    "bases":
      "ゆうめいな":
        "meaning": "famous (before a noun)"
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "convenient, not famous"
      "w2":
        "why": "dirty, not famous"
  "ja-2550":
    "native": "The teacher is strict."
    "bases":
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "kind, not strict"
      "w2":
        "why": "quiet, not strict"
  "ja-2551":
    "native": "I bought the things I needed."
    "notes":
      "n1": "ひつよう (hitsuyou, necessary) is a な (na) adjective, so it takes な (na) before もの (mono, things)."
    "bases":
      "ひつような":
        "meaning": "necessary (before a noun)"
      "かいました":
        "meaning": "bought (polite)"
    "confusables":
      "w1":
        "why": "wasteful, not necessary"
      "w2":
        "why": "luxurious, not necessary"
  "ja-2552":
    "native": "Family is precious."
    "notes":
      "n1": "たいせつ (taisetsu, precious) is a な (na) adjective: as a predicate it needs です (desu) and no な (na)."
    "bases":
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "many, not precious"
      "w2":
        "why": "near, not precious"
  "ja-2553":
    "native": "The vegetables were fresh."
    "notes":
      "n1": "しんせん (shinsen, fresh) is a な (na) adjective, so its past is しんせんでした (shinsen deshita)."
    "bases":
      "でした":
        "meaning": "was (polite)"
    "confusables":
      "w1":
        "why": "smelly, not fresh"
      "w2":
        "why": "hard, not fresh"
  "ja-2554":
    "native": "The room is clean."
    "bases":
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "dirty, not clean"
      "w2":
        "why": "bright, not clean"
  "ja-2555":
    "native": "He is honest."
    "notes":
      "n1": "しょうじき (shoujiki, honest) is also an adverb: しょうじきにいう (shoujiki ni iu, to speak honestly)."
    "bases":
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "stingy, not honest"
      "w2":
        "why": "kind, not honest"
