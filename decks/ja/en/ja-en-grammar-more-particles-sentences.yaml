tags: ["beginner", "unreviewed"]
cards:
  "ja-0637":
    native: "My father is a teacher too."
    bases:
      "の":
        meaning: "(links two nouns: of, 's)"
      "も":
        meaning: "(also; too)"
      "です":
        meaning: "is (polite)"
    confusables:
      w1:
        why: "はは (haha) is my mother, not my father."
      w2:
        why: "おとこ (otoko) is a man."
  "ja-0638":
    native: "My mother and father are in Japan."
    bases:
      "と":
        meaning: "and (joins two words)"
      "は":
        meaning: "(marks the topic)"
      "に":
        meaning: "in; at; to"
      "います":
        meaning: "to be (of people and animals); to exist"
    confusables:
      w1:
        why: "ともだち (tomodachi) is a friend, not a parent."
      w2:
        why: "おじ (oji) is an uncle."
  "ja-0639":
    native: "I go from school to Tokyo."
    bases:
      "から":
        meaning: "from"
      "まで":
        meaning: "as far as; until"
    confusables:
      w1:
        why: "うえ (ue) means above, not from."
      w2:
        why: "となり (tonari) means next to."
  "ja-0640":
    native: "I go to my country."
    bases:
      "の":
        meaning: "(links two nouns: of, 's)"
      "へ":
        meaning: "to (a direction)"
    confusables:
      w1:
        why: "がっこう (gakkou) is a school, not a country."
      w2:
        why: "とうきょう (toukyou) is a city."
  "ja-0641":
    native: "I learn Japanese and English."
    bases:
      "と":
        meaning: "and (joins two words)"
      "を":
        meaning: "(marks the thing acted on)"
    confusables:
      w1:
        why: "ともだち (tomodachi) is a friend, not a language."
      w2:
        why: "ちゅうごくご (chuugokugo) is Chinese."
  "ja-0642":
    native: "I also go to school tomorrow."
    bases:
      "も":
        meaning: "(also; too)"
      "に":
        meaning: "in; at; to"
    confusables:
      w1:
        why: "きのう (kinou) is yesterday, not tomorrow."
      w2:
        why: "まいにち (mainichi) is every day."
