"cards":
  "ja-3270":
    "native": "We begin the deal."
    "notes":
      "n1": "はじめる (hajimeru, to begin) takes を (o) for the thing begun, as in とりひきをはじめる (torihiki o hajimeru)."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "はじめます":
        "meaning": "to begin (polite)"
    "confusables":
      "w1":
        "why": "negotiation, not deal"
      "w2":
        "why": "estimate, not deal"
  "ja-3271":
    "native": "The price is high."
    "notes":
      "n1": "たかい (takai) means high or expensive: かかくがたかい (kakaku ga takai) is the price is high."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "たかい":
        "meaning": "high"
      "です":
        "meaning": "to be (polite)"
    "confusables":
      "w1":
        "why": "cost price, not price"
      "w2":
        "why": "profit, not price"
  "ja-3272":
    "native": "The profit is large."
    "bases":
      "が":
        "meaning": "(marks the subject)"
      "おおい":
        "meaning": "large; many"
      "です":
        "meaning": "to be (polite)"
    "confusables":
      "w1":
        "why": "revenue, not profit"
      "w2":
        "why": "sales, not profit"
  "ja-3273":
    "native": "I make a budget."
    "notes":
      "n1": "たてる (tateru) is used for plans and budgets, as in よさんをたてる (yosan o tateru, to make a budget)."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "たてます":
        "meaning": "to make (polite)"
    "confusables":
      "w1":
        "why": "accounts settlement, not budget"
      "w2":
        "why": "expenses, not budget"
  "ja-3274":
    "native": "The head office is in Tokyo."
    "notes":
      "n1": "ほんしゃ (honsha) is the head office; 支社 (shisha) is a branch office, and 支店 (shiten) is a branch shop."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "とうきょう":
        "meaning": "Tokyo"
      "に":
        "meaning": "(marks the time, the place or the target)"
      "あります":
        "meaning": "to be (polite)"
    "confusables":
      "w1":
        "why": "branch office, not head office"
      "w2":
        "why": "store branch, not head office"
  "ja-3275":
    "native": "I sell it in the market."
    "bases":
      "で":
        "meaning": "(at a place; by means of)"
      "うります":
        "meaning": "to sell (polite)"
    "confusables":
      "w1":
        "why": "customer, not market"
      "w2":
        "why": "export, not market"
  "ja-3276":
    "native": "I hand over my business card."
    "notes":
      "n1": "めいしこうかん (meishi koukan, the exchange of business cards) is the swap of cards at a first meeting."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "わたします":
        "meaning": "to hand over (polite)"
    "confusables":
      "w1":
        "why": "estimate, not business card"
      "w2":
        "why": "exchange of cards, not business card"
  "ja-3277":
    "native": "Imports are expensive."
    "notes":
      "n1": "ゆにゅう (yunyuu, import) is the opposite of ゆしゅつ (yushutsu, export)."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "たかい":
        "meaning": "expensive"
      "です":
        "meaning": "to be (polite)"
    "confusables":
      "w1":
        "why": "export, not import"
      "w2":
        "why": "trade, not import"
