tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "mashita": "did {meaning}"
    "masen-deshita": "did not {meaning}"
rules:
  "ja-rule-mashita":
    name: "ました (mashita): did, polite past"
    explanation: "{1} ends a verb to make the polite past: {2} means I ate."
  "ja-rule-masen-deshita":
    name: "ませんでした (masen deshita): did not, polite past negative"
    explanation: "{1} ends a verb to make the polite past negative: {2} means I did not eat."
