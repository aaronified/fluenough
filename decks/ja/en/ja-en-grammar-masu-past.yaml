name: "Polite past: ました (mashita) and ませんでした (masen deshita)"
description: "The polite past of a verb ends in ました (mashita), I ate, and its negative past in ませんでした (masen deshita), I did not eat. Every verb a course deck teaches has a row. Not yet checked by a Japanese speaker: please report any mistake."
