schema: 1
id: "ja-en-kanji-14"
kind: "layer"
core: "ja-kanji-14"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 14: grade 3, part 5"
description: "Twenty-five kanji of the third school grade, each taught by the kana reading of the word it stands for. Some have one example or none yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-5720":
    native: "second of time"
    notes:
      "n1": "秒 (byou): on reading ビョウ (byou) only. It is in 秒速 (byousoku), speed in metres per second."
    examples:
      "あと一秒です。": "One second left."
  "ja-5721":
    native: "grade; rank of a class or level"
    notes:
      "n1": "級 (kyuu): on reading キュウ (kyuu) only. Its kana きゅう (kyuu) is also the taught card きゅう (kyuu), nine, which is a different word. It is in 上級 (joukyuu), a higher grade."
  "ja-5722":
    native: "beautiful"
    notes:
      "n1": "美 (utsukushii): on reading ビ (bi); kun reading うつくしい (utsukushii). It is in 美人 (bijin), a beautiful woman."
    examples:
      "美しいです。": "It is beautiful."
  "ja-5723":
    native: "to lose; to be defeated"
    notes:
      "n1": "負 (makeru): on reading フ (fu); kun readings まける (makeru), まかす (makasu) and おう (ou). Its kana まける (makeru) is also the taught card まける (makeru), to give a discount, which is a different sense. It is in 負ける (makeru), to lose, the card's own word."
    examples:
      "ともだちに負けます。": "I lose to my friend."
  "ja-5724":
    native: "to chase; to follow"
    notes:
      "n1": "追 (ou): on reading ツイ (tsui); kun reading おう (ou). It is in おいこす (oikosu), to overtake."
    examples:
      "犬がねこを追います。": "The dog chases the cat."
  "ja-5725":
    native: "to send"
    notes:
      "n1": "送 (okuru): on reading ソウ (sou); kun reading おくる (okuru). It is in 見送る (miokuru), to see someone off."
    examples:
      "ともだちに手紙を送ります。": "I send a letter to my friend."
  "ja-5726":
    native: "heavy"
    notes:
      "n1": "重 (omoi): on readings ジュウ (juu) and チョウ (chou); kun readings え (e), おもい (omoi), かさねる (kasaneru) and かさなる (kasanaru). It is in 体重 (taijuu), body weight."
    examples:
      "この本は重いです。": "This book is heavy."
  "ja-5727":
    native: "face; surface"
    notes:
      "n1": "面 (omote): on reading メン (men); kun readings おも (omo), おもて (omote) and つら (tsura). It is in 面白い (omoshiroi), interesting."
    examples:
      "この本は面白いです。": "This book is interesting."
      "ともだちは面白いです。": "My friend is interesting."
  "ja-5728":
    native: "twice; double"
    notes:
      "n1": "倍 (bai): on reading バイ (bai) only. It is in 二倍 (nibai), twice as much."
    examples:
      "二倍大きいです。": "It is twice as big."
  "ja-5729":
    native: "study"
    notes:
      "n1": "勉 (benkyou): on reading ベン (ben) only. It is in 勉強 (benkyou), study, which is this card's own word."
    examples:
      "日本語を勉強します。": "I study Japanese."
  "ja-5730":
    native: "everyone; all the members"
    notes:
      "n1": "員 (zenin): on reading イン (in) only. It is in 店員 (tenin), a shop assistant."
    examples:
      "全員行きます。": "Everyone will go."
  "ja-5731":
    native: "shrine"
    notes:
      "n1": "宮 (miya): on readings キュウ (kyuu) and グウ (guu), with a rare on reading (ク) (ku) in parentheses; kun reading みや (miya). It is in 王宮 (ougu), a royal palace."
    examples:
      "宮は山の中です。": "The shrine is in the mountains."
  "ja-5732":
    native: "island"
    notes:
      "n1": "島 (shima): on reading トウ (tou); kun reading しま (shima). It is in 半島 (hantou), a peninsula."
    examples:
      "島は小さいです。": "The island is small."
  "ja-5733":
    native: "safe; strongbox"
    notes:
      "n1": "庫 (kinko): on reading コ (ko), with a rare on reading (ク) (ku) in parentheses; no kun reading. It is in 車庫 (shako), a garage."
    examples:
      "金庫は小さいです。": "The safe is small."
  "ja-5734":
    native: "garden"
    notes:
      "n1": "庭 (niwa): on reading テイ (tei); kun reading にわ (niwa). It is in 家庭 (katei), a home or household."
    examples:
      "庭は広いです。": "The garden is wide."
  "ja-5735":
    native: "breath"
    notes:
      "n1": "息 (iki): on reading ソク (soku); kun reading いき (iki). It is in 休息 (kyuusoku), a rest."
    examples:
      "息をします。": "I breathe."
  "ja-5736":
    native: "trip; journey"
    notes:
      "n1": "旅 (tabi): on reading リョ (ryo); kun reading たび (tabi). It is in 旅行 (ryokou), a trip, which is also a taught card."
    examples:
      "旅行は楽しいです。": "The trip is fun."
      "旅行に行きます。": "I go on a trip."
  "ja-5737":
    native: "root"
    notes:
      "n1": "根 (ne): on reading コン (kon); kun reading ね (ne). It is in 大根 (daikon), a radish."
    examples:
      "根は長いです。": "The root is long."
  "ja-5738":
    native: "to flow"
    notes:
      "n1": "流 (nagareru): on reading リュウ (ryuu), with a rare on reading (ル) (ru) in parentheses; kun readings ながれる (nagareru) and ながす (nagasu). It is in 交流 (kouryuu), an exchange."
    examples:
      "川の水が流れます。": "The river water flows."
  "ja-5739":
    native: "to go out; to disappear"
    notes:
      "n1": "消 (kieru): on reading ショウ (shou); kun readings きえる (kieru) and けす (kesu). It is in 消火 (shouka), putting out a fire."
    examples:
      "電気が消えます。": "The light goes out."
  "ja-5740":
    native: "illness; sickness"
    notes:
      "n1": "病 (yamai): on readings ビョウ (byou), with a rare on reading (ヘイ) (hei) in parentheses; kun readings やむ (yamu) and やまい (yamai). It is in びょういん (byouin), a hospital."
    examples:
      "びょういんは大きいです。": "The hospital is big."
      "ともだちは病気です。": "My friend is sick."
  "ja-5741":
    native: "photograph"
    notes:
      "n1": "真 (shashin): on reading シン (shin); kun reading ま (ma). Its card word is 写真 (shashin), a photograph. It is in 真実 (shinjitsu), truth."
    examples:
      "写真を見ます。": "I look at the photograph."
  "ja-5742":
    native: "load; luggage"
    notes:
      "n1": "荷 (ni): on reading カ (ka); kun reading に (ni). Its kana に (ni) is also the taught card に (ni), two, which is a different word. It is in 荷物 (nimotsu), luggage."
    examples:
      "荷物は小さいです。": "The luggage is small."
      "荷物は重いです。": "The luggage is heavy."
  "ja-5743":
    native: "to get up"
    notes:
      "n1": "起 (okiru): on reading キ (ki); kun readings おきる (okiru), おこる (okoru) and おこす (okosu). It is in 早起き (hayaoki), rising early."
    examples:
      "毎日起きます。": "I get up every day."
  "ja-5744":
    native: "fast; quick"
    notes:
      "n1": "速 (hayai): on reading ソク (soku); kun readings はやい (hayai), はやめる (hayameru), はやまる (hayamaru) and すみやか (sumiyaka). Its kana はやい (hayai) is also the taught card はやい (hayai), early, which is written 早い. It is in 時速 (jisoku), speed per hour."
    examples:
      "電車は速いです。": "The train is fast."
