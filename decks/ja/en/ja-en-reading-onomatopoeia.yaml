  - "id": "ja-onomatopoeia-1"
    "title": "A rainy morning"
    "sentences":
      - "text": "あさ、あめが ざあざあ ふっていました。"
        "reading": "asa, ame ga zaazaa futte imashita."
      - "text": "ぐずぐず しないで、でかけました。"
        "reading": "guzuguzu shinai de, dekakemashita."
      - "text": "まちは、しとしと あめで、しずかでした。"
        "reading": "machi wa, shitoshito ame de, shizuka deshita."
      - "text": "かさが なくて、びしょびしょに なりました。"
        "reading": "kasa ga nakute, bishobisho ni narimashita."
