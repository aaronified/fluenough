  - "id": "ja-onomatopoeia-2"
    "title": "A happy evening"
    "sentences":
      - "text": "ともだちは、にこにこ わらっていました。"
        "reading": "tomodachi wa, nikoniko waratte imashita."
      - "text": "わたしも、げらげら わらいました。"
        "reading": "watashi mo, gera gera waraimashita."
      - "text": "へやは ぴかぴかで、すっきり しています。"
        "reading": "heya wa pikapika de, sukkiri shite imasu."
      - "text": "おなかが ぺこぺこなので、しっかり たべました。"
        "reading": "onaka ga pekopeko na node, shikkari tabemashita."
