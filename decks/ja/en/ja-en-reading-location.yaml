  - id: "ja-location-2"
    title: "A room note"
    sentences:
      - text: "いすはつくえのみぎです。"
        reading: "isu wa tsukue no migi desu."
      - text: "いぬはあそこです。"
        reading: "inu wa asoko desu."
      - text: "ともだちはちかくにいます。"
        reading: "tomodachi hachi ka kuni imasu."
