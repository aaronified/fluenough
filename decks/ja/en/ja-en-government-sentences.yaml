  - "unreviewed"
"cards":
  "ja-3078":
    "native": "I do the procedure at the government office."
    "notes":
      "n1": "やくしょ (yakusho), the local government office, is where residents do procedures such as registration; で (de) marks where the action happens."
    "bases":
      "で":
        "meaning": "(at a place; by means of)"
      "てつづき":
        "meaning": "procedure"
      "を":
        "meaning": "(marks the thing acted on)"
      "します":
        "meaning": "to do (polite)"
    "confusables":
      "w1":
        "why": "city hall, not government office"
      "w2":
        "why": "ward office, not government office"
  "ja-3079":
    "native": "The consumption tax goes up."
    "notes":
      "n1": "あがります (agarimasu) is to rise or go up, used of prices and taxes; のぼる (noboru) is for climbing."
    "bases":
      "が":
        "meaning": "(marks the subject)"
      "あがります":
        "meaning": "to rise (polite)"
    "confusables":
      "w1":
        "why": "income tax, not consumption tax"
      "w2":
        "why": "tax, not consumption tax"
  "ja-3080":
    "native": "I receive a pension."
    "notes":
      "n1": "もらう (morau), to receive, names the giver with に (ni) or から (kara), which this sentence leaves out."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "もらいます":
        "meaning": "to receive (polite)"
    "confusables":
      "w1":
        "why": "salary, not pension"
      "w2":
        "why": "guarantee, not pension"
  "ja-3081":
    "native": "I get a licence."
    "notes":
      "n1": "とる (toru) with 免許 (menkyo), licence, means to get one; とる (toru) also means to take a photo."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "とります":
        "meaning": "to get (polite)"
    "confusables":
      "w1":
        "why": "permission, not licence"
      "w2":
        "why": "licence card, not licence"
  "ja-3082":
    "native": "We discuss it in the Diet."
    "notes":
      "n1": "国会 (kokkai), the National Diet, is Japan's parliament: 国 (koku), country, and 会 (kai), meeting."
    "bases":
      "で":
        "meaning": "(at a place; by means of)"
      "ぎろん":
        "meaning": "discussion"
      "します":
        "meaning": "to do (polite)"
    "confusables":
      "w1":
        "why": "assembly, not Diet"
      "w2":
        "why": "mayor, not Diet"
  "ja-3083":
    "native": "I have the right to vote."
    "notes":
      "n1": "権 (ken) in 選挙権 (senkyoken) means right, and 選挙 (senkyo), election, is its base."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "もちます":
        "meaning": "to have (polite)"
    "confusables":
      "w1":
        "why": "citizen, not right to vote"
      "w2":
        "why": "nationality, not right to vote"
  "ja-3084":
    "native": "I go to the polling station."
    "notes":
      "n1": "投票所 (touhyoujo), polling station, is 投票 (touhyou), voting, with 所 (jo), place."
    "bases":
      "に":
        "meaning": "(marks the time, the place or the target)"
      "いきます":
        "meaning": "to go (polite)"
    "confusables":
      "w1":
        "why": "government building, not polling station"
      "w2":
        "why": "assembly, not polling station"
  "ja-3085":
    "native": "I want to become a civil servant."
    "notes":
      "n1": "になる (ni naru), to become, takes に (ni) before the new state; なりたい (naritai) is want to become."
    "bases":
      "に":
        "meaning": "(marks the time, the place or the target)"
      "なりたい":
        "meaning": "to become (desire form)"
      "です":
        "meaning": "to be (polite)"
    "confusables":
      "w1":
        "why": "politician, not civil servant"
      "w2":
        "why": "citizen, not civil servant"
