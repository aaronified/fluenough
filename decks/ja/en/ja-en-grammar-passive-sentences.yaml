cards:
  "ja-4547":
    native: "The book is read."
    notes:
      "n1": "よまれます (yomaremasu): the godan verb よむ (yomu) changes む (mu) to ま (ma) and adds れる (reru)."
    bases:
      "が": { meaning: "(marks the one who does the action)" }
    confusables:
      w1: { why: "かく (kaku) means to write." }
      w2: { why: "きく (kiku) means to listen; to hear; to ask." }
  "ja-4548":
    native: "Meals are eaten here."
    bases:
      "で": { meaning: "(at, in, by)" }
      "が": { meaning: "(marks the one who does the action)" }
    confusables:
      w1: { why: "のむ (nomu) means to drink." }
      w2: { why: "つくる (tsukuru) means to make; to create." }
