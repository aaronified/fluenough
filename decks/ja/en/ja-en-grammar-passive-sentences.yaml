schema: 1
id: "ja-en-grammar-passive-sentences"
kind: "layer"
core: "ja-grammar-passive-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The passive, in sentences"
description: "Sentences in the passive, to put in order, each with the words it could be mistaken for. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "ja-4547":
    native: "I was praised by the teacher."
    notes:
      "n1": "ほめられました (homeraremashita) is the past of the passive: an ichidan verb adds られる (rareru) to its stem. The person who does the action is marked with に (ni): せんせいに (sensei ni), by the teacher."
    bases:
      "は": { meaning: "(marks the topic)" }
      "に": { meaning: "(in, at, to)" }
    confusables:
      w1: { why: "みる (miru) means to see; to look at; to watch." }
      w2: { why: "きく (kiku) means to listen; to hear; to ask." }
  "ja-4548":
    native: "I was helped by my friend."
    notes:
      "n1": "たすける (tasukeru) is an ichidan verb: its passive adds られる (rareru) to the stem: たすけられる (tasukerareru)."
    bases:
      "は": { meaning: "(marks the topic)" }
      "に": { meaning: "(in, at, to)" }
    confusables:
      w1: { why: "てつだう (tetsudau) means to help." }
      w2: { why: "あう (au) means to meet." }
  "ja-4549":
    native: "The child was called by his mother."
    notes:
      "n1": "よぶ (yobu) is a godan verb: its passive uses the negative stem よば (yoba) and れる (reru): よばれる (yobareru)."
    bases:
      "は": { meaning: "(marks the topic)" }
      "に": { meaning: "(in, at, to)" }
    confusables:
      w1: { why: "きく (kiku) means to listen; to hear; to ask." }
      w2: { why: "はなす (hanasu) means to speak; to talk." }
  "ja-4550":
    native: "I was laughed at by my friend."
    notes:
      "n1": "With a person as the target, わらう (warau), to laugh, means to laugh at them, so its passive is わらわれる (warawareru), to be laughed at."
    bases:
      "は": { meaning: "(marks the topic)" }
      "に": { meaning: "(in, at, to)" }
    confusables:
      w1: { why: "はなす (hanasu) means to speak; to talk." }
      w2: { why: "あう (au) means to meet." }
  "ja-4551":
    native: "My father is praised by the teacher."
    notes:
      "n1": "The doer of a passive is marked with に (ni): せんせいに (sensei ni), by the teacher. The subject, ちち (chichi), is the one affected."
    bases:
      "は": { meaning: "(marks the topic)" }
      "に": { meaning: "(in, at, to)" }
    confusables:
      w1: { why: "みる (miru) means to see; to look at; to watch." }
      w2: { why: "きく (kiku) means to listen; to hear; to ask." }
  "ja-4552":
    native: "The child is helped by his father."
    bases:
      "は": { meaning: "(marks the topic)" }
      "に": { meaning: "(in, at, to)" }
    confusables:
      w1: { why: "てつだう (tetsudau) means to help." }
      w2: { why: "あう (au) means to meet." }
