      w2: { why: "さんぜん (sanzen) is three thousand." }
  "ja-1262":
    native: "The number is fifty."
    bases:
      "は": { meaning: "(marks the topic)" }
      "です": { meaning: "is (polite)" }
    confusables:
      w1: { why: "すう (suu) is a number in general, not one number." }
      w2: { why: "れい (rei) is zero." }
  "ja-1263":
    native: "A million yen is expensive."
