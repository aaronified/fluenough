      "は": { meaning: "(marks the topic)" }
      "です": { meaning: "is (polite)" }
    confusables:
      w1: { why: "おく (oku) is a hundred million." }
      w2: { why: "じゅうまん (juuman) is a hundred thousand." }
  "ja-4155":
    native: "A hundred yen is cheap."
    bases:
      "は":
        meaning: "(marks the topic)"
      "やすい":
