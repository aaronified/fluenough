    native: "It is 100 yen."
    bases:
      "です": { meaning: "is (polite)" }
    confusables:
      w1: { why: "せん (sen) is a thousand, ten times the size of a hundred." }
      w2: { why: "まん (man) is ten thousand." }
  "ja-1261":
    native: "It is 2,000 yen."
