schema: 1
id: "ja-en-kanji-38"
kind: "layer"
core: "ja-kanji-38"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 38: grade 6, part 7"

description: "Twenty-nine kanji of the sixth school grade, each taught by the kana reading of the word it stands for. Ten have no example yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-7160":
    native: "cabinet"
    notes:
      "n1": "閣 (naikaku): on reading カク (kaku); no kun reading. It is not a word on its own, so its kana ないかく (naikaku), cabinet, is the commonest word it ends, written 内閣 (naikaku). The taught card ないかく (naikaku), cabinet, from ja-government is the same word 内閣 (naikaku). Its example is 内閣は大切です (naikaku wa taisetsu desu), where 内閣 (naikaku) is that taught card, は (wa) is the taught particle, 大切 (taisetsu), important, is the taught card たいせつ (taisetsu), and です (desu) is the taught copula."
    examples:
      "内閣は大切です。": "The cabinet is important."
  "ja-7161":
    native: "obstacle"
    notes:
      "n1": "障 (shougai): on reading ショウ (shou); kun reading さわ-る (sawa-ru), which the card does not use. Its kana しょうがい (shougai), obstacle, is the commonest word it begins, written 障害 (shougai). No taught card has that kana, so no card collides with it. Its example is 社会保障は必要です (shakai hoshou wa hitsuyou desu), where 社会保障 (shakai hoshou), social security, is the taught card しゃかいほしょう (shakai hoshou) from ja-government, は (wa) is the taught particle, 必要 (hitsuyou), necessary, is the taught card ひつよう (hitsuyou) from ja-adjectives-2, and です (desu) is the taught copula."
    examples:
      "社会保障は必要です。": "Social security is necessary."
  "ja-7162":
    native: "theatre"
    notes:
      "n1": "劇 (gekijou): on reading ゲキ (geki); no kun reading. It is not a word on its own, so its kana げきじょう (gekijou), theatre, is the commonest word it begins, written 劇場 (gekijou). The taught card げきじょう (gekijou), theatre, from ja-places is the same word 劇場 (gekijou). Its example is 劇場は大きいです (gekijou wa ookii desu), where 劇場 (gekijou) is that taught card, は (wa) is the taught particle, 大きい (ookii), big, is the taught card おおきい (ookii), and です (desu) is the taught copula."
    examples:
      "劇場は大きいです。": "The theatre is big."
      "喜劇は面白いです。": "Comedies are funny."
  "ja-7163":
    native: "enemy"
    notes:
      "n1": "敵 (teki): on reading テキ (teki); kun reading かたき (kataki), enemy, which the card does not use. Its kana てき (teki), enemy, is the word it stands for alone, written 敵 (teki). The taught card てき (teki), enemy, from ja-relationships is the same word 敵 (teki). Its example is 敵はこわいです (teki wa kowai desu), where 敵 (teki) is that taught card, は (wa) is the taught particle, こわい (kowai), scary, is the taught card, and です (desu) is the taught copula."
    examples:
      "敵はこわいです。": "The enemy is scary."
  "ja-7164":
    native: "right"
    notes:
      "n1": "権 (kenri): on reading ケン (ken); the parenthesised reading ゴン (gon) is a special or very narrow use and is not used for the card. No kun reading. Its kana けんり (kenri), right, is the commonest word it begins, written 権利 (kenri). The taught card けんり (kenri), right, from ja-law is the same word 権利 (kenri). Its example is 権利を使います (kenri o tsukaimasu), where 権利 (kenri) is that taught card, を (o) is the taught particle, and 使います (tsukaimasu) is the masu form of the taught card つかう (tsukau), to use."
    examples:
      "権利を使います。": "I use my rights."
      "選挙権は大切です。": "The right to vote is important."
  "ja-7165":
    native: "tide"
    notes:
      "n1": "潮 (shio): on reading チョウ (chou); kun reading しお (shio). Its kana しお (shio), tide, is the word it stands for in its kun reading, written 潮 (shio). The taught card しお (shio), salt, from ja-market has the same kana but is a different word, written 塩 (shio); the kanji card 塩 (shio) of ja-kanji-23 is that different word too. No taught word card uses 潮 (chou) in its spelling, so it has no example yet."
  "ja-7166":
    native: "to ripen"
    notes:
      "n1": "熟 (jukusu): on reading ジュク (juku); kun reading う-れる (u-reru), which the card does not use. Its kana じゅくす (jukusu), to ripen, is the word it stands for in its on reading, written 熟す (jukusu). No taught card has that kana. It has no example yet, because no taught word card uses 熟 (juku) in its spelling."
  "ja-7167":
    native: "storehouse"
    notes:
      "n1": "蔵 (kura): on reading ゾウ (zou); kun reading くら (kura). Its kana くら (kura), storehouse, is the word it stands for in its kun reading, written 蔵 (kura). The kanji card 倉 (kura) of ja-kanji-21 has the same kana and meaning but is written with a different kanji, so the two are the same kana and meaning written with different kanji, not one written word. Its example is 冷蔵庫は冷たいです (reizouko wa tsumetai desu), where 冷蔵庫 (reizouko), fridge, is the taught card れいぞうこ (reizouko) from ja-home, written with 蔵 (zou), は (wa) is the taught particle, 冷たい (tsumetai), cold, is the taught card つめたい (tsumetai), and です (desu) is the taught copula."
    examples:
      "冷蔵庫は冷たいです。": "The fridge is cold."
      "蔵書は多いです。": "The book collection is large."
  "ja-7168":
    native: "birth"
    notes:
      "n1": "誕 (tanjou): on reading タン (tan); no kun reading. It is not a word on its own, so its kana たんじょう (tanjou), birth, is the commonest word it begins, written 誕生 (tanjou). No taught card has that kana. The taught card たんじょうび (tanjoubi), birthday, from ja-calendar is written 誕生日 (tanjoubi), which contains the same word 誕生 (tanjou), but it is a different card. Its example is 誕生日は今日です (tanjoubi wa kyou desu), where 誕生日 (tanjoubi) is that taught card, は (wa) is the taught particle, 今日 (kyou), today, is the taught card きょう (kyou), and です (desu) is the taught copula."
    examples:
      "誕生日は今日です。": "My birthday is today."
  "ja-7169":
    native: "argument; debate"
    notes:
      "n1": "論 (giron): on reading ロン (ron); no kun reading. It is not a word on its own, so its kana ぎろん (giron), argument; debate, is the commonest word it ends, written 議論 (giron). The taught card ぎろん (giron), argument; debate, from ja-opinions is the same word 議論 (giron). Its examples are 論文は長いです (ronbun wa nagai desu), where 論文 (ronbun), thesis; essay, is the taught card ろんぶん (ronbun) from ja-opinions, は (wa) is the taught particle, 長い (nagai), long, is the taught card ながい (nagai), and です (desu) is the taught copula; and 議論は楽しいです (giron wa tanoshii desu), where 議論 (giron) is that taught card, 楽しい (tanoshii), fun, is the taught card たのしい (tanoshii), and は (wa) and です (desu) are taught."
    examples:
      "論文は長いです。": "The thesis is long."
      "議論は楽しいです。": "The debate is fun."
  "ja-7170":
    native: "various countries"
    notes:
      "n1": "諸 (shokoku): on reading ショ (sho); no kun reading in the table. Its kana しょこく (shokoku), various countries, is the commonest word it begins, written 諸国 (shokoku). No taught card has that kana, so no card collides with it. It has no example yet, because no taught word card uses 諸 (sho) in its spelling."
  "ja-7171":
    native: "heritage"
    notes:
      "n1": "遺 (isan): on reading イ (i); the parenthesised reading ユイ (yui) is a special or very narrow use and is not used for the card. No kun reading. Its kana いさん (isan), heritage, is the commonest word it begins, written 遺産 (isan). No taught card has that kana. It has no example yet, because no taught word card uses 遺 (i) in its spelling."
  "ja-7172":
    native: "excitement"
    notes:
      "n1": "奮 (koufun): on reading フン (fun); kun reading ふる-う (furu-u), which the card does not use. Its kana こうふん (koufun), excitement, is the commonest word it ends, written 興奮 (koufun). No taught card has that kana. It has no example yet, because no taught word card uses 奮 (fun) in its spelling."
  "ja-7173":
    native: "constitution"
    notes:
      "n1": "憲 (kenpou): on reading ケン (ken); no kun reading. It is not a word on its own, so its kana けんぽう (kenpou), constitution, is the commonest word it begins, written 憲法 (kenpou). No taught card has that kana. It has no example yet, because no taught word card uses 憲 (ken) in its spelling."
  "ja-7174":
    native: "operation"
    notes:
      "n1": "操 (sousa): on reading ソウ (sou); kun readings みさお (misao) and あやつ-る (ayatsu-ru), which the card does not use. Its kana そうさ (sousa), operation, is the commonest word it begins, written 操作 (sousa). The taught card そうさ (sousa), operation, from ja-technology is the same word 操作 (sousa). Its example is 操作は簡単です (sousa wa kantan desu), where 操作 (sousa) is that taught card, は (wa) is the taught particle, 簡単 (kantan), simple, is the taught card かんたん (kantan), and です (desu) is the taught copula."
    examples:
      "操作は簡単です。": "The operation is simple."
  "ja-7175":
    native: "trees"
    notes:
      "n1": "樹 (jumoku): on reading ジュ (ju); no kun reading. It is not a word on its own, so its kana じゅもく (jumoku), trees, is the commonest word it begins, written 樹木 (jumoku). No taught card has that kana. It has no example yet, because no taught word card uses 樹 (ju) in its spelling."
  "ja-7176":
    native: "fierce"
    notes:
      "n1": "激 (hageshii): on reading ゲキ (geki); kun reading はげ-しい (hage-shii). Its kana はげしい (hageshii), fierce, is the word it stands for in its kun reading, written 激しい (hageshii). The taught card はげしい (hageshii), fierce, from ja-weather is the same word 激しい (hageshii). Its example is 雨は激しいです (ame wa hageshii desu), where 雨 (ame), rain, is the taught card あめ (ame), は (wa) is the taught particle, 激しい (hageshii) is that taught card, and です (desu) is the taught copula."
    examples:
      "雨は激しいです。": "The rain is heavy."
  "ja-7177":
    native: "sugar"
    notes:
      "n1": "糖 (satou): on reading トウ (tou); no kun reading. It is not a word on its own, so its kana さとう (satou), sugar, is the commonest word it ends, written 砂糖 (satou). The taught card さとう (satou), sugar, from ja-market is the same word 砂糖 (satou). Its example is 砂糖は高いです (satou wa takai desu), where 砂糖 (satou) is that taught card, written with 砂 (sa) from ja-kanji-34, は (wa) is the taught particle, 高い (takai), expensive, is the taught card たかい (takai) from ja-quantities, and です (desu) is the taught copula."
    examples:
      "砂糖は高いです。": "Sugar is expensive."
  "ja-7178":
    native: "vertical"
    notes:
      "n1": "縦 (tate): on reading ジュウ (juu); kun reading たて (tate). Its kana たて (tate), vertical, is the word it stands for in its kun reading, written 縦 (tate). No taught card has that kana. It has no example yet, because no taught word card uses 縦 (juu) in its spelling."
  "ja-7179":
    native: "steel"
    notes:
      "n1": "鋼 (hagane): on reading コウ (kou); kun reading はがね (hagane). Its kana はがね (hagane), steel, is the word it stands for in its kun reading, written 鋼 (hagane). No taught card has that kana. It has no example yet, because no taught word card uses 鋼 (kou) in its spelling."
  "ja-7180":
    native: "gentle; kind"
    notes:
      "n1": "優 (yasashii): on reading ユウ (yuu); kun readings やさ-しい (yasa-shii), which the card uses, and すぐ-れる (sugu-reru), to excel, which it does not use. Its kana やさしい (yasashii), gentle; kind, is the word it stands for in its kun reading, written 優しい (yasashii). The kind sense is the same word 優しい (yasashii) as the taught card やさしい (yasashii), from ja-describing, which is also glossed easy; the easy sense is a different word, 易しい (yasashii), which is the kanji card 易 (yasashii) of ja-kanji-26. Its example is 先生は優しいです (sensei wa yasashii desu), where 先生 (sensei), teacher, is the taught card せんせい (sensei) from ja-first-words, は (wa) is the taught particle, 優しい (yasashii) is that taught card, and です (desu) is the taught copula."
    examples:
      "先生は優しいです。": "The teacher is kind."
      "チームは優勝しました。": "The team won the championship."
  "ja-7181":
    native: "strict"
    notes:
      "n1": "厳 (kibishii): on reading ゲン (gen); the parenthesised reading ゴン (gon) is a special or very narrow use and is not used for the card. Kun readings おごそ-か (ogoso-ka), which the card does not use, and きび-しい (kibi-shii), which it uses. Its kana きびしい (kibishii), strict; severe, is the word it stands for in that kun reading, written 厳しい (kibishii). The taught card きびしい (kibishii), strict; severe, from ja-adjectives-2 is the same word 厳しい (kibishii). Its example is 母は厳しいです (haha wa kibishii desu), where 母 (haha), my mother, is the taught card はは (haha) from ja-family, は (wa) is the taught particle, 厳しい (kibishii) is that taught card, and です (desu) is the taught copula."
    examples:
      "母は厳しいです。": "My mother is strict."
  "ja-7182":
    native: "to shrink"
    notes:
      "n1": "縮 (chijimu): on reading シュク (shuku); kun readings ちぢ-む (chiji-mu), which the card uses, and ちぢ-まる (chiji-maru), ちぢ-める (chiji-meru), ちぢ-れる (chiji-reru) and ちぢ-らす (chiji-rasu), which it does not use. Its kana ちぢむ (chijimu), to shrink, is the word it stands for in that kun reading, written 縮む (chijimu). The taught card ちぢむ (chijimu), to shrink, from ja-verbs-4 is the same word 縮む (chijimu). Its example is 服は縮みました (fuku wa chijimimashita), where 服 (fuku), clothes, is the taught card ふく (fuku) from ja-clothes, は (wa) is the taught particle, and 縮みました (chijimimashita) is the masu past of the taught card ちぢむ (chijimu)."
    examples:
      "服は縮みました。": "The clothes shrank."
  "ja-7183":
    native: "exhibition"
    notes:
      "n1": "覧 (tenrankai): on reading ラン (ran); no kun reading. It is not a word on its own, so its kana てんらんかい (tenrankai), exhibition, is a word in which it stands in the middle, written 展覧会 (tenrankai). The taught card てんらんかい (tenrankai), exhibition, from ja-arts is the same word 展覧会 (tenrankai). Its example is 展覧会は面白いです (tenrankai wa omoshiroi desu), where 展覧会 (tenrankai) is that taught card, written with 展 (ten) from ja-kanji-34, は (wa) is the taught particle, 面白い (omoshiroi), interesting, is the taught card おもしろい (omoshiroi) from ja-describing, and です (desu) is the taught copula."
    examples:
      "展覧会は面白いです。": "The exhibition is interesting."
      "遊覧船に乗ります。": "I ride a sightseeing boat."
  "ja-7184":
    native: "simple"
    notes:
      "n1": "簡 (kantan): on reading カン (kan); no kun reading. It is not a word on its own, so its kana かんたん (kantan), simple, is the commonest word it begins, written 簡単 (kantan). The taught card かんたん (kantan), simple, from ja-hobbies is the same word 簡単 (kantan). Its example is 問題は簡単です (mondai wa kantan desu), where 問題 (mondai), problem; question, is the taught card もんだい (mondai) from ja-opinions, は (wa) is the taught particle, 簡単 (kantan) is that taught card, and です (desu) is the taught copula."
    examples:
      "問題は簡単です。": "The problem is simple."
  "ja-7185":
    native: "temporary"
    notes:
      "n1": "臨 (rinji): on reading リン (rin); kun reading のぞ-む (nozo-mu), which the card does not use. Its kana りんじ (rinji), temporary, is the commonest word it begins, written 臨時 (rinji). No taught card has that kana. It has no example yet, because no taught word card uses 臨 (rin) in its spelling."
  "ja-7186":
    native: "difficult"
    notes:
      "n1": "難 (muzukashii): on reading ナン (nan); kun readings かた-い (kata-i), which the card does not use, and むずか-しい (muzuka-shii), which it uses. Its kana むずかしい (muzukashii), difficult, is the word it stands for in that kun reading, written 難しい (muzukashii). The taught card むずかしい (muzukashii), difficult; hard, from ja-describing is the same word 難しい (muzukashii). Its example is 漢字は難しいです (kanji wa muzukashii desu), where 漢字 (kanji), kanji, is the taught card かんじ (kanji) from ja-school, は (wa) is the taught particle, 難しい (muzukashii) is that taught card, and です (desu) is the taught copula."
    examples:
      "漢字は難しいです。": "Kanji are difficult."
  "ja-7187":
    native: "heart"
    notes:
      "n1": "臓 (shinzou): on reading ゾウ (zou); no kun reading. It is not a word on its own, so its kana しんぞう (shinzou), heart, is the commonest word it ends, written 心臓 (shinzou). The taught card しんぞう (shinzou), heart, from ja-health is the same word 心臓 (shinzou). Its example is 心臓は強いです (shinzou wa tsuyoi desu), where 心臓 (shinzou) is that taught card, は (wa) is the taught particle, 強い (tsuyoi), strong, is the taught card つよい (tsuyoi), and です (desu) is the taught copula."
    examples:
      "心臓は強いです。": "The heart is strong."
  "ja-7188":
    native: "police"
    notes:
      "n1": "警 (keisatsu): on reading ケイ (kei); no kun reading. It is not a word on its own, so its kana けいさつ (keisatsu), police, is the commonest word it begins, written 警察 (keisatsu). The taught card けいさつ (keisatsu), police, from ja-help is the same word 警察 (keisatsu), and so is the kanji card 察 (keisatsu) of ja-kanji-23, which has the same kana and meaning. Its example is 警察官は親切です (keisatsukan wa shinsetsu desu), where 警察官 (keisatsukan), police officer, is the taught card けいさつかん (keisatsukan) from ja-work, は (wa) is the taught particle, 親切 (shinsetsu), kind, is the taught card しんせつ (shinsetsu), and です (desu) is the taught copula."
    examples:
      "警察官は親切です。": "The police officer is kind."
      "警察署は近いです。": "The police station is near."
