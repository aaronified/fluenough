id: "ja-en-kanji-12"
kind: "layer"
core: "ja-kanji-12"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 12: grade 3, part 3"
description: "Twenty-five kanji of the third school grade, each taught by the kana reading of the word it stands for. Some have one example or none yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-5600":
    native: "thing; matter"
    notes:
      "n1": "事 (koto): on reading ジ (ji), with a rare on reading (ズ) (zu) in parentheses; kun reading こと (koto). It is in 仕事 (shigoto), a job."
    examples:
      "仕事をします。": "I work."
      "用事があります。": "I have an errand."
  "ja-5601":
    native: "use; employ"
    notes:
      "n1": "使 (tsukau): on reading シ (shi); kun reading つかう (tsukau). It is in 大使 (taishi), an ambassador."
    examples:
      "電話を使います。": "I use the phone."
      "電話を使いますか。": "Do you use the phone?"
  "ja-5602":
    native: "tool; utensil"
    notes:
      "n1": "具 (dougu): on reading グ (gu) only. It is in 道具 (dougu), a tool."
    examples:
      "具合はどうですか。": "How are you feeling?"
      "具合がいいです。": "I am feeling well."
  "ja-5603":
    native: "take; get"
    notes:
      "n1": "取 (toru): on reading シュ (shu); kun reading とる (toru). It is in 取引 (torihiki), a business deal."
  "ja-5604":
    native: "receive; accept"
    notes:
      "n1": "受 (ukeru): on reading ジュ (ju); kun readings うける (ukeru) and うかる (ukaru). It is in 受付 (uketsuke), a reception desk."
  "ja-5605":
    native: "taste; flavour"
    notes:
      "n1": "味 (aji): on reading ミ (mi); kun readings あじ (aji) and あじわう (ajiwau). It is in 意味 (imi), meaning."
    examples:
      "味がいいです。": "It tastes good."
      "味はおいしいです。": "It tastes delicious."
  "ja-5606":
    native: "life; fate"
    notes:
      "n1": "命 (inochi): on readings メイ (mei) and ミョウ (myou); kun reading いのち (inochi). It is in 生命 (seimei), life."
  "ja-5607":
    native: "harmony; peace"
    notes:
      "n1": "和 (wa): on reading ワ (wa), with a rare on reading (オ) (o) in parentheses; kun readings やわらぐ (yawaragu), やわらげる (yawarageru), なごむ (nagomu) and なごやか (nagoyaka). It is in 平和 (heiwa), peace."
  "ja-5608":
    native: "begin; start"
    notes:
      "n1": "始 (hajimeru): on reading シ (shi); kun readings はじめる (hajimeru) and はじまる (hajimaru). It is in 開始 (kaishi), a start."
    examples:
      "仕事を始めます。": "I start work."
      "仕事を始めますか。": "Are you starting work?"
  "ja-5609":
    native: "entrust; leave to"
    notes:
      "n1": "委 (yudaneru): on reading イ (i); kun reading ゆだねる (yudaneru). It is in 委員 (iin), a committee member."
  "ja-5610":
    native: "decide; set"
    notes:
      "n1": "定 (sadameru): on readings テイ (tei) and ジョウ (jou); kun readings さだめる (sadameru), さだまる (sadamaru) and さだか (sadaka). It is in 予定 (yotei), a plan."
    examples:
      "予定があります。": "I have plans."
      "予定はどうですか。": "What are your plans?"
  "ja-5611":
    native: "fruit; truth"
    notes:
      "n1": "実 (mi): on reading ジツ (jitsu); kun readings み (mi) and みのる (minoru). It is in 事実 (jijitsu), a fact."
  "ja-5612":
    native: "shore; bank"
    notes:
      "n1": "岸 (kishi): on reading ガン (gan); kun reading きし (kishi). It is in 海岸 (kaigan), a seashore."
  "ja-5613":
    native: "happiness; luck"
    notes:
      "n1": "幸 (shiawase): on reading コウ (kou); kun readings さいわい (saiwai), さち (sachi) and しあわせ (shiawase). It is in 幸福 (koufuku), happiness."
  "ja-5614":
    native: "place; location"
    notes:
      "n1": "所 (tokoro): on reading ショ (sho); kun reading ところ (tokoro). It is in 場所 (basho), a place."
    examples:
      "場所はどこですか。": "Where is the place?"
      "ここはいい場所です。": "This is a good place."
  "ja-5615":
    native: "release; let go"
    notes:
      "n1": "放 (hanasu): on reading ホウ (hou); kun readings はなす (hanasu), はなつ (hanatsu), はなれる (hanareru) and ほうる (houru). Its kana はなす (hanasu) is also the taught card 話す (hanasu), to speak, which is a different word. It is in 放送 (housou), a broadcast."
  "ja-5616":
    native: "long ago; the past"
    notes:
      "n1": "昔 (mukashi): on readings セキ (seki) and, rarely, (シャク) (shaku); kun reading むかし (mukashi). It is in 昔話 (mukashibanashi), a folk tale."
  "ja-5617":
    native: "clothes"
    notes:
      "n1": "服 (fuku): on reading フク (fuku). It is in 洋服 (youfuku), Western clothes."
    examples:
      "服をきます。": "I put on clothes."
      "わたしの服は新しいです。": "My clothes are new."
  "ja-5618":
    native: "board; plank"
    notes:
      "n1": "板 (ita): on readings ハン (han) and バン (ban); kun reading いた (ita). It is in 黒板 (kokuban), a blackboard."
  "ja-5619":
    native: "oil"
    notes:
      "n1": "油 (abura): on reading ユ (yu); kun reading あぶら (abura). It is in 石油 (sekiyu), petroleum."
    examples:
      "油を入れます。": "I pour in some oil."
      "油で肉をいためます。": "I stir-fry the meat in oil."
  "ja-5620":
    native: "wave"
    notes:
      "n1": "波 (nami): on reading ハ (ha); kun reading なみ (nami). It is in 電波 (denpa), radio waves."
    examples:
      "波が高いです。": "The waves are high."
      "海の波を見ます。": "I look at the sea waves."
  "ja-5621":
    native: "pour; order"
    notes:
      "n1": "注 (chuumon): on reading チュウ (chuu); kun reading そそぐ (sosogu). It is in 注文 (chuumon), an order."
    examples:
      "注文をおねがいします。": "I would like to order, please."
      "注文はこれですか。": "Is this your order?"
  "ja-5622":
    native: "swim"
    notes:
      "n1": "泳 (oyogu): on reading エイ (ei); kun reading およぐ (oyogu). It is in 水泳 (suiei), swimming."
  "ja-5623":
    native: "thing; object"
    notes:
      "n1": "物 (mono): on readings ブツ (butsu) and モツ (motsu); kun reading もの (mono). It is in 食べ物 (tabemono), food."
    examples:
      "食べ物はおいしいです。": "The food is delicious."
      "買い物にいきます。": "I am going shopping."
  "ja-5624":
    native: "person"
    notes:
      "n1": "者 (mono): on reading シャ (sha); kun reading もの (mono), the same kana as 物 (mono), thing, which is a different word. It is in 若者 (wakamono), a young person."
