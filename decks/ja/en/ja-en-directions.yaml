          "は":
            meaning: "(marks the topic)"
          "です":
            meaning: "is (polite)"
  "ja-1058":
    native: "crossroads; intersection"
    notes:
      "n1": "こうさてん (kousaten) is a place where roads cross."
    examples:
      "こうさてんはどこですか。":
        native: "Where is the crossroads?"
