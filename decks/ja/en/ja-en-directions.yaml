            meaning: "(marks the topic)"
          "です":
            meaning: "is (polite)"
  "ja-1059":
    native: "street; road"
    notes:
      "n1": "とおり (toori) is a street, a road in a town."
    examples:
      "とおりはながいです。":
        native: "The street is long."
