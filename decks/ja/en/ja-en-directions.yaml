          "は":
            meaning: "(marks the topic)"
          "です":
            meaning: "is (polite)"
          "か":
            meaning: "(marks a question)"
      "ともだちはみなみにいます。":
        native: "My friend is in the south."
        bases:
          "は":
            meaning: "(marks the topic)"
          "に":
            meaning: "in; at; to"
          "います":
            meaning: "to be (of people and animals); to exist"
  "ja-1055":
    native: "east"
    notes:
      "n1": "ひがし (higashi) is east."
