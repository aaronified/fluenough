schema: 1
id: "ja-en-directions"
kind: "layer"
core: "ja-directions"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Directions"
description: "Thirty words for finding the way: left and right, straight on, the corner and the crossroads, north and south, the street, the other side and the way back, with the verbs to turn, cross and head for. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "ja-1050":
    native: "to turn (a corner)"
    notes:
      "n1": "まがる (magaru) means to turn, as at a corner. Its polite form is まがります (magarimasu)."
    examples:
      "みぎにまがります。":
        native: "I turn right."
        bases:
          "に":
            meaning: "in; at; to"
          "まがります":
            meaning: "to turn (a corner)"
      "かどをまがりますか。":
        native: "Do you turn at the corner?"
        bases:
          "を":
            meaning: "(marks the thing acted on)"
          "まがります":
            meaning: "to turn (a corner)"
          "か":
            meaning: "(marks a question)"
  "ja-1051":
    native: "straight ahead"
    notes:
      "n1": "まっすぐ (massugu) means straight on, without turning."
    examples:
      "まっすぐいきます。": "I go straight on."
      "まっすぐはとおいですか。":
        native: "Is it far straight on?"
        bases:
          "は":
            meaning: "(marks the topic)"
          "です":
            meaning: "is (polite)"
          "か":
            meaning: "(marks a question)"
  "ja-1052":
    native: "behind; back"
    notes:
      "n1": "うしろ (ushiro) is the back or the place behind something. The opposite is まえ (mae)."
    examples:
      "いぬのうしろです。":
        native: "It is behind the dog."
        bases:
          "の":
            meaning: "(links two nouns: of, 's)"
          "です":
            meaning: "is (polite)"
      "がっこうのうしろです。":
        native: "It is behind the school."
        bases:
          "の":
            meaning: "(links two nouns: of, 's)"
          "です":
            meaning: "is (polite)"
  "ja-1053":
    native: "north"
    notes:
      "n1": "きた (kita) is north."
    examples:
      "きたはどこですか。":
        native: "Where is north?"
        bases:
          "は":
            meaning: "(marks the topic)"
          "です":
            meaning: "is (polite)"
          "か":
            meaning: "(marks a question)"
      "がっこうはきたです。":
