          "は":
            meaning: "(marks the topic)"
          "です":
            meaning: "is (polite)"
  "ja-1060":
    native: "to cross"
    notes:
      "n1": "わたる (wataru) means to cross a road. Its polite form is わたります (watarimasu)."
    examples:
      "みちをわたります。":
        native: "I cross the road."
        bases:
          "を":
            meaning: "(marks the thing acted on)"
          "わたります":
            meaning: "to cross"
      "おうだんほどうをわたりますか。":
        native: "Do you cross the pedestrian crossing?"
        bases:
          "を":
            meaning: "(marks the thing acted on)"
          "わたります":
            meaning: "to cross"
          "か":
            meaning: "(marks a question)"
  "ja-1061":
    native: "to go forward; to advance"
    notes:
      "n1": "すすむ (susumu) means to go forward. Its polite form is すすみます (susumimasu)."
    examples:
      "まっすぐすすみます。":
        native: "I go forward straight on."
        bases:
          "すすみます":
            meaning: "to go forward; to advance"
      "すすみますか。":
        native: "Do you go forward?"
        bases:
          "すすみます":
            meaning: "to go forward; to advance"
          "か":
            meaning: "(marks a question)"
  "ja-1062":
    native: "to go back; to step back"
    notes:
      "n1": "さがる (sagaru) means to go back, or to step back."
    examples:
      "うしろにさがります。":
        native: "I step back."
