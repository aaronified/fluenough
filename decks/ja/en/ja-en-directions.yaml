          "を":
            meaning: "(marks the thing acted on)"
          "まちがえます":
            meaning: "to make a mistake; to take the wrong way"
      "まちがえましたか。":
        native: "Did you make a mistake?"
        bases:
          "まちがえました":
            meaning: "to make a mistake; to take the wrong way"
          "か":
            meaning: "(marks a question)"
  "ja-1071":
    native: "to go out; to leave"
    notes:
      "n1": "でる (deru) means to go out, or to leave a place. Its polite form is でます (demasu)."
    examples:
      "えきをでます。":
        native: "I leave the station."
        bases:
          "を":
            meaning: "(marks the thing acted on)"
          "でます":
            meaning: "to go out; to leave"
      "がっこうをでますか。":
        native: "Do you leave school?"
        bases:
          "を":
            meaning: "(marks the thing acted on)"
          "でます":
            meaning: "to go out; to leave"
          "か":
            meaning: "(marks a question)"
  "ja-1072":
