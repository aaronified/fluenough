    notes:
      "n1": "まち (machi) is a town or a city."
    examples:
      "まちはおおきいです。":
        native: "The town is big."
        bases:
          "は":
            meaning: "(marks the topic)"
          "です":
            meaning: "is (polite)"
      "まちはしずかです。":
