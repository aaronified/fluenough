          "に":
            meaning: "in; at; to"
          "さがります":
            meaning: "to go back; to step back"
      "さがりますか。":
        native: "Do you step back?"
        bases:
          "さがります":
            meaning: "to go back; to step back"
          "か":
            meaning: "(marks a question)"
  "ja-1063":
    native: "shortcut"
    notes:
      "n1": "ちかみち (chikamichi) is a shorter way to a place."
    examples:
      "ちかみちはどこですか。":
        native: "Where is the shortcut?"
