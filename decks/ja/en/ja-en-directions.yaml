          "を":
            meaning: "(marks the thing acted on)"
  "ja-1064":
    native: "guidance; directions"
    notes:
      "n1": "あんない (annai) is guidance, the information about how to get somewhere."
    examples:
      "あんないはどこですか。":
        native: "Where are the directions?"
        bases:
          "は":
            meaning: "(marks the topic)"
          "です":
            meaning: "is (polite)"
          "か":
            meaning: "(marks a question)"
      "あんないをします。":
        native: "I give directions."
        bases:
          "を":
            meaning: "(marks the thing acted on)"
  "ja-1065":
