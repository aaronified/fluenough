name: "Asking: the te-form and ください (kudasai)"
description: "Put ください (kudasai) after the te-form of a verb to ask someone politely to do it: まってください (matte kudasai), please wait. Every verb a course deck teaches has a row. Not yet checked by a Japanese speaker: please report any mistake."
