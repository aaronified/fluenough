schema: 1
id: "ja-en-kanji-35"
kind: "layer"
core: "ja-kanji-35"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 35: grade 6, part 4"
description: "Twenty-seven kanji of the sixth school grade, each taught by the kana reading of the word it stands for. Sixteen have no example yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-6980":
    native: "sit"
    notes:
      "n1": "座 (suwaru): on reading ザ (za); kun reading すわ-る (suwa-ru). The kun reading is the word it stands for alone: すわる (suwaru), sit. The taught card すわる (suwaru), sit, from ja-everyday-verbs, is the same word, 座る (suwaru). Its examples are 座席は広いです (zaseki wa hiroi desu), where 座席 (zaseki), seat, is the taught card ざせき (zaseki), from ja-journey, with 席 (seki) a taught kanji, and は (wa), 広い (hiroi), wide; roomy, and です (desu) are taught; and わたしはここに座ります (watashi wa koko ni suwarimasu), where 座ります (suwarimasu) is the masu form of the taught card すわる (suwaru), and わたし (watashi), I, ここ (koko), here, and に (ni) are taught."
    examples:
      "座席は広いです。": "The seat is roomy."
      "わたしはここに座ります。": "I sit here."
  "ja-6981":
    native: "to follow; to obey"
    notes:
      "n1": "従 (shitagau): on reading ジュウ (juu); the parenthesised readings ショウ (shou) and ジュ (ju) are special or very narrow use and are not used for the card. Kun readings したが-う (shitaga-u) and したが-える (shitaga-eru). The kun reading したが-う (shitaga-u) is the word it stands for alone: したがう (shitagau), to follow; to obey. No taught card has that kana. No taught word card is written with 従 (juu), so it has no example yet."
  "ja-6982":
    native: "favour; kindness"
    notes:
      "n1": "恩 (on): on reading オン (on); no kun reading. The on reading is the word it stands for alone: おん (on), favour; kindness. No taught card has that kana. No taught word card is written with 恩 (on), so it has no example yet."
  "ja-6983":
    native: "cheerful; bright"
    notes:
      "n1": "朗 (hogaraka): on reading ロウ (rou); kun reading ほが-らか (hoga-raka). The kun reading is the word it stands for alone: ほがらか (hogaraka), cheerful; bright. No taught card has that kana. No taught word card is written with 朗 (rou), so it has no example yet."
  "ja-6984":
    native: "stock; share"
    notes:
      "n1": "株 (kabu): the table gives no on reading; kun reading かぶ (kabu) only. The kun reading is the word it stands for alone: 株 (kabu), stock; share. The taught card かぶ (kabu), stock, from ja-business, is the same word, 株 (kabu). Its example is 株式会社は大きいです (kabushikigaisha wa ookii desu), where 株式会社 (kabushikigaisha), joint-stock company, is the taught card かぶしきがいしゃ (kabushikigaisha), from ja-business, with 式 (shiki), 会 (kai) and 社 (sha) taught kanji, and は (wa), 大きい (ookii), big, and です (desu) are taught."
    examples:
      "株式会社は大きいです。": "The company is big."
  "ja-6985":
    native: "group; squad"
    notes:
      "n1": "班 (han): on reading ハン (han); no kun reading. The on reading is the word it stands for alone: はん (han), group; squad. No taught card has that kana. No taught word card is written with 班 (han), so it has no example yet."
  "ja-6986":
    native: "to keep hidden"
    notes:
      "n1": "秘 (himeru): on reading ヒ (hi); kun reading ひ-める (hi-meru). The kun reading is the word it stands for alone: 秘める (himeru), to keep hidden. No taught card has that kana. No taught word card is written with 秘 (hi), so it has no example yet."
  "ja-6987":
    native: "to pay; to store"
    notes:
      "n1": "納 (osameru): on reading ノウ (nou); the parenthesised readings ナッ (nat), ナ (na), ナン (nan) and トウ (tou) are special or very narrow use, as in 納豆 (nattou), and are not used for the card. Kun readings おさ-める (osa-meru) and おさ-まる (osa-maru). The kun reading おさ-める (osa-meru) is the word it stands for alone: おさめる (osameru), to pay; to store. The taught kanji card 収 (osameru), from ja-kanji-32, has the same kana, おさめる (osameru), and is a different word, 収める (osameru), written with 収 (shuu) and not 納 (nou). The taught card なっとう (nattou), natto, from ja-eating-out, is written 納豆 (nattou), a different word from 納める (osameru). It is in 納豆 (nattou), fermented soybeans."
    examples:
      "納豆はおいしいです。": "Natto is delicious."
      "納品は明日です。": "The delivery is tomorrow."
  "ja-6988":
    native: "pure; genuine"
    notes:
      "n1": "純 (junsui): on reading ジュン (jun); no kun reading. It is not a word on its own, so its kana じゅんすい (junsui), pure; genuine, is the commonest word it begins, written 純粋 (junsui). No taught card has that kana. The taught card じゅんび (junbi), preparation, from ja-daily-life, is a different word, written with 準 (jun), not 純 (jun). No taught word card is written with 純 (jun), so it has no example yet."
  "ja-6989":
    native: "chest; breast"
    notes:
      "n1": "胸 (mune): on reading キョウ (kyou); kun readings むね (mune) and むな (muna). The reading むな (muna) is a special or very narrow use and is not used for the card. The kun reading むね (mune) is the word it stands for alone: 胸 (mune), chest. The taught card むね (mune), chest, from ja-body, is the same word, 胸 (mune). Its example is 胸はいたいです (mune wa itai desu), where 胸 (mune) is that taught card, and は (wa), いたい (itai), painful; sore, and です (desu) are taught."
    examples:
      "胸はいたいです。": "My chest hurts."
  "ja-6990":
    native: "silkworm"
    notes:
      "n1": "蚕 (kaiko): on reading サン (san); kun reading かいこ (kaiko). The kun reading is the word it stands for alone: かいこ (kaiko), silkworm. No taught card has that kana. No taught word card is written with 蚕 (san), so it has no example yet."
  "ja-6991":
    native: "to attack"
    notes:
      "n1": "討 (utsu): on reading トウ (tou); kun reading う-つ (u-tsu). The kun reading is the word it stands for alone: 討つ (utsu), to attack. The taught card うつ (utsu), from ja-sports, and the taught kanji card 打 (utsu), from ja-kanji-10, are different words, 打つ (utsu), to hit, written with a different kanji, not 討 (tou). No taught word card is written with 討 (tou), so it has no example yet."
  "ja-6992":
    native: "needle"
    notes:
      "n1": "針 (hari): on reading シン (shin); kun reading はり (hari). The kun reading is the word it stands for alone: 針 (hari), needle. No taught card has that kana. No taught word card is written with 針 (shin), so it has no example yet."
  "ja-6993":
    native: "to fall as rain or snow"
    notes:
      "n1": "降 (furu): on reading コウ (kou); kun readings お-りる (o-riru), お-ろす (o-rosu) and ふ-る (fu-ru). The kun reading ふ-る (fu-ru) is the word it stands for alone: 降る (furu), to fall, as rain or snow. No taught card has that kana. The taught card おりる (oriru), to get off, from ja-everyday-verbs, is written 降りる (oriru), a different word. It is in 降ります (orimasu), to get off; to go down."
    examples:
      "電車を降ります。": "I get off the train."
      "今日は土砂降りです。": "Today it is pouring."
  "ja-6994":
    native: "majesty"
    notes:
      "n1": "陛 (heika): on reading ヘイ (hei); no kun reading. It is not a word on its own, so its kana へいか (heika), majesty, is the commonest word it begins, written 陛下 (heika). No taught card has that kana. No taught word card is written with 陛 (hei), so it has no example yet."
  "ja-6995":
    native: "to remove; to exclude"
    notes:
      "n1": "除 (nozoku): on reading ジョ (jo); the parenthesised reading ジ (ji) is a special or very narrow use and is not used for the card. Kun reading のぞ-く (nozo-ku). The kun reading のぞ-く (nozo-ku) is the word it stands for alone: 除く (nozoku), to remove; to exclude. No taught card has that kana. No taught word card is written with 除 (jo), so it has no example yet."
  "ja-6996":
    native: "bone"
    notes:
      "n1": "骨 (hone): on reading コツ (kotsu); kun reading ほね (hone). The kun reading is the word it stands for alone: 骨 (hone), bone. The taught card ほね (hone), bone, from ja-body, is the same word, 骨 (hone). It is in 骨 (hone), bone."
    examples:
      "骨はかたいです。": "Bones are hard."
      "足を骨折しました。": "I broke my leg."
  "ja-6997":
    native: "area; range"
    notes:
      "n1": "域 (iki): on reading イキ (iki); no kun reading. The on reading is the word it stands for alone: 域 (iki), area; range. The taught kanji card いき (iki), breath, from ja-kanji-14, is a different word, 息 (iki). No taught word card is written with 域 (iki), so it has no example yet."
  "ja-6998":
    native: "dense; secret"
    notes:
      "n1": "密 (mitsu): on reading ミツ (mitsu); no kun reading. The on reading is the word it stands for alone: 密 (mitsu), dense; close; secret. Used alone it is rare, so the card follows the only reading the table gives. No taught card has that kana. The taught card みつばち (mitsubachi), bee, is written with 蜜 (mitsu), a different kanji. No taught word card is written with 密 (mitsu), so it has no example yet."
  "ja-6999":
    native: "to throw away"
    notes:
      "n1": "捨 (suteru): on reading シャ (sha); kun reading す-てる (su-teru). The kun reading is the word it stands for alone: すてる (suteru), to throw away. The taught card すてる (suteru), to throw away, from ja-more-verbs, is the same word, 捨てる (suteru). Its example is ごみを捨てます (gomi o sutemasu), where ごみ (gomi), rubbish, is the taught card ごみ (gomi), from ja-groceries, を (o) is taught, and 捨てます (sutemasu) is the masu form of that card."
    examples:
      "ごみを捨てます。": "I throw out the rubbish."
  "ja-7000":
    native: "to search for"
    notes:
      "n1": "探 (sagasu): on reading タン (tan); kun readings さぐ-る (sagu-ru) and さが-す (saga-su). The kun reading さが-す (saga-su) is the word it stands for alone: さがす (sagasu), to search for. The taught card さがす (sagasu), to search for, from ja-more-verbs, is the same word, 探す (sagasu). Its example is 友達を探します (tomodachi o sagashimasu), where 友達 (tomodachi), friend, is the taught card ともだち (tomodachi), from ja-addressing, with 友 (tomo) and 達 (tachi) taught kanji, を (o) is taught, and 探します (sagashimasu) is the masu form of that card."
    examples:
      "友達を探します。": "I am looking for a friend."
  "ja-7001":
    native: "to recommend; to support"
    notes:
      "n1": "推 (osu): on reading スイ (sui); kun reading お-す (o-su). The kun reading is the word it stands for alone: 推す (osu), to recommend; to support. The taught card おす (osu), to push, from ja-verbs-3, is a different word, 押す (osu), written with a different kanji, not 推 (sui). No taught word card is written with 推 (sui), so it has no example yet."
  "ja-7002":
    native: "want"
    notes:
      "n1": "欲 (hoshii): on reading ヨク (yoku); kun readings ほっ-する (hot-suru) and ほ-しい (ho-shii). The kun reading ほ-しい (ho-shii) is the word it stands for alone: 欲しい (hoshii), wanted; desired. The taught card ほしい (hoshii), want, from ja-shopping, is the same word, 欲しい (hoshii). Its example is 車は欲しいです (kuruma wa hoshii desu), where 車 (kuruma), car, is the taught card くるま (kuruma), from ja-transport, with 車 (sha) a taught kanji, and は (wa) and です (desu) are taught."
    examples:
      "車は欲しいです。": "I want a car."
  "ja-7003":
    native: "to end; to be finished"
    notes:
      "n1": "済 (sumu): on reading サイ (sai); kun readings す-む (su-mu) and す-ます (su-masu). The kun reading す-む (su-mu) is the word it stands for alone: 済む (sumu), to end; to be finished. The taught kanji card すむ (sumu), to live, from ja-kanji-11, is a different word, 住 (sumu). Its example is 経済は大切です (keizai wa taisetsu desu), where 経済 (keizai), economy, is the taught card けいざい (keizai), from ja-news, with 経 (kei) a taught kanji, and は (wa), 大切 (taisetsu), important, and です (desu) are taught."
    examples:
      "経済は大切です。": "The economy is important."
  "ja-7004":
    native: "to differ"
    notes:
      "n1": "異 (kotonaru): on reading イ (i); kun reading こと (koto). The kun reading こと (koto) is the start of the word it stands for: 異なる (kotonaru), to differ. No taught card has that kana. No taught word card is written with 異 (i), so it has no example yet."
  "ja-7005":
    native: "lively; popular"
    notes:
      "n1": "盛 (sakan): on reading セイ (sei); the parenthesised reading ジョウ (jou) is a special or very narrow use and is not used for the card. Kun readings も-る (mo-ru), さか-る (saka-ru) and さか-ん (saka-n). The kun reading さか-ん (saka-n) is the word it stands for alone: 盛ん (sakan), lively; popular. No taught card has that kana. No taught word card is written with 盛 (sei), so it has no example yet."
  "ja-7006":
    native: "window"
    notes:
      "n1": "窓 (mado): on reading ソウ (sou); kun reading まど (mado). The kun reading is the word it stands for alone: 窓 (mado), window. The taught card まど (mado), window, from ja-home, is the same word, 窓 (mado). It is in 窓 (mado), window."
    examples:
      "窓をしめます。": "I close the window."
      "窓口はどこですか。": "Where is the window counter?"
