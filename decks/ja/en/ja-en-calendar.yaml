  "ja-1430":
    "native": "days of the week"
    "explanation": "The seven days of the week, from Sunday to Saturday. Each name ends in ようび (youbi), the word for day of the week. To ask which day it is, say なんようび (nanyoubi)."
  "ja-1431":
    "native": "months of the year"
    "explanation": "The twelve months of the year. Each is a number and がつ (gatsu), the word for month. To ask which month it is, say なんがつ (nangatsu)."
