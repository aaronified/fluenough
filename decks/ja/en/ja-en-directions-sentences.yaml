schema: 1
id: "ja-en-directions-sentences"
kind: "layer"
core: "ja-directions-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Directions in sentences"
description: "Sentences giving directions in town, to put in order, each with the words it could be mistaken for. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "ja-1321":
    native: "Please go straight ahead."
    bases:
      "ください": { meaning: "please (give me)" }
    confusables:
      w1: { why: "まがる (magaru) is to turn, not to go straight." }
      w2: { why: "わたる (wataru) is to cross." }
  "ja-1322":
    native: "Please turn right at the crossroads."
    bases:
      "を": { meaning: "(marks the thing acted on)" }
      "ください": { meaning: "please (give me)" }
    confusables:
      w1: { why: "かど (kado) is a corner." }
      w2: { why: "とおり (toori) is a street." }
  "ja-1323":
    native: "Is the park over there?"
    bases:
      "は": { meaning: "(marks the topic)" }
      "です": { meaning: "is (polite)" }
      "か": { meaning: "(marks a question)" }
    confusables:
      w1: { why: "まち (machi) is a town." }
      w2: { why: "ほどう (hodou) is a pavement." }
  "ja-1324":
    native: "Is the shortcut far?"
    bases:
      "は": { meaning: "(marks the topic)" }
      "です": { meaning: "is (polite)" }
      "か": { meaning: "(marks a question)" }
    confusables:
      w1: { why: "きょり (kyori) is a distance." }
      w2: { why: "あんない (annai) is guidance." }
  "ja-4135":
    native: "Please turn right."
    bases:
      "に":
        meaning: "(marks the place, time or target)"
      "まがって":
        meaning: "to turn (a corner)"
      "ください":
        meaning: "please (give me)"
    confusables:
      w1:
        why: "ひだり (hidari) is left; the left side, not part of this sentence."
      w2:
        why: "ここ (koko) is here, not part of this sentence."
  "ja-4136":
    native: "There is a park on the left."
    bases:
      "に":
        meaning: "(marks the place, time or target)"
      "が":
        meaning: "(marks the subject)"
      "あります":
        meaning: "there is (a thing)"
    confusables:
      w1:
        why: "みぎ (migi) is right; the right side, not part of this sentence."
      w2:
        why: "あそこ (asoko) is over there; that place far away, not part of this sentence."
  "ja-4137":
    native: "The park is far."
    bases:
      "は":
        meaning: "(marks the topic)"
      "とおい":
        meaning: "far; distant"
      "です":
        meaning: "is (polite)"
    confusables:
      w1:
        why: "ちかい (chikai) is near; close, not part of this sentence."
      w2:
        why: "あそこ (asoko) is over there; that place far away, not part of this sentence."
  "ja-4138":
    "notes":
      "n1": "で (de) marks the place where an action happens, so ここ (koko) で (de) means turn at this spot."
    native: "Please turn here."
    bases:
      "で":
        meaning: "(marks the place or means)"
      "まがって":
        meaning: "to turn (a corner)"
      "ください":
        meaning: "please (give me)"
    confusables:
      w1:
        why: "みぎ (migi) is right; the right side, not part of this sentence."
      w2:
        why: "ひだり (hidari) is left; the left side, not part of this sentence."
