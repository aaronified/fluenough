cards:
  "ja-4850":
    native: "to work"
    notes:
      "u1": "しごと (shigoto) with する (suru): to work. する (suru) conjugates: し (shi), して (shite), した (shita)."
      "u2": "Plain form, used with friends and in writing. Polite speech: しごとをします (shigoto o shimasu)."
