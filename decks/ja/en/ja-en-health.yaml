"cards":
  "ja-2685":
    "native": "health"
    "notes":
      "n1": "kenkou means health, being well in body and mind. It is written 健康 (kenkou)."
    "examples":
      "わたしはけんこうです。":
        "native": "I am healthy."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "けんこうがいちばんです。":
        "native": "Health is the most important thing."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2686":
    "native": "health check-up"
    "notes":
      "n1": "kenkoushindan is a health check-up. Shindan means a diagnosis. It is written 健康診断 (kenkoushindan)."
    "examples":
      "けんこうしんだんをうけました。":
        "native": "I had a health check-up."
        "bases":
          "うけました":
            "meaning": "received (polite)"
      "けんこうしんだんはあしたです。":
        "native": "The health check-up is tomorrow."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2687":
    "native": "body weight"
    "notes":
      "n1": "taijuu means body weight. It is written 体重 (taijuu)."
    "examples":
      "たいじゅうがふえました。":
        "native": "My weight has gone up."
        "bases":
          "ふえました":
            "meaning": "increased (polite)"
      "たいじゅうをはかります。":
        "native": "I weigh myself."
        "bases":
          "はかります":
            "meaning": "measure (polite)"
  "ja-2688":
    "native": "height"
    "notes":
      "n1": "shinchou means height, how tall a person is. It is written 身長 (shinchou)."
    "examples":
      "わたしのしんちょうはたかいです。":
        "native": "My height is tall."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "しんちょうをはかってください。":
        "native": "Please measure my height."
        "bases":
          "はかって":
            "meaning": "measure (te-form)"
          "ください":
            "meaning": "(please give)"
  "ja-2689":
    "native": "stamina"
    "notes":
      "n1": "tairyoku means physical strength and stamina. It is written 体力 (tairyoku)."
    "examples":
      "たいりょくがありません。":
        "native": "I have no stamina."
        "bases":
          "ありません":
            "meaning": "there is not (polite)"
      "たいりょくをつけます。":
        "native": "I build up my stamina."
        "bases":
          "つけます":
            "meaning": "build up; attach (polite)"
  "ja-2690":
    "native": "muscle"
    "notes":
      "n1": "kinniku is a muscle. It is written 筋肉 (kinniku)."
    "examples":
      "きんにくがつよいです。":
        "native": "The muscles are strong."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "きんにくをつけます。":
        "native": "I build up my muscles."
        "bases":
          "つけます":
            "meaning": "build up; attach (polite)"
  "ja-2691":
    "native": "blood"
    "notes":
      "n1": "ketsueki is blood, the liquid in the body. It is written 血液 (ketsueki)."
    "examples":
      "けつえきをとります。":
        "native": "They take a blood sample."
        "bases":
          "とります":
            "meaning": "take (polite)"
      "けつえきはあかいです。":
        "native": "Blood is red."
        "bases":
          "あかい":
            "meaning": "red"
          "です":
            "meaning": "(to be, polite)"
  "ja-2692":
    "native": "blood pressure"
    "notes":
      "n1": "ketsuatsu is blood pressure. It is written 血圧 (ketsuatsu)."
    "examples":
      "けつあつをはかります。":
        "native": "I measure my blood pressure."
        "bases":
          "はかります":
            "meaning": "measure (polite)"
      "けつあつがたかいです。":
        "native": "My blood pressure is high."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2693":
    "native": "pulse"
    "notes":
      "n1": "myaku is the pulse, the beat you feel at the wrist. It is written 脈 (myaku)."
    "examples":
      "みゃくがはやいです。":
        "native": "My pulse is fast."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "みゃくをはかります。":
        "native": "I take my pulse."
        "bases":
          "はかります":
            "meaning": "measure (polite)"
  "ja-2694":
    "native": "heart"
    "notes":
      "n1": "shinzou is the heart. It is written 心臓 (shinzou)."
    "examples":
      "しんぞうはからだのなかにあります。":
        "native": "The heart is inside the body."
        "bases":
          "あります":
            "meaning": "there is (polite)"
      "しんぞうがどきどきします。":
        "native": "My heart is pounding."
        "bases":
          "どきどき":
            "meaning": "pounding (of the heart)"
          "します":
            "meaning": "do (polite)"
  "ja-2695":
    "native": "brain"
    "notes":
      "n1": "nou is the brain. It is written 脳 (nou)."
    "examples":
      "のうはあたまのなかにあります。":
        "native": "The brain is inside the head."
        "bases":
          "あります":
            "meaning": "there is (polite)"
      "のうをつかいます。":
        "native": "I use my brain."
        "bases":
          "つかいます":
            "meaning": "use (polite)"
  "ja-2696":
    "native": "liver"
    "notes":
      "n1": "kanzou is the liver. It is written 肝臓 (kanzou)."
    "examples":
      "かんぞうがいたいです。":
        "native": "My liver hurts."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "かんぞうのびょうきはこわいです。":
        "native": "Liver disease is frightening."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2697":
    "native": "kidney"
    "notes":
      "n1": "jinzou is the kidney. It is written 腎臓 (jinzou)."
    "examples":
      "じんぞうがわるいです。":
        "native": "My kidneys are not well."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "じんぞうをしらべます。":
        "native": "They examine my kidneys."
        "bases":
          "しらべます":
            "meaning": "examine (polite)"
  "ja-2698":
    "native": "skin"
    "notes":
      "n1": "hifu is the skin. It is written 皮膚 (hifu)."
    "examples":
      "ひふがかゆいです。":
        "native": "My skin is itchy."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "ひふをきれいにします。":
        "native": "I keep my skin clean."
        "bases":
          "します":
            "meaning": "do (polite)"
  "ja-2699":
    "native": "internal medicine"
    "notes":
      "n1": "naika is internal medicine, the department for illnesses inside the body. It is written 内科 (naika)."
    "examples":
      "ないかにいきます。":
        "native": "I go to internal medicine."
        "bases":
          "いきます":
            "meaning": "go (polite)"
      "ないかのいしゃはしんせつです。":
        "native": "The internal medicine doctor is kind."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2700":
    "native": "surgery"
    "notes":
      "n1": "geka is surgery, the department that operates on the body. It is written 外科 (geka)."
    "examples":
      "げかにいきます。":
        "native": "I go to surgery."
        "bases":
          "いきます":
            "meaning": "go (polite)"
      "げかでしゅじゅつをしました。":
        "native": "I had an operation in surgery."
        "bases":
          "しました":
            "meaning": "did (polite)"
  "ja-2701":
    "native": "dentistry"
    "notes":
      "n1": "shika is dentistry, the department for teeth. It is written 歯科 (shika)."
    "examples":
      "しかにいきます。":
        "native": "I go to the dentist."
        "bases":
          "いきます":
            "meaning": "go (polite)"
      "はがいたいです。":
        "native": "My tooth hurts."
        "bases":
          "はが":
            "meaning": "tooth"
          "です":
            "meaning": "(to be, polite)"
  "ja-2702":
    "native": "eye clinic"
    "notes":
      "n1": "ganka is the department for the eyes, the eye clinic. It is written 眼科 (ganka)."
    "examples":
      "がんかはどこですか。":
        "native": "Where is the eye clinic?"
        "bases":
          "ですか":
            "meaning": "is (question)"
      "がんかにいきました。":
        "native": "I went to the eye clinic."
        "bases":
          "いきました":
            "meaning": "went (polite)"
  "ja-2703":
    "native": "dermatology"
    "notes":
      "n1": "hifuka is the department for the skin. It is written 皮膚科 (hifuka)."
    "examples":
      "ひふかにいきました。":
        "native": "I went to dermatology."
        "bases":
          "いきました":
            "meaning": "went (polite)"
      "ひふかはあそこです。":
        "native": "The dermatology department is over there."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2704":
    "native": "paediatrics"
    "notes":
      "n1": "shounika is the department for children. It is written 小児科 (shounika)."
    "examples":
      "しょうにかにこどもをつれていきます。":
        "native": "I take my child to paediatrics."
        "bases":
          "つれて":
            "meaning": "take along (te-form)"
          "いきます":
            "meaning": "go (polite)"
      "しょうにかのいしゃはやさしいです。":
        "native": "The paediatrics doctor is gentle."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2705":
    "native": "obstetrics and gynaecology"
    "notes":
      "n1": "sanfujinka is the department for women's health, pregnancy and birth. It is written 産婦人科 (sanfujinka)."
    "examples":
      "さんふじんかにいきました。":
        "native": "I went to obstetrics and gynaecology."
        "bases":
          "いきました":
            "meaning": "went (polite)"
      "さんふじんかにかよっています。":
        "native": "I am going to obstetrics and gynaecology."
        "bases":
          "かよって":
            "meaning": "going to (te-form)"
          "います":
            "meaning": "there is (polite)"
  "ja-2706":
    "native": "orthopaedics"
    "notes":
      "n1": "seikeigeka is orthopaedics, the department for bones and joints. It is written 整形外科 (seikeigeka)."
    "examples":
      "せいけいげかにいきました。":
        "native": "I went to orthopaedics."
        "bases":
          "いきました":
            "meaning": "went (polite)"
      "ほねのけがはせいけいげかでみます。":
        "native": "Injuries to the bones are seen in orthopaedics."
        "bases":
          "みます":
            "meaning": "look at (polite)"
  "ja-2707":
    "native": "operation"
    "notes":
      "n1": "shujutsu is an operation, a surgical procedure. It is written 手術 (shujutsu)."
    "examples":
      "しゅじゅつをしました。":
        "native": "I had an operation."
        "bases":
          "しました":
            "meaning": "did (polite)"
      "しゅじゅつはこわいです。":
        "native": "The operation is frightening."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2708":
    "native": "treatment"
    "notes":
      "n1": "chiryou is medical treatment. It is written 治療 (chiryou)."
    "examples":
      "ちりょうをうけます。":
        "native": "I receive treatment."
        "bases":
          "うけます":
            "meaning": "receive, take (polite)"
      "ちりょうはながいです。":
        "native": "The treatment is long."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2709":
    "native": "prevention"
    "notes":
      "n1": "yobou is prevention, doing something so that an illness does not happen. It is written 予防 (yobou)."
    "examples":
      "よぼうがたいせつです。":
        "native": "Prevention is important."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "ワクチンでよぼうします。":
        "native": "I prevent illness with a vaccine."
        "bases":
          "します":
            "meaning": "do (polite)"
  "ja-2710":
    "native": "vaccine"
    "notes":
      "n1": "wakuchin is a vaccine, the injection that protects against an illness."
    "examples":
      "ワクチンをうちます。":
        "native": "I get a vaccine."
        "bases":
          "うちます":
            "meaning": "inject (polite)"
      "ワクチンがあります。":
        "native": "There is a vaccine."
        "bases":
          "あります":
            "meaning": "there is (polite)"
  "ja-2711":
    "native": "nutrition"
    "notes":
      "n1": "eiyou is nutrition, the food and the vitamins the body needs. It is written 栄養 (eiyou)."
    "examples":
      "えいようをとります。":
        "native": "I get nutrition."
        "bases":
          "とります":
            "meaning": "take (polite)"
      "えいようがたりません。":
        "native": "I am not getting enough nutrition."
        "bases":
          "たりません":
            "meaning": "is not enough (polite)"
  "ja-2712":
    "native": "vitamin"
    "notes":
      "n1": "bitamin is the vitamin, a nutrient the body needs in small amounts."
    "examples":
      "やさいにビタミンがあります。":
        "native": "There are vitamins in vegetables."
        "bases":
          "あります":
            "meaning": "there is (polite)"
      "ビタミンがたくさんあります。":
        "native": "There are many vitamins."
        "bases":
          "あります":
            "meaning": "there is (polite)"
  "ja-2713":
    "native": "calorie"
    "notes":
      "n1": "karorii is the calorie, the unit of the energy in food."
    "examples":
      "カロリーがたかいです。":
        "native": "The calories are high."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "カロリーをへらします。":
        "native": "I reduce my calories."
        "bases":
          "へらします":
            "meaning": "reduce (polite)"
  "ja-2714":
    "native": "diet"
    "notes":
      "n1": "daietto is a diet, eating less to lose weight."
    "examples":
      "ダイエットをします。":
        "native": "I go on a diet."
        "bases":
          "します":
            "meaning": "do (polite)"
      "ダイエットはむずかしいです。":
        "native": "The diet is difficult."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2715":
    "native": "balance"
    "notes":
      "n1": "baransu is balance, the right mix of things, as in a diet."
    "examples":
      "バランスがいいです。":
        "native": "The balance is good."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "しょくじのバランスをかんがえます。":
        "native": "I think about the balance of my meals."
        "bases":
          "かんがえます":
            "meaning": "think (polite)"
  "ja-2716":
    "native": "to be unbalanced"
    "notes":
      "n1": "katayoru means to lean to one side, to be unbalanced. The polite form is katayorimasu."
    "examples":
      "せいかつがかたよっています。":
        "native": "My life is unbalanced."
        "bases":
          "かたよって":
            "meaning": "is unbalanced (te-form)"
          "います":
            "meaning": "there is (polite)"
      "たべものがかたよっていました。":
        "native": "My food was unbalanced."
        "bases":
          "かたよって":
            "meaning": "is unbalanced (te-form)"
          "いました":
            "meaning": "was (polite)"
  "ja-2717":
    "native": "eating habits"
    "notes":
      "n1": "shokuseikatsu means eating habits, the way a person eats day to day. It is written 食生活 (shokuseikatsu)."
    "examples":
      "しょくせいかつをあらためます。":
        "native": "I change my eating habits."
        "bases":
          "あらためます":
            "meaning": "change; revise (polite)"
      "しょくせいかつがかわりました。":
        "native": "My eating habits have changed."
        "bases":
          "かわりました":
            "meaning": "changed (polite)"
  "ja-2718":
    "native": "sleep"
    "notes":
      "n1": "suimin is sleep, the time when a person sleeps. It is written 睡眠 (suimin)."
    "examples":
      "すいみんがたりません。":
        "native": "I am not getting enough sleep."
        "bases":
          "たりません":
            "meaning": "is not enough (polite)"
      "すいみんをとります。":
        "native": "I get sleep."
        "bases":
          "とります":
            "meaning": "take (polite)"
  "ja-2719":
    "native": "insomnia"
    "notes":
      "n1": "fumin is insomnia, not being able to sleep. It is written 不眠 (fumin)."
    "examples":
      "ふみんがつづいています。":
        "native": "My insomnia has continued."
        "bases":
          "つづいて":
            "meaning": "continue (te-form)"
          "います":
            "meaning": "there is (polite)"
      "ふみんのくすりをのみます。":
        "native": "I take medicine for insomnia."
        "bases":
          "のみます":
            "meaning": "drink; take (polite)"
  "ja-2720":
    "native": "lack of sleep"
    "notes":
      "n1": "nebusoku means not having had enough sleep. It is written 寝不足 (nebusoku)."
    "examples":
      "ねぶそくでつかれました。":
        "native": "I was tired from lack of sleep."
        "bases":
          "つかれました":
            "meaning": "was tired (polite)"
      "わたしはねぶそくです。":
        "native": "I am short of sleep."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2721":
    "native": "stress"
    "notes":
      "n1": "sutoresu is stress, the strain a person feels."
    "examples":
      "ストレスがおおいです。":
        "native": "There is a lot of stress."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "ストレスをかんじます。":
        "native": "I feel stress."
        "bases":
          "かんじます":
            "meaning": "feel (polite)"
  "ja-2722":
    "native": "overwork"
    "notes":
      "n1": "karou is overwork, working too hard for too long. It is written 過労 (karou)."
    "examples":
      "かろうでたおれました。":
        "native": "I collapsed from overwork."
        "bases":
          "たおれました":
            "meaning": "collapsed (polite)"
      "かろうにならないでください。":
        "native": "Please do not overwork."
        "bases":
          "ならないで":
            "meaning": "do not become (te-form)"
          "ください":
            "meaning": "(please give)"
  "ja-2723":
    "native": "rest"
    "notes":
      "n1": "kyuuyou is rest, time off to recover the body. It is written 休養 (kyuuyou)."
    "examples":
      "きゅうようがひつようです。":
        "native": "Rest is needed."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "きゅうようをとります。":
        "native": "I take a rest."
        "bases":
          "とります":
            "meaning": "take (polite)"
  "ja-2724":
    "native": "lifestyle habits"
    "notes":
      "n1": "seikatsushuukan means lifestyle habits, the daily habits of food, sleep and exercise. It is written 生活習慣 (seikatsushuukan)."
    "examples":
      "せいかつしゅうかんをかえます。":
        "native": "I change my lifestyle habits."
        "bases":
          "かえます":
            "meaning": "change (polite)"
      "せいかつしゅうかんについてはなします。":
        "native": "I talk about lifestyle habits."
        "bases":
          "ついて":
            "meaning": "about"
          "はなします":
            "meaning": "talk (polite)"
  "ja-2725":
    "native": "no smoking"
    "notes":
      "n1": "kin'en means no smoking, or giving up smoking. It is written 禁煙 (kin'en)."
    "examples":
      "ここはきんえんです。":
        "native": "Smoking is not allowed here."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "きんえんをかんがえています。":
        "native": "I am thinking about giving up smoking."
        "bases":
          "かんがえて":
            "meaning": "think about (te-form)"
          "います":
            "meaning": "there is (polite)"
  "ja-2726":
    "native": "cigarette"
    "notes":
      "n1": "tabako is a cigarette, or tobacco."
    "examples":
      "たばこをすいます。":
        "native": "I smoke cigarettes."
        "bases":
          "すいます":
            "meaning": "smoke (polite)"
      "たばこはやめました。":
        "native": "I gave up cigarettes."
        "bases":
          "やめました":
            "meaning": "gave up (polite)"
  "ja-2727":
    "native": "drinking alcohol"
    "notes":
      "n1": "inshu means drinking alcohol. It is written 飲酒 (inshu)."
    "examples":
      "いんしゅをへらします。":
        "native": "I reduce my drinking."
        "bases":
          "へらします":
            "meaning": "reduce (polite)"
      "いんしゅはからだによくないです。":
        "native": "Drinking is not good for the body."
        "bases":
          "よくない":
            "meaning": "not good"
          "です":
            "meaning": "(to be, polite)"
  "ja-2728":
    "native": "clinic"
    "notes":
      "n1": "shinryoujo is a small clinic, a place where a doctor sees patients. It is written 診療所 (shinryoujo)."
    "examples":
      "しんりょうじょにいきます。":
        "native": "I go to the clinic."
        "bases":
          "いきます":
            "meaning": "go (polite)"
      "しんりょうじょはあそこです。":
        "native": "The clinic is over there."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2729":
    "native": "patient"
    "notes":
      "n1": "kanja is a patient, a person who receives medical care. It is written 患者 (kanja)."
