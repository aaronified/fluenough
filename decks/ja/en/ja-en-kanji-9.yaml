schema: 1
id: "ja-en-kanji-9"
kind: "layer"
core: "ja-kanji-9"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 9: grade 2, part 5"
description: "Thirty-two kanji of the second school grade, each taught by the kana reading of the word it stands for. Some have one example or none yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-5420":
    native: "meat"
    notes:
      "n1": "肉 (niku): on reading ニク (niku); no kun reading. It is in にく (niku), meat."
    examples:
      "肉はおいしいです。": "Meat is delicious."
      "わたしは肉がすきです。": "I like meat."
  "ja-5421":
    native: "horse"
    notes:
      "n1": "馬 (uma): on reading バ (ba); kun reading うま (uma). It is in うま (uma), horse."
    examples:
      "馬はおおきいです。": "The horse is big."
      "わたしは馬がすきです。": "I like horses."
  "ja-5422":
    native: "to sell"
    notes:
      "n1": "売 (uru): on reading バイ (bai); kun readings うる (uru) and うれる (ureru). It is in うる (uru), to sell."
    examples:
      "わたしはぱんを売ります。": "I sell bread."
  "ja-5423":
    native: "to buy"
    notes:
      "n1": "買 (kau): on reading バイ (bai); kun reading かう (kau). It is in かう (kau), to buy."
    examples:
      "わたしはりんごを買います。": "I buy apples."
      "ともだちはぱんを買います。": "My friend buys bread."
  "ja-5424":
    native: "wheat"
    notes:
      "n1": "麦 (mugi): on reading バク (baku); kun reading むぎ (mugi). It is in むぎ (mugi), wheat."
  "ja-5425":
    native: "half"
    notes:
      "n1": "半 (hanbun): on reading ハン (han); kun reading なかば (nakaba). It is in 半分 (hanbun), half."
    examples:
      "りんごを半分たべます。": "I eat half of an apple."
      "みずを半分のみます。": "I drink half of the water."
  "ja-5426":
    native: "number"
    notes:
      "n1": "番 (bangou): on reading バン (ban); no kun reading. It is in ばんごう (bangou), a number."
    examples:
      "わたしはにほんごが一番すきです。": "I like Japanese the most."
  "ja-5427":
    native: "my father"
    notes:
      "n1": "父 (chichi): on reading フ (fu); kun reading ちち (chichi). It is in お父さん (otousan), your father."
    examples:
      "父はかいしゃいんです。": "My father is an office worker."
      "お父さんはいしゃです。": "Your father is a doctor."
  "ja-5428":
    native: "wind"
    notes:
      "n1": "風 (kaze): on reading フウ (fuu); kun reading かぜ (kaze). It is in 台風 (taifuu), a typhoon, where this kanji is the wind; the taught word かぜ (kaze), a cold, is spelled differently."
    examples:
      "台風ははげしいです。": "The typhoon is fierce."
  "ja-5429":
    native: "to understand"
    notes:
      "n1": "分 (wakaru): on readings ブン (bun), フン (fun) and ブ (bu); kun readings わける (wakeru), わかれる (wakareru), わかる (wakaru) and わかつ (wakatsu). It is in 分かる (wakaru), to understand."
    examples:
      "わたしはにほんごが分かりません。": "I do not understand Japanese."
      "えいごが分かります。": "I understand English."
  "ja-5430":
    native: "to hear; to listen; to ask"
    notes:
      "n1": "聞 (kiku): on readings ブン (bun) and モン (mon); kun readings きく (kiku) and きこえる (kikoeru). It is in 聞く (kiku), to listen."
    examples:
      "えいごを聞きます。": "I listen to English."
      "せんせいに聞きます。": "I ask the teacher."
  "ja-5431":
    native: "uncooked rice"
    notes:
      "n1": "米 (kome): on readings ベイ (bei) and マイ (mai); kun reading こめ (kome). It is in こめ (kome), uncooked rice."
    examples:
      "米はたかいです。": "Rice is expensive."
      "わたしは米がすきです。": "I like rice."
  "ja-5432":
    native: "to walk"
    notes:
      "n1": "歩 (aruku): on readings ホ (ho) and ブ (bu); kun readings あゆむ (ayumu) and あるく (aruku). It is in 歩く (aruku), to walk."
    examples:
      "まいにち歩きます。": "I walk every day."
      "ともだちと歩きます。": "I walk with my friend."
  "ja-5433":
    native: "my mother"
    notes:
      "n1": "母 (haha): on reading ボ (bo); kun reading はは (haha). It is in お母さん (okaasan), your mother."
    examples:
      "母はいしゃです。": "My mother is a doctor."
      "お母さんはかんごしです。": "Your mother is a nurse."
  "ja-5434":
    native: "person (polite); direction"
    notes:
      "n1": "方 (kata): on reading ホウ (hou); kun reading かた (kata). It is in かた (kata), a person (polite)."
    examples:
      "あの方はせんせいです。": "That person is a teacher."
      "どの方がせんせいですか。": "Which person is the teacher?"
  "ja-5435":
    native: "north"
    notes:
      "n1": "北 (kita): on reading ホク (hoku); kun reading きた (kita). It is in きた (kita), north."
    examples:
      "北に行きます。": "I go to the north."
      "北はさむいです。": "It is cold in the north."
  "ja-5436":
    native: "every day"
    notes:
      "n1": "毎 (mainichi): on reading マイ (mai); no kun reading. It is in 毎日 (mainichi), every day."
    examples:
      "毎日みずをのみます。": "I drink water every day."
      "毎週がっこうに行きます。": "I go to school every week."
  "ja-5437":
    native: "my younger sister"
    notes:
      "n1": "妹 (imouto): on reading マイ (mai); kun reading いもうと (imouto). It is in いもうと (imouto), my younger sister."
    examples:
      "妹はちいさいです。": "My younger sister is small."
      "妹はがくせいです。": "My younger sister is a student."
  "ja-5438":
    native: "ten thousand"
    notes:
      "n1": "万 (man): on readings マン (man) and バン (ban); no kun reading. It is in 十万 (juuman), a hundred thousand."
    examples:
      "十万はたかいです。": "A hundred thousand is expensive."
      "百万えんはたかいです。": "A million yen is expensive."
  "ja-5439":
    native: "bright"
    notes:
      "n1": "明 (akarui): on readings メイ (mei) and ミョウ (myou); kun readings あかり (akari), あかるい (akarui), あかるむ (akarumu), あからむ (akaramu), あきらか (akiraka), あける (akeru), あく (aku), あくる (akuru) and あかす (akasu). It is in 明るい (akarui), bright."
    examples:
      "そとは明るいです。": "It is bright outside."
      "明日はやすみです。": "Tomorrow is a day off."
  "ja-5440":
    native: "to chirp"
    notes:
      "n1": "鳴 (naku): on reading メイ (mei); kun readings なく (naku), なる (naru) and ならす (narasu). It is in なく (naku), to chirp."
  "ja-5441":
    native: "hair"
    notes:
      "n1": "毛 (ke): on reading モウ (mou); kun reading け (ke). It is in け (ke), hair."
  "ja-5442":
    native: "gate"
    notes:
      "n1": "門 (mon): on reading モン (mon); kun reading かど (kado). It is in もん (mon), a gate."
  "ja-5443":
    native: "night; evening"
    notes:
      "n1": "夜 (yoru): on reading ヤ (ya); kun readings よ (yo) and よる (yoru). It is in よる (yoru), night."
    examples:
      "夜はしずかです。": "The night is quiet."
      "夜ねます。": "I sleep at night."
  "ja-5444":
    native: "vegetables"
    notes:
      "n1": "野 (yasai): on reading ヤ (ya); kun reading の (no). It is in やさい (yasai), vegetables."
  "ja-5445":
    native: "friend"
    notes:
      "n1": "友 (tomodachi): on reading ユウ (yuu); kun reading とも (tomo). It is in ともだち (tomodachi), a friend."
  "ja-5446":
    native: "errand; business matter"
    notes:
      "n1": "用 (youji): on reading ヨウ (you); kun reading もちいる (mochiiru). It is in ようじ (youji), an errand."
  "ja-5447":
    native: "Sunday"
    notes:
      "n1": "曜 (nichiyoubi): on reading ヨウ (you); no kun reading. It is in 日曜日 (nichiyoubi), Sunday."
    examples:
      "日曜日はやすみです。": "Sunday is a day off."
      "月曜日はいそがしいです。": "Monday is busy."
  "ja-5448":
    native: "to come"
    notes:
      "n1": "来 (kuru): on reading ライ (rai); kun readings くる (kuru), きたる (kitaru) and きたす (kitasu). It is in 来る (kuru), to come."
    examples:
      "あした来ます。": "I will come tomorrow."
      "ともだちが来ます。": "My friend is coming."
  "ja-5449":
    native: "village; home town"
    notes:
      "n1": "里 (sato): on reading リ (ri); kun reading さと (sato). It is in さと (sato), a village."
  "ja-5450":
    native: "reason"
    notes:
      "n1": "理 (riyuu): on reading リ (ri); no kun reading. It is in りゆう (riyuu), a reason."
  "ja-5451":
    native: "to speak; to talk"
    notes:
      "n1": "話 (hanasu): on reading ワ (wa); kun readings はなす (hanasu) and はなし (hanashi). It is in 話す (hanasu), to talk."
    examples:
      "ともだちと話します。": "I talk with my friend."
      "にほんごを話します。": "I speak Japanese."
