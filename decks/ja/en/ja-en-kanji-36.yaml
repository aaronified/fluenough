schema: 1
id: "ja-en-kanji-36"
kind: "layer"
core: "ja-kanji-36"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 36: grade 6, part 5"
description: "Twenty-seven kanji of the sixth school grade, each taught by the kana reading of the word it stands for. Nine have no example yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-7040":
    native: "the next day"
    notes:
      "n1": "翌 (yokujitsu): on reading ヨク (yoku); no kun reading. It is not a word on its own, so its kana よくじつ (yokujitsu), the next day, is the commonest word it begins, written 翌日 (yokujitsu). No taught card has that kana. No example is given, because 翌日 (yokujitsu) is not a taught card."
  "ja-7041":
    native: "brain"
    notes:
      "n1": "脳 (nou): on reading ノウ (nou); no kun reading. Its kana のう (nou), brain, is the word it stands for alone, written 脳 (nou). The taught card のう (nou), brain, from ja-health, is the same word 脳 (nou). Its example is 脳は大切です (nou wa taisetsu desu), where 大切 (taisetsu), important, is the taught card たいせつ (taisetsu) from ja-adjectives-2, は (wa) is the taught particle, and です (desu) is the taught copula."
    examples:
      "脳は大切です。": "The brain is important."
  "ja-7042":
    native: "remarkable"
    notes:
      "n1": "著 (ichijirushii): on reading チョ (cho); kun readings あらわ-す (arawa-su) and いちじる-しい (ichijiru-shii). The card uses いちじるしい (ichijirushii), remarkable, the kun word it stands for, written 著しい (ichijirushii). The other kun reading あらわ-す (arawa-su) is not used for the card. No taught card has that kana. No example is given, because 著しい (ichijirushii) is not a taught card."
  "ja-7043":
    native: "eyesight"
    notes:
      "n1": "視 (shiryoku): on reading シ (shi); no kun reading. It is not a word on its own, so its kana しりょく (shiryoku), eyesight, is the commonest word it begins, written 視力 (shiryoku). No taught card has that kana. No example is given, because 視力 (shiryoku) is not a taught card."
  "ja-7044":
    native: "to visit"
    notes:
      "n1": "訪 (otozureru): on reading ホウ (hou); kun readings おとず-れる (otozu-reru) and たず-ねる (tazu-neru). The card uses おとずれる (otozureru), to visit, the kun word it stands for, written 訪れる (otozureru). The taught card おとずれる (otozureru), to visit, from ja-travel, is the same word 訪れる (otozureru). The other kun reading たず-ねる (tazu-neru) is not used for the card, because the taught card たずねる (tazuneru), to ask, from ja-verbs-3, is a different word. Its example is 私は京都を訪れました (watashi wa kyouto o otozuremashita), where 私 (watashi) is the taught kanji card わたし (watashi) from ja-kanji-33, は (wa) and を (o) are taught particles, 京都 (kyouto), Kyoto, is the taught card きょうと (kyouto) from ja-transport, and 訪れました (otozuremashita) is the past masu form of the card."
    examples:
      "私は京都を訪れました。": "I visited Kyoto."
  "ja-7045":
    native: "reason"
    notes:
      "n1": "訳 (wake): on reading ヤク (yaku); kun reading わけ (wake). The card uses わけ (wake), reason, the kun word it stands for alone, written 訳 (wake). No taught card has that kana. Its example is 通訳は必要です (tsuuyaku wa hitsuyou desu), where 通訳 (tsuuyaku), interpreter, is the taught card つうやく (tsuuyaku) from ja-travel, written with the taught kanji 通 (tsuu) and this deck's 訳 (yaku), は (wa) is the taught particle, 必要 (hitsuyou), necessary, is the taught card ひつよう (hitsuyou) from ja-adjectives-2, and です (desu) is the taught copula."
    examples:
      "通訳は必要です。": "An interpreter is needed."
  "ja-7046":
    native: "mail; post"
    notes:
      "n1": "郵 (yuubin): on reading ユウ (yuu); no kun reading. It is not a word on its own, so its kana ゆうびん (yuubin), mail, is the commonest word it begins, written 郵便 (yuubin). The taught card ゆうびん (yuubin), mail; post, from ja-services, is the same word 郵便 (yuubin). It is in 郵便局 (yuubinkyoku), post office."
    examples:
      "郵便局は近いです。": "The post office is near."
      "郵便はおそいです。": "The mail is slow."
  "ja-7047":
    native: "home district"
    notes:
      "n1": "郷 (kyoudo): on readings キョウ (kyou) and ゴウ (gou); no kun reading. The card uses きょうど (kyoudo), home district, the word it begins, written 郷土 (kyoudo), with the on reading キョウ (kyou). The other on reading ゴウ (gou) is not used for the card. No taught card has that kana. No example is given, because 郷土 (kyoudo) is not a taught card."
  "ja-7048":
    native: "to close"
    notes:
      "n1": "閉 (tojiru): on reading ヘイ (hei); kun readings と-じる (to-jiru), と-ざす (to-zasu), し-める (shi-meru) and し-まる (shi-maru). The card uses とじる (tojiru), to close, the commonest kun word it stands for, written 閉じる (tojiru). The taught card とじる (tojiru), to close, from ja-verbs-3, is the same word 閉じる (tojiru). Its examples are 本を閉じました (hon o tojimashita), where 本 (hon), book, is the taught kanji card ほん (hon) from ja-kanji-4, を (o) is the taught particle, and 閉じました (tojimashita) is the past masu form of the card; and ドアは閉まりました (doa wa shimarimashita), where ドア (doa), door, is the taught card ドア (doa) from ja-loanwords, は (wa) is the taught particle, and 閉まりました (shimarimashita) is the past masu form of the taught card しまる (shimaru) from ja-verbs-3, written 閉まる (shimaru)."
    examples:
      "本を閉じました。": "I closed the book."
      "ドアは閉まりました。": "The door closed."
  "ja-7049":
    native: "to receive humbly"
    notes:
      "n1": "頂 (itadaku): on reading チョウ (chou); kun readings いただ-く (itada-ku) and いただき (itadaki). The card uses いただく (itadaku), to receive humbly, the kun word it stands for, written 頂く (itadaku). The other kun reading いただき (itadaki), summit, is not used for the card. No taught card has that kana. Its example is お茶を頂きます (ocha o itadakimasu), where お茶 (ocha), tea, is the taught card おちゃ (ocha) from ja-market, written with the taught kanji 茶 (cha), を (o) is the taught particle, and 頂きます (itadakimasu) is the taught phrase card いただきます (itadakimasu) from ja-phrasebook, written with this deck's 頂 (itada)."
    examples:
      "お茶を頂きます。": "I will have some tea."
  "ja-7050":
    native: "to break"
    notes:
      "n1": "割 (waru): on reading カツ (katsu); kun readings わ-る (wa-ru), わり (wari), わ-れる (wa-reru) and さ-く (sa-ku). The card uses わる (waru), to break, the commonest kun word it stands for, written 割る (waru). No taught card has that kana. It is in 割引 (waribiki), discount."
    examples:
      "割引は大きいです。": "The discount is big."
      "時間割は大切です。": "The timetable is important."
  "ja-7051":
    native: "creation; creative work"
    notes:
      "n1": "創 (sousaku): on reading ソウ (sou); kun reading つく-る (tsuku-ru), which the card does not use. It is not a word on its own, so its kana そうさく (sousaku), creation, is a common word it begins, written 創作 (sousaku). No taught card has that kana. No example is given, because 創作 (sousaku) is not a taught card."
  "ja-7052":
    native: "to work for; to serve"
    notes:
      "n1": "勤 (tsutomeru): on reading キン (kin), and the parenthesised reading ゴン (gon) is a special or very narrow use; kun readings つと-める (tsutome-ru) and つと-まる (tsutoma-ru). The card uses つとめる (tsutomeru), to work for; to serve, the kun word it stands for, written 勤める (tsutomeru). The taught card つとめる (tsutomeru), to work for (a company); to serve, from ja-work, is the same word 勤める (tsutomeru). The taught kanji card 務 (tsutomeru), to serve in a post, from ja-kanji-28, is written 務める (tsutomeru) and is a different word. The kun reading つと-まる (tsutoma-ru) is not used for the card. Its examples are あしたは出勤します (ashita wa shukkin shimasu), where あした (ashita), tomorrow, is the taught card あした (ashita) from ja-time, は (wa) is the taught particle, 出勤 (shukkin), going to work, is the taught card しゅっきん (shukkin) from ja-work, and します (shimasu) is the masu form of the taught card する (suru) from ja-everyday-verbs, written する (suru); and 勤務は大変です (kinmu wa taihen desu), where 勤務 (kinmu), duty, is the taught card きんむ (kinmu) from ja-workplace, は (wa) is the taught particle, 大変 (taihen), hard, is the taught card たいへん (taihen) from ja-work, and です (desu) is the taught copula."
    examples:
      "あしたは出勤します。": "I go to work tomorrow."
      "勤務は大変です。": "Duty is hard."
  "ja-7053":
    native: "improvement"
    notes:
      "n1": "善 (kaizen): on reading ゼン (zen); kun reading よ-い (yo-i), which is a rare form and is not used for the card. The card uses かいぜん (kaizen), improvement, a common word it ends, written 改善 (kaizen), with 善 (zen) as its second kanji. No taught card has that kana. No example is given, because 改善 (kaizen) is not a taught card."
  "ja-7054":
    native: "precious; noble"
    notes:
      "n1": "尊 (toutoi): on reading ソン (son); kun readings たっと-い (tatto-i), とうと-い (touto-i), たっと-ぶ (tatto-bu) and とうと-ぶ (touto-bu). The card uses とうとい (toutoi), precious; noble, the kun adjective it stands for, written 尊い (toutoi). The other kun reading たっと-い (tatto-i) is another form of the same adjective and is not used for the card. The two verbs たっと-ぶ (tatto-bu) and とうと-ぶ (touto-bu) mean to respect and are not used either. No example is given, because 尊敬 (sonkei), respect, is not a taught card."
  "ja-7055":
    native: "to take up a post"
    notes:
      "n1": "就 (tsuku): on reading シュウ (shuu), and the parenthesised reading ジュ (ju) is a special or very narrow use; kun readings つ-く (tsu-ku) and つ-ける (tsu-keru). The card uses つく (tsuku), to take up (a post), the kun word it stands for, written 就く (tsuku). The kun reading つ-ける (tsu-keru) is not used for the card. The taught kanji card 付 (tsuku), to attach; to stick to, from ja-kanji-18, and the taught card つく (tsuku), to arrive, from ja-verbs-3, have the same kana but are different words. It is in 就職 (shuushoku), getting a job."
    examples:
      "就職は大変です。": "Getting a job is hard."
      "友達は就職活動をします。": "My friend is job hunting."
  "ja-7056":
    native: "to display; to show"
    notes:
      "n1": "揮 (hakki): on reading キ (ki); no kun reading. It is not a word on its own, so its kana はっき (hakki), display, is a common word it ends, written 発揮 (hakki), where 揮 (ki) has its on reading. The small tsu ッ (tsu) doubles the k. No taught card has that kana. No example is given, because 発揮 (hakki) is not a taught card."
  "ja-7057":
    native: "to respect"
    notes:
      "n1": "敬 (uyamau): on reading ケイ (kei); kun reading うやま-う (uyama-u). The card uses うやまう (uyamau), to respect, the kun word it stands for, written 敬う (uyamau). No taught card has that kana. Its example is 私は敬語を使います (watashi wa keigo o tsukaimasu), where 私 (watashi) is the taught kanji card わたし (watashi) from ja-kanji-33, は (wa) and を (o) are taught particles, 敬語 (keigo), polite language, is the taught card けいご (keigo) from ja-manners, written with this deck's 敬 (kei) and the taught kanji 語 (go), and 使います (tsukaimasu) is the masu form of the taught card つかう (tsukau) from ja-everyday-verbs, written 使う (tsukau)."
    examples:
      "私は敬語を使います。": "I use polite language."
  "ja-7058":
    native: "evening"
    notes:
      "n1": "晩 (ban): on reading バン (ban); no kun reading. Its kana ばん (ban), evening, is the word it stands for alone, written 晩 (ban). No taught card has that kana. Its examples are 毎晩本を読みます (maiban hon o yomimasu), where 毎晩 (maiban), every evening, is the taught card まいばん (maiban) from ja-daily-life, 本 (hon), book, is the taught kanji card ほん (hon) from ja-kanji-4, を (o) is the taught particle, and 読みます (yomimasu) is the masu form of the taught card よむ (yomu) from ja-everyday-verbs, written 読む (yomu); and 晩ご飯を作ります (bangohan o tsukurimasu), where 晩ご飯 (bangohan), dinner, is the taught card ばんごはん (bangohan) from ja-food, written with this deck's 晩 (ban) and the taught kanji 飯 (han), を (o) is the taught particle, and 作ります (tsukurimasu) is the masu form of the taught card つくる (tsukuru) from ja-everyday-verbs, written 作る (tsukuru)."
    examples:
      "毎晩本を読みます。": "I read a book every evening."
      "晩ご飯を作ります。": "I make dinner."
  "ja-7059":
    native: "stick"
    notes:
      "n1": "棒 (bou): on reading ボウ (bou); no kun reading. Its kana ぼう (bou), stick, is the word it stands for alone, written 棒 (bou). No taught card has that kana. Its example is 相棒は親切です (aibou wa shinsetsu desu), where 相棒 (aibou), partner, is the taught card あいぼう (aibou) from ja-relationships, written with the taught kanji 相 (ai) and this deck's 棒 (bou), は (wa) is the taught particle, 親切 (shinsetsu), kind, is the taught card しんせつ (shinsetsu) from ja-describing, and です (desu) is the taught copula."
    examples:
      "相棒は親切です。": "My partner is kind."
  "ja-7060":
    native: "painful"
    notes:
      "n1": "痛 (itai): on reading ツウ (tsuu); kun readings いた-い (ita-i), いた-む (ita-mu) and いた-める (ita-meru). The card uses いたい (itai), painful, the commonest kun word it stands for, written 痛い (itai). The taught card いたい (itai), painful; hurts, from ja-body, is the same word 痛い (itai). It is in 痛い (itai), painful; hurts."
    examples:
      "頭は痛いです。": "My head hurts."
      "頭痛がします。": "I have a headache."
  "ja-7061":
    native: "line; muscle"
    notes:
      "n1": "筋 (suji): on reading キン (kin); kun reading すじ (suji). The card uses すじ (suji), line; muscle, the kun word it stands for alone, written 筋 (suji). No taught card has that kana. Its example is 筋肉は強いです (kinniku wa tsuyoi desu), where 筋肉 (kinniku), muscle, is the taught card きんにく (kinniku) from ja-health, written with the taught kanji 肉 (niku), は (wa) is the taught particle, 強い (tsuyoi), strong, is the taught card つよい (tsuyoi) from ja-describing, written with the taught kanji 強 (tsuyo) from ja-kanji-5, and です (desu) is the taught copula."
    examples:
      "筋肉は強いです。": "The muscles are strong."
  "ja-7062":
    native: "plan; measure"
    notes:
      "n1": "策 (saku): on reading サク (saku); no kun reading. Its kana さく (saku), plan; measure, is the word it stands for alone, written 策 (saku). The taught card さく (saku), to bloom, from ja-nature, has the same kana but is a different word. Its examples are 対策は必要です (taisaku wa hitsuyou desu), where 対策 (taisaku), countermeasure, is the taught card たいさく (taisaku) from ja-emergencies, は (wa) is the taught particle, 必要 (hitsuyou), necessary, is the taught card ひつよう (hitsuyou) from ja-adjectives-2, and です (desu) is the taught copula; and 政府は政策を作ります (seifu wa seisaku o tsukurimasu), where 政府 (seifu), government, is the taught card せいふ (seifu) from ja-government, は (wa) is the taught particle, 政策 (seisaku), policy, is the taught card せいさく (seisaku) from ja-government, written with this deck's 策 (saku) and the taught kanji 政 (sei), を (o) is the taught particle, and 作ります (tsukurimasu) is the masu form of the taught card つくる (tsukuru) from ja-everyday-verbs, written 作る (tsukuru)."
    examples:
      "対策は必要です。": "A countermeasure is needed."
      "政府は政策を作ります。": "The government makes policy."
  "ja-7063":
    native: "the masses"
    notes:
      "n1": "衆 (taishuu): on reading シュウ (shuu), and the parenthesised reading シュ (shu) is a special or very narrow use; no kun reading. The card uses たいしゅう (taishuu), the masses, the common word it ends, written 大衆 (taishuu). No taught card has that kana. Its example is 公衆電話を使います (koushuu denwa o tsukaimasu), where 公衆電話 (koushuu denwa), public telephone, is the taught card こうしゅうでんわ (koushuu denwa) from ja-phone, written with the taught kanji 公 (kou), this deck's 衆 (shuu), the taught kanji 電 (den) and 話 (wa), を (o) is the taught particle, and 使います (tsukaimasu) is the masu form of the taught card つかう (tsukau) from ja-everyday-verbs, written 使う (tsukau)."
    examples:
      "公衆電話を使います。": "I use a public telephone."
  "ja-7064":
    native: "to judge"
    notes:
      "n1": "裁 (sabaku): on reading サイ (sai); kun readings た-つ (ta-tsu) and さば-く (saba-ku). The card uses さばく (sabaku), to judge, the kun word it stands for, written 裁く (sabaku). The taught card さばく (sabaku), desert, from ja-nature has the same kana but is a different word. The kun reading た-つ (ta-tsu) is not used for the card. Its examples are 裁判は長いです (saiban wa nagai desu), where 裁判 (saiban), trial, is the taught card さいばん (saiban) from ja-law, は (wa) is the taught particle, 長い (nagai), long, is the taught kanji card 長 (nagai) from ja-kanji-8 with the kana ながい (nagai), and です (desu) is the taught copula; and 私は裁判を受けました (watashi wa saiban o ukemashita), where 私 (watashi) is the taught kanji card わたし (watashi) from ja-kanji-33, は (wa) is the taught particle, 裁判 (saiban) is the taught card さいばん (saiban), を (o) is the taught particle, and 受けました (ukemashita) is the past masu form of the taught card うける (ukeru) from ja-verbs-3."
    examples:
      "裁判は長いです。": "The trial is long."
      "私は裁判を受けました。": "I faced a trial."
  "ja-7065":
    native: "to dress up"
    notes:
      "n1": "装 (yosoou): on readings ソウ (sou) and ショウ (shou); kun reading よそお-う (yosoo-u). The card uses よそおう (yosoou), to dress up, the kun word it stands for, written 装う (yosoou). No taught card has that kana. Its example is 装置は新しいです (souchi wa atarashii desu), where 装置 (souchi), device, is the taught card そうち (souchi) from ja-technology, は (wa) is the taught particle, 新しい (atarashii), new, is the taught card あたらしい (atarashii) from ja-describing, written with the taught kanji 新 (atarashi) from ja-kanji-7, and です (desu) is the taught copula."
    examples:
      "装置は新しいです。": "The device is new."
  "ja-7066":
    native: "to make up for"
    notes:
      "n1": "補 (oginau): on reading ホ (ho); kun reading おぎな-う (oginau). The card uses おぎなう (oginau), to make up for, the kun word it stands for, written 補う (oginau). No taught card has that kana. No example is given, because 補う (oginau) is not a taught card."
