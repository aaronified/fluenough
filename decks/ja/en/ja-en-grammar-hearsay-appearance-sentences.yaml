cards:
  "ja-4553":
    native: "I hear that my friend will come tomorrow."
    bases:
      "は": { meaning: "(marks the topic)" }
    confusables:
      w1: { why: "いく (iku) means to go." }
      w2: { why: "かえる (kaeru) means to return home; to go home." }
  "ja-4554":
    native: "My friend looks as if he will sleep."
    bases:
      "は": { meaning: "(marks the topic)" }
    confusables:
      w1: { why: "おきる (okiru) means to get up; to wake up." }
      w2: { why: "あそぶ (asobu) means to play." }
  "ja-4555":
    native: "It seems that my friend watches films."
    bases:
      "は": { meaning: "(marks the topic)" }
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "きく (kiku) means to listen; to hear; to ask." }
      w2: { why: "よむ (yomu) means to read." }
  "ja-4556":
    native: "I gather that my father reads books."
    bases:
      "は": { meaning: "(marks the topic)" }
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "かく (kaku) means to write." }
      w2: { why: "きく (kiku) means to listen; to hear; to ask." }
  "ja-4557":
