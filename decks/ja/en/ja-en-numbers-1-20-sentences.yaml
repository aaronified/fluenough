"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Numbers in sentences"
"license": "CC-BY-SA-4.0"
"description": "Six sentences with numbers, to put in order, each with the words it could be mistaken for. Not yet checked by a Japanese speaker: please report any mistake."
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "ja-0262":
    "native": "Five and six are eleven."
    "bases":
      "と":
        "meaning": "and (joins two words)"
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "is (polite)"
    "confusables":
      "w1":
        "why": "さん (san) is three, but the sentence is about five, six and eleven."
      "w2":
        "why": "じゅう (juu) is ten, not eleven: じゅういち (juuichi) is eleven."
  "ja-0263":
    "native": "Four and four are eight."
    "bases":
      "と":
        "meaning": "and (joins two words)"
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "is (polite)"
    "confusables":
      "w1":
        "why": "ろく (roku) is six, and the sentence only has よん (yon) four."
      "w2":
        "why": "なな (nana) is seven, not eight."
  "ja-0264":
    "native": "How many dogs are there?"
    "bases":
      "が":
        "meaning": "(marks the subject)"
      "います":
        "meaning": "to be (of people and animals)"
      "か":
        "meaning": "(marks a question)"
    "confusables":
      "w1":
        "why": "いくら (ikura) asks how much, not how many."
      "w2":
        "why": "どれ (dore) asks which one, not how many."
  "ja-0265":
    "native": "Seven and three are ten."
    "bases":
      "と":
        "meaning": "and (joins two words)"
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "is (polite)"
    "confusables":
      "w1":
        "why": "はち (hachi) is eight, not ten."
      "w2":
        "why": "きゅう (kyuu) is nine, not ten."
  "ja-0266":
    "native": "How much is fifteen?"
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "is (polite)"
      "か":
        "meaning": "(marks a question)"
    "confusables":
      "w1":
        "why": "どの (dono) asks which, before a noun; the sentence asks how much."
      "w2":
        "why": "いくつ (ikutsu) asks how many, not how much."
  "ja-0267":
    "native": "One and two are three."
    "bases":
      "と":
        "meaning": "and (joins two words)"
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "is (polite)"
    "confusables":
      "w1":
        "why": "よっつ (yottsu) is four things, not three."
      "w2":
        "why": "いつつ (itsutsu) is five things, not three."
