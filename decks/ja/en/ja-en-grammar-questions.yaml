  slot_name: "form"
  slots:
    "question": "is it {meaning}?"
    "negative-question": "is it not {meaning}?"
rules:
  "ja-rule-question-ka":
    name: "か (ka): a question"
    explanation: "{1} at the end of a sentence turns it into a yes-no question: {2} means are you a student? After a negative it asks, isn't it?"
