name: "Yes-no questions with か (ka)"
description: "A question is made by adding か (ka) at the end of a sentence: がくせいですか (gakusei desu ka), is it a student? Every noun a course deck teaches has a row. Not yet checked by a Japanese speaker: please report any mistake."
