"cards":
  "ja-2813":
    "native": "I am happy."
    "bases":
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "happiness, a noun, not the adjective"
      "w2":
        "why": "joy, a noun"
  "ja-2814":
    "native": "My friend is grieving."
    "bases":
      "かなしんで":
        "meaning": "grieve (te-form)"
      "います":
        "meaning": "there is (polite)"
    "confusables":
      "w1":
        "why": "sadness, a noun, not the verb"
      "w2":
        "why": "worried, not grieving"
  "ja-2815":
    "notes":
      "n1": "で (de) after a noun can give the cause: 君 (kimi) の (no) せい (sei) で (de), because of you; here, because of the work."
    "native": "I went out in a flurry from work."
    "bases":
      "あわてて":
        "meaning": "panic; to be flustered (te-form)"
      "でかけました":
        "meaning": "go out (polite past)"
    "confusables":
      "w1":
        "why": "rushing, not panicking"
      "w2":
        "why": "calm, the opposite"
  "ja-2816":
    "native": "Please calm down."
    "bases":
      "おちついて":
        "meaning": "calm down (te-form)"
      "ください":
        "meaning": "(please give)"
    "confusables":
      "w1":
        "why": "nervousness, a noun"
      "w2":
        "why": "relaxed, not calm"
  "ja-2817":
    "native": "I was moved by the film."
    "bases":
      "しました":
        "meaning": "did (polite)"
    "confusables":
      "w1":
        "why": "excitement, not being moved"
      "w2":
        "why": "surprise, a noun"
  "ja-2818":
    "native": "He envies me."
    "bases":
      "ねたんで":
        "meaning": "envy (te-form)"
      "います":
        "meaning": "there is (polite)"
    "confusables":
      "w1":
        "why": "resenting, not envying"
      "w2":
        "why": "hating, a stronger feeling"
  "ja-2819":
    "native": "Please tell me your feelings."
    "bases":
      "つたえて":
        "meaning": "convey; to tell (te-form)"
      "ください":
        "meaning": "(please give)"
    "confusables":
      "w1":
        "why": "heart or mind, a noun"
      "w2":
        "why": "to feel, a verb"
  "ja-2820":
    "native": "The child is afraid."
    "bases":
      "こわがって":
        "meaning": "afraid (te-form)"
      "います":
        "meaning": "there is (polite)"
    "confusables":
      "w1":
        "why": "startled, a sudden surprise"
      "w2":
        "why": "shy, not afraid"
  "ja-2821":
    "native": "I am grateful for your consideration."
    "bases":
      "します":
        "meaning": "do (polite)"
    "confusables":
      "w1":
        "why": "trust, a noun"
      "w2":
        "why": "patience, not gratitude"
  "ja-2822":
    "native": "It is a happy family."
    "bases":
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "happiness, not a family"
      "w2":
        "why": "pleasant, not happy"
  "ja-2823":
    "native": "I was surprised by the new news."
    "bases":
      "ニュース":
        "meaning": "news"
      "おどろきました":
        "meaning": "be surprised (polite past)"
    "confusables":
      "w1":
        "why": "news report, a noun"
      "w2":
        "why": "startled, an adverb"
  "ja-2824":
    "native": "I always spend my time relaxed."
    "bases":
      "すごします":
        "meaning": "spend (polite)"
    "confusables":
      "w1":
        "why": "slowly, not relaxed"
      "w2":
        "why": "to calm down, a verb"
  "ja-2825":
    "native": "I was disappointed with the exam result."
    "bases":
      "けっか":
        "meaning": "result"
      "しました":
        "meaning": "did (polite)"
    "confusables":
      "w1":
        "why": "hope, a noun"
      "w2":
        "why": "regret, a noun"
  "ja-2826":
    "native": "I hold back my anger."
    "bases":
      "します":
        "meaning": "do (polite)"
    "confusables":
      "w1":
        "why": "dissatisfaction, a noun"
      "w2":
        "why": "to endure, a verb"
