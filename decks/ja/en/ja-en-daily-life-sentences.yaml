"cards":
  "ja-1376":
    "native": "I get up early every morning."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "おきます":
        "meaning": "to get up (polite)"
    "confusables":
      "w1":
        "why": "ねる (neru) is to sleep, the opposite of getting up."
      "w2":
        "why": "やすむ (yasumu) is to rest or to take a day off."
  "ja-1377":
    "native": "Every evening I take a shower and then go to sleep."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "あびて":
        "meaning": "take a shower (te form)"
      "から":
        "meaning": "after (doing it)"
      "ねます":
        "meaning": "to sleep (polite)"
    "confusables":
      "w1":
        "why": "おふろ (ofuro) is a bath, which you sit in to soak."
      "w2":
        "why": "ねまき (nemaki) are pyjamas."
  "ja-1378":
    "native": "In the morning I eat breakfast and then go to work."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "たべて":
        "meaning": "eat (te form)"
      "に":
        "meaning": "(to, at, in: a place or time)"
      "いきます":
        "meaning": "to go (polite)"
    "confusables":
      "w1":
        "why": "かえる (kaeru) is to go home or to return."
      "w2":
        "why": "ひるごはん (hirugohan) is lunch."
  "ja-1379":
    "native": "I come back from the office and change at once."
    "bases":
      "から":
        "meaning": "from"
      "かえって":
        "meaning": "return, come back (te form)"
      "に":
        "meaning": "(to, at, in: a place or time)"
      "きがえます":
        "meaning": "to change clothes (polite)"
    "confusables":
      "w1":
        "why": "いえ (ie) is a house."
      "w2":
        "why": "でかける (dekakeru) is to go out."
  "ja-1380":
    "native": "At night I slept soundly."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "ねむれました":
        "meaning": "could sleep (polite)"
    "confusables":
      "w1":
        "why": "ねむい (nemui) means sleepy, wanting to sleep."
      "w2":
        "why": "めざまし (mezamashi) is an alarm clock."
  "ja-1381":
    "notes":
      "n1": "たいへん (taihen) で (de) gives the reason, as から (kara) does: here, because the work was hard."
    "native": "Today I got tired because the work was hard."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "が":
        "meaning": "(marks the subject)"
      "で":
        "meaning": "(at, by, with: a place or means)"
      "つかれました":
        "meaning": "got tired (polite)"
    "confusables":
      "w1":
        "why": "いそがしい (isogashii) is busy, with a lot to do."
      "w2":
        "why": "ひま (hima) is free time, with nothing to do."
  "ja-1382":
    "native": "I put my things in the bag and go out."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "に":
        "meaning": "(to, at, in: a place or time)"
      "いれて":
        "meaning": "put in (te form)"
      "でかけます":
        "meaning": "go out (polite)"
    "confusables":
      "w1":
        "why": "さいふ (saifu) is a wallet."
      "w2":
        "why": "わすれもの (wasuremono) is something you have forgotten."
  "ja-1383":
    "notes":
      "n1": "After the te form, ください (kudasai) asks someone to do something for you; it is the polite form of くれ (kure), give."
    "native": "Please tell me your plan for tomorrow."
    "bases":
      "の":
        "meaning": "(links two nouns: of, 's)"
      "を":
        "meaning": "(marks the thing acted on)"
      "おしえて":
        "meaning": "tell (te form)"
      "ください":
        "meaning": "please (do)"
    "confusables":
      "w1":
        "why": "れんらく (renraku) is contact, getting in touch."
      "w2":
        "why": "かいぎ (kaigi) is a meeting."
  "ja-1384":
    "native": "I write a letter to my friend."
    "bases":
      "に":
        "meaning": "(to, at, in: a place or time)"
      "を":
        "meaning": "(marks the thing acted on)"
      "かきます":
        "meaning": "to write (polite)"
    "confusables":
      "w1":
        "why": "でんわ (denwa) is a telephone or a phone call."
      "w2":
        "why": "えいが (eiga) is a film."
  "ja-1385":
    "native": "My life is busy, but it is fun."
    "bases":
      "の":
        "meaning": "(links two nouns: of, 's)"
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "is (polite)"
      "が":
        "meaning": "(marks the subject)"
    "confusables":
      "w1":
        "why": "ひま (hima) is free time, with nothing to do."
      "w2":
        "why": "つまらない (tsumaranai) means boring."
