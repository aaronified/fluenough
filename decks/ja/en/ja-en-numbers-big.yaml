core: "ja-numbers-big"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Tens and big numbers"
description: "Hundreds, thousands, ten thousands, a million and a hundred million, the tens from thirty to ninety, and words for zero, numbers and money. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "ja-0738":
    native: "a hundred; 100"
    notes:
      "n1": "ひゃく (hyaku) is 100. Two hundred is にひゃく (nihyaku)."
    examples:
      "ひゃくえんです。":
        native: "It is 100 yen."
        bases:
          "です":
            meaning: "is (polite)"
      "ひゃくはおおきいです。":
        native: "It is big."
        bases:
          "は":
            meaning: "(marks the topic)"
          "です":
            meaning: "is (polite)"
