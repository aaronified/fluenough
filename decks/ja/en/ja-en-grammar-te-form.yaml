"name": "The te-form: verbs joined with て (te)"
"description": "The te-form is the verb form that joins actions (I got up, washed and went out) and makes requests. It ends in て (te) or で (de), and how the verb changes depends on its group: an ichidan verb drops る (ru), a godan verb changes its last sound, and する (suru) and くる (kuru) are irregular. Every verb a course deck teaches has a row. Not yet checked by a Japanese speaker: please report any mistake."
