"rules":
  "ja-rule-te-form":
    "name": "The te-form"
    "explanation": "The te-form ends in {1} or で (de). An ichidan verb drops る (ru) and adds {1}: たべる (taberu) becomes {2}. A godan verb changes its last sound: く (ku) becomes いて (ite), as in {3}; ぐ (gu) becomes いで (ide), as in {4}; す (su) becomes して (shite), as in {5}; む (mu), ぶ (bu) and ぬ (nu) become んで (nde), as in {6}; う (u), つ (tsu) and る (ru) become って (tte), as in {7}. いく (iku) is the one exception: {8}, not いいて (iite). くる (kuru) becomes {9} and する (suru) becomes {10}."
  "ja-rule-te-ending":
    "name": "The te-form endings"
    "explanation": "The ending depends on the last sound of a godan verb: {2} after く (ku), {3} after ぐ (gu), {4} after す (su), {5} after む (mu), ぶ (bu) or ぬ (nu), and {6} after う (u), つ (tsu) or る (ru). An ichidan verb takes {1}. Two verbs break the pattern: いく (iku) takes {6}, and くる (kuru) becomes きて (kite)."
