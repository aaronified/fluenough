  - "id": "ja-religion-2"
    "title": "A funeral"
    "sentences":
      - "text": "きのう、そうしきに でました。"
        "reading": "kinou, soushiki ni demashita."
      - "text": "おぼうさんが おきょうを よみました。"
        "reading": "obousan ga okyou o yomimashita."
      - "text": "ぶつだんに、おそなえを しました。"
        "reading": "butsudan ni, osonae o shimashita."
      - "text": "わたしは、ほとけに てを あわせました。"
        "reading": "watashi wa, hotoke ni te o awasemashita."
