name: "Polite and very polite: でした (deshita), でございます (de gozaimasu), ございます (gozaimasu) and でしょう (deshou)"
description: "The polite level, 丁寧語 (teineigo), and its very polite end. です (desu) and あります (arimasu) become でございます (de gozaimasu) and ございます (gozaimasu) when staff speak to a guest, でした (deshita) and ありました (arimashita) say it was, and でしょう (deshou) says probably. Not yet checked by a Japanese speaker: please report any mistake."
