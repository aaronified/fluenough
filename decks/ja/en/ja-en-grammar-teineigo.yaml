    "dewa-arimasen": "is not (polite)"
    "arimasen": "there is not (polite)"
  notes: "Polite speech, 丁寧語 (teineigo), is the です (desu) and ます (masu) style. Its very polite end is the ございます (gozaimasu) family: です (desu) becomes でございます (de gozaimasu), あります (arimasu) becomes ございます (gozaimasu), and ありません (arimasen) becomes ございません (gozaimasen). Only the base word changes: ございます (gozaimasu) keeps the stem ございま (gozaima), and its ます (masu) turns into ません (masen), ました (mashita) or ませんでした (masen deshita) just as a verb's does. The past of です (desu) is でした (deshita), and the very polite past is でございました (de gozaimashita). でしょう (deshou) follows a noun, as あめでしょう (ame deshou), or plain ある (aru) and ない (nai), and means probably. Staff use the very polite forms to a guest, and you may hear them from anyone on the telephone, but with friends the plain or polite style is the right one."
