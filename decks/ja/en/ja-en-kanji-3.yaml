schema: 1
id: "ja-en-kanji-3"
kind: "layer"
core: "ja-kanji-3"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 3: vehicles, numbers, people and places"
description: "Fifteen kanji of the first school grade, each taught by the kana reading of the word it stands for, with two examples that use only words already taught. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-5060":
    native: "four"
    notes:
      "n1": "四 (よん): on reading シ (shi); kun readings よん (yon) and よっつ (yottsu). It is in 四つ (yottsu), four things."
    examples:
      "四と四ははちです。": "Four and four is eight."
      "四つのりんごはたかいです。": "Four apples are expensive."
  "ja-5061":
    native: "ear"
    notes:
      "n1": "耳 (みみ): on readings ジ (ji) and ニ (ni); kun reading みみ (mimi). It is in 耳 (mimi), ear."
    examples:
      "耳がいたいです。": "My ear hurts."
      "耳はどこですか。": "Where is the ear?"
  "ja-5062":
    native: "seven"
    notes:
      "n1": "七 (なな): on reading シチ (shichi); kun readings ななつ (nanatsu) and なな (nana). It is in 七つ (nanatsu), seven things."
    examples:
      "七とさんはじゅうです。": "Seven and three is ten."
      "七つのバスはおおきいです。": "The seven buses are big."
  "ja-5063":
    native: "vehicle; car"
    notes:
      "n1": "車 (くるま): on reading シャ (sha); kun reading くるま (kuruma). It is in 車 (kuruma), car."
    examples:
      "車はたかいです。": "The car is expensive."
      "わたしの車です。": "It is my car."
  "ja-5064":
    native: "ten"
    notes:
      "n1": "十 (じゅう): on reading ジュウ (juu); kun reading とお (too). It is in 十 (juu), ten."
    examples:
      "十はいくつですか。": "How many is ten?"
      "十はおおきいです。": "Ten is big."
  "ja-5065":
    native: "exit; to go out"
    notes:
      "n1": "出 (でる): on reading シュツ (shutsu); kun reading でる (deru). It is in 出かける (dekakeru), to go out."
    examples:
      "バスは出ますか。": "Does the bus leave?"
      "わたしは出かけます。": "I go out."
  "ja-5066":
    native: "woman; female"
    notes:
      "n1": "女 (おんな): on readings ジョ (jo) and ニョ (nyo); kun reading おんな (onna). It is in 女のひと (onna no hito), woman."
    examples:
      "女はがくせいです。": "The woman is a student."
      "あの女のひとはいしゃです。": "That woman is a doctor."
  "ja-5067":
    native: "small; little"
    notes:
      "n1": "小 (ちいさい): on reading ショウ (shou); kun readings ちいさい (chiisai), こ (ko) and お (o). It is in 小さい (chiisai), small."
    examples:
      "小さいいぬです。": "It is a small dog."
      "わたしのいえは小さいです。": "My house is small."
  "ja-5068":
    native: "top; above"
    notes:
      "n1": "上 (うえ): on reading ジョウ (jou); kun reading うえ (ue). It is in つくえの上 (tsukue no ue), the top of the desk."
    examples:
      "つくえの上はきれいです。": "The top of the desk is clean."
      "上はどこですか。": "Where is the top?"
  "ja-5069":
    native: "forest"
    notes:
      "n1": "森 (もり): on reading シン (shin); kun reading もり (mori). It is in 森 (mori), forest."
    examples:
      "森にいきます。": "I go to the forest."
      "森はきれいです。": "The forest is beautiful."
  "ja-5070":
    native: "person"
    notes:
      "n1": "人 (ひと): on readings ジン (jin) and ニン (nin); kun reading ひと (hito). It is in 人 (hito), person."
    examples:
      "あの人はいしゃです。": "That person is a doctor."
      "人はおおいです。": "There are many people."
  "ja-5071":
    native: "evening"
    notes:
      "n1": "夕 (ゆうがた): on reading セキ (seki); kun reading ゆう (yuu). It is in 夕がた (yuugata), evening."
    examples:
      "夕がたはいそがしいです。": "The evening is busy."
      "夕がたにかえります。": "I go home in the evening."
  "ja-5072":
    native: "thousand"
    notes:
      "n1": "千 (せん): on reading セン (sen); kun reading ち (chi). It is in 千えん (sen en), a thousand yen."
    examples:
      "千えんです。": "It is one thousand yen."
      "千えんはやすいです。": "A thousand yen is cheap."
  "ja-5073":
    native: "river"
    notes:
      "n1": "川 (かわ): on reading セン (sen); kun reading かわ (kawa). It is in 川 (kawa), river."
    examples:
      "川はきれいです。": "The river is beautiful."
      "川にいきます。": "I go to the river."
  "ja-5074":
    native: "early"
    notes:
      "n1": "早 (はやい): on readings ソウ (sou) and サ (sa); kun reading はやい (hayai). It is in 早い (hayai), early."
    examples:
      "早くいきます。": "I go early."
      "早いあさです。": "It is an early morning."
