      w2: { why: "family" }
  "ja-2146":
    native: "Recyclable rubbish is today."
    bases:
      "は": { meaning: "(marks the topic)" }
      "です": { meaning: "is (polite)" }
    confusables:
      w1: { why: "burnable rubbish, another day" }
      w2: { why: "non-burnable rubbish, another day" }
  "ja-2147":
    native: "I line up the shoes neatly."
    bases:
      "は": { meaning: "(marks the topic)" }
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
