  "ja-2145":
    native: "The child helped Mother."
    "notes":
      "n1": "てつだい (tetsudai) is a noun meaning help, as in てつだいをする (tetsudai o suru), to help."
    bases:
      "の": { meaning: "(links two nouns: of, 's)" }
      "を": { meaning: "(marks the thing acted on)" }
