tags: ["beginner", "unreviewed"]
cards:
  "ja-2130":
    native: "I wash the dishes at night."
    "notes":
      "n1": "A part of the day such as よる (yoru, night) may drop に (ni), while a clock time such as ごじ (goji, five o'clock) keeps it."
    bases:
      "は": { meaning: "(marks the topic)" }
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "laundry, not dishes" }
      w2: { why: "rubbish, not dishes" }
  "ja-2131":
    native: "Mother hangs the laundry out on the drying rack."
    "notes":
      "n1": "ほす (hosu, to hang out) takes に (ni) for the place it hangs, as in ものほしにほす (monohoshi ni hosu)."
    bases:
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "dust, not laundry" }
      w2: { why: "clothes peg, not laundry" }
  "ja-2132":
    native: "Taking out the rubbish is tomorrow."
    bases:
      "は": { meaning: "(marks the topic)" }
      "です": { meaning: "is (polite)" }
    confusables:
      w1: { why: "today, not tomorrow" }
      w2: { why: "morning, not a day" }
  "ja-2133":
    native: "I put out the burnable rubbish in the morning."
    "notes":
      "n1": "だす (dasu) means to put out, as rubbish for collection, as in ごみをだす (gomi o dasu)."
    bases:
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "recyclable rubbish, another bin" }
      w2: { why: "non-burnable rubbish, another bin" }
  "ja-2134":
    native: "I wash the plate with a brush."
    "notes":
      "n1": "で (de) marks the tool used, as in たわしで (tawashi de), with a brush."
    bases:
      "は": { meaning: "(marks the topic)" }
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "sponge, not a brush" }
      w2: { why: "water, not a brush" }
  "ja-2135":
    native: "The child got the clothes dirty."
    "notes":
      "n1": "よごす (yogosu, to make dirty) is transitive; its intransitive partner is よごれる (yogoreru, to get dirty)."
    bases:
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "dust, not a stain" }
      w2: { why: "rubbish, not a stain" }
  "ja-2136":
    native: "I tidied the room."
    "notes":
      "n1": "な (na) adjectives become adverbs with に (ni): きれいに (kirei ni) means tidily, as in きれいにしまいました (kirei ni shimaimashita)."
    bases:
      "は": { meaning: "(marks the topic)" }
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "to make a mess, the opposite" }
      w2: { why: "to line up, not to tidy a room" }
  "ja-2137":
    native: "The family did the clearing up."
    "notes":
      "n1": "で (de) marks the group doing the action, as in かぞくで (kazoku de), by the family."
    bases:
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "preparation, not clearing up" }
      w2: { why: "help, not clearing up" }
  "ja-2138":
    native: "Please put the rubbish in the rubbish bag."
    "notes":
      "n1": "いれる (ireru, to put in) takes に (ni) for the container and を (o) for the thing put in."
    bases:
      "を": { meaning: "(marks the thing acted on)" }
      "ください": { meaning: "please (give me)" }
    confusables:
      w1: { why: "to pack, not to put in" }
      w2: { why: "to hand out, not to put in" }
  "ja-2139":
    native: "Where is the detergent?"
    bases:
      "は": { meaning: "(marks the topic)" }
      "あります": { meaning: "is, there is (polite)" }
      "か": { meaning: "(marks a question)" }
    confusables:
      w1: { why: "clothes peg" }
      w2: { why: "iron" }
  "ja-2140":
    native: "The child does not use the cleaning tools."
    bases:
      "は": { meaning: "(marks the topic)" }
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "scrubbing brush" }
      w2: { why: "rubbish bag" }
  "ja-2141":
    native: "I handed out books to my friends."
    "notes":
      "n1": "くばる (kubaru, to hand out) takes に (ni) for the people given to, as in ともだちに (tomodachi ni)."
    bases:
      "は": { meaning: "(marks the topic)" }
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "desk" }
      w2: { why: "dust" }
  "ja-2142":
    native: "The sponge is new."
    bases:
