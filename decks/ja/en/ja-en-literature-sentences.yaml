"cards":
  "ja-8650":
    "native": "Literature is my pleasure."
    "notes":
      "n1": "tanoshimi is a pleasure or a hobby one looks forward to."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "わたし":
        "meaning": "I; me"
      "の":
        "meaning": "(of; belonging to)"
      "たのしみ":
        "meaning": "pleasure; something to look forward to"
      "です":
        "meaning": "to be (polite)"
    "confusables":
      "w1":
        "why": "art, not literature"
      "w2":
        "why": "music, not literature"
  "ja-8651":
    "native": "The novelist writes a new book."
    "notes":
      "n1": "kakimasu is the everyday word for writing, here a book."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "あたらしい":
        "meaning": "new"
      "ほん":
        "meaning": "book"
      "を":
        "meaning": "(marks the thing acted on)"
      "かきます":
        "meaning": "to write (polite)"
    "confusables":
      "w1":
        "why": "a poet writes poems, not novels"
      "w2":
        "why": "the author in general, not a novelist"
  "ja-8652":
    "native": "The author's book is a bestseller."
    "notes":
      "n1": "besutoseraa is the loanword from English, used as it is."
    "bases":
      "の":
        "meaning": "(of; belonging to)"
      "ほん":
        "meaning": "book"
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "to be (polite)"
    "confusables":
      "w1":
        "why": "a great book, not a bestseller"
      "w2":
        "why": "an old classic, not a new bestseller"
  "ja-8653":
    "native": "A haiku needs a season word."
    "notes":
      "n1": "hitsuyou means necessary, and a haiku needs its season word."
    "bases":
      "に":
        "meaning": "(to; in; at)"
      "は":
        "meaning": "(marks the topic)"
      "が":
        "meaning": "(marks the subject)"
      "ひつよう":
        "meaning": "necessary"
      "です":
        "meaning": "to be (polite)"
    "confusables":
      "w1":
        "why": "a poem of five lines, with no season word"
      "w2":
        "why": "a comic poem about people"
  "ja-8654":
    "native": "I look for the title in the table of contents."
    "notes":
      "n1": "sagashimasu means to look for something one has lost or wants."
    "bases":
      "で":
        "meaning": "(at a place; by means of)"
      "を":
        "meaning": "(marks the thing acted on)"
      "さがします":
        "meaning": "to look for (polite)"
    "confusables":
      "w1":
        "why": "a page, not the whole table"
      "w2":
        "why": "a shelf, not a list"
  "ja-8655":
    "native": "Readers read paperbacks."
    "notes":
      "n1": "dokusha is a reader, and the word for a book's reader is used for anyone who reads."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "を":
        "meaning": "(marks the thing acted on)"
      "よみます":
        "meaning": "to read (polite)"
    "confusables":
      "w1":
        "why": "books in general, not a paperback"
      "w2":
        "why": "all works of one author, not one book"
  "ja-8656":
    "native": "A proverb is the wisdom of people long ago."
    "notes":
      "n1": "mukashi means long ago, and no is the particle of possession used twice here."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "むかし":
        "meaning": "old times"
      "の":
        "meaning": "(of; belonging to)"
      "ひと":
        "meaning": "person"
      "ちえ":
        "meaning": "wisdom"
      "です":
        "meaning": "to be (polite)"
    "confusables":
      "w1":
        "why": "a folk tale, not a proverb"
      "w2":
        "why": "a famous quotation, not a proverb"
  "ja-8657":
    "native": "I read manga and picture books."
    "notes":
      "n1": "to joins two nouns, as and is used in a list."
    "bases":
      "と":
        "meaning": "(and; with)"
      "を":
        "meaning": "(marks the thing acted on)"
      "よみます":
        "meaning": "to read (polite)"
    "confusables":
      "w1":
        "why": "a fairy tale for children, not a manga"
      "w2":
        "why": "a classic, not a picture book"
