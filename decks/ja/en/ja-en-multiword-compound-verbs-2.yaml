name: "Multi-word verbs: compound verbs, part 2"
description: "Twelve compound verbs and the verb 合う (au), to match, which joins two of them: だす (dasu) to put out, すぎる (sugiru) too much, あう (au) each other. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ja-4900":
    native: "to find out by asking"
    notes:
      "u1": "The stem of きく (kiku) and だす (dasu): to ask until one finds out. 聞き出す (kikidasu) can also mean to start listening, but it is not 聞く (kiku), to listen, on its own."
  "ja-4901":
    native: "to start writing; to write out"
    notes:
      "u1": "The stem of かく (kaku) and だす (dasu): start writing, or write out a list. 書き出す (kakidasu). Example: わたしは (watashi wa) てがみを (tegami o) かきだしました (kakidashimashita): I started writing a letter."
  "ja-4902":
    native: "to set off; to lean forward"
    notes:
      "u1": "The stem of のる (noru, to ride) and だす (dasu): set off by riding, or lean forward. 乗り出す (noridasu) can also mean to get involved in something new. Example: わたしは (watashi wa) えきで (eki de) くるまに (kuruma ni) のりだしました (noridashimashita): I set off from the station by car."
  "ja-4903":
    native: "to create; to produce"
    notes:
      "u1": "The stem of つくる (tsukuru, to make) and だす (dasu): bring something new into being. 作り出す (tsukuridasu). Example: わたしは (watashi wa) ほんを (hon o) つくりだしました (tsukuridashimashita): I created a book."
  "ja-4904":
    native: "to rush out; to jump out"
    notes:
      "u1": "The stem of とぶ (tobu, to fly) and だす (dasu): rush out of a place, or stick out. 飛び出す (tobidasu). Example: ともだちは (tomodachi wa) えきを (eki o) とびだしました (tobidashimashita): My friend rushed out of the station."
  "ja-4905":
    native: "to find by searching"
    notes:
      "u1": "The stem of さがす (sagasu, to look for) and だす (dasu): search until the thing is found. 探し出す (sagashidasu). Example: わたしは (watashi wa) みせで (mise de) ほんを (hon o) さがしだしました (sagashidashimashita): I searched the shop and found a book."
  "ja-4906":
    native: "to push out; to go out in a crowd"
    notes:
      "u1": "The stem of おす (osu, to push) and だす (dasu): push out. 押し出す (oshidasu) can also mean to go out together in a crowd. Example: わたしは (watashi wa) ほんを (hon o) おしだしました (oshidashimashita): I pushed the book out."
  "ja-4907":
    native: "to start moving"
    notes:
      "u1": "The stem of うごく (ugoku, to move) and だす (dasu): begin to move after standing still. 動き出す (ugokidasu). Example: くるまは (kuruma wa) うごきだしました (ugokidashimashita): The car started to move."
  "ja-4908":
    native: "to eat too much"
    notes:
      "u1": "The stem of たべる (taberu, to eat) and すぎる (sugiru): too much. Example: わたしは (watashi wa) ごはんを (gohan o) たべすぎました (tabesugimashita): I ate too much."
  "ja-4909":
    native: "to sleep too much"
    notes:
      "u1": "The stem of ねる (neru, to sleep) and すぎる (sugiru): too much, for too long. Example: ともだちは (tomodachi wa) きのう (kinou) ねすぎました (nesugimashita): My friend slept too much yesterday."
      "u2": "Plain form. In polite speech, use ねすぎました (nesugimashita) or ねすぎます (nesugimasu)."
  "ja-4910":
    native: "to match; to be in balance"
    notes:
      "u1": "The stem of みる (miru, to see) and 合う (au), to match: match or balance with each other. 見合う (miau). Example: わたしの (watashi no) ふくは (fuku wa) ともだちの (tomodachi no) ふくと (fuku to) みあいます (miaimasu): My clothes match my friend's clothes."
  "ja-4911":
    native: "to talk with each other; to discuss"
    notes:
      "u1": "The stem of はなす (hanasu, to speak) and あう (au), after a verb stem: each other, the same action done together. 話し合う (hanashiau). Example: わたしと (watashi to) ともだちは (tomodachi wa) はなしあいました (hanashiaimashita): My friend and I talked it over."
  "ja-4912":
    native: "to match; to suit; after a verb stem, to do with each other"
    notes:
      "u1": "Two senses. To match or suit: このふくは (kono fuku wa) わたしに (watashi ni) あいます (aimasu): These clothes suit me. After a verb stem, it means doing the action with each other, as in 話し合う (hanashiau) and 見合う (miau)."
      "u2": "Spelled and read the same as あう (au), to meet, 会う (au), but a different word: this one is 合う (au), to match."
