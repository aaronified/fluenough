name: "Multi-word verbs: compound verbs, part 2"
description: "Twelve compound verbs, a verb stem and a second verb: だす (dasu) to put out, すぎる (sugiru) too much, あう (au) each other. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ja-4900":
    native: "to find out by asking"
    notes:
      "u1": "The stem of きく (kiku) and だす (dasu): to get something out by asking. 聞き出す (kikidasu) is not 聞く (kiku), to listen."
  "ja-4901":
    native: "to start writing; to write out"
    notes:
      "u1": "The stem of かく (kaku) and だす (dasu): start writing, or write out a list. 書き出す (kakidasu)."
  "ja-4902":
    native: "to set off; to lean out"
    notes:
      "u1": "The stem of のる (noru, to ride) and だす (dasu): set off by riding, or lean out. 乗り出す (noridasu) is more than the two parts."
  "ja-4903":
    native: "to create; to produce"
    notes:
      "u1": "The stem of つくる (tsukuru, to make) and だす (dasu): bring something new into being. 作り出す (tsukuridasu)."
  "ja-4904":
    native: "to rush out; to jump out"
    notes:
      "u1": "The stem of とぶ (tobu, to fly) and だす (dasu): rush out of a place, or stick out. 飛び出す (tobidasu)."
  "ja-4905":
    native: "to find by searching"
    notes:
      "u1": "The stem of さがす (sagasu, to look for) and だす (dasu): search until the thing is found. 探し出す (sagashidasu)."
  "ja-4906":
    native: "to push out; to go out in a crowd"
    notes:
      "u1": "The stem of おす (osu, to push) and だす (dasu): push out. 押し出す (oshidasu) also means to set out together as a group."
  "ja-4907":
    native: "to start moving"
    notes:
      "u1": "The stem of うごく (ugoku, to move) and だす (dasu): begin to move after standing still. 動き出す (ugokidasu). Example: くるまは (kuruma wa) うごきだしました (ugokidashimashita): The car started to move."
  "ja-4908":
    native: "to eat too much"
    notes:
      "u1": "The stem of たべる (taberu, to eat) and すぎる (sugiru): too much. Example: わたしは (watashi wa) ごはんを (gohan o) たべすぎました (tabesugimashita): I ate too much."
  "ja-4909":
    native: "to sleep too much"
    notes:
      "u1": "The stem of ねる (neru, to sleep) and すぎる (sugiru): too much. Example: ともだちは (tomodachi wa) きのう (kinou) ねすぎました (nesugimashita): My friend slept too much yesterday."
  "ja-4910":
    native: "to look at each other"
    notes:
      "u1": "The stem of みる (miru, to see) and あう (au): each other, not to meet. 見合う (miau). Example: わたしと (watashi to) ともだちは (tomodachi wa) みあいました (miaimashita): My friend and I looked at each other."
  "ja-4911":
    native: "to talk with each other; to discuss"
    notes:
      "u1": "The stem of はなす (hanasu, to speak) and あう (au), each other: talk it over together. 話し合う (hanashiau). Example: わたしと (watashi to) ともだちは (tomodachi wa) はなしあいました (hanashiaimashita): My friend and I talked it over."
