native: { code: "en", iso639_3: "eng", name: "English" }
name: "More verbs"
description: "Thirty more everyday verbs: to bathe, run and dance, to borrow and return, to forget and remember, to help, lose and find, to clean and to cook, to give and to receive. Verbs are given in their polite forms. Not yet checked by a Japanese speaker: please report any mistake."
