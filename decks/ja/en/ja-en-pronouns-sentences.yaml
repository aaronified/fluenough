"kind": "layer"
"core": "ja-pronouns-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Pronouns in sentences"
"license": "CC-BY-SA-4.0"
"description": "Six sentences with the pronouns, to put in order, each with the words it could be mistaken for. Not yet checked by a Japanese speaker: please report any mistake."
"tags":
- "beginner"
- "unreviewed"
"cards":
  "ja-0188":
    "native": "Who is he?"
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "is (polite)"
      "か":
        "meaning": "(marks a question)"
    "confusables":
      "w1":
        "why": "かのじょ (kanojo) is she, not he."
      "w2":
        "why": "なに (nani) asks what, not who."
  "ja-0189":
    "native": "Which one is your dog?"
    "bases":
      "の":
        "meaning": "(links two nouns: of, 's)"
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "is (polite)"
      "か":
        "meaning": "(marks a question)"
    "confusables":
      "w1":
        "why": "どちら (dochira) is for two things; どれ (dore) is for three or more."
      "w2":
        "why": "どの (dono) needs a noun after it, as in どのいぬ (dono inu)."
  "ja-0190":
    "native": "Did someone come?"
    "bases":
      "が":
        "meaning": "(marks the subject)"
      "きました":
        "meaning": "to come (polite past)"
      "か":
        "meaning": "(marks a question)"
    "confusables":
      "w1":
        "why": "どなたか (donataka) is someone, said politely."
      "w2":
        "why": "どなた (donata) is the polite who, not someone."
  "ja-0191":
    "native": "We are friends."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "is (polite)"
    "confusables":
      "w1":
        "why": "わたしたち (watashitachi) is we for anyone; ぼくたち (bokutachi) is we for boys and men."
      "w2":
        "why": "あなたがた (anatagata) is you all, not we."
  "ja-0192":
    "native": "Are the women teachers?"
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "is (polite)"
      "か":
        "meaning": "(marks a question)"
    "confusables":
      "w1":
        "why": "かれら (karera) is they for men or a mixed group."
      "w2":
        "why": "かれ (kare) is he, one man."
  "ja-0193":
    "native": "They are all teachers."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "is (polite)"
    "confusables":
      "w1":
        "why": "かのじょ (kanojo) is one woman, she."
      "w2":
        "why": "かれ (kare) is one man, he."
