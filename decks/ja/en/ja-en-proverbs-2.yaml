schema: 1
id: "ja-en-proverbs-2"
kind: "layer"
core: "ja-proverbs-2"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Proverbs: kotowaza 2"
description: "Twenty more well-known Japanese proverbs of the Edo iroha karuta set, each with its word-for-word meaning and what it is said of. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ja-4750":
    native: "Effort wasted, and a profit that is only tiredness."
    notes:
      "literal": "Said when hard work brings no reward."
    bases:
      "ほねおりぞん": { meaning: "effort lost, labour wasted" }
      "の": { meaning: "(links the two parts: of)" }
      "くたびれもうけ": { meaning: "a profit that is only tiredness" }
  "ja-4751":
    native: "Lapis lazuli and glass both shine when they are lit."
    notes:
      "literal": "Said of excellent things and people that stand out whatever the setting."
    bases:
      "るり": { meaning: "lapis lazuli" }
      "も": { meaning: "(also, even)" }
      "はり": { meaning: "glass" }
      "てらせば": { meaning: "to light (if it is lit)" }
      "ひかる": { meaning: "to shine" }
  "ja-4752":
    native: "A cracked pot gets a matching lid."
    notes:
      "literal": "Said that everyone finds a partner who suits them."
    bases:
      "われなべ": { meaning: "a cracked pot" }
      "に": { meaning: "(for, to)" }
      "とじぶた": { meaning: "a lid that closes it" }
  "ja-4753":
    native: "Looking at the ceiling through a reed's pith."
    notes:
      "literal": "Said of a narrow view that sees only a small part of a matter."
    bases:
      "よし": { meaning: "reed" }
      "の": { meaning: "(of)" }
      "ずい": { meaning: "pith, core" }
      "から": { meaning: "from, through" }
      "てんじょう": { meaning: "ceiling" }
      "のぞく": { meaning: "to peek, to look into" }
  "ja-4754":
    native: "On a journey, a companion; in life, kindness."
    notes:
      "literal": "Said that a companion on the road and kindness towards others get people through hard times."
    bases:
      "たび": { meaning: "journey" }
      "は": { meaning: "(marks the topic)" }
      "みちづれ": { meaning: "a travelling companion" }
      "よ": { meaning: "life, the world" }
      "なさけ": { meaning: "kindness, compassion" }
  "ja-4755":
    native: "If there is ease, there is also hardship."
    notes:
      "literal": "Said that good times and hard times come in turn."
    bases:
      "らく": { meaning: "ease, comfort" }
      "あれば": { meaning: "if there is" }
      "く": { meaning: "hardship, suffering" }
      "あり": { meaning: "there is" }
  "ja-4756":
    native: "If unreasonable force gets through, reason gives way."
    notes:
      "literal": "Said when force wins over what is right."
    bases:
      "むり": { meaning: "unreasonableness, force" }
      "が": { meaning: "(marks the subject)" }
      "とおれば": { meaning: "to pass through (if it passes)" }
      "どうり": { meaning: "reason, logic" }
      "ひっこむ": { meaning: "to withdraw, to give way" }
  "ja-4757":
    native: "A lie that turned out to be true."
    notes:
      "literal": "Said when something said as a lie or in jest turns out to be real."
    bases:
      "うそ": { meaning: "lie" }
      "から": { meaning: "from" }
      "でた": { meaning: "came out" }
      "まこと": { meaning: "truth" }
  "ja-4758":
    native: "Once past the throat, the heat is forgotten."
    notes:
      "literal": "Said of people who forget a hardship once it is over."
    bases:
      "のどもと": { meaning: "throat" }
      "すぎれば": { meaning: "to pass (if it passes)" }
      "あつさ": { meaning: "heat, hotness" }
      "を": { meaning: "(marks the thing acted on)" }
      "わすれる": { meaning: "to forget" }
  "ja-4759":
    native: "A club for an ogre."
    notes:
      "literal": "Said of someone whose strength grows even greater once given an advantage."
    bases:
      "おに": { meaning: "ogre, demon" }
      "に": { meaning: "(for, to)" }
      "かなぼう": { meaning: "an iron club" }
  "ja-4760":
    native: "Buy cheap goods and lose your money."
    notes:
      "literal": "Said that cheap things often cost more in the end."
    bases:
      "やすもの": { meaning: "cheap goods" }
      "がい": { meaning: "buying" }
      "の": { meaning: "(of)" }
      "ぜに": { meaning: "money, coins" }
      "うしない": { meaning: "losing" }
  "ja-4761":
    native: "Carelessness is a great enemy."
    notes:
      "literal": "Said as a warning to stay alert."
    bases:
      "ゆだん": { meaning: "carelessness, being off guard" }
      "たいてき": { meaning: "a great enemy" }
  "ja-4762":
    native: "A lump above one's eye."
    notes:
      "literal": "Said of a person who is always in one's way."
    bases:
      "め": { meaning: "eye" }
      "の": { meaning: "(of)" }
      "うえ": { meaning: "above, on top" }
      "こぶ": { meaning: "lump, bump" }
  "ja-4763":
    native: "Not knowing is Buddha."
    notes:
      "literal": "Said that not knowing an unpleasant truth keeps one at ease."
    bases:
      "しらぬ": { meaning: "not knowing" }
      "が": { meaning: "(marks the subject)" }
      "ほとけ": { meaning: "Buddha" }
  "ja-4764":
    native: "Hurry, and you will bungle the matter."
    notes:
      "literal": "Said to warn that haste causes mistakes."
    bases:
      "いそいては": { meaning: "to hurry (if one hurries)" }
      "こと": { meaning: "matter, affair" }
      "を": { meaning: "(marks the thing acted on)" }
      "しそんじる": { meaning: "to bungle, to make a mess of" }
  "ja-4765":
    native: "Hear of paradise, see hell."
    notes:
      "literal": "Said of a place that sounds much better than it really is."
    bases:
      "きいて": { meaning: "to hear" }
      "ごくらく": { meaning: "paradise" }
      "みて": { meaning: "to see" }
      "じごく": { meaning: "hell" }
  "ja-4766":
    native: "Hide the head, and the rear shows."
    notes:
      "literal": "Said of someone who hides one part of a fault and leaves the rest showing."
    bases:
      "あたま": { meaning: "head" }
      "かくして": { meaning: "to hide (and)" }
      "しり": { meaning: "rear, bottom" }
      "かくさず": { meaning: "without hiding" }
  "ja-4767":
    native: "The hated child lords it over the world."
    notes:
      "literal": "Said that people who are disliked often get their own way."
    bases:
      "にくまれっこ": { meaning: "a child who is disliked" }
      "よ": { meaning: "the world" }
      "に": { meaning: "(in)" }
      "はばかる": { meaning: "to lord it over, to be powerful" }
  "ja-4768":
    native: "When you grow old, follow your children."
    notes:
      "literal": "Said that with age one should follow the guidance of one's children."
    bases:
      "おいては": { meaning: "to grow old (when one does)" }
      "こ": { meaning: "child" }
      "に": { meaning: "(to)" }
      "したがえ": { meaning: "follow" }
  "ja-4769":
    native: "Raise the sail when the wind is fair."
    notes:
      "literal": "Said of seizing a chance to do what one is best at, like a boat setting sail in a fair wind."
    bases:
      "えて": { meaning: "one's strong point" }
      "に": { meaning: "(on, in)" }
      "ほ": { meaning: "sail" }
      "を": { meaning: "(marks the thing acted on)" }
      "あぐ": { meaning: "to raise (classical form)" }
