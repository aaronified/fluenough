id: "ja-en-kanji-28"
kind: "layer"
core: "ja-kanji-28"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 28: grade 5, part 4"
description: "Twenty-eight kanji of the fifth school grade, each taught by the kana reading of the word it stands for. Nine have no example yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-6560":
    native: "aviation"
    notes:
      "n1": "航 (koukuu): on reading コウ (kou); no kun reading. It is not a word on its own, so its kana こうくう (koukuu), aviation, is the commonest word it begins, written 航空 (koukuu). No taught card has that kana, and no taught word is written with 航 (kou) and has a card, so it has no example yet."
  "ja-6561":
    native: "wallet"
    notes:
      "n1": "財 (saifu): on reading ザイ (zai) and the parenthesised reading サイ (sai), described as a special or very narrow use; no kun reading. Its kana さいふ (saifu), wallet, is the commonest word it begins, written 財布 (saifu), where 財 (sai) is read サイ (sai). The card uses さいふ (saifu) rather than ざい (zai), because サイ (sai) is only the narrow reading and 財布 (saifu) is the common word. The taught card さいふ (saifu), wallet, from ja-daily-life, is the same word, 財布 (saifu). Its example is 財布は高いです (saifu wa takai desu), where 財布 (saifu) is that taught card, with 布 (fu) a taught kanji from ja-kanji-25; the other taught words are は (wa), 高い (takai), expensive; high; tall, the taught card たかい (takai), and です (desu)."
    examples:
      "財布は高いです。": "The wallet is expensive."
  "ja-6562":
    native: "to build"
    notes:
      "n1": "造 (tsukuru): on reading ゾウ (zou); kun reading つく-る (tsuku-ru). Its kana つくる (tsukuru), to build, is the word it stands for in its kun reading, written 造る (tsukuru), which builds large things. The taught card つくる (tsukuru), to make; to create, is 作る (tsukuru), a different word from 造る (tsukuru), and the taught kanji card 作 (tsukuru) from ja-kanji-6 is that same word, 作る (tsukuru), so the card kana is shared with a different word. Its example is 船を造ります (fune o tsukurimasu), where 船 (fune), ship; boat, is the taught card ふね (fune), with 船 (fune) a taught kanji; the other taught words are を (o) and 造ります (tsukurimasu), the masu form of the kana つくる (tsukuru) that the taught card gives, written with 造 (zou) for the sense of building."
    examples:
      "船を造ります。": "I build ships."
  "ja-6563":
    native: "stop; suspension"
    notes:
      "n1": "停 (teishi): on reading テイ (tei); no kun reading in the table. It is not a word on its own, so its kana ていし (teishi), stop; suspension, is the commonest word it begins, written 停止 (teishi). No taught card has that kana. Its example is バス停は近いです (basutei wa chikai desu), where バス停 (basutei), bus stop, is the taught card バスてい (basutei), with 停 (tei) its on reading; the other taught words are は (wa), 近い (chikai), near; close, the taught card ちかい (chikai), and です (desu)."
    examples:
      "バス停は近いです。": "The bus stop is near."
  "ja-6564":
    native: "to serve in a post"
    notes:
      "n1": "務 (tsutomeru): on reading ム (mu); kun readings つと-める (tsuto-meru) and つと-まる (tsuto-maru). Its kana つとめる (tsutomeru), to serve in a post, is the word it stands for in its kun reading, written 務める (tsutomeru). The taught card つとめる (tsutomeru), to work for (a company); to serve, from ja-work, has the same kana but is a different word: its usual spelling 勤める (tsutomeru) means to work for a company. Its examples are 業務は大切です (gyoumu wa taisetsu desu), where 業務 (gyoumu), business task; duties at work, is the taught card ぎょうむ (gyoumu), with 業 (gyou) a taught kanji from ja-kanji-17; the other taught words are は (wa), 大切 (taisetsu), precious; important, the taught card たいせつ (taisetsu), and です (desu); and 事務所は大きいです (jimusho wa ookii desu), where 事務所 (jimusho), office, is the taught card じむしょ (jimusho), with 事 (ji) and 所 (sho) taught kanji; the other taught words are は (wa), 大きい (ookii), big, the taught card おおきい (ookii), and です (desu)."
    examples:
      "業務は大切です。": "Work duties are important."
      "事務所は大きいです。": "The office is big."
  "ja-6565":
    native: "basis; foundation"
    notes:
      "n1": "基 (moto): on reading キ (ki); kun readings もと (moto) and もとい (motoi). Its kana もと (moto), basis; foundation, is the word it stands for alone in its kun reading, written 基 (moto). The taught kanji card 元 (moto), origin; base; former, from ja-kanji-6, has the same kana, but 元 (moto) is a different word, so the two share a kana and not a word. No taught word is written with 基 (ki) and has a card, such as 基本 (kihon), so it has no example yet."
  "ja-6566":
    native: "canteen; dining hall"
    notes:
      "n1": "堂 (shokudou): on reading ドウ (dou); no kun reading. It is not a word on its own, so its kana しょくどう (shokudou), canteen; dining hall, is the commonest word it ends, written 食堂 (shokudou). No taught card has that kana, and no taught word is written with 堂 (dou) and has a card, so it has no example yet."
  "ja-6567":
    native: "housewife"
    notes:
      "n1": "婦 (shufu): on reading フ (fu); no kun reading. It is not a word on its own, so its kana しゅふ (shufu), housewife, is the commonest word it ends, written 主婦 (shufu). No taught card has that kana, and no taught word is written with 婦 (fu) and has a card, so it has no example yet."
    examples:
      "産婦人科は近いです。": "The obstetrics and gynaecology department is near."
  "ja-6568":
    native: "to drop by"
    notes:
      "n1": "寄 (yoru): on reading キ (ki); kun readings よ-る (yo-ru) and よ-せる (yo-seru). Its kana よる (yoru), to drop by, is the word it stands for in its kun reading, written 寄る (yoru). The taught card よる (yoru), night; evening, from ja-time, is 夜 (yoru), a different word, and the taught kanji card 夜 (yoru) from ja-kanji-9 has the same kana, so the card kana is shared with a different word. No taught word is written with 寄 (ki) and has a card, so it has no example yet."
  "ja-6569":
    native: "always; usual"
    notes:
      "n1": "常 (tsune): on reading ジョウ (jou); kun readings つね (tsune) and とこ (toko). Its kana つね (tsune), always; usual, is the word it stands for in its kun reading, written 常 (tsune). No taught card has that kana. No taught word is written with 常 (jou) and has a card, such as 日常 (nichijou), so it has no example yet."
  "ja-6570":
    native: "to stretch; to swell"
    notes:
      "n1": "張 (haru): on reading チョウ (chou); kun reading は-る (ha-ru). Its kana はる (haru), to stretch; to swell, is the word it stands for in its kun reading, written 張る (haru). The taught card はる (haru), spring, from ja-seasons, is 春 (haru), a different word, and the taught kanji card 春 (haru) from ja-kanji-7 has the same kana, so the card kana is shared with a different word. Its example is 出張は大変です (shutchou wa taihen desu), where 出張 (shutchou), business trip, is the taught card しゅっちょう (shutchou), with 出 (shutsu) a taught kanji; the other taught words are は (wa), 大変 (taihen), hard; tough; terrible, the taught card たいへん (taihen), with 大 (dai) and 変 (hen) taught kanji, and です (desu). The taught card きんちょう (kinchou), nervousness; tension, is 緊張 (kinchou), which uses 緊 (kin), a kanji not yet taught, so it is not an example here."
    examples:
      "出張は大変です。": "A business trip is hard."
  "ja-6571":
    native: "to get; to obtain"
    notes:
      "n1": "得 (eru): on reading トク (toku); kun readings え-る (e-ru) and う-る (u-ru). Its kana える (eru), to get; to obtain, is the word it stands for in its kun reading, written 得る (eru). No taught card has that kana. Its example is 日本語は得意です (nihongo wa tokui desu), where 得意 (tokui), good at; skilled at, is the taught card とくい (tokui), with 得 (toku) its on reading and 意 (i) a taught kanji; the other taught words are 日本語 (nihongo), the Japanese language, the taught card にほんご (nihongo), with 日 (nichi), 本 (hon) and 語 (go) taught kanji, は (wa), and です (desu)."
    examples:
      "日本語は得意です。": "I am good at Japanese."
  "ja-6572":
    native: "compassion; pity"
    notes:
      "n1": "情 (nasake): on reading ジョウ (jou); kun reading なさ-け (nasa-ke). The parenthesised reading セイ (sei) is described as a special or very narrow use. Its kana なさけ (nasake), compassion; pity, is the word it stands for in its kun reading, written 情け (nasake). No taught card has that kana. Its example is 愛情は大切です (aijou wa taisetsu desu), where 愛情 (aijou), affection, is the taught card あいじょう (aijou), with 愛 (ai) a taught kanji; the other taught words are は (wa), 大切 (taisetsu), precious; important, the taught card たいせつ (taisetsu), and です (desu)."
    examples:
      "愛情は大切です。": "Affection is important."
  "ja-6573":
    native: "to confer; to award"
    notes:
      "n1": "授 (sazukeru): on reading ジュ (ju); kun readings さず-ける (sazu-keru) and さず-かる (sazu-karu). Its kana さずける (sazukeru), to confer; to award, is the word it stands for in its kun reading, written 授ける (sazukeru). No taught card has that kana. Its example is 授業は楽しいです (jugyou wa tanoshii desu), where 授業 (jugyou), lesson, is the taught card じゅぎょう (jugyou), with 業 (gyou) a taught kanji; the other taught words are は (wa), 楽しい (tanoshii), fun; enjoyable, the taught card たのしい (tanoshii), and です (desu)."
    examples:
      "授業は楽しいです。": "The lesson is fun."
  "ja-6574":
    native: "to pick; to adopt"
    notes:
      "n1": "採 (toru): on reading サイ (sai); kun reading と-る (to-ru). Its kana とる (toru), to pick; to adopt, is the word it stands for in its kun reading, written 採る (toru). The taught card とる (toru), to take, from ja-hobbies, is 取る (toru), a different word, and the taught kanji card 取 (toru) from ja-kanji-12 has the same kana, so the card kana is shared with a different word. No taught word is written with 採 (sai) and has a card, such as 採用 (saiyou), so it has no example yet."
  "ja-6575":
    native: "connection"
    notes:
      "n1": "接 (setsuzoku): on reading セツ (setsu); its kun reading つ-ぐ (tsu-gu) is rare. It is not a word on its own, so its kana せつぞく (setsuzoku), connection, is the commonest word it begins, written 接続 (setsuzoku). No taught card has that kana, and no taught word is written with 接 (setsu) and has a card, so it has no example yet."
  "ja-6576":
    native: "to rescue; to save"
    notes:
      "n1": "救 (sukuu): on reading キュウ (kyuu); kun reading すく-う (suku-u). Its kana すくう (sukuu), to rescue; to save, is the word it stands for in its kun reading, written 救う (sukuu). No taught card has that kana. Its example is 救急車は速いです (kyuukyuusha wa hayai desu), where 救急車 (kyuukyuusha), ambulance, is the taught card きゅうきゅうしゃ (kyuukyuusha), with 救 (kyuu) the target and 急 (kyuu) and 車 (sha) taught kanji; the other taught words are は (wa), 速い (hayai), early; fast; quick, the taught card はやい (hayai), and です (desu)."
    examples:
      "救急車は速いです。": "The ambulance is fast."
  "ja-6577":
    native: "to refuse; to decline"
    notes:
      "n1": "断 (kotowaru): on reading ダン (dan); kun readings た-つ (ta-tsu) and ことわ-る (kotowa-ru). Its kana ことわる (kotowaru), to refuse; to decline, is the word it stands for in its kun reading, written 断る (kotowaru). The taught card ことわる (kotowaru), to refuse, from ja-verbs-3, is the same word, 断る (kotowaru). Its example is 判断はむずかしいです (handan wa muzukashii desu), where 判断 (handan), judgement, is the taught card はんだん (handan), with 判 (han) a taught kanji, and the target 断 (dan) shows in it; the taught kanji card 判 (handan) from ja-kanji-25 has the same kana and is the same word. The other taught words are は (wa), むずかしい (muzukashii), written in kana because 難 (nan) is not yet taught, the taught card むずかしい (muzukashii), and です (desu)."
    examples:
      "判断はむずかしいです。": "Judgement is difficult."
  "ja-6578":
    native: "liquid"
    notes:
      "n1": "液 (ekitai): on reading エキ (eki); no kun reading. It is not a word on its own, so its kana えきたい (ekitai), liquid, is the commonest word it begins, written 液体 (ekitai). No taught card has that kana. Its example is 血液は大切です (ketsueki wa taisetsu desu), where 血液 (ketsueki), blood, is the taught card けつえき (ketsueki), with 血 (ketsu) a taught kanji from ja-kanji-11; the other taught words are は (wa), 大切 (taisetsu), and です (desu)."
    examples:
      "血液は大切です。": "Blood is important."
  "ja-6579":
    native: "to mix"
    notes:
      "n1": "混 (mazeru): on reading コン (kon); kun readings ま-じる (ma-jiru), ま-ざる (ma-zaru), ま-ぜる (ma-zeru) and こ-む (ko-mu). Its kana まぜる (mazeru), to mix, is the word it stands for in its kun reading, written 混ぜる (mazeru). The taught card まぜる (mazeru), to mix, from ja-cooking, is the same word, 混ぜる (mazeru). Its example is たまごを混ぜます (tamago o mazemasu), where 混ぜます (mazemasu) is the masu form of that card; the other taught words are たまご (tamago), egg, the taught card たまご (tamago), and を (o), and the eggs are written in kana because 卵 (tamago) is not yet taught. No taught word is written with 混 (kon) and has a card, but 混雑 (konzatsu), congestion; crowd, has the card こんざつ (konzatsu), and uses 雑 (zatsu), a kanji not yet taught, so it is not an example here."
    examples:
      "たまごを混ぜます。": "I mix the eggs."
  "ja-6580":
    native: "to lead; to command"
    notes:
      "n1": "率 (hikiiru): on reading ソツ (sotsu) and リツ (ritsu); kun reading ひき-いる (hiki-iru). Its kana ひきいる (hikiiru), to lead; to command, is the word it stands for in its kun reading, written 率いる (hikiiru). No taught card has that kana, and no taught word is written with 率 (ritsu) and has a card, so it has no example yet."
  "ja-6581":
    native: "to appear"
    notes:
      "n1": "現 (arawareru): on reading ゲン (gen); kun readings あらわ-れる (arawa-reru) and あらわ-す (arawa-su). Its kana あらわれる (arawareru), to appear, is the word it stands for in its kun reading, written 現れる (arawareru). No taught card has that kana. Its example is 現金は便利です (genkin wa benri desu), where 現金 (genkin), cash, is the taught card げんきん (genkin), with 金 (kin) a taught kanji from ja-kanji-1; the other taught words are は (wa), 便利 (benri), convenient; useful, the taught card べんり (benri), and です (desu)."
    examples:
      "現金は便利です。": "Cash is convenient."
  "ja-6582":
    native: "omission; abbreviation"
    notes:
      "n1": "略 (shouryaku): on reading リャク (ryaku); no kun reading. It is not a word on its own, so its kana しょうりゃく (shouryaku), omission; abbreviation, is the commonest word it ends, written 省略 (shouryaku). No taught card has that kana, and no taught word is written with 略 (ryaku) and has a card, so it has no example yet."
  "ja-6583":
    native: "eye clinic"
    notes:
      "n1": "眼 (ganka): on reading ガン (gan) and the parenthesised reading ゲン (gen), described as a special or very narrow use; kun reading まなこ (manako). Its kana がんか (ganka), eye clinic, is the commonest word it begins, written 眼科 (ganka). The taught card がんか (ganka), eye clinic, from ja-health, is the same word, 眼科 (ganka). Its example is 眼科は近いです (ganka wa chikai desu), where 眼科 (ganka) is that taught card, with 科 (ka) a taught kanji; the other taught words are は (wa), 近い (chikai), near; close, the taught card ちかい (chikai), and です (desu)."
    examples:
      "眼科は近いです。": "The eye clinic is near."
  "ja-6584":
    native: "to move; to be passed on"
    notes:
      "n1": "移 (utsuru): on reading イ (i); kun readings うつ-る (utsu-ru) and うつ-す (utsu-su). Its kana うつる (utsuru), to move; to be passed on, is the word it stands for in its kun reading, written 移る (utsuru). The taught card うつる (utsuru), to be passed on, from ja-illness, is the same word, 移る (utsuru). Its example is 移動は速いです (idou wa hayai desu), where 移動 (idou), movement; travel, is the taught card いどう (idou), with 動 (dou) a taught kanji; the other taught words are は (wa), 速い (hayai), early; fast; quick, the taught card はやい (hayai), and です (desu)."
    examples:
      "移動は速いです。": "Travel is fast."
  "ja-6585":
    native: "to pass through"
    notes:
      "n1": "経 (heru): on reading ケイ (kei) and キョウ (kyou); kun reading へ-る (he-ru). Its kana へる (heru), to pass through, is the word it stands for in its kun reading, written 経る (heru). The taught card へる (heru), to decrease, from ja-verbs-3, is 減る (heru), a different word, so the card kana is shared with a different word. Its example is 経験は大事です (keiken wa daiji desu), where 経験 (keiken), experience, is the taught card けいけん (keiken), with 験 (ken) a taught kanji; the other taught words are は (wa), 大事 (daiji), important, the taught card だいじ (daiji), with 大 (dai) and 事 (ji) taught kanji, and です (desu)."
    examples:
      "経験は大事です。": "Experience is important."
  "ja-6586":
    native: "technology; technique"
    notes:
      "n1": "術 (gijutsu): on reading ジュツ (jutsu); no kun reading. It is not a word on its own, so its kana ぎじゅつ (gijutsu), technology; technique, is the commonest word it ends, written 技術 (gijutsu). No taught card has that kana. Its example is 手術は大変です (shujutsu wa taihen desu), where 手術 (shujutsu), operation, is the taught card しゅじゅつ (shujutsu), with 手 (shu) a taught kanji from ja-kanji-3; the other taught words are は (wa), 大変 (taihen), hard; tough; terrible, the taught card たいへん (taihen), with 大 (dai) and 変 (hen) taught kanji, and です (desu)."
    examples:
      "手術は大変です。": "Surgery is hard."
  "ja-6587":
    native: "rule; regulation"
    notes:
      "n1": "規 (kisoku): on reading キ (ki); no kun reading. It is not a word on its own, so its kana きそく (kisoku), rule; regulation, is the commonest word it begins, written 規則 (kisoku). The taught card きそく (kisoku), regulation, from ja-government, is the same word, 規則 (kisoku). The taught kanji card 則 (soku) from ja-kanji-27 has the same kana, きそく (kisoku), for that same word. Its example is 規則は大切です (kisoku wa taisetsu desu), where 規則 (kisoku) is that taught card, with 則 (soku) a taught kanji from ja-kanji-27; the other taught words are は (wa), 大切 (taisetsu), precious; important, the taught card たいせつ (taisetsu), and です (desu)."
    examples:
      "規則は大切です。": "The rules are important."
