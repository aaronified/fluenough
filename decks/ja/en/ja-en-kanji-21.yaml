native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 21: grade 4, part 4"
description: "Twenty-nine kanji of the fourth school grade, each taught by the kana reading of the word it stands for. Most have no example yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-6140":
    native: "to build; to erect"
    notes:
      "n1": "建 (tateru): on reading ケン (ken), and コン (kon) which the table gives in parentheses as a narrow use; kun readings た-てる (ta-teru) and た-つ (ta-tsu). Its kana たてる (tateru), to build; to erect, is the word it stands for alone, written 建てる (tateru). It is not yet a taught card. Its example uses 建物 (tatemono), a building, which is the taught card たてもの (tatemono)."
    examples:
      "建物はたかいです。": "The building is tall."
  "ja-6141":
    native: "last year"
    notes:
      "n1": "昨 (sakunen): on reading サク (saku); no kun reading. Its kana さくねん (sakunen), last year, is a common word it begins, written 昨年 (sakunen). It is not yet a taught card. Its example uses 昨日 (kinou), yesterday, which is the taught card きのう (kinou); there the kanji is not read with its table reading."
    examples:
      "昨日はあついです。": "Yesterday was hot."
  "ja-6142":
    native: "Tochigi, a prefecture"
    notes:
      "n1": "栃 (tochigi): no on reading. The table gives the kun reading とち (tochi) in parentheses, and this use is only for the name of a prefecture, so it is narrow. Its kana とちぎ (tochigi), Tochigi, a prefecture in Japan, is the place name it begins, written 栃木 (tochigi). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6143":
    native: "to prosper; to flourish"
    notes:
      "n1": "栄 (sakaeru): on reading エイ (ei); kun readings さか-える (saka-eru), は-え (ha-e) and は-える (ha-eru). Its kana さかえる (sakaeru), to prosper; to flourish, is the word it stands for alone, written 栄える (sakaeru). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6144":
    native: "shallow"
    notes:
      "n1": "浅 (asai): on reading セン (sen); kun reading あさ-い (asa-i). Its kana あさい (asai), shallow, is the word it stands for alone, written 浅い (asai). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6145":
    native: "to omit; to leave out"
    notes:
      "n1": "省 (habuku): on readings セイ (sei) and ショウ (shou); kun readings かえり-みる (kaeri-miru) and はぶ-く (habu-ku). Its kana はぶく (habuku), to omit; to leave out, is the word it stands for in its kun reading, written 省く (habuku). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6146":
    native: "to celebrate"
    notes:
      "n1": "祝 (iwau): on readings シュク (shuku), and シュウ (shuu) which the table gives in parentheses as a narrow use; kun reading いわ-う (iwa-u). Its kana いわう (iwau), to celebrate, is the word it stands for in its kun reading, written 祝う (iwau). It is not yet a taught card. Its example uses 祝日 (shukujitsu), a public holiday, which is the taught card しゅくじつ (shukujitsu)."
    examples:
      "祝日はたのしいです。": "Public holidays are fun."
  "ja-6147":
    native: "promise"
    notes:
      "n1": "約 (yakusoku): on reading ヤク (yaku); no kun reading. Its kana やくそく (yakusoku), promise, is a common word it begins, written 約束 (yakusoku). It is the same word as the taught card やくそく (yakusoku), promise. It is also in 予約 (yoyaku), reservation, which is the taught card よやく (yoyaku) and uses the taught kanji 予 (yo). Its examples use 予約 (yoyaku) and 約束 (yakusoku)."
    examples:
      "予約はむずかしいです。": "Reservations are difficult."
      "約束はいいです。": "A promise is good."
  "ja-6148":
    native: "Ibaraki, a prefecture"
    notes:
      "n1": "茨 (ibaraki): no on reading. The table gives the kun reading いばら (ibara) in parentheses, and this use is only for the name of a prefecture. Its kana いばらき (ibaraki), Ibaraki, a prefecture in Japan, is the place name it begins, written 茨城 (ibaraki). Its second kanji is taught in unit 20, but the word is not a taught card. No taught word uses it, so it has no example yet."
  "ja-6149":
    native: "key point; essentials"
    notes:
      "n1": "要 (kaname): on reading ヨウ (you); kun readings かなめ (kaname) and い-る (i-ru). Its kana かなめ (kaname), the key point, is the word it stands for alone. It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6150":
    native: "army"
    notes:
      "n1": "軍 (gun): on reading グン (gun); no kun reading. Its kana ぐん (gun), army, is the word it stands for alone. It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6151":
    native: "to fly"
    notes:
      "n1": "飛 (tobu): on reading ヒ (hi); kun readings と-ぶ (to-bu) and と-ばす (to-basu). Its kana とぶ (tobu), to fly, is the word it stands for in its kun reading, written 飛ぶ (tobu). It is the same word as the taught card とぶ (tobu), to fly; to jump. Apart from that card, no taught word uses it, so it has no example yet."
  "ja-6152":
    native: "smell; fragrance"
    notes:
      "n1": "香 (kaori): on reading コウ (kou), and キョウ (kyou) which the table gives in parentheses as a narrow use; kun readings か (ka), かお-り (kao-ri) and かお-る (kao-ru). Its kana かおり (kaori), smell; fragrance, is the word it stands for in its kun reading, written 香り (kaori). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6153":
    native: "storehouse"
    notes:
      "n1": "倉 (kura): on reading ソウ (sou); kun reading くら (kura). Its kana くら (kura), storehouse, is the word it stands for alone. It is not yet a taught card. Its example uses 倉庫 (souko), a warehouse, which is the taught card そうこ (souko)."
    examples:
      "倉庫はひろいです。": "The warehouse is spacious."
  "ja-6154":
    native: "climate"
    notes:
      "n1": "候 (kikou): on reading コウ (kou); kun reading そうろう (sourou). Its kana きこう (kikou), climate, is a common word it ends, written 気候 (kikou). It is the same word as the taught card きこう (kikou), climate. Its example uses 気候 (kikou), which uses the taught kanji 気 (ki)."
    examples:
      "気候はさむいです。": "The climate is cold."
  "ja-6155":
    native: "to borrow"
    notes:
      "n1": "借 (kariru): on reading シャク (shaku); kun reading か-りる (ka-riru). Its kana かりる (kariru), to borrow, is the word it stands for in its kun reading, written 借りる (kariru). It is the same word as the taught card かりる (kariru), to borrow. Apart from that card, no taught word uses it, so it has no example yet."
  "ja-6156":
    native: "grandchild"
    notes:
      "n1": "孫 (mago): on reading ソン (son); kun reading まご (mago). Its kana まご (mago), grandchild, is the word it stands for alone. It is the same word as the taught card まご (mago), grandchild. Its example uses 孫 (mago) alone, with the taught adjective かわいい (kawaii)."
    examples:
      "孫はかわいいです。": "The grandchild is cute."
  "ja-6157":
    native: "damage; harm"
    notes:
      "n1": "害 (higai): on reading ガイ (gai); no kun reading. Its kana ひがい (higai), damage, is a common word it ends, written 被害 (higai). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6158":
    native: "to point; to put up an umbrella"
    notes:
      "n1": "差 (sasu): on reading サ (sa); kun reading さ-す (sa-su). Its kana さす (sasu), to point; to put up an umbrella, is the word it stands for in its kun reading, written 差す (sasu). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6159":
    native: "seat"
    notes:
      "n1": "席 (seki): on reading セキ (seki); no kun reading. Its kana せき (seki), seat, is the word it stands for alone. The same kana is the taught card せき (seki), cough, which is a different word. No taught word uses it, so it has no example yet."
  "ja-6160":
    native: "sash; belt"
    notes:
      "n1": "帯 (obi): on reading タイ (tai); kun readings お-びる (o-biru) and おび (obi). Its kana おび (obi), sash, is the word it stands for alone. It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6161":
    native: "student"
    notes:
      "n1": "徒 (seito): on reading ト (to); no kun reading. Its kana せいと (seito), student, is a common word it ends, written 生徒 (seito), which uses the taught kanji 生 (sei). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6162":
    native: "to raise; to hold up"
    notes:
      "n1": "挙 (ageru): on reading キョ (kyo); kun readings あ-げる (a-geru) and あ-がる (a-garu). Its kana あげる (ageru), to raise; to hold up, is the word it stands for in its kun reading, written 挙げる (ageru). It is a different word from the taught card あげる (ageru), to give to someone else. No taught word uses it, so it has no example yet."
  "ja-6163":
    native: "fee; charge"
    notes:
      "n1": "料 (ryoukin): on reading リョウ (ryou); no kun reading. Its kana りょうきん (ryoukin), fee; charge, is a common word it begins, written 料金 (ryoukin). It is the same word as the taught card りょうきん (ryoukin), charge; fee. It is also in 料理 (ryouri), cooking, which is the taught card りょうり (ryouri) and uses the taught kanji 理 (ri). Its examples use 料理 (ryouri) and 料金 (ryoukin)."
    examples:
      "料理はおいしいです。": "The food is delicious."
      "料金はやすいです。": "The fee is cheap."
  "ja-6164":
    native: "plan; idea"
    notes:
      "n1": "案 (an): on reading アン (an); no kun reading. Its kana あん (an), plan; idea, is the word it stands for alone. It is not yet a taught card. Its example uses 案内 (annai), guidance, which is the taught card あんない (annai)."
    examples:
      "案内はべんりです。": "The guidance is convenient."
  "ja-6165":
    native: "Japanese plum"
    notes:
      "n1": "梅 (ume): on reading バイ (bai); kun reading うめ (ume). Its kana うめ (ume), Japanese plum, is the word it stands for alone. It is not yet a taught card. Its example uses 梅雨 (tsuyu), the rainy season, which is the taught card つゆ (tsuyu)."
    examples:
      "梅雨はながいです。": "The rainy season is long."
  "ja-6166":
    native: "to remain"
    notes:
      "n1": "残 (nokoru): on reading ザン (zan); kun readings のこ-る (noko-ru) and のこ-す (noko-su). Its kana のこる (nokoru), to remain, is the word it stands for in its kun reading, written 残る (nokoru). It is the same word as the taught card のこる (nokoru), to remain. Its examples use 残業 (zangyou), overtime, which is the taught card ざんぎょう (zangyou), and the masu form 残ります (nokorimasu) of that taught verb."
    examples:
      "残業はたいへんです。": "Overtime is hard."
      "ここに残ります。": "It remains here."
  "ja-6167":
    native: "to bathe; to shower"
    notes:
      "n1": "浴 (abiru): on reading ヨク (yoku); kun readings あ-びる (a-biru) and あ-びせる (a-biseru). Its kana あびる (abiru), to bathe; to shower, is the word it stands for in its kun reading, written 浴びる (abiru). It is the same word as the taught card あびる (abiru), to bathe; to shower. Its example uses 浴衣 (yukata), a light cotton kimono, which is the taught card ゆかた (yukata)."
    examples:
      "浴衣はきれいです。": "The yukata is beautiful."
  "ja-6168":
    native: "special; particular"
    notes:
      "n1": "特 (tokubetsu): on reading トク (toku); no kun reading. Its kana とくべつ (tokubetsu), special; particular, is a common word it begins, written 特別 (tokubetsu), which uses the taught kanji 別 (betsu). It is not yet a taught card. Its examples use 特に (tokuni), especially, which is the taught card とくに (tokuni), and 特急 (tokkyuu), a limited express, which is the taught card とっきゅう (tokkyuu)."
    examples:
      "特にさむいです。": "It is especially cold."
      "特急ははやいです。": "The limited express is fast."
