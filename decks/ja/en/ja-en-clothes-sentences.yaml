"cards":
  "ja-1544":
    "notes":
      "n1": "きる (kiru) is the general verb for clothes worn on the body, and はく (haku) is used for things worn on the legs or feet."
    "native": "In the morning I put on a shirt and go out."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "を":
        "meaning": "(marks the thing acted on)"
      "きて":
        "meaning": "to put on, a top (te-form)"
      "でかけます":
        "meaning": "to go out (polite)"
    "confusables":
      "w1":
        "why": "to take off, not to put on"
      "w2":
        "why": "to wear on the legs, not a top"
  "ja-1545":
    "notes":
      "n1": "はく (haku) is written 履く (haku) for shoes and socks, and 穿く (haku) for trousers: the same reading, two kanji."
    "native": "I put on shoes and walk."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "はいて":
        "meaning": "to wear on the legs (te-form)"
      "あるきます":
        "meaning": "to walk (polite)"
    "confusables":
      "w1":
        "why": "to take off, not to put on"
      "w2":
        "why": "to wear on the head, not on the feet"
  "ja-1546":
    "native": "The dress is loose."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "to be (polite)"
    "confusables":
      "w1":
        "why": "tight, not loose"
      "w2":
        "why": "a perfect fit, not loose"
  "ja-1547":
    "native": "The size fits perfectly."
    "bases":
      "が":
        "meaning": "(marks the subject)"
      "です":
        "meaning": "to be (polite)"
    "confusables":
      "w1":
        "why": "loose, not a perfect fit"
      "w2":
        "why": "tight, not a perfect fit"
  "ja-1548":
    "native": "On rainy days I wear rain boots."
    "bases":
      "の":
        "meaning": "(of, belonging to)"
      "に":
        "meaning": "(marks the time or the place)"
      "を":
        "meaning": "(marks the thing acted on)"
      "はきます":
        "meaning": "to wear on the legs (polite)"
    "confusables":
      "w1":
        "why": "boots, not rain boots"
      "w2":
        "why": "socks, not rain boots"
  "ja-1549":
    "native": "Red and blue are beautiful."
    "bases":
      "と":
        "meaning": "(and)"
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "to be (polite)"
    "confusables":
