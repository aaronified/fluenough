    "notes":
      "n1": "taiseiyou is the Atlantic Ocean. It is written 大西洋 (taiseiyou)."
    "examples":
      "たいせいようはふかいです。":
        "native": "The Atlantic Ocean is deep."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "たいせいようをふねでわたりました。":
        "native": "I crossed the Atlantic Ocean by ship."
        "bases":
          "わたりました":
            "meaning": "crossed (polite)"
  "ja-2666":
    "native": "North Pole"
    "notes":
      "n1": "hokkyoku is the North Pole, the northern end of the earth's axis. It is written 北極 (hokkyoku)."
    "examples":
      "ほっきょくはさむいところです。":
        "native": "The North Pole is a cold place."
        "bases":
          "ところ":
            "meaning": "place"
          "です":
            "meaning": "(to be, polite)"
      "ほっきょくはさむいです。":
        "native": "The North Pole is cold."
        "bases":
          "です":
            "meaning": "(to be, polite)"
