          "です":
            "meaning": "(to be, polite)"
      "わたしのともだちはスペインじんです。":
        "native": "My friend is Spanish."
        "bases":
          "スペインじん":
            "meaning": "Spanish (person)"
          "です":
            "meaning": "(to be, polite)"
  "ja-2661":
    "native": "Russia"
    "notes":
      "n1": "roshia is the country of Russia, which covers much of northern Asia and Europe. It is written in katakana."
    "examples":
      "ロシアはとてもおおきいくにです。":
        "native": "Russia is a very large country."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "ロシアはさむいです。":
        "native": "Russia is cold."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2662":
    "native": "Brazil"
    "notes":
      "n1": "burajiru is the country of Brazil, in South America. It is written in katakana."
    "examples":
      "ブラジルはあついです。":
        "native": "Brazil is hot."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "ブラジルへいきたいです。":
        "native": "I want to go to Brazil."
        "bases":
          "いきたい":
            "meaning": "want to go"
          "です":
            "meaning": "(to be, polite)"
  "ja-2663":
    "native": "Canada"
    "notes":
      "n1": "kanada is the country of Canada, in North America. It is written in katakana."
    "examples":
      "カナダはひろいくにです。":
