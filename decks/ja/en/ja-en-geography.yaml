        "native": "Germany is a big country."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "ドイツへいきました。":
        "native": "I went to Germany."
        "bases":
          "いきました":
            "meaning": "went (polite)"
  "ja-2659":
    "native": "Italy"
    "notes":
      "n1": "itaria is the country of Italy, in Europe. It is written in katakana."
    "examples":
      "イタリアのりょうりがすきです。":
        "native": "I like Italian food."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "イタリアはあたたかいです。":
        "native": "Italy is warm."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2660":
    "native": "Spain"
    "notes":
      "n1": "supein is the country of Spain, in Europe. It is written in katakana."
    "examples":
      "スペインのりょうりはおいしいです。":
