"cards":
  "ja-2627":
    "native": "geography"
    "notes":
      "n1": "chiri is geography, the study of the land and its places. It is also the word for dust, so write it with 地理 (chiri) when you mean the subject."
    "examples":
      "ちりがすきです。":
        "native": "I like geography."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "ちりのしゅくだいがあります。":
        "native": "There is geography homework."
        "bases":
          "あります":
            "meaning": "there is (polite)"
  "ja-2628":
    "native": "region"
    "notes":
      "n1": "chihou means a region, a large part of a country with its own character. It is written 地方 (chihou)."
    "examples":
      "わたしのちほうはさむいです。":
        "native": "My region is cold."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "このちほうはゆきがおおいです。":
        "native": "This region has a lot of snow."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2629":
    "native": "prefectures"
    "notes":
      "n1": "todoufuken is the name for all the prefectures together: Tokyo, Osaka, Hokkaido and the rest. It is written 都道府県 (todoufuken)."
    "examples":
      "にほんにはとどうふけんがあります。":
        "native": "Japan has prefectures."
        "bases":
          "あります":
            "meaning": "there is (polite)"
      "わたしはとどうふけんのなまえをおぼえます。":
        "native": "I learn the names of the prefectures."
        "bases":
          "おぼえます":
            "meaning": "learn; memorise (polite)"
  "ja-2630":
    "native": "prefecture"
    "notes":
      "n1": "ken is one prefecture, a unit of the country's map. It is written 県 (ken) in place names such as Shizuoka-ken."
    "examples":
      "わたしのけんはおおさかです。":
        "native": "My prefecture is Osaka."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "このけんにやまがおおいです。":
        "native": "This prefecture has many mountains."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2631":
    "native": "village"
    "notes":
      "n1": "son is a village, the smallest administrative unit of the countryside. It is written 村 (son)."
    "examples":
      "そんにこどもがすくないです。":
        "native": "The village has few children."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "そんのとしょかんにいきます。":
        "native": "I go to the village library."
        "bases":
          "いきます":
            "meaning": "go (polite)"
  "ja-2632":
    "native": "capital city"
    "notes":
      "n1": "shuto is the capital city of a country, where the government sits. It is written 首都 (shuto)."
    "examples":
      "にほんのしゅとはとうきょうです。":
        "native": "The capital of Japan is Tokyo."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "しゅとはにぎやかです。":
        "native": "The capital is lively."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2633":
    "native": "city; urban area"
    "notes":
      "n1": "tokai is a city, or city life in general, as opposed to the countryside. It is written 都会 (tokai)."
    "examples":
      "わたしはとかいがすきです。":
        "native": "I like the city."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "とかいはひとがおおいです。":
        "native": "There are many people in the city."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2634":
    "native": "countryside"
    "notes":
      "n1": "inaka is the countryside, the land outside the towns. It is written 田舎 (inaka)."
    "examples":
      "いなかはしずかです。":
        "native": "The countryside is quiet."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "ははのいなかにいきました。":
        "native": "I went to my mother's home in the countryside."
        "bases":
          "いきました":
            "meaning": "went (polite)"
  "ja-2635":
    "native": "northern part"
    "notes":
      "n1": "hokubu is the northern part of a region or country. It is written 北部 (hokubu)."
    "examples":
      "にほんのほくぶはさむいです。":
        "native": "The northern part of Japan is cold."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "ほくぶにゆきがふります。":
        "native": "It snows in the northern part."
        "bases":
          "ふります":
            "meaning": "fall (of rain or snow; polite)"
  "ja-2636":
    "native": "southern part"
    "notes":
      "n1": "nanbu is the southern part of a region or country. It is written 南部 (nanbu)."
    "examples":
      "なんぶはあたたかいです。":
        "native": "The southern part is warm."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "かぞくはなんぶにいます。":
        "native": "My family is in the southern part."
        "bases":
          "います":
            "meaning": "there is (polite)"
  "ja-2637":
    "native": "eastern part"
    "notes":
      "n1": "toubu is the eastern part of a region or country. It is written 東部 (toubu)."
    "examples":
      "とうぶのまちはおおきいです。":
        "native": "The towns in the eastern part are big."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "とうぶにうみがあります。":
        "native": "There is a sea in the eastern part."
        "bases":
          "あります":
            "meaning": "there is (polite)"
  "ja-2638":
    "native": "western part"
    "notes":
      "n1": "seibu is the western part of a region or country. It is written 西部 (seibu)."
    "examples":
      "せいぶにやまがおおいです。":
        "native": "There are many mountains in the western part."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "わたしはせいぶでうまれました。":
        "native": "I was born in the western part."
        "bases":
          "うまれました":
            "meaning": "was born (polite)"
  "ja-2639":
    "native": "centre"
    "notes":
      "n1": "chuuou means the centre, the middle of a place. It is written 中央 (chuuou)."
    "examples":
      "えきのちゅうおうにみせがあります。":
        "native": "There is a shop in the centre of the station."
        "bases":
          "あります":
            "meaning": "there is (polite)"
      "まちのちゅうおうはにぎやかです。":
        "native": "The centre of the town is lively."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2640":
    "native": "Hokkaido"
    "notes":
      "n1": "hokkaidou is the northernmost of the main islands of Japan. It is written 北海道 (hokkaidou)."
    "examples":
      "ほっかいどうはゆきがおおいです。":
        "native": "Hokkaido has a lot of snow."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "ほっかいどうへいきたいです。":
        "native": "I want to go to Hokkaido."
        "bases":
          "いきたい":
            "meaning": "want to go"
          "です":
            "meaning": "(to be, polite)"
  "ja-2641":
    "native": "Honshu"
    "notes":
      "n1": "honshuu is the largest of the main islands of Japan. It is written 本州 (honshuu)."
    "examples":
      "ほんしゅうはおおきいしまです。":
        "native": "Honshu is a big island."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "わたしはほんしゅうにいきました。":
        "native": "I went to Honshu."
        "bases":
          "いきました":
            "meaning": "went (polite)"
  "ja-2642":
    "native": "Shikoku"
    "notes":
      "n1": "shikoku is one of the four main islands of Japan, the smallest of them. It is written 四国 (shikoku)."
    "examples":
      "しこくはちいさいしまです。":
        "native": "Shikoku is a small island."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "しこくにおてらがおおいです。":
        "native": "There are many temples in Shikoku."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2643":
    "native": "Kyushu"
    "notes":
      "n1": "kyuushuu is the southwest island of the four main islands of Japan. It is written 九州 (kyuushuu)."
    "examples":
      "きゅうしゅうはあたたかいです。":
        "native": "Kyushu is warm."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "きゅうしゅうへひこうきでいきます。":
        "native": "I go to Kyushu by plane."
        "bases":
          "いきます":
            "meaning": "go (polite)"
  "ja-2644":
    "native": "Okinawa"
    "notes":
      "n1": "okinawa is the largest island group of the south of Japan. It is a prefecture, and its islands are warm."
    "examples":
      "おきなわのうみはきれいです。":
        "native": "The sea of Okinawa is beautiful."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "おきなわへりょこうします。":
        "native": "I travel to Okinawa."
        "bases":
          "します":
            "meaning": "do (polite)"
  "ja-2645":
    "native": "Mount Fuji"
    "notes":
      "n1": "fujisan is Mount Fuji, the highest mountain of Japan. It is written 富士山 (fujisan), and the san means mountain."
    "examples":
      "ふじさんはたかいやまです。":
        "native": "Mount Fuji is a tall mountain."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "ふじさんがきれいにみえます。":
        "native": "Mount Fuji looks beautiful."
        "bases":
          "みえます":
            "meaning": "can be seen (polite)"
  "ja-2646":
    "native": "Hiroshima"
    "notes":
      "n1": "hiroshima is a city in the west of Honshu. It is written 広島 (hiroshima)."
    "examples":
      "ひろしまはおおきいまちです。":
        "native": "Hiroshima is a big city."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "ひろしまへしゅっちょうしました。":
        "native": "I went to Hiroshima on a business trip."
        "bases":
          "しました":
            "meaning": "did (polite)"
  "ja-2647":
    "native": "Nagoya"
    "notes":
      "n1": "nagoya is a large city in the middle of Honshu. It is written 名古屋 (nagoya)."
    "examples":
      "なごやにとしょかんがあります。":
        "native": "There is a library in Nagoya."
        "bases":
          "あります":
            "meaning": "there is (polite)"
      "なごやのえきはひろいです。":
        "native": "The station in Nagoya is spacious."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2648":
    "native": "Sapporo"
    "notes":
      "n1": "sapporo is the largest city of Hokkaido. It is written 札幌 (sapporo)."
    "examples":
      "さっぽろはさむいです。":
        "native": "Sapporo is cold."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "さっぽろでともだちにあいました。":
        "native": "I met a friend in Sapporo."
        "bases":
          "あいました":
            "meaning": "met (polite)"
  "ja-2649":
    "native": "Fukuoka"
    "notes":
      "n1": "fukuoka is a large city in the north of Kyushu. It is written 福岡 (fukuoka)."
    "examples":
      "ふくおかはきゅうしゅうにあります。":
        "native": "Fukuoka is in Kyushu."
        "bases":
          "あります":
            "meaning": "there is (polite)"
      "ふくおかのたべものがおいしいです。":
        "native": "The food in Fukuoka is delicious."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2650":
    "native": "Kobe"
    "notes":
      "n1": "koube is a port city by the sea. It is written 神戸 (koube)."
    "examples":
      "こうべはうみのちかくのまちです。":
        "native": "Kobe is a city near the sea."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "こうべへいってみたいです。":
        "native": "I want to go and see Kobe."
        "bases":
          "いってみたい":
            "meaning": "want to go and try (te-form plus mitai)"
          "です":
            "meaning": "(to be, polite)"
  "ja-2651":
    "native": "Yokohama"
    "notes":
      "n1": "yokohama is a large port city next to Tokyo. It is written 横浜 (yokohama)."
    "examples":
      "よこはまはとうきょうのとなりです。":
        "native": "Yokohama is next to Tokyo."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "よこはまのみなとがきれいです。":
        "native": "The port of Yokohama is beautiful."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2652":
    "native": "Asia"
    "notes":
      "n1": "ajia is the continent of Asia, where Japan is. It is also the word for an Asian person's region in general."
    "examples":
      "アジアにはおおくのくにがあります。":
        "native": "Asia has many countries."
        "bases":
          "おおくの":
            "meaning": "many (before a noun)"
          "あります":
            "meaning": "there is (polite)"
      "わたしはアジアのりょうりがすきです。":
        "native": "I like Asian food."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2653":
    "native": "Europe"
    "notes":
      "n1": "yooroppa is the continent of Europe. It is written in katakana, like the other continents."
    "examples":
      "ヨーロッパへりょこうしたいです。":
        "native": "I want to travel to Europe."
        "bases":
          "したい":
            "meaning": "want to do"
          "です":
            "meaning": "(to be, polite)"
      "ヨーロッパにはふるいまちがおおいです。":
        "native": "Europe has many old towns."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2654":
    "native": "Africa"
    "notes":
      "n1": "afurika is the continent of Africa. The word is written in katakana."
    "examples":
      "アフリカにはおおきいさばくがあります。":
        "native": "Africa has big deserts."
        "bases":
          "あります":
            "meaning": "there is (polite)"
      "アフリカへいきました。":
        "native": "I went to Africa."
        "bases":
          "いきました":
            "meaning": "went (polite)"
  "ja-2655":
    "native": "Australia"
    "notes":
      "n1": "oosutoraria is the country and continent of Australia. The long vowel is written oo."
    "examples":
      "オーストラリアはひろいくにです。":
        "native": "Australia is a large country."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "オーストラリアへいきたいです。":
        "native": "I want to go to Australia."
        "bases":
          "いきたい":
            "meaning": "want to go"
          "です":
            "meaning": "(to be, polite)"
  "ja-2656":
    "native": "Britain"
    "notes":
      "n1": "igirisu is Britain, the United Kingdom of England and its neighbours. It is written in katakana."
    "examples":
      "イギリスはさむいです。":
        "native": "Britain is cold."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "イギリスのことばはえいごです。":
        "native": "The language of Britain is English."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2657":
    "native": "France"
    "notes":
      "n1": "furansu is the country of France, in Europe. It is written in katakana."
    "examples":
      "フランスへりょこうしました。":
        "native": "I travelled to France."
        "bases":
          "しました":
            "meaning": "did (polite)"
      "フランスのまちはうつくしいです。":
        "native": "The towns of France are beautiful."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2658":
    "native": "Germany"
    "notes":
      "n1": "doitsu is the country of Germany, in Europe. It is written in katakana."
    "examples":
