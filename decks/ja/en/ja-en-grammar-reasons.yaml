id: "ja-en-grammar-reasons"
kind: "layer"
core: "ja-grammar-reasons"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Giving a reason: から (kara) and ので (node)"
description: "Put から (kara) or ので (node) after a plain verb or adjective to give a reason: ねつがあるので (netsu ga aru node)、ねます (nemasu), I have a fever, so I go to bed. Every verb a course deck teaches has a row. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "kara-because": "because {meaning}"
    "node": "because {meaning}"
rules:
  "ja-rule-kara-because":
    name: "から (kara): because"
    explanation: "{1} follows a plain verb or adjective to give a reason: {2} means because I eat."
  "ja-rule-node":
    name: "ので (node): because"
    explanation: "{1} also gives a reason, but it sounds softer and more polite than から (kara): {2} means because I eat."
