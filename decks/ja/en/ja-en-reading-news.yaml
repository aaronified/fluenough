    "prompt":
      "en": "Which line says that the writer listened to the weather forecast?"
    "options":
    - "en": "The first line"
    - "en": "The second line"
    "answer": !!int "1"
  - "id": "ja-2906"
    "prompt":
      "en": "The writer watched a programme after the news."
    "answer": !!bool true
  - "id": "ja-2907"
