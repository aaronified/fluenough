"cards":
  "ja-3457":
    "native": "I watched a tragedy and cried."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "みて":
        "meaning": "to watch (te-form)"
      "なきました":
        "meaning": "to cry (polite, past)"
    "confusables":
      "w1":
        "why": "comedy play, not tragedy"
      "w2":
        "why": "horror, not tragedy"
  "ja-3458":
    "notes":
      "n1": "と (to) after a plain verb means when one does, so みると (miruto) is when one watches."
    "native": "When I watch horror I become scared."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "みると":
        "meaning": "when one watches"
      "こわく":
        "meaning": "scary (adverb form)"
      "なります":
        "meaning": "to become (polite)"
    "confusables":
      "w1":
        "why": "suspense, not horror"
      "w2":
        "why": "action, not horror"
