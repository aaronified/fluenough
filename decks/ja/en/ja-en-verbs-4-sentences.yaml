"cards":
  "ja-4106":
    "notes": {"n1": "すんでいます (sunde imasu) is the ongoing form of すむ (sumu), to live, so it means I live in a place."}
    "native": "I live in the town."
    "bases":
      "まち":
        "meaning": "town"
      "に":
        "meaning": "(marks the time, the place or the target)"
      "すんでいます":
        "meaning": "to live (polite)"
    "confusables":
      "w1":
        "why": "to live, a different word"
      "w2":
        "why": "to be clear, another sense"
  "ja-4107":
    "notes": {"n1": "A plain verb placed before a noun describes that noun: かかえる (kakaeru), to hold, before ほん (hon), book, means the book you hold."}
    "native": "I look at the book I hold."
    "bases":
      "かかえる":
        "meaning": "to hold"
      "ほん":
        "meaning": "book"
      "を":
        "meaning": "(marks the thing acted on)"
      "みます":
        "meaning": "to look (polite)"
    "confusables":
      "w1":
        "why": "to hold, polite"
      "w2":
        "why": "to carry"
  "ja-4108":
    "native": "I calm my heart."
    "bases":
      "こころ":
        "meaning": "heart"
      "を":
        "meaning": "(marks the thing acted on)"
      "しずめます":
        "meaning": "to calm (polite)"
    "confusables":
      "w1":
        "why": "to sink, not calm"
      "w2":
        "why": "to govern, not calm"
  "ja-4109":
    "notes": {"n1": "に (ni) marks the place you jump into, as in かわ (kawa), river, after とびこむ (tobikomu), to jump into."}
    "native": "I jumped into the river."
    "bases":
      "かわ":
        "meaning": "river"
      "に":
        "meaning": "(marks the time, the place or the target)"
      "とびこみました":
        "meaning": "to jump into (polite, past)"
    "confusables":
      "w1":
        "why": "to drown, not jump into"
      "w2":
        "why": "to let flow, not jump into"
  "ja-4110":
    "notes": {"n1": "とけました (tokemashita) is intransitive, so the snow melts by itself; the transitive partner とかします (tokashimasu) means to melt something."}
    "native": "The snow melted."
    "bases":
      "ゆき":
        "meaning": "snow"
      "が":
        "meaning": "(marks the subject)"
      "とけました":
        "meaning": "to melt (polite, past)"
    "confusables":
      "w1":
        "why": "to fall, not melt"
      "w2":
        "why": "to be crushed, not melt"
  "ja-4111":
    "notes": {"n1": "つづきます (tsuzukimasu) is intransitive, so the rain goes on by itself; the transitive partner つづけます (tsuzukemasu) means to continue something."}
    "native": "The rain continues."
    "bases":
      "あめ":
        "meaning": "rain"
      "が":
        "meaning": "(marks the subject)"
      "つづきます":
        "meaning": "to continue (polite)"
    "confusables":
      "w1":
        "why": "to keep going, not continue"
      "w2":
        "why": "to stop, not continue"
  "ja-4112":
    "native": "The enemy attacks the town."
    "bases":
      "てき":
        "meaning": "enemy"
      "が":
        "meaning": "(marks the subject)"
      "まち":
        "meaning": "town"
      "を":
        "meaning": "(marks the thing acted on)"
      "おそいます":
        "meaning": "to attack (polite)"
    "confusables":
      "w1":
        "why": "to protect, not attack"
      "w2":
        "why": "to fight, not attack"
  "ja-4113":
    "notes": {"n1": "かないました (kanaimashita) is intransitive, so the dream comes true by itself; the transitive partner かなえます (kanaemasu) means to make something come true."}
    "native": "My dream came true."
    "bases":
      "ゆめ":
        "meaning": "dream"
      "が":
        "meaning": "(marks the subject)"
      "かないました":
        "meaning": "to come true (polite, past)"
    "confusables":
      "w1":
        "why": "to remember, not come true"
      "w2":
        "why": "to notice, not come true"
