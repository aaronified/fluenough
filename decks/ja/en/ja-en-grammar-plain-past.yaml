native: { code: "en", iso639_3: "eng", name: "English" }
name: "The plain past: た (ta) and なかった (nakatta)"
description: "The plain past is the te-form with た (ta) or だ (da); the plain negative past is the ない (nai) form with い (i) replaced by かった (katta). Every verb a course deck teaches has a row. Not yet checked by a Japanese speaker: please report any mistake."
