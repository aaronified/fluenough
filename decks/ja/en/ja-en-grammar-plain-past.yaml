tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "ta-form": "{meaning} (past, plain)"
    "nakatta": "did not {meaning}"
rules:
  "ja-rule-ta-form":
    name: "た (ta): the plain past"
    explanation: "The plain past is the te-form with た (ta) in place of て (te), and だ (da) in place of で (de): たべて (tabete) becomes {1}, いって (itte) becomes {2}, and よんで (yonde) becomes {3}."
  "ja-rule-nakatta":
    name: "なかった (nakatta): the plain negative past"
    explanation: "The plain negative past is the ない (nai) form with い (i) replaced by かった (katta): たべない (tabenai) becomes {1}, and いかない (ikanai) becomes {2}."
