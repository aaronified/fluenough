tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "aru": "there is {meaning}"
    "iru": "there is (a person or animal) {meaning}"
rules:
  "ja-rule-aru-iru":
    name: "あります (arimasu) and います (imasu): there is"
    explanation: "{1} says that a thing or a place is somewhere, as {2}: there is a school. {3} says that a person or an animal is there: there is a dog."
