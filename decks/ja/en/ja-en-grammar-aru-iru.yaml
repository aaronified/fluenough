native: { code: "en", iso639_3: "eng", name: "English" }
name: "There is and there are: あります (arimasu) and います (imasu)"
description: "あります (arimasu) says that a thing or a place is or exists, and います (imasu) that a person or an animal is somewhere. Every noun a course deck teaches has a row: the things take あります (arimasu), the people and animals take います (imasu). Not yet checked by a Japanese speaker: please report any mistake."
