      "n1": "senkyo is an election, the choosing of people by vote. It is written 選挙 (senkyo)."
    "examples":
      "せんきょにいきました。":
        "native": "I went to the election."
        "bases":
          "いきました":
            "meaning": "went (polite)"
      "せんきょはらいねんです。":
        "native": "The election is next year."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2854":
    "native": "vote"
    "notes":
