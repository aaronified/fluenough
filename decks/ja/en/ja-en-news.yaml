        "native": "They raised their prices."
        "bases":
          "しました":
            "meaning": "did (polite)"
      "ねあげはたいへんです。":
        "native": "Raising prices is serious."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2862":
    "native": "prime minister"
    "notes":
