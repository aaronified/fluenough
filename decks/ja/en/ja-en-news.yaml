"cards":
  "ja-2833":
    "native": "news"
    "notes":
      "n1": "nyuusu is news, a report of something that has just happened. It is written in katakana as ニュース (nyuusu)."
    "examples":
      "ニュースをみました。":
        "native": "I watched the news."
        "bases":
          "みました":
            "meaning": "see; to look at; to watch (polite past)"
      "そのニュースはほんとうです。":
        "native": "That news is true."
        "bases":
          "ほんとう":
            "meaning": "true; real"
          "です":
            "meaning": "(to be, polite)"
  "ja-2834":
    "native": "article"
    "notes":
      "n1": "kiji is an article, a piece of writing in a newspaper or magazine. It is written 記事 (kiji)."
    "examples":
      "しんぶんのきじをよみました。":
        "native": "I read a newspaper article."
        "bases":
          "よみました":
            "meaning": "read (polite past)"
      "このきじはおもしろいです。":
        "native": "This article is interesting."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2835":
    "native": "news report"
    "notes":
      "n1": "houdou is a news report, the reporting of events to the public. It is written 報道 (houdou)."
    "examples":
      "ほうどうをみました。":
        "native": "I watched the news report."
        "bases":
          "みました":
            "meaning": "see; to look at; to watch (polite past)"
      "ほうどうははやいです。":
        "native": "The news report is fast."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2836":
    "native": "news gathering"
    "notes":
      "n1": "shuzai is news gathering, going out to collect the facts for a story. It is written 取材 (shuzai)."
    "examples":
      "しゅざいにいきました。":
        "native": "I went out to gather the news."
        "bases":
          "いきました":
            "meaning": "went (polite)"
      "しゅざいはたいへんです。":
        "native": "News gathering is hard work."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2837":
    "native": "reporter"
    "notes":
      "n1": "kisha is a reporter who writes or broadcasts the news. It is written 記者 (kisha)."
    "examples":
      "きしゃがはなしました。":
        "native": "The reporter spoke."
        "bases":
          "はなしました":
            "meaning": "speak; to talk (polite past)"
      "わたしはきしゃです。":
        "native": "I am a reporter."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2838":
    "native": "broadcast"
    "notes":
      "n1": "housou is a broadcast, a programme sent out on radio or television. It is written 放送 (housou)."
    "examples":
      "ほうそうをみました。":
        "native": "I watched the broadcast."
        "bases":
          "みました":
            "meaning": "see; to look at; to watch (polite past)"
      "ほうそうはよるにあります。":
        "native": "The broadcast is in the evening."
        "bases":
          "あります":
            "meaning": "there is (polite)"
  "ja-2839":
    "native": "programme"
    "notes":
      "n1": "bangumi is a programme on radio or television. It is written 番組 (bangumi)."
    "examples":
      "すきなばんぐみです。":
        "native": "It is a programme I like."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "このばんぐみをみてください。":
        "native": "Please watch this programme."
        "bases":
          "みて":
            "meaning": "see; to look at; to watch (te-form)"
          "ください":
            "meaning": "(please give)"
  "ja-2840":
    "native": "weather forecast"
    "notes":
      "n1": "tenkiyohou is the weather forecast. It is written 天気予報 (tenkiyohou)."
    "examples":
      "てんきよほうをききました。":
        "native": "I listened to the weather forecast."
        "bases":
          "ききました":
            "meaning": "listen; to hear; to ask (polite past)"
      "てんきよほうはあたっていました。":
        "native": "The weather forecast was right."
        "bases":
          "あたって":
            "meaning": "hit; to be correct (te-form)"
          "いました":
            "meaning": "was (polite)"
  "ja-2841":
    "native": "forecast"
    "notes":
      "n1": "yohou is a forecast, a prediction of what will happen. It is written 予報 (yohou)."
    "examples":
      "よほうはあたりました。":
        "native": "The forecast was right."
        "bases":
          "あたりました":
            "meaning": "hit; to be correct (polite past)"
      "てんきのよほうをみます。":
        "native": "I look at the weather forecast."
        "bases":
          "みます":
            "meaning": "look at (polite)"
  "ja-2842":
    "native": "broadcasting station"
    "notes":
      "n1": "housoukyoku is a broadcasting station, the company that makes radio or television. It is written 放送局 (housoukyoku)."
    "examples":
      "ほうそうきょくではたらいています。":
        "native": "I work at a broadcasting station."
        "bases":
          "はたらいて":
            "meaning": "work (te-form)"
          "います":
            "meaning": "there is (polite)"
      "ほうそうきょくにでんわします。":
        "native": "I phone the broadcasting station."
        "bases":
          "します":
            "meaning": "do (polite)"
  "ja-2843":
    "native": "information"
    "notes":
      "n1": "jouhou is information, facts and data. It is written 情報 (jouhou)."
    "examples":
      "じょうほうをください。":
        "native": "Please give me the information."
        "bases":
          "ください":
            "meaning": "(please give)"
      "じょうほうがおおいです。":
        "native": "There is a lot of information."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2844":
    "native": "announcement"
    "notes":
      "n1": "happyou is an announcement, the public statement of a fact. It is written 発表 (happyou)."
    "examples":
      "はっぴょうをしました。":
        "native": "They made an announcement."
        "bases":
          "しました":
            "meaning": "did (polite)"
      "はっぴょうはあしたです。":
        "native": "The announcement is tomorrow."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2845":
    "native": "occurrence; outbreak"
    "notes":
      "n1": "hassei is the occurrence or outbreak of something bad, such as a fire. It is written 発生 (hassei)."
    "examples":
      "じしんのはっせいでした。":
        "native": "It was the outbreak of an earthquake."
        "bases":
          "でした":
            "meaning": "was (polite)"
      "でんわがはっせいしました。":
        "native": "A call came up."
        "bases":
          "しました":
            "meaning": "did (polite)"
  "ja-2846":
    "native": "incident; case"
    "notes":
      "n1": "jiken is an incident or a case, something that happened and needs attention. It is written 事件 (jiken)."
    "examples":
      "じけんがおきました。":
        "native": "An incident happened."
        "bases":
          "おきました":
            "meaning": "get up; to wake up (polite past)"
      "じけんのはんにんをさがします。":
        "native": "I look for the criminal in the case."
        "bases":
          "さがします":
            "meaning": "look for; to search (polite)"
  "ja-2847":
    "native": "disaster"
    "notes":
      "n1": "saigai is a disaster, a natural or man-made event that causes great harm. It is written 災害 (saigai)."
    "examples":
      "さいがいがおきました。":
        "native": "A disaster happened."
        "bases":
          "おきました":
            "meaning": "get up; to wake up (polite past)"
      "さいがいはこわいです。":
        "native": "Disasters are frightening."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2848":
    "native": "earthquake"
    "notes":
      "n1": "jishin is an earthquake, the shaking of the ground. It is written 地震 (jishin)."
    "examples":
      "じしんがきました。":
        "native": "An earthquake came."
        "bases":
          "きました":
            "meaning": "came (polite)"
      "じしんはこわいです。":
        "native": "Earthquakes are frightening."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2849":
    "native": "tsunami"
    "notes":
      "n1": "tsunami is a tsunami, a large wave after an earthquake under the sea. It is written 津波 (tsunami)."
    "examples":
      "つなみがきました。":
        "native": "A tsunami came."
        "bases":
          "きました":
            "meaning": "came (polite)"
      "つなみははやいです。":
        "native": "A tsunami is fast."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2850":
    "native": "flood"
    "notes":
      "n1": "kouzui is a flood, when water covers the land after heavy rain. It is written 洪水 (kouzui)."
    "examples":
      "こうずいがおきました。":
        "native": "A flood happened."
        "bases":
          "おきました":
            "meaning": "get up; to wake up (polite past)"
      "かわのこうずいはたいへんです。":
        "native": "The river flood is serious."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2851":
    "native": "war"
    "notes":
      "n1": "sensou is war, fighting between countries. It is written 戦争 (sensou)."
    "examples":
      "せんそうはかなしいです。":
        "native": "War is sad."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "せんそうがおわりました。":
        "native": "The war ended."
        "bases":
          "おわりました":
            "meaning": "finished (polite)"
  "ja-2852":
    "native": "peace"
    "notes":
      "n1": "heiwa is peace, the state without war. It is written 平和 (heiwa)."
    "examples":
      "へいわがいちばんです。":
        "native": "Peace is the most important."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "へいわをまもります。":
        "native": "I protect peace."
        "bases":
          "まもります":
            "meaning": "protect; to keep (polite)"
  "ja-2853":
    "native": "election"
