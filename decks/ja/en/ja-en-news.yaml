        "native": "The economy is important."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "けいざいのニュースをみます。":
        "native": "I watch the economic news."
        "bases":
          "みます":
            "meaning": "look at (polite)"
  "ja-2857":
    "native": "recession"
    "notes":
