        "native": "The bill was passed."
        "bases":
          "とおりました":
            "meaning": "pass through (polite past)"
      "ほうあんをよみます。":
        "native": "I read the bill."
        "bases":
          "よみます":
            "meaning": "read (polite)"
  "ja-2856":
    "native": "economy"
    "notes":
      "n1": "keizai is the economy, the making, buying and selling of goods and money. It is written 経済 (keizai)."
    "examples":
