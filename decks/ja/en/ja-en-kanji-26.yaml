native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 26: grade 5, part 2"
description: "Twenty-eight kanji of the fifth school grade, each taught by the kana reading of the word it stands for. Most have no example yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-6440":
    native: "average"
    notes:
      "n1": "均 (heikin): on reading キン (kin); no kun reading. It is not a word on its own, so its kana へいきん (heikin), average, is the commonest word it ends, written 平均 (heikin). No taught card has that kana, and no taught word is written with 均 (kin), so it has no example yet."
  "ja-6441":
    native: "order; sequence"
    notes:
      "n1": "序 (junjo): on reading ジョ (jo); no kun reading. It is not a word on its own, so its kana じゅんじょ (junjo), order; sequence, is the commonest word it ends, written 順序 (junjo). No taught card has that kana, and no taught word is written with 序 (jo), so it has no example yet."
  "ja-6442":
    native: "aspiration; ambition"
    notes:
      "n1": "志 (kokorozashi): on reading シ (shi); kun readings こころざ-す (kokorozasu) and こころざし (kokorozashi). Its kana こころざし (kokorozashi), aspiration; ambition, is the word it stands for alone in its kun reading, written 志 (kokorozashi). No taught card has that kana, and no taught word is written with 志 (shi), so it has no example yet."
  "ja-6443":
    native: "to respond; to meet"
    notes:
      "n1": "応 (kotaeru): on reading オウ (ou); kun reading こた-える (kota-eru). Its kana こたえる (kotaeru), to respond; to meet, is the word it stands for in its kun reading, written 応える (kotaeru). The taught card こたえる (kotaeru), to answer, is 答える (kotaeru), a different word with the same reading. The taught card おうえん (ouen), cheering; support, is 応援 (ouen), which uses 援 (en), a kanji not yet taught, so it is not an example here. No other taught word with 応 (ou) qualifies, so it has no example yet."
  "ja-6444":
    native: "pleasant; agreeable"
    notes:
      "n1": "快 (kokoroyoi): on reading カイ (kai); kun reading こころよ-い (kokoroyo-i). Its kana こころよい (kokoroyoi), pleasant; agreeable, is the word it stands for in its kun reading, written 快い (kokoroyoi). No taught card has that kana. The taught card ゆかい (yukai), pleasant; merry, is 愉快 (yukai), which uses 愉 (yu), a kanji not yet taught, so it is not an example here. No other taught word with 快 (kai) qualifies, so it has no example yet."
  "ja-6445":
    native: "skill; technique"
    notes:
      "n1": "技 (waza): on reading ギ (gi); kun reading わざ (waza). Its kana わざ (waza), skill; technique, is the word it stands for alone in its kun reading, written 技 (waza). No taught card has that kana, and no taught word is written with 技 (gi) and has a card, so it has no example yet."
  "ja-6446":
    native: "condition; term"
    notes:
      "n1": "条 (jouken): on reading ジョウ (jou); no kun reading. It is not a word on its own, so its kana じょうけん (jouken), condition; term, is the commonest word it begins, written 条件 (jouken). No taught card has that kana, and no taught word is written with 条 (jou) and has a card, so it has no example yet."
  "ja-6447":
    native: "calamity; misfortune"
    notes:
      "n1": "災 (wazawai): on reading サイ (sai); kun reading わざわ-い (wazawa-i). Its kana わざわい (wazawai), calamity; misfortune, is the word it stands for in its kun reading, written 災い (wazawai). No taught card has that kana. Its example uses 災害 (saigai), disaster, which is the taught card さいがい (saigai), with 大きい (ookii), big, from the taught card おおきい (ookii), and 大 (dai) and 害 (gai), taught kanji."
    examples:
      "災害は大きいです。": "The disaster is big."
  "ja-6448":
    native: "situation; circumstances"
    notes:
      "n1": "状 (joukyou): on reading ジョウ (jou); no kun reading. It is not a word on its own, so its kana じょうきょう (joukyou), situation; circumstances, is the commonest word it begins, written 状況 (joukyou). No taught card has that kana, and no taught word is written with 状 (jou) and has a card, so it has no example yet."
  "ja-6449":
    native: "to prevent; to defend against"
    notes:
      "n1": "防 (fusegu): on reading ボウ (bou); kun reading ふせ-ぐ (fuse-gu). Its kana ふせぐ (fusegu), to prevent; to defend against, is the word it stands for in its kun reading, written 防ぐ (fusegu). No taught card has that kana. Its example uses 消防 (shoubou), fire service, which is the taught card しょうぼう (shoubou), with 消 (shou) a taught kanji."
    examples:
      "消防は来ました。": "The fire service came."
  "ja-6450":
    native: "value; worth"
    notes:
      "n1": "価 (atai): on reading カ (ka); kun reading あたい (atai). Its kana あたい (atai), value; worth, is the word it stands for in its kun reading, written 価 (atai). No taught card has that kana. Its example uses 物価 (bukka), prices of goods, which is the taught card ぶっか (bukka), with 物 (butsu) a taught kanji."
    examples:
      "物価は高いです。": "Prices are high."
  "ja-6451":
    native: "system; institution"
    notes:
      "n1": "制 (seido): on reading セイ (sei); no kun reading. It is not a word on its own, so its kana せいど (seido), system; institution, is the commonest word it begins, written 制度 (seido). No taught card has that kana. Its example uses 制服 (seifuku), school uniform, which is the taught card せいふく (seifuku), with 服 (fuku) a taught kanji."
    examples:
      "制服を着ます。": "I wear a school uniform."
  "ja-6452":
    native: "to work; to be effective"
    notes:
      "n1": "効 (kiku): on reading コウ (kou); kun reading き-く (ki-ku). Its kana きく (kiku), to work; to be effective, is the word it stands for in its kun reading, written 効く (kiku). The taught card きく (kiku), to listen; to hear; to ask, is 聞く (kiku), a different word with the same reading, so the two cards share a kana but not a word. No taught word is written with 効 (kou) and has a card, so it has no example yet."
  "ja-6453":
    native: "my wife"
    notes:
      "n1": "妻 (tsuma): on reading サイ (sai); kun reading つま (tsuma). Its kana つま (tsuma), my wife, is the word it stands for alone in its kun reading, written 妻 (tsuma). It is the same word as the taught card つま (tsuma), my wife, so the two cards share a word. Its example uses 先生 (sensei), teacher, which is the taught card せんせい (sensei), with 先 (sen) and 生 (sei) taught kanji."
    examples:
      "妻は先生です。": "My wife is a teacher."
  "ja-6454":
    native: "to be; to exist"
    notes:
      "n1": "居 (iru): on reading キョ (kyo); kun reading い-る (i-ru). Its kana いる (iru), to be; to exist, is the word it stands for in its kun reading, written 居る (iru). No taught card has that kana, and no taught word is written with 居 (kyo) and has a card, so it has no example yet."
  "ja-6455":
    native: "round trip; going and returning"
    notes:
      "n1": "往 (oufuku): on reading オウ (ou); no kun reading. It is not a word on its own, so its kana おうふく (oufuku), round trip; going and returning, is the commonest word it begins, written 往復 (oufuku). No taught card has that kana, and no taught word is written with 往 (ou) and has a card, so it has no example yet."
  "ja-6456":
    native: "character; personality"
    notes:
      "n1": "性 (seikaku): on reading セイ (sei) and ショウ (shou); no kun reading. The card uses セイ (sei). It is not a word on its own, so its kana せいかく (seikaku), character; personality, is the commonest word it begins, written 性格 (seikaku). No taught card has that kana, and no taught word is written with 性 (sei) and has a card, so it has no example yet."
  "ja-6457":
    native: "to invite"
    notes:
      "n1": "招 (maneku): on reading ショウ (shou); kun reading まね-く (mane-ku). Its kana まねく (maneku), to invite, is the word it stands for in its kun reading, written 招く (maneku). No taught card has that kana, and no taught word is written with 招 (shou) and has a card, so it has no example yet."
  "ja-6458":
    native: "easy"
    notes:
      "n1": "易 (yasashii): on reading エキ (eki) and イ (i); kun reading やさ-しい (yasa-shii). Its kana やさしい (yasashii), easy, is the word it stands for in its kun reading, written 易しい (yasashii). The taught card やさしい (yasashii), easy; gentle; kind, is the same word in its easy sense, so the two cards share a word; its gentle and kind senses are written 優しい (yasashii). Its example uses 本 (hon), book, which is the taught card ほん (hon)."
    examples:
      "この本は易しいです。": "This book is easy."
  "ja-6459":
    native: "branch"
    notes:
      "n1": "枝 (eda): on reading シ (shi); kun reading えだ (eda). Its kana えだ (eda), branch, is the word it stands for alone in its kun reading, written 枝 (eda). It is the same word as the taught card えだ (eda), branch, so the two cards share a word. Its example uses 長い (nagai), long, which is the taught card ながい (nagai), with 長 (chou) a taught kanji."
    examples:
      "枝は長いです。": "The branch is long."
  "ja-6460":
    native: "weapon"
    notes:
      "n1": "武 (buki): on reading ブ (bu) and ム (mu); no kun reading. It is not a word on its own, so its kana ぶき (buki), weapon, is the commonest word it begins, written 武器 (buki). No taught card has that kana. 武道 (budou), martial arts, has the same kana as the taught card ぶどう (budou), grapes, a different word, so it is not used here; no taught word is written with 武 (bu) and has a card, so it has no example yet."
  "ja-6461":
    native: "poison"
    notes:
      "n1": "毒 (doku): on reading ドク (doku); no kun reading. It is a word on its own, so its kana どく (doku), poison, is the word it stands for alone, written 毒 (doku). No taught card has that kana. Its example uses 食中毒 (shokuchuudoku), food poisoning, which is the taught card しょくちゅうどく (shokuchuudoku), with 食 (shoku) and 中 (chuu) taught kanji. The adjective こわい (kowai), scary, is written in kana because 怖 (fu) is not taught."
    examples:
      "食中毒はこわいです。": "Food poisoning is scary."
  "ja-6462":
    native: "river"
    notes:
      "n1": "河 (kawa): on reading カ (ka); kun reading かわ (kawa). Its kana かわ (kawa), river, is the word it stands for in its kun reading, written 河 (kawa) for a large river. It is the same word as the taught card かわ (kawa), river, whose usual spelling is 川 (kawa), so the two cards share a word. No taught word is written with 河 (ka) and has a card, so it has no example yet."
  "ja-6463":
    native: "publishing"
    notes:
      "n1": "版 (shuppan): on reading ハン (han); no kun reading. It is not a word on its own, so its kana しゅっぱん (shuppan), publishing, is the commonest word it ends, written 出版 (shuppan), where 版 (han) is read ぱん (pan), a sound change of ハン (han). No taught card has that kana, and no taught word is written with 版 (han) and has a card, so it has no example yet."
  "ja-6464":
    native: "to grow fat; to become fertile"
    notes:
      "n1": "肥 (koeru): on reading ヒ (hi); kun readings こ-える (ko-eru), こえ (koe), こ-やす (ko-yasu) and こ-やし (ko-yashi). Its kana こえる (koeru), to grow fat; to become fertile, is the word it stands for in its kun reading, written 肥える (koeru). No taught card has that kana, and no taught word is written with 肥 (hi) and has a card, so it has no example yet."
  "ja-6465":
    native: "school building"
    notes:
      "n1": "舎 (kousha): on reading シャ (sha); no kun reading. It is not a word on its own, so its kana こうしゃ (kousha), school building, is the commonest word it ends, written 校舎 (kousha). No taught card has that kana. Its example uses 田舎 (inaka), countryside, which is the taught card いなか (inaka), a jukujikun: its reading does not come from 田 (den) or 舎 (sha)."
    examples:
      "田舎は静かです。": "The countryside is quiet."
  "ja-6466":
    native: "to state; to describe"
    notes:
      "n1": "述 (noberu): on reading ジュツ (jutsu); kun reading の-べる (no-beru). Its kana のべる (noberu), to state; to describe, is the word it stands for in its kun reading, written 述べる (noberu). No taught card has that kana, and no taught word is written with 述 (jutsu) and has a card, so it has no example yet."
  "ja-6467":
    native: "emergency; extraordinary"
    notes:
      "n1": "非 (hijou): on reading ヒ (hi); no kun reading. It is not a word on its own, so its kana ひじょう (hijou), emergency; extraordinary, is the commonest word it begins, written 非常 (hijou). No taught card has that kana, and no taught word is written with 非 (hi) and has a card, so it has no example yet."
