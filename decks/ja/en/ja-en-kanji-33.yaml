kind: "layer"
core: "ja-kanji-33"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 33: grade 6, part 2"
description: "Twenty-seven kanji of the sixth school grade, each taught by the kana reading of the word it stands for. Eleven have no example yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-6860":
    native: "filial piety"
    notes:
      "n1": "孝 (koukou): on reading コウ (kou); no kun reading. It is not a word on its own, so its kana こうこう (koukou), filial piety, is the commonest word it begins, written 孝行 (koukou). No taught word card is written with 孝 (koukou), so it has no example yet. No taught card has that kana."
  "ja-6861":
    native: "to forget"
    notes:
      "n1": "忘 (wasureru): on reading ボウ (bou); kun reading わす-れる (wasu-reru). Its kana わすれる (wasureru), to forget, is the word it stands for in its kun reading, written 忘れる (wasureru). The taught card わすれる (wasureru), to forget, from ja-more-verbs, is the same word 忘れる (wasureru). Its example is 宿題を忘れます (shukudai o wasuremasu), where 宿題 (shukudai), homework, is the taught card しゅくだい (shukudai) written with the taught kanji 宿 (shuku) and 題 (dai), を (o) is the taught particle, and 忘れます (wasuremasu) is the masu form of the card."
    examples:
      "宿題を忘れます。": "I forget the homework."
      "忘れ物はどこですか。": "Where is the lost item?"
  "ja-6862":
    native: "to endure; patience"
    notes:
      "n1": "我 (gaman): on reading ガ (ga); kun readings われ (ware) and わ (wa). Neither kun reading is used for the card: われ (ware), I, is a literary word, and わ (wa) is not a word on its own. The commonest word the kanji begins is 我慢 (gaman), endurance, written 我慢 (gaman). The taught card がまん (gaman), patience; endurance, from ja-feelings, is the same word 我慢 (gaman). No example is given, because the word 我慢 (gaman) is written with 慢 (man), which is not yet taught, and the kana form is not used in an example."
  "ja-6863":
    native: "criticism"
    notes:
      "n1": "批 (hihan): on reading ヒ (hi); no kun reading. It is not a word on its own, so its kana ひはん (hihan), criticism, is the commonest word it begins, written 批判 (hihan). The taught card ひはん (hihan), criticism, from ja-opinions, is the same word 批判 (hihan). Its example is 批判を聞きます (hihan o kikimasu), where 聞きます (kikimasu), listens, is the masu form of the taught verb 聞く (kiku) and を (o) is the taught particle."
    examples:
      "批判を聞きます。": "I listen to criticism."
      "批判は大切です。": "Criticism is important."
  "ja-6864":
    native: "I; me"
    notes:
      "n1": "私 (watashi): on reading シ (shi); kun readings わたくし (watakushi), which is formal, and わたし (watashi), which is the one the card uses. Its kana わたし (watashi), I, is the word it stands for alone, written 私 (watashi). The taught card わたし (watashi), I, from ja-first-words, is the same word 私 (watashi). Its example is 私は学生です (watashi wa gakusei desu), where 学生 (gakusei), student, is the taught card がくせい (gakusei), は (wa) is the taught particle, and です (desu) is the taught copula."
    examples:
      "私は学生です。": "I am a student."
      "私たちは学生です。": "We are students."
  "ja-6865":
    native: "lineage; system"
    notes:
      "n1": "系 (keitou): on reading ケイ (kei); no kun reading. It is not a word on its own, so its kana けいとう (keitou), lineage; system, is the commonest word it begins, written 系統 (keitou). No taught card has that kana. Its example is 生態系は大切です (seitaikei wa taisetsu desu), where 生態系 (seitaikei), ecosystem, is the taught card せいたいけい (seitaikei) from ja-environment written with the taught kanji 生 (sei) and 態 (tai) and the target 系 (kei), は (wa) is the taught particle, 大切 (taisetsu), important, is the taught card たいせつ (taisetsu), and です (desu) is the taught copula."
    examples:
      "生態系は大切です。": "The ecosystem is important."
      "生態系を守ります。": "We protect the ecosystem."
  "ja-6866":
    native: "to line up"
    notes:
      "n1": "並 (narabu): on reading ヘイ (hei); kun readings なみ (nami), なら-べる (narabe-ru), なら-ぶ (narabu) and なら-びに (nara-bini). Its kana ならぶ (narabu), to line up, is the commonest kun word it stands for, written 並ぶ (narabu). The other kun readings are not used for the card. The taught card ならぶ (narabu), to queue; to line up, from ja-manners, is the same word 並ぶ (narabu). Its example is 人は駅に並びます (hito wa eki ni narabimasu), where 人 (hito), person, is the taught kanji card ひと (hito) from ja-kanji-3, は (wa) and に (ni) are taught particles, 駅 (eki), station, is the taught kanji card えき (eki) from ja-kanji-17, and 並びます (narabimasu) is the masu form of the card."
    examples:
      "人は駅に並びます。": "People line up at the station."
      "友達と並びます。": "I line up with a friend."
  "ja-6867":
    native: "milk; breast"
    notes:
      "n1": "乳 (chichi): on reading ニュウ (nyuu); kun readings ち (chi) and ちち (chichi). The card uses ちち (chichi), milk; breast, the word it stands for alone. Two taught cards share the kana ちち (chichi) but are different words: the taught card ちち (chichi), my father, from ja-family, and the taught kanji card 父 (chichi), father, from ja-kanji-9. Its example is 牛乳は冷たいです (gyuunyuu wa tsumetai desu), where 牛乳 (gyuunyuu), milk, is the taught card ぎゅうにゅう (gyuunyuu) from ja-quantities written with the taught kanji 牛 (gyuu) and the target 乳 (nyuu), は (wa) is the taught particle, 冷たい (tsumetai), cold, is the taught kanji card 冷 (tsumetai) from ja-kanji-19, and です (desu) is the taught copula."
    examples:
      "牛乳は冷たいです。": "Milk is cold."
      "牛乳を飲みます。": "I drink milk."
  "ja-6868":
    native: "to offer"
    notes:
      "n1": "供 (sonaeru): on reading キョウ (kyou), with the parenthesised reading ク (ku) as a special or very narrow use; kun readings そな-える (sona-eru) and とも (tomo). Its kana そなえる (sonaeru), to offer, is the word it stands for in its kun reading, written 供える (sonaeru). The kun reading とも (tomo) is not used for the card, and the on reading キョウ (kyou) is not used because the kun word is the common word for the kanji alone. The taught kanji card 備 (sonaeru), to prepare; to equip, from ja-kanji-29, has the same kana そなえる (sonaeru) but is a different word, written 備える (sonaeru). Its examples are 子供は元気です (kodomo wa genki desu), where 子供 (kodomo), child, is the taught card こども (kodomo) from ja-family written with the target 供 (kyou), 元気 (genki), healthy, is the taught card げんき (genki) from ja-daily-life, は (wa) is the taught particle, and です (desu) is the taught copula; and 情報を提供します (jouhou o teikyou shimasu), where 情報 (jouhou), information, is the taught card じょうほう (jouhou) from ja-news, を (o) is the taught particle, 提供 (teikyou), provision, is the taught card ていきょう (teikyou) from ja-services written with the target 供 (kyou), and します (shimasu) is the masu form of する (suru)."
    examples:
      "子供は元気です。": "The child is well."
      "情報を提供します。": "I provide information."
  "ja-6869":
    native: "ticket; voucher"
    notes:
      "n1": "券 (ken): on reading ケン (ken); no kun reading. It stands alone for the word けん (ken), ticket; voucher, written 券 (ken). The taught kanji card 県 (ken), prefecture, from ja-kanji-13, and the taught card けん (ken), prefecture, from ja-geography, share the kana けん (ken) but are a different word from 券 (ken). Its examples are 定期券は高いです (teikiken wa takai desu), where 定期券 (teikiken), commuter pass, is the taught card ていきけん (teikiken) from ja-journey written with the taught kanji 定 (tei) and 期 (ki) and the target 券 (ken), は (wa) is the taught particle, 高い (takai), expensive, is the taught kanji card たかい (takai) from ja-kanji-6, and です (desu) is the taught copula; and 航空券は高いです (koukuuken wa takai desu), where 航空券 (koukuuken), plane ticket, is the taught card こうくうけん (koukuuken) from ja-journey written with the taught kanji 航 (kou) and 空 (kuu) and the target 券 (ken), and the rest of the sentence is as above."
    examples:
      "定期券は高いです。": "A commuter pass is expensive."
      "航空券は高いです。": "A plane ticket is expensive."
  "ja-6870":
    native: "to chop finely; to carve"
    notes:
      "n1": "刻 (kizamu): on reading コク (koku); kun reading きざ-む (kiza-mu). Its kana きざむ (kizamu), to chop finely; to carve, is the word it stands for in its kun reading, written 刻む (kizamu). The taught card きざむ (kizamu), to chop, from ja-cooking, is the same word 刻む (kizamu). Its example is 野菜を刻みます (yasai o kizamimasu), where 野菜 (yasai), vegetables, is the taught kanji card やさい (yasai) from ja-kanji-9 written with the taught kanji 野 (ya) and 菜 (na), を (o) is the taught particle, and 刻みます (kizamimasu) is the masu form of the card."
    examples:
      "野菜を刻みます。": "I chop the vegetables."
      "時刻表を見ます。": "I look at the timetable."
  "ja-6871":
    native: "to call"
    notes:
      "n1": "呼 (yobu): on reading コ (ko); kun reading よ-ぶ (yo-bu). Its kana よぶ (yobu), to call, is the word it stands for in its kun reading, written 呼ぶ (yobu). The taught card よぶ (yobu), to call, from ja-help, is the same word 呼ぶ (yobu). Its example is 犬を呼びます (inu o yobimasu), where 犬 (inu), dog, is the taught kanji card いぬ (inu) from ja-kanji-2, を (o) is the taught particle, and 呼びます (yobimasu) is the masu form of the card."
    examples:
      "犬を呼びます。": "I call the dog."
      "呼吸をします。": "I breathe."
  "ja-6872":
    native: "to hang down; to droop"
    notes:
      "n1": "垂 (tareru): on reading スイ (sui); kun readings た-れる (ta-reru) and た-らす (ta-rasu). Its kana たれる (tareru), to hang down, is the word it stands for in its kun reading, written 垂れる (tareru). The other kun reading たらす (ta-rasu) is not used for the card. No taught word card is written with 垂 (tareru), so it has no example yet. No taught card has that kana."
  "ja-6873":
    native: "religion"
    notes:
      "n1": "宗 (shuukyou): on readings シュウ (shuu) and ソウ (sou); no kun reading. It is not a word on its own, so its kana しゅうきょう (shuukyou), religion, is the commonest word it begins, written 宗教 (shuukyou). The taught card しゅうきょう (shuukyou), religion, from ja-religion, is the same word 宗教 (shuukyou). Its example is 宗教は古いです (shuukyou wa furui desu), where 教 (kyou) is the taught kanji card おしえる (oshieru) from ja-kanji-5, 古い (furui), old, is the taught kanji card ふるい (furui) from ja-kanji-6, は (wa) is the taught particle, and です (desu) is the taught copula."
    examples:
      "宗教は古いです。": "Religion is old."
      "宗教は大切です。": "Religion is important."
  "ja-6874":
    native: "space; mid-air"
    notes:
      "n1": "宙 (uchuu): on reading チュウ (chuu); no kun reading. It is not a word on its own, so its kana うちゅう (uchuu), space, is the commonest word it ends, written 宇宙 (uchuu). The taught card うちゅう (uchuu), universe; space, from ja-nature, is the same word 宇宙 (uchuu). The taught kanji card 宇 (u), from ja-kanji-32, has the same kana うちゅう (uchuu) for the same word 宇宙 (uchuu). Its example is 宇宙は広いです (uchuu wa hiroi desu), where 宇宙 (uchuu) is the taught word, written with the taught kanji 宇 (u) from ja-kanji-32 and the target 宙 (chuu), は (wa) is the taught particle, 広い (hiroi), wide; vast, is the taught kanji card ひろい (hiroi) from ja-kanji-6, and です (desu) is the taught copula."
    examples:
      "宇宙は広いです。": "Space is vast."
      "宇宙は大きいです。": "The universe is big."
  "ja-6875":
    native: "treasure"
    notes:
      "n1": "宝 (takara): on reading ホウ (hou); kun reading たから (takara). Its kana たから (takara), treasure, is the word it stands for in its kun reading, written 宝 (takara). No taught word card is written with 宝 (takara), so it has no example yet. No taught card has that kana."
  "ja-6876":
    native: "to deliver"
    notes:
      "n1": "届 (todokeru): no on reading in the table. Its kun readings are とど-ける (todo-keru) and とど-く (todo-ku). Its kana とどける (todokeru), to deliver, is the word it stands for in its kun reading, written 届ける (todokeru). The other kun reading とどく (todoku), to reach, is not used for the card. The taught card とどける (todokeru), to deliver; to report, from ja-verbs-3, is the same word 届ける (todokeru). Its example is 荷物を届けます (nimotsu o todokemasu), where 荷物 (nimotsu), luggage, is the taught card にもつ (nimotsu) from ja-transport, を (o) is the taught particle, and 届けます (todokemasu) is the masu form of the card."
    examples:
      "荷物を届けます。": "I deliver the package."
      "荷物が届きます。": "The package arrives."
  "ja-6877":
    native: "to be extended; to be postponed"
    notes:
      "n1": "延 (nobiru): on reading エン (en); kun readings の-びる (no-biru), の-べる (no-beru) and の-ばす (no-basu). Its kana のびる (nobiru), to be extended; to be postponed, is the word it stands for in its kun reading, written 延びる (nobiru). The other kun readings are not used for the card. No taught word card is written with 延 (nobiru), so it has no example yet. No taught card has that kana."
  "ja-6878":
    native: "advice"
    notes:
      "n1": "忠 (chuukoku): on reading チュウ (chuu); no kun reading. It is not a word on its own, so its kana ちゅうこく (chuukoku), advice, is the commonest word it begins, written 忠告 (chuukoku). No taught word card is written with 忠 (chuukoku), so it has no example yet. No taught card has that kana."
  "ja-6879":
    native: "to hear respectfully; to accept humbly"
    notes:
      "n1": "承 (uketamawaru): on reading ショウ (shou); kun reading うけたまわ-る (uketamawa-ru), to hear respectfully. Its kana うけたまわる (uketamawaru) is the word it stands for in its kun reading, written 承る (uketamawaru). It is a humble word that no taught neutral word can replace, so no example is given. No taught card has that kana. The commonest word it begins, 承知 (shouchi), agreement, is not used for the card."
  "ja-6880":
    native: "to carry on the shoulder"
    notes:
      "n1": "担 (katsugu): on reading タン (tan); kun readings かつ-ぐ (katsu-gu) and にな-う (nina-u). Its kana かつぐ (katsugu), to carry on the shoulder, is the word it stands for in its kun reading, written 担ぐ (katsugu). The other kun reading にな-う (nina-u) is not used for the card. No taught word card is written with 担 (katsugu), so it has no example yet. No taught card has that kana."
  "ja-6881":
    native: "to pray; to worship"
    notes:
      "n1": "拝 (ogamu): on reading ハイ (hai); kun reading おが-む (oga-mu). Its kana おがむ (ogamu), to pray; to worship, is the word it stands for in its kun reading, written 拝む (ogamu). The taught card おがむ (ogamu), to worship; to pray with hands joined, from ja-religion, is the same word 拝む (ogamu). Its example is 神を拝みます (kami o ogamimasu), where 神 (kami), god, is the taught kanji card かみ (kami) from ja-kanji-13, を (o) is the taught particle, and 拝みます (ogamimasu) is the masu form of the card."
    examples:
      "神を拝みます。": "I pray to the god."
      "神社に参拝します。": "I visit a shrine."
  "ja-6882":
    native: "enlargement"
    notes:
      "n1": "拡 (kakudai): on reading カク (kaku); no kun reading. It is not a word on its own, so its kana かくだい (kakudai), enlargement, is the commonest word it begins, written 拡大 (kakudai). No taught word card is written with 拡 (kakudai), so it has no example yet. No taught card has that kana."
  "ja-6883":
    native: "counter for flat things"
    notes:
      "n1": "枚 (mai): on reading マイ (mai); no kun reading. It is the counter for thin, flat things, and its kana まい (mai) is the counter reading of the on reading マイ (mai), so the card uses that kana. Counters are used only with a number, so no example is given. No taught card has that kana."
  "ja-6884":
    native: "to follow along"
    notes:
      "n1": "沿 (sou): on reading エン (en); kun reading そ-う (so-u). Its kana そう (sou), to follow along, is the word it stands for in its kun reading, written 沿う (sou). The taught card そう (sou), priest; monk, from ja-religion, is a different word. No taught word card is written with 沿 (sou), so it has no example yet."
  "ja-6885":
    native: "young"
    notes:
      "n1": "若 (wakai): on readings ジャク (jaku) and the parenthesised reading ニャク (nyaku), a special or very narrow use; kun readings わか-い (waka-i) and も-しくは (mo-shikuwa). Its kana わかい (wakai), young, is the word it stands for in its kun reading, written 若い (wakai). The kun reading もしくは (moshikuwa), or, is not used for the card. The taught card わかい (wakai), young, from ja-appearance, is the same word 若い (wakai). Its example is 先生は若いです (sensei wa wakai desu), where 先生 (sensei) is the taught card せんせい (sensei), は (wa) is the taught particle, and です (desu) is the taught copula."
    examples:
      "先生は若いです。": "The teacher is young."
      "若い人が多いです。": "There are many young people."
  "ja-6886":
    native: "to play music"
    notes:
      "n1": "奏 (kanaderu): on reading ソウ (sou); kun reading かな-でる (kana-deru). Its kana かなでる (kanaderu), to play music, is the word it stands for in its kun reading, written 奏でる (kanaderu). The taught card かなでる (kanaderu), to play, from ja-music, is the same word 奏でる (kanaderu). Its example is 音楽を奏でます (ongaku o kanademasu), where 音楽 (ongaku), music, is the taught card おんがく (ongaku) written with the taught kanji 音 (on) and 楽 (gaku), を (o) is the taught particle, and 奏でます (kanademasu) is the masu form of the card."
    examples:
      "音楽を奏でます。": "I play music."
      "演奏を聞きます。": "I listen to a performance."
