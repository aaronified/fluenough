native: { code: "en", iso639_3: "eng", name: "English" }
name: "The body"
description: "Thirty words for the body and for being ill: the head, face, ears and nose, the arms and legs, the stomach and the back, and the words for pain, itching, fever, a cold and medicine. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
