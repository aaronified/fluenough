name: "Liking: が (ga) with すき (suki) and きらい (kirai)"
description: "The thing you like or dislike takes が (ga), and すき (suki), like, or きらい (kirai), dislike, comes after it with です (desu): おんがくがすきです (ongaku ga suki desu), I like music. Every cell is a whole sentence about one thing. Not yet checked by a Japanese speaker: please report any mistake."
