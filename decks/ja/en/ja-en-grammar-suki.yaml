    "fuyu": "winter"
    "origami": "origami"
  notes: "Say what you like with the thing first, then が (ga), then すき (suki) and です (desu): おんがくがすきです (ongaku ga suki desu), I like music. The thing liked takes が (ga), not を (o), because すき (suki) is a describing word and not a verb. きらい (kirai) works the same way: やきゅうがきらいです (yakyuu ga kirai desu), I dislike baseball. To say who likes it, put the person first with は (wa): わたしはおんがくがすきです (watashi wa ongaku ga suki desu). The noun does not change, and neither do すき (suki) and きらい (kirai) before です (desu)."
