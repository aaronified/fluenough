"schema": 1
"id": "ja-en-addressing"
"kind": "layer"
"core": "ja-addressing"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Addressing people"
"license": "CC-BY-SA-4.0"
"description": "Twenty words for addressing people: the suffixes chan, kun and sama, and the words for a customer, a senior and a junior, a boss, a child and a wife. Not yet checked by a Japanese speaker: please report any mistake."
"tags":
- "beginner"
- "unreviewed"
"cards":
  "ja-0135":
    "native": "chan (a suffix for children and friends)"
    "notes":
      "n1": "ちゃん (chan) is added to a child's name, to a close friend's, or to a name said with affection: ようこちゃん (yoko-chan). Adults rarely use it for each other, and say さん (san) instead."
    "examples":
      "ようこちゃんはがくせいです。":
        "native": "Yoko-chan is a student."
        "bases":
          "ようこ":
            "meaning": "Yoko (a name)"
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "わたしはようこちゃんのせんせいです。":
        "native": "I am Yoko-chan's teacher."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "ようこ":
            "meaning": "Yoko (a name)"
          "の":
            "meaning": "(links two nouns: of, 's)"
          "です":
            "meaning": "is (polite)"
  "ja-0136":
    "native": "kun (a suffix for boys and younger men)"
    "notes":
      "n1": "くん (kun) is added to the name of a boy, a younger man, or a junior at school or work: たけしくん (takeshi-kun). A girl's name takes ちゃん (chan)."
    "examples":
      "たけしくんはがくせいです。":
        "native": "Takeshi-kun is a student."
        "bases":
          "たけし":
            "meaning": "Takeshi (a name)"
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "たけしくんはちいさいです。":
        "native": "Takeshi-kun is small."
        "bases":
          "たけし":
            "meaning": "Takeshi (a name)"
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
  "ja-0137":
    "native": "sama (a very polite suffix)"
    "notes":
      "n1": "さま (sama) is a very polite suffix, used in letters and for people you respect: たなかさま (tanaka-sama). Do not add さん (san) after it on the same name."
    "examples":
      "たなかさまはおきゃくさまです。":
        "native": "Mr. Tanaka is a customer."
        "bases":
          "たなか":
            "meaning": "Tanaka (a surname)"
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "たなかさまはいますか。":
        "native": "Is Mr. Tanaka in?"
        "bases":
          "たなか":
            "meaning": "Tanaka (a surname)"
          "は":
            "meaning": "(marks the topic)"
          "います":
            "meaning": "to be (of a person or animal)"
          "か":
            "meaning": "(marks a question)"
  "ja-0138":
    "native": "customer"
    "notes":
      "n1": "おきゃくさま (okyakusama) is a customer, said with respect, as in a shop or a restaurant. Use it for a guest, not for a friend."
    "examples":
      "おきゃくさまはどこですか。":
        "native": "Where is the customer?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
      "おきゃくさまはがくせいですか。":
        "native": "Is the customer a student?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
  "ja-0139":
    "native": "senior (at school, a club or work)"
    "notes":
      "n1": "せんぱい (senpai) is a senior: someone who joined a school, a club or a company before you. The junior is こうはい (kouhai)."
    "examples":
      "たなかさんはわたしのせんぱいです。":
        "native": "Tanaka-san is my senior."
        "bases":
          "たなか":
            "meaning": "Tanaka (a surname)"
          "は":
            "meaning": "(marks the topic)"
          "の":
            "meaning": "(links two nouns: of, 's)"
          "です":
            "meaning": "is (polite)"
      "せんぱいはにほんにいます。":
        "native": "The senior is in Japan."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "に":
            "meaning": "(marks a place: in, at, to)"
          "います":
            "meaning": "to be (of a person or animal)"
  "ja-0140":
    "native": "junior (at school, a club or work)"
    "notes":
      "n1": "こうはい (kouhai) is a junior: someone who joined after you. The senior is せんぱい (senpai)."
    "examples":
      "こうはいはがくせいです。":
        "native": "The junior is a student."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "わたしのこうはいはたなかさんです。":
        "native": "My junior is Tanaka-san."
        "bases":
          "の":
            "meaning": "(links two nouns: of, 's)"
          "は":
            "meaning": "(marks the topic)"
          "たなか":
            "meaning": "Tanaka (a surname)"
          "です":
            "meaning": "is (polite)"
  "ja-0141":
    "native": "company president"
    "notes":
      "n1": "しゃちょう (shachou) is the president, the head of a whole company. The head of one section in it is かちょう (kachou)."
    "examples":
      "たなかさんはしゃちょうです。":
        "native": "Tanaka-san is the company president."
        "bases":
          "たなか":
            "meaning": "Tanaka (a surname)"
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "しゃちょうはどこですか。":
        "native": "Where is the president?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
  "ja-0142":
    "native": "section chief"
    "notes":
      "n1": "かちょう (kachou) is the head of a section within a company. The company's president is しゃちょう (shachou)."
    "examples":
      "やまださんはかちょうです。":
        "native": "Yamada-san is the section chief."
        "bases":
          "やまだ":
            "meaning": "Yamada (a surname)"
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "かちょうはにほんにいます。":
        "native": "The section chief is in Japan."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "に":
            "meaning": "(marks a place: in, at, to)"
          "います":
            "meaning": "to be (of a person or animal)"
  "ja-0143":
    "native": "friend"
    "notes":
      "n1": "ともだち (tomodachi) is a friend. A close friend is named with ちゃん (chan) or くん (kun)."
    "examples":
      "わたしのともだちはがくせいです。":
        "native": "My friend is a student."
        "bases":
          "の":
            "meaning": "(links two nouns: of, 's)"
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "ともだちはにほんにいます。":
        "native": "The friend is in Japan."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "に":
            "meaning": "(marks a place: in, at, to)"
          "います":
            "meaning": "to be (of a person or animal)"
  "ja-0144":
    "native": "name"
    "notes":
      "n1": "なまえ (namae) is a name, your own or another person's. For someone else's name, speak politely with おなまえ (onamae)."
    "examples":
      "わたしのなまえはたなかです。":
        "native": "My name is Tanaka."
        "bases":
          "の":
            "meaning": "(links two nouns: of, 's)"
          "は":
            "meaning": "(marks the topic)"
          "たなか":
            "meaning": "Tanaka (a surname)"
          "です":
            "meaning": "is (polite)"
      "なまえはなんですか。":
        "native": "What is the name?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "なん":
            "meaning": "what (before です (desu))"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
  "ja-0145":
    "native": "name (polite, someone else's)"
    "notes":
      "n1": "おなまえ (onamae) is someone else's name, said politely; the お (o) adds respect. Ask for it with おなまえはなんですか (onamae wa nan desu ka)."
    "examples":
      "おなまえはなんですか。":
        "native": "What is the name, please?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "なん":
            "meaning": "what (before です (desu))"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
      "せんせいのおなまえはたなかさんです。":
        "native": "The teacher's name is Tanaka-san."
        "bases":
          "の":
            "meaning": "(links two nouns: of, 's)"
          "は":
            "meaning": "(marks the topic)"
          "たなか":
            "meaning": "Tanaka (a surname)"
          "です":
            "meaning": "is (polite)"
  "ja-0146":
    "native": "surname (family name)"
    "notes":
      "n1": "みょうじ (myouji) is the surname, the family name. Japanese people say it before the given name."
    "examples":
      "みょうじはなんですか。":
        "native": "What is the surname?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "なん":
            "meaning": "what (before です (desu))"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
      "わたしのみょうじはたなかです。":
        "native": "My surname is Tanaka."
        "bases":
          "の":
            "meaning": "(links two nouns: of, 's)"
          "は":
            "meaning": "(marks the topic)"
          "たなか":
            "meaning": "Tanaka (a surname)"
          "です":
            "meaning": "is (polite)"
  "ja-0147":
    "native": "person"
    "notes":
      "n1": "ひと (hito) is a person. The polite word is かた (kata), and several people are ひとたち (hitotachi)."
    "examples":
      "あのひとはせんせいです。":
        "native": "That person is a teacher."
        "bases":
          "あの":
            "meaning": "that (over there)"
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "ひとがいます。":
        "native": "There is a person."
        "bases":
          "が":
            "meaning": "(marks the subject)"
          "います":
            "meaning": "to be (of a person or animal)"
  "ja-0148":
    "native": "person (polite)"
    "notes":
      "n1": "かた (kata) is a person, said politely: the polite form of ひと (hito). Use it for a guest or someone you respect, as in あのかた (ano kata), that person."
    "examples":
      "あのかたはせんせいです。":
        "native": "That person, politely, is a teacher."
        "bases":
          "あの":
            "meaning": "that (over there)"
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "かたはがくせいですか。":
        "native": "Is the person a student?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
  "ja-0149":
    "native": "everyone (polite)"
    "notes":
      "n1": "みなさん (minasan) is everyone, said politely to a group: a teacher says みなさん、こんにちは (minasan, konnichiwa) to the class. The plain word is みんな (minna)."
    "examples":
      "みなさん、こんにちは。":
        "native": "Hello, everyone."
      "みなさんはがくせいです。":
        "native": "You all are students."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
  "ja-0150":
    "native": "hey"
    "notes":
      "n1": "ねえ (nee) calls a friend or a younger person before you speak. It is not a greeting, and it is informal."
    "examples":
      "ねえ、みずはどうですか。":
        "native": "Hey, how is the water?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
      "ねえ、たなかさん。":
        "native": "Hey, Tanaka-san."
        "bases":
          "たなか":
            "meaning": "Tanaka (a surname)"
  "ja-0151":
    "native": "young lady"
    "notes":
      "n1": "おじょうさん (ojousan) is a young lady, a polite way to call a girl or a young woman. For a little girl, use おじょうちゃん (ojouchan)."
    "examples":
      "おじょうさんはがくせいです。":
        "native": "The young lady is a student."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "おじょうさんはどこですか。":
        "native": "Where is the young lady?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
  "ja-0152":
    "native": "little boy"
    "notes":
      "n1": "ぼうや (bouya) is a little boy, said kindly to a boy you do not know, as おじょうちゃん (ojouchan) is said to a girl. It is not a name."
    "examples":
      "ぼうやはちいさいです。":
        "native": "The little boy is small."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "ぼうやはどこですか。":
        "native": "Where is the little boy?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
  "ja-0153":
    "native": "little girl"
    "notes":
      "n1": "おじょうちゃん (ojouchan) is a little girl, said kindly, as ぼうや (bouya) is said of a boy."
    "examples":
      "おじょうちゃんはちいさいです。":
        "native": "The little girl is small."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "おじょうちゃんはどこにいますか。":
        "native": "Where is the little girl?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "に":
            "meaning": "(marks a place: in, at, to)"
          "います":
            "meaning": "to be (of a person or animal)"
          "か":
            "meaning": "(marks a question)"
  "ja-0154":
    "native": "wife (someone else's, polite)"
    "notes":
      "n1": "おくさま (okusama) is another person's wife, said with respect. Speak of your own wife in plainer words."
    "examples":
      "おくさまはどなたですか。":
        "native": "Who is the wife, please?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
      "たなかさまのおくさまはいますか。":
        "native": "Is Mr. Tanaka's wife in?"
        "bases":
          "たなか":
            "meaning": "Tanaka (a surname)"
          "の":
            "meaning": "(links two nouns: of, 's)"
          "は":
            "meaning": "(marks the topic)"
          "います":
            "meaning": "to be (of a person or animal)"
          "か":
            "meaning": "(marks a question)"
