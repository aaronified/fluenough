schema: 1
id: "ja-en-quantities"
kind: "layer"
core: "ja-quantities"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Quantities"
description: "Twenty words for amounts and prices: many and few, all and half, about and exactly, money and the price, and everyday food and containers. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "ja-0430":
    native: "many; a lot"
    notes:
      "n1": "おおい (ooi) means many. The opposite is すくない (sukunai)."
    examples:
      "ともだちがおおいです。":
        native: "I have many friends."
        bases:
          "が":
            meaning: "(marks the subject)"
          "です":
            meaning: "is (polite)"
      "がくせいはおおいです。":
        native: "There are many students."
        bases:
          "は":
            meaning: "(marks the topic)"
          "です":
            meaning: "is (polite)"
  "ja-0431":
    native: "few; little"
    notes:
      "n1": "すくない (sukunai) means few or little. The opposite is おおい (ooi)."
    examples:
      "おかねはすくないです。":
        native: "I have little money."
        bases:
          "は":
            meaning: "(marks the topic)"
          "です":
            meaning: "is (polite)"
      "みずがすくないです。":
        native: "There is little water."
        bases:
          "が":
            meaning: "(marks the subject)"
          "です":
            meaning: "is (polite)"
  "ja-0432":
    native: "all; the whole; everything"
    notes:
      "n1": "ぜんぶ (zenbu) means all of it, the whole."
    examples:
      "ぜんぶたべます。": "I eat it all."
      "ぜんぶわかりますか。":
        native: "Do you understand all of it?"
        bases:
          "か":
            meaning: "(marks a question)"
  "ja-0433":
    native: "half"
    notes:
      "n1": "はんぶん (hanbun) means half of something."
    examples:
      "りんごをはんぶんたべます。":
        native: "I eat half an apple."
        bases:
          "を":
            meaning: "(marks the thing acted on)"
      "みずがはんぶんです。":
        native: "The water is half full."
        bases:
          "が":
            meaning: "(marks the subject)"
          "です":
            meaning: "is (polite)"
  "ja-0434":
    native: "almost; nearly; mostly"
    notes:
      "n1": "ほとんど (hotondo) means almost, nearly all of it."
    examples:
      "ほとんどわかります。": "I understand almost all of it."
      "ほとんどねません。": "I almost never sleep."
  "ja-0435":
    native: "roughly; about; generally"
    notes:
      "n1": "だいたい (daitai) means roughly, in a general way."
    examples:
      "だいたいわかります。": "I roughly understand."
      "だいたいいくらですか。":
        native: "About how much is it?"
        bases:
          "です":
            meaning: "is (polite)"
          "か":
            meaning: "(marks a question)"
  "ja-0436":
    native: "a lot of people; a crowd"
    notes:
      "n1": "おおぜい (oozei) means a lot of people."
    examples:
      "がっこうにおおぜいのがくせいがいます。":
        native: "There are a lot of students at the school."
        bases:
          "に":
            meaning: "in; at; to"
          "の":
            meaning: "(links two nouns: of, 's)"
          "が":
            meaning: "(marks the subject)"
          "います":
            meaning: "to be (of people and animals); to exist"
      "ひとがおおぜいです。":
        native: "There are a lot of people."
        bases:
          "が":
            meaning: "(marks the subject)"
          "です":
            meaning: "is (polite)"
  "ja-0437":
    native: "two people"
    notes:
      "n1": "ふたり (futari) means two people. One person is ひとり (hitori)."
    examples:
      "ふたりのともだちがいます。":
        native: "I have two friends."
        bases:
          "の":
            meaning: "(links two nouns: of, 's)"
          "が":
            meaning: "(marks the subject)"
          "います":
            meaning: "to be (of people and animals); to exist"
      "ふたりはがくせいです。":
        native: "The two of them are students."
        bases:
          "は":
            meaning: "(marks the topic)"
          "です":
            meaning: "is (polite)"
  "ja-0438":
    native: "cheap; inexpensive"
    notes:
      "n1": "やすい (yasui) means cheap. The opposite is たかい (takai)."
    examples:
      "でんしゃはやすいです。":
        native: "The train is cheap."
