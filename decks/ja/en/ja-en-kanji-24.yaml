cards:
  "ja-6320":
    native: "flag"
    notes:
      "n1": "旗 (hata): on reading キ (ki); kun reading はた (hata). Its kana はた (hata), flag, is the word it stands for in its kun reading. It is the same word as the taught card はた (hata), flag. No taught word uses it, so it has no example yet."
  "ja-6321":
    native: "fishing"
    notes:
      "n1": "漁 (ryou): on readings ギョ (gyo) and リョウ (ryou); no kun reading in the table. Its kana りょう (ryou), fishing, is the word it stands for alone, through its on reading. It has the same kana as the card 量 (ryou), amount; quantity, in the sibling deck ja-kanji-23, which is not merged yet and is a different word. No taught word uses it, so it has no example yet."
  "ja-6322":
    native: "bear"
    notes:
      "n1": "熊 (kuma): no on reading in the table; kun reading くま (kuma). Its kana くま (kuma), bear, is the word it stands for alone. It is the same word as the taught card くま (kuma), bear. No taught word uses it, so it has no example yet."
  "ja-6323":
    native: "seed"
    notes:
      "n1": "種 (tane): on reading シュ (shu); kun reading たね (tane). Its kana たね (tane), seed, is the word it stands for in its kun reading. It is the same word as the taught card たね (tane), seed. No taught word uses it, so it has no example yet."
  "ja-6324":
    native: "pipe; tube"
    notes:
      "n1": "管 (kuda): on reading カン (kan); kun reading くだ (kuda). Its kana くだ (kuda), pipe; tube, is the word it stands for in its kun reading. No taught card has its kana. No taught word uses it, so it has no example yet."
  "ja-6325":
    native: "theory"
    notes:
      "n1": "説 (setsu): on reading セツ (setsu), and ゼイ (zei) in parentheses in the table as a special or very narrow use; kun reading と-く (to-ku). Its kana せつ (setsu), theory, is the word it stands for alone. No taught card has its kana. No taught word uses it, so it has no example yet."
  "ja-6326":
    native: "barrier; checkpoint"
    notes:
      "n1": "関 (seki): on reading カン (kan); kun readings せき (seki) and かか-わる (kakawaru). Its kana せき (seki), barrier; checkpoint, is the word it stands for in its kun reading. It has the same kana as the taught card せき (seki), cough, from ja-illness, which is a different word; the taught kanji card 席 (seki), seat, from ja-kanji-21, which is a different word; and the card 積 (seki), product, in this deck, which is a different word. No taught word uses it, so it has no example yet."
  "ja-6327":
    native: "quiet; calm"
    notes:
      "n1": "静 (shizuka): on reading セイ (sei), and ジョウ (jou) in parentheses in the table as a special or very narrow use; kun readings しず-か (shizu-ka), しず (shizu), しず-まる (shizu-maru) and しず-める (shizu-meru). Its kana しずか (shizuka), quiet; calm, is the word it stands for in its kun reading, written 静か (shizuka). It is the same word as the taught card しずか (shizuka), quiet; calm. No taught word uses it, so it has no example yet."
  "ja-6328":
    native: "a hundred million"
    notes:
      "n1": "億 (oku): on reading オク (oku); no kun reading in the table. Its kana おく (oku), a hundred million, is the word it stands for alone. It is the same word as the taught card おく (oku), a hundred million. It has the same kana as the card 置 (oku), to put; to place, in the sibling deck ja-kanji-23, which is not merged yet and is a different word. No taught word uses it, so it has no example yet."
  "ja-6329":
    native: "vessel; container"
    notes:
      "n1": "器 (utsuwa): on reading キ (ki); kun reading うつわ (utsuwa). Its kana うつわ (utsuwa), vessel; container, is the word it stands for in its kun reading. No taught card has its kana. No taught word uses it, so it has no example yet."
  "ja-6330":
    native: "mark; sign"
    notes:
      "n1": "標 (hyou): on reading ヒョウ (hyou); no kun reading in the table. Its kana ひょう (hyou), mark; sign, is the word it stands for alone. It has the same kana as the taught card ひょう (hyou), hail (ice pellets), from ja-weather, which is a different word. No taught word uses it, so it has no example yet."
  "ja-6331":
    native: "lagoon"
    notes:
      "n1": "潟 (kata): no on reading in the table; kun reading かた (kata). Its kana かた (kata), lagoon, is the word it stands for in its kun reading. It has the same kana as the taught card かた (kata), person (polite), from ja-addressing, and the taught card かた (kata), shoulder, from ja-body; both are different words. It also has the same kana as the kanji card 方 (kata), person (polite); direction, from ja-kanji-9, which is a different word. No taught word uses it, so it has no example yet."
  "ja-6332":
    native: "fever; heat"
    notes:
      "n1": "熱 (netsu): on reading ネツ (netsu); kun reading あつ-い (atsu-i). Its kana ねつ (netsu), fever; heat, is the word it stands for alone. It is the same word as the taught card ねつ (netsu), fever; temperature. No taught word uses it, so it has no example yet."
  "ja-6333":
    native: "rope"
    notes:
      "n1": "縄 (nawa): on reading ジョウ (jou); kun reading なわ (nawa). Its kana なわ (nawa), rope, is the word it stands for in its kun reading. No taught card has its kana. No taught word uses it, so it has no example yet."
  "ja-6334":
    native: "section; lesson"
    notes:
      "n1": "課 (ka): on reading カ (ka); no kun reading in the table. Its kana か (ka), section; lesson, is the word it stands for alone. It has the same kana as the katakana letter card カ (ka) and the hiragana letter card か (ka); these are letters, and they are different words. No taught word uses it, so it has no example yet."
  "ja-6335":
    native: "ring; circle"
    notes:
      "n1": "輪 (wa): on reading リン (rin); kun reading わ (wa). Its kana わ (wa), ring; circle, is the word it stands for in its kun reading. It has the same kana as the taught kanji card 和 (wa), harmony; peace, from ja-kanji-12, which is a different word, and the katakana letter card ワ (wa) and the hiragana letter card わ (wa), which are letters. No taught word uses it, so it has no example yet."
  "ja-6336":
    native: "to choose"
    notes:
      "n1": "選 (erabu): on reading セン (sen); kun reading えら-ぶ (era-bu). Its kana えらぶ (erabu), to choose, is the word it stands for in its kun reading, written 選ぶ (erabu). It is the same word as the taught card えらぶ (erabu), to choose. No taught word uses it, so it has no example yet."
  "ja-6337":
    native: "to raise; to nourish"
    notes:
      "n1": "養 (yashinau): on reading ヨウ (you); kun reading やしな-う (yashina-u). Its kana やしなう (yashinau), to raise; to nourish, is the word it stands for in its kun reading, written 養う (yashinau). No taught card has its kana. No taught word uses it, so it has no example yet."
  "ja-6338":
    native: "opportunity; occasion"
    notes:
      "n1": "機 (ki): on reading キ (ki); kun reading はた (hata). Its kana き (ki), opportunity; occasion, is the word it stands for alone. It has the same kana as the taught kanji cards 木 (ki), tree; wood, from ja-kanji-1, and 気 (ki), spirit; air; mood, from ja-kanji-2, and the katakana letter card キ (ki) and the hiragana letter card き (ki); these are different words. No taught word uses it, so it has no example yet."
  "ja-6339":
    native: "product"
    notes:
      "n1": "積 (seki): on reading セキ (seki); kun readings つ-む (tsu-mu) and つ-もる (tsu-moru). Its kana せき (seki), product, is the word it stands for alone, in its mathematical sense. It has the same kana as the taught card せき (seki), cough, from ja-illness, and the kanji card 席 (seki), seat, from ja-kanji-21, and the card 関 (seki), barrier; checkpoint, in this deck; these are different words. No taught word uses it, so it has no example yet."
  "ja-6340":
    native: "record"
    notes:
      "n1": "録 (roku): on reading ロク (roku); no kun reading in the table. Its kana ろく (roku), record, is the word it stands for only as a suffix, in the names of written records. It has the same kana as the taught card ろく (roku), six, from ja-numbers-1-20, which is a different word. No taught word uses it, so it has no example yet."
  "ja-6341":
    native: "view; sight"
    notes:
      "n1": "観 (kan): on reading カン (kan); no kun reading in the table. Its kana かん (kan), view; sight, is the word it stands for alone, as a noun. It has the same kana as the taught card かん (kan), can; tin, from ja-groceries, which is a different word. No taught word uses it, so it has no example yet."
  "ja-6342":
    native: "kind; sort"
    notes:
      "n1": "類 (tagui): on reading ルイ (rui); kun reading たぐ-い (tagu-i). Its kana たぐい (tagui), kind; sort, is the word it stands for in its kun reading, written 類い (tagui). No taught card has its kana. No taught word uses it, so it has no example yet."
  "ja-6343":
    native: "experience"
    notes:
      "n1": "験 (keiken): on reading ケン (ken), and ゲン (gen) in parentheses in the table as a special or very narrow use; no kun reading in the table. Its kana けいけん (keiken), experience, is a common word it ends, written 経験 (keiken), which uses the kanji 経 (kei), not yet taught. It is the same word as the taught card けいけん (keiken), experience, from ja-work. No taught word uses it, so it has no example yet."
  "ja-6344":
    native: "mirror"
    notes:
      "n1": "鏡 (kagami): on reading キョウ (kyou); kun reading かがみ (kagami). Its kana かがみ (kagami), mirror, is the word it stands for in its kun reading. It is the same word as the taught card かがみ (kagami), mirror. No taught word uses it, so it has no example yet."
  "ja-6345":
    native: "to wish; to request"
    notes:
      "n1": "願 (negau): on reading ガン (gan); kun reading ねが-う (nega-u). Its kana ねがう (negau), to wish; to request, is the word it stands for in its kun reading, written 願う (negau). No taught card has its kana. No taught word uses it, so it has no example yet."
  "ja-6346":
    native: "to compete"
    notes:
      "n1": "競 (kisou): on readings キョウ (kyou) and ケイ (kei); kun readings きそ-う (kiso-u) and せ-る (se-ru). Its kana きそう (kisou), to compete, is the word it stands for in its kun reading, written 競う (kisou). No taught card has its kana. No taught word uses it, so it has no example yet."
  "ja-6347":
    native: "discussion; deliberation"
    notes:
      "n1": "議 (gi): on reading ギ (gi); no kun reading in the table. Its kana ぎ (gi), discussion; deliberation, is the word it stands for alone. It has the same kana as the letter card ぎ (gi) in ja-hiragana-marks, the voiced mark card, and the katakana letter card ギ (gi); these are letters, and they are different words. No taught word uses it, so it has no example yet."
