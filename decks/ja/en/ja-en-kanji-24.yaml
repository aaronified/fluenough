schema: 1
id: "ja-en-kanji-24"
kind: "layer"
core: "ja-kanji-24"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 24: grade 4, part 7"
description: "Twenty-eight kanji of the fourth school grade, each taught by the kana reading of the word it stands for. Eleven have no example yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-6320":
    native: "flag"
    notes:
      "n1": "旗 (hata): on reading キ (ki); kun reading はた (hata). Its kana はた (hata), flag, is the word it stands for in its kun reading. It is the same word as the taught card はた (hata), flag. Its example uses 旗 (hata), flag, which is that card written with the kanji, in これは旗です (kore wa hata desu). No other taught word is written with it, so it has one example."
    examples:
      "これは旗です。": "This is a flag."
  "ja-6321":
    native: "fishing"
    notes:
      "n1": "漁 (ryou): on readings ギョ (gyo) and リョウ (ryou); no kun reading in the table. Its kana りょう (ryou), fishing, is the word it stands for alone, through its on reading. It has the same kana as the taught kanji card 量 (ryou), amount; quantity, from ja-kanji-23, which is a different word. No taught word is written with it, so it has no example yet."
  "ja-6322":
    native: "bear"
    notes:
      "n1": "熊 (kuma): no on reading in the table; kun reading くま (kuma). Its kana くま (kuma), bear, is the word it stands for alone. It is the same word as the taught card くま (kuma), bear. Its example uses 熊 (kuma), bear, which is that card written with the kanji, in 熊はおおきいです (kuma wa ookii desu), with the taught card おおきい (ookii), big. No other taught word is written with it, so it has one example."
    examples:
      "熊はおおきいです。": "The bear is big."
  "ja-6323":
    native: "seed"
    notes:
      "n1": "種 (tane): on reading シュ (shu); kun reading たね (tane). Its kana たね (tane), seed, is the word it stands for in its kun reading. It is the same word as the taught card たね (tane), seed. Its example uses 種 (tane), seed, which is that card written with the kanji, in これは種です (kore wa tane desu). No other taught word is written with it, so it has one example."
    examples:
      "これは種です。": "This is a seed."
  "ja-6324":
    native: "pipe; tube"
    notes:
      "n1": "管 (kuda): on reading カン (kan); kun reading くだ (kuda). Its kana くだ (kuda), pipe; tube, is the word it stands for in its kun reading. No taught card has its kana. No taught word is written with it, so it has no example yet."
  "ja-6325":
    native: "theory"
    notes:
      "n1": "説 (setsu): on reading セツ (setsu), and ゼイ (zei) in parentheses in the table as a special or very narrow use; kun reading と-く (to-ku). Its kana せつ (setsu), theory, is the word it stands for alone. No taught card has its kana. No taught word is written with it, so it has no example yet."
  "ja-6326":
    native: "barrier; checkpoint"
    notes:
      "n1": "関 (seki): on reading カン (kan); kun readings せき (seki) and かか-わる (kakawaru). Its kana せき (seki), barrier; checkpoint, is the word it stands for in its kun reading. It has the same kana as the taught card せき (seki), cough, from ja-illness, and the taught kanji card 席 (seki), seat, from ja-kanji-21; both are different words. No taught word is written with it, so it has no example yet."
  "ja-6327":
    native: "quiet; calm"
    notes:
      "n1": "静 (shizuka): on reading セイ (sei), and ジョウ (jou) in parentheses in the table as a special or very narrow use; kun readings しず (shizu), しず-か (shizu-ka), しず-まる (shizu-maru) and しず-める (shizu-meru). Its kana しずか (shizuka), quiet; calm, is the word it stands for in its kun reading, written 静か (shizuka). It is the same word as the taught card しずか (shizuka), quiet; calm. Its example uses 学校 (gakkou), school, which is the taught card がっこう (gakkou), and 静か (shizuka), which is that card written with the kanji, in 学校は静かです (gakkou wa shizuka desu). No other taught word is written with it, so it has one example."
    examples:
      "学校は静かです。": "The school is quiet."
  "ja-6328":
    native: "a hundred million"
    notes:
      "n1": "億 (oku): on reading オク (oku); no kun reading in the table. Its kana おく (oku), a hundred million, is the word it stands for alone. It is the same word as the taught card おく (oku), a hundred million. It has the same kana as the taught kanji card 置 (oku), to put; to place, from ja-kanji-23, which is a different word. Its example uses 億 (oku), a hundred million, which is that card written with the kanji, in 億はおおきいです (oku wa ookii desu), with the taught card おおきい (ookii), big. No other taught word is written with it, so it has one example."
    examples:
      "億はおおきいです。": "A hundred million is big."
  "ja-6329":
    native: "vessel; container"
    notes:
      "n1": "器 (utsuwa): on reading キ (ki); kun reading うつわ (utsuwa). Its kana うつわ (utsuwa), vessel; container, is the word it stands for in its kun reading. No taught card has its kana. Its example uses 食器 (shokki), dishes; crockery, which is the taught card しょっき (shokki), with the taught word きれい (kirei), clean; pretty, in 食器はきれいです (shokki wa kirei desu). No other taught word is written with it, so it has one example."
    examples:
      "食器はきれいです。": "The tableware is clean."
  "ja-6330":
    native: "goal; target"
    notes:
      "n1": "標 (mokuhyou): on reading ヒョウ (hyou); no kun reading in the table. Its kana もくひょう (mokuhyou), goal; target, is a common word it ends, written 目標 (mokuhyou), which uses the taught kanji 目 (moku). No taught card has its kana. No taught word is written with it, so it has no example yet."
  "ja-6331":
    native: "lagoon"
    notes:
      "n1": "潟 (kata): no on reading in the table; kun reading かた (kata). Its kana かた (kata), lagoon, is the word it stands for in its kun reading. It has the same kana as the taught card かた (kata), person (polite), from ja-addressing, and the taught card かた (kata), shoulder, from ja-body; both are different words. It also has the same kana as the taught kanji card 方 (kata), person (polite); direction, from ja-kanji-9, which is a different word. No taught word is written with it, so it has no example yet."
  "ja-6332":
    native: "fever; heat"
    notes:
      "n1": "熱 (netsu): on reading ネツ (netsu); kun reading あつ-い (atsu-i). Its kana ねつ (netsu), fever; heat, is the word it stands for alone. It is the same word as the taught card ねつ (netsu), fever; temperature. Its example uses 熱 (netsu), fever, which is that card written with the kanji, in 熱はたかいです (netsu wa takai desu), with the taught card たかい (takai), high; expensive. No other taught word is written with it, so it has one example."
    examples:
      "熱はたかいです。": "The fever is high."
  "ja-6333":
    native: "rope"
    notes:
      "n1": "縄 (nawa): on reading ジョウ (jou); kun reading なわ (nawa). Its kana なわ (nawa), rope, is the word it stands for in its kun reading. No taught card has its kana. No taught word is written with it, so it has no example yet."
  "ja-6334":
    native: "section; lesson"
    notes:
      "n1": "課 (ka): on reading カ (ka); no kun reading in the table. Its kana か (ka), section; lesson, is the word it stands for alone. It has the same kana as the katakana letter card カ (ka) and the hiragana letter card か (ka); these are letters, and they are different words. Its two examples use 課長 (kachou), section chief, which is the taught card かちょう (kachou), in これは課長です (kore wa kachou desu), and 放課後 (houkago), after school, which is the taught card ほうかご (houkago), in これは放課後です (kore wa houkago desu). Both are taught words written with it, so it has two examples."
    examples:
      "これは課長です。": "This is a section chief."
      "これは放課後です。": "This is after school."
  "ja-6335":
    native: "ring; circle"
    notes:
      "n1": "輪 (wa): on reading リン (rin); kun reading わ (wa). Its kana わ (wa), ring; circle, is the word it stands for in its kun reading. It has the same kana as the taught kanji card 和 (wa), harmony; peace, from ja-kanji-12, which is a different word, and the katakana letter card ワ (wa) and the hiragana letter card わ (wa), which are letters. Its example uses 指輪 (yubiwa), ring, which is the taught card ゆびわ (yubiwa), in これは指輪です (kore wa yubiwa desu). No other taught word is written with it, so it has one example."
    examples:
      "これは指輪です。": "This is a ring."
  "ja-6336":
    native: "to choose"
    notes:
      "n1": "選 (erabu): on reading セン (sen); kun reading えら-ぶ (era-bu). Its kana えらぶ (erabu), to choose, is the word it stands for in its kun reading, written 選ぶ (erabu). It is the same word as the taught card えらぶ (erabu), to choose. Its two examples use the masu form 選びます (erabimasu) of that card, in わたしはこれを選びます (watashi wa kore o erabimasu), and 選手 (senshu), player; athlete, which is the taught card せんしゅ (senshu), in 選手ははしります (senshu wa hashirimasu), with the masu form はしります (hashirimasu) of はしる (hashiru). Both are taught words written with it, so it has two examples."
    examples:
      "わたしはこれを選びます。": "I choose this."
      "選手ははしります。": "The athlete runs."
  "ja-6337":
    native: "to raise; to nourish"
    notes:
      "n1": "養 (yashinau): on reading ヨウ (you); kun reading やしな-う (yashina-u). Its kana やしなう (yashinau), to raise; to nourish, is the word it stands for in its kun reading, written 養う (yashinau). No taught card has its kana. No taught word is written with it, so it has no example yet."
  "ja-6338":
    native: "machine"
    notes:
      "n1": "機 (kikai): on reading キ (ki); kun reading はた (hata). Its kana きかい (kikai), machine, is a common word it ends, written 機械 (kikai), which is the same word as the taught kanji card 械 (kikai), machine, from ja-kanji-22. Its example uses 飛行機 (hikouki), aeroplane, which is the taught card ひこうき (hikouki), in 飛行機ははやいです (hikouki wa hayai desu), with the taught card はやい (hayai), early; fast; quick. No other taught word is written with it, so it has one example."
    examples:
      "飛行機ははやいです。": "The aeroplane is fast."
  "ja-6339":
    native: "to pile up"
    notes:
      "n1": "積 (tsumu): on reading セキ (seki); kun readings つ-む (tsu-mu) and つ-もる (tsu-moru). Its kana つむ (tsumu), to pile up, is the word it stands for in its kun reading, written 積む (tsumu). No taught card has its kana. No taught word is written with it, so it has no example yet."
  "ja-6340":
    native: "record"
    notes:
      "n1": "録 (kiroku): on reading ロク (roku); no kun reading in the table. Its kana きろく (kiroku), record, is a common word it ends, written 記録 (kiroku), and it is the same word as the taught card きろく (kiroku), record. Its two examples use 記録 (kiroku), record, in 記録はあたらしいです (kiroku wa atarashii desu), with the taught card あたらしい (atarashii), new, and 登録 (touroku), registration, which is the taught card とうろく (touroku), in 登録はおわりました (touroku wa owarimashita), with the masu past おわりました (owarimashita) of おわる (owaru). Both are taught words written with it, so it has two examples."
    examples:
      "記録はあたらしいです。": "The record is new."
      "登録はおわりました。": "The registration has finished."
  "ja-6341":
    native: "sightseeing"
    notes:
      "n1": "観 (kankou): on reading カン (kan); no kun reading in the table. Its kana かんこう (kankou), sightseeing, is a common word it begins, written 観光 (kankou), and it is the same word as the taught card かんこう (kankou), sightseeing. Its two examples use 観光 (kankou), sightseeing, in 観光にいきます (kankou ni ikimasu), with the taught verb いきます (ikimasu) of いく (iku), and 観客 (kankyaku), spectators; audience, which is the taught card かんきゃく (kankyaku), in 観客はおおいです (kankyaku wa ooi desu), with the taught card おおい (ooi), many; a lot. Both are taught words written with it, so it has two examples."
    examples:
      "観光にいきます。": "I am going sightseeing."
      "観客はおおいです。": "There are many spectators."
  "ja-6342":
    native: "kind; sort"
    notes:
      "n1": "類 (tagui): on reading ルイ (rui); kun reading たぐ-い (tagu-i). Its kana たぐい (tagui), kind; sort, is the word it stands for in its kun reading, written 類い (tagui). No taught card has its kana. No taught word is written with it, so it has no example yet."
  "ja-6343":
    native: "experience"
    notes:
      "n1": "験 (keiken): on reading ケン (ken), and ゲン (gen) in parentheses in the table as a special or very narrow use; no kun reading in the table. Its kana けいけん (keiken), experience, is a common word it ends, written 経験 (keiken), and it is the same word as the taught card けいけん (keiken), experience, from ja-work. Its example uses 試験 (shiken), exam; test, which is the taught card しけん (shiken), in 試験はむずかしいです (shiken wa muzukashii desu), with the taught word むずかしい (muzukashii), difficult; hard. No other taught word is written with it, so it has one example."
    examples:
      "試験はむずかしいです。": "The exam is difficult."
  "ja-6344":
    native: "mirror"
    notes:
      "n1": "鏡 (kagami): on reading キョウ (kyou); kun reading かがみ (kagami). Its kana かがみ (kagami), mirror, is the word it stands for in its kun reading. It is the same word as the taught card かがみ (kagami), mirror. Its example uses 鏡 (kagami), mirror, which is that card written with the kanji, in 鏡はきれいです (kagami wa kirei desu), with the taught card きれい (kirei), clean; pretty. No other taught word is written with it, so it has one example."
    examples:
      "鏡はきれいです。": "The mirror is clean."
  "ja-6345":
    native: "to wish; to request"
    notes:
      "n1": "願 (negau): on reading ガン (gan); kun reading ねが-う (nega-u). Its kana ねがう (negau), to wish; to request, is the word it stands for in its kun reading, written 願う (negau). No taught card has its kana. The phrase card おねがいします (onegai shimasu) is not used, since it is a phrase card and not a word card. No taught word is written with it, so it has no example yet."
  "ja-6346":
    native: "to compete"
    notes:
      "n1": "競 (kisou): on readings キョウ (kyou) and ケイ (kei); kun readings きそ-う (kiso-u) and せ-る (se-ru). Its kana きそう (kisou), to compete, is the word it stands for in its kun reading, written 競う (kisou). Its example uses 競走 (kyousou), race, which is the taught card きょうそう (kyousou), in 競走はたのしいです (kyousou wa tanoshii desu), with the taught card たのしい (tanoshii), fun; enjoyable. No other taught word is written with it, so it has one example."
    examples:
      "競走はたのしいです。": "The race is fun."
  "ja-6347":
    native: "meeting"
    notes:
      "n1": "議 (kaigi): on reading ギ (gi); no kun reading in the table. Its kana かいぎ (kaigi), meeting, is a common word it ends, written 会議 (kaigi), and it is the same word as the taught card かいぎ (kaigi), meeting. Its example uses 会議 (kaigi), meeting, which is that card, in 会議はおわりました (kaigi wa owarimashita), with the masu past おわりました (owarimashita) of おわる (owaru). No other taught word is written with it, so it has one example."
    examples:
      "会議はおわりました。": "The meeting has finished."
