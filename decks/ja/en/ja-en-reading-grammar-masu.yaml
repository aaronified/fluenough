passages:
  - id: "ja-grammar-masu-1"
    title: "A morning"
    sentences:
      - text: "わたしはあさおきます。"
        reading: "watashi wa asa okimasu."
      - text: "ははがごはんをつくります。"
        reading: "haha ga gohan o tsukurimasu."
      - text: "ちちはごはんをたべません。"
        reading: "chichi wa gohan o tabemasen."
      - text: "わたしはみずをのみません。"
        reading: "watashi wa mizu o nomimasen."
    questions:
      - id: "ja-0685"
        prompt:
          en: "Which line says that someone cooks?"
        options:
          - en: "The first line"
          - en: "The second line"
        answer: 2
      - id: "ja-0686"
        prompt:
          en: "The third line says that the father does not eat rice."
        answer: true
      - id: "ja-0687"
        prompt:
          en: "Which line says that the speaker does not drink?"
        options:
          - en: "The third line"
          - en: "The fourth line"
        answer: 2
  - id: "ja-grammar-masu-2"
    title: "Notes on a week"
    sentences:
      - text: "わたしはがっこうにいきます。"
        reading: "watashi wa gakkou ni ikimasu."
      - text: "せんせいはきょうやすみません。"
        reading: "sensei wa kyou yasumimasen."
      - text: "ともだちはにほんごをならいます。"
        reading: "tomodachi wa nihongo o naraimasu."
      - text: "わたしはよるねません。"
        reading: "watashi wa yoru nemasen."
    questions:
      - id: "ja-0688"
        prompt:
          en: "Which line says that the speaker goes to school?"
        options:
          - en: "The first line"
          - en: "The second line"
        answer: 1
      - id: "ja-0689"
        prompt:
          en: "The second line says that the teacher does not rest today."
        answer: true
      - id: "ja-0690"
        prompt:
          en: "Which line says that the speaker does not sleep at night?"
        options:
          - en: "The third line"
          - en: "The fourth line"
        answer: 2
