schema: 1
id: "ja-en-grammar-reasons-sentences"
kind: "layer"
core: "ja-grammar-reasons-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Reasons in sentences"
description: "Sentences that give a reason, to put in order, each with the words it could be mistaken for. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "ja-4467":
    native: "It is hot, so I drink water."
    notes:
      "n1": "An adjective such as あつい (atsui) stands as it is before から (kara)."
    bases:
      "から": { meaning: "because" }
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "のむ (nomu) means to drink." }
      w2: { why: "たべる (taberu) means to eat." }
  "ja-4468":
    native: "It is cold, so I stay at home."
    notes:
      "n1": "から (kara) follows the plain form of an い (i) adjective: さむい (samui), cold."
    bases:
      "から": { meaning: "because" }
      "に": { meaning: "(in, at, to)" }
      "います": { meaning: "to be, to stay (for people and animals)" }
    confusables:
      w1: { why: "かえる (kaeru) means to return home; to go home." }
      w2: { why: "いく (iku) means to go." }
  "ja-4469":
    native: "I am busy, so I will not go."
    notes:
      "n1": "ので (node) follows the plain form: いそがしい (isogashii), busy. It sounds softer than から (kara), so it is common in polite speech."
    bases:
      "ので": { meaning: "because" }
    confusables:
      w1: { why: "いく (iku) means to go." }
      w2: { why: "かえる (kaeru) means to return home; to go home." }
  "ja-4470":
    native: "I have a fever, so I go to bed."
    notes:
      "n1": "ので (node) gives a reason in a softer way than から (kara), so it is often used to explain politely."
    bases:
      "が": { meaning: "(marks the one who does the action)" }
      "ある": { meaning: "to be, to exist (for things)" }
      "ので": { meaning: "because" }
    confusables:
      w1: { why: "ねる (neru) means to sleep; to go to bed." }
      w2: { why: "おきる (okiru) means to get up; to wake up." }
  "ja-4471":
    native: "I have an exam, so I read a book."
    bases:
      "が": { meaning: "(marks the one who does the action)" }
      "ある": { meaning: "to be, to exist (for things)" }
      "ので": { meaning: "because" }
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "よむ (yomu) means to read." }
      w2: { why: "かく (kaku) means to write." }
  "ja-4472":
    native: "It is cheap, so I will buy it."
    bases:
      "から": { meaning: "because" }
    confusables:
      w1: { why: "かう (kau) means to buy; to keep (an animal)." }
      w2: { why: "つくる (tsukuru) means to make; to create." }
