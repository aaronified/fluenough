schema: 1
id: "ja-en-grammar-place-particles"
kind: "layer"
core: "ja-grammar-place-particles"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Going to, from and as far as: へ (e), から (kara) and まで (made)"
description: "へ (e) says the way a thing goes, から (kara) from, and まで (made) as far as or until. Only place nouns have rows. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "particle"
  slots:
    "e": "to: {meaning} (e)"
    "kara": "from: {meaning} (kara)"
    "made": "as far as: {meaning} (made)"
rules:
  "ja-rule-particle-e":
    name: "へ (e): to"
    explanation: "{1} says the direction a thing goes: {2} means I go to school."
  "ja-rule-kara-made":
    name: "から (kara), まで (made): from, as far as"
    explanation: "{1} marks the start of a place or time, and {2} its end: {3} means from school to Tokyo."
