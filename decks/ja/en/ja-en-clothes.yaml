    "explanation": "The basic colours: あか (aka), red; あお (ao), blue; きいろ (kiiro), yellow; しろ (shiro), white; くろ (kuro), black; みどり (midori), green; ちゃいろ (chairo), brown; and むらさき (murasaki), purple. To ask which colour, say なにいろ (nani iro)."
