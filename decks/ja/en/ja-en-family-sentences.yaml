"name": "Family in sentences"
"license": "CC-BY-SA-4.0"
"description": "Six sentences about family, to put in order, each with the words it could be mistaken for. Not yet checked by a Japanese speaker: please report any mistake."
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "ja-0256":
    "native": "My mother and father are in Japan."
    "bases":
      "の":
        "meaning": "(links two nouns: of, 's)"
      "と":
        "meaning": "and (joins two words)"
      "は":
        "meaning": "(marks the topic)"
      "に":
        "meaning": "in; at; to"
      "います":
        "meaning": "to be (of people and animals)"
    "confusables":
      "w1":
        "why": "あに (ani) is an older brother, not a parent: the sentence needs はは (haha) and ちち (chichi)."
      "w2":
        "why": "おとうと (otouto) is a younger brother, not a parent."
  "ja-0257":
    "native": "Are your older brother and older sister well?"
    "bases":
      "の":
        "meaning": "(links two nouns: of, 's)"
      "と":
        "meaning": "and (joins two words)"
      "は":
        "meaning": "(marks the topic)"
      "げんき":
        "meaning": "well; healthy"
      "です":
        "meaning": "is (polite)"
      "か":
        "meaning": "(marks a question)"
    "confusables":
      "w1":
        "why": "おとうさん (otousan) is a father, not a brother: the sentence asks about the older brother and sister."
      "w2":
        "why": "あね (ane) is your own older sister; the sentence has someone else's, おねえさん (oneesan)."
  "ja-0258":
    "native": "The uncle and the aunt are in Japan."
    "bases":
      "と":
        "meaning": "and (joins two words)"
      "は":
        "meaning": "(marks the topic)"
      "に":
        "meaning": "in; at; to"
      "います":
        "meaning": "to be (of people and animals)"
    "confusables":
      "w1":
        "why": "おじ (oji) is your own uncle; the sentence has someone else's, おじさん (ojisan)."
      "w2":
        "why": "おば (oba) is your own aunt; the sentence has someone else's, おばさん (obasan)."
  "ja-0259":
    "native": "Tanaka-san's child is small."
    "bases":
      "たなか":
        "meaning": "Tanaka (a surname)"
      "の":
        "meaning": "(links two nouns: of, 's)"
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "is (polite)"
    "confusables":
      "w1":
        "why": "まご (mago) is a grandchild, not a child: the sentence says こども (kodomo)."
      "w2":
        "why": "むすこ (musuko) is a son; the sentence says a child of either sex, こども (kodomo)."
  "ja-0260":
    "native": "My daughter is a student."
    "bases":
      "の":
        "meaning": "(links two nouns: of, 's)"
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "is (polite)"
    "confusables":
      "w1":
        "why": "むすこさん (musukosan) is someone else's son, not a daughter."
      "w2":
        "why": "むすめさん (musumesan) is someone else's daughter; the sentence says your own, むすめ (musume)."
  "ja-0261":
    "native": "Are your husband and parents well?"
    "bases":
      "の":
        "meaning": "(links two nouns: of, 's)"
      "と":
        "meaning": "and (joins two words)"
      "は":
        "meaning": "(marks the topic)"
      "げんき":
        "meaning": "well; healthy"
      "です":
        "meaning": "is (polite)"
      "か":
        "meaning": "(marks a question)"
    "confusables":
      "w1":
        "why": "つま (tsuma) is your own wife, not a husband."
      "w2":
        "why": "おっと (otto) is your own husband; the sentence says ごしゅじん (goshujin), someone else's."
