name: "Skill: が (ga) with じょうず (jouzu), へた (heta), とくい (tokui) and にがて (nigate)"
description: "The thing you are good or bad at takes が (ga), and じょうず (jouzu), へた (heta), とくい (tokui) or にがて (nigate) comes after it with です (desu): うたがじょうずです (uta ga jouzu desu), good at singing. Every cell is a whole sentence about one thing. Not yet checked by a Japanese speaker: please report any mistake."
