tags: ["grammar", "unreviewed"]
pattern:
  name: "Skill: が (ga) with じょうず (jouzu), へた (heta), とくい (tokui) and にがて (nigate)"
  slot_name: "skill"
  slots:
    "jouzu": "is good at it (skilful)"
    "heta": "is poor at it (unskilful)"
    "tokui": "is good at it (a strong point)"
    "nigate": "is not good at it (a weak point)"
  entries:
    "uta": "song"
    "ryouri": "cooking"
    "eigo": "English"
    "odori": "dance"
    "suiei": "swimming"
    "yakyuu": "baseball"
    "kakekko": "running race"
    "shodou": "calligraphy"
  notes: "A skill takes が (ga) the same way a liking does: うたがじょうずです (uta ga jouzu desu), good at singing. じょうず (jouzu) and へた (heta) judge how well something is done, so about yourself じょうず (jouzu) sounds proud and へた (heta) sounds blunt. とくい (tokui) and にがて (nigate) say what suits a person: とくい (tokui) is a strong point and にがて (nigate) a weak one, so they are the gentler words for yourself: えいごがにがてです (eigo ga nigate desu), English is not my strong point. Put the person first with は (wa) when you say who it is: あにはすいえいがとくいです (ani wa suiei ga tokui desu). The noun and the describing word do not change before です (desu)."
