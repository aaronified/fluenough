core: "ja-about-me"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "About me"
description: "Twenty words for talking about yourself: your country, your age, the school or university you go to, the languages you like or are good at, your hobby, and where you are from. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "ja-0309":
    native: "country; home country"
    notes:
      "n1": "くに (kuni) is a country. Ask どこ (doko) for the country, not the city."
    examples:
      "わたしのくにはにほんです。":
        native: "My country is Japan."
        bases:
          "の":
            meaning: "(links two nouns: of, 's)"
          "は":
            meaning: "(marks the topic)"
          "です":
            meaning: "is (polite)"
      "あなたのくにはどこですか。":
        native: "Which is your country?"
        bases:
          "の":
            meaning: "(links two nouns: of, 's)"
          "は":
            meaning: "(marks the topic)"
          "です":
            meaning: "is (polite)"
          "か":
            meaning: "(marks a question)"
