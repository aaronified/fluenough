schema: 1
id: "ja-en-kanji-6"
kind: "layer"
core: "ja-kanji-6"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 6: grade 2, part 2"
description: "Thirty-two kanji of the second school grade, each taught by the kana reading of the word it stands for. Some have one example or none yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-5240":
    native: "near; close"
    notes:
      "n1": "近 (chikai): on reading キン (kin); kun reading ちかい (chikai). It is in 近い (chikai), near."
    examples:
      "えきは近いです。": "The station is near."
      "うちはえきの近くです。": "My house is near the station."
  "ja-5241":
    native: "older brother"
    notes:
      "n1": "兄 (ani): on reading ケイ (kei); kun reading あに (ani). It is in お兄さん (oniisan), an older brother."
    examples:
      "兄はがくせいです。": "My older brother is a student."
      "お兄さんは元気ですか。": "Is your older brother well?"
  "ja-5242":
    native: "shape; form"
    notes:
      "n1": "形 (katachi): on readings ケイ (kei) and ギョウ (gyou); kun readings かた (kata) and かたち (katachi). It is in 形 (katachi), shape."
  "ja-5243":
    native: "to measure; to plan"
    notes:
      "n1": "計 (hakaru): on reading ケイ (kei); kun readings はかる (hakaru) and はからう (hakarau). It is in 計画 (keikaku), plan."
  "ja-5244":
    native: "origin; base; former"
    notes:
      "n1": "元 (moto): on readings ゲン (gen) and ガン (gan); kun reading もと (moto). It is in 元気 (genki), well; healthy."
    examples:
      "元気ですか。": "Are you well?"
  "ja-5245":
    native: "to say; word"
    notes:
      "n1": "言 (iu): on readings ゲン (gen) and ゴン (gon); kun readings いう (iu) and こと (koto). It is in 言葉 (kotoba), word."
  "ja-5246":
    native: "field; plain; original"
    notes:
      "n1": "原 (hara): on reading ゲン (gen); kun reading はら (hara). It is in 原因 (genin), cause."
  "ja-5247":
    native: "door; household"
    notes:
      "n1": "戸 (to): on reading コ (ko); kun reading と (to). It is in 戸口 (toguchi), doorway."
  "ja-5248":
    native: "old (of things)"
    notes:
      "n1": "古 (furui): on reading コ (ko); kun readings ふるい (furui) and ふるす (furusu). It is in 古い (furui), old."
    examples:
      "このいえは古いです。": "This house is old."
  "ja-5249":
    native: "noon; afternoon"
    notes:
      "n1": "午 (go): on reading ゴ (go). It is in 午後 (gogo), afternoon."
    examples:
      "午後はいそがしいです。": "The afternoon is busy."
  "ja-5250":
    native: "after; behind; later"
    notes:
      "n1": "後 (ato): on readings ゴ (go) and コウ (kou); kun readings のち (nochi), うしろ (ushiro), あと (ato) and おくれる (okureru). It is in 後ろ (ushiro), behind."
    examples:
      "犬は後ろにいます。": "The dog is behind."
      "午後にいきます。": "I will go in the afternoon."
  "ja-5251":
    native: "word; language; to tell"
    notes:
      "n1": "語 (kataru): on reading ゴ (go); kun readings かたる (kataru) and かたらう (katarau). It is in 日本語 (nihongo), the Japanese language."
  "ja-5252":
    native: "craft; work; construction"
    notes:
      "n1": "工 (kou): on readings コウ (kou) and ク (ku). It is in 工場 (koujou), factory."
  "ja-5253":
    native: "public; official"
    notes:
      "n1": "公 (kou): on reading コウ (kou); kun reading おおやけ (ooyake). It is in 公園 (kouen), park."
    examples:
      "公園であそびます。": "I play in the park."
  "ja-5254":
    native: "wide; spacious"
    notes:
      "n1": "広 (hiroi): on reading コウ (kou); kun readings ひろい (hiroi), ひろまる (hiromaru), ひろめる (hiromeru), ひろがる (hirogaru) and ひろげる (hirogeru). It is in 広い (hiroi), wide."
    examples:
      "うちは広いです。": "The house is spacious."
  "ja-5255":
    native: "to cross; to mix; to exchange"
    notes:
      "n1": "交 (majiwaru): on reading コウ (kou); kun readings まじわる (majiwaru), まじえる (majieru), まじる (majiru), まざる (mazaru), まぜる (mazeru), かう (kau) and かわす (kawasu). It is in 交番 (kouban), police box."
  "ja-5256":
    native: "light"
    notes:
      "n1": "光 (hikari): on reading コウ (kou); kun readings ひかる (hikaru) and ひかり (hikari). It is in 光る (hikaru), to shine."
  "ja-5257":
    native: "to think; to consider"
    notes:
      "n1": "考 (kangaeru): on reading コウ (kou); kun reading かんがえる (kangaeru). It is in 考える (kangaeru), to think."
  "ja-5258":
    native: "to go; to carry out"
    notes:
      "n1": "行 (iku): on readings コウ (kou) and ギョウ (gyou); kun readings いく (iku), ゆく (yuku) and おこなう (okonau). It is in 行く (iku), to go."
    examples:
      "えきへ行きます。": "I go to the station."
      "がっこうへ行きます。": "I go to school."
  "ja-5259":
    native: "high; tall; expensive"
    notes:
      "n1": "高 (takai): on reading コウ (kou); kun readings たかい (takai), たか (taka), たかまる (takamaru) and たかめる (takameru). It is in 高い (takai), high; expensive."
    examples:
      "やまは高いです。": "The mountain is high."
  "ja-5260":
    native: "yellow"
    notes:
      "n1": "黄 (ki): on readings コウ (kou) and オウ (ou); kun reading き (ki). It is in 黄色 (kiiro), yellow."
  "ja-5261":
    native: "to fit; to join"
    notes:
      "n1": "合 (au): on readings ゴウ (gou) and ガッ (gatsu); kun readings あう (au), あわす (awasu) and あわせる (awaseru). It is in 合う (au), to fit."
    examples:
      "サイズが合いました。": "The size was right."
  "ja-5262":
    native: "valley"
    notes:
      "n1": "谷 (tani): on reading コク (koku); kun reading たに (tani). It is in 谷川 (tanigawa), mountain stream."
  "ja-5263":
    native: "country; nation"
    notes:
      "n1": "国 (kuni): on reading コク (koku); kun reading くに (kuni). It is in 外国 (gaikoku), foreign country."
    examples:
      "わたしの国はにほんです。": "My country is Japan."
  "ja-5264":
    native: "black"
    notes:
      "n1": "黒 (kuro): on reading コク (koku); kun readings くろ (kuro) and くろい (kuroi). It is in 黒い (kuroi), black."
    examples:
      "黒がすきです。": "I like black."
  "ja-5265":
    native: "now; this"
    notes:
      "n1": "今 (ima): on readings コン (kon) and キン (kin); kun reading いま (ima). It is in 今日 (kyou), today."
    examples:
      "今日はやすみです。": "Today is a day off."
      "今月はいそがしいです。": "This month is busy."
  "ja-5266":
    native: "talent; year of age"
    notes:
      "n1": "才 (sai): on reading サイ (sai). It is in 才能 (sainou), talent."
  "ja-5267":
    native: "thin; fine; detailed"
    notes:
      "n1": "細 (hosoi): on reading サイ (sai); kun readings ほそい (hosoi), ほそる (hosoru), こまか (komaka) and こまかい (komakai). It is in 細い (hosoi), thin."
  "ja-5268":
    native: "to make; to create"
    notes:
      "n1": "作 (tsukuru): on readings サク (saku) and サ (sa); kun reading つくる (tsukuru). It is in 作る (tsukuru), to make."
    examples:
      "ごはんを作ります。": "I make a meal."
      "サンドイッチを作ります。": "I make a sandwich."
  "ja-5269":
    native: "calculation; arithmetic"
    notes:
      "n1": "算 (san): on reading サン (san). It is in 算数 (sansuu), arithmetic."
  "ja-5270":
    native: "to stop"
    notes:
      "n1": "止 (tomaru): on reading シ (shi); kun readings とまる (tomaru) and とめる (tomeru). It is in 止まる (tomaru), to stop."
    examples:
      "バスが止まります。": "The bus stops."
      "ここで止まります。": "I stop here."
  "ja-5271":
    native: "city; market"
    notes:
      "n1": "市 (ichi): on reading シ (shi); kun reading いち (ichi). It is in 市場 (ichiba), market."
