schema: 1
id: "ja-en-hiragana-marks"
kind: "layer"
core: "ja-hiragana-marks"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hiragana marks"
description: "The voiced, half-voiced and small hiragana: the marks that change a sound, the small ya, yu and yo that join a sound, and the small tsu. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "ja-0280":
    native: "ga: ka with two small strokes (the voiced mark)"
    notes:
      "n1": "Written as か (ka) with two small strokes. The mark makes the sound voiced."
    "examples": {
      "あざがいたいです。": {"native": "The bruise hurts.", "bases": {}},
      "あしがいたいです。": {"native": "My leg hurts.", "bases": {}}
    }
  "ja-0281":
    native: "gi: ki with two small strokes (the voiced mark)"
    notes:
      "n1": "Written as き (ki) with two small strokes. The mark makes the sound voiced."
    "examples": {
      "あたらしいぎじゅつをつかいます。": {"native": "I use new technology.", "bases": {}},
      "あなたはかぎをあけますか。": {"native": "Do you open the lock?", "bases": {}}
    }
  "ja-0282":
    native: "gu: ku with two small strokes (the voiced mark)"
    notes:
      "n1": "Written as く (ku) with two small strokes. The mark makes the sound voiced."
    "examples": {
      "あめのひにながぐつをはきます。": {"native": "On rainy days I wear rain boots.", "bases": {}},
      "あめのひはながぐつをはきます。": {"native": "On rainy days I wear rain boots.", "bases": {}}
    }
  "ja-0283":
    native: "ge: ke with two small strokes (the voiced mark)"
    notes:
      "n1": "Written as け (ke) with two small strokes. The mark makes the sound voiced."
    "examples": {
      "あしたははげしいです。": {"native": "Tomorrow it will be fierce.", "bases": {}},
      "あずけいれはげんきんでできます。": {"native": "You can make a deposit in cash.", "bases": {}}
    }
  "ja-0284":
    native: "go: ko with two small strokes (the voiced mark)"
    notes:
      "n1": "Written as こ (ko) with two small strokes. The mark makes the sound voiced."
    "examples": {
      "あなたのごしゅじんとごりょうしんはげんきですか。": {"native": "Are your husband and parents well?", "bases": {}},
      "あなたのごしゅじんはせんせいですか。": {"native": "Is your husband a teacher?", "bases": {}}
    }
  "ja-0285":
    native: "za: sa with two small strokes (the voiced mark)"
    notes:
      "n1": "Written as さ (sa) with two small strokes. The mark makes the sound voiced."
    "examples": {
      "あしにあざがあります。": {"native": "I have a bruise on my leg.", "bases": {}},
      "あのひとはざんこくです。": {"native": "That person is cruel.", "bases": {}}
    }
  "ja-0286":
    native: "ji: shi with two small strokes (the voiced mark)"
    notes:
      "n1": "Written as し (shi) with two small strokes. The mark makes the sound voiced."
    "examples": {
      "あしたはきゅうじつです。": {"native": "Tomorrow is a day off.", "bases": {}},
      "あじさいがさいています。": {"native": "The hydrangeas are in bloom.", "bases": {}}
    }
  "ja-0287":
    native: "zu: su with two small strokes (the voiced mark)"
    notes:
      "n1": "Written as す (su) with two small strokes. The mark makes the sound voiced."
    "examples": {
      "あしたはいなずまです。": {"native": "Tomorrow we will have lightning.", "bases": {}},
      "あしたはみずたまりです。": {"native": "Tomorrow we will have puddle.", "bases": {}}
    }
  "ja-0288":
    native: "ze: se with two small strokes (the voiced mark)"
    notes:
      "n1": "Written as せ (se) with two small strokes. The mark makes the sound voiced."
    "examples": {
      "あんぜんです。": {"native": "It is safe.", "bases": {}},
      "いえがつよいかぜでこわれました。": {"native": "The house broke in the strong wind.", "bases": {}}
    }
  "ja-0289":
    native: "zo: so with two small strokes (the voiced mark)"
    notes:
      "n1": "Written as そ (so) with two small strokes. The mark makes the sound voiced."
    "examples": {
      "あしたはみぞれです。": {"native": "Tomorrow we will have sleet.", "bases": {}},
      "あなたのかぞくはげんきですか。": {"native": "Is your family well?", "bases": {}}
    }
  "ja-0290":
    native: "da: ta with two small strokes (the voiced mark)"
    notes:
      "n1": "Written as た (ta) with two small strokes. The mark makes the sound voiced."
    "examples": {
      "あしたきてください。": {"native": "Please come tomorrow.", "bases": {}},
      "あしたはおだやかです。": {"native": "Tomorrow it will be calm.", "bases": {}}
    }
  "ja-0291":
    native: "ji (rare): chi with the voiced mark, said the same as じ (ji)"
    notes:
      "n1": "Said the same as じ (ji). It is written only in a few words, where a sound changed."
    "examples": {
      "かみをちぢめました。": {"native": "I shortened my hair.", "bases": {}},
      "きかんをちぢめます。": {"native": "I shorten the period.", "bases": {}}
    }
  "ja-0292":
    native: "zu (rare): tsu with the voiced mark, said the same as ず (zu)"
    notes:
      "n1": "Said the same as ず (zu). It is written only in a few words, where a sound changed."
    "examples": {
      "あめがつづきます。": {"native": "The rain continues.", "bases": {}},
      "おとうさんはあとかたづけをしませんでした。": {"native": "Dad did not do the clearing up.", "bases": {}}
    }
  "ja-0293":
    native: "de: te with two small strokes (the voiced mark)"
    notes:
      "n1": "Written as て (te) with two small strokes. The mark makes the sound voiced."
    "examples": {
      "あしたはあらしです。": {"native": "Tomorrow we will have storm.", "bases": {}},
      "あしたはあられです。": {"native": "Tomorrow we will have hail.", "bases": {}}
    }
  "ja-0294":
    native: "do: to with two small strokes (the voiced mark)"
    notes:
      "n1": "Written as と (to) with two small strokes. The mark makes the sound voiced."
    "examples": {
      "あしたはしつどです。": {"native": "Tomorrow we will have humidity.", "bases": {}},
      "あしたはひどいです。": {"native": "Tomorrow it will be terrible.", "bases": {}}
    }
  "ja-0295":
    native: "ba: ha with two small strokes (the voiced mark)"
    notes:
      "n1": "Written as は (ha) with two small strokes. The mark makes the sound voiced."
    "examples": {
      "いいばしょです。": {"native": "It is a good place.", "bases": {}},
      "いけばなはうつくしいです。": {"native": "Flower arrangement is beautiful.", "bases": {}}
    }
  "ja-0296":
    native: "bi: hi with two small strokes (the voiced mark)"
    notes:
      "n1": "Written as ひ (hi) with two small strokes. The mark makes the sound voiced."
    "examples": {
      "いしゃはびょうきをなおします": {"native": "The doctor cures the illness.", "bases": {}}
    }
  "ja-0297":
    native: "bu: fu with two small strokes (the voiced mark)"
    notes:
      "n1": "Written as ふ (fu) with two small strokes. The mark makes the sound voiced."
    "examples": {
      "あぶないです。": {"native": "It is dangerous.", "bases": {}},
      "あぶないときはにげてください。": {"native": "When it is dangerous, please run away.", "bases": {}}
    }
  "ja-0298":
    native: "be: he with two small strokes (the voiced mark)"
    notes:
      "n1": "Written as へ (he) with two small strokes. The mark makes the sound voiced."
    "examples": {
      "あまいものでべたべたになります。": {"native": "Sweet things make you sticky.", "bases": {}},
      "あんこをたべます。": {"native": "I eat sweet bean paste.", "bases": {}}
    }
  "ja-0299":
    native: "bo: ho with two small strokes (the voiced mark)"
    notes:
      "n1": "Written as ほ (ho) with two small strokes. The mark makes the sound voiced."
    "examples": {
      "いぬはのぼります。": {"native": "The dog climbs.", "bases": {}},
      "いわのうえにのぼりました。": {"native": "I climbed onto the rock.", "bases": {}}
    }
  "ja-0300":
    native: "pa: ha with the half-voiced mark (small circle)"
    notes:
      "n1": "Written as は (ha) with a small circle. The sound is p, as in English pen."
    "examples": {
      "あじはすっぱいです。": {"native": "The taste is sour.", "bases": {}},
      "あなたはいぬにぱんをあげますか。": {"native": "Do you give the dog bread?", "bases": {}}
    }
  "ja-0301":
    native: "pi: hi with the half-voiced mark (small circle)"
    notes:
      "n1": "Written as ひ (hi) with a small circle."
    "examples": {
      "おさらがぴかぴかです。": {"native": "The plates are spotless.", "bases": {}},
      "このくつはわたしにぴったりです。": {"native": "These shoes fit me perfectly.", "bases": {}}
    }
  "ja-0302":
    native: "pu: fu with the half-voiced mark (small circle)"
    notes:
      "n1": "Written as ふ (fu) with a small circle."
    "examples": {
      "きっぷうりばはちかいです。": {"native": "The ticket office is near.", "bases": {}},
      "きっぷうりばはどこですか。": {"native": "Where is the ticket office?", "bases": {}}
    }
  "ja-0303":
    native: "pe: he with the half-voiced mark (small circle)"
    notes:
      "n1": "Written as へ (he) with a small circle."
    "examples": {
      "えいごをぺらぺらはなしたいです。": {"native": "I want to speak English fluently.", "bases": {}},
      "おなかがぺこぺこです。": {"native": "I am very hungry.", "bases": {}}
    }
  "ja-0304":
    native: "po: ho with the half-voiced mark (small circle)"
    notes:
      "n1": "Written as ほ (ho) with a small circle."
    "examples": {
      "あめがぽつぽつふってきました。": {"native": "A few drops of rain began to fall.", "bases": {}},
      "ぎじゅつのしんぽをみます。": {"native": "I watch the progress of technology.", "bases": {}}
    }
  "ja-0305":
    native: "small ya: joins the sound before it, as kya in kyaku"
    notes:
      "n1": "Written after another kana, for a joined sound: きゃ (kya), しゃ (sha), ちゃ (cha)."
    "examples": {
      "あなたのおもいやりにかんしゃします": {"native": "I am grateful for your consideration.", "bases": {}},
      "いしゃがけがをなおしました。": {"native": "The doctor treated the injury.", "bases": {}}
    }
  "ja-0306":
    native: "small yu: joins the sound before it, as kyu in kyuu"
    notes:
      "n1": "Written after another kana, for a joined sound: きゅ (kyu), しゅ (shu), ちゅ (chu)."
    "examples": {
      "あなたのしゅみはなんですか。": {"native": "What is your hobby?", "bases": {}},
      "いんしゅはからだによくないです。": {"native": "Drinking is not good for the body.", "bases": {}}
    }
  "ja-0307":
    native: "small yo: joins the sound before it, as kyo in kyou"
    notes:
      "n1": "Written after another kana, for a joined sound: きょ (kyo), しょ (sho), ちょ (cho)."
    "examples": {
      "あしたはひょうです。": {"native": "Tomorrow we will have hail (ice pellets).", "bases": {}},
      "あそこはとうきょうです。": {"native": "Over there is Tokyo.", "bases": {}}
    }
  "ja-0308":
    native: "small tsu: a pause, the next consonant is doubled"
    notes:
      "n1": "Not read as a sound of its own. It doubles the consonant of the next kana, as in きって (kitte)."
    "examples": {
      "あなたはかっこいいです。": {"native": "You are cool.", "bases": {}},
      "あめがしとしとふっています。": {"native": "The rain is drizzling.", "bases": {}}
    }
