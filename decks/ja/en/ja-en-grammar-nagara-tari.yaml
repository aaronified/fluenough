tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "nagara": "while {meaning}-ing"
    "tari": "{meaning} and so on"
rules:
  "ja-rule-nagara":
    name: "ながら (nagara): while"
    explanation: "{1} follows the verb stem to say that two things are done at the same time by one person: {2} means while eating."
  "ja-rule-tari":
    name: "たり (tari): doing this and that"
    explanation: "{1} follows the past (ta) form to list things you do as examples, usually with します (shimasu): {2} means eating and so on."
