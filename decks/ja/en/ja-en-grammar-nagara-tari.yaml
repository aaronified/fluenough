native: { code: "en", iso639_3: "eng", name: "English" }
name: "While and and-so-on: ながら (nagara) and たり (tari)"
description: "After the verb stem, ながら (nagara) says that one person does two things at the same time. After the past (ta) form, り (ri) lists actions as examples: ほんをよんだり (hon o yondari)、えいがをみたりします (eiga o mitari shimasu). Every verb a course deck teaches has a row. Not yet checked by a Japanese speaker: please report any mistake."
