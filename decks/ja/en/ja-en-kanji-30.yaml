schema: 1
id: "ja-en-kanji-30"
kind: "layer"
core: "ja-kanji-30"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 30: grade 5, part 6"
description: "Twenty-eight kanji of the fifth school grade, each taught by the kana reading of the word it stands for. Eleven have no example yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-6680":
    native: "grave"
    notes:
      "n1": "墓 (haka): on reading ボ (bo); kun reading はか (haka). The kun reading is the word it stands for alone: はか (haka), grave. No taught card has that kana. No taught word is written with 墓 (bo) and has a card, so it has no example yet."
  "ja-6681":
    native: "dream"
    notes:
      "n1": "夢 (yume): on reading ム (mu); kun reading ゆめ (yume). The kun reading is the word it stands for alone: ゆめ (yume), dream. The taught card ゆめ (yume), dream, from ja-careers, is the same word, 夢 (yume). Its example is 夢は大きいです (yume wa ookii desu), where 夢 (yume) is that taught card, 大きい (ookii), big, is the taught card おおきい (ookii), and は (wa) and です (desu) are taught."
    examples:
      "夢は大きいです。": "My dream is big."
  "ja-6682":
    native: "trunk"
    notes:
      "n1": "幹 (miki): on reading カン (kan); kun reading みき (miki). The kun reading is the word it stands for alone: みき (miki), trunk. The taught card みき (miki), trunk, from ja-nature, is the same word, 幹 (miki). Its examples are 幹は太いです (miki wa futoi desu), where 幹 (miki) is that taught card, 太い (futoi), thick; fat, is the taught card ふとい (futoi), and は (wa) and です (desu) are taught; and 新幹線は高いです (shinkansen wa takai desu), where 新幹線 (shinkansen), bullet train, is the taught card しんかんせん (shinkansen), with 新 (shin) and 線 (sen) taught kanji, and は (wa), 高い (takai), expensive; high; tall, and です (desu) are taught."
    examples:
      "幹は太いです。": "The trunk is thick."
      "新幹線は高いです。": "The shinkansen is expensive."
  "ja-6683":
    native: "loss; disadvantage"
    notes:
      "n1": "損 (son): on reading ソン (son); kun readings そこ-なう (soko-nau) and そこ-ねる (soko-neru), which are not used for the card. The on reading is the word it stands for alone: そん (son), loss; disadvantage. The taught card そん (son), village, from ja-geography, has the same kana and is a different word, 村 (son), village. Its example is 損失は大きいです (sonshitsu wa ookii desu), where 損失 (sonshitsu), loss, is the taught card そんしつ (sonshitsu), from ja-business, with 失 (shitsu) a taught kanji, and は (wa), 大きい (ookii), big, and です (desu) are taught."
    examples:
      "損失は大きいです。": "The loss is big."
  "ja-6684":
    native: "preparation"
    notes:
      "n1": "準 (junbi): on reading ジュン (jun); no kun reading. It is not a word on its own, so its kana じゅんび (junbi), preparation, is the commonest word it begins, written 準備 (junbi). The taught card じゅんび (junbi), preparation, from ja-daily-life, is the same word, 準備 (junbi). Its example is 準備は必要です (junbi wa hitsuyou desu), where 準備 (junbi) is that taught card, with 備 (bi) a taught kanji from ja-kanji-29, and は (wa), 必要 (hitsuyou), necessary, and です (desu) are taught."
    examples:
      "準備は必要です。": "Preparation is necessary."
  "ja-6685":
    native: "prohibition"
    notes:
      "n1": "禁 (kinshi): on reading キン (kin); no kun reading. It is not a word on its own, so its kana きんし (kinshi), prohibition, is the commonest word it begins, written 禁止 (kinshi). No taught card has that kana. The taught card きんえん (kin'en), no smoking, from ja-health, is written with 禁 (kin) too, but its example would need 煙 (en), a kanji not yet taught, so 禁 (kin) has no example yet."
  "ja-6686":
    native: "crime; sin"
    notes:
      "n1": "罪 (tsumi): on reading ザイ (zai); kun reading つみ (tsumi). The kun reading is the word it stands for alone: つみ (tsumi), crime; sin. No taught card has that kana. No taught word is written with 罪 (zai) and has a card, so it has no example yet."
  "ja-6687":
    native: "duty; obligation"
    notes:
      "n1": "義 (gimu): on reading ギ (gi); no kun reading. It is not a word on its own, so its kana ぎむ (gimu), duty; obligation, is the commonest word it begins, written 義務 (gimu). No taught card has that kana. No taught word is written with 義 (gi) and has a card, so it has no example yet."
  "ja-6688":
    native: "to solve; to untie"
    notes:
      "n1": "解 (toku): on reading カイ (kai) and ゲ (ge); kun readings と-く (to-ku), と-かす (to-kasu) and と-ける (to-keru); と-く (to-ku) is the word it stands for alone: 解く (toku), to solve; to untie. The taught kanji card 徳 (toku), virtue; goodness, from ja-kanji-23, has the same kana and is a different word. It is in 解決 (kaiketsu), solution."
    examples:
      "解決は大切です。": "A solution is important."
      "でんわの解約をします。": "I will cancel the phone contract."
  "ja-6689":
    native: "rich; abundant"
    notes:
      "n1": "豊 (yutaka): on reading ホウ (hou); kun reading ゆた-か (yuta-ka). The kun reading is the word it stands for alone: 豊か (yutaka), rich; abundant. The taught card ゆたか (yutaka), rich; abundant, from ja-adjectives-2, is the same word, 豊か (yutaka). Its example is 生活は豊かです (seikatsu wa yutaka desu), where 生活 (seikatsu), life; daily living, is the taught card せいかつ (seikatsu), with 生 (sei) and 活 (katsu) taught kanji, and は (wa) and です (desu) are taught."
    examples:
      "生活は豊かです。": "Life is rich."
  "ja-6690":
    native: "materials; document"
    notes:
      "n1": "資 (shiryou): on reading シ (shi); no kun reading. It is not a word on its own, so its kana しりょう (shiryou), materials; document, is the commonest word it begins, written 資料 (shiryou). The taught card しりょう (shiryou), materials; document, from ja-workplace, is the same word, 資料 (shiryou). Its examples are 資料は大切です (shiryou wa taisetsu desu), where 資料 (shiryou) is that taught card, with 料 (ryou) a taught kanji, and は (wa), 大切 (taisetsu) and です (desu) are taught; and 資格は必要です (shikaku wa hitsuyou desu), where 資格 (shikaku), qualification, is the taught card しかく (shikaku), with 格 (kaku) a taught kanji, and 必要 (hitsuyou), necessary, is the taught card ひつよう (hitsuyou), with 必 (hitsu) and 要 (you) taught kanji."
    examples:
      "資料は大切です。": "Materials are important."
      "資格は必要です。": "A qualification is necessary."
  "ja-6691":
    native: "mine"
    notes:
      "n1": "鉱 (kouzan): on reading コウ (kou); no kun reading. It is not a word on its own, so its kana こうざん (kouzan), mine, is the commonest word it begins, written 鉱山 (kouzan). No taught card has that kana. No taught word is written with 鉱 (kou) and has a card, so it has no example yet."
  "ja-6692":
    native: "to keep animals"
    notes:
      "n1": "飼 (kau): on reading シ (shi); kun reading か-う (ka-u), which is the word it stands for alone: 飼う (kau), to keep animals. The taught card かう (kau), to buy; to keep an animal, from ja-everyday-verbs, is the same word in its second sense, 飼う (kau), and a different word in its first sense, 買う (kau), to buy, which is the taught kanji card 買 (kau) from ja-kanji-9. Its example is 犬を飼います (inu o kaimasu), where 犬 (inu) is the taught card いぬ (inu), with 犬 (inu) a taught kanji from ja-kanji-2, を (o) and 飼います (kaimasu), the masu form of the taught card かう (kau) in its second sense, are taught."
    examples:
      "犬を飼います。": "I keep a dog."
  "ja-6693":
    native: "statue; image"
    notes:
      "n1": "像 (zou): on reading ゾウ (zou); no kun reading. The on reading is the word it stands for alone: ぞう (zou), statue; image. The taught card ぞう (zou), elephant, from ja-animals, has the same kana, and so does the taught kanji card 象 (zou), elephant, from ja-kanji-29. Both are a different word: 象 (zou), elephant. Its example is 想像は大切です (souzou wa taisetsu desu), where 想像 (souzou) is the taught card そうぞう (souzou), with 想 (sou) a taught kanji from ja-kanji-16, and は (wa), 大切 (taisetsu) and です (desu) are taught."
    examples:
      "想像は大切です。": "Imagination is important."
  "ja-6694":
    native: "border; boundary"
    notes:
      "n1": "境 (sakai): on reading キョウ (kyou), and the parenthesised reading ケイ (kei), which is a special or very narrow use; kun reading さかい (sakai). The kun reading is the word it stands for alone: さかい (sakai), border; boundary. No taught card has that kana. No taught word is written with 境 (kyou) and has a card, so it has no example yet."
  "ja-6695":
    native: "to increase"
    notes:
      "n1": "増 (fueru): on reading ゾウ (zou); kun readings ま-す (ma-su), ふ-える (fu-eru) and ふ-やす (fu-yasu). The kun reading ふ-える (fu-eru) is the word it stands for alone: 増える (fueru), to increase. The taught card ふえる (fueru), to increase, from ja-verbs-3, is the same word, 増える (fueru). Its example is 体重は増えます (taijuu wa fuemasu), where 体重 (taijuu), body weight, is the taught card たいじゅう (taijuu), with 体 (tai) and 重 (juu) taught kanji, は (wa) is taught, and 増えます (fuemasu) is the masu form of the taught card ふえる (fueru)."
    examples:
      "体重は増えます。": "My weight goes up."
  "ja-6696":
    native: "attitude"
    notes:
      "n1": "態 (taido): on reading タイ (tai); no kun reading. It is not a word on its own, so its kana たいど (taido), attitude, is the commonest word it begins, written 態度 (taido). The taught card たいど (taido), attitude, from ja-manners, is the same word, 態度 (taido). Its example is 態度は大切です (taido wa taisetsu desu), where 態度 (taido) is that taught card, with 度 (do) a taught kanji, and は (wa), 大切 (taisetsu) and です (desu) are taught."
    examples:
      "態度は大切です。": "Attitude is important."
  "ja-6697":
    native: "to get used to"
    notes:
      "n1": "慣 (nareru): on reading カン (kan); kun readings な-れる (na-reru) and な-らす (na-rasu). The kun reading な-れる (na-reru) is the word it stands for alone: 慣れる (nareru), to get used to. The taught card なれる (nareru), to get used to, from ja-verbs-3, is the same word, 慣れる (nareru). Its examples are 日本語に慣れます (nihongo ni naremasu), where 日本語 (nihongo), the Japanese language, is the taught card にほんご (nihongo), with 日 (nichi), 本 (hon) and 語 (go) taught kanji, に (ni) is taught, and なれます (naremasu) is the masu form of the taught card なれる (nareru); and 習慣は大切です (shuukan wa taisetsu desu), where 習慣 (shuukan), custom; habit, is the taught card しゅうかん (shuukan), with 習 (shuu) a taught kanji, and は (wa), 大切 (taisetsu) and です (desu) are taught."
    examples:
      "日本語に慣れます。": "I get used to Japanese."
      "習慣は大切です。": "Customs are important."
  "ja-6698":
    native: "to mind; to bother about"
    notes:
      "n1": "構 (kamau): on reading コウ (kou); kun readings かま-える (kama-eru) and かま-う (kama-u). The kun reading かま-う (kama-u) is the word it stands for alone: 構う (kamau), to mind; to bother about. No taught card has that kana. It is in 結構 (kekkou), splendid."
    examples:
      "これは結構です。": "This is fine."
  "ja-6699":
    native: "history"
    notes:
      "n1": "歴 (rekishi): on reading レキ (reki); no kun reading. It is not a word on its own, so its kana れきし (rekishi), history, is the commonest word it begins, written 歴史 (rekishi). The taught kanji card 史 (rekishi), history, from ja-kanji-25, has the same kana and is the same word, 歴史 (rekishi). Its examples are 歴史は大切です (rekishi wa taisetsu desu), where 歴史 (rekishi) is the taught word れきし (rekishi), with 史 (shi) a taught kanji, and は (wa), 大切 (taisetsu), precious; important, and です (desu) are taught; and 病歴は必要です (byoureki wa hitsuyou desu), where 病歴 (byoureki), medical history, is the taught card びょうれき (byoureki), with 病 (byou) a taught kanji, and は (wa), 必要 (hitsuyou), necessary, and です (desu) are taught."
    examples:
      "歴史は大切です。": "History is important."
      "病歴は必要です。": "Medical history is necessary."
  "ja-6700":
    native: "musical performance"
    notes:
      "n1": "演 (ensou): on reading エン (en); no kun reading. It is not a word on its own, so its kana えんそう (ensou), musical performance, is the commonest word it begins, written 演奏 (ensou). The taught card えんそう (ensou), musical performance, from ja-hobbies, is the same word, 演奏 (ensou). 演奏 (ensou) has 奏 (sou) in it, a kanji not yet taught, so it has no example yet."
  "ja-6701":
    native: "spirit; mind"
    notes:
      "n1": "精 (seishin): on reading セイ (sei), and the parenthesised reading ショウ (shou), which is a special or very narrow use; no kun reading. It is not a word on its own, so its kana せいしん (seishin), spirit; mind, is the commonest word it begins, written 精神 (seishin). No taught card has that kana. No taught word is written with 精 (sei) and has a card, so it has no example yet."
  "ja-6702":
    native: "cotton"
    notes:
      "n1": "綿 (wata): on reading メン (men); kun reading わた (wata). The kun reading is the word it stands for alone: わた (wata), cotton. No taught card has that kana. No taught word is written with 綿 (men) and has a card, so it has no example yet."
  "ja-6703":
    native: "overall; general"
    notes:
      "n1": "総 (sougou): on reading ソウ (sou); no kun reading. It is not a word on its own, so its kana そうごう (sougou), overall; general, is the commonest word it begins, written 総合 (sougou). No taught card has that kana. Its example is 総務は大切です (soumu wa taisetsu desu), where 総務 (soumu), general affairs, is the taught card そうむ (soumu), with 務 (mu) a taught kanji, and は (wa), 大切 (taisetsu) and です (desu) are taught."
    examples:
      "総務は大切です。": "General affairs is important."
  "ja-6704":
    native: "product"
    notes:
      "n1": "製 (seihin): on reading セイ (sei); no kun reading. It is not a word on its own, so its kana せいひん (seihin), product, is the commonest word it begins, written 製品 (seihin). The taught card せいひん (seihin), product, from ja-shopping, is the same word, 製品 (seihin). Its examples are 製品は高いです (seihin wa takai desu), where 製品 (seihin) is that taught card, with 品 (hin) a taught kanji, and は (wa), 高い (takai), expensive; high; tall, and です (desu) are taught; and 製造業は大きいです (seizougyou wa ookii desu), where 製造業 (seizougyou), manufacturing industry, is the taught card せいぞうぎょう (seizougyou), with 造 (zou) and 業 (gyou) taught kanji, and は (wa), 大きい (ookii), big, and です (desu) are taught."
    examples:
      "製品は高いです。": "The product is expensive."
      "製造業は大きいです。": "The manufacturing industry is big."
  "ja-6705":
    native: "complicated"
    notes:
      "n1": "複 (fukuzatsu): on reading フク (fuku); no kun reading. It is not a word on its own, so its kana ふくざつ (fukuzatsu), complicated, is the commonest word it begins, written 複雑 (fukuzatsu). The taught card ふくざつ (fukuzatsu), complicated, from ja-adjectives-2, is the same word, 複雑 (fukuzatsu). 複雑 (fukuzatsu) has 雑 (zatsu) in it, a kanji not yet taught, so it has no example yet."
  "ja-6706":
    native: "suitable; appropriate"
    notes:
      "n1": "適 (tekitou): on reading テキ (teki); no kun reading. It is not a word on its own, so its kana てきとう (tekitou), suitable; appropriate, is the commonest word it begins, written 適当 (tekitou). No taught card has that kana. The taught card てきせい (tekisei), aptitude, from ja-careers, is written 適性 (tekisei), with 性 (sei) a taught kanji, and the example is taken from it."
    examples:
      "適性は高いです。": "The aptitude is high."
  "ja-6707":
    native: "acid"
    notes:
      "n1": "酸 (san): on reading サン (san); kun reading す-い (su-i), which is not used for the card. The on reading is the word it stands for alone: さん (san), acid. The taught card さん (san), three, from ja-numbers-1-20, has the same kana and is a different word, and so is the taught card さん (san), Mr.; Ms.; Mrs., from ja-first-words. Its example is これは酸っぱいです (kore wa suppai desu), where 酸っぱい (suppai) is the taught card すっぱい (suppai), with 酸 (san) the target, and これ (kore), は (wa) and です (desu) are taught."
    examples:
      "これは酸っぱいです。": "This is sour."
