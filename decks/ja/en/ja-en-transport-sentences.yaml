tags: ["beginner", "unreviewed"]
cards:
  "ja-1311":
    native: "I go to Kyoto by bullet train."
    bases:
      "まで": { meaning: "as far as; until" }
    confusables:
      w1: { why: "ちかてつ (chikatetsu) is the subway." }
      w2: { why: "ひこうき (hikouki) is an aeroplane." }
  "ja-1312":
    native: "Where is the station?"
    bases:
      "は": { meaning: "(marks the topic)" }
      "です": { meaning: "is (polite)" }
      "か": { meaning: "(marks a question)" }
    confusables:
      w1: { why: "くうこう (kuukou) is an airport." }
      w2: { why: "きっぷうりば (kippuuriba) is a ticket office." }
  "ja-1313":
    native: "I buy a ticket."
    bases:
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "にもつ (nimotsu) is luggage." }
      w2: { why: "ふね (fune) is a ship." }
  "ja-1314":
    native: "I go to school by car."
    confusables:
      w1: { why: "じてんしゃ (jitensha) is a bicycle." }
      w2: { why: "バス (basu) is a bus." }
  "ja-4163":
    native: "I go to the station by train."
    bases:
      "で":
        meaning: "(marks the place or means)"
      "に":
        meaning: "(marks the place, time or target)"
      "いきます":
        meaning: "to go"
    confusables:
      w1:
        why: "くるま (kuruma) is car, not part of this sentence."
      w2:
        why: "きっぷ (kippu) is ticket, not part of this sentence."
  "ja-4164":
    native: "The car is expensive."
    bases:
      "は":
        meaning: "(marks the topic)"
      "たかい":
        meaning: "expensive; high; tall"
      "です":
        meaning: "is (polite)"
    confusables:
      w1:
        why: "でんしゃ (densha) is train, not part of this sentence."
      w2:
        why: "えき (eki) is station, not part of this sentence."
  "ja-4165":
    native: "Where is the ticket office?"
    bases:
      "は":
        meaning: "(marks the topic)"
      "です":
        meaning: "is (polite)"
      "か":
        meaning: "(marks a question)"
    confusables:
      w1:
        why: "えき (eki) is station, not part of this sentence."
      w2:
        why: "のりば (noriba) is platform; boarding place, not part of this sentence."
  "ja-4166":
    native: "Please tell me the platform."
    bases:
      "を":
        meaning: "(marks the thing acted on)"
      "おしえて":
        meaning: "to teach"
      "ください":
        meaning: "please (give me)"
    confusables:
      w1:
        why: "きっぷ (kippu) is ticket, not part of this sentence."
      w2:
        why: "えき (eki) is station, not part of this sentence."
