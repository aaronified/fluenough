tags: ["beginner", "unreviewed"]
cards:
  "ja-2217":
    native: "to change (intransitive)"
    notes: { n1: "かわる (kawaru) means to change by itself: the thing changes. Its partner is かえる (kaeru), to change something." }
    examples:
      "かみがたがかわりました。":
        native: "My hairstyle changed."
        bases:
          "かわりました": { meaning: "changed (polite)" }
      "ともだちはかわりません。":
        native: "My friend has not changed."
        bases:
          "は": { meaning: "(marks the topic)" }
          "かわりません": { meaning: "has not changed (polite)" }
  "ja-2218":
    native: "to be decided"
    notes: { n1: "きまる (kimaru) means to be decided, with no one named as the decider. きめる (kimeru) is to decide." }
    examples:
      "あしたはまだきまりません。":
        native: "Tomorrow is not decided yet."
        bases:
          "は": { meaning: "(marks the topic)" }
          "きまりません": { meaning: "is not decided (polite)" }
      "ごはんはもうきまりました。":
        native: "The meal is already decided."
        bases:
          "は": { meaning: "(marks the topic)" }
          "きまりました": { meaning: "was decided (polite)" }
