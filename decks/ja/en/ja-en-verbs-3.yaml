native: { code: "en", iso639_3: "eng", name: "English" }
name: "More daily actions"
description: "More daily actions: 60 verbs of change, finding, giving, moving and growing, many in pairs of intransitive and transitive verbs. Not yet checked by a Japanese speaker: please report any mistake."
