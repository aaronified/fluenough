native: { code: "en", iso639_3: "eng", name: "English" }
name: "Saying and thinking: といいます (to iimasu) and とおもいます (to omoimasu)"
description: "After a plain form, と (to) with いいます (iimasu) reports what someone says, and と (to) with おもいます (omoimasu) says what you think. Every verb a course deck teaches has a row. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "to-iu": "say that one will {meaning}"
    "to-omou": "think that one will {meaning}"
rules:
  "ja-rule-to-iu":
    name: "といいます (to iimasu): say that"
    explanation: "{1} follows a plain form to report what someone says: {2} means says that he will eat."
  "ja-rule-to-omou":
    name: "とおもいます (to omoimasu): think that"
    explanation: "{1} follows a plain form to say what you think: {2} means I think he will eat."
