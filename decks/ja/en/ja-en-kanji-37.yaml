native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 37: grade 6, part 6"
description: "Twenty-seven kanji of the sixth school grade, each taught by the kana reading of the word it stands for. Twelve have no example yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-7100":
    native: "verb"
    notes:
      "n1": "詞 (doushi): on reading シ (shi); no kun reading. It is not a word on its own, so its kana どうし (doushi), verb, is the commonest word it ends, written 動詞 (doushi), where 動 (dou) is already taught. No taught card has that kana. No example is given, because no taught word is written with 詞 (shi)."
  "ja-7101":
    native: "precious; valuable"
    notes:
      "n1": "貴 (kichou): on reading キ (ki); kun readings とうと-い (touto-i), たっと-い (tatto-i), とうと-ぶ (touto-bu) and たっと-ぶ (tatto-bu). Its kana きちょう (kichou), precious; valuable, is the commonest word it begins, written 貴重 (kichou), where 重 (chou) is already taught. No taught card has that kana. The kun reading とうとい (touto-i), noble, is not used for the card: it is the same word as the taught card 尊 (touto-i) from ja-kanji-36, written 尊い (touto-i), and 貴い (touto-i) is a spelling variant of it. No example is given, because no taught word is written with 貴 (ki)."
  "ja-7102":
    native: "wound; scar"
    notes:
      "n1": "傷 (kizu): on reading ショウ (shou); kun readings きず (kizu), いた-む (ita-mu) and いた-める (ita-meru). Its kana きず (kizu), wound; scar, is the word it stands for alone in its kun reading, written 傷 (kizu). No taught card has that kana. Its example is 切り傷は痛いです (kirikizu wa itai desu), where 切り傷 (kirikizu), cut, is the taught card きりきず (kirikizu) from ja-illness, written with the taught kanji 切 (kiri) and the kanji 傷 (kizu) taught by this card, は (wa) is the taught particle, 痛い (itai), painful, is the taught card いたい (itai) from ja-body, written with the kanji 痛 (ita), taught from ja-kanji-36, and です (desu) is the taught copula."
    examples:
      "切り傷は痛いです。": "A cut hurts."
  "ja-7103":
    native: "curtain; act of a play"
    notes:
      "n1": "幕 (maku): on reading マク (maku) and バク (baku); no kun reading. Its kana まく (maku), curtain; act of a play, is the word it stands for alone, written 幕 (maku). No taught card has that kana. Its example is 字幕を読みます (jimaku o yomimasu), where 字幕 (jimaku), subtitles, is the taught card じまく (jimaku) from ja-cinema, written with the taught kanji 字 (ji) and 幕 (maku), を (o) is the taught particle, and 読みます (yomimasu) is the masu form of the taught card よむ (yomu), to read."
    examples:
      "字幕を読みます。": "I read the subtitles."
  "ja-7104":
    native: "warm"
    notes:
      "n1": "暖 (atatakai): on reading ダン (dan); kun readings あたた-か (atata-ka), あたた-かい (atata-kai), あたた-まる (atata-maru) and あたた-める (atata-meru). Its kana あたたかい (atatakai), warm, is the word it stands for in its kun reading, written 暖かい (atatakai). The taught card 温 (atatakai) from ja-kanji-16 and the taught word card あたたかい (atatakai) from ja-describing are the same word, written 温かい (atatakai) in those decks. Its example is 今日は暖かいです (kyou wa atatakai desu), where 今日 (kyou), today, is the taught card きょう (kyou) from ja-time, は (wa) is the taught particle, and です (desu) is the taught copula."
    examples:
      "今日は暖かいです。": "Today is warm."
      "温暖化は大変です。": "Global warming is a serious problem."
  "ja-7105":
    native: "source; origin"
    notes:
      "n1": "源 (minamoto): on reading ゲン (gen); kun reading みなもと (minamoto). Its kana みなもと (minamoto), source; origin, is the word it stands for in its kun reading, written 源 (minamoto). No taught card has that kana. Its examples are 電源を入れます (dengen o iremasu), where 電源 (dengen), power switch, is the taught card でんげん (dengen) from ja-phone, written with the taught kanji 電 (den) and 源 (gen), を (o) is the taught particle, and 入れます (iremasu) is the masu form of the taught card いれる (ireru), to put in; and 資源は大切です (shigen wa taisetsu desu), where 資源 (shigen), resource, is the taught card しげん (shigen) from ja-environment, written with the taught kanji 資 (shi) and 源 (gen), は (wa) is the taught particle, and 大切 (taisetsu), important, is the taught card たいせつ (taisetsu) from ja-adjectives-2, with the taught copula です (desu)."
    examples:
      "電源を入れます。": "I turn on the power."
      "資源は大切です。": "Resources are important."
  "ja-7106":
    native: "alliance"
    notes:
      "n1": "盟 (doumei): on reading メイ (mei); no kun reading. It is not a word on its own, so its kana どうめい (doumei), alliance, is the commonest word it ends, written 同盟 (doumei), where 同 (dou) is already taught. No taught card has that kana. No example is given, because no taught word is written with 盟 (mei)."
  "ja-7107":
    native: "silk"
    notes:
      "n1": "絹 (kinu): on reading ケン (ken); kun reading きぬ (kinu). Its kana きぬ (kinu), silk, is the word it stands for in its kun reading, written 絹 (kinu). No taught card has that kana. No example is given, because no taught word is written with 絹 (ken)."
  "ja-7108":
    native: "signature"
    notes:
      "n1": "署 (shomei): on reading ショ (sho); no kun reading. It is not a word on its own, so its kana しょめい (shomei), signature, is the commonest word it begins, written 署名 (shomei). The taught card しょめい (shomei) from ja-travel is the same word, written 署名 (shomei). Its examples are 税務署に行きます (zeimusho ni ikimasu), where 税務署 (zeimusho), tax office, is the taught card ぜいむしょ (zeimusho) from ja-government, written with the taught kanji 税 (zei), 務 (mu) and 署 (sho), に (ni) is the taught particle, and 行きます (ikimasu) is the masu form of the taught card いく (iku), to go; and ここに署名をします (koko ni shomei o shimasu), where ここ (koko), here, is the taught card ここ (koko) from ja-location, に (ni) and を (o) are the taught particles, 署名 (shomei) is the taught card しょめい (shomei), and します (shimasu) is the masu form of the taught card する (suru), to do."
    examples:
      "税務署に行きます。": "I go to the tax office."
      "ここに署名をします。": "I sign here."
  "ja-7109":
    native: "the Bible"
    notes:
      "n1": "聖 (seisho): on reading セイ (sei); no kun reading. It is not a word on its own, so its kana せいしょ (seisho), the Bible, is the commonest word it begins, written 聖書 (seisho), where 書 (sho) is already taught. No taught card has that kana. No example is given, because no taught word is written with 聖 (sei)."
  "ja-7110":
    native: "large intestine"
    notes:
      "n1": "腸 (daichou): on reading チョウ (chou); no kun reading. It is not a word on its own, so its kana だいちょう (daichou), large intestine, is the commonest word it ends, written 大腸 (daichou), where 大 (dai) is already taught. No taught card has that kana. The taught card ちょう (chou) from ja-kanji-18, written 兆 (chou), omen; a trillion, and the taught card ちょう (chou) from ja-animals, butterfly, are different words with the same reading. No example is given, because no taught word is written with 腸 (chou)."
  "ja-7111":
    native: "belly; stomach"
    notes:
      "n1": "腹 (hara): on reading フク (fuku); kun reading はら (hara). Its kana はら (hara), belly; stomach, is the word it stands for in its kun reading, written 腹 (hara). The taught card はら (hara) from ja-body is the same word, and the taught card はら (hara) from ja-kanji-6, written 原 (hara), field; plain, is a different word with the same reading. Its example is 腹はいたいです (hara wa itai desu), where は (wa) is the taught particle, いたい (itai), painful, is the taught card いたい (itai) from ja-body, and です (desu) is the taught copula. The kanji 腹 (hara) is the word the card teaches, so the example needs no other new kanji."
    examples:
      "腹はいたいです。": "My stomach hurts."
      "腹痛がします。": "I have a stomachache."
  "ja-7112":
    native: "to steam"
    notes:
      "n1": "蒸 (musu): on reading ジョウ (jou); kun readings む-す (mu-su), む-れる (mu-reru) and む-らす (mu-rasu). Its kana むす (musu), to steam, is the word it stands for in its kun reading, written 蒸す (musu). No taught card has that kana. Its example is 夏は蒸し暑いです (natsu wa mushiatsui desu), where 夏 (natsu), summer, is the taught card なつ (natsu) from ja-kanji-5, は (wa) is the taught particle, 蒸し暑い (mushiatsui), humid, is the taught card むしあつい (mushiatsui) from ja-weather, written with the taught kanji 暑 (atsu) and the kanji 蒸 (jou) taught by this card, and です (desu) is the taught copula."
    examples:
      "夏は蒸し暑いです。": "Summer is humid."
  "ja-7113":
    native: "back; reverse side"
    notes:
      "n1": "裏 (ura): on reading リ (ri); kun reading うら (ura). Its kana うら (ura), back; reverse side, is the word it stands for in its kun reading, written 裏 (ura). No taught card has that kana. Its example is 屋根裏は広いです (yaneura wa hiroi desu), where 屋根裏 (yaneura), loft, is the taught card やねうら (yaneura) from ja-housing, written with the taught kanji 屋 (ya) and 根 (ne) and the kanji 裏 (ura) taught by this card, は (wa) is the taught particle, 広い (hiroi), wide; spacious, is the taught kanji card ひろい (hiroi) from ja-kanji-6, written with the taught kanji 広 (hiro), and です (desu) is the taught copula."
    examples:
      "屋根裏は広いです。": "The loft is spacious."
  "ja-7114":
    native: "sincerity; truth"
    notes:
      "n1": "誠 (makoto): on reading セイ (sei); kun reading まこと (makoto). Its kana まこと (makoto), sincerity; truth, is the word it stands for in its kun reading, written 誠 (makoto). No taught card has that kana. No example is given, because no taught word is written with 誠 (sei)."
  "ja-7115":
    native: "wages"
    notes:
      "n1": "賃 (chingin): on reading チン (chin); no kun reading. It is not a word on its own, so its kana ちんぎん (chingin), wages, is the commonest word it begins, written 賃金 (chingin), where 金 (kin) is already taught. No taught card has that kana. Its examples are 運賃は高いです (unchin wa takai desu), where 運賃 (unchin), fare, is the taught card うんちん (unchin) from ja-journey, written with the taught kanji 運 (un) and 賃 (chin), は (wa) is the taught particle, 高い (takai), expensive; high, is the taught card たかい (takai) from ja-quantities, written with the taught kanji 高 (taka), and です (desu) is the taught copula; and 家賃は安いです (yachin wa yasui desu), where 家賃 (yachin), rent, is the taught card やちん (yachin) from ja-home, written with the taught kanji 家 (ya) and 賃 (chin), は (wa) is the taught particle, and 安い (yasui), cheap, is the taught card やすい (yasui) from ja-kanji-11, written with the taught kanji 安 (yasu), and です (desu) is the taught copula."
    examples:
      "運賃は高いです。": "The fare is high."
      "家賃は安いです。": "The rent is cheap."
  "ja-7116":
    native: "to leave in someone's care"
    notes:
      "n1": "預 (azukeru): on reading ヨ (yo); kun readings あず-ける (azu-keru) and あず-かる (azu-karu). Its kana あずける (azukeru), to leave in someone's care, is the word it stands for in its kun reading, written 預ける (azukeru). The taught card あずける (azukeru) from ja-travel is the same word, written 預ける (azukeru). Its examples are 荷物を預かります (nimotsu o azukarimasu), where 荷物 (nimotsu), luggage, is the taught card にもつ (nimotsu) from ja-transport, written with the taught kanji 荷 (ni) and 物 (motsu), を (o) is the taught particle, and 預かります (azukarimasu) is the masu form of the taught card あずかる (azukaru), to look after; and 荷物を預けます (nimotsu o azukemasu), where 預けます (azukemasu) is the masu form of the taught card あずける (azukeru) from ja-travel, written with the kanji 預 (yo) taught by this card."
    examples:
      "荷物を預かります。": "I look after the luggage."
      "荷物を預けます。": "I leave the luggage with someone."
  "ja-7117":
    native: "high-rise; tall"
    notes:
      "n1": "層 (kousou): on reading ソウ (sou); no kun reading. It is not a word on its own, so its kana こうそう (kousou), high-rise; tall, is the commonest word it ends, written 高層 (kousou), where 高 (kou) is already taught. No taught card has that kana. No example is given, because no taught word is written with 層 (sou)."
  "ja-7118":
    native: "to live"
    notes:
      "n1": "暮 (kurasu): on reading ボ (bo); kun readings く-れる (ku-reru) and く-らす (ku-rasu). Its kana くらす (kurasu), to live, is the word it stands for in its kun reading, written 暮らす (kurasu). The taught card くらす (kurasu) from ja-housing is the same word. Its examples are 日本に暮らします (nihon ni kurashimasu), where 日本 (nihon), Japan, is the taught card にほん (nihon) from ja-first-words, written with the taught kanji 日 (nichi) and 本 (hon), に (ni) is the taught particle, and 暮らします (kurashimasu) is the masu form of the card; and 暮らしは楽しいです (kurashi wa tanoshii desu), where 暮らし (kurashi), life; living, is the taught card くらし (kurashi) from ja-housing, は (wa) is the taught particle, 楽しい (tanoshii), fun, is the taught card たのしい (tanoshii) from ja-kanji-5, written with the taught kanji 楽 (raku), and です (desu) is the taught copula."
    examples:
      "日本に暮らします。": "I live in Japan."
      "暮らしは楽しいです。": "Life is fun."
  "ja-7119":
    native: "pattern; design"
    notes:
      "n1": "模 (moyou): on reading モ (mo) and ボ (bo); no kun reading. It is not a word on its own, so its kana もよう (moyou), pattern; design, is the commonest word it begins, written 模様 (moyou), where 様 (you) is already taught. No taught card has that kana. No example is given, because no taught word is written with 模 (mo)."
  "ja-7120":
    native: "to doubt; to suspect"
    notes:
      "n1": "疑 (utagau): on reading ギ (gi); kun reading うたが-う (utaga-u). Its kana うたがう (utagau), to doubt; to suspect, is the word it stands for in its kun reading, written 疑う (utagau). The taught card うたがう (utagau) from ja-opinions is the same word. Its example is 私はかれを疑います (watashi wa kare o utagaimasu), where 私 (watashi), I, is the taught card わたし (watashi) from ja-kanji-33, は (wa) is the taught particle, かれ (kare), he, is the taught card かれ (kare) from ja-pronouns, written in kana, を (o) is the taught particle, and 疑います (utagaimasu) is the masu form of the taught card うたがう (utagau), with the kanji 疑 (gi) taught by this card."
    examples:
      "私はかれを疑います。": "I suspect him."
      "疑問は多いです。": "There are many questions."
  "ja-7121":
    native: "magnet"
    notes:
      "n1": "磁 (jishaku): on reading ジ (ji); no kun reading. It is not a word on its own, so its kana じしゃく (jishaku), magnet, is the commonest word it begins, written 磁石 (jishaku), where 石 (shaku) is already taught. No taught card has that kana. Its example is 磁器は美しいです (jiki wa utsukushii desu), where 磁器 (jiki), porcelain, is the taught card じき (jiki) from ja-arts, written with the kanji 磁 (ji) taught by this card and the taught kanji 器 (ki), は (wa) is the taught particle, 美しい (utsukushii), beautiful, is the taught card うつくしい (utsukushii) from ja-kanji-14, written with the taught kanji 美 (bi), and です (desu) is the taught copula."
    examples:
      "磁器は美しいです。": "Porcelain is beautiful."
  "ja-7122":
    native: "grain; cereal"
    notes:
      "n1": "穀 (kokumotsu): on reading コク (koku); no kun reading. It is not a word on its own, so its kana こくもつ (kokumotsu), grain; cereal, is the commonest word it begins, written 穀物 (kokumotsu), where 物 (motsu) is already taught. No taught card has that kana. No example is given, because no taught word is written with 穀 (koku)."
  "ja-7123":
    native: "magazine"
    notes:
      "n1": "誌 (zasshi): on reading シ (shi); no kun reading. It is not a word on its own, so its kana ざっし (zasshi), magazine, is the commonest word it ends, written 雑誌 (zasshi), where 雑 (zatsu) is taught from ja-kanji-31. The taught word card ざっし (zasshi) from ja-home is the same word, magazine, written 雑誌 (zasshi). Its example is 雑誌を読みます (zasshi o yomimasu), where 雑誌 (zasshi) is the taught card ざっし (zasshi) from ja-home, を (o) is the taught particle, and 読みます (yomimasu) is the masu form of the taught card よむ (yomu), to read."
    examples:
      "雑誌を読みます。": "I read magazines."
      "週刊誌は高いです。": "The weekly magazine is expensive."
  "ja-7124":
    native: "to admit; to recognise"
    notes:
      "n1": "認 (mitomeru): on reading ニン (nin); kun reading みと-める (mito-meru). Its kana みとめる (mitomeru), to admit; to recognise, is the word it stands for in its kun reading, written 認める (mitomeru). The taught card みとめる (mitomeru) from ja-opinions is the same word. Its example is 先生は私を認めます (sensei wa watashi o mitomemasu), where 先生 (sensei), teacher, is the taught card せんせい (sensei) from ja-first-words, written with the taught kanji 先 (sen) and 生 (sei), は (wa) is the taught particle, 私 (watashi) is the taught card わたし (watashi), を (o) is the taught particle, and 認めます (mitomemasu) is the masu form of the taught card みとめる (mitomeru)."
    examples:
      "先生は私を認めます。": "The teacher recognises me."
  "ja-7125":
    native: "to err; to make a mistake"
    notes:
      "n1": "誤 (ayamaru): on reading ゴ (go); kun reading あやま-る (ayama-ru). Its kana あやまる (ayamaru), to err; to make a mistake, is the word it stands for in its kun reading, written 誤る (ayamaru). The taught card あやまる (ayamaru) from ja-verbs-3 and the taught kanji card 謝 (ayamaru) from ja-kanji-31 are a different word, to apologise, written 謝る (ayamaru), with the same reading. No taught word is written with 誤 (go), so no example is given."
  "ja-7126":
    native: "money; coin"
    notes:
      "n1": "銭 (zeni): on reading セン (sen); kun reading ぜに (zeni). Its kana ぜに (zeni), money; coin, is the word it stands for in its kun reading, written 銭 (zeni). No taught card has that kana. It is in 小銭 (kozeni), small change."
    examples:
      "小銭が必要です。": "I need small change."
      "小銭入れは小さいです。": "The coin purse is small."
