"schema": !!int "1"
"id": "ja-en-geography-sentences"
"kind": "layer"
"core": "ja-geography-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Geography in sentences"
"description": "Sentences built from the words of this unit, to put in order, each with the words it could be mistaken for. Not yet checked by a Japanese speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "ja-2667":
    "native": "The capital of Japan is Tokyo."
    "notes":
      "n1": "しゅと (shuto), capital, is written 首都 (shuto), from 首 (shu), head, and 都 (to), capital city."
    "bases":
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "Yokohama, not the capital"
      "w2":
        "why": "prefecture, not the capital"
  "ja-2668":
    "native": "Hokkaido is cold."
    "notes":
      "n1": "さむい (samui) is cold of the weather or air; つめたい (tsumetai) is cold to the touch, as of a drink."
    "bases":
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "Kobe, a city, not a region"
      "w2":
        "why": "region, not a place name"
  "ja-2669":
    "native": "The sea of Okinawa is beautiful."
    "notes":
      "n1": "きれい (kirei) is a な (na) adjective: it takes です (desu) and no い (i) ending, and means both beautiful and clean."
    "bases":
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "Shikoku, not Okinawa"
      "w2":
        "why": "Mount Fuji, not a sea"
  "ja-2670":
    "native": "Mount Fuji is very tall."
    "notes":
      "n1": "たかい (takai) means high, tall or expensive, depending on the noun: a mountain, a person or a price."
    "bases":
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "Honshu, not a mountain"
      "w2":
        "why": "Pacific Ocean, not a mountain"
  "ja-2671":
    "native": "The city has many buildings."
    "notes":
      "n1": "おおい (ooi), many, takes が (ga) for the thing that is many: ビル (biru) が (ga) おおい (ooi)."
    "bases":
      "ビル":
        "meaning": "building"
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "countryside, not the city"
      "w2":
        "why": "village, not the city"
  "ja-2672":
    "native": "The countryside is quiet."
    "bases":
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "city, not the countryside"
      "w2":
        "why": "northern part, not the countryside"
  "ja-2673":
    "native": "It snows in the northern part."
    "notes":
      "n1": "に (ni) marks the place where the snow falls: ほくぶ (hokubu), the northern part, is that place here."
    "bases":
      "ふります":
        "meaning": "fall (of rain or snow; polite)"
    "confusables":
      "w1":
        "why": "southern part, not the north"
      "w2":
        "why": "eastern part, not the north"
  "ja-2674":
    "native": "The centre is lively."
    "bases":
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "western part, not the centre"
      "w2":
        "why": "Honshu, not the centre"
  "ja-2675":
    "native": "Yokohama is next to Tokyo."
    "notes":
      "n1": "となり (tonari), next to, takes の (no) before the place: とうきょう (toukyou) の (no) となり (tonari)."
    "bases":
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "Kobe, not next to Tokyo"
      "w2":
        "why": "Sapporo, not next to Tokyo"
  "ja-2676":
    "native": "Asia has many countries."
    "notes":
      "n1": "おおく (ooku), many, takes の (no) before a noun: おおく (ooku) の (no) くに (kuni), many countries."
    "bases":
      "おおくの":
        "meaning": "many (before a noun)"
      "あります":
        "meaning": "there is (polite)"
    "confusables":
      "w1":
        "why": "Europe, not Asia"
      "w2":
        "why": "Africa, not Asia"
  "ja-2677":
    "native": "I saw the Pacific Ocean."
    "notes":
      "n1": "太平洋 (taiheiyou), the Pacific, means great calm ocean, from 太 (tai), great, 平 (hei), calm, and 洋 (you), ocean."
    "bases":
      "みました":
        "meaning": "saw (polite)"
    "confusables":
      "w1":
        "why": "Atlantic Ocean, not the Pacific"
      "w2":
        "why": "North Pole, not an ocean"
  "ja-2678":
    "native": "The night at the North Pole is long."
    "notes":
      "n1": "ながい (nagai) is long, of length or of a span of time, so よる (yoru), night, can be long."
    "bases":
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "Atlantic Ocean, not a pole"
      "w2":
        "why": "Mount Fuji, not a pole"
