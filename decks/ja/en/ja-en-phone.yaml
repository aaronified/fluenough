"schema": !!int "1"
"id": "ja-en-phone"
"kind": "layer"
"core": "ja-phone"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Phone"
"description": "Phone: 35 words for phones, calls, charging, apps and the internet, and 4 verbs of calls and connections. Not yet checked by a Japanese speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "ja-2300":
    "native": "smartphone"
    "notes":
      "n1": "sumaho is short for smartphone, the usual spoken word."
    "examples":
      "わたしのスマホはあたらしいです。":
        "native": "My smartphone is new."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "スマホでしゃしんをとります。":
        "native": "I take photos with my smartphone."
        "bases":
          "とります":
            "meaning": "take (a photo, polite)"
  "ja-2301":
    "native": "mobile phone"
    "notes":
      "n1": "keitai means a mobile phone. It is the short form of keitai denwa."
    "examples":
      "けいたいをわすれました。":
        "native": "I forgot my mobile phone."
        "bases":
          "わすれました":
            "meaning": "forgot (polite)"
      "けいたいはかばんのなかです。":
        "native": "My mobile phone is in my bag."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2302":
    "native": "telephone number"
    "notes":
      "n1": "denwabangou means telephone number. Bangou means number."
    "examples":
      "でんわばんごうをおしえてください。":
        "native": "Please tell me the telephone number."
        "bases":
          "おしえて":
            "meaning": "tell (te-form)"
          "ください":
            "meaning": "(please give)"
      "でんわばんごうをかきました。":
        "native": "I wrote down the telephone number."
        "bases":
          "かきました":
            "meaning": "wrote (polite)"
  "ja-2303":
    "native": "email address"
    "notes":
      "n1": "meeruadoresu is an email address. Meeru alone means email."
    "examples":
      "メールアドレスをおしえてください。":
        "native": "Please tell me your email address."
        "bases":
          "おしえて":
            "meaning": "tell (te-form)"
          "ください":
            "meaning": "(please give)"
      "わたしのメールアドレスはこれです。":
        "native": "This is my email address."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2304":
    "native": "app"
    "notes":
      "n1": "apuri is short for application, the word for an app on a phone."
    "examples":
      "アプリをダウンロードします。":
        "native": "I download an app."
        "bases":
          "します":
            "meaning": "do (polite)"
      "このアプリはむりょうです。":
        "native": "This app is free."
        "bases":
          "むりょう":
            "meaning": "free of charge"
          "です":
            "meaning": "(to be, polite)"
  "ja-2305":
    "native": "screen"
    "notes":
      "n1": "gamen means a screen, the display of a phone or a computer."
    "examples":
      "がめんがあかるいです。":
        "native": "The screen is bright."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "がめんをみます。":
        "native": "I look at the screen."
        "bases":
          "みます":
            "meaning": "look at (polite)"
  "ja-2306":
    "native": "charging"
    "notes":
      "n1": "juuden means charging a battery. With suru it becomes a verb: juuden shimasu."
    "examples":
      "でんわをじゅうでんします。":
        "native": "I charge my phone."
        "bases":
          "します":
            "meaning": "do (polite)"
      "じゅうでんがおわりました。":
        "native": "The charging has finished."
        "bases":
          "おわりました":
            "meaning": "finished (polite)"
  "ja-2307":
    "native": "charger"
    "notes":
      "n1": "juudenki is the charger, the device that charges a phone."
    "examples":
      "じゅうでんきをかばんにいれました。":
        "native": "I put the charger in my bag."
        "bases":
          "いれました":
            "meaning": "put in (polite)"
      "じゅうでんきがありません。":
        "native": "There is no charger."
        "bases":
          "ありません":
            "meaning": "there is no (polite)"
  "ja-2308":
    "native": "battery"
    "notes":
      "n1": "denchi means a battery."
    "examples":
      "でんちがきれました。":
        "native": "The battery ran out."
        "bases":
          "きれました":
            "meaning": "ran out (polite)"
      "でんちをかえます。":
        "native": "I change the battery."
        "bases":
          "かえます":
            "meaning": "change (polite)"
  "ja-2309":
    "native": "power switch"
    "notes":
      "n1": "dengen means the power of a device, or its power switch."
    "examples":
      "でんげんをいれてください。":
        "native": "Please turn the power on."
        "bases":
          "いれて":
            "meaning": "put in, turn on (te-form)"
          "ください":
            "meaning": "(please give)"
      "でんげんをきります。":
        "native": "I turn off the power."
        "bases":
          "きります":
            "meaning": "turn off (polite)"
  "ja-2310":
    "native": "volume"
    "notes":
      "n1": "onryou means the volume of sound."
    "examples":
      "おんりょうをあげてください。":
        "native": "Please turn the volume up."
        "bases":
          "あげて":
            "meaning": "turn up (te-form)"
          "ください":
            "meaning": "(please give)"
      "おんりょうがちいさいです。":
        "native": "The volume is small."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2311":
    "native": "spam email"
    "notes":
      "n1": "meiwaku means nuisance, so meiwaku meeru is spam."
    "examples":
      "めいわくメールがきました。":
        "native": "A spam email came."
        "bases":
          "きました":
            "meaning": "came (polite)"
      "めいわくメールをけします。":
        "native": "I delete the spam email."
        "bases":
          "けします":
            "meaning": "delete (polite)"
  "ja-2312":
    "native": "message"
    "notes":
      "n1": "messeeji is a message, usually a short text."
    "examples":
      "メッセージをおくりました。":
        "native": "I sent a message."
        "bases":
          "おくりました":
            "meaning": "sent (polite)"
      "メッセージにへんしんをします。":
        "native": "I reply to the message."
        "bases":
          "します":
            "meaning": "do (polite)"
  "ja-2313":
    "native": "sticker"
    "notes":
      "n1": "sutanpu is a sticker, often a cartoon picture sent in a chat app. It is not a rubber stamp."
    "examples":
      "ともだちにスタンプをおくりました。":
        "native": "I sent my friend a sticker."
        "bases":
          "おくりました":
            "meaning": "sent (polite)"
      "スタンプがかわいいです。":
        "native": "The sticker is cute."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2314":
    "native": "phone call"
    "notes":
      "n1": "tsuuwa means a phone call, or talk on the phone."
    "examples":
      "つうわがおわりました。":
        "native": "The phone call has ended."
        "bases":
          "おわりました":
            "meaning": "finished (polite)"
      "ながいつうわをしました。":
        "native": "I had a long phone call."
        "bases":
          "しました":
            "meaning": "did (polite)"
  "ja-2315":
    "native": "incoming call"
    "notes":
      "n1": "chakushin means an incoming call, a call that comes in to you."
    "examples":
      "ちゃくしんがありました。":
        "native": "There was an incoming call."
        "bases":
          "ありました":
            "meaning": "there was (polite)"
      "ちゃくしんにでました。":
        "native": "I answered the incoming call."
        "bases":
          "でました":
            "meaning": "answered, came out (polite)"
  "ja-2316":
    "native": "answering machine"
    "notes":
      "n1": "rusuban denwa is an answering machine. Rusuban means looking after the house while the owner is out."
    "examples":
      "るすばんでんわにメッセージがあります。":
        "native": "There is a message on the answering machine."
        "bases":
          "あります":
            "meaning": "there is (polite)"
      "るすばんでんわをつけます。":
        "native": "I turn on the answering machine."
        "bases":
          "つけます":
            "meaning": "turn on (polite)"
  "ja-2317":
    "native": "public telephone"
    "notes":
      "n1": "koushuu denwa is a public telephone, the one in a street or a station that you pay to use."
    "examples":
      "えきにこうしゅうでんわがあります。":
        "native": "There is a public telephone at the station."
        "bases":
          "あります":
            "meaning": "there is (polite)"
      "こうしゅうでんわをつかいました。":
        "native": "I used a public telephone."
        "bases":
          "つかいました":
            "meaning": "used (polite)"
  "ja-2318":
    "native": "radio signal"
    "notes":
      "n1": "denpa means a radio signal, the waves that a phone receives."
    "examples":
      "でんぱがよわいです。":
        "native": "The signal is weak."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "でんぱがつよくなりました。":
        "native": "The signal became strong."
        "bases":
          "つよく":
            "meaning": "strong (adverb form)"
          "なりました":
            "meaning": "became (polite)"
  "ja-2319":
    "native": "out of range"
    "notes":
      "n1": "kengai means out of range. It is the sign on a phone when there is no signal."
    "examples":
      "ここはけんがいです。":
        "native": "Here there is no signal."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "トンネルのなかはけんがいです。":
        "native": "Inside the tunnel there is no signal."
        "bases":
          "トンネル":
            "meaning": "tunnel"
          "です":
            "meaning": "(to be, polite)"
  "ja-2320":
    "native": "to be connected"
    "notes":
      "n1": "tsunagaru means to be connected, said of a call or a line. Tsunagu is the verb for connecting something."
    "examples":
      "でんわがつながりました。":
        "native": "The call connected."
        "bases":
          "つながりました":
            "meaning": "connected (polite)"
      "まだつながりません。":
        "native": "It is not connected yet."
        "bases":
          "つながりません":
            "meaning": "is not connected (polite)"
  "ja-2321":
    "native": "to connect"
    "notes":
      "n1": "tsunagu means to connect one thing to another, such as a charger to a socket."
    "examples":
      "じゅうでんきをコンセントにつなぎます。":
        "native": "I connect the charger to the outlet."
        "bases":
          "コンセント":
            "meaning": "electric outlet"
          "つなぎます":
            "meaning": "connect (polite)"
      "ワイファイにつなぎました。":
        "native": "I connected to Wi-Fi."
        "bases":
          "ワイファイ":
            "meaning": "Wi-Fi"
          "つなぎました":
            "meaning": "connected (polite)"
  "ja-2322":
    "native": "to make a call"
    "notes":
      "n1": "denwa o kakeru means to call someone on the phone. Kakeru has many other senses; this is the one for calls."
    "examples":
      "ともだちにでんわをかけます。":
        "native": "I call my friend."
        "bases":
          "かけます":
            "meaning": "make (a call, polite)"
      "さっきでんわをかけました。":
        "native": "I called a little while ago."
        "bases":
          "さっき":
            "meaning": "a little while ago"
          "かけました":
            "meaning": "made (a call, polite)"
  "ja-2323":
    "native": "to receive"
    "notes":
      "n1": "uketoru means to receive something, such as a message or a parcel."
    "examples":
      "メッセージをうけとりました。":
        "native": "I received a message."
        "bases":
          "うけとりました":
            "meaning": "received (polite)"
      "メールをうけとりました。":
        "native": "I received an email."
        "bases":
          "うけとりました":
            "meaning": "received (polite)"
  "ja-2324":
    "native": "reply"
    "notes":
      "n1": "henshin means a reply to a message."
    "examples":
      "へんしんがはやいです。":
        "native": "The reply is quick."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "へんしんをまちます。":
        "native": "I wait for a reply."
        "bases":
          "まちます":
            "meaning": "wait (polite)"
  "ja-2325":
    "native": "message left for someone"
    "notes":
      "n1": "dengon means a message left for someone, to be passed on by another person."
    "examples":
      "でんごんをおねがいします。":
        "native": "Please pass on a message."
        "bases":
          "おねがいします":
            "meaning": "please (set phrase)"
      "かぞくにでんごんがあります。":
        "native": "I have a message for my family."
        "bases":
          "あります":
            "meaning": "there is (polite)"
  "ja-2326":
    "native": "registration"
    "notes":
      "n1": "touroku means registration, such as signing up for a service or saving a number in a phone."
    "examples":
      "アプリのとうろくがおわりました。":
        "native": "The app registration is done."
        "bases":
          "おわりました":
            "meaning": "finished (polite)"
      "でんわばんごうをとうろくします。":
        "native": "I register the phone number."
        "bases":
          "します":
            "meaning": "do (polite)"
  "ja-2327":
    "native": "download"
    "notes":
      "n1": "daunroodo is a download. With suru it means to download."
    "examples":
      "ゲームをダウンロードしました。":
        "native": "I downloaded a game."
        "bases":
          "しました":
            "meaning": "did (polite)"
      "ダウンロードがおわりました。":
        "native": "The download has finished."
        "bases":
          "おわりました":
            "meaning": "finished (polite)"
  "ja-2328":
    "native": "password"
    "notes":
      "n1": "pasuwaado is a password for an app or an account."
    "examples":
      "パスワードをわすれました。":
        "native": "I forgot my password."
        "bases":
          "わすれました":
            "meaning": "forgot (polite)"
      "パスワードはだれにもおしえません。":
        "native": "I do not tell my password to anyone."
        "bases":
          "おしえません":
            "meaning": "do not tell (polite)"
  "ja-2329":
    "native": "login"
    "notes":
      "n1": "roguin means logging in. With suru it means to log in."
    "examples":
      "アプリにログインします。":
        "native": "I log in to the app."
        "bases":
          "します":
            "meaning": "do (polite)"
      "ログインできません。":
        "native": "I cannot log in."
        "bases":
          "できません":
            "meaning": "cannot (polite)"
  "ja-2330":
    "native": "website"
    "notes":
      "n1": "webusaito is a website."
    "examples":
      "このウェブサイトはべんりです。":
        "native": "This website is convenient."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "ウェブサイトでしらべました。":
        "native": "I looked it up on a website."
        "bases":
          "しらべました":
            "meaning": "searched, looked up (polite)"
  "ja-2331":
    "native": "search"
    "notes":
      "n1": "kensaku means a search. With suru it means to search."
    "examples":
      "インターネットでけんさくします。":
        "native": "I search on the internet."
        "bases":
          "します":
            "meaning": "do (polite)"
      "アプリでけんさくしました。":
        "native": "I searched in the app."
        "bases":
          "しました":
            "meaning": "did (polite)"
  "ja-2332":
    "native": "click"
    "notes":
      "n1": "kurikku is a click. With suru it means to click."
    "examples":
      "ボタンをクリックしてください。":
        "native": "Please click the button."
        "bases":
          "して":
            "meaning": "do (te-form)"
          "ください":
            "meaning": "(please give)"
      "がめんをクリックしました。":
        "native": "I clicked on the screen."
        "bases":
          "しました":
            "meaning": "did (polite)"
  "ja-2333":
    "native": "screenshot"
    "notes":
      "n1": "sukuriinshotto is a screenshot. With suru it means to take a screenshot."
    "examples":
      "がめんのスクリーンショットをとりました。":
        "native": "I took a screenshot of the screen."
        "bases":
          "とりました":
            "meaning": "took (polite)"
      "スクリーンショットをおくりました。":
        "native": "I sent a screenshot."
        "bases":
          "おくりました":
            "meaning": "sent (polite)"
  "ja-2334":
    "native": "video call"
    "notes":
      "n1": "bideo tsuuwa is a video call. Bideo means video."
    "examples":
      "ビデオつうわではなしました。":
        "native": "We talked on a video call."
        "bases":
          "はなしました":
            "meaning": "talked (polite)"
      "ははとビデオつうわをします。":
        "native": "I have a video call with my mother."
        "bases":
          "します":
            "meaning": "do (polite)"
