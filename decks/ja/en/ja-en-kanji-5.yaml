schema: 1
id: "ja-en-kanji-5"
kind: "layer"
core: "ja-kanji-5"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 5: grade 2, part 1"
description: "Thirty-two kanji of the second school grade, each taught by the kana reading of the word it stands for. Some have one example or none yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-5180":
    native: "to pull; to draw"
    notes:
      "n1": "引 (hiku): on reading イン (in); kun readings ひく (hiku) and ひける (hikeru). It is in 引く (hiku), to pull."
  "ja-5181":
    native: "wing; feather"
    notes:
      "n1": "羽 (hane): on reading ウ (u); kun readings は (ha) and はね (hane). It is in 羽 (hane), wing."
  "ja-5182":
    native: "cloud"
    notes:
      "n1": "雲 (kumo): on reading ウン (un); kun reading くも (kumo). It is in 雲 (kumo), cloud."
  "ja-5183":
    native: "garden; park"
    notes:
      "n1": "園 (kouen): on reading エン (en); kun reading その (sono). It is in 公園 (kouen), park."
  "ja-5184":
    native: "far; distant"
    notes:
      "n1": "遠 (tooi): on readings エン (en) and オン (on); kun reading とおい (tooi). It is in 遠い (tooi), far."
    examples:
      "えきは遠いです。": "The station is far."
  "ja-5185":
    native: "what"
    notes:
      "n1": "何 (nani): on reading カ (ka); kun readings なに (nani) and なん (nan). It is in 何 (nani), what."
    examples:
      "あれは何ですか。": "What is that?"
  "ja-5186":
    native: "department; subject"
    notes:
      "n1": "科 (kagaku): on reading カ (ka). It is in 科学 (kagaku), science."
  "ja-5187":
    native: "summer"
    notes:
      "n1": "夏 (natsu): on readings カ (ka) and ゲ (ge); kun reading なつ (natsu). It is in 夏休み (natsuyasumi), summer holiday."
    examples:
      "夏はあついです。": "Summer is hot."
      "夏休みはたのしいです。": "Summer holidays are fun."
  "ja-5188":
    native: "house; home"
    notes:
      "n1": "家 (ie): on readings カ (ka) and ケ (ke); kun readings いえ (ie) and や (ya). It is in 家 (ie), house."
    examples:
      "家はおおきいです。": "The house is big."
  "ja-5189":
    native: "song"
    notes:
      "n1": "歌 (uta): on reading カ (ka); kun readings うた (uta) and うたう (utau). It is in 歌 (uta), song."
    examples:
      "わたしは歌う。": "I sing."
  "ja-5190":
    native: "picture; drawing; stroke"
    notes:
      "n1": "画 (eiga): on readings ガ (ga) and カク (kaku). It is in 映画 (eiga), movie."
  "ja-5191":
    native: "times; round"
    notes:
      "n1": "回 (kai): on readings カイ (kai) and エ (e); kun readings まわる (mawaru) and まわす (mawasu). It is in 回 (kai), time."
  "ja-5192":
    native: "meet"
    notes:
      "n1": "会 (au): on readings カイ (kai) and エ (e); kun reading あう (au). It is in 会う (au), to meet."
    examples:
      "わたしはともだちに会う。": "I meet a friend."
  "ja-5193":
    native: "sea"
    notes:
      "n1": "海 (umi): on reading カイ (kai); kun reading うみ (umi). It is in 海 (umi), sea."
    examples:
      "海はおおきいです。": "The sea is big."
  "ja-5194":
    native: "picture; painting"
    notes:
      "n1": "絵 (e): on readings カイ (kai) and エ (e). It is in 絵 (e), picture."
  "ja-5195":
    native: "outside"
    notes:
      "n1": "外 (soto): on readings ガイ (gai) and ゲ (ge); kun readings そと (soto), ほか (hoka), はずす (hazusu) and はずれる (hazureru). It is in 外 (soto), outside."
    examples:
      "外はさむいです。": "It is cold outside."
  "ja-5196":
    native: "corner; horn"
    notes:
      "n1": "角 (kado): on reading カク (kaku); kun readings かど (kado) and つの (tsuno). It is in 角 (kado), corner."
    examples:
      "わたしは角をまがる。": "I turn at the corner."
  "ja-5197":
    native: "fun; comfort; music"
    notes:
      "n1": "楽 (tanoshii): on readings ガク (gaku) and ラク (raku); kun readings たのしい (tanoshii) and たのしむ (tanoshimu). It is in 楽しい (tanoshii), fun."
    examples:
      "がっこうは楽しいです。": "School is fun."
  "ja-5198":
    native: "life; liveliness"
    notes:
      "n1": "活 (seikatsu): on reading カツ (katsu). It is in 生活 (seikatsu), life."
    examples:
      "生活はたのしいです。": "Life is fun."
  "ja-5199":
    native: "between; interval"
    notes:
      "n1": "間 (aida): on readings カン (kan) and ケン (ken); kun readings あいだ (aida) and ま (ma). It is in 間 (aida), between."
    examples:
      "えきとがっこうの間はこうえんです。": "The park is between the station and the school."
  "ja-5200":
    native: "round; circle"
    notes:
      "n1": "丸 (marui): on reading ガン (gan); kun readings まる (maru), まるい (marui) and まるめる (marumeru). It is in 丸い (marui), round."
    examples:
      "つきは丸いです。": "The moon is round."
  "ja-5201":
    native: "rock"
    notes:
      "n1": "岩 (iwa): on reading ガン (gan); kun reading いわ (iwa). It is in 岩 (iwa), rock."
  "ja-5202":
    native: "face"
    notes:
      "n1": "顔 (kao): on reading ガン (gan); kun reading かお (kao). It is in 顔 (kao), face."
    examples:
      "いぬの顔はまるいです。": "The dog's face is round."
  "ja-5203":
    native: "steam"
    notes:
      "n1": "汽 (kisha): on reading キ (ki). It is in 汽車 (kisha), train."
  "ja-5204":
    native: "record; write down"
    notes:
      "n1": "記 (nikki): on reading キ (ki); kun reading しるす (shirusu). It is in 日記 (nikki), diary."
  "ja-5205":
    native: "return home"
    notes:
      "n1": "帰 (kaeru): on reading キ (ki); kun readings かえる (kaeru) and かえす (kaesu). It is in 帰る (kaeru), to go home."
    examples:
      "わたしはいえに帰る。": "I go home."
  "ja-5206":
    native: "bow"
    notes:
      "n1": "弓 (yumi): on reading キュウ (kyuu); kun reading ゆみ (yumi). It is in 弓 (yumi), bow."
  "ja-5207":
    native: "cow"
    notes:
      "n1": "牛 (ushi): on reading ギュウ (gyuu); kun reading うし (ushi). It is in 牛 (ushi), cow."
  "ja-5208":
    native: "fish"
    notes:
      "n1": "魚 (sakana): on reading ギョ (gyo); kun readings うお (uo) and さかな (sakana). It is in 魚 (sakana), fish."
    examples:
      "魚はたかいです。": "Fish is expensive."
  "ja-5209":
    native: "capital"
    notes:
      "n1": "京 (toukyou): on readings キョウ (kyou) and ケイ (kei). It is in 東京 (toukyou), Tokyo."
  "ja-5210":
    native: "strong"
    notes:
      "n1": "強 (tsuyoi): on readings キョウ (kyou) and ゴウ (gou); kun readings つよい (tsuyoi), つよまる (tsuyomaru), つよめる (tsuyomeru) and しいる (shiiru). It is in 強い (tsuyoi), strong."
    examples:
      "いぬは強いです。": "The dog is strong."
  "ja-5211":
    native: "teach"
    notes:
      "n1": "教 (oshieru): on reading キョウ (kyou); kun readings おしえる (oshieru) and おそわる (osowaru). It is in 教える (oshieru), to teach."
    examples:
      "せんせいが教える。": "The teacher teaches."
