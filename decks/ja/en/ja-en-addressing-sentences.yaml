"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Addressing in sentences"
"license": "CC-BY-SA-4.0"
"description": "Six sentences with the words for addressing people, to put in order, each with the words it could be mistaken for. Not yet checked by a Japanese speaker: please report any mistake."
"tags":
- "beginner"
- "unreviewed"
"cards":
  "ja-0155":
    "native": "My senior is the section chief."
    "bases":
      "の":
        "meaning": "(links two nouns: of, 's)"
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "is (polite)"
    "confusables":
      "w1":
        "why": "しゃちょう (shachou) is a company president, not a section chief."
      "w2":
        "why": "こうはい (kouhai) is a junior, the opposite of a senior."
  "ja-0156":
    "native": "Who is the wife, please?"
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "is (polite)"
      "か":
        "meaning": "(marks a question)"
    "confusables":
      "w1":
        "why": "だれ (dare) is the plain who; どなた (donata) is the polite who."
      "w2":
        "why": "どこ (doko) asks where, not who."
  "ja-0157":
    "native": "What is the surname?"
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "なん":
        "meaning": "what (before です (desu))"
      "です":
        "meaning": "is (polite)"
      "か":
        "meaning": "(marks a question)"
    "confusables":
      "w1":
        "why": "だれ (dare) asks who, not what."
      "w2":
        "why": "どこ (doko) asks where, not what."
  "ja-0158":
    "native": "My name is Tanaka."
    "bases":
      "の":
        "meaning": "(links two nouns: of, 's)"
      "は":
        "meaning": "(marks the topic)"
      "たなか":
        "meaning": "Tanaka (a surname)"
      "です":
        "meaning": "is (polite)"
    "confusables":
      "w1":
        "why": "おなまえ (onamae) is the polite word for a name, said of someone else's."
      "w2":
        "why": "みょうじ (myouji) is only the surname, not the whole name."
  "ja-0159":
    "native": "The little boy is small."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "is (polite)"
    "confusables":
      "w1":
        "why": "おじょうさん (ojousan) is a young lady, not a boy."
      "w2":
        "why": "おじょうちゃん (ojouchan) is a little girl, not a boy."
  "ja-0160":
    "native": "Hello, everyone."
    "confusables":
      "w1":
        "why": "ねえ (nee) calls one friend and is not a greeting."
      "w2":
        "why": "さようなら (sayounara) says goodbye, not hello."
