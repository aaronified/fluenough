"cards":
  "ja-2434":
    "native": "nature"
    "notes":
      "n1": "shizen is nature, the natural world. It can also mean natural, as in shizen ni (naturally)."
    "examples":
      "しぜんがすきです。":
        "native": "I like nature."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "しぜんをまもりましょう。":
        "native": "Let's protect nature."
        "bases":
          "まもりましょう":
            "meaning": "let's protect (polite)"
  "ja-2435":
    "native": "continent"
    "notes":
      "n1": "tairiku is a continent, a large mass of land such as Asia."
    "examples":
      "アジアはたいりくです。":
        "native": "Asia is a continent."
        "bases":
          "アジア":
            "meaning": "Asia"
          "です":
            "meaning": "(to be, polite)"
      "たいりくをりょこうしたいです。":
        "native": "I want to travel across a continent."
        "bases":
          "したい":
            "meaning": "want to do"
          "です":
            "meaning": "(to be, polite)"
  "ja-2436":
    "native": "desert"
    "notes":
      "n1": "sabaku is a desert, a dry land with little rain."
    "examples":
      "さばくはあついです。":
        "native": "The desert is hot."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "さばくであめがすくないです。":
        "native": "There is little rain in the desert."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2437":
    "native": "valley"
    "notes":
      "n1": "tani is a valley, the low land between hills or mountains."
    "examples":
      "たにのかわはきれいです。":
        "native": "The river in the valley is clean."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "たにへおりていきます。":
        "native": "I go down into the valley."
        "bases":
          "おりて":
            "meaning": "go down, get off (te-form)"
          "いきます":
            "meaning": "go (polite)"
  "ja-2438":
    "native": "cliff"
    "notes":
      "n1": "gake is a cliff, a steep face of rock or earth."
    "examples":
      "がけはとてもたかいです。":
        "native": "The cliff is very high."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "がけにちかづかないでください。":
        "native": "Please do not go near the cliff."
        "bases":
          "ちかづかないで":
            "meaning": "approach (te-form, negative)"
          "ください":
            "meaning": "(please give)"
  "ja-2439":
    "native": "waterfall"
    "notes":
      "n1": "taki is a waterfall, water falling from a height."
    "examples":
      "たきのおとがきこえます。":
        "native": "I can hear the sound of the waterfall."
        "bases":
          "きこえます":
            "meaning": "can be heard (polite)"
      "たきまでいきましょう。":
        "native": "Let's go as far as the waterfall."
        "bases":
          "まで":
            "meaning": "until, as far as"
          "いきましょう":
            "meaning": "let's go (polite)"
  "ja-2440":
    "native": "lake"
    "notes":
      "n1": "mizuumi is a lake, a large body of fresh water on land."
    "examples":
      "みずうみでおよぎます。":
        "native": "I swim in the lake."
        "bases":
          "およぎます":
            "meaning": "swim (polite)"
      "みずうみはしずかです。":
        "native": "The lake is quiet."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2441":
    "native": "riverbank"
    "notes":
      "n1": "kawara is a riverbank, a flat stony place beside a river."
    "examples":
      "かわらでやすみました。":
        "native": "I rested on the riverbank."
        "bases":
          "やすみました":
            "meaning": "rested (polite)"
      "かわらにこどもがあそんでいます。":
        "native": "Children are playing on the riverbank."
        "bases":
          "あそんでいます":
            "meaning": "are playing (polite)"
  "ja-2442":
    "native": "beach"
    "notes":
      "n1": "hama is a beach, the shore of the sea."
    "examples":
      "はまへいきましょう。":
        "native": "Let's go to the beach."
        "bases":
          "いきましょう":
            "meaning": "let's go (polite)"
      "はまはひとがおおいです。":
        "native": "There are many people at the beach."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2443":
    "native": "sandy beach"
    "notes":
      "n1": "sunahama is a beach of sand, from suna (sand) and hama (beach)."
    "examples":
      "すなはまであそびます。":
        "native": "I play on the sandy beach."
        "bases":
          "あそびます":
            "meaning": "play (polite)"
      "すなはまのすなはやわらかいです。":
        "native": "The sand on the beach is soft."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2444":
    "native": "rock"
    "notes":
      "n1": "iwa is a rock, a large stone in the ground or in water."
    "examples":
      "いわのうえにのぼりました。":
        "native": "I climbed onto the rock."
        "bases":
          "のぼりました":
            "meaning": "climbed (polite)"
      "このいわはおもいです。":
        "native": "This rock is heavy."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2445":
    "native": "stone"
    "notes":
      "n1": "ishi is a stone, a small piece of rock."
    "examples":
      "いしをひろいました。":
        "native": "I picked up a stone."
        "bases":
          "ひろいました":
            "meaning": "picked up (polite)"
      "かわにいしがあります。":
        "native": "There are stones in the river."
        "bases":
          "あります":
            "meaning": "there is (polite)"
  "ja-2446":
    "native": "sand"
    "notes":
      "n1": "suna is sand, the fine grains on a beach or in a desert."
    "examples":
      "くつにすながはいりました。":
        "native": "Sand got into my shoes."
        "bases":
          "はいりました":
            "meaning": "got in, entered (polite)"
      "すなのおしろをつくります。":
        "native": "I build a sandcastle."
        "bases":
          "おしろ":
            "meaning": "castle"
          "つくります":
            "meaning": "make, build (polite)"
  "ja-2447":
    "native": "soil; earth"
    "notes":
      "n1": "tsuchi is soil, the earth you plant in or walk on."
    "examples":
      "つちがかわいています。":
        "native": "The soil is dry."
        "bases":
          "かわいています":
            "meaning": "is dry (polite)"
      "つちでやさいをつくります。":
        "native": "I grow vegetables in the soil."
        "bases":
          "つくります":
            "meaning": "make, build (polite)"
  "ja-2448":
    "native": "leaf"
    "notes":
      "n1": "happa is a leaf, a more casual word than ha."
    "examples":
      "はっぱがあかくなりました。":
        "native": "The leaves turned red."
        "bases":
          "あかく":
            "meaning": "red (adverb form)"
          "なりました":
            "meaning": "became (polite)"
      "はっぱがいっぱいおちています。":
        "native": "Many leaves have fallen."
        "bases":
          "おちています":
            "meaning": "has fallen (polite)"
  "ja-2449":
    "native": "branch"
    "notes":
      "n1": "eda is a branch of a tree."
    "examples":
      "えだにとりがいます。":
        "native": "There is a bird on the branch."
        "bases":
          "います":
            "meaning": "is, there is (people, animals; polite)"
      "えだがおれました。":
        "native": "A branch broke."
        "bases":
          "おれました":
            "meaning": "broke (polite)"
  "ja-2450":
    "native": "trunk"
    "notes":
      "n1": "miki is the trunk of a tree, the thick main stem."
    "examples":
      "みきがふとくてつよいです。":
        "native": "The trunk is thick and strong."
        "bases":
          "ふとくて":
            "meaning": "thick (te-form)"
          "です":
            "meaning": "(to be, polite)"
      "みきにさわりました。":
        "native": "I touched the trunk."
        "bases":
          "さわりました":
            "meaning": "touched (polite)"
  "ja-2451":
    "native": "seed"
    "notes":
      "n1": "tane is a seed, from which a plant grows."
    "examples":
      "たねをまきました。":
        "native": "I sowed seeds."
        "bases":
          "まきました":
            "meaning": "sowed (polite)"
      "このたねははなになります。":
        "native": "This seed will become a flower."
        "bases":
          "なります":
            "meaning": "become (polite)"
  "ja-2452":
    "native": "bud"
    "notes":
      "n1": "tsubomi is a bud, the closed flower before it opens."
    "examples":
      "さくらのつぼみがでてきました。":
        "native": "The cherry buds have come out."
        "bases":
          "でてきました":
            "meaning": "came out (polite)"
      "つぼみはまだかたいです。":
        "native": "The buds are still hard."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2453":
    "native": "grass"
    "notes":
      "n1": "kusa is grass, the plant that covers the ground."
    "examples":
      "くさのうえにすわります。":
        "native": "I sit on the grass."
        "bases":
          "すわります":
            "meaning": "sit down (polite)"
      "くさがのびました。":
        "native": "The grass has grown."
        "bases":
          "のびました":
            "meaning": "grew (polite)"
  "ja-2454":
    "native": "hydrangea"
    "notes":
      "n1": "ajisai is a hydrangea, a shrub with round clusters of flowers in the rainy season."
    "examples":
      "あじさいがさいています。":
        "native": "The hydrangeas are in bloom."
        "bases":
          "さいています":
            "meaning": "are in bloom (polite)"
      "あじさいはあめのひにさきます。":
        "native": "Hydrangeas bloom on rainy days."
        "bases":
          "さきます":
            "meaning": "bloom (polite)"
  "ja-2455":
    "native": "Japanese cedar"
    "notes":
      "n1": "sugi is the Japanese cedar, a tall tree common in Japan."
    "examples":
      "すぎはまっすぐです。":
        "native": "The cedar is straight."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "やまにすぎがたくさんあります。":
        "native": "There are many cedars on the mountain."
        "bases":
          "あります":
            "meaning": "there is (polite)"
  "ja-2456":
    "native": "bamboo"
    "notes":
      "n1": "take is bamboo, the tall hollow grass."
    "examples":
      "たけのなかにいます。":
        "native": "I am in the bamboo grove."
        "bases":
          "います":
            "meaning": "is, there is (people, animals; polite)"
      "たけがたかくのびています。":
        "native": "The bamboo has grown tall."
        "bases":
          "たかく":
            "meaning": "tall, high (adverb form)"
          "のびています":
            "meaning": "has grown (polite)"
  "ja-2457":
    "native": "plum tree"
    "notes":
      "n1": "ume is a plum tree. Its flowers bloom early in the year."
    "examples":
      "うめのはながさきました。":
        "native": "The plum blossoms have bloomed."
        "bases":
          "さきました":
            "meaning": "bloomed (polite)"
      "うめはこうえんにあります。":
        "native": "The plum tree is in the park."
        "bases":
          "あります":
            "meaning": "there is (polite)"
  "ja-2458":
    "native": "rose"
    "notes":
      "n1": "bara is a rose, the flower or the bush."
    "examples":
      "ばらのいいにおいがします。":
        "native": "The rose smells good."
        "bases":
          "におい":
            "meaning": "smell"
          "します":
            "meaning": "do (polite)"
      "ばらはとげがあります。":
        "native": "Roses have thorns."
        "bases":
          "とげ":
            "meaning": "thorn"
          "あります":
            "meaning": "there is (polite)"
  "ja-2459":
    "native": "tulip"
    "notes":
      "n1": "chuurippu is a tulip, a loanword from English."
    "examples":
      "チューリップがさいています。":
        "native": "The tulips are in bloom."
        "bases":
          "さいています":
            "meaning": "are in bloom (polite)"
      "はるにチューリップをみます。":
        "native": "I see tulips in spring."
        "bases":
          "みます":
            "meaning": "look at (polite)"
  "ja-2460":
    "native": "moss"
    "notes":
      "n1": "koke is moss, the small green plant that grows on rocks and in damp places."
    "examples":
      "いわにこけがはえています。":
        "native": "Moss is growing on the rock."
        "bases":
          "はえています":
            "meaning": "grows (polite)"
      "こけはしめったところにあります。":
        "native": "Moss grows in damp places."
        "bases":
          "しめった":
            "meaning": "damp"
          "ところ":
            "meaning": "place"
          "あります":
            "meaning": "there is (polite)"
  "ja-2461":
    "native": "dragonfly"
    "notes":
      "n1": "tonbo is a dragonfly."
    "examples":
      "とんぼがそらをとんでいます。":
        "native": "A dragonfly is flying in the sky."
        "bases":
          "とんでいます":
            "meaning": "flying (polite)"
      "なつにとんぼをつかまえました。":
        "native": "In summer I caught a dragonfly."
        "bases":
          "つかまえました":
            "meaning": "caught (polite)"
  "ja-2462":
    "native": "cicada"
    "notes":
      "n1": "semi is a cicada, the loud insect of summer."
    "examples":
      "せみがうるさくなきます。":
        "native": "The cicadas sing loudly."
        "bases":
          "うるさく":
            "meaning": "noisily, loudly"
          "なきます":
            "meaning": "sing, cry (of an animal; polite)"
      "せみはなつにおおくなります。":
        "native": "Cicadas become many in summer."
        "bases":
          "おおく":
            "meaning": "many (adverb form)"
          "なります":
            "meaning": "become (polite)"
  "ja-2463":
    "native": "firefly"
    "notes":
      "n1": "hotaru is a firefly, the insect whose light glows in summer."
    "examples":
      "ほたるのひかりがきれいです。":
        "native": "The light of the fireflies is beautiful."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "ほたるをみにいきます。":
        "native": "I go to see the fireflies."
        "bases":
          "みに":
            "meaning": "to see (purpose)"
          "いきます":
            "meaning": "go (polite)"
  "ja-2464":
    "native": "rhinoceros beetle"
    "notes":
      "n1": "kabutomushi is a rhinoceros beetle, from kabuto (helmet) and mushi (insect)."
    "examples":
      "かぶとむしをかいました。":
        "native": "I bought a rhinoceros beetle."
        "bases":
          "かいました":
            "meaning": "bought (polite)"
      "かぶとむしはつのがあります。":
        "native": "A rhinoceros beetle has a horn."
        "bases":
          "つの":
            "meaning": "horn"
          "あります":
            "meaning": "there is (polite)"
  "ja-2465":
    "native": "fly"
    "notes":
      "n1": "hae is a fly, the insect that buzzes around food."
    "examples":
      "はえがたくさんとんでいます。":
        "native": "Many flies are flying around."
        "bases":
          "とんでいます":
            "meaning": "flying (polite)"
      "はえをおいはらってください。":
        "native": "Please chase the flies away."
        "bases":
          "おいはらって":
            "meaning": "chase away (te-form)"
          "ください":
            "meaning": "(please give)"
  "ja-2466":
    "native": "spider"
    "notes":
      "n1": "kumo is a spider. Another word with the same sound means cloud."
    "examples":
      "くもがいとをはっています。":
        "native": "A spider is spinning a thread."
        "bases":
          "はっています":
            "meaning": "spins, stretches (polite)"
      "わたしはくもがにがてです。":
        "native": "I am not good with spiders."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2467":
    "native": "star"
    "notes":
      "n1": "hoshi is a star, a point of light in the night sky."
    "examples":
      "よぞらにほしがみえます。":
        "native": "Stars can be seen in the night sky."
        "bases":
          "よぞら":
            "meaning": "night sky"
          "みえます":
            "meaning": "can be seen (polite)"
      "ほしがきれいにひかっています。":
        "native": "The stars are shining beautifully."
        "bases":
          "きれいに":
            "meaning": "beautifully"
          "ひかっています":
            "meaning": "shine (polite)"
  "ja-2468":
    "native": "earth; the globe"
    "notes":
      "n1": "chikyuu is the Earth, the planet we live on, or a globe."
    "examples":
      "ちきゅうはまるいです。":
        "native": "The Earth is round."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "ちきゅうをまもりましょう。":
        "native": "Let's protect the Earth."
        "bases":
          "まもりましょう":
            "meaning": "let's protect (polite)"
  "ja-2469":
    "native": "universe; space"
    "notes":
      "n1": "uchuu is the universe, or outer space."
    "examples":
      "うちゅうはとてもひろいです。":
        "native": "The universe is very big."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "わたしはうちゅうにきょうみがあります。":
        "native": "I am interested in space."
        "bases":
          "きょうみ":
            "meaning": "interest"
          "あります":
            "meaning": "there is (polite)"
  "ja-2470":
    "native": "to bloom"
    "notes":
      "n1": "saku is to bloom, of flowers opening."
    "examples":
      "さくらがさきます。":
        "native": "The cherry blossoms bloom."
        "bases":
          "さきます":
            "meaning": "bloom (polite)"
      "はるにはなはよくさきます。":
        "native": "Flowers often bloom in spring."
        "bases":
          "さきます":
            "meaning": "bloom (polite)"
  "ja-2471":
    "native": "to fall (of petals)"
    "notes":
      "n1": "chiru is to fall, of petals or leaves dropping from a tree."
    "examples":
      "はながちります。":
        "native": "The petals fall."
        "bases":
          "ちります":
            "meaning": "fall (of petals; polite)"
      "はっぱがちりました。":
        "native": "The leaves have fallen."
        "bases":
          "ちりました":
            "meaning": "fell (polite)"
  "ja-2472":
    "native": "to grow thickly"
    "notes":
      "n1": "shigeru is to grow thickly, of trees and plants."
    "examples":
      "もりのくさがしげっています。":
        "native": "The grass in the forest has grown thick."
        "bases":
          "しげっています":
            "meaning": "has grown thick (polite)"
      "はやしがしげります。":
        "native": "The grove grows thickly."
        "bases":
          "はやし":
            "meaning": "grove"
          "しげります":
            "meaning": "grows thickly (polite)"
  "ja-2473":
    "native": "to wither"
    "notes":
      "n1": "kareru is to wither, of plants that dry up and die."
    "examples":
      "はながかれました。":
        "native": "The flower has withered."
        "bases":
          "かれました":
            "meaning": "withered (polite)"
      "そのくさはかれています。":
        "native": "That grass has withered."
        "bases":
          "かれています":
            "meaning": "has withered (polite)"
