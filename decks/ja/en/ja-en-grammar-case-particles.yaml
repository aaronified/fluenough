schema: 1
id: "ja-en-grammar-case-particles"
kind: "layer"
core: "ja-grammar-case-particles"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Particles after a noun: は (wa), が (ga), を (o), に (ni), で (de)"
description: "The particles that come after a noun: は (wa) for the topic, が (ga) for the subject, を (o) for the thing done, に (ni) for a place, time or person, and で (de) for a place where something happens or a means. Every noun a course deck teaches has a row. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "particle"
  slots:
    "wa": "topic: {meaning} (wa)"
    "ga": "subject: {meaning} (ga)"
    "o": "thing done: {meaning} (o)"
    "ni": "to, at or in: {meaning} (ni)"
    "de": "at, by or with: {meaning} (de)"
rules:
  "ja-rule-particle-wa":
    name: "は (wa): topic"
    explanation: "{1} marks what the sentence is about, the topic, not always the one who acts: {2} means I am a student."
  "ja-rule-particle-ga":
    name: "が (ga): subject"
    explanation: "{1} marks the one who does or is something: {2} means my friend is coming."
  "ja-rule-particle-o":
    name: "を (o): thing done"
    explanation: "{1} marks the thing that a verb acts on: {2} means I drink water."
  "ja-rule-particle-ni":
    name: "に (ni): to, at, in"
    explanation: "{1} marks a place a thing goes to, or a time, or a person who receives: {2} means I go to school."
  "ja-rule-particle-de":
    name: "で (de): at, by, with"
    explanation: "{1} marks the place where an action happens, or the means: {2} means I ride the train."
