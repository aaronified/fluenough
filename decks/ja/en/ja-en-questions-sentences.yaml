schema: 1
id: "ja-en-questions-sentences"
kind: "layer"
core: "ja-questions-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Questions in sentences"
license: "CC-BY-SA-4.0"
description: "Six questions built with the question words, to put in order, each ending in か (ka). Not yet checked by a Japanese speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
"cards":
  "ja-0123":
    "native": "Who is the student?"
    "bases":
      "が":
        "meaning": "(marks the subject)"
      "です":
        "meaning": "is (polite)"
      "か":
        "meaning": "(marks a question)"
    "confusables":
      "w1":
        "why": "なに (nani) asks what, not who."
      "w2":
        "why": "どこ (doko) asks where, not who."
  "ja-0124":
    "native": "Who is the English teacher, please?"
    "bases":
      "えいご":
        "meaning": "English"
      "の":
        "meaning": "(links two nouns: of, 's)"
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "is (polite)"
      "か":
        "meaning": "(marks a question)"
    "confusables":
      "w1":
        "why": "だれ (dare) is the plain who; どなた (donata) is the polite who."
      "w2":
        "why": "どれ (dore) asks which one, not who."
  "ja-0125":
    "native": "When did you come to Japan?"
    "bases":
      "に":
        "meaning": "in; at; to"
      "きました":
        "meaning": "to come"
      "か":
        "meaning": "(marks a question)"
    "confusables":
      "w1":
        "why": "どこ (doko) asks where, not when."
      "w2":
        "why": "なぜ (naze) asks why, not when."
  "ja-0126":
    "native": "How much is the rice?"
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "is (polite)"
      "か":
        "meaning": "(marks a question)"
    "confusables":
      "w1":
        "why": "いくつ (ikutsu) asks how many, not how much money."
      "w2":
        "why": "どう (dou) asks how it is, not the price."
  "ja-0127":
    "native": "What kind of train do you like?"
    "bases":
      "が":
        "meaning": "(marks the subject)"
      "すき":
        "meaning": "to like; liked"
      "です":
        "meaning": "is (polite)"
      "か":
        "meaning": "(marks a question)"
    "confusables":
      "w1":
        "why": "どの (dono) asks which one, not what kind."
      "w2":
        "why": "どれ (dore) cannot stand before a noun."
  "ja-0128":
    "native": "Which of the two is small?"
    "bases":
      "が":
        "meaning": "(marks the subject)"
      "です":
        "meaning": "is (polite)"
      "か":
        "meaning": "(marks a question)"
    "confusables":
      "w1":
        "why": "どれ (dore) is for three or more things."
      "w2":
        "why": "どの (dono) needs a noun after it."
