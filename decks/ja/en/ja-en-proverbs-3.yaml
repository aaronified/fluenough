schema: 1
id: "ja-en-proverbs-3"
kind: "layer"
core: "ja-proverbs-3"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Proverbs: kotowaza 3"
description: "Twenty Japanese proverbs of the Kamigata (Kyoto and Osaka) iroha karuta set, each with its word-for-word meaning and what it is said of. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ja-4800":
    native: "Darkness lies an inch ahead: no one can see what comes next."
    notes:
      "literal": "Said that the future is never certain, so anything can happen at any moment."
    bases:
      "いっすんさき": { meaning: "one inch ahead" }
      "は": { meaning: "(marks the topic)" }
      "やみ": { meaning: "darkness" }
  "ja-4801":
    native: "Someone who reads the Analects but does not understand them."
    notes:
      "literal": "Said of a learned person who knows the words but not what they mean in practice."
    bases:
      "ろんごよみ": { meaning: "reading of the Analects" }
      "の": { meaning: "(of)" }
      "ろんごしらず": { meaning: "one who does not know the Analects" }
  "ja-4802":
    native: "Even the Buddha's face shows anger after three times."
    notes:
      "literal": "Said that even the most patient person loses their temper if pushed too far."
    bases:
      "ほとけ": { meaning: "buddha" }
      "の": { meaning: "(of)" }
      "かお": { meaning: "face" }
      "も": { meaning: "(even)" }
      "さんど": { meaning: "three times" }
  "ja-4803":
    native: "An unskilled speaker's long talk."
    notes:
      "literal": "Said of a poor speaker who goes on and on at length."
    bases:
      "へた": { meaning: "unskilled, clumsy" }
      "の": { meaning: "(of)" }
      "ながだんぎ": { meaning: "a long, rambling talk" }
  "ja-4804":
    native: "Trying to fix tofu with a staple: nothing takes hold."
    notes:
      "literal": "Said of an effort that has no effect at all."
    bases:
      "とうふ": { meaning: "tofu" }
      "に": { meaning: "(on, to)" }
      "かすがい": { meaning: "a staple, a metal clamp" }
  "ja-4805":
    native: "Even the judgement of hell depends on money."
    notes:
      "literal": "Said that money can decide even the most serious matters."
    bases:
      "じごく": { meaning: "hell" }
      "の": { meaning: "(of)" }
      "さた": { meaning: "judgement, decision" }
      "も": { meaning: "(even)" }
      "かね": { meaning: "money" }
      "しだい": { meaning: "depending on" }
  "ja-4806":
    native: "A ruler's word is like sweat: it cannot be taken back."
    notes:
      "literal": "Said that a word from a person in authority, once given, cannot be withdrawn."
    bases:
      "りんげん": { meaning: "a ruler's word" }
      "あせ": { meaning: "sweat" }
      "の": { meaning: "(of)" }
      "ごとし": { meaning: "like, as" }
  "ja-4807":
    native: "A nail driven into bran: it does not go in."
    notes:
      "literal": "Said of an attempt that makes no impression at all."
    bases:
      "ぬか": { meaning: "rice bran" }
      "に": { meaning: "(on, into)" }
      "くぎ": { meaning: "nail" }
  "ja-4808":
    native: "Those of a kind gather together."
    notes:
      "literal": "Said that people who share a nature or interest end up in the same company."
    bases:
      "るい": { meaning: "kind, sort" }
      "を": { meaning: "(marks the means)" }
      "もって": { meaning: "by means of" }
      "あつまる": { meaning: "to gather" }
  "ja-4809":
    native: "Even an ogre is charming at eighteen."
    notes:
      "literal": "Said that a young woman of eighteen looks attractive, even to a demon."
    bases:
      "おに": { meaning: "ogre, demon" }
      "も": { meaning: "(even)" }
      "じゅうはち": { meaning: "eighteen" }
  "ja-4810":
    native: "Fortune comes to the house where people laugh."
    notes:
      "literal": "Said that a cheerful household attracts good luck."
    bases:
      "わらう": { meaning: "to laugh" }
      "かど": { meaning: "gate, doorway" }
      "に": { meaning: "(at, in)" }
      "は": { meaning: "(marks the topic)" }
      "ふく": { meaning: "good fortune" }
      "きたる": { meaning: "to come" }
  "ja-4811":
    native: "Water poured on a frog's face."
    notes:
      "literal": "Said of someone who takes criticism or scolding without any reaction."
    bases:
      "かえる": { meaning: "frog" }
      "の": { meaning: "(of)" }
      "つら": { meaning: "face" }
      "に": { meaning: "(on)" }
      "みず": { meaning: "water" }
  "ja-4812":
    native: "A woman looks prettier in dim light, from afar, or under a hat."
    notes:
      "literal": "Said of a woman's looks, which seem better in dim light, from a distance, or half hidden."
    bases:
      "よめ": { meaning: "seeing in the dark" }
      "とおめ": { meaning: "seeing from far off" }
      "かさ": { meaning: "hat" }
      "の": { meaning: "(under)" }
      "うち": { meaning: "inside" }
  "ja-4813":
    native: "Water poured on an upright board: it runs smoothly."
    notes:
      "literal": "Said of someone who speaks smoothly and fluently, without a pause."
    bases:
      "たて": { meaning: "upright, standing" }
      "いた": { meaning: "board" }
      "に": { meaning: "(on)" }
      "みず": { meaning: "water" }
  "ja-4814":
    native: "Even a chance brush of sleeves is a bond from another life."
    notes:
      "literal": "Said that even a chance meeting comes from bonds made in another life."
    bases:
      "そで": { meaning: "sleeve" }
      "の": { meaning: "(of)" }
      "ふりあわせ": { meaning: "brushing sleeves in passing" }
      "も": { meaning: "(even)" }
      "たしょう": { meaning: "another life, a past or future life" }
      "えん": { meaning: "bond, fate" }
  "ja-4815":
    native: "Having the cooking pot taken on a moonlit night."
    notes:
      "literal": "Said of being fooled or robbed when one is not paying attention."
    bases:
      "つきよ": { meaning: "moonlit night" }
      "に": { meaning: "(on)" }
      "かま": { meaning: "cooking pot" }
      "を": { meaning: "(marks the thing acted on)" }
      "ぬかれる": { meaning: "to be taken out, to be stolen" }
  "ja-4816":
    native: "A gold coin for a cat."
    notes:
      "literal": "Said of valuable things given to someone who cannot appreciate them."
    bases:
      "ねこ": { meaning: "cat" }
      "に": { meaning: "(to, for)" }
      "こばん": { meaning: "a small gold coin" }
  "ja-4817":
    native: "Talk of next year and the demon laughs."
    notes:
      "literal": "Said not to make plans for the far future, since they may never come true."
    bases:
      "らいねん": { meaning: "next year" }
      "の": { meaning: "(of)" }
      "こと": { meaning: "matter, thing" }
      "を": { meaning: "(marks the thing said)" }
      "いえば": { meaning: "if one says" }
      "おに": { meaning: "ogre, demon" }
      "が": { meaning: "(marks the doer)" }
      "わらう": { meaning: "to laugh" }
  "ja-4818":
    native: "The wind in a horse's ear."
    notes:
      "literal": "Said of criticism or advice that goes in one ear and out the other."
    bases:
      "うま": { meaning: "horse" }
      "の": { meaning: "(of)" }
      "みみ": { meaning: "ear" }
      "に": { meaning: "(in)" }
      "かぜ": { meaning: "wind" }
  "ja-4819":
    native: "Upbringing counts for more than lineage."
    notes:
      "literal": "Said that how a person is raised matters more than the family they were born into."
    bases:
      "うじ": { meaning: "lineage, family" }
      "より": { meaning: "than" }
      "そだち": { meaning: "upbringing" }
