- "id": "ja-adjectives-2-1"
  "title": "A letter from a friend"
  "sentences":
  - "text": "ともだちからてがみがきました。"
    "reading": "tomodachi kara tegami ga kimashita."
  - "text": "わたしはうれしかったです。"
    "reading": "watashi wa ureshikatta desu."
  - "text": "でも、ともだちはさびしいとかいていました。"
    "reading": "demo, tomodachi wa sabishii to kaite imashita."
  - "text": "つぎはいっしょにりょこうしたいです。"
    "reading": "tsugi wa issho ni ryokou shitai desu."
