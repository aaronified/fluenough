- "id": "ja-adjectives-2-2"
  "title": "A strict teacher"
  "sentences":
  - "text": "わたしのせんせいはきびしいです。"
    "reading": "watashi no sensei wa kibishii desu."
  - "text": "でも、わたしのためにいつもていねいにおしえてくれます。"
    "reading": "demo, watashi no tame ni itsumo teinei ni oshiete kuremasu."
  - "text": "しけんがちかくなると、わたしははずかしいほどしんぱいになります。"
    "reading": "shiken ga chikaku naru to, watashi wa hazukashii hodo shinpai ni narimasu."
  - "text": "それでもせんせいはとてもたいせつなひとです。"
    "reading": "sore de mo sensei wa totemo taisetsu na hito desu."
