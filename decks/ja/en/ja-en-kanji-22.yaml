native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 22: grade 4, part 5"
description: "Twenty-nine kanji of the fourth school grade, each taught by the kana reading of the word it stands for. Most have no example yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-6200":
    native: "to laugh"
    notes:
      "n1": "笑 (warau): on reading ショウ (shou); kun readings わら-う (warau) and え-む (emu). Its kana わらう (warau), to laugh, is the word it stands for in its kun reading, written 笑う (warau). It is the same word as the taught card わらう (warau), to laugh. Its example uses 子ども (kodomo), children, which is the taught card こども (kodomo), and the polite form 笑います (waraimasu) of 笑う (warau). No other taught word is written with it, so it has one example."
    examples:
      "子どもは笑います。": "Children laugh."
  "ja-6201":
    native: "kun reading, the Japanese reading of a kanji"
    notes:
      "n1": "訓 (kun'yomi): on reading クン (kun); no kun reading in the table. Its kana くんよみ (kun'yomi), kun reading, is a common word it begins, written 訓読み (kun'yomi), which uses the taught kanji 読 (yo). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6202":
    native: "to take along; to lead"
    notes:
      "n1": "連 (tsureru): on reading レン (ren); kun readings つら-なる (tsura-naru), つら-ねる (tsura-neru) and つ-れる (tsu-reru). Its kana つれる (tsureru), to take along; to lead, is the word it stands for in its kun reading, written 連れる (tsureru). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6203":
    native: "county"
    notes:
      "n1": "郡 (gun): on reading グン (gun); no kun reading in the table. Its kana ぐん (gun), county, is the word it stands for alone. It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6204":
    native: "healthy; sound"
    notes:
      "n1": "健 (sukoyaka): on reading ケン (ken); kun reading すこ-やか (suko-yaka). Its kana すこやか (sukoyaka), healthy; sound, is the word it stands for in its kun reading, written 健やか (sukoyaka). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6205":
    native: "side"
    notes:
      "n1": "側 (gawa): on reading ソク (soku); kun reading がわ (gawa). Its kana がわ (gawa), side, is the word it stands for alone, and it is not yet a taught card. Its example uses 向こう側 (mukougawa), the other side, which is the same word as the taught card むこうがわ (mukougawa), the other side, and uses the taught kanji 向 (mu). It has one example, because no other taught word is written with it."
    examples:
      "向こう側はひろいです。": "The far side is wide."
  "ja-6206":
    native: "side job"
    notes:
      "n1": "副 (fukugyou): on reading フク (fuku); no kun reading. Its kana ふくぎょう (fukugyou), side job, is a common word it begins, written 副業 (fukugyou), which uses the taught kanji 業 (gyou). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6207":
    native: "to chant; to advocate"
    notes:
      "n1": "唱 (tonaeru): on reading ショウ (shou); kun reading とな-える (tona-eru). Its kana となえる (tonaeru), to chant; to advocate, is the word it stands for in its kun reading, written 唱える (tonaeru). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6208":
    native: "Saitama, a prefecture"
    notes:
      "n1": "埼 (saitama): no on reading in the table; the table gives さい (sai) in parentheses, a narrow use. Its kana さいたま (saitama), Saitama, a prefecture in Japan, is the place name it begins, written 埼玉 (saitama). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6209":
    native: "headland"
    notes:
      "n1": "崎 (saki): no on reading in the table; kun reading さき (saki). Its kana さき (saki), headland, is the word it stands for in its kun reading. It has the same kana as the taught kanji card 先 (saki), previous; ahead, which is a different word. It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6210":
    native: "nest"
    notes:
      "n1": "巣 (su): on reading ソウ (sou); kun reading す (su). Its kana す (su), nest, is the word it stands for alone. It has the same kana as the taught kana letter card す (su), which is a letter, so the two are different words. It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6211":
    native: "health"
    notes:
      "n1": "康 (kenkou): on reading コウ (kou); no kun reading. Its kana けんこう (kenkou), health, is a common word it ends, written 健康 (kenkou), which uses the kanji 健 (ken), taught in this unit. It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6212":
    native: "to be defeated; to lose"
    notes:
      "n1": "敗 (yaburereru): on reading ハイ (hai); kun reading やぶ-れる (yabu-reru). Its kana やぶれる (yaburereru), to be defeated; to lose, is the word it stands for in its kun reading, written 敗れる (yaburereru). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6213":
    native: "to hope for; to wish for"
    notes:
      "n1": "望 (nozomu): on readings ボウ (bou) and モウ (mou); kun reading のぞ-む (nozo-mu). Its kana のぞむ (nozomu), to hope for; to wish for, is the word it stands for in its kun reading, written 望む (nozomu). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6214":
    native: "Asian pear"
    notes:
      "n1": "梨 (nashi): no on reading; kun reading なし (nashi). Its kana なし (nashi), Asian pear, is the word it stands for alone. It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6215":
    native: "machine"
    notes:
      "n1": "械 (kikai): on reading カイ (kai); no kun reading. Its kana きかい (kikai), machine, is a common word it ends, written 機械 (kikai), which uses the kanji 機 (ki), not yet taught. It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6216":
    native: "clean; pure"
    notes:
      "n1": "清 (kiyoi): on reading セイ (sei), and ショウ (shou) in parentheses in the table, a narrow use; kun readings きよ-い (kiyo-i), きよ-まる (kiyo-maru) and きよ-める (kiyo-meru). Its kana きよい (kiyoi), clean; pure, is the word it stands for in its kun reading, written 清い (kiyoi). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6217":
    native: "to give birth to; to produce"
    notes:
      "n1": "産 (umu): on reading サン (san); kun readings う-む (u-mu), う-まれる (u-mareru) and うぶ (ubu). Its kana うむ (umu), to give birth to; to produce, is the word it stands for in its kun reading, written 産む (umu). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6218":
    native: "a vote"
    notes:
      "n1": "票 (touhyou): on reading ヒョウ (hyou); no kun reading. Its kana とうひょう (touhyou), a vote, is a common word it ends, written 投票 (touhyou), which uses the taught kanji 投 (tou). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6219":
    native: "leafy greens; vegetables"
    notes:
      "n1": "菜 (na): on reading サイ (sai); kun reading な (na). Its kana な (na), leafy greens; vegetables, is the word it stands for in its kun reading. The same kana is the kana of the taught kanji card 名 (na), name, and of the taught kana letter card な (na); those are different words. Its examples use 野菜 (yasai), vegetables, which is the taught card やさい (yasai), with the taught kanji 野 (ya), and 白菜 (hakusai), Chinese cabbage, which is the taught card はくさい (hakusai), with the taught kanji 白 (haku)."
    examples:
      "野菜はおいしいです。": "Vegetables are delicious."
      "白菜は野菜です。": "Chinese cabbage is a vegetable."
  "ja-6220":
    native: "cargo; freight"
    notes:
      "n1": "貨 (kamotsu): on reading カ (ka); no kun reading. Its kana かもつ (kamotsu), cargo; freight, is a common word it begins, written 貨物 (kamotsu), which uses the taught kanji 物 (motsu). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6221":
    native: "continent"
    notes:
      "n1": "陸 (tairiku): on reading リク (riku); no kun reading. Its kana たいりく (tairiku), continent, is a common word it ends, written 大陸 (tairiku), which uses the taught kanji 大 (tai). It is the same word as the taught card たいりく (tairiku), continent. Its example uses 大陸 (tairiku), and no other taught word is written with it, so it has one example."
    examples:
      "大陸はおおきいです。": "A continent is big."
  "ja-6222":
    native: "deer"
    notes:
      "n1": "鹿 (shika): no on reading in the table; kun reading しか (shika), and か (ka) in parentheses in the table, a narrow use. Its kana しか (shika), deer, is the word it stands for in its kun reading. It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6223":
    native: "museum"
    notes:
      "n1": "博 (hakubutsukan): on reading ハク (haku), and バク (baku) in parentheses in the table, a narrow use; no kun reading. Its kana はくぶつかん (hakubutsukan), museum, is a common word it begins, written 博物館 (hakubutsukan), which uses the taught kanji 物 (butsu) and 館 (kan). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6224":
    native: "Ehime, a prefecture"
    notes:
      "n1": "媛 (ehime): on reading エン (en); no kun reading. Its kana えひめ (ehime), Ehime, a prefecture in Japan, is the place name it ends, written 愛媛 (ehime), which uses the kanji 愛 (ai), not yet taught. It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6225":
    native: "wealth"
    notes:
      "n1": "富 (tomi): on reading フ (fu), and フウ (fuu) in parentheses in the table, a narrow use; kun readings と-む (to-mu) and とみ (tomi). Its kana とみ (tomi), wealth, is the word it stands for in its kun reading. It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6226":
    native: "to scatter; to fall"
    notes:
      "n1": "散 (chiru): on reading サン (san); kun readings ち-る (chi-ru), ち-らす (chi-rasu), ち-らかす (chi-rakasu) and ち-らかる (chi-rakaru). Its kana ちる (chiru), to fall (of petals), is the word it stands for in its kun reading, written 散る (chiru). It is the same word as the taught card ちる (chiru), to fall (of petals). Its examples use 散歩 (sanpo), a walk, which is the taught card さんぽ (sanpo), with the taught kanji 歩 (po), and 散ります (chirimasu), the polite form of 散る (chiru), with the taught card 花 (hana), flower, as its subject."
    examples:
      "散歩はたのしいです。": "A walk is fun."
      "花は散ります。": "The flowers fall."
  "ja-6227":
    native: "scenery"
    notes:
      "n1": "景 (keshiki): on reading ケイ (kei); no kun reading. Its kana けしき (keshiki), scenery, is a common word it begins, written 景色 (keshiki), which uses the taught kanji 色 (shiki). It is the same word as the taught card けしき (keshiki), scenery; view. Its example uses 景色 (keshiki), and no other taught word is written with it, so it has one example."
    examples:
      "景色はきれいです。": "The scenery is beautiful."
  "ja-6228":
    native: "most"
    notes:
      "n1": "最 (mottomo): on reading サイ (sai); kun reading もっと-も (motto-mo). Its kana もっとも (mottomo), most, is the word it stands for in its kun reading, written 最も (mottomo). It is not yet a taught card. Its examples use 最近 (saikin), recently, which is the taught card さいきん (saikin), with the taught kanji 近 (kin), and 最後 (saigo), the end, which is the taught card さいご (saigo), with the taught kanji 後 (go)."
    examples:
      "最近はさむいです。": "These days it is cold."
      "最後はいいです。": "The ending is good."
