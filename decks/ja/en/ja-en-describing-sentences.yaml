kind: "layer"
core: "ja-describing-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing things in sentences"
description: "Sentences built from the words of this unit, to put in order, each with the words it could be mistaken for. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "ja-0495":
    native: "The teacher is kind."
    bases:
      "は":
        meaning: "(marks the topic)"
      "です":
        meaning: "is (polite)"
    confusables:
      w1:
        why: "やさしい (yasashii) means gentle or easy, a different sense of kind."
      w2:
        why: "いい (ii) means good, not kind."
  "ja-0496":
    native: "The school is far."
    bases:
      "は":
        meaning: "(marks the topic)"
      "です":
        meaning: "is (polite)"
    confusables:
      w1:
        why: "ちかい (chikai) means near, the opposite."
      w2:
        why: "ながい (nagai) means long, not far."
  "ja-0497":
    native: "The weather is hot."
    bases:
      "は":
        meaning: "(marks the topic)"
      "です":
        meaning: "is (polite)"
    confusables:
      w1:
        why: "さむい (samui) means cold, the opposite."
      w2:
        why: "あたたかい (atatakai) means warm, milder than hot."
  "ja-0498":
    native: "The food is delicious."
    bases:
      "は":
        meaning: "(marks the topic)"
      "です":
        meaning: "is (polite)"
    confusables:
      w1:
        why: "わるい (warui) means bad, the opposite."
      w2:
        why: "からい (karai) means spicy, not delicious."
  "ja-0499":
    native: "My father is busy."
    bases:
      "はい":
        meaning: "yes"
      "が":
        meaning: "(marks the subject)"
      "です":
        meaning: "is (polite)"
    confusables:
      w1:
        why: "しずか (shizuka) means quiet, not busy."
      w2:
        why: "たのしい (tanoshii) means fun, not busy."
  "ja-0500":
    native: "The dog is heavy."
    bases:
      "は":
        meaning: "(marks the topic)"
      "です":
        meaning: "is (polite)"
    confusables:
      w1:
        why: "かるい (karui) means light, the opposite."
      w2:
        why: "おおきい (ookii) means big, not heavy."
