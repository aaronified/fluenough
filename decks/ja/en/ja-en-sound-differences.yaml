  "ja-0093":
    "native": "key"
    "notes":
      "n1": "かぎ (kagi) is a key, for a lock, a house or a car."
      "pair-persimmon": "Only the voiced mark, the two small dots, separates it from かき (kaki), persimmon: かぎ (kagi) has a voiced g, かき (kaki) a plain k."
    "examples":
      "かぎをください。":
        "native": "The key, please."
