  "ja-0094":
    "native": "persimmon"
    "notes":
      "n1": "かき (kaki) is a persimmon, the sweet orange fruit of autumn. Written in kana it is also かき (kaki), oyster; the kanji, 柿 (kaki) and 牡蠣 (kaki), tell them apart."
      "pair-key": "Only the voiced mark, the two small dots, separates it from かぎ (kagi), key: かき (kaki) has a plain k, かぎ (kagi) a voiced g."
    "examples":
      "かきはおいしいです。":
        "native": "Persimmons are tasty."
        "bases":
