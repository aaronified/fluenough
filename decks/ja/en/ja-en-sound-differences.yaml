  "ja-0083":
    "native": "snow"
    "notes":
      "n1": "ゆき (yuki) is snow, whether it falls or lies. It is also a common girl's name."
      "pair-courage": "Only the length of the vowel separates it from ゆうき (yuuki), courage: ゆ (yu) is short, ゆう (yuu) long."
    "examples":
      "ゆきはしろいです。":
        "native": "Snow is white."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "しろい":
            "meaning": "white"
          "です":
            "meaning": "is (polite)"
      "きょうはゆきです。":
        "native": "It is a snowy day today."
        "bases":
          "きょう":
            "meaning": "today"
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
  "ja-0084":
    "native": "courage"
    "alt_native":
      - "nerve"
    "notes":
      "n1": "ゆうき (yuuki) is the nerve to do something hard. It is also a given name and a surname. The long vowel is written with う (u): ゆう (yuu)."
      "pair-snow": "Hold the u for two beats, or it becomes ゆき (yuki), snow: the length is the only difference."
    "examples":
      "ゆうきはたいせつです。":
        "native": "Courage is important."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "たいせつ":
            "meaning": "important"
          "です":
            "meaning": "is (polite)"
      "ゆうきがほしいです。":
        "native": "I want courage."
        "bases":
          "が":
            "meaning": "(marks the subject)"
          "ほしい":
            "meaning": "to want"
          "です":
            "meaning": "is (polite)"
  "ja-0085":
    "native": "come (and ...)"
    "alt_native":
      - "come!"
    "notes":
      "n1": "きて (kite) is the te-form of くる (kuru), to come, and it joins to other words: きてください (kite kudasai), please come. くる (kuru) changes its stem: く (ku) becomes き (ki)."
      "pair-stamp": "Only the doubled consonant separates it from きって (kitte), stamp: きて (kite) has one t, きって (kitte) a held t."
    "bases":
      "きて":
        "meaning": "to come"
    "examples":
      "ここにきてください。":
        "native": "Please come here."
        "bases":
          "ここ":
            "meaning": "here"
          "に":
            "meaning": "in; at; to"
          "ください":
            "meaning": "please (give me)"
      "あしたきてください。":
        "native": "Please come tomorrow."
        "bases":
          "あした":
            "meaning": "tomorrow"
          "ください":
            "meaning": "please (give me)"
  "ja-0086":
    "native": "stamp; postage stamp"
    "notes":
      "n1": "きって (kitte) is a postage stamp. The small っ (tsu) is a pause before the t: the sound is held for one beat."
      "pair-come": "Only the small っ (tsu) separates it from きて (kite), come: hold the t for a beat, or it changes the word."
    "examples":
      "きってをください。":
        "native": "A stamp, please."
        "bases":
          "を":
            "meaning": "(marks the object)"
          "ください":
            "meaning": "please (give me)"
      "にほんのきってはきれいです。":
        "native": "Japanese stamps are pretty."
        "bases":
          "の":
            "meaning": "(links two nouns: of, 's)"
          "は":
            "meaning": "(marks the topic)"
          "きれい":
            "meaning": "pretty; clean"
          "です":
            "meaning": "is (polite)"
  "ja-0087":
    "native": "sound; noise"
    "notes":
      "n1": "おと (oto) is the sound or noise of a thing: a train, a door, rain. The sound of a voice is こえ (koe)."
      "pair-husband": "Only the small っ (tsu) separates it from おっと (otto), husband: おと (oto) has no pause, おっと (otto) holds the t."
    "examples":
      "おとがおおきいです。":
        "native": "The sound is loud."
        "bases":
          "が":
            "meaning": "(marks the subject)"
          "です":
            "meaning": "is (polite)"
      "でんしゃのおとはおおきいです。":
        "native": "The sound of the train is loud."
        "bases":
          "の":
            "meaning": "(links two nouns: of, 's)"
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
  "ja-0088":
    "native": "husband (my own)"
    "notes":
      "n1": "おっと (otto) is your own husband, said to other people. Someone else's husband is ごしゅじん (goshujin)."
      "pair-sound": "Hold the t for a beat, or it becomes おと (oto), sound: the small っ (tsu) is the only difference."
    "examples":
      "わたしのおっとはせんせいです。":
        "native": "My husband is a teacher."
        "bases":
          "の":
            "meaning": "(links two nouns: of, 's)"
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "おっとはにほんじんです。":
        "native": "My husband is Japanese."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
  "ja-0089":
    "native": "slope; hill road"
    "notes":
      "n1": "さか (saka) is a slope: a road or path that goes up or down."
      "pair-writer": "Only the small っ (tsu) separates it from さっか (sakka), writer: さか (saka) has no pause, さっか (sakka) holds the k."
    "examples":
      "あのさかはながいです。":
        "native": "That slope is long."
        "bases":
          "あの":
            "meaning": "that (over there)"
          "は":
            "meaning": "(marks the topic)"
          "ながい":
            "meaning": "long"
          "です":
            "meaning": "is (polite)"
      "さかのうえにいぬがいます。":
        "native": "There is a dog at the top of the slope."
        "bases":
          "の":
            "meaning": "(links two nouns: of, 's)"
          "うえ":
            "meaning": "top; above"
          "に":
