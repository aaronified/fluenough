  "ja-0091":
    "native": "weather"
    "notes":
      "n1": "てんき (tenki) is the weather of the day. Talking about it is a usual way to start a conversation."
      "pair-electricity": "Only the voiced mark, the two small dots, separates it from でんき (denki), electricity: てんき (tenki) has a plain t, でんき (denki) a voiced d."
    "examples":
      "きょうのてんきはいいです。":
        "native": "Today's weather is good."
        "bases":
          "きょう":
            "meaning": "today"
          "の":
            "meaning": "(links two nouns: of, 's)"
          "は":
            "meaning": "(marks the topic)"
          "いい":
            "meaning": "good"
          "です":
            "meaning": "is (polite)"
      "てんきがわるいです。":
        "native": "The weather is bad."
        "bases":
          "が":
            "meaning": "(marks the subject)"
          "わるい":
            "meaning": "bad"
          "です":
            "meaning": "is (polite)"
