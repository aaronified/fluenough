    "native": "electricity; electric light"
    "alt_native":
      - "light"
    "notes":
      "n1": "でんき (denki) is electricity, and also an electric light: でんきをつけてください (denki wo tsukete kudasai), please turn on the light."
      "pair-weather": "Only the voiced mark, the two small dots, separates it from てんき (tenki), weather: でんき (denki) has a voiced d, てんき (tenki) a plain t."
    "examples":
      "でんきはたかいです。":
        "native": "Electricity is expensive."
        "bases":
