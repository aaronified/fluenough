schema: 1
id: "ja-en-sound-differences"
kind: "layer"
core: "ja-sound-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sounds English lacks: word pairs"
license: "CC-BY-SA-4.0"
description: "Sixteen words in eight pairs, each pair told apart by one sound English does not mark: a long or short vowel, a held consonant (the small っ (tsu)), and the voiced mark. Not yet checked by a Japanese speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
"cards":
  "ja-0079":
    "native": "aunt"
    "alt_native":
      - "auntie"
    "notes":
      "n1": "おばさん (obasan) is an aunt, and also a plain, friendly word for a woman of your parents' age. Said to a stranger it can sound too direct, so people say すみません (sumimasen) instead."
      "pair-grandmother": "Only the length of one vowel separates it from おばあさん (obaasan), grandmother: おば (oba) has a short a, おばあ (obaa) a long one, held for two beats."
    "examples":
      "わたしのおばさんはせんせいです。":
        "native": "My aunt is a teacher."
        "bases":
          "の":
            "meaning": "(links two nouns: of, 's)"
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "おばさんはにほんにいます。":
        "native": "My aunt is in Japan."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "に":
            "meaning": "in; at; to"
          "います":
            "meaning": "to be (of people and animals)"
  "ja-0080":
    "native": "grandmother"
    "alt_native":
      - "grandma"
    "notes":
      "n1": "おばあさん (obaasan) is a grandmother, and also a polite word for any elderly woman. The long vowel is written with a second あ (a): おばあ (obaa)."
      "pair-aunt": "Hold the a for two beats, or it becomes おばさん (obasan), aunt: the length is the only difference."
    "examples":
      "おばあさんはげんきです。":
        "native": "My grandmother is well."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "げんき":
            "meaning": "well; healthy"
          "です":
            "meaning": "is (polite)"
      "わたしのおばあさんはにほんにいます。":
        "native": "My grandmother is in Japan."
        "bases":
          "の":
            "meaning": "(links two nouns: of, 's)"
          "は":
            "meaning": "(marks the topic)"
          "に":
            "meaning": "in; at; to"
          "います":
            "meaning": "to be (of people and animals)"
