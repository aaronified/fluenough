cards:
  "ja-0849":
    native: "coffee"
    notes:
      "n1": "A loanword from English \"coffee\". The long vowel is written with the long vowel mark."
    examples:
      "わたしはコーヒーをのみます。":
        native: "I drink coffee."
        bases:
          "は":
            meaning: "(marks the topic)"
          "を":
            meaning: "(marks the thing acted on)"
      "コーヒーはすきですか。":
        native: "Do you like coffee?"
        bases:
          "は":
            meaning: "(marks the topic)"
          "です":
            meaning: "is (polite)"
          "か":
            meaning: "(marks a question)"
