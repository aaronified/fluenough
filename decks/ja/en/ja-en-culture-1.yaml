schema: 1
id: "ja-en-culture-1"
kind: "layer"
core: "ja-culture-1"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Culture: poems, songs and first lines"
description: "Eighteen short items from Japanese literature and song, from the Nara period to the Showa period, in the public domain. Each shows who wrote it, when, and where it comes from. The texts are in modern kana. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ja-4308":
    native: "In spring, the dawn."
    notes:
      "n1": "The first line of a famous list of the best moment of each season. For spring it names the dawn, as the sky begins to turn light."
    bases:
      "はる": { meaning: "spring" }
      "は": { meaning: "(marks the topic)" }
      "あけぼの": { meaning: "dawn, the first light of day" }
  "ja-4309":
    native: "Not losing to the rain, not losing to the wind."
    notes:
      "n1": "Found as a memo in Kenji's notebook after his death. It is written in katakana mixed with kanji; this card shows the first two lines in katakana only. It is usually read as a poem."
    bases:
      "アメ": { meaning: "rain" }
      "ニ": { meaning: "(here: to, against)" }
      "モ": { meaning: "(also, even)" }
      "マケズ": { meaning: "to lose, to give in (not losing)" }
      "カゼ": { meaning: "wind" }
  "ja-4310":
    native: "I am a cat; I have no name yet."
    notes:
      "n1": "The cat who speaks calls himself わがはい (wagahai), an old and proud word for 'I', which makes him sound important. In the novel the cat lives in the house of a middle-school English teacher."
    bases:
      "わがはい": { meaning: "I (an old, proud word)" }
      "は": { meaning: "(marks the topic)" }
      "ねこ": { meaning: "cat" }
      "である": { meaning: "to be (written, formal)" }
      "なまえ": { meaning: "name" }
      "まだ": { meaning: "not yet" }
      "ない": { meaning: "there is not" }
  "ja-4311":
    native: "An old pond: a frog jumps in, the sound of water."
    notes:
      "n1": "The best known haiku, first printed in 1686. かわず (kawazu) is an old word for a frog, now usually かえる (kaeru). The frog is a spring word in haiku."
    bases:
      "ふるいけ": { meaning: "old pond" }
      "や": { meaning: "(cutting word: a pause after the first image)" }
      "かわず": { meaning: "frog (an old word)" }
      "とびこむ": { meaning: "to jump in" }
      "みず": { meaning: "water" }
      "の": { meaning: "(links two nouns: of)" }
      "おと": { meaning: "sound" }
  "ja-4312":
    native: "As I eat a persimmon, a bell rings: Horyu-ji."
    notes:
      "n1": "Shiki is said to have written it in reply to a poem by his friend Natsume Soseki about a bell at the temple Kencho-ji. Shiki liked persimmons so much that he gave Soseki the nickname 'persimmon'."
    bases:
      "かき": { meaning: "persimmon" }
      "くえば": { meaning: "to eat (if I eat)" }
      "かね": { meaning: "bell" }
      "が": { meaning: "(marks the one who does the action)" }
      "なる": { meaning: "to ring, to sound" }
      "なり": { meaning: "(old ending: it is so)" }
      "ほうりゅうじ": { meaning: "Horyu-ji (a temple in Nara)" }
  "ja-4313":
    native: "Rape blossoms: the moon is in the east, the sun in the west."
    notes:
      "n1": "The rape blossom is a word for late spring in haiku, and Buson wrote many poems about it."
    bases:
      "なのはな": { meaning: "rape blossoms (field mustard flowers)" }
      "や": { meaning: "(cutting word: a pause after the first image)" }
      "つき": { meaning: "moon" }
      "は": { meaning: "(marks the topic)" }
      "ひがし": { meaning: "east" }
      "に": { meaning: "(in, at)" }
      "ひ": { meaning: "sun" }
      "にし": { meaning: "west" }
  "ja-4314":
    native: "Thin frog, don't give up: Issa is here!"
    notes:
      "n1": "Issa puts his own name in the poem, as いっさ (issa), and speaks to the frog as a friend."
    bases:
      "やせがえる": { meaning: "thin frog" }
      "まける": { meaning: "to lose, to give in" }
      "な": { meaning: "(after a verb: don't!)" }
      "いっさ": { meaning: "Issa (the poet's own name)" }
      "これ": { meaning: "this, here" }
      "に": { meaning: "(in, at)" }
      "あり": { meaning: "to be (is)" }
  "ja-4315":
    native: "That mountain where I chased rabbits, that river where I fished for small carp."
    notes:
      "n1": "The Ministry of Education did not name the writer and the composer in 1914. Their names became known in the 1960s."
    bases:
      "うさぎ": { meaning: "rabbit" }
      "おいし": { meaning: "to chase (chased)" }
      "かの": { meaning: "that (a literary word)" }
      "やま": { meaning: "mountain" }
      "こぶな": { meaning: "small crucian carp" }
      "つりし": { meaning: "to fish (fished)" }
      "かわ": { meaning: "river" }
  "ja-4316":
    native: "Spring, the flowers; summer, the cuckoo; autumn, the moon; winter, the clear cold snow: each season is fresh."
    notes:
      "n1": "Dogen was a Zen monk. In 1981 a monument was set up in Nagano with this poem carved in the handwriting of the novelist Kawabata Yasunari."
    bases:
      "はる": { meaning: "spring" }
      "は": { meaning: "(marks the topic)" }
      "はな": { meaning: "flower" }
      "なつ": { meaning: "summer" }
      "ほととぎす": { meaning: "cuckoo" }
      "あき": { meaning: "autumn" }
      "つき": { meaning: "moon" }
      "ふゆ": { meaning: "winter" }
      "ゆき": { meaning: "snow" }
      "さえて": { meaning: "to be clear and cold" }
      "すずしかりけり": { meaning: "cool and fresh (an old ending: it is so)" }
  "ja-4317":
    native: "In this village I play temari with the children; on a spring day like this I would not mind if the dark never came."
    notes:
      "n1": "Ryokan was a Zen monk who liked to play with children. Stories say he played temari and hide-and-seek with them."
    bases:
      "この": { meaning: "this" }
      "さと": { meaning: "village" }
      "に": { meaning: "(in, at)" }
      "てまり": { meaning: "temari (a hand ball)" }
      "つき": { meaning: "to bounce (a ball)" }
      "つつ": { meaning: "while doing" }
      "こども": { meaning: "child" }
      "ら": { meaning: "(plural ending: and the others)" }
      "と": { meaning: "(with)" }
      "あそぶ": { meaning: "to play" }
      "はるひ": { meaning: "spring day" }
      "は": { meaning: "(marks the topic)" }
      "くれ": { meaning: "to get dark" }
      "ず": { meaning: "(old ending: not)" }
      "とも": { meaning: "even if (old)" }
      "よし": { meaning: "good, fine (old)" }
  "ja-4318":
    native: "Cherry blossoms, cherry blossoms: the sky of the third month, as far as I can see, is it mist or clouds; the fragrance spreads; come now, let us go and see!"
    notes:
      "n1": "A traditional song, first printed in a collection of koto music in 1888. The writer is not known. A later set of words, from 1941, begins with a different line."
    bases:
      "さくら": { meaning: "cherry blossoms" }
      "やよい": { meaning: "Yayoi (the old name of the third month)" }
      "の": { meaning: "(links two nouns: of)" }
      "そら": { meaning: "sky" }
      "は": { meaning: "(marks the topic)" }
      "みわたす": { meaning: "to look out over" }
      "かぎり": { meaning: "as far as, the limit" }
      "かすみ": { meaning: "mist" }
      "か": { meaning: "(or)" }
      "くも": { meaning: "cloud" }
      "におい": { meaning: "fragrance" }
      "ぞ": { meaning: "(adds emphasis)" }
      "いずる": { meaning: "to come out, to spread (old)" }
      "いざや": { meaning: "come now! (old)" }
      "み": { meaning: "to see" }
      "に": { meaning: "(to: for the purpose of)" }
      "ゆかん": { meaning: "to go (let us go)" }
  "ja-4319":
    native: "When I look far up at the wide plain of the sky, it is the same moon that rose over Mount Mikasa at Kasuga."
    notes:
      "n1": "Tradition says Abe no Nakamaro spoke it in China, in 753, before he tried to sail home. Some scholars doubt this."
    bases:
      "あまのはら": { meaning: "the wide plain of the sky" }
      "ふりさけみれば": { meaning: "to look far up (when I look)" }
      "かすが": { meaning: "Kasuga (a place in Nara)" }
      "なる": { meaning: "(old: that is at)" }
      "みかさ": { meaning: "Mikasa (a mountain in Nara)" }
      "の": { meaning: "(links two nouns: of)" }
      "やま": { meaning: "mountain" }
      "に": { meaning: "(in, at)" }
      "いでし": { meaning: "to come out, to rise (rose)" }
      "つき": { meaning: "moon" }
      "かも": { meaning: "(old: I wonder; how!)" }
  "ja-4320":
    native: "Not even in the age of the gods have I heard of it: the Tatsuta River tie-dyes its water deep crimson."
    notes:
      "n1": "One of the poems chosen for the Ogura Hyakunin Isshu, a collection of one hundred poems by one hundred poets. It is number 17."
    bases:
      "ちはやぶる": { meaning: "(a set word that goes before 'gods')" }
      "かみよ": { meaning: "the age of the gods" }
      "も": { meaning: "(also, even)" }
      "きかず": { meaning: "to hear (never heard)" }
      "たつたがわ": { meaning: "Tatsuta River" }
      "からくれない": { meaning: "deep crimson" }
      "に": { meaning: "(into, as)" }
      "みず": { meaning: "water" }
      "くくる": { meaning: "to tie-dye" }
      "とは": { meaning: "(that it is so! marks surprise)" }
  "ja-4321":
    native: "In the high tower of spring, a feast under the blossoms: the cups go round, and shadows fall."
    notes:
      "n1": "Words for a song by Taki Rentaro, the first song written in Japan in the Western style to be widely known. The words are by Doi Bansui."
    bases:
      "はる": { meaning: "spring" }
      "こうろう": { meaning: "a high tower" }
      "の": { meaning: "(links two nouns: of)" }
      "はな": { meaning: "flower" }
      "えん": { meaning: "feast" }
      "めぐる": { meaning: "to go round" }
      "さかずき": { meaning: "sake cup" }
      "かげ": { meaning: "shadow, reflection" }
      "さして": { meaning: "to fall on, to be cast" }
  "ja-4322":
    native: "The days and months are travellers of a hundred generations; the years that come and go are also travellers."
    notes:
      "n1": "Oku no Hosomichi is Basho's travel diary, first printed in 1702, eight years after his death. Its many haiku are set in the prose."
    bases:
      "つきひ": { meaning: "days and months, time" }
      "は": { meaning: "(marks the topic)" }
      "はくたい": { meaning: "a hundred generations" }
      "の": { meaning: "(links two nouns: of)" }
      "かかく": { meaning: "traveller, one passing through" }
      "にして": { meaning: "is, and (old)" }
      "ゆきかう": { meaning: "to come and go" }
      "とし": { meaning: "year" }
      "も": { meaning: "(also, even)" }
      "また": { meaning: "also" }
      "たびびと": { meaning: "traveller" }
      "なり": { meaning: "(old ending: is)" }
  "ja-4323":
    native: "The flow of the river never stops, and yet the water is never the same water as before."
    notes:
      "n1": "The opening of Hojoki, a short work written in 1212 about how nothing lasts."
    bases:
      "ゆく": { meaning: "to go, to flow" }
      "かわ": { meaning: "river" }
      "の": { meaning: "(links two nouns: of)" }
      "ながれ": { meaning: "flow" }
      "は": { meaning: "(marks the topic)" }
      "たえず": { meaning: "to stop (never stopping)" }
      "して": { meaning: "(and: joins two parts, old)" }
      "しかも": { meaning: "and yet" }
      "もと": { meaning: "the original, before" }
      "みず": { meaning: "water" }
      "に": { meaning: "(part of 'is not')" }
      "あらず": { meaning: "to be (is not)" }
  "ja-4324":
    native: "Without touching this soft skin and hot blood: are you not lonely, you who preach the way?"
    notes:
      "n1": "From Midaregami, her first book of poems (1901). Her nickname, 'Akiko of the soft skin', comes from this poem, whose first word is やわはだ (yawahada)."
    bases:
      "やわはだ": { meaning: "soft skin" }
      "の": { meaning: "(links two nouns: of)" }
      "あつき": { meaning: "hot (old form)" }
      "ちしお": { meaning: "blood" }
      "に": { meaning: "(to)" }
      "ふれ": { meaning: "to touch" }
      "も": { meaning: "(not even, after a verb)" }
      "みで": { meaning: "to see (without seeing)" }
      "さびしからず": { meaning: "lonely (not lonely?)" }
      "や": { meaning: "(old: marks a question)" }
      "みち": { meaning: "the way" }
      "を": { meaning: "(marks the thing acted on)" }
      "とく": { meaning: "to preach" }
      "きみ": { meaning: "you" }
  "ja-4325":
    native: "It was toward dusk one day; a servant was waiting under the Rashomon gate for the rain to stop."
    notes:
      "n1": "The opening of a short story from 1915, set in Kyoto in the twelfth century. The story is based on a tale from an old collection."
    bases:
      "あるひ": { meaning: "one day" }
      "の": { meaning: "(links two nouns: of)" }
      "くれがた": { meaning: "dusk" }
      "こと": { meaning: "matter, thing" }
      "である": { meaning: "to be (written, formal)" }
      "ひとり": { meaning: "one person" }
      "げにん": { meaning: "a servant of low rank" }
      "が": { meaning: "(marks the one who does the action)" }
      "らしょうもん": { meaning: "Rashomon (a city gate in Kyoto)" }
      "した": { meaning: "under, below" }
      "で": { meaning: "(at, in)" }
      "あまやみ": { meaning: "waiting for the rain to stop" }
      "を": { meaning: "(marks the thing acted on)" }
      "まって": { meaning: "to wait" }
      "いた": { meaning: "to be (was doing)" }
