"cards":
  "ja-3206":
    "native": "I have an interview."
    "notes":
      "n1": "うける (ukeru) means to receive, and also to sit an interview or exam, as in めんせつをうける (mensetsu o ukeru)."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "うけます":
        "meaning": "to take; to undergo (polite)"
    "confusables":
      "w1":
        "why": "getting a job, not interview"
      "w2":
        "why": "hiring, not interview"
  "ja-3207":
    "native": "I earn money with a part-time job."
    "notes":
      "n1": "アルバイト (arubaito) comes from German Arbeit, meaning work, and means a part-time job in Japanese."
    "bases":
      "で":
        "meaning": "(at a place; by means of)"
      "おかね":
        "meaning": "money"
      "を":
        "meaning": "(marks the thing acted on)"
      "かせぎます":
        "meaning": "to earn (polite)"
    "confusables":
      "w1":
        "why": "part-time work, a word of its own"
      "w2":
        "why": "full-time employee, not part-time job"
  "ja-3208":
    "native": "The childcare worker looks after the children."
    "notes":
      "n1": "みる (miru) means to look after, as in こどもをみる (kodomo o miru), to care for children."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "こども":
        "meaning": "child"
      "を":
        "meaning": "(marks the thing acted on)"
      "みます":
        "meaning": "to look after (polite)"
    "confusables":
      "w1":
        "why": "care worker, not childcare worker"
      "w2":
        "why": "teacher, not childcare worker"
  "ja-3209":
    "native": "I consult the pharmacist."
    "notes":
      "n1": "そうだん (soudan, consultation) takes に (ni) for the person consulted, as in やくざいしにそうだんする (yakuzaishi ni soudan suru)."
    "bases":
      "に":
        "meaning": "(marks the time, the place or the target)"
      "そうだん":
        "meaning": "consultation"
      "します":
        "meaning": "to do (polite)"
    "confusables":
      "w1":
        "why": "doctor, not pharmacist"
      "w2":
        "why": "nurse, not pharmacist"
  "ja-3210":
    "native": "I hope for a promotion."
    "notes":
      "n1": "のぞむ (nozomu) means to hope for or wish for, and is written 望む (nozomu) in kanji."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "のぞみます":
        "meaning": "to hope for (polite)"
    "confusables":
      "w1":
        "why": "changing jobs, not promotion"
      "w2":
        "why": "resignation, not promotion"
  "ja-3211":
    "native": "I make my dream come true."
    "notes":
      "n1": "かなえる (kanaeru) is transitive; its intransitive partner is かなう (kanau, to come true)."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "かなえます":
        "meaning": "to fulfil (polite)"
    "confusables":
      "w1":
        "why": "goal, not dream"
      "w2":
        "why": "future, not dream"
  "ja-3212":
    "native": "Effort is rewarded."
    "notes":
      "n1": "むくわれる (mukuwareru) is the passive form of むくう (mukuu), so the effort is the subject that is repaid."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "むくわれます":
        "meaning": "to be rewarded (polite)"
    "confusables":
      "w1":
        "why": "sense of purpose, not effort"
      "w2":
        "why": "result, not effort"
  "ja-3213":
    "native": "I help the carpenter."
    "bases":
      "の":
        "meaning": "(of; belonging to)"
      "てつだい":
        "meaning": "help"
      "を":
        "meaning": "(marks the thing acted on)"
      "します":
        "meaning": "to do (polite)"
    "confusables":
      "w1":
        "why": "architect, not carpenter"
      "w2":
        "why": "mechanic, not carpenter"
