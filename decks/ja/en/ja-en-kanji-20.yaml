name: "Kanji 20: grade 4, part 3"
description: "Twenty-nine kanji of the fourth school grade, each taught by the kana reading of the word it stands for. Most have no example yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-6080":
    native: "to graduate"
    notes:
      "n1": "sotsugyou (sotsugyou): on reading ソツ (sotsu); no kun reading. Its kana そつぎょう (sotsugyou), graduation, is a common word it begins and is not yet a taught card. It is written 卒業 (sotsugyou), which uses the on reading ソツ (sotsu) and the taught kanji 業 (gyou). No taught word uses it, so it has no example yet."
  "ja-6081":
    native: "cooperation; to cooperate"
    notes:
      "n1": "kyouryoku (kyouryoku): on reading キョウ (kyou); no kun reading. Its kana きょうりょく (kyouryoku), cooperation, is a common word it begins and is not yet a taught card. It is written 協力 (kyouryoku), which uses the taught kanji 力 (ryoku). No taught word uses it, so it has no example yet."
  "ja-6082":
    native: "participation; to take part"
    notes:
      "n1": "sanka (sanka): on reading サン (san); kun reading まい-る (mai-ru). Its kana さんか (sanka), participation, is a common word it begins and is not yet a taught card. It is written 参加 (sanka), which uses the taught kanji 加 (ka). No taught word uses it, so it has no example yet."
  "ja-6083":
    native: "surroundings; circumference"
    notes:
      "n1": "shuuhen (shuuhen): on reading シュウ (shuu); kun reading まわ-り (mawa-ri). Its kana しゅうへん (shuuhen), surroundings, is a common word it begins and is the same word as the taught card しゅうへん (shuuhen), surroundings; neighbourhood. It is written 周辺 (shuuhen), which uses the taught kanji 辺 (hen). Its example uses 周辺 (shuuhen) with the taught kanji 辺 (hen)."
    examples:
      "周辺はしずかです。": "The surroundings are quiet."
  "ja-6084":
    native: "hard; firm"
    notes:
      "n1": "katai (katai): on reading コ (ko); kun readings かた-める (kata-meru), かた-まる (kata-maru) and かた-い (kata-i). Its kana かたい (katai), hard; firm, is the word it stands for alone and is the same word as the taught card かたい (katai), hard; firm. No taught word is written with it, so it has no example yet."
  "ja-6085":
    native: "Nara, a city in Japan"
    notes:
      "n1": "nara (nara): on reading ナ (na); no kun reading. Its kana なら (nara), Nara, a city in Japan, is a place name it begins, written 奈良 (nara), which uses the taught kanji 良 (ryou). No taught word uses it, so it has no example yet."
  "ja-6086":
    native: "season"
    notes:
      "n1": "kisetsu (kisetsu): on reading キ (ki); no kun reading. Its kana きせつ (kisetsu), season, is a common word it begins and is the same word as the taught card きせつ (kisetsu), season. It is written 季節 (kisetsu), which uses the kanji 節 (setsu), not yet taught. No taught word is written with it, so it has no example yet."
  "ja-6087":
    native: "official; bureaucrat"
    notes:
      "n1": "kanryou (kanryou): on reading カン (kan); no kun reading. Its kana かんりょう (kanryou), an official, is a common word it begins and is not yet a taught card. It is written 官僚 (kanryou), and its second kanji 僚 (ryou) is not yet taught. No taught word uses it, so it has no example yet."
  "ja-6088":
    native: "hill"
    notes:
      "n1": "oka (oka): kun reading おか (oka), which the table lists in parentheses as a special or very narrow use; no on reading. Its kana おか (oka), hill, is the word it stands for alone and is the same word as the taught card おか (oka), hill. The reading is seen in place names such as 岡山 (okayama), Okayama, a city, which uses the taught kanji 山 (yama). No taught word uses it, so it has no example yet."
  "ja-6089":
    native: "bottom"
    notes:
      "n1": "soko (soko): on reading テイ (tei); kun reading そこ (soko). Its kana そこ (soko), bottom, is the word it stands for alone. The same kana is the taught card そこ (soko), there; that place, which is a different word. It is in 海底 (kaitei), the seabed, which uses the on reading テイ (tei) and the taught kanji 海 (kai). No taught word uses it, so it has no example yet."
  "ja-6090":
    native: "government"
    notes:
      "n1": "seifu (seifu): on reading フ (fu); no kun reading. Its kana せいふ (seifu), government, is a common word it ends, written 政府 (seifu). Its first kanji 政 (sei) is not yet taught. No taught word uses it, so it has no example yet."
  "ja-6091":
    native: "diameter"
    notes:
      "n1": "chokkei (chokkei): on reading ケイ (kei); no kun reading. Its kana ちょっけい (chokkei), diameter, is a common word it ends, written 直径 (chokkei), which uses the taught kanji 直 (choku). No taught word uses it, so it has no example yet."
  "ja-6092":
    native: "too bad; a pity"
    notes:
      "n1": "zannen (zannen): on reading ネン (nen); no kun reading. Its kana ざんねん (zannen), too bad, is a common word it ends, written 残念 (zannen), which uses the kanji 残 (zan), not yet taught. No taught word uses it, so it has no example yet."
  "ja-6093":
    native: "pine tree"
    notes:
      "n1": "matsu (matsu): on reading ショウ (shou); kun reading まつ (matsu). Its kana まつ (matsu), pine tree, is the word it stands for alone. The same kana is the taught card まつ (matsu), to wait, written 待つ (matsu), which is a different word. No taught word uses it, so it has no example yet."
  "ja-6094":
    native: "fruit"
    notes:
      "n1": "kudamono (kudamono): on reading カ (ka); kun readings は-たす (ha-tasu), は-てる (ha-teru) and は-て (ha-te). Its kana くだもの (kudamono), fruit, is a common word it begins and is the same word as the taught card くだもの (kudamono), fruit. It is written 果物 (kudamono), which uses the taught kanji 物 (mono)."
    examples:
      "果物はおいしいです。": "Fruit is delicious."
  "ja-6095":
    native: "to heal; to get better"
    notes:
      "n1": "naoru (naoru): on readings ジ (ji) and チ (chi); kun readings おさ-める (osa-meru), おさ-まる (osa-maru), なお-る (nao-ru) and なお-す (nao-su). Its kana なおる (naoru), to get better, is the word it stands for with its ending, written 治る (naoru), and is the same word as the taught card なおる (naoru). The taught card なおす (naosu), to cure, is the transitive word 治す (naosu), a different word. Its example uses 治ります (naorimasu), the masu form of 治る (naoru)."
    examples:
      "かぜが治ります。": "My cold will get better."
  "ja-6096":
    native: "law"
    notes:
      "n1": "houritsu (houritsu): on reading ホウ (hou); on readings ハッ (hatsu) and ホッ (hotsu), both in parentheses in the table as a special or very narrow use; no kun reading. Its kana ほうりつ (houritsu), law, is a common word it begins, written 法律 (houritsu). Its second kanji 律 (ritsu) is not yet taught. In 文法 (bunpou), grammar, the reading is ぽう (pou), the on reading ホウ (hou) with the p sound, and 文 (bun) is a taught kanji."
    examples:
      "文法はむずかしいです。": "Grammar is difficult."
  "ja-6097":
    native: "to cry"
    notes:
      "n1": "naku (naku): on reading キュウ (kyuu); kun reading な-く (na-ku). Its kana なく (naku), to cry, is the word it stands for alone and is not yet a taught card. The same kana is the taught card なく (naku), to chirp, written 鳴く (naku), which is a different word. No taught word uses it, so it has no example yet."
  "ja-6098":
    native: "ranch; pasture"
    notes:
      "n1": "bokujou (bokujou): on reading ボク (boku); kun reading まき (maki). Its kana ぼくじょう (bokujou), ranch, is a common word it begins, written 牧場 (bokujou), which uses the taught kanji 場 (jou). No taught word uses it, so it has no example yet."
  "ja-6099":
    native: "target; goal"
    notes:
      "n1": "mato (mato): on reading テキ (teki); kun reading まと (mato). Its kana まと (mato), target, is the word it stands for alone and is not yet a taught card. It is written 目的 (mokuteki), purpose, which uses the taught kanji 目 (moku) and the on reading テキ (teki). No taught word uses it, so it has no example yet."
  "ja-6100":
    native: "bud; sprout"
    notes:
      "n1": "me (me): on reading ガ (ga); kun reading め (me). Its kana め (me), bud, is the word it stands for alone. The same kana is the taught hiragana card め (me), a letter, and the taught card め (me), eye, written 目 (me), which is a different word. It is written 新芽 (shinme), a young shoot, which uses the taught kanji 新 (shin). No taught word uses it, so it has no example yet."
  "ja-6101":
    native: "the English language; English"
    notes:
      "n1": "eigo (eigo): on reading エイ (ei); no kun reading. Its kana えいご (eigo), the English language, is a common word it begins, written 英語 (eigo). It is the same word as the taught card えいご (eigo), the English language; English. Its example uses 英語 (eigo) with the taught kanji 語 (go)."
    examples:
      "わたしは英語がすきです。": "I like English."
  "ja-6102":
    native: "Gifu, a prefecture of Japan"
    notes:
      "n1": "gifu (gifu): on reading フ (fu), listed in parentheses in the table as a special or very narrow use, and seen in place names such as 岐阜 (gifu), Gifu, which uses the taught kanji 岐 (gi). Its kana ぎふ (gifu), Gifu, is a place name and not a common word. The same kana is the taught card 岐 (gifu), which is the same word. No taught word uses it, so it has no example yet."
  "ja-6103":
    native: "convenient; useful"
    notes:
      "n1": "benri (benri): on readings ベン (ben) and ビン (bin); kun reading たよ-り (tayo-ri). Its kana べんり (benri), convenient, is a common word it begins, written 便利 (benri). It is the same word as the taught card べんり (benri), convenient; useful. It uses the taught kanji 利 (ri). Its example uses 便利 (benri)."
    examples:
      "せんたくきは便利です。": "The washing machine is convenient."
  "ja-6104":
    native: "to believe; to trust"
    notes:
      "n1": "shinjiru (shinjiru): on reading シン (shin); no kun reading. Its kana しんじる (shinjiru), to believe, is the word it stands for alone, written 信じる (shinjiru), and is not yet a taught card. It is in 信号 (shingou), a traffic light, which is the taught card しんごう (shingou) and uses the taught kanji 号 (gou). Its example uses 信号 (shingou) with the on reading シン (shin)."
    examples:
      "信号はあかです。": "The traffic light is red."
  "ja-6105":
    native: "courage"
    notes:
      "n1": "yuuki (yuuki): on reading ユウ (yuu); kun reading いさ-む (isa-mu). Its kana ゆうき (yuuki), courage, is a common word it begins, written 勇気 (yuuki). It is the same word as the taught card ゆうき (yuuki), courage. Its example uses 勇気 (yuuki) with the taught kanji 気 (ki)."
    examples:
      "わたしは勇気がほしいです。": "I want courage."
  "ja-6106":
    native: "word; vocabulary"
    notes:
      "n1": "tango (tango): on reading タン (tan); no kun reading. Its kana たんご (tango), a word, is a common word it begins, written 単語 (tango), which uses the taught kanji 語 (go). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6107":
    native: "castle"
    notes:
      "n1": "shiro (shiro): on reading ジョウ (jou); kun reading しろ (shiro). Its kana しろ (shiro), castle, is the word it stands for alone. The same kana is the taught card しろ (shiro), white, written 白 (shiro), which is a different word. No taught word uses it, so it has no example yet."
  "ja-6108":
    native: "to change"
    notes:
      "n1": "kawaru (kawaru): on reading ヘン (hen); kun readings か-わる (ka-waru) and か-える (ka-eru). Its kana かわる (kawaru), to change, is the word it stands for alone and is the same word as the taught card かわる (kawaru). The same kana is also the taught card 代 (kawaru), to replace; take over, which is a different word. It is also in 大変 (taihen), which uses the taught kanji 大 (dai) and is the taught card たいへん (taihen), hard; tough; terrible. Its examples use 大変 (taihen) and 変わります (kawarimasu), the masu form of 変わる (kawaru)."
    examples:
      "しごとは大変です。": "The work is hard."
      "てんきが変わります。": "The weather changes."
