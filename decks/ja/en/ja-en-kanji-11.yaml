schema: 1
id: "ja-en-kanji-11"
kind: "layer"
core: "ja-kanji-11"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 11: grade 3, part 2"
description: "Twenty-five kanji of the third school grade, each taught by the kana reading of the word it stands for. Some have one example or none yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-5540":
    native: "to head for"
    notes:
      "n1": "向 (mukau): on reading コウ (kou); kun readings むく (muku), むける (mukeru), むかう (mukau) and むこう (mukou). It is in むかう (mukau), to head for."
    examples:
      "わたしはえきに向かいます。": "I am heading for the station."
      "向こうはこうえんです。": "Over there is the park."
  "ja-5541":
    native: "to protect"
    notes:
      "n1": "守 (mamoru): on reading シュ (shu); a limited reading ス (su) in a few words; kun readings まもる (mamoru) and もり (mori). It is in まもる (mamoru), to protect."
    examples:
      "いぬはいえを守ります。": "The dog protects the house."
      "わたしはともだちを守ります。": "I protect my friend."
  "ja-5542":
    native: "cheap"
    notes:
      "n1": "安 (yasui): on reading アン (an); kun reading やすい (yasui). It is in やすい (yasui), cheap."
    examples:
      "ぎゅうにゅうは安いです。": "Milk is cheap."
      "わたしは安心です。": "I am relieved."
  "ja-5543":
    native: "state; province"
    notes:
      "n1": "州 (shuu): on reading シュウ (shuu); kun reading す (su). It is in しゅう (shuu), state or province. The same kana is 週 (shuu), week, a taught word with another meaning."
  "ja-5544":
    native: "ceremony; formula"
    notes:
      "n1": "式 (shiki): on reading シキ (shiki); no kun reading. It is in しき (shiki), ceremony or formula."
  "ja-5545":
    native: "song"
    notes:
      "n1": "曲 (kyoku): on reading キョク (kyoku); kun readings まがる (magaru) and まげる (mageru). It is in きょく (kyoku), song. Not the bureau 局 (kyoku), which has the same kana. Its kun reading まがる (magaru), to turn, is in the examples."
    examples:
      "わたしはかどでみぎに曲がります。": "I turn right at the corner."
      "くるまはみぎに曲がります。": "The car turns right."
  "ja-5546":
    native: "to exist; to have"
    notes:
      "n1": "有 (aru): on readings ユウ (yuu) and ウ (u); kun reading ある (aru). It is in ある (aru), to exist; to have."
  "ja-5547":
    native: "next"
    notes:
      "n1": "次 (tsugi): on readings ジ (ji) and シ (shi); kun readings つぐ (tsugu) and つぎ (tsugi). It is in つぎ (tsugi), next."
  "ja-5548":
    native: "to die"
    notes:
      "n1": "死 (shinu): on reading シ (shi); kun reading しぬ (shinu). It is in しぬ (shinu), to die."
  "ja-5549":
    native: "sheep"
    notes:
      "n1": "羊 (hitsuji): on reading ヨウ (you); kun reading ひつじ (hitsuji). It is in ひつじ (hitsuji), sheep."
    examples:
      "羊はおおきいです。": "The sheep is big."
      "わたしは羊がすきです。": "I like sheep."
  "ja-5550":
    native: "blood"
    notes:
      "n1": "血 (chi): on reading ケツ (ketsu); kun reading ち (chi). It is in ち (chi), blood. The same kana is 地 (chi), ground, a taught word with another meaning."
  "ja-5551":
    native: "to live"
    notes:
      "n1": "住 (sumu): on readings ジュウ (juu); kun readings すむ (sumu) and すまう (sumau). It is in すむ (sumu), to live."
  "ja-5552":
    native: "to help"
    notes:
      "n1": "助 (tasukeru): on reading ジョ (jo); kun readings たすける (tasukeru), たすかる (tasukaru) and すけ (suke). It is in たすける (tasukeru), to help."
    examples:
      "わたしはともだちを助けます。": "I help my friend."
      "わたしは助かりました。": "I was helped."
  "ja-5553":
    native: "medicine"
    notes:
      "n1": "医 (i): on reading イ (i); no kun reading. It is in いしゃ (isha), doctor, the word 医者 (isha)."
  "ja-5554":
    native: "you (informal)"
    notes:
      "n1": "君 (kimi): on reading クン (kun); kun reading きみ (kimi). It is in きみ (kimi), you (informal)."
    examples:
      "君はともだちです。": "You are my friend."
      "君はがくせいです。": "You are a student."
  "ja-5555":
    native: "slope"
    notes:
      "n1": "坂 (saka): on reading ハン (han); kun reading さか (saka). It is in さか (saka), slope."
    examples:
      "いえのまえに坂があります。": "There is a slope in front of the house."
      "いえのちかくに坂があります。": "There is a slope near the house."
  "ja-5556":
    native: "pair; opposite"
    notes:
      "n1": "対 (tai): on readings タイ (tai) and ツイ (tsui); no kun reading. It is in たい (tai), pair or opposite."
    examples:
      "わたしは反対です。": "I am against it."
      "みぎはひだりの反対です。": "Right is the opposite of left."
  "ja-5557":
    native: "bureau"
    notes:
      "n1": "局 (kyoku): on reading キョク (kyoku); no kun reading. It is in きょく (kyoku), bureau or office. Not the song 曲 (kyoku), which has the same kana."
  "ja-5558":
    native: "role; duty"
    notes:
      "n1": "役 (yaku): on readings ヤク (yaku) and エキ (eki); no kun reading. It is in やく (yaku), role or duty."
  "ja-5559":
    native: "to throw"
    notes:
      "n1": "投 (nageru): on reading トウ (tou); kun reading なげる (nageru). It is in なげる (nageru), to throw."
  "ja-5560":
    native: "to decide"
    notes:
      "n1": "決 (kimeru): on reading ケツ (ketsu); kun readings きめる (kimeru) and きまる (kimaru). It is in きめる (kimeru), to decide."
  "ja-5561":
    native: "to investigate"
    notes:
      "n1": "究 (kiwameru): on reading キュウ (kyuu); kun reading きわめる (kiwameru). It is in きわめる (kiwameru), to investigate."
  "ja-5562":
    native: "bean"
    notes:
      "n1": "豆 (mame): on reading トウ (tou) and a limited reading ズ (zu); kun reading まめ (mame). It is in まめ (mame), bean."
  "ja-5563":
    native: "body"
    notes:
      "n1": "身 (mi): on reading シン (shin); kun reading み (mi). It is in み (mi), body."
  "ja-5564":
    native: "to return"
    notes:
      "n1": "返 (kaesu): on reading ヘン (hen); kun readings かえす (kaesu) and かえる (kaeru). It is in かえす (kaesu), to return something."
    examples:
      "わたしはほんを返します。": "I return the book."
      "ともだちはほんを返します。": "My friend returns the book."
