"cards":
  "ja-3516":
    "native": "I paint a picture."
    "notes":
      "n1": "えがく (egaku) means to draw or paint a picture, while かく (kaku) is the everyday word for drawing or writing."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "えがきます":
        "meaning": "to draw; to paint (polite)"
    "confusables":
      "w1":
        "why": "sculpture, not painting"
      "w2":
        "why": "photo, not painting"
  "ja-3517":
    "native": "I went to the exhibition."
    "bases":
      "に":
        "meaning": "(marks the time, the place or the target)"
      "いきました":
        "meaning": "to go (polite, past)"
    "confusables":
      "w1":
        "why": "gallery, not exhibition"
      "w2":
        "why": "concert, not exhibition"
  "ja-3518":
    "native": "I saw kabuki."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "みました":
        "meaning": "to see (polite, past)"
    "confusables":
      "w1":
        "why": "bunraku, not kabuki"
      "w2":
        "why": "rakugo, not kabuki"
  "ja-3519":
    "native": "Woodblock prints are famous."
    "notes":
      "n1": "うきよえ (ukiyoe) means pictures of the floating world."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "ゆうめい":
        "meaning": "famous"
      "です":
        "meaning": "to be (polite)"
    "confusables":
      "w1":
        "why": "ink painting, not woodblock print"
      "w2":
        "why": "oil painting, not woodblock print"
  "ja-3520":
    "native": "Jazz is cool."
    "notes":
      "n1": "かっこいい (kakkoii, cool) is an い (i) adjective with an irregular past: かっこよかった (kakkoyokatta), not かっこいかった (kakkoikatta)."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "かっこいい":
        "meaning": "cool"
      "です":
        "meaning": "to be (polite)"
    "confusables":
      "w1":
        "why": "classical music, not jazz"
      "w2":
        "why": "orchestra, not jazz"
  "ja-3521":
    "native": "I learn flower arrangement."
    "notes":
      "n1": "ならう (narau) means to learn a skill from a teacher, unlike まなぶ (manabu, to study)."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "ならいます":
        "meaning": "to learn (polite)"
    "confusables":
      "w1":
        "why": "tea ceremony, not flower arrangement"
      "w2":
        "why": "pottery, not flower arrangement"
  "ja-3522":
    "native": "I play an instrument."
    "notes":
      "n1": "ひく (hiku) is used for playing a string or keyboard instrument, as in ピアノをひく (piano o hiku)."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "ひきます":
        "meaning": "to play (a string instrument; polite)"
    "confusables":
      "w1":
        "why": "song, not instrument"
      "w2":
        "why": "stage, not instrument"
  "ja-3523":
    "native": "The picture on the folding screen is beautiful."
    "bases":
      "の":
        "meaning": "(of; belonging to)"
      "えが":
        "meaning": "picture"
      "きれい":
        "meaning": "beautiful"
      "です":
        "meaning": "to be (polite)"
    "confusables":
      "w1":
        "why": "painter, not picture"
      "w2":
        "why": "painter, not picture"
