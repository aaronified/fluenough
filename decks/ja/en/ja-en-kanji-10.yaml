id: "ja-en-kanji-10"
kind: "layer"
core: "ja-kanji-10"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 10: grade 3, part 1"
description: "Twenty-five kanji of the third school grade, each taught by the kana reading of the word it stands for. Some have one example or none yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-5480":
    native: "polite; careful"
    notes:
      "n1": "丁 (teinei): on readings チョウ (chou) and テイ (tei). It is in 丁目 (choume), a city block."
  "ja-5481":
    native: "plan; schedule"
    notes:
      "n1": "予 (yotei): on reading ヨ (yo). It is in 予約 (yoyaku), a reservation."
  "ja-5482":
    native: "change into; transform"
    notes:
      "n1": "化 (bakeru): on readings カ (ka) and ケ (ke); kun readings ばける (bakeru) and ばかす (bakasu). It is in 文化 (bunka), culture."
  "ja-5483":
    native: "distinction; difference"
    notes:
      "n1": "区 (kubetsu): on reading ク (ku). It is in 区役所 (kuyakusho), a ward office."
  "ja-5484":
    native: "bend; warp"
    notes:
      "n1": "反 (soru): on reading ハン (han); kun readings そる (soru) and そらす (sorasu). It is in 反対 (hantai), opposite."
  "ja-5485":
    native: "world"
    notes:
      "n1": "世 (sekai): on readings セイ (sei) and セ (se); kun reading よ (yo). It is in 世紀 (seiki), a century."
  "ja-5486":
    native: "owner; master"
    notes:
      "n1": "主 (nushi): on reading シュ (shu); kun readings ぬし (nushi) and おも (omo). It is in 主人 (shujin), husband."
  "ja-5487":
    native: "work; job"
    notes:
      "n1": "仕 (shigoto): on reading シ (shi); kun reading つかえる (tsukaeru). It is in 仕組み (shikumi), a mechanism."
  "ja-5488":
    native: "other; another"
    notes:
      "n1": "他 (hoka): on reading タ (ta); kun reading ほか (hoka). It is in 他人 (tanin), another person."
  "ja-5489":
    native: "replace; take over"
    notes:
      "n1": "代 (kawaru): on readings ダイ (dai) and タイ (tai); kun readings かわる (kawaru), かえる (kaeru), よ (yo) and しろ (shiro). It is in 代金 (daikin), a price."
  "ja-5490":
    native: "copy; photograph"
    notes:
      "n1": "写 (utsusu): on reading シャ (sha); kun readings うつす (utsusu) and うつる (utsuru). It is in 写真 (shashin), a photograph."
  "ja-5491":
    native: "last year"
    notes:
      "n1": "去 (kyonen): on readings キョ (kyo) and コ (ko); kun reading さる (saru), to leave. It is in 過去 (kako), the past."
    examples:
      "かばんは去年かいました。": "I bought the bag last year."
  "ja-5492":
    native: "number"
    notes:
      "n1": "号 (bangou): on reading ゴウ (gou). It is in 信号 (shingou), a traffic light."
  "ja-5493":
    native: "centre"
    notes:
      "n1": "央 (chuuou): on reading オウ (ou). It is in 中央 (chuuou), the centre."
  "ja-5494":
    native: "flat; level"
    notes:
      "n1": "平 (taira): on readings ヘイ (hei) and ビョウ (byou); kun readings たいら (taira) and ひら (hira). It is in 平和 (heiwa), peace."
  "ja-5495":
    native: "hit; strike"
    notes:
      "n1": "打 (utsu): on reading ダ (da); kun reading うつ (utsu). It is in 打撃 (dageki), a blow."
  "ja-5496":
    native: "ice"
    notes:
      "n1": "氷 (koori): on reading ヒョウ (hyou); kun readings こおり (koori) and ひ (hi). It is in 氷山 (hyouzan), an iceberg."
    examples:
      "氷はつめたいです。": "Ice is cold."
      "氷をのみものにいれます。": "I put ice in the drink."
  "ja-5497":
    native: "reason; cause"
    notes:
      "n1": "由 (yoshi): on readings ユ (yu) and ユウ (yuu); kun reading よし (yoshi). It is in 理由 (riyuu), a reason."
  "ja-5498":
    native: "say (humbly); state"
    notes:
      "n1": "申 (mousu): on reading シン (shin); kun reading もうす (mousu). It is in 申し込み (moushikomi), an application."
  "ja-5499":
    native: "skin; peel"
    notes:
      "n1": "皮 (kawa): on reading ヒ (hi); kun reading かわ (kawa), meaning the skin or peel, not the river 川 (kawa). It is in 毛皮 (kegawa), fur."
    examples:
      "りんごの皮もおいしいです。": "The apple peel is delicious too."
  "ja-5500":
    native: "dish; plate"
    notes:
      "n1": "皿 (sara): kun reading さら (sara). It is in 小皿 (kozara), a small dish."
    examples:
      "皿の上にりんごがあります。": "There is an apple on the plate."
      "皿はたなにあります。": "The plate is on the shelf."
  "ja-5501":
    native: "manners; etiquette"
    notes:
      "n1": "礼 (reigi): on readings レイ (rei) and ライ (rai). It is in 失礼 (shitsurei), rudeness."
  "ja-5502":
    native: "parents"
    notes:
      "n1": "両 (ryoushin): on reading リョウ (ryou). It is in 両方 (ryouhou), both sides."
    examples:
      "両親は東京にいます。": "My parents are in Tokyo."
      "両親とごはんをたべます。": "I have a meal with my parents."
  "ja-5503":
    native: "all; whole"
    notes:
      "n1": "全 (subete): on reading ゼン (zen); kun readings まったく (mattaku) and すべて (subete). It is in 全部 (zenbu), all of it."
  "ja-5504":
    native: "train"
    notes:
      "n1": "列 (ressha): on reading レツ (retsu). It is in 行列 (gyouretsu), a queue."
