  slots:
    "mashou": "let us {meaning}"
    "masen-ka": "won't you {meaning}?"
rules:
  "ja-rule-mashou":
    name: "ましょう (mashou): let us"
    explanation: "{1} is added to a verb stem to suggest doing it together: {2} means let us go."
  "ja-rule-masen-ka":
    name: "ませんか (masen ka): won't you"
    explanation: "{1} is added to a verb stem to invite someone politely: {2} means won't you go?"
