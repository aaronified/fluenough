name: "Let us: ましょう (mashou) and ませんか (masen ka)"
description: "Put ましょう (mashou) on a verb to suggest doing it together: いきましょう (ikimashou), let us go. Put ませんか (masen ka) on a verb to invite someone: いきませんか (ikimasen ka), won't you go? Every verb a course deck teaches has a row. Not yet checked by a Japanese speaker: please report any mistake."
