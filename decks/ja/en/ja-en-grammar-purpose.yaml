name: "Purpose: ために (tame ni) and ように (you ni)"
description: "After the dictionary form, ために (tame ni) says in order to; ように (you ni) says so that something happens. Every verb a course deck teaches has a row. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "tame-ni": "in order to {meaning}"
    "you-ni": "so that one {meaning}"
rules:
  "ja-rule-tame-ni":
    name: "ために (tame ni): in order to"
    explanation: "{1} follows the dictionary form to give a purpose that you choose: {2} means in order to eat."
  "ja-rule-you-ni":
    name: "ように (you ni): so that"
    explanation: "{1} follows a plain form to say a hoped-for result, or to ask someone to do something: {2} means so that one eats. With します (shimasu) it means to try to do it."
