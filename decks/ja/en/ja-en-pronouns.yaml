  "name": "English"
"name": "Pronouns and people words"
"license": "CC-BY-SA-4.0"
"description": "Twenty words for people: I, you, he, she, we and they in their plain and polite forms, someone, something, each other and people. Not yet checked by a Japanese speaker: please report any mistake."
"tags":
- "beginner"
- "unreviewed"
"cards":
  "ja-0167":
    "native": "I (said by boys and men)"
    "notes":
      "n1": "ぼく (boku) is I, used by boys and men with friends and in plain speech. A girl says わたし (watashi). To a boss, say わたくし (watakushi)."
    "examples":
      "ぼくはがくせいです。":
        "native": "I am a student."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "ぼくのいぬはおおきいです。":
        "native": "My dog is big."
        "bases":
          "の":
            "meaning": "(links two nouns: of, 's)"
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
  "ja-0168":
    "native": "I (formal)"
    "notes":
      "n1": "わたくし (watakushi) is I, said formally, in a meeting or a letter. In daily speech say わたし (watashi)."
    "examples":
      "わたくしはせんせいです。":
        "native": "I am a teacher."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "わたくしのなまえはたなかです。":
        "native": "My name is Tanaka."
        "bases":
          "の":
            "meaning": "(links two nouns: of, 's)"
          "は":
            "meaning": "(marks the topic)"
          "たなか":
            "meaning": "Tanaka (a surname)"
          "です":
            "meaning": "is (polite)"
  "ja-0169":
    "native": "you (informal)"
    "notes":
      "n1": "きみ (kimi) is you, said by men to a friend or a junior. It can sound rude to a stranger or a boss: say あなた (anata) or the name instead."
    "examples":
      "きみはがくせいですか。":
        "native": "Are you a student?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
      "きみのいぬはちいさいです。":
        "native": "Your dog is small."
        "bases":
          "の":
            "meaning": "(links two nouns: of, 's)"
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
  "ja-0170":
    "native": "he"
    "notes":
      "n1": "かれ (kare) is he: a man or a boy who is not here. For a woman, say かのじょ (kanojo)."
    "examples":
      "かれはせんせいです。":
        "native": "He is a teacher."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "かれはどこですか。":
        "native": "Where is he?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
  "ja-0171":
    "native": "she"
    "notes":
      "n1": "かのじょ (kanojo) is she: a woman or a girl who is not here. For a man, say かれ (kare)."
    "examples":
      "かのじょはがくせいです。":
        "native": "She is a student."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "かのじょのいぬはおおきいです。":
        "native": "Her dog is big."
        "bases":
          "の":
            "meaning": "(links two nouns: of, 's)"
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
  "ja-0172":
    "native": "they (men, or a mixed group)"
    "notes":
      "n1": "かれら (karera) is they: men, or a mixed group, who are not here. It is the plural of かれ (kare). For women, say かのじょたち (kanojotachi)."
    "examples":
      "かれらはせんせいです。":
        "native": "They are teachers."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "かれらはにほんにいます。":
        "native": "They are in Japan."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "に":
            "meaning": "(marks a place: in, at, to)"
          "います":
            "meaning": "to be (of a person or animal)"
  "ja-0173":
    "native": "they (women)"
    "notes":
      "n1": "かのじょたち (kanojotachi) is they: women or girls who are not here. It is the plural of かのじょ (kanojo)."
    "examples":
      "かのじょたちはがくせいです。":
        "native": "They are students."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "かのじょたちはどこですか。":
        "native": "Where are they?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
  "ja-0174":
    "native": "we"
    "notes":
      "n1": "わたしたち (watashitachi) is we: the speaker and others. Add たち (tachi) to a pronoun to make it plural."
    "examples":
      "わたしたちはがくせいです。":
        "native": "We are students."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "わたしたちはにほんにいます。":
        "native": "We are in Japan."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "に":
            "meaning": "(marks a place: in, at, to)"
          "います":
            "meaning": "to be (of a person or animal)"
  "ja-0175":
    "native": "you all (polite)"
    "notes":
      "n1": "あなたがた (anatagata) is you all, said politely to a group. In plain speech say あなたたち (anatatachi)."
    "examples":
      "あなたがたはせんせいですか。":
        "native": "Are you all teachers?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
      "あなたがたはどこにいますか。":
        "native": "Where are you all?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "に":
            "meaning": "(marks a place: in, at, to)"
          "います":
            "meaning": "to be (of a person or animal)"
          "か":
            "meaning": "(marks a question)"
  "ja-0176":
    "native": "we (said by boys and men)"
    "notes":
      "n1": "ぼくたち (bokutachi) is we, said by boys and men. A group of women or girls says わたしたち (watashitachi)."
    "examples":
      "ぼくたちはともだちです。":
        "native": "We are friends."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "ぼくたちはがくせいです。":
        "native": "We are students."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
  "ja-0177":
    "native": "oneself"
    "notes":
      "n1": "じぶん (jibun) is oneself. It points back to the person who does the action, as in わたしはじぶんのせんせいです (watashi wa jibun no sensei desu). It is not the same as あなた (anata)."
    "examples":
      "わたしはじぶんのせんせいです。":
        "native": "I am my own teacher."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "の":
            "meaning": "(links two nouns: of, 's)"
          "です":
            "meaning": "is (polite)"
      "じぶんのいぬはおおきいです。":
        "native": "One's own dog is big."
        "bases":
          "の":
            "meaning": "(links two nouns: of, 's)"
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
  "ja-0178":
    "native": "everyone (plain)"
    "notes":
      "n1": "みんな (minna) is everyone, all of them, in plain speech. In polite speech say みなさん (minasan)."
    "examples":
      "みんなはがくせいです。":
        "native": "All of them are students."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "みんなはどこにいますか。":
        "native": "Where is everyone?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "に":
            "meaning": "(marks a place: in, at, to)"
          "います":
            "meaning": "to be (of a person or animal)"
          "か":
            "meaning": "(marks a question)"
  "ja-0179":
    "native": "someone"
    "notes":
      "n1": "だれか (dareka) is someone: a person who is not named. A question with it asks whether anyone is there: だれかがいますか (dareka ga imasu ka)."
    "examples":
      "だれかがいますか。":
        "native": "Is someone there?"
        "bases":
          "が":
            "meaning": "(marks the subject)"
          "います":
            "meaning": "to be (of a person or animal)"
          "か":
            "meaning": "(marks a question)"
      "だれかがせんせいですか。":
        "native": "Is someone a teacher?"
        "bases":
          "が":
            "meaning": "(marks the subject)"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
  "ja-0180":
    "native": "something"
    "notes":
      "n1": "なにか (nanika) is something: a thing that is not named. なにかたべますか (nanika tabemasu ka) asks whether you will eat something."
    "examples":
      "なにかがありますか。":
        "native": "Is there something?"
        "bases":
          "が":
            "meaning": "(marks the subject)"
          "あります":
            "meaning": "to be (of things); to have"
          "か":
            "meaning": "(marks a question)"
      "なにかたべますか。":
        "native": "Will you eat something?"
        "bases":
          "たべます":
            "meaning": "to eat (polite)"
          "か":
            "meaning": "(marks a question)"
  "ja-0181":
    "native": "we (formal)"
    "notes":
      "n1": "わたくしたち (watakushitachi) is we, said formally. In plain speech say わたしたち (watashitachi)."
    "examples":
      "わたくしたちはがくせいです。":
        "native": "We are students (formal)."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "わたくしたちはにほんにいます。":
        "native": "We are in Japan (formal)."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "に":
            "meaning": "(marks a place: in, at, to)"
          "います":
            "meaning": "to be (of a person or animal)"
  "ja-0182":
    "native": "you all (plain)"
    "notes":
      "n1": "あなたたち (anatatachi) is you all, in plain speech to friends. Politely, say あなたがた (anatagata)."
    "examples":
      "あなたたちはともだちですか。":
        "native": "Are you all friends?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
      "あなたたちはどこですか。":
        "native": "Where are you all?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
  "ja-0183":
    "native": "someone (polite)"
    "notes":
      "n1": "どなたか (donataka) is someone, said politely, as どなた (donata) is the polite who."
    "examples":
      "どなたかがいますか。":
        "native": "Is someone there, please?"
        "bases":
          "が":
            "meaning": "(marks the subject)"
          "います":
            "meaning": "to be (of a person or animal)"
          "か":
            "meaning": "(marks a question)"
      "どなたかがせんせいですか。":
        "native": "Is someone a teacher, please?"
        "bases":
          "が":
            "meaning": "(marks the subject)"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
  "ja-0184":
    "native": "each other"
    "notes":
      "n1": "おたがい (otagai) is each other: two or more people, each one with the other. Say おたがいのともだち (otagai no tomodachi) for each other's friends."
    "examples":
      "わたしたちはおたがいのともだちです。":
        "native": "We are each other's friends."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "の":
            "meaning": "(links two nouns: of, 's)"
          "です":
            "meaning": "is (polite)"
      "かれらはおたがいのせんせいです。":
        "native": "They are each other's teachers."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "の":
            "meaning": "(links two nouns: of, 's)"
          "です":
            "meaning": "is (polite)"
  "ja-0185":
    "native": "people"
    "notes":
      "n1": "ひとたち (hitotachi) is people: the plural of ひと (hito)."
    "examples":
      "ひとたちはどこですか。":
        "native": "Where are the people?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
      "ひとたちはにほんにいます。":
        "native": "The people are in Japan."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "に":
            "meaning": "(marks a place: in, at, to)"
          "います":
            "meaning": "to be (of a person or animal)"
  "ja-0186":
    "native": "people (polite)"
    "notes":
      "n1": "かたがた (katagata) is people, said politely: the polite plural of かた (kata)."
    "examples":
      "かたがたはせんせいですか。":
        "native": "Are these people teachers?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
      "かたがたはどこにいますか。":
        "native": "Where are these people?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "に":
            "meaning": "(marks a place: in, at, to)"
          "います":
            "meaning": "to be (of a person or animal)"
          "か":
            "meaning": "(marks a question)"
  "ja-0187":
    "native": "personal pronouns"
    "explanation": "The words for I, you, he, she, we and they: ぼく (boku) and わたくし (watakushi) for I, きみ (kimi) and あなた (anata) for you, かれ (kare) and かのじょ (kanojo) for he and she, and the plural forms with たち (tachi) or がた (gata) that make a pronoun plural. Each stands where the person would, and the plain and polite forms go with the same people."
