  "ja-0250":
    "native": "counting words one to ten"
    "explanation": "The native words for counting up to ten things: ひとつ (hitotsu), ふたつ (futatsu), みっつ (mittsu), よっつ (yottsu), いつつ (itsutsu), むっつ (muttsu), ななつ (nanatsu), やっつ (yattsu), ここのつ (kokonotsu) and とお (too). They count things, not the bare number."
