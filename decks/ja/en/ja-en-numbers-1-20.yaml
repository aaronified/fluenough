"name": "Numbers one to twenty"
"license": "CC-BY-SA-4.0"
"description": "Twenty-five words: the numbers one to ten in the Chinese-based words and in the native counting words, and some numbers from eleven to twenty. Not yet checked by a Japanese speaker: please report any mistake."
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "ja-0229":
    "native": "one"
    "notes":
      "n1": "いち (ichi) is one, from the number words that come from Chinese. For counting things, say ひとつ (hitotsu)."
    "examples":
      "いちはちいさいです。":
        "native": "One is small."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "どれがいちですか。":
        "native": "Which one is one?"
        "bases":
          "が":
            "meaning": "(marks the subject)"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
  "ja-0230":
    "native": "two"
    "notes":
      "n1": "に (ni) is two. The same letters also mark a place as a particle, as in にほんにいます (nihon ni imasu), which is a different word."
    "examples":
      "どれがにですか。":
        "native": "Which is two?"
        "bases":
          "が":
            "meaning": "(marks the subject)"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
      "いちとにはさんです。":
        "native": "One and two are three."
        "bases":
          "と":
            "meaning": "and (joins two words)"
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
  "ja-0231":
    "native": "three"
    "notes":
      "homograph-san": "さん (san) is also the word after a name, as in たなかさん (tanaka-san). Here it is the number three: a different word, spelled the same."
    "examples":
      "さんはおおきいです。":
        "native": "Three is big."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "どれがさんですか。":
