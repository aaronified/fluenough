  "ja-0239":
    "native": "numbers one to ten"
    "explanation": "The number words one to ten that come from Chinese: いち (ichi), に (ni), さん (san), よん (yon), ご (go), ろく (roku), なな (nana), はち (hachi), きゅう (kyuu) and じゅう (juu). They say the number itself. For counting things, use the native words in the next set, ひとつ (hitotsu) and the rest."
  "ja-0240":
    "native": "one (thing)"
    "notes":
      "n1": "ひとつ (hitotsu) is one thing, counted in the native way. For the number one itself, say いち (ichi)."
    "examples":
      "ひとつください。":
        "native": "One, please."
        "bases":
          "ください":
            "meaning": "please (give me)"
      "ひとつはいくらですか。":
        "native": "How much is one?"
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
          "か":
            "meaning": "(marks a question)"
  "ja-0241":
    "native": "two (things)"
    "notes":
      "n1": "ふたつ (futatsu) is two things, counted in the native way. For the number two, say に (ni)."
    "examples":
      "ふたつください。":
        "native": "Two, please."
        "bases":
          "ください":
            "meaning": "please (give me)"
      "ふたつありますか。":
        "native": "Are there two?"
        "bases":
          "あります":
            "meaning": "to be (of things); to have"
          "か":
            "meaning": "(marks a question)"
