schema: 1
id: "ja-en-body-sentences"
kind: "layer"
core: "ja-body-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The body in sentences"
description: "Sentences built from the words of this unit, to put in order, each with the words it could be mistaken for. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "ja-1108":
    native: "My head hurts."
    "notes":
      "n1": "A pain is the subject of いたい (itai, hurts), and the body part takes が (ga), as in あたまがいたい (atama ga itai)."
    bases:
      "は":
        meaning: "(marks the topic)"
      "が":
        meaning: "(marks the subject)"
      "です":
        meaning: "is (polite)"
    confusables:
      w1:
        why: "むね (mune) is the chest, not the head."
      w2:
        why: "ねつ (netsu) is a fever."
  "ja-1109":
    native: "I take medicine."
    "notes":
      "n1": "のむ (nomu) is also used for taking medicine, as in くすりをのむ (kusuri o nomu)."
    bases:
      "を":
        meaning: "(marks the thing acted on)"
    confusables:
      w1:
        why: "ちゅうしゃ (chuusha) is an injection, not a medicine to drink."
      w2:
        why: "おふろ (ofuro) is a bath."
  "ja-1110":
    native: "Does your back itch?"
    bases:
      "が":
        meaning: "(marks the subject)"
      "です":
        meaning: "is (polite)"
      "か":
        meaning: "(marks a question)"
    confusables:
      w1:
        why: "はだ (hada) is the skin."
      w2:
        why: "こし (koshi) is the waist."
  "ja-1111":
    native: "Where does it hurt?"
    "notes":
      "n1": "どこ (doko, where) takes が (ga) as the subject of いたい (itai), as in どこがいたい (doko ga itai)."
    bases:
      "が":
        meaning: "(marks the subject)"
      "です":
        meaning: "is (polite)"
      "か":
        meaning: "(marks a question)"
    confusables:
      w1:
        why: "かた (kata) is the shoulder."
      w2:
        why: "ゆび (yubi) is a finger."
  "ja-4127":
    native: "My head hurts."
    bases:
      "の":
        meaning: "(links two nouns)"
      "は":
        meaning: "(marks the topic)"
      "いたい":
        meaning: "painful; hurts"
      "です":
        meaning: "is (polite)"
    confusables:
      w1:
        why: "かお (kao) is face, not part of this sentence."
      w2:
        why: "せなか (senaka) is back (of the body), not part of this sentence."
  "ja-4128":
    native: "My back is itchy."
    bases:
      "が":
        meaning: "(marks the subject)"
      "かゆい":
        meaning: "itchy"
      "です":
        meaning: "is (polite)"
    confusables:
      w1:
        why: "はな (hana) is nose, not part of this sentence."
      w2:
        why: "かお (kao) is face, not part of this sentence."
  "ja-4129":
    native: "I took the medicine."
    bases:
      "を":
        meaning: "(marks the thing acted on)"
      "のみました":
        meaning: "to drink"
    confusables:
      w1:
        why: "ごはん (gohan) is rice; a meal, not part of this sentence."
      w2:
        why: "みず (mizu) is water, not part of this sentence."
  "ja-4130":
    native: "I have a fever."
    "notes":
      "n1": "ねつ (netsu, fever) takes あります (arimasu), because a fever is a thing, not a living being."
    bases:
      "が":
        meaning: "(marks the subject)"
      "あります":
        meaning: "there is (a thing)"
    confusables:
      w1:
        why: "はな (hana) is nose, not part of this sentence."
      w2:
        why: "かお (kao) is face, not part of this sentence."
