"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Counters in sentences"
"description": "Sentences that count things, people and times, to put in order, each with the words it could be mistaken for. Not yet checked by a Japanese speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "ja-4217":
    "native": "Three bottles of water, please."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "さんぼん":
        "meaning": "three (bottles)"
      "ください":
        "meaning": "please (give me)"
    "confusables":
      "w1":
        "why": "さんまい (sanmai) counts three flat things such as paper."
      "w2":
        "why": "さんびき (sanbiki) counts three small animals, not bottles."
  "ja-4218":
    "native": "One bread roll, please."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "ください":
        "meaning": "please (give me)"
    "confusables":
      "w1":
        "why": "ふたつ (futatsu) is two things; the order is for one."
      "w2":
        "why": "ひとり (hitori) counts one person, not a thing."
  "ja-4219":
    "native": "One egg, please."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "いっこ":
        "meaning": "one (small compact thing)"
      "ください":
        "meaning": "please (give me)"
    "confusables":
      "w1":
        "why": "いっぴき (ippiki) counts small animals, not eggs."
      "w2":
        "why": "いっぽん (ippon) counts long thin things."
  "ja-4220":
    "native": "I bought five apples."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
    "confusables":
      "w1":
        "why": "むっつ (muttsu) is six things, one too many."
      "w2":
        "why": "ななつ (nanatsu) is seven things."
  "ja-4221":
    "native": "I have three friends."
    "bases":
      "が":
        "meaning": "(marks the subject)"
      "さんにん":
        "meaning": "three people"
      "います":
        "meaning": "to be (of people and animals); to exist"
    "confusables":
      "w1":
        "why": "さんぼん (sanbon) counts long things, not people."
      "w2":
        "why": "さんびき (sanbiki) counts animals, not people."
  "ja-4222":
    "native": "There are two dogs."
    "bases":
      "が":
        "meaning": "(marks the subject)"
      "にひき":
        "meaning": "two (small animals)"
      "います":
        "meaning": "to be (of people and animals); to exist"
    "confusables":
      "w1":
        "why": "さんぼん (sanbon) counts three long thin things, not animals."
      "w2":
        "why": "にはい (nihai) counts two glassfuls of a drink."
  "ja-4223":
    "native": "My family is five people."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "ごにん":
        "meaning": "five people"
      "です":
        "meaning": "is (polite)"
    "confusables":
      "w1":
        "why": "ごこ (goko) counts five small things, not people."
      "w2":
        "why": "ごさい (gosai) is five years old."
  "ja-4224":
    "native": "There are ten boxes."
    "bases":
      "が":
        "meaning": "(marks the subject)"
      "じゅっこ":
        "meaning": "ten (small compact things)"
      "あります":
        "meaning": "to be (of things); to exist"
    "confusables":
      "w1":
        "why": "じゅうまい (juumai) counts ten flat things such as paper."
      "w2":
        "why": "じゅっぽん (juppon) counts ten long thin things."
  "ja-4225":
    "native": "I met my friend three times."
    "bases":
      "と":
        "meaning": "with (a companion)"
      "さんかい":
        "meaning": "three times"
    "confusables":
      "w1":
        "why": "さんがい (sangai) is the third floor, said with a が (ga) sound."
      "w2":
        "why": "さんばい (sanbai) counts three glassfuls."
  "ja-4226":
    "native": "I drank two glasses of milk."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "にはい":
        "meaning": "two (glassfuls)"
    "confusables":
      "w1":
        "why": "さんぼん (sanbon) counts long thin things, not drinks."
      "w2":
        "why": "にまい (nimai) counts flat things."
  "ja-4227":
    "native": "The child is five years old."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "ごさい":
        "meaning": "five years old"
      "です":
        "meaning": "is (polite)"
    "confusables":
      "w1":
        "why": "ごふん (gofun) is five minutes."
      "w2":
        "why": "ごかい (gokai) is five times."
  "ja-4228":
    "native": "I wait here for ten minutes."
    "bases":
      "で":
        "meaning": "(marks where it happens)"
      "じゅっぷん":
        "meaning": "ten minutes"
    "confusables":
      "w1":
        "why": "じゅっさい (jussai) is ten years old."
      "w2":
        "why": "じゅっかい (jukkai) is ten times."
  "ja-4229":
    "native": "Five stamps, please."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "ごまい":
        "meaning": "five (flat things such as stamps)"
      "ください":
        "meaning": "please (give me)"
    "confusables":
      "w1":
        "why": "ごさつ (gosatsu) counts five books, not stamps."
      "w2":
        "why": "ごほん (gohon) counts five long thin things."
