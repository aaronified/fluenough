schema: 1
id: "ja-en-kanji-27"
kind: "layer"
core: "ja-kanji-27"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 27: grade 5, part 3"
description: "Twenty-eight kanji of the fifth school grade, each taught by the kana reading of the word it stands for. Most have no example yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-6500":
    native: "to keep; to maintain"
    notes:
      "n1": "保 (tamotsu): on reading ホ (ho); kun reading たも-つ (tamo-tsu). Its kana たもつ (tamotsu), to keep; to maintain, is the word it stands for in its kun reading, written 保つ (tamotsu). No taught card has that kana. Its common words are not examples yet: 保険 (hoken), insurance, uses 険 (ken), and 保護 (hogo), protection, uses 護 (go), kanji not yet taught, so it has no example yet."
  "ja-6501":
    native: "rule; regulation"
    notes:
      "n1": "則 (kisoku): on reading ソク (soku); no kun reading. It is not a word on its own, so its kana きそく (kisoku), rule; regulation, is the commonest word it ends, written 規則 (kisoku). No taught card has that kana, and no taught word written with 則 (soku) has a card, so it has no example yet."
  "ja-6502":
    native: "thick"
    notes:
      "n1": "厚 (atsui): on reading コウ (kou); kun reading あつ-い (atsu-i). Its kana あつい (atsui), thick, is the word it stands for in its kun reading, written 厚い (atsui). It shares its kana with two taught cards for different words: the card あつい (atsui), hot, of weather and things, from ja-describing, is 暑い (atsui) or 熱い (atsui), and the taught kanji card 暑 (atsui), hot of the weather, from ja-kanji-16, is 暑い (atsui). Both are different words from 厚い (atsui). No taught word written with 厚 (kou) has a card, so it has no example yet."
  "ja-6503":
    native: "form; pattern; mould"
    notes:
      "n1": "型 (kata): on reading ケイ (kei); kun reading かた (kata). Its kana かた (kata), form; pattern, is the word it stands for in its kun reading, written 型 (kata). It shares its kana with four taught cards for different words: the card かた (kata), person (polite), from ja-addressing, and the taught kanji card 方 (kata), person (polite); direction, from ja-kanji-9, are the word 方 (kata); the card かた (kata), shoulder, from ja-body, is 肩 (kata); and the taught kanji card 潟 (kata), lagoon, from ja-kanji-24, is 潟 (kata). All four are different words from 型 (kata). No taught word written with 型 (kei) has a card, so it has no example yet."
  "ja-6504":
    native: "government; politics"
    notes:
      "n1": "政 (matsurigoto): on reading セイ (sei) and ショウ (shou), where ショウ (shou) is in parentheses in the table as a special or very narrow use; kun reading まつりごと (matsurigoto). Its kana まつりごと (matsurigoto), government; politics, is the word it stands for in its kun reading, written 政 (matsurigoto). No taught card has that kana. Its commonest word is 政治 (seiji), politics, which is the taught card せいじ (seiji), from ja-news, and its example uses that word, with 治 (ji) taught."
    examples:
      "政治は面白いです。": "Politics is interesting."
  "ja-6505":
    native: "reason; cause"
    notes:
      "n1": "故 (yue): on reading コ (ko); kun reading ゆえ (yue). Its kana ゆえ (yue), reason; cause, is the word it stands for in its kun reading, written 故 (yue). No taught card has that kana. Its example uses 事故 (jiko), accident, the taught card じこ (jiko), from ja-help, with 事 (ji) taught, so 故 (ko) is the kanji it shows."
    examples:
      "事故は悪いです。": "The accident is bad."
  "ja-6506":
    native: "test; examination"
    notes:
      "n1": "査 (kensa): on reading サ (sa); no kun reading. It is not a word on its own, so its kana けんさ (kensa), test; examination, is the commonest word it ends, written 検査 (kensa). The taught card けんさ (kensa), test; examination, from ja-illness, is the same word, 検査 (kensa), so the two cards share a kana and a word. 検 (ken) is not yet taught, so 検査 (kensa) is not an example. Its example uses 調査 (chousa), investigation; survey, the taught card ちょうさ (chousa), from ja-news, with 調 (chou) taught."
    examples:
      "調査は大切です。": "The investigation is important."
  "ja-6507":
    native: "alone"
    notes:
      "n1": "独 (hitori): on reading ドク (doku); kun reading ひと-り (hito-ri). Its kana ひとり (hitori), alone, is the word it stands for in its kun reading, written 独り (hitori). The taught card ひとり (hitori), one person; alone, from ja-about-me, is the same word in its sense of alone, so the two cards share a kana and that word; in its sense of one person it is 一人 (hitori), a different word. Its example uses 独り (hitori) itself, with は (wa), さびしい (sabishii), lonely, the taught card さびしい (sabishii), written in kana because 寂 (sabi) is not yet taught, and です (desu)."
    examples:
      "独りはさびしいです。": "Being alone is lonely."
  "ja-6508":
    native: "ancestor"
    notes:
      "n1": "祖 (senzo): on reading ソ (so); no kun reading. It is not a word on its own, so its kana せんぞ (senzo), ancestor, is the commonest word it ends, written 先祖 (senzo). No taught card has that kana. Its example uses 祖父 (sofu), grandfather, the taught card そふ (sofu), from ja-family, with 父 (fu) taught, and 元気 (genki), healthy; well, the taught card げんき (genki), from ja-daily-life, with 元 (gen) and 気 (ki) taught, with は (wa) and です (desu)."
    examples:
      "祖父は元気です。": "My grandfather is well."
  "ja-6509":
    native: "century"
    notes:
      "n1": "紀 (seiki): on reading キ (ki); no kun reading. It is not a word on its own, so its kana せいき (seiki), century, is the commonest word it ends, written 世紀 (seiki). No taught card has that kana, and no taught word written with 紀 (ki) has a card, so it has no example yet."
  "ja-6510":
    native: "to get lost; to be unsure"
    notes:
      "n1": "迷 (mayou): on reading メイ (mei); kun reading まよ-う (mayo-u). Its kana まよう (mayou), to get lost; to be unsure, is the word it stands for in its kun reading, written 迷う (mayou). The taught card まよう (mayou), to get lost; to be unsure, from ja-help, is the same word, so the two cards share a kana and a word. Its examples use 迷子 (maigo), lost child, the taught card まいご (maigo), from ja-travel, with 子 (ko) taught, and 道 (michi), road; way, the taught card みち (michi), with に (ni) and 迷いました (mayoimashita), the masu past of 迷う (mayou), taught by the card まよう (mayou)."
    examples:
      "迷子は小さいです。": "The lost child is small."
      "道に迷いました。": "I got lost on the road."
  "ja-6511":
    native: "reverse; opposite"
    notes:
      "n1": "逆 (gyaku): on reading ギャク (gyaku); kun readings さか (saka) and さか-らう (saka-rau). Its kana ぎゃく (gyaku), reverse; opposite, is the word it stands for alone in its on reading, written 逆 (gyaku), so the card uses the on reading and not the kun reading さか (saka). No taught card has that kana, and no taught word written with 逆 (gyaku) has a card, so it has no example yet."
  "ja-6512":
    native: "to limit; to be limited to"
    notes:
      "n1": "限 (kagiru): on reading ゲン (gen); kun reading かぎ-る (kagi-ru). Its kana かぎる (kagiru), to limit; to be limited to, is the word it stands for in its kun reading, written 限る (kagiru). No taught card has that kana, and no taught word written with 限 (gen) has a card, so it has no example yet."
  "ja-6513":
    native: "repair"
    notes:
      "n1": "修 (shuuri): on reading シュウ (shuu); kun readings おさ-める (osa-meru) and おさ-まる (osa-maru). It is not a word on its own, so its kana しゅうり (shuuri), repair, is the commonest word it begins, written 修理 (shuuri). No taught card has that kana. Its example uses 修学旅行 (shuugakuryokou), school trip, the taught card しゅうがくりょこう (shuugakuryokou), from ja-travel, with 学 (gaku), 旅 (ryo) and 行 (kou) taught, and 楽しい (tanoshii), fun, the taught card たのしい (tanoshii), with 楽 (raku) taught."
    examples:
      "修学旅行は楽しいです。": "The school trip is fun."
  "ja-6514":
    native: "individual; personal"
    notes:
      "n1": "個 (kojin): on reading コ (ko); no kun reading. It is not a word on its own, so its kana こじん (kojin), individual; personal, is the commonest word it begins, written 個人 (kojin). No taught card has that kana. The taught card ここ (koko), here, from ja-location, is a different word and is not 個々 (koko), so no taught word written with 個 (ko) has a card, and it has no example yet."
  "ja-6515":
    native: "content; substance"
    notes:
      "n1": "容 (naiyou): on reading ヨウ (you); no kun reading. It is not a word on its own, so its kana ないよう (naiyou), content; substance, is the commonest word it ends, written 内容 (naiyou). No taught card has that kana. Its example uses 美容院 (biyouin), beauty salon, the taught card びよういん (biyouin), from ja-places, with 美 (bi) and 院 (in) taught, and 近い (chikai), near, the taught card ちかい (chikai), from ja-describing."
    examples:
      "美容院は近いです。": "The beauty salon is near."
  "ja-6516":
    native: "teacher"
    notes:
      "n1": "師 (kyoushi): on reading シ (shi); no kun reading. It is not a word on its own, so its kana きょうし (kyoushi), teacher, is the commonest word it ends, written 教師 (kyoushi). No taught card has that kana. The taught card せんせい (sensei), teacher, from ja-first-words, is 先生 (sensei), a different word with the same meaning, so the two cards share a meaning and not a word. No taught word written with 師 (shi) has a card, so it has no example yet."
  "ja-6517":
    native: "character; personality"
    notes:
      "n1": "格 (seikaku): on reading カク (kaku); no kun reading. It is not a word on its own, so its kana せいかく (seikaku), character; personality, is the commonest word it ends, written 性格 (seikaku). The ja-kanji-26 card 性 (seikaku), character; personality, is the same word, 性格 (seikaku), so the two cards share a kana and a word; ja-kanji-26 is not merged yet. No other taught card has that kana, and no taught word written with 格 (kaku) has a card, so it has no example yet."
  "ja-6518":
    native: "cherry blossom"
    notes:
      "n1": "桜 (sakura): on reading オウ (ou); kun reading さくら (sakura). Its kana さくら (sakura), cherry blossom, is the word it stands for alone, written 桜 (sakura). The taught card さくら (sakura), cherry blossom, from ja-seasons, is the same word, so the two cards share a kana and a word. Its example uses 桜 (sakura) itself, with は (wa), きれい (kirei), pretty, the taught card きれい (kirei), from ja-describing, written in kana because 綺 (ki) is not yet taught, and です (desu)."
    examples:
      "桜はきれいです。": "The cherry blossom is pretty."
  "ja-6519":
    native: "to kill"
    notes:
      "n1": "殺 (korosu): on reading サツ (satsu); kun reading ころ-す (koro-su). The readings サイ (sai) and セツ (setsu) are in parentheses in the table as a special or very narrow use. Its kana ころす (korosu), to kill, is the word it stands for in its kun reading, written 殺す (korosu). No taught card has that kana. Its example uses 殺人 (satsujin), murder, the taught card さつじん (satsujin), from ja-news, with 人 (jin) taught, and 悪い (warui), bad; wrong, the taught card わるい (warui), from ja-describing."
    examples:
      "殺人は悪いです。": "Murder is bad."
  "ja-6520":
    native: "to fasten; to stop"
    notes:
      "n1": "留 (tomeru): on reading リュウ (ryuu); kun readings と-める (tome-ru) and と-まる (toma-ru). The reading ル (ru) is in parentheses in the table as a special or very narrow use. Its kana とめる (tomeru), to fasten; to stop, is the word it stands for in its kun reading, written 留める (tomeru). No taught card has that kana, and no taught word written with 留 (ryuu) has a card, so it has no example yet."
  "ja-6521":
    native: "profit; benefit"
    notes:
      "n1": "益 (rieki): on reading エキ (eki); the reading ヤク (yaku) is in parentheses in the table as a special or very narrow use; no kun reading. It is not a word on its own, so its kana りえき (rieki), profit; benefit, is the commonest word it ends, written 利益 (rieki). No taught card has that kana, and no taught word written with 益 (eki) has a card, so it has no example yet."
  "ja-6522":
    native: "to tear; to break"
    notes:
      "n1": "破 (yaburu): on reading ハ (ha); kun readings やぶ-る (yabu-ru) and やぶ-れる (yabu-reru). Its kana やぶる (yaburu), to tear; to break, is the word it stands for in its kun reading, written 破る (yaburu). No taught card has that kana, and no taught word written with 破 (ha) has a card, so it has no example yet."
  "ja-6523":
    native: "powder; flour"
    notes:
      "n1": "粉 (kona): on reading フン (fun); kun readings こ (ko) and こな (kona). Its kana こな (kona), powder; flour, is the word it stands for in its kun reading, written 粉 (kona). The taught card こな (kona), flour, from ja-cooking, is the same word, 粉 (kona), so the two cards share a kana and a word. Its example uses 粉 (kona) itself, with は (wa), 小さい (chiisai), small, the taught card ちいさい (chiisai), from ja-first-words, with 小 (shou) taught, and です (desu)."
    examples:
      "粉は小さいです。": "The powder is small."
  "ja-6524":
    native: "material"
    notes:
      "n1": "素 (sozai): on reading ソ (so); the reading ス (su) is also in the table; no kun reading. It is not a word on its own, so its kana そざい (sozai), material, is the commonest word it begins, written 素材 (sozai). No taught card has that kana, and no taught word written with 素 (so) has a card, so it has no example yet."
  "ja-6525":
    native: "to till; to cultivate"
    notes:
      "n1": "耕 (tagayasu): on reading コウ (kou); kun reading たがや-す (tagaya-su). Its kana たがやす (tagayasu), to till; to cultivate, is the word it stands for in its kun reading, written 耕す (tagayasu). No taught card has that kana, and no taught word written with 耕 (kou) has a card, so it has no example yet."
  "ja-6526":
    native: "ability; capacity"
    notes:
      "n1": "能 (nouryoku): on reading ノウ (nou); no kun reading. It is not a word on its own, so its kana のうりょく (nouryoku), ability; capacity, is the commonest word it begins, written 能力 (nouryoku). No taught card has that kana, and no taught word written with 能 (nou) has a card, so it has no example yet."
  "ja-6527":
    native: "pulse"
    notes:
      "n1": "脈 (myaku): on reading ミャク (myaku); no kun reading. It stands for みゃく (myaku), pulse, alone, written 脈 (myaku). The taught card みゃく (myaku), pulse, from ja-health, is the same word, so the two cards share a kana and a word. Its example uses 脈 (myaku) itself, with は (wa), 速い (hayai), fast, the taught card はやい (hayai), from ja-time, with 速 (soku) taught, and です (desu)."
    examples:
      "脈は速いです。": "The pulse is fast."
