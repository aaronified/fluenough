"pattern":
  "name": "Counters: counting things, people and times"
  "slot_name": "number"
  "slots":
    "one": "one"
    "three": "three"
    "ten": "ten"
    "how-many": "how many"
  "entries":
    "tsu": "things in general, up to ten"
    "nin": "people"
    "ko": "small, compact things such as an egg or an apple"
    "hon": "long, thin things such as a bottle, a pencil or a tree"
    "mai": "flat, thin things such as paper, a ticket or a shirt"
    "hiki": "small animals such as a cat, a dog or a fish"
    "satsu": "bound things such as a book or a notebook"
    "dai": "machines and vehicles such as a car or a computer"
    "kai": "times, how many occasions"
    "hai": "cupfuls and glassfuls of a drink"
    "sai": "age in years; twenty is the special word はたち (hatachi)"
    "fun": "minutes"
  "notes": "A counter follows a number and says what kind of thing is counted: さんにん (sannin) is three people. The number and the counter change sound together. After 1, 3 and 10, ほん (hon) becomes ぽん (pon) or ぼん (bon): いっぽん (ippon), さんぼん (sanbon), じゅっぽん (juppon). ひき (hiki), はい (hai) and ふん (fun) change the same way: いっぴき (ippiki), さんびき (sanbiki); いっぱい (ippai), さんばい (sanbai); いっぷん (ippun), さんぷん (sanpun). Before k, s, t and p counters, 1 and 10 add a small っ (tsu): いっこ (ikko), じゅっこ (jukko); じっこ (jikko) is also said. For people, one and two are special words: ひとり (hitori), ふたり (futari). つ (tsu) counts only up to ten; after ten, use the number alone, as じゅういち (juuichi), eleven. For floors, the counter is かい (kai), but three is さんがい (sangai)."
