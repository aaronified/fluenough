"name": "Counters: counting things, people and times"
"description": "Japanese counts with a counter after the number, and the counter says what is counted: people, flat things, long things, animals, minutes. This unit teaches the everyday counters, with 1, 3 and 10 and how many, where the sound changes. Not yet checked by a Japanese speaker: please report any mistake."
