name: "Wanting to: たい (tai)"
description: "Put たい (tai) on the stem of a verb to say you want to do it: たべたいです (tabetai desu), I want to eat. Every verb a course deck teaches has a row. Not yet checked by a Japanese speaker: please report any mistake."
