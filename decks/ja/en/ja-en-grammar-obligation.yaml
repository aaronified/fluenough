name: "Must and had better: なければなりません (nakereba narimasen) and たほうがいいです (ta hou ga ii desu)"
description: "After the ない (nai) form with い (i) dropped, なければなりません (nakereba narimasen) says that something must be done. After the past (ta) form, ほうがいいです (hou ga ii desu) gives advice. Every verb a course deck teaches has a row. Not yet checked by a Japanese speaker: please report any mistake."
