  slot_name: "form"
  slots:
    "nakereba-naranai": "must {meaning}"
    "ta-hou-ga-ii": "had better {meaning}"
rules:
  "ja-rule-nakereba-naranai":
    name: "なければなりません (nakereba narimasen): must"
    explanation: "{1} follows the ない (nai) form with い (i) dropped to say that something must be done: {2} means I must eat."
  "ja-rule-ta-hou-ga-ii":
    name: "たほうがいいです (ta hou ga ii desu): had better"
    explanation: "{1} follows the past (ta) form to give advice: {2} means you had better eat."
