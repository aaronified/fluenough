native: { code: "en", iso639_3: "eng", name: "English" }
name: "Polite verbs: ます (masu) and ません (masen)"
description: "The polite form of a verb ends in ます (masu), and its negative in ません (masen): たべます (tabemasu), I eat; たべません (tabemasen), I do not eat. Every verb a course deck teaches has a row. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "masu": "polite: {meaning}"
    "masen": "polite negative: {meaning}"
rules:
  "ja-rule-masu":
    name: "ます (masu): polite"
    explanation: "{1} ends a verb to make it polite: {2} means I eat."
  "ja-rule-masen":
    name: "ません (masen): polite negative"
    explanation: "{1} ends a verb to make it polite and negative: {2} means I do not eat."
