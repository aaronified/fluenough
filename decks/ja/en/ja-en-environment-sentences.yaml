  "ja-3397":
    "notes":
      "n1": "を (o) marks a route, the place passed through, as in しんりん (shinrin) の (no) なか (naka) を (o)."
    "native": "I walk in the forest."
    "bases":
      "の":
        "meaning": "(of; belonging to)"
      "なか":
        "meaning": "inside"
      "を":
        "meaning": "(marks the thing acted on)"
      "あるきます":
        "meaning": "to walk (polite)"
    "confusables":
      "w1":
        "why": "felling, not forest"
      "w2":
        "why": "plant, not forest"
  "ja-3398":
    "native": "The drought continues."
