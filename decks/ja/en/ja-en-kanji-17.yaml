id: "ja-en-kanji-17"
kind: "layer"
core: "ja-kanji-17"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 17: grade 3, part 8"
description: "Twenty-five kanji of the third school grade, each taught by the kana reading of the word it stands for. Eight have no example yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-5900":
    native: "idea; intention"
    notes:
      "n1": "意 (imi): on reading イ (i); no kun reading. Its kana いみ (imi), meaning, is the commonest word the kanji stands for, 意味 (imi), and is not yet a taught card. It is in 注意 (chuui), caution."
    examples:
      "注意をします。": "I will be careful."
      "注意してください。": "Please be careful."
  "ja-5901":
    native: "to feel; a feeling"
    notes:
      "n1": "感 (kanjiru): on reading カン (kan); no kun reading. Its kana かんじる (kanjiru), to feel, is the commonest word the kanji stands for, 感じる (kanjiru), and is not yet a taught card. It is in 感動 (kandou), being moved."
  "ja-5902":
    native: "dark"
    notes:
      "n1": "暗 (kurai): on reading アン (an); kun reading くら-い (kura-i). Its kana くらい (kurai), dark, is the word it stands for in its kun reading and is also the taught card くらい (kurai), the same word. It is in 暗記 (anki), memorising."
    examples:
      "へやは暗いです。": "The room is dark."
      "そとは暗いです。": "Outside is dark."
  "ja-5903":
    native: "business; deed; skill"
    notes:
      "n1": "業 (waza): on readings ギョウ (gyou) and ゴウ (gou); kun reading わざ (waza). Its kana わざ (waza), deed or skill, is the word it stands for in its kun reading and is not yet a taught card. It is in 作業 (sagyou), work."
  "ja-5904":
    native: "Chinese"
    notes:
      "n1": "漢 (kanji): on reading カン (kan); no kun reading. Its kana かんじ (kanji) is the commonest word the kanji stands for, 漢字 (kanji), and is also the taught card かんじ (kanji), the same word. It is in 漢文 (kanbun), Chinese writing."
    examples:
      "漢字をかきます。": "I write kanji."
      "漢字はむずかしいです。": "Kanji is difficult."
  "ja-5905":
    native: "good fortune; luck"
    notes:
      "n1": "福 (koufuku): on reading フク (fuku); no kun reading. Its kana こうふく (koufuku), happiness, is the commonest word the kanji stands for, 幸福 (koufuku), and is not yet a taught card. The on reading ふく (fuku) is also the kana of the taught card ふく (fuku), clothes, which is a different kanji and word, 服 (fuku). It is in 福祉 (fukushi), welfare."
  "ja-5906":
    native: "poem"
    notes:
      "n1": "詩 (shi): on reading シ (shi); no kun reading. Its kana し (shi), poem, is the word it stands for alone and is not yet a taught card. It is in 詩人 (shijin), poet. The same sound is the taught katakana letter card シ (shi), which is a different script; no taught hiragana letter card し (shi) exists, and this card is only the poem, 詩 (shi)."
  "ja-5907":
    native: "road; path"
    notes:
      "n1": "路 (douro): on reading ロ (ro); kun reading じ (ji). Its kana どうろ (douro), road, is the commonest word the kanji stands for, 道路 (douro), and is not yet a taught card. It is in 通路 (tsuuro), passage."
  "ja-5908":
    native: "agriculture; farming"
    notes:
      "n1": "農 (nouka): on reading ノウ (nou); no kun reading. Its kana のうか (nouka), farmer, is the commonest word the kanji stands for, 農家 (nouka), and is also the taught card のうか (nouka), the same word. It is in 農業 (nougyou), agriculture."
    examples:
      "ちちは農家です。": "My father is a farmer."
      "農家はたいへんです。": "Life on a farm is hard."
  "ja-5909":
    native: "iron"
    notes:
      "n1": "鉄 (tetsu): on reading テツ (tetsu); no kun reading. Its kana てつ (tetsu), iron, is the word it stands for alone and is not yet a taught card. It is in 地下鉄 (chikatetsu), subway."
    examples:
      "地下鉄でいきます。": "I go by subway."
      "地下鉄ははやいです。": "The subway is fast."
  "ja-5910":
    native: "appearance; a polite title for a person"
    notes:
      "n1": "様 (sama): on reading ヨウ (you); kun reading さま (sama). Its kana さま (sama), a very polite suffix, is the word it stands for in its kun reading and is also the taught card さま (sama), the same word. It is in お客様 (okyakusama), customer."
    examples:
      "お客様がきました。": "The customer came."
      "お客様はどこですか。": "Where is the customer?"
  "ja-5911":
    native: "green"
    notes:
      "n1": "緑 (midori): on reading リョク (ryoku), in limited use ロク (roku); kun reading みどり (midori). Its kana みどり (midori), green, is the word it stands for in its kun reading and is also the taught card みどり (midori), the same word. It is in 緑茶 (ryokucha), green tea."
    examples:
      "緑がすきです。": "I like green."
      "わたしのくるまは緑です。": "My car is green."
  "ja-5912":
    native: "practice; to train"
    notes:
      "n1": "練 (renshuu): on reading レン (ren); kun reading ね-る (ne-ru). Its kana れんしゅう (renshuu), practice, is the commonest word the kanji stands for, 練習 (renshuu), and is also the taught card れんしゅう (renshuu), the same word. It is in 熟練 (jukuren), skill."
    examples:
      "まいにち練習します。": "I practise every day."
      "練習はたいへんです。": "Practice is hard."
  "ja-5913":
    native: "silver"
    notes:
      "n1": "銀 (gin): on reading ギン (gin); no kun reading. Its kana ぎん (gin), silver, is the word it stands for alone and is not yet a taught card. It is in 銀行 (ginkou), bank."
    examples:
      "銀行はどこですか。": "Where is the bank?"
      "ともだちは銀行員です。": "My friend is a bank employee."
  "ja-5914":
    native: "station"
    notes:
      "n1": "駅 (eki): on reading エキ (eki); no kun reading. Its kana えき (eki), station, is the word it stands for alone and is also the taught card えき (eki), the same word. It is in 駅前 (ekimae), in front of the station."
    examples:
      "駅はちかいです。": "The station is near."
      "でんしゃで駅にいきます。": "I go to the station by train."
  "ja-5915":
    native: "nose"
    notes:
      "n1": "鼻 (hana): on reading ビ (bi); kun reading はな (hana). Its kana はな (hana), nose, is the word it stands for in its kun reading and is also the taught card はな (hana), the same word. The same kana is the taught letter card 花 (hana), flower, which is a different kanji and word. It is in 鼻水 (hanamizu), runny nose."
    examples:
      "鼻がいたいです。": "My nose hurts."
      "鼻水がでます。": "My nose is running."
  "ja-5916":
    native: "side; beside; horizontal"
    notes:
      "n1": "横 (yoko): on reading オウ (ou); kun reading よこ (yoko). Its kana よこ (yoko), side, is the word it stands for in its kun reading and is also the taught card よこ (yoko), the same word. It is in 横断 (oudan), crossing."
    examples:
      "えきの横にぎんこうがあります。": "There is a bank beside the station."
      "つくえの横にかばんがあります。": "There is a bag beside the desk."
  "ja-5917":
    native: "box"
    notes:
      "n1": "箱 (hako): no on reading; kun reading はこ (hako). Its kana はこ (hako), box, is the word it stands for in its kun reading and is also the taught card はこ (hako), the same word. It is in 宝箱 (takarabako), treasure chest."
    examples:
      "箱はおおきいです。": "The box is big."
      "箱のなかにペンがあります。": "There is a pen inside the box."
  "ja-5918":
    native: "tone; to investigate"
    notes:
      "n1": "調 (choushi): on reading チョウ (chou); kun readings しら-べる (shira-beru), ととの-う (totono-u) and ととの-える (totono-eru). Its kana ちょうし (choushi), condition or tone, is the commonest word the kanji stands for, 調子 (choushi), and is not yet a taught card. Its kun reading しら-べる (shira-beru) gives the taught card しらべ (shirabe), melody, written 調べ (shirabe). It is in 調整 (chousei), adjustment."
    examples:
      "調べはきれいです。": "The melody is beautiful."
      "うたの調べがすきです。": "I like the melody of the song."
  "ja-5919":
    native: "discuss; talk"
    notes:
      "n1": "談 (soudan): on reading ダン (dan); no kun reading. Its kana そうだん (soudan), consultation, is the commonest word the kanji stands for, 相談 (soudan), and is not yet a taught card. It is in 会談 (kaidan), talks."
  "ja-5920":
    native: "organise; arrange"
    notes:
      "n1": "整 (seiri): on reading セイ (sei); kun readings ととの-える (totono-eru) and ととの-う (totono-u). Its kana せいり (seiri), tidying up, is the commonest word the kanji stands for, 整理 (seiri), and is not yet a taught card. It is in 調整 (chousei), adjustment."
  "ja-5921":
    native: "bridge"
    notes:
      "n1": "橋 (hashi): on reading キョウ (kyou); kun reading はし (hashi). Its kana はし (hashi), bridge, is the word it stands for in its kun reading. The same kana is the taught card はし (hashi), chopsticks, which is a different word, 箸 (hashi), so this card is only the bridge. It is in 歩道橋 (hodoukyou), footbridge."
  "ja-5922":
    native: "medicine"
    notes:
      "n1": "薬 (kusuri): on reading ヤク (yaku); kun reading くすり (kusuri). Its kana くすり (kusuri), medicine, is the word it stands for in its kun reading and is also the taught card くすり (kusuri), the same word. It is in 薬局 (yakkyoku), pharmacy."
    examples:
      "薬をのみます。": "I take medicine."
      "目薬はたかいです。": "Eye drops are expensive."
  "ja-5923":
    native: "public building"
    notes:
      "n1": "館 (toshokan): on reading カン (kan); kun reading やかた (yakata). Its kana としょかん (toshokan), library, is the commonest word the kanji stands for, 図書館 (toshokan), and is also the taught card としょかん (toshokan), the same word. It is in 映画館 (eigakan), cinema."
    examples:
      "図書館にいきます。": "I go to the library."
      "体育館はおおきいです。": "The gym is big."
  "ja-5924":
    native: "topic; subject"
    notes:
      "n1": "題 (shukudai): on reading ダイ (dai); no kun reading. Its kana しゅくだい (shukudai), homework, is the commonest word the kanji stands for, 宿題 (shukudai), and is also the taught card しゅくだい (shukudai), the same word. It is in 話題 (wadai), topic. The same kana is the taught letter card 宿 (shukudai), lodging, which is a different kanji; this card is only 題 (shukudai)."
    examples:
      "宿題があります。": "I have homework."
      "宿題はむずかしいです。": "The homework is difficult."
