native: { code: "en", iso639_3: "eng", name: "English" }
name: "The plain forms: the dictionary form and ない (nai)"
description: "The plain forms are what friends use among themselves. The dictionary form is the plain present; ない (nai) makes it negative. An ichidan verb drops る (ru), a godan verb changes its last sound to the a-row, and する (suru) and くる (kuru) are irregular. Every verb a course deck teaches has a row. Not yet checked by a Japanese speaker: please report any mistake."
