schema: 1
id: "ja-en-describing"
kind: "layer"
core: "ja-describing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing things"
description: "Thirty-five words for describing things and people: new and old, hot and cold, delicious, difficult, busy, quiet, near and far, heavy and light. Adjectives are given in their plain form with です (desu). Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "ja-0462":
    native: "new"
    notes:
      "n1": "あたらしい (atarashii) means new. The opposite is ふるい (furui)."
    examples:
      "でんしゃはあたらしいです。":
        native: "The train is new."
        bases:
          "は":
            meaning: "(marks the topic)"
          "です":
            meaning: "is (polite)"
      "がっこうはあたらしいですか。":
        native: "Is the school new?"
        bases:
          "は":
            meaning: "(marks the topic)"
          "です":
            meaning: "is (polite)"
          "か":
            meaning: "(marks a question)"
