    explanation: "The potential form says that you can do something. An ichidan verb adds られる (rareru) to its stem: たべる (taberu) becomes {1}. A godan verb changes its last sound to the e-row: いく (iku) becomes {2}. する (suru) becomes {3} and くる (kuru) becomes {4}. The polite forms are shown."
