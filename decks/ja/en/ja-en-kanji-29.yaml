kind: "layer"
core: "ja-kanji-29"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 29: grade 5, part 5"
description: "Twenty-eight kanji of the fifth school grade, each taught by the kana reading of the word it stands for. Seven have no example yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-6620":
    native: "to set up; to provide"
    notes:
      "n1": "設 (moukeru): on reading セツ (setsu); kun reading もう-ける (mou-keru). Its kana もうける (moukeru), to set up; to provide, is the word it stands for in its kun reading, written 設ける (moukeru). No taught card has that kana. No taught card is written with 設 (setsu) using only taught kanji, so it has no example yet."
  "ja-6621":
    native: "to forgive; to permit"
    notes:
      "n1": "許 (yurusu): on reading キョ (kyo); kun reading ゆる-す (yuru-su). Its kana ゆるす (yurusu), to forgive; to permit, is the word it stands for in its kun reading, written 許す (yurusu). The taught card ゆるす (yurusu) is the same word, 許す (yurusu). The example uses the taught card きょか (kyoka), permission, written 許可 (kyoka), with the taught card たいせつ (taisetsu), important, written 大切 (taisetsu), and は (wa) and です (desu)."
    examples:
      "許可は大切です。": "Permission is important."
  "ja-6622":
    native: "poor"
    notes:
      "n1": "貧 (mazushii): on reading ヒン (hin) and ビン (bin); kun reading まず-しい (mazu-shii). Its kana まずしい (mazushii), poor, is the word it stands for in its kun reading, written 貧しい (mazushii). The taught card まずしい (mazushii) is the same word, 貧しい (mazushii). The example uses the taught card くに (kuni), country, written 国 (kuni), with は (wa) and です (desu)."
    examples:
      "国は貧しいです。": "The country is poor."
  "ja-6623":
    native: "to blame; to press"
    notes:
      "n1": "責 (semeru): on reading セキ (seki); kun reading せ-める (se-meru). Its kana せめる (semeru), to blame; to press, is the word it stands for in its kun reading, written 責める (semeru). No taught card has that kana. No taught card is written with 責 (seki) using only taught kanji, so it has no example yet."
  "ja-6624":
    native: "steep; rugged"
    notes:
      "n1": "険 (kewashii): on reading ケン (ken); kun reading けわ-しい (kewa-shii). Its kana けわしい (kewashii), steep; rugged, is the word it stands for in its kun reading, written 険しい (kewashii). No taught card has that kana. The example uses the taught card ほけん (hoken), insurance, written 保険 (hoken), where 保 (ho) is taught in kanji deck 27, now merged, with は (wa), 大切 (taisetsu), important, and です (desu). 危険 (kiken) would need 危 (ki), which is not yet taught."
    examples:
      "保険は大切です。": "Insurance is important."
  "ja-6625":
    native: "to prepare; to equip"
    notes:
      "n1": "備 (sonaeru): on reading ビ (bi); kun readings そな-える (sona-eru) and そな-わる (sona-waru). Its kana そなえる (sonaeru), to prepare; to equip, is the word it stands for in its kun reading, written 備える (sonaeru). No taught card has that kana. The example uses the taught card せいび (seibi), maintenance, written 整備 (seibi), with は (wa), 大切 (taisetsu), important, and です (desu)."
    examples:
      "整備は大切です。": "Maintenance is important."
  "ja-6626":
    native: "to be glad"
    notes:
      "n1": "喜 (yorokobu): on reading キ (ki); kun reading よろこ-ぶ (yoroko-bu). Its kana よろこぶ (yorokobu), to be glad, is the word it stands for in its kun reading, written 喜ぶ (yorokobu). The taught card よろこぶ (yorokobu) is the same word, 喜ぶ (yorokobu). The examples use the taught card よろこび (yorokobi), joy, written 喜び (yorokobi), the taught card ともだち (tomodachi), friend, written 友達 (tomodachi), and the masu form of よろこぶ (yorokobu)."
    examples:
      "喜びは大きいです。": "Joy is great."
      "友達は喜びます。": "My friend is glad."
  "ja-6627":
    native: "to run; to manage"
    notes:
      "n1": "営 (itonamu): on reading エイ (ei); kun reading いとな-む (itona-mu). Its kana いとなむ (itonamu), to run; to manage, is the word it stands for in its kun reading, written 営む (itonamu). No taught card has that kana. The example uses the taught card えいぎょう (eigyou), business hours; operation, written 営業 (eigyou), with は (wa), 大切 (taisetsu), important, and です (desu)."
    examples:
      "営業は大切です。": "Business operations are important."
  "ja-6628":
    native: "to reward; to repay"
    notes:
      "n1": "報 (mukuiru): on reading ホウ (hou); kun reading むく-いる (muku-iru). Its kana むくいる (mukuiru), to reward; to repay, is the word it stands for in its kun reading, written 報いる (mukuiru). No taught card has that kana. The example uses the taught card ほうこく (houkoku), report, written 報告 (houkoku), with は (wa), 大切 (taisetsu), important, and です (desu)."
    examples:
      "報告は大切です。": "Reports are important."
  "ja-6629":
    native: "to belong to"
    notes:
      "n1": "属 (zokusuru): on reading ゾク (zoku); no kun reading. It is not a word on its own, so its kana ぞくする (zokusuru), to belong to, is the commonest word it begins, written 属する (zokusuru). No taught card has that kana. No taught card is written with 属 (zoku) using only taught kanji, so it has no example yet."
  "ja-6630":
    native: "review"
    notes:
      "n1": "復 (fukushuu): on reading フク (fuku); no kun reading. It is not a word on its own, so its kana ふくしゅう (fukushuu), review, is the commonest word it begins, written 復習 (fukushuu). No taught card has that kana. The example uses the taught card かいふく (kaifuku), recovery, written 回復 (kaifuku), and the taught card びょうき (byouki), illness, written 病気 (byouki), with は (wa) and the past masu form of 回復 (kaifuku)."
    examples:
      "病気は回復しました。": "The illness has recovered."
  "ja-6631":
    native: "to carry in the hand"
    notes:
      "n1": "提 (sageru): on reading テイ (tei); kun reading さ-げる (sa-geru). Its kana さげる (sageru), to carry in the hand, is the word it stands for in its kun reading, written 提げる (sageru). No taught card has that kana. The example uses the taught card ていあん (teian), proposal, written 提案 (teian), with は (wa), and いい (ii), good, which is the kana of the taught kanji card 良 (ii), and です (desu)."
    examples:
      "提案はいいです。": "The proposal is good."
  "ja-6632":
    native: "test; examination"
    notes:
      "n1": "検 (kensa): on reading ケン (ken); no kun reading. It is not a word on its own, so its kana けんさ (kensa), test; examination, is the commonest word it begins, written 検査 (kensa). The taught card けんさ (kensa) is the same word, 検査 (kensa). The example uses the taught card てんけん (tenken), inspection; check, written 点検 (tenken), with むずかしい (muzukashii), difficult, written in kana because 難 (nan) is not yet taught."
    examples:
      "点検はむずかしいです。": "Inspection is difficult."
  "ja-6633":
    native: "to decrease"
    notes:
      "n1": "減 (heru): on reading ゲン (gen); kun readings へ-る (he-ru) and へ-らす (he-rasu). Its kana へる (heru), to decrease, is the word it stands for in its kun reading, written 減る (heru). The taught card へる (heru) is the same word, 減る (heru). The taught kanji card 経 (heru), to pass through, from kanji deck 28, now merged, is a different word with the same reading. The example uses the taught card たいじゅう (taijuu), body weight, written 体重 (taijuu), with は (wa) and the masu form of へる (heru)."
    examples:
      "体重は減ります。": "Body weight goes down."
  "ja-6634":
    native: "to measure; to survey"
    notes:
      "n1": "測 (hakaru): on reading ソク (soku); kun reading はか-る (haka-ru). Its kana はかる (hakaru), to measure; to survey, is the word it stands for in its kun reading, written 測る (hakaru). The taught kanji card 計 (hakaru), to measure; to plan, uses the same reading for a different word, 計る (hakaru). The example uses the taught card たいじゅう (taijuu), body weight, written 体重 (taijuu), with を (o) and the masu form of はかる (hakaru)."
    examples:
      "体重を測ります。": "I weigh myself."
  "ja-6635":
    native: "degree; extent"
    notes:
      "n1": "程 (hodo): on reading テイ (tei); kun reading ほど (hodo). Its kana ほど (hodo), degree; extent, is the word it stands for in its kun reading, written 程 (hodo). No taught card has that kana. The example uses the taught card にってい (nittei), schedule; itinerary, written 日程 (nittei), with は (wa), 大切 (taisetsu), important, and です (desu)."
    examples:
      "日程は大切です。": "The schedule is important."
  "ja-6636":
    native: "tax"
    notes:
      "n1": "税 (zei): on reading ゼイ (zei); no kun reading. Its kana ぜい (zei), tax, is the word it stands for alone, written 税 (zei). The taught card ぜい (zei) is the same word, 税 (zei). The example uses the taught card ぜいきん (zeikin), tax, written 税金 (zeikin), with は (wa), and the taught card たかい (takai), high, written 高い (takai), and です (desu)."
    examples:
      "税金は高いです。": "Taxes are high."
  "ja-6637":
    native: "to rule; to govern"
    notes:
      "n1": "統 (suberu): on reading トウ (tou); kun reading す-べる (su-beru). Its kana すべる (suberu), to rule; to govern, is the word it stands for in its kun reading, written 統べる (suberu). No taught card has that kana. The example uses the taught card でんとう (dentou), tradition, written 伝統 (dentou), with は (wa), 大切 (taisetsu), important, and です (desu)."
    examples:
      "伝統は大切です。": "Tradition is important."
  "ja-6638":
    native: "to die out; to cease"
    notes:
      "n1": "絶 (taeru): on reading ゼツ (zetsu); kun readings た-える (tae-ru), た-やす (ta-yasu) and た-つ (ta-tsu). Its kana たえる (taeru), to die out; to cease, is the word it stands for in its kun reading, written 絶える (taeru). No taught card has that kana. No taught card is written with 絶 (zetsu) using only taught kanji, so it has no example yet."
  "ja-6639":
    native: "proof"
    notes:
      "n1": "証 (shoumei): on reading ショウ (shou); no kun reading. It is not a word on its own, so its kana しょうめい (shoumei), proof, is the commonest word it begins, written 証明 (shoumei). No taught card has that kana. The example uses the taught card しょうめいしょ (shoumeisho), certificate, written 証明書 (shoumeisho), with は (wa), the taught word card ひつよう (hitsuyou), necessary, written 必要 (hitsuyou), and です (desu)."
    examples:
      "証明書は必要です。": "A certificate is necessary."
  "ja-6640":
    native: "reputation"
    notes:
      "n1": "評 (hyouban): on reading ヒョウ (hyou); no kun reading. It is not a word on its own, so its kana ひょうばん (hyouban), reputation, is the commonest word it begins, written 評判 (hyouban). No taught card has that kana. No taught card is written with 評 (hyou) using only taught kanji, so it has no example yet."
  "ja-6641":
    native: "elephant"
    notes:
      "n1": "象 (zou): on readings ショウ (shou) and ゾウ (zou); no kun reading. It stands alone for elephant, in its on reading ゾウ (zou), written 象 (zou). The taught card ぞう (zou) is the same word, 象 (zou). The example uses that card, with は (wa), the taught card おおきい (ookii), big, written 大きい (ookii), and です (desu)."
    examples:
      "象は大きいです。": "Elephants are big."
  "ja-6642":
    native: "savings"
    notes:
      "n1": "貯 (chokin): on reading チョ (cho); no kun reading. It is not a word on its own, so its kana ちょきん (chokin), savings, is the commonest word it begins, written 貯金 (chokin). No taught card has that kana. No taught card is written with 貯 (cho) using only taught kanji, so it has no example yet."
  "ja-6643":
    native: "to lend"
    notes:
      "n1": "貸 (kasu): on reading タイ (tai); kun reading か-す (ka-su). Its kana かす (kasu), to lend, is the word it stands for in its kun reading, written 貸す (kasu). No taught card has that kana. No taught card is written with 貸 (tai) using only taught kanji, so it has no example yet."
  "ja-6644":
    native: "to spend"
    notes:
      "n1": "費 (tsuiyasu): on reading ヒ (hi); kun readings つい-やす (tsui-yasu) and つい-える (tsui-eru). Its kana ついやす (tsuiyasu), to spend, is the word it stands for in its kun reading, written 費やす (tsuiyasu). No taught card has that kana. The example uses the taught card かいひ (kaihi), membership fee, written 会費 (kaihi), with は (wa), and the taught card たかい (takai), high, written 高い (takai), and です (desu)."
    examples:
      "会費は高いです。": "The membership fee is high."
  "ja-6645":
    native: "trade"
    notes:
      "n1": "貿 (boueki): on reading ボウ (bou); no kun reading. It is not a word on its own, so its kana ぼうえき (boueki), trade, is the commonest word it begins, written 貿易 (boueki). The taught card ぼうえき (boueki) is the same word, 貿易 (boueki). The example uses it, with は (wa) and むずかしい (muzukashii), difficult, written in kana because 難 (nan) is not yet taught."
    examples:
      "貿易はむずかしいです。": "Trade is difficult."
  "ja-6646":
    native: "to pass; to exceed"
    notes:
      "n1": "過 (sugiru): on reading カ (ka); kun readings す-ぎる (su-giru), す-ごす (su-gosu), あやま-つ (ayama-tsu) and あやま-ち (ayama-chi). Its kana すぎる (sugiru), to pass; to exceed, is the word it stands for in its kun reading, written 過ぎる (sugiru). The taught card すぎる (sugiru) is the same word, 過ぎる (sugiru). The example uses the taught card はる (haru), spring, written 春 (haru), with は (wa) and the past masu form of 過ぎる (sugiru)."
    examples:
      "春は過ぎました。": "Spring has passed."
  "ja-6647":
    native: "force; momentum"
    notes:
      "n1": "勢 (ikioi): on reading セイ (sei); kun reading いきお-い (ikio-i). Its kana いきおい (ikioi), force; momentum, is the word it stands for in its kun reading, written 勢い (ikioi). No taught card has that kana. The example uses the taught card おおぜい (oozei), a lot of people, written 大勢 (oozei), with は (wa) and the taught kanji card 来 (kuru), come, written 来ました (kimashita)."
    examples:
      "大勢は来ました。": "A lot of people came."
