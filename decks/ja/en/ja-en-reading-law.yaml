  - "id": "ja-law-2"
    "title": "Rights and duties"
    "sentences":
      - "text": "わたしたちには、じんけんが あります。"
        "reading": "watashitachi ni wa, jinken ga arimasu."
      - "text": "けんりを まもるのは、ぎむでもあります。"
        "reading": "kenri o mamoru no wa, gimu demo arimasu."
      - "text": "でも、こうつういはんは きんじられています。"
        "reading": "demo, koutsu ihan wa kinjirarete imasu."
