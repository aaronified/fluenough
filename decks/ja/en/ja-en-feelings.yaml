"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Feelings"
"description": "Feelings: 55 words for moods and emotions, how the heart beats, what one hopes for and what one dislikes, with the sounds of feeling. Not yet checked by a Japanese speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "beginner"
- "unreviewed"
"cards":
  "ja-2758":
    "native": "feeling"
    "notes":
      "n1": "kimochi is a feeling, the way you feel inside. It is written 気持ち (kimochi)."
    "examples":
      "きもちがいいです。":
        "native": "The feeling is good."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "わたしのきもちをつたえてください。":
        "native": "Please tell me your feelings."
        "bases":
          "つたえて":
            "meaning": "convey; to tell (te-form)"
          "ください":
            "meaning": "(please give)"
  "ja-2759":
    "native": "heart; mind"
    "notes":
      "n1": "kokoro is the heart or the mind, the inner self. It is written 心 (kokoro)."
    "examples":
      "こころがあたたかいです。":
        "native": "Your heart is warm."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "わたしはこころからありがとうといいます。":
        "native": "I say thank you from my heart."
        "bases":
          "から":
            "meaning": "from"
          "ありがとう":
            "meaning": "thank you"
          "いいます":
            "meaning": "say (polite)"
  "ja-2760":
    "native": "happy"
    "notes":
      "n1": "shiawase means happy, feeling well and content. It is written 幸せ (shiawase) and is a na-adjective (shiawase na)."
    "examples":
      "わたしはしあわせです。":
        "native": "I am happy."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "しあわせなかぞくです。":
        "native": "It is a happy family."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2761":
    "native": "unhappy"
    "notes":
      "n1": "fushiawase means unhappy, not feeling well and content. It is written 不幸せ (fushiawase)."
    "examples":
      "ふしあわせなひとです。":
        "native": "They are an unhappy person."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "わたしはふしあわせではありません。":
        "native": "I am not unhappy."
        "bases":
          "では":
            "meaning": "not (with the negative)"
          "ありません":
            "meaning": "there is not (polite)"
  "ja-2762":
    "native": "unfortunate"
    "notes":
      "n1": "fukou means unfortunate, not lucky. It is written 不幸 (fukou) and is a na-adjective (fukou na)."
    "examples":
      "ふこうなじこでした。":
        "native": "It was an unfortunate accident."
        "bases":
          "でした":
            "meaning": "was (polite)"
      "ふこうなことがありました。":
        "native": "Something unfortunate happened."
        "bases":
          "こと":
            "meaning": "thing; matter"
          "ありました":
            "meaning": "there was; happened (polite)"
  "ja-2763":
    "native": "happiness"
    "notes":
      "n1": "koufuku is happiness, a deep and lasting sense of well-being. It is written 幸福 (koufuku)."
    "examples":
      "こうふくをさがします。":
        "native": "I look for happiness."
        "bases":
          "さがします":
            "meaning": "look for; to search (polite)"
      "かぞくのこうふくがいちばんです。":
        "native": "The family's happiness is the most important."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2764":
    "native": "joy"
    "notes":
      "n1": "yorokobi is joy, the feeling of being glad. It is written 喜び (yorokobi)."
    "examples":
      "おおきいよろこびです。":
        "native": "It is a great joy."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "ともだちのよろこびをかんじます。":
        "native": "I feel my friend's joy."
        "bases":
          "かんじます":
            "meaning": "feel (polite)"
  "ja-2765":
    "native": "sadness"
    "notes":
      "n1": "kanashimi is sadness, the feeling of grief. It is written 悲しみ (kanashimi)."
    "examples":
      "かなしみがつよいです。":
        "native": "The sadness is strong."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "かなしみをわかちます。":
        "native": "We share our sadness."
        "bases":
          "わかちます":
            "meaning": "share (polite)"
  "ja-2766":
    "native": "anger"
    "notes":
      "n1": "ikari is anger, a strong feeling of being angry. It is written 怒り (ikari)."
    "examples":
      "いかりをがまんします。":
        "native": "I hold back my anger."
        "bases":
          "します":
            "meaning": "do (polite)"
      "いかりをあらわします。":
        "native": "I show my anger."
        "bases":
          "あらわします":
            "meaning": "show; express (polite)"
  "ja-2767":
    "native": "surprise"
    "notes":
      "n1": "odoroki is surprise, the feeling of being startled. It is written 驚き (odoroki)."
    "examples":
      "おどろきがおおきいです。":
        "native": "The surprise is great."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "おどろきのニュースでした。":
        "native": "It was surprising news."
        "bases":
          "ニュース":
            "meaning": "news"
          "でした":
            "meaning": "was (polite)"
  "ja-2768":
    "native": "to be surprised"
    "notes":
      "n1": "odoroku means to be surprised. It is written 驚く (odoroku), and is a godan verb."
    "examples":
      "わたしはとてもおどろきました。":
        "native": "I was very surprised."
        "bases":
          "おどろきました":
            "meaning": "be surprised (polite past)"
      "わたしはニュースにおどろきます。":
        "native": "I am surprised at the news."
        "bases":
          "ニュース":
            "meaning": "news"
          "おどろきます":
            "meaning": "be surprised (polite)"
  "ja-2769":
    "native": "to be glad"
    "notes":
      "n1": "yorokobu means to be glad. It is written 喜ぶ (yorokobu), and is a godan verb."
    "examples":
      "ともだちはよろこびました。":
        "native": "My friend was glad."
        "bases":
          "よろこびました":
            "meaning": "be glad (polite past)"
      "わたしはあなたのせいこうをよろこびます。":
        "native": "I am glad of your success."
        "bases":
          "せいこう":
            "meaning": "success"
          "よろこびます":
            "meaning": "be glad (polite)"
  "ja-2770":
    "native": "to grieve"
    "notes":
      "n1": "kanashimu means to grieve, to feel sad. It is written 悲しむ (kanashimu), and is a godan verb."
    "examples":
      "ひとはしんでかなしみました。":
        "native": "People grieved at the death."
        "bases":
          "しんで":
            "meaning": "died (te-form)"
          "かなしみました":
            "meaning": "grieve (polite past)"
      "かぞくはかなしんでいます。":
        "native": "The family is grieving."
        "bases":
          "かなしんで":
            "meaning": "grieve (te-form)"
          "います":
            "meaning": "there is (polite)"
  "ja-2771":
    "native": "to worry; to be troubled"
    "notes":
      "n1": "nayamu means to worry, to be troubled. It is written 悩む (nayamu), and is a godan verb."
    "examples":
      "わたしはしごとでなやんでいます。":
        "native": "I am troubled by my work."
        "bases":
          "なやんで":
            "meaning": "worry; to be troubled (te-form)"
          "います":
            "meaning": "there is (polite)"
      "なやんだときはともだちにはなします。":
        "native": "When I am troubled, I talk to a friend."
        "bases":
          "なやんだ":
            "meaning": "worry; to be troubled (past)"
          "はなします":
            "meaning": "talk (polite)"
  "ja-2772":
    "native": "to panic; to be flustered"
    "notes":
      "n1": "awateru means to panic, to be flustered. It is written 慌てる (awateru), and is an ichidan verb."
    "examples":
      "あわててでかけました。":
        "native": "I went out in a flurry."
        "bases":
          "あわてて":
            "meaning": "panic; to be flustered (te-form)"
          "でかけました":
            "meaning": "go out (polite past)"
      "あわてないでください。":
        "native": "Please do not panic."
        "bases":
          "あわてないで":
            "meaning": "panic; to be flustered (without doing)"
          "ください":
            "meaning": "(please give)"
  "ja-2773":
    "native": "to be impatient; to rush"
    "notes":
      "n1": "aseru means to be impatient, to rush. It is written 焦る (aseru), and is a godan verb."
    "examples":
      "あせらないでください。":
        "native": "Please do not rush."
        "bases":
          "あせらないで":
            "meaning": "be impatient; to rush (without doing)"
          "ください":
            "meaning": "(please give)"
      "あせってしごとをしました。":
        "native": "I rushed the work."
        "bases":
          "あせって":
            "meaning": "be impatient; to rush (te-form)"
          "しました":
            "meaning": "did (polite)"
  "ja-2774":
    "native": "to calm down"
    "notes":
      "n1": "ochitsuku means to calm down, to become calm. It is written 落ち着く (ochitsuku) (ochitsuku), and is a godan verb."
    "examples":
      "おちついてください。":
        "native": "Please calm down."
        "bases":
          "おちついて":
            "meaning": "calm down (te-form)"
          "ください":
            "meaning": "(please give)"
      "へやはおちつきます。":
        "native": "The room is calming."
        "bases":
          "おちつきます":
            "meaning": "calm down (polite)"
  "ja-2775":
    "native": "nervousness; tension"
    "notes":
      "n1": "kinchou is nervousness or tension before something. It is written 緊張 (kinchou)."
    "examples":
      "きんちょうをしました。":
        "native": "I felt nervous."
        "bases":
          "しました":
            "meaning": "did (polite)"
      "きんちょうがとけました。":
        "native": "The tension melted away."
        "bases":
          "とけました":
            "meaning": "melted (polite)"
  "ja-2776":
    "native": "heart pounding"
    "notes":
      "n1": "dokidoki is the sound of a heart pounding, with fear or excitement. It is written only in kana."
    "examples":
      "しんぞうがどきどきします。":
        "native": "My heart is pounding."
        "bases":
          "します":
            "meaning": "do (polite)"
      "まえにどきどきしました。":
        "native": "My heart was pounding before."
        "bases":
          "しました":
            "meaning": "did (polite)"
  "ja-2777":
    "native": "excited; thrilled"
    "notes":
      "n1": "wakuwaku is the feeling of being excited about something to come. It is written only in kana."
    "examples":
      "たびがわくわくします。":
        "native": "I feel excited about the trip."
        "bases":
          "します":
            "meaning": "do (polite)"
      "こどもはわくわくしています。":
        "native": "The children are excited."
        "bases":
          "しています":
            "meaning": "do (is doing (polite))"
  "ja-2778":
    "native": "irritated"
    "notes":
      "n1": "iraira is the feeling of being irritated and impatient. It is written only in kana."
    "examples":
      "いらいらしています。":
        "native": "I am irritated."
        "bases":
          "して":
            "meaning": "do (te-form)"
          "います":
            "meaning": "there is (polite)"
      "まつのはいらいらします。":
        "native": "Waiting makes me irritated."
        "bases":
          "します":
            "meaning": "do (polite)"
  "ja-2779":
    "native": "on edge; anxious"
    "notes":
      "n1": "harahara is the feeling of being on edge, watching something risky. It is written only in kana."
    "examples":
      "はらはらしてみていました。":
        "native": "I watched anxiously."
        "bases":
          "して":
            "meaning": "do (te-form)"
          "みて":
            "meaning": "see; to look at; to watch (te-form)"
          "いました":
            "meaning": "was (polite)"
      "はらはらするはなしです。":
        "native": "It is a story that keeps you on edge."
        "bases":
          "はなし":
            "meaning": "talk"
          "です":
            "meaning": "(to be, polite)"
  "ja-2780":
    "native": "relieved"
    "notes":
      "n1": "hotto is the feeling of relief after worry. It is written only in kana."
    "examples":
      "ほっとしました。":
        "native": "I was relieved."
        "bases":
          "しました":
            "meaning": "did (polite)"
      "しけんがおわってほっとしました。":
        "native": "The exam was over and I was relieved."
        "bases":
          "おわって":
            "meaning": "end; to finish (te-form)"
          "しました":
            "meaning": "did (polite)"
  "ja-2781":
    "native": "disappointed"
    "notes":
      "n1": "gakkari is the feeling of being disappointed. It is written only in kana."
    "examples":
      "がっかりしました。":
        "native": "I was disappointed."
        "bases":
          "しました":
            "meaning": "did (polite)"
      "けっかにがっかりです。":
        "native": "I am disappointed with the result."
        "bases":
          "けっか":
            "meaning": "result"
          "です":
            "meaning": "(to be, polite)"
  "ja-2782":
    "native": "startled"
    "notes":
      "n1": "bikkuri is the feeling of being startled, a sudden surprise. It is written only in kana."
    "examples":
      "びっくりしました。":
        "native": "I was startled."
        "bases":
          "しました":
            "meaning": "did (polite)"
      "おとにびっくりしました。":
        "native": "I was startled by the sound."
        "bases":
          "しました":
            "meaning": "did (polite)"
  "ja-2783":
    "native": "enchanted"
    "notes":
      "n1": "uttori is the feeling of being enchanted, lost in admiration. It is written only in kana."
    "examples":
      "うっとりみています。":
        "native": "I am gazing enchanted."
        "bases":
          "みて":
            "meaning": "see; to look at; to watch (te-form)"
          "います":
            "meaning": "there is (polite)"
      "うたにうっとりしました。":
        "native": "I was enchanted by the song."
        "bases":
          "しました":
            "meaning": "did (polite)"
  "ja-2784":
    "native": "dejected"
    "notes":
      "n1": "shonbori is looking sad and dejected, with the head down. It is written only in kana."
    "examples":
      "しょんぼりしています。":
        "native": "He looks dejected."
        "bases":
          "して":
            "meaning": "do (te-form)"
          "います":
            "meaning": "there is (polite)"
      "こどもがしょんぼりかえりました。":
        "native": "The child went home dejected."
        "bases":
          "かえりました":
            "meaning": "return home; to go home (polite past)"
  "ja-2785":
    "native": "brooding; fretting"
    "notes":
      "n1": "kuyokuyo is brooding and fretting over small things. It is written only in kana."
    "examples":
      "くよくよしないでください。":
        "native": "Please do not brood."
        "bases":
          "しないで":
            "meaning": "do not (te-form, negative)"
          "ください":
            "meaning": "(please give)"
      "しっぱいにくよくよしています。":
        "native": "I am fretting over the mistake."
        "bases":
          "しっぱい":
            "meaning": "failure"
          "して":
            "meaning": "do (te-form)"
          "います":
            "meaning": "there is (polite)"
  "ja-2786":
    "native": "relaxed; leisurely"
    "notes":
      "n1": "nonbiri is being relaxed and taking one's time. It is written only in kana."
    "examples":
      "のんびりすごします。":
        "native": "I spend the time relaxing."
        "bases":
          "すごします":
            "meaning": "spend (polite)"
      "しゅうまつはのんびりです。":
        "native": "The weekend is relaxed."
        "bases":
          "しゅうまつ":
            "meaning": "weekend"
          "です":
            "meaning": "(to be, polite)"
  "ja-2787":
    "native": "expectation; hope"
    "notes":
      "n1": "kitai is expectation, hope for something good. It is written 期待 (kitai)."
    "examples":
      "きたいがおおきいです。":
        "native": "The expectation is high."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "しけんのけっかにきたいをします。":
        "native": "I have hopes for the exam result."
        "bases":
          "けっか":
            "meaning": "result"
          "します":
            "meaning": "do (polite)"
  "ja-2788":
    "native": "dissatisfaction"
    "notes":
      "n1": "fuman is dissatisfaction, a feeling that something is not enough. It is written 不満 (fuman)."
    "examples":
      "ふまんがあります。":
        "native": "I am dissatisfied."
        "bases":
          "あります":
            "meaning": "there is (polite)"
      "ふまんをいいます。":
        "native": "I voice my complaint."
        "bases":
          "いいます":
            "meaning": "say (polite)"
  "ja-2789":
    "native": "regret"
    "notes":
      "n1": "koukai is regret for something done. It is written 後悔 (koukai)."
    "examples":
      "こうかいはしません。":
        "native": "I do not regret it."
        "bases":
          "しません":
            "meaning": "do (polite negative)"
      "わたしはすこしこうかいしています。":
        "native": "I have some regret."
        "bases":
          "して":
            "meaning": "do (te-form)"
          "います":
            "meaning": "there is (polite)"
  "ja-2790":
    "native": "trust"
    "notes":
      "n1": "shinrai is trust, believing that someone is reliable. It is written 信頼 (shinrai)."
    "examples":
      "しんらいがだいじです。":
        "native": "Trust is important."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "ともだちのしんらいをえます。":
        "native": "I earn my friend's trust."
        "bases":
          "えます":
            "meaning": "earn; get (polite)"
  "ja-2791":
    "native": "gratitude"
    "notes":
      "n1": "kansha is gratitude, thanks felt in the heart. It is written 感謝 (kansha)."
    "examples":
      "あなたへのかんしゃです。":
        "native": "It is my gratitude to you."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "かんしゃをあらわします。":
        "native": "I express my gratitude."
        "bases":
          "あらわします":
            "meaning": "show; express (polite)"
  "ja-2792":
    "native": "affection"
    "notes":
      "n1": "aijou is affection, warm love between people. It is written 愛情 (aijou)."
    "examples":
      "こどもへのあいじょうがあります。":
        "native": "I have affection for the children."
        "bases":
          "あります":
            "meaning": "there is (polite)"
      "あいじょうをしめします。":
        "native": "I show my affection."
        "bases":
          "しめします":
            "meaning": "show (polite)"
  "ja-2793":
    "native": "love"
    "notes":
      "n1": "ai is love, the deep feeling for a person. It is written 愛 (ai)."
    "examples":
      "あいはだいじです。":
        "native": "Love is important."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "かぞくのあいをかんじます。":
        "native": "I feel my family's love."
        "bases":
          "かんじます":
            "meaning": "feel (polite)"
  "ja-2794":
    "native": "to dislike; to hate"
    "notes":
      "n1": "kirau means to dislike, to hate. It is written 嫌う (kirau), and is a godan verb."
    "examples":
      "わたしはむしをきらいます。":
        "native": "I dislike insects."
        "bases":
          "きらいます":
            "meaning": "dislike; to hate (polite)"
      "かれはうそをきらいます。":
        "native": "He hates lies."
        "bases":
          "うそ":
            "meaning": "lie"
          "きらいます":
            "meaning": "dislike; to hate (polite)"
  "ja-2795":
    "native": "to love"
    "notes":
      "n1": "aisuru means to love. It is written 愛する (aisuru), and is a verb of する."
    "examples":
      "わたしはかぞくをあいしています。":
        "native": "I love my family."
        "bases":
          "あいして":
            "meaning": "love (te-form)"
          "います":
            "meaning": "there is (polite)"
      "ひとをあいします。":
        "native": "I love people."
        "bases":
          "あいします":
            "meaning": "love (polite)"
  "ja-2796":
    "native": "to hate"
    "notes":
      "n1": "nikumu means to hate, a strong dislike. It is written 憎む (nikumu), and is a godan verb."
    "examples":
      "かれはじぶんをにくんでいました。":
        "native": "He hated himself."
        "bases":
          "にくんで":
            "meaning": "hate (te-form)"
          "いました":
            "meaning": "was (polite)"
      "ひとをにくみません。":
        "native": "I do not hate people."
        "bases":
          "にくみません":
            "meaning": "hate (polite negative)"
  "ja-2797":
    "native": "to envy"
    "notes":
      "n1": "netamu means to envy, to be jealous of someone's good fortune. It is written 妬む (netamu), and is a godan verb."
    "examples":
      "ともだちのせいこうをねたみません。":
        "native": "I do not envy my friend's success."
        "bases":
          "せいこう":
            "meaning": "success"
          "ねたみません":
            "meaning": "envy (polite negative)"
      "かれはわたしをねたんでいます。":
        "native": "He envies me."
        "bases":
          "ねたんで":
            "meaning": "envy (te-form)"
          "います":
            "meaning": "there is (polite)"
  "ja-2798":
    "native": "to resent"
    "notes":
      "n1": "uramu means to resent, to hold a grudge against someone. It is written 恨む (uramu), and is a godan verb."
    "examples":
      "かれをうらんでいます。":
