"cards":
  "ja-2740":
    "native": "Treatment is done at the hospital."
    "notes":
      "n1": "A noun such as ちりょう (chiryou), treatment, takes します (shimasu) directly to make a verb."
    "bases":
      "します":
        "meaning": "do (polite)"
    "confusables":
      "w1":
        "why": "surgery, not treatment"
      "w2":
        "why": "prevention, not treatment"
  "ja-2741":
    "native": "I am not getting enough sleep."
    "bases":
      "たりません":
        "meaning": "is not enough (polite)"
    "confusables":
      "w1":
        "why": "calorie, not sleep"
      "w2":
        "why": "stress, not sleep"
  "ja-2742":
    "native": "Please show your insurance card."
    "bases":
      "だして":
        "meaning": "hand in (te-form)"
      "ください":
        "meaning": "(please give)"
    "confusables":
      "w1":
        "why": "health insurance, not the card"
      "w2":
        "why": "insurance, not the card"
  "ja-2743":
    "native": "Where is the dermatology department?"
    "notes":
      "n1": "科 (ka) is the suffix for a medical department: ひふか (hifuka), dermatology, from ひふ (hifu), skin."
    "bases":
      "ですか":
        "meaning": "is (question)"
    "confusables":
      "w1":
        "why": "eye clinic, not skin"
      "w2":
        "why": "dentistry, not skin"
  "ja-2744":
    "native": "My weight has gone up."
    "notes":
      "n1": "ふえる (fueru), to increase, has no object: the thing that increases is the subject, marked with が (ga)."
    "bases":
      "ふえました":
        "meaning": "increased (polite)"
    "confusables":
      "w1":
        "why": "height, not weight"
      "w2":
        "why": "stamina, not weight"
  "ja-2745":
    "native": "Rest is needed."
    "bases":
      "です":
        "meaning": "(to be, polite)"
    "confusables":
      "w1":
        "why": "sleep, not rest"
      "w2":
        "why": "recovery, not rest"
  "ja-2746":
    "native": "Please stop smoking."
    "notes":
      "n1": "やめる (yameru), to stop, takes を (o) for what is stopped: たばこを (tabako o). Its te form is やめて (yamete)."
    "bases":
      "やめて":
        "meaning": "stop (te-form)"
      "ください":
        "meaning": "(please give)"
    "confusables":
      "w1":
        "why": "drinking, not smoking"
      "w2":
        "why": "no smoking, not stopping"
  "ja-2747":
    "native": "The patients are waiting."
    "bases":
      "まって":
        "meaning": "wait (te-form)"
      "います":
        "meaning": "there is (polite)"
    "confusables":
      "w1":
        "why": "nursing, not patients"
      "w2":
        "why": "clinic, not patients"
  "ja-2748":
    "native": "I take vitamins."
    "bases":
      "とります":
        "meaning": "take (polite)"
    "confusables":
      "w1":
        "why": "nutrition, not vitamins"
      "w2":
        "why": "balance, not vitamins"
  "ja-2749":
    "native": "I am troubled by insomnia."
    "bases":
      "なやんで":
        "meaning": "worry (te-form)"
      "います":
        "meaning": "there is (polite)"
    "confusables":
      "w1":
        "why": "sleep, not insomnia"
      "w2":
        "why": "lack of sleep, not insomnia"
  "ja-2750":
    "native": "My condition has improved."
    "notes":
      "n1": "よい (yoi), good, becomes よく (yoku) before なる (naru): よくなりました (yokunarimashita)."
    "bases":
      "よくなりました":
        "meaning": "improved (polite)"
    "confusables":
      "w1":
        "why": "blood pressure, not condition"
      "w2":
        "why": "pulse, not condition"
  "ja-2751":
    "native": "I prevent illness with a vaccine."
    "notes":
      "n1": "で (de) marks the means: ワクチンで (wakuchin de), by a vaccine."
    "bases":
      "します":
        "meaning": "do (polite)"
    "confusables":
      "w1":
        "why": "treatment, not prevention"
      "w2":
        "why": "surgery, not prevention"
