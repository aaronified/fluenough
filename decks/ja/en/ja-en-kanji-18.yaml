name: "Kanji 18: grade 4, part 1"
description: "Twenty-nine kanji of the fourth school grade, each taught by the kana reading of the word it stands for. Some have one example or none yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-5960":
    native: "Not, a negative prefix."
    notes:
      "n1": "不 (fuben): on readings フ (fu) and ブ (bu); no kun reading. Its kana ふべん (fuben), inconvenience, is a common word it begins and is not yet a taught card. It is in 不安 (fuan), anxiety, which uses the on reading フ (fu). No taught word uses it, so it has no example yet."
  "ja-5961":
    native: "Well, a shaft dug for water."
    notes:
      "n1": "井 (ido): on reading セイ (sei), in limited use ショウ (shou); kun reading い (i). Its kana いど (ido), well, is the word it stands for alone and is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-5962":
    native: "Husband."
    notes:
      "n1": "夫 (otto): on reading フ (fu), in limited use フウ (fuu); kun reading おっと (otto). Its kana おっと (otto), husband, is the word it stands for alone and is also the taught card おっと (otto), the same word. It is in 夫人 (fujin), a polite word for a wife, which uses the on reading フ (fu)."
    examples:
      "夫はテニスがすきです。": "My husband likes tennis."
      "夫はかいしゃにいきます。": "My husband goes to the office."
  "ja-5963":
    native: "Lack; to be missing."
    notes:
      "n1": "欠 (kesseki): on reading ケツ (ketsu); kun readings か-ける (ka-keru) and か-く (ka-ku). Its kana けっせき (kesseki), absence, is a common word it begins and is not yet a taught card. It is in 欠点 (ketten), a fault, which uses the on reading ケツ (ketsu). No taught word uses it, so it has no example yet."
  "ja-5964":
    native: "Surname, or a polite title such as Mr."
    notes:
      "n1": "氏 (shimei): on reading シ (shi); kun reading うじ (uji). Its kana しめい (shimei), full name, is a common word it ends and is not yet a taught card. It is in 氏名 (shimei), full name, which uses the on reading シ (shi). No taught word uses it, so it has no example yet."
  "ja-5965":
    native: "To attach; to stick to."
    notes:
      "n1": "付 (tsuku): on reading フ (fu); kun readings つ-ける (tsu-keru) and つ-く (tsu-ku). Its kana つく (tsuku), to attach, is the word it stands for alone and is not yet a taught card. It is in 気付く (kizuku), to notice, which uses the kun reading つ-く (tsu-ku). No taught word uses it, so it has no example yet."
  "ja-5966":
    native: "Order; command."
    notes:
      "n1": "令 (meirei): on reading レイ (rei); no kun reading. Its kana めいれい (meirei), order, is a common word it begins and is not yet a taught card. It is in 命令 (meirei), order, which uses the on reading レイ (rei). No taught word uses it, so it has no example yet."
  "ja-5967":
    native: "From or by a reference point, as in more than."
    notes:
      "n1": "以 (ijou): on reading イ (i); no kun reading. Its kana いじょう (ijou), more than, is a common word it begins and is not yet a taught card. It is in 以上 (ijou), more than, which uses the on reading イ (i). No taught word uses it in kanji, so it has no example yet."
  "ja-5968":
    native: "Achievement; merit."
    notes:
      "n1": "功 (seikou): on readings コウ (kou), in limited use ク (ku); no kun reading. Its kana せいこう (seikou), success, is a common word it ends and is not yet a taught card. It is in 成功 (seikou), success, which uses the on reading コウ (kou). No taught word uses it, so it has no example yet."
  "ja-5969":
    native: "To add."
    notes:
      "n1": "加 (kuwaeru): on reading カ (ka); kun readings くわ-える (kuwa-eru) and くわ-わる (kuwa-waru). Its kana くわえる (kuwaeru), to add, is the word it stands for alone and is not yet a taught card. It is in 追加 (tsuika), addition, which uses the on reading カ (ka). No taught word uses it, so it has no example yet."
  "ja-5970":
    native: "To wrap."
    notes:
      "n1": "包 (tsutsumu): on reading ホウ (hou); kun reading つつ-む (tsutsu-mu). Its kana つつむ (tsutsumu), to wrap, is the word it stands for alone and is also the taught card つつむ (tsutsumu), the same word. It is in 包丁 (houchou), a kitchen knife, which uses the on reading ホウ (hou) and is also the taught card ほうちょう (houchou)."
    examples:
      "包丁をかいました。": "I bought a kitchen knife."
      "はこを包みます。": "I wrap the box."
  "ja-5971":
    native: "To manage; a director."
    notes:
      "n1": "司 (joushi): on reading シ (shi); no kun reading. Its kana じょうし (joushi), a boss, is a common word it ends and is not yet a taught card. It is in 上司 (joushi), a boss, which uses the on reading シ (shi). No taught word uses it in kanji, so it has no example yet."
  "ja-5972":
    native: "To lose."
    notes:
      "n1": "失 (shippai): on reading シツ (shitsu); kun reading うしな-う (ushina-u). Its kana しっぱい (shippai), failure, is a common word it begins and is not yet a taught card. It is in 失礼 (shitsurei), rudeness or an apology, which uses the on reading シツ (shitsu). No taught word uses it, so it has no example yet."
  "ja-5973":
    native: "Certainly; necessary."
    notes:
      "n1": "必 (hitsuyou): on reading ヒツ (hitsu); kun reading かなら-ず (kanara-zu). Its kana ひつよう (hitsuyou), necessary, is a common word it begins and is not yet a taught card. It is in 必ず (kanarazu), certainly, which uses the kun reading かなら-ず (kanara-zu). No taught word uses it in kanji, so it has no example yet."
  "ja-5974":
    native: "Not yet; un-."
    notes:
      "n1": "未 (mirai): on reading ミ (mi); no kun reading. Its kana みらい (mirai), future, is a common word it begins and is not yet a taught card. It is in 未定 (mitei), undecided, which uses the on reading ミ (mi). No taught word uses it, so it has no example yet."
  "ja-5975":
    native: "End."
    notes:
      "n1": "末 (sue): on readings マツ (matsu) and バツ (batsu); kun reading すえ (sue). Its kana すえ (sue), end, is the word it stands for alone and is not yet a taught card. It is in 週末 (shuumatsu), weekend, which uses the on reading マツ (matsu) and the taught kanji 週 (shuu). No taught word uses it, so it has no example yet."
  "ja-5976":
    native: "Bill, plate, or tag."
    notes:
      "n1": "札 (fuda): on reading サツ (satsu); kun reading ふだ (fuda). Its kana ふだ (fuda), a tag, is the word it stands for alone and is not yet a taught card. It is in 名札 (nafuda), a name tag, which uses the kun reading ふだ (fuda). No taught word uses it, so it has no example yet."
  "ja-5977":
    native: "People; citizens."
    notes:
      "n1": "民 (tami): on reading ミン (min); kun reading たみ (tami). Its kana たみ (tami), people, is the word it stands for alone and is not yet a taught card. It is in 国民 (kokumin), citizens, which uses the on reading ミン (min) and the taught kanji 国 (koku). No taught word uses it in kanji, so it has no example yet."
  "ja-5978":
    native: "Edge; vicinity."
    notes:
      "n1": "辺 (atari): on reading ヘン (hen); kun readings あた-り (ata-ri) and べ (be). Its kana あたり (atari), vicinity, is the word it stands for alone and is not yet a taught card. It is in 海辺 (umibe), seaside, which uses the kun reading べ (be) and the taught kanji 海 (umi). No taught word uses it, so it has no example yet."
  "ja-5979":
    native: "Conflict; to compete."
    notes:
      "n1": "争 (arasou): on reading ソウ (sou); kun reading あらそ-う (araso-u). Its kana あらそう (arasou), to fight, is the word it stands for alone and is not yet a taught card. It is in 争い (arasoi), a dispute, which uses the kun reading あらそ-い (araso-i). No taught word uses it, so it has no example yet."
  "ja-5980":
    native: "Relationship between people; companionship."
    notes:
      "n1": "仲 (nakama): on reading チュウ (chuu); kun reading なか (naka). Its kana なかま (nakama), a companion, is a common word it begins and is not yet a taught card. It is in 仲直り (nakanaori), making up, which uses the kun reading なか (naka) and the taught kanji 直 (choku). No taught word uses it, so it has no example yet."
  "ja-5981":
    native: "To convey; to pass on."
    notes:
      "n1": "伝 (tsutaeru): on reading デン (den); kun readings つた-わる (tsuta-waru), つた-える (tsuta-eru) and つた-う (tsuta-u). Its kana つたえる (tsutaeru), to convey, is the word it stands for alone and is not yet a taught card. It is in 言い伝え (iitsutae), a legend, which uses the kun reading つた-え (tsuta-e) and the taught kanji 言 (gen). No taught word uses it, so it has no example yet."
  "ja-5982":
    native: "Omen; a trillion."
    notes:
      "n1": "兆 (chouen): on reading チョウ (chou); kun readings きざ-す (kiza-su) and きざ-し (kiza-shi). Its kana ちょうえん (chouen), a trillion yen, is a common word it begins and is not yet a taught card. It is in 兆円 (chouen), a trillion yen, which uses the on reading チョウ (chou) and the taught kanji 円 (en). No taught word uses it, so it has no example yet."
  "ja-5983":
    native: "Together; both."
    notes:
      "n1": "共 (tomoni): on reading キョウ (kyou); kun reading とも (tomo). Its kana ともに (tomoni), together, is the word it stands for alone and is not yet a taught card. It is in 共通 (kyoutsuu), in common, which uses the on reading キョウ (kyou) and the taught kanji 通 (tsuu). No taught word uses it, so it has no example yet."
  "ja-5984":
    native: "Mark; stamp."
    notes:
      "n1": "印 (shirushi): on reading イン (in); kun reading しるし (shirushi). Its kana しるし (shirushi), a mark, is the word it stands for alone and is not yet a taught card. The on reading イン (in) is in いんさつ (insatsu), printing, which is written in kana because its second kanji is not yet taught. No taught word uses it in kanji, so it has no example yet."
  "ja-5985":
    native: "Each; every."
    notes:
      "n1": "各 (onoono): on reading カク (kaku); kun reading おのおの (onoono). Its kana おのおの (onoono), each, is the word it stands for alone and is not yet a taught card. It is in 各国 (kakkoku), every country, which uses the on reading カク (kaku) and the taught kanji 国 (koku). No taught word uses it, so it has no example yet."
  "ja-5986":
    native: "To like; to be fond of."
    notes:
      "n1": "好 (suki): on reading コウ (kou); kun readings この-む (kono-mu) and す-く (su-ku). Its kana すき (suki), liking, is the word it stands for alone, written 好き (suki), and is also the taught card すき (suki), the same word. It is in 好物 (koubutsu), a favourite food, which uses the on reading コウ (kou) and the taught kanji 物 (butsu)."
    examples:
      "ねこが好きです。": "I like cats."
      "わたしはテニスが好きです。": "I like tennis."
  "ja-5987":
    native: "To become; to complete."
    notes:
      "n1": "成 (naru): on reading セイ (sei), in limited use ジョウ (jou); kun readings な-る (na-ru) and な-す (na-su). Its kana なる (naru), to become, is the word it stands for alone and is not yet a taught card. It is in 成長 (seichou), growth, which uses the on reading セイ (sei) and the taught kanji 長 (chou). No taught word uses it, so it has no example yet."
  "ja-5988":
    native: "Lamp; light."
    notes:
      "n1": "灯 (dentou): on reading トウ (tou); kun reading ひ (hi). Its kana でんとう (dentou), a lamp, is a common word it ends and is not yet a taught card. It is in 電灯 (dentou), an electric light, which uses the on reading トウ (tou) and the taught kanji 電 (den). No taught word uses it, so it has no example yet."
