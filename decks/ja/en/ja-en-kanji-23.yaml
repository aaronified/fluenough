native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 23: grade 4, part 6"
description: "Twenty-nine kanji of the fourth school grade, each taught by the kana reading of the word it stands for. Most have no example yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-6260":
    native: "to master; to go to the limit"
    notes:
      "n1": "極 (kyoku): on readings キョク (kyoku) and ゴク (goku); kun readings きわ-める (kiwa-meru), きわ-まる (kiwa-maru) and きわ-み (kiwa-mi). Its kana きわめる (kiwameru), to master; to go to the limit, is the word it stands for in its kun reading, written 極める (kiwameru). It has the same kana as the taught kanji card 究 (kyuu), whose kana きわめる (kiwameru) is to investigate; that is a different word, written 究める (kiwameru). No taught word is written with 極 (kyoku), so it has no example yet."
  "ja-6261":
    native: "to become full; to fill up"
    notes:
      "n1": "満 (man): on reading マン (man); kun readings み-ちる (mi-chiru) and み-たす (mi-tasu). Its kana みちる (michiru), to become full, is the word it stands for in its kun reading, written 満ちる (michiru). It is not yet a taught card. The taught card まんぞく (manzoku), full, is written 満足 (manzoku), which uses 満 (man) and the taught kanji 足 (soku), so its example uses that word."
    examples:
      "満足です。": "I am full."
  "ja-6262":
    native: "Shiga, a prefecture of Japan"
    notes:
      "n1": "滋 (ji): on reading ジ (ji); no kun reading. Its kana しが (shiga), Shiga, a prefecture of Japan, is a place name written 滋賀 (shiga). There the kanji 滋 (ji) is read し (shi), not with its table reading ジ (ji), so the place name is a jukujikun: there the kanji is not read with its table reading. The second kanji 賀 (ga) is taught in this unit. No taught word is written with 滋 (ji), so it has no example yet."
  "ja-6263":
    native: "there is not; does not exist"
    notes:
      "n1": "無 (mu): on readings ム (mu) and ブ (bu); kun reading な-い (na-i). Its kana ない (nai), there is not; does not exist, is the word it stands for in its kun reading, written 無い (nai). It is not yet a taught card, and no taught card has the kana ない (nai). The taught card むり (muri), impossible, is written 無理 (muri), which uses 無 (mu) and the taught kanji 理 (ri), so its example uses that word."
    examples:
      "それは無理です。": "That is impossible."
  "ja-6264":
    native: "nature"
    notes:
      "n1": "然 (zen): on readings ゼン (zen) and ネン (nen); no kun reading. Its kana しぜん (shizen), nature, is the commonest word it ends, written 自然 (shizen), which uses the taught kanji 自 (ji). It is the same word as the taught card しぜん (shizen), nature. Its example uses 自然 (shizen) with the taught adjective きれい (kirei), beautiful."
    examples:
      "自然はきれいです。": "Nature is beautiful."
  "ja-6265":
    native: "to grill; to bake"
    notes:
      "n1": "焼 (yaku): on reading ショウ (shou); kun readings や-く (ya-ku) and や-ける (ya-keru). Its kana やく (yaku), to grill; to bake, is the word it stands for in its kun reading, written 焼く (yaku). It is the same word as the taught card やく (yaku), to grill. The same kana is the taught kanji card 役 (yaku), role; duty, which is a different word, written 役 (yaku). Its examples use 焼きます (yakimasu), the masu form of the taught verb やく (yaku), and 焼き魚 (yakizakana), grilled fish, which is the taught card やきざかな (yakizakana) and uses the taught kanji 魚 (sakana)."
    examples:
      "魚を焼きます。": "I grill fish."
      "焼き魚はおいしいです。": "Grilled fish is delicious."
  "ja-6266":
    native: "to tie; to connect"
    notes:
      "n1": "結 (ketsu): on reading ケツ (ketsu); kun readings むす-ぶ (musu-bu), ゆ-う (yu-u) and ゆ-わえる (yu-waeru). Its kana むすぶ (musubu), to tie; to connect, is the word it stands for in its kun reading, written 結ぶ (musubu). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6267":
    native: "salary; wages"
    notes:
      "n1": "給 (kyuu): on reading キュウ (kyuu); no kun reading. Its kana きゅうりょう (kyuuryou), salary; wages, is the commonest word it begins, written 給料 (kyuuryou), which uses the kanji 料 (ryou), not yet taught. It is the same word as the taught card きゅうりょう (kyuuryou), salary; pay. Its example uses 給食 (kyuushoku), school lunch, which is the taught card きゅうしょく (kyuushoku) and uses the taught kanji 食 (shoku)."
    examples:
      "給食はおいしいです。": "School lunch is delicious."
  "ja-6268":
    native: "town; street"
    notes:
      "n1": "街 (gai): on reading ガイ (gai); the table lists カイ (kai) in parentheses as a special or very narrow use; kun reading まち (machi). Its kana まち (machi), town; street, is the word it stands for in its kun reading, written 街 (machi). It is the same word as the taught card まち (machi), town, which is written 町 (machi) and is the taught kanji card 町 (machi), so the two writings are the same word. Its example uses 街 (machi) with the taught adjective しずか (shizuka), quiet; calm."
    examples:
      "この街はしずかです。": "This town is quiet."
  "ja-6269":
    native: "to remember; to memorise"
    notes:
      "n1": "覚 (kaku): on reading カク (kaku); kun readings おぼ-える (obo-eru), さ-ます (sa-masu) and さ-める (sa-meru). Its kana おぼえる (oboeru), to remember; to memorise, is the word it stands for in its kun reading, written 覚える (oboeru). It is the same word as the taught card おぼえる (oboeru), to remember; to memorise. Its example uses 覚えます (oboemasu), the masu form of that taught verb, with the taught word 名前 (namae), name, and the particle を (o)."
    examples:
      "名前を覚えます。": "I remember the name."
  "ja-6270":
    native: "New Year's greeting"
    notes:
      "n1": "賀 (ga): on reading ガ (ga); no kun reading. Its kana ねんが (nenga), New Year's greeting, is a common word it ends, written 年賀 (nenga), which uses the taught kanji 年 (nen). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6271":
    native: "to reach; to attain"
    notes:
      "n1": "達 (tatsu): on reading タツ (tatsu); no kun reading. Its kana たっする (tassuru), to reach; to attain, is the word it stands for with its ending, written 達する (tassuru). The on reading タツ (tatsu) takes a geminate consonant before する (suru). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6272":
    native: "amount; quantity"
    notes:
      "n1": "量 (ryou): on reading リョウ (ryou); kun reading はか-る (haka-ru). Its kana りょう (ryou), amount; quantity, is the word it stands for alone and is not yet a taught card. Its kun reading はか-る (haka-ru) is the verb 量る (hakaru), to measure, which is a different word and not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6273":
    native: "troop; unit"
    notes:
      "n1": "隊 (tai): on reading タイ (tai); no kun reading. Its kana たい (tai), troop; unit, is the word it stands for alone and is not yet a taught card. The same kana is the taught kanji card 対 (tai), pair; opposite, which is a different word, written 対 (tai). Its common word 軍隊 (guntai), army, uses the kanji 軍 (gun), not yet taught. No taught word uses it, so it has no example yet."
  "ja-6274":
    native: "order; sequence"
    notes:
      "n1": "順 (jun): on reading ジュン (jun); no kun reading. Its kana じゅん (jun), order; sequence, is the word it stands for alone and is not yet a taught card. Its common word 順番 (junban), turn, uses the same kanji 順 (jun) with the kana ばん (ban). No taught word uses it, so it has no example yet."
  "ja-6275":
    native: "a meal"
    notes:
      "n1": "飯 (han): on reading ハン (han); kun reading めし (meshi). Its kana めし (meshi), a meal, is the word it stands for in its kun reading, and is not yet a taught card. Its example uses ご飯 (gohan), rice; a meal, which is the taught card ごはん (gohan) and is written with the kanji 飯 (han) after the kana ご (go)."
    examples:
      "ご飯はおいしいです。": "Rice is delicious."
  "ja-6276":
    native: "to work"
    notes:
      "n1": "働 (dou): on reading ドウ (dou); kun reading はたら-く (hatara-ku). Its kana はたらく (hataraku), to work, is the word it stands for in its kun reading, written 働く (hataraku). It is the same word as the taught card はたらく (hataraku), to work. Its example uses 働きます (hatarakimasu), the masu form of that taught verb, with the taught pronoun わたし (watashi), I, and the particle は (wa)."
    examples:
      "わたしは働きます。": "I work."
  "ja-6277":
    native: "salt"
    notes:
      "n1": "塩 (en): on reading エン (en); kun reading しお (shio). Its kana しお (shio), salt, is the word it stands for in its kun reading, written 塩 (shio). It is the same word as the taught card しお (shio), salt. Its example uses 塩 (shio) with the taught adjective おいしい (oishii), delicious."
    examples:
      "塩はおいしいです。": "Salt is delicious."
  "ja-6278":
    native: "love"
    notes:
      "n1": "愛 (ai): on reading アイ (ai); no kun reading. Its kana あい (ai), love, is the word it stands for alone and is not yet a taught card. The same kana is the taught kanji card 相 (ai), mutual; each other, which is a different word, written 相 (ai). Its word 愛する (aisuru), to love, is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6279":
    native: "to fight"
    notes:
      "n1": "戦 (sen): on reading セン (sen); kun readings いくさ (ikusa) and たたか-う (tataka-u). Its kana たたかう (tatakau), to fight, is the word it stands for in its kun reading, written 戦う (tatakau). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6280":
    native: "to shine"
    notes:
      "n1": "照 (shou): on reading ショウ (shou); kun readings て-る (te-ru), て-らす (te-rasu) and て-れる (te-reru). Its kana てる (teru), to shine, is the word it stands for in its kun reading, written 照る (teru). It is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6281":
    native: "a joint; a section"
    notes:
      "n1": "節 (setsu): on reading セツ (setsu); the table lists セチ (sechi) in parentheses as a special or very narrow use; kun reading ふし (fushi). Its kana ふし (fushi), a joint; a section, is the word it stands for in its kun reading, written 節 (fushi), and is not yet a taught card. Its example uses 季節 (kisetsu), season, which is the taught card きせつ (kisetsu) and uses the taught kanji 季 (ki)."
    examples:
      "季節は春です。": "The season is spring."
  "ja-6282":
    native: "to continue"
    notes:
      "n1": "続 (zoku): on reading ゾク (zoku); kun readings つづ-く (tsuzu-ku) and つづ-ける (tsuzu-keru). Its kana つづく (tsuzuku), to continue, is the word it stands for in its kun reading, written 続く (tsuzuku), and is not yet a taught card. Its example uses 続けます (tsuzukemasu), the masu form of the taught card つづける (tsuzukeru), to continue, which is the transitive verb 続ける (tsuzukeru), a different word."
    examples:
      "仕事を続けます。": "I continue my job."
  "ja-6283":
    native: "to put; to place"
    notes:
      "n1": "置 (chi): on reading チ (chi); kun reading お-く (o-ku). Its kana おく (oku), to put; to place, is the word it stands for in its kun reading, written 置く (oku). The same kana is the taught card おく (oku), a hundred million, which is a different word. No taught word is written with 置 (chi), so it has no example yet."
  "ja-6284":
    native: "to try; to test"
    notes:
      "n1": "試 (shi): on reading シ (shi); kun readings こころ-みる (kokoro-miru) and ため-す (tame-su). Its kana ためす (tamesu), to try; to test, is the word it stands for in its kun reading, written 試す (tamesu), and is not yet a taught card. Its example uses 試合 (shiai), match, which is the taught card しあい (shiai) and uses the kanji 試 (shi) read し (shi) in the word."
    examples:
      "試合はたのしいです。": "The match is fun."
  "ja-6285":
    native: "to quit; to resign"
    notes:
      "n1": "辞 (ji): on reading ジ (ji); kun reading や-める (ya-meru). Its kana やめる (yameru), to quit; to resign, is the word it stands for in its kun reading, written 辞める (yameru). It is the same word as the taught card やめる (yameru), to quit; to stop doing. Its example uses 辞めます (yamemasu), the masu form of that taught verb, with the taught word 仕事 (shigoto), job; work."
    examples:
      "仕事を辞めます。": "I quit my job."
  "ja-6286":
    native: "a flock; a crowd"
    notes:
      "n1": "群 (gun): on reading グン (gun); kun readings む-れる (mu-reru) and む-れ (mu-re); the table lists むら (mura) in parentheses as a special or very narrow use. Its kana むれ (mure), a flock; a crowd, is the word it stands for in its kun reading, written 群れ (mure), and is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6287":
    native: "police"
    notes:
      "n1": "察 (satsu): on reading サツ (satsu); no kun reading. Its kana けいさつ (keisatsu), police, is a common word it ends, written 警察 (keisatsu), which uses the kanji 警 (kei), not yet taught. It is the same word as the taught card けいさつ (keisatsu), police. No taught word is written with 察 (satsu), so it has no example yet."
  "ja-6288":
    native: "virtue; goodness"
    notes:
      "n1": "徳 (toku): on reading トク (toku); no kun reading. Its kana とく (toku), virtue; goodness, is the word it stands for alone and is not yet a taught card. Its common word 道徳 (doutoku), morals, uses the taught kanji 道 (dou). No taught word is written with 徳 (toku), so it has no example yet."
