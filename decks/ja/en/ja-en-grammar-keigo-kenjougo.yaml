rules:
  "ja-rule-kenjougo":
    name: "The humble form (kenjougo)"
    explanation: "Humble speech lowers your own side, to show respect to the person you speak to. Most verbs take お (o) before the polite stem and します (shimasu) after it: waiting becomes {1}. Some verbs have a humble form of their own: going and coming become {2}, eating and drinking become {3}, seeing becomes {4}, doing becomes {5} and giving becomes {6}. Knowing becomes {7}, listening or asking becomes {8}, and visiting becomes {9}."
