cards:
  "ja-2277":
    notes: {"n1": "かよいます (kayoimasu), to commute, takes に (ni) before the place, as in がっこう (gakkou), school."}
    native: "I go to school every day."
    bases:
      "は": { meaning: "(marks the topic)" }
    confusables:
      w1: { why: "to arrive" }
      w2: { why: "to pass through" }
  "ja-2278":
    notes: {"n1": "あきました (akimashita) is intransitive, so the door opens by itself; the transitive partner あけます (akemasu) means to open something."}
    native: "The door opened."
    confusables:
      w1: { why: "to close, the opposite" }
      w2: { why: "to open something" }
  "ja-2279":
    notes: {"n1": "The te-form わたして (watashite) plus ください (kudasai) makes a polite request, please hand over."}
    native: "Please hand over the key."
    bases:
      "を": { meaning: "(marks the thing acted on)" }
      "ください": { meaning: "please (give me)" }
    confusables:
      w1: { why: "to drop" }
      w2: { why: "to find" }
