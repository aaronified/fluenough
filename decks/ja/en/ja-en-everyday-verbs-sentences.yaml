schema: 1
id: "ja-en-everyday-verbs-sentences"
kind: "layer"
core: "ja-everyday-verbs-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Everyday verbs in sentences"
description: "Sentences built from the words of this unit, to put in order, each with the words it could be mistaken for. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "ja-0376":
    native: "The teacher teaches Japanese."
    bases:
      "は":
        meaning: "(marks the topic)"
      "を":
        meaning: "(marks the thing acted on)"
      "おしえます":
        meaning: "to teach"
    confusables:
      w1:
        why: "ならう (narau) is to learn: the student does it, not the teacher."
      w2:
        why: "きく (kiku) is to listen or to ask, a different action."
  "ja-0377":
    native: "Mother makes the meal."
    bases:
      "が":
        meaning: "(marks the subject)"
      "を":
        meaning: "(marks the thing acted on)"
      "つくります":
        meaning: "to make; to create"
    confusables:
      w1:
        why: "あらう (arau) is to wash, not to make."
      w2:
        why: "たべる (taberu) is to eat, which comes after making."
  "ja-0378":
    native: "The dog sits."
    bases:
      "が":
        meaning: "(marks the subject)"
      "すわります":
        meaning: "to sit"
    confusables:
      w1:
        why: "たつ (tatsu) is to stand, not to sit."
      w2:
        why: "ねる (neru) is to sleep, not to sit."
  "ja-0379":
    native: "I understand Japanese."
    bases:
      "は":
        meaning: "(marks the topic)"
      "が":
        meaning: "(marks the subject)"
      "わかります":
        meaning: "to understand"
    confusables:
      w1:
        why: "しる (shiru) is to know a fact, not to understand a language."
      w2:
        why: "すき (suki) means you like something, not that you understand it."
  "ja-0380":
    native: "What do you use?"
    bases:
      "を":
        meaning: "(marks the thing acted on)"
      "つかいます":
        meaning: "to use"
      "か":
        meaning: "(marks a question)"
    confusables:
      w1:
        why: "もつ (motsu) is to hold or carry, not to use."
      w2:
        why: "あける (akeru) is to open, a different action."
  "ja-0381":
    native: "I carry a key."
    bases:
      "は":
        meaning: "(marks the topic)"
      "を":
        meaning: "(marks the thing acted on)"
      "もちます":
        meaning: "to hold; to carry"
    confusables:
      w1:
        why: "あける (akeru) is to open the lock, not to carry it."
      w2:
        why: "しめる (shimeru) is to shut the lock, not to carry it."
