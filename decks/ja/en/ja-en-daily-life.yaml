        "bases":
          "を":
            "meaning": "(marks the thing acted on)"
          "あびます":
            "meaning": "to take (a shower), to bathe (polite)"
      "おふろはきょうシャワーだけでした。":
        "native": "Today I only had a shower, not a bath."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "だけ":
            "meaning": "only"
          "でした":
            "meaning": "was (polite)"
  "ja-1334":
