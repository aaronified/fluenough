"cards":
  "ja-1331":
    "native": "alarm clock"
    "notes":
      "n1": "めざまし (mezamashi) is an alarm clock. Turn it off with とめる (tomeru)."
    "examples":
      "めざましがなります。":
        "native": "The alarm clock rings."
        "bases":
          "が":
            "meaning": "(marks the subject)"
          "なります":
            "meaning": "to ring, to sound (polite)"
      "まいあさめざましをとめます。":
        "native": "Every morning I turn off the alarm clock."
        "bases":
          "を":
            "meaning": "(marks the thing acted on)"
          "とめます":
            "meaning": "to stop, to turn off (polite)"
  "ja-1332":
    "native": "nap"
    "notes":
      "n1": "ひるね (hirune) is a short sleep in the afternoon. Take a nap with ひるねをします (hirune o shimasu)."
    "examples":
      "ちちはひるねをします。":
        "native": "My father takes a nap."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "を":
            "meaning": "(marks the thing acted on)"
          "します":
            "meaning": "to do (polite)"
      "わたしはきょうひるねをしました。":
        "native": "I took a nap today."
        "bases":
          "は":
            "meaning": "(marks the topic)"
          "を":
            "meaning": "(marks the thing acted on)"
          "しました":
            "meaning": "did (polite)"
  "ja-1333":
