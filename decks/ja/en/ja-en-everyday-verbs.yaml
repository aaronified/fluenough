native: { code: "en", iso639_3: "eng", name: "English" }
name: "Everyday verbs"
description: "Thirty-five everyday verbs in their polite forms, the -masu and -masen forms of eating, drinking, going, coming, sleeping, working and doing. Not yet checked by a Japanese speaker: please report any mistake."
