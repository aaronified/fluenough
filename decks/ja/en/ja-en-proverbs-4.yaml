name: "Proverbs: kotowaza 4"
description: "Eight Japanese proverbs of the Kamigata (Kyoto and Osaka) iroha karuta set, each with its word-for-word meaning and what it is said of. Not yet checked by a Japanese speaker: please report any mistake."
