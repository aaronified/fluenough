tags: ["unreviewed"]
cards:
  "ja-4820":
    native: "Once someone believes in a thing, even a sardine's head can seem precious."
    notes:
      "literal": "Said that faith can make anything seem worthy of respect, even something that has no value of its own."
    bases:
      "いわし": { meaning: "sardine" }
      "の": { meaning: "(of)" }
      "あたま": { meaning: "head" }
      "も": { meaning: "(also)" }
      "しんじん": { meaning: "faith" }
      "から": { meaning: "(from)" }
  "ja-4821":
    native: "A child you carried on your back can still show you where the shallow ford is."
    notes:
      "literal": "Said that someone younger or less experienced may still teach you something you did not know."
    bases:
      "おうた": { meaning: "carried on the back" }
      "こ": { meaning: "child" }
      "に": { meaning: "(by)" }
      "おしえられて": { meaning: "were taught" }
      "あさせ": { meaning: "shallow ford" }
      "を": { meaning: "(marks the place crossed)" }
      "わたる": { meaning: "to cross" }
  "ja-4822":
    native: "Good fortune comes to those who lie back and wait for it."
    notes:
      "literal": "Said that good things come on their own, so one should rest and wait instead of chasing them."
    bases:
      "かほう": { meaning: "good fortune" }
      "は": { meaning: "(as for)" }
      "ねて": { meaning: "lying down" }
      "まて": { meaning: "wait" }
  "ja-4823":
    native: "If you wait, a fair day for the sea voyage will come."
    notes:
      "literal": "Said to urge patience: when things are not going your way, a good chance comes if you wait."
    bases:
      "まて": { meaning: "wait" }
      "ば": { meaning: "(if)" }
      "かいろ": { meaning: "sea route" }
      "の": { meaning: "(of)" }
      "ひより": { meaning: "fair weather" }
      "あり": { meaning: "there is" }
  "ja-4824":
    native: "A samurai may go hungry, but he keeps up his dignity and picks his teeth as if he had eaten."
    notes:
      "literal": "Said of keeping up appearances and pride when poor; it can also mean putting on a show of not minding a hardship."
    bases:
      "ぶし": { meaning: "samurai" }
      "は": { meaning: "(as for)" }
      "くわね": { meaning: "did not eat" }
      "ど": { meaning: "even though" }
      "たかようじ": { meaning: "toothpick held high" }
  "ja-4825":
    native: "A bird flies up from right under your feet: something unexpected happens close by."
    notes:
      "literal": "Said of a sudden event or danger that comes from very close, when you least expect it."
    bases:
      "あしもと": { meaning: "under one's feet" }
      "から": { meaning: "(from)" }
      "とり": { meaning: "bird" }
      "が": { meaning: "(marks the subject)" }
      "たつ": { meaning: "to rise, to take off" }
  "ja-4826":
    native: "A dance under the veranda: effort made for others that no one sees or praises."
    notes:
      "literal": "Said of work done in secret, behind the scenes, that nobody notices."
    bases:
      "えん": { meaning: "veranda (the edge of a house's floor)" }
      "の": { meaning: "(of)" }
      "した": { meaning: "under" }
      "まい": { meaning: "dance" }
  "ja-4827":
    native: "Leave the job to the expert: rice cakes are best left to the rice-cake maker."
    notes:
      "literal": "Said that each job is best left to people who specialise in it."
    bases:
      "もち": { meaning: "rice cake" }
      "は": { meaning: "(as for)" }
      "もちや": { meaning: "rice-cake shop, expert" }
