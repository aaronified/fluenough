"cards":
  "ja-8045":
    "native": "There is money in the wallet."
    "bases": { "さいふ": { "meaning": "wallet" }, "の": { "meaning": "(of; belonging to)" }, "なか": { "meaning": "inside" }, "に": { "meaning": "(in)" }, "かね": { "meaning": "money" }, "が": { "meaning": "(marks the subject)" }, "あります": { "meaning": "to have (polite)" } }
    "confusables":
      "c1": { "why": "a banknote, not the wallet's contents as a whole" }
      "c2": { "why": "a coin purse, which is smaller than a wallet" }
  "ja-8046":
    "native": "I put small change in the wallet."
    "bases": { "こぜに": { "meaning": "small change" }, "を": { "meaning": "(marks the thing acted on)" }, "さいふ": { "meaning": "wallet" }, "に": { "meaning": "(into)" }, "いれます": { "meaning": "to put in (polite)" } }
    "confusables":
      "c1": { "why": "change given back after a payment, not put into a purse" }
      "c2": { "why": "a single coin, not the small change in general" }
  "ja-8047":
    "native": "Is the price tax included?"
    "bases": { "ねだん": { "meaning": "price" }, "は": { "meaning": "(marks the topic)" }, "ぜいこみ": { "meaning": "tax included" }, "です": { "meaning": "to be (polite)" }, "か": { "meaning": "(question marker)" } }
    "confusables":
      "c1": { "why": "tax excluded, the other kind of price" }
      "c2": { "why": "the list price, not the price a shopper pays" }
  "ja-8048":
    "native": "I pay the electricity bill from my savings."
    "bases": { "でんきだい": { "meaning": "electricity bill" }, "を": { "meaning": "(marks the thing acted on)" }, "ちょきん": { "meaning": "savings" }, "から": { "meaning": "(from)" }, "はらいます": { "meaning": "to pay (polite)" } }
    "confusables":
      "c1": { "why": "a deposit into the bank, not a payment" }
      "c2": { "why": "a gas bill, not an electricity bill" }
  "ja-8049":
    "native": "I keep a household account book every month."
    "bases": { "まいつき": { "meaning": "every month" }, "かけいぼ": { "meaning": "household account book" }, "を": { "meaning": "(marks the thing acted on)" }, "つけます": { "meaning": "to keep (records) (polite)" } }
    "confusables":
      "c1": { "why": "the budget itself, not the book that records it" }
      "c2": { "why": "a diary, not a money book" }
  "ja-8050":
    "native": "The change is one hundred yen."
    "bases": { "おつり": { "meaning": "change" }, "は": { "meaning": "(marks the topic)" }, "ひゃく": { "meaning": "hundred" }, "えん": { "meaning": "yen" }, "です": { "meaning": "to be (polite)" } }
    "confusables":
      "c1": { "why": "a banknote, not the change given back" }
      "c2": { "why": "a coin, not the change given back" }
  "ja-8051":
    "native": "I earn money."
    "bases": { "わたし": { "meaning": "I" }, "は": { "meaning": "(marks the topic)" }, "かね": { "meaning": "money" }, "を": { "meaning": "(marks the thing acted on)" }, "かせぎます": { "meaning": "to earn (polite)" } }
    "confusables":
      "c1": { "why": "to save money, not to earn it" }
      "c2": { "why": "to use money, not to earn it" }
  "ja-8052":
    "native": "I make a deposit at the bank."
    "bases": { "ぎんこう": { "meaning": "bank" }, "で": { "meaning": "(at a place)" }, "よきん": { "meaning": "bank deposit" }, "を": { "meaning": "(marks the thing acted on)" }, "します": { "meaning": "to do (polite)" } }
    "confusables":
      "c1": { "why": "a withdrawal, the other direction" }
      "c2": { "why": "savings, the money kept, not the act of depositing" }
  "ja-8053":
    "native": "It is expensive, so please haggle."
    "bases": { "たかい": { "meaning": "expensive" }, "ので": { "meaning": "because" }, "ねぎって": { "meaning": "to haggle (te form)" }, "ください": { "meaning": "please (do)" } }
    "confusables":
      "c1": { "why": "cheap, the opposite of expensive" }
      "c2": { "why": "a discount, not the act of asking for one" }
  "ja-8054":
    "native": "There is a free tea."
    "bases": { "むりょう": { "meaning": "free of charge" }, "の": { "meaning": "(of; belonging to)" }, "おちゃ": { "meaning": "tea" }, "が": { "meaning": "(marks the subject)" }, "あります": { "meaning": "to have (polite)" } }
    "confusables":
      "c1": { "why": "charged, the opposite of free" }
      "c2": { "why": "waste, not free" }
  "ja-8055":
    "native": "Please look at the price without tax."
    "bases": { "ぜいぬき": { "meaning": "tax excluded" }, "の": { "meaning": "(of; belonging to)" }, "ねだん": { "meaning": "price" }, "を": { "meaning": "(marks the thing acted on)" }, "みて": { "meaning": "look (te form)" }, "ください": { "meaning": "please (do)" } }
    "confusables":
      "c1": { "why": "tax included, the other price" }
      "c2": { "why": "half price, not the tax" }
  "ja-8056":
    "native": "I pay the rent every month."
    "bases": { "やちん": { "meaning": "rent" }, "は": { "meaning": "(marks the topic)" }, "まいつき": { "meaning": "every month" }, "はらいます": { "meaning": "to pay (polite)" } }
    "confusables":
      "c1": { "why": "a deposit, paid once, not every month" }
      "c2": { "why": "utilities, not the rent" }
