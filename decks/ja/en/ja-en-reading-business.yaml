    "title": "A company's year"
    "sentences":
      - "text": "ことし、かいしゃのうりあげがふえました。"
        "reading": "kotoshi, kaisha no uriage ga fuemashita."
      - "text": "しゅっぴをおさえて、りえきをだしました。"
        "reading": "shuppi o osaete, rieki o dashimashita."
      - "text": "けっさんは、さんがつです。"
        "reading": "kessan wa, sangatsu desu."
      - "text": "ほんしゃへ、ほうこくにいきます。"
        "reading": "honsha e, houkoku ni ikimasu."
