  - "id": "ja-business-2"
    "title": "A visit to a partner"
    "sentences":
      - "text": "あいさつまわりで、とりひきさきをたずねました。"
        "reading": "aisatsu mawari de, torihikisaki o tazunemashita."
      - "text": "めいしこうかんのあと、はなしあいました。"
        "reading": "meishi koukan no ato, hanashiaimashita."
      - "text": "しじょうのようすを、きかせてもらいました。"
        "reading": "shijou no yousu o, kikasete moraimashita."
      - "text": "ようやく、こうしょうがまとまりました。"
        "reading": "youyaku, koushou ga matomarimashita."
