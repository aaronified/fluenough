rules:
  "ja-rule-sonkeigo":
    name: "Honorific verbs: sonkeigo"
    explanation: "Sonkeigo raises the person who acts. Most verbs take お (o) before the stem and になります (ni narimasu) after it: かく (kaku), to write, becomes {1}. Some verbs have a word of their own: いく (iku) and くる (kuru) become {2}, たべる (taberu) and のむ (nomu) become {3}, みる (miru) becomes {5}, and ねる (neru) becomes {6}. する (suru) becomes {4}."
