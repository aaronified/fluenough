name: "Verb groups: the stem before ます (masu)"
description: "Every verb has a stem: the part before ます (masu). Its group decides how the stem is made from the dictionary form: a godan verb changes its last sound to the i-row, an ichidan verb drops る (ru), and する (suru) and くる (kuru) are irregular. Every verb a course deck teaches has a row. Not yet checked by a Japanese speaker: please report any mistake."
