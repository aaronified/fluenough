    "polite": "polite form of {meaning}"
rules:
  "ja-rule-verb-groups":
    name: "Verb groups: the stem"
    explanation: "{1} is the ichidan verb: its stem is what is left without る (ru). {2} is a godan verb: its stem changes the last sound to an i sound. {3} is irregular: its stem is し (shi)."
