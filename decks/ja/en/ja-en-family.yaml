"cards":
  "ja-0200":
    "native": "my father"
    "notes":
      "n1": "ちち (chichi) is your own father, said to other people. To your father himself, and of someone else's father, say おとうさん (otousan)."
    "examples":
      "わたしのちちはせんせいです。":
        "native": "My father is a teacher."
        "bases":
          "の":
            "meaning": "(links two nouns: of, 's)"
          "は":
            "meaning": "(marks the topic)"
          "です":
            "meaning": "is (polite)"
      "わたしのちちはにほんにいます。":
        "native": "My father is in Japan."
        "bases":
          "の":
            "meaning": "(links two nouns: of, 's)"
          "は":
            "meaning": "(marks the topic)"
          "に":
            "meaning": "in; at; to"
          "います":
            "meaning": "to be (of people and animals)"
