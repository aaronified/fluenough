        prompt: { en: "The second line says the speaker drinks only coffee." }
        answer: false
      - id: "ja-1277"
        prompt: { en: "Which line says that the speaker likes ice cream?" }
        options:
          - { en: "The third line" }
          - { en: "The fourth line" }
        answer: 1
