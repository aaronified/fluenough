name: "The passive form"
description: "The passive says what is done to someone or something. An ichidan verb adds られる (rareru), a godan verb changes its last sound to the a-row and adds れる (reru), and する (suru) and くる (kuru) are irregular. Every verb a course deck teaches has a row. Not yet checked by a Japanese speaker: please report any mistake."
