  slots:
    "passive": "be {meaning}-ed"
rules:
  "ja-rule-passive":
    name: "The passive form"
    explanation: "The passive says what is done to someone or something. An ichidan verb adds られる (rareru) to its stem: たべる (taberu) becomes {1}. A godan verb changes its last sound to the a-row and adds れる (reru): いく (iku) becomes {2}. する (suru) becomes {3} and くる (kuru) becomes {4}. For an ichidan verb it looks the same as the potential. The polite forms are shown."
