schema: 1
id: "ja-en-proverbs-1"
kind: "layer"
core: "ja-proverbs-1"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Proverbs: kotowaza 1"
description: "Twelve well-known Japanese proverbs, each with its word-for-word meaning and what it is said of. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "ja-4400":
    native: "A dog that walks will run into a stick."
    notes:
      "literal": "Said when going out and trying things brings luck or trouble, whichever comes."
    bases:
      "いぬ": { meaning: "dog" }
      "も": { meaning: "(also, even)" }
      "あるけば": { meaning: "to walk (if it walks)" }
      "ぼう": { meaning: "stick" }
      "に": { meaning: "(at, against)" }
      "あたる": { meaning: "to hit, to run into" }
  "ja-4401":
    native: "Proof is better than argument."
    notes:
      "literal": "Said when a fact settles what talk cannot."
    bases:
      "ろん": { meaning: "argument" }
      "より": { meaning: "rather than" }
      "しょうこ": { meaning: "proof, evidence" }
  "ja-4402":
    native: "Dumplings rather than flowers."
    notes:
      "literal": "Said of someone who prefers what is useful or tasty to what is only pretty."
    bases:
      "はな": { meaning: "flower" }
      "より": { meaning: "rather than" }
      "だんご": { meaning: "dumpling" }
  "ja-4403":
    native: "Even dust becomes a mountain when it piles up."
    notes:
      "literal": "Said to encourage small steady effort."
    bases:
      "ちり": { meaning: "dust" }
      "も": { meaning: "(also, even)" }
      "つもれば": { meaning: "to pile up (if it piles up)" }
      "やま": { meaning: "mountain" }
      "と": { meaning: "(shows what something becomes)" }
      "なる": { meaning: "to become" }
  "ja-4404":
    native: "To lose is to win."
    notes:
      "literal": "Said when giving way now brings a better result later."
    bases:
      "まける": { meaning: "to lose" }
      "が": { meaning: "(makes 'to lose' the subject)" }
      "かち": { meaning: "a win, victory" }
  "ja-4405":
    native: "Put a lid on smelly things."
    notes:
      "literal": "Said of hiding a shameful thing instead of dealing with it."
    bases:
      "くさい": { meaning: "smelly" }
      "もの": { meaning: "thing" }
      "に": { meaning: "(on, over)" }
      "ふた": { meaning: "lid" }
  "ja-4406":
    native: "Poverty leaves no free time."
    notes:
      "literal": "Said of people who must keep working to get by."
    bases:
      "びんぼう": { meaning: "poverty" }
      "ひま": { meaning: "free time" }
      "なし": { meaning: "none, without" }
  "ja-4407":
    native: "A bee on a crying face."
    notes:
      "literal": "Said when more bad luck comes on top of bad luck."
    bases:
      "なきつら": { meaning: "a crying face" }
      "に": { meaning: "(on)" }
      "はち": { meaning: "bee" }
  "ja-4408":
    native: "Put care on top of care."
    notes:
      "literal": "Said to urge great care: check again."
    bases:
      "ねん": { meaning: "care, attention" }
      "に": { meaning: "(on)" }
      "は": { meaning: "(marks the topic)" }
      "を": { meaning: "(marks the thing acted on)" }
      "いれよ": { meaning: "to put in (an order)" }
  "ja-4409":
    native: "An old person's cold water."
    notes:
      "literal": "Said of an old person who does something too strenuous for their age."
    bases:
      "としより": { meaning: "old person" }
      "の": { meaning: "(links two nouns: of)" }
      "ひやみず": { meaning: "cold water" }
  "ja-4410":
    native: "Eye drops from the second floor."
    notes:
      "literal": "Said of a way that is too indirect to work."
    bases:
      "にかい": { meaning: "second floor" }
      "から": { meaning: "from" }
      "めぐすり": { meaning: "eye drops" }
  "ja-4411":
    native: "Rust that came out of one's own body."
    notes:
      "literal": "Said when someone suffers the result of their own actions."
    bases:
      "み": { meaning: "body" }
      "から": { meaning: "from" }
      "でた": { meaning: "to come out (came out)" }
      "さび": { meaning: "rust" }
