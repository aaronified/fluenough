  "ja-1294":
    native: "Salt and pepper, please."
    notes:
      "n1": "と (to) lists nouns in full: しお と こしょう (shio to koshou), salt and pepper. For a partial list, や (ya) is used."
    bases:
      "と": { meaning: "and (joins two words)" }
      "を": { meaning: "(marks the thing acted on)" }
      "ください": { meaning: "please (give me)" }
    confusables:
