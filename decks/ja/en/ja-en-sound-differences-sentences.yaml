schema: 1
id: "ja-en-sound-differences-sentences"
kind: "layer"
core: "ja-sound-differences-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sound pairs in sentences"
license: "CC-BY-SA-4.0"
description: "Six sentences that use the word pairs, to put in order: long and short vowels, held consonants and the voiced mark. Not yet checked by a Japanese speaker: please report any mistake."
tags: ["beginner", "unreviewed"]
"cards":
  "ja-0095":
    "native": "My aunt and my grandmother are well."
    "bases":
      "と":
        "meaning": "and; with"
      "は":
        "meaning": "(marks the topic)"
      "げんき":
        "meaning": "well; healthy"
      "です":
        "meaning": "is (polite)"
    "confusables":
      "w1":
        "why": "おじさん (ojisan) is uncle, not aunt."
      "w2":
        "why": "おじいさん (ojiisan) is grandfather, not grandmother."
  "ja-0096":
    "native": "My grandfather likes snow."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "が":
        "meaning": "(marks the subject)"
      "すき":
        "meaning": "to like; liked"
      "です":
        "meaning": "is (polite)"
    "confusables":
      "w1":
        "why": "おじさん (ojisan) is uncle, with a short i."
      "w2":
        "why": "ゆうき (yuuki) is courage, with a long u."
  "ja-0097":
    "native": "My husband likes stamps."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "が":
        "meaning": "(marks the subject)"
      "すき":
        "meaning": "to like; liked"
      "です":
        "meaning": "is (polite)"
    "confusables":
      "w1":
        "why": "おと (oto) is sound, with no held t."
      "w2":
        "why": "きて (kite) is come, with a single t."
  "ja-0098":
    "native": "The weather is good today."
    "bases":
      "きょう":
        "meaning": "today"
      "は":
        "meaning": "(marks the topic)"
      "が":
        "meaning": "(marks the subject)"
      "いい":
        "meaning": "good"
      "です":
        "meaning": "is (polite)"
    "confusables":
      "w1":
        "why": "でんき (denki) is electricity, with a voiced d."
      "w2":
        "why": "わるい (warui) would say bad, not good."
  "ja-0099":
    "native": "The key and the persimmon, please."
    "bases":
      "と":
        "meaning": "and; with"
      "を":
        "meaning": "(marks the object)"
      "ください":
        "meaning": "please (give me)"
    "confusables":
      "w1":
        "why": "きって (kitte) would say stamp, not persimmon."
      "w2":
        "why": "かさ (kasa) would say umbrella, not key."
  "ja-0100":
    "native": "The writer's dog is at the top of the slope."
    "bases":
      "の":
        "meaning": "(links two nouns: of, 's)"
      "は":
        "meaning": "(marks the topic)"
      "うえ":
        "meaning": "top; above"
      "に":
        "meaning": "in; at; to"
      "います":
        "meaning": "to be (of people and animals)"
    "confusables":
      "w1":
        "why": "した (shita) would say under, not at the top."
      "w2":
        "why": "やま (yama) would say mountain, not slope."
