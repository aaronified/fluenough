schema: 1
id: "ja-en-grammar-transitivity"
kind: "layer"
core: "ja-grammar-transitivity"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Intransitive and transitive verbs: a thing changes, or someone changes it"
description: "Verbs come in pairs: あく (aku) is the intransitive, the door opens by itself, and あける (akeru) is the transitive, someone opens the door. Only verbs with a partner have a row. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "form"
  slots:
    "intransitive": "intransitive, {meaning}"
    "transitive": "transitive, {meaning}"
rules:
  "ja-rule-intransitive":
    name: "Intransitive: the thing changes by itself"
    explanation: "An intransitive verb says that a thing changes or happens by itself. The thing takes が (ga): ドア (doa) が (ga) あきました (akimashita) means the door opened, and nobody is named as the doer."
  "ja-rule-transitive":
    name: "Transitive: someone does it to a thing"
    explanation: "A transitive verb says that someone does something to a thing. The thing takes を (o): ドア (doa) を (o) あけました (akemashita) means someone opened the door."
