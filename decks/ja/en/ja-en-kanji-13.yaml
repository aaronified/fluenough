schema: 1
id: "ja-en-kanji-13"
kind: "layer"
core: "ja-kanji-13"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 13: grade 3, part 4"
description: "Twenty-five kanji of the third school grade, each taught by the kana reading of the word it stands for. Some have one example or none yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-5660":
    native: "to raise; to bring up"
    notes:
      "n1": "育 (sodateru): on reading イク (iku); kun readings そだつ (sodatsu), そだてる (sodateru) and はぐくむ (hagukumu). It is in そだてる (sodateru), to raise a child."
  "ja-5661":
    native: "bitter; painful"
    notes:
      "n1": "苦 (nigai): on reading ク (ku); kun readings くるしい (kurushii), くるしむ (kurushimu), くるしめる (kurushimeru), にがい (nigai) and にがる (nigaru). It is in にがい (nigai), bitter. The word 苦手 (nigate), not good at, is written with it too."
    examples:
      "こうちゃは苦いです。": "Black tea is bitter."
      "わたしはやきゅうが苦手です。": "I am bad at baseball."
  "ja-5662":
    native: "surface; front; table"
    notes:
      "n1": "表 (omote): on reading ヒョウ (hyou); kun readings おもて (omote), あらわす (arawasu) and あらわれる (arawareru). It is in おもて (omote), the surface or front."
  "ja-5663":
    native: "to ride; to board"
    notes:
      "n1": "乗 (noru): on reading ジョウ (jou); kun readings のる (noru) and のせる (noseru). It is in のる (noru), to ride or board."
    examples:
      "わたしはバスに乗ります。": "I ride the bus."
  "ja-5664":
    native: "person in charge; clerk"
    notes:
      "n1": "係 (kakari): on reading ケイ (kei); kun readings かかり (kakari) and かかる (kakaru). It is in かかり (kakari), a person in charge."
  "ja-5665":
    native: "goods; article"
    notes:
      "n1": "品 (shina): on reading ヒン (hin); kun reading しな (shina). It is in しな (shina), goods or an article."
  "ja-5666":
    native: "customer; guest"
    notes:
      "n1": "客 (kyaku): on readings キャク (kyaku) and カク (kaku); no kun reading. It is in きゃく (kyaku), a customer or guest."
    examples:
      "客がきます。": "A customer comes."
      "お客さんがバスにのります。": "The customer rides the bus."
  "ja-5667":
    native: "shop; house"
    notes:
      "n1": "屋 (ya): on reading オク (oku); kun reading や (ya). It is in や (ya), a shop, as in 本屋 (honya) and 八百屋 (yaoya). The same kana is 矢 (ya), an arrow, a taught word with another meaning."
    examples:
      "わたしは本屋にいきます。": "I go to the bookshop."
      "八百屋でやさいをかいます。": "I buy vegetables at the greengrocer's."
  "ja-5668":
    native: "degree; occasion; time"
    notes:
      "n1": "度 (tabi): on reading ド (do); limited readings ト (to) and タク (taku); kun reading たび (tabi). It is in たび (tabi), an occasion or time."
  "ja-5669":
    native: "to wait"
    notes:
      "n1": "待 (matsu): on reading タイ (tai); kun reading まつ (matsu). It is in まつ (matsu), to wait."
    examples:
      "わたしはともだちを待ちます。": "I wait for my friend."
  "ja-5670":
    native: "to hurry"
    notes:
      "n1": "急 (isogu): on reading キュウ (kyuu); kun reading いそぐ (isogu). It is in いそぐ (isogu), to hurry. The word 急行 (kyuukou), express train, uses its on reading キュウ (kyuu)."
    examples:
      "わたしは急ぎます。": "I hurry."
      "わたしは急行にのります。": "I ride the express train."
  "ja-5671":
    native: "to pick up"
    notes:
      "n1": "拾 (hirou): on readings シュウ (shuu) and ジュウ (juu); kun reading ひろう (hirou). It is in ひろう (hirou), to pick up."
    examples:
      "わたしはかぎを拾います。": "I pick up the key."
  "ja-5672":
    native: "to hold; to carry"
    notes:
      "n1": "持 (motsu): on reading ジ (ji); kun reading もつ (motsu). It is in もつ (motsu), to hold or carry."
    examples:
      "わたしはかぎを持ちます。": "I carry a key."
  "ja-5673":
    native: "finger; to point"
    notes:
      "n1": "指 (yubi): on reading シ (shi); kun readings ゆび (yubi) and さす (sasu). It is in ゆび (yubi), a finger."
    examples:
      "指がいたいです。": "My finger hurts."
  "ja-5674":
    native: "bright; the Showa era"
    notes:
      "n1": "昭 (shouwa): on reading ショウ (shou); no kun reading. It is in しょうわ (shouwa), the Showa era."
  "ja-5675":
    native: "pillar; column"
    notes:
      "n1": "柱 (hashira): on reading チュウ (chuu); kun reading はしら (hashira). It is in はしら (hashira), a pillar."
  "ja-5676":
    native: "Western; the ocean"
    notes:
      "n1": "洋 (youfuku): on reading ヨウ (you); no kun reading. It is in ようふく (youfuku), Western-style clothes."
  "ja-5677":
    native: "charcoal"
    notes:
      "n1": "炭 (sumi): on reading タン (tan); kun reading すみ (sumi). It is in すみ (sumi), charcoal."
  "ja-5678":
    native: "boundary; world"
    notes:
      "n1": "界 (sekai): on reading カイ (kai); no kun reading. It is in せかい (sekai), the world, as in 世界 (sekai). The kanji 世 (sekai) on card ja-5485 is taught with the same kana and meaning."
    examples:
      "世界はひろいです。": "The world is wide."
  "ja-5679":
    native: "field (for vegetables)"
    notes:
      "n1": "畑 (hatake): no on reading; kun readings はた (hata) and はたけ (hatake). It is in はたけ (hatake), a field for vegetables."
    examples:
      "畑はとおいです。": "The field is far away."
  "ja-5680":
    native: "departure; to depart"
    notes:
      "n1": "発 (shuppatsu): on readings ハツ (hatsu) and ホツ (hotsu); no kun reading. It is in しゅっぱつ (shuppatsu), departure, as in 出発 (shuppatsu)."
    examples:
      "でんしゃが出発します。": "The train departs."
  "ja-5681":
    native: "mutual; each other"
    notes:
      "n1": "相 (ai): on readings ソウ (sou) and ショウ (shou); kun reading あい (ai). It is in あい (ai), mutual or each other."
  "ja-5682":
    native: "prefecture"
    notes:
      "n1": "県 (ken): on reading ケン (ken); no kun reading. It is in けん (ken), a prefecture."
  "ja-5683":
    native: "to polish; to research"
    notes:
      "n1": "研 (kenkyuu): on reading ケン (ken); kun reading とぐ (togu). It is in けんきゅう (kenkyuu), research, as in 研究 (kenkyuu) and 研究者 (kenkyuusha)."
    examples:
      "わたしは研究をします。": "I do research."
      "わたしは研究者です。": "I am a researcher."
  "ja-5684":
    native: "god; deity"
    notes:
      "n1": "神 (kami): on readings シン (shin) and ジン (jin); kun reading かみ (kami); limited kun readings かん (kan) and こう (kou). It is in かみ (kami), a god, as in 神社 (jinja), shrine. The same kana is 紙 (kami), paper, a taught word with another meaning."
    examples:
      "わたしは神社にいきます。": "I go to the shrine."
