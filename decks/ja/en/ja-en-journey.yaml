"cards":
  "ja-2361":
    "native": "journey; trip"
    "notes":
      "n1": "tabi is a journey or a trip, of any length. Tabibito is a traveller."
    "examples":
      "たびにでます。":
        "native": "I set off on a journey."
        "bases":
          "でます":
            "meaning": "leave, set off (polite)"
      "たびはたのしいです。":
        "native": "The trip is fun."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2362":
    "native": "traveller"
    "notes":
      "n1": "tabibito is a person who travels, from tabi (journey) and hito (person)."
    "examples":
      "たびびとがえきにいます。":
        "native": "A traveller is at the station."
        "bases":
          "います":
            "meaning": "is, there is (people, animals; polite)"
      "わたしはたびびとです。":
        "native": "I am a traveller."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2363":
    "native": "change (of trains)"
    "notes":
      "n1": "norikae is a change between trains or buses. It comes from the verb norikaeru."
    "examples":
      "のりかえはどこですか。":
        "native": "Where do I change?"
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "つぎののりかえでおります。":
        "native": "I get off at the next change."
        "bases":
          "つぎ":
            "meaning": "next"
          "おります":
            "meaning": "get off (polite)"
  "ja-2364":
    "native": "to miss (a train)"
    "notes":
      "n1": "noriokureru is to miss a train or a bus, by arriving too late to get on."
    "examples":
      "でんしゃにのりおくれました。":
        "native": "I missed the train."
        "bases":
          "のりおくれました":
            "meaning": "missed (a train, polite)"
      "のりおくれたられんらくしてください。":
        "native": "If you miss it, please get in touch."
        "bases":
          "のりおくれたら":
            "meaning": "if you miss"
          "して":
            "meaning": "do (te-form)"
          "ください":
            "meaning": "(please give)"
  "ja-2365":
    "native": "to change (trains)"
    "notes":
      "n1": "norikaeru is to change from one train or bus to another."
    "examples":
      "えきでのりかえます。":
        "native": "I change trains at the station."
        "bases":
          "のりかえます":
            "meaning": "change (trains, polite)"
      "とうきょうでのりかえてください。":
        "native": "Please change trains in Tokyo."
        "bases":
          "のりかえて":
            "meaning": "change (trains, te-form)"
          "ください":
            "meaning": "(please give)"
  "ja-2366":
    "native": "timetable"
    "notes":
      "n1": "jikokuhyou is a timetable of departures and arrivals."
    "examples":
      "じこくひょうをみます。":
        "native": "I look at the timetable."
        "bases":
          "みます":
            "meaning": "look at (polite)"
      "でんしゃのじこくひょうはどこですか。":
        "native": "Where is the train timetable?"
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2367":
    "native": "seat"
    "notes":
      "n1": "zaseki is a seat, as in a train, a hall or a theatre."
    "examples":
      "ざせきにすわります。":
        "native": "I sit down in my seat."
        "bases":
          "すわります":
            "meaning": "sit down (polite)"
      "ざせきはありますか。":
        "native": "Are there any seats?"
        "bases":
          "あります":
            "meaning": "there is (polite)"
  "ja-2368":
    "native": "reserved seat"
    "notes":
      "n1": "shiteiseki is a seat booked in advance. Shitei means designated."
    "examples":
      "していせきをおねがいします。":
        "native": "A reserved seat, please."
        "bases":
          "おねがいします":
            "meaning": "please (a request)"
      "このしんかんせんはしていせきです。":
        "native": "This bullet train has reserved seats."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2369":
    "native": "unreserved seat"
    "notes":
      "n1": "jiyuuseki is a seat that anyone may take, without booking. Jiyuu means free."
    "examples":
      "じゆうせきにすわりました。":
        "native": "I sat in an unreserved seat."
        "bases":
          "すわりました":
            "meaning": "sat down (polite)"
      "じゆうせきはすいています。":
        "native": "The unreserved seats are empty."
        "bases":
          "すいています":
            "meaning": "is empty (polite)"
  "ja-2370":
    "native": "window side"
    "notes":
      "n1": "madogawa is the side by the window. Gawa means side."
    "examples":
      "まどがわのせきをください。":
        "native": "Please give me a seat by the window."
        "bases":
          "ください":
            "meaning": "(please give)"
      "わたしはまどがわがすきです。":
        "native": "I like the window seat."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2371":
    "native": "aisle side"
    "notes":
      "n1": "tsuurogawa is the side of the aisle. Tsuuro is the walkway."
    "examples":
      "つうろがわのせきにすわりました。":
        "native": "I sat in an aisle seat."
        "bases":
          "すわりました":
            "meaning": "sat down (polite)"
      "つうろがわがいいです。":
        "native": "The aisle side is good."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2372":
    "native": "fare"
    "notes":
      "n1": "unchin is the fare, the price of a ride on a train, bus or taxi."
    "examples":
      "うんちんはいくらですか。":
        "native": "How much is the fare?"
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "うんちんをはらいました。":
        "native": "I paid the fare."
        "bases":
          "はらいました":
            "meaning": "paid (polite)"
  "ja-2373":
    "native": "charge; fee"
    "notes":
      "n1": "ryoukin is a charge or a fee, for a service or for the use of something."
    "examples":
      "りょうきんがかかります。":
        "native": "A fee is charged."
        "bases":
          "かかります":
            "meaning": "takes, costs (polite)"
      "りょうきんはむりょうです。":
        "native": "There is no charge."
        "bases":
          "むりょう":
            "meaning": "free of charge"
          "です":
            "meaning": "(to be, polite)"
  "ja-2374":
    "native": "commuter pass"
    "notes":
      "n1": "teikiken is a commuter pass, bought for a set period. Teiki means fixed period."
    "examples":
      "ていきけんをかいました。":
        "native": "I bought a commuter pass."
        "bases":
          "かいました":
            "meaning": "bought (polite)"
      "ていきけんでかよいます。":
        "native": "I commute with a commuter pass."
        "bases":
          "かよいます":
            "meaning": "commute (polite)"
  "ja-2375":
    "native": "coupon ticket"
    "notes":
      "n1": "kaisuuken is a book of tickets for a set number of rides. Kaisuu means number of times."
    "examples":
      "かいすうけんをつかいます。":
        "native": "I use a coupon ticket."
        "bases":
          "つかいます":
            "meaning": "use (polite)"
      "かいすうけんはおとくです。":
        "native": "The coupon ticket is good value."
        "bases":
          "おとく":
            "meaning": "good value, cheap"
          "です":
            "meaning": "(to be, polite)"
  "ja-2376":
    "native": "limited express"
    "notes":
      "n1": "tokkyuu is a limited express train, which stops at fewer stations."
    "examples":
      "とっきゅうにのります。":
        "native": "I take the limited express."
        "bases":
          "のります":
            "meaning": "get on, ride (polite)"
      "このとっきゅうはおおさかまでいきます。":
        "native": "This limited express goes to Osaka."
        "bases":
          "まで":
            "meaning": "until, as far as"
          "いきます":
            "meaning": "go (polite)"
  "ja-2377":
    "native": "local train (stops at every station)"
    "notes":
      "n1": "kakuekiteisha is a local train that stops at every station: kaku (every), eki (station), teisha (stop)."
    "examples":
      "かくえきていしゃにのります。":
        "native": "I take the local train."
        "bases":
          "のります":
            "meaning": "get on, ride (polite)"
      "かくえきていしゃはおそいです。":
        "native": "The local train is slow."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2378":
    "native": "conductor"
    "notes":
      "n1": "shashou is the conductor on a train, who checks the tickets."
    "examples":
      "しゃしょうにきっぷをみせました。":
        "native": "I showed my ticket to the conductor."
        "bases":
          "みせました":
            "meaning": "showed (polite)"
      "しゃしょうがきっぷをかくにんします。":
        "native": "The conductor checks the tickets."
        "bases":
          "かくにんします":
            "meaning": "check (polite)"
  "ja-2379":
    "native": "driving"
    "notes":
      "n1": "unten is driving. With suru it is a verb: unten shimasu."
    "examples":
      "うんてんはたいへんです。":
        "native": "Driving is hard work."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "バスをうんてんします。":
        "native": "I drive a bus."
        "bases":
          "うんてんします":
            "meaning": "drives (polite)"
  "ja-2380":
    "native": "expressway"
    "notes":
      "n1": "kousokudouro is an expressway, from kousoku (high speed) and douro (road)."
    "examples":
      "こうそくどうろをはしります。":
        "native": "We drive along the expressway."
        "bases":
          "はしります":
            "meaning": "run, drive (polite)"
      "こうそくどうろはすいています。":
        "native": "The expressway is clear."
        "bases":
          "すいています":
            "meaning": "is empty (polite)"
  "ja-2381":
    "native": "bus stop"
    "notes":
      "n1": "basutei is a bus stop. Basu is bus and tei is a stop."
    "examples":
      "バスていでまちます。":
        "native": "I wait at the bus stop."
        "bases":
          "まちます":
            "meaning": "wait (polite)"
      "バスていはどこですか。":
        "native": "Where is the bus stop?"
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2382":
    "native": "taxi rank"
    "notes":
      "n1": "takushii noriba is a taxi rank. Noriba is a place for getting on."
    "examples":
