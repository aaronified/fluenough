          "しないで":
            "meaning": "do not (te-form, negative)"
          "ください":
            "meaning": "(please give)"
      "きょうはちこくしました。":
        "native": "I was late today."
        "bases":
          "しました":
            "meaning": "did (polite)"
  "ja-2385":
    "native": "delay"
    "notes":
