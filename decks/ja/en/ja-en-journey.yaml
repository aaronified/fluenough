        "bases":
          "おくれました":
            "meaning": "was late (polite)"
      "みちがじゅうたいです。":
        "native": "The road is jammed."
        "bases":
          "です":
            "meaning": "(to be, polite)"
  "ja-2384":
    "native": "being late"
    "notes":
      "n1": "chikoku is being late for something. With suru it is a verb: chikoku shimasu."
