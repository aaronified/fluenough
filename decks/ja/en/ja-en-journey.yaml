        "native": "The taxi rank is over there."
        "bases":
          "です":
            "meaning": "(to be, polite)"
      "タクシーのりばでまってください。":
        "native": "Please wait at the taxi rank."
        "bases":
          "まって":
            "meaning": "wait (te-form)"
          "ください":
            "meaning": "(please give)"
