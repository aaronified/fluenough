        "bases":
          "わすれました":
            "meaning": "forgot (polite)"
      "パスポートをみせてください。":
        "native": "Please show your passport."
        "bases":
          "みせて":
            "meaning": "show (te-form)"
          "ください":
            "meaning": "(please give)"
  "ja-2391":
