        "native": "There is a delay."
        "bases":
          "あります":
            "meaning": "there is (polite)"
      "でんしゃのおくれはなんぷんですか。":
        "native": "How many minutes is the delay?"
        "bases":
          "なんぷん":
            "meaning": "how many minutes"
          "です":
            "meaning": "(to be, polite)"
