schema: 1
id: "ja-en-kanji-19"
kind: "layer"
core: "ja-kanji-19"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 19"
description: "Twenty-nine kanji, each taught by the kana reading of the word it stands for. Some have one example or none yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-6020":
    native: "old person; elderly"
    notes:
      "n1": "老 (roujin): on reading ロウ (rou); kun readings お-いる (o-iru) and ふ-ける (fu-keru). Its kana ろうじん (roujin), old person, is the commonest word the kanji stands for, 老人 (roujin), and is not yet a taught card. It is in 老後 (rougo), old age."
    examples:
      "老人はげんきです。": "The old person is healthy."
      "老人はやさしいです。": "The old man is kind."
  "ja-6021":
    native: "clothing"
    notes:
      "n1": "衣 (ifuku): on reading イ (i); kun reading ころも (koromo). Its kana いふく (ifuku), clothing, is the word it stands for in 衣服 (ifuku), and is not yet a taught card. The taught card ふく (fuku), clothes, is a different kanji, 服 (fuku). It is in 衣装 (ishou), costume."
    examples:
      "衣服をかいます。": "I buy clothes."
      "衣服はどこですか。": "Where are the clothes?"
  "ja-6022":
    native: "Osaka; slope"
    notes:
      "n1": "阪 (oosaka): on reading ハン (han); no kun reading. Its kana おおさか (oosaka), Osaka, is the word it stands for in 大阪 (oosaka), and is also the taught card おおさか (oosaka), the same word. It is in 阪神 (hanshin), the Osaka and Kobe area."
    examples:
      "大阪はおおきいです。": "Osaka is big."
      "大阪にいきます。": "I go to Osaka."
  "ja-6023":
    native: "rank; position; a counter for people of rank"
    notes:
      "n1": "位 (chii): on reading イ (i); kun reading くらい (kurai). Its kana ちい (chii), rank, is the word it stands for in 地位 (chii), status, and is not yet a taught card. Its kun reading くらい (kurai), a degree or rank, is the kana of the taught card くらい (kurai), dark, which is a different word, 暗 (kurai)."
    examples:
      "わたしは一位です。": "I am in first place."
      "地位が高いです。": "The rank is high."
  "ja-6024":
    native: "low"
    notes:
      "n1": "低 (hikui): on reading テイ (tei); kun readings ひく-い (hiku-i), ひく-める (hiku-meru) and ひく-まる (hiku-maru). Its kana ひくい (hikui), low, is the word it stands for in its kun reading and is also the taught card ひくい (hikui), the same word. It is in 低温 (teion), low temperature."
    examples:
      "つくえは低いです。": "The desk is low."
      "声が低いです。": "The voice is low."
  "ja-6025":
    native: "help; assist"
    notes:
      "n1": "佐 (saga): on reading サ (sa); no kun reading. Its kana さが (saga), Saga prefecture, is the word it stands for in 佐賀 (saga), and is not yet a taught card. It has no example yet: its words, such as 佐藤 (satou) and 佐賀 (saga), need 藤 or 賀, which are not taught yet."
  "ja-6026":
    native: "child"
    notes:
      "n1": "児 (jidou): on reading ジ (ji), in limited use ニ (ni); no kun reading. Its kana じどう (jidou), pupil, is the word it stands for in 児童 (jidou), and is not yet a taught card. It is in 小児 (shouni), a young child, which uses the on reading ショウ (shou)."
    examples:
      "児童は学校にいきます。": "The pupils go to school."
      "児童はげんきです。": "The pupils are healthy."
  "ja-6027":
    native: "soldier"
    notes:
      "n1": "兵 (heishi): on readings ヘイ (hei) and ヒョウ (hyou); no kun reading. Its kana へいし (heishi), soldier, is the word it stands for in 兵士 (heishi), and is not yet a taught card. It is in 兵隊 (heitai), soldiers. It has no example yet: 兵士 and 兵隊 need 士 and 隊, which are not taught yet."
  "ja-6028":
    native: "cold (to the touch or taste)"
    notes:
      "n1": "冷 (tsumetai): on reading レイ (rei); kun readings つめ-たい (tsume-tai), ひ-える (hi-eru), ひ-や (hi-ya), ひ-やす (hi-yasu), さ-める (sa-meru) and さ-ます (sa-masu). Its kana つめたい (tsumetai), cold, is the word it stands for in its kun reading and is also the taught card つめたい (tsumetai), the same word. It is in 冷蔵 (reizou), refrigeration."
    examples:
      "水が冷たいです。": "The water is cold."
      "お茶は冷たいです。": "The tea is cold."
  "ja-6029":
    native: "first; beginning"
    notes:
      "n1": "初 (hajimete): on reading ショ (sho); kun readings はじ-め (haji-me), はじ-めて (haji-mete), はつ (hatsu), うい (ui) and そ-める (so-meru). Its kana はじめて (hajimete), for the first time, is the word it stands for in its kun reading and is also the taught card はじめて (hajimete), the same word. It is in 最初 (saisho), the first."
    examples:
      "初めて日本にいきます。": "I will go to Japan for the first time."
      "初めてのともだちです。": "This is my first friend."
  "ja-6030":
    native: "separate; other"
    notes:
      "n1": "別 (betsu): on reading ベツ (betsu); kun reading わか-れる (waka-reru). Its kana べつ (betsu), separate or other, is the commonest word the kanji stands for, 別 (betsu), and is not yet a taught card. It is in 別れる (wakareru), to part, which uses the kun reading わか-れる (waka-reru)."
    examples:
      "ともだちと別れます。": "I say goodbye to my friend."
      "別の店にいきます。": "I go to another shop."
  "ja-6031":
    native: "benefit; profit; to use"
    notes:
      "n1": "利 (riyou): on reading リ (ri); kun reading き-く (ki-ku). Its kana りよう (riyou), use, is the commonest word the kanji stands for, 利用 (riyou), and is not yet a taught card. It is in 便利 (benri), convenient, which is also the taught card べんり (benri), the same word."
    examples:
      "バスを利用します。": "I use the bus."
      "駅を利用します。": "I use the station."
  "ja-6032":
    native: "effort; to strive"
    notes:
      "n1": "努 (doryoku): on reading ド (do); kun reading つと-める (tsuto-meru). Its kana どりょく (doryoku), effort, is the commonest word the kanji stands for, 努力 (doryoku), and is not yet a taught card. Its kun reading つとめる (tsutomeru), to strive, is not yet a taught card."
    examples:
      "まいにち努力します。": "I make an effort every day."
      "努力はたいへんです。": "Effort is hard."
  "ja-6033":
    native: "labour; toil"
    notes:
      "n1": "労 (roudou): on reading ロウ (rou); no kun reading. Its kana ろうどう (roudou), labour, is the commonest word the kanji stands for, 労働 (roudou), and is not yet a taught card. It is in 労働者 (roudousha), worker. It has one example: 労力 (rouryoku), effort, uses 力, which is taught."
    examples:
      "労力はたいへんです。": "Effort is hard work."
  "ja-6034":
    native: "complete; finished"
    notes:
      "n1": "完 (kansei): on reading カン (kan); no kun reading. Its kana かんせい (kansei), completion, is the commonest word the kanji stands for, 完成 (kansei), and is not yet a taught card. It is in 完全 (kanzen), perfect, which is also written with the taught kanji 全."
    examples:
      "それは完全です。": "That is perfect."
  "ja-6035":
    native: "a fork in the road; a branch"
    notes:
      "n1": "岐 (gifu): on reading キ (ki); no kun reading. Its kana ぎふ (gifu), Gifu, is the word it stands for in 岐阜 (gifu), and is not yet a taught card. It is in 岐路 (kiro), a crossroads. It has one example: 岐路 is written with the taught kanji 路."
    examples:
      "ここは岐路です。": "This is a crossroads."
  "ja-6036":
    native: "hope; rare"
    notes:
      "n1": "希 (kishou): on reading キ (ki); kun reading のぞ-む (nozo-mu). Its kana きしょう (kishou), rare, is the word it stands for in 希少 (kishou), and is not yet a taught card. It is in 希望 (kibou), hope. Its kun reading のぞむ (nozomu), to wish, is not yet a taught card."
    examples:
      "これは希少です。": "This is rare."
  "ja-6037":
    native: "to fold; to break"
    notes:
      "n1": "折 (oru): on reading セツ (setsu); kun readings お-る (o-ru), おり (ori) and お-れる (o-reru). Its kana おる (oru), to fold, is the word it stands for in its kun reading and is not yet a taught card. It is in 骨折 (kossetsu), a broken bone, which uses the on reading セツ (setsu)."
    examples:
      "紙を折ります。": "I fold the paper."
      "足を折りました。": "I broke my leg."
  "ja-6038":
    native: "again; anew; to change"
    notes:
      "n1": "改 (aratamete): on reading カイ (kai); kun readings あらた-める (arata-meru) and あらた-まる (arata-maru). Its kana あらためて (aratamete), again, is the word it stands for in its kun reading, 改めて (aratamete), and is not yet a taught card. It is in 改正 (kaisei), revision, which uses the on reading カイ (kai)."
    examples:
      "改めて話します。": "I will talk about it again."
  "ja-6039":
    native: "material; timber"
    notes:
      "n1": "材 (mokuzai): on reading ザイ (zai); no kun reading. Its kana もくざい (mokuzai), timber, is the commonest word the kanji stands for, 木材 (mokuzai), and is not yet a taught card. It is in 材料 (zairyou), ingredients."
    examples:
      "木材は重いです。": "Timber is heavy."
      "木材をかいます。": "I buy timber."
  "ja-6040":
    native: "bundle; bunch"
    notes:
      "n1": "束 (hanataba): on reading ソク (soku); kun reading たば (taba). Its kana はなたば (hanataba), bunch of flowers, is the word it stands for in 花束 (hanataba), and is not yet a taught card. Its kun reading たば (taba), bundle, is not yet a taught card. It is in 約束 (yakusoku), promise, which uses the on reading ソク (soku)."
    examples:
      "花束をかいます。": "I buy a bunch of flowers."
      "花束はきれいです。": "The bunch of flowers is beautiful."
  "ja-6041":
    native: "to seek; to ask for"
    notes:
      "n1": "求 (motomeru): on reading キュウ (kyuu); kun reading もと-める (moto-meru). Its kana もとめる (motomeru), to seek, is the word it stands for in its kun reading, 求める (motomeru), and is not yet a taught card. It is in 求人 (kyuujin), a job vacancy, which uses the on reading キュウ (kyuu)."
    examples:
      "仕事を求めます。": "I look for work."
      "求人はありますか。": "Are there any job vacancies?"
  "ja-6042":
    native: "out at sea; offshore"
    notes:
      "n1": "沖 (oki): on reading チュウ (chuu); kun reading おき (oki). Its kana おき (oki), out at sea, is the word it stands for in its kun reading and is not yet a taught card. It is in 沖縄 (okinawa), Okinawa, which uses the kun reading おき (oki). It has one example."
    examples:
      "船は沖にあります。": "The boat is out at sea."
  "ja-6043":
    native: "subject; minister"
    notes:
      "n1": "臣 (daijin): on readings シン (shin) and ジン (jin); no kun reading. Its kana だいじん (daijin), minister, is the commonest word the kanji stands for, 大臣 (daijin), and is not yet a taught card. It is in 家臣 (kashin), a retainer, which uses the on reading シン (shin)."
    examples:
      "大臣はいそがしいです。": "The minister is busy."
      "大臣に会います。": "I meet the minister."
  "ja-6044":
    native: "good"
    notes:
      "n1": "良 (yoi): on reading リョウ (ryou); kun reading よ-い (yo-i). Its kana よい (yoi), good, is the word it stands for in its kun reading and is not yet a taught card. The taught card いい (ii), good, is the casual form of the same word. It is in 良好 (ryoukou), good condition, which uses the on reading リョウ (ryou)."
    examples:
      "天気が良いです。": "The weather is good."
      "今日は良いです。": "Today is good."
  "ja-6045":
    native: "art; skill; entertainment"
    notes:
      "n1": "芸 (geinin): on reading ゲイ (gei); no kun reading. Its kana げいにん (geinin), entertainer, is the word it stands for in 芸人 (geinin), and is not yet a taught card. It is in 芸術 (geijutsu), art."
    examples:
      "芸人はおもしろいです。": "Entertainers are funny."
      "芸人に会います。": "I meet an entertainer."
  "ja-6046":
    native: "example; to compare"
    notes:
      "n1": "例 (tatoeba): on reading レイ (rei); kun reading たと-える (tato-eru). Its kana たとえば (tatoeba), for example, is the word it stands for in its kun reading, 例えば (tatoeba), and is not yet a taught card. It is in 例文 (reibun), an example sentence, which uses the on reading レイ (rei)."
    examples:
      "例えばりんごがすきです。": "For example, I like apples."
      "例文をよみます。": "I read an example sentence."
  "ja-6047":
    native: "rule; code; classic"
    notes:
      "n1": "典 (jiten): on reading テン (ten); no kun reading. Its kana じてん (jiten), dictionary, is the commonest word the kanji stands for, 辞典 (jiten), and is not yet a taught card. It is in 典型 (tenkei), a typical example, which uses the on reading テン (ten)."
    examples:
      "事典をかいました。": "I bought an encyclopedia."
      "事典は高いです。": "The encyclopedia is expensive."
  "ja-6048":
    native: "to print"
    notes:
      "n1": "刷 (insatsu): on reading サツ (satsu); kun reading す-る (su-ru). Its kana いんさつ (insatsu), printing, is the commonest word it is part of, 印刷 (insatsu), and is not yet a taught card. It is in 刷新 (sasshin), renewal, which uses the on reading サツ (satsu)."
    examples:
      "本を刷ります。": "I print a book."
      "紙に刷ります。": "I print on paper."
