id: "ja-en-kanji-19"
kind: "layer"
core: "ja-kanji-19"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 19: grade 4, part 2"
description: "Twenty-nine kanji of the fourth school grade, each taught by the kana reading of the word it stands for. Most have no example yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-6020":
    native: "old person; elderly"
    notes:
      "n1": "老 (roujin): on reading ロウ (rou); kun readings お-いる (o-iru) and ふ-ける (fu-keru). Its kana ろうじん (roujin), old person, is the commonest word the kanji stands for, 老人 (roujin), and is not yet a taught card. It is in 老後 (rougo), old age. No taught word uses it, so it has no example yet."
  "ja-6021":
    native: "clothing"
    notes:
      "n1": "衣 (ifuku): on reading イ (i); kun reading ころも (koromo). Its kana いふく (ifuku), clothing, is the word it stands for in 衣服 (ifuku), and is not yet a taught card. The taught card ふく (fuku), clothes, is a different kanji, 服 (fuku). It is in 衣装 (ishou), costume. No taught word uses it, so it has no example yet."
  "ja-6022":
    native: "Osaka; slope"
    notes:
      "n1": "阪 (oosaka): on reading ハン (han); no kun reading. Its kana おおさか (oosaka), Osaka, is the word it stands for in 大阪 (oosaka), and is also the taught card おおさか (oosaka), the same word. It is in 阪神 (hanshin), the Osaka and Kobe area."
    examples:
      "大阪はおおきいです。": "Osaka is big."
      "大阪にいきます。": "I go to Osaka."
  "ja-6023":
    native: "rank; position; a counter for people of rank"
    notes:
      "n1": "位 (chii): on reading イ (i); kun reading くらい (kurai). Its kana ちい (chii), rank, is the word it stands for in 地位 (chii), status, and is not yet a taught card. Its kun reading くらい (kurai), a degree or rank, is the kana of the taught card くらい (kurai), dark, which is a different word, 暗 (kurai). No taught word uses it, so it has no example yet."
  "ja-6024":
    native: "low"
    notes:
      "n1": "低 (hikui): on reading テイ (tei); kun readings ひく-い (hiku-i), ひく-める (hiku-meru) and ひく-まる (hiku-maru). Its kana ひくい (hikui), low, is the word it stands for in its kun reading and is also the taught card ひくい (hikui), the same word. It is in 低温 (teion), low temperature."
    examples:
      "つくえは低いです。": "The desk is low."
      "声が低いです。": "The voice is low."
  "ja-6025":
    native: "help; assist"
    notes:
      "n1": "佐 (saga): on reading サ (sa); no kun reading. Its kana さが (saga), Saga prefecture, is the word it stands for in 佐賀 (saga), which is written with 賀 (ga), and is not yet a taught card. It is in 佐藤 (satou), a surname, which is written with 藤 (tou), also not yet taught. No taught word uses it, so it has no example yet."
  "ja-6026":
    native: "child"
    notes:
      "n1": "児 (jidou): on reading ジ (ji), in limited use ニ (ni); no kun reading. Its kana じどう (jidou), pupil, is the word it stands for in 児童 (jidou), and is not yet a taught card. It is in 小児 (shouni), a young child, which uses the on reading ショウ (shou). No taught word uses it, so it has no example yet."
  "ja-6027":
    native: "soldier"
    notes:
      "n1": "兵 (heishi): on readings ヘイ (hei) and ヒョウ (hyou); no kun reading. Its kana へいし (heishi), soldier, is the word it stands for in 兵士 (heishi), which is written with 士 (shi), and is not yet a taught card. It is in 兵隊 (heitai), soldiers, which is written with 隊 (tai). 士 (shi) and 隊 (tai) are not yet taught. No taught word uses it, so it has no example yet."
  "ja-6028":
    native: "cold (to the touch or taste)"
    notes:
      "n1": "冷 (tsumetai): on reading レイ (rei); kun readings つめ-たい (tsume-tai), ひ-える (hi-eru), ひ-や (hi-ya), ひ-やす (hi-yasu), さ-める (sa-meru) and さ-ます (sa-masu). Its kana つめたい (tsumetai), cold, is the word it stands for in its kun reading and is also the taught card つめたい (tsumetai), the same word. It is in 冷蔵 (reizou), refrigeration."
    examples:
      "水が冷たいです。": "The water is cold."
      "お茶は冷たいです。": "The tea is cold."
  "ja-6029":
    native: "first; beginning"
    notes:
      "n1": "初 (hajimete): on reading ショ (sho); kun readings はじ-め (haji-me), はじ-めて (haji-mete), はつ (hatsu), うい (ui) and そ-める (so-meru). Its kana はじめて (hajimete), for the first time, is the word it stands for in its kun reading and is also the taught card はじめて (hajimete), the same word. It is in 最初 (saisho), the first."
    examples:
      "初めて日本にいきます。": "I will go to Japan for the first time."
      "初めてのともだちです。": "This is my first friend."
  "ja-6030":
    native: "separate; other"
    notes:
      "n1": "別 (betsu): on reading ベツ (betsu); kun reading わか-れる (waka-reru). Its kana べつ (betsu), separate or other, is the commonest word the kanji stands for, 別 (betsu), and is not yet a taught card. It is in 別れる (wakareru), to part, which uses the kun reading わか-れる (waka-reru). No taught word uses it, so it has no example yet."
  "ja-6031":
    native: "benefit; profit; to use"
    notes:
      "n1": "利 (riyou): on reading リ (ri); kun reading き-く (ki-ku). Its kana りよう (riyou), use, is the commonest word the kanji stands for, 利用 (riyou), and is not yet a taught card. It is in 便利 (benri), convenient, which is also the taught card べんり (benri), the same word. No taught word uses it, so it has no example yet."
  "ja-6032":
    native: "effort; to strive"
    notes:
      "n1": "努 (doryoku): on reading ド (do); kun reading つと-める (tsuto-meru). Its kana どりょく (doryoku), effort, is the commonest word the kanji stands for, 努力 (doryoku), and is not yet a taught card. Its kun reading つとめる (tsutomeru), to strive, is not yet a taught card. No taught word uses it, so it has no example yet."
  "ja-6033":
    native: "labour; toil"
    notes:
      "n1": "労 (roudou): on reading ロウ (rou); no kun reading. Its kana ろうどう (roudou), labour, is the commonest word the kanji stands for, 労働 (roudou), and is not yet a taught card. It is in 労働者 (roudousha), worker. No taught word uses it, so it has no example yet."
  "ja-6034":
    native: "complete; finished"
    notes:
      "n1": "完 (kansei): on reading カン (kan); no kun reading. Its kana かんせい (kansei), completion, is the commonest word the kanji stands for, 完成 (kansei), and is not yet a taught card. It is in 完全 (kanzen), perfect, which is also written with the kanji 全 (zen). No taught word uses it, so it has no example yet."
  "ja-6035":
    native: "a fork in the road; a branch"
    notes:
      "n1": "岐 (gifu): on reading キ (ki); no kun reading. Its kana ぎふ (gifu), Gifu, is the word it stands for in 岐阜 (gifu), where the kanji is read ぎ (gi), and is not yet a taught card. It is in 岐路 (kiro), a crossroads, where it is read き (ki). No taught word uses it, so it has no example yet."
  "ja-6036":
    native: "hope; rare"
    notes:
      "n1": "希 (kishou): on reading キ (ki); no kun reading. Its kana きしょう (kishou), rare, is the word it stands for in 希少 (kishou), and is not yet a taught card. It is in 希望 (kibou), hope. No taught word uses it, so it has no example yet."
  "ja-6037":
    native: "to fold; to break"
    notes:
      "n1": "折 (oru): on reading セツ (setsu); kun readings お-る (o-ru), おり (ori) and お-れる (o-reru). Its kana おる (oru), to fold, is the word it stands for in its kun reading and is not yet a taught card. 折り紙 (origami), origami, is the taught card おりがみ (origami), the same word, written with the taught kanji 紙 (kami). It is in 骨折 (kossetsu), a broken bone, which uses the on reading セツ (setsu)."
    examples:
      "折り紙はおもしろいです。": "Origami is fun."
      "折り紙はきれいです。": "Origami is beautiful."
  "ja-6038":
    native: "again; anew; to change"
    notes:
      "n1": "改 (aratamete): on reading カイ (kai); kun readings あらた-める (arata-meru) and あらた-まる (arata-maru). Its kana あらためて (aratamete), again, is the word it stands for in its kun reading, 改めて (aratamete), and is not yet a taught card. It is in 改正 (kaisei), revision, which uses the on reading カイ (kai)."
    examples:
      "改札はどこですか。": "Where is the ticket gate?"
      "改札はちかいです。": "The ticket gate is near."
  "ja-6039":
    native: "material; timber"
    notes:
      "n1": "材 (mokuzai): on reading ザイ (zai); no kun reading. Its kana もくざい (mokuzai), timber, is the commonest word the kanji stands for, 木材 (mokuzai), and is not yet a taught card. It is in 材料 (zairyou), ingredients. No taught word uses it, so it has no example yet."
  "ja-6040":
    native: "bundle; bunch"
    notes:
      "n1": "束 (taba): on reading ソク (soku); kun reading たば (taba). Its kana たば (taba), bundle, is the word it stands for in its kun reading and is not yet a taught card. It is in 約束 (yakusoku), promise, a common word which uses the on reading ソク (soku); 約 (yaku) is not taught yet. No taught word uses it, so it has no example yet."
  "ja-6041":
    native: "to seek; to ask for"
    notes:
      "n1": "求 (motomeru): on reading キュウ (kyuu); kun reading もと-める (moto-meru). Its kana もとめる (motomeru), to seek, is the word it stands for in its kun reading, 求める (motomeru), and is not yet a taught card. It is in 求人 (kyuujin), a job vacancy, which uses the on reading キュウ (kyuu). No taught word uses it, so it has no example yet."
  "ja-6042":
    native: "out at sea; offshore"
    notes:
      "n1": "沖 (oki): on reading チュウ (chuu); kun reading おき (oki). Its kana おき (oki), out at sea, is the word it stands for in its kun reading and is not yet a taught card. It is in 沖縄 (okinawa), Okinawa, which uses the kun reading おき (oki). No taught word uses it, so it has no example yet."
  "ja-6043":
    native: "subject; minister"
    notes:
      "n1": "臣 (daijin): on readings シン (shin) and ジン (jin); no kun reading. Its kana だいじん (daijin), minister, is the commonest word the kanji stands for, 大臣 (daijin), and is not yet a taught card. It is in 家臣 (kashin), a retainer, which uses the on reading シン (shin). No taught word uses it, so it has no example yet."
  "ja-6044":
    native: "good"
    notes:
      "n1": "良 (ii): on reading リョウ (ryou); kun reading よ-い (yo-i). Its kana いい (ii), good, is the word it stands for and is also the taught card いい (ii), the same word. It is in 良好 (ryoukou), good condition, which uses the on reading リョウ (ryou)."
    examples:
      "天気が良いです。": "The weather is good."
      "今日は良いです。": "Today is good."
  "ja-6045":
    native: "art; skill; entertainment"
    notes:
      "n1": "芸 (geinin): on reading ゲイ (gei); no kun reading. Its kana げいにん (geinin), entertainer, is the word it stands for in 芸人 (geinin), and is not yet a taught card. It is in 芸術 (geijutsu), art. No taught word uses it, so it has no example yet."
  "ja-6046":
    native: "example; to compare"
    notes:
      "n1": "例 (tatoeba): on reading レイ (rei); kun reading たと-える (tato-eru). Its kana たとえば (tatoeba), for example, is the word it stands for in its kun reading, 例えば (tatoeba), and is not yet a taught card. It is in 例文 (reibun), an example sentence, which uses the on reading レイ (rei). No taught word uses it, so it has no example yet."
  "ja-6047":
    native: "rule; code; classic"
    notes:
      "n1": "典 (jiten): on reading テン (ten); no kun reading. Its kana じてん (jiten), dictionary, is the commonest word the kanji stands for, 辞典 (jiten), and is not yet a taught card. It is in 典型 (tenkei), a typical example, which uses the on reading テン (ten). No taught word uses it, so it has no example yet."
  "ja-6048":
    native: "to print"
    notes:
      "n1": "刷 (insatsu): on reading サツ (satsu); kun reading す-る (su-ru). Its kana いんさつ (insatsu), printing, is the commonest word it is part of, 印刷 (insatsu), and is not yet a taught card. It is in 刷新 (sasshin), renewal, which uses the on reading サツ (satsu). No taught word uses it, so it has no example yet."
