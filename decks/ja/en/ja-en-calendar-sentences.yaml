"cards":
  "ja-1432":
    "native": "Today is Sunday."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "to be (polite)"
    "confusables":
      "w1":
        "why": "tomorrow, not today"
      "w2":
        "why": "yesterday, not today"
  "ja-1433":
    "native": "Tomorrow is Monday."
    "notes":
      "n1": "あした (ashita, tomorrow) has a more formal form, あす (asu)."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "to be (polite)"
    "confusables":
      "w1":
        "why": "today, not tomorrow"
      "w2":
        "why": "the day after tomorrow"
  "ja-1434":
    "native": "Next month I go to Osaka."
    "notes":
      "n1": "へ (he) marks direction and is read e, as in おおさかへ (oosaka e), to Osaka."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "へ":
        "meaning": "(to, towards)"
      "いきます":
        "meaning": "to go (polite)"
    "confusables":
      "w1":
        "why": "this month, not next month"
      "w2":
        "why": "last month, not next month"
  "ja-1435":
    "native": "Last night I went to bed early."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "ねました":
        "meaning": "to sleep (polite, past)"
    "confusables":
      "w1":
        "why": "tonight, not last night"
      "w2":
        "why": "this morning, not last night"
  "ja-1436":
    "native": "Every Saturday I do the shopping."
    "notes":
      "n1": "まい (mai) means every: まいしゅう (maishuu) is every week, and まいにち (mainichi) every day."
    "bases":
      "に":
        "meaning": "(marks the time or the place)"
      "を":
        "meaning": "(marks the thing acted on)"
      "します":
        "meaning": "to do (polite)"
    "confusables":
      "w1":
        "why": "every day, not every week"
      "w2":
        "why": "this week, not every week"
  "ja-1437":
    "native": "Last week's Friday was rainy."
    "bases":
      "の":
        "meaning": "(of, belonging to)"
      "は":
        "meaning": "(marks the topic)"
      "でした":
        "meaning": "to be (polite, past)"
    "confusables":
      "w1":
        "why": "this week, not last week"
      "w2":
        "why": "next week, not last week"
  "ja-1438":
    "native": "There is a doctor's appointment on the public holiday."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "の":
        "meaning": "(of, belonging to)"
      "が":
        "meaning": "(marks the subject)"
      "あります":
        "meaning": "to be, to exist (for things)"
    "confusables":
      "w1":
        "why": "birthday, not appointment"
      "w2":
        "why": "day off, not appointment"
  "ja-1439":
    "native": "I write the date and then go out."
    "notes":
      "n1": "から (kara, after) follows the te-form of a verb, as in かいてから (kaite kara), after writing."
    "bases":
      "を":
        "meaning": "(marks the thing acted on)"
      "かいて":
        "meaning": "to write (te-form)"
      "から":
        "meaning": "(after)"
      "でかけます":
        "meaning": "to go out (polite)"
    "confusables":
      "w1":
        "why": "to read, not to write"
      "w2":
        "why": "to look, not to write"
  "ja-1440":
    "native": "Monday and Wednesday are work days."
    "bases":
      "と":
        "meaning": "(with)"
      "は":
        "meaning": "(marks the topic)"
      "です":
        "meaning": "to be (polite)"
    "confusables":
      "w1":
        "why": "Saturday, not Monday"
      "w2":
        "why": "Sunday, not Monday"
  "ja-1441":
    "native": "Tonight I eat dinner with a friend."
    "bases":
      "は":
        "meaning": "(marks the topic)"
      "と":
        "meaning": "(with)"
      "を":
        "meaning": "(marks the thing acted on)"
      "たべます":
        "meaning": "to eat (polite)"
    "confusables":
      "w1":
        "why": "last night, not tonight"
      "w2":
        "why": "tomorrow, not tonight"
