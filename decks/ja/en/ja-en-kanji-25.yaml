id: "ja-en-kanji-25"
kind: "layer"
core: "ja-kanji-25"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 25: grade 5, part 1"
description: "Twenty-eight kanji of the fifth school grade, each taught by the kana reading of the word it stands for. Most have no example yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-6380":
    native: "it has been a long time"
    notes:
      "n1": "久 (hisashii): on reading キュウ (kyuu), and the table lists ク (ku) in parentheses as a special or very narrow use; kun reading ひさ-しい (hisa-shii). Its kana ひさしい (hisashii), it has been a long time, is the word it stands for in its kun reading, written 久しい (hisashii). No taught card has that kana, and no taught word is written with 久 (kyuu), so it has no example yet."
  "ja-6381":
    native: "lawyer"
    notes:
      "n1": "士 (bengoshi): on reading シ (shi); no kun reading. It is not a word on its own, so its kana べんごし (bengoshi), lawyer, is the commonest word it ends, written 弁護士 (bengoshi). That is the same word as the taught card べんごし (bengoshi), lawyer. It is in 富士山 (fujisan), Mount Fuji."
    examples:
      "富士山は高いです。": "Mount Fuji is high."
  "ja-6382":
    native: "Buddha; the dead"
    notes:
      "n1": "仏 (hotoke): on reading ブツ (butsu); kun reading ほとけ (hotoke). Its kana ほとけ (hotoke), Buddha; the dead, is the word it stands for in its kun reading, written 仏 (hotoke). It is not yet a taught card, and no taught word is written with 仏 (butsu), so it has no example yet."
  "ja-6383":
    native: "to support; to prop up"
    notes:
      "n1": "支 (sasaeru): on reading シ (shi); kun reading ささ-える (sasa-eru). Its kana ささえる (sasaeru), to support; to prop up, is the word it stands for in its kun reading, written 支える (sasaeru). It is not yet a taught card. Its example uses 支度 (shitaku), preparation, which is the taught card したく (shitaku); 度 (do) in it has the table's parenthesised reading タク (taku), a special or very narrow use, and the example uses the taught verb する (suru) in its masu form します (shimasu)."
    examples:
      "支度をします。": "I get ready."
  "ja-6384":
    native: "to compare"
    notes:
      "n1": "比 (kuraberu): on reading ヒ (hi); kun reading くら-べる (kura-beru). Its kana くらべる (kuraberu), to compare, is the word it stands for in its kun reading, written 比べる (kuraberu). It is the same word as the taught card くらべる (kuraberu), to compare. Its example uses 比べます (kuraberemasu), the masu form of that taught verb, with the taught words これ (kore) and それ (sore) and the particles と (to) and を (o)."
    examples:
      "これとそれを比べます。": "I compare this with that."
  "ja-6385":
    native: "new book; new publication"
    notes:
      "n1": "刊 (shinkan): on reading カン (kan); no kun reading. It is not a word on its own, so its kana しんかん (shinkan), new book; new publication, is the commonest word it ends, written 新刊 (shinkan). No taught card has that kana, and no taught word is written with 刊 (kan), so it has no example yet."
  "ja-6386":
    native: "haiku; short poem"
    notes:
      "n1": "句 (haiku): on reading ク (ku); no kun reading. Its kana is a compound word: はいく (haiku), haiku; short poem, is the commonest word it ends, written 俳句 (haiku). No taught card has that kana, and no taught word is written with 句 (ku), so it has no example yet."
  "ja-6387":
    native: "possible; can be done"
    notes:
      "n1": "可 (kanou): on reading カ (ka); no kun reading. It is not a word on its own, so its kana かのう (kanou), possible; can be done, is the commonest word it begins, written 可能 (kanou). It is in 可愛らしい (kawairashii), lovely; sweet."
    examples:
      "犬は可愛らしいです。": "The dog is lovely."
  "ja-6388":
    native: "history"
    notes:
      "n1": "史 (rekishi): on reading シ (shi); no kun reading. It is not a word on its own, so its kana れきし (rekishi), history, is the commonest word it ends, written 歴史 (rekishi). No taught card has that kana, and no taught word is written with 史 (shi), so it has no example yet."
  "ja-6389":
    native: "pressure"
    notes:
      "n1": "圧 (atsuryoku): on reading アツ (atsu); no kun reading. It is not a word on its own, so its kana あつりょく (atsuryoku), pressure, is the commonest word it begins, written 圧力 (atsuryoku). Its example uses 血圧 (ketsuatsu), blood pressure, which is the taught card けつあつ (ketsuatsu) and uses the taught kanji 血 (ketsu)."
    examples:
      "血圧は高いです。": "Blood pressure is high."
  "ja-6390":
    native: "cloth"
    notes:
      "n1": "布 (nuno): on reading フ (fu); kun reading ぬの (nuno). Its kana ぬの (nuno), cloth, is the word it stands for in its kun reading, written 布 (nuno). It is the same word as the taught card ぬの (nuno), cloth, so its first example uses that word. Its second example uses 布団 (futon), futon, the taught card ふとん (futon); in it, 団 (dan) has the table's parenthesised reading トン (ton), a special or very narrow use."
    examples:
      "この布はきれいです。": "This cloth is beautiful."
      "この布団はあたたかいです。": "This futon is warm."
  "ja-6391":
    native: "boxed lunch; bento"
    notes:
      "n1": "弁 (bentou): on reading ベン (ben); no kun reading. Its kana is a compound word: べんとう (bentou), boxed lunch; bento, is the commonest word it begins, written 弁当 (bentou). It is the same word as the taught card おべんとう (obentou), boxed lunch; bento, written お弁当 (obentou) with the polite prefix お (o). Its example uses お弁当 (obentou) with the taught adjective おいしい (oishii), delicious."
    examples:
      "お弁当はおいしいです。": "The bento is delicious."
  "ja-6392":
    native: "old friend"
    notes:
      "n1": "旧 (kyuuyuu): on reading キュウ (kyuu); no kun reading. It is not a word on its own, so its kana きゅうゆう (kyuuyuu), old friend, is a word it begins, written 旧友 (kyuuyuu). No taught card has that kana, and no taught word is written with 旧 (kyuu), so it has no example yet."
  "ja-6393":
    native: "long (of time)"
    notes:
      "n1": "永 (nagai): on reading エイ (ei); kun reading なが-い (naga-i). Its kana ながい (nagai), long (of time), is the word it stands for in its kun reading, written 永い (nagai). It is the same word as the taught card ながい (nagai), long, which the taught kanji card 長 (nagai) also has; 長い (nagai) is the usual writing for length. No taught word is written with 永 (ei), so it has no example yet."
  "ja-6394":
    native: "to commit a crime; to violate"
    notes:
      "n1": "犯 (okasu): on reading ハン (han); kun reading おか-す (oka-su). Its kana おかす (okasu), to commit a crime; to violate, is the word it stands for in its kun reading, written 犯す (okasu). It is not yet a taught card, and no taught word is written with 犯 (han), so it has no example yet."
  "ja-6395":
    native: "to show; to indicate"
    notes:
      "n1": "示 (shimesu): on reading ジ (ji), and シ (shi) in the table; kun reading しめ-す (shime-su). Its kana しめす (shimesu), to show; to indicate, is the word it stands for in its kun reading, written 示す (shimesu). It is not yet a taught card, and no taught word is written with 示 (ji), so it has no example yet."
  "ja-6396":
    native: "temporary; provisional"
    notes:
      "n1": "仮 (kari): on reading カ (ka), and the table lists ケ (ke) in parentheses as a special or very narrow use; kun reading かり (kari). Its kana かり (kari), temporary; provisional, is the word it stands for in its kun reading, written 仮 (kari). It is not yet a taught card, and no taught word is written with 仮 (ka), so it has no example yet."
  "ja-6397":
    native: "incident; case"
    notes:
      "n1": "件 (jiken): on reading ケン (ken); no kun reading. Its kana is a compound word: じけん (jiken), incident; case, is the commonest word it ends, written 事件 (jiken). No taught card has that kana, and no taught word is written with 件 (ken), so it has no example yet."
  "ja-6398":
    native: "to entrust; to leave to"
    notes:
      "n1": "任 (makaseru): on reading ニン (nin); kun readings まか-せる (maka-seru) and まか-す (maka-su). Its kana まかせる (makaseru), to entrust; to leave to, is the word it stands for in its kun reading, written 任せる (makaseru). It is the same word as the taught card まかせる (makaseru), to entrust. Its first example uses 任せます (makasemasu), the masu form of that taught verb. Its second uses 主任 (shunin), chief, which is the taught card しゅにん (shunin) and uses the taught kanji 主 (shu)."
    examples:
      "これを任せます。": "I entrust this to you."
      "わたしは主任です。": "I am the head."
  "ja-6399":
    native: "again; once more"
    notes:
      "n1": "再 (futatabi): on reading サイ (sai), and the table lists サ (sa) in parentheses as a special or very narrow use; kun reading ふたた-び (futata-bi). Its kana ふたたび (futatabi), again; once more, is the word it stands for in its kun reading, written 再び (futatabi). It is not yet a taught card, and no taught word is written with 再 (sai), so it has no example yet."
  "ja-6400":
    native: "cause; origin"
    notes:
      "n1": "因 (gen'in): on reading イン (in); kun reading よ-る (yo-ru). Its kana げんいん (gen'in), cause; origin, is the commonest word it ends, written 原因 (gen'in). The kun reading よる (yoru), to be caused by, is written 因る (yoru) and is rare; the taught card よる (yoru), night, is a different word, written 夜 (yoru). No taught word is written with 因 (in), so it has no example yet."
  "ja-6401":
    native: "group; organization"
    notes:
      "n1": "団 (dantai): on reading ダン (dan), and the table lists トン (ton) in parentheses as a special or very narrow use; no kun reading. It is not a word on its own, so its kana だんたい (dantai), group; organization, is the commonest word it begins, written 団体 (dantai). No taught card has that kana. Its example uses 布団 (futon), futon, the taught card ふとん (futon), in which 団 (dan) has the reading トン (ton)."
    examples:
      "この布団はあたたかいです。": "This futon is warm."
  "ja-6402":
    native: "to exist; to be located"
    notes:
      "n1": "在 (aru): on reading ザイ (zai); kun reading あ-る (a-ru). Its kana ある (aru), to exist; to be located, is the word it stands for in its kun reading, written 在る (aru). It is the same word as the taught kanji card 有 (yuu), whose kana ある (aru) is to exist; to have, written 有る (aru), since both are writings of ある (aru). The taught card ざいたく (zaitaku) would need 宅 (taku), which is not taught, so no taught word is written with 在 (zai) and it has no example yet."
  "ja-6403":
    native: "to resemble"
    notes:
      "n1": "似 (niru): on reading ジ (ji); kun reading に-る (ni-ru). Its kana にる (niru), to resemble, is the word it stands for in its kun reading, written 似る (niru). The taught card にる (niru), to simmer, is a different word, written 煮る (niru), so the two cards share a kana but not a word. Its example uses 似合います (niaimasu), the masu form of 似合う (niau), which is the taught card にあう (niau) and uses the taught kanji 合 (gou) and the taught word 服 (fuku), clothes."
    examples:
      "この服は似合います。": "This outfit suits you."
  "ja-6404":
    native: "to be left over; to remain"
    notes:
      "n1": "余 (amaru): on reading ヨ (yo); kun readings あま-る (ama-ru) and あま-す (ama-su). Its kana あまる (amaru), to be left over; to remain, is the word it stands for in its kun reading, written 余る (amaru). The taught adverb あまり (amari), not much; not very, is written 余り (amari) and shares its root, but it is a different word. Its example uses 余り (amari) with the taught verb ねる (neru), to sleep, in its masu negative ねません (nemasen)."
    examples:
      "わたしは余りねません。": "I do not sleep much."
  "ja-6405":
    native: "judgment; decision"
    notes:
      "n1": "判 (handan): on reading ハン (han), and バン (ban); no kun reading. Its kana is a compound word: はんだん (handan), judgment; decision, is the commonest word it ends, written 判断 (handan). No taught card has that kana, and no taught word is written with 判 (han), so it has no example yet."
  "ja-6406":
    native: "to tell; to announce"
    notes:
      "n1": "告 (tsugeru): on reading コク (koku); kun reading つ-げる (tsu-geru). Its kana つげる (tsugeru), to tell; to announce, is the word it stands for in its kun reading, written 告げる (tsugeru). It is not yet a taught card. 報告 (houkoku), report, is a taught card, but it needs 報 (hou), which is not taught, so no taught word is written with 告 (koku) and it has no example yet."
  "ja-6407":
    native: "to surround; to enclose"
    notes:
      "n1": "囲 (kakomu): on reading イ (i); kun readings かこ-む (kako-mu) and かこ-う (kako-u). Its kana かこむ (kakomu), to surround; to enclose, is the word it stands for in its kun reading, written 囲む (kakomu). It is not yet a taught card, and no taught word is written with 囲 (i), so it has no example yet."
