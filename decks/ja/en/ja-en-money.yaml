"schema": 1
"id": "ja-en-money"
"kind": "layer"
"core": "ja-money"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Money"
"description": "Forty-five words for money: bills and prices, savings and debt, paying, haggling and saving. Not yet checked by a Japanese speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
  - "beginner"
  - "unreviewed"
"cards":
  "ja-8000":
    "native": "money; gold"
    "notes":
      "n1": "かね (kane) is money, and gold in older use."
    "examples":
      "かねがありません。": { "native": "I have no money.", "bases": { "が": { "meaning": "(marks the subject)" }, "ありません": { "meaning": "to have (polite negative)" } } }
      "かねをかぞえます。": { "native": "I count the money.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "かぞえます": { "meaning": "to count (polite)" } } }
  "ja-8001":
    "native": "small change"
    "notes":
      "n1": "こぜに (kozeni) is the coins you get back from a payment."
    "examples":
      "こぜにがあります。": { "native": "I have some small change.", "bases": { "が": { "meaning": "(marks the subject)" }, "あります": { "meaning": "to have (polite)" } } }
      "こぜにをください。": { "native": "Please give me the small change.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "ください": { "meaning": "please (give me)" } } }
  "ja-8002":
    "native": "banknote"
    "notes":
      "n1": "さつ (satsu) is a paper note of money, not a coin."
    "examples":
      "ふるいさつです。": { "native": "It is an old banknote.", "bases": { "ふるい": { "meaning": "old" }, "です": { "meaning": "to be (polite)" } } }
      "さつではらいます。": { "native": "I pay with a banknote.", "bases": { "で": { "meaning": "(by means of)" }, "はらいます": { "meaning": "to pay (polite)" } } }
  "ja-8003":
    "native": "paper money"
    "notes":
      "n1": "しへい (shihei) is money made of paper, as opposed to coins."
    "examples":
      "しへいとこうかがあります。": { "native": "I have paper money and coins.", "bases": { "と": { "meaning": "(and; with)" }, "こうか": { "meaning": "coin" }, "が": { "meaning": "(marks the subject)" }, "あります": { "meaning": "to have (polite)" } } }
      "しへいはつかえます。": { "native": "Paper money can be used.", "bases": { "は": { "meaning": "(marks the topic)" }, "つかえます": { "meaning": "to be usable (polite)" } } }
  "ja-8004":
    "native": "coin"
    "notes":
      "n1": "こうか (kouka) is a coin, a piece of metal money."
    "examples":
      "こうかをいれます。": { "native": "I put in a coin.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "いれます": { "meaning": "to put in (polite)" } } }
      "こうかはちいさいです。": { "native": "The coin is small.", "bases": { "は": { "meaning": "(marks the topic)" }, "ちいさい": { "meaning": "small" }, "です": { "meaning": "to be (polite)" } } }
  "ja-8005":
    "native": "amount of money"
    "notes":
      "n1": "きんがく (kingaku) is how much money a thing or a bill comes to."
    "examples":
      "きんがくはいくらですか。": { "native": "What is the amount of money?", "bases": { "は": { "meaning": "(marks the topic)" }, "いくら": { "meaning": "how much" }, "です": { "meaning": "to be (polite)" }, "か": { "meaning": "(question marker)" } } }
      "きんがくをかきます。": { "native": "I write down the amount.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "かきます": { "meaning": "to write (polite)" } } }
  "ja-8006":
    "native": "price; payment"
    "notes":
      "n1": "だいきん (daikin) is the money paid for goods or a service."
    "examples":
      "だいきんをはらいます。": { "native": "I pay the price.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "はらいます": { "meaning": "to pay (polite)" } } }
      "だいきんがたかいです。": { "native": "The price is high.", "bases": { "が": { "meaning": "(marks the subject)" }, "たかい": { "meaning": "expensive; high" }, "です": { "meaning": "to be (polite)" } } }
  "ja-8007":
    "native": "expense; cost"
    "notes":
      "n1": "ひよう (hiyou) is money spent on a task or for a purpose."
    "examples":
      "ひようがおおいです。": { "native": "The costs are high.", "bases": { "が": { "meaning": "(marks the subject)" }, "おおい": { "meaning": "many; much" }, "です": { "meaning": "to be (polite)" } } }
      "ひようをへらします。": { "native": "I reduce the costs.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "へらします": { "meaning": "to reduce (polite)" } } }
  "ja-8008":
    "native": "expenses"
    "notes":
      "n1": "けいひ (keihi) is money spent in the course of work, such as travel and supplies."
    "examples":
      "けいひのほうこくです。": { "native": "It is a report of expenses.", "bases": { "の": { "meaning": "(of; belonging to)" }, "ほうこく": { "meaning": "report" }, "です": { "meaning": "to be (polite)" } } }
      "けいひでたびをします。": { "native": "I travel at the company's expense.", "bases": { "で": { "meaning": "(by means of)" }, "たび": { "meaning": "trip; travel" }, "を": { "meaning": "(marks the thing acted on)" }, "します": { "meaning": "to do (polite)" } } }
  "ja-8009":
    "native": "living costs"
    "notes":
      "n1": "せいかつひ (seikatsuhi) is the money a household needs for food, rent and bills."
    "examples":
      "せいかつひがたかいです。": { "native": "Living costs are high.", "bases": { "が": { "meaning": "(marks the subject)" }, "たかい": { "meaning": "expensive; high" }, "です": { "meaning": "to be (polite)" } } }
      "せいかつひをへらしたいです。": { "native": "I want to reduce living costs.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "へらしたい": { "meaning": "want to reduce" }, "です": { "meaning": "to be (polite)" } } }
  "ja-8010":
    "native": "utilities"
    "notes":
      "n1": "こうねつひ (kounetsuhi) is the money for heat, light and water in a home."
    "examples":
      "こうねつひがかかります。": { "native": "Utilities cost money.", "bases": { "が": { "meaning": "(marks the subject)" }, "かかります": { "meaning": "to cost (polite)" } } }
      "こうねつひをはらいます。": { "native": "I pay the utilities.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "はらいます": { "meaning": "to pay (polite)" } } }
  "ja-8011":
    "native": "electricity bill"
    "notes":
      "n1": "でんきだい (denkidai) is the bill for the electricity a home uses."
    "examples":
      "でんきだいがたかいです。": { "native": "The electricity bill is high.", "bases": { "が": { "meaning": "(marks the subject)" }, "たかい": { "meaning": "expensive; high" }, "です": { "meaning": "to be (polite)" } } }
      "でんきだいはあしたまでです。": { "native": "The electricity bill is due by tomorrow.", "bases": { "は": { "meaning": "(marks the topic)" }, "あした": { "meaning": "tomorrow" }, "まで": { "meaning": "(as far as; until)" }, "です": { "meaning": "to be (polite)" } } }
  "ja-8012":
    "native": "gas bill"
    "notes":
      "n1": "ガスだい (gasudai) is the bill for the gas used for cooking and hot water."
    "examples":
      "ガスだいがやすくなりました。": { "native": "The gas bill became cheaper.", "bases": { "が": { "meaning": "(marks the subject)" }, "やすく": { "meaning": "cheap" }, "なりました": { "meaning": "to become (polite past)" } } }
      "ガスだいをしはらいます。": { "native": "I pay the gas bill.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "しはらいます": { "meaning": "to pay (polite)" } } }
  "ja-8013":
    "native": "water bill"
    "notes":
      "n1": "すいどうだい (suidoudai) is the bill for water and drainage."
    "examples":
      "すいどうだいのはなしです。": { "native": "It is about the water bill.", "bases": { "の": { "meaning": "(of; belonging to)" }, "はなし": { "meaning": "talk; story" }, "です": { "meaning": "to be (polite)" } } }
      "すいどうだいをみます。": { "native": "I look at the water bill.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "みます": { "meaning": "to look at (polite)" } } }
  "ja-8014":
    "native": "food expenses"
    "notes":
      "n1": "しょくひ (shokuhi) is the money a household spends on food."
    "examples":
      "しょくひがおおいです。": { "native": "Food expenses are high.", "bases": { "が": { "meaning": "(marks the subject)" }, "おおい": { "meaning": "many; much" }, "です": { "meaning": "to be (polite)" } } }
      "しょくひはまいつきかかります。": { "native": "Food costs us money every month.", "bases": { "は": { "meaning": "(marks the topic)" }, "まいつき": { "meaning": "every month" }, "かかります": { "meaning": "to cost (polite)" } } }
  "ja-8015":
    "native": "savings"
    "notes":
      "n1": "ちょきん (chokin) is money put aside and kept rather than spent."
    "examples":
      "ちょきんをはじめます。": { "native": "I start saving.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "はじめます": { "meaning": "to begin (polite)" } } }
      "ちょきんがおおいです。": { "native": "I have a lot of savings.", "bases": { "が": { "meaning": "(marks the subject)" }, "おおい": { "meaning": "many; much" }, "です": { "meaning": "to be (polite)" } } }
  "ja-8016":
    "native": "bank deposit"
    "notes":
      "n1": "よきん (yokin) is money put into a bank account."
    "examples":
      "よきんをします。": { "native": "I make a deposit.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "します": { "meaning": "to do (polite)" } } }
      "よきんはぎんこうにあります。": { "native": "The deposit is at the bank.", "bases": { "は": { "meaning": "(marks the topic)" }, "ぎんこう": { "meaning": "bank" }, "に": { "meaning": "(at; in)" }, "あります": { "meaning": "to be; to have (polite)" } } }
  "ja-8017":
    "native": "loan"
    "notes":
      "n1": "ローン (roon) is money borrowed from a bank or a company and paid back over time."
    "examples":
      "ローンをくみます。": { "native": "I take out a loan.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "くみます": { "meaning": "to take out (polite)" } } }
      "ローンがあります。": { "native": "I have a loan.", "bases": { "が": { "meaning": "(marks the subject)" }, "あります": { "meaning": "to have (polite)" } } }
  "ja-8018":
    "native": "debt"
    "notes":
      "n1": "しゃっきん (shakkin) is money owed to a person or a bank."
    "examples":
      "しゃっきんがあります。": { "native": "I have debts.", "bases": { "が": { "meaning": "(marks the subject)" }, "あります": { "meaning": "to have (polite)" } } }
      "しゃっきんをかえします。": { "native": "I pay back the debt.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "かえします": { "meaning": "to pay back (polite)" } } }
  "ja-8019":
    "native": "interest"
    "notes":
      "n1": "りし (rishi) is the extra money paid on money borrowed or saved."
    "examples":
      "りしがふえます。": { "native": "The interest increases.", "bases": { "が": { "meaning": "(marks the subject)" }, "ふえます": { "meaning": "to increase (polite)" } } }
      "りしはすこしです。": { "native": "The interest is small.", "bases": { "は": { "meaning": "(marks the topic)" }, "すこし": { "meaning": "a little" }, "です": { "meaning": "to be (polite)" } } }
  "ja-8020":
    "native": "property; fortune"
    "notes":
      "n1": "ざいさん (zaisan) is the things a person owns, money and goods together."
    "examples":
      "ざいさんをもっています。": { "native": "I have property.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "もっています": { "meaning": "to have; to hold (polite)" } } }
      "ざいさんはふえました。": { "native": "The property has increased.", "bases": { "は": { "meaning": "(marks the topic)" }, "ふえました": { "meaning": "to increase (polite past)" } } }
  "ja-8021":
    "native": "rich person"
    "notes":
      "n1": "おかねもち (okanemochi) is someone who has a lot of money."
    "examples":
      "あのひとはおかねもちです。": { "native": "That person is rich.", "bases": { "あの": { "meaning": "that" }, "ひと": { "meaning": "person" }, "は": { "meaning": "(marks the topic)" }, "です": { "meaning": "to be (polite)" } } }
      "おかねもちになりたいです。": { "native": "I want to become rich.", "bases": { "に": { "meaning": "(to; becoming)" }, "なりたい": { "meaning": "want to become" }, "です": { "meaning": "to be (polite)" } } }
  "ja-8022":
    "native": "poverty"
    "notes":
      "n1": "びんぼう (binbou) is having little money, or being poor."
    "examples":
      "びんぼうはつらいです。": { "native": "Poverty is painful.", "bases": { "は": { "meaning": "(marks the topic)" }, "つらい": { "meaning": "painful; hard" }, "です": { "meaning": "to be (polite)" } } }
      "びんぼうをなくします。": { "native": "We will end poverty.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "なくします": { "meaning": "to end (polite)" } } }
  "ja-8023":
    "native": "coin purse"
    "notes":
      "n1": "こぜにいれ (kozeniire) is a small purse for coins."
    "examples":
      "こぜにいれをもっています。": { "native": "I have a coin purse.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "もっています": { "meaning": "to have; to hold (polite)" } } }
      "こぜにいれにこうかをいれます。": { "native": "I put coins in the coin purse.", "bases": { "に": { "meaning": "(at; in)" }, "こうか": { "meaning": "coin" }, "を": { "meaning": "(marks the thing acted on)" }, "いれます": { "meaning": "to put in (polite)" } } }
  "ja-8024":
    "native": "savings (formal)"
    "notes":
      "n1": "ちょちく (chochiku) is savings in a formal or written style, the same idea as ちょきん (chokin)."
    "examples":
      "ちょちくがだいじです。": { "native": "Savings are important.", "bases": { "が": { "meaning": "(marks the subject)" }, "だいじ": { "meaning": "important" }, "です": { "meaning": "to be (polite)" } } }
      "ちょちくをふやします。": { "native": "I increase my savings.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "ふやします": { "meaning": "to increase (polite)" } } }
  "ja-8025":
    "native": "investment"
    "notes":
      "n1": "とうし (toushi) is money put into shares or property to earn a return."
    "examples":
      "とうしをします。": { "native": "I make an investment.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "します": { "meaning": "to do (polite)" } } }
      "とうしはきけんです。": { "native": "Investment is risky.", "bases": { "は": { "meaning": "(marks the topic)" }, "きけん": { "meaning": "danger; risk" }, "です": { "meaning": "to be (polite)" } } }
  "ja-8026":
    "native": "household budget"
    "notes":
      "n1": "かけい (kakei) is the money a household has, and how it is spent."
    "examples":
      "かけいをかんがえます。": { "native": "I think about the household budget.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "かんがえます": { "meaning": "to think about (polite)" } } }
      "かけいのはなしです。": { "native": "It is a talk about the household budget.", "bases": { "の": { "meaning": "(of; belonging to)" }, "はなし": { "meaning": "talk; story" }, "です": { "meaning": "to be (polite)" } } }
  "ja-8027":
    "native": "household account book"
    "notes":
      "n1": "かけいぼ (kakeibo) is a book where a household writes down its income and spending."
    "examples":
      "かけいぼをつけます。": { "native": "I keep a household account book.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "つけます": { "meaning": "to keep (records) (polite)" } } }
      "かけいぼにかきます。": { "native": "I write it in the household account book.", "bases": { "に": { "meaning": "(in; into)" }, "かきます": { "meaning": "to write (polite)" } } }
  "ja-8028":
    "native": "to haggle"
    "notes":
      "n1": "ねぎる (negiru) is to ask for a lower price."
    "examples":
      "ねぎってもいいですか。": { "native": "Is it all right to haggle?", "bases": { "ねぎって": { "meaning": "to haggle (te form)" }, "も": { "meaning": "(also; even)" }, "いい": { "meaning": "good; fine" }, "です": { "meaning": "to be (polite)" }, "か": { "meaning": "(question marker)" } } }
      "みせでねぎります。": { "native": "I haggle at the shop.", "bases": { "みせ": { "meaning": "shop" }, "で": { "meaning": "(at a place)" }, "ねぎります": { "meaning": "to haggle (polite)" } } }
  "ja-8029":
    "native": "refund"
    "notes":
      "n1": "はらいもどし (haraimodoshi) is money paid back to a buyer, for example after a return."
    "examples":
      "はらいもどしはありません。": { "native": "There is no refund.", "bases": { "は": { "meaning": "(marks the topic)" }, "ありません": { "meaning": "to not have (polite)" } } }
      "はらいもどしをもとめます。": { "native": "I ask for a refund.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "もとめます": { "meaning": "to ask for (polite)" } } }
  "ja-8030":
    "native": "tax included"
    "notes":
      "n1": "ぜいこみ (zeikomi) is a price with the tax already added in."
    "examples":
      "ねだんはぜいこみです。": { "native": "The price is tax included.", "bases": { "ねだん": { "meaning": "price" }, "は": { "meaning": "(marks the topic)" }, "です": { "meaning": "to be (polite)" } } }
      "ぜいこみのねだんです。": { "native": "It is the price with tax included.", "bases": { "の": { "meaning": "(of; belonging to)" }, "ねだん": { "meaning": "price" }, "です": { "meaning": "to be (polite)" } } }
  "ja-8031":
    "native": "tax excluded"
    "notes":
      "n1": "ぜいぬき (zeinuki) is a price before the tax is added."
    "examples":
      "ぜいぬきのねだんです。": { "native": "It is the price without tax.", "bases": { "の": { "meaning": "(of; belonging to)" }, "ねだん": { "meaning": "price" }, "です": { "meaning": "to be (polite)" } } }
      "ぜいぬきをみてください。": { "native": "Please look at the price without tax.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "みて": { "meaning": "look (te form)" }, "ください": { "meaning": "please (do)" } } }
  "ja-8032":
    "native": "splitting the bill"
    "notes":
      "n1": "わりかん (warikan) is paying an equal share of a bill with other people."
    "examples":
      "わりかんにしましょう。": { "native": "Let's split the bill.", "bases": { "に": { "meaning": "(as; for)" }, "しましょう": { "meaning": "let's do (polite)" } } }
      "わりかんではらいます。": { "native": "We pay by splitting the bill.", "bases": { "で": { "meaning": "(by means of)" }, "はらいます": { "meaning": "to pay (polite)" } } }
  "ja-8033":
    "native": "treat"
    "notes":
      "n1": "おごり (ogori) is paying for someone else's food or drink."
    "examples":
      "きょうはわたしのおごりです。": { "native": "Today is my treat.", "bases": { "きょう": { "meaning": "today" }, "は": { "meaning": "(marks the topic)" }, "わたし": { "meaning": "I" }, "の": { "meaning": "(of; belonging to)" }, "です": { "meaning": "to be (polite)" } } }
      "おごりをもらいます。": { "native": "I receive a treat.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "もらいます": { "meaning": "to receive (polite)" } } }
  "ja-8034":
    "native": "half price"
    "notes":
      "n1": "はんがく (hangaku) is a price that is half of the normal one."
    "examples":
      "このふくははんがくです。": { "native": "These clothes are half price.", "bases": { "この": { "meaning": "this" }, "ふく": { "meaning": "clothes" }, "は": { "meaning": "(marks the topic)" }, "です": { "meaning": "to be (polite)" } } }
      "はんがくでかいます。": { "native": "I buy it at half price.", "bases": { "で": { "meaning": "(by means of)" }, "かいます": { "meaning": "to buy (polite)" } } }
  "ja-8035":
    "native": "list price"
    "notes":
      "n1": "ていか (teika) is the price printed on a product before any discount."
    "examples":
      "ていかはたかいです。": { "native": "The list price is high.", "bases": { "は": { "meaning": "(marks the topic)" }, "たかい": { "meaning": "expensive; high" }, "です": { "meaning": "to be (polite)" } } }
      "ていかよりやすいです。": { "native": "It is cheaper than the list price.", "bases": { "より": { "meaning": "than" }, "やすい": { "meaning": "cheap" }, "です": { "meaning": "to be (polite)" } } }
  "ja-8036":
    "native": "discount"
    "notes":
      "n1": "ねびき (nebiki) is a reduction from the price."
    "examples":
      "ねびきがあります。": { "native": "There is a discount.", "bases": { "が": { "meaning": "(marks the subject)" }, "あります": { "meaning": "to have (polite)" } } }
      "ねびきをおねがいします。": { "native": "I ask for a discount.", "bases": { "を": { "meaning": "(marks the thing acted on)" }, "おねがい": { "meaning": "request" }, "します": { "meaning": "to do (polite)" } } }
  "ja-8037":
    "native": "market price"
    "notes":
      "n1": "そうば (souba) is the price a thing has in the market at the time."
    "examples":
      "そうばはかわります。": { "native": "The market price changes.", "bases": { "は": { "meaning": "(marks the topic)" }, "かわります": { "meaning": "to change (polite)" } } }
      "そうばよりたかいです。": { "native": "It is higher than the market price.", "bases": { "より": { "meaning": "than" }, "たかい": { "meaning": "expensive; high" }, "です": { "meaning": "to be (polite)" } } }
  "ja-8038":
    "native": "to earn"
    "notes":
      "n1": "かせぐ (kasegu) is to earn money by working."
    "examples":
      "おかねをかせぎます。": { "native": "I earn money.", "bases": { "おかね": { "meaning": "money" }, "を": { "meaning": "(marks the thing acted on)" }, "かせぎます": { "meaning": "to earn (polite)" } } }
      "アルバイトでかせぎます。": { "native": "I earn money at a part-time job.", "bases": { "アルバイト": { "meaning": "part-time job" }, "で": { "meaning": "(at a place)" }, "かせぎます": { "meaning": "to earn (polite)" } } }
  "ja-8039":
    "native": "to save up"
    "notes":
