schema: 1
id: "ja-en-appearance-sentences"
kind: "layer"
core: "ja-appearance-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Appearance in sentences"
description: "Sentences built from the words of this unit, to put in order, each with the words it could be mistaken for. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "ja-2194":
    native: "I cut my hair short."
    "notes":
      "n1": "The adverb of an い (i) adjective ends in く (ku): みじかい (mijikai, short) becomes みじかく (mijikaku)."
    bases:
      "は": { meaning: "(marks the topic)" }
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "long" }
      w2: { why: "frizzy hair" }
  "ja-2195":
    native: "My friend's eyebrows are thick."
    "notes":
      "n1": "ふとい (futoi, thick) is not ふとる (futoru, to put on weight), which is about gaining weight."
    bases:
      "は": { meaning: "(marks the topic)" }
      "です": { meaning: "is (polite)" }
    confusables:
      w1: { why: "eyelash" }
      w2: { why: "thin" }
  "ja-2196":
    native: "I have a pimple on my chin."
    "notes":
      "n1": "A spot on a body part takes に (ni) for its place, as in あごに (ago ni), on the chin."
    bases:
      "の": { meaning: "(links two nouns: of, 's)" }
      "あります": { meaning: "has (polite)" }
    confusables:
      w1: { why: "cheek" }
      w2: { why: "lip" }
  "ja-2197":
    native: "Dad lost weight."
    "notes":
      "n1": "やせる (yaseru, to lose weight) is the opposite of ふとる (futoru, to put on weight)."
    bases:
      "は": { meaning: "(marks the topic)" }
    confusables:
      w1: { why: "to put on weight, the opposite" }
      w2: { why: "thin, an adjective" }
  "ja-2198":
    native: "I put on weight."
    bases:
      "は": { meaning: "(marks the topic)" }
    confusables:
      w1: { why: "to lose weight, the opposite" }
      w2: { why: "thick, an adjective" }
  "ja-2199":
    native: "I do not use contact lenses."
    "notes":
      "n1": "コンタクト (kontakuto) is short for コンタクトレンズ (kontakuto renzu, contact lenses)."
    bases:
      "は": { meaning: "(marks the topic)" }
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "sunglasses" }
      w2: { why: "pierced earring" }
  "ja-2200":
    native: "My friend had her ears pierced."
    "notes":
      "n1": "あける (akeru) means to open, and also to make a hole, as in ピアスをあける (piasu o akeru)."
    bases:
      "は": { meaning: "(marks the topic)" }
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "clip-on earring" }
      w2: { why: "necklace" }
  "ja-2201":
    native: "The elderly person has wrinkles."
    "notes":
      "n1": "The person who has a feature takes に (ni) and the feature takes が (ga), as in としよりにしわがあります (toshiyori ni shiwa ga arimasu)."
    bases:
      "あります": { meaning: "has (polite)" }
    confusables:
      w1: { why: "freckles" }
      w2: { why: "pimple" }
  "ja-2202":
    native: "There is a beautiful woman."
    bases:
      "います": { meaning: "there is (polite)" }
    confusables:
      w1: { why: "elderly person" }
      w2: { why: "child" }
  "ja-2203":
    native: "My hair is black."
    "notes":
      "n1": "かみ (kami) on its own means head hair; the same sound also means paper or god, written differently."
    bases:
      "の": { meaning: "(links two nouns: of, 's)" }
      "は": { meaning: "(marks the topic)" }
      "です": { meaning: "is (polite)" }
    confusables:
      w1: { why: "blond hair" }
      w2: { why: "white hair" }
  "ja-2204":
    native: "My friend's dimples are cute."
    bases:
      "の": { meaning: "(links two nouns: of, 's)" }
      "は": { meaning: "(marks the topic)" }
      "です": { meaning: "is (polite)" }
    confusables:
      w1: { why: "mole" }
      w2: { why: "freckles" }
  "ja-2205":
    native: "The mole is small."
    bases:
      "は": { meaning: "(marks the topic)" }
      "です": { meaning: "is (polite)" }
    confusables:
      w1: { why: "pimple" }
      w2: { why: "wrinkle" }
  "ja-2206":
    native: "I bought stylish clothes."
    "notes":
      "n1": "おしゃれ (oshare, stylish) is a な (na) adjective, so it takes な (na) before ふく (fuku, clothes)."
    bases:
      "な": { meaning: "(links an adjective to a noun)" }
      "を": { meaning: "(marks the thing acted on)" }
    confusables:
      w1: { why: "plain" }
      w2: { why: "flashy" }
  "ja-2207":
    native: "There is a handsome friend."
    "notes":
      "n1": "ハンサム (hansamu) comes from English handsome and is mostly used for men."
    bases:
      "な": { meaning: "(links an adjective to a noun)" }
      "います": { meaning: "there is (polite)" }
    confusables:
      w1: { why: "stylish" }
      w2: { why: "cool" }
  "ja-2208":
    native: "My palms are dirty."
    bases:
      "の": { meaning: "(links two nouns: of, 's)" }
      "は": { meaning: "(marks the topic)" }
      "です": { meaning: "is (polite)" }
    confusables:
      w1: { why: "nail" }
      w2: { why: "cheek" }
  "ja-2209":
    native: "My friend is tall."
    "notes":
      "n1": "Height is the subject of the adjective: せい (sei, height) takes が (ga), as in せいがたかい (sei ga takai, tall)."
    bases:
      "は": { meaning: "(marks the topic)" }
      "です": { meaning: "is (polite)" }
    confusables:
      w1: { why: "small" }
      w2: { why: "young" }
  "ja-2210":
    native: "White hair is beautiful."
    "notes":
      "n1": "はくはつ (hakuhatsu) is the formal word for white hair; the everyday word is しらが (shiraga)."
    bases:
      "は": { meaning: "(marks the topic)" }
      "です": { meaning: "is (polite)" }
    confusables:
      w1: { why: "blond hair" }
      w2: { why: "black hair" }
