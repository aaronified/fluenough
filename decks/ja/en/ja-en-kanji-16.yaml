id: "ja-en-kanji-16"
kind: "layer"
core: "ja-kanji-16"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Kanji 16: grade 3, part 7"
description: "Twenty-five kanji of the third school grade, each taught by the kana reading of the word it stands for. Some have one example or none yet, and their examples come later. Not yet checked by a Japanese speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["script", "unreviewed"]
cards:
  "ja-5840":
    native: "hot, of the weather"
    notes:
      "n1": "暑 (atsui): on reading ショ (sho); kun reading あつ-い (atsu-i). Its kana あつい (atsui) is the word it stands for alone, hot, and is also the taught card あつい (atsui), the same word. It is in 暑中 (shochuu), midsummer."
    examples:
      "きょうは暑いです。": "Today is hot."
      "暑いです。": "It is hot."
  "ja-5841":
    native: "period of time; term"
    notes:
      "n1": "期 (kikan): on reading キ (ki), in limited use ゴ (go); no kun reading. Its kana きかん (kikan) is the commonest word the kanji stands for, 期間 (kikan), period, and is not yet a taught card. It is in 学期 (gakki), school term."
  "ja-5842":
    native: "to plant"
    notes:
      "n1": "植 (ueru): on reading ショク (shoku); kun readings う-える (ueru) and う-わる (uwaru). Its kana うえる (ueru), to plant, is the word it stands for alone and is not yet a taught card. It is in 植物 (shokubutsu), plant."
  "ja-5843":
    native: "tooth"
    notes:
      "n1": "歯 (ha): on reading シ (shi); kun reading は (ha). Its kana は (ha) is the word it stands for alone, tooth, and is the same kana as the taught letter card は (ha) and the taught particle は (wa); this card is only the noun. It is in 歯医者 (haisha), dentist, where it is read は (ha), followed by 医者 (isha), doctor."
    examples:
      "歯医者にいきます。": "I go to the dentist."
      "歯がいたいです。": "My tooth hurts."
  "ja-5844":
    native: "warm"
    notes:
      "n1": "温 (atatakai): on reading オン (on); kun readings あたたか (atataka), あたたかい (atatakai), あたたまる (atatamaru) and あたためる (atameru). Its kana あたたかい (atatakai), warm, is the word it stands for alone and is also the taught card あたたかい (atatakai), the same word. It is in 温度 (ondo), temperature."
    examples:
      "きょうは温かいです。": "Today is warm."
      "温度はたかいです。": "The temperature is high."
  "ja-5845":
    native: "harbour; port"
    notes:
      "n1": "港 (minato): on reading コウ (kou); kun reading みなと (minato). Its kana みなと (minato), harbour, is the word it stands for alone and is not yet a taught card. It is in 空港 (kuukou), airport, which uses the on reading コウ (kou) and is also the taught card くうこう (kuukou), the same word."
    examples:
      "空港にいきます。": "I go to the airport."
      "空港はおおきいです。": "The airport is big."
  "ja-5846":
    native: "lake"
    notes:
      "n1": "湖 (mizuumi): on reading コ (ko); kun reading みずうみ (mizuumi). Its kana みずうみ (mizuumi), lake, is the word it stands for alone and is not yet a taught card. No taught word is written with it, so it has no example yet."
  "ja-5847":
    native: "hot water"
    notes:
      "n1": "湯 (oyu): on reading トウ (tou); kun reading ゆ (yu). Its kana おゆ (oyu), hot water, is the word it stands for alone. Its kun reading ゆ (yu) is the same kana as the taught letter card ゆ (yu), which is a letter, not this word. It is in the example お湯 (oyu) with わかします (wakashimasu), to heat. The bath word おふろ (ofuro) is written in kana, since one of its kanji is not yet taught."
    examples:
      "お湯をわかします。": "I heat the water."
  "ja-5848":
    native: "to climb; to go up"
    notes:
      "n1": "登 (noboru): on readings トウ (tou) and ト (to); kun reading のぼ-る (nobo-ru). Its kana のぼる (noboru), to climb, is the word it stands for alone and is also the taught card のぼる (noboru), the same word. It is in 登山 (tozan), mountain climbing, which uses the on reading ト (to)."
    examples:
      "やまに登ります。": "I climb a mountain."
      "かいだんを登ります。": "I climb the stairs."
  "ja-5849":
    native: "to put on; to wear"
    notes:
      "n1": "着 (kiru): on reading チャク (chaku), in limited use ジャク (jaku); kun readings き-る (kiru), き-せる (kiseru), つ-く (tsuku) and つ-ける (tsukeru). Its kana きる (kiru), to put on, is the word it stands for alone and is also the taught card きる (kiru), the same word. Its kana きる (kiru) is also the kana of the taught card 切 (kiru), to cut, a different word; this card is only 'to put on'. It is in 着物 (kimono), kimono, which uses the kun reading き (ki) and not き-る (kiru)."
    examples:
      "ふくを着ます。": "I put on clothes."
      "着物はたかいです。": "The kimono is expensive."
  "ja-5850":
    native: "short, of length"
    notes:
      "n1": "短 (mijikai): on reading タン (tan); kun reading みじか-い (mijika-i). Its kana みじかい (mijikai) is the word it stands for alone, and is also the taught card みじかい (mijikai), the same word. It is in 短所 (tansho), weak point."
    examples:
      "ズボンは短いです。": "The trousers are short."
      "ペンは短いです。": "The pen is short."
  "ja-5851":
    native: "child, an old word"
    notes:
      "n1": "童 (warabe): on reading ドウ (dou); kun reading わらべ (warabe). Its kana わらべ (warabe), child, is the word it stands for alone, an old word, and is not yet a taught card. It is in 童話 (douwa), fairy tale."
  "ja-5852":
    native: "writing brush"
    notes:
      "n1": "筆 (fude): on reading ヒツ (hitsu); kun reading ふで (fude). Its kana ふで (fude), writing brush, is the word it stands for alone and is also the taught card ふで (fude), brush, the same word. It is in 筆者 (hissha), author, where the on reading is read with a geminate."
    examples:
      "筆をつかいます。": "I use a brush."
      "これは筆です。": "This is a brush."
  "ja-5853":
    native: "equal; the same"
    notes:
      "n1": "等 (hitoshii): on reading トウ (tou); kun reading ひと-しい (hitoshi-i). Its kana ひとしい (hitoshii), equal, is the word it stands for alone and is not yet a taught card. It is in 平等 (byoudou), equality."
  "ja-5854":
    native: "to fall; to drop"
    notes:
      "n1": "落 (ochiru): on reading ラク (raku); kun readings お-ちる (ochi-ru) and お-とす (oto-su). Its kana おちる (ochiru), to fall, is the word it stands for alone and is not yet a taught card. It is in 落語 (rakugo), comic storytelling."
  "ja-5855":
    native: "leaf"
    notes:
      "n1": "葉 (happa): on reading ヨウ (you); kun reading は (ha). Its kana はっぱ (happa), leaf, is the everyday word the kanji stands for and is not yet a taught card; the bare kana は (ha) is avoided, since it is the card 歯 (ha) of this deck. It is in 葉書 (hagaki), postcard, which uses the kun reading は (ha)."
  "ja-5856":
    native: "light; not heavy"
    notes:
      "n1": "軽 (karui): on reading ケイ (kei); kun readings かる-い (karu-i) and かろ-やか (karo-yaka). Its kana かるい (karui), light, is the word it stands for alone and is also the taught card かるい (karui), the same word. It is in 軽食 (keishoku), light meal."
    examples:
      "にもつは軽いです。": "The luggage is light."
      "かばんは軽いです。": "The bag is light."
  "ja-5857":
    native: "to play"
    notes:
      "n1": "遊 (asobu): on readings ユウ (yuu) and, in limited use, ユ (yu); kun reading あそ-ぶ (aso-bu). Its kana あそぶ (asobu), to play, is the word it stands for alone and is also the taught card あそぶ (asobu), the same word. It is in 遊園地 (yuuenchi), amusement park."
    examples:
      "こどもがこうえんで遊びます。": "The children play in the park."
      "いぬと遊びます。": "I play with a dog."
  "ja-5858":
    native: "to carry"
    notes:
      "n1": "運 (hakobu): on reading ウン (un); kun reading はこ-ぶ (hako-bu). Its kana はこぶ (hakobu), to carry, is the word it stands for alone and is not yet a taught card. It is in 運動 (undou), exercise, and 運転手 (untenshu), driver, which both use the on reading ウン (un)."
    examples:
      "まいにち運動をします。": "I exercise every day."
      "運転手はやさしいです。": "The driver is kind."
  "ja-5859":
    native: "to open"
    notes:
      "n1": "開 (hiraku): on reading カイ (kai); kun readings ひら-く (hira-ku), ひら-ける (hira-keru), あ-く (a-ku) and あ-ける (a-keru). Its kana ひらく (hiraku), to open, is the word it stands for alone and is not yet a taught card. The examples use the taught card あける (akeru), to open, the transitive verb 開ける (akeru) with the kun reading あ-ける (a-keru). It is in 開店 (kaiten), opening of a shop."
    examples:
      "まどを開けます。": "I open the window."
      "ドアを開けます。": "I open the door."
  "ja-5860":
    native: "sun"
    notes:
      "n1": "陽 (taiyou): on reading ヨウ (you) only. Its kana たいよう (taiyou) is the commonest word the kanji stands for, 太陽 (taiyou), sun, and is also the taught card たいよう (taiyou), the same word. It is in 陽気 (youki), cheerful."
    examples:
      "太陽はおおきいです。": "The sun is big."
      "太陽がでます。": "The sun comes out."
  "ja-5861":
    native: "stairs; a storey of a building"
    notes:
      "n1": "階 (kaidan): on reading カイ (kai) only. Its kana かいだん (kaidan), stairs, is the word the kanji is most often read with in use and is also the taught card かいだん (kaidan), the same word; the word is written in kana only, since one of its kanji is not yet taught. It is in 二階 (nikai), second floor."
  "ja-5862":
    native: "to gather"
    notes:
      "n1": "集 (atsumaru): on reading シュウ (shuu); kun readings あつ-まる (atsu-maru), あつ-める (atsu-meru) and つど-う (tsudo-u). Its kana あつまる (atsumaru), to gather, is the word it stands for alone and is not yet a taught card. It is in 集合 (shuugou), gathering."
  "ja-5863":
    native: "to drink"
    notes:
      "n1": "飲 (nomu): on reading イン (in); kun reading の-む (no-mu). Its kana のむ (nomu), to drink, is the word it stands for alone and is also the taught card のむ (nomu), the same word. It is in 飲食 (inshoku), eating and drinking."
    examples:
      "おちゃを飲みます。": "I drink tea."
      "みずを飲みます。": "I drink water."
  "ja-5864":
    native: "imagination"
    notes:
      "n1": "想 (souzou): on reading ソウ (sou), in limited use ソ (so); no kun reading. Its kana そうぞう (souzou), imagination, is the commonest word the kanji stands for and is not yet a taught card. It is in 予想 (yosou), expectation."
