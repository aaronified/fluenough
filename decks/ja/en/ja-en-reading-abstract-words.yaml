    "title": "An opinion column"
    "sentences":
      - "text": "わたしはじじつといけんをわけてかんがえることがたいせつだとおもいます。"
        "reading": "watashi wa jijitsu to iken o wakete kangaeru koto ga taisetsu dato omoimasu."
