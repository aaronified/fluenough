# The order Japanese is taught in, one unit per line, from every language
# it is taught from: each deck is named by its core id, and a learner
# from English is taught ja-en-<name> for ja-<name> (ADR-0013, ADR-0036).
#
# This is also Japanese's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"):
# every unit from the first words to B1, written or planned, with its size
# in words, its grammar topics, the three milestones, and for each planned
# unit its listening and reading passages. A unit with no deck yet is
# planned: the course teaches it as "Coming" until a deck is written. A
# theme named here that decks/themes.yaml does not list yet is added to it
# with its first deck.
#
# Sizes. The plan's levels are about 700, 900 and 1,200 words (low
# confidence). Japanese is tier V (docs/plans/language-paths-scheme.md,
# x3.7 in time), and a Japanese B1 needs more words than a Romance one
# (the JLPT's N5, N4 and N3 are usually given as about 800, 1,500 and
# 3,700 words), so the levels here are raised to about 800, 1,050 and
# 1,500 words, about 3,350 in all: the most the validator's range
# (2,000-3,500 up to B1, each level within half to one and a half times
# its size) allows. The tier stretches the time a level takes, not the
# words it holds. Sizes are one number for every native language.
#
# The order follows docs/plans/words-rules-sentences.md (owner, 2026-10-07,
# and 2026-10-17: "build the path files for all present languages via an
# opus agent, as per our current path design"):
# 1. the phrasebook, taught whole from the first lesson;
# 2. the first word units, read in romaji (Hepburn, ja-romanisation.yaml);
# 3. the script, after the first word units ("After units 4-6"): hiragana
#    first, then, after the core, katakana, then the first kanji, a set at
#    a time through A1, A2 and B1, as the scheme's tier V order has it
#    ("kanji (gradual)"); a learner who learns without the script skips
#    them (#554);
# 4. a core of about 200 common words in themed units, before the large
#    tables ("Yes, smaller (~200)");
# 5. rules as forms: the copula and the particles first (Japanese's
#    postpositions), then the demonstratives, the polite verb forms, the
#    verb groups and the adjectives, practised on the words already known;
# 6. sentences, each after its words and rules; then the other themes,
#    each its words, then its rules, then its sentences.
# Japanese's grammar keeps the East Asian order of
# docs/plans/language-paths-scheme.md within each level: desu and masu,
# the particles (wa, ga, o, ni, de), the verb groups, the te-form, the
# plain form, then the conditionals and keigo.
#
# Script units not written yet. The format has no planned form for an
# alphabet unit, which counts neither words nor grammar: a planned unit is
# a theme, which counts words, or a grammar topic. So each planned script
# unit is planned as a grammar unit of 0 words with a topic named
# script-..., and when its deck is written it becomes a plain list unit,
# its deck goes into alphabet, and its topic leaves the grammar count.
#
# Japanese is written without spaces between words, so the checks that
# split a card's text into words wait for its words to be given
# (docs/plans/language-paths.md, "Scripts without spaces").
#
# The core's order is by judgement, most common first: about me, everyday
# verbs, the common adverbs and function words, how much and how many,
# describing words, time, where things are, more verbs. It was meant to
# come from Wikipedia's counts (tools/wikipedia_frequency.py, #516): order
# the core again from the counts once they are written.
#
# Every deck of Japanese is listed exactly once.
schema: 1
kind: "path"
id: "ja-path"
language: "ja"
# No gender classes: a noun takes no gender (#512; DECK-FORMAT.md, Card data).
genders: []
# Where Japanese is spoken, for a rater's region and a card's region note
# (ADR-0036): the usual regions of Japan, which its dialects roughly follow
# (Tokyo speech in Kanto, the Kansai dialects of Osaka and Kyoto, and so
# on), each named with example prefectures and cities so that a rater can
# place themselves. Low confidence on the grouping: a native reviewer
# checks this list before any rating names a region. The ids are
# permanent, as card ids are; rename a name, never an id. The app adds
# "Elsewhere" after them.
regions:
  - id: "hokkaido-tohoku"
    name: { "en": "Hokkaido and Tohoku (Sapporo, Sendai, Aomori)" }
  - id: "kanto"
    name: { "en": "Kanto (Tokyo, Yokohama, Saitama, Chiba)" }
  - id: "chubu"
    name: { "en": "Chubu (Nagoya, Niigata, Shizuoka, Kanazawa)" }
  - id: "kansai"
    name: { "en": "Kansai (Osaka, Kyoto, Kobe, Nara)" }
  - id: "chugoku-shikoku"
    name: { "en": "Chugoku and Shikoku (Hiroshima, Okayama, Matsuyama)" }
  - id: "kyushu"
    name: { "en": "Kyushu (Fukuoka, Kumamoto, Kagoshima)" }
  - id: "okinawa"
    name: { "en": "Okinawa (Naha and the Ryukyu Islands)" }
# The decks that need the alphabet: a learner who learns without it
# skips them. The planned script units join it as each is written.
alphabet:
  - "ja-hiragana"
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
units:
  # 1. The phrasebook, taught whole from the first lesson, with the first
  # words beside it: ja-phrasebook (15-25 survival phrases, which count no
  # words) and ja-first-words when written.
  - planned: { id: "ja-phrasebook", theme: "first-words", words: 12 }
    listening_passages:
      - { id: "first-greetings", text: { "en": "Greeting a neighbour in the morning, at noon and in the evening" } }
    reading_passages:
      - { id: "phrase-card", text: { "en": "A pocket card of survival phrases, in romaji" } }
  # 2. The first word units, read in romaji.
  - planned: { id: "ja-sound-differences", theme: "sound-differences", words: 16 }
    listening_passages:
      - { id: "long-and-short", text: { "en": "Pairs of words told apart by a long vowel or a double consonant: obasan and obaasan, kite and kitte" } }
    reading_passages:
      - { id: "sound-pairs-list", text: { "en": "A list of word pairs in romaji that differ by one long sound" } }
  - planned: { id: "ja-questions", theme: "questions", words: 15 }
    listening_passages:
      - { id: "at-the-information-desk", text: { "en": "Asking who, what, where and when at an information desk" } }
    reading_passages:
      - { id: "visitor-faq", text: { "en": "A short visitor's sheet of questions and answers" } }
  - planned: { id: "ja-addressing", theme: "addressing", words: 20 }
    listening_passages:
      - { id: "san-and-sensei", text: { "en": "Meeting a teacher and a classmate: names with san and sensei" } }
    reading_passages:
      - { id: "name-cards", text: { "en": "Business cards exchanged at a meeting, surname first" } }
  - planned: { id: "ja-pronouns", theme: "pronouns", words: 20 }
    listening_passages:
      - { id: "who-is-that", text: { "en": "Pointing out who is who in a group photo: I, you, he, she" } }
    reading_passages:
      - { id: "class-photo-caption", text: { "en": "A caption under a class photo naming each person" } }
  - planned: { id: "ja-family", theme: "family", words: 35 }
    listening_passages:
      - { id: "my-family-your-family", text: { "en": "Talking about your own family and someone else's, with the two words for each relative" } }
    reading_passages:
      - { id: "family-introduction", text: { "en": "A short self-introduction naming the family" } }
  - planned: { id: "ja-numbers-1-20", theme: "numbers-1-20", words: 25 }
    listening_passages:
      - { id: "two-ways-to-count", text: { "en": "Counting from one to ten twice: ichi, ni, san and hitotsu, futatsu, mittsu" } }
    reading_passages:
      - { id: "locker-numbers", text: { "en": "Locker numbers at a station" } }
  # 3. The script, after the first word units (#554: skipped by a learner
  # who learns without it). Hiragana first: the 46 basic letters, then the
  # voiced marks, the small ya, yu and yo, the small tsu and long vowels.
  - ["ja-hiragana"]
  - planned: { id: "ja-hiragana-marks", grammar: "script-hiragana-marks", words: 0 }
    listening_passages:
      - { id: "ka-and-ga", text: { "en": "Hearing a letter with and without its voiced mark: ka and ga, ha, ba and pa" } }
    reading_passages:
      - { id: "hiragana-signs", text: { "en": "Simple hiragana signs: entrance, exit, toilet" } }
  # 4. The core: about 200 common words, most common first (by judgement
  # until the Wikipedia counts are written, #516).
  - planned: { id: "ja-about-me", theme: "about-me", words: 20 }
    listening_passages:
      - { id: "jikoshoukai", text: { "en": "A self-introduction on the first day at a language school" } }
    reading_passages:
      - { id: "registration-card", text: { "en": "A registration card: name, age, country, job" } }
  - planned: { id: "ja-everyday-verbs", theme: "everyday-verbs", words: 35 }
    listening_passages:
      - { id: "a-morning-at-home", text: { "en": "A mother says what each person in the house does in the morning" } }
    reading_passages:
      - { id: "note-on-the-table", text: { "en": "A note on the table: what to eat, what to drink, when to come home" } }
  - planned: { id: "ja-adverbs", theme: "adverbs", words: 30 }
    listening_passages:
      - { id: "how-often", text: { "en": "Saying how often and how well things are done" } }
    reading_passages:
      - { id: "habit-survey", text: { "en": "A short survey about everyday habits" } }
  - planned: { id: "ja-quantities", theme: "quantities", words: 20 }
    listening_passages:
      - { id: "how-many-do-you-want", text: { "en": "Asking how much and how many at a bakery" } }
    reading_passages:
      - { id: "recipe-amounts", text: { "en": "The amounts on a recipe card" } }
  - planned: { id: "ja-describing", theme: "describing", words: 35 }
    listening_passages:
      - { id: "how-is-it", text: { "en": "A friend asks about your new room: big, quiet, convenient" } }
    reading_passages:
      - { id: "postcard-from-kyoto", text: { "en": "A short postcard: the weather, the food, the people" } }
  - planned: { id: "ja-time", theme: "time", words: 25 }
    listening_passages:
      - { id: "what-time-is-it", text: { "en": "Asking and telling the time" } }
    reading_passages:
      - { id: "shop-hours", text: { "en": "The opening hours on a shop door" } }
  - planned: { id: "ja-location", theme: "location", words: 15 }
    listening_passages:
      - { id: "where-is-my-key", text: { "en": "Looking for a key: on, under, in, next to" } }
    reading_passages:
      - { id: "room-layout", text: { "en": "A note saying where things are in a room" } }
  - planned: { id: "ja-more-verbs", theme: "more-verbs", words: 30 }
    listening_passages:
      - { id: "weekend-chores", text: { "en": "Someone lists what they will do this weekend" } }
    reading_passages:
      - { id: "to-do-list", text: { "en": "A short to-do list" } }
  # 5. Rules as forms, practised on the words known: the copula and the
  # particles first, then the demonstratives, the polite verb forms, the
  # verb groups, existence and the adjectives.
  - planned: { id: "ja-grammar-desu", grammar: ["desu", "desu-negative"] }
    listening_passages:
      - { id: "i-am-a-student", text: { "en": "Saying who and what you are, and are not: a student, not a teacher" } }
    reading_passages:
      - { id: "profile-card", text: { "en": "A profile card: what each person is and is not" } }
  - planned: { id: "ja-grammar-case-particles", grammar: ["particle-wa", "particle-ga", "particle-o", "particle-ni", "particle-de"] }
    listening_passages:
      - { id: "who-does-what-where", text: { "en": "Saying who does what, where and to whom" } }
    reading_passages:
      - { id: "diary-lines", text: { "en": "A few diary lines: where I ate, what I bought, whom I met" } }
  - planned: { id: "ja-grammar-more-particles", grammar: ["particle-e", "particle-no", "particle-mo", "particle-to", "kara-made"] }
    listening_passages:
      - { id: "from-nine-to-five", text: { "en": "Saying from when to when, with whom, and whose" } }
    reading_passages:
      - { id: "office-hours-note", text: { "en": "A note on office hours and who is in, from when to when" } }
  - planned: { id: "ja-grammar-questions", grammar: "question-ka" }
    listening_passages:
      - { id: "is-it-yours", text: { "en": "Asking yes-no questions with ka, and answering hai and iie" } }
    reading_passages:
      - { id: "quiz-card", text: { "en": "A short quiz of yes-no questions" } }
  - planned: { id: "ja-grammar-demonstratives", grammar: "kosoado" }
    listening_passages:
      - { id: "this-one-that-one", text: { "en": "Pointing at things in a shop: this, that, that over there, which" } }
    reading_passages:
      - { id: "shop-labels", text: { "en": "Labels in a shop window pointing at its goods" } }
  - planned: { id: "ja-grammar-masu", grammar: ["masu", "masen"] }
    listening_passages:
      - { id: "what-do-you-do-on-sundays", text: { "en": "Saying politely what you do and do not do on Sundays" } }
    reading_passages:
      - { id: "weekly-routine", text: { "en": "A weekly routine written in polite forms" } }
  - planned: { id: "ja-grammar-verb-groups", grammar: "verb-groups" }
    listening_passages:
      - { id: "taberu-and-nomu", text: { "en": "The same sentences with verbs of each group: eat, drink, come, do" } }
    reading_passages:
      - { id: "verb-chart", text: { "en": "A chart of everyday verbs sorted into their three groups" } }
  - planned: { id: "ja-grammar-aru-iru", grammar: "aru-iru" }
    listening_passages:
      - { id: "is-there-a-bank", text: { "en": "Asking whether there is a bank nearby, and who is at home" } }
    reading_passages:
      - { id: "floor-guide", text: { "en": "A floor guide in a department store: what is on each floor" } }
  - planned: { id: "ja-grammar-adjectives", grammar: ["i-adjectives", "na-adjectives"] }
    listening_passages:
      - { id: "a-quiet-town", text: { "en": "Describing a town: quiet, lively, not expensive" } }
    reading_passages:
      - { id: "hotel-review", text: { "en": "A short hotel review: the room, the staff, the food" } }
  # 6. Sentences, each after its words and rules; then the other A1
  # themes, each its words, its rules, then its sentences.
  - planned: { id: "ja-work", theme: "work", words: 35 }
    listening_passages:
      - { id: "what-is-your-job", text: { "en": "Two people ask each other what they do for a living" } }
