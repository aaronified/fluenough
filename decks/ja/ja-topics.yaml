# Topics a learner of Japanese would search for: what each one is, and the decks that teach it (wiki/Plan-Deck-Kinds-And-Topics.md, D6).
# A script topic lists its characters; a topic holds no card text of its own.
schema: 1
kind: "topics"
id: "ja-topics"
language: "ja"
license: "CC-BY-SA-4.0"
topics:
  - id: "ja-hiragana-script"
    name: { en: "Hiragana" }
    summary: { en: "The 46 basic hiragana letters, the first script of Japanese: the vowels, the k, s, t, n, h, m, y, r and w rows, and ん (n). Marks and combined sounds follow." }
    term: { text: "ひらがな", reading: "hiragana" }
    kind: "script"
    level: "A1"
    decks: ["ja-hiragana", "ja-hiragana-marks", "ja-hiragana-combos"]
    chars: ["あ", "い", "う", "え", "お", "か", "き", "く", "け", "こ", "さ", "し", "す", "せ", "そ", "た", "ち", "つ", "て", "と", "な", "に", "ぬ", "ね", "の", "は", "ひ", "ふ", "へ", "ほ", "ま", "み", "む", "め", "も", "や", "ゆ", "よ", "ら", "り", "る", "れ", "ろ", "わ", "を", "ん"]
  - id: "ja-katakana-script"
    name: { en: "Katakana" }
    summary: { en: "The 46 basic katakana letters, which write words from other languages, names and sounds. They have the same sounds as hiragana." }
    term: { text: "カタカナ", reading: "katakana" }
    kind: "script"
    level: "A1"
    decks: ["ja-katakana", "ja-katakana-combos"]
    chars: ["ア", "イ", "ウ", "エ", "オ", "カ", "キ", "ク", "ケ", "コ", "サ", "シ", "ス", "セ", "ソ", "タ", "チ", "ツ", "テ", "ト", "ナ", "ニ", "ヌ", "ネ", "ノ", "ハ", "ヒ", "フ", "ヘ", "ホ", "マ", "ミ", "ム", "メ", "モ", "ヤ", "ユ", "ヨ", "ラ", "リ", "ル", "レ", "ロ", "ワ", "ヲ", "ン"]
  - id: "ja-te-form"
    name: { en: "The te-form of verbs" }
    summary: { en: "How a Japanese verb ends in て (te) or で (de) to join actions, make requests and build longer verb forms, and how the ending changes with the verb." }
    term: { text: "て形", reading: "tekei" }
    kind: "grammar"
    level: "A2"
    decks: ["ja-grammar-te-form"]
    grammar: ["te-form", "te-ending"]
  - id: "ja-counters"
    name: { en: "Counters" }
    summary: { en: "The words that count things in Japanese: a number joined to a counter that depends on what is counted, such as people, flat things or long things." }
    term: { text: "助数詞", reading: "josuushi" }
    kind: "words"
    level: "A2"
    decks: ["ja-grammar-counters"]
    grammar: ["counters"]
  - id: "ja-culture"
    name: { en: "Japanese culture: poems, songs and prose" }
    summary: { en: "Short lines from well-known Japanese poems, songs and books, from the Nara period to the Showa period, with who wrote them and when." }
    term: { text: "文化", reading: "bunka" }
    kind: "other"
    level: "A2"
    decks: ["ja-culture-1"]
  - id: "ja-proverbs"
    name: { en: "Proverbs" }
    summary: { en: "Well-known Japanese proverbs (kotowaza), with what each says word for word and what it is said of." }
    term: { text: "ことわざ", reading: "kotowaza" }
    kind: "words"
    level: "A2"
    decks: ["ja-proverbs-1", "ja-proverbs-2", "ja-proverbs-3"]
  - id: "ja-te-auxiliaries"
    name: { en: "Verbs with a helper verb after the te-form" }
    summary: { en: "A te-form and a second verb that adds a meaning: try, do in advance, finish, go and come back, take along, and the verbs of giving and receiving." }
    kind: "verbs"
    level: "A2"
    decks: ["ja-multiword-te-auxiliaries"]
    grammar: ["te-form"]
    topics: ["ja-te-form"]
  - id: "ja-compound-verbs"
    name: { en: "Compound verbs" }
    summary: { en: "Two verbs joined into one: a verb stem and a second verb that adds a meaning, such as begin, finish, keep, burst into, too much or do again." }
    term: { text: "複合動詞", reading: "fukugou doushi" }
    kind: "verbs"
    level: "B1"
    decks: ["ja-multiword-compound-verbs"]
  - id: "ja-popular-works"
    name: { en: "Popular films, books, songs and comics" }
    summary: { en: "Well-known Japanese works that are still protected by copyright. You find them yourself; the app asks questions about them afterwards." }
    kind: "other"
    level: "A2"
    topics: ["ja-culture"]
  - id: "ja-haiku"
    name: { en: "Haiku" }
    summary: { en: "Short poems of three lines with about seventeen sound units, usually set in one season and one moment in nature, by poets such as Basho, Shiki, Buson and Issa." }
    term: { text: "俳句", reading: "haiku" }
    kind: "other"
    level: "A2"
    cards: ["ja-4311", "ja-4312", "ja-4313", "ja-4314", "ja-4613", "ja-4616"]
  - id: "ja-waka-tanka"
    name: { en: "Waka and tanka" }
    summary: { en: "Classical waka poems of thirty-one sound units, which became the tanka form of five lines, from the Manyoshu and Kokin Wakashu to the Hyakunin Isshu and modern tanka poets." }
    term: { text: "和歌", reading: "waka" }
    kind: "other"
    level: "B1"
    cards: ["ja-4316", "ja-4317", "ja-4319", "ja-4320", "ja-4601", "ja-4609", "ja-4700", "ja-4704", "ja-4324", "ja-4651", "ja-4652", "ja-4602", "ja-4603", "ja-4617", "ja-4608", "ja-4610", "ja-4701", "ja-4702", "ja-4703", "ja-4705", "ja-4706", "ja-4707", "ja-4604", "ja-4605", "ja-4606", "ja-4607"]
  - id: "ja-classical-prose"
    name: { en: "Classical prose" }
    summary: { en: "Prose written in the classical Japanese of the Heian and Edo periods, such as diaries, essays and travel accounts, with the grammar of the old texts kept as written." }
    term: { text: "古文", reading: "kobun" }
    kind: "other"
    level: "B1"
    cards: ["ja-4308", "ja-4322", "ja-4323", "ja-4600", "ja-4708"]
  - id: "ja-heian-court"
    name: { en: "The Heian court" }
    summary: { en: "The court life of the Heian period, from about 794 to 1185, and the court women who wrote its poems and diaries, such as Sei Shonagon, Izumi Shikibu, Ono no Komachi and Murasaki Shikibu." }
    term: { text: "平安時代", reading: "heian jidai" }
    kind: "other"
    level: "B1"
    cards: ["ja-4308", "ja-4604", "ja-4605", "ja-4606", "ja-4607"]
  - id: "ja-edo-literature"
    name: { en: "Edo literature" }
    summary: { en: "Writing of the Edo period, from 1603 to 1868, including haiku, the puppet plays of Chikamatsu Monzaemon and the poems of Basho and his circle." }
    term: { text: "江戸文学", reading: "edo bungaku" }
    kind: "other"
    level: "B1"
    cards: ["ja-4311", "ja-4322", "ja-4613", "ja-4614", "ja-4615", "ja-4616"]
  - id: "ja-school-songs"
    name: { en: "School songs" }
    summary: { en: "Songs written for Japanese schools from the Meiji period on, which many Japanese learned as children, such as Furusato, first sung in 1914." }
    term: { text: "唱歌", reading: "shouka" }
    kind: "other"
    level: "A2"
    cards: ["ja-4315", "ja-4321"]
  - id: "ja-modern-literature"
    name: { en: "Modern literature" }
    summary: { en: "Japanese poems and novels written from the Meiji period to the Showa period, by writers such as Natsume Soseki, Akutagawa Ryunosuke, Ishikawa Takuboku and Kaneko Misuzu." }
    term: { text: "近代文学", reading: "kindai bungaku" }
    kind: "other"
    level: "A2"
    cards: ["ja-4309", "ja-4310", "ja-4321", "ja-4325", "ja-4650", "ja-4651", "ja-4652", "ja-4653"]
