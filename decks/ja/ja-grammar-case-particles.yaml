  - id: "ja-rule-particle-ga"
    slots: ["ga"]
    words:
      - { word: "が", reading: "ga" }
      - { word: "ともだちがきます。", reading: "tomodachi ga kimasu." }
  - id: "ja-rule-particle-o"
    slots: ["o"]
    words:
      - { word: "を", reading: "o" }
      - { word: "みずをのみます。", reading: "mizu o nomimasu." }
  - id: "ja-rule-particle-ni"
    slots: ["ni"]
    words:
      - { word: "に", reading: "ni" }
      - { word: "がっこうにいきます。", reading: "gakkou ni ikimasu." }
  - id: "ja-rule-particle-de"
    slots: ["de"]
    words:
      - { word: "で", reading: "de" }
      - { word: "でんしゃにのります。", reading: "densha ni norimasu." }
