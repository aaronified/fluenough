passages:
  - id: "tok-what-to-eat"
    title: "What to eat"
    sentences:
      - text: "sina wile e kili anu ala?"
      - text: "mi wile e kili suwi."
      - text: "telo ni li lete anu ala?"
      - text: "mi wile e telo lete."
      - text: "o lukin e kili!"
    questions:
      - id: "tok-0205"
        prompt: { en: "What does the first line ask?" }
        options:
          - { en: "Whether the other person wants fruit" }
          - { en: "Where the fruit is" }
        answer: 1
      - id: "tok-0206"
        prompt: { en: "The speaker wants sweet fruit." }
        answer: true
      - id: "tok-0207"
        prompt: { en: "What does the speaker want to drink?" }
        options:
          - { en: "Cold water" }
          - { en: "Sweet water" }
        answer: 1
  - id: "tok-simple-menu"
    title: "Simple menu"
    sentences:
      - text: "kili lete li pona."
      - text: "telo lete li suwi ala."
      - text: "moku ni li suli."
    questions:
      - id: "tok-0208"
        prompt: { en: "What does the first line say about the fruit?" }
        options:
          - { en: "It is good" }
          - { en: "It is big" }
        answer: 1
      - id: "tok-0209"
        prompt: { en: "Cold water is sweet." }
        answer: false
      - id: "tok-0210"
        prompt: { en: "What does the third line say about the food?" }
        options:
          - { en: "It is good" }
          - { en: "It is cold" }
        answer: 1
