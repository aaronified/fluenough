passages:
  - id: "tok-my-family"
    title: "My family"
    sentences:
      - text: "ni li mama mi."
      - text: "ona li meli."
      - text: "mije ni li mije mi."
      - text: "ona li olin e mi."
      - text: "mi lon poka ona."
      - text: "kulupu ni li suli."
    questions:
      - id: "tok-0171"
        prompt: { en: "What does the first line say?" }
        options:
          - { en: "This is my parent" }
          - { en: "This is my group" }
        answer: 1
      - id: "tok-0172"
        prompt: { en: "What is the person in the second line?" }
        options:
          - { en: "A woman" }
          - { en: "A man" }
        answer: 1
      - id: "tok-0173"
        prompt: { en: "They love the speaker." }
        answer: true
  - id: "tok-family-tree"
    title: "Family tree"
    sentences:
      - text: "mama mi li meli."
      - text: "mije mi li mije."
      - text: "mi meli."
      - text: "mama mi li olin e mi."
    questions:
      - id: "tok-0174"
        prompt: { en: "What is the speaker?" }
        options:
          - { en: "A woman" }
          - { en: "A man" }
        answer: 1
      - id: "tok-0175"
        prompt: { en: "The speaker's mother loves the speaker." }
        answer: true
      - id: "tok-0176"
        prompt: { en: "The speaker's husband is a woman." }
