schema: 1
id: "tok-en-describing"
kind: "layer"
core: "tok-describing"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing things"
description: "Eight words for describing things: suli, lili, ike, sin, wawa, mute, ante and sama. Each comes after the thing it describes, so ijo suli is a big thing. Not yet checked by a Toki Pona speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "tok-0119":
    native: "big; tall; important"
    notes:
      "adult": "With jan before it, jan suli is an adult, or an important person."
      "after": "A modifier comes after the word it describes: ijo suli is a big thing."
    examples:
      "jan suli li toki.": "An adult speaks."
      "mi lukin e ijo suli.": "I see a big thing."
      "ona li suli.": "They are big."
  "tok-0120":
    native: "small; little; young"
    notes:
      "child": "With jan before it, jan lili is a child."
      "after": "Like suli, it comes after what it describes: ijo lili is a small thing."
    examples:
      "jan lili li lape.": "The child sleeps."
      "ijo lili li pona.": "The small thing is good."
      "ona li lili ala.": "They are not small."
  "tok-0121":
    native: "bad; not good; wrong"
    notes:
      "wrong": "Also wrong or harmful: ijo ike is a bad thing. It is the opposite of pona."
      "after": "It comes after the word it describes: moku ike is bad food."
    examples:
      "ona li moku e ijo ike.": "They eat bad things."
      "ijo ike li lon.": "There is a bad thing."
      "mi wile ala e ijo ike.": "I do not want bad things."
  "tok-0122":
    native: "new; fresh"
    notes:
      "more": "Also another: one more thing of the same kind, added to what is there."
      "after": "It comes after the thing it describes: moku sin is new food."
    examples:
      "mi lukin e ijo sin.": "I see something new."
      "ona li pali e ijo sin.": "They make something new."
      "moku sin li pona.": "New food is good."
  "tok-0123":
    native: "strong; powerful; confident"
    notes:
      "sure": "Also confident, or sure of oneself: mi wawa is I am confident."
      "after": "A modifier comes after the word it describes: jan wawa is a strong person."
    examples:
      "ona li wawa.": "They are strong."
      "jan wawa li pali e moku.": "A strong person makes food."
      "mi wawa ala.": "I am not strong."
  "tok-0124":
    native: "many; much; a lot; very"
    notes:
      "plural": "Also a plural after a noun: jan mute is many people. Nouns never change, so the word after the noun shows the number."
      "after": "It comes after the noun it describes: moku mute is a lot of food."
    examples:
      "jan mute li kama.": "Many people come."
      "mi jo e moku mute.": "I have a lot of food."
      "ijo mute li lon.": "There are many things."
  "tok-0125":
    native: "other; different; changed"
    notes:
      "change": "Something different from what it was, or from the one before."
      "after": "It comes after the noun: ijo ante is a different thing."
    examples:
      "jan ante li toki.": "Another person speaks."
      "ijo ante li suli.": "A different thing is big."
      "ona li moku e ijo ante.": "They eat something different."
  "tok-0126":
    native: "same; similar"
    notes:
      "similar": "Also similar, nearly the same but not identical."
      "after": "It comes after the thing it describes: ijo sama is the same thing."
    examples:
      "ona li sama.": "They are the same."
      "mi pali e ijo sama.": "I make the same thing."
      "ijo sama li pona.": "The same thing is good."
