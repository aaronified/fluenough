"id": "tok-en-things"
"kind": "layer"
"core": "tok-things"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Things around you"
"description": "Six words for things: palisa, sike, linja, lipu, sitelen and kiwen (stick, round thing, string, paper, picture, stone). Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0456":
    "native": "stick; long thin thing"
    "notes":
      "n1": "Palisa is a stick, a rod or any long thin thing: palisa lili is a small stick."
      "n2": "A palisa is long and thin, so it is the word for a stick, not for a thick log."
    "examples":
      "palisa lili li lon poki.": "A small stick is in the box."
      "palisa ni li pakala.": "This stick is broken."
  "tok-0457":
    "native": "round thing; circle; ball; wheel"
    "notes":
      "n1": "Sike is anything round: a ball, a wheel or a circle."
      "n2": "A sike rolls, which is why it is also the word for a wheel."
    "examples":
      "sike li lon.": "The ball is here."
      "mi lukin e sike.": "I look at the ball."
  "tok-0458":
    "native": "string; rope; thread; line"
    "notes":
      "n1": "Linja is a long bendy thing: string, rope, thread or a line on a page."
      "n2": "It is long and thin like palisa, but it bends: linja pona is a good rope."
    "examples":
      "linja pona li lon.": "A good rope is here."
      "mi pali e linja.": "I make a rope."
  "tok-0459":
    "native": "paper; page; book; flat thing"
    "notes":
      "n1": "Lipu is paper, a page or a book: lipu walo is white paper."
      "n2": "Lipu is any flat thing you can write on or fold, and a book is a lipu with many pages."
    "examples":
      "lipu walo li lon poki.": "The white paper is in the box."
      "mi lukin e lipu.": "I look at the paper."
  "tok-0460":
    "native": "picture; drawing; mark; writing"
    "notes":
      "n1": "Sitelen is a picture, a drawing, or a mark made on a surface."
      "n2": "Sitelen can also be writing: sitelen ni is this picture or this writing."
    "examples":
      "sitelen ni li suli.": "This picture is big."
      "mi pali e sitelen.": "I make a picture."
  "tok-0461":
    "native": "stone; rock; hard thing"
    "notes":
      "n1": "Kiwen is a stone or a rock, and any hard thing that does not bend."
      "n2": "A kiwen is hard, so wawa, strong, is often used with it: kiwen wawa."
    "examples":
      "kiwen ni li wawa.": "This stone is strong."
      "kiwen suli li lon.": "A big rock is there."
