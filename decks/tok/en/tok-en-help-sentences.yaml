"core": "tok-help-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Help in sentences"
"description": "Sentences about what is broken, gone, or waiting, and what someone can do. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0302":
    "native": "The door is broken."
    "confusables":
      "w1":
        "why": "Weka (gone) would say the door is gone, not broken."
      "w2":
        "why": "Pona (good) would say the door is good, not broken."
  "tok-0303":
    "native": "I can wait."
    "confusables":
      "w1":
        "why": "Moku (to eat) would say I can eat, not wait."
      "w2":
        "why": "Tawa (to go) would say I can go, not wait."
  "tok-0304":
    "native": "The tool is gone."
    "confusables":
      "w1":
        "why": "Awen (to stay) would say the tool stays, not that it is gone."
      "w2":
        "why": "Pakala (broken) would say the tool is broken, not gone."
  "tok-0305":
    "native": "Can you do this?"
    "confusables":
      "w1":
        "why": "Wile (to want) would ask whether you want to do this, not whether you can."
      "w2":
        "why": "Kama (to come) would ask whether you come to do this, not whether you can."
  "tok-0306":
    "native": "I stay at home."
    "confusables":
      "w1":
        "why": "Tawa (to go) would say I go home, not that I stay."
      "w2":
        "why": "Kama (to come) would say I come home, not that I stay."
  "tok-0307":
    "native": "They are not gone."
    "confusables":
      "w1":
        "why": "Lon (to be there) would say they are there, not that they are gone."
      "w2":
        "why": "Awen (to stay) would say they stay, not that they are not gone."
  "tok-0308":
    "native": "The broken tool is gone."
    "confusables":
      "w1":
        "why": "Pona (good) would say the good tool is gone, not the broken one."
      "w2":
        "why": "Suli (big) would say the big tool is gone, not the broken one."
  "tok-0309":
    "native": "Can I see the door, or not?"
    "confusables":
      "w1":
        "why": "Open (to begin) would ask whether I can open the door, not whether I can see it."
      "w2":
        "why": "Pali (to make) would ask whether I can make the door, not whether I can see it."
