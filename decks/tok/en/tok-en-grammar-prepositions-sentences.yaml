"cards":
  "tok-0386":
    "native": "The person is at the building."
    "confusables":
      "w1":
        "why": "Weka means 'gone', the opposite of lon ('to be at or in a place'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Lupa ('door') is related in meaning to tomo ('house'), but it is not the same word and changes what the sentence says."
  "tok-0387":
    "native": "They give it to me."
    "confusables":
      "w1":
        "why": "Tan ('from') is spelled much like tawa ('to go'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Pan ('bread') is spelled much like pana ('to give'), so it is easy to mix up, but it is a different word."
  "tok-0388":
    "native": "You go from your building."
    "confusables":
      "w1":
        "why": "Weka ('gone') is related in meaning to tawa ('to go'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Lon ('to be at or in a place') is also a preposition, but this sentence has tan ('from') in its place."
  "tok-0389":
    "native": "I work with a big tool."
    "confusables":
      "w1":
        "why": "Lon ('to be at or in a place') is also a preposition, but this sentence has kepeken ('using') in its place."
      "w2":
        "why": "Mije ('man') is spelled much like mi ('I'), so it is easy to mix up, but it is a different word."
  "tok-0390":
    "native": "A small tool is like a big tool."
    "confusables":
      "w1":
        "why": "Lon ('to be at or in a place') is also a preposition, but this sentence has sama ('same') in its place."
      "w2":
        "why": "Tomo ('house') is also something in or around the home, but this sentence has ilo ('tool') in its place."
  "tok-0391":
    "native": "This person is like them."
    "confusables":
      "w1":
        "why": "Lon ('to be at or in a place') is also a preposition, but this sentence has sama ('same') in its place."
      "w2":
        "why": "Jaki ('dirty') is spelled much like jan ('person'), so it is easy to mix up, but it is a different word."
  "tok-0392":
    "native": "Give it to the small person."
    "confusables":
      "w1":
        "why": "Lon ('to be at or in a place') is also a preposition, but this sentence has tawa ('to go') in its place."
      "w2":
        "why": "Ike ('bad') is also a describing word, but this sentence has lili ('small') in its place."
  "tok-0393":
    "native": "The fruit is in the box."
    "confusables":
      "w1":
        "why": "Ala means 'no, not', the opposite of lon ('to be at or in a place'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Poka ('side') is spelled much like poki ('box'), so it is easy to mix up, but it is a different word."
