  "name": "English"
"name": "Prepositions in sentences"
"description": "Sentences that place, send, source, use and compare, with lon, tawa, tan, kepeken and sama. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0386":
    "native": "The person is at the building."
    "confusables":
      "w1":
        "why": "Tawa is to go or to: the sentence says the person is at the building, not heading to it."
      "w2":
        "why": "Tan is from: the sentence says where the person is, not where they came from."
  "tok-0387":
    "native": "They give it to me."
    "confusables":
      "w1":
        "why": "Pana is to give: the sentence says what they do, and tawa says to whom."
      "w2":
        "why": "Tan is from: the sentence would say it comes from me, the opposite of to me."
  "tok-0388":
    "native": "You go from your building."
    "confusables":
      "w1":
        "why": "Tawa is to go: here tawa is the verb, and tan says the starting place."
      "w2":
        "why": "Tomo is the building: it is the place you start from, not a place you go to."
  "tok-0389":
    "native": "I work with a big tool."
    "confusables":
      "w1":
        "why": "Kepeken is using: it says what the work is done with."
      "w2":
        "why": "Pali is to work or make: it is the action, and the tool is what it uses."
  "tok-0390":
    "native": "A small tool is like a big tool."
    "confusables":
      "w1":
        "why": "Sama is like or the same: the sentence compares two tools."
      "w2":
        "why": "Suli is big: the sentence says the small tool is big, which is not the comparison."
  "tok-0391":
    "native": "This person is like them."
    "confusables":
      "w1":
        "why": "Sama is like: the sentence compares this person with them."
      "w2":
        "why": "Ni is this: it points at the person and does not compare them."
  "tok-0392":
    "native": "Give it to the small person."
    "confusables":
      "w1":
        "why": "Pana is to give: the command is to give, and tawa says the receiver."
      "w2":
        "why": "Tawa is to go: a command with go would send the person away."
  "tok-0393":
    "native": "The fruit is in the box."
    "confusables":
      "w1":
        "why": "Lon is at or in: the sentence places the fruit in the box, not on it."
      "w2":
        "why": "Poki is the box: it is the place, and the sentence says the fruit is in it."
