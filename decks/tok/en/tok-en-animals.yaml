"schema": 1
"id": "tok-en-animals"
"kind": "layer"
"core": "tok-animals"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Animals"
"description": "Six words for animals: soweli, waso, kala, pipi, akesi and mu (an animal's sound). Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0400":
    "native": "land animal; cat; dog"
    "notes":
      "n1": "Soweli is a land animal with fur, such as a cat or a dog: soweli mi is my pet."
      "n2": "Soweli is a noun, so the kind of animal comes after it: soweli lili is a small animal."
    "examples":
      "soweli ni li lili.": "This animal is small."
      "mi lukin e soweli.": "I look at the animal."
  "tok-0401":
    "native": "bird; flying animal"
    "notes":
      "n1": "Waso is a bird, or any animal that flies: waso suli is a big bird."
      "n2": "A bird flies up high, so sewi often comes near it: waso li lon sewi is the bird is above."
    "examples":
      "waso li tawa.": "The bird goes."
      "waso li lon sewi.": "The bird is above."
  "tok-0402":
    "native": "fish; sea animal"
    "notes":
      "n1": "Kala is a fish, or any animal that lives in water: kala lili is a small fish."
      "n2": "Telo is water, so kala li lon telo is the fish is in the water."
    "examples":
      "mi moku e kala.": "I eat fish."
      "kala li lon telo.": "The fish is in the water."
  "tok-0403":
    "native": "insect; bug"
    "notes":
      "n1": "Pipi is a small creeping or flying animal, such as an insect: pipi lili is a small bug."
      "n2": "Pipi is a noun, and the word for a bug people do not like, so pipi ike is a bad bug."
    "examples":
      "pipi li ike.": "The bug is bad."
      "pipi lili li lon poki.": "A small bug is in the box."
  "tok-0404":
    "native": "reptile; frog"
    "notes":
      "n1": "Akesi is a cold-blooded animal such as a lizard, a snake or a frog."
      "n2": "Akesi is any scaly or cold-skinned animal that is not a bird, a fish or a bug."
    "examples":
      "akesi li wawa.": "The reptile is strong."
      "akesi suli li lon.": "A big reptile is there."
  "tok-0405":
    "native": "an animal's sound; moo; meow"
    "notes":
      "n1": "Mu is the sound an animal makes: soweli li mu is the animal says mu."
      "n2": "Mu is a sound, not a thing: it comes after li, like a describing word, and needs no other word."
    "examples":
      "soweli li mu.": "The animal says mu."
      "waso li mu.": "The bird makes a sound."
