"name": "La clauses in sentences"
"description": "Sentences in which a whole clause, with la, sets the context of the main clause: if, when and if not. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0492":
    "native": "If this tool is good, I eat."
    "confusables":
      "w1":
        "why": "O gives a command or calls someone. It does not set a context, so this sentence needs la before its main clause."
      "w2":
        "why": "Sina ('you') is also a pronoun, but this sentence has ni ('this') in its place."
  "tok-0493":
    "native": "If you are hurt, I come."
    "confusables":
      "w1":
        "why": "Li starts a predicate. It does not set a context, so the sentence needs la before its main clause."
      "w2":
        "why": "Ona ('he, she, it or they') is also a pronoun, but this sentence has mi ('I') in its place."
  "tok-0494":
    "native": "Later, I sleep."
    "confusables":
      "w1":
        "why": "O gives a command or calls someone. It does not set a context, so this sentence needs la before its main clause."
      "w2":
        "why": "Wile ('to want') is also a preverb, but this sentence has kama ('to come') in its place."
  "tok-0495":
    "native": "If there is sweet fruit, they want fruit."
    "confusables":
      "w1":
        "why": "O gives a command or calls someone. It does not set a context, so this sentence needs la before its main clause."
      "w2":
        "why": "Ala means 'no, not', the opposite of lon ('to be at or in a place'). Mixing them up would say the reverse of this sentence."
  "tok-0496":
    "native": "If this person does not sleep, I talk."
    "confusables":
      "w1":
        "why": "O gives a command or calls someone. It does not set a context, so this sentence needs la before its main clause."
      "w2":
        "why": "Sina ('you') is also a pronoun, but this sentence has ni ('this') in its place."
  "tok-0497":
    "native": "If this building is big, I look."
    "confusables":
      "w1":
        "why": "O gives a command or calls someone. It does not set a context, so this sentence needs la before its main clause."
      "w2":
        "why": "Luka ('five, or hand') is spelled much like lukin ('to look'), so it is easy to mix up, but it is a different word."
  "tok-0498":
    "native": "If the water is cold, I drink water."
    "confusables":
      "w1":
        "why": "O gives a command or calls someone. It does not set a context, so this sentence needs la before its main clause."
      "w2":
        "why": "Mije ('man') is spelled much like mi ('I'), so it is easy to mix up, but it is a different word."
  "tok-0499":
    "native": "If you want, come."
    "confusables":
      "w1":
        "why": "Li starts a predicate. It does not set a context, so the sentence needs la before its main clause."
      "w2":
        "why": "Mi ('I') is also a pronoun, but this sentence has sina ('you') in its place."
