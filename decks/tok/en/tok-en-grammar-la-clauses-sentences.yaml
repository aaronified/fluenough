"core": "tok-grammar-la-clauses-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "La clauses in sentences"
"description": "Sentences in which a whole clause, with la, sets the context of the main clause: if, when and if not. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0492":
    "native": "If this tool is good, I eat."
    "confusables":
      "w1":
        "why": "Ilo is a tool: in this sentence the tool is part of the condition, not the thing that is eaten."
      "w2":
        "why": "Pona is good: it is the condition, and the sentence says what happens if it is true."
  "tok-0493":
    "native": "If you are hurt, I come."
    "confusables":
      "w1":
        "why": "Pakala is broken or hurt: it is the condition, not the result."
      "w2":
        "why": "Kama is to come: it is the result, what I do when the condition holds."
  "tok-0494":
    "native": "Later, I sleep."
    "confusables":
      "w1":
        "why": "Tenpo is time: the phrase before la is the context, and kama says later."
      "w2":
        "why": "Tawa is to go: it is the main clause, what happens in that time."
  "tok-0495":
    "native": "If there is sweet fruit, they want fruit."
    "confusables":
      "w1":
        "why": "Lon is at or in: here it is the verb of the condition, is there."
      "w2":
        "why": "Wile is to want: it is the result, the main clause."
  "tok-0496":
    "native": "If this person does not sleep, I talk."
    "confusables":
      "w1":
        "why": "Lape is to sleep: the condition is negated with ala, so the sentence changes meaning."
      "w2":
        "why": "Toki is to talk: it is the result of the condition."
  "tok-0497":
    "native": "If this building is big, I look."
    "confusables":
      "w1":
        "why": "Tomo is a building: it is the subject of the condition."
      "w2":
        "why": "Lukin is to look: it is the result, the main clause."
  "tok-0498":
    "native": "If the water is cold, I drink water."
    "confusables":
      "w1":
        "why": "Telo is water: it is the subject of the condition and also the object of the result."
      "w2":
        "why": "Lete is cold: it is the condition, and the sentence says what follows."
  "tok-0499":
    "native": "If you want, come."
    "confusables":
      "w1":
        "why": "Wile is to want: the condition is about what you want."
      "w2":
        "why": "Kama is to come: the command is the result, and o makes it an order."
