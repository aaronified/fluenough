"cards":
  "tok-0714":
    "native": "This monster is bad."
    "confusables":
      "w1":
        "why": "Soweli ('land animal') is related in meaning to monsuta ('monster'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Nimi ('word') is spelled much like ni ('this'), so it is easy to mix up, but it is a different word."
  "tok-0715":
    "native": "A small raccoon comes."
    "confusables":
      "w1":
        "why": "Mute means 'many', the opposite of lili ('small'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Wile ('to want') is also a preverb, but this sentence has kama ('to come') in its place."
  "tok-0716":
    "native": "I take this paper."
    "confusables":
      "w1":
        "why": "Sina ('you') is also a pronoun, but this sentence has mi ('I') in its place."
      "w2":
        "why": "Jo ('to have') is related in meaning to lanpan ('to take'), but it is not the same word and changes what the sentence says."
  "tok-0717":
    "native": "They take cold fruit."
    "confusables":
      "w1":
        "why": "Kasi ('plant') is related in meaning to kili ('fruit'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Len ('clothes') is spelled much like lete ('cold'), so it is easy to mix up, but it is a different word."
  "tok-0718":
    "native": "Do not take the fruit."
    "confusables":
      "w1":
        "why": "Moku ('to eat') is related in meaning to kili ('fruit'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Pana means 'to give', the opposite of lanpan ('to take'). Mixing them up would say the reverse of this sentence."
  "tok-0719":
    "native": "The monster wants water."
    "confusables":
      "w1":
        "why": "Awen ('to stay') is also a preverb, but this sentence has wile ('to want') in its place."
      "w2":
        "why": "Seli ('fire') is related in meaning to telo ('water'), but it is not the same word and changes what the sentence says."
  "tok-0720":
    "native": "The raccoon eats cold fruit."
    "confusables":
      "w1":
        "why": "Lili ('small') is spelled much like kili ('fruit'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Len ('clothes') is spelled much like lete ('cold'), so it is easy to mix up, but it is a different word."
  "tok-0721":
    "native": "A big monster is below."
    "confusables":
      "w1":
        "why": "Ike ('bad') is related in meaning to monsuta ('monster'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Sewi ('above') is spelled much like suli ('big'), so it is easy to mix up, but it is a different word."
