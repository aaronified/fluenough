"tags":
- "unreviewed"
"cards":
  "tok-0714":
    "native": "This monster is bad."
    "confusables":
      "w1":
        "why": "Monsuta is a monster: the sentence says this monster is bad."
      "w2":
        "why": "Ike is bad: it describes the monster."
  "tok-0715":
    "native": "A small raccoon comes."
    "confusables":
      "w1":
        "why": "Kijetesantakalu is the raccoon: the one who comes in the sentence."
      "w2":
        "why": "Kama is to come: the verb the raccoon does."
  "tok-0716":
    "native": "I take this paper."
    "confusables":
      "w1":
        "why": "Lanpan is to take: the sentence says what I do with the paper."
      "w2":
        "why": "Lipu is paper: the thing taken, after e."
  "tok-0717":
    "native": "They take cold fruit."
    "confusables":
      "w1":
        "why": "Lanpan is to take: the verb of the sentence."
      "w2":
        "why": "Lete is cold: it describes the fruit taken."
  "tok-0718":
    "native": "Do not take the fruit."
    "confusables":
      "w1":
        "why": "Lanpan is to take: the command is not to take."
      "w2":
        "why": "Ala is not: it negates the command, which is the point of the sentence."
  "tok-0719":
    "native": "The monster wants water."
    "confusables":
      "w1":
        "why": "Wile is to want: the sentence says what the monster wants, water."
      "w2":
        "why": "Telo is water: it is the thing wanted, after e."
  "tok-0720":
    "native": "The raccoon eats cold fruit."
    "confusables":
      "w1":
        "why": "Moku is to eat: it is the verb of the sentence."
      "w2":
        "why": "Lete is cold: it describes the fruit, not the eating."
  "tok-0721":
    "native": "A big monster is below."
    "confusables":
      "w1":
        "why": "Monsuta is a monster: the sentence says where the big one is."
      "w2":
        "why": "Anpa is below: it is the place of the monster."
