"id": "tok-en-grammar-time-la-sentences"
"kind": "layer"
"core": "tok-grammar-time-la-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Time with la in sentences"
"description": "Sentences that set what happens in the past, now or later with tenpo and la. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0284":
    "native": "In the past, I ate."
    "confusables":
      "w1":
        "why": "Kama (to come) would say that in the past I came, not that I ate."
      "w2":
        "why": "Lape (to sleep) would say that in the past I slept, not that I ate."
  "tok-0285":
    "native": "In the future, the day begins."
    "confusables":
      "w1":
        "why": "Pini (to end) would say that in the future the day ends, not begins."
      "w2":
        "why": "Mun (moon) would say that in the future the moon begins, not the day."
  "tok-0286":
    "native": "Now, I work."
    "confusables":
      "w1":
        "why": "Lape (to sleep) would say I sleep now, not that I work."
      "w2":
        "why": "Moku (to eat) would say I eat now, not that I work."
  "tok-0287":
    "native": "When I eat, they sleep."
    "confusables":
      "w1":
        "why": "Kama (to come) would say that when I eat, they come, not that they sleep."
      "w2":
        "why": "Tawa (to go) would say that when I eat, they go, not that they sleep."
  "tok-0288":
    "native": "At night, the moon is there."
    "confusables":
      "w1":
        "why": "Suno (sun) would say at night the sun is there, not the moon."
      "w2":
        "why": "Pini (to end) would say at night the moon ends, not that it is there."
  "tok-0289":
    "native": "Later, I go."
    "confusables":
      "w1":
        "why": "Lape (to sleep) would say later I sleep, not that I go."
      "w2":
        "why": "Moku (to eat) would say later I eat, not that I go."
  "tok-0290":
    "native": "In the past, they did not talk."
    "confusables":
      "w1":
        "why": "Lape (to sleep) would say that in the past they did not sleep, not that they did not talk."
      "w2":
        "why": "Moku (to eat) would say that in the past they did not eat, not that they did not talk."
  "tok-0291":
    "native": "Now, is the sun there, or not?"
    "confusables":
      "w1":
        "why": "Mun (moon) would ask whether the moon is there, not the sun."
      "w2":
        "why": "Open (to begin) would ask whether the sun begins, not whether it is there."
