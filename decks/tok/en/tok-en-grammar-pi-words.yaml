"name": "Pi: the particle of groups"
"description": "The particle pi, which groups the words after it into one. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0335":
    "native": "of; the group of"
    "notes":
      "n1": "Pi comes after a head word and before the words that describe it, which then act as one group: tomo pi telo suli is a building of big water."
      "n2": "Pi is a word of its own, not a describing word: it has no meaning apart from the group it starts."
    "examples":
      "tomo pi telo suli.": "A harbour: a building of big water."
      "jan pi moku pona.": "A cook: a person of good food."
