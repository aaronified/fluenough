"name": "Stories: monsters, a raccoon and taking"
"description": "Three words for stories: monsuta (monster, fear), kijetesantakalu (the raccoon family, a joke word from the community) and lanpan (to take). Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0711":
    "native": "monster; fear; scary thing"
    "notes":
      "n1": "Monsuta is a monster, or the fear that a monster brings: monsuta ni is this monster."
      "n2": "It is often used with pilin, to feel: pilin ike tan monsuta is to feel bad because of a monster."
    "examples":
      "monsuta li suli.": "The monster is big."
      "monsuta li lon poki.": "A monster is in the box."
  "tok-0712":
    "native": "raccoon; the raccoon family (a joke word)"
    "notes":
      "n1": "Kijetesantakalu is the raccoon family: a raccoon, or any animal of that family."
      "n2": "It is a long word used as a joke in the community, so a learner may hear it in jokes and stories."
    "examples":
      "kijetesantakalu li lon.": "The raccoon is here."
      "kijetesantakalu li moku e kili.": "The raccoon eats fruit."
  "tok-0713":
    "native": "to take; to steal; to hold"
    "notes":
      "n1": "Lanpan is to take a thing, or to steal it: mi lanpan e ilo is I take the tool."
      "n2": "It takes e before the thing taken, as any verb with an object."
    "examples":
      "mi lanpan e ilo.": "I take the tool."
      "ona li lanpan e kili suwi.": "They take sweet fruit."
