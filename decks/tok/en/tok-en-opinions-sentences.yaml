"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Opinions in sentences"
"description": "Sentences that give an opinion with kin, a thinking sound with n, and the middle with meso. Not yet checked by a Toki Pona speaker: please report any mistake."
