"tags":
- "unreviewed"
"cards":
  "tok-0607":
    "native": "This building is indeed big."
    "confusables":
      "w1":
        "why": "Kin says the building is indeed big, which is a strong claim; the sentence is about its size."
      "w2":
        "why": "Suli is big: it is the describing word, and kin adds the certainty."
  "tok-0608":
    "native": "Um, I feel bad."
    "confusables":
      "w1":
        "why": "N is a thinking sound before I speak: it is the start of the sentence, not a word of it."
      "w2":
        "why": "Pilin is to feel: it is what the speaker says, after the thinking sound."
  "tok-0609":
    "native": "The middle building is big."
    "confusables":
      "w1":
        "why": "Meso is the middle: the sentence says which building, the middle one."
      "w2":
        "why": "Tomo is a building: it is the thing that is big."
  "tok-0610":
    "native": "I also want to sleep."
    "confusables":
      "w1":
        "why": "Kin says also: the sentence says I want to sleep too."
      "w2":
        "why": "Wile is to want: it is the verb that kin adds to."
  "tok-0611":
    "native": "Hmm, this person comes."
    "confusables":
      "w1":
        "why": "N is a thinking sound: it is said before the sentence, as a pause."
      "w2":
        "why": "Kama is to come: it is the verb of the sentence, not the thinking sound."
  "tok-0612":
    "native": "This tool is indeed big."
    "confusables":
      "w1":
        "why": "Kin adds that the tool is really big, not only that it is big."
      "w2":
        "why": "Ilo is a tool: it is the thing said to be big."
  "tok-0613":
    "native": "The middle fruit is sweet."
    "confusables":
      "w1":
        "why": "Kili is fruit: the sentence says the middle fruit is sweet."
      "w2":
        "why": "Meso is the middle: it says which fruit, the one in the middle."
  "tok-0614":
    "native": "Hmm, you do not work."
    "confusables":
      "w1":
        "why": "N is a thinking sound: it comes first, while the speaker thinks."
      "w2":
        "why": "Pali is to work: the sentence negates it, and says you do not work."
