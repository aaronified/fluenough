"cards":
  "tok-0607":
    "native": "This building is indeed big."
    "confusables":
      "w1":
        "why": "Telo ('water') is spelled much like tomo ('house'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Nimi ('word') is spelled much like ni ('this'), so it is easy to mix up, but it is a different word."
  "tok-0608":
    "native": "Um, I feel bad."
    "confusables":
      "w1":
        "why": "Pona means 'good', the opposite of ike ('bad'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Mije ('man') is spelled much like mi ('I'), so it is easy to mix up, but it is a different word."
  "tok-0609":
    "native": "The middle building is big."
    "confusables":
      "w1":
        "why": "Sewi ('above') is also a word for a position, but this sentence has meso ('middle') in its place."
      "w2":
        "why": "Supa ('table') is also something in or around the home, but this sentence has tomo ('house') in its place."
  "tok-0610":
    "native": "I also want to sleep."
    "confusables":
      "w1":
        "why": "Ken ('can') is related in meaning to wile ('to want'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Moku ('to eat') is also an everyday action, but this sentence has lape ('to sleep') in its place."
  "tok-0611":
    "native": "Hmm, this person comes."
    "confusables":
      "w1":
        "why": "Wile ('to want') is also a preverb, but this sentence has kama ('to come') in its place."
      "w2":
        "why": "Mije ('man') is related in meaning to jan ('person'), but it is not the same word and changes what the sentence says."
  "tok-0612":
    "native": "This tool is indeed big."
    "confusables":
      "w1":
        "why": "Nimi ('word') is spelled much like ni ('this'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Lili means 'small', the opposite of suli ('big'). Mixing them up would say the reverse of this sentence."
  "tok-0613":
    "native": "The middle fruit is sweet."
    "confusables":
      "w1":
        "why": "Kasi ('plant') is related in meaning to kili ('fruit'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Sewi ('above') is also a word for a position, but this sentence has meso ('middle') in its place."
  "tok-0614":
    "native": "Hmm, you do not work."
    "confusables":
      "w1":
        "why": "Pakala ('to break') is spelled much like pali ('to make'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Sin ('new') is spelled much like sina ('you'), so it is easy to mix up, but it is a different word."
