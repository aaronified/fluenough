"cards":
  "tok-0652":
    "native": "This spice is good."
    "confusables":
      "w1":
        "why": "Pini ('to end') is spelled much like pona ('good'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Suwi ('sweet') is related in meaning to namako ('spice'), but it is not the same word and changes what the sentence says."
  "tok-0653":
    "native": "Cut the mushroom."
    "confusables":
      "w1":
        "why": "Utala ('to fight') is related in meaning to kipisi ('to cut'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Kasi ('plant') is related in meaning to soko ('mushroom'), but it is not the same word and changes what the sentence says."
  "tok-0654":
    "native": "I cut this fruit."
    "confusables":
      "w1":
        "why": "Sina ('you') is also a pronoun, but this sentence has ni ('this') in its place."
      "w2":
        "why": "Mije ('man') is spelled much like mi ('I'), so it is easy to mix up, but it is a different word."
  "tok-0655":
    "native": "A small mushroom is in the box."
    "confusables":
      "w1":
        "why": "Ike ('bad') is also a describing word, but this sentence has lili ('small') in its place."
      "w2":
        "why": "Weka means 'gone', the opposite of lon ('to be at or in a place'). Mixing them up would say the reverse of this sentence."
  "tok-0656":
    "native": "Too much spice is bad."
    "confusables":
      "w1":
        "why": "Lili ('small') is also a describing word, but this sentence has ike ('bad') in its place."
      "w2":
        "why": "Kili ('fruit') is also something to eat or drink, but this sentence has namako ('spice') in its place."
  "tok-0657":
    "native": "If the water is hot, add the spice."
    "confusables":
      "w1":
        "why": "Lete means 'cold', the opposite of seli ('fire'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Jo means 'to have', the opposite of pana ('to give'). Mixing them up would say the reverse of this sentence."
  "tok-0658":
    "native": "They eat mushroom with a tool."
    "confusables":
      "w1":
        "why": "Ni ('this') is spelled much like ona ('he, she, it or they'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Telo ('water') is related in meaning to moku ('to eat'), but it is not the same word and changes what the sentence says."
  "tok-0659":
    "native": "A person cuts cold fruit."
    "confusables":
      "w1":
        "why": "Telo ('water') is also something to eat or drink, but this sentence has kili ('fruit') in its place."
      "w2":
        "why": "Seli means 'fire', the opposite of lete ('cold'). Mixing them up would say the reverse of this sentence."
