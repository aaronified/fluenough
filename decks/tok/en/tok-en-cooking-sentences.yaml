"cards":
  "tok-0652":
    "native": "This spice is good."
    "confusables":
      "w1":
        "why": "Namako is spice: the sentence says this spice is good."
      "w2":
        "why": "Pona is good: it describes the spice."
  "tok-0653":
    "native": "Cut the mushroom."
    "confusables":
      "w1":
        "why": "Kipisi is to cut: the command says cut, with the mushroom after e."
      "w2":
        "why": "Soko is a mushroom: it is the thing cut, after e."
  "tok-0654":
    "native": "I cut this fruit."
    "confusables":
      "w1":
        "why": "Kipisi is to cut: the sentence says what I do to the fruit."
      "w2":
        "why": "Kili is fruit: it is the thing cut, after e."
  "tok-0655":
    "native": "A small mushroom is in the box."
    "confusables":
      "w1":
        "why": "Soko is a mushroom: the sentence says where the small one is."
      "w2":
        "why": "Lili is small: it describes the mushroom."
  "tok-0656":
    "native": "Too much spice is bad."
    "confusables":
      "w1":
        "why": "Namako is spice: the sentence says a big spice is bad, or too much of it."
      "w2":
        "why": "Suli is big: it describes the spice, as too much."
  "tok-0657":
    "native": "If the water is hot, add the spice."
    "confusables":
      "w1":
        "why": "Pana is to give or add: the command says add the spice."
      "w2":
        "why": "Seli is hot: it is the condition in the sentence."
  "tok-0658":
    "native": "They eat mushroom with a tool."
    "confusables":
      "w1":
        "why": "Moku is to eat: it is what they do with the mushroom."
      "w2":
        "why": "Kepeken is using: it says the tool is used."
  "tok-0659":
    "native": "A person cuts cold fruit."
    "confusables":
      "w1":
        "why": "Kipisi is to cut: the person cuts the fruit."
      "w2":
        "why": "Lete is cold: it describes the fruit, not the cutting."
