"cards":
  "tok-0178":
    "native": "Listen to this!"
    "confusables":
      "w1":
        "why": "Lukin (to see) would tell the listener to see this, not to hear it."
      "w2":
        "why": "Wile (to want) would tell the listener to want this, not to hear it."
  "tok-0179":
    "native": "Eat!"
    "confusables":
      "w1":
        "why": "Tawa (to go) would tell the listener to go, not to eat."
      "w2":
        "why": "Kama (to come) would tell the listener to come, not to eat."
  "tok-0180":
    "native": "Go!"
    "confusables":
      "w1":
        "why": "Kama (to come) would tell the listener to come, not to go."
      "w2":
        "why": "Lape (to sleep) would tell the listener to sleep, not to go."
  "tok-0181":
    "native": "Come!"
    "confusables":
      "w1":
        "why": "Tawa (to go) would tell the listener to go, not to come."
      "w2":
        "why": "Lape (to sleep) would tell the listener to sleep, not to come."
  "tok-0182":
    "native": "Be good!"
    "confusables":
      "w1":
        "why": "Ike (bad) would tell the listener to be bad, not good."
      "w2":
        "why": "Suli (big) would tell the listener to be big, not good."
  "tok-0183":
    "native": "Give the bread!"
    "confusables":
      "w1":
        "why": "Moku (to eat) would tell the listener to eat the bread, not to give it."
      "w2":
        "why": "Jo (to have) would tell the listener to have the bread, not to give it."
  "tok-0184":
    "native": "Do this!"
    "confusables":
      "w1":
        "why": "Lukin (to see) would tell the listener to see this, not to do it."
      "w2":
        "why": "Kute (to hear) would tell the listener to hear this, not to do it."
  "tok-0185":
    "native": "Speak Toki Pona!"
    "confusables":
      "w1":
        "why": "Sona (to know) would tell the listener to know Toki Pona, not to speak it."
      "w2":
        "why": "Wile (to want) would tell the listener to want Toki Pona, not to speak it."
