kind: "layer"
core: "tok-grammar-time-la"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "La places a sentence in time"
license: "CC-BY-SA-4.0"
description: "The particle la, after a word or phrase of time or context, sets the sentence in that time or situation. Not yet checked by a Toki Pona speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "tok-0283":
    native: "context particle (la)"
    notes:
      "context": "La comes after the time or the situation the sentence is about: tenpo pini la is in the past, tenpo ni la is now, and mi moku la is when I eat."
      "placement": "After la comes the sentence, with its usual order: tenpo pini la, mi lape is In the past, I slept. Toki Pona has no tense, so la is how the time is shown."
    examples:
      "tenpo pini la, mi lape.": "In the past, I slept."
      "mi moku la, ona li lukin.": "When I eat, they look."
