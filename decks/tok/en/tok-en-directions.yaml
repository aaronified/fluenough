  "name": "English"
"name": "Directions"
"description": "Three words for getting somewhere: nasin (the way, a road, a method), tan (from, because of) and kepeken (using, with). Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0369":
    "native": "way; road; method"
    "notes":
      "n1": "Nasin is a way to go, a road, or a way of doing a thing: nasin ni is this way."
      "n2": "The same word is a way of doing things as well as a road, so nasin pona can be a good road or a good method."
    "examples":
      "nasin ni li pona.": "This way is good."
      "o tawa nasin ni.": "Go this way."
  "tok-0370":
    "native": "from; because of"
    "notes":
      "n1": "Tan says where a thing starts, or why it happens: tan tomo is from the building."
      "n2": "Tan comes before its place or reason, and never after the verb it belongs to: mi tawa tan tomo is I go from the building."
    "examples":
      "mi tawa tan tomo ni.": "I go from this building."
      "mi lape tan ni.": "I sleep because of this."
  "tok-0371":
    "native": "using; with; by means of"
    "notes":
      "n1": "Kepeken says what a thing is done with: kepeken ilo is using a tool."
      "n2": "It comes after the verb, before the thing used: mi pali kepeken ilo is I work with a tool."
    "examples":
      "mi pali kepeken ilo.": "I work with a tool."
      "ona li pali kepeken ilo lili.": "They work with a small tool."
