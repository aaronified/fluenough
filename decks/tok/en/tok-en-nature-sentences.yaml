"cards":
  "tok-0508":
    "native": "This plant is good."
    "confusables":
      "w1":
        "why": "Kasi is a plant: the sentence says this plant is good."
      "w2":
        "why": "Ma is the land: the sentence would say the land is good, not the plant."
  "tok-0509":
    "native": "This land is big."
    "confusables":
      "w1":
        "why": "Ma is the land: the sentence says this land is big."
      "w2":
        "why": "Suli is big: it describes the land."
  "tok-0510":
    "native": "A small plant is on the land."
    "confusables":
      "w1":
        "why": "Kasi is the plant: the sentence says where the small plant is, on the land."
      "w2":
        "why": "Ma is the land: it is the place, after lon."
  "tok-0511":
    "native": "I go all over the land."
    "confusables":
      "w1":
        "why": "Tawa is to go: the sentence says I go over the land."
      "w2":
        "why": "Ale is all: it says the whole land, not one place."
  "tok-0512":
    "native": "They look at a white plant."
    "confusables":
      "w1":
        "why": "Lukin is to look: the sentence says what they look at."
      "w2":
        "why": "Walo is white: it describes the plant, not the look."
  "tok-0513":
    "native": "Water is on the land."
    "confusables":
      "w1":
        "why": "Telo is water: the sentence says where the water is, on the land."
      "w2":
        "why": "Ma is the land: it is the place the water is on."
  "tok-0514":
    "native": "The sweet plant is here."
    "confusables":
      "w1":
        "why": "Kasi is the plant: the sentence says where it is."
      "w2":
        "why": "Suwi is sweet: it describes the plant, and the sentence is about its place."
  "tok-0515":
    "native": "Go to the good land."
    "confusables":
      "w1":
        "why": "Tawa is to go: the command sends you to the land."
      "w2":
        "why": "Ma is the land: it is the place you go to, described as good."
