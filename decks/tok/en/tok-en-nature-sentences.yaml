"cards":
  "tok-0508":
    "native": "This plant is good."
    "confusables":
      "w1":
        "why": "Kili ('fruit') is related in meaning to kasi ('plant'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Mi ('I') is also a pronoun, but this sentence has ni ('this') in its place."
  "tok-0509":
    "native": "This land is big."
    "confusables":
      "w1":
        "why": "Wawa ('strong') is related in meaning to suli ('big'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Mama ('parent') is spelled much like ma ('land'), so it is easy to mix up, but it is a different word."
  "tok-0510":
    "native": "A small plant is on the land."
    "confusables":
      "w1":
        "why": "Mun ('moon') is also a part of nature, but this sentence has ma ('land') in its place."
      "w2":
        "why": "Kili ('fruit') is related in meaning to kasi ('plant'), but it is not the same word and changes what the sentence says."
  "tok-0511":
    "native": "I go all over the land."
    "confusables":
      "w1":
        "why": "Kama means 'to come', the opposite of tawa ('to go'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Tomo ('house') is related in meaning to ma ('land'), but it is not the same word and changes what the sentence says."
  "tok-0512":
    "native": "They look at a white plant."
    "confusables":
      "w1":
        "why": "Loje ('red') is also a colour, but this sentence has walo ('white') in its place."
      "w2":
        "why": "Ni ('this') is spelled much like ona ('he, she, it or they'), so it is easy to mix up, but it is a different word."
  "tok-0513":
    "native": "Water is on the land."
    "confusables":
      "w1":
        "why": "Mani ('money') is spelled much like ma ('land'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Seli ('fire') is related in meaning to telo ('water'), but it is not the same word and changes what the sentence says."
  "tok-0514":
    "native": "The sweet plant is here."
    "confusables":
      "w1":
        "why": "Tawa ('to go') is also a preposition, but this sentence has lon ('to be at or in a place') in its place."
      "w2":
        "why": "Kala ('fish') is spelled much like kasi ('plant'), so it is easy to mix up, but it is a different word."
  "tok-0515":
    "native": "Go to the good land."
    "confusables":
      "w1":
        "why": "Tomo ('house') is related in meaning to ma ('land'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Suwi ('sweet') is related in meaning to pona ('good'), but it is not the same word and changes what the sentence says."
