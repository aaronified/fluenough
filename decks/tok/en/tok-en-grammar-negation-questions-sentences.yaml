schema: 1
id: "tok-en-grammar-negation-questions-sentences"
kind: "layer"
core: "tok-grammar-negation-questions-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Negatives and questions in sentences"
description: "Sentences with ala for no, ala and anu for or-not questions, and seme for what. Ala comes after the word it denies, and the question keeps the order of a statement. Not yet checked by a Toki Pona speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "tok-0141":
    native: "I do not want food."
    confusables:
      "w1": { why: "Lukin (to see) would say I do not see the food, not that I do not want it." }
      "w2": { why: "Sona (to know) would say I do not know the food, not that I do not want it." }
  "tok-0142":
    native: "What do they want?"
    confusables:
      "w1": { why: "Moku (to eat) would ask what they eat, not what they want." }
      "w2": { why: "Lukin (to see) would ask what they see, not what they want." }
  "tok-0143":
    native: "Is this good or not?"
    confusables:
      "w1": { why: "Suli (big) would ask whether this is big, not whether it is good." }
      "w2": { why: "Ike (bad) would ask whether this is bad, not whether it is good." }
  "tok-0144":
    native: "This person does not sleep."
    confusables:
      "w1": { why: "Tawa (to go) would say this person does not go, not that they do not sleep." }
      "w2": { why: "Kama (to come) would say this person does not come, not that they do not sleep." }
  "tok-0145":
    native: "They do not know this."
    confusables:
      "w1": { why: "Lukin (to see) would say they do not see this, not that they do not know it." }
      "w2": { why: "Wile (to want) would say they do not want this, not that they do not know it." }
  "tok-0146":
    native: "Are you coming or not?"
    confusables:
      "w1": { why: "Tawa (to go) would ask whether you go, not whether you come." }
      "w2": { why: "Wile (to want) would ask whether you want, not whether you come." }
  "tok-0147":
    native: "What do I hear?"
    confusables:
      "w1": { why: "Lukin (to see) would ask what I see, not what I hear." }
      "w2": { why: "Jo (to have) would ask what I have, not what I hear." }
  "tok-0148":
    native: "Nobody comes."
    confusables:
      "w1": { why: "Ijo (thing) would say that nothing comes, not that nobody does." }
      "w2": { why: "Tawa (to go) would say that nobody goes, not that nobody comes." }
  "tok-0149":
    native: "There is no bread."
    confusables:
      "w1": { why: "Ijo (thing) would say that nothing is here, not that there is no bread." }
      "w2": { why: "Kon (air) would say there is no air, not that there is no bread." }
  "tok-0150":
    native: "This thing is not bad."
    confusables:
      "w1": { why: "Suli (big) would say the thing is big, not that it is not bad." }
      "w2": { why: "Ante (different) would say the thing is different, not that it is not bad." }
