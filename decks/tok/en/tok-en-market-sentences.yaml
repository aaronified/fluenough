"cards":
  "tok-0478":
    "native": "This money is not little."
    "confusables":
      "w1":
        "why": "Nimi ('word') is spelled much like ni ('this'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Suli means 'big', the opposite of lili ('small'). Mixing them up would say the reverse of this sentence."
  "tok-0479":
    "native": "I have money."
    "confusables":
      "w1":
        "why": "Ma ('land') is spelled much like mani ('money'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Mije ('man') is spelled much like mi ('I'), so it is easy to mix up, but it is a different word."
  "tok-0480":
    "native": "A person gives money to the market."
    "confusables":
      "w1":
        "why": "Meli ('woman') is spelled much like mani ('money'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Kama means 'to come', the opposite of tawa ('to go'). Mixing them up would say the reverse of this sentence."
  "tok-0481":
    "native": "Go to the market."
    "confusables":
      "w1":
        "why": "Tomo ('house') is related in meaning to esun ('market'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Kama means 'to come', the opposite of tawa ('to go'). Mixing them up would say the reverse of this sentence."
  "tok-0482":
    "native": "A lot of money is in the box."
    "confusables":
      "w1":
        "why": "Tu ('two') is also a number word, but this sentence has mute ('many') in its place."
      "w2":
        "why": "Weka means 'gone', the opposite of lon ('to be at or in a place'). Mixing them up would say the reverse of this sentence."
  "tok-0483":
    "native": "A small market is there."
    "confusables":
      "w1":
        "why": "Tomo ('house') is related in meaning to esun ('market'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Suli means 'big', the opposite of lili ('small'). Mixing them up would say the reverse of this sentence."
  "tok-0484":
    "native": "I look at this money."
    "confusables":
      "w1":
        "why": "Sina ('you') is also a pronoun, but this sentence has mi ('I') in its place."
      "w2":
        "why": "Oko ('eye') is related in meaning to lukin ('to look'), but it is not the same word and changes what the sentence says."
  "tok-0485":
    "native": "This market is big."
    "confusables":
      "w1":
        "why": "Wawa ('strong') is related in meaning to suli ('big'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Tomo ('house') is related in meaning to esun ('market'), but it is not the same word and changes what the sentence says."
