"cards":
  "tok-0478":
    "native": "This money is not little."
    "confusables":
      "w1":
        "why": "Mani is money: the sentence says this money is not little, a claim about its amount."
      "w2":
        "why": "Lili is small: the sentence negates it, so the money is not small."
  "tok-0479":
    "native": "I have money."
    "confusables":
      "w1":
        "why": "Jo is to have: the sentence says I have the money, the thing after e."
      "w2":
        "why": "Wile is to want: the sentence would say I want money, not that I have it."
  "tok-0480":
    "native": "A person gives money to the market."
    "confusables":
      "w1":
        "why": "Pana is to give: the sentence says the person gives the money."
      "w2":
        "why": "Tawa is to go or to: here it says the market receives the money."
  "tok-0481":
    "native": "Go to the market."
    "confusables":
      "w1":
        "why": "Tawa is to go: the command sends you to the market."
      "w2":
        "why": "Esun is the market: it is the place to go, not the thing you do."
  "tok-0482":
    "native": "A lot of money is in the box."
    "confusables":
      "w1":
        "why": "Mani is money: the sentence says where it is, in the box."
      "w2":
        "why": "Mute is many: it counts the money, so the box holds a lot."
  "tok-0483":
    "native": "A small market is there."
    "confusables":
      "w1":
        "why": "Esun is the market: the sentence says a small market is here."
      "w2":
        "why": "Lili is small: it describes the market, and the sentence says it is there."
  "tok-0484":
    "native": "I look at this money."
    "confusables":
      "w1":
        "why": "Lukin is to look: the sentence says what I look at, this money."
      "w2":
        "why": "Ni is this: it points at the money I look at."
  "tok-0485":
    "native": "This market is big."
    "confusables":
      "w1":
        "why": "Esun is the market: the sentence says this market is big."
      "w2":
        "why": "Suli is big: it describes the market."
