schema: 1
id: "tok-en-pronouns-sentences"
kind: "layer"
core: "tok-pronouns-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Talking about people and things"
description: "Sentences that say who is talking, what someone knows and what is there, each with a pronoun and the words of the pronouns unit. Not yet checked by a Toki Pona speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "tok-0067":
    native: "They are talking."
    confusables:
      "w1": { why: "Mi (I) would make it about the speaker, not about them." }
      "w2": { why: "Ala (not) would make it say they are not talking." }
  "tok-0068":
    native: "This is good."
    confusables:
      "w1": { why: "Sina (you) would make it about the listener, not about this." }
      "w2": { why: "Sona (to know) is a verb; this sentence says something is good, not known." }
  "tok-0069":
    native: "This person is talking."
    confusables:
      "w1": { why: "Mi (I) would make it about the speaker, not this person." }
      "w2": { why: "Ala (not) would make it say this person is not talking." }
  "tok-0070":
    native: "I know this thing."
    confusables:
      "w1": { why: "Pona (good) describes a thing; it cannot be the thing that is known." }
      "w2": { why: "Lon (to be here or there) takes no object, so it cannot stand before e." }
  "tok-0071":
    native: "There is nothing."
    confusables:
      "w1": { why: "Mi (I) would make it say I am there, not that nothing is." }
      "w2": { why: "Sona (to know) is a verb; it would make the sentence about knowing." }
  "tok-0072":
    native: "Do you know them?"
    confusables:
      "w1": { why: "Pan (bread) is a thing, and the sentence would ask about bread." }
      "w2": { why: "Pona (good) describes; it cannot stand in the place of the person known." }
