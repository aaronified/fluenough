"tags":
- "unreviewed"
"cards":
  "tok-0322":
    "native": "My body is well."
    "confusables":
      "w1":
        "why": "Lawa is the head: the sentence would say my head is well, not my whole body."
      "w2":
        "why": "Noka is the foot: the sentence would say my foot is well, not my whole body."
  "tok-0323":
    "native": "My head is not well."
    "confusables":
      "w1":
        "why": "Sijelo is the whole body: the sentence would say my whole body is bad, not only my head."
      "w2":
        "why": "Nena is the nose: the sentence would say my nose is bad, not my head."
  "tok-0324":
    "native": "My feet are strong."
    "confusables":
      "w1":
        "why": "Uta is the mouth: the sentence would say my mouth is strong, not my feet."
      "w2":
        "why": "Selo is the skin: the sentence would say my skin is strong, not my feet."
  "tok-0325":
    "native": "My mouth wants water."
    "confusables":
      "w1":
        "why": "Telo is water on its own: it is the thing wanted, not the mouth that wants it."
      "w2":
        "why": "Sijelo is the whole body: the sentence would say my body wants water, not my mouth."
  "tok-0326":
    "native": "Make your body healthy."
    "confusables":
      "w1":
        "why": "Lawa is the head: the sentence would ask you to make your head good, not your body."
      "w2":
        "why": "Pona is good, and is only a describing word here: the sentence needs the body as its object."
  "tok-0327":
    "native": "A small bump is there."
    "confusables":
      "w1":
        "why": "Nena is the nose or a bump: this sentence says a bump is there, and the small describes it."
      "w2":
        "why": "Suli is big: the sentence would say the bump is big, not small."
  "tok-0328":
    "native": "Your foot is not hurt."
    "confusables":
      "w1":
        "why": "Noka is the foot: this is the sentence to read as your foot, but the negation makes it not hurt."
      "w2":
        "why": "Pakala on its own says something is broken: the ala turns it into not broken."
