"cards":
  "tok-0322":
    "native": "My body is well."
    "confusables":
      "w1":
        "why": "Sike ('round thing') is spelled much like sijelo ('body'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Sina ('you') is also a pronoun, but this sentence has mi ('I') in its place."
  "tok-0323":
    "native": "My head is not well."
    "confusables":
      "w1":
        "why": "Pakala ('to break') is related in meaning to ike ('bad'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Sijelo ('body') is related in meaning to lawa ('head'), but it is not the same word and changes what the sentence says."
  "tok-0324":
    "native": "My feet are strong."
    "confusables":
      "w1":
        "why": "Luka ('five, or hand') is related in meaning to noka ('foot'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Sina ('you') is also a pronoun, but this sentence has mi ('I') in its place."
  "tok-0325":
    "native": "My mouth wants water."
    "confusables":
      "w1":
        "why": "Mije ('man') is spelled much like mi ('I'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Awen ('to stay') is also a preverb, but this sentence has wile ('to want') in its place."
  "tok-0326":
    "native": "Make your body healthy."
    "confusables":
      "w1":
        "why": "Suwi ('sweet') is related in meaning to pona ('good'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Lape ('to sleep') is also an everyday action, but this sentence has pali ('to make') in its place."
  "tok-0327":
    "native": "A small bump is there."
    "confusables":
      "w1":
        "why": "Suli means 'big', the opposite of lili ('small'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Weka means 'gone', the opposite of lon ('to be at or in a place'). Mixing them up would say the reverse of this sentence."
  "tok-0328":
    "native": "Your foot is not hurt."
    "confusables":
      "w1":
        "why": "Sijelo ('body') is related in meaning to noka ('foot'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Sin ('new') is spelled much like sina ('you'), so it is easy to mix up, but it is a different word."
