"cards":
  "tok-0526":
    "native": "I do not feel bad."
    "confusables":
      "w1":
        "why": "Sina ('you') is also a pronoun, but this sentence has mi ('I') in its place."
      "w2":
        "why": "Olin ('to love') is spelled much like pilin ('to feel'), so it is easy to mix up, but it is a different word."
  "tok-0527":
    "native": "The fun person eats."
    "confusables":
      "w1":
        "why": "Mun ('moon') is spelled much like musi ('fun'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Telo ('water') is related in meaning to moku ('to eat'), but it is not the same word and changes what the sentence says."
  "tok-0528":
    "native": "If they feel good, they play."
    "confusables":
      "w1":
        "why": "Pini ('to end') is spelled much like pona ('good'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Nasa ('strange') is also a feeling word, but this sentence has musi ('fun') in its place."
  "tok-0529":
    "native": "The strange tool is in the box."
    "confusables":
      "w1":
        "why": "Ijo ('thing') is spelled much like ilo ('tool'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Ike ('bad') is related in meaning to nasa ('strange'), but it is not the same word and changes what the sentence says."
  "tok-0530":
    "native": "The dirty fruit is sweet."
    "confusables":
      "w1":
        "why": "Kiwen ('stone') is spelled much like kili ('fruit'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Pona means 'good', the opposite of jaki ('dirty'). Mixing them up would say the reverse of this sentence."
  "tok-0531":
    "native": "You feel strange."
    "confusables":
      "w1":
        "why": "Ike ('bad') is related in meaning to nasa ('strange'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Sin ('new') is spelled much like sina ('you'), so it is easy to mix up, but it is a different word."
  "tok-0532":
    "native": "If I feel bad, I sleep."
    "confusables":
      "w1":
        "why": "Sona ('to know') is related in meaning to pilin ('to feel'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Pakala ('to break') is related in meaning to ike ('bad'), but it is not the same word and changes what the sentence says."
  "tok-0533":
    "native": "This game is strange."
    "confusables":
      "w1":
        "why": "Pona ('good') is related in meaning to musi ('fun'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Nimi ('word') is spelled much like ni ('this'), so it is easy to mix up, but it is a different word."
