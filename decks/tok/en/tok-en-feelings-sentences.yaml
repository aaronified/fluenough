"cards":
  "tok-0526":
    "native": "I do not feel bad."
    "confusables":
      "w1":
        "why": "Pilin is to feel: the sentence says I do not feel bad, which is about the feeling."
      "w2":
        "why": "Ike is bad: the sentence negates it, so I am not bad, but I feel fine."
  "tok-0527":
    "native": "The fun person eats."
    "confusables":
      "w1":
        "why": "Jan is a person: the sentence says a fun person eats, and musi describes them."
      "w2":
        "why": "Moku is to eat: it is the action of the sentence."
  "tok-0528":
    "native": "If they feel good, they play."
    "confusables":
      "w1":
        "why": "Pilin is to feel: it is the condition in this sentence."
      "w2":
        "why": "Musi is to play: it is the result."
  "tok-0529":
    "native": "The strange tool is in the box."
    "confusables":
      "w1":
        "why": "Ilo is a tool: the sentence says the strange tool is in the box."
      "w2":
        "why": "Nasa is strange: it describes the tool."
  "tok-0530":
    "native": "The dirty fruit is sweet."
    "confusables":
      "w1":
        "why": "Kili is fruit: the sentence says the dirty fruit is sweet."
      "w2":
        "why": "Jaki is dirty: it describes the fruit, and the sentence says it is sweet."
  "tok-0531":
    "native": "You feel strange."
    "confusables":
      "w1":
        "why": "Pilin is to feel: the sentence says how you feel."
      "w2":
        "why": "Nasa is strange: it is the feeling, not a thing you touch."
  "tok-0532":
    "native": "If I feel bad, I sleep."
    "confusables":
      "w1":
        "why": "Pilin is to feel: it is the condition, how I feel."
      "w2":
        "why": "Lape is to sleep: the result when I feel bad."
  "tok-0533":
    "native": "This game is strange."
    "confusables":
      "w1":
        "why": "Musi is the game or fun: the sentence says this game is strange."
      "w2":
        "why": "Nasa is strange: it describes the game."
