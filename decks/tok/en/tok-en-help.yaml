id: "tok-en-help"
kind: "layer"
core: "tok-help"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Help"
description: "Four words for trouble and waiting: pakala (broken; a mistake), awen (to stay; to wait), ken (can) and weka (gone; away). Not yet checked by a Toki Pona speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "tok-0298":
    native: "to break; to go wrong; broken"
    notes:
      "broken": "Pakala is something broken or not working: ilo ni li pakala is This tool is broken."
      "mistake": "Pakala e ni is to make this mistake, or to spoil this thing. The word takes e before what is spoiled."
    examples:
      "ilo ni li pakala.": "This tool is broken."
      "mi pakala e ni.": "I make this mistake."
  "tok-0299":
    native: "to stay; to wait; to remain"
    notes:
      "stay": "Awen is to stay in one place, or to remain: ona li awen lon tomo is They stay at home."
      "wait": "Awen is also to wait, as with mi awen, I wait. The same word, with the place or time after it."
    examples:
      "ona li awen lon tomo.": "They stay at home."
      "mi awen.": "I wait."
  "tok-0300":
    native: "can; to be able to"
    notes:
      "can": "Ken before a verb means can: mi ken moku is I can eat. Ken is not a noun, and it does not change."
      "possible": "Ken is also a possibility: ken li lon is it is possible."
    examples:
      "mi ken moku.": "I can eat."
      "ona li ken lukin e mun.": "They can see the moon."
  "tok-0301":
    native: "gone; away; not there"
    notes:
      "gone": "Weka is gone, not there any longer: ilo ni li weka is This tool is gone."
      "away": "Weka is away, out of the way, as well: mi weka is I am away."
    examples:
      "ilo ni li weka.": "This tool is gone."
      "mi weka.": "I am away."
