core: "tok-grammar-o"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "O for commands and calling"
license: "CC-BY-SA-4.0"
description: "The particle o: it comes before a command, and after a name to call someone. Not yet checked by a Toki Pona speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "tok-0177":
    native: "command or call particle (o)"
    notes:
      "command": "O comes first in a command, and the subject is left out: o lukin e pan! is Look at the bread! The listener is understood, so no sina or li is needed."
      "address": "After a name, o calls the person by that name: Ana o, ... is Ana, ... It is not a command on its own, and it is said before the rest of the sentence."
    examples:
      "o lukin e pan!": "Look at the bread!"
      "o pali e moku!": "Make the food!"
