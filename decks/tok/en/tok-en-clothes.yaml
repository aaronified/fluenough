"schema": 1
"id": "tok-en-clothes"
"kind": "layer"
"core": "tok-clothes"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Clothes and colours"
"description": "Seven words for clothes and colours: len, kule, loje, jelo, laso, walo and pimeja. The five colour words form a set. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0420":
    "native": "clothes; cloth; covering"
    "notes":
      "n1": "Len is clothes, or any cloth or covering: len mi is my clothes."
      "n2": "Len can also be a skin-like covering on a thing, as in a cover for a bed."
    "examples":
      "mi wile e len pona.": "I want good clothes."
      "len ni li loje.": "This cloth is red."
  "tok-0421":
    "native": "colour; paint"
    "notes":
      "n1": "Kule is a colour, or the paint that makes one: kule ona is their colour."
      "n2": "It is a noun, so the colour is named after it: kule loje is red colour, a red paint."
    "examples":
      "kule ni li pona.": "This colour is good."
      "kule ona li walo.": "Their colour is white."
  "tok-0422":
    "native": "red"
    "notes":
      "n1": "Loje is the colour red, as in blood or a rose."
      "n2": "It comes after the thing it colours: ilo loje is a red tool."
    "examples":
      "len loje li lon.": "A red cloth is there."
      "ilo loje li pona.": "The red tool is good."
  "tok-0423":
    "native": "yellow"
    "notes":
      "n1": "Jelo is the colour yellow, as in the sun or a lemon."
      "n2": "Jelo mixed with laso gives the green of a leaf: laso jelo."
    "examples":
      "kili jelo li suwi.": "The yellow fruit is sweet."
      "waso jelo li tawa.": "The yellow bird goes."
  "tok-0424":
    "native": "blue; green"
    "notes":
      "n1": "Laso is blue, as in the sky, and green, as in a leaf: laso jelo is green."
      "n2": "Laso in a mix with jelo gives green: laso jelo is green, and laso alone is blue."
    "examples":
      "ijo laso li lon.": "A blue thing is there."
      "mi wile e len laso.": "I want blue clothes."
  "tok-0425":
    "native": "white"
    "notes":
      "n1": "Walo is the colour white, as in snow or a clean cloth."
      "n2": "Walo is the lightest of the five colours, and a plain one."
    "examples":
      "tomo walo li suli.": "The white building is big."
      "len walo li lon.": "A white cloth is there."
  "tok-0426":
    "native": "black; dark"
    "notes":
      "n1": "Pimeja is the colour black, and also dark, as in night: tenpo pimeja is the night."
      "n2": "It describes a thing that is black or dark: kili pimeja is a black fruit."
    "examples":
      "kili pimeja li pona ala.": "The black fruit is not good."
      "tenpo pimeja li lon.": "The night is here."
  "tok-0427":
    "native": "The five colours"
    "explanation": "Toki Pona has five colour words: loje, jelo, laso, walo and pimeja. Other colours are mixed from them, as in laso jelo, green."
