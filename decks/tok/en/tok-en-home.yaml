schema: 1
id: "tok-en-home"
kind: "layer"
core: "tok-home"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Home"
description: "Five words for the home: tomo (house; room), supa (table), poki (box; bag), lupa (door; hole) and ilo (tool; device). Not yet checked by a Toki Pona speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "tok-0245":
    native: "house; building; room"
    notes:
      "house": "Tomo is a house or building, and lon tomo, to be in one, is at home. Tomo mi is my house."
      "room": "Tomo also means a room: the words stay the same, and the sentence shows which is meant."
    examples:
      "tomo mi li suli.": "My house is big."
      "mi lon tomo.": "I am at home."
  "tok-0246":
    native: "table; flat surface"
    notes:
      "table": "Supa is a table, or any flat surface that things are put on."
      "place": "Lon supa is on the table. Lon says where, and supa says the surface: moku li lon supa is The food is on the table."
    examples:
      "moku li lon supa.": "The food is on the table."
      "supa ni li suli.": "This table is big."
  "tok-0247":
    native: "box; bag; container"
    notes:
      "box": "Poki is a box or a container, and a bag too: anything that holds things."
      "bag": "Poki ni li lili is This box is small. Poki takes ni or any describing word after it, as tomo does."
    examples:
      "poki ni li lili.": "This box is small."
      "mi jo e poki.": "I have a box."
  "tok-0248":
    native: "door; hole; opening"
    notes:
      "door": "Lupa is a door, or an opening in a wall: anything you go through."
      "hole": "A hole in the ground is also a lupa: the word covers any opening."
    examples:
      "mi lukin e lupa.": "I see the door."
      "lupa ni li suli.": "This door is big."
  "tok-0249":
    native: "tool; device"
    notes:
      "tool": "Ilo is a tool: a thing made to do a job, such as a knife or a hammer."
      "device": "Ilo is also a device, a machine or a phone: the same word for any thing made to work."
    examples:
      "ilo ni li pona.": "This tool is good."
      "mi pali e ilo.": "I make a tool."
