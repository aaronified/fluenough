"cards":
  "tok-0744":
    "native": "The book is good."
    "confusables":
      "w1":
        "why": "Suli ('big') is also a describing word, but this sentence has pona ('good') in its place."
      "w2":
        "why": "Ku ('the dictionary') is related in meaning to pu ('the first book of toki pona'), but it is not the same word and changes what the sentence says."
  "tok-0745":
    "native": "The dictionary is in the building."
    "confusables":
      "w1":
        "why": "Kulupu ('group') is spelled much like ku ('the dictionary'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Weka means 'gone', the opposite of lon ('to be at or in a place'). Mixing them up would say the reverse of this sentence."
  "tok-0746":
    "native": "You do not use the dictionary."
    "confusables":
      "w1":
        "why": "Mi ('I') is also a pronoun, but this sentence has sina ('you') in its place."
      "w2":
        "why": "Lon ('to be at or in a place') is also a preposition, but this sentence has kepeken ('using') in its place."
  "tok-0747":
    "native": "A friend looks at the book."
    "confusables":
      "w1":
        "why": "Lipu ('paper') is related in meaning to pu ('the first book of toki pona'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Ona ('he, she, it or they') is related in meaning to jan ('person'), but it is not the same word and changes what the sentence says."
  "tok-0748":
    "native": "The toki pona community is big."
    "confusables":
      "w1":
        "why": "Pini ('to end') is spelled much like pona ('good'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Sewi ('above') is spelled much like suli ('big'), so it is easy to mix up, but it is a different word."
  "tok-0749":
    "native": "I make a small book."
    "confusables":
      "w1":
        "why": "Mije ('man') is spelled much like mi ('I'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Moku ('to eat') is related in meaning to pali ('to make'), but it is not the same word and changes what the sentence says."
  "tok-0750":
    "native": "The big dictionary is good too."
    "confusables":
      "w1":
        "why": "Sewi ('above') is spelled much like suli ('big'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Pini ('to end') is spelled much like pona ('good'), so it is easy to mix up, but it is a different word."
  "tok-0751":
    "native": "I want this book."
    "confusables":
      "w1":
        "why": "Nimi ('word') is spelled much like ni ('this'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Sina ('you') is also a pronoun, but this sentence has mi ('I') in its place."
