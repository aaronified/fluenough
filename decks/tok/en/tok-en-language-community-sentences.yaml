"tags":
- "unreviewed"
"cards":
  "tok-0744":
    "native": "The book is good."
    "confusables":
      "w1":
        "why": "Pu is the book: the sentence says it is good."
      "w2":
        "why": "Pona is good: it describes the book."
  "tok-0745":
    "native": "The dictionary is in the building."
    "confusables":
      "w1":
        "why": "Ku is the dictionary: the sentence says where it is."
      "w2":
        "why": "Tomo is a building: it is the place of the dictionary."
  "tok-0746":
    "native": "You do not use the dictionary."
    "confusables":
      "w1":
        "why": "Kepeken is using: the sentence says what is not used."
      "w2":
        "why": "Ku is the dictionary: the thing not used, after e."
  "tok-0747":
    "native": "A friend looks at the book."
    "confusables":
      "w1":
        "why": "Lukin is to look: the sentence says what the friend looks at."
      "w2":
        "why": "Pu is the book: the thing looked at, after e."
  "tok-0748":
    "native": "The toki pona community is big."
    "confusables":
      "w1":
        "why": "Kulupu is a group: the sentence says the community is big."
      "w2":
        "why": "Suli is big: it describes the community."
  "tok-0749":
    "native": "I make a small book."
    "confusables":
      "w1":
        "why": "Pali is to make: it is what I do to the book."
      "w2":
        "why": "Pu is the book: the thing made, after e."
  "tok-0750":
    "native": "The big dictionary is good too."
    "confusables":
      "w1":
        "why": "Ku is the dictionary: it is the thing described as big and good."
      "w2":
        "why": "Pona is good: here kin says it is good too."
  "tok-0751":
    "native": "I want this book."
    "confusables":
      "w1":
        "why": "Wile is to want: the sentence says what I want, this book."
      "w2":
        "why": "Ni is this: it points at the book I want."
