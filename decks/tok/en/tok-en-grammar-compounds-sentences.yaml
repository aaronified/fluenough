"name": "Compounds in sentences"
"description": "Sentences that use conventional compounds such as tomo tawa, ilo toki, jan pona and telo nasa, each a phrase of known words. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0590":
    "native": "A car is big."
    "confusables":
      "w1":
        "why": "Tomo is a building: alone it would say a big building, not a moving one."
      "w2":
        "why": "Tawa is to go: on its own it is the verb, and the compound needs the building first."
  "tok-0591":
    "native": "I look at this car."
    "confusables":
      "w1":
        "why": "Lukin is to look: the sentence says what I look at, a car."
      "w2":
        "why": "Tomo is a building: it is the head of the compound, and the car is what it names."
  "tok-0592":
    "native": "The phone is in the box."
    "confusables":
      "w1":
        "why": "Ilo is a tool: the compound is a tool for talking, so the head is the tool."
      "w2":
        "why": "Toki is to talk: it is the modifier that says what the tool is for."
  "tok-0593":
    "native": "My phone is broken."
    "confusables":
      "w1":
        "why": "Ilo is a tool: the sentence says my tool for talking is broken."
      "w2":
        "why": "Pakala is broken: it describes the phone, not a talk."
  "tok-0594":
    "native": "A friend sleeps."
    "confusables":
      "w1":
        "why": "Jan is a person: the compound is a good person, a friend."
      "w2":
        "why": "Pona is good: on its own it describes a thing, not a person who sleeps."
  "tok-0595":
    "native": "I want a strange drink."
    "confusables":
      "w1":
        "why": "Telo is water: the compound is a drink of a kind, not water alone."
      "w2":
        "why": "Nasa is strange: it describes the drink."
  "tok-0596":
    "native": "The strong drink is not cold."
    "confusables":
      "w1":
        "why": "Telo is water or drink: the compound is the drink itself."
      "w2":
        "why": "Lete is cold: the sentence negates it, so the drink is not cold."
  "tok-0597":
    "native": "My friend is in the building."
    "confusables":
      "w1":
        "why": "Jan is a person: the friend is the head of the compound, and the sentence places them."
      "w2":
        "why": "Tomo is a building: it is the place, after lon."
