"tags":
- "unreviewed"
"cards":
  "tok-0590":
    "native": "A car is big."
    "confusables":
      "w1":
        "why": "Weka ('gone') is related in meaning to tawa ('to go'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Lili means 'small', the opposite of suli ('big'). Mixing them up would say the reverse of this sentence."
  "tok-0591":
    "native": "I look at this car."
    "confusables":
      "w1":
        "why": "Kute ('to hear') is related in meaning to lukin ('to look'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Supa ('table') is also something in or around the home, but this sentence has tomo ('house') in its place."
  "tok-0592":
    "native": "The phone is in the box."
    "confusables":
      "w1":
        "why": "Tomo ('house') is also something in or around the home, but this sentence has poki ('box') in its place."
      "w2":
        "why": "Ijo ('thing') is spelled much like ilo ('tool'), so it is easy to mix up, but it is a different word."
  "tok-0593":
    "native": "My phone is broken."
    "confusables":
      "w1":
        "why": "Kalama ('to make a sound') is related in meaning to toki ('language'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Sina ('you') is also a pronoun, but this sentence has mi ('I') in its place."
  "tok-0594":
    "native": "A friend sleeps."
    "confusables":
      "w1":
        "why": "Ona ('he, she, it or they') is related in meaning to jan ('person'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Ike means 'bad', the opposite of pona ('good'). Mixing them up would say the reverse of this sentence."
  "tok-0595":
    "native": "I want a strange drink."
    "confusables":
      "w1":
        "why": "Sina ('you') is also a pronoun, but this sentence has mi ('I') in its place."
      "w2":
        "why": "Walo ('white') is spelled much like wile ('to want'), so it is easy to mix up, but it is a different word."
  "tok-0596":
    "native": "The strong drink is not cold."
    "confusables":
      "w1":
        "why": "Len ('clothes') is spelled much like lete ('cold'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Kili ('fruit') is related in meaning to telo ('water'), but it is not the same word and changes what the sentence says."
  "tok-0597":
    "native": "My friend is in the building."
    "confusables":
      "w1":
        "why": "Sina ('you') is also a pronoun, but this sentence has mi ('I') in its place."
      "w2":
        "why": "Tawa ('to go') is also a preposition, but this sentence has lon ('to be at or in a place') in its place."
