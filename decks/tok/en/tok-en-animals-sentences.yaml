"cards":
  "tok-0406":
    "native": "The animal is not small."
    "confusables":
      "w1":
        "why": "Waso ('bird') is also a creature, but this sentence has soweli ('land animal') in its place."
      "w2":
        "why": "Mute means 'many', the opposite of lili ('small'). Mixing them up would say the reverse of this sentence."
  "tok-0407":
    "native": "A big fish is in the big water."
    "confusables":
      "w1":
        "why": "Tawa ('to go') is also a preposition, but this sentence has lon ('to be at or in a place') in its place."
      "w2":
        "why": "Kili ('fruit') is related in meaning to telo ('water'), but it is not the same word and changes what the sentence says."
  "tok-0408":
    "native": "A small bird is up high."
    "confusables":
      "w1":
        "why": "Insa ('inside') is also a word for a position, but this sentence has sewi ('above') in its place."
      "w2":
        "why": "Kala ('fish') is related in meaning to waso ('bird'), but it is not the same word and changes what the sentence says."
  "tok-0409":
    "native": "The bug is broken."
    "confusables":
      "w1":
        "why": "Pana ('to give') is spelled much like pakala ('to break'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Pini ('to end') is spelled much like pipi ('insect'), so it is easy to mix up, but it is a different word."
  "tok-0410":
    "native": "I eat a small fish."
    "confusables":
      "w1":
        "why": "Sina ('you') is also a pronoun, but this sentence has mi ('I') in its place."
      "w2":
        "why": "Lape ('to sleep') is also an everyday action, but this sentence has moku ('to eat') in its place."
  "tok-0411":
    "native": "The reptile wants fruit."
    "confusables":
      "w1":
        "why": "Walo ('white') is spelled much like wile ('to want'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Moku ('to eat') is related in meaning to kili ('fruit'), but it is not the same word and changes what the sentence says."
  "tok-0412":
    "native": "This animal is not strong."
    "confusables":
      "w1":
        "why": "Nimi ('word') is spelled much like ni ('this'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Waso ('bird') is spelled much like wawa ('strong'), so it is easy to mix up, but it is a different word."
  "tok-0413":
    "native": "A person hears the sound."
    "confusables":
      "w1":
        "why": "Mije ('man') is related in meaning to jan ('person'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Moku ('to eat') is also an everyday action, but this sentence has kute ('to hear') in its place."
