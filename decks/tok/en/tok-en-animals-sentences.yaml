"cards":
  "tok-0406":
    "native": "The animal is not small."
    "confusables":
      "w1":
        "why": "Soweli is the animal: the sentence says the animal is not small, which is a claim about its size."
      "w2":
        "why": "Lili is small: here it is negated, so the sentence says the animal is not small."
  "tok-0407":
    "native": "A big fish is in the big water."
    "confusables":
      "w1":
        "why": "Kala is a fish: the sentence says where the big fish is, in the big water."
      "w2":
        "why": "Telo is water: it is the place, not the thing that is big."
  "tok-0408":
    "native": "A small bird is up high."
    "confusables":
      "w1":
        "why": "Waso is a bird: the sentence says where the small bird is, up high."
      "w2":
        "why": "Sewi is above: it is the place, so the sentence says the bird is above."
  "tok-0409":
    "native": "The bug is broken."
    "confusables":
      "w1":
        "why": "Pipi is a bug: the sentence says the bug is broken, not that it is a bad bug."
      "w2":
        "why": "Ike is bad: the sentence would say the bug is bad, not broken."
  "tok-0410":
    "native": "I eat a small fish."
    "confusables":
      "w1":
        "why": "Moku is to eat: the sentence says what I eat, a small fish."
      "w2":
        "why": "Kala is fish: here it is the thing eaten, after e."
  "tok-0411":
    "native": "The reptile wants fruit."
    "confusables":
      "w1":
        "why": "Wile is to want: the sentence says the reptile wants fruit, and the fruit is its object."
      "w2":
        "why": "Kili is fruit: it is the thing wanted, after e."
  "tok-0412":
    "native": "This animal is not strong."
    "confusables":
      "w1":
        "why": "Soweli is the animal: this sentence says it is not strong."
      "w2":
        "why": "Wawa is strong: here it is negated."
  "tok-0413":
    "native": "A person hears the sound."
    "confusables":
      "w1":
        "why": "Kute is to hear: the sentence says a person hears the sound of an animal."
      "w2":
        "why": "Mu is an animal's sound: it is what is heard, after e."
