"tags":
- "unreviewed"
"cards":
  "tok-0666":
    "native": "They say: I am well."
    "confusables":
      "w1":
        "why": "Ike means 'bad', the opposite of pona ('good'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Sina ('you') is also a pronoun, but this sentence has ona ('he, she, it or they') in its place."
  "tok-0667":
    "native": "I say: you sleep."
    "confusables":
      "w1":
        "why": "Nimi ('word') is spelled much like ni ('this'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Sin ('new') is spelled much like sina ('you'), so it is easy to mix up, but it is a different word."
  "tok-0668":
    "native": "This person says: the tool is broken."
    "confusables":
      "w1":
        "why": "Nimi ('word') is related in meaning to toki ('language'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Ijo ('thing') is spelled much like ilo ('tool'), so it is easy to mix up, but it is a different word."
  "tok-0669":
    "native": "They say: the fruit is sweet."
    "confusables":
      "w1":
        "why": "Moku ('to eat') is related in meaning to kili ('fruit'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Lili ('small') is also a describing word, but this sentence has suwi ('sweet') in its place."
  "tok-0670":
    "native": "I hear this: they come."
    "confusables":
      "w1":
        "why": "Sina ('you') is also a pronoun, but this sentence has mi ('I') in its place."
      "w2":
        "why": "Moku ('to eat') is also an everyday action, but this sentence has kute ('to hear') in its place."
  "tok-0671":
    "native": "That is bad, they say."
    "confusables":
      "w1":
        "why": "Mi ('I') is also a pronoun, but this sentence has ona ('he, she, it or they') in its place."
      "w2":
        "why": "Nimi ('word') is related in meaning to toki ('language'), but it is not the same word and changes what the sentence says."
  "tok-0672":
    "native": "You say: I want to eat."
    "confusables":
      "w1":
        "why": "Nimi ('word') is spelled much like ni ('this'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Ona ('he, she, it or they') is also a pronoun, but this sentence has mi ('I') in its place."
  "tok-0673":
    "native": "They say: the building is big."
    "confusables":
      "w1":
        "why": "Supa ('table') is also something in or around the home, but this sentence has tomo ('house') in its place."
      "w2":
        "why": "Wawa ('strong') is related in meaning to suli ('big'), but it is not the same word and changes what the sentence says."
