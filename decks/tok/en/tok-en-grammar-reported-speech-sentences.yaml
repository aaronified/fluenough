"core": "tok-grammar-reported-speech-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Reported speech in sentences"
"description": "Sentences that report what someone said, with toki e ni: and the quoted words after the colon, and ni pointing back. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0666":
    "native": "They say: I am well."
    "confusables":
      "w1":
        "why": "Toki is to talk: the sentence reports that they talk, and the quote follows."
      "w2":
        "why": "Pona is good: it is inside the quote, so it is what they said, not what the speaker says."
  "tok-0667":
    "native": "I say: you sleep."
    "confusables":
      "w1":
        "why": "Toki is to say: the sentence reports my words, and e ni marks the quote."
      "w2":
        "why": "Lape is to sleep: it is inside the quote, the words I say."
  "tok-0668":
    "native": "This person says: the tool is broken."
    "confusables":
      "w1":
        "why": "Jan is a person: the one who says the words in the quote."
      "w2":
        "why": "Pakala is broken: it is the content of the quote."
  "tok-0669":
    "native": "They say: the fruit is sweet."
    "confusables":
      "w1":
        "why": "Kili is fruit: it is in the quote, the thing they describe."
      "w2":
        "why": "Suwi is sweet: it is what they said about the fruit."
  "tok-0670":
    "native": "I hear this: they come."
    "confusables":
      "w1":
        "why": "Kute is to hear: the sentence reports what I heard, not what I say."
      "w2":
        "why": "Kama is to come: it is inside the quote, the thing heard."
  "tok-0671":
    "native": "That is bad, they say."
    "confusables":
      "w1":
        "why": "Ni points back: here it points at what came before, the thing that is bad."
      "w2":
        "why": "Toki is to say: it reports that they said it."
  "tok-0672":
    "native": "You say: I want to eat."
    "confusables":
      "w1":
        "why": "Toki is to say: the sentence reports your words."
      "w2":
        "why": "Wile is to want: it is inside the quote, what the speaker wants."
  "tok-0673":
    "native": "They say: the building is big."
    "confusables":
      "w1":
        "why": "Tomo is a building: it is the subject of the quote."
      "w2":
        "why": "Suli is big: it is what is said about the building."
