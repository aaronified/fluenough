schema: 1
id: "tok-en-time"
kind: "layer"
core: "tok-time"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Time"
description: "Five words for time: tenpo (time), suno (sun; day), mun (moon; star), open (to begin, to open) and pini (to end; finished). Not yet checked by a Toki Pona speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "tok-0264":
    native: "time; period; moment"
    notes:
      "time": "Tenpo is time, a period or a moment. Tenpo ni is now, this time."
      "now": "Lon tenpo ni is at this time: mi lon tenpo ni is I am here now."
    examples:
      "tenpo ni li pona.": "This time is good."
      "mi lon tenpo ni.": "I am here now."
  "tok-0265":
    native: "sun; day"
    notes:
      "sun": "Suno is the sun, and light from it."
      "day": "Suno is also a day: suno ni is today. Tenpo suno is daytime."
    examples:
      "suno li suli.": "The sun is big."
      "mi lukin e suno.": "I see the sun."
  "tok-0266":
    native: "moon; star"
    notes:
      "moon": "Mun is the moon. It is also a star, and the word for something in the night sky."
      "star": "Tenpo mun is night, when the moon is out."
    examples:
      "mun li lon.": "The moon is there."
      "mi lukin e mun.": "I see the moon."
  "tok-0267":
    native: "to begin; to open"
    notes:
      "begin": "Open is to begin or to start: tenpo ni li open is This time begins."
      "object": "Open e lupa is to open the door: with a thing after it, e comes before that thing, as with lukin."
    examples:
      "tenpo ni li open.": "This time begins."
      "mi open e lupa.": "I open the door."
  "tok-0268":
    native: "to end; finished; past"
    notes:
      "end": "Pini is to end, or to be finished: moku li pini is The food is finished."
      "past": "Tenpo li pini is The time has ended. Pini is also the past, as in tenpo pini, which the next unit uses."
    examples:
      "tenpo li pini.": "The time has ended."
      "moku li pini.": "The food is finished."
