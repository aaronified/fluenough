schema: 1
id: "tok-en-numbers-1-20"
kind: "layer"
core: "tok-numbers-1-20"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Numbers 1 to 20"
description: "The first number words: wan (one), tu (two), luka (five), ale (all; a hundred) and nanpa (the number, and the order: first, second). Mute (many) is taught with the describing words. Not yet checked by a Toki Pona speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "tok-0211":
    native: "one"
    notes:
      "one": "Wan is one. Jan wan is one person, and mi jo e wan is I have one."
      "count": "Wan is counted first: the count goes wan, tu, luka, and mute for many."
    examples:
      "mi jo e wan.": "I have one."
      "jan wan li kama.": "One person comes."
  "tok-0212":
    native: "two"
    notes:
      "two": "Tu is two: mi wile e tu is I want two."
      "count": "Tu comes after wan in the count, and before luka."
    examples:
      "mi wile e tu.": "I want two."
      "mi lukin e tu.": "I see two."
  "tok-0213":
    native: "five; hand"
    notes:
      "five": "Luka is five. Its other sense is a hand, so the word is one of the few that carries both."
      "hand": "Luka is a hand, with its five fingers in mind: the number and the body part are one word."
    examples:
      "ona li jo e luka.": "They have five."
      "mi lukin e luka.": "I see five."
  "tok-0214":
    native: "all; every; a hundred"
    notes:
      "all": "Ale is all or every: ale li pona is All is good."
      "hundred": "Ale is also a hundred in the full number system, taught later in numbers-big: here it means all."
    examples:
      "ale li pona.": "All is good."
      "mi lukin e ale.": "I see everything."
  "tok-0215":
    native: "number; order"
    notes:
      "number": "Nanpa is a number. Nanpa ni li suli is This number is big."
      "order": "With a number after it, nanpa gives the order: nanpa wan is the first, nanpa tu is the second."
    examples:
      "nanpa ni li suli.": "This number is big."
      "mi sona e nanpa.": "I know the number."
