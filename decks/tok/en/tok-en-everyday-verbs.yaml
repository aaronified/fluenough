schema: 1
id: "tok-en-everyday-verbs"
kind: "layer"
core: "tok-everyday-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Everyday verbs"
description: "Nine verbs for the day: eat, sleep, make, look, hear, have, want, come and go. Each word is a verb first, and some are a noun too. Not yet checked by a Toki Pona speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "tok-0080":
    native: "to eat"
    notes:
      "food": "Also a noun: food, or something to eat. Moku pona is good food."
      "object": "The thing eaten comes after e: mi moku e pan is I eat bread."
    senses:
      "food": { native: "food" }
    examples:
      "mi moku.": "I eat."
      "ona li moku e pan.": "They eat bread."
      "moku li pona.": "The food is good."
  "tok-0081":
    native: "to sleep; to rest"
    notes:
      "rest": "Also to rest, when someone stops for a while."
      "ala": "Ala after it denies it: ona li lape ala is They are not sleeping."
    examples:
      "mi lape.": "I sleep."
      "ona li lape ala.": "They are not sleeping."
      "jan ni li lape.": "This person is sleeping."
  "tok-0082":
    native: "to make; to do; to work"
    notes:
      "work": "Also a noun: work or a job. Jan pali is a worker."
      "object": "The thing made or done comes after e: mi pali e moku is I make food, or I cook."
    senses:
      "work": { native: "work; a job" }
    examples:
      "mi pali e moku.": "I cook."
      "ona li pali.": "They work."
      "jan pali li toki.": "The worker is talking."
  "tok-0083":
    native: "to look; to see"
    notes:
      "see": "Looking and seeing are both lukin: the context shows which."
      "at": "The thing looked at comes after e: mi lukin e ona is I look at them."
    examples:
      "mi lukin.": "I see."
      "mi lukin e ona.": "I look at them."
      "sina lukin e ijo ni.": "You are looking at this thing."
  "tok-0084":
    native: "to hear; to listen"
    notes:
      "ear": "Also a noun: an ear."
      "object": "The thing heard comes after e: mi kute e toki is I hear speech, or I listen to it."
    senses:
      "ear": { native: "ear" }
    examples:
      "mi kute e toki.": "I hear the language."
      "sina kute ala.": "You did not hear."
      "ona li kute e nimi.": "They hear the words."
  "tok-0085":
    native: "to have; to hold"
    notes:
      "hold": "Also to hold something in the hand, or to contain it."
      "object": "The thing had comes after e: mi jo e pan is I have bread."
    examples:
      "mi jo e pan.": "I have bread."
      "ona li jo e ijo.": "They have a thing."
      "mi jo ala.": "I have none."
  "tok-0086":
    native: "to want; to need"
    notes:
      "need": "Also to need: wile is both want and need, and the context shows which."
      "verb": "A verb comes straight after it, with no e: mi wile moku is I want to eat."
    examples:
      "mi wile e moku.": "I want food."
      "ona li wile lape.": "They want to sleep."
      "sina wile e ni?": "Do you want this?"
  "tok-0087":
    native: "to come; to arrive"
    notes:
      "arrive": "Also to arrive, and to happen: ijo li kama is something happens."
      "become": "With a word after it, kama means to become: kama suli is to grow big. That use is taught later."
    examples:
      "mi kama.": "I arrive."
      "ona li kama.": "They are coming."
      "jan pona li kama tawa mi.": "A good person comes to me."
  "tok-0088":
    native: "to go; to leave"
    notes:
      "leave": "Also to leave: tawa pona! is goodbye."
      "move": "Also to move, from one place to another."
    examples:
      "mi tawa.": "I am leaving."
      "ona li tawa.": "They go."
      "sina tawa anu ala?": "Are you leaving or not?"
