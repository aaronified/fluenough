"name": "En and taso: joining words"
"description": "Two joining words: en, which joins subjects, and taso, which means only or but. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0540":
    "native": "and; with"
    "notes":
      "n1": "En joins two subjects into one group: mi en sina is you and I. The group takes li once."
      "n2": "En joins subjects, not whole sentences: for two sentences, use a second li instead."
    "examples":
      "mi en sina li pali.": "You and I work."
      "jan en ona li lon.": "A person and they are here."
  "tok-0541":
    "native": "only; but; just"
    "notes":
      "n1": "Taso means only or just, as in mi wile moku taso, I only want to eat."
      "n2": "Taso comes after the word it limits, and it can also turn a sentence into a but: telo li lete, taso li lon poki."
    "examples":
      "mi wile moku taso.": "I only want to eat."
      "kili li suwi, taso li lete.": "The fruit is sweet, but it is cold."
