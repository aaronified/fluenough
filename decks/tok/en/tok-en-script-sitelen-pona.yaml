"name": "Sitelen pona: the glyphs"
"description": "The glyph of each Toki Pona word the course teaches, in the order you meet them: see the glyph, say the word. Sitelen pona writes a word as one glyph; a name goes in a cartouche. Not yet checked by a Toki Pona speaker: please report any mistake."
