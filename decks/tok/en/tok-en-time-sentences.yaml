"kind": "layer"
"core": "tok-time-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Time in sentences"
"description": "Sentences about the day, the sun and moon, and when things begin, end or are finished. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0269":
    "native": "The day begins."
    "confusables":
      "w1":
        "why": "Pini (to end) would say the day ends, not begins."
      "w2":
        "why": "Lukin (to see) would say the day is seen, not that it begins."
  "tok-0270":
    "native": "The tool is finished."
    "confusables":
      "w1":
        "why": "Open (to begin) would say the tool begins, not that it is finished."
      "w2":
        "why": "Pali (to make) would say the tool is made, not finished."
  "tok-0271":
    "native": "The moon is here now."
    "confusables":
      "w1":
        "why": "Suno (sun) would say the sun is here now, not the moon."
      "w2":
        "why": "Tawa (to go) would say the moon goes now, not that it is here."
  "tok-0272":
    "native": "They open the door."
    "confusables":
      "w1":
        "why": "Pini (to end) would say they end the door, not open it."
      "w2":
        "why": "Pali (to make) would say they make the door, not open it."
  "tok-0273":
    "native": "This time is not over."
    "confusables":
      "w1":
        "why": "Open (to begin) would say this time begins, not that it is not over."
      "w2":
        "why": "Kama (to come) would say this time comes, not that it is not over."
  "tok-0274":
    "native": "The big sun is there."
    "confusables":
      "w1":
        "why": "Mun (moon) would say the big moon is there, not the sun."
      "w2":
        "why": "Lili (small) would say the small sun is there, not the big one."
  "tok-0275":
    "native": "They see the moon."
    "confusables":
      "w1":
        "why": "Suno (sun) would say they see the sun, not the moon."
      "w2":
        "why": "Kute (to hear) would say they hear the moon, not that they see it."
  "tok-0276":
    "native": "Is the food finished, or not?"
    "confusables":
      "w1":
        "why": "Open (to begin) would ask whether the food begins, not whether it is finished."
      "w2":
        "why": "Pali (to make) would ask whether the food is made, not finished."
