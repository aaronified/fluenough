schema: 1
id: "tok-en-grammar-sentence-sentences"
kind: "layer"
core: "tok-grammar-sentence-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Word order: li, e and the same word in two places"
description: "Sentences in the basic order: subject, li, predicate, e, object. Some words are a verb in one and a noun in another, moku for one, depending on where they stand. Not yet checked by a Toki Pona speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "tok-0103":
    native: "They eat."
    confusables:
      "w1": { why: "Mi (I) would make it about the speaker, not the person spoken of." }
      "w2": { why: "Ala (not) would turn it into they do not eat." }
  "tok-0104":
    native: "This thing is food."
    confusables:
      "w1": { why: "Pona (good) would say the thing is good, not that it is food." }
      "w2": { why: "Pali (to make) would say the thing makes something, not that it is food." }
  "tok-0105":
    native: "I see the food."
    confusables:
      "w1": { why: "Sina (you) would say you see the food, not I." }
      "w2": { why: "Wile (to want) would say I want the food, not that I see it." }
  "tok-0106":
    native: "They want bread."
    confusables:
      "w1": { why: "Pana (to give) would say they give bread, not that they want it." }
      "w2": { why: "Lape (to sleep) would say they sleep, not that they want bread." }
  "tok-0107":
    native: "You are good."
    confusables:
      "w1": { why: "Mi (I) would say I am good, not you." }
      "w2": { why: "Ala (not) would say you are not good." }
  "tok-0108":
    native: "I eat good food."
    confusables:
      "w1": { why: "Sina (you) would make it about you, not the speaker." }
      "w2": { why: "Ijo (thing) would say I eat a good thing, not good food." }
  "tok-0109":
    native: "The person sleeps."
    confusables:
      "w1": { why: "Mi (I) would say I sleep, not the person." }
      "w2": { why: "Pona (good) would describe the person; the sentence says what they do." }
  "tok-0110":
    native: "I have food."
    confusables:
      "w1": { why: "Pana (to give) would say I give food, not that I have it." }
      "w2": { why: "Ala (not) would say I do not have food." }
  "tok-0111":
    native: "They make food."
    confusables:
      "w1": { why: "Lukin (to look) would say they look at food, not that they make it." }
      "w2": { why: "Lape (to sleep) would say they sleep, not that they make food." }
  "tok-0112":
    native: "You want bread."
    confusables:
      "w1": { why: "Mi (I) would say I want bread, not you." }
      "w2": { why: "Ala (not) would say you do not want bread." }
