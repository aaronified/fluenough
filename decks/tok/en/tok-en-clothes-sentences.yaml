"cards":
  "tok-0428":
    "native": "This cloth is not red."
    "confusables":
      "w1":
        "why": "Lete ('cold') is spelled much like len ('clothes'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Nimi ('word') is spelled much like ni ('this'), so it is easy to mix up, but it is a different word."
  "tok-0429":
    "native": "A white animal is there."
    "confusables":
      "w1":
        "why": "Pimeja means 'black', the opposite of walo ('white'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Weka means 'gone', the opposite of lon ('to be at or in a place'). Mixing them up would say the reverse of this sentence."
  "tok-0430":
    "native": "The yellow bird is here."
    "confusables":
      "w1":
        "why": "Ala means 'no, not', the opposite of lon ('to be at or in a place'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Wawa ('strong') is spelled much like waso ('bird'), so it is easy to mix up, but it is a different word."
  "tok-0431":
    "native": "I want white clothes."
    "confusables":
      "w1":
        "why": "Sina ('you') is also a pronoun, but this sentence has mi ('I') in its place."
      "w2":
        "why": "Ken ('can') is related in meaning to wile ('to want'), but it is not the same word and changes what the sentence says."
  "tok-0432":
    "native": "The black fruit is sweet."
    "confusables":
      "w1":
        "why": "Jaki means 'dirty', the opposite of suwi ('sweet'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Kiwen ('stone') is spelled much like kili ('fruit'), so it is easy to mix up, but it is a different word."
  "tok-0433":
    "native": "White paint is good."
    "confusables":
      "w1":
        "why": "Pimeja means 'black', the opposite of walo ('white'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Pini ('to end') is spelled much like pona ('good'), so it is easy to mix up, but it is a different word."
  "tok-0434":
    "native": "Look at the white cloth."
    "confusables":
      "w1":
        "why": "Lete ('cold') is spelled much like len ('clothes'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Pimeja means 'black', the opposite of walo ('white'). Mixing them up would say the reverse of this sentence."
  "tok-0435":
    "native": "A person in red eats fruit."
    "confusables":
      "w1":
        "why": "Jelo ('yellow') is related in meaning to loje ('red'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Moli ('to die') is spelled much like moku ('to eat'), so it is easy to mix up, but it is a different word."
