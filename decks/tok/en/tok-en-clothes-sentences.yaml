"cards":
  "tok-0428":
    "native": "This cloth is not red."
    "confusables":
      "w1":
        "why": "Loje is red: the sentence says the cloth is not red, so the colour is the point."
      "w2":
        "why": "Walo is white: the sentence would say the cloth is not white, which is a different claim."
  "tok-0429":
    "native": "A white animal is there."
    "confusables":
      "w1":
        "why": "Soweli is the animal: the sentence says where the white one is, and the colour describes it."
      "w2":
        "why": "Walo is white: the sentence says the animal is white."
  "tok-0430":
    "native": "The yellow bird is here."
    "confusables":
      "w1":
        "why": "Waso is a bird: the sentence says the yellow bird is here, and jelo describes it."
      "w2":
        "why": "Jelo is yellow: it colours the bird, which is the thing that is here."
  "tok-0431":
    "native": "I want white clothes."
    "confusables":
      "w1":
        "why": "Wile is to want: the sentence says what I want, white clothes."
      "w2":
        "why": "Len is clothes: it is the thing wanted, and walo says what colour."
  "tok-0432":
    "native": "The black fruit is sweet."
    "confusables":
      "w1":
        "why": "Kili is fruit: the sentence says the fruit is black and sweet."
      "w2":
        "why": "Pimeja is black: here it describes the fruit."
  "tok-0433":
    "native": "White paint is good."
    "confusables":
      "w1":
        "why": "Kule is paint or colour: the sentence says the paint is good."
      "w2":
        "why": "Walo is white: it describes the paint."
  "tok-0434":
    "native": "Look at the white cloth."
    "confusables":
      "w1":
        "why": "Lukin is to look: the command says look at the cloth."
      "w2":
        "why": "Len is clothes: it is the thing to look at."
  "tok-0435":
    "native": "A person in red eats fruit."
    "confusables":
      "w1":
        "why": "Jan is a person: the sentence says the person is red, and eats fruit."
      "w2":
        "why": "Loje is red: it describes the person's clothes or colour."
