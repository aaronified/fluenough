"name": "Health and medicine"
"description": "Two words for health: misikeke (medicine, to heal) and oko (the eye). Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0574":
    "native": "medicine; medical; to heal"
    "notes":
      "n1": "Misikeke is medicine, or a cure: misikeke ni is this medicine."
      "n2": "Jan misikeke is a doctor, a person of medicine, as in the reading passage."
    "examples":
      "misikeke ni li pona.": "This medicine is good."
      "mi moku e misikeke.": "I take medicine."
  "tok-0575":
    "native": "eye"
    "notes":
      "n1": "Oko is an eye: oko mi is my eye."
      "n2": "Oko is how you see with, as lukin is the act of seeing: mi lukin kepeken oko is I look with my eyes."
    "examples":
      "oko ona li pakala ala.": "Their eye is not hurt."
      "mi lukin kepeken oko.": "I look with my eyes."
