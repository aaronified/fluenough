  "iso639_3": "eng"
  "name": "English"
"name": "Market"
"description": "Two words for the market: esun (the market, to trade) and mani (money, a price). Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0476":
    "native": "market; shop; trade"
    "notes":
      "n1": "Esun is a market, a shop or a place where things are bought and sold: esun suli is a big market."
      "n2": "Esun is a place, so tawa esun is going to the market."
    "examples":
      "esun ni li pona.": "This market is good."
      "mi tawa esun.": "I go to the market."
  "tok-0477":
    "native": "money; coin; price"
    "notes":
      "n1": "Mani is money, a coin or a price: mani mi is my money."
      "n2": "Mani counts what you pay with, so mani luka is five coins or a price of five."
    "examples":
      "mani mi li lili.": "My money is little."
      "mi wile e mani.": "I want money."
