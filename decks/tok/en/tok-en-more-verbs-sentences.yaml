"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "More verbs in sentences"
"description": "Sentences with moli, utala, kalama and alasa. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0560":
    "native": "The fruit has not died."
    "confusables":
      "w1":
        "why": "Moli is to die: the sentence negates it, so the fruit has not gone bad."
      "w2":
        "why": "Kili is fruit: it is the subject, the one that does not die."
  "tok-0561":
    "native": "They do not fight."
    "confusables":
      "w1":
        "why": "Utala is to fight: the sentence says they do not fight."
      "w2":
        "why": "Ona is they: it is the subject who does not fight."
  "tok-0562":
    "native": "The bird makes a loud sound."
    "confusables":
      "w1":
        "why": "Kalama is to make a sound: the sentence says the bird's sound is loud."
      "w2":
        "why": "Suli is big: it describes the sound, not the bird."
  "tok-0563":
    "native": "I look for the dirty fruit."
    "confusables":
      "w1":
        "why": "Alasa is to search: the sentence says I look for the fruit."
      "w2":
        "why": "Jaki is dirty: it describes the fruit I search for."
  "tok-0564":
    "native": "A person reads this paper aloud."
    "confusables":
      "w1":
        "why": "Kalama is to read aloud with e: the paper is read aloud."
      "w2":
        "why": "Lipu is paper: it is the thing read, after e."
  "tok-0565":
    "native": "The animal looks for fruit."
    "confusables":
      "w1":
        "why": "Alasa is to search: the sentence says the animal looks for fruit."
      "w2":
        "why": "Kili is fruit: it is the thing searched for, after e."
  "tok-0566":
    "native": "They kill the reptile."
    "confusables":
      "w1":
        "why": "Moli is to kill with e: the reptile is the one killed."
      "w2":
        "why": "Akesi is a reptile: it is the object of the killing, after e."
  "tok-0567":
    "native": "Fighting is bad."
    "confusables":
      "w1":
        "why": "Utala is to fight: here it is a thing, fighting, and the sentence says it is bad."
      "w2":
        "why": "Ike is bad: it is what the sentence says about fighting."
