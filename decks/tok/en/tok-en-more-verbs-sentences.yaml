"cards":
  "tok-0560":
    "native": "The fruit has not died."
    "confusables":
      "w1":
        "why": "Moku ('to eat') is related in meaning to kili ('fruit'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Alasa ('to hunt') is also an action, but this sentence has moli ('to die') in its place."
  "tok-0561":
    "native": "They do not fight."
    "confusables":
      "w1":
        "why": "Ni ('this') is spelled much like ona ('he, she, it or they'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Olin means 'to love', the opposite of utala ('to fight'). Mixing them up would say the reverse of this sentence."
  "tok-0562":
    "native": "The bird makes a loud sound."
    "confusables":
      "w1":
        "why": "Toki ('language') is related in meaning to kalama ('to make a sound'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Wawa ('strong') is related in meaning to suli ('big'), but it is not the same word and changes what the sentence says."
  "tok-0563":
    "native": "I look for the dirty fruit."
    "confusables":
      "w1":
        "why": "Moku ('to eat') is related in meaning to kili ('fruit'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Suli ('big') is also a describing word, but this sentence has jaki ('dirty') in its place."
  "tok-0564":
    "native": "A person reads this paper aloud."
    "confusables":
      "w1":
        "why": "Kala ('fish') is spelled much like kalama ('to make a sound'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Lili ('small') is spelled much like lipu ('paper'), so it is easy to mix up, but it is a different word."
  "tok-0565":
    "native": "The animal looks for fruit."
    "confusables":
      "w1":
        "why": "Ala ('no, not') is spelled much like alasa ('to hunt'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Moku ('to eat') is related in meaning to kili ('fruit'), but it is not the same word and changes what the sentence says."
  "tok-0566":
    "native": "They kill the reptile."
    "confusables":
      "w1":
        "why": "Alasa ('to hunt') is also an action, but this sentence has moli ('to die') in its place."
      "w2":
        "why": "Pipi ('insect') is related in meaning to akesi ('reptile'), but it is not the same word and changes what the sentence says."
  "tok-0567":
    "native": "Fighting is bad."
    "confusables":
      "w1":
        "why": "Pona means 'good', the opposite of ike ('bad'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Pakala ('to break') is related in meaning to utala ('to fight'), but it is not the same word and changes what the sentence says."
