"tags":
- "unreviewed"
"cards":
  "tok-0197":
    "native": "Water is not sweet."
    "confusables":
      "w1":
        "why": "Lete (cold) would say the water is cold, not that it is not sweet."
      "w2":
        "why": "Pona (good) would say the water is good, not that it is not sweet."
  "tok-0198":
    "native": "I eat sweet fruit."
    "confusables":
      "w1":
        "why": "Seli (fire) would say I eat fire, not sweet fruit."
      "w2":
        "why": "Telo (water) would say I drink sweet water, not that I eat sweet fruit."
  "tok-0199":
    "native": "The fire is not big."
    "confusables":
      "w1":
        "why": "Lete (cold) would say the fire is cold, not that it is not big."
      "w2":
        "why": "Suwi (sweet) would say the fire is sweet, not that it is not big."
  "tok-0200":
    "native": "This food is not cold."
    "confusables":
      "w1":
        "why": "Suwi (sweet) would say this food is sweet, not that it is not cold."
      "w2":
        "why": "Pona (good) would say this food is good, not that it is not cold."
  "tok-0201":
    "native": "The woman drinks water."
    "confusables":
      "w1":
        "why": "Kili (fruit) would say she eats fruit, not that she drinks water."
      "w2":
        "why": "Seli (fire) would say she eats fire, not that she drinks water."
  "tok-0202":
    "native": "This fruit is cold."
    "confusables":
      "w1":
        "why": "Suwi (sweet) would say this fruit is sweet, not cold."
      "w2":
        "why": "Seli (fire) would say this fruit is fire, not that it is cold."
  "tok-0203":
    "native": "I see the fruit."
    "confusables":
      "w1":
        "why": "Moku (to eat) would say I eat the fruit, not that I see it."
      "w2":
        "why": "Kute (to hear) would say I hear the fruit, not that I see it."
  "tok-0204":
    "native": "Eat the fruit!"
    "confusables":
      "w1":
        "why": "Pana (to give) would tell the listener to give the fruit, not to eat it."
      "w2":
        "why": "Jo (to have) would tell the listener to have the fruit, not to eat it."
