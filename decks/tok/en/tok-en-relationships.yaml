core: "tok-relationships"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Relationships"
description: "Two words about people in a relationship: tonsi (a non-binary person) and unpa (to have sex). Unpa is crude and adult-flagged: the app shows it only when Adult content is on. Not yet checked by a Toki Pona speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "tok-0758":
    native: "non-binary person; gender-neutral"
    notes:
      "person": "Tonsi names a person who is neither a man (mije) nor a woman (meli), and it is gender-neutral, as any word is in Toki Pona. Jan tonsi is such a person: jan is the person, and tonsi says which kind."
      "jan-tonsi": "Toki Pona has no grammatical gender, so ona is they, as well as he and she, and a person's gender is said only with a word such as tonsi, mije or meli."
    examples:
      "jan tonsi li pona.": "The non-binary person is good."
      "ona li jan tonsi.": "They are a non-binary person."
  "tok-0759":
    native: "to have sex; sexual intercourse (crude)"
    notes:
      "adult": "Unpa is a crude word for sex. It is rated offensive, so the app hides it unless Adult content is on, as it would hide any rude word. The examples say who does it, not how. Olin is love; unpa names the act, not the feeling."
      "act": "Unpa stands after its subject with no e, as in jan olin li unpa (lovers have sex): it names what the subject does, not a thing it does it to."
    examples:
      "jan olin li unpa.": "Lovers have sex."
      "meli en mije li unpa.": "A woman and a man have sex."
