  "tok-0734":
    "native": "One hundred and two tools are here."
    "confusables":
      "w1":
        "why": "Ala ('no, not') is spelled much like ale ('all'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Mute ('many') is also a number word, but this sentence has tu ('two') in its place."
