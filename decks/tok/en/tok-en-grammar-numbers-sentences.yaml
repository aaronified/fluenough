"kind": "layer"
"core": "tok-grammar-numbers-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "The full number system in sentences"
"description": "Sentences with numbers in the full system: mute for twenty, ale for a hundred, each counted in a row with its number before it. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0728":
    "native": "Forty things are here."
    "confusables":
      "w1":
        "why": "Mute is twenty: the sentence counts things by two twenties, forty, and the first mute is the one counted."
      "w2":
        "why": "Tu is two: here it multiplies mute, so it is not the whole number."
  "tok-0729":
    "native": "All things are big."
    "confusables":
      "w1":
        "why": "Ale can mean all or a hundred: here it is all the things, not a count."
      "w2":
        "why": "Ijo is a thing: the sentence says what is here."
  "tok-0730":
    "native": "I have forty things."
    "confusables":
      "w1":
        "why": "Jo is to have: the sentence says what I have, forty things."
      "w2":
        "why": "Mute is twenty: it counts with tu as two twenties."
  "tok-0731":
    "native": "Two hundred and forty things are in the box."
    "confusables":
      "w1":
        "why": "Ale is a hundred: here it is counted, two hundreds."
      "w2":
        "why": "Mute is twenty: the second part, two twenties, is added to the first."
  "tok-0732":
    "native": "The number forty is big."
    "confusables":
      "w1":
        "why": "Nanpa is a number: it is the thing that is big."
      "w2":
        "why": "Mute is twenty: it is part of the number forty, not the whole."
  "tok-0733":
    "native": "Two things are good."
    "confusables":
      "w1":
        "why": "Tu is two: it counts the things, in the simple system."
      "w2":
        "why": "Ijo is a thing: it is the thing counted."
  "tok-0734":
    "native": "Two hundred tools are here."
    "confusables":
      "w1":
        "why": "Ale is a hundred: two of them counted."
      "w2":
        "why": "Ilo is a tool: the thing counted."
  "tok-0735":
    "native": "I eat forty fruits."
    "confusables":
      "w1":
        "why": "Moku is to eat: it is what I do with the fruit."
      "w2":
        "why": "Mute is twenty: it is part of the count of forty."
