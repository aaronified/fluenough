"cards":
  "tok-0728":
    "native": "Twenty-two things are here."
    "confusables":
      "w1":
        "why": "Wan means 'one', the opposite of mute ('many'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Luka ('five, or hand') is related in meaning to tu ('two'), but it is not the same word and changes what the sentence says."
  "tok-0729":
    "native": "All things are big."
    "confusables":
      "w1":
        "why": "Wan ('one') is also a number word, but this sentence has ale ('all') in its place."
      "w2":
        "why": "Kiwen ('stone') is also a kind of object, but this sentence has ijo ('thing') in its place."
