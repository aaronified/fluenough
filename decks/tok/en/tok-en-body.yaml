"schema": 1
"id": "tok-en-body"
"kind": "layer"
"core": "tok-body"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "The body"
"description": "Six words for the body: sijelo, lawa, noka, uta, selo and nena. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0316":
    "native": "body"
    "notes":
      "n1": "Sijelo is the whole body of a person or an animal: sijelo mi is my body."
      "n2": "It is a noun, so a describing word comes after it: sijelo pona is a healthy body."
    "examples":
      "sijelo mi li wawa.": "My body is strong."
      "sijelo ona li pakala.": "Their body is hurt."
  "tok-0317":
    "native": "head; mind"
    "notes":
      "n1": "Lawa is the head, and the mind that sits in it: lawa mi is my head."
      "n2": "Lawa can also mean to lead, as the head of a group. That sense is not taught in this unit."
    "examples":
      "lawa mi li pakala.": "My head hurts."
      "mi lukin e lawa sina.": "I look at your head."
  "tok-0318":
    "native": "foot; leg"
    "notes":
      "n1": "Noka is the foot, and the leg below the knee: noka mi is my foot."
      "n2": "Noka suli is a big foot. Suli comes after the word it describes, as always."
    "examples":
      "noka mi li pakala.": "My foot hurts."
      "mi lukin e noka mi.": "I look at my foot."
  "tok-0319":
    "native": "mouth; face"
    "notes":
      "n1": "Uta is the mouth, and the front of the face around it: uta ona is their mouth."
      "n2": "Uta is a noun here. Moku, to eat, and toki, to talk, are verbs that a mouth is used for, not words for the mouth itself."
    "examples":
      "uta ona li suli.": "Their mouth is big."
      "ona li lukin e uta sina.": "They look at your mouth."
  "tok-0320":
    "native": "skin; outside"
    "notes":
      "n1": "Selo is the skin of a body, and the outside of any thing: selo tomo is the outside of a building."
      "n2": "Selo can be the outside of a thing or a thing's own skin: selo kili is the skin of a fruit."
    "examples":
      "selo ona li wawa.": "Their skin is tough."
      "mi lukin e selo tomo.": "I look at the outside of the building."
  "tok-0321":
    "native": "nose; bump"
    "notes":
      "n1": "Nena is the nose, and any bump or hill that sticks up from a flat place."
      "n2": "A nose and a hill both stick out of a flat surface, which is why one word does for both."
    "examples":
      "nena mi li pona.": "My nose is fine."
      "nena suli li lon.": "A big hill is there."
