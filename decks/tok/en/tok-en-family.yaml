schema: 1
id: "tok-en-family"
kind: "layer"
core: "tok-family"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Family"
description: "Six words for the people around you: mama (a parent), mije and meli (a man and a woman), kulupu (a group), olin (to love) and poka (beside). Not yet checked by a Toki Pona speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "tok-0157":
    native: "parent; mother or father"
    notes:
      "parent": "Mama is a parent of either sex, so mama mi is my mother or my father, as the sentence makes clear."
      "possessive": "Mi after a word makes it mine: mama mi is my parent, and ona li mama mi is they are my parent."
    examples:
      "mama mi li pona.": "My parent is good."
      "ona li mama mi.": "They are my parent."
  "tok-0158":
    native: "man; male"
    notes:
      "man": "Mije is a man, a male person. Jan mije means a man: jan is the person, and mije says which kind."
      "jan-mije": "Jan mije ni li pona is This man is good. The head word comes first: jan, then mije to say which kind."
    examples:
      "jan mije li pali.": "The man works."
      "jan mije ni li pona.": "This man is good."
  "tok-0159":
    native: "woman; female"
    notes:
      "woman": "Meli is a woman, a female person, as mije is a man. Jan meli means a woman: jan is the person, and meli says which kind."
      "jan-meli": "Jan meli li lukin e moku is The woman sees the food: jan is the head, and meli says which person."
    examples:
      "jan meli li lukin e moku.": "The woman sees the food."
      "meli ni li kama.": "This woman comes."
  "tok-0160":
    native: "group; community"
    notes:
      "group": "Kulupu names a group of people as one thing. Kulupu ni li suli is This group is big, where the group counts as one."
      "one-thing": "Kulupu is one word whether it names a few people or many, as English says a team."
    examples:
      "kulupu ni li suli.": "This group is big."
      "mi lon kulupu ni.": "I am in this group."
  "tok-0161":
    native: "to love; to respect"
    notes:
      "love": "Olin is a feeling that is shown to someone, so it takes e before the person loved, as lukin takes e before what is seen."
      "object": "Olin e ona is to love them: the person or thing loved comes after e."
    examples:
      "mi olin e ona.": "I love them."
      "meli li olin e mije.": "The woman loves the man."
  "tok-0162":
    native: "side; beside"
    notes:
      "side": "Poka is the side of something, and with lon it means being beside it: lon poka mi is beside me."
      "lon-poka": "Lon poka sina is beside you. Lon says where, and poka says which place, so the two words go together."
    examples:
      "ona li lon poka mi.": "They are beside me."
      "jan ni li lon poka sina.": "This person is beside you."
