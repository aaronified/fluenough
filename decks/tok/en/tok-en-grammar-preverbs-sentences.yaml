"name": "Preverbs in sentences"
"description": "Sentences with the preverbs wile, ken, awen, sona, lukin, open, pini and kama before a verb. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0442":
    "native": "I want to eat fruit."
    "confusables":
      "w1":
        "why": "Walo ('white') is spelled much like wile ('to want'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Sina ('you') is also a pronoun, but this sentence has mi ('I') in its place."
  "tok-0443":
    "native": "You can speak toki pona."
    "confusables":
      "w1":
        "why": "Awen ('to stay') is spelled much like ken ('can'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Tomo ('house') is spelled much like toki ('language'), so it is easy to mix up, but it is a different word."
  "tok-0444":
    "native": "They keep eating."
    "confusables":
      "w1":
        "why": "Lape ('to sleep') is related in meaning to awen ('to stay'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Mi ('I') is also a pronoun, but this sentence has ona ('he, she, it or they') in its place."
  "tok-0445":
    "native": "I know how to talk."
    "confusables":
      "w1":
        "why": "Wile ('to want') is also a preverb, but this sentence has sona ('to know') in its place."
      "w2":
        "why": "Mije ('man') is spelled much like mi ('I'), so it is easy to mix up, but it is a different word."
  "tok-0446":
    "native": "The small person is growing big."
    "confusables":
      "w1":
        "why": "Weka ('gone') is related in meaning to kama ('to come'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Ike ('bad') is also a describing word, but this sentence has lili ('small') in its place."
  "tok-0447":
    "native": "I start to work."
    "confusables":
      "w1":
        "why": "Pini means 'to end', the opposite of open ('to begin'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Mije ('man') is spelled much like mi ('I'), so it is easy to mix up, but it is a different word."
  "tok-0448":
    "native": "They finish sleeping."
    "confusables":
      "w1":
        "why": "Tenpo ('time') is also a word about time, but this sentence has pini ('to end') in its place."
      "w2":
        "why": "Pali ('to make') is related in meaning to lape ('to sleep'), but it is not the same word and changes what the sentence says."
  "tok-0449":
    "native": "I try to sleep."
    "confusables":
      "w1":
        "why": "Mije ('man') is spelled much like mi ('I'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Luka ('five, or hand') is spelled much like lukin ('to look'), so it is easy to mix up, but it is a different word."
