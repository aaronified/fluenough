"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Preverbs in sentences"
"description": "Sentences with the preverbs wile, ken, awen, sona, lukin, open, pini and kama before a verb. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0442":
    "native": "I want to eat fruit."
    "confusables":
      "w1":
        "why": "Wile is the preverb of wanting: the sentence is about what I want to do."
      "w2":
        "why": "Moku is to eat: it is the verb the preverb comes before."
  "tok-0443":
    "native": "You can speak toki pona."
    "confusables":
      "w1":
        "why": "Ken is the preverb of can: the sentence says you are able to speak."
      "w2":
        "why": "Toki is to talk: it is the verb, and pona names the language."
  "tok-0444":
    "native": "They keep eating."
    "confusables":
      "w1":
        "why": "Awen is to stay or keep: the sentence says they continue to eat."
      "w2":
        "why": "Moku is to eat: it is the action that keeps going."
  "tok-0445":
    "native": "I know how to talk."
    "confusables":
      "w1":
        "why": "Sona is to know: the sentence says I know how, not that I know a fact."
      "w2":
        "why": "Toki is to talk: it is the verb that comes after the preverb."
  "tok-0446":
    "native": "The small person is growing big."
    "confusables":
      "w1":
        "why": "Kama is to come or become: the sentence says the person becomes big."
      "w2":
        "why": "Suli is big: it is the describing word that the kama turns into a change."
  "tok-0447":
    "native": "I start to work."
    "confusables":
      "w1":
        "why": "Open is to begin: the sentence says I begin the work."
      "w2":
        "why": "Pali is to work or make: it is the action that is started."
  "tok-0448":
    "native": "They finish sleeping."
    "confusables":
      "w1":
        "why": "Pini is to finish: the sentence says they finish the sleep."
      "w2":
        "why": "Lape is to sleep: it is the action that is finished."
  "tok-0449":
    "native": "I try to sleep."
    "confusables":
      "w1":
        "why": "Lukin is to look or try: the sentence says I try to sleep."
      "w2":
        "why": "Lape is to sleep: it is the verb the preverb comes before."
