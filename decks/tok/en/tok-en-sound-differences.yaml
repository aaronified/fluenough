schema: 1
id: "tok-en-sound-differences"
kind: "layer"
core: "tok-sound-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sounds to tell apart"
description: "Pairs of everyday words that differ in one sound: the vowel i or o, a final a after n, and a final n. Each word is stressed on its first syllable. Not yet checked by a Toki Pona speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "tok-0004":
    notes:
      "n1": "Sina and sona differ by one vowel: i here, o there. Sina is you; sona is to know."
  "tok-0007":
    notes:
      "n1": "Sona and sina differ by one vowel: o here, i there. Sona is to know; sina is you."
  "tok-0034":
    native: "bread"
    notes:
      "n1": "Pan and pana differ by one final vowel: pan ends in n, and pana adds an a after it. Pan is bread; pana is to give."
    examples:
      "pan li pona.": "Bread is good."
      "mi wile e pan.": "I want bread."
  "tok-0035":
    native: "to give; to send; to put"
    notes:
      "n1": "Pana and pan differ by one final vowel: pana adds an a after the n of pan. Pana is to give; pan is bread."
    examples:
      "mi pana e pan.": "I give bread."
      "mi pana e sona.": "I teach."
  "tok-0036":
    native: "air; breath; spirit"
    notes:
      "n1": "Kon and ko differ by one final n: kon ends in n, ko does not. Kon is air; ko is powder or paste."
    examples:
      "kon li pona.": "The air is good."
      "kon li suli.": "The air is vast."
  "tok-0037":
    native: "powder; paste"
    notes:
      "n1": "Ko and kon differ by one final n: ko does not end in n, kon does. Ko is powder or paste; kon is air."
    examples:
      "ko li pona.": "The paste is good."
      "mi wile e ko.": "I want paste."
