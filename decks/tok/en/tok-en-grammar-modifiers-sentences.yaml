"cards":
  "tok-0231":
    "native": "A good person is here."
    "confusables":
      "w1":
        "why": "Suli (big) would say the person is big, not good."
      "w2":
        "why": "Ike (bad) would say the person is bad, not good."
  "tok-0232":
    "native": "A big, good thing is here."
    "confusables":
      "w1":
        "why": "Lili (small) would say a small good thing is here, not a big one."
      "w2":
        "why": "Sin (new) would say a new good thing is here, not a big one."
  "tok-0233":
    "native": "The sweet fruit is cold."
    "confusables":
      "w1":
        "why": "Seli (fire) would say the sweet fruit is fire, not cold."
      "w2":
        "why": "Suli (big) would say the sweet fruit is big, not cold."
  "tok-0234":
    "native": "I have good water."
    "confusables":
      "w1":
        "why": "Lete (cold) would say I have cold water, not good water."
      "w2":
        "why": "Suwi (sweet) would say I have sweet water, not good water."
  "tok-0235":
    "native": "Two people come."
    "confusables":
      "w1":
        "why": "Wan (one) would say one person comes, not two."
      "w2":
        "why": "Mute (many) would say many people come, not two."
  "tok-0236":
    "native": "There are many breads here."
    "confusables":
      "w1":
        "why": "Wan (one) would say one bread is here, not many."
      "w2":
        "why": "Tu (two) would say two breads are here, not many."
  "tok-0237":
    "native": "The five fruits are cold."
    "confusables":
      "w1":
        "why": "Tu (two) would say two fruits are cold, not five."
      "w2":
        "why": "Wan (one) would say one fruit is cold, not five."
  "tok-0238":
    "native": "A new person comes."
    "confusables":
      "w1":
        "why": "Pona (good) would say a good person comes, not a new one."
      "w2":
        "why": "Ante (different) would say a different person comes, not a new one."
