"tags":
- "unreviewed"
"cards":
  "tok-0462":
    "native": "This stick is small."
    "confusables":
      "w1":
        "why": "Kiwen ('stone') is related in meaning to palisa ('stick'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Mi ('I') is also a pronoun, but this sentence has ni ('this') in its place."
  "tok-0463":
    "native": "The white paper is below."
    "confusables":
      "w1":
        "why": "Loje ('red') is also a colour, but this sentence has walo ('white') in its place."
      "w2":
        "why": "Ala means 'no, not', the opposite of lon ('to be at or in a place'). Mixing them up would say the reverse of this sentence."
  "tok-0464":
    "native": "A big ball is below."
    "confusables":
      "w1":
        "why": "Tawa ('to go') is also a preposition, but this sentence has lon ('to be at or in a place') in its place."
      "w2":
        "why": "Poka ('side') is also a word for a position, but this sentence has anpa ('below') in its place."
  "tok-0465":
    "native": "The thin string is strong."
    "confusables":
      "w1":
        "why": "Suli means 'big', the opposite of lili ('small'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Waso ('bird') is spelled much like wawa ('strong'), so it is easy to mix up, but it is a different word."
  "tok-0466":
    "native": "I make a big picture."
    "confusables":
      "w1":
        "why": "Nimi ('word') is related in meaning to sitelen ('picture'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Wawa ('strong') is related in meaning to suli ('big'), but it is not the same word and changes what the sentence says."
  "tok-0467":
    "native": "This stone is cold."
    "confusables":
      "w1":
        "why": "Seli means 'fire', the opposite of lete ('cold'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Wawa ('strong') is related in meaning to kiwen ('stone'), but it is not the same word and changes what the sentence says."
  "tok-0468":
    "native": "Give the stick to the person."
    "confusables":
      "w1":
        "why": "Pali ('to make') is spelled much like palisa ('stick'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Weka ('gone') is related in meaning to tawa ('to go'), but it is not the same word and changes what the sentence says."
  "tok-0469":
    "native": "They want paper."
    "confusables":
      "w1":
        "why": "Ni ('this') is spelled much like ona ('he, she, it or they'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Ken ('can') is related in meaning to wile ('to want'), but it is not the same word and changes what the sentence says."
