"tags":
- "unreviewed"
"cards":
  "tok-0462":
    "native": "This stick is small."
    "confusables":
      "w1":
        "why": "Palisa is a stick: the sentence says this stick is broken."
      "w2":
        "why": "Linja is a rope or string: it bends, and the sentence is about a stick."
  "tok-0463":
    "native": "The white paper is below."
    "confusables":
      "w1":
        "why": "Lipu is paper: the sentence says where the white paper is, below."
      "w2":
        "why": "Sitelen is a picture: it could be below too, but this sentence says paper."
  "tok-0464":
    "native": "A big ball is below."
    "confusables":
      "w1":
        "why": "Sike is a round thing: the sentence says the big ball is below."
      "w2":
        "why": "Kiwen is a stone: it is hard and not round, so the sentence is not about it."
  "tok-0465":
    "native": "The thin string is strong."
    "confusables":
      "w1":
        "why": "Linja is a string: the sentence says it is small and strong."
      "w2":
        "why": "Palisa is a stick: it is long and stiff, not a string that bends."
  "tok-0466":
    "native": "I make a big picture."
    "confusables":
      "w1":
        "why": "Pali is to make: the sentence says I make the picture."
      "w2":
        "why": "Sitelen is a picture: it is the thing made, after e."
  "tok-0467":
    "native": "This stone is cold."
    "confusables":
      "w1":
        "why": "Kiwen is a stone: the sentence says this stone is cold."
      "w2":
        "why": "Lete is cold: it describes the stone."
  "tok-0468":
    "native": "Give the stick to the person."
    "confusables":
      "w1":
        "why": "Pana is to give: the command says give the stick away."
      "w2":
        "why": "Palisa is a stick: it is the thing given, after e."
  "tok-0469":
    "native": "They want paper."
    "confusables":
      "w1":
        "why": "Wile is to want: the sentence says what they want, paper."
      "w2":
        "why": "Lipu is paper: it is the thing wanted, after e."
