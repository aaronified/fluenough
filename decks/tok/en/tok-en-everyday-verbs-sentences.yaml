schema: 1
id: "tok-en-everyday-verbs-sentences"
kind: "layer"
core: "tok-everyday-verbs-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences with everyday verbs"
description: "Sentences that say what people eat, do, see and have, each with one of the everyday verbs and the words of the earlier units. Not yet checked by a Toki Pona speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "tok-0089":
    native: "I eat bread."
    confusables:
      "w1": { why: "Pana (to give) would make it say I give bread." }
      "w2": { why: "Lape (to sleep) would make it say I sleep, not that I eat." }
  "tok-0090":
    native: "They are sleeping."
    confusables:
      "w1": { why: "Kama (to come) would make it say they come, not that they sleep." }
      "w2": { why: "Ala (not) would make it say they are not sleeping." }
  "tok-0091":
    native: "What do you want?"
    confusables:
      "w1": { why: "Tawa (to go) would ask whether you are leaving, not what you want." }
      "w2": { why: "Mi (I) would make it about the speaker, not the listener." }
  "tok-0092":
    native: "I look at this."
    confusables:
      "w1": { why: "Kute (to hear) would make it say I hear this, not that I look at it." }
      "w2": { why: "Sona (to know) would make it say I know this." }
  "tok-0093":
    native: "This person comes."
    confusables:
      "w1": { why: "Tawa (to go) would make it say this person goes away." }
      "w2": { why: "Lape (to sleep) would make it say this person sleeps." }
  "tok-0094":
    native: "I have nothing."
    confusables:
      "w1": { why: "Pona (good) describes a thing; it cannot say you have none." }
      "w2": { why: "Lon (to be here or there) takes no object, so it cannot stand before e." }
