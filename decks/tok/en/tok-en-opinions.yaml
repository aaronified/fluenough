"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Opinions"
"description": "Three words for opinions and talk: kin (indeed, also), n (a thinking sound) and meso (the middle). Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0604":
    "native": "indeed; also; really; too"
    "notes":
      "n1": "Kin says that a thing is so, or that something is also true: mi kin wile moku is I also want to eat."
      "n2": "Kin comes after the word it stresses: pona kin is good, indeed."
    "examples":
      "ilo ni li pona kin.": "This tool is good, indeed."
      "mi kin wile moku.": "I want to eat too."
  "tok-0605":
    "native": "a thinking sound; um; hmm"
    "notes":
      "n1": "N is the sound a speaker makes while thinking, before a thing is said."
      "n2": "It is a sound, so it has no meaning of its own, and it is followed by a comma in writing: n, mi wile moku."
    "examples":
      "n, mi wile moku.": "Um, I want to eat."
      "n, ona li pona.": "Hmm, they are good."
  "tok-0606":
    "native": "middle; centre; half; between"
    "notes":
      "n1": "Meso is the middle of a thing, or the space between two: mi lon meso tomo is I am in the middle of the building."
      "n2": "It takes lon before it when placed in a thing: lon meso is in the middle."
    "examples":
      "mi lon meso tomo.": "I am in the middle of the building."
      "meso ilo li suli.": "The middle tool is big."
