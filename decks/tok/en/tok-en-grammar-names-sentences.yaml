"tags":
- "unreviewed"
"cards":
  "tok-0635":
    "native": "Ali is here."
    "confusables":
      "w1":
        "why": "Ala means 'no, not', the opposite of lon ('to be at or in a place'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Jaki ('dirty') is spelled much like jan ('person'), so it is easy to mix up, but it is a different word."
  "tok-0636":
    "native": "I speak Inli."
    "confusables":
      "w1":
        "why": "Sitelen ('picture') is also something about language, but this sentence has toki ('language') in its place."
      "w2":
        "why": "Mije ('man') is spelled much like mi ('I'), so it is easy to mix up, but it is a different word."
  "tok-0637":
    "native": "Ali comes."
    "confusables":
      "w1":
        "why": "Tawa means 'to go', the opposite of kama ('to come'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Mije ('man') is related in meaning to jan ('person'), but it is not the same word and changes what the sentence says."
  "tok-0638":
    "native": "Inli is big."
    "confusables":
      "w1":
        "why": "Tomo ('house') is related in meaning to ma ('land'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Sewi ('above') is spelled much like suli ('big'), so it is easy to mix up, but it is a different word."
  "tok-0639":
    "native": "Ali is good too."
    "confusables":
      "w1":
        "why": "Jaki ('dirty') is spelled much like jan ('person'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Pini ('to end') is spelled much like pona ('good'), so it is easy to mix up, but it is a different word."
  "tok-0640":
    "native": "They give the paper to Ali."
    "confusables":
      "w1":
        "why": "Mi ('I') is also a pronoun, but this sentence has ona ('he, she, it or they') in its place."
      "w2":
        "why": "Pan ('bread') is spelled much like pana ('to give'), so it is easy to mix up, but it is a different word."
  "tok-0641":
    "native": "Ali eats with a tool."
    "confusables":
      "w1":
        "why": "Telo ('water') is related in meaning to moku ('to eat'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Jo ('to have') is related in meaning to kepeken ('using'), but it is not the same word and changes what the sentence says."
  "tok-0642":
    "native": "Inli is not good."
    "confusables":
      "w1":
        "why": "Suli ('big') is also a describing word, but this sentence has pona ('good') in its place."
      "w2":
        "why": "Sitelen ('picture') is also something about language, but this sentence has toki ('language') in its place."
