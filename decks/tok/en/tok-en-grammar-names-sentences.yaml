"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Proper names in sentences"
"description": "Sentences with a proper name after its head: jan Ali, toki Inli and ma Inli, each with a capital. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0635":
    "native": "Ali is here."
    "confusables":
      "w1":
        "why": "Jan is a person: the sentence names a person, Ali, and jan is the head of the name."
      "w2":
        "why": "Lon is at or in: it places the person, and is not a name."
  "tok-0636":
    "native": "I speak Inli."
    "confusables":
      "w1":
        "why": "Toki is to talk: the sentence says I talk, and Inli names the language."
      "w2":
        "why": "Mi is I: it is the speaker, not the name of a language."
  "tok-0637":
    "native": "Ali comes."
    "confusables":
      "w1":
        "why": "Jan is a person: the head of the name Ali, the one who comes."
      "w2":
        "why": "Kama is to come: it is the verb of the sentence."
  "tok-0638":
    "native": "Inli is big."
    "confusables":
      "w1":
        "why": "Ma is the land: the sentence says the country Inli is big."
      "w2":
        "why": "Suli is big: it describes the country."
  "tok-0639":
    "native": "Ali is good too."
    "confusables":
      "w1":
        "why": "Pona is good: it describes Ali, and kin says also."
      "w2":
        "why": "Kin says indeed or also: here it adds that Ali too is good."
  "tok-0640":
    "native": "They give the paper to Ali."
    "confusables":
      "w1":
        "why": "Pana is to give: the sentence says what they do with the paper."
      "w2":
        "why": "Tawa is to go or to: here it gives the receiver, Ali."
  "tok-0641":
    "native": "Ali eats with a tool."
    "confusables":
      "w1":
        "why": "Moku is to eat: it is what Ali does."
      "w2":
        "why": "Kepeken is using: it says the tool is used."
  "tok-0642":
    "native": "Inli is not good."
    "confusables":
      "w1":
        "why": "Toki is talk or a language: the sentence says the language Inli is not good."
      "w2":
        "why": "Pona is good: the sentence negates it."
