"tags":
- "unreviewed"
"cards":
  "tok-0250":
    "native": "My house is good."
    "confusables":
      "w1":
        "why": "Suli (big) would say my house is big, not good."
      "w2":
        "why": "Ike (bad) would say my house is bad, not good."
  "tok-0251":
    "native": "They are at home."
    "confusables":
      "w1":
        "why": "Tawa (to go) would say they go home, not that they are at home."
      "w2":
        "why": "Kama (to come) would say they come home, not that they are at home."
  "tok-0252":
    "native": "The water is on the table."
    "confusables":
      "w1":
        "why": "Tomo (house) would say the water is in a house, not on the table."
      "w2":
        "why": "Poki (box) would say the water is in a box, not on the table."
  "tok-0253":
    "native": "The box is at the door."
    "confusables":
      "w1":
        "why": "Supa (table) would say the box is on a table, not at the door."
      "w2":
        "why": "Tomo (house) would say the box is in a house, not at the door."
  "tok-0254":
    "native": "I build a house."
    "confusables":
      "w1":
        "why": "Lukin (to see) would say I see the house, not that I make it."
      "w2":
        "why": "Jo (to have) would say I have the house, not that I make it."
  "tok-0255":
    "native": "This tool is not small."
    "confusables":
      "w1":
        "why": "Suli (big) would say this tool is big, not that it is not small."
      "w2":
        "why": "Pona (good) would say this tool is good, not that it is not small."
  "tok-0256":
    "native": "This person is not at home."
    "confusables":
      "w1":
        "why": "Tawa (to go) would say this person does not go home, not that they are not at home."
      "w2":
        "why": "Kama (to come) would say this person does not come home, not that they are not at home."
  "tok-0257":
    "native": "Do you have a tool, or not?"
    "confusables":
      "w1":
        "why": "Wile (to want) would ask whether you want a tool, not whether you have one."
      "w2":
        "why": "Pali (to make) would ask whether you make a tool, not whether you have one."
