"id": "tok-en-home-sentences"
"kind": "layer"
"core": "tok-home-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Home in sentences"
"description": "Sentences about the house, its table, box, door and tools, with lon for where things are. Not yet checked by a Toki Pona speaker: please report any mistake."
