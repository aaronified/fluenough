"core": "tok-grammar-joining-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Joining in sentences"
"description": "Sentences that join subjects with en, give a choice with anu, limit with taso, and repeat li for a second clause. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0542":
    "native": "I and a small person eat."
    "confusables":
      "w1":
        "why": "En joins the two subjects: this sentence says I and a small person, one group."
      "w2":
        "why": "Jan is a person: it is one of the two subjects, not the whole thing joined."
  "tok-0543":
    "native": "You or I eat."
    "confusables":
      "w1":
        "why": "Anu gives a choice here, you or I. It is the join this sentence is about."
      "w2":
        "why": "En would join you and I, so both eat: the sentence says one of us."
  "tok-0544":
    "native": "You only sleep."
    "confusables":
      "w1":
        "why": "Taso limits the verb: it says only sleep, not the sleeping of others."
      "w2":
        "why": "Lape is to sleep: it is the thing limited by taso."
  "tok-0545":
    "native": "The water is cold, but it is in the box."
    "confusables":
      "w1":
        "why": "Taso here turns the two clauses into a but: the second clause is the contrast."
      "w2":
        "why": "Lete is cold: it is the first clause, not the contrast."
  "tok-0546":
    "native": "A person and they come."
    "confusables":
      "w1":
        "why": "En joins a person and they as one group of subjects."
      "w2":
        "why": "Kama is to come: it is the verb that the group takes."
  "tok-0547":
    "native": "I eat, and you work."
    "confusables":
      "w1":
        "why": "Li comes before each predicate: here there are two clauses, and li is repeated."
      "w2":
        "why": "En would join the subjects into one group: here each clause keeps its own subject."
  "tok-0548":
    "native": "Fruit and water are here."
    "confusables":
      "w1":
        "why": "En joins the two nouns into one group of subjects."
      "w2":
        "why": "Lon is at or in: it is what the group does here."
  "tok-0549":
    "native": "They work or sleep."
    "confusables":
      "w1":
        "why": "Anu gives a choice between two verbs for the same subject."
      "w2":
        "why": "En would join the verbs as one, and the sentence gives a choice instead."
