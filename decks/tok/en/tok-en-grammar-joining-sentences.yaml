"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Joining in sentences"
"description": "Sentences that join subjects with en, give a choice with anu, limit with taso, and repeat li for a second clause. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0542":
    "native": "I and a small person eat."
    "confusables":
      "w1":
        "why": "Anu means or and offers a choice. Here the sentence joins subjects with en, which means and."
      "w2":
        "why": "Ike ('bad') is also a describing word, but this sentence has lili ('small') in its place."
  "tok-0543":
    "native": "You or I eat."
    "confusables":
      "w1":
        "why": "En joins subjects with and. The sentence offers a choice, which anu does."
      "w2":
        "why": "Mije ('man') is spelled much like mi ('I'), so it is easy to mix up, but it is a different word."
  "tok-0544":
    "native": "You only sleep."
    "confusables":
      "w1":
        "why": "Anu offers a choice. It does not contrast two ideas, which taso does."
      "w2":
        "why": "Awen ('to stay') is related in meaning to lape ('to sleep'), but it is not the same word and changes what the sentence says."
  "tok-0545":
    "native": "The water is cold, but it is in the box."
    "confusables":
      "w1":
        "why": "Kin adds an idea (also). The sentence contrasts one, so it needs taso."
      "w2":
        "why": "Len ('clothes') is spelled much like lete ('cold'), so it is easy to mix up, but it is a different word."
  "tok-0546":
    "native": "A person and they come."
    "confusables":
      "w1":
        "why": "Taso means but or only. It does not join two subjects, which en does."
      "w2":
        "why": "Meli ('woman') is also a kind of person, but this sentence has jan ('person') in its place."
  "tok-0547":
    "native": "I eat, and you work."
    "confusables":
      "w1":
        "why": "Kili ('fruit') is related in meaning to moku ('to eat'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Sin ('new') is spelled much like sina ('you'), so it is easy to mix up, but it is a different word."
  "tok-0548":
    "native": "Fruit and water are here."
    "confusables":
      "w1":
        "why": "Taso means but or only. It does not join two subjects, which en does."
      "w2":
        "why": "Pan ('bread') is also something to eat or drink, but this sentence has telo ('water') in its place."
  "tok-0549":
    "native": "They work or sleep."
    "confusables":
      "w1":
        "why": "En joins subjects with and. The sentence offers a choice, which anu does."
      "w2":
        "why": "Mi ('I') is also a pronoun, but this sentence has ona ('he, she, it or they') in its place."
