"schema": 1
"id": "tok-en-location"
"kind": "layer"
"core": "tok-location"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Where things are"
"description": "Five words for place: anpa, insa, monsi, sinpin and sewi (below, inside, behind, in front, above). Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0350":
    "native": "below; under; down"
    "notes":
      "n1": "Anpa is the bottom side of a thing, or being below it: ijo li anpa is the thing is below."
      "n2": "It comes after the word it places, or stands alone, as ilo anpa is the lower tool."
    "examples":
      "ijo li anpa.": "The thing is below."
      "ilo anpa li pakala.": "The lower tool is broken."
  "tok-0351":
    "native": "inside; middle"
    "notes":
      "n1": "Insa is the inside of a thing, or being inside it: insa poki is the inside of a box."
      "n2": "Insa is also the middle of something, so insa tomo can be the middle of a building."
    "examples":
      "ijo li insa tomo.": "The thing is inside the building."
      "mi lukin e insa poki.": "I look at the inside of the box."
  "tok-0352":
    "native": "behind; back"
    "notes":
      "n1": "Monsi is the back side of a thing, or being behind it: monsi tomo is the back of a building."
      "n2": "Monsi takes the word it places after it, as monsi jan is the back of a person."
    "examples":
      "monsi tomo li suli.": "The back of the building is big."
      "mi lukin e monsi jan.": "I look at a person's back."
  "tok-0353":
    "native": "in front; front"
    "notes":
      "n1": "Sinpin is the front side of a thing, or being in front of it: sinpin tomo is the front of a building."
      "n2": "Sinpin is the opposite of monsi, the back side."
    "examples":
      "sinpin tomo li pona.": "The front of the building is nice."
      "jan li kama sinpin.": "The person comes to the front."
  "tok-0354":
    "native": "above; top; high"
    "notes":
      "n1": "Sewi is above a thing, or the top of it: sewi tomo is the roof of a building."
      "n2": "Sewi can stand alone, as in ijo li sewi, the thing is above."
    "examples":
      "sewi tomo li suli.": "The top of the building is big."
      "ijo li sewi.": "The thing is above."
