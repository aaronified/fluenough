"name": "The full number system"
"license": "CC-BY-SA-4.0"
"description": "The full number system, nasin nanpa pona, uses mute for twenty and ale for a hundred. The number words are added up, largest first: mute tu is 20 + 2, twenty-two, and ale tu mute tu is 100 + 2 + 20 + 2, one hundred and twenty-four. The simple system, with wan, tu and luka, counts up to twenty. Not yet checked by a Toki Pona speaker: please report any mistake."
