    "twenty-two": "twenty-two: twenty and two (mute tu)"
    "one hundred and twenty-four": "one hundred and twenty-four: a hundred, two, twenty and two (ale tu mute tu)"
  "entries":
    "nanpa": "number"
    "ijo": "thing"
  "notes": "Mute tu is twenty and two, twenty-two. Ale tu mute tu is a hundred and two and twenty and two, one hundred and twenty-four. The values are added, never multiplied: forty is mute mute."
