    "forty": "forty: two twenties (mute tu)"
    "two hundred and forty": "two hundred and forty: two hundreds and two twenties (ale tu mute tu)"
  "entries":
    "nanpa": "number"
    "ijo": "thing"
  "notes": "Mute tu is two twenties, forty. Ale tu mute tu is two hundreds and two twenties, two hundred and forty. The number before a multiplier says how many of it there are."
