"name": "The full number system"
"license": "CC-BY-SA-4.0"
"description": "The full number system, nasin nanpa pona, uses mute for twenty and ale for a hundred. A number word comes after the one it multiplies, and the groups are added in a row: mute tu is forty, and ale tu mute tu is two hundred and forty. The simple system, with wan, tu and luka, counts up to twenty. Not yet checked by a Toki Pona speaker: please report any mistake."
