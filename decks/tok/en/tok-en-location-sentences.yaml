"id": "tok-en-location-sentences"
"kind": "layer"
"core": "tok-location-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Where things are in sentences"
"description": "Sentences that place things below, inside, behind, in front and above. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0355":
    "native": "The thing is not below."
    "confusables":
      "w1":
        "why": "Sewi is above: the sentence would say the thing is not above, not that it is not below."
      "w2":
        "why": "Insa is inside: the sentence would say the thing is not inside."
  "tok-0356":
    "native": "The box is not inside."
    "confusables":
      "w1":
        "why": "Insa is inside: this is the word the sentence negates, not a word for the box."
      "w2":
        "why": "Poki is the box: the sentence is about where it is, so the box is its subject, not its place."
  "tok-0357":
    "native": "The fruit is up high."
    "confusables":
      "w1":
        "why": "Sewi is above: the sentence says where the fruit is, and the fruit is its subject."
      "w2":
        "why": "Anpa is below: the sentence would say the fruit is low, not high."
  "tok-0358":
    "native": "The person is not in front."
    "confusables":
      "w1":
        "why": "Sinpin is in front: the sentence negates it, so the person is not in front."
      "w2":
        "why": "Monsi is behind: the sentence would say the person is at the back."
  "tok-0359":
    "native": "I sleep below the building."
    "confusables":
      "w1":
        "why": "Lape is to sleep: the sentence is about sleeping, and the place comes after it."
      "w2":
        "why": "Tomo is a building: it names the place where I sleep, not what I sleep in."
  "tok-0360":
    "native": "Go behind the tool."
    "confusables":
      "w1":
        "why": "Tawa is to go: the command starts with o and tawa, so this is a command to go."
      "w2":
        "why": "Ilo is a tool: the sentence names the place to go to, behind it."
  "tok-0361":
    "native": "Come to the front."
    "confusables":
      "w1":
        "why": "Kama is to come: the command asks for a coming, not a going."
      "w2":
        "why": "Tawa is to go: the sentence would ask you to leave for the front."
  "tok-0362":
    "native": "A small thing is inside the box."
    "confusables":
      "w1":
        "why": "Ijo is a thing: the sentence is about a small thing, not the box."
      "w2":
        "why": "Lili is small: the sentence says the thing is small, not the box."
