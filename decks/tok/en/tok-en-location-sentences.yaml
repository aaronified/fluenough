"core": "tok-location-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Where things are in sentences"
"description": "Sentences that place things below, inside, behind, in front and above. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0355":
    "native": "The thing is not below."
    "confusables":
      "w1":
        "why": "Kiwen ('stone') is also a kind of object, but this sentence has ijo ('thing') in its place."
      "w2":
        "why": "Poka ('side') is also a word for a position, but this sentence has anpa ('below') in its place."
  "tok-0356":
    "native": "The box is not inside."
    "confusables":
      "w1":
        "why": "Pona ('good') is spelled much like poki ('box'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Sewi ('above') is also a word for a position, but this sentence has insa ('inside') in its place."
  "tok-0357":
    "native": "The fruit is up high."
    "confusables":
      "w1":
        "why": "Moku ('to eat') is related in meaning to kili ('fruit'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Insa ('inside') is also a word for a position, but this sentence has sewi ('above') in its place."
  "tok-0358":
    "native": "The person is not in front."
    "confusables":
      "w1":
        "why": "Sewi ('above') is also a word for a position, but this sentence has sinpin ('in front') in its place."
      "w2":
        "why": "Ona ('he, she, it or they') is related in meaning to jan ('person'), but it is not the same word and changes what the sentence says."
  "tok-0359":
    "native": "I sleep below the building."
    "confusables":
      "w1":
        "why": "Moku ('to eat') is also an everyday action, but this sentence has lape ('to sleep') in its place."
      "w2":
        "why": "Insa ('inside') is related in meaning to anpa ('below'), but it is not the same word and changes what the sentence says."
  "tok-0360":
    "native": "Go behind the tool."
    "confusables":
      "w1":
        "why": "Insa ('inside') is related in meaning to monsi ('behind'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Tomo ('house') is also something in or around the home, but this sentence has ilo ('tool') in its place."
  "tok-0361":
    "native": "Come to the front."
    "confusables":
      "w1":
        "why": "Tawa means 'to go', the opposite of kama ('to come'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Sewi ('above') is also a word for a position, but this sentence has sinpin ('in front') in its place."
  "tok-0362":
    "native": "A small thing is inside the box."
    "confusables":
      "w1":
        "why": "Anpa ('below') is related in meaning to insa ('inside'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Ilo ('tool') is related in meaning to poki ('box'), but it is not the same word and changes what the sentence says."
