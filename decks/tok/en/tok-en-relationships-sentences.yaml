schema: 1
id: "tok-en-relationships-sentences"
kind: "layer"
core: "tok-relationships-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Relationships in sentences"
description: "Sentences with tonsi, in the basic order: subject, li, predicate, e, object. Tonsi comes after jan, the person, so jan tonsi is a non-binary person. Not yet checked by a Toki Pona speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "tok-0760":
    native: "The non-binary person sees the food."
    confusables:
      "w1": { why: "Kute (to hear) would say the non-binary person hears the food, not that they see it." }
      "w2": { why: "Mije (man) would say the man sees the food, not the non-binary person." }
  "tok-0761":
    native: "This non-binary person is beside me."
    confusables:
      "w1": { why: "Mama (parent) would say this is my parent, not a non-binary person beside me." }
      "w2": { why: "Meli (woman) would say this woman is beside me, not a non-binary person." }
  "tok-0762":
    native: "I love this non-binary person."
    confusables:
      "w1": { why: "Lukin (to see) would say I see this non-binary person, not that I love them." }
      "w2": { why: "Jo (to have) would say I have this non-binary person, not that I love them." }
  "tok-0763":
    native: "The non-binary person and the woman go home."
    confusables:
      "w1": { why: "Kama (to come) would say they come home, not that they go." }
      "w2": { why: "Mije (man) would say the man goes home, not the woman." }
  "tok-0764":
    native: "This group is good for the non-binary person."
    confusables:
      "w1": { why: "Suli (big) would say the group is big for the non-binary person, not good." }
      "w2": { why: "Lili (small) would say the group is small, not good." }
  "tok-0765":
    native: "The non-binary person feels good."
    confusables:
      "w1": { why: "Musi (fun) would say the non-binary person is fun, not that they feel good." }
      "w2": { why: "Nasa (strange) would say the non-binary person is strange, not good." }
