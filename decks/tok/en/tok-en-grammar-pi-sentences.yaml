"id": "tok-en-grammar-pi-sentences"
"kind": "layer"
"core": "tok-grammar-pi-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Pi in sentences"
"description": "Sentences with pi groups, and with the same words without it. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0336":
    "native": "The harbour is there."
    "confusables":
      "w1":
        "why": "Tomo is a building alone: the sentence without pi would say a big water building, not a building of big water."
      "w2":
        "why": "Telo is water: the sentence would be about the water, not the building."
  "tok-0337":
    "native": "The cook is working."
    "confusables":
      "w1":
        "why": "Jan is a person: without pi, the sentence is about a good eater, not a cook."
      "w2":
        "why": "Moku is to eat: the sentence would say the good food is working."
  "tok-0338":
    "native": "A big water building is there."
    "confusables":
      "w1":
        "why": "Here the building is the head, and water and big are its describing words, one after another."
      "w2":
        "why": "Pi would make the water and big one group: the building would be of big water."
  "tok-0339":
    "native": "A good eater is here."
    "confusables":
      "w1":
        "why": "Jan is a person; the sentence says a person who eats well is here."
      "w2":
        "why": "Pona is good: on its own it would not say the person eats."
  "tok-0340":
    "native": "A tool for sweet fruit is good."
    "confusables":
      "w1":
        "why": "Ilo is a tool: the sentence would be about the tool's kind, not its use."
      "w2":
        "why": "Kili is fruit: the sentence would be about the fruit, not a tool for it."
  "tok-0341":
    "native": "A person of big water comes."
    "confusables":
      "w1":
        "why": "Jan is a person: the sentence is about who comes, a person of the sea."
      "w2":
        "why": "Tawa is to go: the sentence would say a person of big water goes, not comes."
  "tok-0342":
    "native": "A sweet fruit tool is here."
    "confusables":
      "w1":
        "why": "Ilo is a tool: this is a tool made for sweet fruit, and the sentence says it is here."
      "w2":
        "why": "Suwi is sweet: on its own it describes a taste, not a tool."
  "tok-0343":
    "native": "The cold water building is big."
    "confusables":
      "w1":
        "why": "Tomo is a building: without pi, cold would describe the water building as one thing."
      "w2":
        "why": "Lete is cold: the sentence says the building is big, not cold."
