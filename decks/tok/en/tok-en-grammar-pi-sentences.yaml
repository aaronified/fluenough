"tags":
- "unreviewed"
"cards":
  "tok-0336":
    "native": "The harbour is there."
    "confusables":
      "w1":
        "why": "E marks the object of a verb. It cannot join a group of describing words to a noun, which pi does."
      "w2":
        "why": "Lili means 'small', the opposite of suli ('big'). Mixing them up would say the reverse of this sentence."
  "tok-0337":
    "native": "The cook is working."
    "confusables":
      "w1":
        "why": "E marks the object of a verb. It cannot join a group of describing words to a noun, which pi does."
      "w2":
        "why": "Jaki ('dirty') is spelled much like jan ('person'), so it is easy to mix up, but it is a different word."
  "tok-0338":
    "native": "A big water building is there."
    "confusables":
      "w1":
        "why": "Pi groups the words after it as one description of the noun. This sentence describes the noun with separate words, so it needs no pi."
      "w2":
        "why": "Seli ('fire') is related in meaning to telo ('water'), but it is not the same word and changes what the sentence says."
  "tok-0339":
    "native": "A good eater is here."
    "confusables":
      "w1":
        "why": "Pi groups the words after it as one description of the noun. This sentence describes the noun with separate words, so it needs no pi."
      "w2":
        "why": "Tawa ('to go') is also a preposition, but this sentence has lon ('to be at or in a place') in its place."
  "tok-0340":
    "native": "A tool for sweet fruit is good."
    "confusables":
      "w1":
        "why": "E marks the object of a verb. It cannot join a group of describing words to a noun, which pi does."
      "w2":
        "why": "Poki ('box') is related in meaning to ilo ('tool'), but it is not the same word and changes what the sentence says."
  "tok-0341":
    "native": "A person of big water comes."
    "confusables":
      "w1":
        "why": "E marks the object of a verb. It cannot join a group of describing words to a noun, which pi does."
      "w2":
        "why": "Lili means 'small', the opposite of suli ('big'). Mixing them up would say the reverse of this sentence."
  "tok-0342":
    "native": "A sweet fruit tool is here."
    "confusables":
      "w1":
        "why": "Pi groups the words after it as one description of the noun. This sentence describes the noun with separate words, so it needs no pi."
      "w2":
        "why": "Ijo ('thing') is spelled much like ilo ('tool'), so it is easy to mix up, but it is a different word."
  "tok-0343":
    "native": "The cold water building is big."
    "confusables":
      "w1":
        "why": "E marks the object of a verb. It cannot join a group of describing words to a noun, which pi does."
      "w2":
        "why": "Len ('clothes') is spelled much like lete ('cold'), so it is easy to mix up, but it is a different word."
