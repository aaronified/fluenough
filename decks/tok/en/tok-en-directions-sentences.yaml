"cards":
  "tok-0372":
    "native": "This way is bad."
    "confusables":
      "w1":
        "why": "Suli ('big') is also a describing word, but this sentence has ike ('bad') in its place."
      "w2":
        "why": "Nasa ('strange') is spelled much like nasin ('way'), so it is easy to mix up, but it is a different word."
  "tok-0373":
    "native": "Go the good way."
    "confusables":
      "w1":
        "why": "Lon ('to be at or in a place') is also a preposition, but this sentence has tawa ('to go') in its place."
      "w2":
        "why": "Nasa ('strange') is spelled much like nasin ('way'), so it is easy to mix up, but it is a different word."
  "tok-0374":
    "native": "They come from the box."
    "confusables":
      "w1":
        "why": "Kepeken ('using') is related in meaning to tan ('from'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Poka ('side') is spelled much like poki ('box'), so it is easy to mix up, but it is a different word."
  "tok-0375":
    "native": "Because of this, I sleep."
    "confusables":
      "w1":
        "why": "Tawa ('to go') is spelled much like tan ('from'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Sina ('you') is also a pronoun, but this sentence has ni ('this') in its place."
  "tok-0376":
    "native": "I work with a small tool."
    "confusables":
      "w1":
        "why": "Moku ('to eat') is related in meaning to pali ('to make'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Jo ('to have') is related in meaning to kepeken ('using'), but it is not the same word and changes what the sentence says."
  "tok-0377":
    "native": "A person works using water."
    "confusables":
      "w1":
        "why": "Jaki ('dirty') is spelled much like jan ('person'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Moku ('to eat') is related in meaning to pali ('to make'), but it is not the same word and changes what the sentence says."
  "tok-0378":
    "native": "Go from the building."
    "confusables":
      "w1":
        "why": "Lupa ('door') is related in meaning to tomo ('house'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Kama means 'to come', the opposite of tawa ('to go'). Mixing them up would say the reverse of this sentence."
  "tok-0379":
    "native": "I want to go this way."
    "confusables":
      "w1":
        "why": "Mije ('man') is spelled much like mi ('I'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Ken ('can') is related in meaning to wile ('to want'), but it is not the same word and changes what the sentence says."
