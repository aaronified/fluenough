"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Directions in sentences"
"description": "Sentences that give a way, say where something starts and why, and say what something is done with. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0372":
    "native": "This way is bad."
    "confusables":
      "w1":
        "why": "Nasin is a road or a method, and the sentence says this way is bad, not this road."
      "w2":
        "why": "Pona is good: the sentence would say the way is good."
  "tok-0373":
    "native": "Go the good way."
    "confusables":
      "w1":
        "why": "Tawa is to go: the command is about going, and the way is its place."
      "w2":
        "why": "Nasin is the way: here it is the place to go, not the thing done."
  "tok-0374":
    "native": "They come from the box."
    "confusables":
      "w1":
        "why": "Kama is to come: the sentence says where they come from, not where they go."
      "w2":
        "why": "Tan says the starting place: the sentence does not say a reason."
  "tok-0375":
    "native": "Because of this, I sleep."
    "confusables":
      "w1":
        "why": "Tan gives the reason here, and the la sets it as the context of the sentence."
      "w2":
        "why": "Lape is to sleep: it is what I do, not the reason for it."
  "tok-0376":
    "native": "I work with a small tool."
    "confusables":
      "w1":
        "why": "Ilo is the tool: in this sentence it names what is used, after kepeken."
      "w2":
        "why": "Kepeken is using: here it comes before the tool, not after the verb."
  "tok-0377":
    "native": "A person works using water."
    "confusables":
      "w1":
        "why": "Jan is a person: the sentence says what the person works with, not who they are."
      "w2":
        "why": "Telo is water: here it is the thing used, after kepeken."
  "tok-0378":
    "native": "Go from the building."
    "confusables":
      "w1":
        "why": "Tawa is to go: the command is to leave, and tan says where from."
      "w2":
        "why": "Tomo is the building: it is the place you start from, not the place you go."
  "tok-0379":
    "native": "I want to go this way."
    "confusables":
      "w1":
        "why": "Wile is to want: the sentence says I want the way, not that I want to go."
      "w2":
        "why": "Tawa is to go: it is the action, and nasin ni is the way it goes."
