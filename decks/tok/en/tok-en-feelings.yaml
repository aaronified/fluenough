"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Feelings and moods"
"description": "Four words for feelings: pilin (to feel, a feeling), musi (fun, play), nasa (strange) and jaki (dirty, messy). Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0522":
    "native": "to feel; feeling; heart"
    "notes":
      "n1": "Pilin is to feel something, or a feeling itself: mi pilin pona is I feel good."
      "n2": "It takes a describing word after it, the way the feeling is: pilin ike is to feel bad."
    "examples":
      "mi pilin pona.": "I feel good."
      "ona li pilin ike.": "They feel bad."
  "tok-0523":
    "native": "fun; play; game; to play"
    "notes":
      "n1": "Musi is fun, play, or a game: musi suli is a big game."
      "n2": "Musi can be a verb too, to play or to enjoy: ona li musi is they play."
    "examples":
      "musi li suli.": "The game is big."
      "ona li musi.": "They play."
  "tok-0524":
    "native": "strange; odd; magic"
    "notes":
      "n1": "Nasa is strange, odd, or magic, a thing that does not behave as it should."
      "n2": "Nasa is not a bad word on its own: it says a thing is unusual, and a friend may call a trick nasa."
    "examples":
      "ijo nasa li lon.": "A strange thing is here."
      "tomo nasa li suli.": "The strange building is big."
  "tok-0525":
    "native": "dirty; messy; gross"
    "notes":
      "n1": "Jaki is dirty, messy, or gross: a thing that needs cleaning."
      "n2": "It describes a thing or a place: telo jaki is dirty water."
    "examples":
      "mi lukin e ilo jaki.": "I look at the dirty tool."
      "kili jaki li lete.": "The dirty fruit is cold."
