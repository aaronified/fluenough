"cards":
  "tok-0576":
    "native": "The medicine is strong."
    "confusables":
      "w1":
        "why": "Sijelo ('body') is related in meaning to misikeke ('medicine'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Ike ('bad') is also a describing word, but this sentence has wawa ('strong') in its place."
  "tok-0577":
    "native": "Take this medicine."
    "confusables":
      "w1":
        "why": "Moli ('to die') is spelled much like moku ('to eat'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Telo ('water') is related in meaning to misikeke ('medicine'), but it is not the same word and changes what the sentence says."
  "tok-0578":
    "native": "This medicine is bad."
    "confusables":
      "w1":
        "why": "Nimi ('word') is spelled much like ni ('this'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Pakala ('to break') is related in meaning to ike ('bad'), but it is not the same word and changes what the sentence says."
  "tok-0579":
    "native": "Your eye is hot."
    "confusables":
      "w1":
        "why": "Sijelo ('body') is also a part of the body, but this sentence has oko ('eye') in its place."
      "w2":
        "why": "Mi ('I') is also a pronoun, but this sentence has sina ('you') in its place."
  "tok-0580":
    "native": "If I feel bad, I take medicine."
    "confusables":
      "w1":
        "why": "Telo ('water') is related in meaning to misikeke ('medicine'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Sina ('you') is also a pronoun, but this sentence has mi ('I') in its place."
  "tok-0581":
    "native": "A person looks with the eyes."
    "confusables":
      "w1":
        "why": "Jaki ('dirty') is spelled much like jan ('person'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Luka ('five, or hand') is spelled much like lukin ('to look'), so it is easy to mix up, but it is a different word."
  "tok-0582":
    "native": "When you sleep, your eyes sleep."
    "confusables":
      "w1":
        "why": "Sijelo ('body') is also a part of the body, but this sentence has oko ('eye') in its place."
      "w2":
        "why": "Mi ('I') is also a pronoun, but this sentence has sina ('you') in its place."
  "tok-0583":
    "native": "Their eye is fine."
    "confusables":
      "w1":
        "why": "Suwi ('sweet') is related in meaning to pona ('good'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Sijelo ('body') is also a part of the body, but this sentence has oko ('eye') in its place."
