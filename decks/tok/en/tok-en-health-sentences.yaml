"tags":
- "unreviewed"
"cards":
  "tok-0576":
    "native": "The medicine is strong."
    "confusables":
      "w1":
        "why": "Misikeke is medicine: the sentence says the medicine is strong."
      "w2":
        "why": "Wawa is strong: it describes the medicine."
  "tok-0577":
    "native": "Take this medicine."
    "confusables":
      "w1":
        "why": "Moku is to eat or take: the command takes the medicine, after e."
      "w2":
        "why": "Misikeke is medicine: it is the thing taken, this one."
  "tok-0578":
    "native": "This medicine is bad."
    "confusables":
      "w1":
        "why": "Misikeke is medicine: the sentence says this medicine is bad."
      "w2":
        "why": "Ike is bad: it describes the medicine."
  "tok-0579":
    "native": "Your eye is hot."
    "confusables":
      "w1":
        "why": "Oko is the eye: the sentence says your eye is hot."
      "w2":
        "why": "Seli is fire or heat: it describes the eye, and the sentence is about its temperature."
  "tok-0580":
    "native": "If I feel bad, I take medicine."
    "confusables":
      "w1":
        "why": "Pilin is to feel: it is the condition in this sentence."
      "w2":
        "why": "Moku is to take: it is the result, what I do."
  "tok-0581":
    "native": "A person looks with the eyes."
    "confusables":
      "w1":
        "why": "Lukin is to look: the sentence says a person looks, using their eyes."
      "w2":
        "why": "Oko is the eye: it is the means of looking, after kepeken."
  "tok-0582":
    "native": "When you sleep, your eyes sleep."
    "confusables":
      "w1":
        "why": "Lape is to sleep: it is the condition in this sentence."
      "w2":
        "why": "Oko is the eye: it is the subject of the result."
  "tok-0583":
    "native": "Their eye is fine."
    "confusables":
      "w1":
        "why": "Oko is the eye: the sentence says their eye is fine."
      "w2":
        "why": "Pona is good: it says the eye is fine."
