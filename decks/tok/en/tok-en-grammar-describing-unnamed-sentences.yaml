"cards":
  "tok-0621":
    "native": "A paper tool is there."
    "confusables":
      "w1":
        "why": "Tomo ('house') is also something in or around the home, but this sentence has ilo ('tool') in its place."
      "w2":
        "why": "Linja ('string') is spelled much like lipu ('paper'), so it is easy to mix up, but it is a different word."
  "tok-0622":
    "native": "The writer comes."
    "confusables":
      "w1":
        "why": "Linja ('string') is spelled much like lipu ('paper'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Weka ('gone') is related in meaning to kama ('to come'), but it is not the same word and changes what the sentence says."
  "tok-0623":
    "native": "The big eating building is below."
    "confusables":
      "w1":
        "why": "Weka means 'gone', the opposite of lon ('to be at or in a place'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Sewi means 'above', the opposite of anpa ('below'). Mixing them up would say the reverse of this sentence."
  "tok-0624":
    "native": "The tool for big paper is good."
    "confusables":
      "w1":
        "why": "Ijo ('thing') is spelled much like ilo ('tool'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Linja ('string') is spelled much like lipu ('paper'), so it is easy to mix up, but it is a different word."
  "tok-0625":
    "native": "A person of cold food works."
    "confusables":
      "w1":
        "why": "Len ('clothes') is spelled much like lete ('cold'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Pana ('to give') is spelled much like pali ('to make'), so it is easy to mix up, but it is a different word."
  "tok-0626":
    "native": "A small sweet-fruit tool is here."
    "confusables":
      "w1":
        "why": "Ike ('bad') is also a describing word, but this sentence has lili ('small') in its place."
      "w2":
        "why": "Weka means 'gone', the opposite of lon ('to be at or in a place'). Mixing them up would say the reverse of this sentence."
  "tok-0627":
    "native": "The building of white water is big."
    "confusables":
      "w1":
        "why": "Pimeja means 'black', the opposite of walo ('white'). Mixing them up would say the reverse of this sentence."
      "w2":
        "why": "Sewi ('above') is spelled much like suli ('big'), so it is easy to mix up, but it is a different word."
  "tok-0628":
    "native": "The good paper tool is above."
    "confusables":
      "w1":
        "why": "Suli ('big') is spelled much like sewi ('above'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Ijo ('thing') is spelled much like ilo ('tool'), so it is easy to mix up, but it is a different word."
