  "name": "English"
"name": "Describing what has no word, in sentences"
"description": "Sentences that describe a thing with no word of its own: the head is chosen first, then its modifiers, and pi groups longer ones. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0621":
    "native": "A paper tool is there."
    "confusables":
      "w1":
        "why": "Ilo is a tool: it is the head, which says what kind of thing it is."
      "w2":
        "why": "Lipu is paper: it is the modifier that says what the tool is for."
  "tok-0622":
    "native": "The writer comes."
    "confusables":
      "w1":
        "why": "Jan is a person: the head says who, and lipu says what they work with."
      "w2":
        "why": "Lipu is paper: it describes the person, and cannot come on its own."
  "tok-0623":
    "native": "The big eating building is below."
    "confusables":
      "w1":
        "why": "Tomo is a building: it is the head, the kind of place."
      "w2":
        "why": "Moku is to eat: it is the modifier, and it describes what the building is for."
  "tok-0624":
    "native": "The tool for big paper is good."
    "confusables":
      "w1":
        "why": "Pi groups lipu suli into one: without it the modifiers would describe ilo one by one."
      "w2":
        "why": "Ilo is a tool: the head that the group describes."
  "tok-0625":
    "native": "A person of cold food works."
    "confusables":
      "w1":
        "why": "Pi groups moku lete into one: the person is of cold food, as a group."
      "w2":
        "why": "Lete is cold: here it is part of the group, not the whole description."
  "tok-0626":
    "native": "A small sweet-fruit tool is here."
    "confusables":
      "w1":
        "why": "Ilo is a tool: the head, and all the modifiers after it describe it in turn."
      "w2":
        "why": "Suwi is sweet: it is the modifier that describes the fruit, before the small."
  "tok-0627":
    "native": "The building of white water is big."
    "confusables":
      "w1":
        "why": "Tomo is a building: the head that the group describes."
      "w2":
        "why": "Walo is white: it is part of the group that describes the water."
  "tok-0628":
    "native": "The good paper tool is above."
    "confusables":
      "w1":
        "why": "Ilo is a tool: the head. The sentence says where it is."
      "w2":
        "why": "Pona is good: the modifier that describes the paper tool as a whole."
