"name": "Cooking"
"description": "Three words for cooking: namako (spice, extra), kipisi (to cut) and soko (mushroom). Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0649":
    "native": "spice; seasoning; extra"
    "notes":
      "n1": "Namako is a spice or seasoning, and anything extra added to a food: namako suwi is a sweet spice."
      "n2": "Namako can also mean extra, as in a thing added on top of what is needed."
    "examples":
      "namako ni li wawa.": "This spice is strong."
      "mi wile e namako.": "I want spice."
  "tok-0650":
    "native": "to cut; to chop"
    "notes":
      "n1": "Kipisi is to cut or chop something into pieces: mi kipisi e kili is I cut the fruit."
      "n2": "It takes e before the thing cut, like any verb with an object."
    "examples":
      "mi kipisi e kili.": "I cut the fruit."
      "o kipisi e soko ni.": "Cut this mushroom."
  "tok-0651":
    "native": "mushroom; fungus"
    "notes":
      "n1": "Soko is a mushroom, or any fungus that grows on the ground."
      "n2": "A soko is eaten in soups: mi moku e soko is I eat mushroom."
    "examples":
      "soko li lete.": "The mushroom is cold."
      "mi moku e soko.": "I eat mushroom."
