schema: 1
id: "tok-en-first-words"
kind: "layer"
core: "tok-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
description: "Seven words to start with: toki, pona, mi, sina, ala, nimi and sona. Their first sentences are in the sentences deck of this unit. Not yet checked by a Toki Pona speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "tok-0001":
    native: "language; speech"
    notes:
      "verb": "Also the verb to talk: mi toki means I speak."
      "greet": "In toki!, said as a greeting, it means hello."
    examples:
      "mi toki pona.": "I speak Toki Pona."
      "sina toki.": "You speak."
    senses:
      "talk": { native: "to talk, to speak" }
  "tok-0002":
    native: "good"
    alt_native: ["fine", "well"]
    notes:
      "use": "Good, fine or simple. Toki pona, the name of the language, means something like good speech."
      "after": "A modifier comes after the word it describes: nimi pona is a good name."
    examples:
      "mi pona.": "I am fine."
      "nimi pona.": "A good name."
    senses:
      "simple": { native: "simple, peaceful" }
  "tok-0003":
    native: "I"
    alt_native: ["me"]
    notes:
      "we": "Also we. Toki Pona makes no split between an inclusive we (with you) and an exclusive one (without you): mi covers both."
    examples:
      "mi sona.": "I know."
      "mi pona.": "I am fine."
  "tok-0004":
    native: "you"
    notes:
      "plural": "No separate plural: sina can mean you, one person, or you all."
      "sound": "Sounds almost like sona, to know: the vowel is i here, o there."
    examples:
      "sina toki.": "You speak."
      "sina sona.": "You know."
  "tok-0005":
    native: "no; not; nothing, zero"
    notes:
      "after": "It comes after the word it denies: pona ala is not good. Alone, ala is the answer no."
    examples:
      "sina pona ala.": "You are not well."
      "mi sona ala.": "I don't know."
  "tok-0006":
    native: "word; name"
    notes:
      "name": "Also a name: nimi mi is my name. Nouns never change, so nimi can mean a word or words."
    examples:
      "nimi pona.": "A good name."
      "nimi sina.": "Your name."
  "tok-0007":
    native: "to know; to understand"
    notes:
      "noun": "Also a noun: knowledge, or a skill."
    examples:
      "sina sona.": "You know."
      "mi sona toki pona.": "I know Toki Pona."
    senses:
      "knowledge": { native: "knowledge; a skill" }
