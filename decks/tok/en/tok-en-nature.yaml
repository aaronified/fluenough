  "name": "English"
"name": "Nature: plants and land"
"description": "Two words for nature: kasi (a plant, grass, a leaf) and ma (land, earth, outdoors, a country). Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0506":
    "native": "plant; grass; tree; leaf"
    "notes":
      "n1": "Kasi is any plant that grows: grass, a tree, or a leaf."
      "n2": "Kasi is a noun, so a describing word comes after it: kasi suli is a big tree."
    "examples":
      "kasi lili li lon.": "A small plant is here."
      "mi lukin e kasi.": "I look at the plant."
  "tok-0507":
    "native": "land; earth; country; outdoors"
    "notes":
      "n1": "Ma is the land under your feet, the earth, a country, or the outdoors: ma mi is my country."
      "n2": "Ma is also a place in the open air, away from a building."
    "examples":
      "ma mi li suli.": "My country is big."
      "mi tawa ma.": "I go outdoors."
