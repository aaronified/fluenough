"name": "Arts: mirrors, epics and blocks"
"description": "Three words for the arts: jasima (a mirror, to reflect), epiku (epic, grand) and leko (a block, a square, a step). Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0680":
    "native": "mirror; to reflect; reflection"
    "notes":
      "n1": "Jasima is a mirror, or the act of reflecting: jasima ni is this mirror."
      "n2": "A mirror shows what looks at it, so it is used with lukin: jasima li lukin e mi is the mirror looks at me."
    "examples":
      "jasima ni li suli.": "This mirror is big."
      "o lukin e jasima.": "Look at the mirror."
  "tok-0681":
    "native": "epic; heroic; grand"
    "notes":
      "n1": "Epiku is grand, heroic, or epic, as in a long story of great deeds."
      "n2": "It comes after the thing it describes: musi epiku is an epic game."
    "examples":
      "musi epiku li suli.": "The epic game is big."
      "tomo epiku li lon.": "The grand building is here."
  "tok-0682":
    "native": "block; square; step; stair"
    "notes":
      "n1": "Leko is a block, a square, or a step: leko suli is a big block."
      "n2": "A leko can be built into a tower: mi pali e leko is I make a block."
    "examples":
      "leko li lon anpa.": "The block is below."
      "mi pali e leko.": "I make a block."
