  "name": "English"
"name": "Stacked la in sentences"
"description": "Sentences that stack several contexts, each with la: a time, then a place, then the sentence. Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0697":
    "native": "In the past, in this building, I slept."
    "confusables":
      "w1":
        "why": "Li starts a predicate. It does not set a context, so the sentence needs la before its main clause."
      "w2":
        "why": "Nimi ('word') is spelled much like ni ('this'), so it is easy to mix up, but it is a different word."
  "tok-0698":
    "native": "In this land, they eat."
    "confusables":
      "w1":
        "why": "O gives a command or calls someone. It does not set a context, so this sentence needs la before its main clause."
      "w2":
        "why": "Tomo ('house') is related in meaning to ma ('land'), but it is not the same word and changes what the sentence says."
  "tok-0699":
    "native": "Later, in this land, I go."
    "confusables":
      "w1":
        "why": "Li starts a predicate. It does not set a context, so the sentence needs la before its main clause."
      "w2":
        "why": "Sina ('you') is also a pronoun, but this sentence has mi ('I') in its place."
  "tok-0700":
    "native": "Now, this person works."
    "confusables":
      "w1":
        "why": "O gives a command or calls someone. It does not set a context, so this sentence needs la before its main clause."
      "w2":
        "why": "Suno ('sun') is also a word about time, but this sentence has tenpo ('time') in its place."
  "tok-0701":
    "native": "In the past, I looked at the picture."
    "confusables":
      "w1":
        "why": "Li starts a predicate. It does not set a context, so the sentence needs la before its main clause."
      "w2":
        "why": "Sina ('you') is also a pronoun, but this sentence has mi ('I') in its place."
  "tok-0702":
    "native": "In this land, in this building, they sleep."
    "confusables":
      "w1":
        "why": "O gives a command or calls someone. It does not set a context, so this sentence needs la before its main clause."
      "w2":
        "why": "Sina ('you') is also a pronoun, but this sentence has ona ('he, she, it or they') in its place."
  "tok-0703":
    "native": "At night, I eat."
    "confusables":
      "w1":
        "why": "Li starts a predicate. It does not set a context, so the sentence needs la before its main clause."
      "w2":
        "why": "Sina ('you') is also a pronoun, but this sentence has mi ('I') in its place."
  "tok-0704":
    "native": "In the past, when you came, I played."
    "confusables":
      "w1":
        "why": "O gives a command or calls someone. It does not set a context, so this sentence needs la before its main clause."
      "w2":
        "why": "Pilin ('to feel') is also a feeling word, but this sentence has musi ('fun') in its place."
