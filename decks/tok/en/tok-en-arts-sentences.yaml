"tags":
- "unreviewed"
"cards":
  "tok-0683":
    "native": "This mirror is good."
    "confusables":
      "w1":
        "why": "Mi ('I') is also a pronoun, but this sentence has ni ('this') in its place."
      "w2":
        "why": "Ike means 'bad', the opposite of pona ('good'). Mixing them up would say the reverse of this sentence."
  "tok-0684":
    "native": "I make a small block."
    "confusables":
      "w1":
        "why": "Kiwen ('stone') is related in meaning to leko ('block'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Mute means 'many', the opposite of lili ('small'). Mixing them up would say the reverse of this sentence."
  "tok-0685":
    "native": "A big block is up high."
    "confusables":
      "w1":
        "why": "Kiwen ('stone') is related in meaning to leko ('block'), but it is not the same word and changes what the sentence says."
      "w2":
        "why": "Lili means 'small', the opposite of suli ('big'). Mixing them up would say the reverse of this sentence."
  "tok-0686":
    "native": "The epic game is strange."
    "confusables":
      "w1":
        "why": "Nasin ('way') is spelled much like nasa ('strange'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Mu ('an animal's sound') is spelled much like musi ('fun'), so it is easy to mix up, but it is a different word."
  "tok-0687":
    "native": "Look at this mirror."
    "confusables":
      "w1":
        "why": "Moku ('to eat') is also an everyday action, but this sentence has lukin ('to look') in its place."
      "w2":
        "why": "Sama ('same') is related in meaning to jasima ('mirror'), but it is not the same word and changes what the sentence says."
  "tok-0688":
    "native": "A person makes a block."
    "confusables":
      "w1":
        "why": "Lape ('to sleep') is also an everyday action, but this sentence has pali ('to make') in its place."
      "w2":
        "why": "Supa ('table') is related in meaning to leko ('block'), but it is not the same word and changes what the sentence says."
  "tok-0689":
    "native": "The epic building is big."
    "confusables":
      "w1":
        "why": "Telo ('water') is spelled much like tomo ('house'), so it is easy to mix up, but it is a different word."
      "w2":
        "why": "Wawa ('strong') is related in meaning to epiku ('epic'), but it is not the same word and changes what the sentence says."
  "tok-0690":
    "native": "The epic picture is good."
    "confusables":
      "w1":
        "why": "Kiwen ('stone') is also a kind of object, but this sentence has sitelen ('picture') in its place."
      "w2":
        "why": "Suli ('big') is related in meaning to epiku ('epic'), but it is not the same word and changes what the sentence says."
