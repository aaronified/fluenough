"cards":
  "tok-0683":
    "native": "This mirror is good."
    "confusables":
      "w1":
        "why": "Jasima is a mirror: the sentence says this mirror is good."
      "w2":
        "why": "Pona is good: it describes the mirror."
  "tok-0684":
    "native": "I make a small block."
    "confusables":
      "w1":
        "why": "Pali is to make: it is what I do to the block."
      "w2":
        "why": "Leko is a block: it is the thing made, after e."
  "tok-0685":
    "native": "A big block is up high."
    "confusables":
      "w1":
        "why": "Leko is a block: the sentence says where the big block is."
      "w2":
        "why": "Sewi is above: it says the place of the block."
  "tok-0686":
    "native": "The epic game is strange."
    "confusables":
      "w1":
        "why": "Musi is a game: the sentence says the epic game is strange."
      "w2":
        "why": "Epiku is epic: it describes the game, and nasa is the opinion."
  "tok-0687":
    "native": "Look at this mirror."
    "confusables":
      "w1":
        "why": "Lukin is to look: the command says look at the mirror."
      "w2":
        "why": "Jasima is a mirror: it is the thing to look at, after e."
  "tok-0688":
    "native": "A person makes a block."
    "confusables":
      "w1":
        "why": "Pali is to make: the person makes the block."
      "w2":
        "why": "Jan is a person: the one who makes it."
  "tok-0689":
    "native": "The epic building is big."
    "confusables":
      "w1":
        "why": "Tomo is a building: it is the thing that is epic and big."
      "w2":
        "why": "Epiku is grand: it describes the building."
  "tok-0690":
    "native": "The epic picture is good."
    "confusables":
      "w1":
        "why": "Sitelen is a picture: it is the thing described as epic."
      "w2":
        "why": "Epiku is epic: it is the description, not the picture."
