schema: 1
id: "tok-en-family-sentences"
kind: "layer"
core: "tok-family-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Family in sentences"
description: "Sentences with the family words, in the basic order: subject, li, predicate, e, object. A word about a person or a group comes first, and mi or ona after it says whose. Not yet checked by a Toki Pona speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "tok-0163":
    native: "My mother sees you."
    confusables:
      "w1": { why: "Kama (to come) would say my mother comes, not that she sees you." }
      "w2": { why: "Sona (to know) would say my mother knows you, not that she sees you." }
  "tok-0164":
    native: "She is my wife."
    confusables:
      "w1": { why: "Mije (man) would say they are my husband, not my wife." }
      "w2": { why: "Mama (parent) would say they are my parent, not my wife." }
  "tok-0165":
    native: "The man goes."
    confusables:
      "w1": { why: "Meli (woman) would say the woman goes, not the man." }
      "w2": { why: "Kama (to come) would say the man comes, not that he goes." }
  "tok-0166":
    native: "This group is good."
    confusables:
      "w1": { why: "Suli (big) would say the group is big, not good." }
      "w2": { why: "Ike (bad) would say the group is bad, not good." }
  "tok-0167":
    native: "I love this group."
    confusables:
      "w1": { why: "Lukin (to see) would say I see this group, not that I love it." }
      "w2": { why: "Jo (to have) would say I have this group, not that I love it." }
  "tok-0168":
    native: "Are you beside me, or not?"
    confusables:
      "w1": { why: "Tawa (to go) would ask whether you go beside me, not whether you are beside me." }
      "w2": { why: "Kama (to come) would ask whether you come beside me, not whether you are there." }
  "tok-0169":
    native: "Their mother does not come."
    confusables:
      "w1": { why: "Lape (to sleep) would say their mother does not sleep, not that she does not come." }
      "w2": { why: "Tawa (to go) would say their mother does not go, not that she does not come." }
  "tok-0170":
    native: "The woman eats bread."
    confusables:
      "w1": { why: "Lukin (to see) would say the woman sees bread, not that she eats it." }
      "w2": { why: "Jo (to have) would say the woman has bread, not that she eats it." }
