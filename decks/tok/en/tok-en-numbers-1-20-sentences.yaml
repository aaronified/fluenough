"core": "tok-numbers-1-20-sentences"
"native":
  "code": "en"
  "iso639_3": "eng"
  "name": "English"
"name": "Numbers in sentences"
"description": "Sentences that count and order things with wan, tu, luka and ale, and nanpa for the number. Not yet checked by a Toki Pona speaker: please report any mistake."
