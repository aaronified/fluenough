"tags":
- "unreviewed"
"cards":
  "tok-0216":
    "native": "I do not have one."
    "confusables":
      "w1":
        "why": "Tu (two) would say I do not have two, not that I do not have one."
      "w2":
        "why": "Luka (five) would say I do not have five, not that I do not have one."
  "tok-0217":
    "native": "They want two."
    "confusables":
      "w1":
        "why": "Wan (one) would say they want one, not two."
      "w2":
        "why": "Luka (five) would say they want five, not two."
  "tok-0218":
    "native": "I see five."
    "confusables":
      "w1":
        "why": "Wan (one) would say I see one, not five."
      "w2":
        "why": "Ale (all) would say I see everything, not five."
  "tok-0219":
    "native": "Everyone comes."
    "confusables":
      "w1":
        "why": "Jan (person) would say a person comes, not everyone."
      "w2":
        "why": "Tawa (to go) would say everyone goes, not everyone comes."
  "tok-0220":
    "native": "You are second."
    "confusables":
      "w1":
        "why": "Wan (one) would say you are first, not second."
      "w2":
        "why": "Mi (I) would say I am second, not you."
  "tok-0221":
    "native": "The five fruits are not sweet."
    "confusables":
      "w1":
        "why": "Tu (two) would say two fruits are not sweet, not five."
      "w2":
        "why": "Wan (one) would say one fruit is not sweet, not five."
  "tok-0222":
    "native": "Everything is here."
    "confusables":
      "w1":
        "why": "Tu (two) would say two things are here, not everything."
      "w2":
        "why": "Wan (one) would say one thing is here, not everything."
  "tok-0223":
    "native": "I know the second number."
    "confusables":
      "w1":
        "why": "Wan (one) would say I know the first number, not the second."
      "w2":
        "why": "Luka (five) would say I know the number five, not the second."
  "tok-0224":
    "native": "Counting: one, two, five, and many"
    "explanation": "The course's counting words. Count one, two and five; mute says many. Nanpa gives the order: first, second."
