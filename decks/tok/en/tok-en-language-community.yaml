"name": "The community: books and the dictionary"
"description": "Two words for the language's books: pu (the first book, and its words) and ku (the dictionary, and to use or interact with it). Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0742":
    "native": "the first book of toki pona; its word list"
    "notes":
      "n1": "Pu is the name of the first book of Toki Pona, and the words in it: pu li pona is the book is good."
      "n2": "Pu is also the word a speaker uses for the first book they learn from, so it is often named with the language itself."
    "examples":
      "mi lukin e pu.": "I look at the book pu."
      "pu li lon poki.": "The book is in the box."
  "tok-0743":
    "native": "the dictionary; to use or interact with"
    "notes":
      "n1": "Ku is the dictionary of the language, and it is also to use or interact with a thing: mi ku e ilo is I interact with the tool."
      "n2": "As a verb it takes e before the thing used: sina ku e pu is you use the book."
    "examples":
      "ku li suli.": "The dictionary is big."
      "mi kepeken e ku.": "I use the dictionary."
