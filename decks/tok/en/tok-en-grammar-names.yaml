  "slot_name": "form"
  "prompt": "{lemma} ({gloss}): {slot}"
  "slots":
    "name": "the name, after its head, with a capital"
    "in a sentence": "the name in a sentence"
  "entries":
    "jan": "person"
    "ma": "land"
    "toki": "language"
  "notes": "Names are the only capitals in Toki Pona. Head first, then the name: jan Ali li lon is Ali is here. A foreign name is changed to fit Toki Pona's sounds, so no name has a sound outside its syllables."
