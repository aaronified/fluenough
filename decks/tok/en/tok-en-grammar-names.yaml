"name": "Proper names after their head"
"license": "CC-BY-SA-4.0"
"description": "A name that is not Toki Pona is an unofficial word used after its head: jan Ali is a person called Ali, ma Inli a country called Inli, and toki Inli a language called Inli. The name has a capital, and it is adapted to Toki Pona's sounds and syllables. Not yet checked by a Toki Pona speaker: please report any mistake."
