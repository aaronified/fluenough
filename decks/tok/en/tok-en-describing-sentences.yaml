schema: 1
id: "tok-en-describing-sentences"
kind: "layer"
core: "tok-describing-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Describing things in sentences"
description: "Sentences with the eight describing words, in the same basic order as before: subject, li, predicate, e, object. The word that describes comes after the thing it describes. Not yet checked by a Toki Pona speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "tok-0127":
    native: "This thing is big."
    confusables:
      "w1": { why: "Lili (small) would say the thing is small, not big." }
      "w2": { why: "Ike (bad) would say the thing is bad, not big." }
  "tok-0128":
    native: "They are small."
    confusables:
      "w1": { why: "Suli (big) would say they are big, not small." }
      "w2": { why: "Sin (new) would say they are new, not small." }
  "tok-0129":
    native: "You see something new."
    confusables:
      "w1": { why: "Mi (I) would make the speaker the one who sees, not you." }
      "w2": { why: "Sona (to know) would say you know the new thing, not that you see it." }
  "tok-0130":
    native: "A strong person sleeps."
    confusables:
      "w1": { why: "Ike (bad) would say the person is bad, not strong." }
      "w2": { why: "Pona (good) would say the person is good, not strong." }
  "tok-0131":
    native: "Many people eat."
    confusables:
      "w1": { why: "Suli (big) would say the people are big, not many." }
      "w2": { why: "Kama (to come) would say many people come, not that they eat." }
  "tok-0132":
    native: "The different thing is not good."
    confusables:
      "w1": { why: "Sama (same) would say the thing is the same, not different." }
      "w2": { why: "Ike (bad) would say the thing is bad, not merely not good." }
  "tok-0133":
    native: "The same thing is not bad."
    confusables:
      "w1": { why: "Pona (good) would say the thing is good, not merely not bad." }
      "w2": { why: "Ante (different) would say the thing is different, not the same." }
  "tok-0134":
    native: "I want the big thing."
    confusables:
      "w1": { why: "Lili (small) would say I want the small thing, not the big one." }
      "w2": { why: "Lukin (to see) would say I see the thing, not that I want it." }
