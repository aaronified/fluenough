id: "tok-en-food"
kind: "layer"
core: "tok-food"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Food and drink"
description: "Five words for food and drink: telo (water, a drink), kili (fruit), suwi (sweet), seli (fire, heat) and lete (cold). Not yet checked by a Toki Pona speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "tok-0192":
    native: "water; liquid; drink"
    notes:
      "water": "Telo is water, and the word for a liquid to drink. Mi moku e telo is I drink water: moku, to eat, is also used for drinking, with e before the drink."
      "drink": "Telo on its own names a drink, so mi wile e telo is I want a drink."
    examples:
      "telo li lete.": "The water is cold."
      "mi moku e telo.": "I drink water."
  "tok-0193":
    native: "fruit"
    notes:
      "fruit": "Kili is fruit, the sort that grows on a plant and is eaten. As with all food, it comes after e when eaten: mi moku e kili."
      "eat": "Kili ni li suwi is This fruit is sweet. Ni (this) comes after the word it points at: kili ni is this fruit."
    examples:
      "kili ni li suwi.": "This fruit is sweet."
      "mi moku e kili.": "I eat fruit."
  "tok-0194":
    native: "sweet"
    notes:
      "sweet": "Suwi describes a taste, and comes after the word it describes, as every describing word does: kili suwi is sweet fruit."
      "after": "Moku ni li suwi is This food is sweet. The describing word takes li in front of it, as pona does."
    examples:
      "kili suwi li pona.": "Sweet fruit is good."
      "moku ni li suwi.": "This food is sweet."
  "tok-0195":
    native: "fire; heat"
    antonyms:
      "lete": "cold"
    notes:
      "fire": "Seli is fire, or the heat from one. Seli li suli is The fire is big."
      "see": "Mi lukin e seli is I see the fire. Seli is a thing, so it comes after e."
    examples:
      "seli li suli.": "The fire is big."
      "mi lukin e seli.": "I see the fire."
  "tok-0196":
    native: "cold"
    notes:
      "cold": "Lete is cold: the opposite of seli, which is fire or heat."
      "after": "Moku ni li lete is This food is cold; kili li lete is The fruit is cold. The describing word comes after its noun, and li comes before it."
    examples:
      "moku ni li lete.": "This food is cold."
      "kili li lete.": "The fruit is cold."
