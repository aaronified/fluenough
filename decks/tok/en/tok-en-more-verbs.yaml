"name": "More verbs"
"description": "Four more verbs: moli (to die, to kill), utala (to fight), kalama (to make a sound, to read aloud) and alasa (to hunt, to search). Not yet checked by a Toki Pona speaker: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "tok-0556":
    "native": "to die; to kill; dead"
    "notes":
      "n1": "Moli is to die, or to kill: kili li moli is the fruit has gone bad, and mi moli e akesi is I kill the reptile."
      "n2": "Moli takes e before the thing killed, as any verb takes its object."
    "examples":
      "kili li moli.": "The fruit has died."
      "kala li moli.": "The fish dies."
  "tok-0557":
    "native": "to fight; to battle; to compete"
    "notes":
      "n1": "Utala is to fight, in a battle or a game: ona li utala is they fight."
      "n2": "It can be a verb with e before the foe, as in utala e jan, to fight a person."
    "examples":
      "ona li utala.": "They fight."
      "mi utala ala.": "I do not fight."
  "tok-0558":
    "native": "to make a sound; to read aloud; a noise"
    "notes":
      "n1": "Kalama is to make a sound, to read aloud, or a noise: waso li kalama is the bird sings."
      "n2": "With e, it reads aloud: mi kalama e lipu is I read the paper aloud."
    "examples":
      "waso li kalama.": "The bird makes a sound."
      "mi kalama e lipu.": "I read the paper aloud."
  "tok-0559":
    "native": "to hunt; to search; to look for"
    "notes":
      "n1": "Alasa is to hunt, or to search for a thing: mi alasa e kili is I look for the fruit."
      "n2": "Alasa is looking actively, where lukin is only looking at what is there."
    "examples":
      "mi alasa e kili.": "I look for the fruit."
      "soweli li alasa e kala.": "The animal hunts fish."
