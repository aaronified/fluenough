  - id: "tok-wedding-invite"
    title: "Wedding invitation"
    theme: "relationships"
    sentences:
      - text: "jan pona o!"
      - text: "mi en ona li wile e tenpo olin."
      - text: "tenpo olin li lon tomo suli."
      - text: "tenpo olin li tenpo kama."
      - text: "jan mute li kama lon tomo suli."
      - text: "o kama tawa tomo suli!"
      - text: "ona li olin e sina."
