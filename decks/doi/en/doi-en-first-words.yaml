          "भ्रा": "brother"
          "घरे": "at home"
          "च": "is"
      "भ्रा, आ!":
        native: "Brother, come!"
        bases:
          "भ्रा": "brother"
          "आ": "come"
  "doi-0121":
    native: "sister"
    notes:
      "n1": "Any sister, older or younger."
    examples:
