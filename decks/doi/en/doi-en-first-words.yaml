schema: 1
id: "doi-en-first-words"
kind: "layer"
core: "doi-first-words"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "First words"
license: "CC-BY-SA-4.0"
description: "The first words of Dogri: the pronouns, yes and no, the numbers 1 to 10, the family, and the everyday words for food, house, name and time. Not yet checked by a Dogri speaker: please report any mistake."
cards:
  "doi-0101":
    native: "yes"
    notes:
      "n1": "Wiktionary gives हां (hāṁ) for Dogri 'yes'. Sources: Wiktionary (Dogri entries); Grierson, Linguistic Survey of India, vol. I part 2 (comparative vocabulary) and vol. IX part 1 (the Dogra specimens)."
    examples:
      "हां, पानी।":
        native: "Yes, water."
        bases:
          "हां": "yes"
          "पानी": "water"
      "हां, घर।":
        native: "Yes, the house."
        bases:
          "हां": "yes"
          "घर": "house"
  "doi-0102":
    native: "no; not"
    notes:
      "n1": "The negative. The Survey's text has 'nahi'. The form नेईं (neīn) is not yet checked. Sources: Wiktionary (Dogri entries); Grierson, Linguistic Survey of India, vol. I part 2 (comparative vocabulary) and vol. IX part 1 (the Dogra specimens)."
    examples:
      "नेईं, मैं नेईं औना।":
        native: "No, I am not coming."
        bases:
          "नेईं": "not"
          "मैं": "I"
          "औना": "come"
  "doi-0103":
    native: "I"
    notes:
      "n1": "Wiktionary gives मैं (maiṁ) for Dogri 'I'. Sources: Wiktionary (Dogri entries); Grierson, Linguistic Survey of India, vol. I part 2 (comparative vocabulary) and vol. IX part 1 (the Dogra specimens)."
    examples:
      "मैं अते तुस।":
        native: "You and I."
        bases:
          "मैं": "I"
          "अते": "and"
          "तुस": "you"
      "मैं अते ओह्।":
        native: "He and I."
        bases:
          "मैं": "I"
          "अते": "and"
          "ओह्": "that"
  "doi-0104":
    native: "you (respectful)"
    notes:
      "n1": "The comparative vocabulary gives tus for 'you' (plural, and polite to one person). Sources: Wiktionary (Dogri entries); Grierson, Linguistic Survey of India, vol. I part 2 (comparative vocabulary) and vol. IX part 1 (the Dogra specimens)."
    examples:
      "तुस अते मैं।":
        native: "You and I."
        bases:
          "तुस": "you"
          "अते": "and"
          "मैं": "I"
      "तुस अते ओह्।":
        native: "You and he."
        bases:
          "तुस": "you"
          "अते": "and"
          "ओह्": "that"
  "doi-0105":
    native: "he; she"
    notes:
      "n1": "One word for he, she and that. Wiktionary lists ओह् (oh), the distal pronoun, with the halant-ha that Dogri uses for its high tone. The comparative vocabulary gives oh. Sources: Wiktionary (Dogri entries); Grierson, Linguistic Survey of India, vol. I part 2 (comparative vocabulary) and vol. IX part 1 (the Dogra specimens)."
    examples:
      "ओह् अते मैं।":
        native: "He and I."
        bases:
          "ओह्": "that"
          "अते": "and"
          "मैं": "I"
      "ओह् केह्?":
        native: "What is that?"
        bases:
          "ओह्": "that"
          "केह्": "what"
  "doi-0106":
    native: "we"
    notes:
      "n1": "Means 'we' for a group."
    examples:
      "असीं घर जाना।":
        native: "We are going home."
        bases:
          "असीं": "we"
          "घर": "home"
          "जाना": "go"
      "असीं डोगरे आं।":
        native: "We are Dogri."
        bases:
          "असीं": "we"
          "डोगरे": "Dogri"
          "आं": "are"
  "doi-0107":
    native: "they"
    notes:
      "n1": "The plural of ओह (oh) for a group."
    examples:
      "ओहना पढ़दे न।":
        native: "They study."
        bases:
          "ओहना": "they"
          "पढ़दे": "study"
          "न": "are"
      "ओहना नेपाली न।":
        native: "They are Nepali."
        bases:
          "ओहना": "they"
          "नेपाली": "Nepali"
          "न": "are"
  "doi-0108":
    native: "one"
    notes:
      "n1": "Wiktionary gives इक (ik) for 'one'. The doubled spelling इक्क (ikk) is not attested there. Sources: Wiktionary (Dogri entries); Grierson, Linguistic Survey of India, vol. I part 2 (comparative vocabulary) and vol. IX part 1 (the Dogra specimens)."
    examples:
      "इक घर।":
        native: "One house."
        bases:
          "इक": "one"
          "घर": "house"
      "इक पुत्तर।":
        native: "One son."
        bases:
          "इक": "one"
          "पुत्तर": "son"
  "doi-0109":
    native: "two"
    notes:
      "n1": "The Survey's comparative vocabulary gives do for Dogri 'two'. Sources: Wiktionary (Dogri entries); Grierson, Linguistic Survey of India, vol. I part 2 (comparative vocabulary) and vol. IX part 1 (the Dogra specimens)."
    examples:
      "दो घर।":
        native: "Two houses."
        bases:
          "दो": "two"
          "घर": "house"
      "दो पुत्तर।":
        native: "Two sons."
        bases:
          "दो": "two"
          "पुत्तर": "son"
  "doi-0110":
    native: "three"
    notes:
      "n1": "The comparative vocabulary gives trai for Dogri 'three'. Sources: Wiktionary (Dogri entries); Grierson, Linguistic Survey of India, vol. I part 2 (comparative vocabulary) and vol. IX part 1 (the Dogra specimens)."
    examples:
      "त्रै घर।":
        native: "Three houses."
        bases:
          "त्रै": "three"
          "घर": "house"
      "त्रै पुत्तर।":
        native: "Three sons."
        bases:
          "त्रै": "three"
          "पुत्तर": "son"
  "doi-0111":
    native: "four"
    notes:
      "n1": "The number 4."
    examples:
      "चार गिलास पानी।":
        native: "Four glases of water."
        bases:
          "चार": "four"
          "गिलास": "glass"
          "पानी": "water"
      "चार कप चाह।":
        native: "Four cups of tea."
        bases:
          "चार": "four"
          "कप": "cup"
          "चाह": "tea"
  "doi-0112":
    native: "five"
