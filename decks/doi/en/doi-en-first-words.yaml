        native: "That woman is a doctor."
        bases:
          "ओह्": "that"
          "जनानी": "woman"
          "डाक्टर": "doctor"
          "ऐ": "is"
  "doi-0125":
    native: "water"
    notes:
      "n1": "Wiktionary gives पानी (pānī) for Dogri 'water'. The sentences have no verb. Sources: Wiktionary (Dogri entries); Grierson, Linguistic Survey of India, vol. I part 2 (comparative vocabulary) and vol. IX part 1 (the Dogra specimens)."
    examples:
      "ऐह् पानी।":
        native: "This is water."
        bases:
          "ऐह्": "this"
          "पानी": "water"
      "पानी अते घर।":
        native: "Water and a house."
        bases:
          "पानी": "water"
          "अते": "and"
          "घर": "house"
  "doi-0126":
    native: "food; meal"
