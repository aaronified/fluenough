      "n1": "The comparative vocabulary gives nau for Dogri 'nine'. Sources: Wiktionary (Dogri entries); Grierson, Linguistic Survey of India, vol. I part 2 (comparative vocabulary) and vol. IX part 1 (the Dogra specimens)."
