        native: "Mum, give water."
        bases:
          "माँ": "mother"
          "पानी": "water"
          "दे": "give"
  "doi-0119":
    native: "father"
    notes:
      "n1": "Not yet checked: the Survey's Dogra specimen has baba and bapo ji for 'father'. पिता (pitā) जी (jī) is not attested there. Sources: Wiktionary (Dogri entries); Grierson, Linguistic Survey of India, vol. I part 2 (comparative vocabulary) and vol. IX part 1 (the Dogra specimens)."
    examples:
      "मेरे पिता जी मास्टर न।":
        native: "My father is a teacher."
        bases:
          "मेरे": "my"
          "पिता": "father"
          "जी": "respect"
          "मास्टर": "teacher"
          "न": "is"
      "पिता जी, पानी?":
        native: "Dad, water?"
        bases:
          "पिता": "father"
          "जी": "respect"
          "पानी": "water"
  "doi-0120":
    native: "brother"
