schema: 1
id: "doi-en-phrasebook"
kind: "layer"
core: "doi-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty phrases to say whole from the first day, before their words are taught: greetings and goodbye, thanks and sorry, asking for slower speech, asking for help and where the toilet is. Not yet checked by a Dogri speaker: please report any mistake."
license: "CC-BY-SA-4.0"
cards:
  "doi-0001":
    native: "hello; goodbye"
    notes:
      "n1": "The usual greeting, said with the palms pressed together."
    bases:
      "नमस्ते": "hello; goodbye"
  "doi-0002":
    native: "good morning"
    notes:
      "n1": "Said in the morning."
    bases:
      "शुभ प्रभात": "good morning"
  "doi-0003":
    native: "good evening"
    notes:
      "n1": "Said in the evening."
    bases:
      "शुभ संध्या": "good evening"
  "doi-0004":
    native: "good night"
    notes:
      "n1": "Said at bedtime. रात (rāt) is 'night'."
    bases:
      "शुभ रात": "good night"
  "doi-0005":
    native: "see you again"
    notes:
      "n1": "Literally 'we will meet again'. Said when leaving."
    bases:
      "फिरी मिलांगे": "see you again"
  "doi-0006":
    native: "please"
    notes:
      "n1": "Put before a request."
    bases:
      "मेहरबानी करियै": "please"
  "doi-0007":
    native: "thank you"
    notes:
      "n1": "Polite and common."
    bases:
      "धन्नवाद": "thank you"
  "doi-0008":
    native: "you're welcome; no problem"
    notes:
      "n1": "Literally 'there is no matter'. Said in reply to thanks."
    bases:
      "कोई गल्ल नेईं": "you're welcome; no problem"
  "doi-0009":
    native: "sorry"
    notes:
      "n1": "Said to say sorry."
    bases:
      "माफ करो": "sorry"
  "doi-0010":
    native: "excuse me"
    notes:
      "n1": "Literally 'please listen'. Said to get someone's attention."
    bases:
      "सुनो जी": "excuse me"
  "doi-0011":
    native: "I don't understand"
    notes:
      "n1": "Literally 'understanding has not come to me'."
    bases:
      "मिगी समझ नेईं आई": "I don't understand"
  "doi-0012":
    native: "I don't know Dogri"
    notes:
      "n1": "Put another language's name in place of डोगरी (ḍogrī)."
    bases:
      "मिगी डोगरी नेईं औंदी": "I don't know Dogri"
  "doi-0013":
    native: "please speak slowly"
    notes:
      "n1": "हौली (haulī) is 'slowly'."
    bases:
      "हौली बोलो": "please speak slowly"
  "doi-0014":
    native: "do you speak English?"
    notes:
      "n1": "Respectful."
    bases:
      "तुसेंगी अंग्रेजी बोलनी औंदी ऐ?": "do you speak English?"
  "doi-0015":
    native: "how are you?"
    notes:
      "n1": "Respectful."
    bases:
      "तुस किवें ओ?": "how are you?"
  "doi-0016":
    native: "I'm fine"
    notes:
      "n1": "The answer to how are you. ठीक (ṭhīk) is 'fine'."
    bases:
      "मैं ठीक आं": "I'm fine"
  "doi-0017":
    native: "what is your name?"
    notes:
      "n1": "Respectful. The answer is मेरा (merā) नां (nāṁ) ... ऐ (ai)."
    bases:
      "तुहाडा नां की ऐ?": "what is your name?"
  "doi-0018":
    native: "my name is ..."
    notes:
      "n1": "Put your name where the dots are."
    bases:
      "मेरा नां ... ऐ": "my name is ..."
  "doi-0019":
    native: "where is the toilet?"
    notes:
      "n1": "शौचालय (śauchālay) is 'toilet'."
    bases:
      "शौचालय कित्थें ऐ?": "where is the toilet?"
  "doi-0020":
    native: "help!"
    notes:
      "n1": "Shouted in an emergency."
    bases:
      "बचाओ!": "help!"
