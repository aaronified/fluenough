# The people behind the Vedic Sanskrit culture decks (wiki/Plan-Deck-Kinds-And-Topics.md, D5).
# Dates are the years of birth and death as the pages read on English Wikipedia and in the DNB; the Rishis are not here
# (the hymns are anonymous and no year is known). No pictures: none has a licence checked yet.
schema: 1
kind: "creators"
id: "creators-vsn"
language: "vsn"
license: "CC-BY-SA-4.0"
eras:
  - id: "rigvedic"
    name: { en: "The Rigvedic period" }
    from: -1500
    to: -1000
  - id: "vedic"
    name: { en: "The Vedic period" }
    from: -1500
    to: -500
  - id: "padapatha-fixing"
    name: { en: "The fixing of the pada text" }
    from: -600
    to: -500
  - id: "western-vedic-studies"
    name: { en: "Western Vedic philology" }
    from: 1849
    to: 1930
creators:
  - id: "vsn-max-muller"
    name:
      en: { text: "Friedrich Max Müller" }
    born: 1823
    died: 1900
    era: "western-vedic-studies"
    bio:
      en: "A German-born scholar at Oxford who edited the Rigveda with Sayana's commentary, in six volumes from 1849 to 1873."
  - id: "vsn-whitney"
    name:
      en: { text: "William Dwight Whitney" }
    born: 1827
    died: 1894
    era: "western-vedic-studies"
    bio:
      en: "An American scholar of Sanskrit and linguistics, whose Sanskrit Grammar is the main grammar source for Vedic in this course."
  - id: "vsn-macdonell"
    name:
      en: { text: "Arthur Anthony Macdonell" }
    born: 1854
    died: 1930
    era: "western-vedic-studies"
    bio:
      en: "A Sanskrit scholar, author of Vedic Mythology (1897), A History of Sanskrit Literature (1900) and Vedic Grammar (1910)."
  - id: "vsn-griffith"
    name:
      en: { text: "Ralph T. H. Griffith" }
    born: 1826
    died: 1906
    era: "western-vedic-studies"
    bio:
      en: "A translator who rendered the Rigveda into English; the translation was published at Benares in 1889 to 1892."
  - id: "vsn-lanman"
    name:
      en: { text: "Charles Rockwell Lanman" }
    born: 1850
    died: 1941
    era: "western-vedic-studies"
    bio:
      en: "An American Sanskritist who edited Whitney's Atharva-Veda Samhita, published in 1905."
  - id: "vsn-bloomfield"
    name:
      en: { text: "Maurice Bloomfield" }
    born: 1855
    died: 1928
    era: "western-vedic-studies"
    bio:
      en: "An American Sanskritist who translated Atharva-Veda hymns for the Sacred Books of the East (1897) and compiled A Vedic Concordance (1907)."
  - id: "vsn-monier-williams"
    name:
      en: { text: "Monier Monier-Williams" }
    born: 1819
    died: 1899
    era: "western-vedic-studies"
    bio:
      en: "A British Sanskrit scholar whose Sanskrit-English dictionary reached a second edition just before his death."
  - id: "vsn-muir"
    name:
      en: { text: "John Muir" }
    born: 1810
    died: 1882
    era: "western-vedic-studies"
    bio:
      en: "A Scottish scholar whose five-volume Original Sanskrit Texts was published from 1858 to 1870."
  - id: "vsn-roth"
    name:
      en: { text: "Rudolf von Roth" }
    born: 1821
    died: 1895
    era: "western-vedic-studies"
    bio:
      en: "A German scholar regarded as a founder of Vedic philology, co-author with Böhtlingk of a Sanskrit dictionary."
  - id: "vsn-bohtlingk"
    name:
      en: { text: "Otto von Böhtlingk" }
    born: 1815
    died: 1904
    era: "western-vedic-studies"
    bio:
      en: "A German Sanskritist, co-author with Roth of a Sanskrit-German dictionary."
  - id: "vsn-oldenberg"
    name:
      en: { text: "Hermann Oldenberg" }
    born: 1854
    died: 1920
    era: "western-vedic-studies"
    bio:
      en: "A German Indologist whose Vedic Hymns, part 2, is volume 46 of the Sacred Books of the East."
  - id: "vsn-geldner"
    name:
      en: { text: "Karl Friedrich Geldner" }
    born: 1852
    died: 1929
    era: "western-vedic-studies"
    bio:
      en: "A German Indologist known for editions and translations of the Vedic and Avestan texts."
