    bio:
      en: "Kalki Krishnamurthy was an Indian writer, journalist, poet, critic and independence activist who wrote in Tamil. His novel Sivagamiyin Sapatham ran in the magazine Kalki from 1944 to 1946."
  - id: "ta-a-p-nagarajan"
