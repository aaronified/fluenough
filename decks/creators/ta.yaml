# The people behind the Tamil culture decks (wiki/Plan-Deck-Kinds-And-Topics.md, D5). Dates are the years of birth and death, circa where the page read gives an estimate.
# Most works of the culture decks are ancient and anonymous in the validator's sense (no author with a death year), so only the creators of dated works are here.
# No pictures: none has a licence checked yet. Built from English Wikipedia pages read on 2026-11-23; the legacy items cite those pages.
