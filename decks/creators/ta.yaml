    bio:
      en: "B. R. Panthulu was an Indian film director, producer and actor, best known for films in Tamil, Kannada, Telugu and Hindi. He directed Veerapandiya Kattabomman."
  - id: "ta-c-v-sridhar"
    name:
      en: { text: "C. V. Sridhar" }
    born: 1933
    died: 2008
    bio:
      en: "C. V. Sridhar was an Indian screenwriter and film director who directed nearly 60 films in Tamil, Hindi and Telugu. He directed Kadhalikka Neramillai."
  - id: "ta-bharathiraja"
    name:
      en: { text: "Bharathiraja" }
    born: 1941
    died: 2026
    bio:
      en: "Bharathiraja, born Chinnasaamy Periyamaya Thevar, was an Indian film director, producer, screenwriter and actor who worked mainly in Tamil cinema. He directed Muthal Mariyathai."
  - id: "ta-mani-ratnam"
    name:
      en: { text: "Mani Ratnam" }
    born: 1956
    living: true
    bio:
      en: "Mani Ratnam is an Indian film director, producer and screenwriter who works mainly in Tamil cinema. He directed Mouna Ragam, Anjali, Nayakan and Roja."
  - id: "ta-bharathan"
    name:
      en: { text: "Bharathan" }
    born: 1946
    died: 1998
    bio:
      en: "Bharathan was a Kerala-born Indian filmmaker, artist and art director who helped found a new school of meaningful mainstream filmmaking in Malayalam cinema. He directed the Tamil film Thevar Magan."
  - id: "ta-m-sasikumar"
    name:
      en: { text: "M. Sasikumar" }
