creators:
  - id: "ta-arunagirinathar"
    name:
      en: { text: "Arunagirinathar" }
    born: { year: 1370, circa: true }
    died: { year: 1450, circa: true }
    era: "vijayanagara-nayak"
    bio:
      en: "Arunagirinathar was a Tamil Shaiva saint-poet of the 14th century. The Czech scholar Kamil Zvelebil places his life between about 1370 and about 1450, according to English Wikipedia. He wrote the Tiruppugazh, a book of poems in praise of Murugan."
    legacy:
      text: { en: "English Wikipedia says the Tiruppugazh songs lay forgotten in manuscript until the nineteenth century, and that musicians have set them to music since." }
      items:
        - { kind: "other", text: { en: "V. T. Subramania Pillai gathered the songs from manuscripts and published them in two volumes, the first in 1894 and the second in 1901." }, year: 1894, source: { url: "https://en.wikipedia.org/wiki/Arunagirinathar", accessed: "2026-11-23" } }
        - { kind: "music", text: { en: "Musicians such as Kancheepuram Naina Pillai set Tiruppugazh songs to music, and A. S. Raghavan set more than 500 of them in over 100 ragas." }, source: { url: "https://en.wikipedia.org/wiki/Arunagirinathar", accessed: "2026-11-23" } }
  - id: "ta-samuel-vedanayagam-pillai"
    name:
      en: { text: "Samuel Vedanayagam Pillai" }
    born: 1826
    died: 1889
    era: "colonial"
    bio:
      en: "Samuel Vedanayagam Pillai was an Indian civil servant, Tamil poet, novelist and social worker. He is remembered for Prathapa Mudaliar Charithram, published in 1879 and called the first modern Tamil novel on English Wikipedia."
    legacy:
      text: { en: "English Wikipedia says his works were nationalised in 2007, singers still choose his songs for concerts, and a hall and statue in his honour are being built at Mayiladuthurai." }
      items:
        - { kind: "other", text: { en: "The Government of Tamil Nadu nationalised his works in 2007." }, year: 2007, source: { url: "https://en.wikipedia.org/wiki/Samuel_Vedanayagam_Pillai", accessed: "2026-11-23" } }
        - { kind: "music", text: { en: "His songs are still a popular choice among singers in concerts, and he is known for his contribution to Carnatic music." }, source: { url: "https://en.wikipedia.org/wiki/Samuel_Vedanayagam_Pillai", accessed: "2026-11-23" } }
        - { kind: "commemoration", text: { en: "The foundation stone of an auditorium and statue in his honour at Mayiladuthurai was laid on 5 October 2023." }, year: 2023, source: { url: "https://en.wikipedia.org/wiki/Samuel_Vedanayagam_Pillai", accessed: "2026-11-23" } }
  - id: "ta-subramania-bharati"
    name:
      en: { text: "Subramania Bharati" }
    born: 1882
    died: 1921
    era: "colonial"
    bio:
      en: "Subramania Bharati, also called Bharathiyar, was a Tamil poet, social reformer and fighter for Indian freedom and women's rights, as the Wikidata description says. He was born in 1882 and died in 1921 (Wikidata). The Tamil Wikisource pages give Kuyil Pattu, Pappa Pattu and Kannan Pattu as his works."
    legacy:
      text: { en: "English Wikipedia lists a stamp, an award, a restored house and a film among the ways Bharati is remembered." }
      items:
        - { kind: "commemoration", text: { en: "India Post issued a commemorative stamp on Bharati in 1960." }, year: 1960, source: { url: "https://en.wikipedia.org/wiki/Subramania_Bharati", accessed: "2026-11-23" } }
        - { kind: "commemoration", text: { en: "The Subramanyam Bharti Award for contributions to literature was constituted in 1987 and is given each year by the Ministry of Human Resource Development of the Government of India." }, year: 1987, source: { url: "https://en.wikipedia.org/wiki/Subramania_Bharati", accessed: "2026-11-23" } }
        - { kind: "place", text: { en: "The Government of Tamil Nadu bought and renovated the house in Chennai where he spent his last years in 1993 and named it Bharati Illam." }, year: 1993, source: { url: "https://en.wikipedia.org/wiki/Subramania_Bharati", accessed: "2026-11-23" } }
        - { kind: "film", text: { en: "The Tamil film Bharathi, made in 2000 by Gnana Rajasekaran on his life, won the National Film Award for Best Feature Film in Tamil." }, year: 2000, source: { url: "https://en.wikipedia.org/wiki/Subramania_Bharati", accessed: "2026-11-23" } }
  - id: "ta-r-krishnan"
