    died: 1196
    era: "western-chalukya"
    bio:
      en: "Basavanna was a twelfth-century poet, philosopher and chief minister. He taught devotion to Shiva in vachanas, short poems in plain Kannada."
    legacy:
      text: { en: "He rejected gender or social discrimination, superstitions and rituals." }
      items:
