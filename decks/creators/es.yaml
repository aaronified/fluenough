        - { kind: "other", text: { en: "The Spanish Wikipedia article lists La barraca (1898) and Los cuatro jinetes del Apocalipsis (1916) among his best-known novels." }, source: { url: "https://es.wikipedia.org/wiki/Vicente_Blasco_Ib%C3%A1%C3%B1ez", accessed: "2026-11-15" } }
  - id: "es-gonzalo-de-berceo"
    name:
      es: { text: "Gonzalo de Berceo", ipa: "ɡonˈθalo de beɾˈθeo" }
      en: { text: "Gonzalo de Berceo" }
    born: { year: 1196, circa: true }
    died: { year: 1264, circa: true }
    era: "edad-media"
    bio:
      en: "Gonzalo de Berceo was a Castilian poet and monk of the monastery of San Millán de la Cogolla. He lived in the 1200s; the years of his birth and death are not certain. He wrote saints' lives and the Milagros de Nuestra Señora, stories of miracles of the Virgin Mary."
    legacy:
      text: { en: "He is one of the main poets of the mester de clerecía, a learned form of verse in Castilian." }
      items:
        - { kind: "other", text: { en: "The Spanish Wikipedia article names the Milagros de Nuestra Señora as his main work." }, source: { url: "https://es.wikipedia.org/wiki/Gonzalo_de_Berceo", accessed: "2026-11-15" } }
  - id: "es-jose-marti"
    name:
      es: { text: "José Martí", ipa: "xoˈse maɾˈti" }
      en: { text: "José Martí" }
    born: 1853
    died: 1895
    era: "siglo-xix"
    bio:
      en: "José Martí was a poet and writer from Cuba. He wrote short, simple poems, which he collected in the book Versos sencillos. He died in 1895."
    legacy:
      text: { en: "His book Versos sencillos was first published in New York in 1891." }
      items:
        - { kind: "other", text: { en: "The Spanish Wikipedia article on the book gives the 1891 New York edition as its first publication." }, source: { url: "https://es.wikipedia.org/wiki/Versos_sencillos", accessed: "2026-11-15" } }
  - id: "es-jose-hernandez"
    name:
      es: { text: "José Hernández", ipa: "xoˈse eɾˈnandeθ" }
      en: { text: "José Hernández" }
    born: 1834
    died: 1886
    era: "siglo-xix"
    bio:
      en: "José Hernández was a writer from Argentina. He wrote the long poem El gaucho Martín Fierro, about a gaucho, a herdsman of the plains. He died in 1886."
    legacy:
      text: { en: "The poem was published in two parts, in 1872 and 1879." }
      items:
        - { kind: "other", text: { en: "The Spanish Wikipedia article on the poem gives 1872 for the first part and 1879 for the second part, La vuelta de Martín Fierro." }, source: { url: "https://es.wikipedia.org/wiki/Mart%C3%ADn_Fierro", accessed: "2026-11-15" } }
  - id: "es-francisco-de-quevedo"
    name:
      es: { text: "Francisco de Quevedo", ipa: "fɾanˈθisko de keˈbedo" }
      en: { text: "Francisco de Quevedo" }
    born: 1580
    died: 1645
    era: "siglo-de-oro"
    bio:
      en: "Francisco de Quevedo was a Spanish poet, writer and satirist of the Golden Age. He was born in Madrid in 1580 and died in 1645."
    legacy:
      text: { en: "One of his sonnets may be the best of his poems." }
      items:
        - { kind: "other", text: { en: "The Spanish Wikipedia article says that the sonnet which begins Cerrar podrá mis ojos may be his best." }, source: { url: "https://es.wikipedia.org/wiki/Francisco_de_Quevedo", accessed: "2026-11-15" } }
  - id: "es-gustavo-adolfo-becquer"
    name:
      es: { text: "Gustavo Adolfo Bécquer", ipa: "ɡusˈtabo aˈdolfo ˈbekeɾ" }
      en: { text: "Gustavo Adolfo Bécquer" }
    born: 1836
    died: 1870
    era: "siglo-xix"
    bio:
      en: "Gustavo Adolfo Bécquer was a Spanish poet and writer of the nineteenth century, born in Seville. He wrote short poems, the Rimas, and legends. He died in 1870, at the age of 34."
    legacy:
      text: { en: "His Rimas were first collected in a book published after his death, in 1871." }
      items:
        - { kind: "other", text: { en: "The Spanish Wikipedia article says that his friends published his works after his death, in less than a year, in an edition of 1871." }, source: { url: "https://es.wikipedia.org/wiki/Gustavo_Adolf%C3%B3_B%C3%A9cquer", accessed: "2026-11-15" } }
  - id: "es-mariano-jose-de-larra"
    name:
      es: { text: "Mariano José de Larra" }
      en: { text: "Mariano José de Larra" }
    born: 1809
    died: 1837
    era: "siglo-xix"
    bio:
      en: "Mariano José de Larra was a Spanish writer and journalist of the nineteenth century. He was born in Madrid in 1809 and died there in 1837."
    legacy:
      text: { en: "Vuelva usted mañana is one of his famous articles." }
      items:
        - { kind: "other", text: { en: "The Spanish Wikipedia article says that famous articles include Vuelva usted mañana." }, source: { url: "https://es.wikipedia.org/wiki/Mariano_Jos%C3%A9_de_Larra", accessed: "2026-11-16" } }
  - id: "es-jose-de-espronceda"
    name:
      es: { text: "José de Espronceda" }
      en: { text: "José de Espronceda" }
    born: 1808
    died: 1842
    era: "siglo-xix"
    bio:
      en: "José de Espronceda was a Spanish writer of the Romantic period. He was born in Almendralejo in 1808 and died in Madrid in 1842."
    legacy:
      text: { en: "He is considered the most representative poet of early Romanticism in Spain." }
      items:
        - { kind: "other", text: { en: "The Spanish Wikipedia article calls him the most representative poet of the early Romanticism in Spain." }, source: { url: "https://es.wikipedia.org/wiki/Jos%C3%A9_de_Espronceda", accessed: "2026-11-16" } }
  - id: "es-ruben-dario"
    name:
      es: { text: "Rubén Darío" }
      en: { text: "Rubén Darío" }
    born: 1867
    died: 1916
    era: "siglo-xix"
    bio:
      en: "Rubén Darío was a poet from Nicaragua who wrote in Spanish. He was born in 1867 and died in León in 1916."
    legacy:
      text: { en: "He is seen as the greatest representative of modernismo in Spanish-language literature." }
      items:
        - { kind: "other", text: { en: "The Spanish Wikipedia article calls him the greatest representative of modernismo in Spanish-language literature." }, source: { url: "https://es.wikipedia.org/wiki/Rub%C3%A9n_Dar%C3%ADo", accessed: "2026-11-16" } }
  - id: "es-esteban-echeverria"
    name:
      es: { text: "Esteban Echeverría" }
      en: { text: "Esteban Echeverría" }
    born: 1805
    died: 1851
    era: "siglo-xix"
    bio:
      en: "Esteban Echeverría was an Argentine writer and poet. He was born in Buenos Aires in 1805 and died in Montevideo in 1851."
    legacy:
      text: { en: "He wrote El matadero, La cautiva and Dogma socialista." }
      items:
        - { kind: "other", text: { en: "The Spanish Wikipedia article lists El matadero among his works, with La cautiva and Dogma socialista." }, source: { url: "https://es.wikipedia.org/wiki/Esteban_Echeverr%C3%ADa", accessed: "2026-11-16" } }
  - id: "es-andres-bello"
    name:
      es: { text: "Andrés Bello" }
      en: { text: "Andrés Bello" }
    born: 1781
    died: 1865
    era: "siglo-xix"
    bio:
      en: "Andrés Bello was a Venezuelan humanist, poet and scholar. He died in Santiago, Chile, in 1865."
    legacy:
      text: { en: "He wrote on language and law as well as poetry." }
      items:
        - { kind: "other", text: { en: "The Spanish Wikipedia article calls him a humanist, jurist, poet, philologist, diplomat and educator." }, source: { url: "https://es.wikipedia.org/wiki/Andr%C3%A9s_Bello", accessed: "2026-11-16" } }
  - id: "es-leopoldo-alas-clarin"
    name:
      es: { text: "Leopoldo Alas" }
      en: { text: "Leopoldo Alas" }
    born: 1852
    died: 1901
    era: "siglo-xix"
    bio:
      en: "Leopoldo Alas, known as Clarín, was a Spanish writer and law professor. He was born in Zamora in 1852 and died in Oviedo in 1901."
    legacy:
      text: { en: "His novel La Regenta is called his masterpiece." }
      items:
        - { kind: "other", text: { en: "The Spanish Wikipedia article calls La Regenta, published 1884 to 1885, his masterpiece." }, source: { url: "https://es.wikipedia.org/wiki/Leopoldo_Alas", accessed: "2026-11-16" } }
  - id: "es-miguel-hernandez"
    name:
      es: { text: "Miguel Hernández", ipa: "miˈɡel eɾˈnandeθ" }
      en: { text: "Miguel Hernández" }
    born: 1910
    died: 1942
    era: "siglo-xx"
    bio:
      en: "Miguel Hernández was a Spanish poet and playwright. He wrote during the Spanish Civil War, was held in prison, and died of tuberculosis in 1942."
    legacy:
      text: { en: "Several singers have set his poems to music, among them Joan Manuel Serrat." }
      items:
        - { kind: "music", text: { en: "The Spanish Wikipedia article on Nanas de la cebolla says that in 1972 Joan Manuel Serrat released a record that sets several of his poems to music." }, source: { url: "https://es.wikipedia.org/wiki/Nanas_de_la_cebolla", accessed: "2026-11-16" } }
  - id: "es-alfonsina-storni"
    name:
      es: { text: "Alfonsina Storni", ipa: "alfonˈsina ˈstoɾni" }
      en: { text: "Alfonsina Storni" }
    born: 1892
    died: 1938
    era: "siglo-xx"
    bio:
      en: "Alfonsina Storni was a Swiss-Argentine poet and writer. She was born in 1892 and died in 1938."
    legacy:
      text: { en: "Her books of poems were published in Buenos Aires from 1916 onwards." }
      items:
        - { kind: "other", text: { en: "The Spanish Wikisource author page lists La inquietud del rosal (1916), and later books of poems such as Irremediablemente (1919)." }, source: { url: "https://es.wikisource.org/wiki/Autor:Alfonsina_Storni", accessed: "2026-11-16" } }
  - id: "es-benito-perez-galdos"
    name:
      es: { text: "Benito Pérez Galdós", ipa: "beˈnito ˈpeɾeθ ɡalˈdos" }
      en: { text: "Benito Pérez Galdós" }
    born: 1843
    died: 1920
    era: "siglo-xix"
    bio:
      en: "Benito Pérez Galdós was a Spanish novelist and playwright, born in Las Palmas de Gran Canaria in 1843. He wrote many novels about Spanish society, such as Doña Perfecta, published in 1876. He died in Madrid in 1920."
    legacy:
      text: { en: "Some of his novels were made into films, including Doña Perfecta." }
      items:
        - { kind: "film", year: 1977, text: { en: "The Spanish Wikipedia article on Doña Perfecta says the novel was made into films in Mexico in 1950 and in Spain in 1977." }, source: { url: "https://es.wikipedia.org/wiki/Do%C3%B1a_Perfecta", accessed: "2026-11-16" } }
  - id: "es-jorge-isaacs"
    name:
      es: { text: "Jorge Isaacs", ipa: "ˈxoɾxe iˈsaaks" }
      en: { text: "Jorge Isaacs" }
    born: 1837
    died: 1895
    era: "siglo-xix"
    bio:
      en: "Jorge Isaacs was a Colombian novelist, poet and politician, born in Cali in 1837. He is best known for María, a love story set in Colombia that was first published in 1867. He died in 1895."
    legacy:
      text: { en: "His novel María was made into a film in 1922 and was adapted for television in 1991." }
      items:
        - { kind: "film", year: 1922, text: { en: "The Spanish Wikipedia article on the novel links to a film called María, from 1922, based on it." }, source: { url: "https://es.wikipedia.org/wiki/Mar%C3%ADa_(novela)", accessed: "2026-11-16" } }
        - { kind: "adaptation", year: 1991, text: { en: "The Spanish Wikipedia article on the novel says that in 1991 it was adapted for television by Gabriel García Márquez and directed by Lisandro Duque Naranjo." }, source: { url: "https://es.wikipedia.org/wiki/Mar%C3%ADa_(novela)", accessed: "2026-11-16" } }
  - id: "es-juan-valera"
    name:
      es: { text: "Juan Valera", ipa: "xwan baˈleɾa" }
      en: { text: "Juan Valera" }
    born: 1824
    died: 1905
    era: "siglo-xix"
    bio:
      en: "Juan Valera was a Spanish novelist, poet, diplomat and politician, born in Cabra in 1824. His novel Pepita Jiménez was published in 1874. He died in Madrid in 1905."
    legacy:
      text: { en: "A monument to Valera stands on the Paseo de Recoletos in Madrid." }
      items:
        - { kind: "commemoration", text: { en: "The Spanish Wikipedia article on Valera says that his nephew, the sculptor Coullaut Valera, was in charge of making the monument to him on the Paseo de Recoletos in Madrid." }, source: { url: "https://es.wikipedia.org/wiki/Juan_Valera", accessed: "2026-11-16" } }
  - id: "es-gertrudis-gomez-de-avellaneda"
    name:
      es: { text: "Gertrudis Gómez de Avellaneda", ipa: "xeɾˈtɾudis ˈɡomeθ de abeʝaˈneda" }
      en: { text: "Gertrudis Gómez de Avellaneda" }
    born: 1814
    died: 1873
    era: "siglo-xix"
    bio:
      en: "Gertrudis Gómez de Avellaneda was a poet and novelist, born in Puerto Príncipe, in Cuba, in 1814. She left Cuba in 1836 and died in Madrid in 1873. Her sonnet Al partir is a farewell to Cuba."
    legacy:
      text: { en: "A poetry prize bears her name, and it was set up in 2010." }
      items:
        - { kind: "other", year: 2010, text: { en: "The Spanish Wikipedia article on Avellaneda says that the Asociación Cultural y Literaria La Avellaneda set up the Premio de Poesía Gertrudis Gómez de Avellaneda in 2010." }, source: { url: "https://es.wikipedia.org/wiki/Gertrudis_G%C3%B3mez_de_Avellaneda", accessed: "2026-11-16" } }
