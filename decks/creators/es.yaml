creators:
  - id: "es-jorge-manrique"
    name:
      es: { text: "Jorge Manrique", ipa: "ˈxoɾxe manˈrike" }
      en: { text: "Jorge Manrique" }
    born: { year: 1440, circa: true }
    died: 1479
    era: "edad-media"
    bio:
      en: "Jorge Manrique was a Castilian poet and soldier from the noble Manrique family. He lived in the second half of the 1400s. He is known for one long poem written after his father died. The year of his birth is not certain."
    legacy:
      text: { en: "His poem for his father is one of the best-known works of Castilian verse." }
      items:
        - { kind: "music", text: { en: "The Coplas have been set to music in several versions, which the Spanish Wikipedia article lists." }, source: { url: "https://es.wikipedia.org/wiki/Coplas_por_la_muerte_de_su_padre", accessed: "2026-11-14" } }
  - id: "es-miguel-de-cervantes"
    name:
      es: { text: "Miguel de Cervantes", ipa: "miˈɡel de θeɾˈbantes" }
      en: { text: "Miguel de Cervantes" }
    born: { year: 1547, circa: true }
    died: 1616
    era: "siglo-de-oro"
    bio:
      en: "Miguel de Cervantes was a Spanish novelist, poet and soldier of the Golden Age. He wrote Don Quijote in two parts, the first in 1605. He died in Madrid in 1616."
    legacy:
      text: { en: "Don Quijote is one of the most translated books in the world." }
      items:
        - { kind: "other", text: { en: "The number of editions and translations of Don Quijote is surpassed only by the Bible, the Spanish Wikipedia article says." }, source: { url: "https://es.wikipedia.org/wiki/Miguel_de_Cervantes", accessed: "2026-11-14" } }
  - id: "es-juan-de-la-cruz"
    name:
      es: { text: "Juan de la Cruz", ipa: "xwan de la kɾuθ" }
      en: { text: "John of the Cross" }
    born: 1542
    died: 1591
    era: "siglo-de-oro"
    bio:
      en: "John of the Cross was a Spanish friar, mystic and poet of the Golden Age. With Saint Teresa of Avila he helped found the Discalced Carmelites. He died in 1591."
    legacy:
      text: { en: "The Church has named him a Doctor of the Church, a title for teachers of the faith." }
      items:
        - { kind: "other", text: { en: "The Spanish Wikipedia article lists the title Doctor de la Iglesia among his honours." }, source: { url: "https://es.wikipedia.org/wiki/Juan_de_la_Cruz", accessed: "2026-11-14" } }
  - id: "es-pedro-calderon-de-la-barca"
    name:
      es: { text: "Pedro Calderón de la Barca", ipa: "ˈpedɾo kaldeˈɾon de la ˈbaɾka" }
      en: { text: "Pedro Calderón de la Barca" }
    born: 1600
    died: 1681
    era: "siglo-de-oro"
    bio:
      en: "Pedro Calderón de la Barca was a Spanish playwright, poet and priest of the Golden Age. He wrote La vida es sueño. He was born in Madrid in 1600 and died in 1681."
    legacy:
      text: { en: "Madrid honoured him with a marble statue in 1880." }
      items:
        - { kind: "commemoration", year: 1880, text: { en: "A marble statue by Juan Figueras y Vila was placed in Madrid's Plaza de Santa Ana in 1880, in his memory, the Spanish Wikipedia article says." }, source: { url: "https://es.wikipedia.org/wiki/Pedro_Calder%C3%B3n_de_la_Barca", accessed: "2026-11-14" } }
