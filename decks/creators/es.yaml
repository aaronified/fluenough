        - { kind: "other", text: { en: "The Spanish Wikipedia article gives 1630 as the year El burlador de Sevilla was published." }, source: { url: "https://es.wikipedia.org/wiki/El_burlador_de_Sevilla", accessed: "2026-11-14" } }
