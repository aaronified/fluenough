        - { kind: "other", year: 1703, text: { en: "Sonezaki Shinju was first staged in 1703 at the Takemoto-za theatre in Osaka." }, source: { url: "https://ja.wikipedia.org/wiki/%E6%9B%BE%E6%A0%B9%E5%B4%8E%E5%BF%83%E4%B8%AD", accessed: "2026-11-14" } }
  - id: "ja-ishikawa-takuboku"
