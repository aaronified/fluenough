    died: 1725
    era: "edo"
    bio:
      en: "Chikamatsu Monzaemon was a playwright of puppet theatre (joruri) and kabuki in the Edo period, from a samurai family in Echizen. He wrote Sonezaki Shinju, a play about lovers who die together."
    legacy:
      text: { en: "Sonezaki Shinju was first staged in 1703 at the Takemoto-za theatre in Osaka." }
