    died: 1707
    era: "edo"
    bio:
      en: "Takarai Kikaku was a haiku poet of the Edo period and a disciple of Basho, known for his wit."
    legacy:
      text: { en: "A kabuki play tells how his haiku, written the night before the Ako raid, was answered by a samurai." }
