        - { kind: "adaptation", text: { en: "The kabuki play Matsura no Taiko tells the story of his haiku on the night before the Ako raid and the reply of Otake Gengo." }, source: { url: "https://ja.wikipedia.org/wiki/%E5%AE%9D%E4%BA%95%E5%85%B6%E8%A7%92", accessed: "2026-11-14" } }
