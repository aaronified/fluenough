      en: "Ishikawa Takuboku was a tanka and poetry writer of the Meiji period, from Iwate. He wrote short, plain poems about his hard life in Tokyo and Hokkaido, and he died of tuberculosis at the age of 26."
    legacy:
      text: { en: "His first tanka collection, A Handful of Sand, was printed in 1910, and it made him known as a tanka poet." }
