        - { kind: "other", text: { en: "The English Wikipedia article says he tried to shift the emphasis of Marathi literature from a spiritual to a narrative style of composition." }, source: { url: "https://en.wikipedia.org/wiki/Eknath", accessed: "2026-11-16" } }
        - { kind: "other", text: { en: "The English Wikipedia article says he introduced a new form of devotional melodies called Bharood." }, source: { url: "https://en.wikipedia.org/wiki/Eknath", accessed: "2026-11-16" } }
