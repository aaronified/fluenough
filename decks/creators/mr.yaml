      text: { en: "He is remembered as the founder of the Samarth sect and as a contemporary of Tukaram." }
      items:
        - { kind: "other", text: { en: "The Marathi Wikisource author page names him as the founder of the Samarth sect." }, source: { url: "https://mr.wikisource.org/wiki/%E0%A4%B8%E0%A4%BE%E0%A4%B9%E0%A4%BF%E0%A4%A4%E0%A5%8D%E0%A4%AF%E0%A4%BF%E0%A4%95%3A%E0%A4%B8%E0%A4%AE%E0%A4%B0%E0%A5%8D%E0%A4%A5_%E0%A4%B0%E0%A4%BE%E0%A4%AE%E0%A4%A6%E0%A4%BE%E0%A4%B8_%E0%A4%B8%E0%A5%8D%E0%A4%B5%E0%A4%BE%E0%A4%AE%E0%A5%80", accessed: "2026-11-15" } }
        - { kind: "other", text: { en: "The Marathi Wikisource author page calls him a contemporary of the saint-poet Tukaram." }, source: { url: "https://mr.wikisource.org/wiki/%E0%A4%B8%E0%A4%BE%E0%A4%B9%E0%A4%BF%E0%A4%A4%E0%A5%8D%E0%A4%AF%E0%A4%BF%E0%A4%95%3A%E0%A4%B8%E0%A4%AE%E0%A4%B0%E0%A5%8D%E0%A4%A5_%E0%A4%B0%E0%A4%BE%E0%A4%AE%E0%A4%A6%E0%A4%BE%E0%A4%B8_%E0%A4%B8%E0%A5%8D%E0%A4%B5%E0%A4%BE%E0%A4%AE%E0%A5%80", accessed: "2026-11-15" } }
  - id: "mr-sane-guruji"
