    bio:
      en: "Eknath (c. 1533 to c. 1599) was a Marathi saint, philosopher and poet from Paithan, known for the Eknathi Bhagavata and the Bhavartha Ramayana."
    legacy:
      text: { en: "He composed the Bhavartha Ramayana and the Eknathi Bhagavata, and he argued for the worth of Marathi as a literary language." }
