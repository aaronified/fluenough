# The people behind the Marathi culture 1 passages (wiki/Deck-Format.md, Creators; D5, D5b).
# Dates are the years of birth and death as the mr.wikisource and en.wikipedia pages read; an uncertain year is {year, circa: true}.
schema: 1
kind: "creators"
id: "creators-mr"
language: "mr"
license: "CC-BY-SA-4.0"
eras:
  - id: "sant-kavya"
    name: { mr: "संतकाव्य काळ", en: "Age of the saint-poets" }
    reading: { mr: "santakāvya" }
    from: 1250
    to: 1700
  - id: "modern-period"
    name: { mr: "आधुनिक काळ", en: "Modern period" }
    reading: { mr: "ādhunik kāḷ" }
    from: 1800
    to: 1955
creators:
  - id: "mr-dnyaneshwar"
    name:
      mr: { text: "ज्ञानेश्वर", reading: "dnyāneśvar", ipa: "d̪ɲaneʃʋər" }
      en: { text: "Dnyaneshwar" }
    born: { year: 1275, circa: true }
    died: 1296
    era: "sant-kavya"
    bio:
      en: "Dnyaneshwar was a 13th-century Marathi saint, poet and philosopher, who wrote the Dnyaneshwari, a commentary on the Bhagavad Gita in Marathi, in 1290."
    legacy:
      text: { en: "Varkari devotees still carry his padukas in a palanquin each year, and the Dnyaneshwari is a central text of the Varkari sect." }
      items:
        - { kind: "festival", text: { en: "Varkari devotees carry the padukas (sandals) of Dnyaneshwar in a palanquin from Alandi to Pandharpur on the annual Wari pilgrimage in Ashadh." }, source: { url: "https://en.wikipedia.org/wiki/Dnyaneshwar", accessed: "2026-11-15" } }
        - { kind: "film", year: 1940, text: { en: "A 1940 Marathi film, Sant Dnyaneshwar, was a biopic of his life." }, source: { url: "https://en.wikipedia.org/wiki/Dnyaneshwar", accessed: "2026-11-15" } }
        - { kind: "other", text: { en: "The Dnyaneshwari became a fundamental text of the Varkari sect." }, source: { url: "https://en.wikipedia.org/wiki/Dnyaneshwar", accessed: "2026-11-15" } }
        - { kind: "other", text: { en: "The Dnyaneshwari has been translated into Sanskrit, Hindi, Kannada, Tamil and English, and into 21 other languages." }, source: { url: "https://mr.wikisource.org/wiki/%E0%A4%9C%E0%A5%8D%E0%A4%9E%E0%A4%BE%E0%A4%A8%E0%A5%87%E0%A4%B6%E0%A5%8D%E0%A4%B5%E0%A4%B0%E0%A5%80", accessed: "2026-11-15" } }
  - id: "mr-tukaram"
    name:
      mr: { text: "तुकाराम", reading: "tukārām", ipa: "t̪ukaram" }
      en: { text: "Tukaram" }
    born: { year: 1598, circa: true }
    died: { year: 1650, circa: true }
    era: "sant-kavya"
    bio:
      en: "Tukaram was a Marathi saint-poet whose devotional abhangs are collected in the Tukaram Gatha."
    legacy:
      text: { en: "His abhangs are read as guidance for everyday life, and the first modern printed edition of the Gatha appeared in 1869." }
      items:
        - { kind: "other", text: { en: "The Gatha is guidance given in aphoristic form on the many dealings of daily life, and a great commentary on life, according to its Wikisource page." }, source: { url: "https://mr.wikisource.org/wiki/%E0%A4%A4%E0%A5%81%E0%A4%95%E0%A4%BE%E0%A4%B0%E0%A4%BE%E0%A4%AE_%E0%A4%97%E0%A4%BE%E0%A4%A5%E0%A4%BE", accessed: "2026-11-15" } }
        - { kind: "other", year: 1869, text: { en: "The first modern printed edition of the Gatha appeared in 1869, in the Indu Prakash." }, source: { url: "https://en.wikipedia.org/wiki/Tukaram", accessed: "2026-11-15" } }
  - id: "mr-samarth-ramdas"
    name:
      mr: { text: "समर्थ रामदास", reading: "samarth rāmdās", ipa: "səmərt̪ʰ ramd̪as" }
      en: { text: "Samarth Ramdas" }
    born: { year: 1608, circa: true }
    died: { year: 1682, circa: true }
    era: "sant-kavya"
    bio:
      en: "Samarth Ramdas, born Narayan Suryaji Thosar, was a Marathi poet and the founder of the Samarth sect; the Manache Shlok is among his works."
    legacy:
      text: { en: "He is remembered as the founder of the Samarth sect and as a contemporary of Tukaram." }
      items:
        - { kind: "other", text: { en: "The Marathi Wikisource author page names him as the founder of the Samarth sect." }, source: { url: "https://mr.wikisource.org/wiki/%E0%A4%B8%E0%A4%BE%E0%A4%B9%E0%A4%BF%E0%A4%A4%E0%A5%8D%E0%A4%AF%E0%A4%BF%E0%A4%95%3A%E0%A4%B8%E0%A4%AE%E0%A4%B0%E0%A5%8D%E0%A4%A5_%E0%A4%B0%E0%A4%BE%E0%A4%AE%E0%A4%A6%E0%A4%BE%E0%A4%B8_%E0%A4%B8%E0%A5%8D%E0%A4%B5%E0%A4%BE%E0%A4%AE%E0%A5%80", accessed: "2026-11-15" } }
        - { kind: "other", text: { en: "The Marathi Wikisource author page calls him a contemporary of the saint-poet Tukaram." }, source: { url: "https://mr.wikisource.org/wiki/%E0%A4%B8%E0%A4%BE%E0%A4%B9%E0%A4%BF%E0%A4%A4%E0%A5%8D%E0%A4%AF%E0%A4%BF%E0%A4%95%3A%E0%A4%B8%E0%A4%AE%E0%A4%B0%E0%A5%8D%E0%A4%A5_%E0%A4%B0%E0%A4%BE%E0%A4%AE%E0%A4%A6%E0%A4%BE%E0%A4%B8_%E0%A4%B8%E0%A5%8D%E0%A4%B5%E0%A4%BE%E0%A4%AE%E0%A5%80", accessed: "2026-11-15" } }
  - id: "mr-sane-guruji"
    name:
      mr: { text: "साने गुरुजी", reading: "sāne guruji", ipa: "sane ɡurudʒi" }
      en: { text: "Sane Guruji" }
    born: 1899
    died: 1950
    era: "modern-period"
    bio:
      en: "Sane Guruji, Pandurang Sadashiv Sane, was a Marathi writer whose compilation Stri-Jeevan, printed in 1940, gathers women's ovi songs."
    legacy:
      text: { en: "His compilation Stri-Jeevan, printed in 1940, gathers women's ovi songs in four sections." }
      items:
        - { kind: "other", year: 1940, text: { en: "Stri-Jeevan, printed in 1940, is transcribed on Marathi Wikisource from the book of women's ovi songs he compiled." }, source: { url: "https://mr.wikisource.org/wiki/%E0%A4%B8%E0%A5%8D%E0%A4%A4%E0%A5%8D%E0%A4%B0%E0%A5%80-%E0%A4%9C%E0%A5%80%E0%A4%B5%E0%A4%A8", accessed: "2026-11-15" } }
        - { kind: "other", text: { en: "The English Wikipedia article gives his lifetime as 1899 to 1950." }, source: { url: "https://en.wikipedia.org/wiki/Sane_Guruji", accessed: "2026-11-15" } }
  - id: "mr-jyotirao-phule"
    name:
      mr: { text: "जोतिराव फुले", reading: "jotirāv phule", ipa: "dzot̪iraʋ pʰule" }
      en: { text: "Jyotirao Phule" }
    born: 1827
    died: 1890
    era: "modern-period"
    bio:
      en: "Jyotirao Phule (1827 to 1890) was a Marathi writer whose powada on Shivaji dates from June 1869."
    legacy:
      text: { en: "His powada on Shivaji, in the traditional ballad form, is printed on Marathi Wikisource." }
      items:
        - { kind: "other", year: 1869, text: { en: "The English Wikipedia article lists his powada on Shivaji, dated June 1869." }, source: { url: "https://en.wikipedia.org/wiki/Jyotirao_Phule", accessed: "2026-11-15" } }
        - { kind: "other", text: { en: "The Marathi Wikisource page for the powada attributes it to him by category only." }, source: { url: "https://mr.wikisource.org/wiki/%E0%A4%9B%E0%A4%A4%E0%A5%8D%E0%A4%B0%E0%A4%AA%E0%A4%A4%E0%A4%BF_%E0%A4%B6%E0%A4%BF%E0%A4%B5%E0%A4%BE%E0%A4%9C%E0%A5%80_%E0%A4%B0%E0%A4%BE%E0%A4%9C%E0%A5%87_%E0%A4%AD%E0%A5%8B%E0%A4%B8%E0%A4%B2%E0%A5%87_%E0%A4%AF%E0%A4%BE%E0%A4%82%E0%A4%9A%E0%A4%BE_%E0%A4%AA%E0%A4%B5%E0%A4%BE%E0%A4%A1%E0%A4%BE", accessed: "2026-11-15" } }
  - id: "mr-bahinabai-chaudhari"
    name:
      mr: { text: "बहिणाबाई चौधरी", reading: "bahiṇābāi caudhri", ipa: "bəɦiɳabai tsəud̪ʱri" }
      en: { text: "Bahinabai Chaudhari" }
    born: 1880
    died: 1951
    era: "modern-period"
    bio:
      en: "Bahinabai Chaudhari (1880 to 1951) was a Marathi poet who wrote in the ovi metre."
    legacy:
      text: { en: "Her poems were first published in 1952 as Bahinabainchi Gani." }
      items:
        - { kind: "other", year: 1952, text: { en: "Her poems were first published in 1952 as Bahinabainchi Gani, according to the English Wikipedia article." }, source: { url: "https://en.wikipedia.org/wiki/Bahinabai_Chaudhari", accessed: "2026-11-15" } }
  - id: "mr-keshavsut"
    name:
      mr: { text: "केशवसुत", reading: "keśvsut", ipa: "keʃʋsut̪" }
      en: { text: "Keshavsut" }
    born: 1866
    died: 1905
    era: "modern-period"
    bio:
      en: "Keshavsut, Krishnaji Keshav Damle (1866 to 1905), was a Marathi poet whose poems are printed on Marathi Wikisource."
    legacy:
      text: { en: "His collections date from 1893 to 1905, and his poems are printed on Marathi Wikisource." }
      items:
        - { kind: "other", year: 1893, text: { en: "The collection Tutari was published in 1893, according to the English Wikipedia article." }, source: { url: "https://en.wikipedia.org/wiki/Keshavsut", accessed: "2026-11-15" } }
        - { kind: "other", year: 1898, text: { en: "The collection Nava Shipai was published in 1898, according to the English Wikipedia article." }, source: { url: "https://en.wikipedia.org/wiki/Keshavsut", accessed: "2026-11-15" } }
        - { kind: "other", year: 1905, text: { en: "The collection Gofan Keli Chan was published in 1905, according to the English Wikipedia article." }, source: { url: "https://en.wikipedia.org/wiki/Keshavsut", accessed: "2026-11-15" } }
  - id: "mr-bhaskar-ramchandra-tambe"
    name:
      mr: { text: "भास्कर रामचंद्र तांबे", reading: "bhāskar rāmcandra tāmbe", ipa: "bʱaskər ramtsənd̪rə t̪ambe" }
      en: { text: "Bhaskar Ramchandra Tambe" }
    born: {year: 1873, circa: true}
    died: 1941
    era: "modern-period"
    bio:
      en: "Bhaskar Ramchandra Tambe (died 1941) was a Marathi poet whose poem Jan Palbhar Mhanatil, Haay Haay is printed on Marathi Wikisource."
    legacy:
      text: { en: "His poem Jan Palbhar Mhanatil, Haay Haay is printed on Marathi Wikisource." }
      items:
        - { kind: "other", text: { en: "The Marathi Wikisource page prints the opening couplet of the poem." }, source: { url: "https://mr.wikisource.org/wiki/%E0%A4%9C%E0%A4%A8_%E0%A4%AA%E0%A4%B3%E0%A4%AD%E0%A4%B0_%E0%A4%AE%E0%A5%8D%E0%A4%B9%E0%A4%A3%E0%A4%A4%E0%A5%80%E0%A4%B2%2C_%E0%A4%B9%E0%A4%BE%E0%A4%AF_%E0%A4%B9%E0%A4%BE%E0%A4%AF", accessed: "2026-11-15" } }
