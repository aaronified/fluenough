# The people behind the Telugu recommended works (wiki/Deck-Format.md, Recommendations; D5).
# Dates are the years of birth and death, from each person's Wikipedia article. No pictures: none has a licence checked yet.
# Vemana's death year is from Wikidata; English Wikipedia gives only c. 1652 and Telugu Wikipedia c. 1367-1478.
schema: 1
kind: "creators"
id: "creators-te"
language: "te"
license: "CC-BY-SA-4.0"
eras:
  - id: "kakatiya"
    name: { te: "కాకతీయ కాలం", en: "Kakatiya period" }
    reading: { te: "kākatīya kālaṁ" }
    from: 1083
    to: 1323
  - id: "vijayanagara"
    name: { te: "విజయనగర కాలం", en: "Vijayanagara period" }
    reading: { te: "vijayanagara kālaṁ" }
    from: 1336
    to: 1646
  - id: "nayaka"
    name: { te: "నాయక కాలం", en: "Nayaka period" }
    reading: { te: "nāyaka kālaṁ" }
    from: 1500
    to: 1800
  - id: "colonial"
    name: { te: "వలస కాలం", en: "Colonial period" }
    reading: { te: "valasa kālaṁ" }
    from: 1800
    to: 1947
  - id: "twentieth-century"
    name: { te: "ఇరవయ్యవ శతాబ్దం", en: "Twentieth century" }
    reading: { te: "iravayyava śatābdaṁ" }
    from: 1900
    to: 2000
creators:
  - id: "te-k-viswanath"
    name:
      en: { text: "K. Viswanath" }
    born: 1930
    died: 2023
    bio:
      en: "K. Viswanath was an Indian film director, screenwriter, lyricist and actor who worked mainly in Telugu cinema. He directed the films Shankarabharanam, Sagara Sangamam and Swathi Muthyam."
  - id: "te-s-s-rajamouli"
    name:
      en: { text: "S. S. Rajamouli" }
    born: 1973
    living: true
    bio:
      en: "S. S. Rajamouli is an Indian film director and screenwriter who works in Telugu cinema. He directed Baahubali: The Beginning, RRR and Eega."
  - id: "te-tharun-bhascker"
    name:
      en: { text: "Tharun Bhascker" }
    born: 1988
    living: true
    bio:
      en: "Tharun Bhascker is an Indian film director, actor and screenwriter who works in Telugu cinema. He wrote and directed Pelli Choopulu."
  - id: "te-nag-ashwin"
    name:
      en: { text: "Nag Ashwin" }
    born: 1986
    living: true
    bio:
      en: "Nag Ashwin is an Indian film director and screenwriter known for his work in Telugu cinema. He directed Mahanati."
  - id: "te-butchi-babu"
    name:
      en: { text: "Butchi Babu" }
    born: 1916
    died: 1967
    bio:
      en: "Butchi Babu, also known as Sivaraju Venkata Subbarao, was an Indian short story writer, novelist and painter who worked in Telugu literature. His novel Chivaraku Migiledi is his best-known work."
  - id: "te-chalam"
    name:
      en: { text: "Gudipati Venkatachalam" }
    born: 1894
    died: 1979
    bio:
      en: "Gudipati Venkatachalam, known as Chalam, was an Indian Telugu-language writer and philosopher. He wrote the novel Maidanam, written in 1927."
  - id: "te-satyam-sankaramanchi"
    name:
      en: { text: "Satyam Sankaramanchi" }
    born: 1937
    died: 1987
    bio:
      en: "Satyam Sankaramanchi was an Indian storyteller who wrote in Telugu. He wrote the story collection Amaravati Kathalu, set in the village of Amaravati near Guntur."
  - id: "te-viswanatha-satyanarayana"
    name:
      en: { text: "Viswanatha Satyanarayana" }
    born: 1895
    died: 1976
    bio:
      en: "Viswanatha Satyanarayana was a Telugu writer of poems, novels, plays and short stories. He wrote the novel Veyipadagalu, and he received the Jnanpith Award."
  - id: "te-k-v-reddy"
    name:
      en: { text: "K. V. Reddy" }
    born: 1912
    died: 1972
    bio:
      en: "K. V. Reddy, full name Kadiri Venkata Reddy, was an Indian film director, screenwriter and producer known for his work in Telugu cinema. He directed the fantasy film Pathala Bhairavi."
  - id: "te-gurajada-apparao"
    name:
      en: { text: "Gurajada Apparao" }
    born: 1862
    died: 1915
    era: "colonial"
    bio:
      en: "Gurajada Apparao, full name Gurajada Venkata Apparao, was an Indian playwright, poet and writer known for his works in Telugu. He wrote the play Kanyasulkam in 1892."

    legacy:
      text: { en: "His play Kanyasulkam and his patriotic song Desamunu Preminchumanna are still widely known in Telugu." }
      items:
        - { kind: "other", text: { en: "The English Wikipedia article says Kanyasulkam is considered the greatest play in the Telugu language." }, source: { url: "https://en.wikipedia.org/wiki/Gurajada_Apparao", accessed: "2026-11-15" } }
        - { kind: "music", year: 1910, text: { en: "In 1910 he wrote the patriotic song Desamunu Preminchumanna, which the same article calls widely known." }, source: { url: "https://en.wikipedia.org/wiki/Gurajada_Apparao", accessed: "2026-11-15" } }

  - id: "te-shankarambadi-sundarachari"
    name:
      en: { text: "Shankarambadi Sundarachari" }
    born: 1914
    died: 1977
    bio:
      en: "Shankarambadi Sundarachari was a Telugu writer. He wrote the words of Maa Telugu Talliki, the state song of Andhra Pradesh."
  - id: "te-tallapaka-annamacharya"
    name:
      en: { text: "Tallapaka Annamacharya" }
    born: 1408
    died: 1503
    era: "vijayanagara"
    bio:
      en: "Tallapaka Annamacharya, also called Annamayya, was a Telugu composer and Hindu saint. He wrote devotional songs in praise of Venkateswara, a form of Vishnu."
    legacy:
      text: { en: "He is called the grandfather of Telugu songwriting in Telugu literature." }
      items:
        - { kind: "other", text: { en: "The English Wikipedia article says that Telugu literature calls him the grandfather of Telugu songwriting, and that he is the earliest known Indian musician to use this song form." }, source: { url: "https://en.wikipedia.org/wiki/Annamacharya", accessed: "2026-11-15" } }
  - id: "te-tyagaraja"
    name:
      en: { text: "Tyagaraja" }
    born: 1767
    died: 1847
    era: "colonial"
    bio:
      en: "Tyagaraja was a Carnatic composer and singer. He wrote hundreds of devotional songs, mostly in Telugu, in praise of the god Rama."
    legacy:
      text: { en: "He is one of the three great composers of Carnatic music." }
      items:
        - { kind: "other", text: { en: "The English Wikipedia article says that Tyagaraja, with Syama Sastri and Muthuswami Dikshitar, is regarded as the Trinity of Carnatic music." }, source: { url: "https://en.wikipedia.org/wiki/Tyagaraja", accessed: "2026-11-15" } }
  - id: "te-bhadrachala-ramadasu"
    name:
      en: { text: "Bhadrachala Ramadasu" }
    born: { year: 1620, circa: true }
    died: 1688
    era: "nayaka"
    bio:
      en: "Bhadrachala Ramadasu, also called Kancharla Gopanna, was a devotee of Rama and a poet and composer. He lived in the seventeenth century."
    legacy:
      text: { en: "He is remembered as a famous classical composer of the Telugu classical era." }
      items:
        - { kind: "other", text: { en: "The English Wikipedia article calls him a famous classical composer of the Telugu classical era and a devotee of Rama." }, source: { url: "https://en.wikipedia.org/wiki/Bhadrachala_Ramadasu", accessed: "2026-11-15" } }
  - id: "te-kshetrayya"
    name:
      en: { text: "Kshetrayya" }
    born: { year: 1600, circa: true }
    died: { year: 1680, circa: true }
    era: "nayaka"
    bio:
      en: "Kshetrayya was a Telugu poet who wrote short devotional love songs about the god Krishna in the seventeenth century."
    legacy:
      text: { en: "He is credited with more than four thousand compositions, though only a handful survive." }
      items:
        - { kind: "other", text: { en: "The English Wikipedia article says he is credited with more than 4000 compositions, although only a handful have survived." }, source: { url: "https://en.wikipedia.org/wiki/Kshetrayya", accessed: "2026-11-15" } }

  - id: "te-basavaraju-apparao"
    name:
      en: { text: "Basavaraju Apparao" }
    born: 1894
    died: 1933
    era: "twentieth-century"
    bio:
      en: "Basavaraju Apparao was a Telugu poet of the romantic movement in early twentieth-century Telugu poetry. He was born in 1894 near Vijayawada and died in 1933."
    legacy:
      text: { en: "His songs were printed after his death, and Telugu critics count him among the poets of the romantic age." }
      items:
        - { kind: "other", text: { en: "Telugu Wikipedia counts him among the poets of the Bhavakavitha, the romantic age of Telugu poetry." }, source: { url: "https://te.wikipedia.org/wiki/%E0%B0%AC%E0%B0%B8%E0%B0%B5%E0%B0%B0%E0%B0%BE%E0%B0%9C%E0%B1%81_%E0%B0%85%E0%B0%AA%E0%B1%8D%E0%B0%AA%E0%B0%BE%E0%B0%B0%E0%B0%BE%E0%B0%B5%E0%B1%81", accessed: "2026-11-15" } }
        - { kind: "other", text: { en: "Telugu Wikisource lists his songs in one collection, printed in 1934 as a memorial edition." }, source: { url: "https://te.wikisource.org/wiki/%E0%B0%AC%E0%B0%B8%E0%B0%B5%E0%B0%B0%E0%B0%BE%E0%B0%9C%E0%B1%81_%E0%B0%85%E0%B0%AA%E0%B1%8D%E0%B0%AA%E0%B0%BE%E0%B0%B0%E0%B0%BE%E0%B0%B5%E0%B1%81_%E0%B0%97%E0%B1%80%E0%B0%A4%E0%B0%AE%E0%B1%81%E0%B0%B2%E0%B1%81", accessed: "2026-11-15" } }
  - id: "te-chilakamarti"
    name:
      en: { text: "Chilakamarti Lakshmi Narasimham" }
    born: 1867
    died: 1946
    era: "colonial"
    bio:
      en: "Chilakamarti Lakshmi Narasimham was a Telugu playwright, novelist and short-story writer. He was also a social reformer, and he wrote the novel Hemalatha in 1896."
    legacy:
      text: { en: "He is known as the Andhra Scott, after the Scottish novelist Walter Scott." }
      items:
        - { kind: "other", text: { en: "The English Wikipedia article says he is called the Andhra Scott, after Walter Scott." }, source: { url: "https://en.wikipedia.org/wiki/Chilakamarti_Lakshmi_Narasimham", accessed: "2026-11-15" } }
        - { kind: "other", text: { en: "The same article dates his novel Hemalatha to 1896." }, source: { url: "https://en.wikipedia.org/wiki/Chilakamarti_Lakshmi_Narasimham", accessed: "2026-11-15" } }
  - id: "te-vemana"
    name:
      en: { text: "Yogi Vemana" }
    born: { year: 1652, circa: true }
    died: { year: 1730, circa: true }
    era: "nayaka"
    bio:
      en: "Yogi Vemana was a Telugu poet who wrote short verses about morals in a simple, everyday style. Scholars do not agree on his dates, so the years here are estimates."
    legacy:
      text: { en: "Many lines of his poems are now everyday Telugu sayings." }
      items:
        - { kind: "other", text: { en: "The English Wikipedia article says many lines of his poems are now colloquial phrases of the Telugu language." }, source: { url: "https://en.wikipedia.org/wiki/Vemana", accessed: "2026-11-15" } }

  - id: "te-bammera-pothana"
    name:
      en: { text: "Bammera Pothana" }
    born: 1400
    died: 1475
    era: "vijayanagara"
    bio:
      en: "Bammera Pothana was a Telugu poet, known for his translation of the Srimad Bhagavatam from Sanskrit into Telugu. The English Wikipedia article gives his lifetime as 1400 to 1475."
    legacy:
      text: { en: "His Telugu Bhagavatam is popularly called the Pothana Bhagavatam." }
      items:
        - { kind: "other", text: { en: "The English Wikipedia article says that his work, Srimad Bhagavatamu, is popularly called Pothana Bhagavatam in Telugu." }, source: { url: "https://en.wikipedia.org/wiki/Pothana", accessed: "2026-11-15" } }
  - id: "te-errapragada"
    name:
      en: { text: "Errapragada" }
    born: { year: 1280, circa: true }
    died: { year: 1364, circa: true }
    era: "kakatiya"
    bio:
      en: "Errapragada, also written Errana, was a Telugu poet of the fourteenth century. He wrote from the middle of the Aranya Parvam of the Andhra Mahabharatam and composed the Narasimha Purana in Telugu verse. His dates are estimates, given on the Telugu Wikipedia as about 1280 to 1364."
    legacy:
      text: { en: "Telugu literary history calls the period from about 1320 to 1400 the Errana era." }
      items:
        - { kind: "other", text: { en: "The Telugu Wikipedia article says that Telugu literary history calls the period 1320 to 1400 the Errana era." }, source: { url: "https://te.wikipedia.org/wiki/%E0%B0%8E%E0%B0%B1%E0%B1%8D%E0%B0%B0%E0%B0%BE%E0%B0%AA%E0%B1%8D%E0%B0%B0%E0%B0%97%E0%B0%A1", accessed: "2026-11-15" } }
  - id: "te-tikkana"
    name:
      en: { text: "Tikkana" }
    born: 1205
    died: 1288
    era: "kakatiya"
    bio:
      en: "Tikkana, also called Tikkana Somayaji, was a Telugu poet and minister at the court of King Manumasiddhi. He wrote fifteen of the eighteen parvams of the Andhra Mahabharatam, after Nannaya, and the Nirvachanottara Ramayanam. English and Telugu Wikipedia both give his lifetime as 1205 to 1288."
    legacy:
      text: { en: "His parts of the Andhra Mahabharatam, the Virata and Udyoga parvams among them, are still read in Telugu." }
      items:
        - { kind: "other", text: { en: "The Telugu Wikipedia article says that Tikkana wrote fifteen of the eighteen parvams of the Andhra Mahabharatam, after Nannaya." }, source: { url: "https://te.wikipedia.org/wiki/%E0%B0%A4%E0%B0%BF%E0%B0%95%E0%B1%8D%E0%B0%95%E0%B0%A8", accessed: "2026-11-16" } }
