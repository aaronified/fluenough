    born: { year: 1381, circa: true }
    died: { year: 1461, circa: true }
    era: "medieval"
    bio:
      en: "Krittibas Ojha was a medieval Bengali poet. He retold the Ramayana in Bengali, and his version is called the Krittivasi Ramayan after him. He lived in the 1300s and 1400s."
