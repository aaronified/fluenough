creators:
  - id: "bn-chandidas"
    name:
      bn: { text: "চণ্ডীদাস", reading: "conḍidāś", ipa: "tʃonɖid̪aʃ" }
      en: { text: "Chandidas" }
    born: { year: 1339, circa: true }
    died: { year: 1399, circa: true }
    era: "medieval"
    bio:
      en: "Chandidas was a medieval Bengali poet. He is known for poems about the love of Radha and Krishna. Some scholars think the poems under his name were written by more than one poet, so his dates are not certain."
    legacy:
      text: { en: "Poems of the love of Radha and Krishna are credited to him, over 1250 of them." }
      items:
        - { kind: "other", text: { en: "Poems of the love of Radha and Krishna are credited to him, over 1250 of them." }, source: { url: "https://en.wikipedia.org/wiki/Chandidas", accessed: "2026-11-15" } }
  - id: "bn-krittibas-ojha"
    name:
      bn: { text: "কৃত্তিবাস ওঝা", reading: "krittibāś ojhā", ipa: "krit̪t̪ibaʃ odʒʱa" }
      en: { text: "Krittibas Ojha" }
    born: { year: 1381, circa: true }
    died: { year: 1461, circa: true }
    era: "medieval"
    bio:
      en: "Krittibas Ojha was a medieval Bengali poet. He retold the Ramayana in Bengali, and his version is called the Krittivasi Ramayan after him. He lived in the 1300s and 1400s."
    legacy:
      text: { en: "His Bengali Ramayana is known as the Krittivasi Ramayan, and it was printed at the Serampore Mission Press." }
      items:
        - { kind: "other", text: { en: "His Bengali Ramayana is known as the Krittivasi Ramayan, and it was printed at the Serampore Mission Press." }, source: { url: "https://en.wikipedia.org/wiki/Krittibas_Ojha", accessed: "2026-11-15" } }
  - id: "bn-ramprasad-sen"
    name:
      bn: { text: "রামপ্রসাদ সেন", reading: "rāmprosād śen", ipa: "ramprosad̪ ʃen" }
      en: { text: "Ramprasad Sen" }
    born: { year: 1718, circa: true }
    died: { year: 1775, circa: true }
    era: "medieval"
    bio:
      en: "Ramprasad Sen was a poet and saint of eighteenth-century Bengal. He wrote devotional songs to the goddess Kali, called Ramprasadi. The exact years of his birth and death are not certain."
    legacy:
      text: { en: "His devotional songs, called Ramprasadi, are still popular in Bengal." }
      items:
        - { kind: "music", text: { en: "His devotional songs, called Ramprasadi, are still popular in Bengal." }, source: { url: "https://en.wikipedia.org/wiki/Ramprasad_Sen", accessed: "2026-11-15" } }
  - id: "bn-bharatchandra-ray"
    name:
      bn: { text: "ভারতচন্দ্র রায়", reading: "bhārotcondro rāy", ipa: "bʱarot̪tʃond̪ro raj" }
      en: { text: "Bharatchandra Ray" }
    born: 1712
    died: 1760
    era: "medieval"
    bio:
      en: "Bharatchandra Ray was a Bengali poet at the court of Maharaja Krishnachandra of Nadia. He is best known for the long poem Annadamangal, which he wrote in 1752 and 1753. He died in 1760."
    legacy:
      text: { en: "The Maharaja gave him the title Gunakar, and he became known as Ray Gunakar Bharatchandra." }
      items:
        - { kind: "other", text: { en: "The Maharaja gave him the title Gunakar, and he became known as Ray Gunakar Bharatchandra." }, source: { url: "https://en.wikipedia.org/wiki/Bharatchandra_Ray", accessed: "2026-11-15" } }
  - id: "bn-lalon"
    name:
      bn: { text: "লালন", reading: "lālon", ipa: "lalon" }
      en: { text: "Lalon" }
    born: 1774
    died: 1890
    era: "bengal-renaissance"
    bio:
      en: "Lalon was a Bengali mystic, poet and singer of Baul songs. He was born in what is now Bangladesh. He is remembered for songs that reject the divisions of caste and religion."
    legacy:
      text: { en: "The English Wikipedia article says he inspired writers such as Tagore and Nazrul." }
      items:
        - { kind: "other", text: { en: "The English Wikipedia article says he inspired writers such as Tagore and Nazrul." }, source: { url: "https://en.wikipedia.org/wiki/Lalon", accessed: "2026-11-15" } }
  - id: "bn-hason-raja"
    name:
      bn: { text: "হাসন রাজা", reading: "hāśon rājā", ipa: "ɦaʃon radʒa" }
      en: { text: "Hason Raja" }
    born: 1854
    died: 1922
    era: "tagore-age"
    bio:
      en: "Hason Raja was a mystic poet and songwriter from Sylhet. He wrote many songs, and his style made him a well-known figure of Bengali folk culture. He lived from 1854 to 1922."
    legacy:
      text: { en: "The English Wikipedia article calls him one of the most prominent figures in Bengali folk culture." }
      items:
        - { kind: "other", text: { en: "The English Wikipedia article calls him one of the most prominent figures in Bengali folk culture." }, source: { url: "https://en.wikipedia.org/wiki/Hason_Raja", accessed: "2026-11-15" } }
  - id: "bn-nidhu-babu"
    name:
      bn: { text: "নিধুবাবু", reading: "nidhubābu", ipa: "nid̪ʱubabu" }
      en: { text: "Nidhu Babu" }
    born: 1741
    died: 1839
    era: "bengal-renaissance"
    bio:
      en: "Nidhu Babu, whose full name was Ramnidhi Gupta, was a Bengali musician and songwriter from Kolkata. He helped to shape Bengali tappa, a kind of love song. He lived to the age of about ninety-eight."
    legacy:
      text: { en: "He is counted as one of the reformers of Bengali tappa music." }
      items:
        - { kind: "music", text: { en: "He is counted as one of the reformers of Bengali tappa music." }, source: { url: "https://en.wikipedia.org/wiki/Nidhu_Babu", accessed: "2026-11-15" } }
  - id: "bn-ishwar-chandra-vidyasagar"
    name:
      bn: { text: "ঈশ্বরচন্দ্র বিদ্যাসাগর", reading: "issorcondro biddāśāgor", ipa: "issortʃond̪ro bid̪d̪aʃaɡor" }
      en: { text: "Ishwar Chandra Vidyasagar" }
    born: 1820
    died: 1891
    era: "bengal-renaissance"
    bio:
      en: "Ishwar Chandra Vidyasagar was an educator and social reformer of the nineteenth century, and one of the leading figures of the Bengal Renaissance. His Bengali primer, Barnaparichay, and his Bengali versions of the Betal tales and the story of Sita's exile are on Bengali Wikisource."
    legacy:
      text: { en: "He was the most prominent campaigner for Hindu widow remarriage, and the Hindu Widows' Remarriage Act, 1856, was passed." }
      items:
        - { kind: "other", text: { en: "He was the most prominent campaigner for Hindu widow remarriage, and the Hindu Widows' Remarriage Act, 1856, was passed." }, source: { url: "https://en.wikipedia.org/wiki/Ishwar_Chandra_Vidyasagar", accessed: "2026-11-15" } }
  - id: "bn-michael-madhusudan-dutt"
    name:
      bn: { text: "মাইকেল মধুসূদন দত্ত", reading: "māikel modhusudon dôtto", ipa: "maikel mod̪ʱusud̪on d̪ɔt̪t̪o" }
      en: { text: "Michael Madhusudan Dutt" }
    born: 1824
    died: 1873
    era: "bengal-renaissance"
    bio:
      en: "Michael Madhusudan Dutt was a Bengali poet and playwright, born in Sagardari in present-day Bangladesh. He wrote the epic Meghnad Badh Kavya and the sonnets of the Chaturdashapadi Kabitabali, which was printed in 1866."
    legacy:
      text: { en: "The English Wikipedia article calls him one of the pioneers of Bengali literature." }
      items:
        - { kind: "other", text: { en: "The English Wikipedia article calls him one of the pioneers of Bengali literature." }, source: { url: "https://en.wikipedia.org/wiki/Michael_Madhusudan_Dutt", accessed: "2026-11-15" } }
  - id: "bn-bankim-chandra-chattopadhyay"
    name:
      bn: { text: "বঙ্কিমচন্দ্র চট্টোপাধ্যায়", reading: "boṅkimcondro côṭṭopāddhāy", ipa: "boŋkimtʃond̪ro tʃɔʈʈopad̪d̪ʱaj" }
      en: { text: "Bankim Chandra Chattopadhyay" }
    born: 1838
    died: 1894
    era: "bengal-renaissance"
    bio:
      en: "Bankim Chandra Chattopadhyay was a Bengali novelist, poet, essayist and journalist. He is known as Sahitya Samrat, the Emperor of Literature. His novels include Durgeshnandini, Kapalkundala and Anandamath, and he wrote the essays of Kamalakanter Daptar."
    legacy:
      text: { en: "He composed Vande Mataram, which appears in his 1882 novel Anandamath, one of the landmarks of modern Bengali and Indian literature." }
      items:
        - { kind: "music", text: { en: "He composed Vande Mataram, which appears in his 1882 novel Anandamath, one of the landmarks of modern Bengali and Indian literature." }, source: { url: "https://en.wikipedia.org/wiki/Bankim_Chandra_Chatterjee", accessed: "2026-11-15" } }
  - id: "bn-peary-chand-mitra"
    name:
      bn: { text: "প্যারীচাঁদ মিত্র", reading: "pêricām̐d mitro", ipa: "pæritʃãd̪ mit̪ro" }
      en: { text: "Peary Chand Mitra" }
    born: 1814
    died: 1883
    era: "bengal-renaissance"
    bio:
      en: "Peary Chand Mitra was a writer, journalist and entrepreneur from Kolkata, and a member of Henry Derozio's Young Bengal group. He also wrote under the pen name Tek Chand Thakur."
    legacy:
      text: { en: "His Alaler Gharer Dulal pioneered the novel in Bengali, leading to a tradition taken up by Bankim Chandra Chatterjee and others." }
      items:
        - { kind: "other", text: { en: "His Alaler Gharer Dulal pioneered the novel in Bengali, leading to a tradition taken up by Bankim Chandra Chatterjee and others." }, source: { url: "https://en.wikipedia.org/wiki/Peary_Chand_Mitra", accessed: "2026-11-15" } }
  - id: "bn-kaliprasanna-singha"
    name:
      bn: { text: "কালীপ্রসন্ন সিংহ", reading: "kāliprosonno śiṅho", ipa: "kaliprosonno ʃiŋɦo" }
      en: { text: "Kaliprasanna Singha" }
    born: 1840
    died: 1870
    era: "bengal-renaissance"
    bio:
      en: "Kaliprasanna Singha, known by the pen name Hootum Pyancha, was a Bengali author, playwright and philanthropist of Kolkata. The year of his birth is debated, so it is given here as 1840, the year of a newspaper notice of his birth."
    legacy:
      text: { en: "His Hootum Pyanchar Naksha is a collection of satirical social sketches that reflects the urban society of Bengal at that time." }
      items:
        - { kind: "other", text: { en: "His Hootum Pyanchar Naksha is a collection of satirical social sketches that reflects the urban society of Bengal at that time." }, source: { url: "https://en.wikipedia.org/wiki/Kaliprasanna_Singha", accessed: "2026-11-15" } }
  - id: "bn-dinabandhu-mitra"
    name:
      bn: { text: "দীনবন্ধু মিত্র", reading: "dinobondhu mitro", ipa: "d̪inobond̪ʱu mit̪ro" }
      en: { text: "Dinabandhu Mitra" }
    born: 1829
    died: 1873
    era: "bengal-renaissance"
    bio:
      en: "Dinabandhu Mitra was a Bengali writer and dramatist, born in the village of Chowberia in North 24 Parganas."
    legacy:
      text: { en: "He is best known for his play Nil Darpan, written in 1860." }
      items:
        - { kind: "other", text: { en: "He is best known for his play Nil Darpan, written in 1860." }, source: { url: "https://en.wikipedia.org/wiki/Dinabandhu_Mitra", accessed: "2026-11-15" } }
  - id: "bn-nabinchandra-sen"
    name:
      bn: { text: "নবীনচন্দ্র সেন", reading: "nobincondro śen", ipa: "nobintʃond̪ro ʃen" }
      en: { text: "Nabinchandra Sen" }
    born: 1847
    died: 1909
    era: "bengal-renaissance"
    bio:
      en: "Nabinchandra Sen was a Bengali poet and writer, born in Noapara near Chittagong. He worked as a deputy magistrate and retired in 1904."
    legacy:
      text: { en: "His long poem Palashir Juddha (1875) made his name as a poet; he is often considered one of the greatest poets before Tagore." }
      items:
        - { kind: "other", text: { en: "His long poem Palashir Juddha (1875) made his name as a poet; he is often considered one of the greatest poets before Tagore." }, source: { url: "https://en.wikipedia.org/wiki/Nabinchandra_Sen", accessed: "2026-11-15" } }
  - id: "bn-rangalal-bandyopadhyay"
    name:
      bn: { text: "রঙ্গলাল বন্দ্যোপাধ্যায়", reading: "rôṅgolāl bônddopāddhāy", ipa: "rɔŋɡolal bɔnd̪d̪opad̪d̪ʱaj" }
      en: { text: "Rangalal Bandyopadhyay" }
    born: 1827
    died: 1887
    era: "bengal-renaissance"
    bio:
      en: "Rangalal Bandyopadhyay was a Bengali poet, journalist and author, born in the village of Bakulia in Hooghly district. His poems first appeared in the magazine Sangbad Prabhakar."
    legacy:
      text: { en: "His Padmini Upakhyan (1858) is called the first Bengali narrative romance published just after the Revolt of 1857." }
      items:
        - { kind: "other", text: { en: "His Padmini Upakhyan (1858) is called the first Bengali narrative romance published just after the Revolt of 1857." }, source: { url: "https://en.wikipedia.org/wiki/Rangalal_Bandyopadhyay", accessed: "2026-11-15" } }
