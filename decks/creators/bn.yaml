        - { kind: "other", text: { en: "The Maharaja gave him the title Gunakar, and he became known as Ray Gunakar Bharatchandra." }, source: { url: "https://en.wikipedia.org/wiki/Bharatchandra_Ray", accessed: "2026-11-15" } }
  - id: "bn-lalon"
