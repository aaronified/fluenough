    died: 1941
    era: "tagore-age"
    bio:
      en: "Rabindranath Tagore was a Bengali poet, author, playwright, composer and painter, and one of the leading figures of the Bengal Renaissance. The words of the national anthems of India and of Bangladesh are by him."
    legacy:
      text: { en: "He won the Nobel Prize in Literature in 1913." }
      items:
