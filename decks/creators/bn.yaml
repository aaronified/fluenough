      en: { text: "Lalon" }
    born: { year: 1774, circa: true }
    died: 1890
    era: "bengal-renaissance"
    bio:
      en: "Lalon was a Bengali mystic, poet and singer of Baul songs. He was born in what is now Bangladesh. He is remembered for songs that reject the divisions of caste and religion."
