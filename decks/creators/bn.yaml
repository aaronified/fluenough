# The people behind the Bengali culture decks (wiki/Plan-Deck-Kinds-And-Topics.md, D5).
# Dates are the years of birth and death read on English Wikipedia, circa where the page gives a circa year or the poet is uncertain. The eras follow Bengali literary history: the periods come from the English Wikipedia article on Bengali literature (ancient 650-1200, medieval 1200-1800), the Bengal Renaissance article (from the Battle of Plassey in 1757, ending with Tagore) and Tagore's years (1861-1941).
