    born: { year: 1398, circa: true }
    died: { year: 1518, circa: true }
    era: "bhakti"
    bio:
      en: "Kabir was a poet of Kashi (Varanasi). The Hindi Wikipedia page quotes his couplet on caste. The years of his birth and death are not certain."
