# The people behind the Assamese culture decks (wiki/Plan-Deck-Kinds-And-Topics.md, D5).
# Dates are the years of birth and death read on English Wikipedia, circa where the pages disagree. The eras are those of the English Wikipedia article on Assamese literature (the Shankari era 1490-1700, the missionary era 1826-1870, the era of Hemchandra Barua and Gunabhiram Barua 1870-1890, and the romantic era, or Bezbaroa's era, 1890-1940).
