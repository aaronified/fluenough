        - { kind: "other", text: { en: "The French Wikipedia article has a section on his heritage that lists novelists, dramatists, musicians and illustrators who came after him." }, source: { url: "https://fr.wikipedia.org/wiki/Fran%C3%A7ois_Rabelais", accessed: "2026-11-15" } }
  - id: "fr-joachim-du-bellay"
