# The people behind the French culture decks (wiki/Plan-Deck-Kinds-And-Topics.md, D5). Dates are the years of birth and death,
# circa where the French Wikipedia page gives an uncertain year. The eras follow the French periods. No pictures: none has a
# licence checked yet. Built from French Wikipedia pages only, read on 2026-11-15; the legacy items cite those pages.
schema: 1
kind: "creators"
id: "creators-fr"
language: "fr"
license: "CC-BY-SA-4.0"
eras:
  - id: "moyen-age"
    name: { fr: "Moyen Âge", en: "Middle Ages" }
    from: 1000
    to: 1492
  - id: "renaissance"
    name: { fr: "Renaissance", en: "Renaissance" }
    from: 1492
    to: 1610
  - id: "grand-siecle-lumieres"
    name: { fr: "Grand Siècle et Lumières", en: "Grand Siècle and Enlightenment" }
    from: 1610
    to: 1789
  - id: "xixe-siecle"
    name: { fr: "XIXe siècle", en: "Nineteenth century" }
    from: 1789
    to: 1900
  - id: "xxe-siecle"
    name: { fr: "XXe siècle", en: "Twentieth century" }
    from: 1900
    to: 2000
  - id: "xxie-siecle"
    name: { fr: "XXIe siècle", en: "Twenty-first century" }
    from: 2000
    to: null
creators:
  - id: "fr-francois-rabelais"
    name:
      fr: { text: "François Rabelais", ipa: "fʁɑ̃swa ʁablɛ" }
      en: { text: "François Rabelais" }
    born: { year: 1483, circa: true }
    died: 1553
    era: "renaissance"
    bio:
      en: "François Rabelais was a French writer of the Renaissance. He was also a doctor and a monk, and he was born near Chinon. He wrote Gargantua. He died in Paris in 1553."
    legacy:
      text: { en: "The French Wikipedia article has a section on his heritage, which runs from the nineteenth century to the twentieth." }
      items:
        - { kind: "other", text: { en: "In the nineteenth century Victor Hugo called him 'the Aeschylus of good eating' (l'Eschyle de la mangeaille), the French Wikipedia article says." }, source: { url: "https://fr.wikipedia.org/wiki/Fran%C3%A7ois_Rabelais", accessed: "2026-11-15" } }
        - { kind: "other", text: { en: "The French Wikipedia article has a section on his heritage that lists novelists, dramatists, musicians and illustrators who came after him." }, source: { url: "https://fr.wikipedia.org/wiki/Fran%C3%A7ois_Rabelais", accessed: "2026-11-15" } }
  - id: "fr-joachim-du-bellay"
    name:
      fr: { text: "Joachim du Bellay", ipa: "ʒɔaʃim dy bɛlɛ" }
      en: { text: "Joachim du Bellay" }
    born: { year: 1522, circa: true }
    died: 1560
    era: "renaissance"
    bio:
      en: "Joachim du Bellay was a French poet of the Renaissance. He wrote Les Regrets, a book of sonnets. He died in Paris on 1 January 1560."
    legacy:
      text: { en: "His La Défense et illustration de la langue française is one of his main works." }
      items:
        - { kind: "other", text: { en: "The French Wikipedia article lists La Défense et illustration de la langue française among his main works." }, source: { url: "https://fr.wikipedia.org/wiki/Joachim_du_Bellay", accessed: "2026-11-15" } }
  - id: "fr-louise-labe"
    name:
      fr: { text: "Louise Labé", ipa: "lwiz labe" }
      en: { text: "Louise Labé" }
    born: { year: 1524, circa: true }
    died: 1566
    era: "renaissance"
    bio:
      en: "Louise Labé was a French poet of the Renaissance, from Lyon, and was known as La Belle Cordière. She died in 1566 at Parcieux-en-Dombes."
    legacy:
      text: { en: "She is linked to the School of Lyon, a group of Renaissance writers in Lyon." }
      items:
        - { kind: "other", text: { en: "The French Wikipedia article gives the École de Lyon (the School of Lyon) as her literary movement, next to humanism." }, source: { url: "https://fr.wikipedia.org/wiki/Louise_Lab%C3%A9", accessed: "2026-11-15" } }
        - { kind: "commemoration", text: { en: "The French Wikipedia article lists a commemorative plaque for her." }, source: { url: "https://fr.wikipedia.org/wiki/Louise_Lab%C3%A9", accessed: "2026-11-15" } }
  - id: "fr-michel-de-montaigne"
    name:
      fr: { text: "Michel de Montaigne", ipa: "miʃɛl də mɔ̃tɛɲ" }
      en: { text: "Michel de Montaigne" }
    born: 1533
    died: 1592
    era: "renaissance"
    bio:
      en: "Michel de Montaigne was a French writer of the Renaissance and mayor of Bordeaux. He wrote the Essais, a book of essays. He died on 13 September 1592."
    legacy:
      text: { en: "His Essais are the book of his years as a writer, from 1571 to 1592." }
      items:
        - { kind: "other", text: { en: "The French Wikipedia article has a section on Les Essais within the years he was a writer, 1571 to 1592." }, source: { url: "https://fr.wikipedia.org/wiki/Michel_de_Montaigne", accessed: "2026-11-15" } }
  - id: "fr-pierre-de-ronsard"
    name:
      fr: { text: "Pierre de Ronsard", ipa: "pjɛʁ də ʁɔ̃saʁ" }
      en: { text: "Pierre de Ronsard" }
    born: 1524
    died: 1585
    era: "renaissance"
    bio:
      en: "Pierre de Ronsard was a French poet of the Renaissance. He was born in September 1524 and died in Tours in 1585. The French Wikipedia article calls him 'Prince of poets'."
    legacy:
      text: { en: "The French Wikipedia article gives him a famous nickname and has a section on the Pléiade, a group of poets of his time." }
      items:
        - { kind: "other", text: { en: "His nickname on the French Wikipedia article is 'Prince des poètes et Poète des princes' (Prince of poets and poet of princes)." }, source: { url: "https://fr.wikipedia.org/wiki/Pierre_de_Ronsard", accessed: "2026-11-15" } }
        - { kind: "other", text: { en: "The article has a section titled 'Naissance de la Pléiade' (the birth of the Pléiade)." }, source: { url: "https://fr.wikipedia.org/wiki/Pierre_de_Ronsard", accessed: "2026-11-15" } }
  - id: "fr-jean-de-la-fontaine"
    name:
      fr: { text: "Jean de La Fontaine", ipa: "ʒɑ̃ də la fɔ̃tɛn" }
      en: { text: "Jean de La Fontaine" }
    born: 1621
    died: 1695
    era: "grand-siecle-lumieres"
    bio:
      en: "Jean de La Fontaine was a French poet of the Grand Siècle. He wrote the Fables, short verse stories with animals and a moral. He died in Paris in 1695."
    legacy:
      text: { en: "The French Wikipedia article lists his Fables among his main works, and it has a commemorative plaque for him." }
      items:
        - { kind: "other", text: { en: "The French Wikipedia article lists Fables (1668-1694) and Contes et nouvelles en vers (1665, 1666) among his main works." }, source: { url: "https://fr.wikipedia.org/wiki/Jean_de_La_Fontaine", accessed: "2026-11-15" } }
        - { kind: "commemoration", text: { en: "The French Wikipedia article lists a commemorative plaque for him." }, source: { url: "https://fr.wikipedia.org/wiki/Jean_de_La_Fontaine", accessed: "2026-11-15" } }
  - id: "fr-moliere"
    name:
      fr: { text: "Molière", ipa: "mɔljɛʁ" }
      en: { text: "Molière" }
    born: 1622
    died: 1673
    era: "grand-siecle-lumieres"
    bio:
      en: "Molière was a French playwright and actor of the Grand Siècle. He wrote Le Bourgeois gentilhomme, first performed in 1670. He died in Paris on 17 February 1673."
    legacy:
      text: { en: "The French Wikipedia article lists his plays with their dates, from L'Avare in 1668 to Les Femmes savantes in 1672." }
      items:
        - { kind: "other", text: { en: "The French Wikipedia article gives Le Tartuffe (1669), Le Bourgeois gentilhomme (1670) and Les Femmes savantes (1672) among his plays." }, source: { url: "https://fr.wikipedia.org/wiki/Moli%C3%A8re", accessed: "2026-11-15" } }
  - id: "fr-voltaire"
    name:
      fr: { text: "Voltaire", ipa: "vɔltɛʁ" }
      en: { text: "Voltaire" }
    born: 1694
    died: 1778
    era: "grand-siecle-lumieres"
    bio:
      en: "Voltaire was a French writer and philosopher of the Enlightenment. He wrote Candide, a satirical story. He died in Paris on 30 May 1778."
    legacy:
      text: { en: "He was famous across Europe during his life, the French Wikipedia article says." }
      items:
        - { kind: "other", text: { en: "The French Wikipedia article says that his international fame was already known during his lifetime." }, source: { url: "https://fr.wikipedia.org/wiki/Voltaire", accessed: "2026-11-15" } }
  - id: "fr-jean-jacques-rousseau"
    name:
      fr: { text: "Jean-Jacques Rousseau", ipa: "ʒɑ̃ʒak ʁuso" }
      en: { text: "Jean-Jacques Rousseau" }
    born: 1712
    died: 1778
    era: "grand-siecle-lumieres"
    bio:
      en: "Jean-Jacques Rousseau was a French writer, philosopher and musician of the Enlightenment. He wrote Du contrat social in 1762. He died at Ermenonville on 2 July 1778."
    legacy:
      text: { en: "The French Wikipedia article lists Du contrat social among his main works, next to Émile and Julie." }
      items:
        - { kind: "other", text: { en: "The French Wikipedia article lists Du Contrat social (1762), Émile, ou De l'éducation (1762) and Julie ou la nouvelle Héloïse (1761) among his works." }, source: { url: "https://fr.wikipedia.org/wiki/Jean-Jacques_Rousseau", accessed: "2026-11-15" } }
  - id: "fr-victor-hugo"
    name:
      fr: { text: "Victor Hugo", ipa: "viktɔʁ ygo" }
      en: { text: "Victor Hugo" }
    born: 1802
    died: 1885
    era: "xixe-siecle"
    bio:
      en: "Victor Hugo was a French poet, novelist and playwright of the nineteenth century. He wrote Les Contemplations (1856). He was born in Besançon on 26 February 1802 and died in Paris on 22 May 1885."
    legacy:
      text: { en: "The French Wikipedia article lists his collection La Légende des siècles among his main works, with dates of 1859, 1877 and 1883." }
      items:
        - { kind: "other", text: { en: "The French Wikipedia article gives La Légende des siècles (1859, 1877, 1883) and Les Contemplations (1856) among his works." }, source: { url: "https://fr.wikipedia.org/wiki/Victor_Hugo", accessed: "2026-11-15" } }
  - id: "fr-alphonse-de-lamartine"
    name:
      fr: { text: "Alphonse de Lamartine", ipa: "alfɔ̃s də lamaʁtin" }
      en: { text: "Alphonse de Lamartine" }
    born: 1790
    died: 1869
    era: "xixe-siecle"
    bio:
      en: "Alphonse de Lamartine was a French poet of the nineteenth century. He wrote the Méditations poétiques, published in 1820. He was born in Mâcon on 21 October 1790 and died in Paris on 28 February 1869."
    legacy:
      text: { en: "The French Wikipedia article names 'Le Lac' among the best-known poems of his first book." }
      items:
        - { kind: "other", text: { en: "The French Wikipedia article names 'Le Lac' among the poems of the Méditations (1820)." }, source: { url: "https://fr.wikipedia.org/wiki/Alphonse_de_Lamartine", accessed: "2026-11-15" } }
  - id: "fr-charles-baudelaire"
    name:
      fr: { text: "Charles Baudelaire", ipa: "ʃaʁl bodlɛʁ" }
      en: { text: "Charles Baudelaire" }
    born: 1821
    died: 1867
    era: "xixe-siecle"
    bio:
      en: "Charles Baudelaire was a French poet of the nineteenth century. He wrote Les Fleurs du mal, published in 1857 and in an 1861 edition. He was born in Paris on 9 April 1821 and died in 1867."
    legacy:
      text: { en: "The French Wikipedia article has sections on the condemnation of Les Fleurs du mal and on the later revision of that condemnation." }
      items:
        - { kind: "other", text: { en: "The French Wikipedia article has sections on the condemnation of Les Fleurs du mal and on the later revision of that condemnation." }, source: { url: "https://fr.wikipedia.org/wiki/Charles_Baudelaire", accessed: "2026-11-15" } }
  - id: "fr-stephane-mallarme"
    name:
      fr: { text: "Stéphane Mallarmé", ipa: "stefan malaʁme" }
      en: { text: "Stéphane Mallarmé" }
    born: 1842
    died: 1898
    era: "xixe-siecle"
    bio:
      en: "Stéphane Mallarmé was a French poet of the nineteenth century. He wrote Brise marine, dated 1865. He was born in Paris in 1842 and died in 1898."
    legacy:
      text: { en: "The French Wikipedia article lists Brise marine among his works, with the date 1865." }
      items:
        - { kind: "other", text: { en: "The French Wikipedia article lists Brise marine (1865) among his works." }, source: { url: "https://fr.wikipedia.org/wiki/St%C3%A9phane_Mallarm%C3%A9", accessed: "2026-11-15" } }
  - id: "fr-arthur-rimbaud"
    name:
      fr: { text: "Arthur Rimbaud", ipa: "aʁtyʁ ʁɛ̃bo" }
      en: { text: "Arthur Rimbaud" }
    born: 1854
    died: 1891
    era: "xixe-siecle"
    bio:
      en: "Arthur Rimbaud was a French poet of the nineteenth century. He was born in Charleville in 1854 and died in Marseille in 1891."
    legacy:
      text: { en: "The French Wikipedia article says that poems such as Le Bateau ivre, Le Dormeur du val and Voyelles are among the most famous of French poetry." }
      items:
        - { kind: "other", text: { en: "The French Wikipedia article says that Le Bateau ivre, Le Dormeur du val and Voyelles are among the most famous poems of French poetry." }, source: { url: "https://fr.wikipedia.org/wiki/Arthur_Rimbaud", accessed: "2026-11-15" } }
