# The people behind the Gujarati culture decks (wiki/Plan-Deck-Kinds-And-Topics.md, D5).
# Dates, two pages each: Narsinh Mehta (en.wikipedia: believed born c. 1414, died 1488; Wikidata Q2723574 gives 1814 to 1881, which conflicts and may be another person: circa, flagged for review); Mirabai (en.wikipedia infobox c. 1498 to c. 1546; gu.wikipedia 1498 to 1547; Wikidata Q466330 gives 1498 or 1504 and 1546, 1547 or 1552: circa, flagged); Akho (en.wikipedia c. 1591 to c. 1656; Wikidata Q2721893 1591 to 1656 agrees; gu.wikisource author page gives 1600 to 1655, flagged); Dayaram (gu.wikipedia 1777 to 1853; Wikidata Q2721616 1777 to 1853 agrees, with a 1852 variant, flagged); Premanand (gu.wikipedia lead 1649 to 1714, infobox 1636 to 1734; Wikidata Q7240216 gives the same two sets: circa, flagged).
# Narmad: en.wikipedia and Wikidata Q2723334 both give 1833 to 1886 (Wikidata with days 24 August 1833 and 26 February 1886); plain years.
# Dalpatram: en.wikipedia and Wikidata Q2724159 both give 1820 to 1898. Meghani: en.wikipedia and Wikidata Q2758776 both give 1896 to 1947. Kalapi: en.wikipedia gives 1874 to 1900 with the death date uncertain; Wikidata Q2727327 gives 26 January 1874 and 9 June 1900 (flagged for review).
