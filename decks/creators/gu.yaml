      en: "Narsinh Mehta was a Gujarati devotional poet, known for his bhajans and songs about Krishna. His dates are approximate: his birth is believed to be about 1414, and his death is given as 1488."
  - id: "gu-mirabai"
    name:
      en: { text: "Mirabai" }
    born: { year: 1498, circa: true }
    died: { year: 1546, circa: true }
    era: "bhakti"
    bio:
      en: "Mirabai was a devotional poet who wrote songs to Krishna. Gujarati songs printed under her name are attributed to her, and her dates are approximate."
  - id: "gu-akho"
    name:
      en: { text: "Akho" }
    born: { year: 1591, circa: true }
    died: { year: 1656, circa: true }
    era: "bhakti"
    bio:
      en: "Akho, also called Akha Bhagat, was a Gujarati poet of the seventeenth century, known for his chhappas (six-line verses) and the Akhegita. The exact dates are not known."
  - id: "gu-dayaram"
    name:
      en: { text: "Dayaram" }
    born: 1777
    died: 1853
    era: "colonial"
    bio:
      en: "Dayaram was a Gujarati poet who wrote garbis and devotional songs, and is often called the first medieval Gujarati poet to write in the garbi style."
  - id: "gu-narmad"
    name:
      en: { text: "Narmad" }
    born: 1833
    died: 1886
    era: "colonial"
    bio:
      en: "Narmad, also called Narmadashankar Lalshankar Dave, was a Gujarati poet, essayist and lexicographer. He wrote the song Jai Jai Garavi Gujarat in 1873 and compiled the Narmakosh, an early Gujarati dictionary."
  - id: "gu-dalpatram"
    name:
      en: { text: "Dalpatram" }
    born: 1820
    died: 1898
    era: "colonial"
    bio:
      en: "Dalpatram was a Gujarati poet of the nineteenth century, known for his satirical verse and tales, and for his prose on the history of Gujarati poets."
  - id: "gu-meghani"
    name:
      en: { text: "Zaverchand Meghani" }
    born: 1896
    died: 1947
    era: "colonial"
    bio:
      en: "Zaverchand Meghani was a Gujarati poet, writer and collector of folk songs and tales, known for his collections of Saurashtra folk songs and his stories."
  - id: "gu-kalapi"
    name:
      en: { text: "Kalapi" }
    born: 1874
    died: 1900
    era: "colonial"
    bio:
      en: "Kalapi (Sursinhji Gohil) was a Gujarati poet and ruler of Lathi. His collection of poems is Kalapino Kekarav. Sources give his death as 1900; English Wikipedia says the exact date is uncertain."
  - id: "gu-premanand"
    name:
      en: { text: "Premanand" }
    born: { year: 1649, circa: true }
    died: { year: 1714, circa: true }
    era: "bhakti"
    bio:
      en: "Premanand was a Gujarati poet, known for narrative poems such as Sudama Charit, about Krishna and his friend Sudama. Sources give different years for his life, so both dates are approximate."
