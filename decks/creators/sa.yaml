creators:
  - id: "sa-aryabhata"
    name:
      sa: { text: "आर्यभट", reading: "āryabhaṭa", ipa: "aːrjəbʱəʈə" }
      en: { text: "Āryabhaṭa" }
    born: 476
    died: 550
    era: "gupta"
    bio:
      en: "Āryabhaṭa was an Indian mathematician and astronomer of the Gupta era. He called himself a native of Kusumapura or Pāṭaliputra, near present-day Patna. His only known surviving work is the Āryabhaṭīya, a Sanskrit astronomical treatise."
    legacy:
      text: { en: "India's first satellite and a lunar crater are both named for him, as the English Wikipedia article says." }
      items:
        - { kind: "commemoration", text: { en: "The English Wikipedia article says the lunar crater Aryabhata is named in his honour, as is India's first satellite, which also appeared on the reverse of the Indian 2-rupee note." }, source: { url: "https://en.wikipedia.org/wiki/Aryabhata", accessed: "2026-11-17" } }
  - id: "sa-varahamihira"
    name:
      sa: { text: "वराहमिहिर", reading: "varāhamihira", ipa: "ʋəraːɦəmiɦirə" }
      en: { text: "Varāhamihira" }
    born: { year: 505, circa: true }
    died: { year: 587, circa: true }
    era: "gupta"
    bio:
      en: "Varāhamihira was an ancient Indian mathematician and astronomer who lived in Ujjain, and is considered one of the foremost scholars of classical Indian astronomy. His notable works are the Pañcasiddhāntikā, the Bṛhatsaṃhitā and the Bṛhajjātaka. The English Wikipedia marks his dates, about 505 to about 587, as disputed, and Wikidata gives both years with century precision only."
    legacy:
      text: { en: "After his death he was held to be the most eminent writer on jyotiṣa, the Indian science of the stars." }
      items:
        - { kind: "other", text: { en: "The English Wikipedia article says he gained a reputation as the most eminent writer on jyotiṣa after his death, and that his works superseded nearly all earlier Indian texts in that area." }, source: { url: "https://en.wikipedia.org/wiki/Var%C4%81hamihira", accessed: "2026-11-17" } }
  - id: "sa-jayadeva"
    name:
      sa: { text: "जयदेव", reading: "jayadeva", ipa: "dʒəjəd̪eːʋə" }
      en: { text: "Jayadeva" }
    born: { year: 1170, circa: true }
    died: { year: 1245, circa: true }
    bio:
      en: "Jayadeva was a Sanskrit poet of the 12th century, most known for the Gītagovinda, a poem on the love of Kṛṣṇa and the cowherd Rādhā. The English Wikipedia gives his years as about 1170 to about 1245 and notes a controversy over where he was born."
    legacy:
      text: { en: "The Gītagovinda is still sung in a temple at Puri, and hymns of his are in the Sikh scripture." }
      items:
        - { kind: "music", text: { en: "The English Wikipedia article says that in the Jagannatha temple of Puri the Gita Govinda is ritually sung every night during the Badasinghara ritual." }, source: { url: "https://en.wikipedia.org/wiki/Jayadeva", accessed: "2026-11-17" } }
        - { kind: "other", text: { en: "The article says Jayadeva is the earliest dated author of hymns that are included in the Guru Granth Sahib, the primary scripture of Sikhism." }, source: { url: "https://en.wikipedia.org/wiki/Jayadeva", accessed: "2026-11-17" } }
  - id: "sa-harsa"
    name:
      sa: { text: "हर्ष", reading: "harṣa", ipa: "ɦərʂə" }
      en: { text: "Harṣa" }
    born: 590
    died: 647
    era: "harsha"
    bio:
      en: "Harṣa, also called Harṣavardhana, was the emperor of Kannauj from 606 to 647. The English Wikipedia gives his birth as 4 June 590, and Wikidata agrees on 590 and 647."
    legacy:
      text: { en: "A silent film of 1926 about the emperor was made in India." }
      items:
        - { kind: "film", year: 1926, text: { en: "The English Wikipedia article says a 1926 Indian silent film about the emperor, Samrat Shiladitya, was directed by Mohan Dayaram Bhavnani." }, source: { url: "https://en.wikipedia.org/wiki/Harsha", accessed: "2026-11-17" } }
  - id: "sa-g-v-iyer"
    name:
      en: { text: "G. V. Iyer" }
    born: 1917
    died: 2003
    bio:
      en: "Ganapathi Venkataramana Iyer was an Indian film director and actor. His film Adi Shankaracharya (1983) won four National Film Awards, including Best Film, and he also made the Sanskrit film Bhagavad Gita (1993)."
  - id: "sa-william-dwight-whitney"
    name:
      en: { text: "William Dwight Whitney" }
    born: 1827
    died: 1894
    bio:
      en: "William Dwight Whitney was an American linguist, philologist and lexicographer known for his work on Sanskrit grammar and Vedic philology. He was the first president of the American Philological Association."
  - id: "sa-charles-rockwell-lanman"
    name:
      en: { text: "Charles Rockwell Lanman" }
    born: 1850
    died: 1941
    bio:
      en: "Charles Rockwell Lanman was an American scholar of the Sanskrit language, known as a Sanskrit scholar and the editor of the Harvard Oriental Series. He taught at Harvard University."
  - id: "sa-edwin-arnold"
    name:
      en: { text: "Edwin Arnold" }
    born: 1832
    died: 1904
    bio:
      en: "Sir Edwin Arnold was an English poet and journalist, best known for his 1879 work The Light of Asia."
  - id: "sa-arthur-william-ryder"
    name:
      en: { text: "Arthur William Ryder" }
    born: 1877
    died: 1938
    bio:
      en: "Arthur William Ryder was a professor of Sanskrit at the University of California, Berkeley, best known for translating a number of Sanskrit works into English, including the Panchatantra and the Bhagavad Gita."
  - id: "sa-r-shamasastry"
    name:
      en: { text: "R. Shamasastry" }
    born: 1868
    died: 1944
    bio:
      en: "Rudrapatna Shamasastry was a Sanskrit scholar and librarian at the Oriental Research Institute in Mysore, who re-discovered and published the Arthashastra, an ancient Indian treatise on statecraft, economic policy and military strategy."
