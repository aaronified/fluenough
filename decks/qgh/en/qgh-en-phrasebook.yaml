"tags":
- "unreviewed"
"cards":
  "qgh-0011":
    "native": "Hello; greetings."
    "notes":
      "n1": "Chaîre is the greeting to one person, literally rejoice. Attested in Homer, for example to a guest in the Odyssey."
  "qgh-0012":
    "native": "Greetings, stranger."
    "notes":
      "n1": "Quoted from the Odyssey (book 1, line 123), where a host greets a guest. Xeînos is guest and stranger at once."
  "qgh-0013":
    "native": "Who are you, and from where among men?"
    "notes":
      "n1": "The Homeric formula asked of a newcomer (Odyssey 1.170 and elsewhere): literally who from where are you of men. Attested."
  "qgh-0014":
    "native": "Where are your city and your parents?"
    "notes":
      "n1": "The second half of the same formula (Odyssey 1.170). Attested."
  "qgh-0015":
    "native": "Come now."
    "notes":
      "n1": "Formulaic call to act, attested very often in the Iliad and the Odyssey; the apostrophe marks the elided final vowel of allá."
  "qgh-0016":
    "native": "Take courage."
    "notes":
      "n1": "Imperative of tharséō, take heart. Attested in Homer as a word of comfort."
  "qgh-0017":
    "native": "Come here."
    "notes":
      "n1": "Deûro is here, hither, and is used as the call come here. Attested."
  "qgh-0018":
    "native": "Go."
    "notes":
      "n1": "Íthi is the imperative go. Attested in Homer."
  "qgh-0019":
    "native": "Stay; wait."
    "notes":
      "n1": "Méne is the imperative of ménō, stay. Attested in Homer."
  "qgh-0020":
    "native": "Hear me."
    "notes":
      "n1": "The prayer formula klûthí moi, hear me (Iliad 1.37, to Apollo, and in many prayers). Attested."
  "qgh-0021":
    "native": "Father Zeus."
    "notes":
      "n1": "The address to Zeus (Iliad 3.276 and often). Attested."
  "qgh-0022":
    "native": "Friends!"
    "notes":
      "n1": "The address of a leader to his men, as in Iliad 2.110 (ō phíloi hḗrōes Danaoí). Attested."
  "qgh-0023":
    "native": "Tell me of the man, Muse."
    "notes":
      "n1": "The opening words of the Odyssey (1.1), where ándra, the man, is Odysseus. Attested; a famous line, not an everyday phrase."
  "qgh-0024":
    "native": "Sing the wrath, goddess."
    "notes":
      "n1": "The opening of the Iliad (1.1): mênin áeide, theá. Attested; a famous line, not an everyday phrase. The rest of the line names Achilles."
  "qgh-0025":
    "native": "I do not know."
    "notes":
      "n1": "Not a quoted line: conventional, composed from attested words (ouk, oîda). Homer uses oîda, I know, often, and the negative with it is regular."
