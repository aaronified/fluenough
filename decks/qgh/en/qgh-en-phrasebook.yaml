"name": "Phrasebook: first phrases"
"description": "Fifteen attested Homeric formulae: greetings, the question put to a stranger, calls to act, prayer and the opening lines of the two poems. Polytonic spelling as in Homeric texts. The reading and the IPA are as in the first-words deck (a transliteration in ISO 843 style; broad reconstructed IPA for about the fifth century BC). Each card's note says whether it is quoted from the poems or conventional. Not yet checked by a Hellenist: please report any mistake."
