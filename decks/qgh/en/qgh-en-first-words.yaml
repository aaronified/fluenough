"cards":
  "qgh-0001":
    "native": "yes"
    "notes":
      "n1": "Naí is yes, an emphatic yes that Homer often puts with an oath. Attested. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "ναί, ἐγὼ οἶδα.":
        "native": "Yes, I know."
        "bases":
          "ναί": "yes"
          "ἐγὼ": "I"
          "οἶδα": "to know (I know)"
      "ναὶ δή.":
        "native": "Yes, indeed."
        "bases":
          "ναὶ": "yes"
          "δή": "indeed"
  "qgh-0002":
    "native": "not; no"
    "notes":
      "n1": "Ou is not and no. It is written ouk before a vowel with a smooth breathing and ouch before one with a rough breathing. Attested. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "οὐκ οἶδα.":
        "native": "I do not know."
        "bases":
          "οὐκ": "not"
          "οἶδα": "to know (I know)"
      "οὐκ ἀγαθός ἐστιν.":
        "native": "He is not good."
        "bases":
          "οὐκ": "not"
          "ἀγαθός": "good"
          "ἐστιν": "to be (is)"
  "qgh-0003":
    "native": "I"
    "notes":
      "n1": "Egṓ is I. Homer also has egṓn before a vowel. The verb ending already says I, so egṓ is used for emphasis. Attested. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "ἐγὼ ὕδωρ πίνω.":
        "native": "I drink water."
        "bases":
          "ἐγὼ": "I"
          "ὕδωρ": "water"
          "πίνω": "to drink (I drink)"
      "ἐγὼ οὐκ οἶδα.":
        "native": "I do not know."
        "bases":
          "ἐγὼ": "I"
          "οὐκ": "not"
          "οἶδα": "to know (I know)"
  "qgh-0004":
    "native": "you"
    "notes":
      "n1": "Sý is you, one person, as the subject. The verb ending already says you, so sý is used for emphasis. Attested. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "σὺ ἀγαθὸς ἐσσί.":
        "native": "You are good."
        "bases":
          "σὺ": "you"
          "ἀγαθὸς": "good"
          "ἐσσί": "to be (you are)"
      "σὺ οὐκ οἶσθα.":
        "native": "You do not know."
        "bases":
          "σὺ": "you"
          "οὐκ": "not"
          "οἶσθα": "to know (you know)"
  "qgh-0005":
    "native": "water"
    "notes":
      "n1": "Hýdōr is water. Attested; its genitive is hýdatos. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "ὕδωρ ἀγαθόν ἐστιν.":
        "native": "Water is good."
        "bases":
          "ὕδωρ": "water"
          "ἀγαθόν": "good"
          "ἐστιν": "to be (is)"
      "ὕδωρ ἐστίν.":
        "native": "There is water."
        "bases":
          "ὕδωρ": "water"
          "ἐστίν": "to be (is)"
  "qgh-0006":
    "native": "good"
    "notes":
      "n1": "Agathós is good, and in Homer often brave or good at fighting. Attested; the neuter is agathón. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "ἀγαθός ἐστιν.":
        "native": "He is good."
        "bases":
          "ἀγαθός": "good"
          "ἐστιν": "to be (is)"
      "ἀγαθὸν ὕδωρ.":
        "native": "Good water."
        "bases":
          "ἀγαθὸν": "good"
          "ὕδωρ": "water"
  "qgh-0007":
    "native": "one"
    "notes":
      "n1": "Heîs is one, masculine; the feminine is mía and the neuter hén. Attested. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "εἷς ἐστιν.":
        "native": "There is one."
        "bases":
          "εἷς": "one"
          "ἐστιν": "to be (is)"
      "εἷς καὶ δύο.":
        "native": "One and two."
        "bases":
          "εἷς": "one"
          "καὶ": "and"
          "δύο": "two"
  "qgh-0008":
    "native": "two"
    "notes":
      "n1": "Dýo is two; Homer also writes dýō. Attested. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "ἐνθάδε δύο εἰσίν.":
        "native": "There are two here."
        "bases":
          "ἐνθάδε": "here"
          "δύο": "two"
          "εἰσίν": "to be (they are)"
      "δύο ἀγαθοί.":
        "native": "Two good men."
        "bases":
          "δύο": "two"
          "ἀγαθοί": "good (plural)"
  "qgh-0009":
    "native": "here"
    "notes":
      "n1": "Entháde is here, or to this place. Attested in the Odyssey. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "ἐνθάδε εἰμί.":
        "native": "I am here."
        "bases":
          "ἐνθάδε": "here"
          "εἰμί": "to be (I am)"
      "ἐνθάδε ὕδωρ ἐστίν.":
        "native": "There is water here."
        "bases":
          "ἐνθάδε": "here"
          "ὕδωρ": "water"
          "ἐστίν": "to be (is)"
  "qgh-0010":
    "native": "and"
    "notes":
      "n1": "Kaí is and, also, even. Attested; Homer also links with the particle te. The example sentences are composed from attested words; they are not quoted from a text."
    "examples":
      "ἐγὼ καὶ σύ.":
        "native": "You and I."
        "bases":
          "ἐγὼ": "I"
          "καὶ": "and"
          "σύ": "you"
      "ὕδωρ καὶ οἶνος.":
        "native": "Water and wine."
        "bases":
          "ὕδωρ": "water"
          "καὶ": "and"
          "οἶνος": "wine"
