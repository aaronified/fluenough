"name": "First words"
"description": "Ten words to start with: yes and no, I and you, water, good, one, two, here and and. The Greek of the Iliad and the Odyssey, written in polytonic spelling as in Homeric texts, without the digamma that the metre implies. The reading is a Latin transliteration in the style of ISO 843 and the SBL: th, ph, ch, ps and x for theta, phi, chi, psi and xi; ē and ō for eta and omega; y for upsilon (u in the diphthongs au, eu, ou); h for a rough breathing (rh for rho with a rough breathing); ng for two gammas in a row; an iota subscript is written i; alpha, iota and upsilon are not marked for length and accents are not shown. The IPA is broad and reconstructed, for about the fifth century BC: phi, theta and chi are aspirated stops (pʰ tʰ kʰ), eta and omega are the long vowels ɛː and ɔː, the diphthongs ei and ou are the long vowels eː and oː, upsilon is y, zeta is zd, a rough breathing is h, and the length of alpha, iota and upsilon is shown only where the word is known to have it (as in klūthi). It follows the transmitted Ionic text; the same sound values are used for the Attic deck, and the real differences of the epic dialect (its vowels, the lost w, its pitch accent) are not shown. Not yet checked by a Hellenist: please report any mistake."
