# Unit 26 grammar, there is and there is not. Sources read: en.wikipedia.org 'Polish grammar' (the present of być, jestem jesteś jest jesteśmy jesteście są; nie directly before the verb; jest and nie ma with the genitive; to jest; the genitive for the object of a negated verb) and the en.wiktionary.org entries być, mieć and nie ma (conjugation tables, usage examples).
