schema: 1
kind: "phonetics"
id: "pl-phonetics"
language: "pl"
variety: "Standard Polish, as the course's broad ipa writes it (tools/transcribe.py polish_ipa(): stress marked before the stressed syllable, ɛ ɔ ɨ, retroflex ʂ ʐ and tʂ dʐ, alveolo-palatal ɕ ʑ ɲ with tɕ dʑ as letter pairs, ts dz as letter pairs, ł as w, nasal vowels ɛ̃ ɔ̃ before fricatives and word-finally, ŋ before k ɡ, final devoicing and voice assimilation already applied), not a regional accent"
description: "Rules that turn a card's broad ipa into its narrow [ ] form, in order. Written for tools/derive_phonetic.py, never read by the app. Each rule applies the regular expression to the whole ipa string and replaces every match; the next rule works on the result. Only attested standard Polish allophony is here: the nasal semivowel of ę and ą (ɛw̃, ɔw̃), the palatal nasal approximant before fricatives, the tap r and its devoicing, postpalatal k ɡ x before i and j, the denti-alveolar t d n s z (and the affricates ts dz) with l dental before them and apical alveolar otherwise, the central ɨ, and the short glide j. Already in the broad ipa, so not repeated: voicing assimilation and final devoicing, ł as w, nasal assimilation to ŋ and ɲ, the palatal ɕ ʑ ɲ, the retroflex ʂ ʐ, and the denasalised ę ą before l and ł. Left out, on purpose, because the sources read give no clear rule for the course's broad forms: aspiration (Wikipedia says only that stops in clusters may have a weak aspiration or a fricated release, and the Wiktionary appendix has no note, so no claim of unaspirated or aspirated p t k is made), the place of ʂ ʐ tʂ dʐ (the sources call them apical, laminal, flat, retroflex or alveolar, so the broad symbols are kept), the velarised ɫ (Eastern dialects only), the palatalised allophones of t d n s z r l before i in loanwords (rare, and the broad ipa does not mark them), and the nasal vowels before ɕ and ʑ. Sources are Wikipedia, Polish phonology, and Wiktionary, Appendix:Polish pronunciation, both read 2026-11-28. Rules marked as the builder's choice go beyond an example in the source. Not verified by a Polish phonetician, so the rules ship unreviewed."
rules:
- id: "pl-nasal-vowel-w"
  pattern: "([ɛɔ])̃(?=[szʂʐx]|$|\\s)"
  replace: "\\1w̃"
  source: "en.wiktionary.org, \"Appendix:Polish pronunciation\", read 2026-11-28 (CC BY-SA 4.0), Consonants, note on ą and ę: \"The letters ą and ę are used to represent /ɔw̃/ and /ɛw̃/ before /s, z, ʂ, ʐ, x/, and, in case of ą, word-finally\"; Wikipedia, \"Polish phonology\", read 2026-11-28 (CC BY-SA 4.0), Vowels, Nasal: \"oral vowel followed by a nasal semivowel\", są [sɔw̃]. The broad ipa writes ɛ̃ ɔ̃. Before ɕ ʑ the sources give no clear rule (the Wikipedia page has a palatal j̃ for ɲ before fricatives, but no ę or ą example), so those stay ɛ̃ ɔ̃."
- id: "pl-ny-before-fricative"
  pattern: "ɲ(?=[fvszʂʐxɕʑ])"
  replace: "j̃"
  source: "Wikipedia, \"Polish phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants, Allophones: before fricatives /ɲ/ is \"usually realized as a nasalized palatal approximant\", państwo [paj̃stfo]. Not before an affricate (pięć keeps ɲ, where the page writes a homorganic nasal)."
- id: "pl-r-devoiced-after-voiceless"
  pattern: "(?<=[ptkfsxʂɕ])r"
  replace: "ɾ̥"
  source: "Wikipedia, \"Polish phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants, Allophones, /r/: \"After voiceless obstruents it devoices\", wiatr [vjatɾ̥]. Written ɾ̥ as the source writes it, before the general tap rule below."
- id: "pl-r-tap"
  pattern: "r(?!̥)"
  replace: "ɾ̺"
  source: "Wikipedia, \"Polish phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants, Allophones, /r/: \"apical alveolar\"; \"more recent studies show that /r/ is predominantly realized as a tap [ɾ̺]\", \"almost never as a trill\" (80 to 90 percent a tap after a consonant). The older trill is not written."
- id: "pl-k-postpalatal"
  pattern: "k(?=ˈ?[ij])"
  replace: "c̠"
  source: "Wikipedia, \"Polish phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants, Allophones: \"/k, ɡ, x/ before /i, j/ are postpalatal\" [c̠, ɟ̠, ç̠]. The j is kept: the page does not say it is absorbed (as Greek does)."
- id: "pl-g-postpalatal"
  pattern: "ɡ(?=ˈ?[ij])"
  replace: "ɟ̠"
  source: "Wikipedia, \"Polish phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants, Allophones: \"/k, ɡ, x/ before /i, j/ are postpalatal\" [c̠, ɟ̠, ç̠]."
- id: "pl-x-postpalatal"
  pattern: "x(?=ˈ?[ij])"
  replace: "ç̠"
  source: "Wikipedia, \"Polish phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants, Allophones: \"/x/ is primarily velar [x]\", with postpalatal [ç̠] before /i, j/."
- id: "pl-ng-postpalatal"
  pattern: "ŋ(?=[cɟ]̠)"
  replace: "ɲ̠"
  source: "Wikipedia, \"Polish phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants, Allophones: \"A postpalatal allophone [ɲ̠] of /ŋ/ appears only in front of [c̠, ɟ̠].\" Runs after the two rules above, which make the following stop postpalatal."
- id: "pl-td-dental"
  pattern: "([td])(?!̪)(?![sz]?ˈ?[ijʂʐɕʑ])"
  replace: "\\1̪"
  source: "Wikipedia, \"Polish phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants, Allophones: \"/n, t, d, t͡s, d͡z, s, z/ are denti-alveolar [n̪, t̪, d̪, …] except before /i, j/ and postalveolar consonants\". The broad ts and dz are letter pairs, so the t or d of an affricate gets the mark here and its s or z in the next rule. Not before ʂ ʐ ɕ ʑ (which covers tʂ dʐ tɕ dʑ). The Wiktionary appendix writes plain t d n s z and gives no dental place, so the Wikipedia page is the source."
- id: "pl-nsz-dental"
  pattern: "([nsz])(?!̪)(?!ˈ?[ijʂʐɕʑ])"
  replace: "\\1̪"
  source: "Wikipedia, \"Polish phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants, Allophones: \"/n, t, d, t͡s, d͡z, s, z/ are denti-alveolar [n̪ … s̪, z̪]\" except before /i, j/ and postalveolar consonants; soft ɲ ɕ ʑ and retroflex ʂ ʐ are different letters in the broad ipa and are not touched."
- id: "pl-l-palatalized"
  pattern: "l(?=ˈ?[ij])"
  replace: "l̻ʲ"
  source: "Wikipedia, \"Polish phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants, Allophones, /l/: \"apical alveolar\" [l̺] in general, but \"A palatalized laminal [l̻ʲ] or alveopalatal [ʎ̟] is used before /i, j/\" (the builder takes the first form). So no l̺ and no dental mark before i or j; the glide rule below adds no second ʲ after it."
- id: "pl-l-dental"
  pattern: "l(?=[tdnsz]̪)"
  replace: "l̪"
  source: "Wikipedia, \"Polish phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants, Allophones: /l/ \"becomes denti-alveolar\" [l̪] before the denti-alveolar set above. Runs after the dental marks, which it reads."
- id: "pl-l-apical"
  pattern: "l(?![̪̻])"
  replace: "l̺"
  source: "Wikipedia, \"Polish phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants, Allophones: /l/ \"is apical alveolar\" [l̺]. The dark ɫ of Eastern dialects is not written: ł is w in standard Polish, which the broad ipa already has."
- id: "pl-y-central"
  pattern: "ɨ"
  replace: "ɘ̟"
  source: "Wikipedia, \"Polish phonology\", read 2026-11-28 (CC BY-SA 4.0), Vowels, Oral, Close: /ɨ/ \"ranges from almost close-mid near-front [ɪ̞] to (advanced) close-mid central [ɘ̟]\", the traditional narrow transcription being [ɨ]; en.wiktionary.org, \"Appendix:Polish pronunciation\", read 2026-11-28 (CC BY-SA 4.0), Vowels: ⟨y⟩ is written ɘ. The builder takes the advanced central form of the range."
- id: "pl-glide-after-consonant"
  pattern: "(?<=[bpvfmnɲkɡxtdszrlwʂʐɕʑ̪̺])j(?=[aɛɔuɨ])"
  replace: "ʲi̯"
  source: "Wikipedia, \"Polish phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants, Allophones: after a consonant before a vowel /j/ is \"reduced and very short\" [i̯], miasto [ˈmʲi̯astɔ] (the preceding consonant palatalised, as the example writes it). The page gives that one example; the builder applies the sentence to the other consonants before a, ɛ, ɔ, u, ɨ, not before i, and not after the postpalatal c̠ ɟ̠ ç̠ (the source writes the stop, not a palatalised one, before j)."
- id: "pl-glide-after-palatal"
  pattern: "(?<=ʲ)j(?=[aɛɔuɨ])"
  replace: "i̯"
  source: "Wikipedia, \"Polish phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants, Allophones: after a consonant before a vowel /j/ is \"reduced and very short\" [i̯]. After a consonant that already carries ʲ (the palatalized laminal l̻ʲ above, or ʲ written in the broad ipa) only the glide changes, so ʲ is not written twice."
- id: "pl-glide-final"
  pattern: "(?<=[aɛɔuɨ])j(?=$|\\s)"
  replace: "i̯"
  source: "Wikipedia, \"Polish phonology\", read 2026-11-28 (CC BY-SA 4.0), Consonants, Allophones: word-finally after a vowel /j/ is non-syllabic, raj [ɾai̯]."
