schema: 1
id: "pl-en-grammar-grammatical-gender-sentences"
kind: "layer"
core: "pl-grammar-grammatical-gender-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Gender in sentences"
license: "CC-BY-SA-4.0"
description: "16 short sentences with this, my and your, written from the table: the word takes the gender of the noun. Not yet checked by a Polish speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "pl-4100":
    native: "This is my brother."
    notes:
      "n1": "brat is masculine, so it takes the masculine mój. The frame To jest and a noun in the nominative is the one Wikipedia's page on Polish grammar gives for to jest."
    bases:
      "To": "this; it"
      "jest": "is (a form of być, to be)"
  "pl-4101":
    native: "This is my sister."
    notes:
      "n1": "siostra is feminine, so it takes the feminine moja."
    bases:
      "To": "this; it"
      "jest": "is (a form of być, to be)"
      "moja": "my (feminine)"
  "pl-4102":
    native: "This is my window."
    notes:
      "n1": "okno is neuter, so it takes the neuter moje."
    bases:
      "To": "this; it"
      "jest": "is (a form of być, to be)"
      "moje": "my (neuter)"
  "pl-4103":
    native: "This is your house."
    notes:
      "n1": "dom is masculine, so it takes the masculine twój."
    bases:
      "To": "this; it"
      "jest": "is (a form of być, to be)"
  "pl-4104":
    native: "This is your mum."
    notes:
      "n1": "mama is feminine (it ends in -a), so it takes the feminine twoja."
    bases:
      "To": "this; it"
      "jest": "is (a form of być, to be)"
      "twoja": "your (feminine)"
  "pl-4105":
    native: "This is your child."
    notes:
      "n1": "dziecko is neuter, so it takes the neuter twoje."
    bases:
      "To": "this; it"
      "jest": "is (a form of być, to be)"
      "twoje": "your (neuter)"
  "pl-4106":
    native: "This table is mine."
    notes:
      "n1": "stół is masculine, so it takes the masculine ten and mój."
    bases:
      "jest": "is (a form of być, to be)"
  "pl-4107":
    native: "This water is yours."
    notes:
      "n1": "woda is feminine, so it takes the feminine ta and twoja."
    bases:
      "Ta": "this (feminine)"
      "jest": "is (a form of być, to be)"
      "twoja": "your (feminine)"
  "pl-4108":
    native: "This window is yours."
    notes:
      "n1": "okno is neuter, so it takes the neuter to and twoje. To is also the word in To jest, this is."
    bases:
      "To": "this (neuter)"
      "jest": "is (a form of być, to be)"
      "twoje": "your (neuter)"
  "pl-4109":
    native: "My dad is here."
    notes:
      "n1": "tata names a man and is masculine although it ends in -a, so it takes mój, not moja. Wikipedia's page on Polish grammar lists such nouns."
    bases:
      "jest": "is (a form of być, to be)"
  "pl-4110":
    native: "Your sister is here."
    notes:
      "n1": "siostra is feminine, so it takes the feminine twoja."
    bases:
      "Twoja": "your (feminine)"
      "jest": "is (a form of być, to be)"
  "pl-4111":
    native: "This dog is mine."
    notes:
      "n1": "pies is masculine (an animal), so it takes the masculine ten and mój."
    bases:
      "jest": "is (a form of być, to be)"
  "pl-4112":
    native: "This woman is here."
    notes:
      "n1": "kobieta is feminine, so it takes the feminine ta."
    bases:
      "Ta": "this (feminine)"
      "jest": "is (a form of być, to be)"
  "pl-4113":
    native: "Where is my cat?"
    notes:
      "n1": "kot is masculine, so it takes the masculine mój. Gdzie jest is the frame of the phrasebook sentence Gdzie jest dworzec?"
    bases:
      "jest": "is (a form of być, to be)"
  "pl-4114":
    native: "Where is your mum?"
    notes:
      "n1": "mama is feminine, so it takes the feminine twoja."
    bases:
      "jest": "is (a form of być, to be)"
      "twoja": "your (feminine)"
  "pl-4115":
    native: "This night is mine."
    notes:
      "n1": "noc is feminine although it ends in a consonant, so it takes ta and moja."
    bases:
      "Ta": "this (feminine)"
      "jest": "is (a form of być, to be)"
      "moja": "my (feminine)"
