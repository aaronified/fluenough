schema: 1
id: "pl-en-phrasebook"
kind: "layer"
core: "pl-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty survival phrases to say whole from the first lesson, before their words are taught: greetings and goodbyes, sorry, not understanding, asking the way and the price, and asking for help. Not yet checked by a Polish speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "pl-0011":
    native: "Good day; hello (formal)."
    notes:
      "n1": "The polite hello, from morning until evening. Among friends, say cześć."
    bases:
      "Dzień": "day"
  "pl-0012":
    native: "Good night."
    notes:
      "n1": "Said at bedtime, or when leaving late in the evening. It is a farewell, not a greeting."
    bases:
      "Dobranoc": "good night"
  "pl-0013":
    native: "Goodbye."
    notes:
      "n1": "The formal goodbye. It means until seeing, and is the usual parting in a shop or an office."
    bases:
      "Do": "until; to"
      "widzenia": "seeing"
  "pl-0014":
    native: "Sorry; excuse me."
    notes:
      "n1": "Said to get attention, or to apologise. For a bigger apology, say Przykro mi, I am sorry."
    bases:
      "Przepraszam": "to apologise (I form)"
  "pl-0015":
    native: "Excuse me, where is the toilet?"
    notes:
      "n1": "Asks the way. Put another place in for toaleta."
    bases:
      "Przepraszam": "to apologise (I form)"
      "gdzie": "where"
      "jest": "to be"
      "toaleta": "toilet"
  "pl-0016":
    native: "I don't understand."
    notes:
      "n1": "Nie goes before the verb; rozumiem shows the person (I)."
    bases:
      "rozumiem": "to understand"
  "pl-0017":
    native: "I don't speak Polish."
    notes:
      "n1": "Po polsku means in Polish: po with the language in the locative form."
    bases:
      "mówię": "to speak"
      "po": "in (a language)"
      "polsku": "Polish"
  "pl-0018":
    native: "Do you speak English?"
    notes:
      "n1": "The same question works for any language: Mówisz po and the language in the locative form."
    bases:
      "Mówisz": "to speak"
      "po": "in (a language)"
      "angielsku": "English"
  "pl-0019":
    native: "Speak more slowly, please."
    notes:
      "n1": "Mów is the command to speak. Wolniej is more slowly."
    bases:
      "Mów": "to speak (command)"
      "wolniej": "slowly"
  "pl-0020":
    native: "Once more, please."
    notes:
      "n1": "Jeszcze raz means once more, or again."
    bases:
      "Jeszcze": "still; yet; again"
      "raz": "once; time"
  "pl-0021":
    native: "How much is it?"
    notes:
      "n1": "Ile is how much; kosztuje means it costs."
    bases:
      "Ile": "how much"
      "to": "it; this"
      "kosztuje": "to cost"
  "pl-0022":
    native: "The bill, please."
    notes:
      "n1": "Rachunek is the bill in a restaurant or a shop."
    bases:
      "Poproszę": "to ask for; to request"
      "rachunek": "bill; account"
  "pl-0023":
    native: "Help!"
    notes:
      "n1": "A cry for help. It is the genitive of pomoc, help."
    bases:
      "Pomocy": "help"
  "pl-0024":
    native: "Where is the station?"
    notes:
      "n1": "Dworzec is a railway or bus station. Put another place in for dworzec."
    bases:
      "Gdzie": "where"
      "jest": "to be"
      "dworzec": "station"
  "pl-0025":
    native: "What does that mean?"
    notes:
      "n1": "Znaczy is the verb to mean. Use it for any word you do not know."
    bases:
      "Co": "what"
      "to": "this; it"
      "znaczy": "to mean"
  "pl-0026":
    native: "My name is Anna."
    notes:
      "n1": "Literally I call myself Anna. Put any name after się."
    bases:
      "Nazywam": "to call; to name (I form)"
      "się": "oneself"
      "Anna": "Anna (a first name)"
  "pl-0027":
    native: "Nice to meet you."
    notes:
      "n1": "Literally: it is nice to me, to get to know you. Cię is the form of ty used for you."
    bases:
      "Miło": "nice; pleasant"
      "poznać": "to get to know"
  "pl-0028":
    native: "Where are you from?"
    notes:
      "n1": "Skąd means from where. Answer with Jestem z and a country or a city."
    bases:
      "Skąd": "from where"
      "jesteś": "to be"
  "pl-0029":
    native: "It's fine; OK."
    notes:
      "n1": "Literally: in order."
    bases:
      "W": "in"
      "porządku": "order"
  "pl-0030":
    native: "Enjoy your meal!"
    notes:
      "n1": "Said to someone about to eat. It is the genitive of smaczny, tasty."
    bases:
      "Smacznego": "tasty; good to eat"
