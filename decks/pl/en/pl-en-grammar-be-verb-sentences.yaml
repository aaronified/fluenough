schema: 1
id: "pl-en-grammar-be-verb-sentences"
kind: "layer"
core: "pl-grammar-be-verb-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "To be and to have in sentences"
license: "CC-BY-SA-4.0"
description: "19 short sentences with być, nie ma and mieć, written from the tables. Three are Wiktionary or Wikipedia examples. Not yet checked by a Polish speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "pl-4400":
    native: "I am at home."
    notes:
      "n1": "Jestem is być with ja; the pronoun is left out. domu is the locative of dom after w."
    bases:
      "Jestem": "am (a form of być, to be)"
  "pl-4401":
    native: "You are at school."
    notes:
      "n1": "Jesteś is być with ty. szkole is the locative of szkoła after w."
    bases:
      "Jesteś": "are (a form of być, to be)"
  "pl-4402":
    native: "He is in the room."
    notes:
      "n1": "Jest is być with on. pokoju is the locative of pokój after w."
    bases:
      "jest": "is (a form of być, to be)"
  "pl-4403":
    native: "She is in the kitchen."
    notes:
      "n1": "Jest is być with ona, the same form as with on. kuchni is the locative of kuchnia after w."
    bases:
      "jest": "is (a form of być, to be)"
  "pl-4404":
    native: "We are in Poland."
    notes:
      "n1": "Jesteśmy is być with my. Polsce is the locative of Polska after w."
    bases:
      "Jesteśmy": "are (a form of być, to be)"
  "pl-4405":
    native: "Are you here?"
    notes:
      "n1": "Jesteście is być with wy. A question can be asked with the voice alone, without czy."
    bases:
      "Jesteście": "are (a form of być, to be)"
  "pl-4406":
    native: "They are in the city."
    notes:
      "n1": "Są is być with oni. mieście is the locative of miasto after w."
    bases:
      "są": "are (a form of być, to be)"
  "pl-4407":
    native: "This is a house."
    notes:
      "n1": "To jest and a noun in the nominative is the frame Wikipedia's page on Polish grammar gives for to jest."
    bases:
      "To": "this; it"
      "jest": "is (a form of być, to be)"
  "pl-4408":
    native: "This is not my house."
    notes:
      "n1": "Nie goes directly before the verb: to nie jest. dom is masculine, so it takes mój."
    bases:
      "To": "this; it"
      "jest": "is (a form of być, to be)"
  "pl-4409":
    native: "There is no water."
    notes:
      "n1": "Nie ma takes the genitive: wody is the genitive of woda. It is not taught yet, so learn nie ma wody as one frame. Wikipedia's page on Polish grammar gives Nie ma kota in the same way."
    bases:
      "ma": "has (here: nie ma, there is no)"
  "pl-4410":
    native: "There is no bread."
    notes:
      "n1": "chleba is the genitive of chleb. Wiktionary's entry for nie ma gives this sentence."
    bases:
      "ma": "has (here: nie ma, there is no)"
  "pl-4411":
    native: "There is no milk."
    notes:
      "n1": "mleka is the genitive of mleko."
    bases:
      "ma": "has (here: nie ma, there is no)"
  "pl-4412":
    native: "There is no cat."
    notes:
      "n1": "kota is the genitive of kot. Wikipedia's page on Polish grammar gives this sentence."
    bases:
      "ma": "has (here: nie ma, there is no)"
  "pl-4413":
    native: "I have a book."
    notes:
      "n1": "Mam is mieć with ja. książkę is the accusative of książka."
  "pl-4414":
    native: "I do not have a book."
    notes:
      "n1": "Nie goes before mam, and the book changes to the genitive, książki: Wikipedia's page on Polish grammar says the genitive is used for the object of a negated verb."
    bases:
      "książki": "book (here: the object of a negated verb)"
  "pl-4415":
    native: "We do not have a house."
    notes:
      "n1": "Mamy is mieć with my. domu is the genitive of dom, after nie."
  "pl-4416":
    native: "He does not have time."
    notes:
      "n1": "Ma is mieć with on; czasu is the genitive of czas. Wiktionary's entry for nie ma gives this sentence."
  "pl-4417":
    native: "Do you have a brother?"
    notes:
      "n1": "Masz is mieć with ty, and brata is the accusative of brat. The question is asked with the voice alone."
  "pl-4418":
    native: "No, I do not have a brother."
    notes:
      "n1": "After nie mam the noun is in the genitive, and the genitive of brat is brata, the same as its accusative."
