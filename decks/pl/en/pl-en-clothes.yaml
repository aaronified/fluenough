schema: 1
id: "pl-en-clothes"
kind: "layer"
core: "pl-clothes"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Clothes"
license: "CC-BY-SA-4.0"
description: "Clothes and accessories: a shirt, a skirt, a dress, a jacket, a hat, a scarf, a belt, a sock, a shoe, a sandal, a pocket, and the verbs to put on, to dress and to take off. Not yet checked by a Polish speaker: please report any mistake."
tags: ["unreviewed"]

cards:
  "pl-2910":
    native: "piece of clothing"
    notes:
      "n1": "ubranie is neuter."
    examples:
      "To jest ubranie.":
        native: "This is a piece of clothing."
        bases:
          "To": "this, it"
          "jest": "to be"
          "ubranie": "piece of clothing"
      "Gdzie jest ubranie?":
        native: "Where is the piece of clothing?"
        bases:
          "Gdzie": "where"
          "jest": "to be"
          "ubranie": "piece of clothing"
