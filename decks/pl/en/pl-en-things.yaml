core: "pl-things"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Things"
license: "CC-BY-SA-4.0"
description: "Things to have and use: a book, a pen, a chair, a bed, a key, a bag, a bowl, a towel, a photo, a guitar and more, with their first sentences in the examples. Not yet checked by a Polish speaker: please report any mistake."
tags: ["unreviewed"]

