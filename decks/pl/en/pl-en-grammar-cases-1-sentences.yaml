schema: 1
id: "pl-en-grammar-cases-1-sentences"
kind: "layer"
core: "pl-grammar-cases-1-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The cases in sentences"
license: "CC-BY-SA-4.0"
description: "19 short sentences with the nominative, the accusative and the locative, written from the tables. Two are Wiktionary examples. Not yet checked by a Polish speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "pl-4300":
    native: "I have a dog."
    notes:
      "n1": "psa is the accusative of pies. A masculine noun for an animal takes the ending -a in the accusative, as kota does. The subject ja is left out."
  "pl-4301":
    native: "I have a sister."
    notes:
      "n1": "siostrę is the accusative of siostra: the -a becomes -ę."
  "pl-4302":
    native: "I read a book."
    notes:
      "n1": "książkę is the accusative of książka: the -a becomes -ę. It is the object of czytam."
  "pl-4303":
    native: "We drink milk."
    notes:
      "n1": "mleko is neuter, so its accusative is the same as the nominative."
  "pl-4304":
    native: "Mum has a cat."
    notes:
      "n1": "Ma is mieć with ona. kota is the accusative of kot. Wikipedia's page on Polish grammar gives the same order of words for Alicja ma kota."
  "pl-4305":
    native: "The cat is on the table."
    notes:
      "n1": "stole is the locative of stół after na: the ó becomes o and the ending is -e."
    bases:
      "jest": "is (a form of być, to be)"
  "pl-4306":
    native: "The book is on the table."
    notes:
      "n1": "stole is the locative of stół after na."
    bases:
      "jest": "is (a form of być, to be)"
  "pl-4307":
    native: "Mum is at home."
    notes:
      "n1": "domu is the locative of dom after w. Wiktionary's table gives w domu."
    bases:
      "jest": "is (a form of być, to be)"
  "pl-4308":
    native: "My brother is at school."
    notes:
      "n1": "szkole is the locative of szkoła after w: -ła becomes -le."
    bases:
      "jest": "is (a form of być, to be)"
  "pl-4309":
    native: "I live in Poland."
    notes:
      "n1": "Polsce is the locative of Polska after w: -ka becomes -ce."
  "pl-4310":
    native: "The child is in the room."
    notes:
      "n1": "pokoju is the locative of pokój after w: the ending is -u after the soft j."
    bases:
      "jest": "is (a form of być, to be)"
  "pl-4311":
    native: "The dog is on the street."
    notes:
      "n1": "ulicy is the locative of ulica after na: -ca becomes -cy."
    bases:
      "jest": "is (a form of być, to be)"
  "pl-4312":
    native: "My brother lives in the city."
    notes:
      "n1": "mieście is the locative of miasto after w: the a becomes e and the t becomes ć."
  "pl-4313":
    native: "These are cats."
    notes:
      "n1": "koty is the nominative plural of kot. To są is the plural of To jest: Wikipedia's page on Polish grammar gives to są as the frame, with the nouns in the nominative."
    bases:
      "To": "this; it"
      "są": "are (a form of być, to be)"
  "pl-4314":
    native: "These are houses."
    notes:
      "n1": "domy is the nominative plural of dom."
    bases:
      "To": "this; it"
      "są": "are (a form of być, to be)"
  "pl-4315":
    native: "Do you have a dog?"
    notes:
      "n1": "Masz is mieć with ty, and psa is the accusative of pies. Czy starts a yes-or-no question."
  "pl-4316":
    native: "Where do you live?"
    notes:
      "n1": "Mieszkasz is mieszkać with ty. A question with gdzie asks for a place, and the answer uses the locative: Mieszkam w Polsce."
  "pl-4317":
    native: "I am sitting on a horse."
    notes:
      "n1": "koniu is the locative of koń after na: the ending is -u after the soft ń. Wiktionary's entry for na gives this sentence."
  "pl-4318":
    native: "I live in the countryside."
    notes:
      "n1": "wsi is the locative of wieś after na: the e drops out. Wiktionary's entry for na gives this sentence."
