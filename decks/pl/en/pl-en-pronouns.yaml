schema: 1
id: "pl-en-pronouns"
kind: "layer"
core: "pl-pronouns"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Pronouns"
description: "Pronouns: he, she, it, they, we, you, me, him, her, us, them, the possessives my, your, our, their and one's own, this, and the words for everyone, everything, something, someone, nothing and nobody. Not yet checked by a Polish speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]

cards:
  "pl-1370":
    native: "he; it (for a masculine thing)"
    notes:
      "n1": "For a man, or a masculine noun, on means he or it. ona is she or it for feminine nouns; ono is it for neuter nouns."
    examples:
      "On jest dobry.":
        native: "He is good."
        bases:
          "On": "he"
          "jest": "to be"
          "dobry": "good"

  "pl-1371":
    native: "she; it (for a feminine thing)"
    notes:
      "n1": "Feminine: she, or it for a feminine noun. The masculine is on and the neuter is ono."
    examples:
      "Ona jest dobra.":
        native: "She is good."
        bases:
          "Ona": "she"
          "jest": "to be"
          "dobra": "good"

  "pl-1372":
    native: "it (for a neuter thing)"
    notes:
      "n1": "Neuter: it, for a neuter noun. The masculine is on and the feminine is ona."
    examples:
      "Ono jest dobre.":
        native: "It is good."
        bases:
          "Ono": "it"
          "jest": "to be"
          "dobre": "good"

  "pl-1373":
    native: "they (men, or a group with men)"
    notes:
      "n1": "Plural of on. Used for a group that includes men, or for men only."
    examples:
      "Oni są dobrzy.":
        native: "They are good."
        bases:
          "Oni": "they"
          "są": "to be"
          "dobrzy": "good"

  "pl-1374":
    native: "they (women, or things)"
    notes:
      "n1": "Plural of ona and ono: used for a group of women or of things, with no men."
    examples:
      "One są dobre.":
        native: "They are good."
        bases:
          "One": "they"
          "są": "to be"
          "dobre": "good"

  "pl-1375":
    native: "we"
    notes:
      "n1": "First person plural: a group that includes you or not."
    examples:
      "My jesteśmy dobrzy.":
        native: "We are good."
        bases:
          "My": "we"
          "jesteśmy": "to be"
          "dobrzy": "good"

  "pl-1376":
    native: "you (plural)"
    notes:
      "n1": "Second person plural: more than one person. The polite singular you is pan or pani."
    examples:
      "Wy jesteście dobrzy.":
        native: "You are good."
        bases:
          "Wy": "you (plural)"
          "jesteście": "to be"
          "dobrzy": "good"

  "pl-1377":
    native: "me"
    notes:
      "n1": "The form of ja used after a verb or a preposition: me, not I."
    examples:
      "Ty mnie znasz.":
        native: "You know me."
        bases:
          "Ty": "you"
          "mnie": "me"
          "znasz": "to know"

  "pl-1378":
    native: "to me"
    notes:
      "n1": "The form of ja for to me. Miło mi means nice to meet you, said on being introduced."
    examples:
      "Miło mi cię poznać.":
        native: "Nice to meet you."
        bases:
          "Miło": "nice"
          "mi": "to me"
          "cię": "you"
          "poznać": "to meet"

  "pl-1379":
    native: "you (object)"
    notes:
      "n1": "The unstressed form of ty for you as the object of a verb. The stressed form is ciebie."
    examples:
      "Widzę cię.":
        native: "I see you."
        bases:
          "Widzę": "to see"
          "cię": "you"

  "pl-1380":
    native: "to you"
    notes:
      "n1": "The unstressed form of ty for to you. The stressed form is tobie."
    examples:
      "Dziękuję ci.":
        native: "Thank you."
        bases:
          "Dziękuję": "to thank"
          "ci": "to you"

  "pl-1381":
    native: "us"
    notes:
      "n1": "The form of my used as an object: us."
    examples:
      "Ty nas znasz.":
        native: "You know us."
        bases:
          "Ty": "you"
          "nas": "us"
          "znasz": "to know"

  "pl-1382":
    native: "to us"
    notes:
      "n1": "The form of my for to us."
    examples:
      "Ty nam dziękujesz.":
        native: "You thank us."
        bases:
          "Ty": "you"
          "nam": "to us"
          "dziękujesz": "to thank"

  "pl-1383":
    native: "to you (plural)"
    notes:
      "n1": "The form of wy for to you, to more than one person."
    examples:
      "Dziękuję wam.":
        native: "Thank you."
        bases:
          "Dziękuję": "to thank"
          "wam": "to you (plural)"

  "pl-1384":
    native: "him"
    notes:
      "n1": "The form of on used as the object of a verb: him."
    examples:
      "Znam go.":
        native: "I know him."
        bases:
          "Znam": "to know"
          "go": "him"

  "pl-1385":
    native: "his; its"
    notes:
      "n1": "The possessive of on and ono: his, or its. It does not change for the thing owned."
    examples:
      "To jest jego.":
        native: "This is his."
        bases:
          "To": "this; it"
          "jest": "to be"
          "jego": "his"

  "pl-1386":
    native: "her; hers"
    notes:
      "n1": "The possessive of ona: her, or hers. It does not change for the thing owned."
    examples:
      "To jest jej.":
        native: "This is hers."
        bases:
          "To": "this; it"
          "jest": "to be"
          "jej": "hers"

  "pl-1387":
    native: "her (object)"
    notes:
      "n1": "The form of ona used as the object of a verb: her."
    examples:
      "Znam ją.":
        native: "I know her."
        bases:
          "Znam": "to know"
          "ją": "her"

  "pl-1388":
    native: "to him"
    notes:
      "n1": "The unstressed form of on for to him. Also used for to it after ono."
    examples:
      "Dziękuję mu.":
        native: "Thank him."
        bases:
          "Dziękuję": "to thank"
          "mu": "to him"

  "pl-1389":
    native: "their; theirs"
    notes:
      "n1": "The possessive of oni and one: their, or theirs."
    examples:
      "To jest ich.":
        native: "This is theirs."
        bases:
          "To": "this; it"
          "jest": "to be"
          "ich": "theirs"

  "pl-1390":
    native: "oneself; each other"
    notes:
      "n1": "A reflexive particle: it goes with a verb about the subject, as in nazywam się, I am called."
    examples:
      "Nazywam się Anna.":
        native: "My name is Anna."
        bases:
          "Nazywam": "to call; to name"
          "się": "oneself"
          "Anna": "Anna"

  "pl-1391":
    native: "my; mine"
    notes:
      "n1": "Possessive: my or mine. It changes with the noun: mój (m), moja (f), moje (n)."
    examples:
      "To jest mój.":
        native: "This is mine."
        bases:
          "To": "this; it"
          "jest": "to be"
          "mój": "my; mine"

  "pl-1392":
    native: "your; yours"
    notes:
      "n1": "Possessive for one person you: your or yours. It changes with the noun: twój (m), twoja (f), twoje (n)."
    examples:
      "To jest twój.":
        native: "This is yours."
        bases:
          "To": "this; it"
          "jest": "to be"
          "twój": "your; yours"

  "pl-1393":
    native: "our; ours"
    notes:
      "n1": "Possessive for we: our or ours. It changes with the noun: nasz (m), nasza (f), nasze (n)."
    examples:
      "To jest nasz.":
        native: "This is ours."
        bases:
          "To": "this; it"
          "jest": "to be"
          "nasz": "our"

  "pl-1394":
    native: "your (plural); yours"
    notes:
      "n1": "Possessive for more than one you: your or yours. It changes with the noun: wasz (m), wasza (f), wasze (n)."
    examples:
      "To jest wasz.":
        native: "This is yours."
        bases:
          "To": "this; it"
          "jest": "to be"
          "wasz": "your (plural)"

  "pl-1395":
    native: "one's own"
    notes:
      "n1": "Possessive for the subject of the sentence: my own, your own, and so on. It changes with the noun: swój (m), swoja (f), swoje (n)."
    examples:
      "Mam swój.":
        native: "I have my own."
        bases:
          "Mam": "to have"
          "swój": "one's own"

  "pl-1396":
    native: "this; that"
    notes:
      "n1": "The masculine form of this. ta is feminine and to is neuter."
    examples:
      "Ten jest dobry.":
        native: "This is good."
        bases:
          "Ten": "this"
          "jest": "to be"
          "dobry": "good"

  "pl-1397":
    native: "each; every; everyone"
    notes:
      "n1": "Each one of a group, or everyone. It changes with the noun: każdy (m), każda (f), każde (n)."
    examples:
      "Każdy jest dobry.":
        native: "Everyone is good."
        bases:
          "Każdy": "each"
          "jest": "to be"
          "dobry": "good"

  "pl-1398":
    native: "everything"
    notes:
      "n1": "All things, taken together."
    examples:
      "Wszystko jest dobre.":
        native: "Everything is good."
        bases:
          "Wszystko": "everything"
          "jest": "to be"
          "dobre": "good"

  "pl-1399":
    native: "nothing"
    notes:
      "n1": "A negative word: with a verb, put nie before the verb, as in nic nie rozumiem."
    examples:
      "Nic nie rozumiem.":
        native: "I do not understand anything."
        bases:
          "Nic": "nothing"
          "nie": "not"
          "rozumiem": "to understand"

  "pl-1400":
    native: "someone"
    notes:
      "n1": "A person, not known or not named."
    examples:
      "Ktoś jest dobry.":
        native: "Someone is good."
        bases:
          "Ktoś": "someone"
          "jest": "to be"
          "dobry": "good"

  "pl-1401":
    native: "something"
    notes:
      "n1": "A thing, not known or not named."
    examples:
      "Coś jest dobre.":
        native: "Something is good."
        bases:
          "Coś": "something"
          "jest": "to be"
          "dobre": "good"

  "pl-1402":
    native: "nobody"
    notes:
      "n1": "A negative word for a person: with a verb, put nie before the verb."
    examples:
      "Nikt nie rozumie.":
        native: "Nobody understands."
        bases:
          "Nikt": "nobody"
          "nie": "not"
          "rozumie": "to understand"

  "pl-1403":
    native: "everybody; everyone"
    notes:
      "n1": "All the people in a group, in the plural."
    examples:
      "Wszyscy są dobrzy.":
        native: "Everyone is good."
        bases:
          "Wszyscy": "everybody"
          "są": "to be"
          "dobrzy": "good"

  "pl-1404":
    native: "to you"
    notes:
      "n1": "The stressed form of ty for to you. The unstressed form is ci."
    examples:
      "Dziękuję tobie.":
        native: "Thank you."
        bases:
          "Dziękuję": "to thank"
          "tobie": "to you"

