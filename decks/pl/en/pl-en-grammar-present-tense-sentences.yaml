id: "pl-en-grammar-present-tense-sentences"
kind: "layer"
core: "pl-grammar-present-tense-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "The present tense in sentences"
license: "CC-BY-SA-4.0"
description: "14 short sentences with the present tense of the verbs in the table. Three are Wiktionary examples; the rest are written from the table with taught words. Not yet checked by a Polish speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "pl-4200":
    native: "I have a cat."
    notes:
      "n1": "Mam is mieć with ja; the subject pronoun is left out. kota is the accusative of kot, which the cases unit teaches. Wiktionary's entry for mieć gives this sentence."
  "pl-4201":
    native: "What are you doing?"
    notes:
      "n1": "Robisz is robić with ty, in the second pattern: -isz. Wiktionary's entry for robić gives this sentence."
  "pl-4202":
    native: "I live in Warsaw."
    notes:
      "n1": "Mieszkam is mieszkać with ja, in the first pattern: -am. Warszawie is the locative of Warszawa, the name of the city, after w, which the cases unit teaches. Wiktionary's entry for mieszkać gives this sentence."
    bases:
      "Warszawie": "Warsaw (here: in Warsaw)"
  "pl-4203":
    native: "I like music."
    notes:
      "n1": "Lubię is lubić with ja, in the second pattern: -ię. muzykę is the accusative of muzyka, the thing that is liked."
  "pl-4204":
    native: "I speak Polish."
    notes:
      "n1": "Mówię is mówić with ja, in the second pattern: -ię. It is the sentence of the phrasebook, Nie mówię po polsku, without nie."
    bases:
      "po": "in (a language)"
      "polsku": "Polish (the language)"
  "pl-4205":
    native: "We drink water."
    notes:
      "n1": "Pijemy is pić with my: the stem is pij-. wodę is the accusative of woda."
  "pl-4206":
    native: "I eat bread."
    notes:
      "n1": "Jem is jeść with ja, an irregular verb. chleb is a masculine thing, so its accusative is the same as the nominative."
  "pl-4207":
    native: "I work at a school."
    notes:
      "n1": "Pracuję is pracować with ja: the stem is pracuj-. szkole is the locative of szkoła, after w."
  "pl-4208":
    native: "They live in the city."
    notes:
      "n1": "Mieszkają is mieszkać with oni. mieście is the locative of miasto, after w."
  "pl-4209":
    native: "We read at home."
    notes:
      "n1": "Czytamy is czytać with my. domu is the locative of dom, after w."
  "pl-4210":
    native: "I know his sister."
    notes:
      "n1": "Znam is znać with ja. siostrę is the accusative of siostra, the person known."
  "pl-4211":
    native: "What are you writing?"
    notes:
      "n1": "Piszesz is pisać with ty; the s of the stem becomes sz."
  "pl-4212":
    native: "Do you understand?"
    notes:
      "n1": "Rozumiesz is rozumieć with ty. Czy starts a yes-or-no question (Wikipedia, Polish grammar); the question can also be asked with the rising voice alone."
  "pl-4213":
    native: "She likes music."
    notes:
      "n1": "Lubi is lubić with ona: the form for on, ona and ono."
