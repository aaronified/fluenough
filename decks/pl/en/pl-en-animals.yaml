cards:
  "pl-2980":
    native: "animal"
    notes:
      "n1": "zwierzę is neuter. Its stem changes in the other cases: zwierzęcia, zwierzęciu."
    examples:
      "To jest zwierzę.":
        native: "This is an animal."
        bases:
          "To": "this, it"
          "jest": "to be"
          "zwierzę": "animal"
      "Gdzie jest zwierzę?":
        native: "Where is the animal?"
        bases:
          "Gdzie": "where"
          "jest": "to be"
          "zwierzę": "animal"
