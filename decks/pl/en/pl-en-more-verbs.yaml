schema: 1
id: "pl-en-more-verbs"
kind: "layer"
core: "pl-more-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More verbs"
description: "Common verbs in the infinitive, with their aspect and partner. Not yet checked by a Polish speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]

cards:
  "pl-2070":
    native: "to be able; can"
    notes:
      "n1": "Imperfective. It takes an infinitive: mogę iść, I can go. Wiktionary gives no aspect partner."
  "pl-2071":
    native: "to have to; must"
    notes:
      "n1": "Imperfective. Obligation, with an infinitive: muszę iść, I must go. Wiktionary gives no aspect partner."
  "pl-2072":
    native: "to want"
    notes:
      "n1": "Imperfective. Wiktionary gives no direct perfective partner (zechcieć is a related perfective). With się it means to feel like: chce mi się pić, I am thirsty."
  "pl-2073":
    native: "to give"
    notes:
      "n1": "Perfective. Imperfective partner: dawać."
  "pl-2074":
    native: "to get; to receive"
    notes:
      "n1": "Perfective. Imperfective partner: dostawać. With się it can mean to get into a place or school."
  "pl-2075":
    native: "to make; to do"
    notes:
      "n1": "Perfective. Imperfective partner: robić."
  "pl-2076":
    native: "to buy"
    notes:
      "n1": "Perfective. Imperfective partner: kupować."
  "pl-2077":
    native: "to sell"
    notes:
      "n1": "Perfective. Imperfective partner: sprzedawać."
  "pl-2078":
    native: "to use"
    notes:
      "n1": "Imperfective. Perfective partner: użyć. It takes the genitive: używam komputera, I use a computer."
  "pl-2079":
    native: "to take; to grab"
    notes:
      "n1": "Perfective. Imperfective partner: brać."
  "pl-2080":
    native: "to stay; to remain; to become"
    notes:
      "n1": "Perfective. Imperfective partner: zostawać."
  "pl-2081":
    native: "to go by vehicle (one trip)"
    notes:
      "n1": "Perfective. Imperfective partner: jechać. For a one-way trip: pojechać do Krakowa, to go to Kraków."
  "pl-2082":
    native: "to arrive by vehicle"
    notes:
      "n1": "Perfective. Imperfective partner: przyjeżdżać. Said of a person or a vehicle."
  "pl-2083":
    native: "to go out; to leave"
    notes:
      "n1": "Perfective. Imperfective partner: wychodzić. On foot, out of a place."
  "pl-2084":
    native: "to go in; to enter"
    notes:
      "n1": "Perfective. Imperfective partner: wchodzić. On foot, into a space."
  "pl-2085":
    native: "to return; to come back"
    notes:
      "n1": "Perfective. Imperfective partner: wracać."
  "pl-2086":
    native: "to leave behind"
    notes:
      "n1": "Perfective. Imperfective partner: zostawiać. Not taking something with you, or abandoning someone."
  "pl-2087":
    native: "to receive"
    notes:
      "n1": "Perfective. Imperfective partner: otrzymywać. Mainly for getting something, often a gift, from someone."
  "pl-2088":
    native: "to help"
    notes:
      "n1": "Perfective. Imperfective partner: pomagać."
  "pl-2089":
    native: "to show"
    notes:
      "n1": "Perfective. Imperfective partner: pokazywać."
  "pl-2090":
    native: "to see; to catch sight of"
    notes:
      "n1": "Perfective: the moment you start seeing something. Imperfective partner: widzieć."
  "pl-2091":
    native: "to hear"
    notes:
      "n1": "Imperfective. Perfective partner: usłyszeć."
  "pl-2092":
    native: "to feel; to sense"
    notes:
      "n1": "Imperfective. Perfective partner: poczuć."
  "pl-2093":
    native: "to think"
    notes:
      "n1": "Imperfective. Perfective partner: pomyśleć. Myślę, że masz rację means I think you are right."
  "pl-2094":
    native: "to choose"
    notes:
      "n1": "Imperfective. Perfective partner: wybrać."
  "pl-2095":
    native: "to win"
    notes:
      "n1": "Perfective. Imperfective partner: wygrywać. The opposite is przegrać, to lose."
  "pl-2096":
    native: "to sing"
    notes:
      "n1": "Imperfective. Perfective partner: zaśpiewać."
  "pl-2097":
    native: "to dance"
    notes:
      "n1": "Imperfective. Perfective partner: zatańczyć."
  "pl-2098":
    native: "to run; to jog"
    notes:
      "n1": "Imperfective, indeterminate: the repeated or back-and-forth form of biec (to run in one direction). Wiktionary gives the perfective partner as pobiec."
  "pl-2099":
    native: "to swim"
    notes:
      "n1": "Imperfective, indeterminate: the repeated or back-and-forth form of płynąć (to swim in one direction). Perfective partner: popłynąć."
  "pl-2100":
    native: "to ride; to drive; to go by vehicle regularly"
    notes:
      "n1": "Imperfective, indeterminate: the repeated or back-and-forth form of jechać. Its perfective is pojechać."
  "pl-2101":
    native: "to open"
    notes:
      "n1": "Perfective. Imperfective partner: otwierać."
  "pl-2102":
    native: "to close; to shut"
    notes:
      "n1": "Perfective. Imperfective partner: zamykać."
  "pl-2103":
    native: "to pay"
    notes:
      "n1": "Imperfective. Perfective partner: zapłacić. Pay for goods, work, debts or taxes."
  "pl-2104":
    native: "to carry; to wear"
    notes:
      "n1": "Imperfective, indeterminate: the repeated form of nieść (to carry in one direction). Also to wear clothing."
