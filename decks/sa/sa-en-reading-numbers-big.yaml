passages:
  - id: "sa-numbers-big-text-1"
    title: "Books by the hundred"
    theme: "numbers-big"
    sentences:
      - { text: "अहं शतं पुस्तकानि पठामि.", reading: "ahaṃ śataṃ pustakāni paṭhāmi.", ipa: "əɦəm ʃət̪əm pust̪əkaːni pəʈʰaːmi" }
      - { text: "त्रिंशत् पुस्तकानि क्रीणाति माता पञ्चाशत् पुस्तकानि च पठति.", reading: "triṃśat pustakāni krīṇāti mātā pañcāśat pustakāni ca paṭhati.", ipa: "t̪rĩʃət̪ pust̪əkaːni kriːɳaːt̪i maːt̪aː pəɲtʃaːʃət̪ pust̪əkaːni tʃə pəʈʰət̪i" }
      - { text: "पञ्चाशत् पुस्तकानि पिता वहति.", reading: "pañcāśat pustakāni pitā vahati.", ipa: "pəɲtʃaːʃət̪ pust̪əkaːni pit̪aː ʋəɦət̪i" }
      - { text: "त्वं चत्वारिंशत् पुस्तकानि पठसि माता च शतं पठति.", reading: "tvaṃ catvāriṃśat pustakāni paṭhasi mātā ca śataṃ paṭhati.", ipa: "t̪ʋəm tʃət̪ʋaːrĩʃət̪ pust̪əkaːni pəʈʰəsi maːt̪aː tʃə ʃət̪əm pəʈʰət̪i" }
    questions:
      - id: "sa-3483"
        prompt: { en: "How many books does mother buy?" }
        options: [{ en: "Thirty" }, { en: "Fifty" }, { en: "A hundred" }]
        answer: 1
      - id: "sa-3484"
        prompt: { en: "Who carries fifty books?" }
        options: [{ en: "Mother" }, { en: "Father" }, { en: "The speaker" }]
        answer: 2
      - id: "sa-3485"
        prompt: { en: "'You' read forty books." }
        answer: true
      - id: "sa-3486"
        prompt: { en: "The speaker reads fifty books." }
        answer: false
  - id: "sa-numbers-big-text-2"
    title: "Thousands of students"
    theme: "numbers-big"
    sentences:
      - { text: "सहस्रं शिष्याः पुस्तकानि पठन्ति.", reading: "sahasraṃ śiṣyāḥ pustakāni paṭhanti.", ipa: "səɦəsrəm ʃiʂjaːh pust̪əkaːni pəʈʰənt̪i" }
      - { text: "अयुतं शिष्या गच्छन्ति लक्षं च शिष्याः पठन्ति.", reading: "ayutaṃ śiṣyā gacchanti lakṣaṃ ca śiṣyāḥ paṭhanti.", ipa: "əjut̪əm ʃiʂjaː ɡətʃtʃʰənt̪i ləkʂəm tʃə ʃiʂjaːh pəʈʰənt̪i" }
      - { text: "तत्र लक्षं पुस्तकानि भवन्ति.", reading: "tatra lakṣaṃ pustakāni bhavanti.", ipa: "t̪ət̪rə ləkʂəm pust̪əkaːni bʱəʋənt̪i" }
      - { text: "सप्त शतानि पुस्तकानि पठामि.", reading: "sapta śatāni pustakāni paṭhāmi.", ipa: "səpt̪ə ʃət̪aːni pust̪əkaːni pəʈʰaːmi" }
    questions:
      - id: "sa-3487"
        prompt: { en: "How many students go in the second sentence?" }
        options: [{ en: "A thousand" }, { en: "A hundred thousand" }, { en: "Ten thousand" }]
        answer: 3
      - id: "sa-3488"
        prompt: { en: "How many books are there in the third sentence?" }
        options: [{ en: "A hundred thousand" }, { en: "Seven hundred" }, { en: "A thousand" }]
        answer: 1
      - id: "sa-3489"
        prompt: { en: "The speaker reads seven hundred books." }
        answer: true
      - id: "sa-3490"
        prompt: { en: "A thousand students go." }
        answer: false
