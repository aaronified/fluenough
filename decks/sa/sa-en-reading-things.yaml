passages:
  - id: "sa-things-text-1"
    title: "Pen, umbrella, drum"
    theme: "things"
    sentences:
      - { text: "सखा ग्रन्थं पठति कलमेन लिखति.", reading: "sakhā granthaṃ paṭhati kalamena likhati.", ipa: "səkʰaː ɡrənt̪ʰəm pəʈʰət̪i kələmeːnə likʰət̪i" }
      - { text: "सा नारी दर्पणे मुखं पश्यति.", reading: "sā nārī darpaṇe mukhaṃ paśyati.", ipa: "saː naːriː d̪ərpəɳeː mukʰəm pəʃjət̪i" }
      - { text: "वर्षायां पिता छत्त्रं वहति.", reading: "varṣāyāṃ pitā chattraṃ vahati.", ipa: "ʋərʂaːjaːm pit̪aː tʃʰət̪t̪rəm ʋəɦət̪i" }
      - { text: "माता वीणां वहति पिता मृदङ्गं वहति.", reading: "mātā vīṇāṃ vahati pitā mṛdaṅgaṃ vahati.", ipa: "maːt̪aː ʋiːɳaːm ʋəɦət̪i pit̪aː mr̩d̪əŋɡəm ʋəɦət̪i" }
    questions:
      - id: "sa-3555"
        prompt: { en: "What does the friend write with?" }
        options: [{ en: "A book" }, { en: "A mirror" }, { en: "A pen" }]
        answer: 3
      - id: "sa-3556"
        prompt: { en: "What does father carry in the rain?" }
        options: [{ en: "An umbrella" }, { en: "A drum" }, { en: "A lute" }]
        answer: 1
      - id: "sa-3557"
        prompt: { en: "The woman sees a face in the mirror." }
        answer: true
      - id: "sa-3558"
        prompt: { en: "Mother carries a drum." }
        answer: false
  - id: "sa-things-text-2"
    title: "Pot, iron, wood"
    theme: "things"
    sentences:
      - { text: "घटो जलेन पूर्णो भवति पात्रं च रिक्तं भवति.", reading: "ghaṭo jalena pūrṇo bhavati pātraṃ ca riktaṃ bhavati.", ipa: "ɡʱəʈoː dʒəleːnə puːrɳoː bʱəʋət̪i paːt̪rəm tʃə rikt̪əm bʱəʋət̪i" }
      - { text: "लोहं कठिनं भवति सुवर्णं च सुन्दरं भवति.", reading: "lohaṃ kaṭhinaṃ bhavati suvarṇaṃ ca sundaraṃ bhavati.", ipa: "loːɦəm kəʈʰinəm bʱəʋət̪i suʋərɳəm tʃə sund̪ərəm bʱəʋət̪i" }
      - { text: "शस्त्रं पतति चक्रं च न चलति.", reading: "śastraṃ patati cakraṃ ca na calati.", ipa: "ʃəst̪rəm pət̪ət̪i tʃəkrəm tʃə nə tʃələt̪i" }
      - { text: "पिता काष्ठेन गृहं करोति.", reading: "pitā kāṣṭhena gṛhaṃ karoti.", ipa: "pit̪aː kaːʂʈʰeːnə ɡr̩ɦəm kəroːt̪i" }
    questions:
      - id: "sa-3559"
        prompt: { en: "What is empty?" }
        options: [{ en: "The pot" }, { en: "The vessel" }, { en: "The wheel" }]
        answer: 2
      - id: "sa-3560"
        prompt: { en: "What is beautiful?" }
        options: [{ en: "Iron" }, { en: "Wood" }, { en: "Gold" }]
        answer: 3
      - id: "sa-3561"
        prompt: { en: "The wheel does not move." }
        answer: true
      - id: "sa-3562"
        prompt: { en: "Father makes a house of iron." }
        answer: false
