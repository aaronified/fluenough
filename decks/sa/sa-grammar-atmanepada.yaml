# Active (parasmaipada) against middle (atmanepada) endings of the present. The middle forms were
# read in the conjugation tables of the en.wiktionary entries of labhate, vartate, ikshate and
# janite; the active forms of jnana in the table of janati (which gives both voices side by side); the
# four verbs of both voices (bru, dha, sru, kri) in the tables of bravati, dadhati, srnoti and krinati;
# the voice each verb of the course takes is the P or A on the sa-verb line of the entry of its
# present form, 2026-11-16. Readings from tools/transcribe.py (sa).
