# The participles of every verb of the course: the past passive (kta) and past active (ktavatu) participles, and the present active (satr) and middle (sanac) participles, each as its stem.
# The first form that Wiktionary lists is the one taught. A cell is empty where Wiktionary lists none, and the satr cell is empty for the verbs that take only the middle voice (and the sanac cell for the verbs that take only the active voice).
