# The participles of every verb of the course: the past passive (kta) and past active (ktavatu) participles, and the present active (satr) and middle (sanac) participles, each as its stem.
# The first form that Wiktionary lists is the one taught. A cell is filled by the rule where Wiktionary lists none (kta of sa-2008, 2011, 2012, 2100, 2102, 2117, 2122 and 2123, and ktavatu of those and of sa-0434: Whitney 952, 953, 956, 959, queued as derived), a cell is empty only for sa-2105 and sa-2108 (no participle listed), and the satr cell is empty for the verbs that take only the middle voice (and the sanac cell for the verbs that take only the active voice).
