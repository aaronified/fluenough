passages:
  - id: "sa-questions-text-1"
    title: "Who, where, what?"
    theme: "questions"
    sentences:
      - { text: "अश्वः कुत्र गच्छति देवः कुत्र च पठति?", reading: "aśvaḥ kutra gacchati devaḥ kutra ca paṭhati?", ipa: "əʃʋəh kut̪rə ɡətʃtʃʰət̪i d̪eːʋəh kut̪rə tʃə pəʈʰət̪i" }
      - { text: "का संस्कृतं पठति का च जलं नयति?", reading: "kā saṃskṛtaṃ paṭhati kā ca jalaṃ nayati?", ipa: "kaː sə̃skr̩t̪əm pəʈʰət̪i kaː tʃə dʒələm nəjət̪i" }
      - { text: "त्वं कुत्र जलं नयसि?", reading: "tvaṃ kutra jalaṃ nayasi?", ipa: "t̪ʋəm kut̪rə dʒələm nəjəsi" }
    questions:
      - id: "sa-3400"
        prompt: { en: "What does the last sentence ask about?" }
        options: [{ en: "Where water is brought" }, { en: "When water is brought" }, { en: "Why water is brought" }]
        answer: 1
      - id: "sa-3401"
        prompt: { en: "Which pair of actions does the second sentence ask 'who' about?" }
        options: [{ en: "Reading Sanskrit and eating" }, { en: "Reading Sanskrit and bringing water" }, { en: "Bringing water and singing" }]
        answer: 2
      - id: "sa-3402"
        prompt: { en: "The first sentence asks where the horse goes." }
        answer: true
  - id: "sa-questions-text-2"
    title: "Why and how"
    theme: "questions"
    sentences:
      - { text: "स संस्कृतं कदा वदति?", reading: "sa saṃskṛtaṃ kadā vadati?", ipa: "sə sə̃skr̩t̪əm kəd̪aː ʋəd̪ət̪i" }
      - { text: "यूयं कथं संस्कृतं पठथ?", reading: "yūyaṃ kathaṃ saṃskṛtaṃ paṭhatha?", ipa: "juːjəm kət̪ʰəm sə̃skr̩t̪əm pəʈʰət̪ʰə" }
      - { text: "किमर्थं सा संस्कृतं न वदति?", reading: "kimarthaṃ sā saṃskṛtaṃ na vadati?", ipa: "kimərt̪ʰəm saː sə̃skr̩t̪əm nə ʋəd̪ət̪i" }
      - { text: "वयं किमर्थं जलं न नयामः?", reading: "vayaṃ kimarthaṃ jalaṃ na nayāmaḥ?", ipa: "ʋəjəm kimərt̪ʰəm dʒələm nə nəjaːməh" }
    questions:
      - id: "sa-3403"
        prompt: { en: "Who is asked about in the first sentence?" }
        options: [{ en: "She" }, { en: "You all" }, { en: "He" }]
        answer: 3
      - id: "sa-3404"
        prompt: { en: "The second sentence asks how 'we' read Sanskrit." }
        answer: false
      - id: "sa-3405"
        prompt: { en: "What do 'we' not do in the last sentence?" }
        options: [{ en: "Bring the water" }, { en: "Read Sanskrit" }, { en: "Speak Sanskrit" }]
        answer: 1
      - id: "sa-3406"
        prompt: { en: "The third sentence is about someone who does not speak Sanskrit." }
        answer: true
