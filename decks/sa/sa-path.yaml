# The order Classical Sanskrit is taught in, one unit per line, from every language
# it is taught from: each deck is named by its core id, and a learner from
# English is taught sa-en-<name> for sa-<name> (ADR-0013, ADR-0036).
#
# This is also Classical Sanskrit's B1 plan (docs/DECK-FORMAT.md, "The B1 plan"): every
# unit from the first words to B1, with its size in words or its grammar
# topics, the three milestones, and for each planned unit its listening
# and reading passages. The file was first written by tools/gen_planned_paths.py
# (#959) and then re-planned by hand (SA-003, wiki/Deck-Work-Queue-SA.md,
# section 2): the generator's themes of modern life are replaced by reading
# themes, and the Paninian grammar units of the queue page (SA-100 to SA-139)
# are placed in their levels. Each unit moves from `planned` to `decks` in
# the commit that builds it; unit ids are permanent once a deck is written.
#
# Order (reviewed 2026-11-16): the present system comes right after the pronouns, so every sentences deck uses only verbs already taught; a sentences deck is listed in the first unit after every word it uses is taught, so the sentences that join parts with च (ca) are listed with the adverbs unit, which teaches च.
#
# Written so far: unit 1 (the phrasebook and the first words), the sound
# differences, the script decks, spelling, the verb units, and the grammar units
# for the case system, a-stems, the present system (with the first-class verbs),
# vowel sandhi, pronouns and the middle voice (atmanepada). Every
# other unit is planned, so the course teaches each as "Coming" until its
# deck is written. The passages are placeholders: each describes its unit's
# theme or grammar and is reworded when the passage is written.
#
# A reading course (owner, 2026-10-31): Classical Sanskrit is read here, not spoken, so
# the milestones A1, A2 and B1 mean three reading levels, and the sizes
# are `levels` (400, 600 and 900 words, a judgement, low confidence) in
# place of the plan's 700, 900 and 1,200. Themes of modern life are left
# out. The word units total exactly these sizes (unit 1 counted in A1).
#
# Heavy focus on Panini's grammar (owner, 2026-11-02): the grammar units are
# rules units with full tables and carry no word count (the vsn and te
# precedent). A1: vowels and script, the case system, a-stems, the present
# system, vowel sandhi, pronouns, atmanepada. A2: karakas, consonant and
# visarga sandhi, the ten ganas, other noun stems, the past tenses, the
# lakaras, imperatives, participles, samasa, taddhita. B1: krt, gerundives,
# absolutives and infinitives, the passive, causatives, the optative, and
# four units reading Astadhyayi rules (sutras) from the page.
#
# `alphabet` lists the script decks now written (SA-010 to SA-015): the
# validator takes only written decks there, and each is on its unit below.
# The script is taught in the units named `script`, after the first six
# themes, as the scheme has it. Vedic Sanskrit is the separate course vsn.
schema: 1
kind: "path"
id: "sa-path"
language: "sa"
description: "Classical Sanskrit: the path to B1, a reading course with a heavy focus on Panini's grammar. Written so far: the phrasebook and first words, the script and sound decks, the verb units, and the grammar units for the case system, a-stems, the present system, vowel sandhi, pronouns and the middle voice; the other units are planned."
