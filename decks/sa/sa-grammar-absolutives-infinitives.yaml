rules:
  - id: "sa-rule-absolutive-ktva"
    slots: ["ktva"]
    words: [{ word: "समानकर्तृकयोः पूर्वकाले", reading: "samānakartṛkayoḥ pūrvakāle" }, { word: "स गत्वा पठति", reading: "sa gatvā paṭhati" }, { word: "एतद् तदोः सुलोपः अकोः अनञ्संआसे हलि", reading: "etad tadoḥ sulopaḥ akoḥ anañsaṃāse hali" }, { word: "कृ", reading: "kṛ" }, { word: "कृत्वा", reading: "kṛtvā" }, { word: "गम्", reading: "gam" }, { word: "गत्वा", reading: "gatvā" }, { word: "भू", reading: "bhū" }, { word: "भूत्वा", reading: "bhūtvā" }, { word: "पठ्", reading: "paṭh" }, { word: "पठित्वा", reading: "paṭhitvā" }, { word: "स्था", reading: "sthā" }, { word: "स्थित्वा", reading: "sthitvā" }, { word: "पा", reading: "pā" }, { word: "पीत्वा", reading: "pītvā" }, { word: "दा", reading: "dā" }, { word: "दत्त्वा", reading: "dattvā" }]
  - id: "sa-rule-absolutive-lyap"
    slots: ["lyap"]
    words: [{ word: "संआसे अनञ्पूर्वे क्त्वः ल्यप्", reading: "saṃāse anañpūrve ktvaḥ lyap" }, { word: "ह्रस्वस्य पिति कृति तुक्", reading: "hrasvasya piti kṛti tuk" }, { word: "कृ", reading: "kṛ" }, { word: "प्रकृत्य", reading: "prakṛtya" }, { word: "जि", reading: "ji" }, { word: "प्रजित्य", reading: "prajitya" }, { word: "श्रु", reading: "śru" }, { word: "प्रश्रुत्य", reading: "praśrutya" }, { word: "उपसर्गाद् असमासेऽपि णोपदेशस्य", reading: "upasargād asamāse'pi ṇopadeśasya" }, { word: "नी", reading: "nī" }, { word: "प्रणीय", reading: "praṇīya" }, { word: "नम्", reading: "nam" }, { word: "प्रणत्य", reading: "praṇatya" }, { word: "नृत्", reading: "nṛt" }, { word: "प्रणृत्य", reading: "praṇṛtya" }, { word: "प्रस्थाय", reading: "prasthāya" }, { word: "प्रदाय", reading: "pradāya" }, { word: "प्रज्ञाय", reading: "prajñāya" }, { word: "प्रगम्य", reading: "pragamya" }, { word: "प्रोद्य", reading: "prodya" }, { word: "प्रोह्य", reading: "prohya" }, { word: "प्रोष्य", reading: "proṣya" }]
  - id: "sa-rule-infinitive-tum"
    slots: ["tum"]
    words: [{ word: "तुमुन् ण्वुलौ क्रियायां क्रियाअर्थायाम्", reading: "tumun ṇvulau kriyāyāṃ kriyāarthāyām" }, { word: "समानकर्तृकेषु तुमुन्", reading: "samānakartṛkeṣu tumun" }, { word: "कृ", reading: "kṛ" }, { word: "कर्तुम्", reading: "kartum" }, { word: "गम्", reading: "gam" }, { word: "गन्तुम्", reading: "gantum" }, { word: "वह्", reading: "vah" }, { word: "वोढुम्", reading: "voḍhum" }, { word: "पठ्", reading: "paṭh" }, { word: "पठितुम्", reading: "paṭhitum" }, { word: "भू", reading: "bhū" }, { word: "भवितुम्", reading: "bhavitum" }, { word: "स पठितुम् इच्छति", reading: "sa paṭhitum icchati" }]
