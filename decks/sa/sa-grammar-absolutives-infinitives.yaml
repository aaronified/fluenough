# The gerunds and the infinitive of the verbs of the course: -tvā (ktvā), -ya and -tya with a prefix (lyap) and -tum (tumun).
# A form listed on the root entry on en.wiktionary.org is taught as listed; any other form is made by the sūtras and Whitney 968, 990 to 992 and is marked derived in docs/review-queue/sa.md. The lyap column uses the prefix pra for every verb as a model.
# sa-2105 as, sa-2108 brū and sa-2111 paś are excepted: as and brū are defective and paś is only the present stem of dṛś.
