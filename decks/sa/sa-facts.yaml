schema: 1
id: "sa-facts"
name: "Classical Sanskrit facts"
kind: "facts"
language: { code: "sa", iso639_3: "san", name: "Classical Sanskrit", script: "devanagari", icon: "सं" }
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
facts:
  - id: "sa-fact-001"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Sanskrit"
    text:
      en: "The oldest Sanskrit is Vedic Sanskrit, found in the Rigveda, a collection of 1,028 hymns composed between about 1500 and 1200 BCE."
  - id: "sa-fact-002"
    tags: ["name"]
    source: "https://en.wikipedia.org/wiki/Sanskrit"
    text:
      en: "The name Sanskrit comes from samskrita, meaning 'adorned' or 'purified'."
  - id: "sa-fact-003"
    tags: ["script"]
    source: "https://en.wikipedia.org/wiki/Sanskrit"
    text:
      en: "Sanskrit does not have an attested native script. From about the turn of the first millennium CE it was written in various Brahmic scripts, and in the modern era most commonly in Devanagari."
  - id: "sa-fact-004"
    tags: ["script"]
    source: "https://en.wikipedia.org/wiki/Devanagari"
    text:
      en: "Devanagari is written from left to right and is recognisable by a horizontal line along the top of its letters."
  - id: "sa-fact-005"
    tags: ["script"]
    source: "https://en.wikipedia.org/wiki/Devanagari"
    text:
      en: "Devanagari belongs to the Brahmic family of scripts, which covers India, Nepal, Tibet and Southeast Asia."
  - id: "sa-fact-006"
    tags: ["script"]
    source: "https://en.wikipedia.org/wiki/Devanagari"
    text:
      en: "Devanagari is used for more than 120 languages, the most popular of which is Hindi."
  - id: "sa-fact-007"
    tags: ["pronunciation"]
    source: "https://en.wikipedia.org/wiki/Sanskrit"
    text:
      en: "In Sanskrit the cardinal vowels a, i and u distinguish length, so a short vowel and a long vowel are different sounds."
  - id: "sa-fact-008"
    tags: ["pronunciation"]
    source: "https://en.wikipedia.org/wiki/Sanskrit"
    text:
      en: "The vowels e and o in Sanskrit come from the older diphthongs ai and au, which had become single vowels."
  - id: "sa-fact-009"
    tags: ["pronunciation"]
    source: "https://en.wikipedia.org/wiki/Sanskrit"
    text:
      en: "Retroflex consonants, pronounced with the tongue curled back, do not seem to have been part of the earliest Vedic language. They developed over the centuries after the Rigveda was composed, during its oral transmission."
  - id: "sa-fact-010"
    tags: ["grammar"]
    source: "https://en.wikipedia.org/wiki/Sanskrit"
    text:
      en: "Sanskrit has eight cases: nominative, accusative, instrumental, dative, ablative, genitive, locative and vocative."
  - id: "sa-fact-011"
    tags: ["grammar"]
    source: "https://en.wikipedia.org/wiki/Sanskrit_grammar"
    text:
      en: "The grammar of Sanskrit has a complex verb system, a rich system of noun declension, and extensive use of compound nouns."
  - id: "sa-fact-012"
    tags: ["grammar"]
    source: "https://en.wikipedia.org/wiki/Sanskrit"
    text:
      en: "Many Sanskrit words are inflected, yet have no root that can be recognised."
  - id: "sa-fact-013"
    tags: ["sandhi"]
    source: "https://en.wikipedia.org/wiki/Sanskrit_grammar"
    text:
      en: "Sanskrit has sandhi, rules that change the sounds where two words meet in a sentence, much as English says going to as gonna."
  - id: "sa-fact-014"
    tags: ["sandhi"]
    source: "https://en.wikipedia.org/wiki/Sanskrit_grammar"
    text:
      en: "Under the external sandhi rules, two similar short vowels that meet join into a single long vowel."
  - id: "sa-fact-015"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Sanskrit"
    text:
      en: "Classical Sanskrit simplified the sandhi rules of Vedic Sanskrit, but kept several features of the Vedic language."
  - id: "sa-fact-016"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Sanskrit"
    text:
      en: "The two great Sanskrit epics, the Mahābhārata and the Rāmāyaṇa, were composed in a form of the language called Epic Sanskrit, which was used in northern India between 400 BCE and 300 CE."
  - id: "sa-fact-017"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Pāṇini"
    text:
      en: "Pāṇini, the grammarian who described Classical Sanskrit, is dated variously to between the 6th and 5th centuries BCE and to the 4th century BCE, so the date is not certain."
  - id: "sa-fact-018"
    tags: ["grammar", "history"]
    source: "https://en.wikipedia.org/wiki/Aṣṭādhyāyī"
    text:
      en: "Pāṇini's Aṣṭādhyāyī has about four thousand rules, called sūtras, in eight chapters, each with four sections. The Aṣṭādhyāyī article counts 3,983 sūtras, and the Pāṇini article counts 3,959."
  - id: "sa-fact-019"
    tags: ["grammar"]
    source: "https://en.wikipedia.org/wiki/Aṣṭādhyāyī"
    text:
      en: "Pāṇini's rules are very compact: the order of the rules matters, one item can stand for many, and some letters are only markers that are not sounds of the language."
  - id: "sa-fact-020"
    tags: ["grammar"]
    source: "https://en.wikipedia.org/wiki/Aṣṭādhyāyī"
    text:
      en: "Pāṇini's pratyāhāras are short names for groups of sounds, such as aiC and eṄ, each built from letters of the Shiva Sutras and a marker."
  - id: "sa-fact-021"
    tags: ["grammar"]
    source: "https://en.wikipedia.org/wiki/Sanskrit"
    text:
      en: "Pāṇini included many optional rules, so that writers separated by place or time could choose how to express the same facts."
  - id: "sa-fact-022"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Sanskrit"
    text:
      en: "Vedic Sanskrit and Classical Sanskrit differ in accent, grammatical categories, meaning, syntax, declension and sandhi."
  - id: "sa-fact-023"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Indo-Aryan_languages"
    text:
      en: "The Indo-Aryan languages are a branch of the Indo-Iranian languages, which belong to the Indo-European language family."
  - id: "sa-fact-024"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Indo-Aryan_languages"
    text:
      en: "Proto-Indo-Aryan was very close to Vedic Sanskrit."
  - id: "sa-fact-025"
    tags: ["history"]
    source: "https://en.wikipedia.org/wiki/Indo-Aryan_languages"
    text:
      en: "Some Prakrits are not direct continuations of Rigvedic Sanskrit. They descend from dialects that were close to it but different from it."
  - id: "sa-fact-026"
    tags: ["culture"]
    source: "https://en.wikipedia.org/wiki/Sanskrit"
    text:
      en: "Sanskrit is the sacred language of Hinduism, and the language of classical Hindu philosophy and of historical texts of Buddhism and Jainism."
  - id: "sa-fact-027"
    tags: ["culture"]
    source: "https://en.wikipedia.org/wiki/Sanskrit"
    text:
      en: "Sanskrit is one of the 22 languages listed in the Eighth Schedule to the Constitution of India, which the Constitution says must be developed."
  - id: "sa-fact-028"
    tags: ["culture"]
    source: "https://en.wikipedia.org/wiki/Sanskrit"
    text:
      en: "The structure of Classical Sanskrit launched ancient Indian speculation about the nature and function of language."
  - id: "sa-fact-029"
    tags: ["culture"]
    source: "https://en.wikipedia.org/wiki/Sanskrit"
    text:
      en: "Benares Sanskrit College, founded in 1791, is named in the Sanskrit article as the oldest of the Sanskrit colleges it lists."
  - id: "sa-fact-030"
    tags: ["culture"]
    source: "https://en.wikipedia.org/wiki/Pratyāhāra"
    text:
      en: "Pratyāhāra means 'gathering towards', and it is the fifth of the eight stages of Patanjali's Ashtanga Yoga, which he described in the Yoga Sutras, composed in the 2nd century BCE."
