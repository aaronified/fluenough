# Nouns of the course that do not end in a: the i-, ī-, u-, ū-, ṛ- and ā-stems, the consonant stems (as, an, t) and the go-stem.
# The a-stems are in sa-grammar-a-stems, whose except list names every noun that is a row here, and this table excepts the a-stems in turn.
# sa-1717 (इक्षुः) has no declension table on its en.wiktionary.org entry: its row is the masculine u-stem paradigm (the table of बन्धु, which Whitney 341 and 343 show to be regular) with the stem replaced and n made ṇ after ṣ in -nā and -nām (Whitney 189 and 190, Panini 8.4.1); see docs/review-queue/sa.md.
# The twelve consonant-stem nouns sa-2300 to sa-2311 are taught by sa-stems-words, in the same unit.
