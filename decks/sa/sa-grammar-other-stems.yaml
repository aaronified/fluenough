source: "Each noun's forms (except sa-1717, derived as the comment above says; sa-2302 uses the vat-stem table of भवत्) read in the declension table of its en.wiktionary.org entry (the page of its stem: अग्नि, गो, अणु, गुरु, गङ्गा, मातृ, पितृ, भ्रातृ, स्वसृ, पुत्री, दुहितृ, पति (the table for husband), पत्नी, सखि, बन्धु, वधू, सूनु, नारी, स्त्री, सुता, जननी, विंशति, नामन्, वयस्, भाषा, आयुस्, जाति, कोटि, शिरस्, नासिका, जिह्वा, ग्रीवा, अस्थि, त्रिंशत्, चत्वारिंशत्, पञ्चाशत् and the others of the table), read 2026-11-16, leaving out the forms that entry marks as Vedic; Panini, Astadhyayi 7.1.23, 7.1.73, 7.1.90, 7.3.109 to 7.3.113, 8.3.57 and 8.3.59 as typed on sa.wikisource.org/wiki/अष्टाध्यायी (seventh and eighth chapter pages), read 2026-11-16; 7.1.90 and 7.3.111 read in the GRETIL text of the Kasika (gretil.sub.uni-goettingen.de, file sa_pANini-aSTAdhyAyI)."
