# The ten lakaras with the third person singular and plural of two model verbs, bhu and gam. The periphrastic future (lut) and the precative (asirlin) have a third person singular only: Wiktionary has no table for them.
# The third person singular of the root pages' lut and precative forms is listed on the root entries of bhu and gam, so the third plural is empty (null) for them.
schema: 1
id: "sa-grammar-lakaras"
part: "core"
kind: "grammar"
language: { code: "sa", iso639_3: "san", name: "Classical Sanskrit", script: "devanagari", icon: "सं" }
license: "CC-BY-SA-4.0"
authors:
  - { name: "Fluenough contributors" }
source: "en.wiktionary.org: the Present table (with its imperative and optative blocks) and the Imperfect table on the page of bhavati and of gacchati, the Future and Conditional tables on bhavisyati and gamisyati, the Perfect table on babhuva and jagama, the Aorist table on abhut and agamat, and the root pages of bhu and gam, whose Primary verbal forms list bhavitā and gantā (the periphrastic future) and bhūyāt and gamyāt (the precative), which have no page or table of their own, read 2026-11-16; Panini, Astadhyayi 3.2.110, 3.2.111, 3.2.115, 3.2.123, 3.3.13, 3.3.15, 3.3.139, 3.3.161, 3.3.162, 3.4.77 and 3.4.116 as typed on sa.wikisource.org/wiki/अष्टाध्यायी (the third chapter page), read 2026-11-16; Whitney, Sanskrit Grammar 586 on en.wikisource, read 2026-11-16."
tags: ["grammar", "unreviewed"]
