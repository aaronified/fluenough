# Consonant (hal) sandhi: the junctions of a final consonant or an anusvara with the sound that follows.
# Every pair and joined form was read on sa.wikipedia.org/wiki/सन्धिप्रकरणम् (the junctions and their
# names, 2026-11-16), except the last two rows, which are the instrumental of राम and देव as the
# en.wiktionary.org table of राम and the a-stems unit give them; the two compounds षण्मुख (षड् + मुख)
# and वाङ्मय (वाङ् + मय) were also read on their en.wiktionary.org entries. The sutra numbers were read on
# sa.wikisource.org/wiki/अष्टाध्यायी (the sixth and eighth chapter pages, 2026-11-16). Readings and IPA from
# tools/transcribe.py (sa).
