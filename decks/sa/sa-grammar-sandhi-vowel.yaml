# mahesvara, mahotsava, svagata and the compounds with the same parts, on the en.wiktionary entry of
# the joined word (its etymology line names the two parts); the sutra numbers and words were read on
# sa.wikisource.org/wiki/अष्टाध्यायी/षष्टः_अध्यायः, 2026-11-16. Readings and IPA from tools/transcribe.py (sa).
