# Primary derivation (krt): the nouns of action and of the doer that the verbs of the course make with ghan, lyut, trc, ktin and nvul.
# A cell is filled only where en.wiktionary.org has the derived noun (its entry, or the root entry's own list); the empty cells are verbs for which no such noun was found, not verbs that cannot form one.
# Verbs with no cell at all are in `except`: sa-2011, 2105, 2108, 2111, 2123 (no noun of these five suffixes on the root entry or on an entry read; the root entries of sa-2007, 2021, 2023, 2104 and 2117 list a noun or two and those are cells).
