passages:
  - id: "sa-places-text-1"
    title: "Village, city, forest, temple"
    theme: "places"
    sentences:
      - { text: "ग्रामे गृहाणि भवन्ति नगरे प्रासादा भवन्ति.", reading: "grāme gṛhāṇi bhavanti nagare prāsādā bhavanti.", ipa: "ɡraːmeː ɡr̩ɦaːɳi bʱəʋənt̪i nəɡəreː praːsaːd̪aː bʱəʋənt̪i" }
      - { text: "वने सिंहो वसति ग्रामे कुक्कुरो वसति.", reading: "vane siṃho vasati grāme kukkuro vasati.", ipa: "ʋəneː sĩɦoː ʋəsət̪i ɡraːmeː kukkuroː ʋəsət̪i" }
      - { text: "पर्वते गुहा भवति गुहायां सिंहो वसति.", reading: "parvate guhā bhavati guhāyāṃ siṃho vasati.", ipa: "pərʋət̪eː ɡuɦaː bʱəʋət̪i ɡuɦaːjaːm sĩɦoː ʋəsət̪i" }
      - { text: "देवो मन्दिरे वसति पिता च तत्र गच्छति.", reading: "devo mandire vasati pitā ca tatra gacchati.", ipa: "d̪eːʋoː mənd̪ireː ʋəsət̪i pit̪aː tʃə t̪ət̪rə ɡətʃtʃʰət̪i" }
    questions:
      - id: "sa-3539"
        prompt: { en: "Who goes to the temple?" }
        options: [{ en: "Mother" }, { en: "The god" }, { en: "Father" }]
        answer: 3
      - id: "sa-3540"
        prompt: { en: "Where does the dog live?" }
        options: [{ en: "In the village" }, { en: "In the forest" }, { en: "In the cave" }]
        answer: 1
      - id: "sa-3541"
        prompt: { en: "A lion lives in the cave." }
        answer: true
      - id: "sa-3542"
        prompt: { en: "The god lives on the mountain." }
        answer: false
  - id: "sa-places-text-2"
    title: "River, school, garden"
    theme: "places"
    sentences:
      - { text: "नदी सागरं गच्छति जलं च वहति.", reading: "nadī sāgaraṃ gacchati jalaṃ ca vahati.", ipa: "nəd̪iː saːɡərəm ɡətʃtʃʰət̪i dʒələm tʃə ʋəɦət̪i" }
      - { text: "विद्यालये सूनुः पठति दुहिता च गायति.", reading: "vidyālaye sūnuḥ paṭhati duhitā ca gāyati.", ipa: "ʋid̪jaːləjeː suːnuh pəʈʰət̪i d̪uɦit̪aː tʃə ɡaːjət̪i" }
      - { text: "आश्रमो वने भवति तीर्थं नद्यां भवति.", reading: "āśramo vane bhavati tīrthaṃ nadyāṃ bhavati.", ipa: "aːʃrəmoː ʋəneː bʱəʋət̪i t̪iːrt̪ʰəm nəd̪jaːm bʱəʋət̪i" }
      - { text: "उद्याने मयूरो नृत्यति क्षेत्रे वृषभो धावति.", reading: "udyāne mayūro nṛtyati kṣetre vṛṣabho dhāvati.", ipa: "ud̪jaːneː məjuːroː nr̩t̪jət̪i kʂeːt̪reː ʋr̩ʂəbʱoː d̪ʱaːʋət̪i" }
    questions:
      - id: "sa-3543"
        prompt: { en: "What runs in the field?" }
        options: [{ en: "The peacock" }, { en: "The bull" }, { en: "The river" }]
        answer: 2
      - id: "sa-3544"
        prompt: { en: "Who sings at school?" }
        options: [{ en: "The son" }, { en: "The peacock" }, { en: "The daughter" }]
        answer: 3
      - id: "sa-3545"
        prompt: { en: "The holy place is on the mountain." }
        answer: false
      - id: "sa-3546"
        prompt: { en: "The peacock runs in the garden." }
        answer: false
