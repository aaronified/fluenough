# The six kārakas and the cases they take, and four upapada words. Every sūtra number and word was
# read on sa.wikisource.org/wiki/अष्टाध्यायी (first and second chapter pages, 2026-11-16); where the page
# types a sūtra defectively (2.3.18 with a stray mark, 2.3.36 as सप्तमी अधिकरणे, 2.3.16 with its last
# words split wrongly) the text is the one typed on sa.wikipedia.org/wiki/विभक्तिः, read the same day,
# or is not quoted. The model word is Rāma, taught in sa-grammar-case-system (card sa-4094): its
# forms are those of that deck. The upapada cases of सह, विना, ऋते and नमः are those the en.wiktionary.org
# entries of the words give. Readings and IPA from tools/transcribe.py (sa).
schema: 1
