passages:
  - id: "sa-body-text-1"
    title: "Who uses what: hands, eyes, ears"
    theme: "body"
    sentences:
      - { text: "त्वं हस्तेन जलं पिबसि.", reading: "tvaṃ hastena jalaṃ pibasi.", ipa: "t̪ʋəm ɦəst̪eːnə dʒələm pibəsi" }
      - { text: "द्वौ पादौ गच्छतो द्वौ च हस्तौ जलं नयतः.", reading: "dvau pādau gacchato dvau ca hastau jalaṃ nayataḥ.", ipa: "d̪ʋəu paːd̪əu ɡətʃtʃʰət̪oː d̪ʋəu tʃə ɦəst̪əu dʒələm nəjət̪əh" }
      - { text: "स नेत्रेण पश्यति पिता च कर्णेन शृणोति.", reading: "sa netreṇa paśyati pitā ca karṇena śṛṇoti.", ipa: "sə neːt̪reːɳə pəʃjət̪i pit̪aː tʃə kərɳeːnə ʃr̩ɳoːt̪i" }
      - { text: "अहं मुखेन संस्कृतं वदामि.", reading: "ahaṃ mukhena saṃskṛtaṃ vadāmi.", ipa: "əɦəm mukʰeːnə sə̃skr̩t̪əm ʋəd̪aːmi" }
    questions:
      - id: "sa-3491"
        prompt: { en: "Who sees with the eye?" }
        options: [{ en: "Father" }, { en: "He" }, { en: "You" }]
        answer: 2
      - id: "sa-3492"
        prompt: { en: "Who drinks water with the hand?" }
        options: [{ en: "I" }, { en: "He" }, { en: "You" }]
        answer: 3
      - id: "sa-3493"
        prompt: { en: "Father sees with the eye." }
        answer: false
      - id: "sa-3494"
        prompt: { en: "The last sentence says the speaker does not speak Sanskrit." }
        answer: false
  - id: "sa-body-text-2"
    title: "Hair, nail, foot, head"
    theme: "body"
    sentences:
      - { text: "केशः कृष्णो भवति नखं च कठिनं भवति.", reading: "keśaḥ kṛṣṇo bhavati nakhaṃ ca kaṭhinaṃ bhavati.", ipa: "keːʃəh kr̩ʂɳoː bʱəʋət̪i nəkʰəm tʃə kəʈʰinəm bʱəʋət̪i" }
      - { text: "पादो न चलति हस्तौ जलं च न नयतः.", reading: "pādo na calati hastau jalaṃ ca na nayataḥ.", ipa: "paːd̪oː nə tʃələt̪i ɦəst̪əu dʒələm tʃə nə nəjət̪əh" }
      - { text: "तत्र रुधिरं सरति तत्र च जलं क्षरति.", reading: "tatra rudhiraṃ sarati tatra ca jalaṃ kṣarati.", ipa: "t̪ət̪rə rud̪ʱirəm sərət̪i t̪ət̪rə tʃə dʒələm kʂərət̪i" }
      - { text: "शिरः कुत्र भवति मुखं च कुत्र भवति?", reading: "śiraḥ kutra bhavati mukhaṃ ca kutra bhavati?", ipa: "ʃirəh kut̪rə bʱəʋət̪i mukʰəm tʃə kut̪rə bʱəʋət̪i" }
    questions:
      - id: "sa-3495"
        prompt: { en: "What is said to be black?" }
        options: [{ en: "The hair" }, { en: "The nail" }, { en: "The foot" }]
        answer: 1
      - id: "sa-3496"
        prompt: { en: "What does the passage say trickles there?" }
        options: [{ en: "Blood" }, { en: "Water" }]
        answer: 2
      - id: "sa-3497"
        prompt: { en: "The two hands bring water in the second sentence." }
        answer: false
      - id: "sa-3498"
        prompt: { en: "The last sentence asks where the head is." }
        answer: true
