passages:
  - id: "sa-ritual-text-1"
    title: "Worship at home"
    theme: "ritual"
    sentences:
      - { text: "ऋषिः पूजां करोति मन्त्रं च जपति.", reading: "ṛṣiḥ pūjāṃ karoti mantraṃ ca japati.", ipa: "r̩ʂih puːdʒaːm kəroːt̪i mənt̪rəm tʃə dʒəpət̪i" }
      - { text: "माता देवतां पूजयति धूपं च ददाति.", reading: "mātā devatāṃ pūjayati dhūpaṃ ca dadāti.", ipa: "maːt̪aː d̪eːʋət̪aːm puːdʒəjət̪i d̪ʱuːpəm tʃə d̪əd̪aːt̪i" }
      - { text: "पिता यज्ञे होमं करोति माता च स्तोत्रं गायति.", reading: "pitā yajñe homaṃ karoti mātā ca stotraṃ gāyati.", ipa: "pit̪aː jədʒɲeː ɦoːməm kəroːt̪i maːt̪aː tʃə st̪oːt̪rəm ɡaːjət̪i" }
      - { text: "सखा सदा नद्यां स्नानं करोति.", reading: "sakhā sadā nadyāṃ snānaṃ karoti.", ipa: "səkʰaː səd̪aː nəd̪jaːm snaːnəm kəroːt̪i" }
    questions:
      - id: "sa-3563"
        prompt: { en: "Who makes an oblation at the sacrifice?" }
        options: [{ en: "Mother" }, { en: "The sage" }, { en: "Father" }]
        answer: 3
      - id: "sa-3564"
        prompt: { en: "What does mother give?" }
        options: [{ en: "Incense" }, { en: "An oblation" }, { en: "A mantra" }]
        answer: 1
      - id: "sa-3565"
        prompt: { en: "Mother makes an oblation at the sacrifice." }
        answer: false
      - id: "sa-3566"
        prompt: { en: "The friend always bathes in the river." }
        answer: true
  - id: "sa-ritual-text-2"
    title: "Temple and festival"
    theme: "ritual"
    sentences:
      - { text: "मन्दिरे देवस्य पूजा भवति तत्र धूपो भवति.", reading: "mandire devasya pūjā bhavati tatra dhūpo bhavati.", ipa: "mənd̪ireː d̪eːʋəsjə puːdʒaː bʱəʋət̪i t̪ət̪rə d̪ʱuːpoː bʱəʋət̪i" }
      - { text: "उपवासः पवित्रो भवति व्रतं च कठिनं भवति.", reading: "upavāsaḥ pavitro bhavati vrataṃ ca kaṭhinaṃ bhavati.", ipa: "upəʋaːsəh pəʋit̪roː bʱəʋət̪i ʋrət̪əm tʃə kəʈʰinəm bʱəʋət̪i" }
      - { text: "स्वर्गः पवित्रो भवति नरको मलिनो भवति.", reading: "svargaḥ pavitro bhavati narako malino bhavati.", ipa: "sʋərɡəh pəʋit̪roː bʱəʋət̪i nərəkoː məlinoː bʱəʋət̪i" }
      - { text: "उत्सवे दीपा भवन्ति सर्वत्र च माला भवन्ति.", reading: "utsave dīpā bhavanti sarvatra ca mālā bhavanti.", ipa: "ut̪səʋeː d̪iːpaː bʱəʋənt̪i sərʋət̪rə tʃə maːlaː bʱəʋənt̪i" }
    questions:
      - id: "sa-3567"
        prompt: { en: "What is hard?" }
        options: [{ en: "A fast" }, { en: "A vow" }, { en: "Heaven" }]
        answer: 2
      - id: "sa-3568"
        prompt: { en: "A fast is holy in the second sentence." }
        answer: true
      - id: "sa-3569"
        prompt: { en: "There are lamps at the festival." }
        answer: true
      - id: "sa-3570"
        prompt: { en: "The temple has no incense." }
        answer: false
