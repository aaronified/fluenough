# The gerundives (future passive participles, kṛtya) of the verbs of the course: -tavya, -anīya and -ya (yat, ṇyat, kyap).
# A form listed on the root entry of the verb on en.wiktionary.org is taught as listed; a form not listed there is made by the sūtras and by Whitney 961 to 964 and 968, and is marked derived in docs/review-queue/sa.md.
# sa-2105 as, sa-2108 brū and sa-2111 paś are excepted: as and brū are defective (other roots supply their forms) and paś is only the present stem of dṛś, so no gerundive of their own is taught.
