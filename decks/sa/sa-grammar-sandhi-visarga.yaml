# Visarga sandhi: the junctions of a final visarga (ḥ) with the sound that follows. Every pair and joined
# form was read on sa.wikipedia.org/wiki/सन्धिप्रकरणम् (2026-11-16) and checked against Whitney, Sanskrit Grammar
# (1889), read in the archive.org full text on 2026-11-16: sections 170, 172, 174, 175, 176 and 177, named in each entry's text.
# Whitney 176 a gives सः and एषः losing the visarga before a consonant (sa dadarśa, eṣa puruṣaḥ), and 170 d the visarga staying
# before k, kh, p, ph (nalaḥ kāmam, puruṣaḥ khanati). The sutra numbers were read on
# sa.wikisource.org/wiki/अष्टाध्यायी (the sixth and eighth chapter pages, 2026-11-16). Readings and IPA from tools/transcribe.py (sa).
