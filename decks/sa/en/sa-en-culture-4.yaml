name: "Culture: grammar, language, statecraft and science"
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
description: "Short lines from Pāṇini's Aṣṭādhyāyī, Patañjali, Bhartṛhari, Daṇḍin, Amarasiṃha, Bharata, the Arthaśāstra, Āryabhaṭa, Varāhamihira and Caraka, texts in the public domain, each with its date as an English Wikipedia article gives it, where its words come from and a note on how its words join. Not yet checked by a Sanskrit speaker: please report any mistake."

cards:
  "sa-8048":
    native: "The name vṛddhi is given to ā and to ai and au."
    notes:
      "n1": "The first sūtra of the Aṣṭādhyāyī. The English Wikipedia describes the Aṣṭādhyāyī as a grammar text that describes a form of Sanskrit, attributed to Pāṇini and dated to somewhere between the 6th and the 4th century BCE, and names 1.1.1 as its first sūtra, written there vṛddhir ādaiC with capital letters for the special marker letters."
      "n2": "The sūtra is one written word made of वृद्धिः (vṛddhiḥ, the name vṛddhi), आत् (āt, ā) and ऐच् (aic): the visarga becomes r before a vowel and the t is carried over. The last letter च् (c) of ऐच् (aic) is a marker that stands for the whole group ai, au, so ऐच् (aic) means \"ai and au\". Vṛddhi, the strongest vowel grade, is a name the later sūtras use again and again."
    bases:
      "वृद्धिरादैच्": "vṛddhi (the name of the grade) + ā + ai and au (the group aic)"
  "sa-8049":
    native: "The letters a, i and u, closed by the marker ṇ."
    notes:
      "n1": "The English Wikipedia describes the Śiva Sūtras as a set of fourteen aphorisms devised as an arrangement of the sounds of Sanskrit, for the purposes of grammatical exposition as carried out by Pāṇini in the Aṣṭādhyāyī. This is the first of the fourteen."
      "n2": "Each of the fourteen lines lists some sounds and ends with one marker consonant that is not a sound of the language: here ण् (ṇ). A grammar then names a whole run of sounds by its first sound and a marker, so अण् (aṇ) means the sounds from a up to the first ṇ, that is a, i, u. The other markers are ण् (ṇ), क् (k), ङ् (ṅ), च् (c), ट् (ṭ), म् (m), ञ् (ñ), ष् (ṣ), श् (ś), व् (v), य् (y), र् (r) and ल् (l)."
    bases:
      "अइउण्": "a + i + u + ṇ (the marker)"
  "sa-8050":
    native: "What stays fixed when there is a separation is called the apādāna, the point of departure."
    notes:
      "n1": "A sūtra of the first chapter, fourth section. The English Wikipedia says the Aṣṭādhyāyī has 3,983 sūtras in eight chapters, each divided into four sections (pāda), and that Pāṇini's work is dated between the 6th and the 4th century BCE."
      "n2": "The sūtra defines one of the six kāraka (the roles a noun can play in a sentence): the role called अपादान (apādāna) is the point from which something moves away. The word ध्रुवम् (dhruvam, the fixed thing) joins अपाये (apāye, in a separation) and the name अपादानम् (apādānam) with the avagraha ऽ (avagraha) for a lost a: ध्रुवमपायेऽपादानम् (dhruvamapāye 'pādānam)."
    bases:
      "ध्रुवमपायेऽपादानम्": "fixed + separation (in separation) + the point of departure"
  "sa-8051":
    native: "Now the teaching of words."
    notes:
      "n1": "The English Wikipedia calls the Mahābhāṣya, attributed to Patañjali, a commentary on selected rules of Pāṇini's Aṣṭādhyāyī and on Kātyāyana's Vārttika-sūtra, dated to the 2nd century BCE, and names Pāṇini, Kātyāyana and Patañjali as the three most famous grammarians of ancient India."
      "n2": "The word अथ (atha, now) opens a work, as अथातः (athātaḥ) opens the Brahma Sūtra. The second word is a compound of शब्द (śabda, word) and अनुशासन (anuśāsana, teaching), \"the teaching of words\", which is the Mahābhāṣya's name for grammar."
    bases:
      "अथ": "now"
      "शब्दानुशासनम्": "word + teaching"
  "sa-8052":
    native: "Brahman, without beginning or end, the imperishable principle of the word, unfolds as the things that words mean, and from it comes the making of the world."
    notes:
      "n1": "The first verse of the first book. The English Wikipedia says the Vākyapadīya, also called the Trikāṇḍī (three books), is a Sanskrit treatise on the philosophy of language and grammar, written by the 5th-century Bhartṛhari, whose work is significant for its treatment of the relationship between language, thought and reality."
      "n2": "विवर्तते (vivartate, it unfolds) and अर्थभावेन (arthabhāvena, as the state of meaning) join with the avagraha ऽ (avagraha), written विवर्ततेऽर्थभावेन (vivartate 'rthabhāvena): the final e stays and the a that follows is dropped in writing. Brahman is called शब्दतत्त्वम् (śabdatattvam, the principle of the word), the idea that makes the book a philosophy of language."
    bases:
      "अनादिनिधनं": "without beginning or end"
      "ब्रह्म": "Brahman"
      "शब्दतत्त्वं": "word + principle, essence"
      "यदक्षरम्": "which + imperishable"
      "विवर्ततेऽर्थभावेन": "to unfold (it unfolds) + meaning + state (as the state of meaning)"
      "प्रक्रिया": "process, making"
      "जगतो": "world (of the world)"
      "यतः": "from which"
  "sa-8053":
    native: "Having gathered the earlier treatises and observed how language is used, we make, as far as we can, a description of poetry."
    notes:
      "n1": "The English Wikipedia says Daṇḍin, who flourished in the 7th to 8th century, is best known for the Kāvyādarśa, \"Mirror of Poetry\", the handbook of classical Sanskrit poetics, and calls it the earliest surviving systematic treatment of poetics in Sanskrit."
      "n2": "संहृत्य (saṃhṛtya, having gathered) and उपलक्ष्य (upalakṣya, having observed) are absolutives, forms ending in -ya for a verb with a prefix, that say what was done before the main verb क्रियते (kriyate, is made). The word यथासामर्थ्यम् (yathāsāmarthyam, as far as one can) ends in m, which joins the vowel of अस्माभिः (asmābhiḥ, by us) with no change: यथासामर्थ्यमस्माभिः (yathāsāmarthyamasmābhiḥ)."
    bases:
      "पूर्वशास्त्राणि": "earlier + treatise"
      "संहृत्य": "together + to take (having gathered)"
      "प्रयोगानुपलक्ष्य": "usage + to observe (having observed usages)"
      "च": "and"
      "यथासामर्थ्यमस्माभिः": "as + ability + we (as far as we can, by us)"
      "क्रियते": "to make (it is made)"
      "काव्यलक्षणम्": "poetry + description"
  "sa-8054":
    native: "Gathering from other treatises, in short and revised form, the teaching of nouns and genders is said to be complete, in sections."
    notes:
      "n1": "The English Wikipedia says the Amarakośa is a lexicon of Sanskrit words in three books, so also called the Trikāṇḍī, known too as the Nāmaliṅgānuśāsana, with 10,000 words arranged in metre to aid the memory. It dates its author Amarasiṃha to about CE 375 by one account, and to the 7th century by other sources."
      "n2": "The verse names the book itself: नामलिङ्गानुशासनम् (nāmaliṅgānuśāsanam) is \"the teaching of nouns, नाम (nāma), and genders, लिङ्ग (liṅga)\", which is how the dictionary lists each word with its gender. The groups called वर्गाः (vargāḥ) are the sections of the book. संपूर्णम् (saṃpūrṇam) and उच्यते (ucyate, is said, a passive of वच् (vac)) join as संपूर्णमुच्यते (saṃpūrṇamucyate)."
    bases:
      "समाहृत्यान्यतन्त्राणि": "having gathered + other + treatise"
      "संक्षिप्तैः": "short, abridged"
      "प्रतिसंस्कृतैः": "revised, refined"
      "संपूर्णमुच्यते": "complete + to say (it is said)"
      "वर्गैर्नामलिङ्गानुशासनम्": "section, group (in sections) + noun + gender + teaching"
  "sa-8055":
    native: "Having bowed my head to the two gods, the grandfather and the great lord, I will set out the Nāṭyaśāstra as Brahmā declared it."
    notes:
      "n1": "The first verse of the Nāṭyaśāstra. The English Wikipedia describes it as a Sanskrit treatise on the performing arts, attributed to the sage Bharata, of 36 chapters and about 6,000 verses on dramatic composition, the stage, acting, body movement, makeup, music and more."
      "n2": "प्रणम्य (praṇamya, having bowed) is an absolutive and प्रवक्ष्यामि (pravakṣyāmi, I will declare) a future. The two gods are named in one dual compound, पितामहमहेश्वरौ (pitāmahamaheśvarau), whose ending -au is the dual: \"the grandfather and the great lord\". In ब्रह्मणा (brahmaṇā, by Brahmā) the instrumental names who first declared the teaching."
    bases:
      "प्रणम्य": "forth + to bow (having bowed)"
      "शिरसा": "head (with the head)"
      "देवौ": "god (two)"
      "पितामहमहेश्वरौ": "grandfather + great lord (two)"
      "नाट्यशास्त्रं": "drama + treatise"
      "प्रवक्ष्यामि": "forth + to say (I will declare)"
      "ब्रह्मणा": "Brahmā (by Brahmā)"
      "यदुदाहृतम्": "which + declared"
  "sa-8056":
    native: "This one Arthaśāstra has been made by gathering together nearly all the treatises on statecraft that earlier teachers laid down for gaining and guarding the earth."
    notes:
      "n1": "The opening sentence of the Arthaśāstra. The English Wikipedia calls the work an ancient Indian Sanskrit treatise on statecraft, politics, economic policy and military strategy, with several authors, its main compiler or redactor being Kauṭilya, also called Viṣṇugupta and Cāṇakya; it says the book disappeared in the 12th century and was rediscovered in 1905 by R. Shamasastry."
      "n2": "One long prose sentence, the verb कृतम् (kṛtam, made) at its end. The page cuts compounds with hyphens: अर्थ-शास्त्रम् (artha-śāstram) is \"the science of artha\", wealth and statecraft. प्रायशः (prāyaśaḥ, mostly) and तानि (tāni, them) join as प्रायशस्तानि (prāyaśastāni): a visarga before t becomes s. संहृत्य (saṃhṛtya) is an absolutive, \"having gathered\"."
    bases:
      "पृथिव्या": "earth (of the earth)"
      "लाभे": "gaining (in gaining)"
      "पालने": "guarding (in guarding)"
      "च": "and"
      "यावन्त्यर्थ": "as many + wealth, statecraft"
      "शास्त्राणि": "treatise"
      "पूर्व": "earlier"
      "आचार्यैः": "teacher (by teachers)"
      "प्रस्थापितानि": "laid down"
      "प्रायशस्तानि": "mostly + them"
      "संहृत्य": "together + to take (having gathered)"
      "एकम्": "one"
      "इदम्": "this"
      "अर्थ": "wealth, statecraft"
      "शास्त्रं": "treatise"
      "कृतम्": "made"
  "sa-8057":
    native: "Having bowed to the one and the many, to Ka, the true deity, the highest Brahman, Āryabhaṭa tells of three subjects: mathematics, the reckoning of time and the sphere."
    notes:
      "n1": "The opening verse of the Āryabhaṭīya. The English Wikipedia calls the Āryabhaṭīya a Sanskrit astronomical treatise, the main work and the only surviving work of the 5th-century mathematician Āryabhaṭa, of 121 verses in four sections, and says one historian estimates it was composed around 510 CE."
      "n2": "Unlike most Sanskrit verses this one leaves its words apart: प्रणिपत्य (praṇipatya) एकम् (ekam) are not joined, though a final m before a vowel could join. The three subjects of the second line are the three words गणितम् (gaṇitam, mathematics), कालक्रियाम् (kālakriyām, the reckoning of time) and गोलम् (golam, the sphere). The page types आर्यभटस् (āryabhaṭas) with a free s, which the verse needs before त्रीणि (trīṇi, three)."
    bases:
      "प्रणिपत्य": "forth + down + to fall (having bowed)"
      "एकं": "one"
      "अनेकं": "many"
      "कं": "Ka (here a name of the deity)"
      "सत्यां": "true"
      "देवतां": "deity"
      "परं": "highest"
      "ब्रह्म": "Brahman"
      "आर्यभटस्": "Āryabhaṭa"
      "त्रीणि": "three"
      "गदति": "to tell (he tells)"
      "गणितं": "mathematics"
      "कालक्रियां": "time + reckoning"
      "गोलम्": "sphere"
  "sa-8058":
    native: "Victory to Savitṛ, the sun, the source of the world, the soul of all, the natural ornament of the sky, adorned with a garland of a thousand rays like molten gold."
    notes:
      "n1": "The opening verse of the Bṛhatsaṃhitā. The English Wikipedia says Varāhamihira (c. 505 to c. 587) was an ancient Indian mathematician and astronomer who lived in Ujjain and is considered one of the foremost scholars of classical Indian astronomy; his notable works are the Pañcasiddhāntikā, the Bṛhatsaṃhitā and the Bṛhajjātaka."
      "n2": "Many Sanskrit works open with the word जयति (jayati, he triumphs), a salute to a god; here the god is the sun, सविता (savitā). The last long compound द्रुतकनकसदृशदशशतमयूखमालाअर्चितः (drutakanakasadṛśadaśaśatamayūkhamālā-arcitaḥ) is one word that counts the rays as \"ten hundred\", a thousand, and the page, like GRETIL, leaves the vowels of मालाअर्चितः (mālā-arcitaḥ) apart."
    bases:
      "जयति": "to triumph (he triumphs)"
      "जगतः": "world (of the world)"
      "प्रसूतिर्विश्वात्मा": "source, origin + all + soul"
      "सहजभूषणं": "natural + ornament"
      "नभसः": "sky (of the sky)"
      "द्रुतकनकसदृशदशशतमयूखमालाअर्चितः": "molten + gold + like + ten hundred + ray + garland + adorned"
      "सविता": "the sun, Savitṛ"
  "sa-8059":
    native: "Now, therefore, we shall explain the chapter called Dīrghaṃjīvitīya, on long life."
    notes:
      "n1": "The first sentence of the Carakasaṃhitā. The English Wikipedia calls it a Sanskrit text on Ayurveda, attributed to Caraka and revised by Dṛḍhabala, with 8 books and 120 chapters, and one of the two foundational texts of Ayurveda that survive, with the Suśrutasaṃhitā."
      "n2": "अथातः (athātaḥ, now therefore) is the same opening formula as in the Brahma Sūtra, with the visarga written o before the voiced द् (d) of दीर्घंजीवितीयम् (dīrghaṃjīvitīyam), the chapter's title, \"the one on long life\". व्याख्यास्यामः (vyākhyāsyāmaḥ) is a future, \"we shall explain\", in the plural of a teacher speaking for his school."
    bases:
      "अथातो": "now + therefore"
      "दीर्घंजीवितीयम्": "long + of life (the chapter on long life)"
      "अध्यायं": "chapter"
      "व्याख्यास्यामः": "to explain (we shall explain)"
