description: "Short lines from the Pañcatantra, the Hitopadeśa, the Vetālapañcaviṃśati and the Kathāsaritsāgara, texts in the public domain, each with its date as an English Wikipedia article gives it, where its words come from and a note on how its words join. Not yet checked by a Sanskrit speaker: please report any mistake."

cards:
  "sa-8034":
    native: "The great love that was growing between a lion and a bull in the forest was destroyed by a greedy, backbiting jackal."
    notes:
      "n1": "The first verse of the first book. The English Wikipedia describes the Pañcatantra as an ancient Indian collection of interrelated animal fables in Sanskrit verse and prose, arranged within a frame story; its author is unknown, and some recensions name Viṣṇuśarman and others Vasubhāga, both possibly invented pen names. The same verse opens the second book of the Hitopadeśa in a slightly changed form."
      "n2": "Three words in the instrumental case, \"by\", name the culprit: पिशुनेन (piśunena, by the backbiter), अतिलुब्धेन (atilubdhena, by the very greedy one) and जम्बुकेन (jambukena, by the jackal). पिशुनेन (piśunena) and अतिलुब्धेन (atilubdhena) join as पिशुनेनातिलुब्धेन (piśunenātilubdhena), where a and a make ā. वर्धमानः (vardhamānaḥ) is a present participle, \"growing\"."
    bases:
      "वर्धमानो": "growing"
      "महान्": "great"
      "स्नेहः": "affection, love"
      "सिंहगोवृषयोर्वने": "lion + ox + bull + forest (in the forest)"
      "पिशुनेनातिलुब्धेन": "backbiter + very + greedy (by the backbiter, the greedy one)"
      "जम्बुकेन": "jackal (by the jackal)"
      "विनाशितः": "destroyed"
  "sa-8035":
    native: "Even without means, wise, thoughtful and well-learned people quickly achieve their aims, like the crow, the mouse, the deer and the tortoise."
    notes:
      "n1": "The first verse of the second book. The English Wikipedia says the Pañcatantra is a collection of animal fables in Sanskrit verse and prose within a frame story, whose earliest known translation, into a non-Indian language, is in Middle Persian (Pahlavi, 550 CE); the four animals of this verse are the heroes of a story in the book."
      "n2": "The page splits the long compounds with hyphens, as in बहु-श्रुताः (bahu-śrutāḥ, much learned) and काकाखु-मृग-कूर्मवत् (kākākhu-mṛga-kūrmavat), and writes साधयन्त्य् (sādhayanty) apart from आशु (āśu); joined, they are साधयन्त्याशु (sādhayantyāśu), where i turns into y before a vowel. The ending -वत् (-vat) makes \"like\"."
    bases:
      "असाधना": "without means"
      "अपि": "even"
      "प्राज्ञा": "wise"
      "बुद्धिमन्तो": "thoughtful, intelligent"
      "बहु": "much"
      "श्रुताः": "learned, heard"
      "साधयन्त्य्": "to accomplish (they accomplish)"
      "आशु": "quickly"
      "कार्याणि": "task, aim"
      "काकाखु": "crow + mouse"
      "मृग": "deer"
      "कूर्मवत्": "tortoise + like"
  "sa-8036":
    native: "One should not trust a former enemy who has come offering friendship; look at the cave full of owls that was burnt by a fire the crow set."
    notes:
      "n1": "The first verse of the third book. The English Wikipedia says the Pañcatantra is an ancient Indian collection of fables in Sanskrit verse and prose within a frame story, and that it is probably a Hindu text, based on older oral traditions; the verse names the owls and the crow, the two kinds of bird this book is about."
      "n2": "The command is a potential form, विश्वसेत् (viśvaset, one should trust), with न (na) before it for \"one should not\". Compounds are cut by hyphens on the page: पूर्व-विरोधितस्य (pūrva-virodhitasya, of one who was earlier an enemy). The word शत्रोः (śatroḥ, of an enemy) is typed शत्रोश् (śatroś) apart from च (ca): joined, शत्रोश्च (śatrośca), the visarga becomes ś before c."
    bases:
      "न": "not"
      "विश्वसेत्": "to trust (one should trust)"
      "पूर्व": "earlier, former"
      "विरोधितस्य": "made hostile (of one who was hostile)"
      "शत्रोश्": "enemy (of an enemy)"
      "च": "and"
      "मित्रत्वम्": "friendship"
      "उपागतस्य": "come to (of one who has come)"
      "दग्धाम्": "burnt"
      "गुहाम्": "cave"
      "पश्य": "to see (look!)"
      "उलूक": "owl"
      "पूर्णाम्": "full"
      "काक": "crow"
      "प्रणीतेन": "set, led forth (by what was set)"
      "हुताशनेन": "fire (by fire)"
  "sa-8037":
    native: "The one whose mind does not fail him when matters arise crosses every difficulty, like the monkey standing in the water."
    notes:
      "n1": "The first verse of the fourth book. The English Wikipedia says that the Pañcatantra, an ancient Indian collection of animal fables arranged in a frame story, was attributed to Viṣṇuśarman in some recensions and to Vasubhāga in others; the monkey in the water is one of its animals."
      "n2": "A relative word and its answer carry the thought: यस्य (yasya, whose) in the first line is answered by सः (saḥ, that one) in the second, and यथा (yathā, as) opens the comparison. बुद्धिः (buddhiḥ, mind) is typed बुद्धिर् (buddhir) apart from यस्य (yasya): the visarga becomes r before the voiced y."
    bases:
      "समुत्पन्नेषु": "arisen (when they have arisen)"
      "कार्येषु": "matter, task (in matters)"
      "बुद्धिर्": "mind, intelligence"
      "यस्य": "whose"
      "न": "not"
      "हीयते": "to fail, to be lost (it is lost)"
      "स": "that one"
      "एव": "indeed"
      "दुर्गं": "difficulty, hard place"
      "तरति": "to cross (he crosses)"
      "जलस्थो": "standing in water"
      "वानरो": "monkey"
      "यथा": "as"
  "sa-8038":
    native: "A man should not do what is badly seen, badly understood, badly heard and badly examined, as the barber did here."
    notes:
      "n1": "The first verse of the fifth book. The English Wikipedia describes the Pañcatantra as a collection of interrelated animal fables in Sanskrit verse and prose, and notes that its Middle Persian translation of 550 CE became the basis of translations into other languages, so its stories travelled far beyond India."
      "n2": "Four words begin with the prefix कु- (ku-, bad): कुदृष्टम् (kudṛṣṭam), कुपरिज्ञातम् (kuparijñātam), कुश्रुतम् (kuśrutam) and कुपरीक्षितम् (kuparīkṣitam), all past participles. कर्तव्यम् (kartavyam, to be done) is a gerundive, so न कर्तव्यम् (na kartavyam) is \"must not be done\". नापितेन (nāpitena) and अत्र (atra) join as नापितेनात्र (nāpitenātra)."
    bases:
      "कुदृष्टं": "badly seen"
      "कुपरिज्ञातं": "badly understood"
      "कुश्रुतं": "badly heard"
      "कुपरीक्षितम्": "badly examined"
      "तन्": "that"
      "नरेण": "man (by a man)"
      "न": "not"
      "कर्तव्यम्": "to be done"
      "नापितेनात्र": "barber (by the barber) + here"
      "यत्": "which"
      "कृतम्": "done"
  "sa-8039":
    native: "In the southern country there is a city called Mahilāropya."
    notes:
      "n1": "The English Wikipedia says the Pañcatantra is a collection of fables arranged within a frame story, and this prose sentence is the start of that frame story as the Wikisource page for the second book types it. Two pages spell the word for southern in two ways, so the spelling here is the second page's."
      "n2": "A story-telling sentence in prose: अस्ति (asti, there is) starts it, which is the classic way to open a tale, as in English \"there was\". दाक्षिणात्य (dākṣiṇātya, southern) is built from दक्षिण (dakṣiṇa, south) and has the first vowel lengthened; the page for the first book writes it दक्षिणात्ये (dakṣiṇātye) without that lengthening. नाम (nāma, by name) follows the name."
    bases:
      "अस्ति": "to be (there is)"
      "दाक्षिणात्ये": "southern (in the southern)"
      "जनपदे": "country, region (in the region)"
      "महिलारोप्यं": "Mahilāropya (a city)"
      "नाम": "by name"
      "नगरम्": "city"
  "sa-8040":
    native: "May the good succeed in what they set out to do, by the favour of Dhūrjaṭi, on whose head the crescent of the moon shines like a line of foam on the Jāhnavī."
    notes:
      "n1": "The opening verse of the Hitopadeśa. The English Wikipedia says the text was probably composed by Nārāyaṇa between 800 and 950 CE, though the surviving text is believed to be from the 12th century and the oldest manuscript, found in Nepal, is dated 1373, and that Nārāyaṇa names the Pañcatantra as a source."
      "n2": "Many books open with a prayer to a god for success; here the god is named with a title, धूर्जटि (dhūrjaṭi), and his head carries the moon. The page types सिढिः (siḍhiḥ) with ढ (ḍha); the card has सिद्धिः (siddhiḥ) with द्ध (ddha), the form in GRETIL's text. The word लेखेव (lekheva) is लेखा (lekhā, line) and इव (iva, like), where ā and i make e."
    bases:
      "सिद्धिः": "success"
      "साध्ये": "what is to be achieved (in what is to be achieved)"
      "सताम्": "the good (of the good)"
      "अस्तु": "to be (let there be)"
      "प्रसादात्": "favour (by the favour)"
      "तस्य": "of that one"
      "धूर्जटेः": "Dhūrjaṭi (of Dhūrjaṭi)"
      "जाह्नवी": "the Jāhnavī, the river"
      "फेन": "foam"
      "लेखेव": "line + like"
      "यन्": "whose"
      "मूर्ध्नि": "head (on the head)"
      "शशिनः": "moon (of the moon)"
      "कला": "a part, a digit of the moon"
  "sa-8041":
    native: "The time of the wise passes in the pleasure of poetry and the sciences; that of fools passes in vice, sleep or quarrels."
    notes:
      "n1": "The first verse of the first book of the Hitopadeśa. The English Wikipedia says Nārāyaṇa states that the purpose of the book is to encourage proficiency in Sanskrit expression and knowledge of wise behaviour, and that about a third of its verses can be traced to the Pañcatantra."
      "n2": "Two groups are set side by side with the genitive plural, धीमताम् (dhīmatām, of the wise) and मूर्खाणाम् (mūrkhāṇām, of fools, typed मूर्खाणां (mūrkhāṇāṃ) with an anusvāra), and तु (tu) marks the contrast. Three words in the instrumental, \"by, with\", give the ways time passes: व्यसनेन (vyasanena), निद्रया (nidrayā) and कलहेन (kalahena)."
    bases:
      "काव्य": "poetry"
      "शास्त्र": "science, treatise"
      "विनोदेन": "pastime, pleasure (in the pleasure)"
      "कालो": "time"
      "गच्छति": "to go, to pass (it passes)"
      "धीमताम्": "wise person (of the wise)"
      "व्यसनेन": "vice, misfortune (in vice)"
      "तु": "but"
      "मूर्खाणां": "fool (of fools)"
      "निद्रया": "sleep (in sleep)"
      "कलहेन": "quarrel (in quarrels)"
      "वा": "or"
  "sa-8042":
    native: "The great love that was growing between the king of beasts and a bull in the forest was destroyed by a greedy, backbiting jackal."
    notes:
      "n1": "The first verse of the second book. It is the Pañcatantra's first verse of its first book with \"king of beasts\", मृगेन्द्र (mṛgendra), in place of \"lion and ox\". The English Wikipedia says that about a third of the Hitopadeśa's verses can be traced to the Pañcatantra, and that its author Nārāyaṇa names the older work as a source."
      "n2": "The page writes a nasal before a stop as an anusvāra, ं (ṃ): मृगेंद्र (mṛgeṃdra) and जंबुकेन (jaṃbukena). In print the letters are मृगेन्द्र (mṛgendra) and जम्बुकेन (jambukena), which the Pañcatantra card writes in full, and both spellings are common in Devanagari text."
    bases:
      "वर्धमानो": "growing"
      "महान्": "great"
      "स्नेहो": "affection, love"
      "मृगेंद्र": "beast + lord (king of beasts, the lion)"
      "वृषयोर्": "bull (of the two)"
      "वने": "forest (in the forest)"
      "पिशुनेनातिलुब्धेन": "backbiter + very + greedy (by the backbiter, the greedy one)"
      "जंबुकेन": "jackal (by the jackal)"
      "विनाशितः": "destroyed"
  "sa-8043":
    native: "In the war between the swans and the peacocks, who were equals in valour, the swans were cheated by crows who gained their trust after living in the enemy's house."
    notes:
      "n1": "The first verse of the third book. The English Wikipedia describes the Hitopadeśa as a collection of fables and proverbs in Sanskrit, and says its oldest known manuscript, found in Nepal, is dated 1373 and that the work may come from eastern India in the time of the Pāla empire."
      "n2": "The word सह (saha, with) takes the instrumental case: हंसैः सह (haṃsaiḥ saha) is \"with the swans\". The absolutive स्थित्वा (sthitvā, having stayed) joins अरि (ari, enemy) as स्थित्वारि (sthitvāri): ā and a make ā. The page also types हंस (haṃsa) and मंदिरे (maṃdire) with the anusvāra for the nasal."
    bases:
      "हंसैः": "swan, goose (by the swans)"
      "सह": "with"
      "मयूराणां": "peacock (of the peacocks)"
      "विग्रहे": "war (in the war)"
      "तुल्य": "equal"
      "विक्रमे": "valour (in valour)"
      "विश्वास्य": "to gain trust (having made to trust)"
      "वञ्चिता": "cheated"
      "हंसाः": "swan"
      "काकैः": "crow (by crows)"
      "स्थित्वारि": "to stay (having stayed) + enemy"
      "मंदिरे": "house (in the house)"
  "sa-8044":
    native: "Peace is made with an enemy who helps, not with a friend who harms; for help and harm are the mark by which these two are known."
    notes:
      "n1": "A verse from the fourth book of the Hitopadeśa, whose English Wikipedia article says the work was probably composed by Nārāyaṇa between 800 and 950 CE. The book is about peace and treaties, and the first word of its name here is the same word, संधि (saṃdhi), that grammar uses for the joining of sounds."
      "n2": "संधिः (saṃdhiḥ) means \"joining\" and so, in politics, a treaty or peace; in grammar it names the joining of sounds, the subject of many notes in these decks. In उपकर्त्रारिणा (upakartrāriṇā) the helper उपकर्त्रा (upakartrā, by a helper) and the enemy अरिणा (ariṇā, by an enemy) are one word, the enemy who helps."
    bases:
      "उपकर्त्रारिणा": "helper + enemy (by an enemy who helps)"
      "संधिर्": "peace, treaty"
      "न": "not"
      "मित्रेणापकारिणा": "friend (by a friend) + harming"
      "उपकारापकारो": "help + harm"
      "हि": "for"
      "लक्ष्यं": "what is marked"
      "लक्षणम्": "mark, sign"
      "एतयोः": "of these two"
  "sa-8045":
    native: "On the bank of the Bhāgīrathī there is a city called Pāṭaliputra; there was a king there named Sudarśana, who had all the good qualities of a lord."
    notes:
      "n1": "The opening of the frame story of the Hitopadeśa, in prose. The English Wikipedia says the work is a collection of fables and proverbs in Sanskrit, and that its author Nārāyaṇa gives the purpose of the book as the encouragement of proficiency in Sanskrit expression and of knowledge of wise behaviour."
      "n2": "This is prose, so each sentence ends with a full stop and the compounds are cut by hyphens on the page. अस्ति (asti, there is) opens the story, and later आसीत् (āsīt, there was) closes the second sentence, the verb at the end as in epic style. In गुणोपेतः (guṇopetaḥ) the गुण (guṇa, quality) and उपेत (upeta, endowed) join as a and u make o."
    bases:
      "अस्ति": "to be (there is)"
      "भागीरथी": "the Bhāgīrathī, a river"
      "तीरे": "bank (on the bank)"
      "पाटलिपुत्र": "Pāṭaliputra"
      "नामधेयं": "named, by name"
      "नगरम्": "city"
      "तत्र": "there"
      "सर्व": "all"
      "स्वामि": "lord"
      "गुणोपेतः": "quality + endowed"
      "सुदर्शनो": "Sudarśana"
      "नाम": "by name"
      "नरपतिर्": "king"
      "आसीत्": "to be (there was)"
  "sa-8046":
    native: "He is the one the conqueror of obstacles has won for, the dancer from whose striking hands a row of stars falls from the sky like a shower of flowers."
    notes:
      "n1": "The opening verse of the Vetālapañcaviṃśati, \"twenty-five tales of the Vetāla\". The English Wikipedia says that one of its oldest recensions is in the twelfth book of the Kathāsaritsāgara, compiled in the 11th century by Somadeva from older, now lost, materials, and that this recension has twenty-four tales plus the frame story."
      "n2": "The simile ends in इव (iva, like): पुष्पवृष्टिः (puṣpavṛṣṭiḥ, a shower of flowers) and इव (iva) join as पुष्पवृष्टिरिव (puṣpavṛṣṭiriva), with the visarga turned into r, and इव (iva) and अम्बरात् (ambarāt, from the sky) join as इवाम्बरात् (ivāmbarāt). In कराघातच्युता (karāghātacyutā) the compound reads \"fallen from the blow of the hand\"."
    bases:
      "जितं": "won, conquered"
      "विघ्नजिता": "conqueror of obstacles (by the conqueror of obstacles)"
      "यस्य": "whose"
      "पुष्पवृष्टिरिवाम्बरात्": "flower + shower + like + sky (from the sky)"
      "तारावली": "star + row"
      "कराघातच्युता": "hand + blow + fallen"
      "पतति": "to fall (it falls)"
      "नृत्यतः": "to dance (of one dancing)"
  "sa-8047":
    native: "May the dark throat of Śambhu bring you prosperity, wound about by Love as if with the nooses of the glances of Pārvatī sitting on his lap."
    notes:
      "n1": "The first verse of the Kathāsaritsāgara, \"the ocean of the streams of stories\". The English Wikipedia calls it a famous 11th-century collection of Indian legends and folk tales retold in Sanskrit by the Shaivite Somadeva from Kashmir, with stories within stories, said to be adopted from Guṇāḍhya's Bṛhatkathā."
      "n2": "The word वः (vaḥ) is the short, unstressed form of \"you\" in the plural, here \"to you\". The long compound अङ्कस्थपार्वतीदृष्टिपाशैरिव (aṅkasthapārvatīdṛṣṭipāśairiva) packs \"like with the nooses of the glances of Pārvatī sitting in his lap\" into one word, with इव (iva, like) joined at the end."
    bases:
      "श्रियं": "prosperity, fortune"
      "दिशतु": "to grant (may he grant)"
      "वः": "you (to you, plural)"
      "शंभोः": "Śambhu, Śiva (of Śambhu)"
      "श्यामः": "dark"
      "कण्ठो": "throat"
      "मनोभुवा": "Love, born of the mind (by Love)"
      "अङ्कस्थपार्वतीदृष्टिपाशैरिव": "lap + sitting + Pārvatī + glance + noose + like"
      "विवेष्टितः": "wound round"
