  "sa-5103":
    "native": "Heat."
    "notes":
      "n1": "Masculine a-stem noun. Stem ताप (tāpa); isolated nominative singular तापः (tāpaḥ)."
      "n2": "Before a voiced consonant the final ः (ḥ) of तापः (tāpaḥ) is written ो (o), as in तापो (tāpo) (Aṣṭādhyāyī 6.1.113 and 6.1.114; Whitney 175 a)."
      "n3": "Heat has more than one word in the course: also उष्णता (uṣṇatā), घर्मः (gharmaḥ). They are near synonyms. उष्णता (uṣṇatā) is the quality of being hot, formed from उष्ण (uṣṇa) with the suffix ता (tā); तापः (tāpaḥ) and घर्मः (gharmaḥ) are the heat itself."
    "bases":
      "तापः": "heat"
    "examples":
      "तापो विपुलः":
        "native": "The heat is great."
        "bases":
          "तापो": "heat"
          "विपुलः": "large, extensive"
      "तत्र तापो भवति":
        "native": "There is heat there."
        "bases":
          "तत्र": "there"
          "तापो": "heat"
          "भवति": "is"
