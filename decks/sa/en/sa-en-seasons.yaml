  "sa-5100":
    "native": "Spring."
    "notes":
      "n1": "Masculine a-stem noun. Stem वसन्त (vasanta); isolated nominative singular वसन्तः (vasantaḥ)."
      "n2": "Before a voiced consonant the final ः (ḥ) of वसन्तः (vasantaḥ) is written ो (o), as in वसन्तो (vasanto) (Aṣṭādhyāyī 6.1.113 and 6.1.114; Whitney 175 a)."
    "bases":
      "वसन्तः": "spring"
    "examples":
      "वसन्तो मधुरः":
        "native": "Spring is sweet."
        "bases":
          "वसन्तो": "spring"
          "मधुरः": "sweet"
      "अत्र वसन्तो भवति":
        "native": "Here there is spring."
        "bases":
          "अत्र": "here"
          "वसन्तो": "spring"
          "भवति": "is"
