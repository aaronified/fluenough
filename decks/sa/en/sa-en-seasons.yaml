      "n2": "A final त् (t) or ट् (ṭ) before a voiced consonant becomes द् (d) or ड् (ḍ), as in तडिद् (taḍid) from तडित् (taḍit) (Aṣṭādhyāyī 8.2.39; Whitney 159)."
