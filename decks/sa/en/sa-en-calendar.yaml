      "संवत्सरः": "year"
    examples:
      "संवत्सरो दीर्घः":
        native: "The year is long."
        bases:
          "संवत्सरो": "year"
          "दीर्घः": "long"
      "अत्र संवत्सरो भवति":
        native: "Here there is a year."
