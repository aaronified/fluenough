"cards":
  "sa-5200":
    "native": "Year."
    "notes":
      "n1": "Masculine a-stem noun. Stem संवत्सर (saṃvatsara); isolated nominative singular संवत्सरः (saṃvatsaraḥ)."
      "n2": "Before a voiced consonant the final ः (ḥ) of संवत्सरः (saṃvatsaraḥ) is written ो (o), as in संवत्सरो (saṃvatsaro) (Aṣṭādhyāyī 6.1.113 and 6.1.114; Whitney 175 a)."
      "n3": "Year has more than one word in the course: also वत्सरः (vatsaraḥ). They are near synonyms."
    "bases":
      "संवत्सरः": "year"
    "examples":
      "संवत्सरो दीर्घः":
        "native": "The year is long."
        "bases":
          "संवत्सरो": "year"
          "दीर्घः": "long"
      "अत्र संवत्सरो भवति":
        "native": "Here there is a year."
        "bases":
          "अत्र": "here"
          "संवत्सरो": "year"
          "भवति": "is"
