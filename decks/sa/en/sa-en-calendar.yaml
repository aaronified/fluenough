  "sa-5203":
    "native": "Day."
    "notes":
      "n1": "Neuter a-stem noun. Stem दिन (dina); isolated nominative and accusative singular दिनम् (dinam)."
      "n2": "Before a consonant the final म् (m) is written ं (ṃ), as in दिनं (dinaṃ) from दिनम् (dinam) (Aṣṭādhyāyī 8.3.23; Whitney 213)."
      "n3": "Day has more than one word in the course: also दिवसः (divasaḥ), वासरः (vāsaraḥ). They are near synonyms. दिनम् (dinam) is the day as a unit of time, दिवसः (divasaḥ) and वासरः (vāsaraḥ) are used alike; वासर (vāsara) also appears in the names of the days of the week."
    "bases":
      "दिनम्": "day"
    "examples":
      "दिनं दीर्घम्":
        "native": "The day is long."
        "bases":
          "दिनं": "day"
          "दीर्घम्": "long"
      "तत्र दिनं भवति":
        "native": "There is a day there."
        "bases":
          "तत्र": "there"
          "दिनं": "day"
          "भवति": "is"
