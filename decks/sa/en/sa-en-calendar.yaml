      "n2": "After अ (a) the final ः (ḥ) before a vowel other than अ (a) is dropped, as in मध्याह्न (madhyāhna) from मध्याह्नः (madhyāhnaḥ) (Aṣṭādhyāyī 8.3.17 and 8.3.19; Whitney 175)."
