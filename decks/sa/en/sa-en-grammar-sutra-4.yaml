kind: "layer"
core: "sa-grammar-sutra-4"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Reading the Aṣṭādhyāyī 4: the samāsa and kṛt sūtras"
description: "Thirty-seven sūtras of Pāṇini read in the text: how a compound is named (samāsa, avyayībhāva, tatpuruṣa, dvigu, karmadhāraya, bahuvrīhi, dvandva) and how the primary suffixes are named and used (pratyaya, kṛt, kṛtya, tṛc, ṇvul, ktin, lyuṭ, ktvā, sārvadhātuka and ārdhadhātuka). Each row gives the sūtra, its split into words, what is carried in from earlier rules, and an example from the course. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
pattern:
  name: "Sūtras read in the text"
  slot_name: "part"
  slots:
    "sutra": "the sūtra, as the page and the text give it"
    "padaccheda": "the sūtra split into its words (padaccheda)"
    "anuvrtti": "the words carried in from earlier sūtras (anuvṛtti)"
    "example": "an example the rule governs"
  entries:
    "2-1-1": "a rule about padas, such as making a compound, applies to words that are connected in meaning"
    "2-1-3": "the heading for the following rules up to 2.2.38: the name samāsa, compound, is given"
    "2-1-4": "a word with a sup ending joins with another sup word to make a compound"
    "2-1-5": "the compound of the kind just described is called avyayībhāva, the adverbial compound"
    "2-1-22": "the heading for the compounds that follow: this kind is called tatpuruṣa, the dependent compound"
    "2-1-23": "a dvigu, a compound with a number first, is also a tatpuruṣa"
    "2-1-24": "a second-case word compounds with śrita, atīta, patita, gata, atyasta, prāpta or āpanna"
    "2-1-32": "a word meaning the doer or the instrument compounds with a word ending in a kṛt suffix, in many cases"
    "2-1-36": "a fourth-case word compounds with tadartha, artha, bali, hita, sukha or rakṣita"
    "2-1-52": "a compound whose first member is a number is called dvigu"
    "2-1-57": "a qualifier compounds with the thing it qualifies, in many cases"
    "1-2-42": "a tatpuruṣa whose members both point to the same thing is called karmadhāraya"
    "1-2-43": "a member that is named in the first case in the rule for a compound is called upasarjana, subordinate"
    "2-2-6": "the negative na compounds with another word"
    "2-2-8": "a genitive word compounds with another word"
    "2-2-23": "the remaining compound, not described above, is called bahuvrīhi"
    "2-2-24": "several words compound to name some other thing than their own meaning"
    "2-2-29": "words joined by ca, 'and', make a compound called dvandva"
    "2-2-30": "the subordinate member of a compound is placed first"
    "2-4-26": "in a dvandva and a tatpuruṣa, the gender is that of the last member"
    "3-1-1": "the heading for the rest of the third chapter: what follows is a pratyaya, a suffix"
    "3-1-2": "a pratyaya comes after the stem it is added to"
    "3-1-91": "the heading for the following suffixes: they are added to a root"
    "3-1-93": "a suffix that is added to a root and is not a tiṅ ending is called kṛt"
    "3-1-95": "the suffixes up to ṇvul (3.1.133) are called kṛtya, those that make gerundives"
    "3-1-96": "tavyat, tavya and anīyar are kṛtya suffixes, giving -tavya and -anīya"
    "3-1-97": "yat, giving -ya, is added to a root ending in a vowel"
    "3-1-133": "ṇvul and tṛc are added to a root to make the doer of the action"
    "3-2-123": "the tense laṭ, the present, is used for what is happening now"
    "3-3-18": "a suffix such as ghañ is added to a root in the sense of the action itself"
    "3-3-94": "the suffix ktin makes a feminine noun of action"
    "3-3-115": "the suffix lyuṭ, giving -ana, makes a neuter noun of action"
    "3-4-21": "when two actions have the same doer, the suffix ktvā is added to the earlier one"
    "3-4-67": "a kṛt suffix denotes the doer"
    "3-4-69": "an l-affix denotes the object or the action itself (with intransitive roots), as well as the doer"
    "3-4-113": "the tiṅ endings, and the suffixes marked ś, are called sārvadhātuka"
    "3-4-114": "the other suffixes are called ārdhadhātuka"
  notes: "Sūtra numbers are those of the page, in the form chapter.pāda.sūtra. Each row is one sūtra of Pāṇini. The words of each sūtra are glossed below with the case (vibhakti) and number the padaccheda gives, and the words carried in from earlier rules are named. Case and number: nom. is the first case, acc. the second, instr. the third, dat. the fourth, abl. the fifth, gen. the sixth, loc. the seventh; sg., du., pl. are singular, dual, plural. 2.1.1, samarthaḥ padavidhiḥ. Words: samarthaḥ (nom. sg.): samartha, connected in sense; padavidhiḥ (nom. sg.): a rule about padas. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1). Example: rājapuruṣa, 'the king's man': rājan and puruṣa are connected in meaning. Whitney: § 1246, 1247. 2.1.3, prāk kaḍārāt samāsaḥ. Words: prāk (indeclinable): before; kaḍārāt (abl. sg.): from the word kaḍāra, that is the rule 2.2.38 (kaḍārāḥ karmadhāraye); samāsaḥ (nom. sg.): samāsa, a compound. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), prākkaḍārātsamāsaḥ (2.1.3). Example: adhikāra, a heading: no example. Whitney: § 1246, 1247. 2.1.4, saha supā. Words: saha (indeclinable): together with; supā (instr. sg.): with a sup-ending word. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), prākkaḍārātsamāsaḥ (2.1.3), supsupā (2.1.4). Example: rājapuruṣa (rājñaḥ + puruṣaḥ): two words with case endings, one compound. Whitney: § 1246, 1247. 2.1.5, avyayībhāvaḥ. Words: avyayībhāvaḥ (nom. sg.): avyayībhāva, the adverbial compound. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), prākkaḍārātsamāsaḥ (2.1.3), supsupā (2.1.4), avyayībhāvaḥ (2.1.5). Example: upagaṅgam, 'near the Gaṅgā': the first member upa is an indeclinable, and the whole is indeclinable. Whitney: § 1313 (not confirmed in the OCR text I could read; cited as in the merged unit that teaches the same rule). 2.1.22, tatpuruṣaḥ. Words: tatpuruṣaḥ (nom. sg.): tatpuruṣa, the dependent compound. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), prākkaḍārātsamāsaḥ (2.1.3), supsupā (2.1.4), vibhāṣā (2.1.11), tatpuruṣaḥ (2.1.22). Example: rājapuruṣa, 'the king's man', is a tatpuruṣa: the first member depends on the second. Whitney: § 1247, 1264 a (not confirmed in the OCR text I could read; cited as in the merged unit that teaches the same rule). 2.1.23, dviguśca. Words: dviguḥ (nom. sg.): dvigu, the compound with a number first; ca (indeclinable): and. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), prākkaḍārātsamāsaḥ (2.1.3), supsupā (2.1.4), vibhāṣā (2.1.11), tatpuruṣaḥ (2.1.22). Example: tribhuvana, 'the three worlds': a number, tri, and a noun, bhuvana. Whitney: § 1312 (not confirmed in the OCR text I could read; cited as in the merged unit that teaches the same rule). 2.1.24, dvitīyā śritātītapatitagatātyastaprāptāpannaiḥ. Words: dvitīyā (nom. sg.): the second case; śrita-atīta-patita-gata-atyasta-prāpta-āpannaiḥ (instr. pl.): with śrita, atīta, patita, gata, atyasta, prāpta, āpanna. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), prākkaḍārātsamāsaḥ (2.1.3), supsupā (2.1.4), vibhāṣā (2.1.11), tatpuruṣaḥ (2.1.22). Example: grāmagataḥ, 'gone to the village': grāmam, in the accusative, with gata. Whitney: § 1247, 1264 a (not confirmed in the OCR text I could read; cited as in the merged unit that teaches the same rule). 2.1.32, kartṛkaraṇe kṛtā bahulam. Words: kartṛ-karaṇe (loc. sg.): the doer and the instrument; kṛtā (instr. sg.): with a kṛt-ending word; bahulam (nom. sg.): in many cases, variously. Anuvṛtti: tṛtīyā from 2.1.30. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), prākkaḍārātsamāsaḥ (2.1.3), supsupā (2.1.4), vibhāṣā (2.1.11), tatpuruṣaḥ (2.1.22). Example: nakhanirbhinnaḥ, 'torn by the nails': nakhaiḥ, the instrument, with the participle nirbhinna. Whitney: § 1247, 1264 a (not confirmed in the OCR text I could read; cited as in the merged unit that teaches the same rule). 2.1.36, caturthī tadarthārthabalihitasukharakṣitaiḥ. Words: caturthī (nom. sg.): the fourth case; tadartha-artha-bali-hita-sukha-rakṣitaiḥ (instr. pl.): with tadartha, artha, bali, hita, sukha, rakṣita. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), prākkaḍārātsamāsaḥ (2.1.3), supsupā (2.1.4), vibhāṣā (2.1.11), tatpuruṣaḥ (2.1.22). Example: gohita, 'good for cows': gobhyaḥ, in the dative, with hita. Whitney: § 1247, 1264 a (not confirmed in the OCR text I could read; cited as in the merged unit that teaches the same rule). 2.1.52, saṃkhyāpūrvo dviguḥ. Words: saṃkhyā-pūrvaḥ (nom. sg.): having a number first; dviguḥ (nom. sg.): dvigu, the compound with a number first. Anuvṛtti: samānādhikaraṇena from 2.1.49. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), prākkaḍārātsamāsaḥ (2.1.3), supsupā (2.1.4), vibhāṣā (2.1.11), tatpuruṣaḥ (2.1.22). Example: pañcavaṭī, 'the five banyan trees' (a place): pañca, a number, with vaṭa. Whitney: § 1312 (not confirmed in the OCR text I could read; cited as in the merged unit that teaches the same rule). 2.1.57, viśeṣaṇaṃ viśeṣyeṇa bahulam. Words: viśeṣaṇam (nom. sg.): a qualifier; viśeṣyeṇa (instr. sg.): with the thing qualified; bahulam (nom. sg.): in many cases, variously. Anuvṛtti: samānādhikaraṇena from 2.1.49. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), prākkaḍārātsamāsaḥ (2.1.3), supsupā (2.1.4), vibhāṣā (2.1.11), tatpuruṣaḥ (2.1.22). Example: mahārāja, 'great king': the qualifier mahā with rājan. Whitney: § 1279, 1280. 1.2.42, tatpuruṣaḥ samānādhikaraṇaḥ karmadhārayaḥ. Words: tatpuruṣaḥ (nom. sg.): tatpuruṣa, the dependent compound; samānādhikaraṇaḥ (nom. sg.): with the same reference; karmadhārayaḥ (nom. sg.): karmadhāraya, the descriptive compound. Anuvṛtti: none stated. Example: nīlotpala, 'blue lotus': nīla and utpala refer to the same thing. Whitney: § 1279, 1280. 1.2.43, prathamānirdiṣṭaṃ samāsa upasarjanam. Words: prathamānirdiṣṭam (nom. sg.): what is named in the first case; samāse (loc. sg.): in a compound; upasarjanam (nom. sg.): upasarjana, the subordinate member. Anuvṛtti: none stated. Example: grāmagataḥ: in 2.1.24 the word dvitīyā stands in the first case, so the member with the second case, grāma, is the upasarjana, as Vasu explains with 2.1.24. Whitney: § not located. 2.2.6, nañ. Words: nañ (indeclinable): the negative na. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), prākkaḍārātsamāsaḥ (2.1.3), supsupā (2.1.4), vibhāṣā (2.1.11), tatpuruṣaḥ (2.1.22). Example: abrāhmaṇa, 'a non-brahmin' (na + brāhmaṇa): the n of na becomes a before a consonant. Whitney: § not located. 2.2.8, ṣaṣṭhī. Words: ṣaṣṭhī (nom. sg.): the genitive. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), prākkaḍārātsamāsaḥ (2.1.3), supsupā (2.1.4), vibhāṣā (2.1.11), tatpuruṣaḥ (2.1.22). Example: rājapuruṣa (rājñaḥ + puruṣaḥ): 'the man of the king', genitive with noun. Whitney: § 1247, 1264 a (not confirmed in the OCR text I could read; cited as in the merged unit that teaches the same rule). 2.2.23, śeṣo bahuvrīhiḥ. Words: śeṣaḥ (nom. sg.): the rest; bahuvrīhiḥ (nom. sg.): bahuvrīhi, the possessive compound. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), prākkaḍārātsamāsaḥ (2.1.3), supsupā (2.1.4), vibhāṣā (2.1.11). Example: pītāmbara, 'having yellow cloth', a name of Viṣṇu: the whole names someone who has the yellow cloth. Whitney: § 1293 (not confirmed in the OCR text I could read; cited as in the merged unit that teaches the same rule). 2.2.24, anekamanyapadārthe. Words: anekam (nom. sg.): more than one; anyapadārthe (loc. sg.): in the sense of another word. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), prākkaḍārātsamāsaḥ (2.1.3), supsupā (2.1.4), vibhāṣā (2.1.11). Example: citragu, 'having variegated cows' (citrāḥ gāvaḥ yasya): the whole names the owner. Whitney: § 1293 (not confirmed in the OCR text I could read; cited as in the merged unit that teaches the same rule). 2.2.29, cārthe dvandvaḥ. Words: ca-arthe (loc. sg.): in the sense of 'and'; dvandvaḥ (nom. sg.): dvandva, the copulative compound. Anuvṛtti: anekam from 2.2.24. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), prākkaḍārātsamāsaḥ (2.1.3), supsupā (2.1.4), vibhāṣā (2.1.11). Example: rāmalakṣmaṇau, 'Rāma and Lakṣmaṇa': two words joined by 'and', in the dual. Whitney: § 1252. 2.2.30, upasarjanaṃ pūrvam. Words: upasarjanam (nom. sg.): upasarjana, the subordinate member; pūrvam (nom. sg.): first. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), prākkaḍārātsamāsaḥ (2.1.3), supsupā (2.1.4), vibhāṣā (2.1.11). Example: grāmagataḥ: the upasarjana grāma, the second-case member, is placed first. Whitney: § not located. 2.4.26, paravalliṅgaṃ dvandvatatpuruṣayoḥ. Words: paravat (indeclinable): like the last member; liṅgam (nom. sg.): gender; dvandva-tatpuruṣayoḥ (gen. du.): in dvandva and tatpuruṣa. Anuvṛtti: none stated. Example: rājapuruṣa: puruṣa is masculine, so the whole is masculine. Whitney: § not located. 3.1.1, pratyayaḥ. Words: pratyayaḥ (nom. sg.): pratyaya, a suffix. Anuvṛtti: none stated. Adhikāra in force: pratyayaḥ (3.1.1). Example: adhikāra, a heading: no example. Whitney: § 1138. 3.1.2, paraśca. Words: paraḥ (nom. sg.): the most close; ca (indeclinable): and. Anuvṛtti: none stated. Adhikāra in force: pratyayaḥ (3.1.1), paraśca (3.1.2). Example: pācaka, 'cook': the suffix aka comes after the root pac. Whitney: § 1138. 3.1.91, dhātoḥ. Words: dhātoḥ (abl. sg.): after a root. Anuvṛtti: none stated. Adhikāra in force: pratyayaḥ (3.1.1), paraśca (3.1.2), ādyudāttaśca (3.1.3), dhātoḥ (3.1.91). Example: pāṭha, 'reading': the suffix is added to the root paṭh. Whitney: § 1138. 3.1.93, kṛdatiṅ. Words: kṛt (nom. sg.): kṛt, a primary suffix; atiṅ (nom. sg.): other than tiṅ. Anuvṛtti: none stated. Adhikāra in force: pratyayaḥ (3.1.1), paraśca (3.1.2), ādyudāttaśca (3.1.3), dhātoḥ (3.1.91). Example: pācaka, 'cook': -aka is a kṛt added to pac. Whitney: § 1138. 3.1.95, kṛtyāḥ prāṅ ṇvulaḥ. Words: kṛtyāḥ (nom. pl.): kṛtya, the suffixes that make gerundives. Anuvṛtti: kṛt from 3.1.93. Adhikāra in force: pratyayaḥ (3.1.1), paraśca (3.1.2), ādyudāttaśca (3.1.3), dhātoḥ (3.1.91). Example: kārya, 'to be done': from kṛ with the kṛtya suffix ṇyat. Whitney: § 961 to 964 (not confirmed in the OCR text I could read; cited as in the merged unit that teaches the same rule). 3.1.96, tavyattavyānīyaraḥ. Words: tavyat-tavya-anīyaraḥ (nom. pl.): tavyat, tavya, anīyar. Anuvṛtti: kṛt from 3.1.93; kṛtyāḥ from 3.1.95. Adhikāra in force: pratyayaḥ (3.1.1), paraśca (3.1.2), ādyudāttaśca (3.1.3), dhātoḥ (3.1.91). Example: kartavya, 'to be done': kṛ and the suffix tavya. Whitney: § 961 to 964 (not confirmed in the OCR text I could read; cited as in the merged unit that teaches the same rule). 3.1.97, aco yat. Words: acaḥ (abl. sg.): after a root ending in a vowel; yat (nom. sg.): the suffix yat. Anuvṛtti: kṛt from 3.1.93; kṛtyāḥ from 3.1.95. Adhikāra in force: pratyayaḥ (3.1.1), paraśca (3.1.2), ādyudāttaśca (3.1.3), kṛtyāḥ (3.1.97), dhātoḥ (3.1.91). Example: jeya, 'to be won': the root ji and the suffix ya. Whitney: § 961 to 964 (not confirmed in the OCR text I could read; cited as in the merged unit that teaches the same rule). 3.1.133, ṇvultṛcau. Words: ṇvul-tṛcau (nom. du.): ṇvul and tṛc. Anuvṛtti: kṛt from 3.1.93. Adhikāra in force: pratyayaḥ (3.1.1), paraśca (3.1.2), ādyudāttaśca (3.1.3), dhātoḥ (3.1.91). Example: pācaka, 'cook', with ṇvul, and paktṛ with tṛc, from pac. Whitney: § 1181, 1182 (not confirmed in the OCR text I could read; cited as in the merged unit that teaches the same rule). 3.2.123, vartamāne laṭ. Words: vartamāne (loc. sg.): in the present; laṭ (nom. sg.): laṭ, the present tense. Anuvṛtti: none stated. Adhikāra in force: pratyayaḥ (3.1.1), paraśca (3.1.2), ādyudāttaśca (3.1.3), dhātoḥ (3.1.91), vartamāne (3.2.123). Example: pacati, 'he cooks, he is cooking': the present laṭ. Whitney: § not located. 3.3.18, bhāve. Words: bhāve (loc. sg.): in the sense of the action. Anuvṛtti: kṛt from 3.1.93; ghañ from 3.3.16. Adhikāra in force: pratyayaḥ (3.1.1), paraśca (3.1.2), ādyudāttaśca (3.1.3), dhātoḥ (3.1.91), bhāve (3.3.18). Example: pāka, 'cooking': from pac with ghañ, in the sense of the action. Whitney: § 1148 (not confirmed in the OCR text I could read; cited as in the merged unit that teaches the same rule). 3.3.94, striyāṃ ktin. Words: striyām (loc. sg.): in the feminine; ktin (nom. sg.): the suffix ktin. Anuvṛtti: kṛt from 3.1.93. Adhikāra in force: pratyayaḥ (3.1.1), paraśca (3.1.2), ādyudāttaśca (3.1.3), dhātoḥ (3.1.91), bhāve (3.3.18), akartari ca kārake saṃjñāyām (3.3.19), striyām (3.3.94). Example: gati, 'going': gam with ktin, a feminine noun of action. Whitney: § 1157. 3.3.115, lyuṭ ca. Words: lyuṭ (nom. sg.): the suffix lyuṭ; ca (indeclinable): and. Anuvṛtti: kṛt from 3.1.93; napuṃsake, bhāve from 3.3.114. Adhikāra in force: pratyayaḥ (3.1.1), paraśca (3.1.2), ādyudāttaśca (3.1.3), dhātoḥ (3.1.91). Example: gamana, 'going': gam with lyuṭ. Whitney: § 1150. 3.4.21, samānakartṛkayoḥ pūrvakāle. Words: samānakartṛkayoḥ (loc. du.): of two actions with the same doer; pūrvakāle (loc. sg.): for the earlier time. Anuvṛtti: kṛt from 3.1.93; ktvā from 3.4.18. Adhikāra in force: pratyayaḥ (3.1.1), paraśca (3.1.2), ādyudāttaśca (3.1.3), dhātoḥ (3.1.91). Example: paṭhitvā gacchati, 'having read, he goes': both actions have the same doer, and ktvā marks the earlier. Whitney: § 990, 991 (not confirmed in the OCR text I could read; cited as in the merged unit that teaches the same rule). 3.4.67, kartari kṛt. Words: kartari (loc. sg.): in the sense of the doer; kṛt (nom. sg.): kṛt, a primary suffix. Anuvṛtti: none stated. Adhikāra in force: pratyayaḥ (3.1.1), paraśca (3.1.2), ādyudāttaśca (3.1.3), dhātoḥ (3.1.91). Example: kartā, 'doer': the kṛt suffix tṛc denotes the doer. Whitney: § 1138. 3.4.69, laḥ karmaṇi ca bhāve cākarmakebhyaḥ. Words: laḥ (nom. pl.): of the l-affixes (the tenses and moods); karmaṇi (loc. sg.): in the sense