cards:
  "sa-5700":
    native: "Kingdom, rule."
    notes:
      "n1": "Neuter a-stem noun: its full set of case forms is in the a-stems table of the grammar rules."
      "n2": "The dictionary stem is राज्य (rājya); the card shows the isolated nominative singular राज्यम् (rājyam)."
      "n3": "Before a consonant the final म् (m) of राज्यम् (rājyam) is written ं (ṃ), as in राज्यं (rājyaṃ); Aṣṭādhyāyī 8.3.23, the rule of the anusvāra, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213."
      "n4": "A kingdom or realm, the state as a whole; जनपदः (janapadaḥ) is a district or country of a people."
    bases:
      "राज्यम्": "kingdom, rule"
    examples:
      "अस्ति राज्यं तत्र":
        native: "There is a kingdom there."
        bases:
          "अस्ति": "is"
          "राज्यं": "kingdom, rule"
          "तत्र": "there"
      "राज्ये नृपः":
        native: "A king in the kingdom."
        bases:
          "राज्ये": "kingdom, rule (nominative dual)"
          "नृपः": "king"
