cards:
  "sa-6800":
    native: "An effect always comes from a cause."
    bases: { "कारणात्": "from a cause", "कार्यं": "effect", "भवति": "to be (comes)" }
    confusables: { "w1": { why: "Absence of a cause, not cause: अकारणम् (akāraṇam) means absence of a cause." }, "w2": { why: "Motive, not cause: हेतुः (hetuḥ) means motive." }, "w3": { why: "Advance, not effect: प्रवृत्तिः (pravṛttiḥ) means advance." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. कार्यम् (kāryam) is written कार्यं (kāryaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of भवति (bhavati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "कारणात् (kāraṇāt) is the ablative case of कारणम् (kāraṇam); the ablative says the source: from a cause. कार्यम् (kāryam) is the thing that comes about, an effect." }
  "sa-6801":
    native: "Through ignorance there is wandering in the cycle of rebirth."
    bases: { "अविद्यया": "through ignorance", "संसारे": "in the cycle of rebirth", "भ्रमो": "wandering", "भवति": "to be (there is)" }
    confusables: { "w1": { why: "Knowledge, not ignorance: विद्या (vidyā) means knowledge." }, "w2": { why: "Alternative, not wandering: विकल्पः (vikalpaḥ) means alternative." }, "w3": { why: "Change, not rebirth: परिणामः (pariṇāmaḥ) means change." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. भ्रमः (bhramaḥ) is written भ्रमो (bhramo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of भवति (bhavati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "अविद्यया (avidyayā) is the instrumental case of अविद्या (avidyā): through ignorance. संसारे (saṃsāre) is the locative case of संसारः (saṃsāraḥ): in the cycle of rebirth." }
  "sa-6802":
    native: "The mind becomes calm through yoga."
    bases: { "योगेन": "through yoga", "चित्तं": "mind", "शान्तं": "calm", "भवति": "to become (becomes)" }
    confusables: { "w1": { why: "Absorbed concentration, not yoga: समाधिः (samādhiḥ) means absorbed concentration." }, "w2": { why: "Consciousness, not mind: चैतन्यम् (caitanyam) means consciousness." }, "w3": { why: "Shaken and disturbed, not calm: क्षुब्धः (kṣubdhaḥ) means shaken and disturbed." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. चित्तम् (cittam) is written चित्तं (cittaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of शान्तं (śāntaṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). शान्तम् (śāntam) is written शान्तं (śāntaṃ), for the same reason, before भवति (bhavati). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "योगेन (yogena) is the instrumental case of योगः (yogaḥ): through yoga. शान्तम् (śāntam) is the neuter form of शान्तः (śāntaḥ), to agree with चित्तम् (cittam)." }
  "sa-6803":
    native: "Knowledge becomes firm through reflection."
    bases: { "मननेन": "through reflection", "ज्ञानं": "knowledge", "स्थिरं": "firm", "भवति": "to become (becomes)" }
    confusables: { "w1": { why: "Remembrance, not reflection: स्मरणम् (smaraṇam) means remembrance." }, "w2": { why: "Reflection and thinking over a matter, not reflection: चिन्तनम् (cintanam) means reflection and thinking over a matter." }, "w3": { why: "Impermanent and transient, not firm: अनित्यः (anityaḥ) means impermanent and transient." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. ज्ञानम् (jñānam) is written ज्ञानं (jñānaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of स्थिरं (sthiraṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). स्थिरम् (sthiram) is written स्थिरं (sthiraṃ), for the same reason, before भवति (bhavati). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "मननेन (mananena) is the instrumental case of मननम् (mananam): through reflection. स्थिरम् (sthiram) is the neuter form of स्थिरः (sthiraḥ), to agree with ज्ञानम् (jñānam)." }
  "sa-6804":
    native: "After creation comes destruction."
    bases: { "सृष्टेः": "of creation", "पश्चाद्": "after", "विनाशो": "destruction", "भवति": "to be (comes)" }
    confusables: { "w1": { why: "Standing, not creation: स्थितिः (sthitiḥ) means standing." }, "w2": { why: "Destruction or loss of something, not destruction: नाशः (nāśaḥ) means destruction or loss of something." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पश्चात् (paścāt) is written पश्चाद् (paścād) because a final त् (t) becomes द् (d) before a voiced sound, here the start of विनाशो (vināśo) (Aṣṭādhyāyī 8.2.39, झलां जशोऽन्ते (jhalāṃ jaśo 'nte), in separate words झलां जशः अन्ते (jhalāṃ jaśaḥ ante); Whitney 159). विनाशः (vināśaḥ) is written विनाशो (vināśo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of भवति (bhavati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "सृष्टेः (sṛṣṭeḥ) is the genitive case of सृष्टिः (sṛṣṭiḥ), and पश्चात् (paścāt) (paścāt) takes the genitive: after creation." }
  "sa-6805":
    native: "Success comes through steady means."
    bases: { "नित्यं": "steadily", "साधनेन": "through means", "सिद्धिर्": "success", "भवति": "to be (comes)" }
    confusables: { "w1": { why: "What is to be achieved, not means: साध्यः (sādhyaḥ) means what is to be achieved." }, "w2": { why: "Accomplished, not success: सिद्धः (siddhaḥ) means accomplished." }, "w3": { why: "Union, not success: युक्तिः (yuktiḥ) means union." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. नित्यम् (nityam) is written नित्यं (nityaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of साधनेन (sādhanena) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). सिद्धिः (siddhiḥ) is written सिद्धिर् (siddhir) because a final ः (ḥ) after इ (i) becomes र् (r) before a voiced sound, here the start of भवति (bhavati) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174).", "n2": "साधनेन (sādhanena) is the instrumental case of साधनम् (sādhanam): through means. सिद्धिः (siddhiḥ) is the success that comes." }
  "sa-6806":
    native: "The soul's liberation comes through knowledge."
    bases: { "आत्मनो": "of the soul", "मुक्तिर्": "liberation", "ज्ञानेन": "through knowledge", "भवति": "to be (comes)" }
    confusables: { "w1": { why: "Extinction, not liberation: निर्वाणम् (nirvāṇam) means extinction." }, "w2": { why: "Confinement, not liberation: निरोधः (nirodhaḥ) means confinement." }, "w3": { why: "Absolute unity, not soul: कैवल्यम् (kaivalyam) means absolute unity." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. आत्मनः (ātmanaḥ) is written आत्मनो (ātmano) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of मुक्तिर् (muktir) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). मुक्तिः (muktiḥ) is written मुक्तिर् (muktir) because a final ः (ḥ) after इ (i) becomes र् (r) before a voiced sound, here the start of ज्ञानेन (jñānena) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174).", "n2": "आत्मनः (ātmanaḥ) is the genitive case of आत्मन् (ātman): of the soul. ज्ञानेन (jñānena) is the instrumental case of ज्ञानम् (jñānam): through knowledge." }
  "sa-6807":
    native: "In nature sattva is a quality."
    bases: { "प्रकृतौ": "in nature", "सत्त्वं": "sattva", "गुणो": "quality", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Man, not nature: पुरुषः (puruṣaḥ) means man." }, "w2": { why: "Own nature, not sattva: स्वरूपम् (svarūpam) means own nature." }, "w3": { why: "Fault, not quality: दोषः (doṣaḥ) means fault." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सत्त्वम् (sattvam) is written सत्त्वं (sattvaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of गुणो (guṇo) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). गुणः (guṇaḥ) is written गुणो (guṇo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of भवति (bhavati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "प्रकृतौ (prakṛtau) is the locative case of प्रकृतिः (prakṛtiḥ): in nature. गुणः (guṇaḥ) says what sattva is: a quality, one of the three strands of nature." }
  "sa-6808":
    native: "The teacher tells the boy a secret."
    bases: { "आचार्यो": "teacher", "रहस्यं": "secret", "बालकाय": "to the boy", "कथयति": "to tell (tells)" }
    confusables: { "w1": { why: "Servant, not teacher: भृत्यः (bhṛtyaḥ) means servant." }, "w2": { why: "Direct perception, not secret: साक्षात्कारः (sākṣātkāraḥ) means direct perception." }, "w3": { why: "To say, not to tell: ब्रू (brū) means to say." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. आचार्यः (ācāryaḥ) is written आचार्यो (ācāryo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of रहस्यं (rahasyaṃ) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). रहस्यम् (rahasyam) is written रहस्यं (rahasyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of बालकाय (bālakāya) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "रहस्यम् (rahasyam) is the accusative case: what is told. बालकाय (bālakāya) is the dative case of बालकः (bālakaḥ): to the boy." }
  "sa-6809":
    native: "The mind becomes cheerful through devotion."
    bases: { "भक्त्या": "through devotion", "चित्तं": "mind", "प्रसन्नं": "cheerful", "भवति": "to become (becomes)" }
    confusables: { "w1": { why: "Delight, not devotion: हर्षः (harṣaḥ) means delight." }, "w2": { why: "Consciousness, not mind: चैतन्यम् (caitanyam) means consciousness." }, "w3": { why: "Sad and depressed in spirit, not cheerful: खिन्नः (khinnaḥ) means sad and depressed in spirit." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. चित्तम् (cittam) is written चित्तं (cittaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of प्रसन्नं (prasannaṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). प्रसन्नम् (prasannam) is written प्रसन्नं (prasannaṃ), for the same reason, before भवति (bhavati). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "भक्त्या (bhaktyā) is the instrumental case of भक्तिः (bhaktiḥ): through devotion. प्रसन्नम् (prasannam) is the neuter form of प्रसन्नः (prasannaḥ), to agree with चित्तम् (cittam)." }
