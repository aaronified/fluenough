native: { code: "en", iso639_3: "eng", name: "English" }
name: "The six kārakas and the cases they take"
description: "Pāṇini names six roles a noun can play in the action of a verb (doer, object, tool, recipient, source, place) and gives each its case, with four words that ask for a case themselves. The cases are shown on the noun Rāma. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
pattern:
  name: "The kārakas and their cases"
  slot_name: "case"
  slots: { "case": "the case it takes", "model": "Rāma in that case" }
  entries:
    "kartr-active": "the doer, the independent one (kartṛ): in a sentence with an active verb the verb's ending already says it, so the plain first case is used (Pāṇini 1.4.54, 2.3.1, 3.4.69, 2.3.46)"
    "kartr-passive": "the doer (kartṛ) in a sentence with a passive verb: the verb no longer says it, so the third case is used (Pāṇini 1.4.54, 2.3.18)"
    "karman-active": "the object, what the doer most wants to reach (karman), with an active verb: the second case (Pāṇini 1.4.49, 2.3.2)"
    "karman-passive": "the object (karman) in a sentence with a passive verb: the verb now says it, so it takes the plain first case (Pāṇini 1.4.49, 2.3.46)"
    "karana": "the most effective means, the tool or instrument (karaṇa): the third case (Pāṇini 1.4.42, 2.3.18)"
    "sampradana": "the one the giving is meant for, the recipient (sampradāna): the fourth case (Pāṇini 1.4.32, 2.3.13)"
    "apadana": "the fixed point something moves away from, the source (apādāna): the fifth case (Pāṇini 1.4.24, 2.3.28)"
    "adhikarana": "the support or place where the action rests (adhikaraṇa): the seventh case (Pāṇini 1.4.45, 2.3.36)"
    "sesa": "the rest (śeṣa), a relation such as of or belonging to, which is not a kāraka: the sixth case (Pāṇini 2.3.50)"
    "saha": "the word saha, with, an upapada (a word the case depends on): it takes the third case, rarely the fifth (Pāṇini 2.3.19; en.wiktionary)"
    "vina": "the word vinā, without, an upapada: usually the third case, also the second or the fifth (Pāṇini 2.3.32; en.wiktionary)"
    "rte": "the word ṛte, without or except, an upapada: the fifth case, also the second (Pāṇini 2.3.29; en.wiktionary)"
    "namas": "the word namaḥ, homage to, an upapada: it takes the fourth case (Pāṇini 2.3.16; en.wiktionary)"
  notes: "A kāraka is a role a noun plays in the action of a verb, and Pāṇini 1.4.23 opens the section that names them with the one word कारके (kārake). The six are the doer, the object, the tool, the recipient, the source and the place. Each role is named by one sūtra of the first chapter, and one sūtra of the second chapter gives the case. Kartṛ, 1.4.54: स्वतन्त्रः कर्ता (svatantraḥ kartā). Karman, 1.4.49: कर्तुर् ईप्सिततमम् कर्म (kartur īpsitatamam karma); the page of the sūtras numbers it 1.4.49, and the Sanskrit Wikipedia page on the cases numbers the same words 1.4.29, so the number here is the first one. Karaṇa, 1.4.42: साधकतमम् करणम् (sādhakatamam karaṇam). Sampradāna, 1.4.32: कर्मणा यम् अभि-प्रैति स सम्प्रदानम् (karmaṇā yam abhi-praiti sa sampradānam). Apādāna, 1.4.24: ध्रुवम् अपाये अपादानम् (dhruvam apāye apādānam). Adhikaraṇa, 1.4.45: आधारः अधिकरणम् (ādhāraḥ adhikaraṇam). The page of the sūtras types most of them split into words, as here. The cases come from chapter 2.3, which begins अनभिहिते (anabhihite) (2.3.1): the cases 2 to 7 are for a meaning the verb has not already said. Second case, 2.3.2: कर्मणि द्वितीया (karmaṇi dvitīyā). Third, 2.3.18: कर्तृकरणयोः तृतीया (kartṛkaraṇayoḥ tṛtīyā), as the Sanskrit Wikipedia page types it (the sūtra page types it with a stray mark). Fourth, 2.3.13: चतुर्थी सम्प्रदाने (caturthī sampradāne). Fifth, 2.3.28: अपादाने पञ्चमी (apādāne pañcamī). Seventh, 2.3.36: सप्तम्यधिकरणे च (saptamyadhikaraṇe ca), as the Sanskrit Wikipedia page types it (the sūtra page types it differently). The sixth case is not for a kāraka: 2.3.50 gives it for the rest, षष्ठी शेषे (ṣaṣṭhī śeṣe). When the verb itself says the doer or the object, 3.4.69 (लः कर्मणि च भावे च अकर्मकेभ्यः (laḥ karmaṇi ca bhāve ca akarmakebhyaḥ)) lets its ending say the object or the doer, and the noun then stands in the plain first case, प्रातिपदिक अर्थलिङ्गपरिमाणवचनमात्रे प्रथमा (prātipadika arthaliṅgaparimāṇavacanamātre prathamā) (2.3.46). That is why one role, the doer, takes the first case in an active sentence and the third in a passive one, and the object takes the second case in an active sentence and the first in a passive one. Upapada words: some words ask for a case on the noun beside them whatever its role. सहयुक्ते अप्रधाने (sahayukte apradhāne) (2.3.19) gives the third case with सह (saha). 2.3.16 gives the fourth case with नमः (namaḥ) (it also lists svasti, svāhā, svadhā, alam and vaṣaṭ; the page types its last words wrongly, so its text is not quoted). 2.3.32 gives the third case with विना (vinā), and en.wiktionary also gives the second and the fifth. 2.3.29 gives the fifth case with a list of words that includes ऋते (ṛte), and en.wiktionary gives the second as well. Examples as the Sanskrit Wikipedia page on the cases writes them, word by word without sandhi (the junctions of the next lessons): पाचकः तण्डुलान् पचति (pācakaḥ taṇḍulān pacati) (the cook cooks the rice: the doer and the object); अध्यापकेन विद्यालयः गम्यते (adhyāpakena vidyālayaḥ gamyate) (the teacher goes to the school, said with a passive verb: the doer in the third case, the object in the first); रामः बाणेन रावणं हन्ति (rāmaḥ bāṇena rāvaṇaṃ hanti) (Rāma kills Rāvaṇa with an arrow: the tool); पिता पुत्राय फलं ददाति (pitā putrāya phalaṃ dadāti) (the father gives fruit to the son: the recipient); वृक्षात् पर्णं पतति (vṛkṣāt parṇaṃ patati) (a leaf falls from the tree: the source); तिलेषु तैलम् अस्ति (tileṣu tailam asti) (there is oil in sesame seeds: the place); राज्ञः पुरुषः (rājñaḥ puruṣaḥ) (the king's man: the relation). With an upapada: तेन सह (tena saha) (with him) and त्वया विना (tvayā vinā) (without you), both from en.wiktionary, and ॐ नमः शिवाय (oṃ namaḥ śivāya) (homage to Shiva), also en.wiktionary. In the course: Rāma is the card रामः (rāmaḥ); every other noun in the examples is taught by this lesson alone."
