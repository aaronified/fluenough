          "करोति": "to do (she does)"
  "sa-1041":
    native: "Son."
    notes:
      "n1": "Nominative of the stem sūnu, a u stem; putra is the more common word for son."
      "n2": "In these examples the words are written apart; in running text sandhi joins them where a word ends in ḥ, m, t or a vowel and the next begins with a vowel or a voiced sound."
      "n3": "Written apart: A final visarga after a vowel other than अ (a) or आ (ā) becomes र् (r) before a voiced consonant or a vowel (Whitney 174)."
    bases:
      "सूनुः": "son (stem sūnu)"
    examples:
      "सूनुर् जानाति":
        native: "The son knows."
        bases:
          "सूनुर्": "son (stem sūnu)"
          "जानाति": "to know (he knows)"
      "सूनुः करोति":
        native: "The son does it."
        bases:
          "सूनुः": "son (stem sūnu)"
          "करोति": "to do (he does)"
  "sa-1042":
    native: "Woman."
    notes:
