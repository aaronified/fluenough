          "करोति": "to do (she does)"
  "sa-1035":
    native: "Daughter."
    notes:
      "n1": "Nominative of the stem duhitṛ, a consonant stem; it is a second word for daughter, beside putrī."
    bases:
      "दुहिता": "daughter (stem duhitṛ)"
    examples:
      "दुहिता जानाति":
        native: "The daughter knows."
        bases:
          "दुहिता": "daughter (stem duhitṛ)"
          "जानाति": "to know (she knows)"
      "दुहिता करोति":
