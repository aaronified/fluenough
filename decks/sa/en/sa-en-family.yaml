          "करोति": "to do (she does)"
  "sa-1036":
    native: "Husband; lord."
    notes:
      "n1": "Nominative of the stem pati, with the visarga of the nominative singular; it also means lord or master."
      "n2": "In these examples the words are written apart; in running text sandhi joins them where a word ends in ḥ, m, t or a vowel and the next begins with a vowel or a voiced sound."
      "n3": "Written apart: A final visarga after a vowel other than अ (a) or आ (ā) becomes र् (r) before a voiced consonant or a vowel (Whitney 174)."
    bases:
      "पतिः": "husband, lord (stem pati)"
    examples:
      "पतिर् जानाति":
        native: "The husband knows."
        bases:
          "पतिर्": "husband"
          "जानाति": "to know (he knows)"
      "पतिः करोति":
        native: "The husband does it."
        bases:
          "करोति": "to do (he does)"
  "sa-1037":
    native: "Wife."
    notes:
      "n1": "A feminine stem in ī: the wife, the feminine of the word for husband."
    examples:
      "पत्नी जानाति":
        native: "The wife knows."
        bases:
          "जानाति": "to know (she knows)"
      "पत्नी करोति":
