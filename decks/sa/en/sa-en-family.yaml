id: "sa-en-family"
kind: "layer"
core: "sa-family"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Family"
description: "Family words of Classical Sanskrit: mother, father, brother, sister, son, daughter, husband, wife, friend and relatives, with the stems the other cases use."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sa-1030":
    native: "Mother."
    notes:
      "n1": "Nominative of the stem mātṛ, a consonant stem; the other cases use the stem mātṛ."
    bases:
      "माता": "mother (stem mātṛ)"
    examples:
      "माता करोति":
        native: "The mother does it."
        bases:
          "करोति": "to do (she does)"
      "माता जानाति":
        native: "The mother knows."
        bases:
          "जानाति": "to know (she knows)"
  "sa-1031":
    native: "Father."
    notes:
      "n1": "Nominative of the stem pitṛ, a consonant stem; the other cases use the stem pitṛ."
    bases:
      "पिता": "father (stem pitṛ)"
    examples:
      "पिता जानाति":
        native: "The father knows."
        bases:
          "पिता": "father (stem pitṛ)"
          "जानाति": "to know (he knows)"
      "पिता करोति":
        native: "The father does it."
        bases:
          "पिता": "father (stem pitṛ)"
          "करोति": "to do (he does)"
  "sa-1032":
