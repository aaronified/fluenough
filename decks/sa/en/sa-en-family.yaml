  "sa-1034":
    native: "Daughter."
    notes:
      "n1": "The feminine of putra, son, so it means daughter."
    examples:
      "पुत्री जानाति":
        native: "The daughter knows."
        bases:
          "जानाति": "to know (she knows)"
      "पुत्री करोति":
        native: "The daughter does it."
