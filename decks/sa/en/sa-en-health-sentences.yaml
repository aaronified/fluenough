cards:
  "sa-3910":
    native: "A healthy boy always exercises."
    bases: { "स्वस्थो": "healthy", "बालको": "boy", "नित्यं": "always", "व्यायामं": "exercise", "करोति": "to do (does)" }
    confusables: { "w1": { why: "Sick, not healthy: रुग्णः (rugṇaḥ) means sick." }, "w2": { why: "Labour, not exercise: श्रमः (śramaḥ) means labour." }, "w3": { why: "To play, not to do: क्रीड् (krīḍ) means to play." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. स्वस्थः (svasthaḥ) is written स्वस्थो (svastho) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of बालको (bālako) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). बालकः (bālakaḥ) is written बालको (bālako), for the same reason, before नित्यं (nityaṃ). नित्यम् (nityam) is written नित्यं (nityaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of व्यायामं (vyāyāmaṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). व्यायामम् (vyāyāmam) is written व्यायामं (vyāyāmaṃ), for the same reason, before करोति (karoti).", "n2": "व्यायामम् (vyāyāmam) is the accusative case of व्यायामः (vyāyāmaḥ): the thing he does. करोति (karoti) is the present of कृ (kṛ): does, here exercises. स्वस्थः (svasthaḥ) agrees with बालकः (bālakaḥ)." }
  "sa-3911":
    native: "The physician examines the patient's wound."
    bases: { "चिकित्सको": "physician", "रुग्णस्य": "of the sick person", "व्रणं": "wound", "पश्यति": "to see (examines)" }
    confusables: { "w1": { why: "Teacher, not physician: अध्यापकः (adhyāpakaḥ) means teacher." }, "w2": { why: "Healthy, not sick: स्वस्थः (svasthaḥ) means healthy." }, "w3": { why: "To look at, not to see: ईक्ष् (īkṣ) means to look at." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. चिकित्सकः (cikitsakaḥ) is written चिकित्सको (cikitsako) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of रुग्णस्य (rugṇasya) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). व्रणम् (vraṇam) is written व्रणं (vraṇaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पश्यति (paśyati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "रुग्णस्य (rugṇasya) is the genitive case of रुग्णः (rugṇaḥ): of the sick person. व्रणम् (vraṇam) is the accusative case of व्रणः (vraṇaḥ): what is looked at. पश्यति (paśyati) is the present of पश् (paś), which means sees, here examines." }
  "sa-3912":
    native: "In a fever there is burning heat in the body."
    bases: { "ज्वरे": "in a fever", "शरीरे": "in the body", "दाहो": "burning heat", "भवति": "to be (there is)" }
    confusables: { "w1": { why: "Sharp, not burning heat: शूलम् (śūlam) means sharp." }, "w2": { why: "Swelling of the body from an injury or illness, not fever: शोथः (śothaḥ) means swelling of the body from an injury or illness." }, "w3": { why: "Stomach, not body: जठरम् (jaṭharam) means stomach." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. दाहः (dāhaḥ) is written दाहो (dāho) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of भवति (bhavati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "ज्वरे (jvare) and शरीरे (śarīre) are the locative case: in a fever, in the body. दाहः (dāhaḥ) is the thing that is there." }
  "sa-3913":
    native: "The boy cries in the house from hunger."
    bases: { "क्षुधया": "from hunger", "बालको": "boy", "गृहे": "in the house", "रोदिति": "to cry (cries)" }
    confusables: { "w1": { why: "Thirst, not hunger: तृष्णा (tṛṣṇā) means thirst." }, "w2": { why: "To laugh, not to cry: हस् (has) means to laugh." }, "w3": { why: "Door, not house: द्वारम् (dvāram) means door." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. बालकः (bālakaḥ) is written बालको (bālako) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of गृहे (gṛhe) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "क्षुधया (kṣudhayā) is the instrumental case of क्षुधा (kṣudhā): it says the cause, from hunger. रोदिति (roditi) is the present of रुद् (rud), a verb of the second class: cries." }
  "sa-3914":
    native: "From thirst the traveller drinks water."
    bases: { "तृष्णया": "from thirst", "पथिको": "traveller", "जलं": "water", "पिबति": "to drink (drinks)" }
    confusables: { "w1": { why: "Hunger, not thirst: क्षुधा (kṣudhā) means hunger." }, "w2": { why: "To eat, not to drink: खाद् (khād) means to eat." }, "w3": { why: "Milk, not water: क्षीरम् (kṣīram) means milk." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पथिकः (pathikaḥ) is written पथिको (pathiko) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of जलं (jalaṃ) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). जलम् (jalam) is written जलं (jalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पिबति (pibati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "तृष्णया (tṛṣṇayā) is the instrumental case of तृष्णा (tṛṣṇā): from thirst. जलम् (jalam) is the accusative case: what is drunk." }
  "sa-3915":
    native: "Sleep protects the health of the body."
    bases: { "शरीरस्य": "of the body", "स्वास्थ्यं": "health", "रक्षति": "to protect (protects)" }
    confusables: { "w1": { why: "Drowsiness or lassitude, not sleep: तन्द्रा (tandrā) means drowsiness or lassitude." }, "w2": { why: "Illness, not health: अस्वास्थ्यम् (asvāsthyam) means illness." }, "w3": { why: "To conquer, not to protect: जि (ji) means to conquer." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. स्वास्थ्यम् (svāsthyam) is written स्वास्थ्यं (svāsthyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of रक्षति (rakṣati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "शरीरस्य (śarīrasya) is the genitive case of शरीरम् (śarīram): of the body. स्वास्थ्यम् (svāsthyam) is the accusative case: what sleep protects." }
  "sa-3916":
    native: "The body becomes healthy with an oil massage."
    bases: { "अभ्यङ्गेन": "with an oil massage", "स्वस्थं": "healthy", "भवति": "to become (becomes)" }
    confusables: { "w1": { why: "Ointment or unguent applied to the body, not oil massage: लेपः (lepaḥ) means ointment or unguent applied to the body." }, "w2": { why: "Physical exercise and bodily training, not oil massage: व्यायामः (vyāyāmaḥ) means physical exercise and bodily training." }, "w3": { why: "Sick, not healthy: रुग्णः (rugṇaḥ) means sick." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. स्वस्थम् (svastham) is written स्वस्थं (svasthaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of भवति (bhavati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "अभ्यङ्गेन (abhyaṅgena) is the instrumental case of अभ्यङ्गः (abhyaṅgaḥ): by an oil massage. स्वस्थम् (svastham) is the neuter form of स्वस्थः (svasthaḥ), to agree with शरीरम् (śarīram)." }
  "sa-3917":
    native: "Ayurveda is knowledge of life."
    bases: { "आयुर्वेदो": "Ayurveda", "जीवनस्य": "of life", "ज्ञानं": "knowledge", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Medical treatment, not Ayurveda: चिकित्सा (cikitsā) means medical treatment." }, "w2": { why: "Example, not knowledge: उदाहरणम् (udāharaṇam) means example." }, "w3": { why: "Vital breath, not life: प्राणः (prāṇaḥ) means vital breath." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. आयुर्वेदः (āyurvedaḥ) is written आयुर्वेदो (āyurvedo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of जीवनस्य (jīvanasya) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). ज्ञानम् (jñānam) is written ज्ञानं (jñānaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of भवति (bhavati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "जीवनस्य (jīvanasya) is the genitive case of जीवनम् (jīvanam): of life. ज्ञानम् (jñānam) says what Ayurveda is: knowledge." }
  "sa-3918":
    native: "Phlegm, bile and wind are in the body."
    bases: { "पित्तं": "bile", "वायुश्": "wind", "शरीरे": "in the body", "भवन्ति": "to be (are)" }
    confusables: { "w1": { why: "Sweat, not phlegm: स्वेदः (svedaḥ) means sweat." }, "w2": { why: "Urine, not bile: मूत्रम् (mūtram) means urine." }, "w3": { why: "Breath, not wind: श्वासः (śvāsaḥ) means breath." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पित्तम् (pittam) is written पित्तं (pittaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of वायुश् (vāyuś) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). वायुः (vāyuḥ) is written वायुश् (vāyuś) because a final ः (ḥ) before च (ca) becomes श् (ś), here the start of च (ca) (Aṣṭādhyāyī 8.3.34 and 8.4.40; Whitney 170 c).", "n2": "शरीरे (śarīre) is the locative case of शरीरम् (śarīram): in the body. भवन्ति (bhavanti) is the third person plural, to agree with the three subjects." }
  "sa-3919":
    native: "By the physician's treatment the disease is destroyed."
    bases: { "वैद्यस्य": "of the physician", "चिकित्सया": "by treatment", "रोगो": "disease", "नश्यति": "to perish (is destroyed)" }
    confusables: { "w1": { why: "Medicine or remedy for illness, not treatment: भेषजम् (bheṣajam) means medicine or remedy for illness." }, "w2": { why: "Sickness or disease of the body, not disease: आमयः (āmayaḥ) means sickness or disease of the body." }, "w3": { why: "To fall, not to perish: पत् (pat) means to fall." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. रोगः (rogaḥ) is written रोगो (rogo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of नश्यति (naśyati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "चिकित्सया (cikitsayā) is the instrumental case of चिकित्सा (cikitsā): by treatment. नश्यति (naśyati) is the present of नश् (naś): perishes, is lost." }
