cards:
  "sa-3250":
    native: "The friend reads a book and writes with a pen."
    bases: { "ग्रन्थं": "book", "पठति": "to read (reads)", "कलमेन": "with a pen", "लिखति": "to write (writes)" }
    confusables: { "w1": { why: "Stick, not pen: दण्डः (daṇḍaḥ) means stick." }, "w2": { why: "To tell, not to write: कथ् (kath) means to tell." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. ग्रन्थम् (grantham) is written ग्रन्थं (granthaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पठति (paṭhati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "कलमेन (kalamena) is the instrumental case: it says with what the action is done." }
  "sa-3251":
    native: "The pot is full of water and the vessel is empty."
    bases: { "घटो": "pot", "जलेन": "with water", "पूर्णो": "full", "भवति": "to be (is)", "पात्रं": "vessel", "रिक्तं": "empty" }
    confusables: { "w1": { why: "Empty, not empty: शून्यः (śūnyaḥ) means empty." }, "w2": { why: "Stick, not pot: दण्डः (daṇḍaḥ) means stick." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. घटः (ghaṭaḥ) is written घटो (ghaṭo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of जलेन (jalena) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). पूर्णः (pūrṇaḥ) is written पूर्णो (pūrṇo), for the same reason, before भवति (bhavati). पात्रम् (pātram) is written पात्रं (pātraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of च (ca) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). रिक्तम् (riktam) is written रिक्तं (riktaṃ), for the same reason, before भवति (bhavati). The labial keeps म् (m) in Whitney 213 a, but the anusvāra sign is the usual writing (Whitney 213 i).", "n2": "जलेन (jalena) is the instrumental case: here it says what the pot is full with.", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3252":
    native: "That woman sees a face in the mirror."
    bases: { "दर्पणे": "in the mirror", "मुखं": "face", "पश्यति": "to see (sees)" }
    confusables: { "w1": { why: "Eye, not face: नेत्रम् (netram) means eye." }, "w2": { why: "He, not she: सः (saḥ) means he." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. मुखम् (mukham) is written मुखं (mukhaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पश्यति (paśyati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "दर्पणे (darpaṇe) is the locative case: it says where she sees the face." }
  "sa-3253":
    native: "In the rain father carries an umbrella."
    bases: { "वर्षायां": "in the rain", "छत्त्रं": "umbrella", "वहति": "to carry (carries)" }
    confusables: { "w1": { why: "Stick, not umbrella: दण्डः (daṇḍaḥ) means stick." }, "w2": { why: "To take, not to carry: हृ (hṛ) means to take." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वर्षायाम् (varṣāyām) is written वर्षायां (varṣāyāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पिता (pitā) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). छत्त्रम् (chattram) is written छत्त्रं (chattraṃ), for the same reason, before वहति (vahati).", "n2": "वर्षायाम् (varṣāyām) is the locative of वर्षा (varṣā): here it says when, in the rains." }
  "sa-3254":
    native: "In front there is a flag and behind there are flowers."
    bases: { "ध्वजो": "flag", "भवति": "to be (is)", "पुष्पाणि": "flowers", "भवन्ति": "to be (they are)" }
    confusables: { "w1": { why: "Umbrella, not flag: छत्त्रम् (chattram) means umbrella." }, "w2": { why: "Jewel, not flower: रत्नम् (ratnam) means jewel." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. ध्वजः (dhvajaḥ) is written ध्वजो (dhvajo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of भवति (bhavati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "पुष्पाणि (puṣpāṇi) is the plural of पुष्पम् (puṣpam), so the verb भवन्ति (bhavanti) is plural too." }
  "sa-3255":
    native: "Iron is hard and gold is beautiful."
    bases: { "लोहं": "iron", "कठिनं": "hard", "भवति": "to be (is)", "सुवर्णं": "gold", "सुन्दरं": "beautiful" }
    confusables: { "w1": { why: "Jewel, not gold: रत्नम् (ratnam) means jewel." }, "w2": { why: "Easy, not hard: सरलः (saralaḥ) means easy." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. लोहम् (loham) is written लोहं (lohaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of कठिनम् (kaṭhinam) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). कठिनम् (kaṭhinam) is written कठिनं (kaṭhinaṃ), for the same reason, before भवति (bhavati). The labial keeps म् (m) in Whitney 213 a, but the anusvāra sign is the usual writing (Whitney 213 i). सुवर्णम् (suvarṇam) is written सुवर्णं (suvarṇaṃ), for the same reason, before च (ca). सुन्दरम् (sundaram) is written सुन्दरं (sundaraṃ), for the same reason, before भवति (bhavati).", "n2": "कठिनम् (kaṭhinam) and सुन्दरम् (sundaram) are neuter forms, to agree with the neuter words लोहम् (loham) and सुवर्णम् (suvarṇam).", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3256":
    native: "The weapon falls and the wheel does not move."
    bases: { "शस्त्रं": "weapon", "पतति": "to fall (falls)", "चक्रं": "wheel", "चलति": "to move (moves)" }
    confusables: { "w1": { why: "Stick, not weapon: दण्डः (daṇḍaḥ) means stick." }, "w2": { why: "To run, not to walk: धाव् (dhāv) means to run." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. शस्त्रम् (śastram) is written शस्त्रं (śastraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पतति (patati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). चक्रम् (cakram) is written चक्रं (cakraṃ), for the same reason, before च (ca).", "n2": "पतति (patati) means both to fall and to fly; here it is to fall.", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3257":
    native: "Mother carries a lute and father carries a drum."
    bases: { "वीणां": "lute", "वहति": "to carry (carries)", "मृदङ्गं": "drum" }
    confusables: { "w1": { why: "Scales, not lute: तुला (tulā) means scales." }, "w2": { why: "Stick, not drum: दण्डः (daṇḍaḥ) means stick." }, "w3": { why: "To take, not to carry: हृ (hṛ) means to take." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वीणाम् (vīṇām) is written वीणां (vīṇāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of वहति (vahati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). मृदङ्गम् (mṛdaṅgam) is written मृदङ्गं (mṛdaṅgaṃ), for the same reason, before वहति (vahati).", "n2": "वीणाम् (vīṇām) is the accusative of वीणा (vīṇā): a word in आ (ā) takes आम् (ām); मृदङ्गम् (mṛdaṅgam) takes म् (m)." }
  "sa-3258":
    native: "On the scale there is gold and on the stone there is a jewel."
    bases: { "तुलायां": "on the scale", "सुवर्णं": "gold", "भवति": "to be (is)", "शिलायां": "on the stone", "रत्नं": "jewel" }
    confusables: { "w1": { why: "Seal, not scales: मुद्रा (mudrā) means seal." }, "w2": { why: "Wood, not stone: काष्ठम् (kāṣṭham) means wood." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. तुलायाम् (tulāyām) is written तुलायां (tulāyāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of सुवर्णम् (suvarṇam) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). सुवर्णम् (suvarṇam) is written सुवर्णं (suvarṇaṃ), for the same reason, before भवति (bhavati). The labial keeps म् (m) in Whitney 213 a, but the anusvāra sign is the usual writing (Whitney 213 i). शिलायाम् (śilāyām) is written शिलायां (śilāyāṃ), for the same reason, before च (ca). रत्नम् (ratnam) is written रत्नं (ratnaṃ), for the same reason, before भवति (bhavati).", "n2": "तुलायाम् (tulāyām) and शिलायाम् (śilāyām) are the locative case: it says where; भवति (bhavati) then says there is.", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3259":
    native: "Father makes a house of wood."
    bases: { "काष्ठेन": "with wood", "गृहं": "house", "करोति": "to do (does)" }
    confusables: { "w1": { why: "Iron, not wood: लोहम् (loham) means iron." }, "w2": { why: "To give, not to do: दा (dā) means to give." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. गृहम् (gṛham) is written गृहं (gṛhaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of करोति (karoti) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "काष्ठेन (kāṣṭhena) is the instrumental case: here it says what the house is made of." }
