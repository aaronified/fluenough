cards:
  "sa-5800":
    native: "Non-violence, not harming any living being."
    notes:
      "n1": "The first of the restraints, yama, in Patañjali’s Yoga Sūtra (2.30)."
      "n2": "Feminine ā-stem noun: its full set of case forms is in the other-stems table of the grammar rules."
      "n3": "The final ः (ḥ) of परमः (paramaḥ) becomes ो (o) before a voiced sound, as in अहिंसा (ahiṃsā) परमो (paramo) धर्मो (dharmo) भवति (bhavati)."
      "n4": "The final ः (ḥ) of धर्मः (dharmaḥ) becomes ो (o) before a voiced sound, as in अहिंसा (ahiṃsā) परमो (paramo) धर्मो (dharmo) भवति (bhavati)."
      "n5": "The final म् (m) of अहिंसाम् (ahiṃsām) is written ं (ṃ) before a consonant, as in अहिंसां (ahiṃsāṃ) जनः (janaḥ) करोति (karoti)."
    examples:
      "अहिंसा परमो धर्मो भवति":
        native: "Non-violence becomes the highest dharma."
        bases:
          "अहिंसा": "non-violence"
          "परमो": "highest"
          "धर्मो": "dharma, duty"
          "भवति": "is, becomes"
      "अहिंसां जनः करोति":
        native: "A person practises non-violence."
        bases:
          "अहिंसां": "non-violence"
          "जनः": "person"
          "करोति": "does, makes"
  "sa-5801":
    native: "Compassion, sympathy for one who suffers."
    notes:
      "n1": "Often listed together with forgiveness and truthfulness as a basic virtue."
      "n2": "Feminine ā-stem noun: its full set of case forms is in the other-stems table of the grammar rules."
      "n3": "The genitive जनस्य (janasya) with a form of भू (bhū), to be, says that the person has the thing: जनस्य (janasya) दया (dayā) भवति (bhavati), literally \"of the person there is\"."
      "n4": "The final ः (ḥ) of जनः (janaḥ) becomes ो (o) before a voiced sound, as in दयया (dayayā) सुखी (sukhī) जनो (jano) भवति (bhavati)."
    examples:
      "जनस्य दया भवति":
        native: "A person has compassion."
        bases:
          "जनस्य": "of the person"
          "दया": "compassion"
          "भवति": "is, there is"
      "दयया सुखी जनो भवति":
        native: "Through compassion a person becomes happy."
        bases:
          "दयया": "compassion"
          "सुखी": "happy"
          "जनो": "person"
          "भवति": "is, becomes"
  "sa-5802":
    native: "Forbearance, patience with one who has wronged us."
    notes:
      "n1": "Also means patience under hardship; the same word covers both senses."
      "n2": "Feminine ā-stem noun: its full set of case forms is in the other-stems table of the grammar rules."
      "n3": "The final म् (m) of जनम् (janam) is written ं (ṃ) before a consonant, as in क्षमा (kṣamā) सदा (sadā) जनं (janaṃ) रक्षति (rakṣati)."
      "n4": "The final म् (m) of क्षमाम् (kṣamām) is written ं (ṃ) before a consonant, as in क्षमां (kṣamāṃ) जनः (janaḥ) करोति (karoti)."
    examples:
      "क्षमा सदा जनं रक्षति":
        native: "Forgiveness always protects a person."
        bases:
          "क्षमा": "forbearance"
          "सदा": "always"
          "जनं": "person"
          "रक्षति": "protects"
      "क्षमां जनः करोति":
        native: "A person practises forbearance."
        bases:
          "क्षमां": "forbearance"
          "जनः": "person"
          "करोति": "does, makes"
  "sa-5803":
    native: "Austerity, disciplined effort of body and mind."
    notes:
      "n1": "The stem is तपस् (tapas); the nominative is तपः (tapaḥ), and its first sense is warmth or heat."
      "n2": "Neuter as-stem noun: its full set of case forms is in the other-stems table of the grammar rules."
      "n3": "The final ः (ḥ) of तपः (tapaḥ) becomes ो (o) before a voiced sound, as in जनस्य (janasya) तपो (tapo) भवति (bhavati)."
      "n4": "The genitive जनस्य (janasya) with a form of भू (bhū), to be, says that the person has the thing: जनस्य (janasya) तपो (tapo) भवति (bhavati), literally \"of the person there is\"."
      "n5": "The final ः (ḥ) of सः (saḥ) is dropped before a consonant (Aṣṭādhyāyī 6.1.132), as in स (sa) तपः (tapaḥ) करोति (karoti)."
    bases:
      "तपः": "austerity"
    examples:
      "जनस्य तपो भवति":
        native: "A person has austerity."
        bases:
          "जनस्य": "of the person"
          "तपो": "austerity"
          "भवति": "is, there is"
      "स तपः करोति":
        native: "He practises austerity."
        bases:
          "स": "he, that"
          "तपः": "austerity"
          "करोति": "does, makes"
