      "n3": "The final ः (ḥ) of तपः (tapaḥ) becomes ो (o) before a voiced sound, as in तपो (tapo) भवति (bhavati)."
      "n4": "The final म् (m) of जनम् (janam) is written ं (ṃ) before a consonant, as in तपो (tapo) जनं (janaṃ) रक्षति (rakṣati)."
