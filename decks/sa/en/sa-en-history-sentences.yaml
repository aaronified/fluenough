cards:
  "sa-3950":
    native: "The soldier kills the enemy with an arrow."
    bases: { "बाणेन": "with an arrow", "शत्रुं": "enemy", "सैनिको": "soldier", "हन्ति": "to strike (kills)" }
    confusables: { "w1": { why: "Weapon of war or hunting, not arrow: आयुधम् (āyudham) means weapon of war or hunting." }, "w2": { why: "Hired soldier or warrior, not soldier: भटः (bhaṭaḥ) means hired soldier or warrior." }, "w3": { why: "To throw, not to kill: क्षिप् (kṣip) means to throw." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. शत्रुम् (śatrum) is written शत्रुं (śatruṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of सैनिको (sainiko) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). सैनिकः (sainikaḥ) is written सैनिको (sainiko) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of हन्ति (hanti) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "बाणेन (bāṇena) is the instrumental case of बाणः (bāṇaḥ): with an arrow. शत्रुम् (śatrum) is the accusative case of शत्रुः (śatruḥ): whom he kills. The object comes first; the order of the words is free." }
  "sa-3951":
    native: "A warrior gains victory in battle through bravery."
    bases: { "संग्रामे": "in battle", "शौर्येण": "through bravery", "विजयं": "victory", "लभते": "to get (gains)" }
    confusables: { "w1": { why: "Fall from power or prosperity, not victory: पतनम् (patanam) means fall from power or prosperity." }, "w2": { why: "Courage, not bravery: साहसम् (sāhasam) means courage." }, "w3": { why: "Array of troops arranged for battle, not battle: व्यूहः (vyūhaḥ) means array of troops arranged for battle." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. विजयम् (vijayam) is written विजयं (vijayaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of लभते (labhate) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "संग्रामे (saṃgrāme) is the locative case of संग्रामः (saṃgrāmaḥ): in battle. शौर्येण (śauryeṇa) is the instrumental case of शौर्यम् (śauryam): through bravery. विजयम् (vijayam) is the accusative case: what he gains." }
  "sa-3952":
    native: "They write the king's glory on an inscription."
    bases: { "शिलालेखे": "on an inscription", "नृपस्य": "of the king", "प्रतापं": "glory", "लिखन्ति": "to write (they write)" }
    confusables: { "w1": { why: "Stone or a block of rock, not inscription: प्रस्तरः (prastaraḥ) means stone or a block of rock." }, "w2": { why: "Valour and skill in action, not glory: विक्रमः (vikramaḥ) means valour and skill in action." }, "w3": { why: "To hear, not to write: श्रु (śru) means to hear." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. प्रतापम् (pratāpam) is written प्रतापं (pratāpaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of लिखन्ति (likhanti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "शिलालेखे (śilālekhe) is the locative case of शिलालेखः (śilālekhaḥ): on an inscription. लिखन्ति (likhanti) is the third person plural of लिख् (likh): they write, that is, people write." }
  "sa-3953":
    native: "History tells the story of the past."
    bases: { "अतीतस्य": "of the past", "कथाम्": "story", "कथयति": "to tell (tells)" }
    confusables: { "w1": { why: "Period or occasion of time, not past: समयः (samayaḥ) means period or occasion of time." }, "w2": { why: "Episode, not story: उपाख्यानम् (upākhyānam) means episode." }, "w3": { why: "Conduct, not history: चरितम् (caritam) means conduct." } }
    notes: { "n1": "अतीतस्य (atītasya) is the genitive case of अतीतः (atītaḥ): of the past. कथाम् (kathām) is the accusative case of कथा (kathā): what history tells. The object comes first; the order of the words is free." }
  "sa-3954":
    native: "The fall of a kingdom comes from an enemy's attack."
    bases: { "राज्यस्य": "of a kingdom", "पतनं": "fall", "शत्रोर्": "of an enemy", "आक्रमणाद्": "from an attack", "भवति": "to be (comes)" }
    confusables: { "w1": { why: "Rise to power or prosperity, not fall: उत्थानम् (utthānam) means rise to power or prosperity." }, "w2": { why: "Decay, not attack: क्षयः (kṣayaḥ) means decay." }, "w3": { why: "Ruin, not fall: विनाशः (vināśaḥ) means ruin." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पतनम् (patanam) is written पतनं (patanaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of शत्रोर् (śatror) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). शत्रोः (śatroḥ) is written शत्रोर् (śatror) because a final ः (ḥ) after ओ (o) becomes र् (r) before a voiced sound, here the start of आक्रमणाद् (ākramaṇād) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174). आक्रमणात् (ākramaṇāt) is written आक्रमणाद् (ākramaṇād) because a final त् (t) becomes द् (d) before a voiced sound, here the start of भवति (bhavati) (Aṣṭādhyāyī 8.2.39, झलां जशोऽन्ते (jhalāṃ jaśo 'nte), in separate words झलां जशः अन्ते (jhalāṃ jaśaḥ ante); Whitney 159).", "n2": "शत्रोः (śatroḥ) is the genitive case of शत्रुः (śatruḥ): of an enemy. आक्रमणात् (ākramaṇāt) is the ablative case of आक्रमणम् (ākramaṇam); the ablative says the source: from the attack." }
  "sa-3955":
    native: "Calm monks live in the monastery."
    bases: { "विहारे": "in the monastery", "शान्ता": "calm", "भिक्षवो": "monks", "वसन्ति": "to dwell (live)" }
    confusables: { "w1": { why: "Mound-shaped monument holding relics, not monastery: स्तूपः (stūpaḥ) means mound-shaped monument holding relics." }, "w2": { why: "Shrine or sacred place of worship, not monastery: चैत्यः (caityaḥ) means shrine or sacred place of worship." }, "w3": { why: "Sage, not monk: मुनिः (muniḥ) means sage." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. शान्ताः (śāntāḥ) is written शान्ता (śāntā) because a final आः (āḥ) loses its visarga before a voiced consonant, here the start of भिक्षवो (bhikṣavo) (Whitney 177; Aṣṭādhyāyī 8.3.17, भोभगोअघोअपूर्वस्य योऽशि (bhobhago 'ghoapūrvasya yo 'śi), in separate words भो भगो अघो अपूर्वस्य यः अशि (bho bhago agho apūrvasya yaḥ aśi), with 8.3.19, लोपः शाकल्यस्य (lopaḥ śākalyasya)). भिक्षवः (bhikṣavaḥ) is written भिक्षवो (bhikṣavo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of वसन्ति (vasanti) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "विहारे (vihāre) is the locative case of विहारः (vihāraḥ): in the monastery. भिक्षवः (bhikṣavaḥ) is the nominative plural of भिक्षुः (bhikṣuḥ); शान्ताः (śāntāḥ) agrees with it." }
  "sa-3956":
    native: "Soldiers always guard the fort."
    bases: { "कोटं": "fort", "सैनिका": "soldiers", "रक्षन्ति": "to protect (guard)" }
    confusables: { "w1": { why: "Rampart, not fort: प्राकारः (prākāraḥ) means rampart." }, "w2": { why: "Prison, not fort: कारागारम् (kārāgāram) means prison." }, "w3": { why: "To conquer, not to protect: जि (ji) means to conquer." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. कोटम् (koṭam) is written कोटं (koṭaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of सदा (sadā) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). सैनिकाः (sainikāḥ) is written सैनिका (sainikā) because a final आः (āḥ) loses its visarga before a voiced consonant, here the start of रक्षन्ति (rakṣanti) (Whitney 177; Aṣṭādhyāyī 8.3.17, भोभगोअघोअपूर्वस्य योऽशि (bhobhago 'ghoapūrvasya yo 'śi), in separate words भो भगो अघो अपूर्वस्य यः अशि (bho bhago agho apūrvasya yaḥ aśi), with 8.3.19, लोपः शाकल्यस्य (lopaḥ śākalyasya)).", "n2": "कोटम् (koṭam) is the accusative case of कोटः (koṭaḥ): what is guarded. सैनिकाः (sainikāḥ) is the nominative plural: soldiers. The object comes first; the order of the words is free." }
  "sa-3957":
    native: "In the market the merchant buys silver."
    bases: { "हट्टे": "in the market", "वणिग्": "merchant", "रजतं": "silver", "क्रीणाति": "to buy (buys)" }
    confusables: { "w1": { why: "Goods offered for sale, not market: पण्यम् (paṇyam) means goods offered for sale." }, "w2": { why: "Copper, not silver: ताम्रम् (tāmram) means copper." }, "w3": { why: "To give, not to buy: दा (dā) means to give." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वणिक् (vaṇik) is written वणिग् (vaṇig) because a final क् (k) becomes ग् (g) before a voiced sound, here the start of रजतं (rajataṃ) (Aṣṭādhyāyī 8.2.39, झलां जशोऽन्ते (jhalāṃ jaśo 'nte), in separate words झलां जशः अन्ते (jhalāṃ jaśaḥ ante); Whitney 159). रजतम् (rajatam) is written रजतं (rajataṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of क्रीणाति (krīṇāti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "हट्टे (haṭṭe) is the locative case of हट्टः (haṭṭaḥ): in the market. रजतम् (rajatam) is the accusative case: what he buys." }
  "sa-3958":
    native: "An elephant is a help to the soldier in war."
    bases: { "गजो": "elephant", "युद्धे": "in war", "सैनिकस्य": "to the soldier", "सहायो": "help", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Camel, not elephant: उष्ट्रः (uṣṭraḥ) means camel." }, "w2": { why: "Charioteer, not helper: सारथिः (sārathiḥ) means charioteer." }, "w3": { why: "Defeat, not war: पराजयः (parājayaḥ) means defeat." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. गजः (gajaḥ) is written गजो (gajo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of युद्धे (yuddhe) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). सहायः (sahāyaḥ) is written सहायो (sahāyo), for the same reason, before भवति (bhavati).", "n2": "युद्धे (yuddhe) is the locative case of युद्धम् (yuddham): in war. सैनिकस्य (sainikasya) is the genitive case of सैनिकः (sainikaḥ): of the soldier, that is, to him. सहायः (sahāyaḥ) says what the elephant is." }
  "sa-3959":
    native: "The king provides protection for the empire."
    bases: { "साम्राज्यस्य": "of the empire", "रक्षां": "protection", "करोति": "to do (provides)" }
    confusables: { "w1": { why: "Earth, not empire: वसुधा (vasudhā) means earth." }, "w2": { why: "Power, not protection: बलम् (balam) means power." }, "w3": { why: "Prince, not king: राजकुमारः (rājakumāraḥ) means prince." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. रक्षाम् (rakṣām) is written रक्षां (rakṣāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of भूपः (bhūpaḥ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "साम्राज्यस्य (sāmrājyasya) is the genitive case of साम्राज्यम् (sāmrājyam): of the empire. रक्षाम् करोति (rakṣām karoti) means does protection, that is, protects. The object comes first; the order of the words is free." }
