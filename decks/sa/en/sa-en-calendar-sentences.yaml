cards:
  "sa-3620":
    native: "There are twelve months in a year."
    bases: { "संवत्सरे": "in a year", "मासा": "months", "भवन्ति": "to be (they are)" }
    confusables: { "w1": { why: "Week, not month: सप्ताहः (saptāhaḥ) means week." }, "w2": { why: "Ten, not twelve: दश (daśa) means ten." }, "w3": { why: "Thirteen, not twelve: त्रयोदश (trayodaśa) means thirteen." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. मासाः (māsāḥ) is written मासा (māsā) because a final आः (āḥ) loses its visarga before a voiced consonant, here the start of भवन्ति (bhavanti) (Whitney 177; Aṣṭādhyāyī 8.3.17, भो भगो अघो अपूर्वस्य यः अशि (bho bhago agho apūrvasya yaḥ aśi), with 8.3.19, लोपः शाकल्यस्य (lopaḥ śākalyasya)).", "n2": "मासाः (māsāḥ) is the nominative plural of मासः (māsaḥ); the verb भवन्ति (bhavanti) is plural to agree. संवत्सरे (saṃvatsare) is the locative case of संवत्सरः (saṃvatsaraḥ): in a year." }
  "sa-3621":
    native: "There are seven days in a week."
    bases: { "सप्ताहे": "in a week", "दिनानि": "days", "भवन्ति": "to be (they are)" }
    confusables: { "w1": { why: "Month, not week: मासः (māsaḥ) means month." }, "w2": { why: "Eight, not seven: अष्ट (aṣṭa) means eight." }, "w3": { why: "Six, not seven: षट् (ṣaṭ) means six." } }
    notes: { "n1": "सप्ताहे (saptāhe) is the locative case of सप्ताहः (saptāhaḥ): in a week. दिनानि (dināni) is the nominative plural of दिनम् (dinam), a neuter word." }
  "sa-3622":
    native: "When the moon is full it is the full moon day."
    bases: { "पूर्णो": "full", "भवति": "to be (is)" }
    confusables: { "w1": { why: "New moon day, not full moon day: अमावास्या (amāvāsyā) means new moon day." }, "w2": { why: "Empty, not full: रिक्तः (riktaḥ) means empty." }, "w3": { why: "Eleventh day of the fortnight, not full moon day: एकादशी (ekādaśī) means eleventh day of the fortnight." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पूर्णः (pūrṇaḥ) is written पूर्णो (pūrṇo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of भवति (bhavati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "यदा (yadā) and तदा (tadā) go as a pair: when ... then .... पूर्णः (pūrṇaḥ) agrees with चन्द्रः (candraḥ), a masculine word." }
  "sa-3623":
    native: "After sunset it is night."
    bases: { "सूर्यास्तस्य": "of sunset", "पश्चाद्": "after", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Sunrise, not sunset: उदयः (udayaḥ) means sunrise." }, "w2": { why: "Midday, not sunset: मध्याह्नः (madhyāhnaḥ) means midday." }, "w3": { why: "Day, not night: दिवसः (divasaḥ) means day." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पश्चात् (paścāt) is written पश्चाद् (paścād) because a final त् (t) becomes द् (d) before a voiced consonant, here the start of रजनी (rajanī) (Aṣṭādhyāyī 8.2.39, झलां जशः अन्ते (jhalāṃ jaśaḥ ante); Whitney 159).", "n2": "पश्चात् (paścāt) means behind or after and takes the genitive case: सूर्यास्तस्य (sūryāstasya) is the genitive of सूर्यास्तः (sūryāstaḥ): after the sunset. रजनी (rajanī) means night." }
  "sa-3624":
    native: "At sunrise the sun is red."
    bases: { "उदये": "at sunrise", "सूर्यो": "sun", "रक्तो": "red", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Sunset, not sunrise: सूर्यास्तः (sūryāstaḥ) means sunset." }, "w2": { why: "Dark blue, not red: नीलः (nīlaḥ) means dark blue." }, "w3": { why: "Yellow, not red: पीतः (pītaḥ) means yellow." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सूर्यः (sūryaḥ) is written सूर्यो (sūryo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of रक्तो (rakto) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). रक्तः (raktaḥ) is written रक्तो (rakto), for the same reason, before भवति (bhavati).", "n2": "उदये (udaye) is the locative case of उदयः (udayaḥ): at the rising. रक्तः (raktaḥ) agrees with सूर्यः (sūryaḥ), a masculine word." }
  "sa-3625":
    native: "At midday the sun is very hot."
    bases: { "मध्याह्ने": "at midday", "सूर्यो": "sun", "तपति": "to be hot (shines)" }
    confusables: { "w1": { why: "Sunrise, not midday: उदयः (udayaḥ) means sunrise." }, "w2": { why: "Sunset, not midday: सूर्यास्तः (sūryāstaḥ) means sunset." }, "w3": { why: "Little, not much: अल्पः (alpaḥ) means little." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सूर्यः (sūryaḥ) is written सूर्यो (sūryo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of बहु (bahu) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "मध्याह्ने (madhyāhne) is the locative case of मध्याह्नः (madhyāhnaḥ): at midday. बहु (bahu) says how much." }
  "sa-3626":
    native: "In Pauṣa and Māgha it is cold."
    bases: { "पौषे": "in Pauṣa", "माघे": "in Māgha", "शीतं": "cold", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Phālguna, not Pauṣa: फाल्गुनः (phālgunaḥ) means Phālguna." }, "w2": { why: "Caitra, not Māgha: चैत्रः (caitraḥ) means Caitra." }, "w3": { why: "Hot, not cold: उष्णः (uṣṇaḥ) means hot." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. शीतम् (śītam) is written शीतं (śītaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of भवति (bhavati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "पौषे (pauṣe) and माघे (māghe) are the locative case of पौषः (pauṣaḥ) and माघः (māghaḥ): in those months. च (ca) follows the second month it joins. शीतम् (śītam) is also a neuter noun, cold or cold weather; with भवति (bhavati) it says there is cold." }
  "sa-3627":
    native: "Spring is in Caitra and Vaiśākha."
    bases: { "चैत्रे": "in Caitra", "वैशाखे": "in Vaiśākha", "वसन्तो": "spring", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Āśvina, not Caitra: आश्विनः (āśvinaḥ) means Āśvina." }, "w2": { why: "Summer, not spring: ग्रीष्मः (grīṣmaḥ) means summer." }, "w3": { why: "Winter, not spring: हेमन्तः (hemantaḥ) means winter." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वसन्तः (vasantaḥ) is written वसन्तो (vasanto) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of भवति (bhavati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "चैत्रे (caitre) and वैशाखे (vaiśākhe) are the locative case of चैत्रः (caitraḥ) and वैशाखः (vaiśākhaḥ): in those months. वसन्तः (vasantaḥ) here is the season, spring." }
  "sa-3628":
    native: "In Bhādrapada there is rain and in Phālguna there is not."
    bases: { "भाद्रपदे": "in Bhādrapada", "भवति": "to be (is)", "फाल्गुने": "in Phālguna" }
    confusables: { "w1": { why: "Āṣāḍha, not Bhādrapada: आषाढः (āṣāḍhaḥ) means Āṣāḍha." }, "w2": { why: "Āśvina, not Bhādrapada: आश्विनः (āśvinaḥ) means Āśvina." }, "w3": { why: "Mārgaśīrṣa, not Phālguna: मार्गशीर्षः (mārgaśīrṣaḥ) means Mārgaśīrṣa." } }
    notes: { "n1": "The second half repeats the verb with न (na): फाल्गुने (phālgune) न (na) भवति (bhavati) means in Phālguna it is not." }
  "sa-3629":
    native: "Time never stands still but moves."
    bases: { "कालो": "time", "तिष्ठति": "to stand (stands)", "चलति": "to move (moves)" }
    confusables: { "w1": { why: "Moment, not time: क्षणः (kṣaṇaḥ) means moment." }, "w2": { why: "Moment, not time: मुहूर्तः (muhūrtaḥ) means moment." }, "w3": { why: "Always, not never: सदा (sadā) means always." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. कालः (kālaḥ) is written कालो (kālo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of न (na) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "न (na) कदाचित् (kadācit) means never: not at any time. तिष्ठति (tiṣṭhati) is the present of स्था (sthā), which changes its stem to तिष्ठ (tiṣṭha). Two verbs stand side by side with no word for and." }
