cards:
  "sa-1839":
    native: "Learning."
    notes:
      "n1": "A feminine ā-stem noun: its case endings differ from the a-stem pattern, so it is not in the a-stems table."
      "n2": "The dictionary stem is शिक्षा (śikṣā); the card shows the isolated nominative singular शिक्षा (śikṣā)."
      "n3": "Written apart: Before a vowel the words stay apart and the vowels are not joined: sandhi is not applied here; see the lesson sa-grammar-sandhi-vowel."
    bases:
      "शिक्षा": "learning"
    examples:
      "शिक्षा उत्तमा":
        native: "Learning is excellent."
        bases:
          "शिक्षा": "learning"
          "उत्तमा": "excellent"
      "विद्यालये शिक्षा अस्ति":
        native: "There is learning in the school."
        bases:
          "विद्यालये": "school (locative)"
          "शिक्षा": "learning"
          "अस्ति": "is"
  "sa-1840":
    native: "Teacher."
    notes:
      "n1": "An a-stem noun: its full set of case forms is in the a-stems table of the grammar rules."
      "n2": "The dictionary stem is अध्यापक (adhyāpaka); the card shows the isolated nominative singular अध्यापकः (adhyāpakaḥ)."
      "n3": "Written apart: A final अः (aḥ) before अ (a) becomes ओ (o) and the अ (a) is shown by the avagraha ऽ (Whitney 175 a). A final अः (aḥ) before a vowel other than अ (a) loses its visarga and the vowels stay apart (Whitney 175 c). Before a vowel the words stay apart and the vowels are not joined: sandhi is not applied here; see the lesson sa-grammar-sandhi-vowel."
    bases:
      "अध्यापकः": "teacher"
    examples:
      "अध्यापक उत्तमः":
        native: "The teacher is excellent."
        bases:
          "अध्यापक": "teacher"
          "उत्तमः": "excellent"
      "नगरे अध्यापको ऽस्ति":
        native: "There is a teacher in the city."
        bases:
          "नगरे": "city (locative)"
          "अध्यापको": "teacher"
          "ऽस्ति": "is"
  "sa-1841":
    native: "Script."
    notes:
      "n1": "An i-stem noun: its case endings differ from the a-stem pattern, so it is not in the a-stems table."
      "n2": "The dictionary stem is लिपि (lipi); the card shows the isolated nominative singular लिपिः (lipiḥ)."
      "n3": "Written apart: A final visarga after a vowel other than अ (a) or आ (ā) becomes र् (r) before a voiced consonant or a vowel (Whitney 174)."
    bases:
      "लिपिः": "script"
    examples:
      "लिपिः प्राचीना":
        native: "The script is ancient."
        bases:
          "लिपिः": "script"
          "प्राचीना": "ancient"
      "विद्यालये लिपिर् अस्ति":
