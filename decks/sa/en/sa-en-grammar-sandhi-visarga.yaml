  slots: { "joined": "joined by sandhi" }
  entries:
    "ramah-atra": "after a, the visarga before a short a becomes o and the a drops, written with the avagraha, Pāṇini 6.1.113 and 6.1.109, Whitney §175 a"
    "devah-ayam": "after a, the visarga before a short a becomes o and the a drops, written with the avagraha, Pāṇini 6.1.113 and 6.1.109, Whitney §175 a"
