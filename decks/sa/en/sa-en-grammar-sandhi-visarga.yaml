  notes: "What is joined, and by which sūtra of the Aṣṭādhyāyī; the section of Whitney, Sanskrit Grammar (1889) that gives the same junction is in each entry (§170 the visarga before the hard consonants, §172 before a sibilant, §174 the r, §175 the o and the dropped visarga after a, §176 a saḥ and eṣaḥ, §177 after ā). A final visarga is what is left of a final s or r: Pāṇini 8.2.66, ससजुषोः रुः (sasajuṣoḥ ruḥ), turns the s into ru, an r, and 8.3.15, खरवसानयोर्विसर्जनीयः (kharavasānayorvisarjanīyaḥ), turns that r into the visarga before a hard consonant or at a pause. So before a vowel or a voiced consonant the visarga shows its other face, which depends on the vowel before it. After a short a, before a short a or a voiced consonant, it becomes o: 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), for the short a, and 6.1.114, हशि च (haśi ca), for the voiced consonants; the u of the ru joins the a before it as o. Before a short a the a then drops, 6.1.109, एङः पद अन्तात् अति (eṅaḥ pada antāt ati), and the avagraha sign ऽ (avagraha) marks it in writing, as in the vowel sandhi unit. After a, before any vowel but a, and after ā, before any vowel or voiced consonant, the visarga is dropped: 8.3.17, भो भगो अघो अपूर्वस्य यः अशि (bho bhago agho apūrvasya yaḥ aśi), turns the r into y, and 8.3.19, लोपः शाकल्यस्य (lopaḥ śākalyasya), drops that y, which is the form the writing shows. After any other vowel (i, ī, u, ū, ṛ, e, o, ai, au) the r stays an r before a vowel or a voiced consonant, with no further change. Before a hard consonant the visarga becomes a sibilant: 8.3.34, विसर्जनीयस्य सः (visarjanīyasya saḥ), makes it s; the s then follows the consonant after it, 8.4.40 (before c, ch it becomes ś, स्तोः श्चुना श्चुः (stoḥ ścunā ścuḥ)) and 8.4.41 (before ṭ, ṭh, ṣ it becomes ṣ, ष्टुना ष्टुः (ṣṭunā ṣṭuḥ) as the Sanskrit Wikipedia page types it). Before a sibilant the visarga may take that sibilant or stay: 8.3.36, वा शरि (vā śari) (read in GRETIL); 8.3.35, शर्परे विसर्जनीयः (śarpare visarjanīyaḥ), keeps it when a hard consonant follows the sibilant. Before k, kh, p and ph the visarga stays, as at a pause (8.3.37 gives the optional signs jihvāmūlīya and upadhmānīya for it, which this lesson does not teach). Two pronouns lose their visarga: 6.1.132, एतद् तदोः सुलोपः (etad tadoḥ sulopaḥ) (the sūtra page types the rest of it in a way that is not quoted), drops the visarga of सः (saḥ) and एषः (eṣaḥ) before a consonant, which the en.wiktionary entry of तद् (tad) says, and the en.wiktionary entry of एतद् (etad) has the example एष बाणः (eṣa bāṇaḥ) (this arrow). The sūtra is for a following consonant, so before a vowel these two give no row here. The pairs are as the Sanskrit Wikipedia page on sandhi writes them; सः गच्छति (saḥ gacchati) and एष बाणः (eṣa bāṇaḥ) are also in en.wiktionary, and Whitney gives रामः पठति (rāmaḥ paṭhati) the same way in nalaḥ kāmam and puruṣaḥ khanati (§170 d). In the course: रामः (rāmaḥ), देवः (devaḥ), वेदः (vedaḥ), गुरुः (guruḥ), कः (kaḥ), सः (saḥ), एषः (eṣaḥ), अयम् (ayam), अत्र (atra), तत्र (tatra) and इति (iti) are taught as cards, and देवाः (devāḥ) is the plural of देवः (devaḥ); जयति (jayati), नमति (namati), गच्छति (gacchati), पठति (paṭhati) and यान्ति (yānti) are forms of verbs the course teaches. The other parts are taught by this lesson alone."
