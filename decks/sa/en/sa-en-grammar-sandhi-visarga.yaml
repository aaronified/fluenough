    "sivah-vandyah": "after a, the visarga before a voiced consonant becomes o, Pāṇini 6.1.114, Whitney §175 a"
    "manah-rama": "after a, the visarga before the voiced consonant r becomes o, Pāṇini 6.1.114, Whitney §175 a"
    "vedah-iti": "after a, the visarga before any vowel but a is dropped, Pāṇini 8.3.17 and 8.3.19, Whitney §175 c"
    "arjunah-uvaca": "after a, the visarga before any vowel but a is dropped, Pāṇini 8.3.17 and 8.3.19, Whitney §175 c"
    "devah-yanti": "after ā, the visarga before a vowel or a voiced consonant is dropped, Pāṇini 8.3.17 and 8.3.19, Whitney §177"
    "surah-namyah": "after ā, the visarga before a vowel or a voiced consonant is dropped, Pāṇini 8.3.17 and 8.3.19, Whitney §177"
