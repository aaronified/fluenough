name: "Visarga sandhi: the visarga meeting a sound"
description: "How a final visarga changes before the next sound: o, r, s, ś, ṣ, dropped or unchanged, each with its sūtra of Pāṇini and with examples from the cards of the course. Not yet checked by a Sanskrit speaker: please report any mistake."
