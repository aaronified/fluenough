id: "sa-en-about-me-sentences"
kind: "layer"
core: "sa-about-me-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences about me"
description: "Short sentences about your name, age and language, built only from words already taught. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sa-3050":
    native: "I read Sanskrit and Sanskrit is a language."
    bases: { "अहं": "I", "संस्कृतं": "the Sanskrit language", "पठामि": "to read (I read)", "च": "and", "भवति": "to be (is)" }
    confusables: { "w1": { why: "You, not I: त्वम् (tvam) means you." }, "w2": { why: "To speak, not to read: वद् (vad) means to speak." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अहम् (aham) is written अहं (ahaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of संस्कृतम् (saṃskṛtam) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). संस्कृतम् (saṃskṛtam) is written संस्कृतं (saṃskṛtaṃ), for the same reason, before पठामि (paṭhāmi). The labial keeps म् (m) in Whitney 213 a, but the anusvāra sign is the usual writing (Whitney 213 i). संस्कृतम् (saṃskṛtam) is written संस्कृतं (saṃskṛtaṃ), for the same reason, before च (ca).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3051":
    native: "Mother says the name and father says the age."
    bases: { "वदति": "to speak (speaks)", "च": "and", "वयो": "age" }
    confusables: { "w1": { why: "Brother, not mother: भ्राता (bhrātā) means brother." }, "w2": { why: "Language, not name: भाषा (bhāṣā) means language." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वयः (vayaḥ) is written वयो (vayo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of वदति (vadati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one.", "n3": "नाम (nāma) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
  "sa-3052":
    native: "What name do you say and what does he say?"
    bases: { "त्वं": "you", "किं": "what", "वदसि": "to speak (you speak)", "स": "he", "च": "and", "वदति": "to speak (speaks)" }
    confusables: { "w1": { why: "She, not you: सा (sā) means she." }, "w2": { why: "Who, not what: कः (kaḥ) means who." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. त्वम् (tvam) is written त्वं (tvaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of किम् (kim) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). किम् (kim) is written किं (kiṃ), for the same reason, before नाम (nāma). सः (saḥ) is written स (sa) because सः (saḥ) and एषः (eṣaḥ) lose their visarga before any consonant, here the start of च (ca) (Whitney 176 a; Aṣṭādhyāyī 6.1.132). किम् (kim) is written किं (kiṃ), for the same reason, before वदति (vadati).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one.", "n3": "नाम (nāma) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
  "sa-3053":
    native: "She does not say the name and you say it."
    bases: { "वदति": "to speak (speaks)", "त्वं": "you", "च": "and", "वदसि": "to speak (you speak)" }
    confusables: { "w1": { why: "That, not she: तत् (tat) means that." }, "w2": { why: "Age, not name: वयः (vayaḥ) means age." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. त्वम् (tvam) is written त्वं (tvaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of च (ca) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "The object, the name, is not repeated in the second half: it is understood from the first.", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one.", "n4": "नाम (nāma) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
  "sa-3054":
    native: "The friend says the age and the brother says the name."
    bases: { "वयो": "age", "वदति": "to speak (speaks)", "च": "and" }
    confusables: { "w1": { why: "Son, not friend: सूनुः (sūnuḥ) means son." }, "w2": { why: "Language, not age: भाषा (bhāṣā) means language." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वयः (vayaḥ) is written वयो (vayo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of वदति (vadati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one.", "n3": "वयः (vayaḥ) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
  "sa-3055":
    native: "Father says this name."
    bases: { "इदं": "this (neuter)", "वदति": "to speak (speaks)" }
    confusables: { "w1": { why: "This one (masculine), not this (neuter): एषः (eṣaḥ) means this one (masculine)." }, "w2": { why: "Age, not name: वयः (vayaḥ) means age." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. इदम् (idam) is written इदं (idaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of नाम (nāma) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "The object, इदम् नाम (idam nāma), comes first: in Sanskrit the order of the words is free because the endings show their jobs.", "n3": "नाम (nāma) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
  "sa-3056":
    native: "I do not speak Sanskrit and you speak it."
    bases: { "अहं": "I", "संस्कृतं": "the Sanskrit language", "वदामि": "to speak (I speak)", "त्वं": "you", "च": "and", "वदसि": "to speak (you speak)" }
    confusables: { "w1": { why: "He, not I: सः (saḥ) means he." }, "w2": { why: "To cook, not to speak: पच् (pac) means to cook." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अहम् (aham) is written अहं (ahaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of संस्कृतम् (saṃskṛtam) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). संस्कृतम् (saṃskṛtam) is written संस्कृतं (saṃskṛtaṃ), for the same reason, before न (na). त्वम् (tvam) is written त्वं (tvaṃ), for the same reason, before च (ca).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one.", "n3": "संस्कृतम् (saṃskṛtam) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
  "sa-3057":
    native: "This language is Sanskrit."
    bases: { "संस्कृतं": "the Sanskrit language", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Who (masculine), not this one (feminine): यः (yaḥ) means who (masculine)." }, "w2": { why: "Life, not language: आयुः (āyuḥ) means life." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. संस्कृतम् (saṃskṛtam) is written संस्कृतं (saṃskṛtaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of भवति (bhavati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i)." }
