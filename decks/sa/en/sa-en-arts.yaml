  "sa-9604":
    native: "Metre of a verse; a fixed pattern of syllables."
    notes:
      "n1": "A neuter as-stem noun: its full set of case forms is in the other-stems table of the grammar rules; the stem is छन्दस् (chandas) and the nominative is छन्दः (chandaḥ)."
      "n2": "The final ः (ḥ) of छन्दः (chandaḥ) becomes ो (o) before a voiced sound, as in छन्दो (chando) जनो (jano) जानाति (jānāti)."
      "n3": "Metre (chandas) is the fixed pattern of long and short syllables that shapes a Sanskrit verse."
      "n4": "A final अः (aḥ) before a voiced consonant is written ओ (o) (Aṣṭādhyāyī 6.1.114, हशि (haśi) च (ca)), as in छन्दो (chando) जनो (jano)."
    bases:
      "छन्दः": "metre"
    examples:
      "छन्दः पठति बालः":
        native: "The child reads the metre."
        bases:
          "छन्दः": "metre"
          "पठति": "to read"
          "बालः": "child"
      "छन्दो जनो जानाति":
        native: "A person knows the metre."
        bases:
          "छन्दो": "metre"
          "जनो": "person"
          "जानाति": "to know"
