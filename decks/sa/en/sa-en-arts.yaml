cards:
  "sa-9600":
    native: "Dance, graceful dancing with music and song."
    notes:
      "n1": "A neuter a-stem noun: its full set of case forms is in the a-stems table of the grammar rules."
      "n2": "A final अः (aḥ) before a voiced consonant is written ओ (o) (Aṣṭādhyāyī 6.1.114, हशि (haśi) च (ca)), as the second example writes जनो (jano) जानाति (jānāti). A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ))."
      "n3": "Music, dance and drama are treated together in the Nāṭyaśāstra, a treatise attributed to Bharata."
    bases:
      "लास्यम्": "dance"
    examples:
      "लास्यं बालः पश्यति":
        native: "The child sees the dance."
        bases:
          "लास्यं": "dance"
          "बालः": "child"
          "पश्यति": "to see"
      "लास्यं जनो जानाति":
        native: "A person knows the dance."
        bases:
          "लास्यं": "dance"
          "जनो": "person"
          "जानाति": "to know"
