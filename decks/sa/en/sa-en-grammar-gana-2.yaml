name: "The present tense, classes 6 to 10"
description: "The present tense of the verbs of the sixth, seventh, eighth, ninth and tenth class: the class sign that stands between the root and the ending, and the strong and weak stems. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "person and number"
  slots:
    "p3-sg": "third person singular (he, she, it)"
    "p3-du": "third person dual (the two of them)"
    "p3-pl": "third person plural (they)"
    "p2-sg": "second person singular (you)"
    "p2-du": "second person dual (the two of you)"
    "p2-pl": "second person plural (you all)"
    "p1-sg": "first person singular (I)"
    "p1-du": "first person dual (the two of us)"
    "p1-pl": "first person plural (we)"
rules:
  "sa-rule-gana-2-singular":
    name: "Singular: the strong stem and the class sign"
    explanation: "The class signs of the sixth to tenth class, each class named for its first root. The singular endings are pit (the previous unit says why), so a strong stem stands in the singular wherever the class has one. Sixth class: 3.1.77, {1}, adds śa, an a, to the root: {2}, {3}. The stem is the same in every person, with no strengthening and no difference between the singular and the plural. The root iṣ becomes iccha: {4} (Pāṇini 7.3.77, \"iṣu-gami-yamāṃ chaḥ\", read in GRETIL). Seventh class: 3.1.78, {5} as the page types it, puts a nasal syllable inside the root, before its last letter: {6} has ṇa after the u of rudh in the singular. Eighth class: 3.1.79, \"tan-ādi-kṛñbhyaḥ uḥ\" (read in GRETIL), adds the suffix u: {7} is kṛ with the u strengthened to o in the singular. Ninth class: 3.1.81, {8} as the page types it, adds śnā: {9} and {10} have nā before the singular endings. Tenth class: 3.1.25 names the suffix ṇic for a list of nouns and for the roots that begin with cur (\"satyāpa-pāśa-rūpa-vīṇā-tūla-śloka-senā-loma-tvaca-varma-varṇa-cūrṇa-curādibhyo ṇic\", read in GRETIL); the stem ends in aya in every person: {11}, {12}. The table has a row for each verb of the sixth to tenth class that the course teaches. Read each row across: the strong stem is the one before the singular endings."
  "sa-rule-gana-2-weak":
    name: "Dual and plural: the weak stem"
    explanation: "The dual and plural endings are ṅit (1.2.4, {1}), so the class sign is weak. Sixth and tenth class: the stem does not change, as {2} and {12} show. Seventh class: the nasal is now part of the stem and the dh meets the t of the ending: {3} and {4}. Eighth class: the u is weak, and becomes v before an ending that begins with a vowel: {5} and {6}; the first person plural {7} has lost the u. Ninth class: the nā of the singular becomes nī before an ending that begins with a consonant, 6.4.113, {10}: {8}; before an ending that begins with a vowel the ā of nā drops, 6.4.112, {11}: {9}. The cells of this table are the weak stem with the ending, as read in the Wiktionary tables."
