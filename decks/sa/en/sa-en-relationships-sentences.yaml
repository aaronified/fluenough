cards:
  "sa-3940":
    native: "The grandfather tells the boy a story."
    bases: { "पितामहो": "grandfather", "बालकाय": "to the boy", "कथां": "story", "कथयति": "to tell (tells)" }
    confusables: { "w1": { why: "Maternal grandfather, not grandfather: मातामहः (mātāmahaḥ) means maternal grandfather." }, "w2": { why: "Great-grandfather on the father's side, not grandfather: प्रपितामहः (prapitāmahaḥ) means great-grandfather on the father's side." }, "w3": { why: "To say, not to tell: ब्रू (brū) means to say." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पितामहः (pitāmahaḥ) is written पितामहो (pitāmaho) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of बालकाय (bālakāya) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). कथाम् (kathām) is written कथां (kathāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of कथयति (kathayati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "बालकाय (bālakāya) is the dative case of बालकः (bālakaḥ): to the boy. कथाम् (kathām) is the accusative case of कथा (kathā): what is told." }
  "sa-3941":
    native: "A woman friend meets her friend at home."
    bases: { "सखीं": "friend", "गृहे": "at home", "मिलति": "to meet (meets)" }
    confusables: { "w1": { why: "Beloved, not friend: वल्लभः (vallabhaḥ) means beloved." }, "w2": { why: "Woman, not friend: स्त्री (strī) means woman." }, "w3": { why: "To ask, not to meet: प्रछ् (prach) means to ask." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सखीम् (sakhīm) is written सखीं (sakhīṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of गृहे (gṛhe) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "सखीम् (sakhīm) is the accusative case of सखी (sakhī): whom she meets. गृहे (gṛhe) is the locative case of गृहम् (gṛham): at home." }
  "sa-3942":
    native: "The younger brother always bows to the eldest brother."
    bases: { "अनुजो": "younger brother", "नित्यं": "always", "ज्येष्ठं": "eldest brother", "नमति": "to bow (bows)" }
    confusables: { "w1": { why: "Firstborn, not eldest brother: अग्रजः (agrajaḥ) means firstborn." }, "w2": { why: "Brother, not younger brother: सहोदरः (sahodaraḥ) means brother." }, "w3": { why: "To remember, not to bow: स्मृ (smṛ) means to remember." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अनुजः (anujaḥ) is written अनुजो (anujo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of नित्यं (nityaṃ) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). नित्यम् (nityam) is written नित्यं (nityaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of ज्येष्ठं (jyeṣṭhaṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). ज्येष्ठम् (jyeṣṭham) is written ज्येष्ठं (jyeṣṭhaṃ), for the same reason, before नमति (namati).", "n2": "ज्येष्ठम् (jyeṣṭham) is the accusative case of ज्येष्ठः (jyeṣṭhaḥ): to whom he bows. नमति (namati) is the present of नम् (nam): bows." }
  "sa-3943":
    native: "The neighbour gives the traveller drinking water."
    bases: { "पथिकाय": "to the traveller", "पानीयं": "drinking water", "ददाति": "to give (gives)" }
    confusables: { "w1": { why: "People who surround and serve a person, not neighbour: परिजनः (parijanaḥ) means people who surround and serve a person." }, "w2": { why: "Guest, not traveller: अतिथिः (atithiḥ) means guest." }, "w3": { why: "To take, not to give: हृ (hṛ) means to take." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पानीयम् (pānīyam) is written पानीयं (pānīyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of ददाति (dadāti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "पथिकाय (pathikāya) is the dative case of पथिकः (pathikaḥ): to the traveller. पानीयम् (pānīyam) is a neuter word, here the accusative: what is given." }
  "sa-3944":
    native: "The humble student bows to the teacher."
    bases: { "उपाध्यायं": "teacher", "नम्रा": "humble", "नमति": "to bow (bows)" }
    confusables: { "w1": { why: "Servant, not teacher: भृत्यः (bhṛtyaḥ) means servant." }, "w2": { why: "Modest and well-mannered, not humble: विनीतः (vinītaḥ) means modest and well-mannered." }, "w3": { why: "To remember, not to bow: स्मृ (smṛ) means to remember." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. उपाध्यायम् (upādhyāyam) is written उपाध्यायं (upādhyāyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of नम्रा (namrā) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "उपाध्यायम् (upādhyāyam) is the accusative case of उपाध्यायः (upādhyāyaḥ): to whom she bows. नम्रा (namrā) is the feminine form of नम्रः (namraḥ), to agree with शिष्या (śiṣyā). The object comes first; the order of the words is free." }
  "sa-3945":
    native: "A servant serves the king."
    bases: { "भृत्यो": "servant", "नृपस्य": "of the king", "सेवां": "service", "करोति": "to do (does)" }
    confusables: { "w1": { why: "Ruler, not servant: अधिपतिः (adhipatiḥ) means ruler." }, "w2": { why: "Labour, not service: श्रमः (śramaḥ) means labour." }, "w3": { why: "To take, not to do: हृ (hṛ) means to take." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. भृत्यः (bhṛtyaḥ) is written भृत्यो (bhṛtyo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of नृपस्य (nṛpasya) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). सेवाम् (sevām) is written सेवां (sevāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of करोति (karoti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "नृपस्य (nṛpasya) is the genitive case of नृपः (nṛpaḥ): of the king. सेवाम् करोति (sevām karoti) means does service, that is, serves." }
  "sa-3946":
    native: "An ungrateful person does not protect a friend."
    bases: { "कृतघ्नो": "ungrateful person", "मित्रं": "friend", "रक्षति": "to protect (protects)" }
    confusables: { "w1": { why: "Requital, not ungrateful: प्रतिकारः (pratikāraḥ) means requital." }, "w2": { why: "Enemy, not friend: अमित्रः (amitraḥ) means enemy." }, "w3": { why: "To conquer, not to protect: जि (ji) means to conquer." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. कृतघ्नः (kṛtaghnaḥ) is written कृतघ्नो (kṛtaghno) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of मित्रं (mitraṃ) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). मित्रम् (mitram) is written मित्रं (mitraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of न (na) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "मित्रम् (mitram) is the accusative case of मित्रम् (mitram), a neuter word: what he does not protect. न (na) stands right before the verb it denies." }
  "sa-3947":
    native: "A sister looks at her brother with affection."
    bases: { "भ्रातरं": "brother", "स्नेहेन": "with affection", "पश्यति": "to see (looks at)" }
    confusables: { "w1": { why: "Daughter, not sister: पुत्री (putrī) means daughter." }, "w2": { why: "Affection and attachment, not affection: अनुरागः (anurāgaḥ) means affection and attachment." }, "w3": { why: "To remember, not to look at: स्मृ (smṛ) means to remember." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. भ्रातरम् (bhrātaram) is written भ्रातरं (bhrātaraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of स्नेहेन (snehena) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "भ्रातरम् (bhrātaram) is the accusative case of भ्राता (bhrātā): whom she looks at. स्नेहेन (snehena) is the instrumental case of स्नेहः (snehaḥ): with affection." }
  "sa-3948":
    native: "The king gives shelter to the refugee."
    bases: { "राजा": "king", "शरणागताय": "to the refugee", "शरणं": "shelter", "ददाति": "to give (gives)" }
    confusables: { "w1": { why: "Refuge, not shelter: आश्रयः (āśrayaḥ) means refuge." }, "w2": { why: "Opponent, not refugee: विपक्षः (vipakṣaḥ) means opponent." }, "w3": { why: "To take, not to give: हृ (hṛ) means to take." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. शरणम् (śaraṇam) is written शरणं (śaraṇaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of ददाति (dadāti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "शरणागताय (śaraṇāgatāya) is the dative case of शरणागतः (śaraṇāgataḥ): to the refugee. शरणम् (śaraṇam) is the accusative case: what is given." }
  "sa-3949":
    native: "In the household the father and mother live."
    bases: { "कुटुम्बे": "in the household", "वसतः": "to dwell (live, two of them)" }
    confusables: { "w1": { why: "Relative, not household: ज्ञातिः (jñātiḥ) means relative." }, "w2": { why: "Society, not household: समाजः (samājaḥ) means society." }, "w3": { why: "To stand, not to live: स्था (sthā) means to stand." } }
    notes: { "n1": "कुटुम्बे (kuṭumbe) is the locative case of कुटुम्बम् (kuṭumbam): in the household. वसतः (vasataḥ) is the third person dual, to agree with the two subjects." }
