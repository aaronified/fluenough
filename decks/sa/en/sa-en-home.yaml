cards:
  "sa-1747":
    native: "House."
    notes:
      "n1": "An a-stem noun: its full set of case forms is in the a-stems table of the grammar rules."
      "n2": "The dictionary stem is गृह (gṛha); the card shows the isolated nominative singular गृहम् (gṛham)."
      "n3": "Written apart: A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i). Before a vowel the final म् (m) stays and is not joined to the next word: written apart, sandhi not applied (Whitney 213 a)."
    bases:
      "गृहम्": "house"
    examples:
      "गृहं विशालम्":
        native: "The house is large."
        bases:
          "गृहं": "house"
          "विशालम्": "large"
      "ग्रामे गृहम् अस्ति":
        native: "There is a house in the village."
        bases:
          "ग्रामे": "village (locative)"
          "गृहम्": "house"
          "अस्ति": "is"
