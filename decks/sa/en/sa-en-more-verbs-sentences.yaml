core: "sa-more-verbs-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences with more verbs"
description: "Short sentences with the verbs of More verbs, in the third person forms the unit gives, built only from words already taught. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sa-3150":
    native: "Water trickles."
    bases: { "जलं": "water", "क्षरति": "to trickle (it trickles)" }
    confusables: { "w1": { why: "To drink, not trickle: पा (pā) means to drink." }, "w2": { why: "To walk, not trickle: चल् (cal) means to walk." } }
  "sa-3151":
    native: "The mother holds back water."
    bases: { "रुणद्धि": "to hold back (she holds back)" }
    confusables: { "w1": { why: "To trickle, not hold back: क्षर् (kṣar) means to flow or trickle." }, "w2": { why: "To hold, not hold back: धृ (dhṛ) means to hold or bear." } }
  "sa-3152":
    native: "She gets water."
    bases: { "लभते": "to get (she gets)" }
    confusables: { "w1": { why: "To drink, not get: पा (pā) means to drink." }, "w2": { why: "To walk, not get: चल् (cal) means to walk." } }
  "sa-3153":
    native: "The father is."
    bases: { "वर्तते": "to be; to exist (he is)" }
    confusables: { "w1": { why: "To trickle, not be: क्षर् (kṣar) means to flow or trickle." }, "w2": { why: "To drink, not be: पा (pā) means to drink." } }
  "sa-3154":
    native: "There is water."
    bases: { "अस्ति": "is (there)" }
    confusables: { "w1": { why: "Fire, not water: अग्निः (agniḥ) means fire." }, "w2": { why: "To drink, not be: पा (pā) means to drink." } }
  "sa-3155":
    native: "The friend gives water."
    bases: { "ददाति": "to give (he gives)" }
    confusables: { "w1": { why: "To put, not give: धा (dhā) means to put or place." }, "w2": { why: "To wish, not give: इष् (iṣ) means to wish or desire." } }
  "sa-3156":
    native: "She sees water."
    bases: { "पश्यति": "to see (she sees)" }
    confusables: { "w1": { why: "To do, not see: कृ (kṛ) means to do or make." }, "w2": { why: "To seize, not see: ग्रह् (grah) means to seize or take." } }
  "sa-3157":
    native: "The friend knows."
    bases: { "जानाति": "to know (he knows)" }
    confusables: { "w1": { why: "To wish, not know: इष् (iṣ) means to wish or desire." }, "w2": { why: "To seize, not know: ग्रह् (grah) means to seize or take." } }
