tags: ["unreviewed"]
cards:
  "sa-3150":
    native: "Water trickles there and the friend holds the water back."
    bases: { "जलं": "water", "क्षरति": "to trickle (trickles)", "रुणद्धि": "to hold back (holds back)" }
    confusables: { "w1": { why: "Fire, not water: अग्निः (agniḥ) means fire." }, "w2": { why: "Now, not there: इदानीम् (idānīm) means now." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. जलम् (jalam) is written जलं (jalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of तत्र (tatra) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). जलम् (jalam) is written जलं (jalaṃ), for the same reason, before रुणद्धि (ruṇaddhi)." }
  "sa-3151":
    native: "She gets a book and the brother reads a book."
    bases: { "पुस्तकं": "book", "लभते": "to get (gets)", "पठति": "to read (reads)" }
    confusables: { "w1": { why: "That, not she: तत् (tat) means that." }, "w2": { why: "Student, not book: शिष्यः (śiṣyaḥ) means student." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पुस्तकम् (pustakam) is written पुस्तकं (pustakaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of लभते (labhate) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). पुस्तकम् (pustakam) is written पुस्तकं (pustakaṃ), for the same reason, before पठति (paṭhati).", "n2": "लभते (labhate) takes the middle ending -ते (-te): the middle voice is taught in its own lesson." }
  "sa-3152":
    native: "Father is there and mother is not there."
    bases: { "वर्तते": "to be (is)" }
    confusables: { "w1": { why: "Brother, not father: भ्राता (bhrātā) means brother." }, "w2": { why: "Now, not there: इदानीम् (idānīm) means now." } }
  "sa-3153":
    native: "There is water there and father brings water."
    bases: { "अस्ति": "to be (is)", "जलं": "water", "नयति": "to bring (brings)" }
    confusables: { "w1": { why: "To give, not to be: दा (dā) means to give." }, "w2": { why: "Fire, not water: अग्निः (agniḥ) means fire." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. जलम् (jalam) is written जलं (jalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of तत्र (tatra) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). जलम् (jalam) is written जलं (jalaṃ), for the same reason, before नयति (nayati).", "n2": "अस्ति (asti) comes first when it says that something exists." }
  "sa-3154":
    native: "Who gives water and who gets a book?"
    bases: { "को": "who", "जलं": "water", "ददाति": "to give (gives)", "पुस्तकं": "book", "लभते": "to get (gets)" }
    confusables: { "w1": { why: "Where, not who: कुत्र (kutra) means where." }, "w2": { why: "Fire, not water: अग्निः (agniḥ) means fire." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. कः (kaḥ) is written को (ko) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of जलम् (jalam) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). जलम् (jalam) is written जलं (jalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of ददाति (dadāti) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). पुस्तकम् (pustakam) is written पुस्तकं (pustakaṃ), for the same reason, before लभते (labhate)." }
  "sa-3155":
    native: "Father sees everything and mother hears everything."
    bases: { "सर्वं": "all", "पश्यति": "to see (sees)", "शृणोति": "to hear (hears)" }
    confusables: { "w1": { why: "Brother, not father: भ्राता (bhrātā) means brother." }, "w2": { why: "To do, not to see: कृ (kṛ) means to do." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सर्वम् (sarvam) is written सर्वं (sarvaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पश्यति (paśyati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). सर्वम् (sarvam) is written सर्वं (sarvaṃ), for the same reason, before शृणोति (śṛṇoti)." }
  "sa-3156":
    native: "I read Sanskrit and the friend knows Sanskrit."
    bases: { "अहं": "I", "संस्कृतं": "the Sanskrit language", "पठामि": "to read (I read)", "जानाति": "to know (knows)" }
    confusables: { "w1": { why: "You, not I: त्वम् (tvam) means you." }, "w2": { why: "To speak, not to read: वद् (vad) means to speak." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अहम् (aham) is written अहं (ahaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of संस्कृतम् (saṃskṛtam) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). संस्कृतम् (saṃskṛtam) is written संस्कृतं (saṃskṛtaṃ), for the same reason, before पठामि (paṭhāmi). संस्कृतम् (saṃskṛtam) is written संस्कृतं (saṃskṛtaṃ), for the same reason, before जानाति (jānāti)." }
  "sa-3157":
    native: "What does mother do and what does father do?"
    bases: { "किं": "what", "करोति": "to do (does)" }
    confusables: { "w1": { why: "Brother, not mother: भ्राता (bhrātā) means brother." }, "w2": { why: "Who, not what: कः (kaḥ) means who." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. किम् (kim) is written किं (kiṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of करोति (karoti) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). किम् (kim) is written किं (kiṃ), for the same reason, before करोति (karoti)." }
  "sa-3158":
    native: "Father hears Sanskrit and the daughter sees a book."
    bases: { "संस्कृतं": "the Sanskrit language", "शृणोति": "to hear (hears)", "पुस्तकं": "book", "पश्यति": "to see (sees)" }
    confusables: { "w1": { why: "Brother, not father: भ्राता (bhrātā) means brother." }, "w2": { why: "To do, not to hear: कृ (kṛ) means to do." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. संस्कृतम् (saṃskṛtam) is written संस्कृतं (saṃskṛtaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of शृणोति (śṛṇoti) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). पुस्तकम् (pustakam) is written पुस्तकं (pustakaṃ), for the same reason, before पश्यति (paśyati)." }
