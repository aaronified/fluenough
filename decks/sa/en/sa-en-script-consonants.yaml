tags: ["beginner", "unreviewed", "script"]
cards:
  "sa-4015":
    native: "ka, unaspirated, as the 'k' of 'skin'"
    notes:
      "n1": "Velar: said at the back of the tongue against the soft palate, with no puff of breath."
    examples:
      "कमलं सुन्दरम्।": "The lotus is beautiful."
      "को ऽस्ति?": "Who is there?"
  "sa-4016":
    native: "kha, aspirated, as the 'k' of 'kin' with a strong puff of breath"
    notes:
      "n1": "Velar like क (ka), with a clear breath after it, as in खगः (khagaḥ, bird)."
    examples:
      "खगो गच्छति।": "The bird goes."
      "सुखम् अस्ति।": "There is happiness."
  "sa-4017":
    native: "ga, unaspirated, as the 'g' of 'get'"
    notes:
      "n1": "Velar and unaspirated, with no breath: गजः (gajaḥ, elephant)."
    examples:
      "गजो गच्छति।": "The elephant goes."
      "गुरुः पठति।": "The teacher reads."
  "sa-4018":
    native: "gha, aspirated g, a g with a breath after it"
    notes:
      "n1": "Velar and aspirated, as in घटः (ghaṭaḥ, pot)."
    examples:
      "घटो ऽस्ति।": "There is a pot."
      "घृतम् अस्ति।": "There is ghee."
  "sa-4019":
    native: "ṅa, the velar nasal, as the 'ng' of 'sing'"
    notes:
      "n1": "Written mostly before another velar, as in अङ्गम् (aṅgam, limb). It does not begin a word."
    examples:
      "अङ्गं सुन्दरम्।": "The limb is beautiful."
      "अङ्को ऽस्ति।": "There is a number."
  "sa-4020":
    native: "ca, unaspirated, as the 'ch' of 'church' with no puff of breath"
    notes:
      "n1": "Palatal: the blade of the tongue against the hard palate, as in चन्द्रः (candraḥ, moon)."
    examples:
      "चन्द्रः सुन्दरः।": "The moon is beautiful."
      "चित्रं पश्य।": "Look at the picture."
  "sa-4021":
    native: "cha, aspirated, as the 'ch' of 'church' with a puff of breath"
    notes:
      "n1": "Palatal like च (ca), with a clear breath after it: छत्रम् (chatram, umbrella)."
    examples:
      "छत्रम् अस्ति।": "There is an umbrella."
      "अहं पृच्छामि।": "I ask."
  "sa-4022":
    native: "ja, unaspirated, as the 'j' of 'jam'"
    notes:
      "n1": "Palatal and unaspirated, as in जलम् (jalam, water)."
    examples:
      "जलं पिब।": "Drink water."
      "जन आगच्छति।": "The people come."
  "sa-4023":
    native: "jha, aspirated j, a j with a breath after it"
    notes:
      "n1": "Palatal and aspirated, as in झषः (jhaṣaḥ, fish)."
    examples:
      "झषो जले वसति।": "The fish lives in water."
      "झटिति गच्छ।": "Go quickly."
  "sa-4024":
    native: "ña, the palatal nasal, as the 'ny' of 'canyon'"
    notes:
      "n1": "Palatal nasal, as in पञ्च (pañca, five). Like the other nasals it is written with the next consonant."
    examples:
      "पञ्च सन्ति।": "There are five."
      "ज्ञानं शुभम्।": "Knowledge is good."
  "sa-4025":
    native: "ṭa, unaspirated retroflex, a t said with the tongue tip curled back"
    notes:
      "n1": "Retroflex: the tongue tip curls back, unlike the dental त (ta), as in नटः (naṭaḥ, actor)."
    examples:
      "पटो ऽस्ति।": "There is a cloth."
      "नटो नृत्यति।": "The actor dances."
  "sa-4026":
    native: "ṭha, aspirated retroflex, like ṭa with a breath"
    notes:
      "n1": "Retroflex and aspirated, like ट (ṭa) with a breath. It is rare in Sanskrit words."
    examples:
      "ठकारो वर्णः।": "ṭha is a sound."
      "ठकारो ऽक्षरम्।": "ṭha is a letter."
  "sa-4027":
    native: "ḍa, unaspirated retroflex d, with the tongue tip curled back"
    notes:
      "n1": "Retroflex, as in गुडः (guḍaḥ, jaggery). It is the retroflex partner of द (da)."
    examples:
      "डमरुः शुभः।": "The drum is auspicious."
      "गुडो मधुरः।": "Jaggery is sweet."
  "sa-4028":
    native: "ḍha, aspirated retroflex d, with a breath"
    notes:
      "n1": "Retroflex and aspirated, as in गूढम् (gūḍham, hidden)."
    examples:
      "गूढं वाक्यम्।": "The sentence is obscure."
      "मूढो गच्छति।": "The fool goes."
  "sa-4029":
    native: "ṇa, the retroflex nasal, an n said with the tongue tip curled back"
    notes:
      "n1": "Retroflex nasal, as in गुणः (guṇaḥ, quality) and रामायणम् (rāmāyaṇam)."
    examples:
      "गुणः श्रेष्ठः।": "Quality is excellent."
      "रामायणं पठामि।": "I read the Rāmāyaṇa."
  "sa-4030":
    native: "ta, unaspirated dental t, with the tongue tip against the teeth"
    notes:
      "n1": "Dental: the tongue tip touches the back of the upper teeth, not the ridge behind them as in English 't'."
    examples:
      "तत् सत्यम्।": "That is true."
      "सत्यं वद।": "Speak the truth."
  "sa-4031":
    native: "tha, aspirated dental t, with a breath"
    notes:
      "n1": "Dental and aspirated, as in कथा (kathā, story)."
    examples:
      "कथा सुन्दरा।": "The story is beautiful."
      "अथ गच्छामि।": "Then I go."
  "sa-4032":
    native: "da, unaspirated dental d"
    notes:
      "n1": "Dental, as in दानम् (dānam, gift)."
    examples:
      "दानं शुभम्।": "A gift is good."
      "देवः पश्यति।": "The god sees."
  "sa-4033":
    native: "dha, aspirated dental d, with a breath"
    notes:
      "n1": "Dental and aspirated, as in धर्मः (dharmaḥ, duty)."
    examples:
      "धर्मो रक्षति।": "Dharma protects."
      "धनं नास्ति।": "There is no wealth."
  "sa-4034":
    native: "na, the dental nasal, an n with the tongue on the teeth"
    notes:
      "n1": "Dental nasal, as in नरः (naraḥ, man)."
    examples:
      "नरो गच्छति।": "The man goes."
      "न अस्ति।": "It is not."
  "sa-4035":
    native: "pa, unaspirated p, as the 'p' of 'spin'"
    notes:
      "n1": "Labial, with no puff of breath, as in पुरुषः (puruṣaḥ, person)."
    examples:
      "पुरुषो ऽस्ति।": "There is a person."
      "पत्रं हरितम्।": "The leaf is green."
  "sa-4036":
    native: "pha, aspirated p, as the 'p' of 'pin' with a strong puff"
    notes:
      "n1": "Labial and aspirated, as in फलम् (phalam, fruit)."
    examples:
      "फलं मधुरम्।": "The fruit is sweet."
      "फलं पश्य।": "Look at the fruit."
  "sa-4037":
    native: "ba, unaspirated b, as the 'b' of 'bin' with no puff"
    notes:
      "n1": "Labial and unaspirated, as in बालः (bālaḥ, child)."
    examples:
      "बालो हसति।": "The child laughs."
      "ब्राह्मणः पठति।": "The brahmin reads."
  "sa-4038":
    native: "bha, aspirated b, a b with a breath after it"
    notes:
      "n1": "Labial and aspirated, as in भक्तः (bhaktaḥ, devotee)."
    examples:
      "भक्तो नमति।": "The devotee bows."
      "भवान् गच्छति।": "You (polite) go."
  "sa-4039":
    native: "ma, the labial nasal, as the 'm' of 'mother'"
    notes:
      "n1": "Labial nasal, as in माता (mātā, mother)."
    examples:
      "मित्रम् आगच्छति।": "The friend comes."
      "माता वदति।": "The mother speaks."
  "sa-4040":
    native: "ya, as the 'y' of 'yes'"
    notes:
      "n1": "A semivowel: the 'y' of 'yes', as in योगः (yogaḥ, yoga)."
    examples:
      "योगः शुभः।": "Yoga is auspicious."
      "युवा गच्छति।": "The young man goes."
  "sa-4041":
    native: "ra, a tapped or trilled r, as the r of Spanish 'pero'"
    notes:
      "n1": "A tapped r, never the English r. In sandhi a final r becomes the visarga ḥ, as in पुनः (punaḥ, again)."
    examples:
      "रथो गच्छति।": "The chariot goes."
      "राजा वदति।": "The king speaks."
  "sa-4042":
    native: "la, as the 'l' of 'look', with the tongue tip on the ridge"
    notes:
      "n1": "A semivowel, as in लता (latā, creeper)."
    examples:
      "लता सुन्दरा।": "The creeper is beautiful."
      "लोको विशालः।": "The world is vast."
  "sa-4043":
    native: "va, a sound between English 'v' and 'w'"
    notes:
      "n1": "A semivowel: the lower lip nearly touches the upper teeth, as in वनम् (vanam, forest)."
    examples:
      "वनं विशालम्।": "The forest is vast."
      "वेदः पठ।": "Read the Veda."
  "sa-4044":
    native: "śa, as the 'sh' of 'ship'"
    notes:
      "n1": "Palatal sibilant: the tongue blade near the hard palate. It is a separate sound from ष (ṣa) and स (sa)."
    examples:
      "शिवः शुभः।": "Śiva is auspicious."
      "शाखा दीर्घा।": "The branch is long."
  "sa-4045":
    native: "ṣa, as the 'sh' of 'ship' said with the tongue tip curled back"
    notes:
      "n1": "Retroflex sibilant, said further back than श (śa), as in षट् (ṣaṭ, six)."
    examples:
      "षट् सन्ति।": "There are six."
      "विषं नास्ति।": "There is no poison."
  "sa-4046":
    native: "sa, as the 's' of 'sun'"
    notes:
      "n1": "Dental sibilant, with the tongue tip on the teeth, as in सर्पः (sarpaḥ, snake)."
    examples:
      "स गच्छति।": "He goes."
      "सर्पो वने अस्ति।": "The snake is in the forest."
  "sa-4047":
    native: "ha, as the 'h' of 'hot'"
    notes:
      "n1": "Voiced: it sounds like the h between vowels in 'ahead', as in हरिः (hariḥ, Hari)."
    examples:
      "हरी रक्षति।": "Hari protects."
      "हंसः श्वेतः।": "The swan is white."
