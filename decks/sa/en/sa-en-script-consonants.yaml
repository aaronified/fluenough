id: "sa-en-script-consonants"
kind: "layer"
core: "sa-script-consonants"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Classical Sanskrit consonants"
description: "The consonants in their traditional order, by place of articulation. Not yet checked by a Sanskrit speaker: please report any mistake."
