native: { code: "en", iso639_3: "eng", name: "English" }
name: "The passive: yak and the middle endings"
description: "The passive of the verbs of the course: the passive stem in -ya and its nine present forms with the middle endings, the construction with the doer in the instrumental, and the impersonal passive of the action itself. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "passive form"
  slots:
    "stem": "passive stem (the root with ya)"
    "m3-sg": "present passive, third person singular (it is done)"
    "m3-du": "present passive, third person dual (the two of them are done)"
    "m3-pl": "present passive, third person plural (they are done)"
    "m2-sg": "present passive, second person singular (you are done)"
    "m2-du": "present passive, second person dual (the two of you are done)"
    "m2-pl": "present passive, second person plural (you all are done)"
    "m1-sg": "present passive, first person singular (I am done)"
    "m1-du": "present passive, first person dual (the two of us are done)"
    "m1-pl": "present passive, first person plural (we are done)"
rules:
  "sa-rule-passive-stem":
    name: "Passive stem in -ya (yak): the weak root"
    explanation: "Pāṇini 3.1.67, {1}, puts yak (the sign ya) before a sārvadhātuka ending, and 1.3.13, {2} (as typed on the page, with a hyphen), gives the middle endings in the sense of the object (karman) and of the action itself (bhāva). Whitney 768 and 769 call it the yá-class: the passive stem is the weak root with ya, made from every root, whatever its class, and a penultimate nasal drops: {3} gives {4} (kriyate, is done). A root that has a weak form in the participle has it here: {5} gives {6}, {7} gives {8}, {9} gives {10}, {11} gives {12} and {13} gives {14}. Whitney 770 says a final i or u is lengthened ({15}, {16}; {17}, {18}; {19}, {20}), a final ā is usually changed to ī ({21}, {22}; {23}, {24}; {25}, {26}) but not in {27}, {28}, and a final ṛ becomes ri ({29}, {30}; {31}, {32}) unless two consonants come before it, when it has guṇa: {33}, {34}. Whitney 772 gives khan its stem from the root khā: {35} beside {36}. In a verb of the tenth class the ay of the stem drops: {37}."
  "sa-rule-passive-third":
    name: "Passive, third person: -te, -ete, -ante"
    explanation: "The passive stem is inflected like any a-stem in the present middle (Whitney 771): the third person is -te, -ete, -ante. The doer is in the instrumental and the object is the subject, in the nominative, and the verb agrees with it, as {1} (milk is drunk by me); the m of the word for milk is written ṃ before p by 8.3.23, {2}, as typed. Pāṇini 3.4.69, {3}, as typed, gives the l-endings also for the action itself with verbs that take no object, which makes the impersonal passive in the neuter singular third person: {4} (it is gone by me, that is, I go). From {5} the third person singular is {6}, dual {7} and plural {8}."
  "sa-rule-passive-second":
    name: "Passive, second person: -se, -ethe, -dhve"
    explanation: "The second person of the passive has the middle endings -se, -ethe, -dhve on the passive stem, which loses its final a before the endings that begin with a vowel (Whitney 771): from {1}, {2}, {3} and {4}. The second person has you as the subject, the one the action is done to: {5} (you are done, you are made); when you are the doer you stand in the instrumental, {6} (it is done by you)."
  "sa-rule-passive-first":
    name: "Passive, first person: -e, -āvahe, -āmahe"
    explanation: "The first person has -e, -āvahe, -āmahe on the passive stem (Whitney 771), the final a of the stem lengthening before the endings with v and m: from {1}, {2}, {3} and {4}. The same endings are those of the middle voice of the present, taught in the unit on the ātmanepada; only the sign ya differs."
