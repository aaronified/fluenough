native: { code: "en", iso639_3: "eng", name: "English" }
name: "Reading the Aṣṭādhyāyī 1: names and operating rules (saṃjñā and paribhāṣā)"
description: "Thirty-nine sūtras of Pāṇini read in the text: the names he gives (vṛddhi, guṇa, saṃyoga, savarṇa, saṃkhyā, sarvanāma, pada), the rules that say which sound a change touches, and the it-markers behind the pratyāhāras. Each row gives the sūtra, its split into words, the words carried in from earlier rules, and an example from the course. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
pattern:
  name: "Sūtras read in the text"
  slot_name: "part"
  slots:
    "sutra": "the sūtra, as the page and the text give it"
    "padaccheda": "the sūtra split into its words (padaccheda)"
    "anuvrtti": "the words carried in from earlier sūtras (anuvṛtti)"
    "example": "an example the rule governs"
  entries:
    "1-1-1": "the vowels ā, ai and au are called vṛddhi"
    "1-1-2": "the vowels a, e and o are called guṇa"
    "1-1-3": "when guṇa or vṛddhi is ordered with no other place named, it replaces an ik vowel (i, u, ṛ, ḷ)"
    "1-1-4": "no guṇa or vṛddhi is made when a root's sound is lost before an ārdhadhātuka suffix"
    "1-1-5": "no guṇa or vṛddhi is made before a suffix marked k or ṅ"
    "1-1-7": "consonants with no vowel between them are called saṃyoga, a cluster"
    "1-1-8": "a sound spoken through the mouth and the nose together is called anunāsika, nasal"
    "1-1-9": "sounds made at the same place of the mouth with the same effort are called savarṇa, of one class"
    "1-1-10": "a vowel and a consonant are not savarṇa to each other, even where their places agree"
    "1-1-11": "a dual ending in ī, ū or e is called pragṛhya, and is left without sandhi"
    "1-1-23": "bahu, gaṇa, and words ending in vatu or ḍati are called saṃkhyā, number words"
    "1-1-27": "sarva and the other words of its list are called sarvanāma, pronouns, and take pronoun endings"
    "1-1-37": "the words of the list svar and so on, and the nipātas, are called avyaya, words that never change"
    "1-1-42": "the ending śi, -i of the neuter plural, is called sarvanāmasthāna, a strong ending"
    "1-1-45": "i, u, ṛ or ḷ standing in the place of y, v, r or l is called samprasāraṇa"
    "1-1-47": "an augment marked with m is put after the last vowel of the thing it is added to"
    "1-1-49": "a genitive in a rule means 'in the place of' the thing named"
    "1-1-50": "where several substitutes are possible, the nearest one in place and effort of the mouth is chosen"
    "1-1-51": "when ṛ or ṝ is replaced by a, i or u, an r follows it"
    "1-1-52": "a substitute takes the place of the last sound only"
    "1-1-54": "a substitute for what comes after takes the place of its first sound"
    "1-1-55": "a substitute of more than one sound, or marked ś, takes the place of the whole"
    "1-1-56": "a substitute counts as what it replaces, except in a rule about a single sound"
    "1-1-60": "non-appearance is called lopa, elision"
    "1-1-61": "the elision of a suffix is called luk, ślu or lup, according to the rule that orders it"
    "1-1-64": "the part from the last vowel to the end of a word is called ṭi"
    "1-1-65": "the sound before the last sound of a word is called upadhā"
    "1-1-66": "what a rule names in the locative acts on the sound just before it"
    "1-1-67": "what a rule names in the ablative acts on the sound just after it"
    "1-1-68": "a word in a rule stands for its own form, unless it is a name for a word"
    "1-1-70": "a letter followed by t stands for sounds of its own length only"
    "1-1-71": "the first letter together with the last it-letter stands for itself and every letter between: a pratyāhāra"
    "1-1-72": "a rule that names a thing with a qualifier acts on what ends in that thing"
    "1-1-73": "a word whose first vowel is vṛddhi is called vṛddha"
    "1-2-45": "a meaningful form that is neither a root nor a suffix is called prātipadika, a noun stem"
    "1-3-1": "bhū and the others of the list that starts with bhū are called dhātu, roots"
    "1-3-2": "a nasalised vowel in the original teaching of a root or suffix is an it, a silent marker"
    "1-3-3": "a final consonant in the original teaching is an it, a silent marker"
    "1-3-9": "an it, a silent marker, is elided"
  notes: "Sūtra numbers are those of the page, in the form chapter.pāda.sūtra. Each row is one sūtra of Pāṇini. The words of each sūtra are glossed below with the case (vibhakti) and number the padaccheda gives, and the words carried in from earlier rules are named. Case and number: nom. is the first case, acc. the second, instr. the third, dat. the fourth, abl. the fifth, gen. the sixth, loc. the seventh; sg., du., pl. are singular, dual, plural. 1.1.1, vṛddhirādaic. Words: vṛddhiḥ (nom. sg.): vṛddhi, the name of the second grade of strengthening; āt-aic (nom. sg.): ā and the group aic (ai, au): the letters ā, ai, au. Anuvṛtti: none stated. Example: nāyaka, the leader, from nī: the root vowel ī becomes āy, a vṛddhi grade (āy), before the suffix ṇvul. Whitney: § 235, 236. 1.1.2, adeṅ guṇaḥ. Words: at-eṅ (nom. sg.): a and the group eṅ (e, o): the letters a, e, o; guṇaḥ (nom. sg.): guṇa, the name of the first grade of strengthening. Anuvṛtti: none stated. Example: bhavati, from bhū: the ū becomes o, a guṇa vowel (o), and o becomes av before the vowel a. Whitney: § 235, 236. 1.1.3, iko guṇavṛddhī. Words: ikaḥ (gen. sg.): of the group ik (i, u, ṛ, ḷ with their long forms); guṇa-vṛddhī (nom. du.): guṇa and vṛddhi. Anuvṛtti: vṛddhiḥ from 1.1.1; guṇaḥ from 1.1.2. Example: netṛ, from nī: only the ik vowel ī is replaced, by the guṇa vowel e. Whitney: § 235, 236. 1.1.4, na dhātulopa ārdhadhātuke. Words: na (indeclinable): not; dhātulope (loc. sg.): when what is lost belongs to a root; ārdhadhātuke (loc. sg.): before an ārdhadhātuka suffix. Anuvṛtti: ikaḥ, guṇa-vṛddhī from 1.1.3. Example: not located: no example of this rule was read on the sources used. Whitney: § not located. 1.1.5, kṅiti ca. Words: kṅiti (loc. sg.): before a suffix marked k or ṅ; ca (indeclinable): and. Anuvṛtti: ikaḥ, guṇa-vṛddhī from 1.1.3; na from 1.1.4. Example: sunutaḥ, 'the two press', from su: the ending tas counts as ṅit, so u stays, where sunoti, with ti, has guṇa. Whitney: § 698. 1.1.7, halo'nantarāḥ saṃyogaḥ. Words: halaḥ (nom. pl.): consonants; anantarāḥ (nom. pl.): with nothing between them; saṃyogaḥ (nom. sg.): saṃyoga, a cluster of consonants. Anuvṛtti: none stated. Example: asti, 'is': the s and t stand together and make a saṃyoga. Whitney: § not located. 1.1.8, mukhanāsikāvacano'nunāsikaḥ. Words: mukha-nāsikā-vacanaḥ (nom. sg.): spoken through the mouth and the nose; anunāsikaḥ (nom. sg.): anunāsika, nasal. Anuvṛtti: none stated. Example: the five nasal consonants ṅ, ñ, ṇ, n, m, which are the line ñam-ṅaṇa-nam of the Śiva-sūtras, are spoken through the mouth and the nose. Whitney: § not located. 1.1.9, tulyāsyaprayatnaṃ savarṇam. Words: tulya-āsya-prayatnam (nom. sg.): alike in place and effort of the mouth; savarṇam (nom. sg.): savarṇa, of the same class. Anuvṛtti: none stated. Example: a and ā are made at the same place with the same effort, so they are savarṇa. Whitney: § 126. 1.1.10, nājjhalau. Words: na (indeclinable): not; ac-halau (nom. du.): a vowel and a consonant. Anuvṛtti: savarṇam from 1.1.9. Example: definition: no example. Whitney: § not located. 1.1.11, īdūdeddvivacanaṃ pragṛhyam. Words: īt-ūt-et (nom. sg.): ī, ū and e; dvivacanaṃ (nom. sg.): a dual; pragṛhyam (nom. sg.): pragṛhya, a form left without sandhi. Anuvṛtti: none stated. Example: munī imau, 'these two sages': the dual ī stays before a vowel. Whitney: § 138 a. 1.1.23, bahugaṇavatuḍati saṃkhyā. Words: bahu-gaṇa-vatu-ḍati (nom. sg.): bahu, gaṇa and the endings vatu and ḍati; saṃkhyā (nom. sg.): saṃkhyā, number word. Anuvṛtti: none stated. Example: kati, 'how many', ends in ḍati and is a number word. Whitney: § 475. 1.1.27, sarvādīni sarvanāmāni. Words: sarva-ādīni (nom. pl.): the words starting with sarva; sarvanāmāni (nom. pl.): sarvanāma, pronoun. Anuvṛtti: none stated. Example: sarve, the nominative plural of sarva, has the pronoun ending -e and not -āḥ. Whitney: § 524. 1.1.37, svarādinipātamavyayam. Words: svarādi-nipātam (nom. sg.): the nipātas, beginning with svar; avyayam (nom. sg.): avyaya, indeclinable. Anuvṛtti: none stated. Example: iti, 'thus', a nipāta, has one form in every sentence. Whitney: § not located. 1.1.42, śi sarvanāmasthānam. Words: śi (nom. sg.): the ending śi, that is -i of the neuter plural; sarvanāmasthānam (nom. sg.): sarvanāmasthāna, the strong endings. Anuvṛtti: none stated. Example: phalāni, 'fruits': -i is the neuter plural ending śi. Whitney: § 311. 1.1.45, igyaṇaḥ samprasāraṇam. Words: ik (nom. sg.): the group ik (i, u, ṛ, ḷ); yaṇaḥ (gen. sg.): of the group yaṇ (y, v, r, l); samprasāraṇam (nom. sg.): samprasāraṇa, turning a semivowel into its vowel. Anuvṛtti: none stated. Example: uktaḥ, 'said', from vac: the semivowel v of va is replaced by u. Whitney: § 252. 1.1.47, midaco'ntyātparaḥ. Words: mit (nom. sg.): an augment marked m; acaḥ (gen. sg.): after a root ending in a vowel; antyāt (abl. sg.): from the last; paraḥ (nom. sg.): the most close. Anuvṛtti: none stated. Example: phalāni: the augment num (marked m) goes after the last vowel of phala, giving phalani, and the n-ending lengthens to phalāni. Whitney: § not located. 1.1.49, ṣaṣṭhī sthāneyogā. Words: ṣaṣṭhī (nom. sg.): the genitive; sthāne-yogā (nom. sg.): connected with 'in the place of'. Anuvṛtti: none stated. Example: iko yaṇaci, 'yaṇ in place of ik before a vowel': the genitive ikaḥ names what is replaced. Whitney: § not located. 1.1.50, sthāne'ntaratamaḥ. Words: sthāne (loc. sg.): in the place of; antaratamaḥ (nom. sg.): the nearest. Anuvṛtti: none stated. Example: madhvari, 'the enemy of honey' (madhu + ari): of y, v, r, l, the nearest to u is v. Whitney: § 129. 1.1.51, uraṇ raparaḥ. Words: uḥ (gen. sg.): of ṛ; aṇ (nom. sg.): the group aṇ (a, i, u); raparaḥ (nom. sg.): followed by r. Anuvṛtti: ṣaṣṭhī, sthāne from 1.1.49. Example: karoti, 'he does', from kṛ: the ṛ is replaced by a, and an r follows it, giving kar. Whitney: § 236. 1.1.52, alo'ntyasya. Words: alaḥ (gen. sg.): of a single sound; antyasya (gen. sg.): of the last. Anuvṛtti: ṣaṣṭhī, sthāne from 1.1.49. Example: netṛ: of the root nī, only the last sound, ī, is replaced, by e. Whitney: § not located. 1.1.54, ādeḥ parasya. Words: ādeḥ (gen. sg.): of the first; parasya (gen. sg.): of the following. Anuvṛtti: ṣaṣṭhī, sthāne from 1.1.49; alaḥ from 1.1.52. Example: not located: Vasu illustrates the rule with 6.3.97, whose example was not read in a clean form. Whitney: § not located. 1.1.55, anekālśitsarvasya. Words: anekāl-śit (nom. sg.): with several sounds, or marked ś; sarvasya (gen. sg.): of the whole. Anuvṛtti: ṣaṣṭhī, sthāne from 1.1.49. Example: avadhīt, 'he killed': the substitute vadh, of several sounds, replaces the whole root han. Whitney: § not located. 1.1.56, sthānivadādeśo'nalvidhau. Words: sthānivat (indeclinable): like the thing replaced; ādeśaḥ (nom. sg.): ādeśa, the substitute; analvidhau (loc. sg.): in a rule that does not concern a single sound. Anuvṛtti: none stated. Example: not located: no example of this rule was read on the sources used. Whitney: § not located. 1.1.60, adarśanaṃ lopaḥ. Words: adarśanaṃ (nom. sg.): non-appearance; lopaḥ (nom. sg.): lopa, elision. Anuvṛtti: sthāne from 1.1.50. Example: rājñaḥ, 'of the king' (rājan + as): the a of the stem-end -an is not heard in rājñaḥ, it is elided. Whitney: § not located. 1.1.61, pratyayasya lukślulupaḥ. Words: pratyayasya (gen. sg.): of a suffix; luk-ślu-lupaḥ (nom. pl.): luk, ślu and lup. Anuvṛtti: adarśanaṃ from 1.1.60. Example: juhoti, 'he offers', from hu: the suffix śap is elided by ślu, and the root is doubled. Whitney: § not located. 1.1.64, aco'ntyādi ṭi. Words: acaḥ (gen. sg.): after a root ending in a vowel; antya-ādi (nom. sg.): beginning with the last; ṭi (nom. sg.): ṭi, the end part. Anuvṛtti: none stated. Example: rājan: the ṭi is -an, from its last vowel to the end. Whitney: § not located. 1.1.65, alo'ntyāt pūrva upadhā. Words: alaḥ (abl. sg.): of a single sound; antyāt (abl. sg.): from the last; pūrvaḥ (nom. sg.): before; upadhā (nom. sg.): upadhā, the penultimate sound. Anuvṛtti: none stated. Example: gam: the a, before the final m, is the upadhā. Whitney: § not located. 1.1.66, tasminniti nirdiṣṭe pūrvasya. Words: tasmin (loc. sg.): in that (locative); iti (indeclinable): thus, the word iti; nirdiṣṭe (loc. sg.): when indicated; pūrvasya (gen. sg.): of the preceding. Anuvṛtti: none stated. Example: iko yaṇaci: aci, 'before a vowel', is the locative, so the rule acts on the ik vowel just before the vowel. Whitney: § not located. 1.1.67, tasmādityuttarasya. Words: tasmāt (abl. sg.): from that (ablative); iti (indeclinable): thus, the word iti; uttarasya (gen. sg.): of the following. Anuvṛtti: nirdiṣṭe from 1.1.66. Example: ād guṇaḥ: āt, 'after a', is the ablative, so the rule acts on the sound that follows a. Whitney: § not located. 1.1.68, svaṃ rūpaṃ śabdasyāśabdasaṃjñā. Words: svam (nom. sg.): its own; rūpam (nom. sg.): form; śabdasya (gen. sg.): of a word; a-śabdasaṃjñā (nom. sg.): not a name for a word. Anuvṛtti: none stated. Example: agni: a rule that names the word agni applies to that word form and not to its synonyms, as Vasu explains. Whitney: § not located. 1.1.70, taparastatkālasya. Words: taparaḥ (nom. sg.): followed by t; tatkālasya (gen. sg.): of the same duration. Anuvṛtti: svam, rūpam from 1.1.68; savarṇasya from 1.1.69. Example: at: a followed by t stands for short a, in all its varieties, and not for long ā. Whitney: § not located. 1.1.71, ādirantyena sahetā. Words: ādiḥ (nom. sg.): the first; antyena (instr. sg.): with the last; saha (indeclinable): together with; itā (instr. sg.): with the it-marker. Anuvṛtti: svam, rūpam from 1.1.68. Example: ik stands for i, u, ṛ, ḷ and their long forms: from i to the it-letter k. Whitney: § not located. 1.1.72, yena vidhistadantasya. Words: yena (instr. sg.): by which; vidhiḥ (nom. sg.): a rule; tadantasya (gen. sg.): of what ends in it. Anuvṛtti: svam, rūpam from 1.1.68. Example: jeya, 'to be won': the rule 'after vowels' of 3.1.97 means, by this sūtra, after roots ending in a vowel, as Vasu explains with 3.1.97. Whitney: § not located. 1.1.73, vṛddhiryasyācāmādistad vṛddham. Words: vṛddhiḥ (nom. sg.): vṛddhi, the name of the second grade of strengthening; yasya (gen. sg.): of which; acām (gen. pl.): of the vowels; ādiḥ (nom. sg.): the first; tat (nom. sg.): that; vṛddham (nom. sg.): vṛddha, having vṛddhi as first vowel. Anuvṛtti: none stated. Example: bhārataḥ, 'descended from Bharata': its first vowel ā is a vṛddhi vowel. Whitney: § not located. 1.2.45, arthavadadhāturapratyayaḥ prātipadikam. Words: arthavat (nom. sg.): having a meaning; adhātuḥ (nom. sg.): not a root; apratyayaḥ (nom. sg.): not a suffix; prātipadikam (nom. sg.): prātipadika, a noun stem. Anuvṛtti: none stated. Example: rāma is a stem with a meaning, not a root or a suffix: a prātipadika. Whitney: § 98. 1.3.1, bhūvādayo dhātavaḥ. Words: bhū-vā-ādayaḥ (nom. pl.): bhū, vā and the rest; dhātavaḥ (nom. pl.): dhātu, roots. Anuvṛtti: none stated. Example: bhū, 'to be', is the first root of the list. Whitney: § 102. 1.3.2, upadeśe'janunāsika it. Words: upadeśe (loc. sg.): in the original teaching; ac (nom. sg.): a vowel; anunāsikaḥ (nom. sg.): anunāsika, nasal; it (nom. sg.): it, a silent marker. Anuvṛtti: none stated. Example: definition: no example. Whitney: § not located. 1.3.3, halantyam. Words: hal (nom. sg.): a consonant; antyam (nom. sg.): the last. Anuvṛtti: upadeśe, it from 1.3.2. Example: ik: the final k of ik is an it and is not said as part of the sounds. Whitney: § not located. 1.3.9, tasya lopaḥ. Words: tasya (gen. sg.): of that; lopaḥ (nom. sg.): lopa, elision. Anuvṛtti: none stated. Example: bhavati: the suffix śap is a ś-it and p-it, and when the it letters go, only a remains, bhav-a-ti. Whitney: § not located."
