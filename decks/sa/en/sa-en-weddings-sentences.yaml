cards:
  "sa-3980":
    native: "At the wedding a fire burns on the altar."
    bases: { "विवाहे": "at the wedding", "वेद्याम्": "on the altar", "अग्निर्": "fire", "ज्वलति": "to burn (burns)" }
    confusables: { "w1": { why: "Bed or couch for lying on, not altar: पर्यङ्कः (paryaṅkaḥ) means bed or couch for lying on." }, "w2": { why: "Daily sacrifice offered into the household fire, not fire: अग्निहोत्रम् (agnihotram) means daily sacrifice offered into the household fire." }, "w3": { why: "To burn, not to blaze: दह् (dah) means to burn." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अग्निः (agniḥ) is written अग्निर् (agnir) because a final ः (ḥ) after इ (i) becomes र् (r) before a voiced sound, here the start of ज्वलति (jvalati) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174).", "n2": "विवाहे (vivāhe) is the locative case of विवाहः (vivāhaḥ): at the wedding. वेद्याम् (vedyām) is the locative case of वेदिः (vediḥ): on the altar; it keeps its final म् (m) before the vowel of अग्निः (agniḥ)." }
  "sa-3981":
    native: "The bridegroom goes with the procession to the girl's house."
    bases: { "वरो": "bridegroom", "वरयात्रया": "with the procession", "कन्याया": "of the girl", "गृहं": "house", "गच्छति": "to go (goes)" }
    confusables: { "w1": { why: "Loved wife, not girl: वनिता (vanitā) means loved wife." }, "w2": { why: "Lover, not bridegroom: प्रेष्ठः (preṣṭhaḥ) means lover." }, "w3": { why: "To walk, not to go: चल् (cal) means to walk." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वरः (varaḥ) is written वरो (varo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of वरयात्रया (varayātrayā) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). कन्यायाः (kanyāyāḥ) is written कन्याया (kanyāyā) because a final आः (āḥ) loses its visarga before a voiced consonant, here the start of गृहं (gṛhaṃ) (Whitney 177; Aṣṭādhyāyī 8.3.17, भोभगोअघोअपूर्वस्य योऽशि (bhobhago 'ghoapūrvasya yo 'śi), in separate words भो भगो अघो अपूर्वस्य यः अशि (bho bhago agho apūrvasya yaḥ aśi), with 8.3.19, लोपः शाकल्यस्य (lopaḥ śākalyasya)). गृहम् (gṛham) is written गृहं (gṛhaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of गच्छति (gacchati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "वरयात्रया (varayātrayā) is the instrumental case of वरयात्रा (varayātrā): with the wedding procession. कन्यायाः (kanyāyāḥ) is the genitive case of कन्या (kanyā): of the girl. गृहम् (gṛham) is the accusative case: where he goes." }
  "sa-3982":
    native: "At the kanyadana the father gives away his daughter."
    bases: { "कन्यादाने": "at the kanyadana", "कन्यां": "maiden", "ददाति": "to give (gives away)" }
    confusables: { "w1": { why: "Gift of a cow, not gift: गोदानम् (godānam) means gift of a cow." }, "w2": { why: "Mother, not girl: माता (mātā) means mother." }, "w3": { why: "To take, not to give: हृ (hṛ) means to take." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. कन्याम् (kanyām) is written कन्यां (kanyāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of ददाति (dadāti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "कन्यादाने (kanyādāne) is the locative case of कन्यादानम् (kanyādānam), the gift of a maiden in marriage: at that rite. कन्याम् (kanyām) is the accusative case: whom he gives." }
  "sa-3983":
    native: "The bride lives in the bridegroom's house."
    bases: { "वधूर्": "bride", "वरस्य": "of the bridegroom", "गृहे": "in the house", "वसति": "to dwell (lives)" }
    confusables: { "w1": { why: "Wife, not bride: ग्ना (gnā) means wife." }, "w2": { why: "Young woman, not bride: युवतिः (yuvatiḥ) means young woman." }, "w3": { why: "To stand, not to live: स्था (sthā) means to stand." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वधूः (vadhūḥ) is written वधूर् (vadhūr) because a final ः (ḥ) after ऊ (ū) becomes र् (r) before a voiced sound, here the start of वरस्य (varasya) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174).", "n2": "वरस्य (varasya) is the genitive case of वरः (varaḥ): of the bridegroom. गृहे (gṛhe) is the locative case of गृहम् (gṛham): in the house." }
  "sa-3984":
    native: "The priest recites mantras at the altar."
    bases: { "पुरोहितो": "priest", "वेद्यां": "at the altar", "मन्त्रान्": "mantras", "पठति": "to read aloud (recites)" }
    confusables: { "w1": { why: "Devotee, not priest: भक्तः (bhaktaḥ) means devotee." }, "w2": { why: "Bed or couch for lying on, not altar: पर्यङ्कः (paryaṅkaḥ) means bed or couch for lying on." }, "w3": { why: "To hear, not to recite: श्रु (śru) means to hear." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पुरोहितः (purohitaḥ) is written पुरोहितो (purohito) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of वेद्यां (vedyāṃ) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). वेद्याम् (vedyām) is written वेद्यां (vedyāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of मन्त्रान् (mantrān) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "वेद्याम् (vedyām) is the locative case of वेदिः (vediḥ): at the altar. मन्त्रान् (mantrān) is the accusative plural of मन्त्रः (mantraḥ): mantras. पठति (paṭhati) is the present of पठ् (paṭh): reads aloud, recites." }
  "sa-3985":
    native: "The mother gives the girl a bracelet."
    bases: { "बालिकायै": "to the girl", "वलयं": "bracelet", "ददाति": "to give (gives)" }
    confusables: { "w1": { why: "Earring, not bracelet: कुण्डलम् (kuṇḍalam) means earring." }, "w2": { why: "Daughter, not girl: पुत्री (putrī) means daughter." }, "w3": { why: "To take, not to give: हृ (hṛ) means to take." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वलयम् (valayam) is written वलयं (valayaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of ददाति (dadāti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "बालिकायै (bālikāyai) is the dative case of बालिका (bālikā): to the girl. वलयम् (valayam) is the accusative case of वलयः (valayaḥ): what is given." }
  "sa-3986":
    native: "The widow always remembers her husband."
    bases: { "नित्यं": "always", "पतिं": "husband", "स्मरति": "to remember (remembers)" }
    confusables: { "w1": { why: "Woman, not widow: स्त्री (strī) means woman." }, "w2": { why: "Father, not husband: पिता (pitā) means father." }, "w3": { why: "To hear, not to remember: श्रु (śru) means to hear." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. नित्यम् (nityam) is written नित्यं (nityaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पतिं (patiṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). पतिम् (patim) is written पतिं (patiṃ), for the same reason, before स्मरति (smarati).", "n2": "पतिम् (patim) is the accusative case of पतिः (patiḥ): whom she remembers. स्मरति (smarati) is the present of स्मृ (smṛ), with the vowel strengthened: remembers." }
  "sa-3987":
    native: "The young man sees the young woman in the park."
    bases: { "तरुणो": "young man", "युवतिम्": "young woman", "उद्याने": "in the park", "पश्यति": "to see (sees)" }
    confusables: { "w1": { why: "Youth, not young man: युवकः (yuvakaḥ) means youth." }, "w2": { why: "Girl, not young woman: बाला (bālā) means girl." }, "w3": { why: "To look at, not to see: ईक्ष् (īkṣ) means to look at." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. तरुणः (taruṇaḥ) is written तरुणो (taruṇo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of युवतिम् (yuvatim) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "युवतिम् (yuvatim) is the accusative case of युवतिः (yuvatiḥ): whom he sees; it keeps its final म् (m) before the vowel of उद्याने (udyāne). उद्याने (udyāne) is the locative case of उद्यानम् (udyānam): in the park." }
  "sa-3988":
    native: "The graduate gives a fee to the teacher."
    bases: { "स्नातको": "graduate", "गुरवे": "to the teacher", "दक्षिणां": "fee", "ददाति": "to give (gives)" }
    confusables: { "w1": { why: "Teacher, not graduate: अध्यापकः (adhyāpakaḥ) means teacher." }, "w2": { why: "Initiation, not fee: दीक्षा (dīkṣā) means initiation." }, "w3": { why: "To take, not to give: हृ (hṛ) means to take." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. स्नातकः (snātakaḥ) is written स्नातको (snātako) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of गुरवे (gurave) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). दक्षिणाम् (dakṣiṇām) is written दक्षिणां (dakṣiṇāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of ददाति (dadāti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "गुरवे (gurave) is the dative case of गुरुः (guruḥ): to the teacher. दक्षिणाम् (dakṣiṇām) is the accusative case of दक्षिणा (dakṣiṇā): the fee given to a teacher." }
  "sa-3989":
    native: "The mistress of the house looks after the house."
    bases: { "गृहस्य": "of the house", "रक्षां": "protection", "करोति": "to do (does)" }
    confusables: { "w1": { why: "Wife or consort, not mistress: कलत्रम् (kalatram) means wife or consort." }, "w2": { why: "Wife, not mistress: जाया (jāyā) means wife." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. रक्षाम् (rakṣām) is written रक्षां (rakṣāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of करोति (karoti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "गृहस्य (gṛhasya) is the genitive case of गृहम् (gṛham): of the house. रक्षाम् करोति (rakṣām karoti) means does protection, that is, looks after." }
