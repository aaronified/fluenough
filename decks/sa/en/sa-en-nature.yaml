  "sa-5009":
    "native": "Cloud."
    "notes":
      "n1": "Masculine a-stem noun. Stem मेघ (megha); isolated nominative singular मेघः (meghaḥ)."
      "n2": "Before a voiced consonant the final ः (ḥ) of मेघः (meghaḥ) is written ो (o), as in मेघो (megho) (Aṣṭādhyāyī 6.1.113 and 6.1.114; Whitney 175 a)."
      "n3": "Cloud has more than one word in the course: also जलदः (jaladaḥ). They are near synonyms. जलदः (jaladaḥ) means the giver of water, from जल (jala) and the root दा (dā)."
    "bases":
      "मेघः": "cloud"
    "examples":
      "मेघो नीलः":
        "native": "The cloud is dark blue."
        "bases":
          "मेघो": "cloud"
          "नीलः": "dark blue"
      "तत्र मेघो भवति":
        "native": "There is a cloud there."
        "bases":
          "तत्र": "there"
          "मेघो": "cloud"
          "भवति": "is"
