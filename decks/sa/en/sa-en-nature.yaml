"cards":
  "sa-5000":
    "native": "Tree."
    "notes":
      "n1": "Masculine a-stem noun. Stem वृक्ष (vṛkṣa); isolated nominative singular वृक्षः (vṛkṣaḥ)."
      "n2": "Before a voiced consonant the final ः (ḥ) of वृक्षः (vṛkṣaḥ) is written ो (o), as in वृक्षो (vṛkṣo) (Aṣṭādhyāyī 6.1.113 and 6.1.114; Whitney 175 a)."
      "n3": "Tree has more than one word in the course: also द्रुमः (drumaḥ). They are near synonyms."
    "bases":
      "वृक्षः": "tree"
    "examples":
      "वृक्षो विशालः":
        "native": "The tree is vast."
        "bases":
          "वृक्षो": "tree"
          "विशालः": "vast"
      "अत्र वृक्षो भवति":
        "native": "Here there is a tree."
        "bases":
          "अत्र": "here"
          "वृक्षो": "tree"
          "भवति": "is"
