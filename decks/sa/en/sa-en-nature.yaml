  "sa-5011":
    "native": "Sky."
    "notes":
      "n1": "Masculine a-stem noun. Stem आकाश (ākāśa); isolated nominative singular आकाशः (ākāśaḥ)."
      "n2": "Before a voiced consonant the final ः (ḥ) of आकाशः (ākāśaḥ) is written ो (o), as in आकाशो (ākāśo) (Aṣṭādhyāyī 6.1.113 and 6.1.114; Whitney 175 a)."
      "n3": "Sky has more than one word in the course: also गगनम् (gaganam), अन्तरिक्षम् (antarikṣam). They are near synonyms. आकाश (ākāśa) is the open space or ether, गगन (gagana) the sky and अन्तरिक्ष (antarikṣa) the air between earth and heaven, as the dictionaries give them."
    "bases":
      "आकाशः": "sky"
    "examples":
