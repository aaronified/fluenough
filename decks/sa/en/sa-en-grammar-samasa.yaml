name: "Compounds: the kinds of samāsa"
description: "The kinds of Sanskrit compound, dvandva, tatpuruṣa with its case kinds, karmadhāraya, dvigu, bahuvrīhi and avyayībhāva, each with its sūtra and three example compounds. Not yet checked by a Sanskrit speaker: please report any mistake."
