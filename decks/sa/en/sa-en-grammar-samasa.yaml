pattern:
  name: "The kinds of compound"
  slot_name: "example"
  slots:
    "compound-1": "example compound 1"
    "compound-2": "example compound 2"
    "compound-3": "example compound 3"
  entries:
    "dvandva": "द्वन्द्वः (dvandvaḥ). Pāṇini 2.2.29 (the page types it with word-splitting and an anusvāra, so it is cited by number: it says that a dvandva is made for the sense of and). Whitney 1247 calls it a copulative or aggregative compound: words that would be joined by and are joined into one, and it can have two or more members. Examples: मातापितृ (mātāpitṛ): mother and father (Wiktionary names it a dvandva); इन्द्रावरुणौ (indrāvaruṇau): Indra and Varuṇa (Whitney 1247 b); सत्यानृते (satyānṛte): truth and falsehood (Whitney 1247 b)."
    "tp-dvitiya": "द्वितीया-तत्पुरुषः (dvitīyā-tatpuruṣaḥ). Pāṇini 2.1.22 says तत्पुरुषः (tatpuruṣaḥ) and 2.1.24 gives the one whose first member has the second case (dvitīyā) with words such as śrita, atīta, patita and gata (cited by number: the page types it with word-splitting). Whitney 1264 a lists the accusative relation among the dependent compounds. Examples: नगरगमन (nagaragamana): going to the city (Whitney 1264 a, accusative relation); आयुर्दा (āyurdā): life-giving (Whitney 1247 e)."
    "tp-trtiya": "तृतीया-तत्पुरुषः (tṛtīyā-tatpuruṣaḥ). Pāṇini 2.1.30 gives the compound whose first member has the third case (tṛtīyā), as with tatkṛta (made by it) and guṇavacana words (cited by number: word-splitting on the page). Whitney 1264 a lists the instrumental relation. Examples: हस्तकृत (hastakṛta): made with the hands (Whitney 1247 e); आत्मसादृश्य (ātmasādṛśya): likeness with self (Whitney 1264 a, instrumental relation); धान्यार्थ (dhānyārtha): wealth acquired by grain (Whitney 1264 a)."
    "tp-caturthi": "चतुर्थी-तत्पुरुषः (caturthī-tatpuruṣaḥ). Pāṇini 2.1.36 gives the compound whose first member has the fourth case (caturthī) with words such as artha, bali, hita, sukha and rakṣita (cited by number: word-splitting on the page). Examples: पादोदक (pādodaka): water for the feet, water used for washing the feet (Wiktionary; Whitney 1247 e); पादत्राण (pādatrāṇa): a shoe, protection for the feet (Wiktionary); मासनिचय (māsanicaya): accumulation for a month (Whitney 1264 a)."
    "tp-pancami": "पञ्चमी-तत्पुरुषः (pañcamī-tatpuruṣaḥ). Pāṇini 2.1.37 says पञ्चमी भयेन (pañcamī bhayena): the fifth case (pañcamī) with the word bhaya, fear. Examples: मद्वियोग (madviyoga): separation from me (Whitney 1264 a, ablative relation); अप्सरःसम्भव (apsaraḥsambhava): descent from a nymph (Whitney 1264 a)."
    "tp-sasthi": "षष्ठी-तत्पुरुषः (ṣaṣṭhī-tatpuruṣaḥ). Pāṇini 2.2.8 says षष्ठी (ṣaṣṭhī): the sixth case (ṣaṣṭhī), the relation of belonging, which is the commonest (Whitney 1264: it is oftenest genitive). Examples: राजधानी (rājadhānī): a king's residence, a capital (Wiktionary); विद्यालय (vidyālaya): a school, a place of gaining knowledge (Wiktionary); हिमपात (himapāta): snowfall (Wiktionary)."
    "tp-saptami": "सप्तमी-तत्पुरुषः (saptamī-tatpuruṣaḥ). Pāṇini 2.1.40 says सप्तमी शौण्डैः (saptamī śauṇḍaiḥ): the seventh case (saptamī) with words such as śauṇḍa. Whitney 1264 a lists the locative relation. Examples: जलक्रीडा (jalakrīḍā): sport in the water (Whitney 1264 a, locative relation); ग्रामवास (grāmavāsa): abode in the village (Whitney 1264 a); जलचर (jalacara): water-goer, an aquatic animal (Wiktionary names it a tatpuruṣa)."
    "tp-nan": "नञ्-तत्पुरुषः (nañ-tatpuruṣaḥ). Pāṇini 2.2.6 says नञ् (nañ): the negative nañ (a-, an-) makes a tatpuruṣa with the word after it. Examples: अधर्म (adharma): unrighteousness, from a- (not) and dharma (Wiktionary); अज्ञान (ajñāna): ignorance, from a- and jñāna (Wiktionary); अमित्र (amitra): an enemy, from a- and mitra (Wiktionary; Whitney 1247 e)."
    "karmadharaya": "कर्मधारयः (karmadhārayaḥ). Pāṇini 2.1.57 says विशेषणं विशेष्येण बहुलम् (viśeṣaṇaṃ viśeṣyeṇa bahulam): a qualifier joins the word it qualifies. This is Whitney's descriptive determinative (1279, 1280): the first member qualifies the second adjectively, and no case relation is expressed. Examples: महर्षि (maharṣi): a great sage, a compound of mahā (great) and ṛṣi (Wiktionary; Whitney 1247 e); प्रियसखि (priyasakhi): dear friend (Whitney 1247 e); सुकृत (sukṛta): well done (Whitney 1247 e)."
    "dvigu": "द्विगुः (dviguḥ). Pāṇini 2.1.23 says द्विगुश्च (dviguśca) and 2.1.52 says संख्यापूर्वो द्विगुः (saṃkhyāpūrvo dviguḥ): a compound whose first member is a number is a dvigu. Whitney 1312 says the Hindus treat compounds with a numeral first member as a separate class, called dvigu. Examples: सप्ताह (saptāha): a week, from sapta (seven) and ahar (day) (Wiktionary); त्रिलोक (triloka): the three worlds (Wiktionary names it a dvigu compound); पञ्चयोजन (pañcayojana): a space of five leagues (Whitney 1312 b)."
    "bahuvrihi": "बहुव्रीहिः (bahuvrīhiḥ). Pāṇini 2.2.23 says शेषो बहुव्रीहिः (śeṣo bahuvrīhiḥ): a bahuvrīhi is the remainder, a compound that is neither of the other kinds because it points to a third thing. Whitney 1293 calls it a possessive: a determinative that has an adjective inflection and means having or possessing what the determinative means. Examples: महात्मन् (mahātman): having a great soul, magnanimous, from mahā and ātman (Wiktionary); चक्रपाणि (cakrapāṇi): discus-handed, a name of Viṣṇu (Wiktionary); उग्रबाहु (ugrabāhu): having powerful arms (Whitney 1298 a)."
    "avyayibhava": "अव्ययीभावः (avyayībhāvaḥ). Pāṇini 2.1.5 says अव्ययीभावः (avyayībhāvaḥ). Whitney 1313 says the adverbially used accusatives of adjective compounds that have an indeclinable or particle as first member are the avyayībhāva, which is reckoned by the Hindu grammarians as a separate class. Examples: प्रतिदिनम् (pratidinam): day by day, every day (Wiktionary); उपनदि (upanadi): near the river (Whitney 1313 b); प्रतिनिशम् (pratiniśam): every night (Whitney 1313 b)."
  notes: "A samāsa joins two or more words into one (Pāṇini 2.1.3 and 2.1.4 begin the chapter on it) and the whole is treated as a single word: only its last member takes the case ending. Whitney 1247 sorts the compounds into three principal classes: copulative (dvandva), determinative (tatpuruṣa and karmadhāraya) and possessive (bahuvrīhi); the Hindu grammarians add dvigu and avyayībhāva (1312, 1313). The tatpuruṣa rows are named for the case of the first member (Pāṇini 2.1.24 to 2.1.40). When two words could be read as more than one kind the context decides. A bahuvrīhi is the same string of words as a tatpuruṣa read differently: mahātman (great and soul) is a karmadhāraya meaning a great soul and a bahuvrīhi meaning one who has a great soul."
