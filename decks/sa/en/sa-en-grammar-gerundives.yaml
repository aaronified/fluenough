name: "Gerundives: -tavya, -anīya and -ya"
description: "The gerundives, the adjectives for what must or ought to be done, of the verbs of the course: the three suffixes, how the root changes before each, and the passive sense with the doer in the instrumental. Forms Wiktionary does not list are made by the rules and marked derived in the review queue. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "gerundive"
  slots:
    "tavya": "gerundive in -tavya (to be, must be)"
    "aniya": "gerundive in -anīya (to be, worth being)"
    "ya": "gerundive in -ya (yat, ṇyat or kyap)"
rules:
  "sa-rule-gerundive-tavya":
    name: "Gerundive in -tavya: what must be done"
    explanation: "Pāṇini 3.1.95, {1}, names the group of suffixes called kṛtya, and 3.1.96, {2} (as typed on the page, in words), lists tavya and anīya among them. Whitney 961 to 964 calls the word they make a gerundive, or future passive participle: an adjective for what is to be done or ought to be done. The suffix -tavya is added to the stem of the infinitive (Whitney 963): the root has guṇa and takes the joining i where the infinitive does, so {3} gives {4}, {5} gives {6}, and {7} gives {8} and {9} gives {10}. The sense is passive: the thing is in the nominative and the doer in the instrumental, {11} (it is to be done by you); of a verb with no object the neuter singular is impersonal, {12} (I must go, literally it is to be gone by me). Pāṇini 3.4.70, {13}, limits the kṛtya suffixes to the sense of the object and of the action itself."
  "sa-rule-gerundive-aniya":
    name: "Gerundive in -anīya: the form of the action noun"
    explanation: "The second kṛtya suffix of Pāṇini 3.1.96 is anīya, {1}. Whitney 964 says it is made by adding the adjective suffix īya to the action noun in ana, so the root takes the strengthening, and the ṇ after r or ṣ, that the noun in ana has (see the kṛt unit): {2} gives {3}, {4} gives {5}, {6} gives {7}, {8} gives {9} and {10} gives {11} (drinkable, drink). It has the same passive sense as -tavya: {7} is what is to be done. Whitney 964 notes that it is rarer than -tavya in the later language."
  "sa-rule-gerundive-ya":
    name: "Gerundive in -ya (yat, ṇyat, kyap): the root before ya"
    explanation: "The third suffix is ya, which has three forms in Pāṇini's rules. 3.1.97, {1}, gives yat after a root that ends in a vowel, with guṇa: {2} gives {3}, {4} gives {5}, {6} gives {7} and {8} gives {9}; Whitney 962 says that a final ā becomes e before it, as in {10}, {11}, {12}, {13}, {14}, {15} and {16}, {17}. 3.1.124, {18}, gives ṇyat after a final ṛ or a consonant, with vṛddhi: {19} gives {20}, {21} gives {22}, {23} gives {24} and {25} gives {26}, and {27} gives {28}, the c becoming k before ṇyat as in the kṛt unit. A root that ends in p, ph, b, bh or m after a short a takes the plain yat without vṛddhi by 3.1.98, {29}, as typed: {30} gives {31}, {32} gives {33} and {34} gives {35}; so does {36}, {37}, by 3.1.100, {38}, when it has no prefix. A root with a medial ṛ has kyap, which strengthens nothing: 3.1.110, {39}, as typed, gives {40} and {41}. Where Wiktionary lists no gerundive in ya the cell is made by these rules and queued as derived."
