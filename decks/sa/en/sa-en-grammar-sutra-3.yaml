native: { code: "en", iso639_3: "eng", name: "English" }
name: "Reading the Aṣṭādhyāyī 3: the kāraka sūtras and the terms of 1.4"
description: "Thirty-nine sūtras of Pāṇini read in the text: the six kārakas (apādāna, sampradāna, karaṇa, adhikaraṇa, karman, kartṛ) and their extensions, the names pada, nadī, guru, bha, upasarga, gati, parasmaipada and ātmanepada, and the persons and numbers of 1.4. Each row gives the sūtra, its split into words, what is carried in from earlier rules, and an example from the course. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
pattern:
  name: "Sūtras read in the text"
  slot_name: "part"
  slots:
    "sutra": "the sūtra, as the page and the text give it"
    "padaccheda": "the sūtra split into its words (padaccheda)"
    "anuvrtti": "the words carried in from earlier sūtras (anuvṛtti)"
    "example": "an example the rule governs"
  entries:
    "1-4-1": "the heading for the following rules up to 2.2.38: a thing gets one name only"
    "1-4-2": "when two rules clash, the one later in the text prevails"
    "1-4-3": "the endings ī and ū of words for a woman, and the words that take them, are called nadī"
    "1-4-11": "a short vowel before a consonant cluster is called guru, heavy"
    "1-4-12": "a long vowel is also called guru, heavy"
    "1-4-14": "a word that ends in a sup (case ending) or a tiṅ (verb ending) is called pada"
    "1-4-18": "before a suffix that starts with y or a vowel (other than a strong ending), the stem is called bha"
    "1-4-21": "for more than two, the plural is used"
    "1-4-22": "for two, the dual is used, and for one, the singular"
    "1-4-23": "the heading for the rules that follow: in the matter of a kāraka, the role of a noun in the action"
    "1-4-24": "what stays fixed when two things part is called apādāna, the source"
    "1-4-25": "with verbs of fearing and protecting, what causes the fear is also called apādāna"
    "1-4-30": "the source of a thing that is born is also called apādāna"
    "1-4-31": "the place where something comes into being is also called apādāna"
    "1-4-32": "the one whom the doer wishes to reach by the object, the recipient, is called sampradāna"
    "1-4-33": "with verbs meaning to please, the one pleased is also called sampradāna"
    "1-4-42": "the most effective means of an action is called karaṇa, the instrument"
    "1-4-43": "with the verb div, to play at dice, the most effective means is also called karman"
    "1-4-45": "the support of an action is called adhikaraṇa, the place"
    "1-4-46": "the support of the verbs śī (to lie), sthā (to stand) and ās (to sit), after adhi, is called karman"
    "1-4-49": "what the doer most wishes to reach is called karman, the object"
    "1-4-50": "what is joined to the action in the same way, though not wished for, is also called karman"
    "1-4-51": "a thing not otherwise expressed, with roots that take two objects, is also called karman"
    "1-4-54": "the doer who is independent in the action is called kartṛ"
    "1-4-55": "the one who sets the doer going is called hetu, as well as kartṛ"
    "1-4-57": "ca and the others of its list, when they do not name a thing, are called nipāta"
    "1-4-58": "pra and the others of its list are called nipāta"
    "1-4-59": "pra and the others of its list, when joined to a verb, are called upasarga, prefix"
    "1-4-60": "pra and the others of its list, when joined to a verb, are also called gati"
    "1-4-83": "the heading for the following rules: these words are called karmapravacanīya, words that govern a case without being joined to a verb"
    "1-4-99": "the l-affixes (tip, tas, jhi and the rest) are called parasmaipada"
    "1-4-100": "the l-affixes beginning with ta, and the affixes śānac and kānac, are called ātmanepada"
    "1-4-101": "the nine tiṅ endings fall into three groups, called prathama (third person), madhyama (second person) and uttama (first person)"
    "1-4-102": "in each group of three, the endings are in turn singular, dual and plural"
    "1-4-104": "the sup and tiṅ endings are also called vibhakti"
    "1-4-107": "when asmad, I, is the doer, the uttama (first person) endings are used"
    "1-4-108": "with any other doer (not yuṣmad or asmad), the prathama (third person) endings are used"
    "1-4-109": "the closest contact of sounds is called saṃhitā"
    "1-4-110": "a pause is called avasāna"
  notes: "Sūtra numbers are those of the page, in the form chapter.pāda.sūtra. Each row is one sūtra of Pāṇini. The words of each sūtra are glossed below with the case (vibhakti) and number the padaccheda gives, and the words carried in from earlier rules are named. Case and number: nom. is the first case, acc. the second, instr. the third, dat. the fourth, abl. the fifth, gen. the sixth, loc. the seventh; sg., du., pl. are singular, dual, plural. 1.4.1, ā kaḍārādekā saṃjñā. Words: ā (indeclinable): up to (and not including); kaḍārāt (abl. sg.): from the word kaḍāra, that is the rule 2.2.38 (kaḍārāḥ karmadhāraye); ekā (nom. sg.): one; saṃjñā (nom. sg.): saṃjñā, a name. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1). 1.4.2, vipratiṣedhe paraṃ kāryam. Words: vipratiṣedhe (loc. sg.): in a conflict between two rules; param (nom. sg.): the later one; kāryam (nom. sg.): the effect, the operation. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1). 1.4.3, yū stryākhyau nadī. Words: yū: the endings ī and ū; strī-ākhyau (nom. du.): two words naming a woman; nadī (nom. sg.): nadī, the name of the class of ī and ū feminines. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1). Example: nadī, 'river': a word in ī, the model of the nadī class. 1.4.11, saṃyoge guru. Words: saṃyoge (loc. sg.): before a cluster; guru (nom. sg.): guru, heavy. Anuvṛtti: hrasvam from 1.4.10. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1). Example: asti: the short a is followed by the cluster st, so it is heavy. 1.4.12, dīrghaṃ ca. Words: dīrgham (nom. sg.): a long vowel; ca (indeclinable): and. Anuvṛtti: guru from 1.4.11. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1). Example: rāma: the first vowel is long, so the syllable is heavy. 1.4.14, suptiṅantaṃ padam. Words: sup-tiṅ-antam (nom. sg.): ending in a sup (case ending) or tiṅ (verb ending); padam (nom. sg.): pada, a complete word. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1). Example: gacchati, 'he goes', ends in the tiṅ ending ti, so it is a pada. 1.4.18, yaci bham. Words: yaci (loc. sg.): before a suffix starting with y or a vowel; bham (nom. sg.): bha, the name of the weak stem. Anuvṛtti: svādiṣu, asarvanāmasthāne from 1.4.17. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1). Example: rājñaḥ, 'of the king': the stem rājan is bha before the vowel ending as. 1.4.21, bahuṣu bahuvacanam. Words: bahuṣu (loc. pl.): for many; bahuvacanam (nom. sg.): the plural. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1). Example: rāmāḥ, 'the Rāmas', is the nominative plural. 1.4.22, dvyekayordvivacanaikavacane. Words: dvi-ekayoḥ (loc. du.): for two and for one; dvivacana-ekavacane (nom. du.): the dual and the singular. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1). Example: rāmau, 'the two Rāmas', is the dual, and rāmaḥ the singular. 1.4.23, kārake. Words: kārake (loc. sg.): in the matter of a kāraka. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), kārake (1.4.23). 1.4.24, dhruvamapāye'pādānam. Words: dhruvam (nom. sg.): fixed; apāye (loc. sg.): in separation; apādānam (nom. sg.): apādāna, the source. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), kārake (1.4.23). Example: vṛkṣāt, 'from the tree': the tree stays fixed while the leaf falls away. 1.4.25, bhītrārthānāṃ bhayahetuḥ. Words: bhī-trā-arthānām (gen. pl.): of the verbs meaning to fear and to protect; bhayahetuḥ (nom. sg.): the cause of fear. Anuvṛtti: apādānam from 1.4.24. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), kārake (1.4.23). Example: caurāt, 'from the thief' in caurād bibheti, 'he fears the thief': the thief is the cause of fear. 1.4.30, janikartuḥ prakṛtiḥ. Words: janikartuḥ (gen. sg.): of the doer of being born; prakṛtiḥ (nom. sg.): the source. Anuvṛtti: apādānam from 1.4.24. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), kārake (1.4.23). Example: krodhaḥ in kāmāt krodho jāyate, 'anger is born of desire': kāma is the source of the one born. 1.4.31, bhuvaḥ prabhavaḥ. Words: bhuvaḥ (gen. sg.): of bhū, to arise; prabhavaḥ (nom. sg.): the place of origin. Anuvṛtti: apādānam from 1.4.24; kartuḥ from 1.4.30. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), kārake (1.4.23). Example: Gaṅgā in himavato gaṅgā prabhavati, 'the Gaṅgā rises from the Himālaya': himavat is the place of origin. 1.4.32, karmaṇā yamabhipraiti sa sampradānam. Words: karmaṇā (instr. sg.): by the object (by the act of giving); yam (acc. sg.): whom; abhipraiti (verb form): he intends to reach; saḥ (nom. sg.): s; sampradānam (nom. sg.): sampradāna, the recipient. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), kārake (1.4.23). Example: putrāya, 'to the son', in pitā putrāya phalaṃ dadāti: the son is the recipient. 1.4.33, rucyarthānāṃ prīyamāṇaḥ. Words: ruci-arthānām (gen. pl.): of the verbs meaning to please; prīyamāṇaḥ (nom. sg.): the one being pleased. Anuvṛtti: sampradānam from 1.4.32. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), kārake (1.4.23). Example: rāmāya, 'to Rāma', in rāmāya rocate phalam, 'Rāma likes the fruit': Rāma is the one pleased. 1.4.42, sādhakatamaṃ karaṇam. Words: sādhakatamam (nom. sg.): the most effective means; karaṇam (nom. sg.): karaṇa, the instrument. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), kārake (1.4.23). Example: bāṇena, 'with an arrow', in rāmo bāṇena rāvaṇaṃ hanti: the arrow is the means. 1.4.43, divaḥ karma ca. Words: divaḥ (gen. sg.): of div, to gamble; karma (nom. sg.): karman, the object; ca (indeclinable): and. Anuvṛtti: sādhakatamam, karaṇam from 1.4.42. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), kārake (1.4.23). Example: akṣān dīvyati, 'he plays with dice': the dice, the means, are put in the accusative as a karman. 1.4.45, ādhāro'dhikaraṇam. Words: ādhāraḥ (nom. sg.): the support; adhikaraṇam (nom. sg.): adhikaraṇa, the place or support. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), kārake (1.4.23). Example: tileṣu, 'in the sesame seeds', in tileṣu tailam asti: the sesame is the support. 1.4.46, adhiśīṅsthā''sāṃ karma. Words: adhi-śīṅ-sthā-āsām (gen. pl.): of adhi with śī (to lie), sthā (to stand) and ās (to sit); karma (nom. sg.): karman, the object. Anuvṛtti: ādhāraḥ from 1.4.45. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), kārake (1.4.23). Example: grāmam adhitiṣṭhati, 'he lives in the village': with adhi, the village is a karman and takes the accusative. 1.4.49, karturīpsitatamaṃ karma. Words: kartuḥ (gen. sg.): of the doer; īpsitatamam (nom. sg.): what is most wished for; karma (nom. sg.): karman, the object. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), kārake (1.4.23). Example: taṇḍulān, 'the rice', in pācakaḥ taṇḍulān pacati: the rice is what the cook wants to reach. 1.4.50, tathāyuktaṃ cānīpsitam. Words: tathā (indeclinable): in the same way; yuktam (nom. sg.): connected; ca (indeclinable): and; anīpsitam (nom. sg.): what is not wished for. Anuvṛtti: karma from 1.4.49. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), kārake (1.4.23). Example: tṛṇaṃ spṛśati, 'he touches grass' on the way to the village: the grass is not wished for but is also a karman. 1.4.51, akathitaṃ ca. Words: akathitam (nom. sg.): what has not been otherwise expressed; ca (indeclinable): and. Anuvṛtti: karma from 1.4.49. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), kārake (1.4.23). Example: gāṃ dogdhi payaḥ, 'he milks the cow for milk': both the cow and the milk are karman. 1.4.54, svatantraḥ kartā. Words: svatantraḥ (nom. sg.): independent; kartā (nom. sg.): kartṛ, the doer. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), kārake (1.4.23). Example: rāmaḥ in rāmo bāṇena rāvaṇaṃ hanti: Rāma is the independent doer. 1.4.55, tatprayojako hetuśca. Words: tat-prayojakaḥ (nom. sg.): the one who sets that (doer) going; hetuḥ (nom. sg.): hetu, the cause; ca (indeclinable): and. Anuvṛtti: kartā from 1.4.54. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), kārake (1.4.23). Example: pācayati, 'he has it cooked', the causative: the one who sets the cook to work is the hetu. 1.4.57, cādayo'sattve. Words: ca-ādayaḥ (nom. pl.): ca and the rest; asattve (loc. sg.): when not naming a thing. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), prāgrīśvarānnipātāḥ (1.4.56). Example: ca, 'and', is a nipāta: a word that does not change. 1.4.58, prādayaḥ. Words: pra-ādayaḥ (nom. pl.): pra and the rest. Anuvṛtti: asattve from 1.4.57. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), prāgrīśvarānnipātāḥ (1.4.56). Example: pra, 'forth', is a nipāta. 1.4.59, upasargāḥ kriyāyoge. Words: upasargāḥ (nom. pl.): upasarga, prefixes; kriyāyoge (loc. sg.): in connection with a verb. Anuvṛtti: prādayaḥ from 1.4.58. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), prāgrīśvarānnipātāḥ (1.4.56). Example: pragacchati, 'he goes forth': pra is joined to the verb gacchati, so it is an upasarga. 1.4.60, gatiśca. Words: gatiḥ (nom. sg.): gati, the name of a prefix-like word with a verb; ca (indeclinable): and. Anuvṛtti: prādayaḥ from 1.4.58; kriyāyoge from 1.4.59. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), prāgrīśvarānnipātāḥ (1.4.56). Example: praṇayati, 'he leads forth': pra with the verb nī is a gati too. 1.4.83, karmapravacanīyāḥ. Words: karmapravacanīyāḥ (nom. pl.): karmapravacanīya, words that govern a case without being joined to a verb. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1), prāgrīśvarānnipātāḥ (1.4.56), karmapravacanīyāḥ (1.4.83). 1.4.99, laḥ parasmaipadam. Words: laḥ (gen. sg.): of the l-affixes (the tenses and moods); parasmaipadam (nom. sg.): parasmaipada, the endings for another. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1). Example: gacchati, 'he goes': the ending ti is a parasmaipada ending. 1.4.100, taṅānāvātmanepadam. Words: taṅānau (nom. du.): the group taṅ (ta, ātām, ...) and the affixes ānac (śānac, kānac); ātmanepadam (nom. sg.): ātmanepada, the endings for oneself. Anuvṛtti: laḥ from 1.4.99. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1). Example: vartate, 'he is': the ending te is an ātmanepada ending. 1.4.101, tiṅastrīṇi trīṇi prathamamadhyamottamāḥ. Words: tiṅaḥ (gen. sg.): of the tiṅ endings; trīṇi (nom. pl.): three; trīṇi (nom. pl.): three; prathama-madhyama-uttamāḥ (nom. pl.): prathama, madhyama, uttama (third, second, first person). Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1). Example: pacati, pacasi, pacāmi: 'he cooks, you cook, I cook', in the order prathama, madhyama, uttama. 1.4.102, tānyekavacanadvivacanabahuvacanānyekaśaḥ. Words: tāni (nom. pl.): these; ekavacana-dvivacana-bahuvacanāni (nom. pl.): the singular, the dual, the plural; ekaśaḥ (indeclinable): one each. Anuvṛtti: tiṅaḥ, trīṇi from 1.4.101. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1). Example: pacati, pacataḥ, pacanti: 'he cooks, they two cook, they cook', singular, dual, plural. 1.4.104, vibhaktiśca. Words: vibhaktiḥ (nom. sg.): vibhakti, a case or person ending; ca (indeclinable): and. Anuvṛtti: tiṅaḥ, trīṇi from 1.4.101; supaḥ from 1.4.103. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1). Example: rāmāya, 'for Rāma': the ending āya is a vibhakti, a case ending. 1.4.107, asmadyuttamaḥ. Words: asmadi (loc. sg.): when asmad is used; uttamaḥ (nom. sg.): uttama, the first person. Anuvṛtti: samānādhikaraṇe, sthānini, api from 1.4.105. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1). Example: ahaṃ pacāmi, 'I cook': asmad is in the sentence, so uttama pacāmi. 1.4.108, śeṣe prathamaḥ. Words: śeṣe (loc. sg.): for the remaining; prathamaḥ (nom. sg.): prathama, the third person. Anuvṛtti: samānādhikaraṇe, sthānini, api from 1.4.105. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1). Example: sa pacati, 'he cooks': sa is neither you nor I, so the prathama pacati. 1.4.109, paraḥ sannikarṣaḥ saṃhitā. Words: paraḥ (nom. sg.): the most close; sannikarṣaḥ (nom. sg.): closeness; saṃhitā (nom. sg.): saṃhitā, sandhi. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1). Example: ityādi: iti and ādi join without a pause, in saṃhitā. 1.4.110, virāmo'vasānam. Words: virāmaḥ (nom. sg.): a pause; avasānam (nom. sg.): avasāna, the end. Anuvṛtti: none stated. Adhikāra in force: ākaḍārāt ekā saṃjñā (1.4.1)."
