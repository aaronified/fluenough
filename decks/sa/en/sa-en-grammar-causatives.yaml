name: "The causative: ṇic, vṛddhi and the p"
description: "The causative of the verbs of the course: the stem in -aya with vṛddhi or guṇa of the root and the p that most roots in ā take, and its nine present active forms. Stems Wiktionary does not list are made by the rules and marked derived in the review queue. Not yet checked by a Sanskrit speaker: please report any mistake. For the verbs of sa-verbs-3 a cell holds only a form read on the en.wiktionary.org root page or conjugation table, or made by a rule marked in the review queue; an empty cell means none was found."
