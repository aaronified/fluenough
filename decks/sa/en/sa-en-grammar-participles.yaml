    "sanac": "present middle participle (śānac), stem"
rules:
  "sa-rule-participle-kta":
    name: "Past passive participle (kta): -ta"
    explanation: "The past passive participle is made with the suffix ta (or na in a few verbs) and is called kta. Pāṇini 1.1.26 says {1}: kta and ktavatu are called niṣṭhā, and 3.2.102 says {2} for the past (3.2.84 says {3}, in the past). Whitney 952 says it is formed with an accented ta, or na, and qualifies anything as having endured the action, so it is usually called the passive participle: from {4} comes {5} (done), from {6} comes {7} (gone), from {8} comes {9} (led). It is added to the bare root (953) or with a joining i, as {10} (read) from {11} (956). The stem changes in many verbs and the form is learned with the verb: {12} (drunk), {13} (put) and {14} (carried). A verb that does not take an object, or a verb of motion, can have the participle in the active sense, as {7} means gone (Pāṇini 3.4.70 says {15}: the suffixes kṛtya, kta and khal only in the two senses that 3.4.69 names, the object (karman) and the action (bhāva); 3.4.71 and 3.4.72 add the active sense for some verbs, and are cited by number only because the sa.wikisource page types them with errors or word-splitting). Where Wiktionary lists several participles for a verb the first one is taught."
  "sa-rule-participle-ktavatu":
    name: "Past active participle (ktavatu): -tavat"
    explanation: "The past active participle is called ktavatu: Pāṇini 1.1.26 puts it with kta under the name niṣṭhā, and 3.2.102 gives both for the past. Whitney 959 says it is made from the past passive participle by adding the possessive suffix vant, and has the meaning and construction of a perfect active participle: {1} (one who has done), from {2}. The stem is the kta form with -vat: {3} from {4}, {5} from {6} and {7} from {8}. Its feminine ends in -vatī (Whitney 959): {9}."
  "sa-rule-participle-satr":
    name: "Present active participle (śatṛ): -at"
    explanation: "The present active participle is called śatṛ: Pāṇini 3.2.124 gives śatṛ and śānac for laṭ (the sa.wikisource page types it with errors, so only its number is given; 3.2.130 and 3.2.127 are sūtras of the same group). Whitney 584 says the active participial ending is -ant, weak form -at, and the feminine -antī or -atī. The stem is the present stem with -at: {1} from {2} (being), {3} from {4} (going), {5} from {6} (doing). It is declined like other stems in -at: see the declension deck. Its use: it says an action at the same time as the main verb: 'the one going', 'while going'. A verb that takes only the middle voice has no śatṛ cell."
  "sa-rule-participle-sanac":
    name: "Present middle participle (śānac): -māna, -āna"
    explanation: "The present middle participle is called śānac: Pāṇini 3.2.124 gives it with śatṛ for laṭ (only its number is given, as above). Whitney 584 says the middle participial ending is -āna, feminine -ānā. The cell shows {1} (getting) from {2}, {3} (turning) from {4}, with -māna after a stem in a, and -āna or -āṇa after other stems: {5} from {6}, {7} from {8}, {9} from {10}. Only the verbs that take the middle voice have a śānac cell; the stem is declined like an a-stem noun, as the verbs of the unit on a-stems."
