description: "Short lines from the Mahābhārata, the Rāmāyaṇa and the court poets Kālidāsa, Bhāravi, Māgha, Aśvaghoṣa, Bhavabhūti and Śūdraka, texts in the public domain, each with its date as an English Wikipedia article gives it, where its words come from and a note on how its words join. Not yet checked by a Sanskrit speaker: please report any mistake."

cards:
  "sa-8017":
    native: "Having bowed to Nārāyaṇa, and to Nara, the best of men, and to the goddess Sarasvatī, one should then recite the Jaya."
    notes:
      "n1": "The English Wikipedia says the Mahābhārata is attributed to Vyāsa and that the bulk of it was probably compiled between the 3rd century BCE and the 3rd century CE. The Sanskrit Wikipedia article quotes this verse as a famous verse found at the start of each chapter and says the first stage of the work was called Jaya."
      "n2": "The verb उदीरयेत् (udīrayet) is an optative of a causative stem, \"one should recite aloud\". नमस्कृत्य (namaskṛtya) is an absolutive, \"having bowed\". The particle च (ca) joins एव (eva) in चैव (caiva), where a and e make ai, and जयम् (jayam) and उदीरयेत् (udīrayet) join as जयमुदीरयेत् (jayamudīrayet). Joined words, split: namaskṛtya = namas + kṛ; caiva = ca + eva; narottamam = nara + uttama; jayamudīrayet = jaya + udīrayati."
    bases:
      "नारायणं": "Nārāyaṇa"
      "नमस्कृत्य": "bow + to do (having bowed)"
      "नरं": "Nara, man"
      "चैव": "and + indeed"
      "नरोत्तमम्": "man + best"
      "देवीं": "goddess"
      "सरस्वतीं": "Sarasvatī"
      "ततो": "then"
      "जयमुदीरयेत्": "victory, the Jaya + to speak aloud (one should recite)"
  "sa-8018":
    native: "The ascetic Vālmīki asked Nārada, the best of sages, who was devoted to austerity and study and the foremost of those who know speech."
    notes:
      "n1": "The first verse of the Bālakāṇḍa, the first book. The English Wikipedia describes the Rāmāyaṇa as a Hindu smṛti epic poem, traditionally attributed to Vālmīki, of nearly 24,000 śloka (verses) in seven kāṇḍas, with the first and last books considered later additions to the oldest books two to six."
      "n2": "The verb परिपप्रच्छ (paripapraccha, asked) is a perfect form of प्रच्छ् (prach, to ask) with the prefix परि (pari); the first syllable is doubled, a mark of the perfect, which the epics use to tell past events. The visarga of वाल्मीकिः (vālmīkiḥ) becomes r before the voiced m of मुनिपुङ्गवम् (munipuṅgavam): वाल्मीकिर्मुनिपुङ्गवम् (vālmīkirmunipuṅgavam). Joined words, split: svādhyāyanirataṃ = svādhyāya + nirata; paripapraccha = pari + pracch; vālmīkirmunipuṅgavam = vālmīki + munipuṅgava."
    bases:
      "तपः": "austerity"
      "स्वाध्यायनिरतं": "study, recitation + devoted"
      "तपस्वी": "ascetic"
      "वाग्विदां": "knower of speech (of those who know speech)"
      "वरम्": "best"
      "नारदं": "Nārada"
      "परिपप्रच्छ": "around + to ask (he asked)"
      "वाल्मीकिर्मुनिपुङ्गवम्": "Vālmīki + best of sages"
  "sa-8019":
    native: "May you not find a lasting place for endless years, hunter, because you killed one of a pair of krauñca birds, who was lost in love."
    notes:
      "n1": "This verse is one śloka, which the English Wikipedia says is a couplet, two lines. The article describes the Rāmāyaṇa as an epic of nearly 24,000 such verses in seven kāṇḍas, traditionally attributed to Vālmīki, and dates its primary composition to between 750 BCE and 500 BCE."
      "n2": "मा (mā) with the form अगमः (agamaḥ) is a prohibition or a curse, \"may you not get\". त्वम् (tvam) and अगमः (agamaḥ) join as त्वमगमः (tvamagamaḥ). क्रौञ्चमिथुनात् (krauñcamithunāt, from the krauñca pair), एकम् (ekam, one) and अवधीः (avadhīḥ, you killed) join in क्रौञ्चमिथुनादेकमवधीः (krauñcamithunādekamavadhīḥ). Joined words, split: tvamagamaḥ = tvam + gam; krauñcamithunādekamavadhīḥ = krauñcamithuna + eka + vadh."
    bases:
      "मा": "not (forbidding)"
      "निषाद": "hunter (Niṣāda)"
      "प्रतिष्ठां": "footing, a lasting place"
      "त्वमगमः": "you + to go, to get (you got)"
      "शाश्वतीः": "lasting, endless"
      "समाः": "year"
      "यत्": "because, since"
      "क्रौञ्चमिथुनादेकमवधीः": "pair of krauñca birds + one + to kill (you killed)"
      "काममोहितम्": "bewildered by desire, lost in love"
  "sa-8020":
    native: "A certain yakṣa, careless of his duty and robbed of his power for a year by his master's curse, which parting from his beloved made heavy, made his home in the hermitages of Rāmagiri, among cool shady trees and in waters made holy by the bathing of Janaka's daughter."
    notes:
      "n1": "The first verse of the Meghadūta. The English Wikipedia calls the poem a lyric poem by Kālidāsa (c. 4th to 5th century CE) and says it tells how a yakṣa (a nature spirit), banished by his master to a remote region for a year, asks a cloud to take a message of love to his wife."
      "n2": "One sentence runs through all four lines, and much of it is packed into compounds: कान्ताविरहगुरुणा (kāntāvirahaguruṇā) means \"heavy with parting from the beloved\". The visarga of यक्षः (yakṣaḥ) becomes ś before c: यक्षश्चक्रे (yakṣaścakre). The verb चक्रे (cakre, made) comes after its subject यक्षः (yakṣaḥ) and before its object वसतिम् (vasatim, a dwelling). Joined words, split: kaścitkāntāvirahaguruṇā = kim + cit + kāntā + viraha + guru; svādhikārātpramattaḥ = sva + adhikāra + pramatta; śāpenāstaṅgamitamahimā = śāpa + astam + gamaya + mahiman; varṣabhogyeṇa = varṣa + bhogya; yakṣaścakre = yakṣa + kṛ; janakatanayāsnānapuṇyodakeṣu = janakatanayā + snāna + puṇya + udaka; snigdhacchāyātaruṣu = snigdha + chāyā + taru; rāmagiryāśrameṣu = rāmagiri + āśrama."
    bases:
      "कश्चित्कान्ताविरहगुरुणा": "who + a particle + beloved + parting + heavy (someone)"
      "स्वाधिकारात्प्रमत्तः": "own + duty (from) + careless"
      "शापेनास्तङ्गमितमहिमा": "curse (by a curse) + set, gone down + to make go + greatness (one made to lose his power)"
      "वर्षभोग्येण": "year + to be lived through (lasting a year)"
      "भर्तुः": "master (of the master)"
      "यक्षश्चक्रे": "yakṣa + to make (he made)"
      "जनकतनयास्नानपुण्योदकेषु": "Janaka's daughter + bathing + holy + water (in)"
      "स्निग्धच्छायातरुषु": "cool, glossy + shade + tree (among)"
      "वसतिं": "dwelling, home"
      "रामगिर्याश्रमेषु": "Rāmagiri + hermitage (in)"
  "sa-8021":
    native: "On that mountain the lover, parted from his beloved, spent some months with his forearm bare where the gold bracelet had slipped off, and on the first day of Āṣāḍha he saw a cloud hugging the ridge, a sight like an elephant bent on play against a bank."
    notes:
      "n1": "The second verse of the Meghadūta. The English Wikipedia says the poem, by Kālidāsa, is about a banished yakṣa who asks a cloud to carry a message of love to his wife, and that it became well known in Bengali literature and inspired other poets to write similar poems."
      "n2": "The subject स कामी (sa kāmī, he, the lover) and the verb ददर्श (dadarśa, he saw, a perfect of दृश् (dṛś)) come at the end of the sentence, as often in verse. नीत्वा (nītvā) is an absolutive of नी (nī, to lead), here \"having spent\" the months. तस्मिन् (tasmin) and अद्रौ (adrau) join as तस्मिन्नद्रौ (tasminnadrau). Joined words, split: tasminnadrau = tad + adri; katicidabalāviprayuktaḥ = katicit + abalā + viprayukta; kanakavalayabhraṃśariktaprakoṣṭhaḥ = kanaka + valaya + bhraṃśa + rikta + prakoṣṭha; prathamadivase = prathama + divasa; meghamāśliṣṭasānuṃ = megha + āśliṣṭa + sānu; vaprakrīḍāpariṇatagajaprekṣaṇīyaṃ = vapra + krīḍā + pariṇata + gaja + prekṣaṇīya."
    bases:
      "तस्मिन्नद्रौ": "in that + mountain"
      "कतिचिदबलाविप्रयुक्तः": "some + woman, beloved + parted from"
      "स": "he"
      "कामी": "lover"
      "नीत्वा": "to lead, to spend (having spent)"
      "मासान्": "month"
      "कनकवलयभ्रंशरिक्तप्रकोष्ठः": "gold + bracelet + slipping + bare + forearm"
      "आषाढस्य": "Āṣāḍha (a month)"
      "प्रथमदिवसे": "first + day (on)"
      "मेघमाश्लिष्टसानुं": "cloud + embraced + ridge"
      "वप्रक्रीडापरिणतगजप्रेक्षणीयं": "bank + play + bent + elephant + worth seeing"
      "ददर्श": "to see (he saw)"
  "sa-8022":
    native: "The river Sindhu, thin as a braid of water and pale with old leaves falling from the trees on her banks, shows by her lovelorn state how fortunate you are once you have passed her, fortunate one; you alone must find the way by which she can give up her thinness."
    notes:
      "n1": "A verse from the first part (Pūrvamegha) of the Meghadūta, which the English Wikipedia calls a lyric poem by Kālidāsa in which a banished yakṣa speaks to a cloud, so the speaker here is addressing the cloud."
      "n2": "येन (yena) with विधिना (vidhinā) and सः (saḥ) set up a relative and its answer: \"by which means ... that\". The one word त्वयैवोपपाद्यः (tvayaivopapādyaḥ) holds three words, त्वया (tvayā, by you), एव (eva, only) and उपपाद्यः (upapādyaḥ, to be brought about). A long compound in the second line describes the river as pale with old leaves. Joined words, split: veṇībhūtapratanusalilā = veṇībhūta + pratanu + salila; tāmatītasya = tad + atīta; pāṇḍucchāyātaṭaruhatarubhraṃśibhirjīrṇaparṇaiḥ = pāṇḍu + chāyā + taṭa + ruha + taru + bhraṃśin + jīrṇa + parṇa; virahāvasthayā = viraha + avasthā; tvayaivopapādyaḥ = tvam + eva + upapādaya."
    bases:
      "वेणीभूतप्रतनुसलिला": "become a braid + very thin + water"
      "तामतीतस्य": "her + gone beyond (of one who has passed)"
      "सिन्धुः": "river, the Sindhu"
      "पाण्डुच्छायातटरुहतरुभ्रंशिभिर्जीर्णपर्णैः": "pale + colour + bank + growing + tree + falling + old + leaf (with)"
      "सौभाग्यं": "good fortune"
      "ते": "your"
      "सुभग": "fortunate one"
      "विरहावस्थया": "parting + state (by)"
      "व्यञ्जयन्ती": "to show, reveal (showing)"
      "कार्श्यं": "thinness"
      "येन": "by which"
      "त्यजति": "to give up (she gives up)"
      "विधिना": "means, way"
      "स": "that"
      "त्वयैवोपपाद्यः": "you + only + to bring about (to be brought about)"
  "sa-8023":
    native: "To gain understanding of word and meaning I bow to Pārvatī and Parameśvara, the parents of the world, who are joined like word and meaning."
    notes:
      "n1": "The first verse of the Raghuvaṃśa. The English Wikipedia calls the poem a Sanskrit epic (mahākāvya) by Kālidāsa that narrates in 19 cantos (sarga) the stories of the Raghu dynasty, from Dilīpa and his descendants to Agnivarṇa, among them Raghu, Daśaratha and Rāma."
      "n2": "वाच् (vāc, speech) and अर्थ (artha, meaning) join in वागर्थ (vāgartha): the final c of वाच् (vāc) becomes g before the voiced a. Three words end in the dual -au, two persons or things: संपृक्तौ (saṃpṛktau, joined), पितरौ (pitarau, the parents) and पार्वतीपरमेश्वरौ (pārvatīparameśvarau). Joined words, split: vāgarthāviva = vāc + artha + iva; vāgarthapratipattaye = vāc + artha + pratipatti; pārvatīparameśvarau = pārvatī + parameśvara."
    bases:
      "वागर्थाविव": "speech + meaning + like"
      "संपृक्तौ": "joined (two)"
      "वागर्थप्रतिपत्तये": "speech + meaning + understanding (for)"
      "जगतः": "world (of the world)"
      "पितरौ": "parents (two)"
      "वन्दे": "to bow to (I bow)"
      "पार्वतीपरमेश्वरौ": "Pārvatī + supreme lord, Parameśvara"
  "sa-8024":
    native: "He took tribute from them only for their welfare, as the sun draws up water in order to give it back a thousandfold."
    notes:
      "n1": "A verse from the first canto of the Raghuvaṃśa, which the English Wikipedia says narrates in 19 cantos the stories of the Raghu dynasty. It compares a king who collects a tax to the sun that draws up water, a comparison the poem uses to show that the tribute is for the people's good."
      "n2": "The comparison is built on सहस्रगुणम् (sahasraguṇam, a thousandfold) and the verb आदत्ते (ādatte, takes), a middle form of the root दा (dā) with the prefix आ (ā). The word बलि (bali) means tribute or tax here. In प्रजानामेव (prajānāmeva) the word एव (eva) is joined to the word it stresses. Joined words, split: prajānāmeva = prajā + eva; bhūtyarthaṃ = bhūti + artha; balimagrahīt = bali + grah; sahasraguṇamutsraṣṭumādatte = sahasra + guṇa + utsṛj + ādā."
    bases:
      "प्रजानामेव": "subjects (of the subjects) + only"
      "भूत्यर्थं": "welfare + purpose (for the sake of)"
      "स": "he"
      "ताभ्यो": "from them"
      "बलिमग्रहीत्": "tribute + to take (he took)"
      "सहस्रगुणमुत्स्रष्टुमादत्ते": "thousand + fold + to give out + to take (he takes)"
      "हि": "for, because"
      "रसं": "moisture, water"
      "रविः": "sun"
  "sa-8025":
    native: "In the north there is a king of mountains named Himālaya, divine in his soul, who stands plunged into the eastern and western seas like a measuring rod of the earth."
    notes:
      "n1": "The first verse of the Kumārasambhava. The English Wikipedia says that the poem has seventeen cantos, that scholars still debate whether Kālidāsa wrote all of them, and that the period of composition is uncertain, though Kālidāsa is thought to have lived in the 5th century."
      "n2": "अस्ति (asti, is) and उत्तरस्याम् (uttarasyām, in the north) join as अस्त्युत्तरस्याम् (astyuttarasyām): an i turns into y before a vowel. The compound देवतात्मा (devatātmā) means \"having a god's soul\", and नगाधिराजः (nagādhirājaḥ) \"king of the mountains\". The absolutive वगाह्य (vagāhya) says \"having plunged into\". Joined words, split: astyuttarasyāṃ = as + uttara; devatātmā = devatā + ātman; nagādhirājaḥ = naga + adhirāja; pūrvāparau = pūrva + apara; mānadaṇḍaḥ = māna + daṇḍa."
    bases:
      "अस्त्युत्तरस्यां": "to be (there is) + north (in the north)"
      "दिशि": "direction (in the direction)"
      "देवतात्मा": "god + soul (with a god's soul)"
      "हिमालयो": "Himālaya"
      "नाम": "by name"
      "नगाधिराजः": "mountain + king"
      "पूर्वापरौ": "eastern + western (two)"
      "तोयनिधी": "ocean, store of water (two)"
      "वगाह्य": "to plunge into (having plunged)"
      "स्थितः": "to stand (standing)"
      "पृथिव्या": "earth (of the earth)"
      "इव": "like"
      "मानदण्डः": "measure + rod"
  "sa-8026":
    native: "The sun is fierce and the moon is longed for, the stores of water are used up by constant bathing, the day's end is pleasant and love has grown calm; the summer season has come, my love."
    notes:
      "n1": "The opening verse of the Ṛtusaṃhāra. The English Wikipedia says the poem has six cantos, one for each of the six Indian seasons, and that it opens with Summer (Grīṣma) and ends with Spring (Vasanta); this verse announces summer."
      "n2": "The first line is a chain of compounds, each describing summer: प्रचण्डसूर्यः (pracaṇḍasūryaḥ, with a fierce sun) and the others. The visarga of कालः (kālaḥ) before अयम् (ayam) becomes o and the a is dropped: निदाघकालोऽयम् (nidāghakālo 'yam). The last word प्रिये (priye) is the vocative \"my love\". Joined words, split: pracaṇḍasūryaḥ = pracaṇḍa + sūrya; spṛhaṇīyacandramāḥ = spṛhaṇīya + candramas; sadāvagāhakṣatavārisaṃcayaḥ = sadā + avagāha + kṣata + vāri + saṃcaya; dināntaramyo'bhyupaśāntamanmatho = dinānta + ramya + abhyupaśānta + manmatha; nidāghakālo'yamupāgataḥ = nidāgha + kāla + idam + upāgata."
    bases:
      "प्रचण्डसूर्यः": "fierce + sun"
      "स्पृहणीयचन्द्रमाः": "desirable + moon"
      "सदावगाहक्षतवारिसंचयः": "always + bathing + used up + water + store"
      "दिनान्तरम्योऽभ्युपशान्तमन्मथो": "day's end + pleasant + calmed + love"
      "निदाघकालोऽयमुपागतः": "summer heat + time + this + arrived"
      "प्रिये": "beloved (my love)"
  "sa-8027":
    native: "With my eyes on the black antelope and on you with your bow strung, I seem to see Śiva with his bow right before me, chasing the deer."
    notes:
      "n1": "A verse from the first act of the Abhijñānaśākuntalam. The English Wikipedia calls it a Sanskrit play by Kālidāsa that dramatises the story of Śakuntalā told in the Mahābhārata and is regarded as the best of his works; its exact date is uncertain."
      "n2": "ददत् (dadat, giving, here \"fixing\") joins चक्षुः (cakṣuḥ, eye) as ददच्चक्षुः (dadaccakṣuḥ): a t before c becomes c. The word पिनाकिनम् (pinākinam) means \"bearer of the Pināka bow\", a name of Śiva, and is the one object of पश्यामि (paśyāmi, I see). Joined words, split: dadaccakṣustvayi = dadat + cakṣus + tvam; cādhijyakārmuke = ca + adhijya + kārmuka; mṛgānusāriṇaṃ = mṛga + anusārin; sākṣātpaśyāmīva = sākṣāt + dṛś + iva."
    bases:
      "कृष्णसारे": "black antelope (on the black antelope)"
      "ददच्चक्षुस्त्वयि": "giving, fixing + eye + you (on you)"
      "चाधिज्यकार्मुके": "and + strung + bow (with a strung bow)"
      "मृगानुसारिणं": "deer + chasing"
      "साक्षात्पश्यामीव": "before one's eyes + to see (I see) + as if"
      "पिनाकिनम्": "bearer of the Pināka bow, Śiva"
  "sa-8028":
    native: "Without doubt she is fit to be wed by a warrior, since my noble mind desires her; for good people, in matters of doubt, the promptings of the inner heart are the proof."
    notes:
      "n1": "A verse from the first act of the Abhijñānaśākuntalam, the play that the English Wikipedia says dramatises the story of Śakuntalā from the Mahābhārata and regards as Kālidāsa's best work. The article says that plots similar to the play appear in earlier texts."
      "n2": "In यदार्यम् (yadāryam) the word यद् (yad, since) joins आर्यम् (āryam, noble). The short word मे (me) is the weak form of \"my\", which stands second in its clause. The page writes अन्तः (antaḥ, inside) apart from करणप्रवृत्तयः (karaṇapravṛttayaḥ); the usual word is अन्तःकरण (antaḥkaraṇa, the inner organ, the heart and mind). Joined words, split: kṣatraparigrahakṣamā = kṣatra + parigraha + kṣamā; yadāryamasyāmabhilāṣi = yad + ārya + idam + abhilāṣin; sandehapadeṣu = sandeha + pada; pramāṇamantaḥ = pramāṇa + antar; karaṇapravṛttayaḥ = karaṇa + pravṛtti."
    bases:
      "असंशयं": "without doubt"
      "क्षत्रपरिग्रहक्षमा": "warrior class + taking in marriage + fit"
      "यदार्यमस्यामभिलाषि": "since + noble + she (in her) + desiring"
      "मे": "my"
      "मनः": "mind"
      "सतां": "good person (of the good)"
      "हि": "for"
      "सन्देहपदेषु": "doubt + case (in cases of doubt)"
      "वस्तुषु": "matter (in matters)"
      "प्रमाणमन्तः": "proof, authority + inside"
      "करणप्रवृत्तयः": "faculty + movement, prompting"
  "sa-8029":
    native: "A forest-dweller in the guise of a student, who had been sent by the lord of the Kurus to learn how his subjects were treated for the protection of his fortune, was recognised and came to Yudhiṣṭhira in the Dvaita forest."
    notes:
      "n1": "The opening verse of the Kirātārjunīya. The English Wikipedia says Bhāravi was a 6th-century poet known for this epic, one of the six mahākāvya (great poems) in classical Sanskrit, and that he lived around or before c. 580 CE."
      "n2": "The second line is the main clause: the verb समाययौ (samāyayau, he came) is a perfect form of the root या (yā, to go) with two prefixes, सम् (sam) and आ (ā). The first line is a long description of the forest-dweller. The compound वर्णिलिङ्गी (varṇiliṅgī) means \"wearing the signs of a student\". Joined words, split: kurūṇāmadhipasya = kuru + adhipa; yamayuṅkta = yad + yuj; varṇiliṅgī = varṇin + liṅgin; samāyayau = sam + ā + yā."
    bases:
      "श्रियः": "fortune, prosperity"
      "कुरूणामधिपस्य": "Kurus (of the Kurus) + lord"
      "पालनीं": "protecting"
      "प्रजासु": "subjects (among the subjects)"
      "वृत्तिं": "conduct, way of life"
      "यमयुङ्क्त": "whom + to appoint (he appointed)"
      "वेदितुम्": "to learn, to know (in order to learn)"
      "स": "he"
      "वर्णिलिङ्गी": "student + wearing the signs of"
      "विदितः": "known, recognised"
      "समाययौ": "together + toward + to go (he came)"
      "युधिष्ठिरं": "Yudhiṣṭhira"
      "द्वैतवने": "Dvaita forest (in the Dvaita forest)"
      "वनेचरः": "forest-dweller"
  "sa-8030":
    native: "Hari, the lord of Śrī and the dwelling place of the world, living in Vasudeva's glorious house to rule the world, saw a sage coming down from the sky, one born from the body of Brahmā."
    notes:
      "n1": "The opening verse of the Śiśupālavadha. The English Wikipedia says Māgha (c. 7th century) was a Sanskrit poet at the court of King Varmalata, and that his epic poem, in 20 cantos, is based on the episode of the Mahābhārata in which Kṛṣṇa uses his disc to behead the defiant king Śiśupāla."
      "n2": "Where a word ends in t and the next word begins with j or n, the t is changed to match: जगत् (jagat) before जगत् (jagat) and निवासः (nivāsaḥ) is written जगज्जगन्निवासः (jagajjagannivāsaḥ). The present participle वसन् (vasan, living) and the perfect ददर्श (dadarśa, saw) share one subject, हरिः (hariḥ). Joined words, split: jagajjagannivāso = jagat + jagat + nivāsa; vasudevasadmani = vasudeva + sadman; dadarśāvatarantamambarād = dṛś + avatṛ + ambara; hiraṇyagarbhāṅgabhuvaṃ = hiraṇyagarbha + aṅga + bhū."
    bases:
      "श्रियः": "Śrī, fortune (of Śrī)"
      "पतिः": "lord, husband"
      "श्रीमति": "glorious (in the glorious)"
      "शासितुं": "to rule (in order to rule)"
      "जगज्जगन्निवासो": "world (to rule the world) + world (of the world) + dwelling"
      "वसुदेवसद्मनि": "Vasudeva + house (in the house)"
      "वसन्": "to live (living)"
      "ददर्शावतरन्तमम्बराद्": "to see (he saw) + to come down (coming down) + sky (from the sky)"
      "हिरण्यगर्भाङ्गभुवं": "Brahmā + body + born"
      "मुनिं": "sage"
      "हरिः": "Hari"
  "sa-8031":
    native: "There was the dwelling of the great seer Kapila, a city whose sides were ringed by clouds as by a row, lovely with broad high ridges and plunging into the sky with its lofty heights."
    notes:
      "n1": "The English Wikipedia describes the Buddhacarita as an epic poem in the Sanskrit mahākāvya style on the life of Gautama Buddha by Aśvaghoṣa of Sāketa (modern Ayodhya), composed in the early second century CE. This is the second verse of the first canto."
      "n2": "आसीत् (āsīt, there was) ends in t, which is written d before the voiced v of विशाल (viśāla): आसीद्विशाल (āsīdviśāla). In पयोदपङ्क्त्येव (payodapaṅktyeva) the ending -ā of पङ्क्त्या (paṅktyā, by a row) and इव (iva, like) make e. Joined words, split: āsīdviśālonnatasānulakṣmyā = as + viśāla + unnata + sānu + lakṣmī; payodapaṅktyeva = payoda + paṅkti + iva; parītapārśvaṃ = parīta + pārśva; udagradhiṣṇyāṃ = udagra + dhiṣṇya; gagane'vagāḍhaṃ = gagana + avagāḍha."
    bases:
      "आसीद्विशालोन्नतसानुलक्ष्म्या": "to be (there was) + broad + high + ridge + beauty (by)"
      "पयोदपङ्क्त्येव": "cloud + row + like"
      "परीतपार्श्वं": "surrounded + side"
      "उदग्रधिष्ण्यां": "lofty + height, abode"
      "गगनेऽवगाढं": "sky (in the sky) + plunged"
      "पुरं": "city"
      "महर्षेः": "great seer (of the great seer)"
      "कपिलस्य": "Kapila (of Kapila)"
      "वस्तु": "dwelling, place"
  "sa-8032":
    native: "We offer this word of homage to the poets of old; may we find the goddess Speech, the deathless part of the Self."
    notes:
      "n1": "A verse from the opening of the Uttararāmacarita, a play by Bhavabhūti. The English Wikipedia lists the play, with the Mahāvīracarita and the Mālatīmādhava, among his notable works, names Kālidāsa as his predecessor, and says he is believed to have been a court poet of King Yaśovarman of Kannauj."
      "n2": "प्रशास्महे (praśāsmahe, we offer, we proclaim) is a first person plural in the middle voice, and विन्देम (vindema, may we find) an optative, a wish. In नमोवाकम् (namovākam, a word of homage) the first part नमस् (namas, bow) turns its s into o before the voiced v. Joined words, split: namovākaṃ = namas + vāka; praśāsmahe = pra + śās; vācamamṛtāmātmanaḥ = vāc + amṛta + ātman."
    bases:
      "इदं": "this"
      "कविभ्यः": "poet (to the poets)"
      "पूर्वेभ्यो": "earlier (to the earlier)"
      "नमोवाकं": "bow, homage + utterance"
      "प्रशास्महे": "forth + to proclaim, to offer (we offer)"
      "विन्देम": "to find (may we find)"
      "देवतां": "goddess"
      "वाचममृतामात्मनः": "speech + deathless + self (of the Self)"
      "कलाम्": "part, share"
  "sa-8033":
    native: "There was a poet named Śūdraka, famed, with the gait of the king of elephants, eyes like the cakora bird and a face like the full moon, well made, the foremost of the twice-born and of fathomless spirit."
    notes:
      "n1": "The English Wikipedia says three Sanskrit plays are attributed to Śūdraka, among them the Mṛcchakaṭika, that according to the play's prologue he was a king, and that one theory makes him a third-century Ābhīra king while another calls him a mythical figure, so the authorship is uncertain."
      "n2": "The verb बभूव (babhūva, was) is a perfect of भू (bhū, to be). Most of the verse is a string of compounds describing the poet, each as one word: द्विरदेन्द्रगतिश्चकोरनेत्रः (dviradendragatiścakoranetraḥ) means \"with the gait of the elephant king and the eyes of a cakora bird\". The last word इत्यगाधसत्त्वः (ityagādhasattvaḥ) joins इति (iti, thus) and अगाधसत्त्वः (agādhasattvaḥ, of fathomless spirit). Joined words, split: dviradendragatiścakoranetraḥ = dvirada + indra + gati + cakora + netra; paripūrṇendumukhaḥ = paripūrṇa + indu + mukha; suvigrahaśca = suvigraha + ca; dvijamukhyatamaḥ = dvija + mukhya; kavirbabhūva = kavi + bhū; ityagādhasattvaḥ = iti + agādha + sattva."
    bases:
      "द्विरदेन्द्रगतिश्चकोरनेत्रः": "elephant + king + gait + cakora bird + eye"
      "परिपूर्णेन्दुमुखः": "full + moon + face"
      "सुविग्रहश्च": "well made + and"
      "द्विजमुख्यतमः": "twice-born + chief (the foremost)"
      "कविर्बभूव": "poet + to be (he was)"
      "प्रथितः": "famed"
      "शूद्रक": "Śūdraka"
      "इत्यगाधसत्त्वः": "thus + fathomless + spirit"
