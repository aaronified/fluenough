cards:
  "sa-3800":
    native: "The traveller goes slowly along the road."
    bases: { "शनैर्": "slowly", "गच्छति": "to go (goes)" }
    confusables: { "w1": { why: "Swift, not slowly: त्वरितः (tvaritaḥ) means swift." }, "w2": { why: "To walk, not to go: चल् (cal) means to walk." }, "w3": { why: "Road, not path: अध्वा (adhvā) means road." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. शनैः (śanaiḥ) is written शनैर् (śanair) because a final ः (ḥ) after ऐ (ai) becomes र् (r) before a voiced sound, here the start of गच्छति (gacchati) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174).", "n2": "वर्त्म (vartma) is a neuter word whose nominative and accusative are the same; here it is the accusative, the way along which the traveller goes. शनैः (śanaiḥ) is an adverb: slowly." }
  "sa-3801":
    native: "A tired traveller finds the shade of a tree."
    bases: { "पथिको": "traveller", "वृक्षस्य": "of a tree", "छायां": "shade", "लभते": "to get (finds)" }
    confusables: { "w1": { why: "Sunshine, not shade: आतपः (ātapaḥ) means sunshine." }, "w2": { why: "Guest, not traveller: अतिथिः (atithiḥ) means guest." }, "w3": { why: "Slow, not tired: मन्दः (mandaḥ) means slow." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पथिकः (pathikaḥ) is written पथिको (pathiko) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of वृक्षस्य (vṛkṣasya) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). छायाम् (chāyām) is written छायां (chāyāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of लभते (labhate) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "वृक्षस्य (vṛkṣasya) is the genitive case of वृक्षः (vṛkṣaḥ): of a tree. क्लान्तः (klāntaḥ) agrees with पथिकः (pathikaḥ), both masculine and singular. लभते (labhate) is in the middle voice: the traveller gets the shade for himself." }
  "sa-3802":
    native: "Horses draw the chariot quickly."
    bases: { "शीघ्रं": "quickly", "रथम्": "chariot", "अश्वा": "horses", "वहन्ति": "to carry (draw)" }
    confusables: { "w1": { why: "Cart, not chariot: शकटम् (śakaṭam) means cart." }, "w2": { why: "To take, not to carry: हृ (hṛ) means to take." }, "w3": { why: "Bull, not horse: वृषभः (vṛṣabhaḥ) means bull." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. शीघ्रम् (śīghram) is written शीघ्रं (śīghraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of रथम् (ratham) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). अश्वाः (aśvāḥ) is written अश्वा (aśvā) because a final आः (āḥ) loses its visarga before a voiced consonant, here the start of वहन्ति (vahanti) (Whitney 177; Aṣṭādhyāyī 8.3.17, भो भगो अघो अपूर्वस्य यः अशि (bho bhago agho apūrvasya yaḥ aśi), with 8.3.19, लोपः शाकल्यस्य (lopaḥ śākalyasya)).", "n2": "अश्वाः (aśvāḥ) is the nominative plural of अश्वः (aśvaḥ): horses. रथम् (ratham) is the accusative case of रथः (rathaḥ): what they draw. वहन्ति (vahanti) is the third person plural: they carry, here draw." }
  "sa-3803":
    native: "The wheel of the chariot turns on the axle."
    bases: { "रथस्य": "of the chariot", "अक्षे": "on the axle", "वर्तते": "to turn" }
    confusables: { "w1": { why: "Rim of a wheel, not wheel: नेमिः (nemiḥ) means rim of a wheel." }, "w2": { why: "Vehicle, not chariot: यानम् (yānam) means vehicle." }, "w3": { why: "To walk, not to turn: चल् (cal) means to walk." } }
    notes: { "n1": "रथस्य (rathasya) is the genitive case of रथः (rathaḥ): of the chariot. अक्षे (akṣe) is the locative case of अक्षः (akṣaḥ): on the axle. वर्तते (vartate) is the middle-voice present of वृत् (vṛt): it turns." }
  "sa-3804":
    native: "A yojana is longer than a krosha."
    bases: { "योजनं": "yojana", "क्रोशाद्": "than a krosha", "दीर्घं": "long", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Short, not long: ह्रस्वः (hrasvaḥ) means short." }, "w2": { why: "Small, not long: लघुः (laghuḥ) means small." }, "w3": { why: "Thick, not long: स्थूलः (sthūlaḥ) means thick." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. योजनम् (yojanam) is written योजनं (yojanaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of क्रोशाद् (krośād) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). क्रोशात् (krośāt) is written क्रोशाद् (krośād) because a final त् (t) becomes द् (d) before a voiced sound, here the start of दीर्घं (dīrghaṃ) (Aṣṭādhyāyī 8.2.39, झलां जशः अन्ते (jhalāṃ jaśaḥ ante); Whitney 159). दीर्घम् (dīrgham) is written दीर्घं (dīrghaṃ), for the same reason, before भवति (bhavati). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "क्रोशात् (krośāt) is the ablative case of क्रोशः (krośaḥ); the ablative says what something is compared with: than a krosha. दीर्घम् (dīrgham) is the neuter form of दीर्घः (dīrghaḥ), to agree with योजनम् (yojanam)." }
  "sa-3805":
    native: "A guest receives hospitality in the house."
    bases: { "अतिथिर्": "guest", "गृहे": "in the house", "सत्कारं": "hospitality", "लभते": "to get (receives)" }
    confusables: { "w1": { why: "Wayfarer, not guest: पथिकः (pathikaḥ) means wayfarer." }, "w2": { why: "Door, not house: द्वारम् (dvāram) means door." }, "w3": { why: "To seize, not to receive: ग्रह् (grah) means to seize." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अतिथिः (atithiḥ) is written अतिथिर् (atithir) because a final ः (ḥ) after इ (i) becomes र् (r) before a voiced sound, here the start of गृहे (gṛhe) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174). सत्कारम् (satkāram) is written सत्कारं (satkāraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of लभते (labhate) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "गृहे (gṛhe) is the locative case of गृहम् (gṛham): in the house. सत्कारम् (satkāram) is the accusative case of सत्कारः (satkāraḥ): what the guest receives." }
  "sa-3806":
    native: "The helmsman steers the ship on the sea."
    bases: { "पोतं": "ship", "सागरे": "on the sea", "नयति": "to lead (steers)" }
    confusables: { "w1": { why: "Boat, not ship: नौका (naukā) means boat." }, "w2": { why: "Ocean, not sea: समुद्रः (samudraḥ) means ocean." }, "w3": { why: "Charioteer, not helmsman: सारथिः (sārathiḥ) means charioteer." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पोतम् (potam) is written पोतं (potaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of सागरे (sāgare) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "पोतम् (potam) is the accusative case of पोतः (potaḥ): what he steers. सागरे (sāgare) is the locative case of सागरः (sāgaraḥ): on the sea. नयति (nayati) is the present of नी (nī): leads, here steers." }
  "sa-3807":
    native: "A straight road is easy for travelling."
    bases: { "पन्था": "road", "गमने": "for going", "सुगमो": "easy", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Crooked, not straight: वक्रः (vakraḥ) means crooked." }, "w2": { why: "Path, not road: पद्धतिः (paddhatiḥ) means path." }, "w3": { why: "Hard, not easy: कठिनः (kaṭhinaḥ) means hard." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पन्थाः (panthāḥ) is written पन्था (panthā) because a final आः (āḥ) loses its visarga before a voiced consonant, here the start of गमने (gamane) (Whitney 177; Aṣṭādhyāyī 8.3.17, भो भगो अघो अपूर्वस्य यः अशि (bho bhago agho apūrvasya yaḥ aśi), with 8.3.19, लोपः शाकल्यस्य (lopaḥ śākalyasya)). सुगमः (sugamaḥ) is written सुगमो (sugamo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of भवति (bhavati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "गमने (gamane) is the locative case of गमनम् (gamanam): in going, here for travelling. ऋजुः (ṛjuḥ) and सुगमः (sugamaḥ) agree with पन्थाः (panthāḥ): all are masculine and singular." }
  "sa-3808":
    native: "At the roadside shed there is drinking water for the traveller."
    bases: { "प्रपायां": "at the roadside shed", "पथिकाय": "for the traveller", "पानीयं": "drinking water", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Pavilion, not shed: मण्डपः (maṇḍapaḥ) means pavilion." }, "w2": { why: "Abode, not shed: आवासः (āvāsaḥ) means abode." }, "w3": { why: "Fee, not drinking water: शुल्कम् (śulkam) means fee." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. प्रपायाम् (prapāyām) is written प्रपायां (prapāyāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पथिकाय (pathikāya) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). पानीयम् (pānīyam) is written पानीयं (pānīyaṃ), for the same reason, before भवति (bhavati). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "पथिकाय (pathikāya) is the dative case of पथिकः (pathikaḥ): for the traveller. प्रपायाम् (prapāyām) is the locative case of प्रपा (prapā): at the roadside shed. पानीयम् (pānīyam) is a neuter word." }
  "sa-3809":
    native: "A companion makes a traveller's journey easy."
    bases: { "पथिकस्य": "of a traveller", "यात्रां": "journey", "सुगमां": "easy", "करोति": "to do (makes)" }
    confusables: { "w1": { why: "Traveller, not companion: यात्री (yātrī) means traveller." }, "w2": { why: "Hospitality, not companion: सत्कारः (satkāraḥ) means hospitality." }, "w3": { why: "Hard, not easy: कठिनः (kaṭhinaḥ) means hard." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. यात्राम् (yātrām) is written यात्रां (yātrāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of सुगमां (sugamāṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). सुगमाम् (sugamām) is written सुगमां (sugamāṃ), for the same reason, before करोति (karoti).", "n2": "पथिकस्य (pathikasya) is the genitive case of पथिकः (pathikaḥ): of the traveller. सुगमाम् (sugamām) is the feminine accusative, to agree with यात्राम् (yātrām); the two stand together as what करोति (karoti) makes." }
