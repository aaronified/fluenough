cards:
  "sa-3260":
    native: "The sage performs worship and murmurs a mantra."
    bases: { "पूजां": "worship", "करोति": "to do (does)", "मन्त्रं": "sacred formula", "जपति": "to murmur (murmurs)" }
    confusables: { "w1": { why: "Hymn, not sacred formula: स्तोत्रम् (stotram) means hymn." }, "w2": { why: "Oblation, not worship: होमः (homaḥ) means oblation." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पूजाम् (pūjām) is written पूजां (pūjāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of करोति (karoti) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). मन्त्रम् (mantram) is written मन्त्रं (mantraṃ), for the same reason, before च (ca).", "n2": "पूजां करोति (pūjāṃ karoti) means to perform worship: a noun with करोति (karoti) makes a verb phrase.", "n3": "जपति (japati) is the quiet murmuring of a prayer, the word for repeating a mantra.", "n4": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3261":
    native: "Mother worships the deity and gives incense."
    bases: { "देवतां": "deity", "पूजयति": "to worship (worships)", "धूपं": "incense", "ददाति": "to give (gives)" }
    confusables: { "w1": { why: "Sandalwood, not incense: चन्दनम् (candanam) means sandalwood." }, "w2": { why: "Worship, not to worship: पूजा (pūjā) means worship." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. देवताम् (devatām) is written देवतां (devatāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पूजयति (pūjayati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). धूपम् (dhūpam) is written धूपं (dhūpaṃ), for the same reason, before च (ca).", "n2": "पूजयति (pūjayati) is the present of पूज् (pūj): it adds अय (aya) to the root.", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3262":
    native: "At the sacrifice father makes an oblation and mother sings a hymn."
    bases: { "यज्ञे": "at the sacrifice", "होमं": "oblation", "करोति": "to do (does)", "स्तोत्रं": "hymn", "गायति": "to sing (sings)" }
    confusables: { "w1": { why: "Sacred formula, not oblation: मन्त्रः (mantraḥ) means sacred formula." }, "w2": { why: "Initiation, not sacrifice: दीक्षा (dīkṣā) means initiation." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. होमम् (homam) is written होमं (homaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of करोति (karoti) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). स्तोत्रम् (stotram) is written स्तोत्रं (stotraṃ), for the same reason, before गायति (gāyati).", "n2": "यज्ञे (yajñe) is the locative case: it says where, at the sacrifice.", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3263":
    native: "The friend always bathes in the river."
    bases: { "नद्यां": "in the river", "स्नानं": "bath", "करोति": "to do (does)" }
    confusables: { "w1": { why: "Consecration, not bath: अभिषेकः (abhiṣekaḥ) means consecration." }, "w2": { why: "Lake, not river: सरः (saraḥ) means lake." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. नद्याम् (nadyām) is written नद्यां (nadyāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of स्नानम् (snānam) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). स्नानम् (snānam) is written स्नानं (snānaṃ), for the same reason, before करोति (karoti).", "n2": "स्नानं करोति (snānaṃ karoti) means to bathe: the noun for a bath and करोति (karoti) make a verb phrase.", "n3": "नद्याम् (nadyām) is the locative of नदी (nadī): it says where." }
  "sa-3264":
    native: "In the temple there is worship of the god and there is incense."
    bases: { "मन्दिरे": "in the temple", "देवस्य": "of the god", "भवति": "to be (is)", "धूपो": "incense" }
    confusables: { "w1": { why: "Deity, not god: देवता (devatā) means deity." }, "w2": { why: "Prayer, not worship: प्रार्थना (prārthanā) means prayer." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. धूपः (dhūpaḥ) is written धूपो (dhūpo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of भवति (bhavati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "देवस्य (devasya) is the genitive case: it says of whom, here the god's worship." }
  "sa-3265":
    native: "I remember the god and you murmur a mantra."
    bases: { "अहं": "I", "देवं": "god", "स्मरामि": "to remember (I remember)", "त्वं": "you", "मन्त्रं": "sacred formula", "जपसि": "to murmur (you murmur)" }
    confusables: { "w1": { why: "Deity, not god: देवता (devatā) means deity." }, "w2": { why: "Hymn, not sacred formula: स्तोत्रम् (stotram) means hymn." }, "w3": { why: "To hold, not to remember: धृ (dhṛ) means to hold." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अहम् (aham) is written अहं (ahaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of देवम् (devam) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). देवम् (devam) is written देवं (devaṃ), for the same reason, before स्मरामि (smarāmi). त्वम् (tvam) is written त्वं (tvaṃ), for the same reason, before च (ca). मन्त्रम् (mantram) is written मन्त्रं (mantraṃ), for the same reason, before जपसि (japasi).", "n2": "स्मरामि (smarāmi) is the present of स्मृ (smṛ): the one remembered is in the accusative case, here देवम् (devam).", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3266":
    native: "A fast is holy and a vow is hard."
    bases: { "पवित्रो": "pure", "भवति": "to be (is)", "व्रतं": "vow", "कठिनं": "hard" }
    confusables: { "w1": { why: "Initiation, not vow: दीक्षा (dīkṣā) means initiation." }, "w2": { why: "Easy, not hard: सरलः (saralaḥ) means easy." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पवित्रः (pavitraḥ) is written पवित्रो (pavitro) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of भवति (bhavati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). व्रतम् (vratam) is written व्रतं (vrataṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of च (ca) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). कठिनम् (kaṭhinam) is written कठिनं (kaṭhinaṃ), for the same reason, before भवति (bhavati). The labial keeps म् (m) in Whitney 213 a, but the anusvāra sign is the usual writing (Whitney 213 i).", "n2": "कठिनम् (kaṭhinam) is the neuter form of कठिनः (kaṭhinaḥ), to agree with the neuter word व्रतम् (vratam).", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3267":
    native: "Heaven is holy and hell is impure."
    bases: { "पवित्रो": "pure", "भवति": "to be (is)", "नरको": "hell", "मलिनो": "dirty" }
    confusables: { "w1": { why: "Liberation, not heaven: मोक्षः (mokṣaḥ) means liberation." }, "w2": { why: "Beautiful, not pure: सुन्दरः (sundaraḥ) means beautiful." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पवित्रः (pavitraḥ) is written पवित्रो (pavitro) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of भवति (bhavati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). नरकः (narakaḥ) is written नरको (narako), for the same reason, before मलिनः (malinaḥ). मलिनः (malinaḥ) is written मलिनो (malino), for the same reason, before भवति (bhavati).", "n2": "पवित्रः (pavitraḥ) and मलिनः (malinaḥ) are opposites: holy, or pure, and stained, or impure." }
  "sa-3268":
    native: "That woman worships the god and gains liberation."
    bases: { "देवं": "god", "पूजयति": "to worship (worships)", "मोक्षं": "liberation", "लभते": "to get (gets)" }
    confusables: { "w1": { why: "Deity, not god: देवता (devatā) means deity." }, "w2": { why: "Heaven, not liberation: स्वर्गः (svargaḥ) means heaven." }, "w3": { why: "Worship, not to worship: पूजा (pūjā) means worship." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. देवम् (devam) is written देवं (devaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पूजयति (pūjayati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). मोक्षम् (mokṣam) is written मोक्षं (mokṣaṃ), for the same reason, before च (ca).", "n2": "लभते (labhate) takes the middle ending ते (te): the middle voice is taught in its own lesson.", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3269":
    native: "At the festival there are lamps and garlands everywhere."
    bases: { "उत्सवे": "at the festival", "दीपा": "lamps", "भवन्ति": "to be (they are)" }
    confusables: { "w1": { why: "Incense, not lamp: धूपः (dhūpaḥ) means incense." }, "w2": { why: "Thread, not garland: सूत्रम् (sūtram) means thread." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. दीपाः (dīpāḥ) is written दीपा (dīpā) because a final आः (āḥ) loses its visarga before a voiced consonant, here the start of भवन्ति (bhavanti) (Whitney 177; Aṣṭādhyāyī 8.3.17, भो भगो अघो अपूर्वस्य यः अशि (bho bhago agho apūrvasya yaḥ aśi), with 8.3.19, लोपः शाकल्यस्य (lopaḥ śākalyasya)). मालाः (mālāḥ) is written माला (mālā), for the same reason, before भवन्ति (bhavanti).", "n2": "दीपाः (dīpāḥ) and मालाः (mālāḥ) are plural, so the verb भवन्ति (bhavanti) is plural too.", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
