          "जनं": "person"
          "हरति": "takes away, carries off"
  "sa-5881":
    native: "Demon, asura, a rival of the gods."
    notes:
      "n1": "The asuras are rivals of the gods in the myths and in the tales."
      "n2": "Masculine a-stem noun: its full set of case forms is in the a-stems table of the grammar rules."
      "n3": "The final ः (ḥ) of असुरः (asuraḥ) becomes ो (o) before a voiced sound, as in असुरो (asuro) देवाञ् (devāñ) जयति (jayati)."
      "n4": "A final न् (n) before ज (j) becomes ञ् (ñ), as in देवाञ् (devāñ) from देवान् (devān) in देवाञ् (devāñ) जयति (jayati) (Aṣṭādhyāyī 8.4.40; Whitney §202 b)."
    bases:
      "असुरः": "asura"
    examples:
      "असुरो देवाञ् जयति":
        native: "The demon conquers the gods."
        bases:
