      "n4": "The final म् (m) of वनम् (vanam) is written ं (ṃ) before a consonant, as in पिशाचो (piśāco) वनं (vanaṃ) चरति (carati)."
      "n5": "The final म् (m) of जनम् (janam) is written ं (ṃ) before a consonant, as in पिशाचो (piśāco) जनं (janaṃ) हरति (harati)."
    bases:
