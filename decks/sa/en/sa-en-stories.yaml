cards:
  "sa-5870":
    native: "Merchant, a trader who travels to sell goods."
    notes:
      "n1": "Merchants are stock characters in the tales, often shown as clever or as easily tricked."
      "n2": "Masculine root-stem noun: its full set of case forms is in the other-stems table of the grammar rules."
      "n3": "The final म् (m) of धनम् (dhanam) is written ं (ṃ) before a consonant, as in वणिग् (vaṇig) धनं (dhanaṃ) रक्षति (rakṣati)."
      "n4": "The final म् (m) of नगरम् (nagaram) is written ं (ṃ) before a consonant, as in वणिग् (vaṇig) नगरं (nagaraṃ) गच्छति (gacchati)."
      "n5": "A final क् (k) before a voiced sound becomes ग् (g), as in वणिग् (vaṇig) from वणिक् (vaṇik) in वणिग् (vaṇig) धनं (dhanaṃ) रक्षति (rakṣati) (Aṣṭādhyāyī 8.2.39; Whitney §159)."
    bases:
      "वणिक्": "merchant"
    examples:
      "वणिग् धनं रक्षति":
        native: "The merchant guards his wealth."
        bases:
          "वणिग्": "merchant"
          "धनं": "wealth"
          "रक्षति": "protects"
      "वणिग् नगरं गच्छति":
        native: "The merchant goes to the city."
        bases:
          "वणिग्": "merchant"
          "नगरं": "city"
          "गच्छति": "goes"
  "sa-5871":
    native: "Pigeon, a dove of the animal tales."
    notes:
      "n1": "Compare हंस (haṃsa), swan, and मयूर (mayūra), peacock, which also speak in the tales."
      "n2": "Masculine a-stem noun: its full set of case forms is in the a-stems table of the grammar rules."
      "n3": "The final ः (ḥ) of कपोतः (kapotaḥ) becomes स् (s) before त (t), as in कपोतस् (kapotas) तत्र (tatra) तिष्ठति (tiṣṭhati)."
      "n4": "The final ः (ḥ) of कपोतः (kapotaḥ) becomes ो (o) before a voiced sound, as in कपोतो (kapoto) जलं (jalaṃ) पिबति (pibati)."
      "n5": "The final म् (m) of जलम् (jalam) is written ं (ṃ) before a consonant, as in कपोतो (kapoto) जलं (jalaṃ) पिबति (pibati)."
    bases:
      "कपोतः": "pigeon"
    examples:
      "कपोतस् तत्र तिष्ठति":
        native: "The pigeon stays there."
        bases:
          "कपोतस्": "pigeon"
          "तत्र": "there"
          "तिष्ठति": "stays, stands"
      "कपोतो जलं पिबति":
        native: "The pigeon drinks water."
        bases:
          "कपोतो": "pigeon"
          "जलं": "water"
          "पिबति": "drinks"
  "sa-5872":
    native: "Mongoose, a small animal that hunts snakes."
    notes:
      "n1": "In many animal tales the mongoose is the natural enemy of the snake."
      "n2": "Masculine a-stem noun: its full set of case forms is in the a-stems table of the grammar rules."
      "n3": "The final म् (m) of सर्पम् (sarpam) is written ं (ṃ) before a consonant, as in सर्पं (sarpaṃ) नकुलो (nakulo) जयति (jayati)."
      "n4": "The final ः (ḥ) of नकुलः (nakulaḥ) becomes ो (o) before a voiced sound, as in सर्पं (sarpaṃ) नकुलो (nakulo) जयति (jayati)."
      "n5": "The final म् (m) of वनम् (vanam) is written ं (ṃ) before a consonant, as in नकुलो (nakulo) वनं (vanaṃ) गच्छति (gacchati)."
    bases:
      "नकुलः": "mongoose"
    examples:
      "सर्पं नकुलो जयति":
        native: "The mongoose conquers the snake."
        bases:
          "सर्पं": "snake"
          "नकुलो": "mongoose"
          "जयति": "conquers, wins"
      "नकुलो वनं गच्छति":
        native: "The mongoose goes to the forest."
        bases:
          "नकुलो": "mongoose"
          "वनं": "forest"
          "गच्छति": "goes"
  "sa-5873":
    native: "Wolf."
    notes:
      "n1": "The wolf is a greedy and dangerous animal in the fables; compare व्याघ्र (vyāghra), tiger."
      "n2": "Masculine a-stem noun: its full set of case forms is in the a-stems table of the grammar rules."
      "n3": "The final ः (ḥ) of वृकः (vṛkaḥ) becomes ो (o) before a voiced sound, as in वृको (vṛko) वनं (vanaṃ) चरति (carati)."
      "n4": "The final म् (m) of वनम् (vanam) is written ं (ṃ) before a consonant, as in वृको (vṛko) वनं (vanaṃ) चरति (carati)."
      "n5": "The final म् (m) of अजाम् (ajām) is written ं (ṃ) before a consonant, as in अजां (ajāṃ) वृको (vṛko) हरति (harati)."
    bases:
      "वृकः": "wolf"
    examples:
      "वृको वनं चरति":
        native: "The wolf roams the forest."
        bases:
          "वृको": "wolf"
          "वनं": "forest"
          "चरति": "wanders, practises"
      "अजां वृको हरति":
        native: "The wolf carries off a goat."
        bases:
          "अजां": "goat"
          "वृको": "wolf"
          "हरति": "takes away, carries off"
  "sa-5874":
    native: "Child, a boy."
    notes:
      "n1": "Compare कुमार (kumāra), a boy or prince, and शिशु (śiśu), an infant."
      "n2": "Masculine a-stem noun: its full set of case forms is in the a-stems table of the grammar rules."
      "n3": "The final ः (ḥ) of बालकः (bālakaḥ) becomes ो (o) before a voiced sound, as in बालको (bālako) गृहं (gṛhaṃ) गच्छति (gacchati)."
      "n4": "The final म् (m) of गृहम् (gṛham) is written ं (ṃ) before a consonant, as in बालको (bālako) गृहं (gṛhaṃ) गच्छति (gacchati)."
    bases:
      "बालकः": "child"
    examples:
      "बालकः क्रीडति":
        native: "The child plays."
        bases:
          "बालकः": "child"
          "क्रीडति": "plays"
      "बालको गृहं गच्छति":
        native: "The child goes home."
        bases:
          "बालको": "child"
          "गृहं": "house"
          "गच्छति": "goes"
