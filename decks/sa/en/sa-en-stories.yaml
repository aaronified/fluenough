          "तत्र": "there"
          "भवति": "is, becomes"
      "सर्पा वल्मीके वसन्ति":
        native: "Snakes dwell in the anthill."
        bases:
          "सर्पा": "snakes"
          "वल्मीके": "anthill"
          "वसन्ति": "dwell"
  "sa-5879":
    native: "Cleverness, wit, skill in finding a way out."
    notes:
      "n1": "The quality that a hero of the tales needs; compare धूर्त (dhūrta), cunning."
      "n2": "Neuter a-stem noun: its full set of case forms is in the a-stems table of the grammar rules."
      "n3": "The final म् (m) of चातुर्यम् (cāturyam) is written ं (ṃ) before a consonant, as in जनस्य (janasya) चातुर्यं (cāturyaṃ) भवति (bhavati)."
      "n4": "The genitive जनस्य (janasya) with a form of भू (bhū), to be, says that the person has the thing: जनस्य (janasya) चातुर्यं (cāturyaṃ) भवति (bhavati), literally \"of the person there is\"."
      "n5": "The final ः (ḥ) of जनः (janaḥ) becomes श् (ś) before च (c), as in जनश् (janaś) चातुर्येण (cāturyeṇa) जयति (jayati)."
    bases:
      "चातुर्यम्": "cleverness"
    examples:
      "जनस्य चातुर्यं भवति":
        native: "A person has cleverness."
        bases:
          "जनस्य": "of the person"
          "चातुर्यं": "cleverness"
          "भवति": "is, there is"
      "जनश् चातुर्येण जयति":
        native: "A person conquers through cleverness."
        bases:
          "जनश्": "person"
          "चातुर्येण": "cleverness"
          "जयति": "conquers, wins"
  "sa-5880":
