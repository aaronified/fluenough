  "sa-5878":
    native: "Anthill, a mound made by termites."
    notes:
      "n1": "Snakes live in anthills in the tales."
      "n2": "Masculine a-stem noun: its full set of case forms is in the a-stems table of the grammar rules."
      "n3": "The final ः (ḥ) of वल्मीकः (valmīkaḥ) becomes स् (s) before त (t), as in वल्मीकस् (valmīkas) तत्र (tatra) भवति (bhavati)."
      "n4": "The final ः (ḥ) of सर्पाः (sarpāḥ) is dropped after ा (ā) before a voiced sound, as in सर्पा (sarpā) वल्मीके (valmīke) वसन्ति (vasanti)."
    bases:
      "वल्मीकः": "anthill"
    examples:
      "वल्मीकस् तत्र भवति":
        native: "An anthill is there."
        bases:
