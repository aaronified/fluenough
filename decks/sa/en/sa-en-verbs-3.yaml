name: "More daily actions"
description: "Sixty more common verbs, given as roots: verbs of the first, second, third, fourth, fifth, sixth, seventh and tenth class, some with the middle endings (ātmanepada). Each note shows how its class makes the present stem. Not yet checked by a Sanskrit speaker: please report any mistake."
