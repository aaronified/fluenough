cards:
  "sa-12000":
    native: "to be worthy; to deserve"
    notes:
      "n1": "A verb of the first class: the class sign a is added to the root अर्ह् (arh), so the present stem is अर्ह (arha). The third person singular is अर्हति (arhati). Its row is in the present-system table."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. ऋषिः (ṛṣiḥ) is written ऋषिर् (ṛṣir) because a final ः (ḥ) after इ (i) becomes र् (r) before a voiced sound, here the start of आदरम् (ādaram) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174)."
    examples:
      "गुरुः सम्मानम् अर्हति":
        native: "The teacher deserves honour."
        bases:
          "सम्मानम्": "honour"
          "अर्हति": "deserves"
      "ऋषिर् आदरम् अर्हति":
        native: "The sage deserves respect."
        bases:
          "ऋषिर्": "sage"
          "आदरम्": "respect"
          "अर्हति": "deserves"
  "sa-12001":
    native: "to grow; to increase"
    notes:
      "n1": "A verb of the first class: the class sign a is added to the root वृध् (vṛdh) with the vowel ṛ strengthened to ar, so the present stem is वर्ध (vardha). The third person singular is वर्धति (vardhati). Its row is in the present-system table."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. वृक्षः (vṛkṣaḥ) is written वृक्षो (vṛkṣo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of वर्धति (vardhati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). शिशुः (śiśuḥ) is written शिशुर् (śiśur) because a final ः (ḥ) after उ (u) becomes र् (r) before a voiced sound, here the start of वर्धति (vardhati) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174)."
    examples:
      "वृक्षो वर्धति":
        native: "The tree grows."
        bases:
          "वृक्षो": "tree"
          "वर्धति": "grows"
      "शिशुर् वर्धति":
        native: "The child grows."
        bases:
          "शिशुर्": "child"
          "वर्धति": "grows"
  "sa-12002":
    native: "to burn; to scorch"
    notes:
      "n1": "A verb of the first class: the class sign a is added to the root दह् (dah), so the present stem is दह (daha). The third person singular is दहति (dahati). Its row is in the present-system table."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. अग्निः (agniḥ) is written अग्निर् (agnir) because a final ः (ḥ) after इ (i) becomes र् (r) before a voiced sound, here the start of दहति (dahati) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174). सूर्यः (sūryaḥ) is written सूर्यो (sūryo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of दहति (dahati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca))."
    examples:
      "अग्निर् दहति वनम्":
        native: "Fire burns the forest."
        bases:
          "अग्निर्": "fire"
          "दहति": "burns"
      "सूर्यो दहति भूमिम्":
        native: "The sun scorches the ground."
        bases:
          "सूर्यो": "sun"
          "दहति": "burns"
          "भूमिम्": "ground"
  "sa-12003":
    native: "to wander; to roam"
    notes:
      "n1": "A verb of the first class: the class sign a is added to the root भ्रम् (bhram), so the present stem is भ्रम (bhrama). The third person singular is भ्रमति (bhramati). Its row is in the present-system table."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. मृगः (mṛgaḥ) is written मृगो (mṛgo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of भ्रमति (bhramati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). गजः (gajaḥ) is written गजो (gajo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of भ्रमति (bhramati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca))."
    examples:
      "मृगो भ्रमति वने":
        native: "The deer wanders in the forest."
        bases:
          "मृगो": "deer"
          "भ्रमति": "wanders"
          "वने": "forest"
      "गजो भ्रमति वने":
        native: "The elephant roams in the forest."
        bases:
          "गजो": "elephant"
          "भ्रमति": "wanders"
          "वने": "forest"
  "sa-12004":
    native: "to hide; to conceal"
    notes:
      "n1": "A verb of the first class: the class sign a is added to the root गुह् (guh) with the vowel u lengthened to ū, so the present stem is गूह (gūha). The third person singular is गूहति (gūhati). Its row is in the present-system table."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. धनम् (dhanam) is written धनं (dhanaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of गूहति (gūhati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). शिशुः (śiśuḥ) is written शिशुर् (śiśur) because a final ः (ḥ) after उ (u) becomes र् (r) before a voiced sound, here the start of गूहति (gūhati) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174)."
    examples:
      "कन्या धनं गूहति":
        native: "The girl hides the money."
        bases:
          "धनं": "wealth"
          "गूहति": "hides"
      "शिशुर् गूहति पुष्पम्":
        native: "The child hides a flower."
        bases:
          "शिशुर्": "child"
          "गूहति": "hides"
  "sa-12005":
    native: "to bite"
    notes:
      "n1": "A verb of the first class: the class sign a is added to the root दंश् (daṃś) with the nasal of the root dropped, so the present stem is दश (daśa). The third person singular is दशति (daśati). Its row is in the present-system table."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. कुक्कुरः (kukkuraḥ) is written कुक्कुरो (kukkuro) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of मूषकम् (mūṣakam) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). मूषकम् (mūṣakam) is written मूषकं (mūṣakaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of दशति (daśati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). भुजंगः (bhujaṃgaḥ) is written भुजंगो (bhujaṃgo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of दशति (daśati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca))."
    examples:
      "कुक्कुरो मूषकं दशति":
        native: "The dog bites the mouse."
        bases:
          "कुक्कुरो": "dog"
          "मूषकं": "mouse"
          "दशति": "bites"
      "भुजंगो दशति पादम्":
        native: "The snake bites the foot."
        bases:
          "भुजंगो": "snake"
          "दशति": "bites"
          "पादम्": "foot"
  "sa-12006":
    native: "to wake up; to know"
    notes:
      "n1": "A verb of the first class: the class sign a is added to the root बुध् (budh) with the vowel u strengthened to o, so the present stem is बोध (bodha). The third person singular is बोधति (bodhati). Its row is in the present-system table."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. शिशुः (śiśuḥ) is written शिशुर् (śiśur) because a final ः (ḥ) after उ (u) becomes र् (r) before a voiced sound, here the start of बोधति (bodhati) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174)."
    examples:
      "शिशुर् बोधति":
        native: "The child wakes up."
        bases:
          "शिशुर्": "child"
          "बोधति": "wakes up"
      "माता बोधति":
        native: "The mother wakes up."
        bases:
          "बोधति": "wakes up"
  "sa-12007":
    native: "to hold; to hold back"
    notes:
      "n1": "A verb of the first class: the class sign a is added to the root यम् (yam) with the final m of the root changed to ccha, so the present stem is यच्छ (yaccha). The third person singular is यच्छति (yacchati). Its row is in the present-system table."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. सारथिः (sārathiḥ) is written सारथिर् (sārathir) because a final ः (ḥ) after इ (i) becomes र् (r) before a voiced sound, here the start of अश्वान् (aśvān) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174). दीपम् (dīpam) is written दीपं (dīpaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of यच्छति (yacchati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign)."
    examples:
      "सारथिर् अश्वान् यच्छति":
        native: "The charioteer holds back the horses."
        bases:
          "सारथिर्": "charioteer"
          "अश्वान्": "horses"
          "यच्छति": "holds"
      "कन्या दीपं यच्छति":
        native: "The girl holds up the lamp."
        bases:
          "दीपं": "lamp"
          "यच्छति": "holds"
  "sa-12008":
    native: "to climb; to rise"
    notes:
      "n1": "A verb of the first class: the class sign a is added to the root रुह् (ruh) with the vowel u strengthened to o, so the present stem is रोह (roha). The third person singular is रोहति (rohati). Its row is in the present-system table."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. वानरः (vānaraḥ) is written वानरो (vānaro) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of वृक्षम् (vṛkṣam) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). वृक्षम् (vṛkṣam) is written वृक्षं (vṛkṣaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of रोहति (rohati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). पर्वतम् (parvatam) is written पर्वतं (parvataṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of रोहति (rohati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign)."
    examples:
      "वानरो वृक्षं रोहति":
        native: "The monkey climbs the tree."
        bases:
          "वानरो": "monkey"
          "वृक्षं": "tree"
          "रोहति": "climbs"
      "पथिकः पर्वतं रोहति":
        native: "The traveller climbs the mountain."
        bases:
          "पर्वतं": "mountain"
          "रोहति": "climbs"
  "sa-12009":
    native: "to sow; to scatter"
    notes:
      "n1": "A verb of the first class: the class sign a is added to the root वप् (vap), so the present stem is वप (vapa). The third person singular is वपति (vapati). Its row is in the present-system table."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. कर्षकः (karṣakaḥ) is written कर्षको (karṣako) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of व्रीहिम् (vrīhim) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). व्रीहिम् (vrīhim) is written व्रीहिं (vrīhiṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of वपति (vapati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). कर्षकः (karṣakaḥ) is written कर्षको (karṣako) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of यवम् (yavam) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). यवम् (yavam) is written यवं (yavaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of वपति (vapati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign)."
    examples:
      "कर्षको व्रीहिं वपति":
        native: "The farmer sows rice."
        bases:
          "कर्षको": "farmer"
          "व्रीहिं": "rice"
          "वपति": "sows"
      "कर्षको यवं वपति":
        native: "The farmer sows barley."
        bases:
          "कर्षको": "farmer"
          "यवं": "barley"
          "वपति": "sows"
  "sa-12010":
    native: "to sit down"
    notes:
      "n1": "A verb of the first class: the class sign a is added to the root सद् (sad) with the vowel a lengthened to ī, so the present stem is सीद (sīda). The third person singular is सीदति (sīdati). Its row is in the present-system table."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. काकः (kākaḥ) is written काको (kāko) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of वृक्षे (vṛkṣe) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). हंसः (haṃsaḥ) is written हंसो (haṃso) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of नद्याम् (nadyām) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). नद्याम् (nadyām) is written नद्यां (nadyāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of सीदति (sīdati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign)."
    examples:
      "काको वृक्षे सीदति":
        native: "The crow sits on the tree."
        bases:
          "काको": "crow"
          "वृक्षे": "tree"
          "सीदति": "sits"
      "हंसो नद्यां सीदति":
        native: "The swan sits on the river."
        bases:
          "हंसो": "swan"
          "नद्यां": "river"
          "सीदति": "sits"
  "sa-12011":
    native: "to leap; to spring"
    notes:
      "n1": "A verb of the first class: the class sign a is added to the root स्कन्द् (skand), so the present stem is स्कन्द (skanda). The third person singular is स्कन्दति (skandati). Its row is in the present-system table."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. मृगः (mṛgaḥ) is written मृगो (mṛgo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of वने (vane) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca))."
    examples:
