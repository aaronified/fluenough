cards:
  "sa-3120":
    native: "The hair is black and the nail is hard."
    bases: { "कृष्णो": "black", "भवति": "to be (is)", "नखं": "nail", "कठिनं": "hard; difficult" }
    confusables: { "w1": { why: "Tooth, not hair: दन्तः (dantaḥ) means tooth." }, "w2": { why: "Red, not black: रक्तः (raktaḥ) means red." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. कृष्णः (kṛṣṇaḥ) is written कृष्णो (kṛṣṇo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of भवति (bhavati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). नखम् (nakham) is written नखं (nakhaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of कठिनम् (kaṭhinam) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). कठिनम् (kaṭhinam) is written कठिनं (kaṭhinaṃ), for the same reason, before भवति (bhavati)." }
  "sa-3121":
    native: "You drink water with the hand."
    bases: { "त्वं": "you", "हस्तेन": "with the hand", "जलं": "water", "पिबसि": "to drink (you drink)" }
    confusables: { "w1": { why: "He, not you: सः (saḥ) means he." }, "w2": { why: "Foot, not hand: पादः (pādaḥ) means foot." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. त्वम् (tvam) is written त्वं (tvaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of हस्तेन (hastena) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). जलम् (jalam) is written जलं (jalaṃ), for the same reason, before पिबसि (pibasi).", "n2": "हस्तेन (hastena) is the instrumental case: it says with what the action is done." }
  "sa-3122":
    native: "How many hands are there and how many feet?"
    bases: { "हस्ता": "hands", "भवन्ति": "to be (they are)", "पादा": "feet" }
    confusables: { "w1": { why: "Why, not how many: किमर्थम् (kimartham) means why." }, "w2": { why: "Face, not hand: मुखम् (mukham) means face." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. हस्ताः (hastāḥ) is written हस्ता (hastā) because a final आः (āḥ) loses its visarga before a voiced consonant, here the start of भवन्ति (bhavanti) (Whitney 177). पादाः (pādāḥ) is written पादा (pādā), for the same reason, before भवन्ति (bhavanti)." }
  "sa-3123":
    native: "The two feet go and the two hands bring water."
    bases: { "पादौ": "two feet", "गच्छतो": "to go (the two go)", "हस्तौ": "two hands", "जलं": "water", "नयतः": "to bring (the two bring)" }
    confusables: { "w1": { why: "Three, not two: त्रयः (trayaḥ) means three." }, "w2": { why: "Face, not foot: मुखम् (mukham) means face." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. गच्छतः (gacchataḥ) is written गच्छतो (gacchato) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of द्वौ (dvau) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). जलम् (jalam) is written जलं (jalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of नयतः (nayataḥ) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign)." }
  "sa-3124":
    native: "The foot does not move and the hand does not move."
    bases: { "पादो": "foot", "चलति": "to move (moves)", "हस्तो": "hand" }
    confusables: { "w1": { why: "Face, not foot: मुखम् (mukham) means face." }, "w2": { why: "To play, not to move: क्रीड् (krīḍ) means to play." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पादः (pādaḥ) is written पादो (pādo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of न (na) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). हस्तः (hastaḥ) is written हस्तो (hasto), for the same reason, before न (na)." }
  "sa-3125":
    native: "Blood flows there and water trickles there."
    bases: { "रुधिरं": "blood", "सरति": "to flow (flows)", "जलं": "water", "क्षरति": "to trickle (trickles)" }
    confusables: { "w1": { why: "Now, not there: इदानीम् (idānīm) means now." }, "w2": { why: "To sing, not to flow: गै (gai) means to sing." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. रुधिरम् (rudhiram) is written रुधिरं (rudhiraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of सरति (sarati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). जलम् (jalam) is written जलं (jalaṃ), for the same reason, before क्षरति (kṣarati)." }
  "sa-3126":
    native: "Where is the head and where is the face?"
    bases: { "भवति": "to be (is)", "मुखं": "face" }
    confusables: { "w1": { why: "When, not where: कदा (kadā) means when." }, "w2": { why: "To go, not to be: गम् (gam) means to go." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. मुखम् (mukham) is written मुखं (mukhaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of कुत्र (kutra) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign)." }
  "sa-3127":
    native: "He sees with the eye and father hears with the ear."
    bases: { "स": "he", "नेत्रेण": "with the eye", "पश्यति": "to see (sees)", "कर्णेन": "with the ear", "शृणोति": "to hear (hears)" }
    confusables: { "w1": { why: "She, not he: सा (sā) means she." }, "w2": { why: "Hair, not eye: केशः (keśaḥ) means hair." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सः (saḥ) is written स (sa) because सः (saḥ) and एषः (eṣaḥ) lose their visarga before any consonant, here the start of नेत्रेण (netreṇa) (Whitney 176 a; Aṣṭādhyāyī 6.1.132)." }
  "sa-3128":
    native: "I speak Sanskrit with the mouth."
    bases: { "अहं": "I", "मुखेन": "with the mouth", "संस्कृतं": "the Sanskrit language", "वदामि": "to speak (I speak)" }
    confusables: { "w1": { why: "You, not I: त्वम् (tvam) means you." }, "w2": { why: "Eye, not face: नेत्रम् (netram) means eye." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अहम् (aham) is written अहं (ahaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of मुखेन (mukhena) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). संस्कृतम् (saṃskṛtam) is written संस्कृतं (saṃskṛtaṃ), for the same reason, before वदामि (vadāmi)." }
