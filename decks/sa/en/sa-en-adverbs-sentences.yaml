cards:
  "sa-3060":
    native: "I go there and you read Sanskrit."
    bases: { "अहं": "I", "गच्छामि": "to go (I go)", "त्वं": "you", "च": "and", "संस्कृतं": "the Sanskrit language", "पठसि": "to read (you read)" }
    confusables: { "w1": { why: "He, not I: सः (saḥ) means he." }, "w2": { why: "Now, not there: इदानीम् (idānīm) means now." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अहम् (aham) is written अहं (ahaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of तत्र (tatra) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). त्वम् (tvam) is written त्वं (tvaṃ), for the same reason, before च (ca). संस्कृतम् (saṃskṛtam) is written संस्कृतं (saṃskṛtaṃ), for the same reason, before पठसि (paṭhasi). The labial keeps म् (m) in Whitney 213 a, but the anusvāra sign is the usual writing (Whitney 213 i).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3061":
    native: "Today we drink water and read a book."
    bases: { "वयं": "we", "जलं": "water", "पिबामः": "to drink (we drink)", "पुस्तकं": "book", "च": "and", "पठामः": "to read (we read)" }
    confusables: { "w1": { why: "Tomorrow, not today: श्वः (śvaḥ) means tomorrow." }, "w2": { why: "You all, not we: यूयम् (yūyam) means you all." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वयम् (vayam) is written वयं (vayaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of जलम् (jalam) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). जलम् (jalam) is written जलं (jalaṃ), for the same reason, before पिबामः (pibāmaḥ). The labial keeps म् (m) in Whitney 213 a, but the anusvāra sign is the usual writing (Whitney 213 i). पुस्तकम् (pustakam) is written पुस्तकं (pustakaṃ), for the same reason, before च (ca).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3062":
    native: "Where does father go tomorrow and where does mother stand?"
    bases: { "गच्छति": "to go (goes)", "च": "and", "तिष्ठति": "to stand (stands)" }
    confusables: { "w1": { why: "Again, not tomorrow: पुनः (punaḥ) means again." }, "w2": { why: "Brother, not father: भ्राता (bhrātā) means brother." } }
    notes: { "n1": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3063":
    native: "The friend always drinks water and the brother eats."
    bases: { "जलं": "water", "पिबति": "to drink (drinks)", "च": "and", "खादति": "to eat (eats)" }
    confusables: { "w1": { why: "Today, not always: अद्य (adya) means today." }, "w2": { why: "Son, not friend: सूनुः (sūnuḥ) means son." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. जलम् (jalam) is written जलं (jalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पिबति (pibati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3064":
    native: "You do not run quickly and we run quickly."
    bases: { "त्वं": "you", "शीघ्रं": "quickly", "धावसि": "to run (you run)", "वयं": "we", "च": "and", "धावामः": "to run (we run)" }
    confusables: { "w1": { why: "He, not you: सः (saḥ) means he." }, "w2": { why: "Far, not quickly: दूरम् (dūram) means far." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. त्वम् (tvam) is written त्वं (tvaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of शीघ्रम् (śīghram) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). शीघ्रम् (śīghram) is written शीघ्रं (śīghraṃ), for the same reason, before न (na). वयम् (vayam) is written वयं (vayaṃ), for the same reason, before च (ca). शीघ्रम् (śīghram) is written शीघ्रं (śīghraṃ), for the same reason, before धावामः (dhāvāmaḥ).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3065":
    native: "The friend drinks again and mother reads again."
    bases: { "पिबति": "to drink (drinks)", "च": "and", "पठति": "to read (reads)" }
    confusables: { "w1": { why: "Son, not friend: सूनुः (sūnuḥ) means son." }, "w2": { why: "Quickly, not again: शीघ्रम् (śīghram) means quickly." } }
    notes: { "n1": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3066":
    native: "Who is speaking Sanskrit now and who is singing?"
    bases: { "इदानीं": "now", "संस्कृतं": "the Sanskrit language", "वदति": "to speak (speaks)", "च": "and", "गायति": "to sing (sings)" }
    confusables: { "w1": { why: "Then, not now: तदा (tadā) means then." }, "w2": { why: "To cook, not to speak: पच् (pac) means to cook." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. इदानीम् (idānīm) is written इदानीं (idānīṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of का (kā) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). संस्कृतम् (saṃskṛtam) is written संस्कृतं (saṃskṛtaṃ), for the same reason, before वदति (vadati).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3067":
    native: "The brother eats a lot and father drinks a lot of water."
    bases: { "खादति": "to eat (eats)", "च": "and", "जलं": "water", "पिबति": "to drink (drinks)" }
    confusables: { "w1": { why: "Sister, not brother: स्वसा (svasā) means sister." }, "w2": { why: "To stand, not to eat: स्था (sthā) means to stand." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. जलम् (jalam) is written जलं (jalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पिबति (pibati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3068":
    native: "Sometimes father laughs and sometimes the daughter sings."
    bases: { "हसति": "to laugh (laughs)", "च": "and", "गायति": "to sing (sings)" }
    confusables: { "w1": { why: "Brother, not father: भ्राता (bhrātā) means brother." }, "w2": { why: "To live, not to laugh: वस् (vas) means to live." } }
    notes: { "n1": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
