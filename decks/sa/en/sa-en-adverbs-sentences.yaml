kind: "layer"
core: "sa-adverbs-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences with adverbs"
description: "Short sentences with the adverbs of Adverbs, built only from words already taught. Not yet checked by a Sanskrit speaker: please report any mistake."
