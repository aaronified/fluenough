cards:
  "sa-3850":
    native: "At the festival there are lamps in the temple."
    bases: { "उत्सवे": "at the festival", "मन्दिरे": "in the temple", "दीपा": "lamps", "भवन्ति": "to be (there are)" }
    confusables: { "w1": { why: "Small lamp, not lamp: दीपिका (dīpikā) means small lamp." }, "w2": { why: "Incense, not lamp: धूपः (dhūpaḥ) means incense." }, "w3": { why: "Light, not lamp: प्रकाशः (prakāśaḥ) means light." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. दीपाः (dīpāḥ) is written दीपा (dīpā) because a final आः (āḥ) loses its visarga before a voiced consonant, here the start of भवन्ति (bhavanti) (Whitney 177; Aṣṭādhyāyī 8.3.17, भो भगो अघो अपूर्वस्य यः अशि (bho bhago agho apūrvasya yaḥ aśi), with 8.3.19, लोपः शाकल्यस्य (lopaḥ śākalyasya)).", "n2": "उत्सवे (utsave) and मन्दिरे (mandire) are the locative case: where and when. दीपाः (dīpāḥ) is the nominative plural of दीपः (dīpaḥ): lamps. भवन्ति (bhavanti) is the third person plural." }
  "sa-3851":
    native: "The priest worships the god with mantras."
    bases: { "पुरोहितो": "priest", "मन्त्रैर्": "with mantras", "देवं": "god", "पूजयति": "to worship (worships)" }
    confusables: { "w1": { why: "Devotee, not priest: भक्तः (bhaktaḥ) means devotee." }, "w2": { why: "Sage, not priest: ऋषिः (ṛṣiḥ) means sage." }, "w3": { why: "Hymn, not mantra: स्तोत्रम् (stotram) means hymn." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पुरोहितः (purohitaḥ) is written पुरोहितो (purohito) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of मन्त्रैर् (mantrair) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). मन्त्रैः (mantraiḥ) is written मन्त्रैर् (mantrair) because a final ः (ḥ) after ऐ (ai) becomes र् (r) before a voiced sound, here the start of देवं (devaṃ) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174). देवम् (devam) is written देवं (devaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पूजयति (pūjayati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "मन्त्रैः (mantraiḥ) is the instrumental plural of मन्त्रः (mantraḥ): with mantras. देवम् (devam) is the accusative case of देवः (devaḥ): whom he worships." }
  "sa-3852":
    native: "The musician has a flute in his hand."
    bases: { "वादकस्य": "of the musician", "हस्ते": "in the hand", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Conch, not flute: शङ्खः (śaṅkhaḥ) means conch." }, "w2": { why: "Lute, not flute: वीणा (vīṇā) means lute." }, "w3": { why: "Foot, not hand: पादः (pādaḥ) means foot." } }
    notes: { "n1": "वादकस्य (vādakasya) is the genitive case of वादकः (vādakaḥ): of the musician. हस्ते (haste) is the locative case of हस्तः (hastaḥ): in the hand. Literally: in the musician's hand is a flute." }
  "sa-3853":
    native: "The sound of the conch is auspicious."
    bases: { "शङ्खस्य": "of the conch", "शब्दो": "sound", "मङ्गलो": "auspicious", "ऽस्ति": "to be (is)" }
    confusables: { "w1": { why: "Bell, not conch: घण्टा (ghaṇṭā) means bell." }, "w2": { why: "Good, not auspicious: कल्याणः (kalyāṇaḥ) means good." }, "w3": { why: "Rhythm, not sound: तालः (tālaḥ) means rhythm." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. शब्दः (śabdaḥ) is written शब्दो (śabdo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of मङ्गलो (maṅgalo) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). मङ्गलः (maṅgalaḥ) is written मङ्गलो (maṅgalo) because a final अः (aḥ) becomes ओ (o) before अ (a), and that अ (a) is dropped and shown by the sign ऽ (avagraha), here at the start of अस्ति (asti) (Whitney 175 a; Aṣṭādhyāyī 6.1.109, एङः पदान्तादति (eṅaḥ padāntād ati), with 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute)).", "n2": "शङ्खस्य (śaṅkhasya) is the genitive case of शङ्खः (śaṅkhaḥ): of the conch. मङ्गलः (maṅgalaḥ) is an adjective that agrees with शब्दः (śabdaḥ)." }
  "sa-3854":
    native: "A devotee gives a flower to the god in worship."
    bases: { "पूजायां": "in worship", "देवाय": "to the god", "पुष्पं": "flower", "ददाति": "to give (gives)" }
    confusables: { "w1": { why: "Offering, not flower: बलिः (baliḥ) means offering." }, "w2": { why: "Goddess, not god: देवी (devī) means goddess." }, "w3": { why: "Deity, not god: देवता (devatā) means deity." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पूजायाम् (pūjāyām) is written पूजायां (pūjāyāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of देवाय (devāya) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). पुष्पम् (puṣpam) is written पुष्पं (puṣpaṃ), for the same reason, before ददाति (dadāti).", "n2": "देवाय (devāya) is the dative case of देवः (devaḥ): to the god. पूजायाम् (pūjāyām) is the locative case of पूजा (pūjā): in worship." }
  "sa-3855":
    native: "The image of the goddess stands in the temple."
    bases: { "देव्या": "of the goddess", "मूर्तिर्": "image", "मन्दिरे": "in the temple", "तिष्ठति": "to stand (stands)" }
    confusables: { "w1": { why: "Picture, not image: चित्रम् (citram) means picture." }, "w2": { why: "Deity, not goddess: देवता (devatā) means deity." }, "w3": { why: "Hut, not temple: कुटी (kuṭī) means hut." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. देव्याः (devyāḥ) is written देव्या (devyā) because a final आः (āḥ) loses its visarga before a voiced consonant, here the start of मूर्तिर् (mūrtir) (Whitney 177; Aṣṭādhyāyī 8.3.17, भो भगो अघो अपूर्वस्य यः अशि (bho bhago agho apūrvasya yaḥ aśi), with 8.3.19, लोपः शाकल्यस्य (lopaḥ śākalyasya)). मूर्तिः (mūrtiḥ) is written मूर्तिर् (mūrtir) because a final ः (ḥ) after इ (i) becomes र् (r) before a voiced sound, here the start of मन्दिरे (mandire) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174).", "n2": "देव्याः (devyāḥ) is the genitive case of देवी (devī): of the goddess. मन्दिरे (mandire) is the locative case of मन्दिरम् (mandiram): in the temple." }
  "sa-3856":
    native: "At the wedding the bridegroom holds a garland."
    bases: { "विवाहे": "at the wedding", "वरो": "bridegroom", "मालां": "garland", "धरति": "to hold (holds)" }
    confusables: { "w1": { why: "Bride, not bridegroom: वधूः (vadhūḥ) means bride." }, "w2": { why: "Crown, not garland: मुकुटः (mukuṭaḥ) means crown." }, "w3": { why: "Bracelet, not garland: कङ्कणम् (kaṅkaṇam) means bracelet." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वरः (varaḥ) is written वरो (varo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of मालां (mālāṃ) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). मालाम् (mālām) is written मालां (mālāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of धरति (dharati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "विवाहे (vivāhe) is the locative case of विवाहः (vivāhaḥ): at the wedding. मालाम् (mālām) is the accusative case of माला (mālā): what he holds." }
  "sa-3857":
    native: "Aloe wood gives fragrance in incense."
    bases: { "अगरुर्": "aloe wood", "धूपे": "in incense", "सुगन्धं": "fragrance", "ददाति": "to give (gives)" }
    confusables: { "w1": { why: "Camphor, not aloe wood: कर्पूरः (karpūraḥ) means camphor." }, "w2": { why: "Cardamom, not aloe wood: एला (elā) means cardamom." }, "w3": { why: "Sandalwood, not aloe wood: चन्दनम् (candanam) means sandalwood." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अगरुः (agaruḥ) is written अगरुर् (agarur) because a final ः (ḥ) after उ (u) becomes र् (r) before a voiced sound, here the start of धूपे (dhūpe) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174). सुगन्धम् (sugandham) is written सुगन्धं (sugandhaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of ददाति (dadāti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "धूपे (dhūpe) is the locative case of धूपः (dhūpaḥ): in incense. सुगन्धम् (sugandham) is the accusative case: what it gives." }
  "sa-3858":
    native: "At a wedding the priest performs the rite."
    bases: { "विवाहे": "at a wedding", "संस्कारं": "rite", "करोति": "to do (performs)" }
    confusables: { "w1": { why: "Blessing, not rite: आशीर्वादः (āśīrvādaḥ) means blessing." }, "w2": { why: "Consecration, not rite: अभिषेकः (abhiṣekaḥ) means consecration." }, "w3": { why: "Initiation, not rite: दीक्षा (dīkṣā) means initiation." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. संस्कारम् (saṃskāram) is written संस्कारं (saṃskāraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पुरोहितः (purohitaḥ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "संस्कारम् (saṃskāram) is the accusative case of संस्कारः (saṃskāraḥ): what the priest performs. करोति (karoti) is the present of कृ (kṛ): does, here performs." }
  "sa-3859":
    native: "At the festival the flag flutters in the wind."
    bases: { "उत्सवे": "at the festival", "वायुना": "in the wind", "चलति": "to move (flutters)" }
    confusables: { "w1": { why: "Garment, not flag: अम्बरम् (ambaram) means garment." }, "w2": { why: "Thread, not flag: सूत्रम् (sūtram) means thread." }, "w3": { why: "To run, not to move: धाव् (dhāv) means to run." } }
    notes: { "n1": "वायुना (vāyunā) is the instrumental case of वायुः (vāyuḥ): by the wind. चलति (calati) is the present of चल् (cal): moves, here flutters." }
  "sa-3860":
    native: "In the morning devotees go to the temple."
    bases: { "प्रभाते": "in the morning", "भक्ता": "devotees", "मन्दिरं": "temple", "गच्छन्ति": "to go (go)" }
    confusables: { "w1": { why: "In the evening, not morning: सायम् (sāyam) means in the evening." }, "w2": { why: "City, not temple: नगरम् (nagaram) means city." }, "w3": { why: "To walk, not to go: चल् (cal) means to walk." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. भक्ताः (bhaktāḥ) is written भक्ता (bhaktā) because a final आः (āḥ) loses its visarga before a voiced consonant, here the start of मन्दिरं (mandiraṃ) (Whitney 177; Aṣṭādhyāyī 8.3.17, भो भगो अघो अपूर्वस्य यः अशि (bho bhago agho apūrvasya yaḥ aśi), with 8.3.19, लोपः शाकल्यस्य (lopaḥ śākalyasya)). मन्दिरम् (mandiram) is written मन्दिरं (mandiraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of गच्छन्ति (gacchanti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "प्रभाते (prabhāte) is the locative case of प्रभातम् (prabhātam): in the morning. भक्ताः (bhaktāḥ) is the nominative plural of भक्तः (bhaktaḥ): devotees. मन्दिरम् (mandiram) is the accusative case: where they go." }
