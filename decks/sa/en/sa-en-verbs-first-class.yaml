native: { code: "en", iso639_3: "eng", name: "English" }
name: "Verbs of the first class"
description: "Six common verbs of the bhū class, given as roots, the form a dictionary lists. Their present tense is built in the grammar lessons. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "sa-0430":
    native: "to be; to become"
    notes:
      "n1": "Present stem भव (bhava): the root's long ū is strengthened to guṇa, bho, and with the class sign a it runs together as bhav-a (Whitney 734)."
  "sa-0431":
    native: "to go; to move"
    notes:
      "n1": "Present stem गच्छ (gaccha): the final m of the root is replaced by ccha (Whitney 608 b and Pāṇini 7.3.77, which lists gam)."
  "sa-0432":
    native: "to read aloud; to recite"
    notes:
      "n1": "Present stem पठ (paṭha): the root with the class sign a, nothing else changed. पठति (paṭhati) is the usual verb for reciting or studying a text."
  "sa-0433":
    native: "to speak; to say"
    notes:
      "n1": "Present stem वद (vada): the root with the class sign a. Its vowel is already a short a, so strengthening changes nothing (Whitney 734)."
  "sa-0434":
    native: "to cook"
    notes:
      "n1": "Present stem पच (paca): the root with the class sign a, nothing else changed."
  "sa-0435":
    native: "to lead; to guide"
    notes:
      "n1": "Present stem नय (naya): the long ī is strengthened to guṇa, ne, and e before the class sign a becomes ay-a (Whitney 606)."
