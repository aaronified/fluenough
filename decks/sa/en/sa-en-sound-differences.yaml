schema: 1
id: "sa-en-sound-differences"
kind: "layer"
core: "sa-sound-differences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sounds to tell apart"
license: "CC-BY-SA-4.0"
description: "Pairs of words that differ in one sound: a short or long vowel, a breath after a consonant, the tongue on the teeth or curled back, a voiced or unvoiced consonant, and the three s-sounds. Not yet checked by a Sanskrit speaker: please report any mistake."
tags: ["unreviewed"]
cards:
  "sa-0400":
    native: "family; clan"
    notes:
      "n1": "Vowel length: कुल (kula, family) has the short u where कूल (kūla, bank, shore) has the long ū."
  "sa-0401":
    native: "bank; shore"
    notes:
      "n1": "Vowel length: कूल (kūla, bank) has the long ū where कुल (kula, family) has the short u."
  "sa-0402":
    native: "city; fortress"
    notes:
      "n1": "Vowel length: पुर (pura, city) has the short u where पूर (pūra, flood) has the long ū."
  "sa-0403":
    native: "flood; a filling"
    notes:
      "n1": "Vowel length: पूर (pūra, flood) has the long ū where पुर (pura, city) has the short u."
  "sa-0404":
    native: "hand"
    notes:
      "n1": "Vowel length: कर (kara, hand) has the short a where कार (kāra, act) has the long ā. And voicing: गर (gara, poison) is कर (kara) with a voiced g in place of k."
  "sa-0405":
    native: "act; deed"
    notes:
      "n1": "Vowel length: कार (kāra, act) has the long ā where कर (kara, hand) has the short a."
  "sa-0406":
    native: "flesh; meat"
    notes:
      "n1": "Aspiration: फल (phala, fruit) is पल (pala, flesh) with a puff of breath after the p."
  "sa-0407":
    native: "fruit"
    notes:
      "n1": "Aspiration: फल (phala, fruit) has a puff of breath after the p that पल (pala, flesh) lacks."
  "sa-0408":
    native: "child; boy"
    notes:
      "n1": "Aspiration: भाल (bhāla, forehead) is बाल (bāla, child) with a puff of breath after the b. And voicing: पाल (pāla, guard) is बाल (bāla) with p in place of b."
  "sa-0409":
    native: "forehead"
    notes:
      "n1": "Aspiration: भाल (bhāla, forehead) has a puff of breath after the b that बाल (bāla, child) lacks."
  "sa-0410":
    native: "gift; giving"
    notes:
      "n1": "Aspiration: धान (dhāna, container) is दान (dāna, gift) with a puff of breath after the d."
  "sa-0411":
    native: "receptacle; container"
    notes:
      "n1": "Aspiration: धान (dhāna, container) has a puff of breath after the d that दान (dāna, gift) lacks."
  "sa-0412":
    native: "wind"
    notes:
      "n1": "Dental and retroflex: वात (vāta, wind) has t with the tongue on the teeth, and वाट (vāṭa, enclosure) has ṭ with the tongue curled back."
  "sa-0413":
    native: "enclosure; fence"
    notes:
      "n1": "Dental and retroflex: वाट (vāṭa, enclosure) has ṭ with the tongue curled back, and वात (vāta, wind) has t with the tongue on the teeth."
  "sa-0414":
    native: "fall; flight"
    notes:
      "n1": "Dental and retroflex: पात (pāta, fall) has t on the teeth, and पाठ (pāṭha, recitation) has ṭh, curled back and with a puff of breath."
  "sa-0415":
    native: "recitation; reading"
    notes:
      "n1": "Dental and retroflex: पाठ (pāṭha, recitation) has ṭh, curled back and with a puff of breath, where पात (pāta, fall) has t on the teeth."
  "sa-0416":
    native: "after; along"
    notes:
      "n1": "Dental and retroflex: अनु (anu, after) has n on the teeth, and अणु (aṇu, atom) has ṇ with the tongue curled back. The two are told apart by this sound alone."
  "sa-0417":
    native: "atom; tiny particle"
    notes:
      "n1": "Dental and retroflex: अणु (aṇu, atom) has ṇ with the tongue curled back, and अनु (anu, after) has n on the teeth. The two are told apart by this sound alone."
  "sa-0418":
    native: "poison; a harmful drink"
    notes:
      "n1": "Voicing: गर (gara, poison) has a voiced g where कर (kara, hand) has an unvoiced k."
  "sa-0419":
    native: "guard; protector"
    notes:
      "n1": "Voicing: पाल (pāla, guard) has an unvoiced p where बाल (bāla, child) has a voiced b."
  "sa-0420":
    native: "calm; tranquillity"
    notes:
      "n1": "The three s-sounds: शम (śama, calm) has ś against the palate, where सम (sama, same) has s on the teeth."
  "sa-0421":
    native: "same; equal"
    notes:
      "n1": "The three s-sounds: सम (sama, same) has s on the teeth, where शम (śama, calm) has ś against the palate."
