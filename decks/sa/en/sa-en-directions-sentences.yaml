cards:
  "sa-3130":
    native: "There is water above and father goes there."
    bases: { "जलं": "water", "भवति": "to be (is)", "गच्छति": "to go (goes)" }
    confusables: { "w1": { why: "Below, not above: अधस्तात् (adhastāt) means below." }, "w2": { why: "Fire, not water: अग्निः (agniḥ) means fire." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. जलम् (jalam) is written जलं (jalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of भवति (bhavati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3131":
    native: "The friend goes in front and father goes behind."
    bases: { "गच्छति": "to go (goes)" }
    confusables: { "w1": { why: "Above, not in front: उपरि (upari) means above." }, "w2": { why: "Son, not friend: सूनुः (sūnuḥ) means son." } }
    notes: { "n1": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3132":
    native: "The right hand brings water."
    bases: { "दक्षिणो": "right-hand", "हस्तो": "hand", "जलं": "water", "नयति": "to bring (brings)" }
    confusables: { "w1": { why: "In front, not right-hand: अग्रे (agre) means in front." }, "w2": { why: "Foot, not hand: पादः (pādaḥ) means foot." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. दक्षिणः (dakṣiṇaḥ) is written दक्षिणो (dakṣiṇo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of हस्तः (hastaḥ) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). हस्तः (hastaḥ) is written हस्तो (hasto), for the same reason, before जलम् (jalam). जलम् (jalam) is written जलं (jalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of नयति (nayati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign)." }
  "sa-3133":
    native: "The book is below and mother reads there."
    bases: { "पुस्तकं": "book", "तिष्ठति": "to stand (stands)", "पठति": "to read (reads)" }
    confusables: { "w1": { why: "Right-hand, not below: दक्षिणः (dakṣiṇaḥ) means right-hand." }, "w2": { why: "Student, not book: शिष्यः (śiṣyaḥ) means student." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पुस्तकम् (pustakam) is written पुस्तकं (pustakaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of तिष्ठति (tiṣṭhati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3134":
    native: "Who stands in front and who goes behind?"
    bases: { "तिष्ठति": "to stand (stands)", "गच्छति": "to go (goes)" }
    confusables: { "w1": { why: "Above, not in front: उपरि (upari) means above." }, "w2": { why: "To laugh, not to stand: हस् (has) means to laugh." } }
    notes: { "n1": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3135":
    native: "Who lives above and where does mother live?"
    bases: { "को": "who", "वसति": "to live (lives)" }
    confusables: { "w1": { why: "Below, not above: अधस्तात् (adhastāt) means below." }, "w2": { why: "When, not who: कदा (kadā) means when." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. कः (kaḥ) is written को (ko) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of वसति (vasati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3136":
    native: "The right foot does not move and mother reads there."
    bases: { "पादो": "foot", "चलति": "to move (moves)", "पठति": "to read (reads)" }
    confusables: { "w1": { why: "In front, not right-hand: अग्रे (agre) means in front." }, "w2": { why: "Face, not foot: मुखम् (mukham) means face." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पादः (pādaḥ) is written पादो (pādo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of न (na) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3137":
    native: "Mother stands in front and father reads behind."
    bases: { "तिष्ठति": "to stand (stands)", "पठति": "to read (reads)" }
    confusables: { "w1": { why: "Above, not in front: उपरि (upari) means above." }, "w2": { why: "Brother, not mother: भ्राता (bhrātā) means brother." } }
    notes: { "n1": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
