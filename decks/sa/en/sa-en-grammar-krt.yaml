name: "Primary derivation (kṛt): ghañ, lyuṭ, tṛc, ktin and ṇvul"
description: "The nouns that the verbs of the course make by kṛt suffixes: the action nouns in -a, -ana and -ti and the doer nouns in -tṛ and -aka, with the sūtras, the change of the root and the verbs of the course as examples. Only nouns found on Wiktionary are cells; an empty cell means none was found. Not yet checked by a Sanskrit speaker: please report any mistake. For the verbs of sa-verbs-3 a cell holds only a form read on the en.wiktionary.org root page or conjugation table, or made by a rule marked in the review queue; an empty cell means none was found."
