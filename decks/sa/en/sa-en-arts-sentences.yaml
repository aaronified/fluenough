cards:
  "sa-3960":
    native: "The actor dances on the stage at night."
    bases: { "नटो": "actor", "मञ्चे": "on the stage", "नृत्यति": "to dance (dances)" }
    confusables: { "w1": { why: "Jester or fool in a play, not actor: विदूषकः (vidūṣakaḥ) means jester or fool in a play." }, "w2": { why: "Curtain or screen, not stage: यवनिका (yavanikā) means curtain or screen." }, "w3": { why: "To play, not to dance: क्रीड् (krīḍ) means to play." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. नटः (naṭaḥ) is written नटो (naṭo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of मञ्चे (mañce) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "मञ्चे (mañce) is the locative case of मञ्चः (mañcaḥ): on the stage. नृत्यति (nṛtyati) is the present of नृत् (nṛt): dances." }
  "sa-3961":
    native: "In the evening the great poet writes a great poem."
    bases: { "सायं": "in the evening", "महाकविर्": "great poet", "महाकाव्यं": "great poem", "लिखति": "to write (writes)" }
    confusables: { "w1": { why: "Poem or work of literary art, not great poem: काव्यम् (kāvyam) means poem or work of literary art." }, "w2": { why: "Poetry, not great poet: कविता (kavitā) means poetry." }, "w3": { why: "To hear, not to write: श्रु (śru) means to hear." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सायम् (sāyam) is written सायं (sāyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of महाकविर् (mahākavir) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). महाकविः (mahākaviḥ) is written महाकविर् (mahākavir) because a final ः (ḥ) after इ (i) becomes र् (r) before a voiced sound, here the start of महाकाव्यं (mahākāvyaṃ) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174). महाकाव्यम् (mahākāvyam) is written महाकाव्यं (mahākāvyaṃ), for the same reason, before लिखति (likhati).", "n2": "महाकाव्यम् (mahākāvyam) is the accusative case: what he writes. लिखति (likhati) is the present of लिख् (likh): writes." }
  "sa-3962":
    native: "A flute makes a sweet sound."
    bases: { "वेणुर्": "flute", "मधुरं": "sweet", "नादं": "sound", "करोति": "to do (makes)" }
    confusables: { "w1": { why: "Small drum, not flute: डमरुः (ḍamaruḥ) means small drum." }, "w2": { why: "Cold, not sweet: शीतः (śītaḥ) means cold." }, "w3": { why: "Musical note or a run of notes in singing, not sound: तानः (tānaḥ) means musical note or a run of notes in singing." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वेणुः (veṇuḥ) is written वेणुर् (veṇur) because a final ः (ḥ) after उ (u) becomes र् (r) before a voiced sound, here the start of मधुरं (madhuraṃ) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174). मधुरम् (madhuram) is written मधुरं (madhuraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of नादं (nādaṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). नादम् (nādam) is written नादं (nādaṃ), for the same reason, before करोति (karoti).", "n2": "मधुरम् (madhuram) is the neuter form of मधुरः (madhuraḥ), agreeing with नादम् (nādam), the accusative: what the flute makes." }
  "sa-3963":
    native: "The actor has a small drum in his hand."
    bases: { "नटस्य": "of the actor", "हस्ते": "in the hand", "डमरुर्": "small drum", "अस्ति": "to be (is)" }
    confusables: { "w1": { why: "Large or double drum, not drum: ढक्का (ḍhakkā) means large or double drum." }, "w2": { why: "Bamboo or reed, not drum: वेणुः (veṇuḥ) means bamboo or reed." }, "w3": { why: "Foot, not hand: पादः (pādaḥ) means foot." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. डमरुः (ḍamaruḥ) is written डमरुर् (ḍamarur) because a final ः (ḥ) after उ (u) becomes र् (r) before a voiced sound, here the start of अस्ति (asti) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174).", "n2": "नटस्य (naṭasya) is the genitive case of नटः (naṭaḥ): of the actor. हस्ते (haste) is the locative case of हस्तः (hastaḥ): in the hand. Literally: in the actor's hand is a small drum." }
  "sa-3964":
    native: "The painter paints a picture with a brush."
    bases: { "चित्रकरो": "painter", "वर्तिकया": "with a brush", "चित्रं": "picture", "लिखति": "to write (paints)" }
    confusables: { "w1": { why: "Line, not brush: रेखा (rekhā) means line." }, "w2": { why: "Potter, not painter: कुम्भकारः (kumbhakāraḥ) means potter." }, "w3": { why: "To hear, not to write: श्रु (śru) means to hear." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. चित्रकरः (citrakaraḥ) is written चित्रकरो (citrakaro) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of वर्तिकया (vartikayā) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). चित्रम् (citram) is written चित्रं (citraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of लिखति (likhati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "वर्तिकया (vartikayā) is the instrumental case of वर्तिका (vartikā): with a brush. लिखति (likhati) is the present of लिख् (likh), which means scratches, writes and also draws." }
  "sa-3965":
    native: "The scribe writes a letter on a tablet."
    bases: { "पट्टे": "on a tablet", "वर्णं": "letter", "लिखति": "to write (writes)" }
    confusables: { "w1": { why: "Act of writing or a piece of writing, not scribe: लेखनम् (lekhanam) means act of writing or a piece of writing." }, "w2": { why: "Painter, not scribe: चित्रकरः (citrakaraḥ) means painter." }, "w3": { why: "Script, not letter: लिपिः (lipiḥ) means script." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वर्णम् (varṇam) is written वर्णं (varṇaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of लिखति (likhati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "पट्टे (paṭṭe) is the locative case of पट्टः (paṭṭaḥ): on a tablet. वर्णम् (varṇam) is the accusative case of वर्णः (varṇaḥ): a letter of the alphabet, what he writes." }
  "sa-3966":
    native: "A poem shines beautifully with figures of speech."
    bases: { "अलंकारेण": "with figures of speech", "काव्यं": "poem", "सुन्दरं": "beautifully", "शोभति": "to shine (shines)" }
    confusables: { "w1": { why: "Juice or flavour, not ornament: रसः (rasaḥ) means juice or flavour." }, "w2": { why: "Prose, not poem: गद्यम् (gadyam) means prose." }, "w3": { why: "To be hot, not to shine: तप् (tap) means to be hot." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. काव्यम् (kāvyam) is written काव्यं (kāvyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of सुन्दरं (sundaraṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). सुन्दरम् (sundaram) is written सुन्दरं (sundaraṃ), for the same reason, before शोभति (śobhati).", "n2": "अलंकारेण (alaṃkāreṇa) is the instrumental case of अलंकारः (alaṃkāraḥ): with ornament, here the figures of speech. सुन्दरम् (sundaram) is used as an adverb: beautifully." }
  "sa-3967":
    native: "The jester makes people laugh in the play."
    bases: { "विदूषको": "jester", "नाटके": "in the play", "हासं": "laughter", "करोति": "to do (makes)" }
    confusables: { "w1": { why: "Actor or performer on the stage, not jester: नटः (naṭaḥ) means actor or performer on the stage." }, "w2": { why: "Short play in four acts with a light and romantic plot, not play: नाटिका (nāṭikā) means short play in four acts with a light and romantic plot." }, "w3": { why: "Joy, not laughter: प्रमोदः (pramodaḥ) means joy." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. विदूषकः (vidūṣakaḥ) is written विदूषको (vidūṣako) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of नाटके (nāṭake) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). हासम् (hāsam) is written हासं (hāsaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of करोति (karoti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "नाटके (nāṭake) is the locative case of नाटकम् (nāṭakam): in the play. हासम् करोति (hāsam karoti) means makes laughter, that is, makes people laugh." }
  "sa-3968":
    native: "Skill grows with constant practice."
    bases: { "अभ्यासेन": "with practice", "कौशलं": "skill", "वर्धते": "to grow (grows)" }
    confusables: { "w1": { why: "Skill in speech, not skill: वाक्पटुत्वम् (vākpaṭutvam) means skill in speech." }, "w2": { why: "Instruction and teaching, not practice: शिक्षणम् (śikṣaṇam) means instruction and teaching." }, "w3": { why: "To be worthy, not to grow: अर्ह् (arh) means to be worthy." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. कौशलम् (kauśalam) is written कौशलं (kauśalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of वर्धते (vardhate) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "अभ्यासेन (abhyāsena) is the instrumental case of अभ्यासः (abhyāsaḥ): with practice. वर्धते (vardhate) is the middle-voice present of वृध् (vṛdh): grows. नित्यम् (nityam) stays with its final म् (m) before the vowel of अभ्यासेन (abhyāsena)." }
  "sa-3969":
    native: "The speech of the great poet is delightful."
    bases: { "महाकवेर्": "of the great poet", "रम्या": "delightful", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Sound, not speech: ध्वनिः (dhvaniḥ) means sound." }, "w2": { why: "Language, not speech: भाषा (bhāṣā) means language." }, "w3": { why: "Excellent and highest, not delightful: उत्तमः (uttamaḥ) means excellent and highest." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. महाकवेः (mahākaveḥ) is written महाकवेर् (mahākaver) because a final ः (ḥ) after ए (e) becomes र् (r) before a voiced sound, here the start of वाणी (vāṇī) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174).", "n2": "महाकवेः (mahākaveḥ) is the genitive case of महाकविः (mahākaviḥ): of the great poet. रम्या (ramyā) is the feminine form of रम्यः (ramyaḥ), to agree with वाणी (vāṇī), a feminine word." }
