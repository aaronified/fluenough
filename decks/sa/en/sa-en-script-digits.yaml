schema: 1
id: "sa-en-script-digits"
kind: "layer"
core: "sa-script-digits"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Classical Sanskrit digits"
description: "The Devanagari digits 0 to 9, each with the Sanskrit number word it is read as. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "sa-4060":
    native: "zero, read शून्यम् (śūnyam)"
    notes:
      "n1": "Written as the digit ० (0), read as शून्यम् (śūnyam); the digit stands for its number in any text."
      "n2": "Written apart: Before a vowel the words stay apart and the vowels are not joined: sandhi is not applied here; see the lesson sa-grammar-sandhi-vowel (Whitney 133)."
    examples:
      "अध्यायः ०।": "Chapter 0."
      "० इति संख्या।": "0 is a number."
