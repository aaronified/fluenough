      "च": { meaning: "and" }
      "तस्य": { meaning: "of that one" }
      "सौख्यस्य": { meaning: "happiness (of happiness)" }
      "न": { meaning: "not" }
      "किञ्चित्": { meaning: "anything" }
      "प्रतिमं": { meaning: "equal" }
      "सुखम्": { meaning: "happiness" }
  "sa-8132":
    native: "A man with friends achieves even aims that are hard to reach; so one should make friends of one's own kind."
    notes:
      "literal": "Said to urge making friends of equal standing."
    bases:
      "मित्रवान्": { meaning: "having friends" }
      "साधयत्य्": { meaning: "to accomplish (he accomplishes)" }
