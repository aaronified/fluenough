      "अपि": { meaning: "even" }
      "वै": { meaning: "indeed" }
      "यतः": { meaning: "from which" }
      "तस्मान्": { meaning: "therefore" }
      "मित्राणि": { meaning: "friend" }
      "कुर्वीत": { meaning: "to make (one should make)" }
      "समानान्य्": { meaning: "equal, like" }
      "एव": { meaning: "indeed" }
      "चात्मनः": { meaning: "and + self (and of oneself)" }
  "sa-8133":
    native: "Even those who have every fullness should make friends; the ocean, though full, waits for the rising of the moon."
    notes:
      "literal": "Said that even the self-sufficient need friends."
    bases:
      "अपि": { meaning: "even" }
      "संपूर्णता": { meaning: "fullness" }
      "युक्तैः": { meaning: "endowed (by those endowed)" }
