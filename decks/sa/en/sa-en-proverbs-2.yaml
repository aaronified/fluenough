native: { code: "en", iso639_3: "eng", name: "English" }
name: "Proverbs: subhāṣita 2"
description: "Twenty Sanskrit verses of advice on friends, company and conduct, from texts in the public domain, each with its English meaning, what it is said of and the meaning of each word. Not yet checked by a Sanskrit speaker: please report any mistake."
