name: "Proverbs: subhāṣita 2"
description: "Twenty Sanskrit verses of advice on friends, company and conduct, from texts in the public domain, each with its English meaning and what it is said of. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sa-8120":
    native: "The gathering of even small things does the work; with blades of grass twisted into a rope even maddened elephants are tied."
    notes:
      "literal": "Said to teach that unity makes small things strong."
  "sa-8121":
    native: "Union is best for people, even with few of their own kin; rice grains stripped of their husk do not sprout."
    notes:
      "literal": "Said to show that people need their family and friends, since apart they cannot grow."
  "sa-8122":
    native: "Make friends of whatever kind, even hundreds; see how the doves were freed from their bonds by their friend the mouse."
    notes:
      "literal": "Said to urge making many friends, since even a small one may help."
  "sa-8123":
    native: "\"This one is mine, that one is a stranger's\" is the counting of small minds; for those of generous character the whole earth is one family."
    notes:
      "literal": "Said to teach a wide, welcoming view of others; the last words are a well-known saying."
  "sa-8124":
    native: "A friend is known in troubles, a hero in battle, an honest man in debt, a wife when wealth is gone, and relatives in misfortune."
    notes:
      "literal": "Said to teach that people are tested in hard times."
  "sa-8125":
    native: "Avoid such a friend, who ruins your work behind your back and speaks sweetly to your face, like a pot of poison with milk on top."
    notes:
      "literal": "Said as a warning against a false friend."
  "sa-8126":
    native: "Purity, generosity, courage, evenness in joy and sorrow, courtesy, loyalty and truthfulness are the qualities of a friend."
    notes:
      "literal": "Said to list what makes a true friend."
  "sa-8127":
    native: "Betraying secrets, begging, harshness, a fickle mind, anger, untruth and gambling are the faults of a friend."
    notes:
      "literal": "Said to list the faults that spoil a friendship."
  "sa-8128":
    native: "His life is fruitful on whose life brahmins, friends and kinsmen live; who does not live for himself?"
    notes:
      "literal": "Said that a life is worth living when others depend on it."
  "sa-8129":
    native: "He who wants to mend a friendship with someone once found false takes death into himself, like the she-mule that conceives."
    notes:
      "literal": "Said as a warning not to trust again a friend who has once betrayed you."
  "sa-8130":
    native: "When trouble comes to any mortal, no one but a friend gives help, even if only in words."
    notes:
      "literal": "Said that in trouble it is a friend who helps."
  "sa-8131":
    native: "He in whose house friends gather every day has in his heart a happiness with nothing to match it."
    notes:
      "literal": "Said of the joy of having friends come to one's house."
  "sa-8132":
    native: "A man with friends achieves even aims that are hard to reach; so one should make friends of one's own kind."
    notes:
      "literal": "Said to urge making friends of equal standing."
  "sa-8133":
    native: "Even those who have every fullness should make friends; the ocean, though full, waits for the rising of the moon."
    notes:
      "literal": "Said that even the self-sufficient need friends."
  "sa-8134":
    native: "One becomes a friend for a reason and an enemy for a reason; so a wise person should make friendship, not enmity."
    notes:
      "literal": "Said to teach that friendship and enmity both have causes, and the wise choose friendship."
  "sa-8135":
    native: "Wise people say that friendship among the good comes with seven steps; so, since you have become my friend, hear my words."
    notes:
      "literal": "Said when a friendship is formed, because seven steps taken together make a bond."
  "sa-8136":
    native: "What use are sandalwood with camphor, or cool frost; none of them equals a sixteenth part of a friend's body."
    notes:
      "literal": "Said that a friend's company is better than all cooling things."
  "sa-8137":
    native: "Who made this nectar, the two syllables \"friend\", which is a protector in troubles and a medicine for the burning of grief?"
    notes:
      "literal": "Said in praise of the word \"friend\" as the best remedy for sorrow."
  "sa-8138":
    native: "He who makes a friend of an enemy stronger than himself does, without doubt, the same as eating poison."
    notes:
      "literal": "Said as a warning against trusting a stronger enemy."
  "sa-8139":
    native: "Forgiveness toward enemy and friend alike is the ornament of ascetics; toward offenders it is the fault of kings."
    notes:
      "literal": "Said that forgiveness suits ascetics, while a king must not let wrongdoing go."
