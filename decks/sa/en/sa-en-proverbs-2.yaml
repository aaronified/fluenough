      "चंद्रोदयम्": { meaning: "moon + rising" }
      "अपेक्षते": { meaning: "to wait for (it waits for)" }
  "sa-8134":
    native: "One becomes a friend for a reason and an enemy for a reason; so a wise person should make friendship, not enmity."
    notes:
      "literal": "Said to teach that friendship and enmity both have causes, and the wise choose friendship."
    bases:
