      "अन्यो": { meaning: "other (anyone else)" }
      "न": { meaning: "not" }
      "संदधे": { meaning: "to give (he gives)" }
  "sa-8131":
    native: "He in whose house friends gather every day has in his heart a happiness with nothing to match it."
    notes:
      "literal": "Said of the joy of having friends come to one's house."
    bases:
      "सुहृदो": { meaning: "friend" }
      "भवने": { meaning: "house (in a house)" }
      "यस्य": { meaning: "whose" }
      "समागच्छंति": { meaning: "to come together (they gather)" }
      "नित्यशः": { meaning: "every day" }
