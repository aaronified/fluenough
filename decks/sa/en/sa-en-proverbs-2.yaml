tags: ["unreviewed"]
cards:
  "sa-8120":
    native: "The gathering of even small things does the work; with blades of grass twisted into a rope even maddened elephants are tied."
    notes:
      "literal": "Said to teach that unity makes small things strong."
    bases:
      "अल्पानाम्": { meaning: "small (of small things)" }
      "अपि": { meaning: "even" }
      "वस्तूनां": { meaning: "thing (of things)" }
      "संहतिः": { meaning: "union, gathering" }
      "कार्य": { meaning: "work, task" }
      "साधिका": { meaning: "accomplishing" }
      "तृणैर्": { meaning: "grass (by blades of grass)" }
      "गुणत्वम्": { meaning: "the state of being a rope" }
      "आपन्नैर्": { meaning: "come to, reached (that have come to)" }
      "बध्यंते": { meaning: "to bind (are bound)" }
      "मत्त": { meaning: "maddened" }
      "दंतिनः": { meaning: "elephant (the tusked one)" }
  "sa-8121":
    native: "Union is best for people, even with few of their own kin; rice grains stripped of their husk do not sprout."
    notes:
      "literal": "Said to show that people need their family and friends, since apart they cannot grow."
    bases:
      "संहतिः": { meaning: "union, gathering" }
      "श्रेयसी": { meaning: "better" }
      "पुंसां": { meaning: "man, person (of people)" }
      "स्वकुलैर्": { meaning: "own + family (with their own kin)" }
      "अल्पकैर्": { meaning: "few, small (with few)" }
      "अपि": { meaning: "even" }
      "तुषेणापि": { meaning: "husk + even (even by the husk)" }
      "परित्यक्ता": { meaning: "stripped, left" }
      "न": { meaning: "not" }
      "प्ररोहंति": { meaning: "to sprout (they sprout)" }
      "तंडुलाः": { meaning: "rice grain" }
  "sa-8122":
    native: "Make friends of whatever kind, even hundreds; see how the doves were freed from their bonds by their friend the mouse."
    notes:
      "literal": "Said to urge making many friends, since even a small one may help."
    bases:
      "यानि": { meaning: "whichever" }
      "कानि": { meaning: "which" }
      "च": { meaning: "and" }
      "मित्राणि": { meaning: "friend" }
      "कर्तव्यानि": { meaning: "to be made" }
      "शतानि": { meaning: "hundred" }
      "पश्य": { meaning: "to see (look!)" }
      "मूषिक": { meaning: "mouse" }
      "मित्रेण": { meaning: "friend (by the friend)" }
      "कपोता": { meaning: "dove" }
      "मुक्त": { meaning: "freed" }
      "बंधनाः": { meaning: "bond" }
  "sa-8123":
    native: "\"This one is mine, that one is a stranger's\" is the counting of small minds; for those of generous character the whole earth is one family."
    notes:
      "literal": "Said to teach a wide, welcoming view of others; the last words are a well-known saying."
    bases:
      "अयं": { meaning: "this" }
      "निजः": { meaning: "one's own" }
      "परो": { meaning: "stranger" }
      "वेति": { meaning: "or + thus" }
      "गणना": { meaning: "counting" }
      "लघु": { meaning: "little" }
      "चेतसाम्": { meaning: "mind (of minds)" }
      "उदार": { meaning: "generous" }
      "चरितानां": { meaning: "conduct (of those whose conduct is)" }
      "तु": { meaning: "but" }
      "वसुधैव": { meaning: "earth + only" }
      "कुटुंबकम्": { meaning: "family" }
  "sa-8124":
    native: "A friend is known in troubles, a hero in battle, an honest man in debt, a wife when wealth is gone, and relatives in misfortune."
    notes:
      "literal": "Said to teach that people are tested in hard times."
    bases:
      "आपत्सु": { meaning: "trouble (in troubles)" }
      "मित्रं": { meaning: "friend" }
      "जानीयाद्": { meaning: "to know (one should know)" }
      "रणे": { meaning: "battle (in battle)" }
      "शूरं": { meaning: "hero" }
      "ऋणे": { meaning: "debt (in debt)" }
      "शुचिम्": { meaning: "honest, pure (an honest man)" }
      "भार्यां": { meaning: "wife" }
      "क्षीणेषु": { meaning: "gone (when gone)" }
      "वित्तेषु": { meaning: "wealth (when wealth is)" }
      "व्यसनेषु": { meaning: "misfortune (in misfortunes)" }
      "च": { meaning: "and" }
      "बांधवान्": { meaning: "relative" }
  "sa-8125":
    native: "Avoid such a friend, who ruins your work behind your back and speaks sweetly to your face, like a pot of poison with milk on top."
    notes:
      "literal": "Said as a warning against a false friend."
    bases:
      "परोक्षे": { meaning: "out of sight (behind the back)" }
      "कार्य": { meaning: "work, task" }
      "हंतारं": { meaning: "destroyer (one who ruins)" }
      "प्रत्यक्षे": { meaning: "in front (to the face)" }
      "प्रिय": { meaning: "pleasant" }
      "वादिनम्": { meaning: "speaking (one who speaks)" }
      "वर्जयेत्": { meaning: "to avoid (one should avoid)" }
      "तादृशं": { meaning: "such" }
      "मित्रं": { meaning: "friend" }
      "विष": { meaning: "poison" }
      "कुंभं": { meaning: "pot" }
      "पयोमुखम्": { meaning: "milk + mouth (milk at the mouth)" }
  "sa-8126":
    native: "Purity, generosity, courage, evenness in joy and sorrow, courtesy, loyalty and truthfulness are the qualities of a friend."
    notes:
      "literal": "Said to list what makes a true friend."
    bases:
      "शुचित्वम्": { meaning: "purity" }
      "त्यागिता": { meaning: "generosity" }
      "शौर्यं": { meaning: "courage" }
      "सामांयं": { meaning: "evenness, sameness" }
      "सुख": { meaning: "joy" }
      "दुःखयोः": { meaning: "sorrow (in sorrow)" }
      "दाक्षिण्यं": { meaning: "courtesy" }
      "चानुरक्तिश्": { meaning: "and + loyalty" }
      "च": { meaning: "and" }
      "सत्यता": { meaning: "truthfulness" }
      "सुहृद्": { meaning: "friend" }
      "गुणाः": { meaning: "quality" }
  "sa-8127":
    native: "Betraying secrets, begging, harshness, a fickle mind, anger, untruth and gambling are the faults of a friend."
    notes:
      "literal": "Said to list the faults that spoil a friendship."
    bases:
      "रहस्य": { meaning: "secret" }
      "भेदो": { meaning: "betrayal, breaking" }
      "याच्ञा": { meaning: "begging" }
      "च": { meaning: "and" }
      "नैष्ठुर्यं": { meaning: "harshness" }
      "चल": { meaning: "unsteady" }
      "चित्तया": { meaning: "state of mind (fickleness of mind)" }
      "क्रोधो": { meaning: "anger" }
      "निःसत्यता": { meaning: "untruthfulness" }
      "द्यूतम्": { meaning: "gambling" }
      "एतन्": { meaning: "this" }
      "मित्रस्य": { meaning: "friend (of a friend)" }
      "दूषणम्": { meaning: "fault" }
  "sa-8128":
    native: "His life is fruitful on whose life brahmins, friends and kinsmen live; who does not live for himself?"
    notes:
      "literal": "Said that a life is worth living when others depend on it."
    bases:
      "जीविते": { meaning: "life (in the life)" }
      "यस्य": { meaning: "whose" }
      "जीवंति": { meaning: "to live (they live)" }
      "विप्रा": { meaning: "brahmin" }
      "मित्राणि": { meaning: "friend" }
      "बांधवाः": { meaning: "relative" }
      "सफलं": { meaning: "fruitful" }
      "जीवितं": { meaning: "life" }
      "तस्य": { meaning: "of that one" }
      "आत्मार्थे": { meaning: "one's own sake (for oneself)" }
      "को": { meaning: "who" }
      "न": { meaning: "not" }
      "जीवति": { meaning: "to live (he lives)" }
  "sa-8129":
    native: "He who wants to mend a friendship with someone once found false takes death into himself, like the she-mule that conceives."
    notes:
      "literal": "Said as a warning not to trust again a friend who has once betrayed you."
    bases:
      "सकृद्": { meaning: "once" }
      "दुष्टं": { meaning: "found false, wicked" }
      "तु": { meaning: "but" }
      "यो": { meaning: "who" }
      "मित्रं": { meaning: "friend" }
      "पुनः": { meaning: "again" }
      "संधातुम्": { meaning: "to join, to mend (to mend)" }
      "इच्छति": { meaning: "to wish (he wishes)" }
      "स": { meaning: "he" }
      "मृत्युर्": { meaning: "death" }
      "एव": { meaning: "indeed" }
      "गृह्णाति": { meaning: "to take (he takes)" }
      "गर्भम्": { meaning: "womb, embryo" }
      "अश्वतरी": { meaning: "she-mule" }
      "यथा": { meaning: "as" }
  "sa-8130":
    native: "When trouble comes to any mortal, no one but a friend gives help, even if only in words."
    notes:
      "literal": "Said that in trouble it is a friend who helps."
    bases:
      "सर्वेषाम्": { meaning: "all (of all)" }
      "एव": { meaning: "indeed" }
      "मर्त्यानां": { meaning: "mortal (of mortals)" }
