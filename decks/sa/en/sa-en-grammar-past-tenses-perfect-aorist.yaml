rules:
  "sa-rule-perfect-active":
    name: "Perfect, active: the doubled root and -a, -atuḥ, -uḥ"
    explanation: "The perfect is the past tense Pāṇini calls liṭ: sūtra 3.2.115 says {1}, liṭ for a past that the speaker did not see (parokṣa). Its stem begins with the root said twice: sūtra 6.1.8 says {2}, that in liṭ the root is doubled (the first part is the reduplication, Whitney 780 to 782). The consonant of the doubled syllable is the first consonant of the root, with an aspirate becoming unaspirated and a velar becoming palatal (babhūva, jagāma: the root bhū gives ba, the root gam gives ja), and a root vowel a, ā or ṛ gives a in it (Whitney 782): {3} from {4}, {5} from {6}, {7} from {8} and {9} from {10}. The root has a strong stem in the singular and a weak stem in the dual and plural (Whitney 792): {5} but {11} and {12}, and {9} but {13} and {14}. The endings of the active perfect are -a, -atuḥ, -uḥ in the third person, -tha, -athuḥ, -a in the second and -a, -iva, -ima in the first (Whitney 795, 796): {15}, {16}, {17}. The consonant endings take a joining i, often in the later language (Whitney 796, 797). A root in long ā has -au in the first and third singular (Whitney 795): {18} from {19}, {20} from {21}. Where Wiktionary lists more than one form for a person, the first one is the form taught here."
  "sa-rule-perfect-middle":
    name: "Perfect, middle: the doubled root and -e, -āte, -ire"
    explanation: "The middle perfect has the same reduplicated stem with the middle endings -e, -āte, -ire, -iṣe, -āthe, -idhve, -e, -ivahe, -imahe (Whitney 795, 796, 799): {1}, {2}, {3} for the verb to put, with the weak stem {4} in front of the ending, and {5}, {6}. The same pattern is seen in {7} (to know) and {8} (to hear). The middle-only verb {9} (to turn) has the perfect {10}, {11}, {12}."
  "sa-rule-aorist-active":
    name: "Aorist, active: luṅ and its types"
    explanation: "The aorist is the past tense Pāṇini calls luṅ: sūtra 3.2.110 says {1}, luṅ for a past. Before luṅ the sign cli is put after the root (3.1.43, {2}), and the sūtra 3.1.44 says {3}, that sic takes its place; other sūtras of the same section (such as 3.1.45, śala ig-upadhād aniṭaḥ kṣaḥ, and 3.1.55) put other signs in place of cli, and those make the other types of the aorist. It has the augment like the imperfect and the secondary endings (Whitney 824 to 826, 927). Whitney names three families (824): the simple aorist, which has the root-aorist and the a-aorist; the reduplicated aorist; and the sibilant aorist with the sign s, which is the s-aorist, the iṣ-aorist, the siṣ-aorist and the sa-aorist. In the later language the root-aorist is limited to a few roots in ā and the root bhū and is active only (829): {4} from {5}, {6} from {7} and {8} from {9}, with the plural {10}. The a-aorist is made from about a hundred roots (846): {11} from {12}. The s-aorist adds s to the augmented root with the vowel usually strengthened (878), and Whitney's example is the root nī (882): {13}, {14}, {15}; its third plural ends in -uḥ (880). The siṣ-aorist is made from roots in ā and from nam, yam and ram (911): {16} from {17} and {18} from {19}. The iṣ-aorist adds iṣ, and in the second and third singular iṣ-s and iṣ-t are contracted to -īs and -īt (898, 901): {20} from {21}. Which type a root takes is learned with the root; Wiktionary lists the aorist forms of each verb on its root page, and the cells here are the first aorist form listed there that has a table."
  "sa-rule-aorist-middle":
    name: "Aorist, middle"
    explanation: "The aorist is allowed in the middle voice too, but the middle uses mostly the s-aorist or the iṣ-aorist (Whitney 829, 846). The only middle aorist among the verbs of the course with a table on Wiktionary is that of the verb to put: {1}, {2}, {3}, with {4} and {5}, beside the active {6}. Where the endings fit the secondary middle endings, they are -ta, -ātām, -anta and -thāḥ, -āthām, -dhvam, and -i, -vahi, -mahi."
