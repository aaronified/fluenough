name: "The perfect and the aorist"
description: "The perfect (liṭ) and the aorist (luṅ) of the verbs of the course whose forms are sourced on a Wiktionary table: bhū, gam, vad, nī, pā, sthā, vas, nam, ji, pat, jīv, car, vah, hṛ, sṛ, tap, dhṛ, khan, hve, rudh, vṛt, as, yā, dā, dhā, śru, likh, viś, iṣ, kṛ, jñā, grah. Left out, with no Wiktionary table and no Whitney paradigm found (a reader is needed to derive them; the task is in docs/review-queue/sa.md): paṭh, pac, khād, has, rakṣ, smṛ, dhāv, cal, krīḍ, gai, jap, kṣar, labh, īkṣ, rud, brū, paś, nṛt, tud, krī, kath, pūj. A verb with only one of the two tenses sourced shows the other as an empty cell. This is the second of the two past-tense rules decks of one path unit (the first is the imperfect), split so that unsourced verbs can be excepted; neither deck has a theme. Not yet checked by a Sanskrit speaker: please report any mistake. For the verbs of sa-verbs-3 a cell holds only a form read on the en.wiktionary.org root page or conjugation table, or made by a rule marked in the review queue; an empty cell means none was found."
