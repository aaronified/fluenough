  entries:
    "krta-m": "past passive participle of kṛ, masculine (kṛ, to do)"
    "krta-f": "past passive participle, feminine (kṛ, to do)"
    "krta-n": "past passive participle, neuter (kṛ, to do)"
    "krtavat-m": "past active participle of kṛ, masculine (kṛ, to do)"
    "krtavat-f": "past active participle, feminine (kṛ, to do)"
    "krtavat-n": "past active participle, neuter (kṛ, to do)"
    "kurvat-m": "present active participle of kṛ, masculine (kṛ, to do)"
    "kurvat-f": "present active participle, feminine (kṛ, to do)"
    "kurvat-n": "present active participle, neuter (kṛ, to do)"
  notes: "A participle is declined like a noun or adjective of its stem. The past passive participle in -ta is an a-stem: masculine and neuter like the a-stems of the course, feminine in -ā (Whitney 952). The past active participle in -tavat has the nominative singular -tavān in the masculine, a feminine in -tavatī and a neuter in -tavat (Whitney 959). The present active participle has the stem -at (-ant before some endings; Whitney 584): its masculine nominative singular is kurvan, the feminine is kurvatī and the neuter is kurvat. The present middle participle in -māna or -āna is declined like the a-stems of the course (feminine in -ā: Whitney 584), so it has no separate model here."
