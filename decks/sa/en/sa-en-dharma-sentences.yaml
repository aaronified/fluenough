cards:
  "sa-3830":
    native: "Compassion is the root of dharma."
    bases: { "धर्मस्य": "of dharma", "मूलं": "root", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Non-violence, not compassion: अहिंसा (ahiṃsā) means non-violence." }, "w2": { why: "Seed, not root: बीजम् (bījam) means seed." }, "w3": { why: "Branch, not root: शाखा (śākhā) means branch." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. मूलम् (mūlam) is written मूलं (mūlaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of भवति (bhavati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "धर्मस्य (dharmasya) is the genitive case of धर्मः (dharmaḥ): of dharma. मूलम् (mūlam) is a neuter word: root." }
  "sa-3831":
    native: "Anger and greed are faults."
    bases: { "क्रोधो": "anger", "लोभश्": "greed", "दोषौ": "faults", "भवतः": "to be (are two)" }
    confusables: { "w1": { why: "Delusion, not anger: मोहः (mohaḥ) means delusion." }, "w2": { why: "Quality, not fault: गुणः (guṇaḥ) means quality." }, "w3": { why: "Fear, not greed: भयम् (bhayam) means fear." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. क्रोधः (krodhaḥ) is written क्रोधो (krodho) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of लोभश् (lobhaś) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). लोभः (lobhaḥ) is written लोभश् (lobhaś) because a final ः (ḥ) before च (ca) becomes श् (ś), here the start of च (ca) (Aṣṭādhyāyī 8.3.34 and 8.4.40; Whitney 170 c).", "n2": "दोषौ (doṣau) is the nominative dual of दोषः (doṣaḥ): two faults. भवतः (bhavataḥ) is the third person dual, to agree with it." }
  "sa-3832":
    native: "A good person conquers anger with forbearance."
    bases: { "क्षमया": "with forbearance", "क्रोधं": "anger", "जयति": "to conquer (conquers)" }
    confusables: { "w1": { why: "Villain, not good person: दुर्जनः (durjanaḥ) means villain." }, "w2": { why: "Patience, not forbearance: धैर्यम् (dhairyam) means patience." }, "w3": { why: "Delusion, not anger: मोहः (mohaḥ) means delusion." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. क्रोधम् (krodham) is written क्रोधं (krodhaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of जयति (jayati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "क्षमया (kṣamayā) is the instrumental case of क्षमा (kṣamā): with forbearance. जयति (jayati) is the present of जि (ji): conquers." }
  "sa-3833":
    native: "The teacher gives knowledge with respect."
    bases: { "आचार्यो": "teacher", "विद्याम्": "knowledge", "आदरेण": "with respect", "ददाति": "to give (gives)" }
    confusables: { "w1": { why: "Intelligence, not knowledge: बुद्धिः (buddhiḥ) means intelligence." }, "w2": { why: "Honour, not respect: सम्मानः (sammānaḥ) means honour." }, "w3": { why: "Favour, not respect: अनुग्रहः (anugrahaḥ) means favour." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. आचार्यः (ācāryaḥ) is written आचार्यो (ācāryo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of विद्याम् (vidyām) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "विद्याम् (vidyām) is the accusative case of विद्या (vidyā): what is given. आदरेण (ādareṇa) is the instrumental case of आदरः (ādaraḥ): with respect." }
  "sa-3834":
    native: "Patience is a virtue in sorrow."
    bases: { "धैर्यं": "patience", "दुःखे": "in sorrow", "गुणो": "virtue", "ऽस्ति": "to be (is)" }
    confusables: { "w1": { why: "Energy, not patience: उत्साहः (utsāhaḥ) means energy." }, "w2": { why: "Forbearance, not patience: क्षमा (kṣamā) means forbearance." }, "w3": { why: "Delight, not sorrow: हर्षः (harṣaḥ) means delight." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. धैर्यम् (dhairyam) is written धैर्यं (dhairyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of दुःखे (duḥkhe) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). गुणः (guṇaḥ) is written गुणो (guṇo) because a final अः (aḥ) becomes ओ (o) before अ (a), and that अ (a) is dropped and shown by the sign ऽ (avagraha), here at the start of अस्ति (asti) (Whitney 175 a; Aṣṭādhyāyī 6.1.109, एङः पदान्तादति (eṅaḥ padāntād ati), with 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute)).", "n2": "दुःखे (duḥkhe) is the locative case of दुःखम् (duḥkham): in sorrow. गुणः (guṇaḥ) says what patience is: a virtue, a good quality." }
  "sa-3835":
    native: "Laziness is always an enemy."
    bases: { "आलस्यं": "laziness", "शत्रुर्": "enemy", "अस्ति": "to be (is)" }
    confusables: { "w1": { why: "Energy, not laziness: उत्साहः (utsāhaḥ) means energy." }, "w2": { why: "Friend, not enemy: मित्रम् (mitram) means friend." }, "w3": { why: "Friendship, not enmity: मैत्री (maitrī) means friendship." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. आलस्यम् (ālasyam) is written आलस्यं (ālasyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of सदा (sadā) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). शत्रुः (śatruḥ) is written शत्रुर् (śatrur) because a final ः (ḥ) after उ (u) becomes र् (r) before a voiced sound, here the start of अस्ति (asti) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174).", "n2": "आलस्यम् (ālasyam) is a neuter word: laziness. शत्रुः (śatruḥ) says what laziness is: an enemy." }
  "sa-3836":
    native: "A wicked person finds sorrow through hatred."
    bases: { "दुर्जनो": "wicked person", "द्वेषेण": "through hatred", "दुःखं": "sorrow", "लभते": "to get (finds)" }
    confusables: { "w1": { why: "Enmity, not hatred: वैरम् (vairam) means enmity." }, "w2": { why: "Envy, not hatred: ईर्ष्या (īrṣyā) means envy." }, "w3": { why: "Delight, not sorrow: हर्षः (harṣaḥ) means delight." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. दुर्जनः (durjanaḥ) is written दुर्जनो (durjano) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of द्वेषेण (dveṣeṇa) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). दुःखम् (duḥkham) is written दुःखं (duḥkhaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of लभते (labhate) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "द्वेषेण (dveṣeṇa) is the instrumental case of द्वेषः (dveṣaḥ): through hatred. लभते (labhate) is in the middle voice: he gets sorrow for himself." }
  "sa-3837":
    native: "The monk guards non-violence with self-control."
    bases: { "भिक्षुर्": "monk", "अहिंसां": "non-violence", "संयमेन": "with self-control", "रक्षति": "to protect (guards)" }
    confusables: { "w1": { why: "Teacher, not monk: आचार्यः (ācāryaḥ) means teacher." }, "w2": { why: "Restraint, not self-control: दमः (damaḥ) means restraint." }, "w3": { why: "Compassion, not non-violence: दया (dayā) means compassion." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. भिक्षुः (bhikṣuḥ) is written भिक्षुर् (bhikṣur) because a final ः (ḥ) after उ (u) becomes र् (r) before a voiced sound, here the start of अहिंसां (ahiṃsāṃ) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174). अहिंसाम् (ahiṃsām) is written अहिंसां (ahiṃsāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of संयमेन (saṃyamena) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "संयमेन (saṃyamena) is the instrumental case of संयमः (saṃyamaḥ): with self-control. रक्षति (rakṣati) is the present of रक्ष् (rakṣ): guards, keeps." }
  "sa-3838":
    native: "A righteous person knows virtue and fault through discernment."
    bases: { "धार्मिको": "righteous person", "विवेकेन": "through discernment", "गुणं": "virtue", "दोषं": "fault", "जानाति": "to know (knows)" }
    confusables: { "w1": { why: "Evil, not righteous: पापः (pāpaḥ) means evil." }, "w2": { why: "Wisdom, not discernment: प्रज्ञा (prajñā) means wisdom." }, "w3": { why: "Intelligence, not discernment: बुद्धिः (buddhiḥ) means intelligence." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. धार्मिकः (dhārmikaḥ) is written धार्मिको (dhārmiko) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of विवेकेन (vivekena) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). गुणम् (guṇam) is written गुणं (guṇaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of दोषं (doṣaṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). दोषम् (doṣam) is written दोषं (doṣaṃ), for the same reason, before च (ca).", "n2": "विवेकेन (vivekena) is the instrumental case of विवेकः (vivekaḥ): through discernment. गुणम् (guṇam) and दोषम् (doṣam) are the accusative case: what is known." }
  "sa-3839":
    native: "Knowledge is greater than wealth."
    bases: { "धनाद्": "than wealth", "अधिका": "greater", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Intelligence, not knowledge: बुद्धिः (buddhiḥ) means intelligence." }, "w2": { why: "Less, not greater: न्यूनः (nyūnaḥ) means less." }, "w3": { why: "Poverty, not wealth: दारिद्र्यम् (dāridryam) means poverty." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. धनात् (dhanāt) is written धनाद् (dhanād) because a final त् (t) becomes द् (d) before a voiced sound, here the start of अधिका (adhikā) (Aṣṭādhyāyī 8.2.39, झलां जशोऽन्ते (jhalāṃ jaśo 'nte), in separate words झलां जशः अन्ते (jhalāṃ jaśaḥ ante); Whitney 159).", "n2": "धनात् (dhanāt) is the ablative case of धनम् (dhanam); the ablative says what something is compared with: than wealth. अधिका (adhikā) is the feminine form of अधिकः (adhikaḥ), to agree with विद्या (vidyā)." }
