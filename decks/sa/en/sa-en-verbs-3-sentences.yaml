cards:
  "sa-3900":
    native: "The girl sleeps in the bed at night."
    bases: { "शय्यायां": "in the bed", "स्वपिति": "to sleep (sleeps)" }
    confusables: { "w1": { why: "Resting, not bed: शयनम् (śayanam) means resting." }, "w2": { why: "To cry, not to sleep: रुद् (rud) means to cry." }, "w3": { why: "To sit down, not to sleep: सद् (sad) means to sit down." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. शय्यायाम् (śayyāyām) is written शय्यायां (śayyāyāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of स्वपिति (svapiti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "शय्यायाम् (śayyāyām) is the locative case of शय्या (śayyā): in the bed. स्वपिति (svapiti) is the present of स्वप् (svap), a verb of the second class: sleeps." }
  "sa-3901":
    native: "In the forest fire burns dry grass."
    bases: { "अग्निर्": "fire", "वने": "in the forest", "शुष्कं": "dry", "तृणं": "grass", "दहति": "to burn (burns)" }
    confusables: { "w1": { why: "To be hot, not to burn: तप् (tap) means to be hot." }, "w2": { why: "Wet, not dry: आर्द्रः (ārdraḥ) means wet." }, "w3": { why: "Young grass, not grass: शष्पम् (śaṣpam) means young grass." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अग्निः (agniḥ) is written अग्निर् (agnir) because a final ः (ḥ) after इ (i) becomes र् (r) before a voiced sound, here the start of वने (vane) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174). शुष्कम् (śuṣkam) is written शुष्कं (śuṣkaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of तृणं (tṛṇaṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). तृणम् (tṛṇam) is written तृणं (tṛṇaṃ), for the same reason, before दहति (dahati).", "n2": "वने (vane) is the locative case of वनम् (vanam): in the forest. शुष्कम् (śuṣkam) is the neuter form of शुष्कः (śuṣkaḥ), to agree with तृणम् (tṛṇam), the accusative: what the fire burns. दहति (dahati) is the present of दह् (dah)." }
  "sa-3902":
    native: "The monkey climbs the tree quickly."
    bases: { "कपिर्": "monkey", "वृक्षं": "tree", "शीघ्रं": "quickly", "रोहति": "to climb (climbs)" }
    confusables: { "w1": { why: "Tortoise, not monkey: कूर्मः (kūrmaḥ) means tortoise." }, "w2": { why: "To fall, not to climb: पत् (pat) means to fall." }, "w3": { why: "Slowly, not quickly: शनैः (śanaiḥ) means slowly." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. कपिः (kapiḥ) is written कपिर् (kapir) because a final ः (ḥ) after इ (i) becomes र् (r) before a voiced sound, here the start of वृक्षं (vṛkṣaṃ) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174). वृक्षम् (vṛkṣam) is written वृक्षं (vṛkṣaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of शीघ्रं (śīghraṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). शीघ्रम् (śīghram) is written शीघ्रं (śīghraṃ), for the same reason, before रोहति (rohati).", "n2": "वृक्षम् (vṛkṣam) is the accusative case of वृक्षः (vṛkṣaḥ): what is climbed. रोहति (rohati) is the present of रुह् (ruh), with the vowel strengthened: climbs." }
  "sa-3903":
    native: "A farmer sows seed in the field."
    bases: { "क्षेत्रे": "in the field", "बीजं": "seed", "वपति": "to sow (sows)" }
    confusables: { "w1": { why: "Cowherd, not farmer: गोपालः (gopālaḥ) means cowherd." }, "w2": { why: "Husk, not seed: तुषः (tuṣaḥ) means husk." }, "w3": { why: "To dig, not to sow: खन् (khan) means to dig." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. बीजम् (bījam) is written बीजं (bījaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of वपति (vapati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "क्षेत्रे (kṣetre) is the locative case of क्षेत्रम् (kṣetram): in the field. बीजम् (bījam) is the accusative case: what is sown. वपति (vapati) is the present of वप् (vap)." }
  "sa-3904":
    native: "The crow sits on the branch of the tree."
    bases: { "काको": "crow", "वृक्षस्य": "of the tree", "शाखायां": "on the branch", "सीदति": "to sit (sits)" }
    confusables: { "w1": { why: "Sal tree, not branch: शालः (śālaḥ) means sal tree." }, "w2": { why: "Nest, not branch: नीडः (nīḍaḥ) means nest." }, "w3": { why: "To stand, not to sit: स्था (sthā) means to stand." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. काकः (kākaḥ) is written काको (kāko) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of वृक्षस्य (vṛkṣasya) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). शाखायाम् (śākhāyām) is written शाखायां (śākhāyāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of सीदति (sīdati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "वृक्षस्य (vṛkṣasya) is the genitive case of वृक्षः (vṛkṣaḥ): of the tree. शाखायाम् (śākhāyām) is the locative case of शाखा (śākhā): on the branch. सीदति (sīdati) is the present of सद् (sad): sits down." }
  "sa-3905":
    native: "At night the lamp burns in the temple."
    bases: { "दीपो": "lamp", "मन्दिरे": "in the temple", "ज्वलति": "to burn (burns)" }
    confusables: { "w1": { why: "To burn, not to blaze: दह् (dah) means to burn." }, "w2": { why: "Small lamp, not lamp: दीपिका (dīpikā) means small lamp." }, "w3": { why: "Hut, not temple: कुटी (kuṭī) means hut." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. दीपः (dīpaḥ) is written दीपो (dīpo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of मन्दिरे (mandire) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "मन्दिरे (mandire) is the locative case of मन्दिरम् (mandiram): in the temple. ज्वलति (jvalati) is the present of ज्वल् (jval): burns, blazes." }
  "sa-3906":
    native: "The mouse is always afraid of the cat."
    bases: { "मूषको": "mouse", "नित्यं": "always", "मार्जाराद्": "of the cat", "बिभेति": "to fear (is afraid)" }
    confusables: { "w1": { why: "Mouse, not cat: मूषकः (mūṣakaḥ) means mouse." }, "w2": { why: "To tremble, not to fear: त्रस् (tras) means to tremble." }, "w3": { why: "Crow, not mouse: काकः (kākaḥ) means crow." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. मूषकः (mūṣakaḥ) is written मूषको (mūṣako) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of नित्यं (nityaṃ) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). नित्यम् (nityam) is written नित्यं (nityaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of मार्जाराद् (mārjārād) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). मार्जारात् (mārjārāt) is written मार्जाराद् (mārjārād) because a final त् (t) becomes द् (d) before a voiced sound, here the start of बिभेति (bibheti) (Aṣṭādhyāyī 8.2.39, झलां जशोऽन्ते (jhalāṃ jaśo 'nte), in separate words झलां जशः अन्ते (jhalāṃ jaśaḥ ante); Whitney 159).", "n2": "मार्जारात् (mārjārāt) is the ablative case of मार्जारः (mārjāraḥ); the ablative says what one fears: of the cat. बिभेति (bibheti) is the present of भी (bhī), with doubling of the root." }
  "sa-3907":
    native: "The lion kills the deer in the forest."
    bases: { "सिंहो": "lion", "वने": "in the forest", "मृगं": "deer", "हन्ति": "to strike (kills)" }
    confusables: { "w1": { why: "Tiger, not lion: व्याघ्रः (vyāghraḥ) means tiger." }, "w2": { why: "Hare, not deer: शशकः (śaśakaḥ) means hare." }, "w3": { why: "To throw, not to kill: क्षिप् (kṣip) means to throw." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सिंहः (siṃhaḥ) is written सिंहो (siṃho) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of वने (vane) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). मृगम् (mṛgam) is written मृगं (mṛgaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of हन्ति (hanti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "मृगम् (mṛgam) is the accusative case of मृगः (mṛgaḥ): what the lion kills. हन्ति (hanti) is the present of हन् (han): strikes, kills." }
  "sa-3908":
    native: "The moon shines in the sky at night."
    bases: { "चन्द्रो": "moon", "गगने": "in the sky", "भाति": "to shine (shines)" }
    confusables: { "w1": { why: "Sun, not moon: सूर्यः (sūryaḥ) means sun." }, "w2": { why: "Star, not moon: तारा (tārā) means star." }, "w3": { why: "To be hot, not to shine: तप् (tap) means to be hot." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. चन्द्रः (candraḥ) is written चन्द्रो (candro) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of रात्रौ (rātrau) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "गगने (gagane) is the locative case of गगनम् (gaganam): in the sky. भाति (bhāti) is the present of भा (bhā): shines, appears." }
  "sa-3909":
    native: "The thief steals wealth at night."
    bases: { "चोरो": "thief", "धनं": "wealth", "चोरयति": "to steal (steals)" }
    confusables: { "w1": { why: "Enemy, not thief: शत्रुः (śatruḥ) means enemy." }, "w2": { why: "To free, not to steal: मुच् (muc) means to free." }, "w3": { why: "Gold, not wealth: सुवर्णम् (suvarṇam) means gold." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. चोरः (coraḥ) is written चोरो (coro) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of रात्रौ (rātrau) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). धनम् (dhanam) is written धनं (dhanaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of चोरयति (corayati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "धनम् (dhanam) is the accusative case of धनम् (dhanam): what is stolen. चोरयति (corayati) is the present of चुर् (cur), a verb of the tenth class that takes अय (aya): steals." }
