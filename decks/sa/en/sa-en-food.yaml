      "n3": "Written apart: A final अः (aḥ) before a voiced consonant becomes ओ (o) (Whitney 175 a; Aṣṭādhyāyī 6.1.113 and 6.1.114). A final अः (aḥ) before अ (a) becomes ओ (o) and the अ (a) is shown by the avagraha ऽ (Whitney 175 a). Before a vowel the words stay apart and the vowels are not joined: sandhi is not applied here; see the lesson sa-grammar-sandhi-vowel (Whitney 133)."
    bases:
      "आम्रः": "mango"
    examples:
      "आम्रो मधुरः":
        native: "The mango is sweet."
