  "sa-1721":
    native: "Peppercorn."
    notes:
      "n1": "An a-stem noun: its full set of case forms is in the a-stems table of the grammar rules."
      "n2": "The dictionary stem is मरिच (marica); the card shows the isolated nominative singular मरिचम् (maricam)."
      "n3": "Written apart: A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign. Before a vowel the final म् (m) stays and is not joined to the next word: written apart, sandhi not applied (Whitney 213 a)."
    bases:
      "मरिचम्": "peppercorn"
    examples:
      "मरिचं श्यामम्":
        native: "The peppercorn is dark."
        bases:
          "मरिचं": "peppercorn"
          "श्यामम्": "dark"
      "पात्रे मरिचम् अस्ति":
        native: "There is peppercorn in the vessel."
        bases:
          "पात्रे": "vessel (locative)"
          "मरिचम्": "peppercorn"
          "अस्ति": "is"
