kind: "layer"
core: "sa-grammar-pronouns"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Pronouns: the full table"
description: "Every pronoun the course teaches, in the cases and numbers it has: the demonstratives, the relative, the question word, I and you, and all. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
