cards:
  "sa-3820":
    native: "The king always protects the country."
    bases: { "राजा": "king", "जनपदं": "country", "रक्षति": "to protect (protects)" }
    confusables: { "w1": { why: "Royal dynasty, not king: राजवंशः (rājavaṃśaḥ) means royal dynasty." }, "w2": { why: "To conquer, not to protect: जि (ji) means to conquer." }, "w3": { why: "Kingdom, not country: राष्ट्रम् (rāṣṭram) means kingdom." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. जनपदम् (janapadam) is written जनपदं (janapadaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of रक्षति (rakṣati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "राजा (rājā) is the nominative singular of राजन् (rājan): the king. जनपदम् (janapadam) is the accusative case of जनपदः (janapadaḥ): what he protects." }
  "sa-3821":
    native: "The king's envoy carries the command."
    bases: { "आज्ञां": "command", "राज्ञो": "king's", "दूतो": "envoy", "वहति": "to carry (carries)" }
    confusables: { "w1": { why: "Order, not command: आदेशः (ādeśaḥ) means order." }, "w2": { why: "Witness, not envoy: साक्षी (sākṣī) means witness." }, "w3": { why: "To take, not to carry: हृ (hṛ) means to take." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. आज्ञाम् (ājñām) is written आज्ञां (ājñāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of राज्ञो (rājño) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). राज्ञः (rājñaḥ) is written राज्ञो (rājño) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of दूतो (dūto) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). दूतः (dūtaḥ) is written दूतो (dūto), for the same reason, before वहति (vahati).", "n2": "राज्ञः (rājñaḥ) is the genitive case of राजन् (rājan): of the king. आज्ञाम् (ājñām) is the accusative case of आज्ञा (ājñā): what is carried. The order of the words is free because the endings show their jobs." }
  "sa-3822":
    native: "The minister tells the king a plan."
    bases: { "उपायं": "plan", "राज्ञे": "to the king", "कथयति": "to tell (tells)" }
    confusables: { "w1": { why: "Overseer, not minister: अध्यक्षः (adhyakṣaḥ) means overseer." }, "w2": { why: "Deliberation, not plan: विचारः (vicāraḥ) means deliberation." }, "w3": { why: "To say, not to tell: ब्रू (brū) means to say." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. उपायम् (upāyam) is written उपायं (upāyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of मन्त्री (mantrī) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "राज्ञे (rājñe) is the dative case of राजन् (rājan): to the king. उपायम् (upāyam) is the accusative case of उपायः (upāyaḥ): what is told. कथयति (kathayati) is the present of कथ् (kath): tells. The object comes first; the order of the words is free." }
  "sa-3823":
    native: "The thief goes to prison in fetters."
    bases: { "चोरो": "thief", "बन्धनेन": "with fetters", "कारागारं": "prison", "गच्छति": "to go (goes)" }
    confusables: { "w1": { why: "Enemy, not thief: शत्रुः (śatruḥ) means enemy." }, "w2": { why: "Storeroom, not prison: भाण्डागारम् (bhāṇḍāgāram) means storeroom." }, "w3": { why: "Document, not fetter: लेखः (lekhaḥ) means document." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. चोरः (coraḥ) is written चोरो (coro) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of बन्धनेन (bandhanena) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). कारागारम् (kārāgāram) is written कारागारं (kārāgāraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of गच्छति (gacchati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "बन्धनेन (bandhanena) is the instrumental case of बन्धनम् (bandhanam): with fetters. कारागारम् (kārāgāram) is the accusative case: the place he goes to." }
  "sa-3824":
    native: "The king stays on the throne in the assembly."
    bases: { "सभायां": "in the assembly", "सिंहासने": "on the throne", "राजा": "king", "तिष्ठति": "to stand (stays)" }
    confusables: { "w1": { why: "Council, not assembly: परिषत् (pariṣat) means council." }, "w2": { why: "Seat, not throne: आसनम् (āsanam) means seat." }, "w3": { why: "To dwell, not to stand: वस् (vas) means to dwell." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सभायाम् (sabhāyām) is written सभायां (sabhāyāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of सिंहासने (siṃhāsane) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "सभायाम् (sabhāyām) and सिंहासने (siṃhāsane) are the locative case: where. तिष्ठति (tiṣṭhati) is the present of स्था (sthā), which means to stand, stay or remain; here the king remains on the throne." }
  "sa-3825":
    native: "In the treasury there are gold and a jewel."
    bases: { "कोशे": "in the treasury", "सुवर्णं": "gold", "रत्नं": "jewel", "भवतः": "to be (there are two)" }
    confusables: { "w1": { why: "Storeroom, not treasury: भाण्डागारम् (bhāṇḍāgāram) means storeroom." }, "w2": { why: "Iron, not gold: लोहम् (loham) means iron." }, "w3": { why: "Stone, not jewel: शिला (śilā) means stone." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सुवर्णम् (suvarṇam) is written सुवर्णं (suvarṇaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of रत्नं (ratnaṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). रत्नम् (ratnam) is written रत्नं (ratnaṃ), for the same reason, before च (ca).", "n2": "कोशे (kośe) is the locative case of कोशः (kośaḥ): in the treasury. भवतः (bhavataḥ) is the third person dual: there are two things, gold and a jewel." }
  "sa-3826":
    native: "The leader of the army is strong."
    bases: { "सेनाया": "of the army", "नायको": "leader", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Chief, not leader: मुख्यः (mukhyaḥ) means chief." }, "w2": { why: "Weak, not strong: दुर्बलः (durbalaḥ) means weak." }, "w3": { why: "Ruler, not leader: अधिपतिः (adhipatiḥ) means ruler." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सेनायाः (senāyāḥ) is written सेनाया (senāyā) because a final आः (āḥ) loses its visarga before a voiced consonant, here the start of नायको (nāyako) (Whitney 177; Aṣṭādhyāyī 8.3.17, भोभगोअघोअपूर्वस्य योऽशि (bhobhago 'ghoapūrvasya yo 'śi), in separate words भो भगो अघो अपूर्वस्य यः अशि (bho bhago agho apūrvasya yaḥ aśi), with 8.3.19, लोपः शाकल्यस्य (lopaḥ śākalyasya)). नायकः (nāyakaḥ) is written नायको (nāyako) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of बलवान् (balavān) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "सेनायाः (senāyāḥ) is the genitive case of सेना (senā): of the army. बलवान् (balavān) is an adjective that agrees with नायकः (nāyakaḥ)." }
  "sa-3827":
    native: "In the assembly the witness gives evidence."
    bases: { "सभायां": "in the assembly", "साक्ष्यं": "evidence", "वदति": "to speak (gives)" }
    confusables: { "w1": { why: "Proof, not evidence: प्रमाणम् (pramāṇam) means proof." }, "w2": { why: "Envoy, not witness: दूतः (dūtaḥ) means envoy." }, "w3": { why: "To say, not to speak: ब्रू (brū) means to say." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सभायाम् (sabhāyām) is written सभायां (sabhāyāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of साक्षी (sākṣī) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). साक्ष्यम् (sākṣyam) is written साक्ष्यं (sākṣyaṃ), for the same reason, before वदति (vadati).", "n2": "सभायाम् (sabhāyām) is the locative case of सभा (sabhā): in the assembly. साक्ष्यम् (sākṣyam) is the accusative case: what the witness says." }
  "sa-3828":
    native: "A kshatriya protects the kingdom in war."
    bases: { "क्षत्रियो": "kshatriya", "युद्धे": "in war", "राष्ट्रं": "kingdom", "रक्षति": "to protect (protects)" }
    confusables: { "w1": { why: "Member of the merchant class, not warrior: वैश्यः (vaiśyaḥ) means member of the merchant class." }, "w2": { why: "Defeat, not war: पराजयः (parājayaḥ) means defeat." }, "w3": { why: "Army, not war: सेना (senā) means army." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. क्षत्रियः (kṣatriyaḥ) is written क्षत्रियो (kṣatriyo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of युद्धे (yuddhe) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). राष्ट्रम् (rāṣṭram) is written राष्ट्रं (rāṣṭraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of रक्षति (rakṣati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "क्षत्रियः (kṣatriyaḥ) is a member of the warrior class. युद्धे (yuddhe) is the locative case of युद्धम् (yuddham): in war. राष्ट्रम् (rāṣṭram) is the accusative case: what he protects." }
  "sa-3829":
    native: "A vaishya does trade in the city."
    bases: { "वैश्यो": "vaishya", "नगरे": "in the city", "वाणिज्यं": "trade", "करोति": "to do (does)" }
    confusables: { "w1": { why: "Member of the servant class, not merchant: शूद्रः (śūdraḥ) means member of the servant class." }, "w2": { why: "Business, not trade: व्यापारः (vyāpāraḥ) means business." }, "w3": { why: "Forest, not city: वनम् (vanam) means forest." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वैश्यः (vaiśyaḥ) is written वैश्यो (vaiśyo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of नगरे (nagare) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). वाणिज्यम् (vāṇijyam) is written वाणिज्यं (vāṇijyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of करोति (karoti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "वैश्यः (vaiśyaḥ) is a member of the merchant class. नगरे (nagare) is the locative case of नगरम् (nagaram): in the city. वाणिज्यम् (vāṇijyam) is the accusative case: the trade he does." }
