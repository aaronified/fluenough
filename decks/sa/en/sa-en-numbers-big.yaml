          "वर्षाणि": "years"
  "sa-1610":
    native: "Thirty."
    notes:
      "n1": "Thirty. A feminine noun ending in a consonant (stem triṃśat), so it is not in the a-stems table; the count noun follows it in the plural."
    examples:
      "त्रिंशत् पुस्तकानि":
        native: "Thirty books."
        bases:
          "पुस्तकानि": "books (plural)"
      "त्रिंशत् कुम्भाः":
        native: "Thirty jars."
        bases:
          "कुम्भाः": "jars (plural)"
