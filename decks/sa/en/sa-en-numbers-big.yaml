core: "sa-numbers-big"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Hundreds, thousands and big numbers"
description: "Thirty, forty and fifty, then hundreds, thousands and the larger counts of Classical Sanskrit, with the count noun that follows them."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sa-1559":
    native: "A hundred."
    notes:
      "n1": "A neuter a-stem noun; as a count it takes its noun in the plural, as in शतं (śataṃ) वर्षाणि (varṣāṇi), a hundred years."
      "n2": "Written apart: A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign."
    bases:
      "शतम्": "a hundred"
    examples:
      "शतं वर्षाणि":
        native: "A hundred years."
        bases:
          "शतं": "hundred"
          "वर्षाणि": "years"
      "शतं पुस्तकानि":
        native: "A hundred books."
        bases:
          "शतं": "hundred"
          "पुस्तकानि": "books"
  "sa-1560":
    native: "A thousand."
    notes:
      "n1": "An a-stem noun: its full set of case forms is in the a-stems table of the grammar rules."
      "n2": "Written apart: A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign."
    bases:
      "सहस्रम्": "a thousand"
    examples:
      "सहस्रं पुरुषाः":
        native: "A thousand men."
        bases:
          "सहस्रं": "thousand"
          "पुरुषाः": "men"
      "सहस्रं फलानि":
        native: "A thousand fruits."
        bases:
          "सहस्रं": "thousand"
          "फलानि": "fruits"
