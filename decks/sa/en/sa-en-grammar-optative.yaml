name: "The optative: may, should, would"
description: "The optative (vidhiliṅ) of the verbs of the course in the active and the middle voice: the sign yā or ī, the e that blends with the stem a, the endings and the uses (wish, request, what ought to be, what may be). Not yet checked by a Sanskrit speaker: please report any mistake."
