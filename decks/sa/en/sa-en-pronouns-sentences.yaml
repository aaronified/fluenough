cards:
  "sa-3020":
    native: "She speaks Sanskrit and you all read."
    bases: { "संस्कृतं": "the Sanskrit language", "वदति": "to speak (speaks)", "यूयं": "you all", "च": "and", "पठथ": "to read (you all read)" }
    confusables: { "w1": { why: "That, not she: तत् (tat) means that." }, "w2": { why: "To cook, not to speak: पच् (pac) means to cook." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. संस्कृतम् (saṃskṛtam) is written संस्कृतं (saṃskṛtaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of वदति (vadati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). यूयम् (yūyam) is written यूयं (yūyaṃ), for the same reason, before च (ca).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one.", "n3": "संस्कृतम् (saṃskṛtam) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
  "sa-3021":
    native: "This god brings water."
    bases: { "अयं": "this (masculine)", "देवो": "god", "जलं": "water", "नयति": "to bring (brings)" }
    confusables: { "w1": { why: "This (feminine), not this (masculine): इयम् (iyam) means this (feminine)." }, "w2": { why: "Cow, not god: गौः (gauḥ) means cow." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अयम् (ayam) is written अयं (ayaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of देवः (devaḥ) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). देवः (devaḥ) is written देवो (devo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of जलम् (jalam) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). जलम् (jalam) is written जलं (jalaṃ), for the same reason, before नयति (nayati).", "n2": "जलम् (jalam) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
  "sa-3022":
    native: "Where is this cow going?"
    bases: { "इयं": "this (feminine)", "गच्छति": "to go (goes)" }
    confusables: { "w1": { why: "This (neuter), not this (feminine): इदम् (idam) means this (neuter)." }, "w2": { why: "Horse, not cow: अश्वः (aśvaḥ) means horse." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. इयम् (iyam) is written इयं (iyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of गौः (gauḥ) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign)." }
  "sa-3023":
    native: "You all do not read and we do not speak."
    bases: { "यूयं": "you all", "पठथ": "to read (you all read)", "वयं": "we", "च": "and", "वदामः": "to speak (we speak)" }
    confusables: { "w1": { why: "I, not you all: अहम् (aham) means I." }, "w2": { why: "To cook, not to read: पच् (pac) means to cook." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. यूयम् (yūyam) is written यूयं (yūyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of न (na) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). वयम् (vayam) is written वयं (vayaṃ), for the same reason, before च (ca).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3024":
    native: "We bring all the water."
    bases: { "वयं": "we", "सर्वं": "all", "जलं": "water", "नयामः": "to bring (we bring)" }
    confusables: { "w1": { why: "You all, not we: यूयम् (yūyam) means you all." }, "w2": { why: "Fire, not water: अग्निः (agniḥ) means fire." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वयम् (vayam) is written वयं (vayaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of सर्वम् (sarvam) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). सर्वम् (sarvam) is written सर्वं (sarvaṃ), for the same reason, before जलम् (jalam). जलम् (jalam) is written जलं (jalaṃ), for the same reason, before नयामः (nayāmaḥ).", "n2": "सर्वम् (sarvam) agrees with जलम् (jalam), both neuter: it means all the, not everything.", "n3": "जलम् (jalam) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
  "sa-3025":
    native: "I read what you read."
    bases: { "पठसि": "to read (you read)", "पठामि": "to read (I read)" }
    confusables: { "w1": { why: "To speak, not to read: वद् (vad) means to speak." }, "w2": { why: "This (masculine), not that: अयम् (ayam) means this (masculine)." } }
    notes: { "n1": "यत् (yat) and तत् (tat) work as a pair: what ... that. The ending of पठामि (paṭhāmi) already says I, so no अहम् (aham) is needed." }
  "sa-3026":
    native: "This one brings water and that one reads Sanskrit."
    bases: { "एष": "this one (masculine)", "जलं": "water", "नयति": "to bring (brings)", "स": "he", "च": "and", "संस्कृतं": "the Sanskrit language", "पठति": "to read (reads)" }
    confusables: { "w1": { why: "This one (feminine), not this one (masculine): एषा (eṣā) means this one (feminine)." }, "w2": { why: "Fire, not water: अग्निः (agniḥ) means fire." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. एषः (eṣaḥ) is written एष (eṣa) because सः (saḥ) and एषः (eṣaḥ) lose their visarga before any consonant, here the start of जलम् (jalam) (Whitney 176 a; Aṣṭādhyāyī 6.1.132). जलम् (jalam) is written जलं (jalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of नयति (nayati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). सः (saḥ) is written स (sa), for the same reason, before च (ca). संस्कृतम् (saṃskṛtam) is written संस्कृतं (saṃskṛtaṃ), for the same reason, before पठति (paṭhati). The labial keeps म् (m) in Whitney 213 a, but the anusvāra sign is the usual writing (Whitney 213 i).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one.", "n3": "जलम् (jalam) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
  "sa-3027":
    native: "That god does not speak and she reads Sanskrit."
    bases: { "स": "he", "देवो": "god", "वदति": "to speak (speaks)", "च": "and", "संस्कृतं": "the Sanskrit language", "पठति": "to read (reads)" }
    confusables: { "w1": { why: "That, not he: तत् (tat) means that." }, "w2": { why: "Cow, not god: गौः (gauḥ) means cow." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सः (saḥ) is written स (sa) because सः (saḥ) and एषः (eṣaḥ) lose their visarga before any consonant, here the start of देवः (devaḥ) (Whitney 176 a; Aṣṭādhyāyī 6.1.132). देवः (devaḥ) is written देवो (devo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of न (na) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). संस्कृतम् (saṃskṛtam) is written संस्कृतं (saṃskṛtaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पठति (paṭhati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one.", "n3": "संस्कृतम् (saṃskṛtam) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
  "sa-3028":
    native: "He who reads speaks Sanskrit."
    bases: { "पठति": "to read (reads)", "स": "he", "संस्कृतं": "the Sanskrit language", "वदति": "to speak (speaks)" }
    confusables: { "w1": { why: "We, not who (masculine): वयम् (vayam) means we." }, "w2": { why: "To cook, not to read: पच् (pac) means to cook." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सः (saḥ) is written स (sa) because सः (saḥ) and एषः (eṣaḥ) lose their visarga before any consonant, here the start of संस्कृतम् (saṃskṛtam) (Whitney 176 a; Aṣṭādhyāyī 6.1.132). संस्कृतम् (saṃskṛtam) is written संस्कृतं (saṃskṛtaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of वदति (vadati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "यः (yaḥ) and सः (saḥ) work as a pair: who ... he.", "n3": "संस्कृतम् (saṃskṛtam) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
