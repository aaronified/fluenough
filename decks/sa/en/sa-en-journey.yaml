      "n2": "The dictionary stem is रथ (ratha); the card shows the isolated nominative singular रथः (rathaḥ)."
      "n3": "A two-wheeled chariot, often for war or racing; contrasted with शकटम् (śakaṭam), a cart."
      "n4": "A final ः (ḥ) before त (ta) or थ (tha) becomes स् (s), as in रथस् (rathas) from रथः (rathaḥ) (Aṣṭādhyāyī 8.3.34; Whitney 170 b)."
