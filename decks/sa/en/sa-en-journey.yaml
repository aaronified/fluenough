cards:
  "sa-5500":
    native: "Journey, travel."
    notes:
      "n1": "Feminine ā-stem noun: its case endings differ from the a-stem pattern, so it is not in the a-stems table; its full set of case forms is in the other-stems table of the grammar rules."
      "n2": "Also a festive procession or pilgrimage, the sense of तीर्थयात्रा (tīrtha-yātrā); the card gives the plain sense of a journey."
    bases:
      "यात्रा": "journey, travel"
    examples:
      "अस्ति यात्रा दीर्घा":
        native: "There is a long journey."
        bases:
          "अस्ति": "is"
          "यात्रा": "journey, travel"
          "दीर्घा": "long"
      "अस्ति मार्गे यात्रा":
        native: "There is a journey on the road."
        bases:
          "अस्ति": "is"
          "मार्गे": "road (locative)"
          "यात्रा": "journey, travel"
  "sa-5501":
    native: "Wayfarer, traveller."
    notes:
      "n1": "Masculine a-stem noun: its full set of case forms is in the a-stems table of the grammar rules."
      "n2": "The dictionary stem is पथिक (pathika); the card shows the isolated nominative singular पथिकः (pathikaḥ)."
      "n3": "A wayfarer on the road; near synonym of यात्री (yātrī), which is the more general word for someone who travels."
      "n4": "A final ः (ḥ) before त (ta) or थ (tha) becomes स् (s), as in पथिकस् (pathikas) from पथिकः (pathikaḥ) (Aṣṭādhyāyī 8.3.34; Whitney 170 b)."
    bases:
      "पथिकः": "wayfarer, traveller"
    examples:
      "अस्ति पथिकस् तत्र":
        native: "There is a traveller there."
        bases:
          "अस्ति": "is"
          "पथिकस्": "wayfarer, traveller"
          "तत्र": "there"
      "अस्ति सुखी पथिकः":
        native: "There is a happy wayfarer."
        bases:
          "अस्ति": "is"
          "सुखी": "happy"
          "पथिकः": "wayfarer, traveller"
