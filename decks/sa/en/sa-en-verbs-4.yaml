  "sa-13011":
    native: "to pour; to sprinkle"
    notes:
      "n1": "A verb of the sixth class: the sign a is added to the root सिच् (sic) (the root appears as सिञ्च् (siñc) before the sign), so the present stem is सिञ्च (siñca) and the third person singular is सिञ्चति (siñcati). Its row is in the table of the classes 6 to 10."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. जलम् (jalam) is written जलं (jalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of सिञ्चति (siñcati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign)."
    examples:
      "कन्या जलं सिञ्चति":
        native: "The girl sprinkles water."
        bases:
          "जलं": "water"
          "सिञ्चति": "sprinkles"
      "माता पुष्पे जलं सिञ्चति":
        native: "The mother sprinkles water on the flower."
        bases:
          "पुष्पे": "flower"
          "जलं": "water"
          "सिञ्चति": "sprinkles"
  "sa-13012":
    native: "to creep; to glide"
    notes:
      "n1": "A verb of the first class: the class sign a is added to the root सृप् (sṛp) with its vowel strengthened (guṇa), so the present stem is सर्प (sarpa). The third person singular is सर्पति (sarpati). Its row is in the present-system table."
