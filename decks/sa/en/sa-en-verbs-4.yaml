    notes:
      "n1": "A verb of the first class that takes the middle endings (ātmanepada): the class sign a is added to the root श्लाघ् (ślāgh), so the stem is श्लाघ (ślāgha) and the third person singular is श्लाघते (ślāghate), with the ending -te in place of -ti. The middle endings are taught in the ātmanepada lesson, where this verb has a row; the present-system table has the active forms only."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. कन्याम् (kanyām) is written कन्यां (kanyāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of श्लाघते (ślāghate) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). नृपः (nṛpaḥ) is written नृपो (nṛpo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of दूतम् (dūtam) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). दूतम् (dūtam) is written दूतं (dūtaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of श्लाघते (ślāghate) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign)."
    examples:
      "पिता कन्यां श्लाघते":
        native: "The father praises the girl."
        bases:
          "कन्यां": "girl"
          "श्लाघते": "praises"
      "नृपो दूतं श्लाघते":
        native: "The king praises the envoy."
        bases:
          "नृपो": "king"
          "दूतं": "envoy"
          "श्लाघते": "praises"
