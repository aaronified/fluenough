cards:
  "sa-13000":
    native: "to fall; to decline"
    notes:
      "n1": "A verb of the first class that takes the middle endings (ātmanepada): the class sign a is added to the root भ्रंश् (bhraṃś), so the stem is भ्रंश (bhraṃśa) and the third person singular is भ्रंशते (bhraṃśate), with the ending -te in place of -ti. The middle endings are taught in the ātmanepada lesson, where this verb has a row; the present-system table has the active forms only."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. पुष्पम् (puṣpam) is written पुष्पं (puṣpaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of वृक्षात् (vṛkṣāt) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). वृक्षात् (vṛkṣāt) is written वृक्षाद् (vṛkṣād) because a final त् (t) becomes द् (d) before a voiced sound, here the start of भ्रंशते (bhraṃśate) (Aṣṭādhyāyī 8.2.39, झलां जशोऽन्ते (jhalāṃ jaśo 'nte), in separate words झलां जशः अन्ते (jhalāṃ jaśaḥ ante); Whitney 159). कीर्तिः (kīrtiḥ) is written कीर्तिर् (kīrtir) because a final ः (ḥ) after इ (i) becomes र् (r) before a voiced sound, here the start of भ्रंशते (bhraṃśate) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174)."
    examples:
      "पुष्पं वृक्षाद् भ्रंशते":
        native: "The flower falls from the tree."
        bases:
          "पुष्पं": "flower"
          "वृक्षाद्": "tree"
          "भ्रंशते": "falls"
      "कीर्तिर् भ्रंशते":
        native: "Fame declines."
        bases:
          "कीर्तिर्": "fame"
          "भ्रंशते": "declines"
  "sa-13001":
    native: "to yoke; to join"
    notes:
      "n1": "A verb of the seventh class: a nasal infix na is put inside the root युज् (yuj) before its last sound, so the third person singular is युनक्ति (yunakti). Its row is in the table of the classes 6 to 10."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. सारथिः (sārathiḥ) is written सारथिर् (sārathir) because a final ः (ḥ) after इ (i) becomes र् (r) before a voiced sound, here the start of अश्वम् (aśvam) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174). अश्वम् (aśvam) is written अश्वं (aśvaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of रथे (rathe) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). कर्षकः (karṣakaḥ) is written कर्षको (karṣako) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of बलीवर्दम् (balīvardam) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). बलीवर्दम् (balīvardam) is written बलीवर्दं (balīvardaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of लाङ्गले (lāṅgale) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign)."
    examples:
      "सारथिर् अश्वं रथे युनक्ति":
        native: "The charioteer yokes the horse to the chariot."
        bases:
          "सारथिर्": "charioteer"
          "अश्वं": "horse"
          "रथे": "chariot"
          "युनक्ति": "yokes"
      "कर्षको बलीवर्दं लाङ्गले युनक्ति":
        native: "The farmer yokes the ox to the plough."
        bases:
          "कर्षको": "farmer"
          "बलीवर्दं": "ox"
          "लाङ्गले": "plough"
          "युनक्ति": "yokes"
  "sa-13002":
    native: "to shine; to reign"
    notes:
      "n1": "A verb of the first class: the class sign a is added to the root राज् (rāj), so the present stem is राज (rāja). The third person singular is राजति (rājati). Its row is in the present-system table."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. सूर्यः (sūryaḥ) is written सूर्यो (sūryo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of राजति (rājati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). नृपः (nṛpaḥ) is written नृपो (nṛpo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of राजति (rājati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca))."
    examples:
      "सूर्यो राजति":
        native: "The sun shines."
        bases:
          "सूर्यो": "sun"
          "राजति": "shines"
      "नृपो राजति":
        native: "The king reigns."
        bases:
          "नृपो": "king"
          "राजति": "reigns"
  "sa-13003":
    native: "to be ashamed"
    notes:
      "n1": "A verb of the sixth class: the sign a is added to the root लज्ज् (lajj), so the present stem is लज्ज (lajja) and the third person singular is लज्जते (lajjate). This verb takes the middle endings (ātmanepada), taught in the ātmanepada lesson, where it has a row."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. शिशुः (śiśuḥ) is written शिशुर् (śiśur) because a final ः (ḥ) after उ (u) becomes र् (r) before a voiced sound, here the start of लज्जते (lajjate) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174)."
    examples:
      "कन्या लज्जते":
        native: "The girl is ashamed."
        bases:
          "लज्जते": "is ashamed"
      "शिशुर् लज्जते":
        native: "The child is ashamed."
        bases:
          "शिशुर्": "child"
          "लज्जते": "is ashamed"
  "sa-13004":
    native: "to hang down"
    notes:
      "n1": "A verb of the first class that takes the middle endings (ātmanepada): the class sign a is added to the root लम्ब् (lamb), so the stem is लम्ब (lamba) and the third person singular is लम्बते (lambate), with the ending -te in place of -ti. The middle endings are taught in the ātmanepada lesson, where this verb has a row; the present-system table has the active forms only."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. दीपः (dīpaḥ) is written दीपो (dīpo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of गृहे (gṛhe) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). वस्त्रम् (vastram) is written वस्त्रं (vastraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of द्वारे (dvāre) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign)."
    examples:
      "दीपो गृहे लम्बते":
        native: "The lamp hangs in the house."
        bases:
          "दीपो": "lamp"
          "गृहे": "house"
          "लम्बते": "hangs"
      "वस्त्रं द्वारे लम्बते":
        native: "The cloth hangs at the door."
        bases:
          "वस्त्रं": "cloth"
          "द्वारे": "door"
          "लम्बते": "hangs"
  "sa-13005":
    native: "to rain"
    notes:
      "n1": "A verb of the first class: the class sign a is added to the root वृष् (vṛṣ) with its vowel strengthened (guṇa), so the present stem is वर्ष (varṣa). The third person singular is वर्षति (varṣati). Its row is in the present-system table."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. मेघः (meghaḥ) is written मेघो (megho) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of वर्षति (varṣati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca))."
    examples:
      "मेघो वर्षति":
        native: "The cloud rains."
        bases:
          "मेघो": "cloud"
          "वर्षति": "rains"
      "पर्वते मेघो वर्षति":
        native: "The cloud rains on the mountain."
        bases:
          "पर्वते": "mountain"
          "मेघो": "cloud"
          "वर्षति": "rains"
  "sa-13006":
    native: "to be distressed; to tremble"
    notes:
      "n1": "A verb of the first class that takes the middle endings (ātmanepada): the class sign a is added to the root व्यथ् (vyath), so the stem is व्यथ (vyatha) and the third person singular is व्यथते (vyathate), with the ending -te in place of -ti. The middle endings are taught in the ātmanepada lesson, where this verb has a row; the present-system table has the active forms only."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. नृपः (nṛpaḥ) is written नृपो (nṛpo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of व्यथते (vyathate) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca))."
    examples:
