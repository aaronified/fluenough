      "नृपो व्यथते":
        native: "The king is distressed."
        bases:
          "नृपो": "king"
          "व्यथते": "is distressed"
  "sa-13007":
    native: "to go; to walk"
    notes:
      "n1": "A verb of the first class: the class sign a is added to the root व्रज् (vraj), so the present stem is व्रज (vraja). The third person singular is व्रजति (vrajati). Its row is in the present-system table."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. पथिकः (pathikaḥ) is written पथिको (pathiko) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of ग्रामम् (grāmam) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). ग्रामम् (grāmam) is written ग्रामं (grāmaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of व्रजति (vrajati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). दूतः (dūtaḥ) is written दूतो (dūto) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of नगरम् (nagaram) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). नगरम् (nagaram) is written नगरं (nagaraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of व्रजति (vrajati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign)."
    examples:
      "पथिको ग्रामं व्रजति":
        native: "The traveller goes to the village."
        bases:
          "पथिको": "traveller"
          "ग्रामं": "village"
          "व्रजति": "goes"
      "दूतो नगरं व्रजति":
        native: "The envoy goes to the city."
        bases:
          "दूतो": "envoy"
          "नगरं": "city"
          "व्रजति": "goes"
  "sa-13008":
    native: "to curse"
    notes:
      "n1": "A verb of the first class: the class sign a is added to the root शप् (śap), so the present stem is शप (śapa). The third person singular is शपति (śapati). Its row is in the present-system table."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. ऋषिः (ṛṣiḥ) is written ऋषिर् (ṛṣir) because a final ः (ḥ) after इ (i) becomes र् (r) before a voiced sound, here the start of दुर्जनम् (durjanam) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174). दुर्जनम् (durjanam) is written दुर्जनं (durjanaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of शपति (śapati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). ऋषिः (ṛṣiḥ) is written ऋषिश् (ṛṣiś) because a final ः (ḥ) before च (ca) becomes श् (ś), here the start of चोरम् (coram) (Aṣṭādhyāyī 8.3.34 and 8.4.40; Whitney 170 c). चोरम् (coram) is written चोरं (coraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of शपति (śapati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign)."
    examples:
      "ऋषिर् दुर्जनं शपति":
        native: "The sage curses the villain."
        bases:
          "ऋषिर्": "sage"
          "दुर्जनं": "villain"
          "शपति": "curses"
      "ऋषिश् चोरं शपति":
        native: "The sage curses the thief."
        bases:
          "ऋषिश्": "sage"
          "चोरं": "thief"
          "शपति": "curses"
  "sa-13009":
    native: "to lie down; to sleep"
    notes:
      "n1": "A verb of the second class: the endings are added to the root शी (śī) with no class sign, and the singular has the strengthened form, so the third person singular is शेते (śete). This verb takes the middle endings (ātmanepada), taught in the ātmanepada lesson, where it has a row."
      "n2": "Written apart: the words are not run together, but each junction that changes shape is shown. शय्यायाम् (śayyāyām) is written शय्यायां (śayyāyāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of शेते (śete) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). कुक्कुरः (kukkuraḥ) is written कुक्कुरो (kukkuro) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of गृहे (gṛhe) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca))."
    examples:
      "माता शय्यायां शेते":
        native: "The mother lies on the bed."
        bases:
          "शय्यायां": "bed"
          "शेते": "lies"
      "कुक्कुरो गृहे शेते":
        native: "The dog lies in the house."
        bases:
          "कुक्कुरो": "dog"
          "गृहे": "house"
          "शेते": "lies"
  "sa-13010":
    native: "to grieve"
    notes:
      "n1": "A verb of the first class: the class sign a is added to the root शुच् (śuc) with its vowel strengthened (guṇa), so the present stem is शोच (śoca). The third person singular is शोचति (śocati). Its row is in the present-system table."
