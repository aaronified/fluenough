      "भुवि": { meaning: "earth (on the earth)" }
      "भारभूता": { meaning: "burden + become" }
      "मनुष्यरूपेण": { meaning: "man + form (in human form)" }
      "मृगाश्चरन्ति": { meaning: "beast + to go about (beasts walk about)" }
  "sa-8109":
    native: "Better to wander on mountain strongholds with forest-dwellers than to keep the company of fools, even in the palaces of the king of the gods."
    notes:
      "literal": "Said to show how bad the company of fools is."
    bases:
      "वरं": { meaning: "better" }
      "पर्वतदुर्गेषु": { meaning: "mountain + stronghold (on mountain strongholds)" }
      "भ्रान्तं": { meaning: "wandered" }
