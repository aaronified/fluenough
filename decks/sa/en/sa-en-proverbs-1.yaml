name: "Proverbs: subhāṣita 1"
description: "Twenty Sanskrit verses of advice on learning, speech and judgement, from texts in the public domain, each with its English meaning and what it is said of. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sa-8100":
    native: "A wise person should think of knowledge and wealth as if he would never age or die, but should practise right action as if death already held him by the hair."
    notes:
      "literal": "Said to teach that one should pursue learning and wealth as though life were long, yet do right at once, as though death were near."
  "sa-8101":
    native: "Of all kinds of wealth, they say, knowledge alone is the best, because it cannot be stolen, cannot be priced and never wears away."
    notes:
      "literal": "Said in praise of learning as the one possession that nobody can take from a person."
  "sa-8102":
    native: "Knowledge gives humility; from humility comes worthiness; from worthiness one gets wealth; from wealth, right action, and then happiness."
    notes:
      "literal": "Said to show how learning leads step by step to a good life."
  "sa-8103":
    native: "Though they have beauty, youth and birth in a great family, people without learning do not shine, like scentless kiṃśuka flowers."
    notes:
      "literal": "Said that looks and birth count for little without learning."
  "sa-8104":
    native: "A pot is filled little by little by the falling of drops of water; so it is the cause of all knowledge, of right action and of wealth."
    notes:
      "literal": "Said to teach that small steady gains add up to learning, virtue and wealth."
  "sa-8105":
    native: "The time of the wise passes in the pleasure of poetry and the sciences; that of fools passes in vice, sleep or quarrels."
    notes:
      "literal": "Said to contrast how the wise and the foolish spend their days."
  "sa-8106":
    native: "What is too heavy for the capable, what is far for the determined, what is a foreign land for the learned, and who is a stranger to those who speak kindly?"
    notes:
      "literal": "Said to show that ability, effort, learning and kind words make hard things easy."
  "sa-8107":
    native: "A person without literature, music and art is a beast in person, without tail or horns; that he lives without eating grass is the greatest good fortune of the beasts."
    notes:
      "literal": "Said sharply of people who care nothing for the arts: the animals are lucky that such a person does not graze."
  "sa-8108":
    native: "Those who have neither learning, austerity, giving, knowledge, conduct, virtue nor right action are a burden on the earth in this world of mortals, and walk about as beasts in human form."
    notes:
      "literal": "Said of people with no learning and no goodness, who add nothing to the world."
  "sa-8109":
    native: "Better to wander on mountain strongholds with forest-dwellers than to keep the company of fools, even in the palaces of the king of the gods."
    notes:
      "literal": "Said to show how bad the company of fools is."
  "sa-8110":
    native: "Good company takes away dullness of mind, waters speech with truth, raises honour, removes wrong, calms the heart and spreads fame in every direction; say, what does it not do for people?"
    notes:
      "literal": "Said in praise of the company of good people."
  "sa-8111":
    native: "A wicked person should be avoided even if he is adorned with learning; is a snake not fearful even though it wears a jewel?"
    notes:
      "literal": "Said that learning does not make a wicked person safe to be near."
  "sa-8112":
    native: "Trees bow down when they bear fruit and clouds hang low with fresh water; good people are not proud in prosperity, which is the nature of those who help others."
    notes:
      "literal": "Said of the humility that goes with giving and success."
  "sa-8113":
    native: "The ear is adorned by what is heard, not by an earring; the hand by giving, not by a bracelet; the body of the compassionate by helping others, not by sandal paste."
    notes:
      "literal": "Said that the true ornaments are learning, generosity and kindness."
  "sa-8114":
    native: "What is badly seen, badly understood, badly heard and badly examined must not be done by a man, as the barber did here."
    notes:
      "literal": "Said as a warning never to act on what has not been carefully checked."
  "sa-8115":
    native: "The earth is adorned here and there by those who are poor in harsh words, rich in kind words, content with their own wives and turned away from slandering others."
    notes:
      "literal": "Said to describe the rare good people who adorn the world."
  "sa-8116":
    native: "Kings of fierce anger have no one they call their own: fire burns even the priest who feeds it."
    notes:
      "literal": "Said as a warning that powerful, hot-tempered people can turn on anyone, even a friend."
  "sa-8117":
    native: "He who takes a wicked person for an honest speaker, judging him by himself, is cheated by rogues, as the brahmin was over the goat."
    notes:
      "literal": "Said as a warning not to judge others by oneself, since honest people are easily fooled."
  "sa-8118":
    native: "Those who eat only to live, mate only to have children and speak only to tell the truth cross even hard places."
    notes:
      "literal": "Said to praise people of simple, honest living."
  "sa-8119":
    native: "In this turning world, who that dies is not born again; but he is truly born by whose birth his family rises."
    notes:
      "literal": "Said that a life counts only if it raises the family."
