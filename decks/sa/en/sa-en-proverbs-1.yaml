cards:
  "sa-8100":
    native: "A wise person should think of knowledge and wealth as if he would never age or die, but should practise right action as if death already held him by the hair."
    notes:
      "literal": "Said to teach that one should pursue learning and wealth as though life were long, yet do right at once, as though death were near."
    bases:
      "अजरामरवत्": { meaning: "ageless + deathless + like (as if ageless and deathless)" }
      "प्राज्ञो": { meaning: "wise person" }
      "विद्यामर्थं": { meaning: "knowledge + wealth" }
      "च": { meaning: "and" }
      "चिंतयेत्": { meaning: "to think (one should think)" }
      "गृहीत": { meaning: "seized" }
      "इव": { meaning: "like" }
      "केशेषु": { meaning: "hair (by the hair)" }
      "मृत्युना": { meaning: "death (by death)" }
      "धर्ममाचरेत्": { meaning: "right action + to practise (one should practise)" }
  "sa-8103":
    native: "Though they have beauty, youth and birth in a great family, people without learning do not shine, like scentless kiṃśuka flowers."
    notes:
      "literal": "Said that looks and birth count for little without learning."
    bases:
      "रूप": { meaning: "beauty" }
      "यौवन": { meaning: "youth" }
      "संपन्ना": { meaning: "endowed" }
      "विशाल": { meaning: "great" }
      "कुल": { meaning: "family" }
      "संभवाः": { meaning: "born" }
      "विद्या": { meaning: "knowledge" }
      "हीना": { meaning: "without" }
      "न": { meaning: "not" }
      "शोभंते": { meaning: "to shine (they shine)" }
      "निर्गंधा": { meaning: "scentless" }
      "इव": { meaning: "like" }
      "किंशुकाः": { meaning: "kiṃśuka flower" }
  "sa-8104":
    native: "A pot is filled little by little by the falling of drops of water; so it is the cause of all knowledge, of right action and of wealth."
    notes:
      "literal": "Said to teach that small steady gains add up to learning, virtue and wealth."
    bases:
      "जल": { meaning: "water" }
      "बिंदु": { meaning: "drop" }
      "निपातेन": { meaning: "falling (by the falling)" }
      "क्रमशः": { meaning: "step by step" }
      "पूर्यते": { meaning: "to fill (is filled)" }
      "घटः": { meaning: "pot" }
      "स": { meaning: "he" }
      "हेतुः": { meaning: "cause" }
      "सर्व": { meaning: "all" }
      "विद्यानां": { meaning: "knowledge (of all kinds of knowledge)" }
      "धर्मस्य": { meaning: "dharma, law, right way (of dharma)" }
      "च": { meaning: "and" }
      "धनस्य": { meaning: "wealth (of wealth)" }
  "sa-8106":
    native: "What is too heavy for the capable, what is far for the determined, what is a foreign land for the learned, and who is a stranger to those who speak kindly?"
    notes:
      "literal": "Said to show that ability, effort, learning and kind words make hard things easy."
    bases:
      "कोऽतिभारः": { meaning: "what + too + burden" }
      "समर्थानां": { meaning: "capable (of the capable)" }
      "किं": { meaning: "what" }
      "दूरं": { meaning: "far" }
      "व्यवसायिनाम्": { meaning: "determined person (to the determined)" }
      "को": { meaning: "who" }
      "विदेशः": { meaning: "foreign land" }
      "सविद्यानां": { meaning: "learned (for the learned)" }
      "कः": { meaning: "who" }
      "परः": { meaning: "other, stranger" }
      "प्रिय": { meaning: "pleasant" }
      "वादिनाम्": { meaning: "speaking (of those who speak)" }
  "sa-8107":
    native: "A person without literature, music and art is a beast in person, without tail or horns; that he lives without eating grass is the greatest good fortune of the beasts."
    notes:
      "literal": "Said sharply of people who care nothing for the arts: the animals are lucky that such a person does not graze."
    bases:
      "साहित्यसङ्गीतकलाविहीनःसाक्षात्पशुः": { meaning: "literature + music + art + without + in person + beast" }
      "पुच्छविषाणहीनः": { meaning: "tail + horn + without" }
      "तृणं": { meaning: "grass" }
      "न": { meaning: "not" }
      "खादन्नपि": { meaning: "eating + even" }
      "जीवमानस्तद्भागधेयं": { meaning: "living + that + share, fortune" }
      "परमं": { meaning: "highest" }
      "पशूनां": { meaning: "beast (of beasts)" }
  "sa-8108":
    native: "Those who have neither learning, austerity, giving, knowledge, conduct, virtue nor right action are a burden on the earth in this world of mortals, and walk about as beasts in human form."
    notes:
      "literal": "Said of people with no learning and no goodness, who add nothing to the world."
    bases:
      "येषां": { meaning: "whose" }
      "न": { meaning: "not" }
      "विद्या": { meaning: "knowledge" }
      "तपो": { meaning: "austerity" }
