  "sa-8161":
    native: "Knowledge is a kinsman when one travels abroad, knowledge is the highest deity; knowledge is honoured by kings, not wealth, and a person without knowledge is a beast."
    notes:
      "literal": "Said in praise of learning as better than family and wealth."
