name: "Proverbs: subhāṣita 1"
description: "Twenty Sanskrit verses of advice on learning, speech and judgement, from texts in the public domain, each with its English meaning, what it is said of and the meaning of each word. Not yet checked by a Sanskrit speaker: please report any mistake."
