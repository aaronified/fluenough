cards:
  "sa-11000":
    native: "Hook, or a curve; also the hooked part of a chariot."
    notes:
      "n1": "Its case forms are in the a-stems table of the grammar rules."
      "n2": "A final अः (aḥ) before a voiced consonant is written ओ (o) (Aṣṭādhyāyī 6.1.114, हशि (haśi) च (ca)), as in अङ्को (aṅko) रथस्य (rathasya)."
      "n3": "A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ)), as in अङ्कं (aṅkaṃ) कविः (kaviḥ)."
    examples:
      "अङ्को रथस्य दृश्यते":
        native: "The hook of the chariot is seen."
        bases:
          "अङ्को": "hook"
          "रथस्य": "of the chariot"
          "दृश्यते": "is seen"
      "अङ्कं कविः पश्यति":
        native: "The poet sees the hook."
        bases:
          "अङ्कं": "hook"
          "कविः": "poet"
          "पश्यति": "sees"
  "sa-11001":
    native: "Exaggeration, the figure of speech that goes beyond the truth."
    notes:
      "n1": "Its case forms are in the other-stems table of the grammar rules."
      "n2": "en.wiktionary lists the compound अतिशयोक्ति (atiśayokti) as masculine, while the simple word उक्ति (ukti), speech, is feminine; the card follows Wiktionary."
      "n3": "A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ)), as in अतिशयोक्तिं (atiśayoktiṃ) कविः (kaviḥ)."
    examples:
      "अतिशयोक्तिं कविः करोति":
        native: "The poet makes an exaggeration."
        bases:
          "अतिशयोक्तिं": "exaggeration"
          "कविः": "poet"
          "करोति": "makes"
      "अतिशयोक्तिः पठ्यते":
        native: "The exaggeration is recited."
        bases:
          "अतिशयोक्तिः": "exaggeration"
          "पठ्यते": "is recited"
