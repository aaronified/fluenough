id: "sa-en-script-reading"
kind: "layer"
core: "sa-script-reading"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Classical Sanskrit reading"
description: "Short words to read in Devanagari, with their meanings. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "sa-4094":
    native: "Rāma, the hero of the Rāmāyaṇa"
    notes:
      "n1": "The nominative ending ः (ḥ) is the visarga of रामः (rāmaḥ). Read the ending as a breathed h."
      "n2": "Written apart: A final अः (aḥ) before a voiced consonant becomes ओ (o) (Whitney 175 a; Aṣṭādhyāyī 6.1.113 and 6.1.114)."
    examples:
      "रामो गच्छति।": "Rama goes."
      "रामः पठति।": "Rama reads."
  "sa-4095":
    native: "dharma: duty and right conduct"
    notes:
      "n1": "A word that carries a whole ethic. Read it with the aspirated dh and the visarga at the end."
      "n2": "Written apart: A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign."
    examples:
      "धर्मः शुभः।": "Dharma is good."
      "धर्मं कुरु।": "Do your duty."
  "sa-4096":
    native: "homage; a greeting of respect"
    notes:
      "n1": "An indeclinable word of respect, said before a deity or a teacher."
      "n2": "Written apart: A final अः (aḥ) before a voiced consonant becomes ओ (o) (Whitney 175 a; Aṣṭādhyāyī 6.1.113 and 6.1.114)."
    examples:
      "नमः शिवाय।": "Homage to Śiva."
      "नमो गुरवे।": "Homage to the teacher."
  "sa-4097":
    native: "teacher; also heavy, in the metre"
    notes:
      "n1": "Its other sense, heavy, is used of syllables in Sanskrit metre."
      "n2": "Written apart: A final visarga after a vowel other than अ (a) or आ (ā) becomes र् (r) before a voiced consonant or a vowel (Whitney 174)."
    examples:
      "गुरुः पठति।": "The teacher reads."
      "गुरुर् वदति।": "The teacher speaks."
  "sa-4098":
    native: "Veda, one of the oldest sacred texts"
    notes:
      "n1": "Read the v as a semivowel and the d as a dental."
    examples:
      "वेदः पठ।": "Read the Veda."
      "वेदः शुभः।": "The Veda is auspicious."
  "sa-4099":
    native: "India, the land of Bhārata"
    notes:
      "n1": "The -m at the end is the anusvāra, read as a nasal."
      "n2": "Written apart: A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign."
    examples:
      "भारतं सुन्दरम्।": "Bhārata is beautiful."
      "भारते जनाः सन्ति।": "There are people in India."
  "sa-4100":
    native: "book"
    notes:
      "n1": "The conjunct स्त (sta) sits in the middle of the word."
      "n2": "Written apart: A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign. Before a vowel the final म् (m) stays and is not joined to the next word: written apart, sandhi not applied (Whitney 213 a)."
    examples:
      "पुस्तकं पठामि।": "I read a book."
      "पुस्तकम् अस्ति।": "There is a book."
  "sa-4101":
    native: "student, a pupil"
    notes:
      "n1": "A masculine noun ending in ḥ; read the ṣ as a retroflex sibilant, as in ष (ṣa)."
      "n2": "Written apart: A final अः (aḥ) before a vowel other than अ (a) loses its visarga and the vowels stay apart (Whitney 175 c)."
    examples:
      "शिष्यः पठति।": "The student reads."
      "शिष्य आगच्छति।": "The student comes."
