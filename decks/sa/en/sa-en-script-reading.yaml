id: "sa-en-script-reading"
kind: "layer"
core: "sa-script-reading"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Classical Sanskrit reading"
description: "Short words to read in Devanagari, with their meanings. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "sa-1094":
    native: "Rāma, the hero of the Rāmāyaṇa"
    notes:
      "n1": "The nominative ending ः (ḥ) is the visarga of रामः (rāmaḥ). Read the ending as a breathed h."
    examples:
      "रामः गच्छति।": "Rama goes."
      "रामः पठति।": "Rama reads."
  "sa-1095":
    native: "dharma: duty and right conduct"
    notes:
      "n1": "A word that carries a whole ethic. Read it with the aspirated dh and the visarga at the end."
    examples:
      "धर्मः शुभः।": "Dharma is good."
      "धर्मं कुरु।": "Do your duty."
  "sa-1096":
    native: "homage; a greeting of respect"
    notes:
      "n1": "An indeclinable word of respect, said before a deity or a teacher."
    examples:
      "नमः शिवाय।": "Homage to Śiva."
      "नमः गुरवे।": "Homage to the teacher."
  "sa-1097":
    native: "teacher; also heavy, in the metre"
    notes:
      "n1": "Its other sense, heavy, is used of syllables in Sanskrit metre."
    examples:
      "गुरुः पठति।": "The teacher reads."
      "गुरुः वदति।": "The teacher speaks."
  "sa-1098":
    native: "Veda, one of the oldest sacred texts"
    notes:
      "n1": "Read the v as a semivowel and the d as a dental."
    examples:
      "वेदः पठ।": "Read the Veda."
      "वेदः शुभः।": "The Veda is auspicious."
  "sa-1099":
    native: "India, the land of Bhārata"
    notes:
      "n1": "The -m at the end is the anusvāra, read as a nasal."
    examples:
      "भारतं सुन्दरम्।": "Bhārata is beautiful."
      "भारते जनाः सन्ति।": "There are people in India."
  "sa-1100":
    native: "book"
    notes:
      "n1": "The conjunct स्त (sta) sits in the middle of the word."
    examples:
      "पुस्तकं पठामि।": "I read a book."
      "पुस्तकम् अस्ति।": "There is a book."
  "sa-1101":
    native: "Sanskrit: the refined language"
    notes:
      "n1": "It has an anusvāra before the first स् (s) and the cluster स्कृ (skṛ), with the vowel sign ृ (ṛ)."
    examples:
      "संस्कृते वदामि।": "I speak in Sanskrit."
      "संस्कृतं पठामि।": "I read Sanskrit."
