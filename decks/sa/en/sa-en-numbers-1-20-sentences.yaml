cards:
  "sa-3040":
    native: "Two students read Sanskrit."
    bases: { "शिष्यौ": "two students", "संस्कृतं": "the Sanskrit language", "पठतः": "to read (the two read)" }
    confusables: { "w1": { why: "Three, not two: त्रयः (trayaḥ) means three." }, "w2": { why: "Water, not student: जलम् (jalam) means water." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. संस्कृतम् (saṃskṛtam) is written संस्कृतं (saṃskṛtaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पठतः (paṭhataḥ) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "Two persons need the dual: शिष्यौ (śiṣyau) and the verb पठतः (paṭhataḥ) both end for two." }
  "sa-3041":
    native: "Three gods drink water."
    bases: { "त्रयो": "three", "देवा": "gods", "जलं": "water", "पिबन्ति": "to drink (they drink)" }
    confusables: { "w1": { why: "Four, not three: चत्वारः (catvāraḥ) means four." }, "w2": { why: "Cow, not god: गौः (gauḥ) means cow." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. त्रयः (trayaḥ) is written त्रयो (trayo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of देवाः (devāḥ) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). देवाः (devāḥ) is written देवा (devā) because a final आः (āḥ) loses its visarga before a voiced consonant, here the start of जलम् (jalam) (Whitney 177). जलम् (jalam) is written जलं (jalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पिबन्ति (pibanti) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign)." }
  "sa-3042":
    native: "How many students drink water?"
    bases: { "शिष्या": "students", "जलं": "water", "पिबन्ति": "to drink (they drink)" }
    confusables: { "w1": { why: "Why, not how many: किमर्थम् (kimartham) means why." }, "w2": { why: "Fire, not student: अग्निः (agniḥ) means fire." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. शिष्याः (śiṣyāḥ) is written शिष्या (śiṣyā) because a final आः (āḥ) loses its visarga before a voiced consonant, here the start of जलम् (jalam) (Whitney 177). जलम् (jalam) is written जलं (jalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पिबन्ति (pibanti) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign)." }
  "sa-3043":
    native: "Eight students read and nine gods go."
    bases: { "शिष्याः": "students", "पठन्ति": "to read (they read)", "देवा": "gods", "गच्छन्ति": "to go (they go)" }
    confusables: { "w1": { why: "Ten, not eight: दश (daśa) means ten." }, "w2": { why: "Water, not student: जलम् (jalam) means water." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. देवाः (devāḥ) is written देवा (devā) because a final आः (āḥ) loses its visarga before a voiced consonant, here the start of गच्छन्ति (gacchanti) (Whitney 177)." }
  "sa-3044":
    native: "I read ten books."
    bases: { "अहं": "I", "पुस्तकानि": "books", "पठामि": "to read (I read)" }
    confusables: { "w1": { why: "You, not I: त्वम् (tvam) means you." }, "w2": { why: "Two, not ten: द्वौ (dvau) means two." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अहम् (aham) is written अहं (ahaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of दश (daśa) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign)." }
  "sa-3045":
    native: "I bring water and you bring seven books."
    bases: { "अहं": "I", "जलं": "water", "नयामि": "to bring (I bring)", "त्वं": "you", "पुस्तकानि": "books", "नयसि": "to bring (you bring)" }
    confusables: { "w1": { why: "He, not I: सः (saḥ) means he." }, "w2": { why: "Fire, not water: अग्निः (agniḥ) means fire." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अहम् (aham) is written अहं (ahaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of जलम् (jalam) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). जलम् (jalam) is written जलं (jalaṃ), for the same reason, before नयामि (nayāmi). त्वम् (tvam) is written त्वं (tvaṃ), for the same reason, before सप्त (sapta)." }
  "sa-3046":
    native: "One god reads a book and two gods go."
    bases: { "एको": "one", "पुस्तकं": "book", "पठति": "to read (reads)", "देवौ": "two gods", "गच्छतः": "to go (the two go)" }
    confusables: { "w1": { why: "Cow, not god: गौः (gauḥ) means cow." }, "w2": { why: "Student, not book: शिष्यः (śiṣyaḥ) means student." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. एकः (ekaḥ) is written एको (eko) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of देवः (devaḥ) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). पुस्तकम् (pustakam) is written पुस्तकं (pustakaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पठति (paṭhati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign)." }
  "sa-3047":
    native: "Where do twelve gods go?"
    bases: { "देवाः": "gods", "गच्छन्ति": "to go (they go)" }
    confusables: { "w1": { why: "Cow, not god: गौः (gauḥ) means cow." }, "w2": { why: "When, not where: कदा (kadā) means when." } }
