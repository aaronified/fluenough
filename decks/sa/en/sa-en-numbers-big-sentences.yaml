cards:
  "sa-3110":
    native: "I read a hundred books."
    bases: { "अहं": "I", "शतं": "a hundred", "पुस्तकानि": "books", "पठामि": "to read (I read)" }
    confusables: { "w1": { why: "You, not I: त्वम् (tvam) means you." }, "w2": { why: "A thousand, not a hundred: सहस्रम् (sahasram) means a thousand." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अहम् (aham) is written अहं (ahaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of शतम् (śatam) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). शतम् (śatam) is written शतं (śataṃ), for the same reason, before पुस्तकानि (pustakāni). The labial keeps म् (m) in Whitney 213 a, but the anusvāra sign is the usual writing (Whitney 213 i)." }
  "sa-3111":
    native: "A thousand students read books."
    bases: { "सहस्रं": "a thousand", "शिष्याः": "students", "पुस्तकानि": "books", "पठन्ति": "to read (they read)" }
    confusables: { "w1": { why: "Ten thousand, not a thousand: अयुतम् (ayutam) means ten thousand." }, "w2": { why: "Water, not student: जलम् (jalam) means water." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सहस्रम् (sahasram) is written सहस्रं (sahasraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of शिष्याः (śiṣyāḥ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign)." }
  "sa-3112":
    native: "Mother buys thirty books and reads fifty books."
    bases: { "पुस्तकानि": "books", "क्रीणाति": "to buy (buys)", "पठति": "to read (reads)" }
    confusables: { "w1": { why: "Forty, not thirty: चत्वारिंशत् (catvāriṃśat) means forty." }, "w2": { why: "Student, not book: शिष्यः (śiṣyaḥ) means student." } }
    notes: { "n1": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3113":
    native: "Father carries fifty books."
    bases: { "पुस्तकानि": "books", "वहति": "to carry (carries)" }
    confusables: { "w1": { why: "A hundred, not fifty: शतम् (śatam) means a hundred." }, "w2": { why: "Student, not book: शिष्यः (śiṣyaḥ) means student." } }
  "sa-3114":
    native: "You read forty books and mother reads a hundred."
    bases: { "त्वं": "you", "पुस्तकानि": "books", "पठसि": "to read (you read)", "शतं": "a hundred", "पठति": "to read (reads)" }
    confusables: { "w1": { why: "He, not you: सः (saḥ) means he." }, "w2": { why: "Fifty, not forty: पञ्चाशत् (pañcāśat) means fifty." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. त्वम् (tvam) is written त्वं (tvaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of चत्वारिंशत् (catvāriṃśat) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). शतम् (śatam) is written शतं (śataṃ), for the same reason, before पठति (paṭhati). The labial keeps म् (m) in Whitney 213 a, but the anusvāra sign is the usual writing (Whitney 213 i).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3115":
    native: "Ten thousand students go and a hundred thousand students read."
    bases: { "अयुतं": "ten thousand", "शिष्या": "students", "गच्छन्ति": "to go (they go)", "लक्षं": "a hundred thousand", "शिष्याः": "students", "पठन्ति": "to read (they read)" }
    confusables: { "w1": { why: "Thirty, not ten thousand: त्रिंशत् (triṃśat) means thirty." }, "w2": { why: "Water, not student: जलम् (jalam) means water." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अयुतम् (ayutam) is written अयुतं (ayutaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of शिष्याः (śiṣyāḥ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). शिष्याः (śiṣyāḥ) is written शिष्या (śiṣyā) because a final आः (āḥ) loses its visarga before a voiced consonant, here the start of गच्छन्ति (gacchanti) (Whitney 177). लक्षम् (lakṣam) is written लक्षं (lakṣaṃ), for the same reason, before च (ca).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3116":
    native: "There are a hundred thousand books there."
    bases: { "लक्षं": "a hundred thousand", "पुस्तकानि": "books", "भवन्ति": "to be (they are)" }
    confusables: { "w1": { why: "Now, not there: इदानीम् (idānīm) means now." }, "w2": { why: "Thirty, not a hundred thousand: त्रिंशत् (triṃśat) means thirty." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. लक्षम् (lakṣam) is written लक्षं (lakṣaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पुस्तकानि (pustakāni) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i)." }
  "sa-3117":
    native: "I read seven hundred books."
    bases: { "शतानि": "hundreds", "पुस्तकानि": "books", "पठामि": "to read (I read)" }
    confusables: { "w1": { why: "Eight, not seven: अष्ट (aṣṭa) means eight." }, "w2": { why: "A thousand, not a hundred: सहस्रम् (sahasram) means a thousand." } }
