  notes: "What is joined, and by which sūtra of the Aṣṭādhyāyī. Savarṇa-dīrgha, 6.1.101: अकः सवर्णे दीर्घः (akaḥ savarṇe dīrghaḥ), a vowel of the group a, i, u, ṛ followed by a like vowel gives one long vowel. Guṇa, 6.1.87: आत् गुणः (āt guṇaḥ), as the page of the sūtras types it, which is आद्गुणः (ādguṇaḥ) joined; a or ā followed by i, u or ṛ gives e, o or ar, the guṇa vowels (named in 1.1.2). Vṛddhi, 6.1.88: वृद्धिरेचि (vṛddhireci), a or ā followed by e, ai, o or au gives ai or au, the vṛddhi vowels. Yaṇ, 6.1.77: इको यणचि (iko yaṇaci), the page of the sūtras types it इकः यण् अचि (ikaḥ yaṇ aci) split into words; i, u, ṛ or ḷ before a different vowel becomes y, v, r or l. Ayādi, 6.1.78: एचोऽयवायावः (eco'yavāyāvaḥ), e, o, ai and au before a vowel become ay, av, āy and āv. Pūrvarūpa, 6.1.109: एङः पदान्तादति (eṅaḥ padāntādati), a word-final e or o followed by a short a keeps its own form, and the a is lost, which the avagraha sign ऽ (avagraha) marks in writing. Read in the pages named in the core's header, 2026-11-16; where a joined form is a compound read on Wiktionary, its entry names the two parts."
