name: "Vowel sandhi: two vowels meeting"
description: "How two vowels join when one word or part ends in a vowel and the next begins with one: the long vowel, guṇa, vṛddhi, the semivowels and the changes of e, o, ai and au, each with its sūtra of Pāṇini. Not yet checked by a Sanskrit speaker: please report any mistake."
