cards:
  "sa-3840":
    native: "The merchant buys gold in the city."
    bases: { "वणिग्": "merchant", "नगरे": "in the city", "हिरण्यं": "gold", "क्रीणाति": "to buy (buys)" }
    confusables: { "w1": { why: "Business, not merchant: व्यापारः (vyāpāraḥ) means business." }, "w2": { why: "Price, not gold: मूल्यम् (mūlyam) means price." }, "w3": { why: "To give, not to buy: दा (dā) means to give." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वणिक् (vaṇik) is written वणिग् (vaṇig) because a final क् (k) becomes ग् (g) before a voiced sound, here the start of नगरे (nagare) (Aṣṭādhyāyī 8.2.39, झलां जशः अन्ते (jhalāṃ jaśaḥ ante); Whitney 159). हिरण्यम् (hiraṇyam) is written हिरण्यं (hiraṇyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of क्रीणाति (krīṇāti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "नगरे (nagare) is the locative case of नगरम् (nagaram): in the city. हिरण्यम् (hiraṇyam) is the accusative case: what he buys." }
  "sa-3841":
    native: "The mongoose is the snake's enemy."
    bases: { "सर्पस्य": "snake's", "शत्रुर्": "enemy", "नकुलो": "mongoose", "ऽस्ति": "to be (is)" }
    confusables: { "w1": { why: "Wolf, not mongoose: वृकः (vṛkaḥ) means wolf." }, "w2": { why: "Friend, not enemy: मित्रम् (mitram) means friend." }, "w3": { why: "Hare, not mongoose: शशकः (śaśakaḥ) means hare." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. शत्रुः (śatruḥ) is written शत्रुर् (śatrur) because a final ः (ḥ) after उ (u) becomes र् (r) before a voiced sound, here the start of नकुलो (nakulo) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174). नकुलः (nakulaḥ) is written नकुलो (nakulo) because a final अः (aḥ) becomes ओ (o) before अ (a), and that अ (a) is dropped and shown by the sign ऽ (avagraha), here at the start of अस्ति (asti) (Whitney 175 a; Aṣṭādhyāyī 6.1.109, एङः पदान्तादति (eṅaḥ padāntād ati), with 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute)).", "n2": "सर्पस्य (sarpasya) is the genitive case of सर्पः (sarpaḥ): of the snake. नकुलः (nakulaḥ) is the subject, and शत्रुः (śatruḥ) says what he is." }
  "sa-3842":
    native: "The lion is the king of the animals."
    bases: { "पशूनां": "of the animals", "राजा": "king", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Tiger, not lion: व्याघ्रः (vyāghraḥ) means tiger." }, "w2": { why: "Elephant, not lion: गजः (gajaḥ) means elephant." }, "w3": { why: "Queen, not king: राज्ञी (rājñī) means queen." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पशूनाम् (paśūnām) is written पशूनां (paśūnāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of राजा (rājā) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "पशूनाम् (paśūnām) is the genitive plural of पशुः (paśuḥ): of the animals. राजा (rājā) is the nominative singular of राजन् (rājan): king." }
  "sa-3843":
    native: "The owl moves about in the forest at night."
    bases: { "उलूको": "owl", "वने": "in the forest", "चरति": "to move about (moves about)" }
    confusables: { "w1": { why: "Crow, not owl: काकः (kākaḥ) means crow." }, "w2": { why: "In the morning, not at night: प्रातः (prātaḥ) means in the morning." }, "w3": { why: "Desert, not forest: मरुः (maruḥ) means desert." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. उलूकः (ulūkaḥ) is written उलूको (ulūko) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of रात्रौ (rātrau) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "वने (vane) is the locative case of वनम् (vanam): in the forest. चरति (carati) is the present of चर् (car): moves about, roams." }
  "sa-3844":
    native: "In the forest the hawk carries off a mouse."
    bases: { "वने": "in the forest", "श्येनो": "hawk", "मूषकं": "mouse", "हरति": "to take (carries off)" }
    confusables: { "w1": { why: "Vulture, not hawk: गृध्रः (gṛdhraḥ) means vulture." }, "w2": { why: "Cat, not mouse: मार्जारः (mārjāraḥ) means cat." }, "w3": { why: "To carry, not to take away: वह् (vah) means to carry." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. श्येनः (śyenaḥ) is written श्येनो (śyeno) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of मूषकं (mūṣakaṃ) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). मूषकम् (mūṣakam) is written मूषकं (mūṣakaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of हरति (harati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "वने (vane) is the locative case of वनम् (vanam): in the forest. मूषकम् (mūṣakam) is the accusative case of मूषकः (mūṣakaḥ): what the hawk carries off." }
  "sa-3845":
    native: "The physician gives medicine for the disease."
    bases: { "औषधं": "medicine", "वैद्यो": "physician", "रोगाय": "for the disease", "ददाति": "to give (gives)" }
    confusables: { "w1": { why: "Old age, not disease: जरा (jarā) means old age." }, "w2": { why: "Teacher, not physician: अध्यापकः (adhyāpakaḥ) means teacher." }, "w3": { why: "To take, not to give: हृ (hṛ) means to take." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. औषधम् (auṣadham) is written औषधं (auṣadhaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of वैद्यो (vaidyo) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). वैद्यः (vaidyaḥ) is written वैद्यो (vaidyo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of रोगाय (rogāya) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "रोगाय (rogāya) is the dative case of रोगः (rogaḥ): for the disease. औषधम् (auṣadham) is the accusative case: what is given." }
  "sa-3846":
    native: "The timid mouse lives in a hole."
    bases: { "भीरुर्": "timid", "मूषको": "mouse", "बिले": "in a hole", "वसति": "to dwell (lives)" }
    confusables: { "w1": { why: "Afraid, not timid: भीतः (bhītaḥ) means afraid." }, "w2": { why: "Angry, not timid: क्रुद्धः (kruddhaḥ) means angry." }, "w3": { why: "Cat, not mouse: मार्जारः (mārjāraḥ) means cat." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. भीरुः (bhīruḥ) is written भीरुर् (bhīrur) because a final ः (ḥ) after उ (u) becomes र् (r) before a voiced sound, here the start of मूषको (mūṣako) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174). मूषकः (mūṣakaḥ) is written मूषको (mūṣako) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of बिले (bile) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "भीरुः (bhīruḥ) is an adjective that agrees with मूषकः (mūṣakaḥ). बिले (bile) is the locative case of बिलम् (bilam): in a hole." }
  "sa-3847":
    native: "In the evening the boy listens to a story."
    bases: { "सायं": "in the evening", "कथां": "story", "शृणोति": "to hear (listens to)" }
    confusables: { "w1": { why: "Infant, not boy: शिशुः (śiśuḥ) means infant." }, "w2": { why: "Reading, not story: वाचनम् (vācanam) means reading." }, "w3": { why: "To look at, not to hear: ईक्ष् (īkṣ) means to look at." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सायम् (sāyam) is written सायं (sāyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of बालकः (bālakaḥ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). कथाम् (kathām) is written कथां (kathāṃ), for the same reason, before शृणोति (śṛṇoti).", "n2": "कथाम् (kathām) is the accusative case of कथा (kathā): what he listens to. शृणोति (śṛṇoti) is the present of श्रु (śru): hears, listens." }
  "sa-3848":
    native: "The fisherman catches a fish in the river."
    bases: { "धीवरो": "fisherman", "नद्यां": "in the river", "मत्स्यं": "fish", "लभते": "to get (catches)" }
    confusables: { "w1": { why: "Farmer, not fisherman: कर्षकः (karṣakaḥ) means farmer." }, "w2": { why: "Frog, not fish: मण्डूकः (maṇḍūkaḥ) means frog." }, "w3": { why: "To seize, not to get: ग्रह् (grah) means to seize." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. धीवरः (dhīvaraḥ) is written धीवरो (dhīvaro) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of नद्यां (nadyāṃ) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). नद्याम् (nadyām) is written नद्यां (nadyāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of मत्स्यं (matsyaṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). मत्स्यम् (matsyam) is written मत्स्यं (matsyaṃ), for the same reason, before लभते (labhate).", "n2": "नद्याम् (nadyām) is the locative case of नदी (nadī): in the river. लभते (labhate) is in the middle voice: he gets the fish for himself." }
  "sa-3849":
    native: "The brave warrior holds a sword."
    bases: { "शूरो": "brave", "खड्गं": "sword", "धरति": "to hold (holds)" }
    confusables: { "w1": { why: "Arrow, not sword: शरः (śaraḥ) means arrow." }, "w2": { why: "Afraid, not brave: भीतः (bhītaḥ) means afraid." }, "w3": { why: "To take, not to hold: हृ (hṛ) means to take." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. शूरः (śūraḥ) is written शूरो (śūro) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of योद्धा (yoddhā) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). खड्गम् (khaḍgam) is written खड्गं (khaḍgaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of धरति (dharati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "शूरः (śūraḥ) is an adjective that agrees with योद्धा (yoddhā), the nominative singular. खड्गम् (khaḍgam) is the accusative case: what he holds." }
