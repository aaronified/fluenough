cards:
  "sa-3270":
    native: "The teacher tells a story and the daughter listens."
    bases: { "कथां": "story", "कथयति": "to tell (tells)", "शृणोति": "to hear (hears)" }
    confusables: { "w1": { why: "To say, not to tell: ब्रू (brū) means to say." }, "w2": { why: "Sentence, not story: वाक्यम् (vākyam) means sentence." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. कथाम् (kathām) is written कथां (kathāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of कथयति (kathayati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "कथयति (kathayati) and कथा (kathā) come from the same root कथ् (kath): to tell, and a story.", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3271":
    native: "The teacher says a sentence and the daughter writes."
    bases: { "अध्यापको": "teacher", "वाक्यं": "sentence", "वदति": "to speak (speaks)", "लिखति": "to write (writes)" }
    confusables: { "w1": { why: "Word, not sentence: पदम् (padam) means word." }, "w2": { why: "To tell, not to speak: कथ् (kath) means to tell." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अध्यापकः (adhyāpakaḥ) is written अध्यापको (adhyāpako) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of वाक्यम् (vākyam) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). वाक्यम् (vākyam) is written वाक्यं (vākyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of वदति (vadati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "लिखति (likhati) has no object here: the daughter writes what the teacher says, and it is understood.", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3272":
    native: "Who asks a question and who knows?"
    bases: { "प्रश्नं": "question", "करोति": "to do (does)", "जानाति": "to know (knows)" }
    confusables: { "w1": { why: "What, not who: किम् (kim) means what." }, "w2": { why: "She, not who: सा (sā) means she." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. प्रश्नम् (praśnam) is written प्रश्नं (praśnaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of करोति (karoti) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "प्रश्नं करोति (praśnaṃ karoti) means to ask a question: the noun and करोति (karoti) make a verb phrase.", "n3": "का (kā) is the feminine form of कः (kaḥ): the second one asked about is a woman.", "n4": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3273":
    native: "Who knows the meaning of the word?"
    bases: { "अर्थं": "meaning", "शब्दस्य": "of the word", "को": "who", "जानाति": "to know (knows)" }
    confusables: { "w1": { why: "Knowledge, not meaning: ज्ञानम् (jñānam) means knowledge." }, "w2": { why: "What, not who: किम् (kim) means what." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अर्थम् (artham) is written अर्थं (arthaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of शब्दस्य (śabdasya) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). कः (kaḥ) is written को (ko) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of जानाति (jānāti) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "शब्दस्य (śabdasya) is the genitive case: it says whose, here the meaning of the word.", "n3": "The object अर्थम् (artham) comes first: in Sanskrit the order of the words is free because the endings show their jobs." }
  "sa-3274":
    native: "In a sentence there are words and in a word there are letters."
    bases: { "वाक्ये": "in a sentence", "पदानि": "words", "भवन्ति": "to be (they are)", "पदे": "in a word", "वर्णा": "letters" }
    confusables: { "w1": { why: "Vowel, not letter: स्वरः (svaraḥ) means vowel." }, "w2": { why: "Script, not letter: लिपिः (lipiḥ) means script." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वर्णाः (varṇāḥ) is written वर्णा (varṇā) because a final आः (āḥ) loses its visarga before a voiced consonant, here the start of भवन्ति (bhavanti) (Whitney 177).", "n2": "वाक्ये (vākye) and पदे (pade) are the locative case: it says where; पदानि (padāni) and वर्णाः (varṇāḥ) are plural, so भवन्ति (bhavanti) is plural." }
  "sa-3275":
    native: "A vowel is a letter and a word is not a sentence."
    bases: { "स्वरो": "vowel", "वर्णो": "letter", "भवति": "to be (is)", "पदं": "word", "वाक्यं": "sentence" }
    confusables: { "w1": { why: "Measure, not vowel: मात्रा (mātrā) means measure." }, "w2": { why: "Story, not sentence: कथा (kathā) means story." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. स्वरः (svaraḥ) is written स्वरो (svaro) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of वर्णः (varṇaḥ) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). वर्णः (varṇaḥ) is written वर्णो (varṇo), for the same reason, before भवति (bhavati). पदम् (padam) is written पदं (padaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of वाक्यम् (vākyam) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). वाक्यम् (vākyam) is written वाक्यं (vākyaṃ), for the same reason, before न (na).", "n2": "भवति (bhavati) joins a noun to a noun like the English is: no other word is needed." }
  "sa-3276":
    native: "Mother reads the script and father writes a word."
    bases: { "लिपिं": "script", "पठति": "to read (reads)", "पदं": "word", "लिखति": "to write (writes)" }
    confusables: { "w1": { why: "Letter, not script: वर्णः (varṇaḥ) means letter." }, "w2": { why: "Reading, not script: वाचनम् (vācanam) means reading." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. लिपिम् (lipim) is written लिपिं (lipiṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पठति (paṭhati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). पदम् (padam) is written पदं (padaṃ), for the same reason, before लिखति (likhati).", "n2": "लिपिम् (lipim) is the accusative of लिपिः (lipiḥ), a feminine word in इ (i): its ending is इम् (im).", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3277":
    native: "The exam is not hard and the learning is easy."
    bases: { "कठिना": "hard", "भवति": "to be (is)", "सरला": "easy" }
    confusables: { "w1": { why: "Example, not examination: उदाहरणम् (udāharaṇam) means example." }, "w2": { why: "Teacher, not learning: अध्यापकः (adhyāpakaḥ) means teacher." } }
    notes: { "n1": "कठिना (kaṭhinā) and सरला (saralā) are the feminine forms of कठिनः (kaṭhinaḥ) and सरलः (saralaḥ), to agree with परीक्षा (parīkṣā) and शिक्षा (śikṣā).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3278":
    native: "Which subject is hard?"
    bases: { "को": "who", "कठिनो": "hard", "भवति": "to be (is)" }
    confusables: { "w1": { why: "What, not who: किम् (kim) means what." }, "w2": { why: "Easy, not hard: सरलः (saralaḥ) means easy." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. कः (kaḥ) is written को (ko) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of विषयः (viṣayaḥ) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). कठिनः (kaṭhinaḥ) is written कठिनो (kaṭhino), for the same reason, before भवति (bhavati).", "n2": "कः (kaḥ) is the question word who or which: here it asks which subject." }
  "sa-3279":
    native: "Through reading the daughter gains knowledge."
    bases: { "वाचनेन": "by reading", "ज्ञानं": "knowledge", "लभते": "to get (gets)" }
    confusables: { "w1": { why: "Grammar, not knowledge: व्याकरणम् (vyākaraṇam) means grammar." }, "w2": { why: "Meaning, not knowledge: अर्थः (arthaḥ) means meaning." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. ज्ञानम् (jñānam) is written ज्ञानं (jñānaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of लभते (labhate) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "वाचनेन (vācanena) is the instrumental case: it says by what means, here reading." }
