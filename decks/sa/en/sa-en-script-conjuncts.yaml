schema: 1
id: "sa-en-script-conjuncts"
kind: "layer"
core: "sa-script-conjuncts"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Classical Sanskrit conjuncts"
description: "Common conjunct letters, written with the virama (्), which removes the vowel from the consonant before it. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "sa-4070":
    native: "kṣa, the conjunct of k and ṣ, said as 'ksh'"
    notes:
      "n1": "Written क्ष (kṣa): क् (k) has no a, and ष (ṣa) follows it."
      "n2": "A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign."
    examples:
      "क्षेत्रं विशालम्।": "The field is vast."
      "क्षमा शुभा।": "Forgiveness is good."
  "sa-4071":
    native: "jña, the conjunct of j and ñ; many modern readers say it 'gya'"
    notes:
      "n1": "Written ज्ञ (jña): classically a j followed by ñ, as in ज्ञानम् (jñānam, knowledge). Many modern readers say it as 'gya'."
      "n2": "A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign."
    examples:
      "ज्ञानं शुभम्।": "Knowledge is good."
      "विज्ञानं विशालम्।": "Science is vast."
  "sa-4072":
    native: "tra, the conjunct of t and r, as the 'tr' of 'tree'"
    notes:
      "n1": "Written त्र (tra): त् (t) then र (ra), as in पुत्रः (putraḥ, son)."
      "n2": "A final अः (aḥ) before a vowel other than अ (a) loses its visarga and the vowels stay apart (Whitney 175 c). A final visarga before a sibilant such as श (ś), ष (ṣ) or स (s) may stay, as here (Whitney 172)."
    examples:
      "पुत्र आगच्छति।": "The son comes."
      "त्रयः सन्ति।": "There are three."
  "sa-4073":
    native: "śra, the conjunct of ś and r"
    notes:
      "n1": "Written श्र (śra): श् (ś) then र (ra), as in श्रेष्ठः (śreṣṭhaḥ, best)."
    examples:
      "श्रेष्ठः सः।": "He is the best."
      "श्रुतिः शुभा।": "Hearing is good."
  "sa-4074":
    native: "dya, the conjunct of d and y"
    notes:
      "n1": "Written द्य (dya): द् (d) then य (ya), as in विद्या (vidyā, learning)."
      "n2": "A final visarga after a vowel other than अ (a) or आ (ā) becomes र् (r) before a voiced consonant or a vowel (Whitney 174)."
    examples:
      "विद्या शुभा।": "Learning is good."
      "द्यौर् विशाला।": "The sky is vast."
  "sa-4075":
    native: "kta, the conjunct of k and t, as in 'duck tape'"
    notes:
      "n1": "Written क्त (kta): क् (k) then त (ta), as in उक्तम् (uktam, said)."
      "n2": "Written apart: Before a vowel the final म् (m) stays and is not joined to the next word: written apart, sandhi not applied (Whitney 213 a)."
    examples:
      "उक्तम् अस्ति।": "It has been said."
      "सः शक्तः।": "He is able."
  "sa-4076":
    native: "kra, the conjunct of k and r"
    notes:
      "n1": "Written क्र (kra): क् (k) then र (ra), as in क्रमः (kramaḥ, order)."
    examples:
      "क्रमः शुभः।": "Order is good."
      "बालः क्रीडति।": "The child plays."
  "sa-4077":
    native: "gra, the conjunct of g and r"
    notes:
      "n1": "Written ग्र (gra): ग् (g) then र (ra), as in ग्रामः (grāmaḥ, village)."
      "n2": "A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign. A final visarga before a sibilant such as श (ś), ष (ṣ) or स (s) may stay, as here (Whitney 172)."
    examples:
      "ग्रामः सुन्दरः।": "The village is beautiful."
      "ग्रन्थं पठ।": "Read the book."
  "sa-4078":
    native: "pra, the conjunct of p and r"
    notes:
      "n1": "Written प्र (pra): प् (p) then र (ra), as in प्रभुः (prabhuḥ, lord)."
      "n2": "A final अः (aḥ) before अ (a) becomes ओ (o) and the अ (a) is shown by the sign ऽ (avagraha) (Whitney 175 a)."
    examples:
      "प्रभू रक्षति।": "The lord protects."
      "प्रश्नो ऽस्ति।": "There is a question."
  "sa-4079":
    native: "sta, the conjunct of s and t, as the 'st' of 'stop'"
    notes:
      "n1": "Written स्त (sta): स् (s) then त (ta), as in स्तोत्रम् (stotram, hymn)."
      "n2": "A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign."
    examples:
      "वस्तु सुन्दरम्।": "The thing is beautiful."
      "स्तोत्रं पठामि।": "I read a hymn."
  "sa-4080":
    native: "stha, the conjunct of s and th"
    notes:
      "n1": "Written स्थ (stha): स् (s) then थ (tha), as in स्थानम् (sthānam, place)."
      "n2": "A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign. A final अः (aḥ) before अ (a) becomes ओ (o) and the अ (a) is shown by the sign ऽ (avagraha) (Whitney 175 a)."
    examples:
      "स्थानं शुभम्।": "The place is auspicious."
      "स्थिरो ऽस्ति।": "He is steady."
  "sa-4081":
    native: "sva, the conjunct of s and v"
    notes:
      "n1": "Written स्व (sva): स् (s) then व (va), as in स्वर्गः (svargaḥ, heaven)."
      "n2": "A final अः (aḥ) before a vowel other than अ (a) loses its visarga and the vowels stay apart (Whitney 175 c). A final visarga before a sibilant such as श (ś), ष (ṣ) or स (s) may stay, as here (Whitney 172)."
    examples:
      "स्वर्गः सुन्दरः।": "Heaven is beautiful."
      "आगच्छति स्वामी।": "The master comes."
  "sa-4082":
    native: "tta, a doubled t"
    notes:
      "n1": "Written त्त (tta): a t doubled, as in उत्तमः (uttamaḥ, excellent)."
      "n2": "सः (saḥ) and एषः (eṣaḥ) are as-words: before a vowel other than अ (a) they lose their visarga and the vowels stay apart (Whitney 175 c). A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign."
    examples:
      "स उत्तमः।": "He is excellent."
      "पत्तनं विशालम्।": "The town is vast."
  "sa-4083":
    native: "ddha, a doubled aspirated d"
    notes:
      "n1": "Written द्ध (ddha): a d doubled and aspirated, as in शुद्धम् (śuddham, pure)."
      "n2": "A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign. A final visarga before a sibilant such as श (ś), ष (ṣ) or स (s) may stay, as here (Whitney 172)."
    examples:
      "बुद्धः शान्तः।": "The Buddha is calm."
      "शुद्धं जलम्।": "The water is pure."
  "sa-4084":
    native: "dhya, the conjunct of dh and y"
    notes:
      "n1": "Written ध्य (dhya): ध् (dh) then य (ya), as in ध्यानम् (dhyānam, meditation)."
      "n2": "A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign. Before a vowel the final म् (m) stays and is not joined to the next word: written apart, sandhi not applied (Whitney 213 a)."
    examples:
      "ध्यानं शुभम्।": "Meditation is good."
      "मध्ये वनम् अस्ति।": "There is a forest in the middle."
  "sa-4085":
    native: "nta, the conjunct of n and t"
    notes:
      "n1": "Written न्त (nta): न् (n) then त (ta), as in अन्तः (antaḥ, end)."
      "n2": "A final अः (aḥ) before a voiced consonant becomes ओ (o) (Whitney 175 a; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato roraplutādaplute), and 6.1.114, हशि च (haśi ca)). The visarga of पुनः (punaḥ), अन्तः (antaḥ) and प्रातः (prātaḥ) comes from an original final र् (r), so it shows as र् (r) before a voiced consonant or a vowel (Whitney 169 a and 174)."
    examples:
      "अन्तर् अस्ति।": "There is an end."
      "सन्तो वदन्ति।": "The good speak."
  "sa-4086":
    native: "nda, the conjunct of n and d"
    notes:
      "n1": "Written न्द (nda): न् (n) then द (da), as in आनन्दः (ānandaḥ, joy)."
      "n2": "A final अः (aḥ) before अ (a) becomes ओ (o) and the अ (a) is shown by the sign ऽ (avagraha) (Whitney 175 a). A final visarga before a sibilant such as श (ś), ष (ṣ) or स (s) may stay, as here (Whitney 172)."
    examples:
      "आनन्दो ऽस्ति।": "There is joy."
      "इन्दुः शीतः।": "The moon is cool."
  "sa-4087":
    native: "mbha, the conjunct of m and bh"
    notes:
      "n1": "Written म्भ (mbha): म् (m) then भ (bha), as in कुम्भः (kumbhaḥ, pot)."
      "n2": "A final अः (aḥ) before अ (a) becomes ओ (o) and the अ (a) is shown by the sign ऽ (avagraha) (Whitney 175 a). A final visarga before a sibilant such as श (ś), ष (ṣ) or स (s) may stay, as here (Whitney 172)."
    examples:
      "कुम्भो ऽस्ति।": "There is a pot."
      "शम्भुः शुभः।": "Śambhu is auspicious."
  "sa-4088":
    native: "ṅga, the conjunct of ṅ and g"
    notes:
      "n1": "Written ङ्ग (ṅga): ङ् (ṅ) then ग (ga), as in रङ्गः (raṅgaḥ, colour)."
    examples:
      "रङ्गः सुन्दरः।": "The colour is beautiful."
      "सङ्गः शुभः।": "Good company."
  "sa-4089":
    native: "ñca, the conjunct of ñ and c"
    notes:
      "n1": "Written ञ्च (ñca): ञ् (ñ) then च (ca), as in पञ्चमः (pañcamaḥ, fifth)."
      "n2": "A final अः (aḥ) before a voiced consonant becomes ओ (o) (Whitney 175 a; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato roraplutādaplute), and 6.1.114, हशि च (haśi ca)). A final अः (aḥ) before अ (a) becomes ओ (o) and the अ (a) is shown by the sign ऽ (avagraha) (Whitney 175 a)."
    examples:
      "पञ्चमो ऽस्ति।": "It is the fifth."
      "मञ्चो विशालः।": "The platform is large."
  "sa-4090":
    native: "ṣṭa, the conjunct of ṣ and ṭa"
    notes:
      "n1": "Written ष्ट (ṣṭa): ष् (ṣ) then ट (ṭa), as in इष्टम् (iṣṭam, desired)."
      "n2": "Written apart: Before a vowel the final म् (m) stays and is not joined to the next word: written apart, sandhi not applied (Whitney 213 a)."
    examples:
      "इष्टम् अस्ति।": "It is desired."
      "कष्टम् अस्ति।": "There is hardship."
  "sa-4091":
    native: "ṣṭha, the conjunct of ṣ and ṭha"
    notes:
      "n1": "Written ष्ठ (ṣṭha): ष् (ṣ) then ठ (ṭha), as in ज्येष्ठः (jyeṣṭhaḥ, eldest)."
      "n2": "A final अः (aḥ) before a vowel other than अ (a) loses its visarga and the vowels stay apart (Whitney 175 c)."
    examples:
      "प्रतिष्ठा शुभा।": "Establishment is good."
      "ज्येष्ठ आगच्छति।": "The eldest comes."
  "sa-4092":
    native: "rya, the conjunct of r and y, with the r written above"
    notes:
      "n1": "Written र्य (rya): the r is a small mark above the y that follows, as in आर्यः (āryaḥ, noble)."
      "n2": "A final अः (aḥ) before a voiced consonant becomes ओ (o) (Whitney 175 a; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato roraplutādaplute), and 6.1.114, हशि च (haśi ca))."
    examples:
      "आर्यो गच्छति।": "The noble one goes."
      "सूर्यो दीप्तः।": "The sun is shining."
  "sa-4093":
    native: "nya, the conjunct of n and y, as the 'ny' of 'canyon'"
    notes:
      "n1": "Written न्य (nya): न् (n) then य (ya), as in अन्यः (anyaḥ, other)."
      "n2": "A final अः (aḥ) before a voiced consonant becomes ओ (o) (Whitney 175 a; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato roraplutādaplute), and 6.1.114, हशि च (haśi ca)). A final अः (aḥ) before अ (a) becomes ओ (o) and the अ (a) is shown by the sign ऽ (avagraha) (Whitney 175 a)."
    examples:
      "अन्यो गच्छति।": "The other goes."
      "धन्यो ऽस्ति।": "He is blessed."
