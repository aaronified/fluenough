native: { code: "en", iso639_3: "eng", name: "English" }
name: "Reading the Aṣṭādhyāyī 2: the sandhi sūtras of 6.1 and 8.2 to 8.4"
description: "Thirty-six sūtras of Pāṇini read in the text: the vowel sandhi rules of 6.1 (yaṇ, ayavāyāv, guṇa, vṛddhi, savarṇadīrgha, pararūpa, the visarga before a), and the consonant rules of 8.2 to 8.4 (final consonants, visarga, anusvāra, ṇatva, ścutva, ṣṭutva, jaśtva, cartva). Each row gives the sūtra, its split into words, what is carried in from earlier rules, and an example from the course. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
pattern:
  name: "Sūtras read in the text"
  slot_name: "part"
  slots:
    "sutra": "the sūtra, as the page and the text give it"
    "padaccheda": "the sūtra split into its words (padaccheda)"
    "anuvrtti": "the words carried in from earlier sūtras (anuvṛtti)"
    "example": "an example the rule governs"
  entries:
    "6-1-72": "the heading for the rules that follow: they apply in saṃhitā, when sounds meet in close succession"
    "6-1-77": "an ik vowel (i, u, ṛ, ḷ) is replaced by the matching semivowel (y, v, r, l) before a vowel"
    "6-1-78": "e, o, ai and au are replaced by ay, av, āy and āv before a vowel"
    "6-1-79": "o and au are replaced by av and āv before a suffix that starts with y"
    "6-1-84": "one single sound takes the place of the sound before and the sound after, in the rules that follow"
    "6-1-85": "the single substitute counts as the end of the first part and as the beginning of the second part"
    "6-1-87": "a or ā followed by a vowel is replaced, together with that vowel, by the guṇa vowel"
    "6-1-88": "a or ā followed by e, o, ai or au is replaced, together with it, by the vṛddhi vowel"
    "6-1-89": "a or ā before eti, edhati or ūṭh is replaced by the vṛddhi vowel, with no guṇa"
    "6-1-91": "a or ā at the end of an upasarga (prefix) before a root starting with ṛ is replaced by the vṛddhi vowel ār"
    "6-1-94": "a or ā at the end of an upasarga before a root starting with e or o is replaced by the following sound alone"
    "6-1-97": "a short a that is not at the end of a pada, followed by a vowel of guṇa grade (a, e, o), is replaced, together with it, by the following sound alone"
    "6-1-101": "a vowel of the group ak (a, i, u, ṛ, ḷ) followed by a similar vowel is replaced, with it, by one long vowel"
    "6-1-102": "an ak vowel of a stem, followed by the vowel of a first- or second-case ending, is replaced, together with it, by the long vowel like the first"
    "6-1-107": "a vowel of the group ak is replaced by the first sound before the ending am"
    "6-1-109": "e or o at the end of a pada, followed by a short a, is replaced, together with it, by the e or o alone, and the avagraha marks the a"
    "6-1-113": "the ru that stands for a final s, after short a and before a short a, becomes u"
    "6-1-114": "the ru that stands for a final s, after short a and before a voiced consonant, becomes u"
    "6-1-132": "the nominative -s of etad and tad is dropped before a consonant"
    "8-2-1": "the heading for the three last chapters: a later rule counts as not yet applied when an earlier rule operates"
    "8-2-23": "the last consonant of a word ending in a cluster is dropped"
    "8-2-30": "a palatal (c-class) consonant is replaced by the velar (k-class) consonant at the end of a pada or before a jhal consonant"
    "8-2-39": "a jhal consonant at the end of a pada is replaced by the jaś consonant of its class (g, j, ḍ, d, b)"
    "8-2-66": "a final s of a word becomes ru, an r that later becomes visarga or stays r"
    "8-3-15": "ru at the end of a word becomes visarga before a khar consonant (a voiceless consonant) or at a pause"
    "8-3-17": "after bho, bhago, agho and a or ā, ru becomes y before a vowel or a voiced consonant (the y is then dropped by 8.3.19)"
    "8-3-23": "a final m becomes the anusvāra before a consonant"
    "8-3-24": "n and m inside a word, before a jhal consonant, become the anusvāra"
    "8-3-34": "a visarga before a khar consonant becomes s (with the ś, ṣ, s rules of 8.4.40 and 8.4.41)"
    "8-3-59": "s in a suffix or in a substitute becomes ṣ after an iṇ sound (any vowel but a or ā, or h, y, v, r, l) or after a k-class consonant"
    "8-4-1": "n after r or ṣ in the same word becomes ṇ"
    "8-4-40": "s or a t-class sound next to ś or a c-class sound becomes ś or a c-class sound"
    "8-4-41": "s or a t-class sound next to ṣ or a ṭ-class sound becomes ṣ or a ṭ-class sound"
    "8-4-53": "a jhal consonant before a jhaś consonant (a voiced stop) becomes the jaś consonant of its class"
    "8-4-55": "a jhal consonant before a khar consonant (a voiceless consonant) becomes the car consonant of its class (voiceless unaspirated)"
    "8-4-58": "an anusvāra before a yay consonant (a semivowel, nasal or stop) is replaced by the nasal of the class of that consonant"
  notes: "Sūtra numbers are those of the page, in the form chapter.pāda.sūtra. Each row is one sūtra of Pāṇini. The words of each sūtra are glossed below with the case (vibhakti) and number the padaccheda gives, and the words carried in from earlier rules are named. Case and number: nom. is the first case, acc. the second, instr. the third, dat. the fourth, abl. the fifth, gen. the sixth, loc. the seventh; sg., du., pl. are singular, dual, plural. 6.1.72, saṃhitāyām. Words: saṃhitāyām (loc. sg.): in saṃhitā, in close contact of sounds. Anuvṛtti: hrasvasya, tuk from 6.1.71. Adhikāra in force: saṃhitāyām (6.1.72). 6.1.77, iko yaṇaci. Words: ikaḥ (gen. sg.): of the group ik (i, u, ṛ, ḷ with their long forms); yaṇ (nom. sg.): the group yaṇ (y, v, r, l); aci (loc. sg.): before a vowel. Anuvṛtti: none stated. Adhikāra in force: saṃhitāyām (6.1.72). Example: ityādi, 'and so on' (iti + ādi): i becomes y before the vowel ā. 6.1.78, eco'yavāyāvaḥ. Words: ecaḥ (gen. sg.): of e, o, ai, au; ay-av-āy-āvaḥ (nom. pl.): ay, av, āy, āv. Anuvṛtti: aci from 6.1.77. Adhikāra in force: saṃhitāyām (6.1.72). Example: nayana, 'leading' (ne + ana): the e becomes ay before the vowel a. 6.1.79, vānto yi pratyaye. Words: vāntaḥ (nom. sg.): ending in v, that is the vowels o and au (as av, āv); yi (loc. sg.): before y; pratyaye (loc. sg.): in a suffix. Anuvṛtti: aci from 6.1.77; ecaḥ from 6.1.78. Adhikāra in force: saṃhitāyām (6.1.72). Example: gavya, 'of the cow' (go + ya): the o becomes av before the suffix ya. 6.1.84, ekaḥ pūrvaparayoḥ. Words: ekaḥ (nom. sg.): a single one; pūrvaparayoḥ (gen. du.): of the preceding and of the following. Anuvṛtti: aci from 6.1.77. Adhikāra in force: saṃhitāyām (6.1.72), ekaḥ pūrvaparayoḥ (6.1.84). 6.1.85, antādivacca. Words: anta-ādivat (indeclinable): like the end and like the beginning; ca (indeclinable): and. Anuvṛtti: aci from 6.1.77. Adhikāra in force: saṃhitāyām (6.1.72), ekaḥ pūrvaparayoḥ (6.1.84). 6.1.87, ādguṇaḥ. Words: āt (abl. sg.): from a (a or ā); guṇaḥ (nom. sg.): guṇa, the name of the first grade of strengthening. Anuvṛtti: aci from 6.1.77. Adhikāra in force: saṃhitāyām (6.1.72), ekaḥ pūrvaparayoḥ (6.1.84). Example: maheśvara (mahā + īśvara): ā and ī together become e. 6.1.88, vṛddhireci. Words: vṛddhiḥ (nom. sg.): vṛddhi, the name of the second grade of strengthening; eci (loc. sg.): before e, o, ai, au. Anuvṛtti: āt from 6.1.87. Adhikāra in force: saṃhitāyām (6.1.72), ekaḥ pūrvaparayoḥ (6.1.84). Example: sadaiva (sadā + eva): ā and e together become ai. 6.1.89, etyedhatyūṭhsu. Words: eti-edhati-ūṭhsu (loc. pl.): before eti, edhati and ūṭh. Anuvṛtti: āt from 6.1.87; eci, vṛddhiḥ from 6.1.88. Adhikāra in force: saṃhitāyām (6.1.72), ekaḥ pūrvaparayoḥ (6.1.84). Example: upaiti (upa + eti): a and e together become ai. 6.1.91, upasargādṛti dhātau. Words: upasargāt (abl. sg.): after an upasarga (prefix); ṛti (loc. sg.): before ṛ; dhātau (loc. sg.): in a root. Anuvṛtti: āt from 6.1.87; vṛddhiḥ from 6.1.88. Adhikāra in force: saṃhitāyām (6.1.72), ekaḥ pūrvaparayoḥ (6.1.84). Example: upārcchati (upa + ṛcchati): a and ṛ together become ār. 6.1.94, eṅi pararūpam. Words: eṅi (loc. sg.): before e or o; pararūpam (nom. sg.): the form of the following sound. Anuvṛtti: āt from 6.1.87; upasargāt, dhātau from 6.1.91. Adhikāra in force: saṃhitāyām (6.1.72), ekaḥ pūrvaparayoḥ (6.1.84). Example: prejate (pra + ejate): a and e together become e. 6.1.97, ato guṇe. Words: ataḥ (abl. sg.): after a (short a); guṇe (loc. sg.): before a guṇa vowel. Anuvṛtti: aci from 6.1.77; pararūpam from 6.1.94; apadāntāt from 6.1.96. Adhikāra in force: saṃhitāyām (6.1.72), ekaḥ pūrvaparayoḥ (6.1.84). Example: pacanti (paca + anti): a and a together become a. 6.1.101, akaḥ savarṇe dīrghaḥ. Words: akaḥ (abl. sg.): after a vowel of the group ak (a, i, u, ṛ, ḷ); savarṇe (loc. sg.): before a similar vowel; dīrghaḥ (nom. sg.): long. Anuvṛtti: aci from 6.1.77. Adhikāra in force: saṃhitāyām (6.1.72), ekaḥ pūrvaparayoḥ (6.1.84). Example: munīndra (muni + indra): i and i together become ī. 6.1.102, prathamayoḥ pūrvasavarṇaḥ. Words: prathamayoḥ (gen. du.): for the first and the second case endings; pūrvasavarṇaḥ (nom. sg.): the similar vowel of the first sound. Anuvṛtti: aci from 6.1.77; dīrghaḥ, akaḥ from 6.1.101. Adhikāra in force: saṃhitāyām (6.1.72), ekaḥ pūrvaparayoḥ (6.1.84). Example: agnī, 'two fires' (agni + au): i and au together become ī, as the long vowel like the first. 6.1.107, ami pūrvaḥ. Words: ami (loc. sg.): before the ending am; pūrvaḥ (nom. sg.): before. Anuvṛtti: aci from 6.1.77; akaḥ from 6.1.101. Adhikāra in force: saṃhitāyām (6.1.72), ekaḥ pūrvaparayoḥ (6.1.84). Example: rāmam (rāma + am): a and a together become a, the first sound, and the m remains. 6.1.109, eṅaḥ padāntādati. Words: eṅaḥ (abl. sg.): after e or o; padāntāt (abl. sg.): at the end of a pada; ati (loc. sg.): before a. Anuvṛtti: pūrvaḥ from 6.1.107. Adhikāra in force: saṃhitāyām (6.1.72), ekaḥ pūrvaparayoḥ (6.1.84). Example: ko 'pi, 'anyone' (ko + api): the a of api is not said, and the avagraha marks it. 6.1.113, ato roraplutādaplute. Words: ataḥ (abl. sg.): after a (short a); roḥ (gen. sg.): of ru (the r-sound that becomes a visarga); aplutāt (abl. sg.): after a vowel that is not pluta (not prolonged); aplute (loc. sg.): before a vowel that is not pluta. Anuvṛtti: ati from 6.1.109; ut from 6.1.111. Adhikāra in force: saṃhitāyām (6.1.72). Example: devo 'pi (devaḥ + api): the visarga, as ru, becomes u, and a + u give o. 6.1.114, haśi ca. Words: haśi (loc. sg.): before a haś consonant (a voiced consonant); ca (indeclinable): and. Anuvṛtti: ut from 6.1.111; ataḥ, roḥ, aplutāt from 6.1.113. Adhikāra in force: saṃhitāyām (6.1.72). Example: devo gacchati (devaḥ + gacchati): the visarga becomes u before g, and a + u give o. 6.1.132, etattadoḥ sulopo'koranañsamāse hali. Words: etat-tadoḥ (gen. du.): of etad and tad; sulopaḥ (nom. sg.): the loss of su (the nominative singular -s); akoḥ (gen. du.): of the forms with ka; a-nañsamāse (loc. sg.): not in a negative compound; hali (loc. sg.): before a consonant. Anuvṛtti: none stated. Adhikāra in force: saṃhitāyām (6.1.72). Example: sa gacchati, 'he goes' (saḥ + gacchati): the su of sa is dropped before the consonant g. 8.2.1, pūrvatrāsiddham. Words: pūrvatra (indeclinable): in the preceding; asiddham (nom. sg.): as not having taken effect. Anuvṛtti: none stated. Adhikāra in force: padasya (8.1.16), pūrvatrāsiddham (8.2.1). 8.2.23, saṃyogāntasya lopaḥ. Words: saṃyogāntasya (gen. sg.): of what ends in a consonant cluster; lopaḥ (nom. sg.): lopa, elision. Anuvṛtti: none stated. Adhikāra in force: padasya (8.1.16), pūrvatrāsiddham (8.2.1). Example: abharan, 'they carried' (abharant): the final t of the cluster nt is dropped. 8.2.30, coḥ kuḥ. Words: coḥ (gen. sg.): of c and j; kuḥ (nom. sg.): the k-class (velars). Anuvṛtti: jhali from 8.2.26; ante from 8.2.29. Adhikāra in force: padasya (8.1.16), pūrvatrāsiddham (8.2.1). Example: vāk, 'speech' (vāc): the final c becomes k. 8.2.39, jhalāṃ jaśo'nte. Words: jhalām (gen. pl.): of the jhal consonants (stops and sibilants); jaśaḥ (nom. pl.): the jaś consonants (g, j, ḍ, d, b); ante (loc. sg.): at the end. Anuvṛtti: none stated. Adhikāra in force: padasya (8.1.16), pūrvatrāsiddham (8.2.1). Example: vāg atra, 'speech here' (vāk + atra): k, a jhal, is voiced to g before the vowel. 8.2.66, sasajuṣo ruḥ. Words: sasajuṣoḥ (gen. du.): of a word ending in s, and of sajuṣ; ruḥ (nom. sg.): ru, an r-sound. Anuvṛtti: none stated. Adhikāra in force: padasya (8.1.16), pūrvatrāsiddham (8.2.1). Example: agnir atra, 'the fire here' (agniḥ + atra): the s of agnis becomes ru, and ru becomes r before the vowel a. 8.3.15, kharavasānayorvisarjanīyaḥ. Words: khar-avasānayoḥ (loc. du.): before khar (a voiceless consonant) and at a pause; visarjanīyaḥ (nom. sg.): the visarga. Anuvṛtti: raḥ from 8.3.14. Adhikāra in force: padasya (8.1.16), pūrvatrāsiddham (8.2.1), saṃhitāyām (8.2.108). Example: hariḥ, 'Hari' (haris): at the pause, ru is the visarga. 8.3.17, bhobhagoaghoapūrvasya yo'śi. Words: bho-bhago-agho-apūrvasya (gen. sg.): after bho, bhago, agho and a vowel a or ā; yaḥ (nom. sg.): y; aśi (loc. sg.): before an aś sound (a vowel or a voiced consonant). Anuvṛtti: roḥ from 8.3.16. Adhikāra in force: padasya (8.1.16), pūrvatrāsiddham (8.2.1), saṃhitāyām (8.2.108). Example: devā iha (devāḥ + iha): the ru of āḥ becomes y and then drops, so no visarga stands. 8.3.23, mo'nusvāraḥ. Words: maḥ (gen. sg.): m; anusvāraḥ (nom. sg.): the anusvāra. Anuvṛtti: hali from 8.3.22. Adhikāra in force: padasya (8.1.16), pūrvatrāsiddham (8.2.1), saṃhitāyām (8.2.108). Example: gṛhaṃ gacchati (gṛham + gacchati): the m becomes the anusvāra before g. 8.3.24, naścāpadāntasya jhali. Words: naḥ (gen. sg.): of n; ca (indeclinable): and; apadāntasya (gen. sg.): not at the end of a pada; jhali (loc. sg.): before a jhal consonant. Anuvṛtti: maḥ, anusvāraḥ from 8.3.23. Adhikāra in force: padasya (8.1.16), pūrvatrāsiddham (8.2.1), saṃhitāyām (8.2.108). Example: yaśāṃsi, 'glories': the n of the augment num, before s, becomes the anusvāra. 8.3.34, visarjanīyasya saḥ. Words: visarjanīyasya (gen. sg.): of the visarga; saḥ (nom. sg.): s. Anuvṛtti: khar from 8.3.15. Adhikāra in force: padasya (8.1.16), pūrvatrāsiddham (8.2.1), saṃhitāyām (8.2.108). Example: namaste, 'greetings to you' (namaḥ + te): the visarga becomes s before t. 8.3.59, ādeśapratyayayoḥ. Words: ādeśa-pratyayayoḥ (gen. du.): in a substitute and in a suffix. Anuvṛtti: saḥ from 8.3.56; numvisarjanīyaśarvyavāye, api from 8.3.58. Adhikāra in force: pūrvatrāsiddham (8.2.1), saṃhitāyām (8.2.108), apadāntasya mūrdhanyaḥ (8.3.55), iṇkoḥ (8.3.57). Example: rāmeṣu, 'among the Rāmas': the suffix su becomes ṣu after e. 8.4.1, raṣābhyāṃ no ṇaḥ samānapade. Words: raṣābhyām (abl. du.): after r and ṣ; naḥ (gen. sg.): of n; ṇaḥ (nom. sg.): ṇ; samānapade (loc. sg.): in the same pada. Anuvṛtti: none stated. Adhikāra in force: pūrvatrāsiddham (8.2.1), saṃhitāyām (8.2.108). Example: rāmeṇa, 'by Rāma': the n of the ending ina becomes ṇ after r, which stands in the same word. 8.4.40, stoḥ ścunā ścuḥ. Words: stoḥ (gen. sg.): of s and of the t-class (dentals); ścunā (instr. sg.): with the ś-sounds and c-class (palatals); ścuḥ (nom. sg.): a ś-sound or a c-class sound. Anuvṛtti: none stated. Adhikāra in force: pūrvatrāsiddham (8.2.1), saṃhitāyām (8.2.108). Example: saccit (sat + cit): the t before c becomes c. 8.4.41, ṣṭunā ṣṭuḥ. Words: ṣṭunā (instr. sg.): with ṣ and the ṭ-class (retroflexes); ṣṭuḥ (nom. sg.): a ṣ-sound or a ṭ-class sound. Anuvṛtti: stoḥ from 8.4.40. Adhikāra in force: pūrvatrāsiddham (8.2.1), saṃhitāyām (8.2.108). Example: peṣṭā, 'the grinder' (piṣ + tā): the t after ṣ becomes ṭ. 8.4.53, jhalāṃ jaś jhaśi. Words: jhalām (gen. pl.): of the jhal consonants (stops and sibilants); jaś (nom. sg.): a jaś consonant; jhaśi (loc. sg.): before a jhaś consonant (a voiced stop). Anuvṛtti: none stated. Adhikāra in force: pūrvatrāsiddham (8.2.1), saṃhitāyām (8.2.108). Example: labdhaḥ, 'obtained' (labh + ta): the bh becomes b before the voiced dh. 8.4.55, khari ca. Words: khari (loc. sg.): before a khar consonant (a voiceless consonant); ca (indeclinable): and. Anuvṛtti: jhalām from 8.4.53; car from 8.4.54. Adhikāra in force: pūrvatrāsiddham (8.2.1), saṃhitāyām (8.2.108). Example: bhuktam, 'eaten' (bhuj + ta): the j becomes g and then k before the voiceless t. 8.4.58, anusvārasya yayi parasavarṇaḥ. Words: anusvārasya (gen. sg.): of the anusvāra; yayi (loc. sg.): before a yay consonant (a semivowel, nasal or stop); parasavarṇaḥ (nom. sg.): the similar sound of the following one. Anuvṛtti: none stated. Adhikāra in force: pūrvatrāsiddham (8.2.1), saṃhitāyām (8.2.108). Example: śāntaḥ, 'calm' (śāṃta): the anusvāra before the dental t becomes the dental nasal n."
