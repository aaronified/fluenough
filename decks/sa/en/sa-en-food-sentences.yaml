cards:
  "sa-3200":
    native: "Mother cooks milk rice and father eats."
    bases: { "पायसं": "milk rice", "पचति": "to cook (cooks)", "खादति": "to eat (eats)" }
    confusables: { "w1": { why: "Milk, not milk rice: क्षीरम् (kṣīram) means milk." }, "w2": { why: "To read aloud, not to cook: पठ् (paṭh) means to read aloud." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पायसम् (pāyasam) is written पायसं (pāyasaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पचति (pacati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "पायसम् (pāyasam) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system.", "n3": "The object पायसम् (pāyasam) is not repeated in the second half: the eater is understood to eat it.", "n4": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3201":
    native: "I drink milk and you drink buttermilk."
    bases: { "अहं": "I", "क्षीरं": "milk", "पिबामि": "to drink (I drink)", "त्वं": "you", "तक्रं": "buttermilk", "पिबसि": "to drink (you drink)" }
    confusables: { "w1": { why: "Curd, not milk: दधि (dadhi) means curd." }, "w2": { why: "Butter, not buttermilk: नवनीतम् (navanītam) means butter." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अहम् (aham) is written अहं (ahaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of क्षीरम् (kṣīram) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). क्षीरम् (kṣīram) is written क्षीरं (kṣīraṃ), for the same reason, before पिबामि (pibāmi). The labial keeps म् (m) in Whitney 213 a, but the anusvāra sign is the usual writing (Whitney 213 i). त्वम् (tvam) is written त्वं (tvaṃ), for the same reason, before च (ca). तक्रम् (takram) is written तक्रं (takraṃ), for the same reason, before पिबसि (pibasi).", "n2": "क्षीरम् (kṣīram) is plain milk and तक्रम् (takram) is buttermilk: two different drinks.", "n3": "The endings of पिबामि (pibāmi) and पिबसि (pibasi) already say I and you, so अहम् (aham) and त्वम् (tvam) are only there to set the two halves against each other.", "n4": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3202":
    native: "Curd is cold and molasses is sweet."
    bases: { "शीतं": "cold", "भवति": "to be (is)", "गुडो": "molasses", "मधुरो": "sweet" }
    confusables: { "w1": { why: "Honey, not curd: मधु (madhu) means honey." }, "w2": { why: "Sugar, not molasses: शर्करा (śarkarā) means sugar." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. शीतम् (śītam) is written शीतं (śītaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of भवति (bhavati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). गुडः (guḍaḥ) is written गुडो (guḍo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of मधुरः (madhuraḥ) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). मधुरः (madhuraḥ) is written मधुरो (madhuro), for the same reason, before भवति (bhavati).", "n2": "शीतम् (śītam) is the neuter form of शीतः (śītaḥ), to agree with दधि (dadhi), a neuter word." }
  "sa-3203":
    native: "He eats fish and she does not eat meat."
    bases: { "स": "he", "मत्स्यं": "fish", "खादति": "to eat (eats)", "मांसं": "meat" }
    confusables: { "w1": { why: "Vegetable, not meat: शाकः (śākaḥ) means vegetable." }, "w2": { why: "Cooked rice, not fish: ओदनः (odanaḥ) means cooked rice." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सः (saḥ) is written स (sa) because सः (saḥ) and एषः (eṣaḥ) lose their visarga before any consonant, here the start of मत्स्यम् (matsyam) (Whitney 176 a; Aṣṭādhyāyī 6.1.132). मत्स्यम् (matsyam) is written मत्स्यं (matsyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of खादति (khādati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). मांसम् (māṃsam) is written मांसं (māṃsaṃ), for the same reason, before न (na).", "n2": "न (na) stands right before the verb it denies: न (na) खादति (khādati) means does not eat.", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3204":
    native: "Who drinks the water and who drinks the milk?"
    bases: { "उदकं": "water", "पिबति": "to drink (drinks)", "क्षीरं": "milk" }
    confusables: { "w1": { why: "What, not who: किम् (kim) means what." }, "w2": { why: "To eat, not to drink: खाद् (khād) means to eat." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. उदकम् (udakam) is written उदकं (udakaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of कः (kaḥ) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). क्षीरम् (kṣīram) is written क्षीरं (kṣīraṃ), for the same reason, before पिबति (pibati). The labial keeps म् (m) in Whitney 213 a, but the anusvāra sign is the usual writing (Whitney 213 i).", "n2": "उदकम् (udakam) is another word for water, like जलम् (jalam), which the first words taught.", "n3": "का (kā) is the feminine form of कः (kaḥ): the one asked about is a woman.", "n4": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3205":
    native: "Father buys a mango and mother buys a pomegranate."
    bases: { "आम्रं": "mango", "क्रीणाति": "to buy (buys)", "दाडिमं": "pomegranate" }
    confusables: { "w1": { why: "Cooked rice, not mango: ओदनः (odanaḥ) means cooked rice." }, "w2": { why: "Bulb, not pomegranate: कन्दः (kandaḥ) means bulb." }, "w3": { why: "To give, not to buy: दा (dā) means to give." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. आम्रम् (āmram) is written आम्रं (āmraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पिता (pitā) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). दाडिमम् (dāḍimam) is written दाडिमं (dāḍimaṃ), for the same reason, before क्रीणाति (krīṇāti).", "n2": "The object आम्रम् (āmram) comes first: in Sanskrit the order of the words is free because the endings show their jobs.", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3206":
    native: "We eat sesame and molasses."
    bases: { "वयं": "we", "तिलं": "sesame", "गुडं": "molasses", "खादामः": "to eat (we eat)" }
    confusables: { "w1": { why: "Sugar, not molasses: शर्करा (śarkarā) means sugar." }, "w2": { why: "To drink, not to eat: पा (pā) means to drink." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वयम् (vayam) is written वयं (vayaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of तिलम् (tilam) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). तिलम् (tilam) is written तिलं (tilaṃ), for the same reason, before गुडम् (guḍam). गुडम् (guḍam) is written गुडं (guḍaṃ), for the same reason, before च (ca).", "n2": "When two things are listed with च (ca), it comes after the last of them, and both share the one verb खादामः (khādāmaḥ).", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3207":
    native: "Salt is not sweet and sugar is sweet."
    bases: { "लवणं": "salt", "मधुरं": "sweet", "भवति": "to be (is)", "मधुरा": "sweet" }
    confusables: { "w1": { why: "Honey, not sugar: मधु (madhu) means honey." }, "w2": { why: "Peppercorn, not salt: मरिचम् (maricam) means peppercorn." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. लवणम् (lavaṇam) is written लवणं (lavaṇaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of मधुरम् (madhuram) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). मधुरम् (madhuram) is written मधुरं (madhuraṃ), for the same reason, before न (na).", "n2": "मधुरम् (madhuram) is the neuter form of मधुरः (madhuraḥ), to agree with लवणम् (lavaṇam); मधुरा (madhurā) is the feminine, to agree with शर्करा (śarkarā)." }
  "sa-3208":
    native: "Today we cook vegetables and eat curd."
    bases: { "वयं": "we", "शाकं": "vegetable", "पचामो": "to cook (we cook)", "खादामः": "to eat (we eat)" }
    confusables: { "w1": { why: "Butter, not curd: नवनीतम् (navanītam) means butter." }, "w2": { why: "To drink, not to eat: पा (pā) means to drink." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वयम् (vayam) is written वयं (vayaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of शाकम् (śākam) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). शाकम् (śākam) is written शाकं (śākaṃ), for the same reason, before पचामः (pacāmaḥ). The labial keeps म् (m) in Whitney 213 a, but the anusvāra sign is the usual writing (Whitney 213 i). पचामः (pacāmaḥ) is written पचामो (pacāmo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of दधि (dadhi) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "अद्य (adya) means today and often stands at the start of the sentence.", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3209":
    native: "Where is the butter and where is the honey?"
    bases: { "नवनीतं": "butter", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Buttermilk, not butter: तक्रम् (takram) means buttermilk." }, "w2": { why: "Molasses, not honey: गुडः (guḍaḥ) means molasses." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. नवनीतम् (navanītam) is written नवनीतं (navanītaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of भवति (bhavati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "कुत्र (kutra) is said twice, once for each half of the question.", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
