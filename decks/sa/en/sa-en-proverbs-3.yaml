native: { code: "en", iso639_3: "eng", name: "English" }
name: "Proverbs: subhāṣita 3"
description: "Twenty Sanskrit verses of advice on effort, wealth, time and fate, from texts in the public domain, each with its English meaning, what it is said of and the meaning of each word. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sa-8141":
    native: "Length of life, work, wealth, learning and death: these five are fixed for a person while he is still in the womb."
    notes:
      "literal": "Said about fate: five things are settled before birth."
    bases:
      "आयुः": { meaning: "length of life" }
      "कर्म": { meaning: "action, work" }
      "च": { meaning: "and" }
      "वित्तं": { meaning: "wealth" }
      "विद्या": { meaning: "knowledge" }
      "निधनम्": { meaning: "death" }
      "एव": { meaning: "indeed" }
      "पञ्चैतानि": { meaning: "five + these" }
      "हि": { meaning: "indeed, for" }
      "सृज्यंते": { meaning: "to be fixed, created (are fixed)" }
      "गर्भस्थस्यैव": { meaning: "in the womb + only (of one still in the womb)" }
      "देहिनः": { meaning: "embodied being, person" }
  "sa-8142":
    native: "There is nothing that is not achieved by wealth; so a wise person should work at earning wealth alone."
    notes:
      "literal": "Said to praise earning wealth by effort."
    bases:
      "नहि": { meaning: "not + indeed" }
      "तद्विद्यते": { meaning: "that + to be found (that is found)" }
      "किञ्चिद्यदर्थेन": { meaning: "any + a particle + which + wealth (by)" }
      "न": { meaning: "not" }
      "सिध्यति": { meaning: "to succeed (is achieved)" }
      "यत्नेन": { meaning: "effort (by effort)" }
      "मतिमांस्तस्मादर्थमेकं": { meaning: "wise + therefore + wealth + one" }
      "प्रसाधयेत्": { meaning: "to accomplish (one should achieve)" }
  "sa-8143":
    native: "He who has wealth has friends, he who has wealth has kinsmen; he who has wealth is a man in the world, he who has wealth is a scholar."
    notes:
      "literal": "Said bitterly: the world honours the rich."
    bases:
      "यस्यार्थास्तस्य": { meaning: "whose + wealth + his" }
      "मित्राणि": { meaning: "friend" }
      "बान्धवाः": { meaning: "relative" }
      "यस्यार्थाः": { meaning: "whose + wealth" }
      "स": { meaning: "he" }
      "पुमान्लोके": { meaning: "man + world (a man in the world)" }
      "च": { meaning: "and" }
      "पण्डितः": { meaning: "scholar" }
  "sa-8144":
    native: "There is no learning, no gift, no craft, no art and no steadiness in the rich that beggars do not sing of."
    notes:
      "literal": "Said of how flatterers praise the rich for every virtue."
    bases:
      "न": { meaning: "not" }
      "सा": { meaning: "that, she" }
      "विद्या": { meaning: "knowledge" }
      "तद्दानं": { meaning: "that + gift" }
      "तच्छिल्पं": { meaning: "that + craft" }
      "कला": { meaning: "a part, a digit of the moon" }
      "तत्": { meaning: "that" }
      "स्थैर्यं": { meaning: "steadiness" }
      "हि": { meaning: "indeed, for" }
      "धनिनां": { meaning: "rich (of the rich)" }
      "याचकैर्यन्न": { meaning: "beggar + which + not" }
      "गीयते": { meaning: "to sing (is sung)" }
  "sa-8145":
    native: "In this world even a stranger acts like kin to the rich, and even a kinsman always acts like an enemy to the poor."
    notes:
      "literal": "Said about how wealth changes the way people treat you."
    bases:
      "इह": { meaning: "here, in this world" }
      "लोके": { meaning: "world (in the world)" }
      "हि": { meaning: "indeed, for" }
      "धनिनां": { meaning: "rich (of the rich)" }
      "परोऽपि": { meaning: "stranger + even" }
      "स्वजनायते": { meaning: "to act like kin (acts like kin)" }
      "स्वजनोऽपि": { meaning: "kinsman + even" }
      "दरिद्राणां": { meaning: "poor (of the poor)" }
      "सर्वदा": { meaning: "always" }
      "दुर्जनायते": { meaning: "to act like a wicked person (acts like an enemy)" }
  "sa-8146":
    native: "What is not to be does not happen, and what is to be happens even without effort; to the one whose fate does not allow it, even what is in his hand is lost."
    notes:
      "literal": "Said of fate, which no effort can change."
    bases:
      "नहि": { meaning: "not + indeed" }
      "भवति": { meaning: "to be (it is)" }
      "यन्": { meaning: "whose" }
      "न": { meaning: "not" }
      "भाव्यं": { meaning: "what is to be" }
      "च": { meaning: "and" }
      "विनापि": { meaning: "without + even" }
      "यत्नेन": { meaning: "effort (by effort)" }
      "करतल": { meaning: "palm of the hand" }
      "गतम्": { meaning: "gone, in hand" }
      "अपि": { meaning: "even" }
      "नश्यति": { meaning: "to be lost (is lost)" }
      "यस्य": { meaning: "whose" }
      "हि": { meaning: "indeed, for" }
      "भवितव्यता": { meaning: "fate, what must be" }
      "नास्ति": { meaning: "not + to be (there is not)" }
  "sa-8147":
    native: "One should enjoy slowly, little by little, the wealth one has earned oneself, as the wise take a medicine, never carelessly."
    notes:
      "literal": "Said to teach careful spending."
    bases:
      "शनैः": { meaning: "slowly" }
      "शनैश्च": { meaning: "slowly + and" }
      "भोक्तव्यं": { meaning: "to be enjoyed" }
      "स्वयं": { meaning: "oneself" }
      "वित्तम्": { meaning: "wealth" }
      "उपार्जितम्": { meaning: "earned" }
      "रसायनम्": { meaning: "elixir, medicine" }
      "इव": { meaning: "like" }
      "प्राज्ञैर्": { meaning: "wise (by the wise)" }
      "हेलया": { meaning: "carelessness (by carelessness)" }
      "न": { meaning: "not" }
      "कदाचन": { meaning: "ever, at any time" }
  "sa-8148":
    native: "Good conduct, purity, patience, courtesy, sweetness of speech and noble birth: none of them shines in a man without wealth."
    notes:
      "literal": "Said of how poverty hides every good quality."
    bases:
      "शीलं": { meaning: "good conduct" }
      "शौचं": { meaning: "purity" }
      "क्षांतिर्": { meaning: "patience" }
      "दाक्षिण्यं": { meaning: "courtesy" }
      "मधुरता": { meaning: "sweetness" }
      "कुले": { meaning: "family (in a family)" }
      "जन्म": { meaning: "birth" }
      "न": { meaning: "not" }
      "विराजंति": { meaning: "to shine (they shine)" }
      "हि": { meaning: "indeed, for" }
      "सर्वे": { meaning: "all" }
      "वित्त": { meaning: "wealth" }
      "विहीनस्य": { meaning: "without (of one without)" }
      "पुरुषस्य": { meaning: "man (of a man)" }
  "sa-8149":
    native: "Pride, arrogance, knowledge, flair and good sense all perish together when a man loses his wealth."
    notes:
      "literal": "Said that a man's confidence goes with his money."
    bases:
      "मानो": { meaning: "pride" }
      "वा": { meaning: "or" }
      "दर्पो": { meaning: "arrogance" }
      "विज्ञानं": { meaning: "knowledge, skill" }
      "विभ्रमः": { meaning: "flair" }
      "सुबुद्धिर्": { meaning: "good sense" }
      "सर्वं": { meaning: "all" }
      "प्रणश्यति": { meaning: "to perish (it perishes)" }
      "समं": { meaning: "together, equal" }
      "वित्त": { meaning: "wealth" }
      "विहीनो": { meaning: "without" }
      "यदा": { meaning: "when" }
      "पुरुषः": { meaning: "man" }
  "sa-8150":
    native: "Earn wealth, descendant of Kakutstha, for this world has wealth as its root; I see no difference between a poor man and a dead one."
    notes:
      "literal": "Said to urge earning money, and to say how little a poor man is valued."
    bases:
      "धनं": { meaning: "wealth" }
      "अर्जय": { meaning: "to earn (earn!)" }
      "काकुत्स्थ": { meaning: "descendant of Kakutstha" }
      "धनमूलं": { meaning: "wealth + root" }
      "इदं": { meaning: "this" }
      "जगत्": { meaning: "moving, the moving world" }
      "अन्तरं": { meaning: "difference" }
      "नाभिजानामि": { meaning: "not + to know (I do not know, I see no)" }
      "निर्धनस्य": { meaning: "poor man (of a poor man)" }
      "मृतस्य": { meaning: "dead (of a dead man)" }
      "च": { meaning: "and" }
  "sa-8151":
    native: "Wealth has three ways to go: giving, enjoying and loss; for him who neither gives nor enjoys, the third way is the one."
    notes:
      "literal": "Said to urge giving and enjoying wealth, or it will be lost."
    bases:
      "दानं": { meaning: "giving" }
      "भोगो": { meaning: "enjoyment" }
      "नाशस्तिस्रो": { meaning: "loss + three" }
      "गतयो": { meaning: "way" }
      "भवन्ति": { meaning: "to be (they are)" }
      "वित्तस्य": { meaning: "wealth (of wealth)" }
      "यो": { meaning: "who" }
      "न": { meaning: "not" }
      "ददाति": { meaning: "to give (it gives)" }
      "भुङ्क्ते": { meaning: "to enjoy (he enjoys)" }
      "तस्य": { meaning: "of that one" }
      "तृतीया": { meaning: "third" }
      "गतिर्भवति": { meaning: "way + to be (the way is)" }
  "sa-8152":
    native: "Laziness is the great enemy that sits in a person's own body; there is no friend like effort, for one who works does not sink."
    notes:
      "literal": "Said to praise effort and blame laziness."
    bases:
      "आलस्यं": { meaning: "laziness" }
      "हि": { meaning: "indeed, for" }
      "मनुष्याणां": { meaning: "person (of people)" }
      "शरीरस्थो": { meaning: "body + dwelling (dwelling in the body)" }
      "महान्रिपुः": { meaning: "great + enemy" }
      "नास्त्युद्यमसमो": { meaning: "not + to be + effort + like" }
      "बन्धुः": { meaning: "friend, kinsman" }
      "कुर्वाणो": { meaning: "to do (doing)" }
      "नावसीदति": { meaning: "not + to sink (does not sink)" }
  "sa-8153":
    native: "A tree, though cut, grows again; the moon, though worn away, grows full again; thinking so, the good are not troubled by their misfortunes."
    notes:
      "literal": "Said to teach that good times return, so one should not despair."
    bases:
      "छिन्नोऽपि": { meaning: "cut + even" }
      "रोहति": { meaning: "to grow (it grows)" }
      "तरुः": { meaning: "tree" }
      "क्षीणोऽप्युपचीयते": { meaning: "worn away + even + to grow (is worn away yet grows)" }
      "पुनश्चन्द्रः": { meaning: "again + moon" }
      "इति": { meaning: "thus" }
      "विमृशन्तः": { meaning: "to think over (thinking over)" }
      "सन्तः": { meaning: "good person" }
      "सन्तप्यन्ते": { meaning: "to be troubled (are troubled)" }
      "न": { meaning: "not" }
      "दुःखेषु": { meaning: "sorrow (in sorrows)" }
  "sa-8154":
    native: "The fruit of action depends on past deeds and the mind follows what has been done; even so a wise person should act only after thinking well."
    notes:
      "literal": "Said that fate matters, but wise people still weigh each act."
    bases:
      "कर्मायत्तं": { meaning: "action + dependent on" }
      "फलं": { meaning: "fruit" }
      "पुंसां": { meaning: "man, person (of people)" }
      "बुद्धिः": { meaning: "mind" }
      "कर्मानुसारिणी": { meaning: "action + following" }
      "तथापि": { meaning: "even so" }
      "सुधिया": { meaning: "wise person (by a wise person)" }
      "भाव्यं": { meaning: "what is to be" }
      "सुविचार्यैव": { meaning: "having thought well + only" }
      "कुर्वता": { meaning: "to do (by one doing)" }
  "sa-8155":
    native: "The way of a person of pride is twofold, like a bunch of flowers: either on the head of all the world, or withering in the forest."
    notes:
      "literal": "Said that the self-respecting either reach the top or live apart."
    bases:
      "कुसुमस्तवकस्येव": { meaning: "flower + bunch + like (like a bunch of flowers)" }
      "द्वयी": { meaning: "twofold" }
      "वृत्तिर्मनस्विनः": { meaning: "way + proud person (the way of the proud)" }
      "मूर्ध्नि": { meaning: "head (on the head)" }
      "वा": { meaning: "or" }
      "सर्वलोकस्य": { meaning: "all + world (of all the world)" }
      "शीर्यते": { meaning: "to wither (it withers)" }
      "वन": { meaning: "forest" }
      "एव": { meaning: "indeed" }
  "sa-8156":
    native: "Even a young lion springs at elephants whose cheeks are stained with rut; this is the nature of the brave, for age is not the cause of their fire."
    notes:
      "literal": "Said that courage does not depend on age or size."
    bases:
      "सिंहः": { meaning: "lion" }
      "शिशुरपि": { meaning: "young + even" }
      "निपतति": { meaning: "to spring down (it springs on)" }
      "मदमलिनकपोलभित्तिषु": { meaning: "rut + stained + cheek + wall (on those with cheeks stained with rut)" }
      "गजेषु": { meaning: "elephant (at elephants)" }
      "प्रकृतिरियं": { meaning: "nature + this" }
      "सत्त्ववतां": { meaning: "person of strength (of the brave)" }
      "न": { meaning: "not" }
      "खलु": { meaning: "indeed" }
      "वयस्तेजसो": { meaning: "age + fire, splendour (of age, of splendour)" }
      "हेतुः": { meaning: "cause" }
  "sa-8157":
    native: "The face of the earth is overrun by one hero alone, as the sun alone floods it with its blazing light."
    notes:
      "literal": "Said that one brave person can do what a crowd cannot."
    bases:
      "एकेनापि": { meaning: "one + even (even by one)" }
      "हि": { meaning: "indeed, for" }
      "शूरेण": { meaning: "hero (by a hero)" }
      "पादाक्रान्तं": { meaning: "foot + overrun (overrun underfoot)" }
      "महीतलं": { meaning: "surface of the earth" }
      "क्रियते": { meaning: "to make (it is made)" }
      "भास्करेणैव": { meaning: "sun + only (by the sun alone)" }
      "स्फारस्फुरिततेजसा": { meaning: "broad + flashing + splendour (with blazing light)" }
  "sa-8158":
    native: "Sacrifice, study, giving, austerity, truth, steadiness, forgiveness and freedom from greed: this is the eightfold path of right action."
    notes:
      "literal": "Said to list the eight parts of dharma."
    bases:
      "इज्याध्ययन": { meaning: "sacrifice + study" }
      "दानानि": { meaning: "giving" }
      "तपः": { meaning: "austerity" }
      "सत्यं": { meaning: "the true (truth)" }
      "धृतिः": { meaning: "steadiness" }
      "क्षमा": { meaning: "forgiveness" }
      "अलोभ": { meaning: "freedom from greed" }
      "इति": { meaning: "thus" }
      "मार्गो": { meaning: "way" }
      "यं": { meaning: "which" }
      "धर्मस्याष्ट": { meaning: "dharma + eight (of dharma, eight)" }
      "विधः": { meaning: "kind, fold" }
      "स्मृतः": { meaning: "remembered, held to be" }
  "sa-8159":
    native: "Day by day the mind of the wise, worn by the care of keeping a family, fades like the beauty of winter struck by the spring wind."
    notes:
      "literal": "Said that the care of a family wears away even a wise person's mind."
    bases:
      "प्रतिदिवसं": { meaning: "day by day" }
      "याति": { meaning: "to go, to reach (one reaches)" }
      "लयं": { meaning: "fading" }
      "वसंत": { meaning: "spring" }
      "वाताहतेव": { meaning: "wind + struck + like" }
      "शिशिर": { meaning: "winter" }
      "श्रीः": { meaning: "beauty, glory" }
      "बुद्धिर्": { meaning: "mind, intelligence" }
      "बुद्धिमताम्": { meaning: "intelligent person (of the intelligent)" }
      "अपि": { meaning: "even" }
      "कुटुंब": { meaning: "family" }
      "भर": { meaning: "burden, upkeep" }
      "चिंतया": { meaning: "care (by care)" }
      "सततम्": { meaning: "always" }
  "sa-8164":
    native: "The man who has wealth is thought of good family, a scholar, learned, a judge of virtues, a fine speaker and good to look at; all virtues rest on gold."
    notes:
      "literal": "Said bitterly of how the world credits the rich with every virtue."
    bases:
      "यस्यास्ति": { meaning: "whose + is" }
      "वित्तं": { meaning: "wealth" }
      "स": { meaning: "he" }
      "नरः": { meaning: "man" }
      "कुलीनः": { meaning: "of good family" }
      "पण्डितः": { meaning: "scholar" }
      "श्रुतवान्गुणज्ञः": { meaning: "learned + knower of qualities" }
      "एव": { meaning: "indeed" }
      "वक्ता": { meaning: "speaker" }
      "च": { meaning: "and" }
      "दर्शनीयः": { meaning: "worth seeing" }
      "सर्वे": { meaning: "all" }
      "गुणाः": { meaning: "quality" }
      "काञ्चनं": { meaning: "gold" }
      "आश्रयन्ति": { meaning: "to resort to (they resort to)" }
