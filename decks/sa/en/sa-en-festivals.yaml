  "sa-5918":
    native: "Music."
    notes:
      "n1": "Music accompanies festivals and worship; compare वाद्य (vādya), instrument."
      "n2": "Neuter a-stem noun: its full set of case forms is in the a-stems table of the grammar rules."
      "n3": "A neuter noun has one form for the nominative and the accusative singular, सङ्गीतम् (saṅgītam): in उत्सवे (utsave) सङ्गीतं (saṅgītaṃ) भवति (bhavati) it is the subject, in सङ्गीतं (saṅgītaṃ) जनो (jano) गायति (gāyati) the object."
      "n4": "The final म् (m) of सङ्गीतम् (saṅgītam) is written ं (ṃ) before a consonant, as in सङ्गीतं (saṅgītaṃ) जनो (jano) गायति (gāyati)."
      "n5": "The final ः (ḥ) of जनः (janaḥ) becomes ो (o) before a voiced sound, as in सङ्गीतं (saṅgītaṃ) जनो (jano) गायति (gāyati)."
    bases:
      "सङ्गीतम्": "music"
    examples:
      "उत्सवे सङ्गीतं भवति":
        native: "There is music at the festival."
        bases:
