cards:
  "sa-5909":
    native: "Musical instrument, a thing played at a festival."
    notes:
      "n1": "Instruments accompany the processions and the worship of a festival."
      "n2": "Neuter a-stem noun: its full set of case forms is in the a-stems table of the grammar rules."
      "n3": "The final म् (m) of वाद्यम् (vādyam) is written ं (ṃ) before a consonant, as in उत्सवे (utsave) वाद्यं (vādyaṃ) भवति (bhavati)."
