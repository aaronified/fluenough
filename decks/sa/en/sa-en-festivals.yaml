  "sa-5914":
    native: "Image of a deity, a form for worship."
    notes:
      "n1": "A deity is worshipped through its image, the मूर्ति (mūrti)."
      "n2": "Feminine i-stem noun: its full set of case forms is in the other-stems table of the grammar rules."
      "n3": "The final ः (ḥ) of मूर्तिः (mūrtiḥ) becomes िर् (ir) before a voiced sound, as in मूर्तिर् (mūrtir) मन्दिरे (mandire) तिष्ठति (tiṣṭhati)."
      "n4": "The final ः (ḥ) of जनः (janaḥ) becomes ो (o) before a voiced sound, as in जनो (jano) मूर्तिं (mūrtiṃ) नमति (namati)."
      "n5": "The final म् (m) of मूर्तिम् (mūrtim) is written ं (ṃ) before a consonant, as in जनो (jano) मूर्तिं (mūrtiṃ) नमति (namati)."
    bases:
      "मूर्तिः": "image"
    examples:
      "मूर्तिर् मन्दिरे तिष्ठति":
        native: "The image stands in the temple."
        bases:
          "मूर्तिर्": "image"
          "मन्दिरे": "in the temple"
          "तिष्ठति": "stays, stands"
      "जनो मूर्तिं नमति":
        native: "A person bows to the image."
