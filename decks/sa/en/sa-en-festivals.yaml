  "sa-5911":
    native: "Conch, a shell blown at worship."
    notes:
      "n1": "A conch is blown at the start of worship and at festivals."
      "n2": "Masculine a-stem noun: its full set of case forms is in the a-stems table of the grammar rules."
      "n3": "The final ः (ḥ) of शङ्खः (śaṅkhaḥ) becomes ो (o) before a voiced sound, as in उत्सवे (utsave) शङ्खो (śaṅkho) भवति (bhavati)."
      "n4": "The final ः (ḥ) of शङ्खः (śaṅkhaḥ) becomes स् (s) before त (t), as in शङ्खस् (śaṅkhas) तत्र (tatra) तिष्ठति (tiṣṭhati)."
    bases:
      "शङ्खः": "conch"
    examples:
      "उत्सवे शङ्खो भवति":
        native: "There is a conch at the festival."
        bases:
          "उत्सवे": "at the festival"
          "शङ्खो": "conch"
          "भवति": "is, becomes"
      "शङ्खस् तत्र तिष्ठति":
        native: "The conch stays there."
        bases:
          "शङ्खस्": "conch"
          "तत्र": "there"
          "तिष्ठति": "stays, stands"
