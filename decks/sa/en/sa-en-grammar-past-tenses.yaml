rules:
  "sa-rule-imperfect-active":
    name: "Imperfect, active: augment a- and the secondary endings"
    explanation: "The imperfect is the past tense Pāṇini calls laṅ: sūtra 3.2.111 says {1}, laṅ for a past that is not today's. It is made from the present stem with the augment, a short a put in front of it (Whitney 585, 586), and with the secondary endings, which are not the endings of the present: the stem of {2} (to be) is {3} and the form is {2}, not {4}. The endings are -t, -tām, -an in the third person (Whitney 880 calls -an the usual ending of the third plural), -ḥ, -tam, -ta in the second and -am, -va, -ma in the first, and a final a of the stem is joined to them or lengthened before -va and -ma: {5}, {6}, {7} for the verb to go, and {8}, {9}, {10}. Some verbs take -uḥ in the third plural: {11} from the verb to give (Pāṇini 3.4.108, read on GRETIL, says jher jus: jus in place of jhi). A root with the vowel at the front has the augment join it into the heavier vṛddhi vowel: the verb to be {12} gives {13}, and the third plural {14} (Whitney 585; Pāṇini 6.4.71 and 6.4.72, read on GRETIL, teach the augment: luṅ-laṅ-lṛṅ-kṣv aḍ-udāttaḥ and āḍ aj-ādīnām). Verbs that take both voices have the active forms here and the middle forms in the next rule; the verbs of the course that take only the middle voice have no active cells."
  "sa-rule-imperfect-middle":
    name: "Imperfect, middle: augment a- and the middle secondary endings"
    explanation: "The imperfect of the middle (ātmanepada) voice uses the same augment and present stem with the middle secondary endings: -ta, -ātām, -anta in the third person, -thāḥ, -āthām, -dhvam in the second, and -e, -vahi, -mahi in the first. The verb to get {1} has the present stem {2} and the imperfect {3}, {4}, {5}; the second person is {6}, {7}, {8} and the first is {9}, {10}, {11}. A root that begins with the vowel ī has the augment join it into ai: {12} (he looks) gives {13} (Whitney 585). The verbs that take both voices put the middle forms beside the active ones, as {14} beside {15} for the verb to say, and {16} beside {17} for the verb to put. The list of all eighteen endings is Pāṇini 3.4.78 (GRETIL: tip-tas-jhi-sip-thas-tha-mib-vas-mas-ta-ātāṃ-jha-thās-āthām-dhvam-iḍ-vahi-mahiṅ, the eighteen endings). Which voice a verb takes is learned with the verb, as in the unit on the middle voice."
