name: "The imperfect: past tense with the augment"
description: "The imperfect (laṅ), the past tense with the augment a, for the verbs of the course in the active and the middle voice. All verbs are covered except vṛt, whose Wiktionary page has no imperfect table (the gap is in docs/review-queue/sa.md). Not yet checked by a Sanskrit speaker: please report any mistake."
