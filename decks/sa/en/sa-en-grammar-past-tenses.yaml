name: "Past tenses: the imperfect, the perfect and the aorist"
description: "The three past tenses of Classical Sanskrit, the imperfect, the perfect and the aorist, for the verbs of the course in the active and the middle voice, with the augment, the doubled root and the types of the aorist. Not yet checked by a Sanskrit speaker: please report any mistake."
