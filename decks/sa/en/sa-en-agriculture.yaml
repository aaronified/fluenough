cards:
  "sa-5600":
    native: "Crop, standing grain."
    notes:
      "n1": "Neuter a-stem noun: its full set of case forms is in the a-stems table of the grammar rules."
      "n2": "The dictionary stem is सस्य (sasya); the card shows the isolated nominative singular सस्यम् (sasyam)."
      "n3": "Before a consonant the final म् (m) of सस्यम् (sasyam) is written ं (ṃ), as in सस्यं (sasyaṃ); Aṣṭādhyāyī 8.3.23, the rule of the anusvāra, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213."
      "n4": "Standing crop or grain on the field; the same word also means a plant in general."
    bases:
      "सस्यम्": "crop, standing grain"
    examples:
      "अस्ति सस्यं क्षेत्रे":
        native: "There is a crop in the field."
        bases:
          "अस्ति": "is"
          "सस्यं": "crop, standing grain"
          "क्षेत्रे": "field (locative)"
      "अस्ति सस्यं शुष्कम्":
        native: "The crop is dry."
        bases:
          "अस्ति": "is"
          "सस्यं": "crop, standing grain"
          "शुष्कम्": "dry"
