cards:
  "sa-3990":
    native: "The poet speaks a profound saying."
    bases: { "कविर्": "poet", "गम्भीरं": "profound", "सुभाषितं": "saying", "वदति": "to speak (speaks)" }
    confusables: { "w1": { why: "Great sage, not poet: महर्षिः (maharṣiḥ) means great sage." }, "w2": { why: "Hymn of praise, not saying: सूक्तम् (sūktam) means hymn of praise." }, "w3": { why: "Noble, not profound: उदारः (udāraḥ) means noble." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. कविः (kaviḥ) is written कविर् (kavir) because a final ः (ḥ) after इ (i) becomes र् (r) before a voiced sound, here the start of गम्भीरं (gambhīraṃ) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174). गम्भीरम् (gambhīram) is written गम्भीरं (gambhīraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of सुभाषितं (subhāṣitaṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). सुभाषितम् (subhāṣitam) is written सुभाषितं (subhāṣitaṃ), for the same reason, before वदति (vadati).", "n2": "गम्भीरम् (gambhīram) is the neuter form of गम्भीरः (gambhīraḥ), to agree with सुभाषितम् (subhāṣitam), the accusative: what he speaks." }
  "sa-3991":
    native: "Sarasvati gives knowledge to the devotee."
    bases: { "भक्ताय": "to the devotee", "विद्यां": "knowledge", "ददाति": "to give (gives)" }
    confusables: { "w1": { why: "Fair woman, not Sarasvati: गौरी (gaurī) means fair woman." }, "w2": { why: "Wisdom, not knowledge: प्रज्ञा (prajñā) means wisdom." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. विद्याम् (vidyām) is written विद्यां (vidyāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of ददाति (dadāti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "भक्ताय (bhaktāya) is the dative case of भक्तः (bhaktaḥ): to the devotee. विद्याम् (vidyām) is the accusative case of विद्या (vidyā): what she gives." }
  "sa-3992":
    native: "A commentary gives an explanation of the text."
    bases: { "ग्रन्थस्य": "of the text", "व्याख्यां": "explanation", "ददाति": "to give (gives)" }
    confusables: { "w1": { why: "Translation, not commentary: अनुवादः (anuvādaḥ) means translation." }, "w2": { why: "Sight or view, not explanation: निदर्शनम् (nidarśanam) means sight or view." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. व्याख्याम् (vyākhyām) is written व्याख्यां (vyākhyāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of ददाति (dadāti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "ग्रन्थस्य (granthasya) is the genitive case of ग्रन्थः (granthaḥ): of the text. व्याख्याम् (vyākhyām) is the accusative case of व्याख्या (vyākhyā): what the commentary gives." }
  "sa-3993":
    native: "The ascetic always murmurs the Gayatri."
    bases: { "यतिर्": "ascetic", "नित्यं": "always", "गायत्रीं": "Gayatri", "जपति": "to murmur (murmurs)" }
    confusables: { "w1": { why: "Mendicant, not ascetic: भिक्षुः (bhikṣuḥ) means mendicant." }, "w2": { why: "Earth, not Gayatri: जगती (jagatī) means earth." }, "w3": { why: "To sing, not to murmur: गै (gai) means to sing." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. यतिः (yatiḥ) is written यतिर् (yatir) because a final ः (ḥ) after इ (i) becomes र् (r) before a voiced sound, here the start of नित्यं (nityaṃ) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174). नित्यम् (nityam) is written नित्यं (nityaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of गायत्रीं (gāyatrīṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). गायत्रीम् (gāyatrīm) is written गायत्रीं (gāyatrīṃ), for the same reason, before जपति (japati).", "n2": "गायत्रीम् (gāyatrīm) is the accusative case of गायत्री (gāyatrī): what he murmurs. जपति (japati) is the present of जप् (jap): murmurs a prayer." }
  "sa-3994":
    native: "A girl's face shines with a smile."
    bases: { "कन्याया": "of the girl", "वदनं": "face", "हासेन": "with a smile", "शोभति": "to shine (shines)" }
    confusables: { "w1": { why: "Cheek, not face: कपोलः (kapolaḥ) means cheek." }, "w2": { why: "Lip, not face: अधरः (adharaḥ) means lip." }, "w3": { why: "Joy, not smile: प्रमोदः (pramodaḥ) means joy." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. कन्यायाः (kanyāyāḥ) is written कन्याया (kanyāyā) because a final आः (āḥ) loses its visarga before a voiced consonant, here the start of वदनं (vadanaṃ) (Whitney 177; Aṣṭādhyāyī 8.3.17, भोभगोअघोअपूर्वस्य योऽशि (bhobhago 'ghoapūrvasya yo 'śi), in separate words भो भगो अघो अपूर्वस्य यः अशि (bho bhago agho apūrvasya yaḥ aśi), with 8.3.19, लोपः शाकल्यस्य (lopaḥ śākalyasya)). वदनम् (vadanam) is written वदनं (vadanaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of हासेन (hāsena) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "कन्यायाः (kanyāyāḥ) is the genitive case of कन्या (kanyā): of the girl. हासेन (hāsena) is the instrumental case of हासः (hāsaḥ): with laughter, here a smile. शोभति (śobhati) is the present of शुभ् (śubh): shines, is beautiful." }
  "sa-3995":
    native: "In the rainy season the peacock cries out."
    bases: { "वर्षायां": "in the rainy season", "मयूरो": "peacock", "केकां": "cry", "करोति": "to do (makes)" }
    confusables: { "w1": { why: "Swan, not peacock: हंसः (haṃsaḥ) means swan." }, "w2": { why: "Cuckoo, not cry: कोकिलः (kokilaḥ) means cuckoo." }, "w3": { why: "Summer, not rainy season: ग्रीष्मः (grīṣmaḥ) means summer." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वर्षायाम् (varṣāyām) is written वर्षायां (varṣāyāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of मयूरो (mayūro) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). मयूरः (mayūraḥ) is written मयूरो (mayūro) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of केकां (kekāṃ) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). केकाम् (kekām) is written केकां (kekāṃ), for the same reason, before करोति (karoti).", "n2": "वर्षायाम् (varṣāyām) is the locative case of वर्षा (varṣā): in the rainy season. केकाम् करोति (kekām karoti) means makes the peacock's cry, that is, cries out." }
  "sa-3996":
    native: "The tiger lives in a cave in the forest."
    bases: { "शार्दूलो": "tiger", "वने": "in the forest", "गुहायां": "in a cave", "वसति": "to dwell (lives)" }
    confusables: { "w1": { why: "Lion, not tiger: सिंहः (siṃhaḥ) means lion." }, "w2": { why: "Desert, not cave: मरुः (maruḥ) means desert." }, "w3": { why: "To stand, not to live: स्था (sthā) means to stand." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. शार्दूलः (śārdūlaḥ) is written शार्दूलो (śārdūlo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of वने (vane) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). गुहायाम् (guhāyām) is written गुहायां (guhāyāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of वसति (vasati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "वने (vane) is the locative case of वनम् (vanam): in the forest. गुहायाम् (guhāyām) is the locative case of गुहा (guhā): in a cave." }
  "sa-3997":
    native: "Kailasa is the dwelling of Gauri."
    bases: { "कैलासो": "Kailasa", "गौर्या": "of Gauri", "निवासो": "dwelling", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Mountain, not Kailasa: अद्रिः (adriḥ) means mountain." }, "w2": { why: "Sarasvatī, not Gauri: सरस्वती (sarasvatī) means sarasvatī." }, "w3": { why: "House, not dwelling: गृहम् (gṛham) means house." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. कैलासः (kailāsaḥ) is written कैलासो (kailāso) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of गौर्या (gauryā) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). गौर्याः (gauryāḥ) is written गौर्या (gauryā) because a final आः (āḥ) loses its visarga before a voiced consonant, here the start of निवासो (nivāso) (Whitney 177; Aṣṭādhyāyī 8.3.17, भोभगोअघोअपूर्वस्य योऽशि (bhobhago 'ghoapūrvasya yo 'śi), in separate words भो भगो अघो अपूर्वस्य यः अशि (bho bhago agho apūrvasya yaḥ aśi), with 8.3.19, लोपः शाकल्यस्य (lopaḥ śākalyasya)). निवासः (nivāsaḥ) is written निवासो (nivāso), for the same reason, before भवति (bhavati).", "n2": "गौर्याः (gauryāḥ) is the genitive case of गौरी (gaurī): of Gauri. निवासः (nivāsaḥ) says what Kailasa is: a dwelling." }
  "sa-3998":
    native: "With grief tears come into the eyes."
    bases: { "शोकेन": "with grief", "नयने": "in the eye", "बाष्पो": "tears", "भवति": "to be (come)" }
    confusables: { "w1": { why: "Face, not eye: मुखम् (mukham) means face." }, "w2": { why: "Cry of a peacock, not tear: केका (kekā) means cry of a peacock." }, "w3": { why: "Weeping, not tear: रोदनम् (rodanam) means weeping." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. बाष्पः (bāṣpaḥ) is written बाष्पो (bāṣpo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of भवति (bhavati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "शोकेन (śokena) is the instrumental case of शोकः (śokaḥ): with grief. नयने (nayane) is the locative case of नयनम् (nayanam): in the eye." }
  "sa-3999":
    native: "A white pearl is found in the sea."
    bases: { "शुक्ला": "white", "सागरे": "in the sea", "भवति": "to be (is found)" }
    confusables: { "w1": { why: "Jewel, not pearl: रत्नम् (ratnam) means jewel." }, "w2": { why: "Red, not white: रक्तः (raktaḥ) means red." } }
    notes: { "n1": "शुक्ला (śuklā) is the feminine form of शुक्लः (śuklaḥ), to agree with मुक्ता (muktā). सागरे (sāgare) is the locative case of सागरः (sāgaraḥ): in the sea." }
