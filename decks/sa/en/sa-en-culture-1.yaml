tags: ["unreviewed"]
description: "Short lines from the Bhagavad Gītā, the Upaniṣads, the Brahma and Yoga Sūtras and the Manusmṛti, texts in the public domain, each with its date as an English Wikipedia article gives it, where its words come from and a note on how its words join. Not yet checked by a Sanskrit speaker: please report any mistake."

cards:
  "sa-8000":
    native: "Your right is to the action alone, never to its fruits; do not let the fruit of action be your motive, and do not cling to inaction."
    notes:
      "n1": "Verse 47 of the second chapter, the chapter the Wikisource page calls Sāṅkhyayoga. The English Wikipedia says the Bhagavad Gītā is a Hindu scripture, likely composed in the second or first century BCE, that forms part of the epic Mahābhārata, and that it is traditionally attributed to the sage Vyāsa."
      "n2": "Several words are written together. कर्मणि (karmaṇi) and एव (eva) join as कर्मण्येव (karmaṇyeva), because i turns into y before a vowel, and अधिकारः (adhikāraḥ) and ते (te) join as अधिकारस्ते (adhikāraste), because the visarga becomes s before t. The ending of ते (te) here means \"your\". The two prohibitions use मा (mā) with a verb form: मा भूः (mā bhūḥ) is \"do not be\"."
    bases:
      "कर्मण्येवाधिकारस्ते": "action (in action) + only + right, claim + your"
      "मा": "not (forbidding)"
      "फलेषु": "fruit (in the fruits)"
      "कदाचन": "ever, at any time"
      "कर्मफलहेतुर्भूर्मा": "cause of the fruit of action + be (do be) + not"
      "ते": "your"
      "सङ्गोऽस्त्वकर्मणि": "attachment + let it be + in non-action"
  "sa-8001":
    native: "Whenever the law of right wavers, descendant of Bharata, and wrong rises up, then I send myself forth."
    notes:
      "n1": "Verse 7 of the fourth chapter, which the Wikisource page calls Jñānakarmasaṃnyāsayoga. The English Wikipedia describes the Gītā as a synthesis of strands of Indian religious thought, among them the Vedic concept of dharma (duty, rightful action), a word this verse uses."
      "n2": "Final sounds change at the word edges: ग्लानिः (glāniḥ) and भवति (bhavati) join as ग्लानिर्भवति (glānirbhavati), since a visarga after i becomes r before a voiced sound, and अभ्युत्थानम् (abhyutthānam) and अधर्मस्य (adharmasya) join as अभ्युत्थानमधर्मस्य (abhyutthānamadharmasya). The word अधर्म (adharma) is धर्म (dharma) with the negative prefix अ (a)."
    bases:
      "यदा": "when"
      "हि": "indeed, for"
      "धर्मस्य": "dharma, law, right way (of dharma)"
      "ग्लानिर्भवति": "decline, wilting + to be, become (there is)"
      "भारत": "descendant of Bharata (a form of address)"
      "अभ्युत्थानमधर्मस्य": "rising up + wrong, lawlessness (of adharma)"
      "तदात्मानं": "then + self (myself)"
      "सृजाम्यहम्": "to send forth, create (I send forth) + I"
  "sa-8002":
    native: "Let one lift oneself by oneself and not let oneself sink; the self alone is the friend of the self, and the self alone is its enemy."
    notes:
      "n1": "Verse 5 of the sixth chapter, which the Wikisource page calls Ātmasaṃyamayoga. The English Wikipedia says the Gītā is part of the epic Mahābhārata and, while traditionally attributed to the sage Vyāsa, is regarded as a composite work."
      "n2": "The whole verse plays on one word, आत्मन् (ātman, self), in four forms: आत्मना (ātmanā, by oneself), आत्मानम् (ātmānam, oneself, object), आत्मनः (ātmanaḥ, of the self) and आत्मा (ātmā, the self, subject). Where आत्मा (ātmā) meets एव (eva), the vowels join: आत्मैव (ātmaiva), because ā and e make ai."
    bases:
      "उद्धरेदात्मनात्मानं": "to lift up (one should lift up) + self (by the self) + self (the self)"
      "नात्मानमवसादयेत्": "not + self + to make sink, lower (one should lower)"
      "आत्मैव": "self + only, alone"
      "ह्यात्मनो": "indeed + self (of the self)"
      "बन्धुरात्मैव": "friend, kinsman + self + only"
      "रिपुरात्मनः": "enemy + self (of the self)"
  "sa-8003":
    native: "Give up all rules of conduct and come to me alone for refuge; I will free you from all wrongs, so do not grieve."
    notes:
      "n1": "Verse 66 of the eighteenth chapter, the last chapter, which the Wikisource page calls Mokṣasaṃnyāsayoga. The English Wikipedia says the Gītā forms part of the epic Mahābhārata and is a central text in the Vedānta and Vaiṣṇava traditions."
      "n2": "सर्वधर्मान्परित्यज्य (sarvadharmānparityajya) is one written word made of सर्वधर्मान् (sarvadharmān, all duties, object) and परित्यज्य (parityajya). The ending -ya marks an absolutive, a form that says \"having given up\" for a verb that has a prefix (here परि (pari)). The verb मोक्षयिष्यामि (mokṣayiṣyāmi) is a future, \"I will free\"."
    bases:
      "सर्वधर्मान्परित्यज्य": "all duties, all dharmas + to abandon (having abandoned)"
      "मामेकं": "me + one, alone"
      "शरणं": "refuge"
      "व्रज": "to go (go!)"
      "अहं": "I"
      "त्वां": "you (object)"
      "सर्वपापेभ्यो": "all wrongs, all sins (from all sins)"
      "मोक्षयिष्यामि": "to set free (I will set free)"
      "मा": "not (forbidding)"
      "शुचः": "to grieve (do grieve)"
  "sa-8004":
    native: "All this, whatever moves in the moving world, is to be wrapped in the Lord; so enjoy by giving up, and do not covet anyone's wealth."
    notes:
      "n1": "The first verse of the Īśā Upaniṣad. The English Wikipedia calls it one of the shortest Upaniṣads, embedded as the final chapter of the Śukla Yajurveda, a brief poem of 17 or 18 verses, and says its name comes from its opening words īśā vāsyam. Because it belongs to a Veda it is older than classical Sanskrit, so a few forms differ from the classical language."
      "n2": "The page types इदँ (idam̐) with a candrabindu, a Vedic way of writing a nasalised final m; classical texts write इदम् (idam). The first compound ईशावास्यम् (īśāvāsyam) joins ईशा (īśā, by the Lord) and वास्यम् (vāsyam), a form of the root वस् (vas, to clothe) that means \"to be covered\"."
    bases:
      "ॐ": "the sacred syllable om"
      "ईशावास्यमिदँ": "lord (by the lord) + to be covered + this"
      "सर्वं": "all"
      "यत्किञ्च": "whatever (which + any + and)"
      "जगत्यां": "the world (in the world)"
      "जगत्": "moving, the moving world"
      "तेन": "by that"
      "त्यक्तेन": "given up, renounced (by renouncing)"
      "भुञ्जीथाः": "to enjoy (you should enjoy)"
      "मा": "not (forbidding)"
      "गृधः": "to covet (do covet)"
      "कस्यस्विद्धनम्": "whose, anyone's + a particle + wealth"
  "sa-8005":
    native: "By whom is the mind sent and made to fly; by whom does the first breath go forth, yoked on; by whom do people speak this speech; who is the god that joins the eye and the ear?"
    notes:
      "n1": "The opening verse of the Kena Upaniṣad. The English Wikipedia calls it a Vedic Sanskrit text, one of the primary Upaniṣads, embedded in the last section of the Talavakāra Brāhmaṇa of the Sāmaveda, probably composed around the middle of the first millennium BCE, with its first 13 verses a poem in metre followed by prose."
      "n2": "Every question word is a form of किम् (kim, who or what): केन (kena, by whom), कः (kaḥ, who), which is written क (ka) before उ (u), and so on. In केनेषितम् (keneṣitam) the word केन (kena) joins इषितम् (iṣitam, willed): a and i make e."
    bases:
      "ॐ": "the sacred syllable om"
      "केनेषितं": "by whom + willed, urged"
      "पतति": "to fly, to alight (it flies)"
      "प्रेषितं": "sent forth"
      "मनः": "mind"
      "केन": "by whom"
      "प्राणः": "breath, life force"
      "प्रथमः": "first"
      "प्रैति": "forth + to go (goes forth)"
      "युक्तः": "yoked, set to work"
      "केनेषितां": "by whom + willed, urged"
      "वाचमिमां": "speech + this"
      "वदन्ति": "to speak (they speak)"
      "चक्षुः": "eye"
      "श्रोत्रं": "ear"
      "क": "who"
      "उ": "then, indeed (a particle)"
      "देवो": "god"
      "युनक्ति": "to join, to yoke (he joins)"
  "sa-8006":
    native: "The better and the dearer both come to a person; the steady one looks them over and tells them apart, and chooses the better over the dearer, while the dull one chooses the dearer for the sake of getting and keeping."
    notes:
      "n1": "From the second valli of the first chapter of the Kaṭha Upaniṣad. The English Wikipedia calls it an ancient Hindu text embedded in the Kaṭha school of the Kṛṣṇa Yajurveda, of two chapters with three sections (vallis) each, and says it has the legendary story of the boy Naciketas, who meets Yama, the king of the dead."
      "n2": "श्रेयः (śreyaḥ, the better) and प्रेयः (preyaḥ, the dearer) are both neuter forms. A visarga turns into o before a voiced sound and a following a is dropped in writing: श्रेयः (śreyaḥ) and हि (hi) are written श्रेयो हि (śreyo hi), and धीरः (dhīraḥ) and अभि (abhi) are written धीरोऽभि (dhīro 'bhi), with the avagraha sign ऽ (avagraha) for the lost a."
    bases:
      "श्रेयश्च": "the better + and"
      "प्रेयश्च": "the dearer + and"
      "मनुष्यमेतः": "person + to go (the two go to)"
      "तौ": "those two"
      "सम्परीत्य": "together + around + to go (having examined)"
      "विविनक्ति": "to separate, to tell apart (he tells apart)"
      "धीरः": "wise, steady person"
      "श्रेयो": "the better"
      "हि": "indeed"
      "धीरोऽभि": "steady person + over, toward"
      "प्रेयसो": "the dearer (than the dearer)"
      "वृणीते": "to choose (he chooses)"
      "प्रेयो": "the dearer"
      "मन्दो": "dull, slow person"
      "योगक्षेमाद्वृणीते": "getting and keeping (for the sake of) + to choose (he chooses)"
  "sa-8007":
    native: "Rise, wake up, and having found the best ones, understand; the wise say that the path is as hard to cross as the sharp edge of a razor."
    notes:
      "n1": "From the third valli of the first chapter of the Kaṭha Upaniṣad. The English Wikipedia says the text has the legendary story of the boy Naciketas and Yama, the king of the dead, whose conversation turns to the nature of man, knowledge, the Self (ātman) and liberation (mokṣa)."
      "n2": "The three commands उत्तिष्ठत (uttiṣṭhata, rise), जाग्रत (jāgrata, wake) and निबोधत (nibodhata, understand) are plural imperatives, all ending in -ta. The page writes वरान् (varān, the best ones) and निबोधत (nibodhata) together as one word, वरान्निबोधत (varānnibodhata)."
    bases:
      "उत्तिष्ठत": "up + to stand (stand up!)"
      "जाग्रत": "to wake (wake up!)"
      "प्राप्य": "forth + to reach (having reached)"
      "वरान्निबोधत": "boon, excellent one + down, in + to understand (understand!)"
      "क्षुरस्य": "razor (of a razor)"
      "धारा": "edge"
      "निशिता": "sharpened"
      "दुरत्यया": "hard to cross"
      "दुर्गं": "hard to travel, difficult"
      "पथस्तत्कवयो": "path + that + wise one, seer"
      "वदन्ति": "to say (they say)"
  "sa-8008":
    native: "Truth alone wins, not falsehood; by truth the path is stretched out, the path of the gods, on which the seers whose wishes are met go to the place where the highest treasury of truth lies."
    notes:
      "n1": "The English Wikipedia says the Muṇḍaka Upaniṣad is an ancient Vedic text embedded in the Atharvaveda and that it is the source of the phrase Satyameva Jayate, सत्यमेव जयते (satyameva jayate), the national motto of India, which appears on its national emblem. It is presented as a dialogue between the sages Śaunaka and Aṅgiras."
      "n2": "सत्यम् (satyam, truth) and एव (eva, only) join as सत्यमेव (satyameva), and न (na) and अनृतम् (anṛtam, untruth) as नानृतम् (nānṛtam), because a and a make ā. The avagraha sign ऽ (avagraha) in येनाऽऽक्रमन्ति (yenākramanti) is the page's way of marking a lost a."
    bases:
      "सत्यमेव": "truth + only, alone"
      "जयते": "to win (it wins)"
      "नानृतं": "not + falsehood"
      "सत्येन": "truth (by truth)"
      "पन्था": "path"
      "विततो": "stretched out"
      "देवयानः": "the path of the gods"
      "येनाऽऽक्रमन्त्यृषयो": "by which + to step up on (they step) + seer"
      "ह्याप्तकामा": "indeed + one whose wishes are met"
      "यत्र": "where"
      "तत्": "that"
      "सत्यस्य": "truth (of truth)"
      "परमं": "highest"
      "निधानम्": "treasury, resting place"
  "sa-8009":
    native: "Two fair-winged birds, close companions and friends, cling to the same tree; one of them eats the sweet fig, while the other looks on without eating."
    notes:
      "n1": "The English Wikipedia says the Muṇḍaka Upaniṣad is an ancient Vedic text embedded in the Atharvaveda, a poem with 64 verses written as mantras that are used for teaching and meditation, and that it is a dialogue between the sages Śaunaka and Aṅgiras."
      "n2": "The two birds are described with Vedic dual forms ending in -ā: द्वा (dvā, two), सुपर्णा (suparṇā), सयुजा (sayujā) and सखाया (sakhāyā); classical Sanskrit would write द्वौ (dvau) for two. In स्वाद्वत्ति (svādvatti) the u of स्वादु (svādu, sweet) turns into v before the vowel of अत्ति (atti, eats)."
    bases:
      "द्वा": "two"
      "सुपर्णा": "fair-winged one, bird"
      "सयुजा": "joined, companion"
      "सखाया": "friend"
      "समानं": "same"
      "वृक्षं": "tree"
      "परिषस्वजाते": "around + to embrace, cling (they cling)"
      "तयोरन्यः": "of them two + the other"
      "पिप्पलं": "fig (fruit of the pippala tree)"
      "स्वाद्वत्त्यनश्नन्नन्यो": "sweet + to eat (eats) + to eat (not eating, with the negative) + the other"
      "अभिचाकशीति": "to look on, to watch (he looks on)"
  "sa-8010":
    native: "Lead me from the unreal to the real, from darkness to light, from death to the deathless."
    notes:
      "n1": "The English Wikipedia calls the Bṛhadāraṇyaka Upaniṣad one of the Principal Upaniṣads, associated with the Śukla Yajurveda and one of the first Upaniṣadic scriptures of Hinduism, estimated to have been composed about the 7th to 6th century BCE. The Wikisource page prints these three requests as one line without a verse number."
      "n2": "There are three requests, each with the same pattern: a word in the \"from\" case, then मा (mā, me) and a form of गमय (gamaya, lead). गमय (gamaya) is the causative of गम् (gam, to go), \"make go, lead\". In ज्योतिर्गमय (jyotirgamaya) the visarga of ज्योतिः (jyotiḥ, light) becomes r before the voiced g. The word इति (iti) at the end closes the quotation."
    bases:
      "असतो": "what is not, the unreal (from the unreal)"
      "मा": "me"
      "सद्गमय": "being, the real + to make go, lead (lead!)"
      "तमसो": "darkness (from darkness)"
      "ज्योतिर्गमय": "light + to make go, lead (lead!)"
      "मृत्योर्मामृतं": "death (from death) + me + deathless, immortal"
      "गमयेति": "to make go, lead (lead!) + thus (closing the quotation)"
  "sa-8011":
    native: "Now, therefore, the inquiry into Brahman."
    notes:
      "n1": "The English Wikipedia names this as the opening sūtra of the Brahma Sūtras and translates it \"Then therefore the enquiry into Brahman\". It says the text consists of 555 aphoristic verses (sūtras) and that its surviving form was completed in approximately 400 to 450 CE, with an older version possibly composed between 500 BCE and 200 BCE."
      "n2": "अथ (atha, now) and अतः (ataḥ, therefore) join as अथातः (athātaḥ), and the visarga becomes o before the voiced b of ब्रह्म (brahma), giving अथातो (athāto). The second word is a compound: ब्रह्म (brahma, Brahman) and जिज्ञासा (jijñāsā, wish to know). There is no verb: sūtras are written in the shortest possible form."
    bases:
      "अथातो": "now + therefore"
      "ब्रह्मजिज्ञासा": "Brahman + wish to know, inquiry"
  "sa-8012":
    native: "Yoga is the stopping of the movements of the mind."
    notes:
      "n1": "The English Wikipedia describes the Yoga Sūtras as a compilation from a variety of sources of Sanskrit sutras (aphorisms) on the practice of yoga, 195 or 196 in number, compiled in India in the early centuries CE by the sage Patañjali, and says the text has been dated variously between 500 BCE and 450 CE."
      "n2": "One long word holds the whole definition: योगः (yogaḥ, yoga) and चित्त (citta, mind), वृत्ति (vṛtti, movement, activity), निरोधः (nirodhaḥ, stopping). The compound चित्तवृत्तिनिरोध (cittavṛttinirodha) reads \"stopping of the movements of the mind\". The visarga of योगः (yogaḥ) becomes ś before c: योगश्चित्त (yogaścitta)."
    bases:
      "योगश्चित्तवृत्तिनिरोधः": "yoga + mind + movement, activity + stopping"
  "sa-8013":
    native: "The restraints are non-violence, truthfulness, not stealing, chaste conduct and not owning more than needed."
    notes:
      "n1": "The English Wikipedia says the Yoga Sūtras teach ashtanga yoga, eight elements of practice, the first of which is yama (abstinences); this sūtra lists the five yamas. The article says the text is a compilation attributed to the sage Patañjali."
      "n2": "Five nouns are joined into one long word, a compound of equal parts: अहिंसा (ahiṃsā, non-violence), सत्य (satya, truth), अस्तेय (asteya, not stealing), ब्रह्मचर्य (brahmacarya, chaste conduct) and अपरिग्रह (aparigraha, not holding on to things). Three begin with the negative prefix अ (a). The last word यमाः (yamāḥ, restraints) is the plural subject."
    bases:
      "अहिंसासत्यास्तेयब्रह्मचर्यापरिग्रहा": "non-violence + truth + not stealing + chaste conduct + not owning more"
      "यमाः": "restraint"
  "sa-8014":
    native: "A posture is steady and comfortable."
    notes:
      "n1": "The English Wikipedia lists asana (yoga posture) as the third of the eight limbs of ashtanga yoga in the Yoga Sūtras, after yama (abstinences) and niyama (observances). This sūtra gives the one rule of a posture in two words."
      "n2": "There is no verb, as in most sūtras: \"is\" is understood. स्थिर (sthira, steady) and सुखम् (sukham, ease, comfort) form one word, a compound. The page types the endings with the anusvāra ं (ṃ), स्थिरसुखं (sthirasukhaṃ) and आसनं (āsanaṃ), where careful writing has the final म् (m)."
    bases:
      "स्थिरसुखं": "steady + comfortable, ease"
      "आसनं": "posture, seat"
  "sa-8015":
    native: "Where women are honoured, there the gods are pleased; where they are not honoured, all rites bear no fruit."
    notes:
      "n1": "The English Wikipedia says the Manusmṛti is a metrical text in Sanskrit, dated to the 2nd century BCE to the 2nd century CE, that presents itself as a discourse given by Manu and Bhṛgu on dharma topics. The same article records that the text sets many restrictions on women, so this verse is one voice in a long and debated text."
      "n2": "यत्र (yatra, where) and तत्र (tatra, there) pair up: a clause with यत्र (yatra) is answered by one with तत्र (tatra). In यत्रैताः (yatraitāḥ) the vowels a and e join as ai. The verb पूज्यन्ते (pūjyante, are honoured) is a passive and रमन्ते (ramante, they delight) a middle-voice form."
    bases:
      "यत्र": "where"
      "नार्यस्तु": "woman (women) + but, indeed"
      "पूज्यन्ते": "to honour (they are honoured)"
      "रमन्ते": "to delight, be pleased (they are pleased)"
      "तत्र": "there"
      "देवताः": "god, deity (gods)"
      "यत्रैतास्तु": "where + these + but"
      "न": "not"
      "सर्वास्तत्राफलाः": "all + there + fruitless"
      "क्रियाः": "rite, action"
  "sa-8016":
    native: "One should speak the truth and speak what is pleasant, and not speak an unpleasant truth; one should not speak a pleasant lie either; this is the ancient rule."
    notes:
      "n1": "The English Wikipedia says the Manusmṛti is a metrical text in Sanskrit, dated to the 2nd century BCE to the 2nd century CE, that presents itself as a discourse given by Manu and Bhṛgu on dharma topics, and that its verses were also copied and used as law in other lands of South-East Asia."
      "n2": "The optative ब्रूयात् (brūyāt, one should say) is the verb of every clause; its final t changes before the next word: ब्रूयात् (brūyāt) and प्रियम् (priyam) join as ब्रूयात्प्रियम् (brūyātpriyam), and with न (na) as ब्रूयान्न (brūyānna). In नानृतम् (nānṛtam) the न (na) and अनृतम् (anṛtam, untruth) join, and a and a make ā."
    bases:
      "सत्यं": "the true (truth)"
      "ब्रूयात्प्रियं": "to say (one should say) + pleasant, dear"
      "ब्रूयान्न": "to say (one should say) + not"
      "ब्रूयात्सत्यं": "to say (one should say) + truth"
      "अप्रियम्": "unpleasant"
      "प्रियं": "pleasant, dear"
      "च": "and"
      "नानृतं": "not + falsehood"
      "ब्रूयादेष": "to say (one should say) + this"
      "धर्मः": "law, right way"
      "सनातनः": "ancient, eternal"
