cards:
  "sa-3920":
    native: "A mother shows affection for her son."
    bases: { "सूनौ": "for her son", "स्नेहं": "affection", "करोति": "to do (shows)" }
    confusables: { "w1": { why: "Affection and attachment, not affection: अनुरागः (anurāgaḥ) means affection and attachment." }, "w2": { why: "Daughter, not son: पुत्री (putrī) means daughter." }, "w3": { why: "To give, not to do: दा (dā) means to give." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. स्नेहम् (sneham) is written स्नेहं (snehaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of करोति (karoti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "सूनौ (sūnau) is the locative case of सूनुः (sūnuḥ): on the son, towards him. स्नेहम् (sneham) is the accusative case: the affection she does, that is, shows." }
  "sa-3921":
    native: "The queen weeps in the house with grief."
    bases: { "शोकेन": "with grief", "गृहे": "in the house", "रोदिति": "to cry (weeps)" }
    confusables: { "w1": { why: "Female servant, not queen: दासी (dāsī) means female servant." }, "w2": { why: "Dejection, not grief: खेदः (khedaḥ) means dejection." }, "w3": { why: "To laugh, not to cry: हस् (has) means to laugh." } }
    notes: { "n1": "शोकेन (śokena) is the instrumental case of शोकः (śokaḥ): with grief. गृहे (gṛhe) is the locative case of गृहम् (gṛham): in the house." }
  "sa-3922":
    native: "Hope gives patience in sorrow."
    bases: { "दुःखे": "in sorrow", "धैर्यं": "patience", "ददाति": "to give (gives)" }
    confusables: { "w1": { why: "Wish or desire for something, not hope: इच्छा (icchā) means wish or desire for something." }, "w2": { why: "Patience and endurance, not patience: सहनम् (sahanam) means patience and endurance." }, "w3": { why: "To take, not to give: हृ (hṛ) means to take." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. धैर्यम् (dhairyam) is written धैर्यं (dhairyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of ददाति (dadāti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "दुःखे (duḥkhe) is the locative case of दुःखम् (duḥkham): in sorrow. धैर्यम् (dhairyam) is the accusative case: what hope gives." }
  "sa-3923":
    native: "The frightened boy looks at his mother."
    bases: { "भीतो": "frightened", "बालको": "boy", "मातरं": "mother", "पश्यति": "to see (looks at)" }
    confusables: { "w1": { why: "Faint-hearted and fearful, not frightened: कातरः (kātaraḥ) means faint-hearted and fearful." }, "w2": { why: "Daughter, not mother: दुहिता (duhitā) means daughter." }, "w3": { why: "To remember, not to look at: स्मृ (smṛ) means to remember." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. भीतः (bhītaḥ) is written भीतो (bhīto) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of बालको (bālako) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). बालकः (bālakaḥ) is written बालको (bālako), for the same reason, before मातरं (mātaraṃ). मातरम् (mātaram) is written मातरं (mātaraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पश्यति (paśyati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "मातरम् (mātaram) is the accusative case of माता (mātā): whom he looks at. भीतः (bhītaḥ) is an adjective that agrees with बालकः (bālakaḥ)." }
  "sa-3924":
    native: "The angry king binds the thief."
    bases: { "कुपितो": "angry", "राजा": "king", "चोरं": "thief", "बध्नाति": "to bind (binds)" }
    confusables: { "w1": { why: "Calm and at peace, not angry: शान्तः (śāntaḥ) means calm and at peace." }, "w2": { why: "To trouble, not to bind: बाध् (bādh) means to trouble." }, "w3": { why: "Enemy, not thief: शत्रुः (śatruḥ) means enemy." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. कुपितः (kupitaḥ) is written कुपितो (kupito) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of राजा (rājā) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). चोरम् (coram) is written चोरं (coraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of बध्नाति (badhnāti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "चोरम् (coram) is the accusative case of चोरः (coraḥ): whom he binds. बध्नाति (badhnāti) is the present of बन्ध् (bandh), a verb of the ninth class." }
  "sa-3925":
    native: "The cheerful girl sings in the forest."
    bases: { "प्रसन्ना": "cheerful", "वने": "in the forest", "गायति": "to sing (sings)" }
    confusables: { "w1": { why: "Sad and depressed in spirit, not cheerful: खिन्नः (khinnaḥ) means sad and depressed in spirit." }, "w2": { why: "To laugh, not to sing: हस् (has) means to laugh." }, "w3": { why: "Daughter, not girl: पुत्री (putrī) means daughter." } }
    notes: { "n1": "प्रसन्ना (prasannā) is the feminine form of प्रसन्नः (prasannaḥ), to agree with कन्या (kanyā). वने (vane) is the locative case of वनम् (vanam): in the forest." }
  "sa-3926":
    native: "The calm sage lives in the hermitage."
    bases: { "शान्तो": "calm", "मुनिर्": "sage", "आश्रमे": "in the hermitage", "वसति": "to dwell (lives)" }
    confusables: { "w1": { why: "Shaken and disturbed, not calm: क्षुब्धः (kṣubdhaḥ) means shaken and disturbed." }, "w2": { why: "Mendicant, not sage: भिक्षुः (bhikṣuḥ) means mendicant." }, "w3": { why: "Village, not hermitage: ग्रामः (grāmaḥ) means village." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. शान्तः (śāntaḥ) is written शान्तो (śānto) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of मुनिर् (munir) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). मुनिः (muniḥ) is written मुनिर् (munir) because a final ः (ḥ) after इ (i) becomes र् (r) before a voiced sound, here the start of आश्रमे (āśrame) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174).", "n2": "शान्तः (śāntaḥ) is an adjective that agrees with मुनिः (muniḥ). आश्रमे (āśrame) is the locative case of आश्रमः (āśramaḥ): in the hermitage." }
  "sa-3927":
    native: "The fearless lion moves about in the forest."
    bases: { "सिंहो": "lion", "निर्भयो": "fearless", "वने": "in the forest", "चरति": "to move about (moves about)" }
    confusables: { "w1": { why: "Faint-hearted and fearful, not fearless: कातरः (kātaraḥ) means faint-hearted and fearful." }, "w2": { why: "Tiger, not lion: व्याघ्रः (vyāghraḥ) means tiger." }, "w3": { why: "To run, not to move about: धाव् (dhāv) means to run." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सिंहः (siṃhaḥ) is written सिंहो (siṃho) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of निर्भयो (nirbhayo) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). निर्भयः (nirbhayaḥ) is written निर्भयो (nirbhayo), for the same reason, before वने (vane).", "n2": "निर्भयः (nirbhayaḥ) is an adjective that agrees with सिंहः (siṃhaḥ). चरति (carati) is the present of चर् (car): moves about, roams." }
  "sa-3928":
    native: "With wonder the girl looks at the lamp."
    bases: { "विस्मयेन": "with wonder", "दीपं": "lamp", "पश्यति": "to see (looks at)" }
    confusables: { "w1": { why: "Fear or terror that makes someone shrink back, not wonder: त्रासः (trāsaḥ) means fear or terror that makes someone shrink back." }, "w2": { why: "Small lamp, not lamp: दीपिका (dīpikā) means small lamp." }, "w3": { why: "To remember, not to look at: स्मृ (smṛ) means to remember." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. दीपम् (dīpam) is written दीपं (dīpaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पश्यति (paśyati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "विस्मयेन (vismayena) is the instrumental case of विस्मयः (vismayaḥ): with wonder. दीपम् (dīpam) is the accusative case: what she looks at." }
  "sa-3929":
    native: "The satisfied merchant goes home with his wealth."
    bases: { "संतुष्टो": "satisfied", "वणिग्": "merchant", "धनेन": "with wealth", "गृहं": "home", "गच्छति": "to go (goes)" }
    confusables: { "w1": { why: "Contentment, not satisfied: तोषः (toṣaḥ) means contentment." }, "w2": { why: "Business, not merchant: व्यापारः (vyāpāraḥ) means business." }, "w3": { why: "To walk, not to go: चल् (cal) means to walk." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. संतुष्टः (saṃtuṣṭaḥ) is written संतुष्टो (saṃtuṣṭo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of वणिग् (vaṇig) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). वणिक् (vaṇik) is written वणिग् (vaṇig) because a final क् (k) becomes ग् (g) before a voiced sound, here the start of धनेन (dhanena) (Aṣṭādhyāyī 8.2.39, झलां जशोऽन्ते (jhalāṃ jaśo 'nte), in separate words झलां जशः अन्ते (jhalāṃ jaśaḥ ante); Whitney 159). गृहम् (gṛham) is written गृहं (gṛhaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of गच्छति (gacchati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "धनेन (dhanena) is the instrumental case of धनम् (dhanam): with wealth. गृहम् (gṛham) is the accusative case: where he goes, to the house." }
