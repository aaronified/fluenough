cards:
  "sa-3000":
    native: "Where do you bring the water?"
    bases: { "त्वं": "you", "जलं": "water", "नयसि": "to bring (you bring)" }
    confusables: { "w1": { why: "He, not you: सः (saḥ) means he." }, "w2": { why: "When, not where: कदा (kadā) means when." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. त्वम् (tvam) is written त्वं (tvaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of कुत्र (kutra) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). जलम् (jalam) is written जलं (jalaṃ), for the same reason, before नयसि (nayasi).", "n2": "जलम् (jalam) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
  "sa-3001":
    native: "When does he speak Sanskrit?"
    bases: { "स": "he", "संस्कृतं": "the Sanskrit language", "वदति": "to speak (speaks)" }
    confusables: { "w1": { why: "She, not he: सा (sā) means she." }, "w2": { why: "How, not when: कथम् (katham) means how." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सः (saḥ) is written स (sa) because सः (saḥ) and एषः (eṣaḥ) lose their visarga before any consonant, here the start of संस्कृतम् (saṃskṛtam) (Whitney 176 a; Aṣṭādhyāyī 6.1.132). संस्कृतम् (saṃskṛtam) is written संस्कृतं (saṃskṛtaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of कदा (kadā) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "संस्कृतम् (saṃskṛtam) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
  "sa-3002":
    native: "How do you all read Sanskrit?"
    bases: { "यूयं": "you all", "कथं": "how", "संस्कृतं": "the Sanskrit language", "पठथ": "to read (you all read)" }
    confusables: { "w1": { why: "I, not you all: अहम् (aham) means I." }, "w2": { why: "How many, not how: कति (kati) means how many." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. यूयम् (yūyam) is written यूयं (yūyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of कथम् (katham) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). कथम् (katham) is written कथं (kathaṃ), for the same reason, before संस्कृतम् (saṃskṛtam). संस्कृतम् (saṃskṛtam) is written संस्कृतं (saṃskṛtaṃ), for the same reason, before पठथ (paṭhatha). The labial keeps म् (m) in Whitney 213 a, but the anusvāra sign is the usual writing (Whitney 213 i).", "n2": "संस्कृतम् (saṃskṛtam) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
  "sa-3003":
    native: "Why do we not bring the water?"
    bases: { "वयं": "we", "किमर्थं": "why", "जलं": "water", "नयामः": "to bring (we bring)" }
    confusables: { "w1": { why: "You all, not we: यूयम् (yūyam) means you all." }, "w2": { why: "What, not why: किम् (kim) means what." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वयम् (vayam) is written वयं (vayaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of किमर्थम् (kimartham) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). किमर्थम् (kimartham) is written किमर्थं (kimarthaṃ), for the same reason, before जलम् (jalam). जलम् (jalam) is written जलं (jalaṃ), for the same reason, before न (na).", "n2": "जलम् (jalam) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
  "sa-3004":
    native: "Where does the horse go and where does the god read?"
    bases: { "गच्छति": "to go (goes)", "च": "and", "पठति": "to read (reads)" }
    confusables: { "w1": { why: "Water, not horse: जलम् (jalam) means water." }, "w2": { why: "When, not where: कदा (kadā) means when." } }
    notes: { "n1": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3005":
    native: "Who reads Sanskrit and who brings water?"
    bases: { "संस्कृतं": "the Sanskrit language", "पठति": "to read (reads)", "च": "and", "जलं": "water", "नयति": "to bring (brings)" }
    confusables: { "w1": { why: "To speak, not to read: वद् (vad) means to speak." }, "w2": { why: "Fire, not water: अग्निः (agniḥ) means fire." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. संस्कृतम् (saṃskṛtam) is written संस्कृतं (saṃskṛtaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पठति (paṭhati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). जलम् (jalam) is written जलं (jalaṃ), for the same reason, before नयति (nayati).", "n2": "का (kā) is the feminine form of कः (kaḥ): the ones asked about are women.", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one.", "n4": "संस्कृतम् (saṃskṛtam) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
  "sa-3006":
    native: "How many bring water and how many read Sanskrit?"
    bases: { "जलं": "water", "नयन्ति": "to bring (they bring)", "च": "and", "संस्कृतं": "the Sanskrit language", "पठन्ति": "to read (they read)" }
    confusables: { "w1": { why: "Why, not how many: किमर्थम् (kimartham) means why." }, "w2": { why: "Fire, not water: अग्निः (agniḥ) means fire." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. जलम् (jalam) is written जलं (jalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of नयन्ति (nayanti) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). संस्कृतम् (saṃskṛtam) is written संस्कृतं (saṃskṛtaṃ), for the same reason, before पठन्ति (paṭhanti). The labial keeps म् (m) in Whitney 213 a, but the anusvāra sign is the usual writing (Whitney 213 i).", "n2": "कति (kati) takes a plural verb, पठन्ति (paṭhanti), because the answer is a number of people.", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one.", "n4": "जलम् (jalam) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
  "sa-3007":
    native: "Why does she not speak Sanskrit?"
    bases: { "किमर्थं": "why", "संस्कृतं": "the Sanskrit language", "वदति": "to speak (speaks)" }
    confusables: { "w1": { why: "What, not why: किम् (kim) means what." }, "w2": { why: "That, not she: तत् (tat) means that." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. किमर्थम् (kimartham) is written किमर्थं (kimarthaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of सा (sā) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). संस्कृतम् (saṃskṛtam) is written संस्कृतं (saṃskṛtaṃ), for the same reason, before न (na).", "n2": "संस्कृतम् (saṃskṛtam) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
