schema: 1
id: "sa-en-questions-sentences"
kind: "layer"
core: "sa-questions-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences with questions"
description: "Short sentences with the question words of Questions, built only from words already taught. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sa-3000":
    native: "Where do I drink water?"
    bases: { "अहं": "I", "जलं": "water", "पिबामि": "to drink (I drink)" }
    confusables: { "w1": { why: "When, not where: कदा (kadā) asks when." }, "w2": { why: "How, not where: कथम् (katham) asks how." } }
  "sa-3001":
    native: "Where is water?"
    bases: { "अस्ति": "is (there)" }
    confusables: { "w1": { why: "Fire, not water: अग्निः (agniḥ) means fire." }, "w2": { why: "When, not where: कदा (kadā) asks when." } }
    notes: { "n1": "The verb is put first, as अस्ति (asti), is, opens the sentence and the question word follows it." }
  "sa-3002":
    native: "What do I know?"
    bases: { "अहं": "I", "किं": "what", "जानामि": "to know (I know)" }
    confusables: { "w1": { why: "Who, not what: कः (kaḥ) asks who." }, "w2": { why: "How, not what: कथम् (katham) asks how." } }
  "sa-3003":
    native: "How do I go?"
    bases: { "अहं": "I", "कथं": "how", "गच्छामि": "to go (I go)" }
    confusables: { "w1": { why: "Where, not how: कुत्र (kutra) asks where." }, "w2": { why: "When, not how: कदा (kadā) asks when." } }
  "sa-3004":
    native: "Where is fire?"
    confusables: { "w1": { why: "Water, not fire: जलम् (jalam) means water." }, "w2": { why: "How, not where: कथम् (katham) asks how." } }
  "sa-3005":
    native: "Why do I drink?"
    bases: { "अहं": "I", "किमर्थं": "why", "पिबामि": "to drink (I drink)" }
    confusables: { "w1": { why: "Where, not why: कुत्र (kutra) asks where." }, "w2": { why: "How many, not why: कति (kati) asks how many." } }
  "sa-3006":
    native: "What is water?"
    bases: { "किं": "what" }
    confusables: { "w1": { why: "Fire, not water: अग्निः (agniḥ) means fire." }, "w2": { why: "Who, not what: कः (kaḥ) asks who." } }
  "sa-3007":
    native: "Who am I?"
    bases: { "अहं": "I" }
    confusables: { "w1": { why: "What, not who: किम् (kim) asks what." }, "w2": { why: "Where, not who: कुत्र (kutra) asks where." } }
    notes: { "n1": "No verb is written here: as often in Sanskrit, the verb to be is left out." }
