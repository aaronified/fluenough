cards:
  "sa-3140":
    native: "I drink water and you read Sanskrit."
    bases: { "अहं": "I", "जलं": "water", "पिबामि": "to drink (I drink)", "त्वं": "you", "संस्कृतं": "the Sanskrit language", "पठसि": "to read (you read)" }
    confusables: { "w1": { why: "He, not I: सः (saḥ) means he." }, "w2": { why: "Fire, not water: अग्निः (agniḥ) means fire." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अहम् (aham) is written अहं (ahaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of जलम् (jalam) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). जलम् (jalam) is written जलं (jalaṃ), for the same reason, before पिबामि (pibāmi). The labial keeps म् (m) in Whitney 213 a, but the anusvāra sign is the usual writing (Whitney 213 i). त्वम् (tvam) is written त्वं (tvaṃ), for the same reason, before च (ca). संस्कृतम् (saṃskṛtam) is written संस्कृतं (saṃskṛtaṃ), for the same reason, before पठसि (paṭhasi). The labial keeps म् (m) in Whitney 213 a, but the anusvāra sign is the usual writing (Whitney 213 i).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one.", "n3": "जलम् (jalam) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
  "sa-3141":
    native: "What do you eat and what do you drink?"
    bases: { "त्वं": "you", "किं": "what", "खादसि": "to eat (you eat)", "पिबसि": "to drink (you drink)" }
    confusables: { "w1": { why: "He, not you: सः (saḥ) means he." }, "w2": { why: "Who, not what: कः (kaḥ) means who." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. त्वम् (tvam) is written त्वं (tvaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of किम् (kim) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). किम् (kim) is written किं (kiṃ), for the same reason, before खादसि (khādasi). किम् (kim) is written किं (kiṃ), for the same reason, before च (ca).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3142":
    native: "When does that brother run and when does he laugh?"
    bases: { "स": "he", "धावति": "to run (runs)", "हसति": "to laugh (laughs)" }
    confusables: { "w1": { why: "She, not he: सा (sā) means she." }, "w2": { why: "Sister, not brother: स्वसा (svasā) means sister." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सः (saḥ) is written स (sa) because सः (saḥ) and एषः (eṣaḥ) lose their visarga before any consonant, here the start of भ्राता (bhrātā) (Whitney 176 a; Aṣṭādhyāyī 6.1.132).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3143":
    native: "Where does the horse run and where does the cow stand?"
    bases: { "धावति": "to run (runs)", "तिष्ठति": "to stand (stands)" }
    confusables: { "w1": { why: "Rāma, not horse: रामः (rāmaḥ) means Rāma." }, "w2": { why: "When, not where: कदा (kadā) means when." } }
    notes: { "n1": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3144":
    native: "That woman sings and that friend laughs."
    bases: { "गायति": "to sing (sings)", "स": "he", "हसति": "to laugh (laughs)" }
    confusables: { "w1": { why: "That, not she: तत् (tat) means that." }, "w2": { why: "Mother, not woman: माता (mātā) means mother." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सः (saḥ) is written स (sa) because सः (saḥ) and एषः (eṣaḥ) lose their visarga before any consonant, here the start of च (ca) (Whitney 176 a; Aṣṭādhyāyī 6.1.132).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3145":
    native: "We play and you all read."
    bases: { "वयं": "we", "क्रीडामो": "to play (we play)", "यूयं": "you all", "पठथ": "to read (you all read)" }
    confusables: { "w1": { why: "I, not we: अहम् (aham) means I." }, "w2": { why: "To carry, not to play: वह् (vah) means to carry." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वयम् (vayam) is written वयं (vayaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of क्रीडामः (krīḍāmaḥ) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). क्रीडामः (krīḍāmaḥ) is written क्रीडामो (krīḍāmo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of यूयम् (yūyam) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). यूयम् (yūyam) is written यूयं (yūyaṃ), for the same reason, before च (ca).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3146":
    native: "Where does mother live and when does the brother eat?"
    bases: { "वसति": "to live (lives)", "खादति": "to eat (eats)" }
    confusables: { "w1": { why: "Father, not mother: पिता (pitā) means father." }, "w2": { why: "How, not where: कथम् (katham) means how." } }
    notes: { "n1": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3147":
    native: "The friend takes the water away and mother eats."
    bases: { "जलं": "water", "हरति": "to take away (takes away)", "खादति": "to eat (eats)" }
    confusables: { "w1": { why: "Son, not friend: सूनुः (sūnuḥ) means son." }, "w2": { why: "Fire, not water: अग्निः (agniḥ) means fire." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. जलम् (jalam) is written जलं (jalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of हरति (harati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one.", "n3": "जलम् (jalam) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
  "sa-3148":
    native: "Who laughs, who sings and who eats?"
    bases: { "हसति": "to laugh (laughs)", "गायति": "to sing (sings)", "खादति": "to eat (eats)" }
    confusables: { "w1": { why: "To live, not to laugh: वस् (vas) means to live." }, "w2": { why: "To dig, not to sing: खन् (khan) means to dig." } }
    notes: { "n1": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3149":
    native: "We drink water and you all eat."
    bases: { "वयं": "we", "जलं": "water", "पिबामो": "to drink (we drink)", "यूयं": "you all", "खादथ": "to eat (you all eat)" }
    confusables: { "w1": { why: "I, not we: अहम् (aham) means I." }, "w2": { why: "Fire, not water: अग्निः (agniḥ) means fire." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वयम् (vayam) is written वयं (vayaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of जलम् (jalam) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). जलम् (jalam) is written जलं (jalaṃ), for the same reason, before पिबामः (pibāmaḥ). The labial keeps म् (m) in Whitney 213 a, but the anusvāra sign is the usual writing (Whitney 213 i). पिबामः (pibāmaḥ) is written पिबामो (pibāmo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of यूयम् (yūyam) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). यूयम् (yūyam) is written यूयं (yūyaṃ), for the same reason, before च (ca).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one.", "n3": "जलम् (jalam) is the object of the verb, in the accusative case; for a neuter noun that case looks like the plain form. The cases are taught in the unit sa-grammar-case-system." }
