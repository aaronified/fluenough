cards:
  "sa-3140":
    native: "I eat."
    bases: { "अहं": "I", "खादामि": "to eat (I eat)" }
    confusables: { "w1": { why: "To drink, not eat: पा (pā) means to drink." }, "w2": { why: "To stand, not eat: स्था (sthā) means to stand." } }
  "sa-3141":
    native: "He drinks water."
    bases: { "पिबति": "to drink (he drinks)" }
    confusables: { "w1": { why: "To eat, not drink: खाद् (khād) means to eat." }, "w2": { why: "Fire, not water: अग्निः (agniḥ) means fire." } }
  "sa-3142":
    native: "She stands."
    bases: { "तिष्ठति": "to stand (she stands)" }
    confusables: { "w1": { why: "To walk, not stand: चल् (cal) means to walk." }, "w2": { why: "To drink, not stand: पा (pā) means to drink." } }
  "sa-3143":
    native: "You laugh."
    bases: { "त्वं": "you (to one person)", "हससि": "to laugh (you laugh)" }
    confusables: { "w1": { why: "To bow, not laugh: नम् (nam) means to bow." }, "w2": { why: "To remember, not laugh: स्मृ (smṛ) means to remember." } }
  "sa-3144":
    native: "We dig."
    bases: { "वयं": "we", "खनामः": "to dig (we dig)" }
    confusables: { "w1": { why: "To run, not dig: धाव् (dhāv) means to run." }, "w2": { why: "To play, not dig: क्रीड् (krīḍ) means to play." } }
  "sa-3145":
    native: "She runs."
    bases: { "धावति": "to run (she runs)" }
    confusables: { "w1": { why: "To walk, not run: चल् (cal) means to walk." }, "w2": { why: "To fall or fly, not run: पत् (pat) means to fall or fly." } }
  "sa-3146":
    native: "I live."
    bases: { "अहं": "I", "जीवामि": "to live (I live)" }
    confusables: { "w1": { why: "To carry, not live: वह् (vah) means to carry." }, "w2": { why: "To be hot, not live: तप् (tap) means to be hot or shine." } }
  "sa-3147":
    native: "He digs."
    bases: { "खनति": "to dig (he digs)" }
    confusables: { "w1": { why: "To murmur, not dig: जप् (jap) means to murmur a prayer." }, "w2": { why: "To play, not dig: क्रीड् (krīḍ) means to play." } }
  "sa-3148":
    native: "You run."
    bases: { "त्वं": "you (to one person)", "धावसि": "to run (you run)" }
    confusables: { "w1": { why: "To fall or fly, not run: पत् (pat) means to fall or fly." }, "w2": { why: "To walk, not run: चल् (cal) means to walk." } }
  "sa-3149":
    native: "I walk."
    bases: { "अहं": "I", "चलामि": "to walk (I walk)" }
    confusables: { "w1": { why: "To sing, not walk: गै (gai) means to sing." }, "w2": { why: "To move about, not walk: चर् (car) means to move about or roam." } }
