name: "Secondary derivation (taddhita)"
description: "Words made from other words with a suffix: the vṛddhi suffix -a, -ya, -īya, -tā, -tva, -mat or -vat, and -maya, each shown on course words with the change it causes. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
pattern:
  name: "Secondary derivation"
  slot_name: "suffix"
  slots:
    "an": "with -a and vṛddhi: belonging to"
    "ya": "with -ya: belonging to"
    "iya": "with -īya: belonging to"
    "ta": "with -tā: the quality of"
    "tva": "with -tva: the state of"
    "mat": "with -mat or -vat: having"
    "maya": "with -maya: made of"
  entries:
    "sarad": "शरद् (śarad), autumn. शारद (śārada), autumnal (read on its Wiktionary entry; the suffix -a (aṇ) with vṛddhi of the first vowel, an adjective of belonging)."
    "marut": "मरुत् (marut), wind; the Maruts, the storm gods. मारुत (māruta), relating to the Maruts (read on its Wiktionary entry; the suffix -a (aṇ) with vṛddhi of the first vowel, an adjective of belonging)."
    "prthivi": "पृथिवी (pṛthivī), earth. पार्थिव (pārthiva), earthly, of the earth (read on its Wiktionary entry; the suffix -a (aṇ) with vṛddhi of the first vowel, an adjective of belonging)."
    "deva": "देव (deva), a god. दैव्य (daivya), divine (read on its Wiktionary entry; the suffix -ya, an adjective of belonging (with or without vṛddhi of the first vowel)); देवता (devatā), godhead, divinity (read on its Wiktionary entry; the suffix -tā, a feminine abstract noun, the quality of being so and so); देवत्व (devatva), divinity (from Whitney, no Wiktionary entry read; the suffix -tva, a neuter abstract noun, the same sense as -tā)."
    "mukha": "मुख (mukha), mouth. मुख्य (mukhya), foremost, a leader (read on its Wiktionary entry; the suffix -ya, an adjective of belonging (with or without vṛddhi of the first vowel))."
    "go": "गो (go), cow. गव्य (gavya), of or relating to cows (read on its Wiktionary entry; the suffix -ya, an adjective of belonging (with or without vṛddhi of the first vowel))."
    "parvata": "पर्वत (parvata), mountain. पर्वतीय (parvatīya), mountainous (from Whitney, no Wiktionary entry read; the suffix -īya, an adjective of belonging)."
    "vac": "वाच् (vāc), speech. वाङ्मय (vāṅmaya), eloquent; speech, literature (read on its Wiktionary entry; the suffix -maya, made of, consisting of, abounding in)."
    "jyotis": "ज्योतिस् (jyotis), light. ज्योतिष्मत् (jyotiṣmat), full of brightness (from Whitney, no Wiktionary entry read; the possessive suffix -mat or -vat (matup), full of, possessing); ज्योतिर्मय (jyotirmaya), made of light, luminous (from Whitney, no Wiktionary entry read; the suffix -maya, made of, consisting of, abounding in)."
    "ayus": "आयुस् (āyus), life, lifespan. आयुष्मत् (āyuṣmat), long-lived, possessed of vital power (read on its Wiktionary entry; the possessive suffix -mat or -vat (matup), full of, possessing)."
    "hima": "हिम (hima), snow. हिमवत् (himavat), snowy, icy (read on its Wiktionary entry; the possessive suffix -mat or -vat (matup), full of, possessing)."
    "pati": "पति (pati), husband, lord. पतित्व (patitva), matrimony, husbandship (read on its Wiktionary entry; the suffix -tva, a neuter abstract noun, the same sense as -tā)."
    "bhratr": "भ्रातृ (bhrātṛ), brother. भ्रातृत्व (bhrātṛtva), brotherhood (read on its Wiktionary entry; the suffix -tva, a neuter abstract noun, the same sense as -tā)."
    "bandhu": "बन्धु (bandhu), kinsman. बन्धुता (bandhutā), relationship (from Whitney, no Wiktionary entry read; the suffix -tā, a feminine abstract noun, the quality of being so and so)."
  notes: "A taddhita is a suffix added to a noun or other word, not to a verb root: Pāṇini 4.1.76 opens the section with the word तद्धिताः (taddhitāḥ). The most frequent change is the vṛddhi of the first vowel of the stem (Whitney 1204): a becomes ā and ṛ becomes ār, with the vowel that follows dropped. Pāṇini 7.2.117 says तद्धितेषु अचां आदेः (taddhiteṣu acāṃ ādeḥ): in taddhitas, of the vowels the first. So śarad becomes śārada, marut becomes māruta and pṛthivī becomes pārthiva (the final ī drops before the suffix). The suffix -a that makes the vṛddhi derivatives is called aṇ, and Pāṇini 4.1.83 says प्राग् दीव्यतः अण् (prāg dīvyataḥ aṇ): the sūtra that names aṇ; 4.1.92 says तस्य अपत्यम् (tasya apatyam): descendant of him. Whitney 1208 calls it the immensely large class of derivatives that mean having a relation to the primitive. The names of the months in the course are vṛddhi derivatives from names of lunar mansions: Pāṇini 4.2.3 says नक्षत्रेण युक्तः कालः (nakṣatreṇa yuktaḥ kālaḥ), the time joined with a constellation, which is the sense of these names. Wiktionary calls पौष (pauṣa) a vṛddhi derivative of puṣya, माघ (māgha) of maghā, फाल्गुन (phālguna) of phalguna and वैशाख (vaiśākha) of viśākhā. The suffixes -tā and -tva make abstract nouns: Pāṇini 5.1.119 (read on GRETIL: tasya bhāvas tva-talau, the state of it, with tva and tal) and Whitney 1237 and 1239 say that -tā makes feminine and -tva neuter abstracts, of the same value. The suffix -mat or -vat is matup: Pāṇini 5.2.94 says तद् अस्य अस्ति अस्मिन् इति मतुप् (tad asya asti asmin iti matup): matup in the sense that it has it, or it is in it. Whitney 1233 and 1235 call the possessives in vant and mant very numerous. After a stem like hima the suffix is -vat, after a stem like āyus it is -mat; Pāṇini 8.2.9 deals with the change of mat to vat and is m-ād-upadhāyāś ca mator vo 'yava-ādibhyaḥ on GRETIL. The suffix -maya means made of or abounding in: Pāṇini 5.4.21 says तत् प्रकृतवचने मयट् (tat prakṛtavacane mayaṭ), maya in the sense of abundance of it, and Whitney 1225 says it forms adjectives meaning made or composed or consisting of. The Whitney examples in the table are from Whitney 1211, 1215, 1225, 1235, 1237 and 1239."
