native: { code: "en", iso639_3: "eng", name: "English" }
name: "The present tense of verbs of the first class"
description: "The present stem and the nine active forms of the present tense, three persons in three numbers, for the verbs of the bhū class, with an overview of all ten classes of verbs. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["grammar", "unreviewed"]
table:
  slot_name: "person and number"
  slots:
    "stem": "present stem"
    "p3-sg": "third person singular (he, she, it)"
    "p3-du": "third person dual (the two of them)"
    "p3-pl": "third person plural (they)"
    "p2-sg": "second person singular (you)"
    "p2-du": "second person dual (the two of you)"
    "p2-pl": "second person plural (you all)"
    "p1-sg": "first person singular (I)"
    "p1-du": "first person dual (the two of us)"
    "p1-pl": "first person plural (we)"
rules:
  "sa-rule-present-stem":
    name: "Present stem: the root and its class"
    explanation: "The present tense is called laṭ: Pāṇini 3.2.123 says {1}, laṭ for the present. A present stem is the root made ready for the endings, and the class of the verb decides how. In the first class, the bhū class, the sign {2} (Pāṇini 3.1.68) adds an a, and the root is strengthened to guṇa: {4} gives {5}. Pāṇini 1.3.1 says {3}, the roots beginning with bhū, and the tradition names each class after its first root. The ten classes in the traditional order, each with its first root and its present stem (Whitney 603 to 607): 1, {4} gives {5}; 2, {6} gives {7}; 3, {8} gives {9}; 4, {10} gives {11}; 5, {12} gives {13}; 6, {14} gives {15}; 7, {16} gives {17}; 8, {18} gives {19}; 9, {20} gives {21}; 10, {22} gives {23}. Only the first class is taught in this lesson."
  "sa-rule-present-third":
    name: "Third person: -ti, -taḥ, -anti"
    explanation: "The endings of the third person, he, she or it, the two of them and they, are -ti, -taḥ and -anti, added to the stem: {1}, {2}, {3}. Before -anti the a of the stem and the a of the ending run together into one a. Pāṇini's rule for the present is laṭ (3.2.123), and the active endings are those of Whitney 553."
  "sa-rule-present-second":
    name: "Second person: -si, -thaḥ, -tha"
    explanation: "The endings of the second person, you, the two of you and you all, are -si, -thaḥ and -tha: {1}, {2}, {3}. They are added to the stem unchanged (Whitney 553)."
  "sa-rule-present-first":
    name: "First person: -āmi, -āvaḥ, -āmaḥ"
    explanation: "The endings of the first person, I, the two of us and we, are -mi, -vaḥ and -maḥ, and the a of the stem is lengthened before them: {1}, {2}, {3}. The ending is not -āmasi: that longer form is Vedic and is not taught here (Whitney 548)."
