tags: ["grammar", "unreviewed"]
table:
  slot_name: "gerund or infinitive"
  slots:
    "ktva": "gerund in -tvā (having done)"
    "lyap": "gerund in -ya with the prefix pra (having done, with a prefix)"
    "tum": "infinitive in -tum (to do)"
rules:
  "sa-rule-absolutive-ktva":
    name: "Gerund in -tvā (ktvā): having done"
    explanation: "Pāṇini 3.4.21, {1} (as typed on the page), gives the suffix ktvā for an earlier action of the doer who does the main action. Whitney 989 calls the result the gerund: a stereotyped case, used as a modifier of the doer for an action that goes before the action of the verb: {2} (having gone, he reads); the word for he loses its visarga before g by 6.1.132, {3}, as typed. Whitney 991 says -tvā is added directly to the root or with the joining i, as the passive participle does, so {4} gives {5}, {6} gives {7} (the nasal dropped), {8} gives {9}, and {10} gives {11} with the i; a root in ā weakens as in the participle: {12} gives {13}, {14} gives {15}, and {16} gives only {17} (991 b). It is used only of a simple verb, not one with a prefix."
  "sa-rule-absolutive-lyap":
    name: "Gerund with a prefix (lyap): -ya and -tya"
    explanation: "Pāṇini 7.1.37, {1}, as typed on the page, puts lyap in place of ktvā when the root is joined with a prefix (or another element) and not with the negative a. Whitney 990 and 992 give the result: -ya added directly to the weak root, so that a root ending in a short vowel takes tya, because 6.1.71, {2}, adds t after a short vowel before a suffix with p: with the prefix pra, {3} gives {4}, {5} gives {6} and {7} gives {8}. A root in ā takes āya: {9}, {10}, {11}. A root in am or an that makes its participle in ata makes the gerund in atya, as {12} (Whitney 992 a), and later also in amya, as {13}. The root vad is weak: Whitney 992 b has údya, which with pra becomes {14} (a and u make o), and vah and vas likewise give {15} and {16}. Every cell of this column uses the prefix pra, as a model; any other prefix goes in its place."
  "sa-rule-infinitive-tum":
    name: "Infinitive in -tum (tumun): to do"
    explanation: "Pāṇini 3.3.10, {1}, and 3.3.158, {2}, as typed on the page, give tumun for an action that is the purpose of another or the object of a wish, with one doer. Whitney 968 says the later language has one infinitive, the accusative of a verbal noun in tu, the root has guṇa and takes the joining i where the passive participle does (968 a): {3} gives {4}, {5} gives {6}, {7} gives {8}, {9} gives {10}, and {11} gives {12}, where the i is taken against the participle (968 e). It goes with verbs of wishing and ability: {13} (he wants to read), and Whitney 988 notes that it can have a passive sense."
