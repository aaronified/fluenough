name: "Gerunds and infinitives: -tvā, -ya and -tum"
description: "The gerunds (having done, with and without a prefix) and the infinitive (to do) of the verbs of the course, with the sūtras and the change of the root. Forms Wiktionary does not list are made by the rules and marked derived in the review queue. Not yet checked by a Sanskrit speaker: please report any mistake."
