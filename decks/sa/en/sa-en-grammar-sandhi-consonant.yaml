  slot_name: "result"
  slots: { "joined": "joined by sandhi" }
  entries:
    "tat-ca": "t before c becomes c, ścutva sandhi, Pāṇini 8.4.40, Whitney §202"
    "gunin-jayah": "n before j becomes ñ, ścutva sandhi, Pāṇini 8.4.40, Whitney §202 b"
    "tat-tika": "t before ṭ becomes ṭ, ṣṭutva sandhi, Pāṇini 8.4.41, Whitney §199 a"
    "patat-dayate": "t before ḍ becomes ḍ, ṣṭutva sandhi, Pāṇini 8.4.41, Whitney §199 a"
    "sat-gunah": "t before a voiced sound becomes d, jaśtva sandhi, Pāṇini 8.2.39, Whitney §159"
    "prak-eva": "k before a vowel becomes g, jaśtva sandhi, Pāṇini 8.2.39, Whitney §159"
    "sat-ete": "ṭ before a vowel becomes ḍ, jaśtva sandhi, Pāṇini 8.2.39, Whitney §159"
    "ap-dhih": "p before dh becomes b, jaśtva sandhi, Pāṇini 8.2.39, Whitney §159"
