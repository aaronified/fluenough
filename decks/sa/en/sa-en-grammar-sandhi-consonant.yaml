  notes: "What is joined, and by which sūtra of the Aṣṭādhyāyī. Each pair and its joined form is as the Sanskrit Wikipedia page on sandhi writes it, and each rule is confirmed in Whitney, Sanskrit Grammar (1889), whose section number is in the entry: §159 final stops before sonants (sad aśitayaḥ, tristub api), §161 before nasals (vāṅmaya), §189 and 190 the change of n to ṇ (rudreṇa), §199 a dental before a lingual (tat-ṭīkā, tad ḍayate), §202 and 203 before palatals (uc carati, tac chrutvā), §208 final n before c, t (devāṃś ca, kumārāṃs trīn), §210 the doubled nasal (udyann ādityaḥ), §213 final m (it becomes the nasal of the next row, and before y, v an anusvāra or nasal semivowel) and §227 ch after a vowel; the last two rows are the instrumental of Rāma and deva as the a-stems unit gives it. Ścutva, 8.4.40: स्तोः श्चुना श्चुः (stoḥ ścunā ścuḥ), an s or a dental stop (t, th, d, dh, n) meeting ś or a palatal (c, ch, j, jh, ñ) becomes ś or the palatal of its own row. Ṣṭutva, 8.4.41: ष्टुना ष्टुः (ṣṭunā ṣṭuḥ) as the Sanskrit Wikipedia page types it (the sūtra page types it with hyphens), the same with ṣ or a retroflex (ṭ, ṭh, ḍ, ḍh, ṇ): the dental becomes the retroflex of its row. Jaśtva, 8.2.39: झलां जशः अन्ते (jhalāṃ jaśaḥ ante), at the end of a word a stop that is the first letter of its row (k, ṭ, t, p) becomes the third letter of the row, the unaspirated voiced stop (g, ḍ, d, b), as the Sanskrit Wikipedia page puts it; the sūtra itself names the wider group of sounds called jhal. The page of the sūtras types it as written here. Nasal sandhi, 8.4.45: यरोनुनासिकेऽनुनासिको वा (yaronunāsike'nunāsiko vā) as the Sanskrit Wikipedia page types it (the sūtra page types it with errors), a word-final stop before a nasal may become the nasal of its row; it is optional in the sūtra, and the examples show the form that is written. Anusvāra, 8.3.23: मोऽनुस्वारः (mo'nusvāraḥ), a word-final m before a consonant becomes the anusvāra, ṃ; the page of the sūtras types it मः अनुस्वारः (maḥ anusvāraḥ). Parasavarṇa, 8.4.58: अनुस्वारस्य ययि परसवर्णः (anusvārasya yayi parasavarṇaḥ) as the Sanskrit Wikipedia page types it, an anusvāra before a consonant of the five rows becomes the nasal of that row (ṅ, ñ, ṇ, n or m); the sūtra page types this sūtra with errors, so its number is given and its text is the Wikipedia page's. Ṅamuṭ, 8.3.32: ङमो ह्रस्वादचि ङमुण्नित्यम् (ṅamo hrasvādaci ṅamuṇnityam) as the Sanskrit Wikipedia page types it (the sūtra page splits it as ङमः ह्रस्वात् अचि ङमुट् नित्यम् (ṅamaḥ hrasvāt aci ṅamuṭ nityam)), a final ṅ, ṇ or n after a short vowel and before a vowel is doubled. Final n before c, ṭ or t, 8.3.7: नः छवि अप्रशान् (naḥ chavi apraśān), the n becomes the anusvāra and a sibilant of the class of the next sound is added (then ś by 8.4.40 or s by 8.3.34). Chatva, 8.4.63: शः छः अटि (śaḥ chaḥ aṭi), ś after a stop becomes ch before a vowel or before h, y, v, r or l, as the Sanskrit Wikipedia page lists them (the sūtra says aṭ); together with 8.4.40 (t before ś becomes c) this gives cch in the written form. Tuk, 6.1.73: छे च (che ca), a short vowel before ch takes a t between them, which then becomes c (8.4.40), so the writing has cch; 6.1.76, पदान्ताद्वा (padāntādvā) as the Sanskrit Wikipedia page types it (the sūtra page types पद अन्तात् वा (pada antāt vā)), makes this optional after a long vowel at the end of a word, so both written forms are right. Retroflex sandhi, 8.4.1: after r or ṣ in the same word the n becomes ṇ; the sūtra page types its text wrongly, so only the number and the meaning are given here. It is the change the a-stems unit shows in रामेण (rāmeṇa) against देवेन (devena). The Sanskrit Wikipedia page also names the sounds by their traditional rule names, each one a rule of the table above. In the course: the parts तत् (tat), च (ca), एव (eva), एवम् (evam), षट् (ṣaṭ), एतत् (etat), अनु (anu), मात्रा (mātrā), रामः (rāmaḥ) and देवः (devaḥ) are taught as cards; the other parts are taught by this lesson alone. The compounds षण्मुखः (ṣaṇmukhaḥ) (षट् (ṣaṭ) and मुख (mukha)) and वाङ्मयः (vāṅmayaḥ) are also entries of en.wiktionary, whose etymology lines name the same two parts."
