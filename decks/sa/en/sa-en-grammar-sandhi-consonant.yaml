    "kurvan-eva": "a final n after a short vowel and before a vowel is doubled, ṅamuṭ sandhi, Pāṇini 8.3.32, Whitney §210"
    "pratyan-atma": "a final ṅ after a short vowel and before a vowel is doubled, ṅamuṭ sandhi, Pāṇini 8.3.32, Whitney §210"
    "tat-sivah": "t before ś becomes c and the ś becomes ch, chatva sandhi, Pāṇini 8.4.40 and 8.4.63, Whitney §203"
    "etat-sastram": "t before ś becomes c and the ś becomes ch, chatva sandhi, Pāṇini 8.4.40 and 8.4.63, Whitney §203"
    "ut-svasah": "t before ś becomes c and the ś becomes ch, chatva sandhi, Pāṇini 8.4.40 and 8.4.63, Whitney §203"
    "anu-chedah": "a t is added between a short vowel and ch, tuk sandhi, Pāṇini 6.1.73, Whitney §227"
    "vrksa-chaya": "a t is added between a short vowel and ch, tuk sandhi, Pāṇini 6.1.73, Whitney §227"
    "matra-chandah": "after a long vowel the t is added or not, as you choose, Pāṇini 6.1.76, Whitney §227"
