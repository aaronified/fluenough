name: "Consonant sandhi: a consonant meeting a sound"
description: "How the last sound of a word or part changes before the next sound when it is a consonant or an anusvāra: voicing, nasals, the palatal and retroflex changes, the doubled nasal, ch and the added t, each with its sūtra of Pāṇini. Not yet checked by a Sanskrit speaker: please report any mistake."
