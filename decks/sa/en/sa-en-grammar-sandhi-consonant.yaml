    "ut-nasah": "t before n becomes n, nasal sandhi, Pāṇini 8.4.45, Whitney §161"
    "devam-vande": "m before a consonant becomes the anusvāra ṃ, Pāṇini 8.3.23, Whitney §213 d, f"
    "evam-rupena": "m before a consonant becomes the anusvāra ṃ, Pāṇini 8.3.23, Whitney §213 e"
