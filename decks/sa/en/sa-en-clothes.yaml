  "sa-1781":
    native: "Rag, garment."
    notes:
      "n1": "An a-stem noun: its full set of case forms is in the a-stems table of the grammar rules."
      "n2": "The dictionary stem is चीर (cīra); the card shows the isolated nominative singular चीरः (cīraḥ)."
      "n3": "Written apart: A final अः (aḥ) before a voiced consonant becomes ओ (o) (Whitney 175 a; Aṣṭādhyāyī 6.1.113 and 6.1.114). A final अः (aḥ) before अ (a) becomes ओ (o) and the अ (a) is shown by the avagraha ऽ (Whitney 175 a)."
    bases:
      "चीरः": "rag, garment"
    examples:
      "चीरो रक्तः":
        native: "The rag is red."
        bases:
          "चीरो": "rag, garment"
          "रक्तः": "red"
      "वने चीरो ऽस्ति":
        native: "There is a rag in the forest."
        bases:
          "वने": "forest (locative)"
          "चीरो": "rag, garment"
          "ऽस्ति": "is"
