cards:
  "sa-3220":
    native: "The door is blue and the house is old."
    bases: { "द्वारं": "door", "नीलं": "dark blue", "भवति": "to be (is)", "गृहं": "house", "पुराणं": "old" }
    confusables: { "w1": { why: "Wall, not door: भित्तिः (bhittiḥ) means wall." }, "w2": { why: "Hut, not house: कुटी (kuṭī) means hut." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. द्वारम् (dvāram) is written द्वारं (dvāraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of नीलम् (nīlam) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). नीलम् (nīlam) is written नीलं (nīlaṃ), for the same reason, before भवति (bhavati). The labial keeps म् (m) in Whitney 213 a, but the anusvāra sign is the usual writing (Whitney 213 i). गृहम् (gṛham) is written गृहं (gṛhaṃ), for the same reason, before च (ca). पुराणम् (purāṇam) is written पुराणं (purāṇaṃ), for the same reason, before भवति (bhavati).", "n2": "नीलम् (nīlam) and पुराणम् (purāṇam) are neuter forms, to agree with the neuter words द्वारम् (dvāram) and गृहम् (gṛham).", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3221":
    native: "Where is the lamp and where is the bed?"
    bases: { "भवति": "to be (is)" }
    confusables: { "w1": { why: "Seat, not bed: आसनम् (āsanam) means seat." }, "w2": { why: "Well, not lamp: कूपः (kūpaḥ) means well." } }
    notes: { "n1": "भवति (bhavati) with कुत्र (kutra) asks where something is: no other word is needed.", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3222":
    native: "In the well there is water and in the vessel there is milk."
    bases: { "कूपे": "in the well", "जलं": "water", "भवति": "to be (is)", "पात्रे": "in the vessel", "क्षीरं": "milk" }
    confusables: { "w1": { why: "Foot, not vessel: पादः (pādaḥ) means foot." }, "w2": { why: "Tortoise, not well: कूर्मः (kūrmaḥ) means tortoise." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. जलम् (jalam) is written जलं (jalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of भवति (bhavati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). क्षीरम् (kṣīram) is written क्षीरं (kṣīraṃ), for the same reason, before भवति (bhavati).", "n2": "कूपे (kūpe) and पात्रे (pātre) are the locative case: it says where something is.", "n3": "भवति (bhavati) also means there is: the place comes first and then what is there.", "n4": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3223":
    native: "The palace is big and the hut is beautiful."
    bases: { "प्रासादो": "palace", "भवति": "to be (is)", "सुन्दरा": "beautiful" }
    confusables: { "w1": { why: "House, not palace: गृहम् (gṛham) means house." }, "w2": { why: "Small, not great: लघुः (laghuḥ) means small." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. प्रासादः (prāsādaḥ) is written प्रासादो (prāsādo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of महान् (mahān) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "सुन्दरा (sundarā) is the feminine of सुन्दरः (sundaraḥ), to agree with कुटी (kuṭī).", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3224":
    native: "Who is on the seat and who is on the bed?"
    bases: { "आसने": "on the seat", "को": "who", "भवति": "to be (is)", "शय्यायां": "on the bed" }
    confusables: { "w1": { why: "He, not who: सः (saḥ) means he." }, "w2": { why: "She, not who: सा (sā) means she." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. कः (kaḥ) is written को (ko) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of भवति (bhavati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). शय्यायाम् (śayyāyām) is written शय्यायां (śayyāyāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of च (ca) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "आसने (āsane) and शय्यायाम् (śayyāyām) are the locative case: it says where the one asked about is.", "n3": "का (kā) is the feminine form of कः (kaḥ): the second person asked about is a woman.", "n4": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3225":
    native: "In the courtyard the dog runs and in the house the cat lives."
    bases: { "अङ्गने": "in the courtyard", "कुक्कुरो": "dog", "धावति": "to run (runs)", "गृहे": "in the house", "मार्जारो": "cat", "वसति": "to dwell (lives)" }
    confusables: { "w1": { why: "Door, not house: द्वारम् (dvāram) means door." }, "w2": { why: "Hut, not courtyard: कुटी (kuṭī) means hut." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. कुक्कुरः (kukkuraḥ) is written कुक्कुरो (kukkuro) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of धावति (dhāvati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). मार्जारः (mārjāraḥ) is written मार्जारो (mārjāro), for the same reason, before वसति (vasati).", "n2": "अङ्गने (aṅgane) and गृहे (gṛhe) are the locative case: they say where each animal is." }
  "sa-3226":
    native: "In the house there is no pillar and in the palace there is a pillar."
    bases: { "गृहे": "in the house", "स्तम्भो": "pillar", "भवति": "to be (is)", "प्रासादे": "in the palace" }
    confusables: { "w1": { why: "Wall, not pillar: भित्तिः (bhittiḥ) means wall." }, "w2": { why: "Hut, not house: कुटी (kuṭī) means hut." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. स्तम्भः (stambhaḥ) is written स्तम्भो (stambho) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of न (na) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). स्तम्भः (stambhaḥ) is written स्तम्भो (stambho), for the same reason, before भवति (bhavati).", "n2": "गृहे (gṛhe) and प्रासादे (prāsāde) are the locative case: it says where." }
  "sa-3227":
    native: "The dog guards the house and the cat sees the mouse."
    bases: { "कुक्कुरो": "dog", "गृहं": "house", "रक्षति": "to guard (guards)", "मार्जारो": "cat", "मूषकं": "mouse", "पश्यति": "to see (sees)" }
    confusables: { "w1": { why: "Hare, not mouse: शशकः (śaśakaḥ) means hare." }, "w2": { why: "To hold, not to protect: धृ (dhṛ) means to hold." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. कुक्कुरः (kukkuraḥ) is written कुक्कुरो (kukkuro) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of गृहम् (gṛham) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). गृहम् (gṛham) is written गृहं (gṛhaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of रक्षति (rakṣati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). मार्जारः (mārjāraḥ) is written मार्जारो (mārjāro), for the same reason, before मूषकम् (mūṣakam). मूषकम् (mūṣakam) is written मूषकं (mūṣakaṃ), for the same reason, before पश्यति (paśyati). The labial keeps म् (m) in Whitney 213 a, but the anusvāra sign is the usual writing (Whitney 213 i).", "n2": "गृहम् (gṛham) and मूषकम् (mūṣakam) are the objects of the verbs, in the accusative case; the ending म् (m) marks it." }
  "sa-3228":
    native: "Father sees the door and mother sees the wall."
    bases: { "द्वारं": "door", "पश्यति": "to see (sees)", "भित्तिं": "wall" }
    confusables: { "w1": { why: "House, not door: गृहम् (gṛham) means house." }, "w2": { why: "Pillar, not wall: स्तम्भः (stambhaḥ) means pillar." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. द्वारम् (dvāram) is written द्वारं (dvāraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पश्यति (paśyati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). भित्तिम् (bhittim) is written भित्तिं (bhittiṃ), for the same reason, before पश्यति (paśyati).", "n2": "भित्तिम् (bhittim) is the accusative of भित्तिः (bhittiḥ), a feminine word in इ (i): its ending is इम् (im).", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3229":
    native: "In front there is a lamp and behind there is a vessel."
    bases: { "दीपो": "lamp", "भवति": "to be (is)", "पात्रं": "vessel" }
    confusables: { "w1": { why: "Above, not in front: उपरि (upari) means above." }, "w2": { why: "Below, not behind: अधस्तात् (adhastāt) means below." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. दीपः (dīpaḥ) is written दीपो (dīpo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of भवति (bhavati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). पात्रम् (pātram) is written पात्रं (pātraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of भवति (bhavati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "अग्रे (agre) and पश्चात् (paścāt) are the words for in front and behind, taught in the directions unit." }
