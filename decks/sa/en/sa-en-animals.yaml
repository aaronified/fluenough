      "n1": "An a-stem noun: its full set of case forms is in the a-stems table of the grammar rules."
      "n2": "The dictionary stem is सिंह (siṃha); the card shows the isolated nominative singular सिंहः (siṃhaḥ)."
      "n3": "A final अः (aḥ) before a voiced consonant becomes ओ (o) (Whitney 175 a; Aṣṭādhyāyī 6.1.113 and 6.1.114). A final अः (aḥ) before अ (a) becomes ओ (o) and the अ (a) is shown by the sign ऽ (avagraha) (Whitney 175 a)."
    bases:
      "सिंहः": "lion"
    examples:
      "सिंहो विशालः":
        native: "The lion is large."
        bases:
          "सिंहो": "lion"
          "विशालः": "large"
      "वने सिंहो ऽस्ति":
        native: "There is a lion in the forest."
        bases:
          "वने": "forest (locative)"
          "सिंहो": "lion"
          "ऽस्ति": "is"
