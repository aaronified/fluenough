schema: 1
id: "sa-en-everyday-verbs"
kind: "layer"
core: "sa-everyday-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Everyday verbs"
description: "Twenty-four common verbs of the bhū class, given as roots, the form a dictionary lists: eat, drink, stand, laugh, protect, live, run, fall, sing, dig and more. Their present tense is in the present-system table. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "sa-2000":
    native: "to eat; to chew"
    notes:
      "n1": "Present stem खाद (khāda): the root with the class sign a, nothing else changed. The third person singular is खादति (khādati)."
    examples:
      "माता खादति":
        native: "The mother eats."
        bases:
          "खादति": "eats"
      "पिता तत्र खादति":
        native: "The father eats there."
        bases:
          "खादति": "eats"
  "sa-2001":
    native: "to drink"
    notes:
      "n1": "Present stem पिब (piba): the root पा (pā) is replaced by पिब (piba) in the present, so the stem does not look like the root; learn the two together. The third person singular is पिबति (pibati)."
    examples:
      "सखा तत्र पिबति":
        native: "The friend drinks there."
        bases:
          "पिबति": "drinks"
      "पिबति माता जलम्":
        native: "The mother drinks water."
        bases:
          "पिबति": "drinks"
  "sa-2002":
    native: "to stand; to stay"
    notes:
      "n1": "Present stem तिष्ठ (tiṣṭha): the root स्था (sthā) is replaced by तिष्ठ (tiṣṭha) in the present, so the stem does not look like the root; learn the two together. The third person singular is तिष्ठति (tiṣṭhati)."
    examples:
      "माता तत्र तिष्ठति":
        native: "The mother stands there."
        bases:
          "तिष्ठति": "stands"
      "स्वसा सदा तिष्ठति":
        native: "The sister always stays."
        bases:
          "तिष्ठति": "stays"
  "sa-2003":
    native: "to laugh; to smile"
    notes:
      "n1": "Present stem हस (hasa): the root with the class sign a, nothing else changed. The third person singular is हसति (hasati)."
    examples:
      "माता हसति":
        native: "The mother laughs."
        bases:
          "हसति": "laughs"
      "सखा सदा हसति":
        native: "The friend always laughs."
        bases:
          "हसति": "laughs"
  "sa-2004":
    native: "to protect; to guard"
    notes:
      "n1": "Present stem रक्ष (rakṣa): the root with the class sign a, nothing else changed. The third person singular is रक्षति (rakṣati)."
    examples:
      "माता सदा रक्षति":
        native: "The mother always protects."
        bases:
          "रक्षति": "protects"
