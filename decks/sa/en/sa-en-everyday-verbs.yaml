  "sa-2013":
    native: "to live; to be alive"
    notes:
      "n1": "Present stem जीव (jīva): the root with the class sign a, nothing else changed. जीव् (jīv) is to be alive; to live in a place is वस् (vas). The third person singular is जीवति (jīvati)."
    examples:
      "माता जीवति":
        native: "The mother is alive."
        bases:
          "जीवति": "is alive"
      "पिता जीवति":
        native: "The father is alive."
        bases:
          "जीवति": "is alive"
