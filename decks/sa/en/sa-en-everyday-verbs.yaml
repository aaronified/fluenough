    notes:
      "n1": "Present stem जप (japa): the root with the class sign a, nothing else changed. The verb is used for prayers said under the breath. The third person singular is जपति (japati)."
    examples:
      "माता सदा जपति":
        native: "The mother always murmurs prayers."
        bases:
          "जपति": "murmurs prayers"
      "पिता तत्र जपति":
        native: "The father murmurs prayers there."
        bases:
          "जपति": "murmurs prayers"
