    native: "to take; to carry off"
    notes:
      "n1": "Present stem हर (hara): the vowel ṛ of the root is strengthened to ar. The third person singular is हरति (harati)."
    examples:
      "हरति सखा पुस्तकम्":
        native: "The friend takes away the book."
        bases:
          "हरति": "takes away"
      "हरति भ्राता जलम्":
        native: "The brother takes away the water."
        bases:
          "हरति": "takes away"
  "sa-2017":
    native: "to flow; to run"
    notes:
      "n1": "Present stem सर (sara): the vowel ṛ of the root is strengthened to ar. The third person singular is सरति (sarati)."
