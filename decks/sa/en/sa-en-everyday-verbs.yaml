        native: "The father protects there."
        bases:
          "रक्षति": "protects"
  "sa-2005":
    native: "to dwell; to live in a place"
    notes:
      "n1": "Present stem वस (vasa): the root with the class sign a, nothing else changed. वस् (vas) is to live in a place, to stay somewhere; to be alive is जीव् (jīv). The third person singular is वसति (vasati)."
    examples:
      "पिता तत्र वसति":
        native: "The father lives there."
        bases:
          "वसति": "lives"
      "स्वसा दूरे वसति":
        native: "The sister lives far away."
        bases:
          "वसति": "lives"
  "sa-2006":
    native: "to bow; to bend"
    notes:
      "n1": "Present stem नम (nama): the root with the class sign a, nothing else changed. The third person singular is नमति (namati)."
    examples:
      "माता नमति":
        native: "The mother bows."
        bases:
          "नमति": "bows"
      "भ्राता तत्र नमति":
        native: "The brother bows there."
        bases:
          "नमति": "bows"
  "sa-2007":
    native: "to conquer; to win"
    notes:
      "n1": "Present stem जय (jaya): the short i of the root is strengthened to e, and e before the class sign a becomes ay, as नी (nī) gives नय (naya) in the first-class lesson. The third person singular is जयति (jayati)."
    examples:
      "सखा सदा जयति":
        native: "The friend always wins."
        bases:
          "जयति": "wins"
      "भ्राता जयति":
        native: "The brother wins."
        bases:
          "जयति": "wins"
  "sa-2008":
    native: "to remember"
    notes:
      "n1": "Present stem स्मर (smara): the vowel ṛ of the root is strengthened to ar. The third person singular is स्मरति (smarati)."
    examples:
      "माता स्मरति":
        native: "The mother remembers."
        bases:
          "स्मरति": "remembers"
      "पिता सदा स्मरति":
        native: "The father always remembers."
        bases:
          "स्मरति": "remembers"
