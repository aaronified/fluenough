        native: "Water flows."
        bases:
          "सरति": "flows"
      "तत्र सरति जलम्":
        native: "Water flows there."
        bases:
          "सरति": "flows"
  "sa-2018":
    native: "to sing"
    notes:
      "n1": "Present stem गाय (gāya): the final ai of the root becomes āy before the class sign a (ai before a vowel becomes āy, taught in the vowel sandhi lesson). The third person singular is गायति (gāyati)."
    examples:
      "माता गायति":
        native: "The mother sings."
        bases:
          "गायति": "sings"
      "स्वसा तत्र गायति":
        native: "The sister sings there."
        bases:
          "गायति": "sings"
