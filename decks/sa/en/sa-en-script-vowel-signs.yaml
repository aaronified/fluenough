id: "sa-en-script-vowel-signs"
kind: "layer"
core: "sa-script-vowel-signs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Classical Sanskrit vowel signs"
description: "The vowel signs, each shown on the consonant क (ka). Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "sa-4048":
    native: "kā, with the sign ा (ā) after the consonant: a long a"
    notes:
      "n1": "The sign ा (ā) is written after the consonant and lengthens its a."
      "n2": "A final आः (āḥ) loses its visarga before a voiced consonant or a vowel (Whitney 177)."
    examples:
      "का वार्ता?": "What is the news?"
      "आगच्छति माता।": "The mother comes."
  "sa-4049":
    native: "ki, with the sign ि (i) written before the consonant"
    notes:
      "n1": "The sign ि (i) is written before the consonant but said after it, as in किम् (kim, what)."
      "n2": "A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign. Before a vowel the final म् (m) stays and is not joined to the next word: written apart, sandhi not applied (Whitney 213 a)."
    examples:
      "किम् अस्ति?": "What is there?"
      "किं पश्यसि?": "What do you see?"
  "sa-4050":
    native: "kī, with the sign ी (ī): a long i"
    notes:
      "n1": "The long sign ी (ī), as in नदी (nadī, river)."
    examples:
      "नदी गच्छति।": "The river flows."
      "कीर्तिः शुभा।": "Fame is good."
  "sa-4051":
    native: "ku, with the sign ु (u) written below the consonant"
    notes:
      "n1": "The sign ु (u) goes below the consonant, as in गुरुः (guruḥ, teacher)."
      "n2": "Written apart: Before a vowel the final म् (m) stays and is not joined to the next word: written apart, sandhi not applied (Whitney 213 a)."
    examples:
      "कुरु कर्म।": "Do the work."
      "कुशलम् अस्ति।": "All is well."
  "sa-4052":
    native: "kū, with the sign ू (ū) below the consonant: a long u"
    notes:
      "n1": "The long sign ू (ū) also goes below the consonant, as in कूपः (kūpaḥ, well)."
      "n2": "चलति कूर्मः (calati kūrmaḥ) puts कूर्मः (kūrmaḥ) last on purpose: before च (ca) a visarga becomes श् (ś) and the two words join as कूर्मश्चलति (kūrmaścalati) (Aṣṭādhyāyī 8.3.34, विसर्जनीयस्य सः (visarjanīyasya saḥ), and 8.4.40, स्तोः श्चुना श्चुः (stoḥ ścunā ścuḥ)), a junction this lesson does not teach, so the words are reordered to avoid it."
      "n3": "A final अः (aḥ) before a voiced consonant becomes ओ (o) (Whitney 175 a; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato roraplutādaplute), and 6.1.114, हशि च (haśi ca))."
    examples:
      "कूपो गभीरः।": "The well is deep."
      "चलति कूर्मः।": "The tortoise moves."
  "sa-4053":
    native: "kṛ, with the sign ृ (ṛ) below the consonant: a syllabic r"
    notes:
      "n1": "The sign ृ (ṛ) is written below the consonant, as in कृष्णः (kṛṣṇaḥ, Kṛṣṇa)."
      "n2": "A final अः (aḥ) before a voiced consonant becomes ओ (o) (Whitney 175 a; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato roraplutādaplute), and 6.1.114, हशि च (haśi ca)). Before a vowel the final म् (m) stays and is not joined to the next word: written apart, sandhi not applied (Whitney 213 a)."
    examples:
      "कृष्णो हसति।": "Kṛṣṇa laughs."
      "कृतम् अस्ति।": "It is done."
  "sa-4054":
    native: "kṝ, with the sign ॄ (ṝ): a long syllabic r, rare"
    notes:
      "n1": "The sign ॄ (ṝ) is rare, as in पितॄणाम् (pitṝṇām, of the fathers)."
      "n2": "A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign."
    examples:
      "पितॄणां स्मरणम्।": "Remembering the fathers."
      "मातॄन् स्मरामि।": "I remember the mothers."
  "sa-4055":
    native: "kḷ, with the sign ॢ (ḷ), found in one root only"
    notes:
      "n1": "The sign ॢ (ḷ) is found only in कॢप् (kḷp, to arrange)."
    examples:
      "धातुः कॢप् अस्ति।": "The root is kḷp."
      "कॢप् इति धातुः।": "Kḷp is a root."
  "sa-4056":
    native: "ke, with the sign े (e) written above the consonant"
    notes:
      "n1": "The sign े (e) is written above the consonant and is always long, as in केशः (keśaḥ, hair)."
      "n2": "A final अः (aḥ) before a voiced consonant becomes ओ (o) (Whitney 175 a; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato roraplutādaplute), and 6.1.114, हशि च (haśi ca))."
    examples:
      "केशो दीर्घः।": "The hair is long."
      "केशवो गच्छति।": "Keśava goes."
  "sa-4057":
    native: "kai, with the sign ै (ai) written above the consonant"
    notes:
      "n1": "The sign ै (ai) is written above the consonant, as in कैवल्यम् (kaivalyam, liberation)."
      "n2": "A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign."
    examples:
      "कैवल्यं शुभम्।": "Liberation is auspicious."
      "कैलासः पर्वतः।": "Kailāsa is a mountain."
  "sa-4058":
    native: "ko, with the sign ो (o), a long o"
    notes:
      "n1": "The sign ो (o) has parts on both sides of the consonant, as in कोकिलः (kokilaḥ, cuckoo)."
      "n2": "A final अः (aḥ) before a voiced consonant becomes ओ (o) (Whitney 175 a; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato roraplutādaplute), and 6.1.114, हशि च (haśi ca))."
    examples:
      "कोकिलो गायति।": "The cuckoo sings."
      "को वदति?": "Who speaks?"
  "sa-4059":
    native: "kau, with the sign ौ (au)"
    notes:
      "n1": "The sign ौ (au) has parts on both sides of the consonant, as in गौः (gauḥ, cow)."
      "n2": "चरति गौः (carati gauḥ) puts गौः (gauḥ) last on purpose: before च (ca) a visarga becomes श् (ś) and the two words join as गौश्चरति (gauścarati) (Aṣṭādhyāyī 8.3.34, विसर्जनीयस्य सः (visarjanīyasya saḥ), and 8.4.40, स्तोः श्चुना श्चुः (stoḥ ścunā ścuḥ)), a junction this lesson does not teach, so the words are reordered to avoid it."
      "n3": "Written apart: Before a vowel the final म् (m) stays and is not joined to the next word: written apart, sandhi not applied (Whitney 213 a)."
    examples:
      "कौतुकम् अस्ति।": "There is curiosity."
      "चरति गौः।": "The cow grazes."
