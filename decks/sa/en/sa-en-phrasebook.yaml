schema: 1
id: "sa-en-phrasebook"
kind: "layer"
core: "sa-phrasebook"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Phrasebook: first phrases"
description: "Twenty things to say from the first day in Classical Sanskrit: greetings, blessings, yes, asking for repetition, asking what and who, and saying you know, do not know, want water and speak Sanskrit. Readings are based on IAST, the scheme the Sanskrit texts use. Several phrases are taken from Wiktionary's Sanskrit entries and are modern or conventional uses, not all attested in the classical texts. Not yet checked by a Sanskritist: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sa-0001":
    native: "Hello; a bow to you."
    notes:
      "n1": "Namaste is a bow to you, from namas (a bow) and te (to you); Wiktionary gives it as a salutation used for most purposes."
    bases:
      "नमस्ते": "a bow to you; the greeting"
  "sa-0002":
    native: "Thank you."
    notes:
      "n1": "Dhanyavāda is a noun for gratitude and an interjection for thanks, built from dhanya (good, happy) and vāda (reply, result)."
    bases:
      "धन्यवादः": "thanks; gratitude"
  "sa-0003":
    native: "Welcome."
    notes:
      "n1": "Svāgata is welcome, built from su (well), ā (here) and gata (come), and it is a noun and an adjective as well as an interjection."
    bases:
      "स्वागतम्": "welcome"
  "sa-0004":
    native: "May there be good fortune."
    notes:
      "n1": "Svasti is a blessing or well-being, and astu is the imperative of as (to be), so the phrase wishes that it may be well."
      "n2": "A final अः (aḥ) before a vowel other than अ (a) loses its visarga and the vowels stay apart (Whitney 175 c)."
    bases:
      "स्वस्ति": "well-being; a blessing"
      "अस्तु": "to be (let it be)"
  "sa-0005":
    native: "Yes."
    notes:
      "n1": "Wiktionary derives the word from the sacred syllable oṃ and glosses it as yes."
    bases:
      "आम्": "yes"
  "sa-0006":
    native: "I do not know."
    notes:
      "n1": "The negative na stands before the verb, and jānāmi is the first person singular of jñā (to know)."
      "n2": "A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign."
    bases:
      "जानामि": "to know (I know)"
  "sa-0007":
    native: "Say it again."
    notes:
      "n1": "पुनः (punaḥ) is the adverb again, and वद (vada) is the imperative of वद् (vad), to speak. The visarga of पुनः (punaḥ) comes from र् (r), so before the voiced व (va) it shows as र् (r): पुनर् वद (punar vada) (Whitney 174)."
      "n2": "The visarga of पुनः (punaḥ), अन्तः (antaḥ) and प्रातः (prātaḥ) comes from an original final र् (r), so it shows as र् (r) before a voiced consonant or a vowel (Whitney 169 a and 174)."
    bases:
      "पुनर्": "again"
      "वद": "to speak (say!)"
  "sa-0008":
    native: "Please."
    notes:
      "n1": "Kṛpayā is an adverb meaning kindly or out of kindness, and it serves as please in a polite request."
    bases:
      "कृपया": "kindly; please"
  "sa-0009":
    native: "What is this?"
    notes:
      "n1": "Kim is the interrogative pronoun what, and idam is the pronoun this."
      "n2": "Written apart: Before a vowel the final म् (m) stays and is not joined to the next word: written apart, sandhi not applied (Whitney 213 a)."
    bases:
      "किम्": "what"
      "इदम्": "this"
  "sa-0010":
    native: "Who are you?"
    notes:
      "n1": "कः (kaḥ) is the masculine nominative of किम् (kim), and असि (asi) is the second person singular of अस् (as), to be. Before अ (a) a final अः (aḥ) becomes ओ (o) and the अ (a) is shown by the sign ऽ (avagraha): को ऽसि (ko 'si) (Whitney 175 a; Aṣṭādhyāyī 6.1.113 and 6.1.114)."
      "n2": "A final अः (aḥ) before अ (a) becomes ओ (o) and the अ (a) is shown by the sign ऽ (avagraha) (Whitney 175 a)."
    bases:
      "को": "who (the masculine form of what)"
      "ऽसि": "to be (you are)"
  "sa-0011":
    native: "Where is it?"
    notes:
      "n1": "Kutra means where, and asti is the third person singular of as (to be), so it means is; the subject is understood from context."
      "n2": "A final अः (aḥ) before a vowel other than अ (a) loses its visarga and the vowels stay apart (Whitney 175 c)."
    bases:
      "कुत्र": "where"
      "अस्ति": "to be (is)"
  "sa-0012":
    native: "What is your name?"
    notes:
      "n1": "भवत् (bhavat) is the polite second person pronoun, your Honour, and भवतः (bhavataḥ) is its genitive, your; नाम (nāma) is name. Before the voiced न (na) a final अः (aḥ) becomes ओ (o): भवतो नाम (bhavato nāma) (Whitney 175 a; Aṣṭādhyāyī 6.1.113 and 6.1.114)."
      "n2": "A final अः (aḥ) before a voiced consonant becomes ओ (o) (Whitney 175 a; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato roraplutādaplute), and 6.1.114, हशि च (haśi ca))."
    bases:
      "भवतो": "your (polite, of you)"
      "नाम": "name"
      "किम्": "what"
  "sa-0013":
    native: "I want water."
    notes:
      "n1": "Icchāmi is the first person singular of iṣ (to desire, wish), and jalam is its object, water."
      "n2": "Written apart: Before a vowel the final म् (m) stays and is not joined to the next word: written apart, sandhi not applied (Whitney 213 a)."
    bases:
      "इच्छामि": "to want (I want)"
  "sa-0014":
    native: "I drink water."
    notes:
      "n1": "Pibāmi is the first person singular of pā (to drink), and jalaṃ is its accusative object."
      "n2": "A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign."
    bases:
      "पिबामि": "to drink (I drink)"
  "sa-0015":
    native: "I speak Sanskrit."
    notes:
      "n1": "Saṃskṛtaṃ is the accusative of saṃskṛta, the Sanskrit language, and vadāmi is the first person singular of vad (to speak)."
      "n2": "A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign."
    bases:
      "वदामि": "to speak (I speak)"
  "sa-0016":
    native: "I am well."
    notes:
      "n1": "कुशलः (kuśalaḥ) is an adjective meaning well or healthy, and अस्मि (asmi) is the first person singular of अस् (as), to be. Before अ (a) a final अः (aḥ) becomes ओ (o) and the अ (a) is shown by the sign ऽ (avagraha): कुशलो ऽस्मि (kuśalo 'smi) (Whitney 175 a)."
      "n2": "A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign. A final अः (aḥ) before अ (a) becomes ओ (o) and the अ (a) is shown by the sign ऽ (avagraha) (Whitney 175 a)."
    bases:
      "कुशलो": "well; healthy"
      "ऽस्मि": "to be (I am)"
  "sa-0017":
    native: "Good luck; may it go well."
    notes:
      "n1": "Śubha is an adjective meaning auspicious or good, and bhavatu is the third person singular imperative of bhū (to be), so it means let it be."
      "n2": "A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign."
    bases:
      "शुभं": "auspicious; good"
      "भवतु": "to be (let it be)"
  "sa-0018":
    native: "Do you know?"
    notes:
      "n1": "Kim here is the interrogative particle that makes a question, and jānāsi is the second person singular of jñā (to know)."
      "n2": "A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign."
    bases:
      "जानासि": "to know (you know)"
      "किम्": "question particle"
  "sa-0019":
    native: "Are you well?"
    notes:
      "n1": "असि (asi) is the second person singular of अस् (as), to be, and कुशलः (kuśalaḥ) is the same adjective as in the phrase I am well. Before अ (a) a final अः (aḥ) becomes ओ (o) and the अ (a) is shown by the sign ऽ (avagraha): कुशलो ऽसि (kuśalo 'si) (Whitney 175 a)."
      "n2": "A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign. A final अः (aḥ) before अ (a) becomes ओ (o) and the अ (a) is shown by the sign ऽ (avagraha) (Whitney 175 a)."
    bases:
      "कुशलो": "well; healthy"
      "ऽसि": "to be (you are)"
  "sa-0020":
    native: "I am going."
    notes:
      "n1": "Gacchāmi is the first person singular of gam (to go)."
      "n2": "A final म् (m) before a consonant is written ं (ṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i), also before a labial such as प (pa) or म (ma), where Whitney 213 a would keep म् (m) but texts write the anusvāra sign."
    bases:
      "गच्छामि": "to go (I go)"
