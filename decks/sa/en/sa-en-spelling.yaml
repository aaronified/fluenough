schema: 1
id: "sa-en-spelling"
kind: "layer"
core: "sa-spelling"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Classical Sanskrit spellings, with a nasal letter or a dot"
license: "CC-BY-SA-4.0"
description: "Many books write the nasal before a stop as its own letter, and many write it as the dot above. Both spell the same word, said the same way, so you meet both. Recognition only. Not yet checked by a Sanskrit speaker: please report any mistake."
tags: ["advanced", "unreviewed", "script"]
cards:
  "sa-4102":
    native: "limb; a part of the body"
    notes:
      "n1": "Written with a nasal letter before its own row; the same word is also written अंग (aṃga), with the dot above. The sound is the same, and the reading writes the nasal letter ṅ here and ṃ there."
  "sa-4103":
    native: "the Ganges; the river as a goddess"
    notes:
      "n1": "Written with a nasal letter before its own row; the same word is also written गंगा (gaṃgā), with the dot above. The sound is the same, and the reading writes the nasal letter ṅ here and ṃ there."
  "sa-4104":
    native: "assembly; community; a group"
    notes:
      "n1": "Written with a nasal letter before its own row; the same word is also written संघ (saṃgha), with the dot above. The sound is the same, and the reading writes the nasal letter ṅ here and ṃ there."
  "sa-4105":
    native: "Śaṅkara, a name of Śiva"
    notes:
      "n1": "Written with a nasal letter before its own row; the same word is also written शंकर (śaṃkara), with the dot above. The sound is the same, and the reading writes the nasal letter ṅ here and ṃ there."
