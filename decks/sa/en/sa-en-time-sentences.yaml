tags: ["unreviewed"]
cards:
  "sa-3090":
    native: "In the morning father reads and in the evening mother sings."
    bases: { "पठति": "to read (reads)", "सायं": "in the evening", "गायति": "to sing (sings)" }
    confusables: { "w1": { why: "At night, not in the morning: रात्रौ (rātrau) means at night." }, "w2": { why: "Brother, not father: भ्राता (bhrātā) means brother." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सायम् (sāyam) is written सायं (sāyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of च (ca) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3091":
    native: "Where does father stand at night?"
    bases: { "तिष्ठति": "to stand (stands)" }
    confusables: { "w1": { why: "For a long time, not at night: चिरम् (ciram) means for a long time." }, "w2": { why: "Brother, not father: भ्राता (bhrātā) means brother." } }
  "sa-3092":
    native: "Now we read and at night we do not read."
    bases: { "वयं": "we", "पठामो": "to read (we read)", "पठामः": "to read (we read)" }
    confusables: { "w1": { why: "Formerly, not now: पुरा (purā) means formerly." }, "w2": { why: "You all, not we: यूयम् (yūyam) means you all." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वयम् (vayam) is written वयं (vayaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पठामः (paṭhāmaḥ) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). पठामः (paṭhāmaḥ) is written पठामो (paṭhāmo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of रात्रौ (rātrau) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3093":
    native: "Now she sings and the friend laughs for a long time."
    bases: { "गायति": "to sing (sings)", "चिरं": "for a long time", "हसति": "to laugh (laughs)" }
    confusables: { "w1": { why: "Formerly, not now: पुरा (purā) means formerly." }, "w2": { why: "That, not she: तत् (tat) means that." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. चिरम् (ciram) is written चिरं (ciraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of च (ca) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3094":
    native: "The rain brings water and the night is cold."
    bases: { "जलं": "water", "नयति": "to bring (brings)", "शीता": "cold (feminine)", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Fire, not water: अग्निः (agniḥ) means fire." }, "w2": { why: "To eat, not to bring: खाद् (khād) means to eat." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. जलम् (jalam) is written जलं (jalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of नयति (nayati) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "शीता (śītā) is the feminine of शीतः (śītaḥ), to agree with निशा (niśā).", "n3": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3095":
    native: "What time is it and when does father read?"
    bases: { "भवति": "to be (is)", "पठति": "to read (reads)" }
    confusables: { "w1": { why: "To go, not to be: गम् (gam) means to go." }, "w2": { why: "Brother, not father: भ्राता (bhrātā) means brother." } }
    notes: { "n1": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3096":
    native: "At night the rain is cold and in the morning father reads."
    bases: { "शीता": "cold (feminine)", "भवति": "to be (is)", "पठति": "to read (reads)" }
    confusables: { "w1": { why: "For a long time, not at night: चिरम् (ciram) means for a long time." }, "w2": { why: "Hot, not cold: उष्णः (uṣṇaḥ) means hot." } }
    notes: { "n1": "शीता (śītā) is the feminine of शीतः (śītaḥ), to agree with वर्षा (varṣā).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3097":
    native: "The friend reads for a long time and the brother eats in the evening."
    bases: { "चिरं": "for a long time", "पठति": "to read (reads)", "सायं": "in the evening", "खादति": "to eat (eats)" }
    confusables: { "w1": { why: "Now, not for a long time: अधुना (adhunā) means now." }, "w2": { why: "Son, not friend: सूनुः (sūnuḥ) means son." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. चिरम् (ciram) is written चिरं (ciraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of सखा (sakhā) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). सायम् (sāyam) is written सायं (sāyaṃ), for the same reason, before च (ca).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
