tags: ["unreviewed"]
cards:
  "sa-3090":
    native: "Today in the morning."
    confusables: { "w1": { why: "Evening, not morning: सायम् (sāyam) means in the evening." }, "w2": { why: "At night, not morning: रात्रौ (rātrau) means at night." } }
  "sa-3091":
    native: "I drink in the evening."
    bases: { "सायं": "in the evening", "पिबामि": "to drink (I drink)" }
    confusables: { "w1": { why: "Morning, not evening: प्रातः (prātaḥ) means in the morning." }, "w2": { why: "At night, not evening: रात्रौ (rātrau) means at night." } }
  "sa-3092":
    native: "He goes at night."
    bases: { "गच्छति": "to go (he goes)" }
    confusables: { "w1": { why: "Before, not at night: पूर्वम् (pūrvam) means before." }, "w2": { why: "Evening, not at night: सायम् (sāyam) means in the evening." } }
  "sa-3093":
    native: "He reads now."
    bases: { "पठति": "to read (he reads)" }
    confusables: { "w1": { why: "Formerly, not now: पुरा (purā) means formerly." }, "w2": { why: "When, not now: यदा (yadā) means when." } }
  "sa-3094":
    native: "When is the rain?"
    confusables: { "w1": { why: "Season, not rain: ऋतुः (ṛtuḥ) means season." }, "w2": { why: "Dawn, not rain: उषा (uṣā) means dawn." } }
  "sa-3095":
    native: "I go for a long time."
    bases: { "चिरं": "for a long time", "गच्छामि": "to go (I go)" }
    confusables: { "w1": { why: "Formerly, not for a long time: पुरा (purā) means formerly." }, "w2": { why: "Now, not for a long time: अधुना (adhunā) means now." } }
