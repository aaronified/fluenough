cards:
  "sa-3100":
    native: "Water is everywhere."
    confusables: { "w1": { why: "Here, not everywhere: इह (iha) means here." }, "w2": { why: "Outside, not everywhere: बहिः (bahiḥ) means outside." } }
  "sa-3101":
    native: "I drink outside."
    bases: { "पिबामि": "to drink (I drink)" }
    confusables: { "w1": { why: "Inside, not outside: अन्तः (antaḥ) means inside." }, "w2": { why: "Far away, not outside: दूरे (dūre) means far away." } }
  "sa-3102":
    native: "I go elsewhere."
    bases: { "गच्छामि": "to go (I go)" }
    confusables: { "w1": { why: "Everywhere, not elsewhere: सर्वत्र (sarvatra) means everywhere." }, "w2": { why: "Far away, not elsewhere: दूरे (dūre) means far away." } }
  "sa-3103":
    native: "The water is far away."
    bases: { "जलं": "water" }
    confusables: { "w1": { why: "Inside, not far away: अन्तः (antaḥ) means inside." }, "w2": { why: "Here, not far away: इह (iha) means here." } }
  "sa-3104":
    native: "The cow is in between."
    confusables: { "w1": { why: "Below, not between: अधः (adhaḥ) means below." }, "w2": { why: "Horse, not cow: अश्वः (aśvaḥ) means horse." } }
  "sa-3105":
    native: "He stands here."
    bases: { "तिष्ठति": "to stand (he stands)" }
    confusables: { "w1": { why: "Outside, not here: बहिः (bahiḥ) means outside." }, "w2": { why: "Everywhere, not here: सर्वत्र (sarvatra) means everywhere." } }
