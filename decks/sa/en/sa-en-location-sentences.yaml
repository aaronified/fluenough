cards:
  "sa-3100":
    native: "Water is everywhere and father reads outside."
    bases: { "जलं": "water", "भवति": "to be (is)", "पठति": "to read (reads)" }
    confusables: { "w1": { why: "Here, not everywhere: इह (iha) means here." }, "w2": { why: "Fire, not water: अग्निः (agniḥ) means fire." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. जलम् (jalam) is written जलं (jalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of भवति (bhavati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3101":
    native: "Inside father reads and outside the friend reads."
    bases: { "पठति": "to read (reads)" }
    confusables: { "w1": { why: "Far away, not inside: दूरे (dūre) means far away." }, "w2": { why: "Brother, not father: भ्राता (bhrātā) means brother." } }
    notes: { "n1": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3102":
    native: "Mother goes elsewhere and father stays there."
    bases: { "गच्छति": "to go (goes)", "तिष्ठति": "to stand (stands)" }
    confusables: { "w1": { why: "In one place, not elsewhere: एकत्र (ekatra) means in one place." }, "w2": { why: "Brother, not mother: भ्राता (bhrātā) means brother." } }
    notes: { "n1": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3103":
    native: "Water flows far away and father goes there."
    bases: { "जलं": "water", "सरति": "to flow (flows)", "गच्छति": "to go (goes)" }
    confusables: { "w1": { why: "Fire, not water: अग्निः (agniḥ) means fire." }, "w2": { why: "Elsewhere, not far away: अन्यत्र (anyatra) means elsewhere." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. जलम् (jalam) is written जलं (jalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of दूरे (dūre) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3104":
    native: "There you all read and we read everywhere."
    bases: { "यूयं": "you all", "पठथ": "to read (you all read)", "वयं": "we", "पठामः": "to read (we read)" }
    confusables: { "w1": { why: "Now, not there: इदानीम् (idānīm) means now." }, "w2": { why: "I, not you all: अहम् (aham) means I." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. यूयम् (yūyam) is written यूयं (yūyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पठथ (paṭhatha) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). वयम् (vayam) is written वयं (vayaṃ), for the same reason, before पठामः (paṭhāmaḥ). The labial keeps म् (m) in Whitney 213 a, but the anusvāra sign is the usual writing (Whitney 213 i).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3105":
    native: "The gods read in one place and father goes there."
    bases: { "देवाः": "gods", "पठन्ति": "to read (they read)", "गच्छति": "to go (goes)" }
    confusables: { "w1": { why: "Below, not in one place: अधः (adhaḥ) means below." }, "w2": { why: "Cow, not god: गौः (gauḥ) means cow." } }
    notes: { "n1": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3106":
    native: "Below there is water and father reads there."
    bases: { "अधो": "below", "जलं": "water", "भवति": "to be (is)", "पठति": "to read (reads)" }
    confusables: { "w1": { why: "Everywhere, not below: सर्वत्र (sarvatra) means everywhere." }, "w2": { why: "Fire, not water: अग्निः (agniḥ) means fire." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अधः (adhaḥ) is written अधो (adho) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of जलम् (jalam) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato roraplutādaplute), and 6.1.114, हशि च (haśi ca)). जलम् (jalam) is written जलं (jalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of भवति (bhavati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
  "sa-3107":
    native: "Here father reads and there mother sings."
    bases: { "पठति": "to read (reads)", "गायति": "to sing (sings)" }
    confusables: { "w1": { why: "Outside, not here: बहिः (bahiḥ) means outside." }, "w2": { why: "Brother, not father: भ्राता (bhrātā) means brother." } }
    notes: { "n1": "च (ca) means and: it never starts the part it joins, but follows its first word or a later one." }
