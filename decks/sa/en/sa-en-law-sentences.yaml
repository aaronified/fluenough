cards:
  "sa-3970":
    native: "In the court the judge does justice."
    bases: { "न्यायालये": "in the court", "परीक्षको": "judge", "न्यायं": "justice", "करोति": "to do (does)" }
    confusables: { "w1": { why: "Member of an assembly or council, not judge: सदस्यः (sadasyaḥ) means member of an assembly or council." }, "w2": { why: "Council, not court: परिषत् (pariṣat) means council." }, "w3": { why: "Decision, not justice: निर्णयः (nirṇayaḥ) means decision." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. परीक्षकः (parīkṣakaḥ) is written परीक्षको (parīkṣako) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of न्यायं (nyāyaṃ) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). न्यायम् (nyāyam) is written न्यायं (nyāyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of करोति (karoti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "न्यायालये (nyāyālaye) is the locative case of न्यायालयः (nyāyālayaḥ): in the court. न्यायम् करोति (nyāyam karoti) means does justice, that is, judges." }
  "sa-3971":
    native: "A woman witness speaks the truth on oath."
    bases: { "शपथेन": "on oath", "सत्यं": "truth", "वदति": "to speak (speaks)" }
    confusables: { "w1": { why: "Woman who commits an offence, not witness: अपराधिनी (aparādhinī) means woman who commits an offence." }, "w2": { why: "Falsehood, not oath: अनृतम् (anṛtam) means falsehood." }, "w3": { why: "Doubt and uncertainty, not truth: संदेहः (saṃdehaḥ) means doubt and uncertainty." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सत्यम् (satyam) is written सत्यं (satyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of वदति (vadati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "शपथेन (śapathena) is the instrumental case of शपथः (śapathaḥ): by an oath. सत्यम् (satyam) is the neuter form of सत्यः (satyaḥ), used as a noun: the truth." }
  "sa-3972":
    native: "Soldiers bind the thief with a rope."
    bases: { "पाशेन": "with a rope", "चौरं": "thief", "सैनिका": "soldiers", "बध्नन्ति": "to bind (bind)" }
    confusables: { "w1": { why: "Chain or fetter, not rope: शृङ्खलः (śṛṅkhalaḥ) means chain or fetter." }, "w2": { why: "Enemy, not thief: शत्रुः (śatruḥ) means enemy." }, "w3": { why: "To trouble, not to bind: बाध् (bādh) means to trouble." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. चौरम् (cauram) is written चौरं (cauraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of सैनिका (sainikā) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). सैनिकाः (sainikāḥ) is written सैनिका (sainikā) because a final आः (āḥ) loses its visarga before a voiced consonant, here the start of बध्नन्ति (badhnanti) (Whitney 177; Aṣṭādhyāyī 8.3.17, भोभगोअघोअपूर्वस्य योऽशि (bhobhago 'ghoapūrvasya yo 'śi), in separate words भो भगो अघो अपूर्वस्य यः अशि (bho bhago agho apūrvasya yaḥ aśi), with 8.3.19, लोपः शाकल्यस्य (lopaḥ śākalyasya)).", "n2": "पाशेन (pāśena) is the instrumental case of पाशः (pāśaḥ): with a noose or rope. बध्नन्ति (badhnanti) is the third person plural of बन्ध् (bandh), a verb of the ninth class. The object comes first; the order of the words is free." }
  "sa-3973":
    native: "The debtor gives money to the rich man."
    bases: { "अधमर्णो": "debtor", "धनिकाय": "to the rich man", "धनं": "money", "ददाति": "to give (gives)" }
    confusables: { "w1": { why: "Freedom from debt, not debtor: अनृणता (anṛṇatā) means freedom from debt." }, "w2": { why: "Poor, not rich man: दरिद्रः (daridraḥ) means poor." }, "w3": { why: "To take, not to give: हृ (hṛ) means to take." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अधमर्णः (adhamarṇaḥ) is written अधमर्णो (adhamarṇo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of धनिकाय (dhanikāya) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). धनम् (dhanam) is written धनं (dhanaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of ददाति (dadāti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "धनिकाय (dhanikāya) is the dative case of धनिकः (dhanikaḥ): to the rich man. धनम् (dhanam) is the accusative case: what is given." }
  "sa-3974":
    native: "A thief tells a lie in court."
    bases: { "अनृतं": "lie", "चोरो": "thief", "न्यायालये": "in court", "वदति": "to speak (tells)" }
    confusables: { "w1": { why: "Evil, not falsehood: अघम् (agham) means evil." }, "w2": { why: "True and real, not falsehood: सत्यः (satyaḥ) means true and real." }, "w3": { why: "Cheating, not lie: वञ्चनम् (vañcanam) means cheating." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अनृतम् (anṛtam) is written अनृतं (anṛtaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of चोरो (coro) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). चोरः (coraḥ) is written चोरो (coro) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of न्यायालये (nyāyālaye) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "अनृतम् (anṛtam) is the accusative case of अनृतम् (anṛtam): the falsehood he speaks. The object comes first; the order of the words is free." }
  "sa-3975":
    native: "Violence is always a sin."
    bases: { "पातकं": "sin", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Non-violence, not violence: अहिंसा (ahiṃsā) means non-violence." }, "w2": { why: "Evil, not sin: अघम् (agham) means evil." }, "w3": { why: "Crime, not sin: अकृत्यम् (akṛtyam) means crime." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पातकम् (pātakam) is written पातकं (pātakaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of भवति (bhavati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "पातकम् (pātakam) says what violence is: a sin. It is a neuter word." }
  "sa-3976":
    native: "The president makes a decision by the rule."
    bases: { "सभापतिर्": "president", "विधानेन": "by the rule", "निर्णयं": "decision", "करोति": "to do (makes)" }
    confusables: { "w1": { why: "Overseer, not president: अध्यक्षः (adhyakṣaḥ) means overseer." }, "w2": { why: "Edict, not rule: शासनम् (śāsanam) means edict." }, "w3": { why: "Decision or settled conviction reached after inquiry, not decision: निश्चयः (niścayaḥ) means decision or settled conviction reached after inquiry." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सभापतिः (sabhāpatiḥ) is written सभापतिर् (sabhāpatir) because a final ः (ḥ) after इ (i) becomes र् (r) before a voiced sound, here the start of विधानेन (vidhānena) (Aṣṭādhyāyī 8.2.66, ससजुषो रुः (sasajuṣo ruḥ); Whitney 174). निर्णयम् (nirṇayam) is written निर्णयं (nirṇayaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of करोति (karoti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "विधानेन (vidhānena) is the instrumental case of विधानम् (vidhānam): by the rule. निर्णयम् करोति (nirṇayam karoti) means makes a decision." }
  "sa-3977":
    native: "Much wealth is lost through gambling."
    bases: { "द्यूतेन": "through gambling", "धनं": "wealth", "नश्यति": "to perish (is lost)" }
    confusables: { "w1": { why: "Stake in a game, not gambling: पणः (paṇaḥ) means stake in a game." }, "w2": { why: "Store, not wealth: निधिः (nidhiḥ) means store." }, "w3": { why: "To fall, not to perish: पद् (pad) means to fall." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. धनम् (dhanam) is written धनं (dhanaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of नश्यति (naśyati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "द्यूतेन (dyūtena) is the instrumental case of द्यूतम् (dyūtam): through gambling. नश्यति (naśyati) is the present of नश् (naś): is lost." }
  "sa-3978":
    native: "A merchant gets wealth by selling."
    bases: { "वणिग्": "merchant", "विक्रयेण": "by selling", "धनं": "wealth", "लभते": "to get (gets)" }
    confusables: { "w1": { why: "Purchase, not selling: क्रयः (krayaḥ) means purchase." }, "w2": { why: "Business, not merchant: व्यापारः (vyāpāraḥ) means business." }, "w3": { why: "To seize, not to get: ग्रह् (grah) means to seize." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वणिक् (vaṇik) is written वणिग् (vaṇig) because a final क् (k) becomes ग् (g) before a voiced sound, here the start of विक्रयेण (vikrayeṇa) (Aṣṭādhyāyī 8.2.39, झलां जशोऽन्ते (jhalāṃ jaśo 'nte), in separate words झलां जशः अन्ते (jhalāṃ jaśaḥ ante); Whitney 159). धनम् (dhanam) is written धनं (dhanaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of लभते (labhate) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "विक्रयेण (vikrayeṇa) is the instrumental case of विक्रयः (vikrayaḥ): by selling. लभते (labhate) is in the middle voice: he gets it for himself." }
  "sa-3979":
    native: "The king's code states a rule."
    bases: { "नृपस्य": "of the king", "विधानं": "rule", "वदति": "to speak (states)" }
    confusables: { "w1": { why: "Law, not rule: विधिः (vidhiḥ) means law." }, "w2": { why: "Book, not code: ग्रन्थः (granthaḥ) means book." }, "w3": { why: "To say, not to speak: ब्रू (brū) means to say." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. विधानम् (vidhānam) is written विधानं (vidhānaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of वदति (vadati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "नृपस्य (nṛpasya) is the genitive case of नृपः (nṛpaḥ): of the king. विधानम् (vidhānam) is the accusative case: what the code states." }
