schema: 1
id: "sa-en-numbers-1-20"
kind: "layer"
core: "sa-numbers-1-20"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Numbers 1 to 20"
description: "The numbers from two to twenty in Classical Sanskrit, with counting phrases: two sons, three sons, and so on up to twenty (one is taught in the first words)."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sa-1050":
    native: "Two."
    notes:
      "n1": "Two. The lemma is द्वि (dvi); द्वौ (dvau) is its masculine dual, the form taught here, and the examples use it with a dual verb or noun."
    bases:
      "द्वौ": "two (stem dvi)"
    examples:
      "द्वौ पुत्रौ":
        native: "Two sons."
        bases:
          "पुत्रौ": "son (dual)"
      "द्वौ कुरुतः":
        native: "The two of them do it."
        bases:
          "कुरुतः": "to do (they two do)"
  "sa-1051":
    native: "Three."
    notes:
      "n1": "Three. The lemma is त्रि (tri); त्रयः (trayaḥ) is its masculine plural, the form taught here, and it does not change in these examples."
    bases:
      "त्रयः": "three (stem tri)"
    examples:
      "त्रयः पुत्राः":
        native: "Three sons."
        bases:
          "पुत्राः": "son (plural)"
      "त्रयः कुर्वन्ति":
        native: "Three of them do it."
        bases:
          "कुर्वन्ति": "to do (they do)"
  "sa-1052":
    native: "Four."
    notes:
      "n1": "Four. The lemma is चतुर् (catur); चत्वारः (catvāraḥ) is its masculine plural, the form taught here, and the stem appears in compounds as catur-."
      "n2": "In these examples the words are written apart; in running text sandhi joins them where a word ends in ḥ, m, t or a vowel and the next begins with a vowel or a voiced sound."
      "n3": "A final अः (aḥ) before a voiced consonant becomes ओ (o) (Whitney 175 a; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato roraplutādaplute), and 6.1.114, हशि च (haśi ca))."
    bases:
      "चत्वारः": "four (stem catur)"
    examples:
      "चत्वारः पुत्राः":
        native: "Four sons."
        bases:
          "पुत्राः": "son (plural)"
      "चत्वारो जानन्ति":
        native: "Four know."
        bases:
          "चत्वारो": "four"
          "जानन्ति": "to know (they know)"
  "sa-1053":
    native: "Five."
    notes:
      "n1": "Five. It is invariable in the nominative, as in these examples."
    examples:
      "पञ्च पुत्राः":
        native: "Five sons."
        bases:
          "पुत्राः": "son (plural)"
      "पञ्च जानन्ति":
        native: "Five know."
        bases:
          "जानन्ति": "to know (they know)"
  "sa-1054":
    native: "Six."
