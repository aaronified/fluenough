cards:
  "sa-3080":
    native: "Father is happy and the brother is sad."
    bases: { "भवति": "to be (is)" }
    confusables: { "w1": { why: "Sister, not father: स्वसा (svasā) means sister." }, "w2": { why: "To go, not to be: गम् (gam) means to go." } }
  "sa-3081":
    native: "The horse is black and the god is holy."
    bases: { "कृष्णो": "black", "भवति": "to be (is)", "पवित्रो": "pure; holy" }
    confusables: { "w1": { why: "Rāma, not horse: रामः (rāmaḥ) means Rāma." }, "w2": { why: "Red, not black: रक्तः (raktaḥ) means red." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. कृष्णः (kṛṣṇaḥ) is written कृष्णो (kṛṣṇo) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of भवति (bhavati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). पवित्रः (pavitraḥ) is written पवित्रो (pavitro), for the same reason, before भवति (bhavati)." }
  "sa-3082":
    native: "The water is cold and the book is new."
    bases: { "जलं": "water", "शीतं": "cold", "भवति": "to be (is)", "पुस्तकं": "book", "नवं": "new" }
    confusables: { "w1": { why: "Fire, not water: अग्निः (agniḥ) means fire." }, "w2": { why: "Hot, not cold: उष्णः (uṣṇaḥ) means hot." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. जलम् (jalam) is written जलं (jalaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of शीतम् (śītam) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). शीतम् (śītam) is written शीतं (śītaṃ), for the same reason, before भवति (bhavati). पुस्तकम् (pustakam) is written पुस्तकं (pustakaṃ), for the same reason, before नवम् (navam). नवम् (navam) is written नवं (navaṃ), for the same reason, before भवति (bhavati).", "n2": "शीतम् (śītam) and नवम् (navam) are neuter forms, to agree with the neuter जलम् (jalam) and पुस्तकम् (pustakam)." }
  "sa-3083":
    native: "I read a new book and I do not read an old book."
    bases: { "नवं": "new", "पुस्तकं": "book", "पठामि": "to read (I read)", "पुराणं": "old" }
    confusables: { "w1": { why: "Cold, not new: शीतः (śītaḥ) means cold." }, "w2": { why: "Student, not book: शिष्यः (śiṣyaḥ) means student." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. नवम् (navam) is written नवं (navaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पुस्तकम् (pustakam) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). पुस्तकम् (pustakam) is written पुस्तकं (pustakaṃ), for the same reason, before पठामि (paṭhāmi). पुराणम् (purāṇam) is written पुराणं (purāṇaṃ), for the same reason, before पुस्तकम् (pustakam). पुस्तकम् (pustakam) is written पुस्तकं (pustakaṃ), for the same reason, before न (na)." }
  "sa-3084":
    native: "That happy woman sings and that happy man laughs."
    bases: { "सुखिनी": "happy (feminine)", "गायति": "to sing (sings)", "स": "he", "हसति": "to laugh (laughs)" }
    confusables: { "w1": { why: "That, not she: तत् (tat) means that." }, "w2": { why: "To dig, not to sing: खन् (khan) means to dig." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सः (saḥ) is written स (sa) because सः (saḥ) and एषः (eṣaḥ) lose their visarga before any consonant, here the start of सुखी (sukhī) (Whitney 176 a; Aṣṭādhyāyī 6.1.132).", "n2": "सुखिनी (sukhinī) is the feminine of सुखी (sukhī), to agree with सा (sā)." }
  "sa-3085":
    native: "I am happy and you are sad."
    bases: { "अहं": "I", "भवामि": "to be (I am)", "त्वं": "you", "भवसि": "to be (you are)" }
    confusables: { "w1": { why: "He, not I: सः (saḥ) means he." }, "w2": { why: "To go, not to be: गम् (gam) means to go." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अहम् (aham) is written अहं (ahaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of सुखी (sukhī) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). त्वम् (tvam) is written त्वं (tvaṃ), for the same reason, before दुःखी (duḥkhī)." }
  "sa-3086":
    native: "The happy brother laughs and the sad father does not laugh."
    bases: { "हसति": "to laugh (laughs)" }
    confusables: { "w1": { why: "Sister, not brother: स्वसा (svasā) means sister." }, "w2": { why: "To live, not to laugh: वस् (vas) means to live." } }
  "sa-3087":
    native: "This friend is not holy and that god is holy."
    bases: { "एष": "this one (masculine)", "पवित्रो": "pure; holy", "भवति": "to be (is)", "स": "he" }
    confusables: { "w1": { why: "This one (feminine), not this one (masculine): एषा (eṣā) means this one (feminine)." }, "w2": { why: "Son, not friend: सूनुः (sūnuḥ) means son." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. एषः (eṣaḥ) is written एष (eṣa) because सः (saḥ) and एषः (eṣaḥ) lose their visarga before any consonant, here the start of सखा (sakhā) (Whitney 176 a; Aṣṭādhyāyī 6.1.132). पवित्रः (pavitraḥ) is written पवित्रो (pavitro) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of न (na) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). सः (saḥ) is written स (sa), for the same reason, before देवः (devaḥ). पवित्रः (pavitraḥ) is written पवित्रो (pavitro), for the same reason, before भवति (bhavati)." }
  "sa-3088":
    native: "Is the book difficult?"
    bases: { "किं": "what", "पुस्तकं": "book", "कठिनं": "hard; difficult", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Who, not what: कः (kaḥ) means who." }, "w2": { why: "Student, not book: शिष्यः (śiṣyaḥ) means student." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. किम् (kim) is written किं (kiṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of पुस्तकम् (pustakam) (Aṣṭādhyāyī 8.3.23, मः अनुस्वारः (maḥ anusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). पुस्तकम् (pustakam) is written पुस्तकं (pustakaṃ), for the same reason, before कठिनम् (kaṭhinam). कठिनम् (kaṭhinam) is written कठिनं (kaṭhinaṃ), for the same reason, before भवति (bhavati).", "n2": "किम् (kim) at the start turns a statement into a yes or no question." }
