schema: 1
id: "sa-en-describing-sentences"
kind: "layer"
core: "sa-describing-sentences"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Sentences with describing words"
description: "Short sentences with the describing words of Describing, built only from words already taught. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["unreviewed"]
cards:
  "sa-3080":
    native: "The father is white."
    confusables: { "w1": { why: "Black, not white: कृष्णः (kṛṣṇaḥ) means black." }, "w2": { why: "Red, not white: रक्तः (raktaḥ) means red." } }
  "sa-3081":
    native: "The friend is beautiful."
    confusables: { "w1": { why: "Dirty, not beautiful: मलिनः (malinaḥ) means dirty." }, "w2": { why: "Pure, not beautiful: पवित्रः (pavitraḥ) means pure or holy." } }
  "sa-3082":
    native: "The husband is old."
    confusables: { "w1": { why: "New, not old: नवः (navaḥ) means new." }, "w2": { why: "Small, not old: लघुः (laghuḥ) means small." } }
  "sa-3083":
    native: "The god is holy."
    confusables: { "w1": { why: "Happy, not holy: सुखी (sukhī) means happy." }, "w2": { why: "Black, not holy: कृष्णः (kṛṣṇaḥ) means black." } }
  "sa-3084":
    native: "The horse is black."
    confusables: { "w1": { why: "Red, not black: रक्तः (raktaḥ) means red." }, "w2": { why: "Dark blue, not black: नीलः (nīlaḥ) means dark blue." } }
  "sa-3085":
    native: "She is happy."
    confusables: { "w1": { why: "Sad, not happy: दुःखी (duḥkhī) means sad." }, "w2": { why: "Beautiful, not happy: सुन्दरः (sundaraḥ) means beautiful." } }
  "sa-3086":
    native: "This one is a father."
    confusables: { "w1": { why: "He, not this one: सः (saḥ) means he or that (masculine)." }, "w2": { why: "Brother, not father: भ्राता (bhrātā) means brother." } }
