schema: 1
id: "sa-en-more-verbs"
kind: "layer"
core: "sa-more-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "More verbs"
description: "Twenty-four more common verbs, given as roots: one more of the first class, three of the first class that take the middle endings, and verbs of the second to the tenth class (go, say, give, put, see, dance, hear, write, wish, do, know, buy, take, tell and worship). The notes show how each class changes the root in the present. Not yet checked by a Sanskrit speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed"]
cards:
  "sa-2100":
    native: "to flow; to trickle"
    notes:
      "n1": "Present stem क्षर (kṣara): the root with the class sign a, nothing else changed. The third person singular is क्षरति (kṣarati)."
    examples:
      "क्षरति जलम्":
        native: "Water trickles."
        bases:
          "क्षरति": "trickles"
      "तत्र क्षरति जलम्":
        native: "Water trickles there."
        bases:
          "क्षरति": "trickles"
  "sa-2101":
    native: "to obstruct; to hold back"
    notes:
      "n1": "A verb of the seventh class (named after this very root, रुध् (rudh)). Its third person singular is रुणद्धि (ruṇaddhi): an extra nasal sound, written ṇ, comes inside the root, which en.wiktionary calls a nasal infix present. It has no row in the present-system table, which is for first-class verbs."
    examples:
      "रुणद्धि सखा जलम्":
        native: "The friend holds back the water."
        bases:
          "रुणद्धि": "holds back"
      "रुणद्धि पिता तत्":
        native: "The father holds that back."
        bases:
          "रुणद्धि": "holds back"
  "sa-2102":
    native: "to take; to get; to find"
    notes:
      "n1": "A verb of the first class that takes the middle endings (ātmanepada): the third person singular is लभते (labhate), with the ending -te in place of -ti. The middle endings are taught in the ātmanepada lesson, and the present-system table has the active forms only, so this verb has no row there."
    examples:
      "लभते माता जलम्":
        native: "The mother gets water."
        bases:
          "लभते": "gets"
      "लभते पिता पुस्तकम्":
        native: "The father gets a book."
        bases:
          "लभते": "gets"
  "sa-2103":
    native: "to turn; to be; to exist"
    notes:
      "n1": "A verb of the first class that takes the middle endings (ātmanepada): the third person singular is वर्तते (vartate). The vowel ṛ of the root is strengthened to ar, giving the stem वर्त (varta). The middle endings are taught in the ātmanepada lesson, so this verb has no row in the present-system table."
    examples:
      "माता तत्र वर्तते":
        native: "The mother is there."
        bases:
          "वर्तते": "is"
      "सखा तत्र वर्तते":
        native: "The friend is there."
        bases:
          "वर्तते": "is"
  "sa-2104":
    native: "to look at; to see"
    notes:
      "n1": "A verb of the first class that takes the middle endings (ātmanepada): the third person singular is ईक्षते (īkṣate). The middle endings are taught in the ātmanepada lesson, so this verb has no row in the present-system table. It begins with a vowel, so a word ending in ā or a does not stand before it in the examples: the verb comes first."
    examples:
      "ईक्षते माता":
        native: "The mother looks."
        bases:
          "ईक्षते": "looks"
      "ईक्षते पिता तत्र":
        native: "The father looks there."
        bases:
          "ईक्षते": "looks"
  "sa-2105":
    native: "to be"
    notes:
      "n1": "A verb of the second class (adādi): the ending is added straight to the root, as the present-system lesson says, giving the third person singular अस्ति (asti). It has no row in the present-system table, which is for first-class verbs."
    examples:
      "अस्ति माता":
        native: "There is a mother."
        bases:
          "अस्ति": "is"
      "अस्ति सखा तत्र":
        native: "A friend is there."
        bases:
          "अस्ति": "is"
  "sa-2106":
    native: "to cry; to weep"
    notes:
      "n1": "A verb of the second class (adādi): the third person singular is रोदिति (roditi), where the vowel u of the root becomes o and an i comes before the ending. It has no row in the present-system table, which is for first-class verbs."
    examples:
      "माता रोदिति":
        native: "The mother weeps."
        bases:
          "रोदिति": "weeps"
      "पिता तत्र रोदिति":
        native: "The father weeps there."
        bases:
          "रोदिति": "weeps"
  "sa-2107":
    native: "to go"
    notes:
      "n1": "A verb of the second class (adādi): the ending is added straight to the root, giving the third person singular याति (yāti). It has no row in the present-system table, which is for first-class verbs. The first-class verb गम् (gam) also means to go."
    examples:
      "माता याति":
        native: "The mother goes."
        bases:
          "याति": "goes"
      "सखा तत्र याति":
        native: "The friend goes there."
        bases:
          "याति": "goes"
  "sa-2108":
    native: "to say; to speak"
    notes:
      "n1": "A verb of the second class (adādi): the third person singular is ब्रवीति (bravīti), where the vowel ū of the root becomes av and an ī comes before the ending. It has no row in the present-system table, which is for first-class verbs. The first-class verb वद् (vad) also means to speak. The entry of its root also lists a middle present, so its middle forms are in the ātmanepada table beside the active ones."
    examples:
      "माता ब्रवीति":
        native: "The mother speaks."
        bases:
          "ब्रवीति": "speaks"
      "पिता सदा ब्रवीति":
        native: "The father always speaks."
        bases:
          "ब्रवीति": "speaks"
  "sa-2109":
    native: "to give"
    notes:
      "n1": "A verb of the third class (juhotyādi), whose roots are doubled in the present: the third person singular is ददाति (dadāti), from the root दा (dā). It has no row in the present-system table, which is for first-class verbs."
    examples:
      "ददाति माता जलम्":
        native: "The mother gives water."
        bases:
          "ददाति": "gives"
      "ददाति पिता पुस्तकम्":
        native: "The father gives a book."
        bases:
          "ददाति": "gives"
  "sa-2110":
    native: "to put; to place"
    notes:
      "n1": "A verb of the third class (juhotyādi), whose roots are doubled in the present: the third person singular is दधाति (dadhāti), from the root धा (dhā), with d in the doubled part for the dh of the root. It has no row in the present-system table, which is for first-class verbs. The entry of its root also lists a middle present, so its middle forms are in the ātmanepada table beside the active ones."
    examples:
      "दधाति माता जलम्":
        native: "The mother puts water down."
        bases:
          "दधाति": "puts down"
      "दधाति पिता पुस्तकम्":
        native: "The father puts a book down."
        bases:
          "दधाति": "puts down"
  "sa-2111":
    native: "to see"
    notes:
      "n1": "A verb of the fourth class (divādi): the sign ya comes before the ending, giving the third person singular पश्यति (paśyati). The dictionary root दृश् (dṛś) (to see) borrows this stem in the present; en.wiktionary calls the pair suppletive. It has no row in the present-system table, which is for first-class verbs."
    examples:
      "माता पश्यति":
        native: "The mother sees."
        bases:
          "पश्यति": "sees"
      "पिता तत्र पश्यति":
        native: "The father sees there."
        bases:
          "पश्यति": "sees"
  "sa-2112":
    native: "to dance"
    notes:
      "n1": "A verb of the fourth class (divādi): the sign ya comes before the ending, giving the third person singular नृत्यति (nṛtyati). It has no row in the present-system table, which is for first-class verbs."
    examples:
      "माता नृत्यति":
        native: "The mother dances."
        bases:
          "नृत्यति": "dances"
      "स्वसा सदा नृत्यति":
        native: "The sister always dances."
        bases:
          "नृत्यति": "dances"
  "sa-2113":
    native: "to hear; to listen"
    notes:
      "n1": "A verb of the fifth class (svādi): the third person singular is शृणोति (śṛṇoti), where the root श्रु (śru) appears as शृ (śṛ) and takes the sign -ṇo-. It has no row in the present-system table, which is for first-class verbs. The entry of its root also lists a middle present, so its middle forms are in the ātmanepada table beside the active ones. In the first person the dual and plural have optional variants: शृण्वः (śṛṇvaḥ) and शृण्मः (śṛṇmaḥ) may also be written शृणुवः (śṛṇuvaḥ) and शृणुमः (śṛṇumaḥ), as the table of en.wiktionary gives them; the table here has the first."
    examples:
      "माता शृणोति":
        native: "The mother listens."
        bases:
          "शृणोति": "listens"
      "पिता तत्र शृणोति":
        native: "The father listens there."
        bases:
          "शृणोति": "listens"
  "sa-2114":
    native: "to write; to scratch"
    notes:
      "n1": "A verb of the sixth class (tudādi): the third person singular is लिखति (likhati). It looks like a first-class form, but the vowel i of the root is not strengthened, where a first-class verb such as जि (ji) strengthens it. It has no row in the present-system table, which is for first-class verbs."
    examples:
      "लिखति माता पुस्तकम्":
        native: "The mother writes a book."
        bases:
          "लिखति": "writes"
      "लिखति पिता तत्":
        native: "The father writes that."
        bases:
          "लिखति": "writes"
  "sa-2115":
    native: "to enter"
    notes:
      "n1": "A verb of the sixth class (tudādi): the third person singular is विशति (viśati). It looks like a first-class form, but the vowel i of the root is not strengthened. It has no row in the present-system table, which is for first-class verbs."
    examples:
      "माता तत्र विशति":
        native: "The mother enters there."
        bases:
          "विशति": "enters"
      "पिता विशति":
        native: "The father enters."
        bases:
          "विशति": "enters"
  "sa-2116":
    native: "to wish; to desire"
    notes:
      "n1": "A verb of the sixth class (tudādi): the third person singular is इच्छति (icchati), where the ṣ at the end of the root इष् (iṣ) becomes cch before the sign a. It has no row in the present-system table, which is for first-class verbs."
    examples:
      "इच्छति माता जलम्":
        native: "The mother wants water."
        bases:
          "इच्छति": "wants"
      "इच्छति पिता पुस्तकम्":
        native: "The father wants a book."
        bases:
          "इच्छति": "wants"
  "sa-2117":
    native: "to strike; to hit"
    notes:
      "n1": "A verb of the sixth class (tudādi), named after this very root: the third person singular is तुदति (tudati). It looks like a first-class form, but the vowel u of the root is not strengthened. It has no row in the present-system table, which is for first-class verbs."
    examples:
      "भ्राता तुदति":
        native: "The brother strikes."
        bases:
          "तुदति": "strikes"
      "सखा तत्र तुदति":
        native: "The friend strikes there."
        bases:
          "तुदति": "strikes"
  "sa-2118":
    native: "to do; to make"
    notes:
      "n1": "A verb of the eighth class (tanādi): the third person singular is करोति (karoti), where the vowel ṛ of the root becomes ar and the sign -o- comes before the ending. It has no row in the present-system table, which is for first-class verbs."
    examples:
      "करोति पिता पुस्तकम्":
        native: "The father makes a book."
        bases:
          "करोति": "makes"
      "करोति माता तत्":
        native: "The mother does that."
        bases:
          "करोति": "does"
  "sa-2119":
    native: "to know"
    notes:
      "n1": "A verb of the ninth class (kryādi): the third person singular is जानाति (jānāti), where the root ज्ञा (jñā) appears as जा (jā) before the sign -nā-. It has no row in the present-system table, which is for first-class verbs. It takes both voices, so its active and its middle forms are both in the ātmanepada table."
    examples:
      "जानाति माता":
        native: "The mother knows."
        bases:
          "जानाति": "knows"
      "जानाति पिता तत्":
        native: "The father knows that."
        bases:
          "जानाति": "knows"
  "sa-2120":
    native: "to buy"
    notes:
      "n1": "A verb of the ninth class (kryādi), named after this very root: the third person singular is क्रीणाति (krīṇāti), with the sign -ṇā- after the root. It has no row in the present-system table, which is for first-class verbs. The entry of its root also lists a middle present, so its middle forms are in the ātmanepada table beside the active ones."
    examples:
      "क्रीणाति माता पुस्तकम्":
        native: "The mother buys a book."
        bases:
          "क्रीणाति": "buys"
      "क्रीणाति पिता तत्":
        native: "The father buys that."
        bases:
          "क्रीणाति": "buys"
  "sa-2121":
    native: "to seize; to take"
    notes:
      "n1": "A verb of the ninth class (kryādi): the third person singular is गृह्णाति (gṛhṇāti), where the root ग्रह् (grah) appears as गृह् (gṛh) before the sign -ṇā-. It has no row in the present-system table, which is for first-class verbs."
    examples:
      "गृह्णाति माता पुस्तकम्":
        native: "The mother takes a book."
        bases:
          "गृह्णाति": "takes"
      "गृह्णाति पिता जलम्":
        native: "The father takes water."
        bases:
          "गृह्णाति": "takes"
  "sa-2122":
    native: "to tell; to narrate"
    notes:
      "n1": "A verb of the tenth class (curādi): the sign aya comes after the root, giving the third person singular कथयति (kathayati) and the stem कथय (kathaya). It has no row in the present-system table, which is for first-class verbs."
    examples:
      "कथयति माता":
        native: "The mother tells."
        bases:
          "कथयति": "tells"
      "कथयति पिता तत्":
        native: "The father tells that."
        bases:
          "कथयति": "tells"
  "sa-2123":
    native: "to worship; to honour"
    notes:
      "n1": "A verb of the tenth class (curādi): the sign aya comes after the root, giving the third person singular पूजयति (pūjayati) and the stem पूजय (pūjaya). It has no row in the present-system table, which is for first-class verbs."
    examples:
      "पूजयति माता देवम्":
        native: "The mother worships the god."
        bases:
          "देवम्": "god"
          "पूजयति": "worships"
      "पूजयति पिता देवम्":
        native: "The father worships the god."
        bases:
          "देवम्": "god"
          "पूजयति": "worships"
