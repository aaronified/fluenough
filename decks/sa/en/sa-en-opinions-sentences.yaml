cards:
  "sa-3930":
    native: "A wise person always speaks the truth."
    bases: { "सत्यं": "truth", "बुधो": "wise person", "वदति": "to speak (speaks)" }
    confusables: { "w1": { why: "Doubt and uncertainty, not truth: संदेहः (saṃdehaḥ) means doubt and uncertainty." }, "w2": { why: "Villain, not wise person: दुर्जनः (durjanaḥ) means villain." }, "w3": { why: "To say, not to speak: ब्रू (brū) means to say." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. सत्यम् (satyam) is written सत्यं (satyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of सदा (sadā) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). बुधः (budhaḥ) is written बुधो (budho) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of वदति (vadati) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "सत्यम् (satyam) is the neuter form of सत्यः (satyaḥ), used as a noun: the truth. It is the accusative case, what is spoken." }
  "sa-3931":
    native: "The wise minister tells the king his decision."
    bases: { "मेधिरो": "wise", "नृपाय": "to the king", "निश्चयं": "decision", "कथयति": "to tell (tells)" }
    confusables: { "w1": { why: "Clever and discerning, not wise: विचक्षणः (vicakṣaṇaḥ) means clever and discerning." }, "w2": { why: "Resolve, not decision: संकल्पः (saṃkalpaḥ) means resolve." }, "w3": { why: "To say, not to tell: ब्रू (brū) means to say." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. मेधिरः (medhiraḥ) is written मेधिरो (medhiro) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of मन्त्री (mantrī) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). निश्चयम् (niścayam) is written निश्चयं (niścayaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of कथयति (kathayati) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "नृपाय (nṛpāya) is the dative case of नृपः (nṛpaḥ): to the king. निश्चयम् (niścayam) is the accusative case: what is told. कथयति (kathayati) is the present of कथ् (kath)." }
  "sa-3932":
    native: "An ignorant person does not know the argument."
    bases: { "तर्कम्": "argument", "अज्ञो": "ignorant person", "जानाति": "to know (knows)" }
    confusables: { "w1": { why: "Close examination or critical review of something, not argument: समीक्षा (samīkṣā) means close examination or critical review of something." }, "w2": { why: "Clever and discerning, not ignorant: विचक्षणः (vicakṣaṇaḥ) means clever and discerning." }, "w3": { why: "To remember, not to know: स्मृ (smṛ) means to remember." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. अज्ञः (ajñaḥ) is written अज्ञो (ajño) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of न (na) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)).", "n2": "तर्कम् (tarkam) is the accusative case of तर्कः (tarkaḥ): what he does not know. न (na) stands right before the verb it denies." }
  "sa-3933":
    native: "A good person always receives praise."
    bases: { "प्रशंसां": "praise", "लभते": "to get (receives)" }
    confusables: { "w1": { why: "Praise and glory, not praise: प्रशस्तिः (praśastiḥ) means praise and glory." }, "w2": { why: "Villain, not good person: दुर्जनः (durjanaḥ) means villain." }, "w3": { why: "To seize, not to get: ग्रह् (grah) means to seize." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. प्रशंसाम् (praśaṃsām) is written प्रशंसां (praśaṃsāṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of लभते (labhate) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "प्रशंसाम् (praśaṃsām) is the accusative case of प्रशंसा (praśaṃsā): what is received. लभते (labhate) is in the middle voice: he gets it for himself." }
  "sa-3934":
    native: "A sentence becomes pleasing with a simile."
    bases: { "उपमया": "with a simile", "वाक्यं": "sentence", "रम्यं": "pleasing", "भवति": "to become (becomes)" }
    confusables: { "w1": { why: "Example or illustration used to make a point clear, not simile: दृष्टान्तः (dṛṣṭāntaḥ) means example or illustration used to make a point clear." }, "w2": { why: "Word, not sentence: पदम् (padam) means word." }, "w3": { why: "Excellent and highest, not pleasing: उत्तमः (uttamaḥ) means excellent and highest." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. वाक्यम् (vākyam) is written वाक्यं (vākyaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of रम्यं (ramyaṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). रम्यम् (ramyam) is written रम्यं (ramyaṃ), for the same reason, before भवति (bhavati). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "उपमया (upamayā) is the instrumental case of उपमा (upamā): with a simile. रम्यम् (ramyam) is the neuter form of रम्यः (ramyaḥ), to agree with वाक्यम् (vākyam)." }
  "sa-3935":
    native: "A mountain is always steady."
    bases: { "पर्वतो": "mountain", "नित्यं": "always", "स्थिरो": "steady", "भवति": "to be (is)" }
    confusables: { "w1": { why: "Impermanent and transient, not steady: अनित्यः (anityaḥ) means impermanent and transient." }, "w2": { why: "Rock, not mountain: शैलः (śailaḥ) means rock." }, "w3": { why: "Steady and immovable, not steady: अचलः (acalaḥ) means steady and immovable." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. पर्वतः (parvataḥ) is written पर्वतो (parvato) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of नित्यं (nityaṃ) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). नित्यम् (nityam) is written नित्यं (nityaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of स्थिरो (sthiro) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). स्थिरः (sthiraḥ) is written स्थिरो (sthiro), for the same reason, before भवति (bhavati).", "n2": "स्थिरः (sthiraḥ) is an adjective that agrees with पर्वतः (parvataḥ): both are masculine and singular." }
  "sa-3936":
    native: "A scholar always reads an excellent book."
    bases: { "उत्तमं": "excellent", "ग्रन्थं": "book", "पण्डितो": "scholar", "नित्यं": "always", "पठति": "to read (reads)" }
    confusables: { "w1": { why: "Best, not excellent: श्रेष्ठः (śreṣṭhaḥ) means best." }, "w2": { why: "Inferior, not excellent: हीनः (hīnaḥ) means inferior." }, "w3": { why: "To write, not to read: लिख् (likh) means to write." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. उत्तमम् (uttamam) is written उत्तमं (uttamaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of ग्रन्थं (granthaṃ) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign). ग्रन्थम् (grantham) is written ग्रन्थं (granthaṃ), for the same reason, before पण्डितो (paṇḍito). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i). पण्डितः (paṇḍitaḥ) is written पण्डितो (paṇḍito) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of नित्यं (nityaṃ) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). नित्यम् (nityam) is written नित्यं (nityaṃ), for the same reason, before पठति (paṭhati). Before a labial, such as the one here, Whitney 213 a would keep म् (m); the anusvāra sign is still the usual writing (Aṣṭādhyāyī 8.3.23; Whitney 213 i).", "n2": "उत्तमम् (uttamam) is the accusative case of उत्तमः (uttamaḥ), agreeing with ग्रन्थम् (grantham). The object comes first; the order of the words is free." }
  "sa-3937":
    native: "In doubt the wise person deliberates."
    bases: { "संदेहे": "in doubt", "बुधो": "wise person", "विचारं": "deliberation", "करोति": "to do (does)" }
    confusables: { "w1": { why: "Trust or confidence that someone or something is reliable, not doubt: विश्वासः (viśvāsaḥ) means trust or confidence that someone or something is reliable." }, "w2": { why: "Ignorant, not wise person: अज्ञः (ajñaḥ) means ignorant." }, "w3": { why: "Decision, not deliberation: निर्णयः (nirṇayaḥ) means decision." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. बुधः (budhaḥ) is written बुधो (budho) because a final अः (aḥ) becomes ओ (o) before a voiced consonant, here the start of विचारं (vicāraṃ) (Whitney 175; Aṣṭādhyāyī 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute), and 6.1.114, हशि च (haśi ca)). विचारम् (vicāram) is written विचारं (vicāraṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of करोति (karoti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "संदेहे (saṃdehe) is the locative case of संदेहः (saṃdehaḥ): in doubt. विचारम् करोति (vicāram karoti) means makes deliberation, that is, deliberates." }
  "sa-3938":
    native: "A discerning person knows the truth through experience."
    bases: { "विचक्षणो": "discerning person", "ऽनुभवेन": "through experience", "तत्त्वं": "true nature", "जानाति": "to know (knows)" }
    confusables: { "w1": { why: "Conviction and firm belief, not experience: प्रत्ययः (pratyayaḥ) means conviction and firm belief." }, "w2": { why: "Conclusion of an argument, not truth: निगमनम् (nigamanam) means conclusion of an argument." }, "w3": { why: "Wise and intelligent in judgement, not discerning: मेधिरः (medhiraḥ) means wise and intelligent in judgement." } }
    notes: { "n1": "Written apart: the words are not run together, but each junction that changes shape is shown. विचक्षणः (vicakṣaṇaḥ) is written विचक्षणो (vicakṣaṇo) because a final अः (aḥ) becomes ओ (o) before अ (a), and that अ (a) is dropped and shown by the sign ऽ (avagraha), here at the start of अनुभवेन (anubhavena) (Whitney 175 a; Aṣṭādhyāyī 6.1.109, एङः पदान्तादति (eṅaḥ padāntād ati), with 6.1.113, अतो रोरप्लुतादप्लुते (ato ror aplutād aplute), in separate words अतः रोः अप्लुतात् अप्लुते (ataḥ roḥ aplutāt aplute)). तत्त्वम् (tattvam) is written तत्त्वं (tattvaṃ) because a final म् (m) is written as the anusvāra ं (ṃ) before a consonant, here the start of जानाति (jānāti) (Aṣṭādhyāyī 8.3.23, मोऽनुस्वारः (mo 'nusvāraḥ); Whitney 213 i says texts generally write the assimilated m with the anusvāra sign).", "n2": "अनुभवेन (anubhavena) is the instrumental case of अनुभवः (anubhavaḥ): through experience. तत्त्वम् (tattvam) is the accusative case: what he knows, the true nature of a thing." }
  "sa-3939":
    native: "Friendship always grows with trust."
    bases: { "विश्वासेन": "with trust", "वर्धते": "to grow (grows)" }
    confusables: { "w1": { why: "Friendship and companionship between equals, not friendship: सख्यम् (sakhyam) means friendship and companionship between equals." }, "w2": { why: "Conviction and firm belief, not trust: प्रत्ययः (pratyayaḥ) means conviction and firm belief." }, "w3": { why: "To be worthy, not to grow: अर्ह् (arh) means to be worthy." } }
    notes: { "n1": "विश्वासेन (viśvāsena) is the instrumental case of विश्वासः (viśvāsaḥ): with trust. वर्धते (vardhate) is the middle-voice present of वृध् (vṛdh): grows." }
