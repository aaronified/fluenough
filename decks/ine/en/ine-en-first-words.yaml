"name": "First words"
"description": "Thirty reconstructed words of Proto-Indo-European, the language of about 4500 to 2500 BCE. No sentences are given: a reconstructed sentence is not attested, so this deck teaches words only. Each form has its asterisk (*), which marks a reconstruction. The IPA is a broad rough reading in which the laryngeals are written as h. Words from the Swadesh list are sourced; the kin terms marked doubtful come from the path plan. Not yet checked by an Indo-Europeanist: please report any mistake."
"license": "CC-BY-SA-4.0"
"tags":
- "unreviewed"
"cards":
  "ine-0001":
    "native": "I"
    "notes":
      "n1": "*éǵh₂, I. Wiktionary, Proto-Indo-European Swadesh list (item 1)."
  "ine-0002":
    "native": "you (singular)"
    "notes":
      "n1": "*túh₂, you, singular. Wiktionary, Proto-Indo-European Swadesh list (item 2)."
  "ine-0003":
    "native": "we"
    "notes":
      "n1": "*wéy, we. Wiktionary, Proto-Indo-European Swadesh list (item 4); the list also gives *wé."
  "ine-0004":
    "native": "water"
    "notes":
      "n1": "*wódr̥, water. Wiktionary, Proto-Indo-European Swadesh list (item 150); the list also gives *h₂ekʷeh₂ and *h₂ep-."
  "ine-0005":
    "native": "fire"
    "notes":
      "n1": "*péh₂wr̥, fire. Wiktionary, Proto-Indo-European Swadesh list (item 167); the list also gives *h₂eh₁ter- and *h₁n̥gʷnis."
  "ine-0006":
    "native": "house"
    "notes":
      "n1": "*dṓm, home, house (feminine). Wiktionary, Reconstruction:Proto-Indo-European/dṓm. It replaces the form *dóh₂m̥ first written here, which Wiktionary does not give."
  "ine-0007":
    "native": "father"
    "notes":
      "n1": "*ph₂tḗr, father. Wiktionary, Proto-Indo-European Swadesh list (item 43); the list also gives *átta."
  "ine-0008":
    "native": "mother"
    "notes":
      "n1": "*méh₂tēr, mother. Wiktionary, Proto-Indo-European Swadesh list (item 42)."
  "ine-0009":
    "native": "brother"
    "notes":
      "n1": "*bʰréh₂tēr, brother (masculine). Wiktionary, Reconstruction:Proto-Indo-European/bʰréh₂tēr."
  "ine-0010":
    "native": "sister"
    "notes":
      "n1": "*swésōr, sister (feminine). Wiktionary, Reconstruction:Proto-Indo-European/swésōr."
  "ine-0011":
    "native": "son"
    "notes":
      "n1": "*suHnús, son. No Wiktionary entry under this spelling was found among the pages read, and no source was read for it; doubtful until checked."
  "ine-0012":
    "native": "daughter"
    "notes":
      "n1": "*dʰugh₂tḗr, daughter (feminine). Wiktionary, Reconstruction:Proto-Indo-European/dʰugh₂tḗr."
  "ine-0013":
    "native": "man (adult male)"
    "notes":
      "n1": "*h₂nḗr, adult male. Wiktionary, Proto-Indo-European Swadesh list (item 37); the list also gives *wiHrós."
  "ine-0014":
    "native": "woman"
    "notes":
      "n1": "*gʷḗn, woman. Wiktionary, Proto-Indo-European Swadesh list (item 36); the list also gives *h₁esor-."
  "ine-0015":
    "native": "name"
    "notes":
      "n1": "*h₁nómn̥, name. Wiktionary, Proto-Indo-European Swadesh list (item 207)."
  "ine-0016":
    "native": "child"
    "notes":
      "n1": "*ǵénh₁mn̥, child. Wiktionary, Proto-Indo-European Swadesh list (item 39)."
  "ine-0017":
    "native": "good"
    "notes":
      "n1": "*h₁wésus, good. Wiktionary, Proto-Indo-European Swadesh list (item 185); the list also gives *bʰed- and *h₁su-."
  "ine-0018":
    "native": "big"
    "notes":
      "n1": "*méǵh₂s, big. Wiktionary, Proto-Indo-European Swadesh list (item 27)."
  "ine-0019":
    "native": "small"
    "notes":
      "n1": "*mey-, small. Wiktionary, Proto-Indo-European Swadesh list (item 32)."
  "ine-0020":
    "native": "one"
    "notes":
      "n1": "*h₁óynos, one (Wiktionary writes the first laryngeal h₁; other reconstructions give *Hóynos or *oynos). Wiktionary, Proto-Indo-European Swadesh list (item 22) and the entry *h₁óynos; the list also gives *sḗm."
  "ine-0021":
    "native": "two"
    "notes":
