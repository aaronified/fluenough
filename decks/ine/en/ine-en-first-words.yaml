"name": "First words"
"description": "Ten words of Proto-Indo-European, reconstructed by comparing its descendants. Every target is an asterisked reconstruction in the Latin notation, so there is no reading and no IPA: its phonetic values are hypotheses. The reference the forms follow is an open owner question (#586). The cards have no example sentences: a reconstructed language has no attested sentences, and a scholar supplies any. Not yet checked by an Indo-Europeanist: please report any mistake."
