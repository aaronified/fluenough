"tags":
- "unreviewed"
"cards":
  "ine-0001":
    "native": "I"
    "notes":
      "n1": "*h₁eǵ(h₂)om, I: a reconstruction, never written. The laryngeals h₁ and h₂ are scholars' notation for sounds lost in the daughter languages."
  "ine-0002":
    "native": "you (one person)"
    "notes":
      "n1": "*tú, you: a reconstruction, the second person singular. Its plural is *yū́s, not in this deck."
  "ine-0003":
    "native": "is"
    "notes":
      "n1": "*h₁ésti, is: the third person singular of the verb to be, reconstructed from its descendants in several branches."
  "ine-0004":
    "native": "one"
    "notes":
      "n1": "*h₁óynos, one: a reconstruction from the numeral's descendants; its feminine form is different."
  "ine-0005":
    "native": "two"
    "notes":
      "n1": "*dwóh₁, two: a reconstruction, the dual base of the numeral two."
  "ine-0006":
    "native": "water"
    "notes":
      "n1": "*wódr̥, water: a neuter noun, reconstructed from its descendants in several branches."
  "ine-0007":
    "native": "god; the bright one"
    "notes":
      "n1": "*deywós, god, the bright one: the word that gives Latin deus and Vedic deva. A masculine noun."
  "ine-0008":
    "native": "father"
    "notes":
      "n1": "*ph₂tḗr, father: a masculine noun, the root of Latin pater and Sanskrit pitā."
  "ine-0009":
    "native": "mother"
    "notes":
      "n1": "*méh₂tēr, mother: a feminine noun, the root of Latin māter and Greek mḗtēr."
  "ine-0010":
    "native": "horse"
    "notes":
      "n1": "*h₂éḱwos, horse: a masculine noun, the root of Latin equus and Sanskrit áśva."
