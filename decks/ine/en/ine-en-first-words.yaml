    "notes":
      "n1": "*tréyes, three. Wiktionary, Proto-Indo-European Swadesh list (item 24)."
  "ine-0023":
    "native": "four"
    "notes":
      "n1": "*kʷetwóres, four. Wiktionary, Proto-Indo-European Swadesh list (item 25)."
  "ine-0024":
    "native": "five"
    "notes":
      "n1": "*pénkʷe, five. Wiktionary, Proto-Indo-European Swadesh list (item 26)."
  "ine-0025":
    "native": "here"
    "notes":
      "n1": "*ḱi, here. Wiktionary, Proto-Indo-European Swadesh list (item 9); the list also gives *ḱe."
  "ine-0026":
    "native": "who"
    "notes":
      "n1": "*kʷís, who (pronoun). Wiktionary, Proto-Indo-European Swadesh list (item 11)."
  "ine-0027":
    "native": "what"
    "notes":
      "n1": "*kʷíd, what (pronoun). Wiktionary, Proto-Indo-European Swadesh list (item 12)."
  "ine-0028":
    "native": "all"
    "notes":
      "n1": "*h₂el-, all. Wiktionary, Proto-Indo-European Swadesh list (item 17)."
  "ine-0029":
    "native": "and (enclitic)"
    "notes":
      "n1": "*-kʷe, and, an enclitic. Wiktionary, Proto-Indo-European Swadesh list (item 204); the list also gives *de and *nu."
  "ine-0030":
    "native": "not"
    "notes":
      "n1": "*n̥-, not (the prefix form; the list also gives *né). Wiktionary, Proto-Indo-European Swadesh list (item 16)."
