  "ine-0011":
    "native": "Father Sky"
    "notes":
      "n1": "A reconstructed divine formula, from Vedic Dyauṣ Pitā and Greek Zeus Patēr. It is reconstructed, never attested in Proto-Indo-European."
  "ine-0012":
    "native": "imperishable glory"
    "notes":
      "n1": "A reconstructed poetic formula, from Greek kleos aphthiton and Vedic śravas akṣitam. It is reconstructed, never attested as written."
