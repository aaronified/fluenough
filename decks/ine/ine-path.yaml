# The order Proto-Indo-European is taught in, one unit per line, from every
# language it is taught from: each deck is named by its core id, and a
# learner from English is taught ine-en-family for ine-family (ADR-0013,
# ADR-0036).
#
# This is also Proto-Indo-European's plan to its last level
# (docs/DECK-FORMAT.md, "The B1 plan"): every unit to the last milestone,
# with its size in words, its grammar topics, the three milestones, and each
# unit's listening and reading passages. No deck is written yet, so every
# unit is planned: the course teaches each as "Coming" until its deck is
# written.
#
# The code. ISO 639-3 has no code for Proto-Indo-European: it leaves out
# reconstructed languages. Wiktionary and Glottolog-style lists write
# `ine-pro`, a private extension of `ine`, but the format's language code is
# two or three letters (LANG_RE and CODE_RE in tools/validate_decks.py, and
# card ids such as ine-0001), so `ine-pro` cannot be used. The course takes
# `ine`, the ISO 639-2 and 639-5 code for the Indo-European languages as a
# group, which is what Wiktionary's `ine-pro` is built on. It is not an ISO
# 639-3 code, and the `iso639_3` a deck's language block needs is an open
# question for the owner (#586).
#
# A reading course of a reconstructed language (#586). Proto-Indo-European
# was spoken, by most estimates, somewhere between about 4500 and 2500 BCE,
# and was never written. Every word in this course is a reconstruction:
# scholars infer it by comparing the languages descended from it (Sanskrit,
# Avestan, Hittite, Greek, Latin, Gothic, Old Irish, Old Church Slavonic,
# Tocharian, Armenian, Albanian, Lithuanian), and mark it with an asterisk,
# *ph₂tḗr, because no one ever saw it written. There are no texts, no
# speakers and no recordings, and a CEFR B1 of daily life does not apply. The
# format names the milestones A1, A2 and B1, and the plan keeps those names,
# but here they mean three reading levels:
#
# - A1, "Roots and nouns" (400 words): read single reconstructions and the
#   cognate sets they are built from; the notation (laryngeals, the three
#   rows of dorsals, syllabic resonants, accent); roots and ablaut; the
#   thematic noun in its eight cases; the verb "to be" and the thematic
#   present. The level ends with the first sentence of Schleicher's fable.
# - A2, "Verbs and the fable" (500 more, 900 in all): the athematic nouns,
#   the dual, the pronouns, the laryngeals' effects on the daughter
#   languages, the verb's three stems (present, aorist, perfect), the middle
#   voice and the moods. The level ends with the whole of Schleicher's fable
#   in one modern version, and its 1868 original set beside it.
# - B1, "Formulae and compositions" (600 more, 1,500 in all): the poetic
#   formulae reconstructed from Vedic, Homeric and Germanic verse, the
#   sound laws that lead to each of the course's other languages, the
#   accent-and-ablaut classes, derivation and compounds, relative clauses,
#   and Anatolian. The level ends with "The king and the god" read without
#   a translation.
#
# The sizes are honest, not the plan's usual ones. Wiktionary's
# Reconstruction namespace, as kaikki.org extracts it (2026-10-03), has
# 1,802 distinct Proto-Indo-European forms, 1,288 of them roots; the
# well-established ones, with cognates in several branches that every
# handbook accepts, number only in the hundreds, and with their securest
# derivatives in the low thousands. So the course plans 1,500 words in all:
# A1 and A2 teach the securest vocabulary (kin terms, numerals, body parts,
# common verbal roots), and B1 the words found in fewer branches, each card
# saying which branches attest it. Each level is within the validator's
# range (half to one and a half times 700, 900 and 1,200; B1 is at its
# bottom), but the 1,500 in all is below its 2,000 to 3,500, and the
# validator will warn of it. That warning is meant: to reach 2,000 the
# course would have to teach reconstructions most scholars doubt. A "word"
# here is a lemma, a root or a reconstructed word built on one: *ǵenh₁-
# (beget) and *ǵénh₁os (kin) are two.
#
# The order follows docs/plans/words-rules-sentences.md and the path design
# of 2026-10-17:
# 1. the phrasebook, here the reconstructed poetic formulae, taught whole;
# 2. the first word units, the securest vocabulary;
# 3. the notation after them (below), in place of a script;
# 4. a core of about 200 common words in themed units;
# 5. rules as forms: roots and ablaut, the noun's cases, then pronoun and
#    verb forms;
# 6. sentences, each after its words and rules; then the other themes.
#
# The notation. Proto-Indo-European has no script: it is written in a
# scholarly notation of Latin letters with diacritics, subscripts and
# superscripts, which the course teaches as its script units. They count no
# words. The notation the plan proposes is Fortson's (Indo-European Language
# and Culture, 2nd ed., 2010), which is also, near enough, Wiktionary's:
# - the asterisk, which marks a form as reconstructed: *h₂ówis, sheep;
# - three laryngeals, h₁ h₂ h₃, and H for one whose identity is unknown
#   (*suHnús, son);
# - three rows of dorsals: palatovelars ḱ ǵ ǵʰ (*ḱm̥tóm, hundred), plain
#   velars k g gʰ, and labiovelars kʷ gʷ gʷʰ (*kʷékʷlos, wheel);
# - three series of stops: voiceless (p t), plain voiced (b d) and voiced
#   aspirated (bʰ dʰ gʰ), as traditionally reconstructed; the glottalic
#   theory is named, not taught;
# - syllabic resonants r̥ l̥ m̥ n̥ (*wĺ̥kʷos, wolf; *déḱm̥t, ten), and y/i,
#   w/u as one sound each;
# - the accent, an acute on the stressed vowel (*ph₂tḗr), and the long
#   vowels with a macron (ē, ō).
# Which reference to follow is an open question for the owner (#586,
# question 1): reconstructions differ by scholar. Fortson is the proposal,
# for a learner's textbook; Ringe (From Proto-Indo-European to
# Proto-Germanic, 2nd ed., 2017) is close to it; Beekes (Comparative
# Indo-European Linguistics, 2nd ed., 2011) writes the laryngeals and
# palatovelars differently (h₁ h₂ h₃ but k̑ ĝ, and the a-vowel denied).
# LIV² (verbal roots) and NIL (nominal forms) are the reference lists to
# check a card against. The chosen reference is named in every deck.
#
# Readings. A card's target is the reconstruction in the notation, which is
# Latin letters, so no reading is needed and none is ISO 15919. No IPA is
# planned: the laryngeals' and the voiced aspirates' phonetic values are
# themselves hypotheses, so an IPA would be a guess presented as data. The
# notation unit says what each letter is thought to have sounded like.
#
# Ablaut grades. Every root is taught with its grades, from the first
# grammar unit: the e-grade (*ǵénh₁os, kin), the o-grade (*ǵónh₁os), the
# zero grade (*ǵn̥h₁tós, born) and the lengthened grades (*pṓds, foot,
# beside *ped-).
#
# Cognates. Because Proto-Indo-European explains Sanskrit, Greek, Latin and
# Germanic, every unit links to the course's other languages: Hindi,
# Bengali, Spanish, German, French and Greek. *dwóh₁ (two) is दो (do) in
# Hindi, দুই (dui) in Bengali, dos, deux, zwei, and δύο (dýo); *h₁nómn̥
# (name) is नाम (nām), নাম (nām), nombre, nom, Name and όνομα (ónoma). The
# format has no field for a cognate yet (see the pull request's gaps): until
# it has, a card's notes give its cognates.
#
# Passages. Proto-Indo-European has no texts. Every passage is one of
# three kinds, and each says which:
# - a reconstruction read beside the attested daughter forms it is built
#   from (Sanskrit, Greek, Latin, Gothic, Hittite), which are real ancient
#   texts;
# - a modern composition: Schleicher's fable, "The sheep and the horses"
#   (1868, and its later versions by Hirt, Lehmann and Zgusta, Adams,
#   Kortlandt, Lühr and Byrd), "The king and the god" (Sen, Hamp and others,
#   1994, revised by Byrd), or a short sentence composed for the course;
#   never presented as an ancient text;
# - a reconstructed poetic formula, such as *ḱléwos ń̥dʰgʷʰitom
#   (imperishable fame), from Vedic śrávas ákṣitam and Homeric kléos
#   áphthiton, named as a reconstruction from two or more traditions.
# Schleicher's 1868 version is out of copyright; the later versions are
# modern works whose licences are an open question (#510, #586), so a deck
# may need its own version written to the chosen reference, citing theirs.
# A listening passage is the same text read aloud by a scholar in a
# reconstructed pronunciation: there is no speaker and no voice, so whether
# any audio is recorded is for the owner to decide (#586).
#
# Proto-Indo-European, as it is usually reconstructed for the stage before
# the non-Anatolian languages split, has three genders: masculine, feminine
# and neuter. Behind them is an older split, animate against inanimate
# (neuter), which Hittite and the other Anatolian languages keep as common
# against neuter; the feminine, in *-eh₂, grew later. `genders` holds the
# three, as for Marathi; the gender grammar unit teaches the older split,
# and a card's note names it where it matters. To confirm with the reviewer.
#
# No `regions`. The app asks a rater "Where you speak Proto-Indo-European",
# and nobody does; the reviewer is an Indo-Europeanist, not a speaker. The
# language's variation is by stage (Early PIE, with Anatolian; Late PIE,
# the usual teaching stage) and by branch, never by a place a reader is
# from, and a region's id is permanent. A card's note gives its stage or the
# branches that attest it instead, and the validator refuses an empty
# `regions: []`, so the field is left out.
#
# A planned unit holds one core id. A theme's sentence deck,
# ine-<theme>-sentences, joins its theme's unit once written.
#
# Every deck of Proto-Indo-European is listed exactly once.
schema: 1
kind: "path"
id: "ine-path"
language: "ine"
# The genders a noun's gender is one of (#512; DECK-FORMAT.md, Card data):
# masculine, feminine and neuter, with the older animate and inanimate
# split behind them (above).
genders: ["m", "f", "n"]
# "*" takes decks a learner adds (#22): one of a unit's theme at the
# bottom of that unit, any other in the last unit.
units:
  # A1, "Roots and nouns".
  #
  # 1. The phrasebook: reconstructed poetic formulae, taught whole, each
  # marked as a reconstruction from two or more traditions: *ḱléwos
  # ń̥dʰgʷʰitom (imperishable fame), *dyḗws ph₂tḗr (father sky: Vedic
  # dyaúṣ pitā́, Greek Zeû páter, Latin Iuppiter), *wiHróm péḱu (men and
  # livestock), *gʷʰént h₁ógʷʰim (he slew the serpent), *h₁ésti (is), and
  # the fable's title, *h₂ówis h₁éḱwōs-kʷe (the sheep and the horses).
  # The first words are written: ine-first-words is unit 1 (10 words).
  # No phrasebook is written: its few cards are below the 15 a phrasebook
  # needs.
  - decks: ["ine-first-words", "*"]
    words: 10
  # 2. Reconstruction and its notation: the comparative method, cognate
  # sets, regular sound correspondences, the asterisk. In place of a living
  # language's sound-differences unit. Father: पिता (pitā), পিতা (pitā),
  # padre, père, Vater, πατέρας (patéras), from *ph₂tḗr.
  - planned: { id: "ine-reconstruction", grammar: ["comparative-method", "asterisk-notation"], words: 0 }
    listening_passages:
      - { id: "father-in-six-languages", text: { "en": "Father said in Hindi, Bengali, Spanish, French, German and Greek, then the reconstruction *ph₂tḗr they lead back to" } }
    reading_passages:
      - { id: "a-cognate-table", text: { "en": "A table of cognates for father, mother and brother in Sanskrit, Greek, Latin and Gothic, and the reconstruction each column gives" } }
  # 3. Family: *ph₂tḗr, *méh₂tēr, *bʰréh₂tēr, *swésōr, *suHnús, *dʰugh₂tḗr,
  # *népōts, *h₂éwh₂os, *snusós, *ǵénh₁os. Brother: भाई (bhāī), ভাই (bhāi),
  # frère, Bruder.
  - planned: { id: "ine-family", theme: "family", words: 35 }
    listening_passages:
      - { id: "kin-terms-heard", text: { "en": "The kin terms read aloud, each after its Sanskrit, Greek and Latin cognates" } }
    reading_passages:
      - { id: "kin-cognate-sets", text: { "en": "Cognate sets for sister and daughter: Sanskrit svásar and duhitár, Greek thugátēr, Gothic swistar and dauhtar, and their reconstructions" } }
  # 4. The body: *ḱérd (heart), *h₃ókʷs (eye), *h₃dónts (tooth), *pṓds
  # (foot), *ǵénu (knee), *dn̥ǵʰwéh₂s (tongue), *h₁ésh₂r̥ (blood). Tooth:
  # दाँत (dā̃t), দাঁত (dā̃t), diente, dent, Zahn, δόντι (dónti).
  - planned: { id: "ine-body", theme: "body", words: 35 }
    listening_passages:
      - { id: "tooth-and-foot", text: { "en": "Tooth and foot heard in six living languages and then reconstructed, a lesson in the lengthened grade" } }
    reading_passages:
      - { id: "heart-cognates", text: { "en": "The cognates of *ḱérd: Greek kardía, Latin cor, Gothic hairtō, Hittite kēr, and why Sanskrit hṛ́d- is harder to fit" } }
  # 5. Numbers: *óynos, *dwóh₁, *tréyes, *kʷetwóres, *pénkʷe, *swéḱs,
  # *septḿ̥, *h₁oḱtṓw, *h₁néwn̥, *déḱm̥t, *wídḱm̥ti (twenty). The teens are
  # not securely reconstructed, so the unit is smaller than its theme.
  # Seven: सात (sāt), সাত (sāt), siete, sept, sieben, επτά (eptá).
  - planned: { id: "ine-numbers-1-20", theme: "numbers-1-20", words: 15 }
    listening_passages:
      - { id: "counting-to-ten", text: { "en": "Counting from one to ten in a reconstructed pronunciation, each number after its Hindi and Spanish descendant" } }
    reading_passages:
      - { id: "numeral-table", text: { "en": "The numerals one to ten in Sanskrit, Greek, Latin, Gothic and Lithuanian, set beside their reconstructions" } }
  # 6. Animals: *h₂ówis (sheep), *h₁éḱwos (horse), *gʷṓws (cow), *ḱwṓ
  # (dog), *wĺ̥kʷos (wolf), *h₂ŕ̥tḱos (bear), *súHs (pig), *mūs (mouse).
  # Cow: गाय (gāy), Kuh, βους (vous).
  - planned: { id: "ine-animals", theme: "animals", words: 35 }
    listening_passages:
      - { id: "flock-and-herd", text: { "en": "Animals named in short sentences composed for the course: the sheep, the horse, the cow, the dog (a modern composition)" } }
    reading_passages:
      - { id: "horse-cognates", text: { "en": "The horse in Sanskrit áśva-, Avestan aspa-, Greek híppos, Latin equus and Old Irish ech, and the reconstruction *h₁éḱwos" } }
  # 7. The notation, after the first six units: the three series of stops
  # (p t, b d, bʰ dʰ gʰ), the three rows of dorsals (ḱ ǵ ǵʰ, k g gʰ, kʷ gʷ
  # gʷʰ), and centum against satem: *ḱm̥tóm (hundred) as Latin centum and
  # Sanskrit śatám, Hindi सौ (sau), Spanish ciento, Greek εκατό (ekató).
  - planned: { id: "ine-notation-stops", grammar: ["stop-series", "dorsals", "centum-satem"], words: 0 }
    listening_passages:
      - { id: "three-dorsals", text: { "en": "The three rows of dorsals heard in a reconstructed pronunciation: ḱ, k and kʷ, in *ḱm̥tóm (hundred), *krewh₂ (raw flesh) and *kʷékʷlos (wheel)" } }
    reading_passages:
      - { id: "centum-satem-table", text: { "en": "Hundred in Latin, Greek, Gothic, Sanskrit, Avestan and Lithuanian, sorted into the centum and satem branches" } }
  # 8. The notation's other letters: the laryngeals h₁ h₂ h₃ and H, the
  # syllabic resonants r̥ l̥ m̥ n̥, y/i and w/u, and the accent. Wolf,
  # *wĺ̥kʷos: Sanskrit vṛ́ka-, Greek lúkos, Spanish lobo.
  - planned: { id: "ine-notation-laryngeals", grammar: ["laryngeals", "syllabic-resonants", "accent-notation"], words: 0 }
    listening_passages:
      - { id: "unknown-sounds", text: { "en": "What the laryngeals and the syllabic resonants may have sounded like, with the uncertainty said aloud" } }
    reading_passages:
      - { id: "one-root-four-notations", text: { "en": "The same five reconstructions as Fortson, Beekes, Ringe and Wiktionary write them, side by side" } }
  # 9 to 15. The core: about 200 common words, the securest first.
  # Pronouns: *h₁eǵ (I), *tuH (you), *wéy (we), *yūs (you all), *só, *séh₂,
  # *tód (that), *kʷís, *kʷíd (who, what). Who: Spanish quién, French qui.
  - planned: { id: "ine-pronouns", theme: "pronouns", words: 15 }
    listening_passages:
      - { id: "i-and-you", text: { "en": "I and you in short sentences composed for the course, each after its Sanskrit and Latin cognate (a modern composition)" } }
    reading_passages:
      - { id: "pronoun-cognates", text: { "en": "I and you in Sanskrit, Greek, Latin, Gothic and Hittite, and what their differences tell about the reconstruction" } }
  # Everyday verbs, as roots: *h₁es- (be), *h₁ey- (go), *gʷem- (come),
  # *bʰer- (carry), *h₁ed- (eat), *peh₃- (drink), *steh₂- (stand), *sed-
  # (sit), *deh₃- (give), *dʰeh₁- (put), *ǵneh₃- (know), *weyd- (see).
  # Know: जानना (jānnā), জানা (jānā), conocer, connaître, kennen.
  - planned: { id: "ine-everyday-verbs", theme: "everyday-verbs", words: 40 }
    listening_passages:
      - { id: "roots-in-use", text: { "en": "Everyday roots heard in third-person forms in short sentences composed for the course: he carries, she gives, they eat (a modern composition)" } }
    reading_passages:
      - { id: "give-cognates", text: { "en": "The root *deh₃- in Sanskrit dádāti, Greek dídōmi, Latin dō, and in Hindi dān and Spanish dar" } }
  # Describing: *néwos (new), *h₁rudʰrós (red), *meǵh₂- (great), *h₁su-
  # (good), *sénos (old), *h₂yuh₁n̥ḱós (young), *swéh₂dus (sweet), *gʷréh₂us
  # (heavy). New: नया (nayā), nuevo, neuf, neu, νέος (néos).
  - planned: { id: "ine-describing", theme: "describing", words: 35 }
    listening_passages:
      - { id: "new-and-old", text: { "en": "Describing words heard in short phrases composed for the course: a new house, an old man, a sweet honey (a modern composition)" } }
    reading_passages:
      - { id: "sweet-cognates", text: { "en": "The cognates of *swéh₂dus: Sanskrit svādú-, Greek hēdús, Latin suāvis, English sweet" } }
  # Nature: *dyḗws (sky, day), *séh₂wl̥ (sun), *méh₁n̥s (moon, month),
  # *h₂stḗr (star), *nébʰos (cloud), *wódr̥ (water), *h₁ógʷnis (fire),
  # *dʰéǵʰōm (earth), *snóygʷʰos (snow), *h₂éwsōs (dawn). Water: Greek
  # νερό (neró) is not its descendant, but ύδωρ (ýdor) is.
  - planned: { id: "ine-nature", theme: "nature", words: 40 }
    listening_passages:
      - { id: "sky-and-earth", text: { "en": "Sky, earth, sun and moon heard in short sentences composed for the course (a modern composition)" } }
    reading_passages:
      - { id: "dawn-goddess", text: { "en": "Dawn as word and goddess: Vedic Uṣás, Greek Ēṓs, Latin Aurōra, and the reconstruction *h₂éwsōs" } }
  # Time: *nókʷts (night), *h₁yeh₁r (year), *wétos (year), *nu (now),
  # *h₂eyw- (life, age). Night: noche, nuit, Nacht, νύχτα (nýchta).
  - planned: { id: "ine-time", theme: "time", words: 20 }
    listening_passages:
      - { id: "day-and-night", text: { "en": "Day and night, now and then, heard in short sentences composed for the course (a modern composition)" } }
    reading_passages:
      - { id: "night-cognates", text: { "en": "Night in Sanskrit nákt-, Greek núx, Latin nox, Gothic nahts and Hittite nekuz, and the reconstruction *nókʷts" } }
  # Things: *wĺ̥h₂neh₂ (wool), *néh₂us (ship), *dóru (tree, wood), *h₂éyos
  # (copper, ore; again in metals), *h₂éḱmō (stone).
  - planned: { id: "ine-things", theme: "things", words: 30 }
    listening_passages:
      - { id: "wool-and-wood", text: { "en": "Things named in short sentences composed for the course: wool, wood, a ship, copper (a modern composition)" } }
    reading_passages:
      - { id: "tree-and-true", text: { "en": "One root, two meanings: *dóru (tree, wood) and the words for firm and true that grew from it, in Sanskrit, Greek and English" } }
  # 16 to 22. Rules as forms, practised on the words known.
  # Roots and ablaut: the root shape CeC, the e, o, zero and lengthened
  # grades, and the suffix and ending around a root.
  - planned: { id: "ine-grammar-roots", grammar: ["root-structure", "ablaut"], words: 0 }
    listening_passages:
      - { id: "five-grades", text: { "en": "One root heard in its five grades: *ǵénh₁os, *ǵónh₁os, *ǵn̥h₁tós and their kin" } }
    reading_passages:
      - { id: "ablaut-in-daughters", text: { "en": "Ablaut surviving in living languages: English sing, sang, sung and Greek leípō, léloipa, élipon" } }
  # The thematic noun, *wĺ̥kʷos, in the nominative, accusative and vocative.
  - planned: { id: "ine-grammar-thematic", grammar: ["thematic-nouns", "nominative", "accusative", "vocative"], words: 0 }
    listening_passages:
      - { id: "the-wolf-sees", text: { "en": "The wolf as subject, object and the one addressed, in short sentences composed for the course (a modern composition)" } }
    reading_passages:
      - { id: "wolf-paradigm", text: { "en": "The singular of *wĺ̥kʷos set beside Sanskrit vṛ́kas and Greek lúkos, case by case" } }
  # The other five cases: genitive, ablative, dative, locative,
  # instrumental. Sanskrit keeps all eight; Greek, Latin and German fewer.
  - planned: { id: "ine-grammar-cases", grammar: ["genitive", "ablative", "dative", "locative", "instrumental"], words: 0 }
    listening_passages:
      - { id: "of-from-to-in-with", text: { "en": "The five other cases heard in short sentences composed for the course: of the house, from the house, in the house (a modern composition)" } }
    reading_passages:
      - { id: "eight-cases", text: { "en": "The eight cases of the thematic noun beside Sanskrit's eight, Latin's six and German's four, and what each daughter merged" } }
  # Gender and the neuter: the animate and inanimate split, the neuter's
  # one form for nominative and accusative, and the feminine in *-eh₂.
  - planned: { id: "ine-grammar-gender", grammar: ["gender", "neuter", "eh2-stems"], words: 0 }
    listening_passages:
      - { id: "yoke-and-mare", text: { "en": "Neuters and feminines heard: *yugóm (yoke) and *h₁éḱweh₂ (mare), in short phrases composed for the course" } }
    reading_passages:
      - { id: "hittite-two-genders", text: { "en": "Hittite's common and neuter genders, and the feminine that the other branches added" } }
  # The athematic verb "to be": *h₁ésmi, *h₁ési, *h₁ésti, *h₁sénti, and the
  # primary endings. Is: Spanish es, French est, German ist.
  - planned: { id: "ine-grammar-be", grammar: ["athematic-present", "primary-endings"], words: 0 }
    listening_passages:
