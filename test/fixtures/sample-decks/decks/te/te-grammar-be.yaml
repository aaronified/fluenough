        "అతను": "ఉన్నాడు"
        "ఆమె / అది": ["ఉంది", "ఉన్నది"]
        "వాళ్ళు": "ఉన్నారు"
      readings:
        "నేను": "unnānu"
        "మేము": ["unnāmu", "unnām"]
        "నువ్వు": "unnāvu"
        "మీరు": "unnāru"
        "అతను": "unnāḍu"
        "ఆమె / అది": ["undi", "unnadi"]
        "వాళ్ళు": "unnāru"
