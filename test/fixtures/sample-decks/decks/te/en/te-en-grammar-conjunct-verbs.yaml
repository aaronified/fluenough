schema: 1
id: "te-en-grammar-conjunct-verbs"
kind: "layer"
core: "te-grammar-conjunct-verbs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Noun + చేయు (cēyu) and పడు (paḍu)"
description: "Many Telugu verbs are a noun with చేయు (cēyu), do, or పడు (paḍu), fall: పని చేయడం (pani cēyaḍam), to work; భయపడడం (bhayapaḍaḍam), to be afraid. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "grammar"]
cards:
  "te-0479":
    native: "to work"
    notes:
      "n1": "పని (pani), work, and చేయడం (cēyaḍam), to do. So too స్నానం చేయడం (snānam cēyaḍam), to bathe, and వంట చేయడం (vaṇṭa cēyaḍam), to cook."
  "te-0480":
    native: "to phone"
    notes:
      "n1": "నాకు ఫోన్ చేయండి (nāku fōn cēyaṇḍi), please call me."
  "te-0481":
    native: "to help"
    notes:
      "n1": "The one helped takes -కు (-ku): నాకు సహాయం చేయండి (nāku sahāyam cēyaṇḍi), please help me."
  "te-0482":
    native: "to get married"
    notes:
      "n1": "With -కొను (-konu), for oneself: పెళ్ళి చేసుకున్నాను (peḷḷi cēsukunnānu), I got married."
    bases:
      "పెళ్ళి": "wedding; marriage"
      "చేసుకోవడం": "to do for oneself; with a wedding, to get married"
  "te-0483":
    native: "to try"
    notes:
      "n1": "Also one verb: ప్రయత్నించడం (prayatniñcaḍam)."
    bases:
      "ప్రయత్నం": "attempt; effort"
  "te-0484":
    native: "to spend (money)"
    notes:
      "n1": "With పెట్టు (peṭṭu), put. Also ఖర్చు చేయడం (kharcu cēyaḍam)."
    bases:
      "ఖర్చు": "expense; cost"
  "te-0485":
    native: "to clean"
    bases:
      "శుభ్రం": "clean; cleanliness"
  "te-0486":
    native: "to travel"
    bases:
      "ప్రయాణం": "journey; travel"
  "te-0487":
    native: "to begin"
    notes:
      "n1": "మొదలు (modalu), a beginning, with పెట్టు (peṭṭu), put."
    bases:
      "మొదలు": "beginning; start"
  "te-0488":
    native: "to delay; to be late"
    notes:
      "n1": "ఆలస్యం చేయకండి (ālasyam cēyakaṇḍi), please don't delay."
    bases:
      "ఆలస్యం": "delay; lateness"
  "te-0489":
    native: "to be afraid"
    notes:
      "n1": "భయం (bhayam), fear, and పడడం (paḍaḍam), to fall: నేను భయపడ్డాను (nēnu bhayapaḍḍānu), I was afraid."
  "te-0490":
    native: "to work hard; to struggle"
  "te-0491":
    native: "to like; to be fond of"
    notes:
      "n1": "Here the one who likes is the doer: నేను సంగీతాన్ని ఇష్టపడతాను (nēnu saṅgītānni iṣṭapaḍatānu), I like music. With ఇష్టం (iṣṭam), the one who likes takes -కు (-ku) instead."
