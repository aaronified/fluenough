tags: ["beginner", "grammar", "unreviewed"]
cards:
  "te-0250":
    native: "The book is on the table."
    notes:
      "n1": "Telugu has no word for 'the' or 'a'; the context says which."
  "te-0251":
    native: "A boy came."
    notes:
      "n1": "ఒక (oka), 'one', can do the work of 'a'. రావడం (rāvaḍam) changes its stem in the past: వచ్చ- (vacc-)."
    bases:
      "అబ్బాయి": "boy; young man"
  "te-0252":
    native: "The boy came."
    notes:
      "n1": "రావడం (rāvaḍam) changes its stem in the past: వచ్చ- (vacc-)."
    bases:
      "అబ్బాయి": "boy; young man"
  "te-0253":
    native: "One tea, please."
  "te-0254":
    native: "Someone has come."
    notes:
      "n1": "ఎవరో (evarō) is 'someone'; ఏదో (ēdō), 'something'. రావడం (rāvaḍam) changes its stem in the past: వచ్చ- (vacc-)."
