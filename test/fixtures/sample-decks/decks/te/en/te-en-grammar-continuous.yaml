pattern:
  name: "Present continuous"
  slot_name: "person"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "cheeyadam": "to do"
    "velladam": "to go"
    "raavadam": "to come"
  notes: "The verb agrees with the doer's person and number. In the third person 'he' takes the masculine ending, -డు (-ḍu), and 'she' and 'it' share the ending -ది (-di): ఆమె వచ్చింది (āme vaccindi), అది వచ్చింది (adi vaccindi). మీరు (mīru), plural or respectful, takes the plural. The feminine and neuter form is also written -తున్నది (-tunnadi): చేస్తున్నది (cēstunnadi)."
