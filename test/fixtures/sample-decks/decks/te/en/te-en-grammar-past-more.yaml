native: { code: "en", iso639_3: "eng", name: "English" }
name: "Used to"
description: "I used to go, she used to come: the past of a habit. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "grammar"]
pattern:
  name: "Past habit"
  slot_name: "person"
  prompt: "{lemma} ({gloss}) — {slot}"
  entries:
    "cheeyadam": "to do"
    "velladam": "to go"
    "raavadam": "to come"
    "undadam": "to be; to live"
  notes: "The habit in the past is the verb in -ఏ (-ē), then a word for the doer: వెళ్ళేవాడు (veḷḷēvāḍu), he used to go, 'a goer'. With నేను (nēnu) and నువ్వు (nuvvu) it shows whether the speaker or the listener is a man or a woman: వెళ్ళేవాడిని (a man), వెళ్ళేదాన్ని (a woman). The verb agrees with the doer's person and number. In the third person 'he' takes a masculine ending, and 'she' and 'it' share a non-masculine one. మీరు (mīru), plural or respectful, takes the plural."
