native: { code: "en", iso639_3: "eng", name: "English" }
name: "Gender and number"
description: "He, she and it in the third person, and the plural. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "grammar", "unreviewed"]
cards:
  "te-0123":
    notes:
      "n1": "Telugu's third person has a masculine ending, -డు (-ḍu), and a non-masculine one, -ది (-di), shared by 'she' and 'it': ఆమె వచ్చింది (āme vaccindi), అది వచ్చింది (adi vaccindi). It is a grammar class, not a statement about people. For respect, ఆవిడ వచ్చారు (āviḍa vaccāru), she came, just as ఆయన వచ్చారు (āyana vaccāru) for a man."
  "te-0268":
    native: "They came."
    notes:
      "n1": "రావడం (rāvaḍam) changes its stem in the past: వచ్చ- (vacc-)."
  "te-0269":
    native: "The children are playing."
    notes:
      "n1": "-లు (-lu) makes a plural: పిల్ల (pilla) → పిల్లలు (pillalu)."
  "te-0270":
    native: "three books"
    notes:
      "n1": "After a number, the noun is plural."
