schema: 1
id: "te-en-script"
kind: "layer"
core: "te-script"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "How Telugu script works"
intro: "Telugu script is built from a few ideas that come back in letter after letter. They look strange at first because English has none of them. Once you have seen them, the letters start to make sense."
features:
  "tick":
    name: "The tick on top"
    text: "Many letters wear a small tick on top. A vowel sign usually takes its place, so a letter's top changes with its vowel: క (ka), కి (ki), కె (ke)."
  "rounds":
    name: "Letters built from rounds"
    text: "Most letters are curves and circles. The usual explanation is that they were scratched into palm leaves with a stylus, and a straight line along the leaf would split it. Letters often differ by a small detail inside the round, so look closely."
  "breath-mark":
    name: "A breathy letter is its partner with a mark"
    text: "Often the letter with a breath after it is its plain partner with a small extra mark. ఢ (ḍha) is డ (ḍa) with one more stroke, and ఫ (pha) is ప (pa) with a small stroke below. భ (bha) is బ (ba) with a stroke below, and it also wears the tick that బ (ba) doesn't."
  "inherent-vowel":
    name: "The vowel you don't see"
    text: "Every consonant carries a short a unless a sign changes it: క (ka) alone is ka. Native Telugu words end in a vowel in their full form, and it is said: తల (tala) is tala. Everyday Telugu shortens many -ము (-mu) endings to the circle ం (am), said m: మనము (manamu) becomes మనం (manam)."
  "vowel-signs":
    name: "Vowels as signs on a letter"
    text: "After a consonant a vowel is a sign on it: on top in place of the tick (కా (kā), కి (ki), కె (ke)), joined on the right (కు (ku), కూ (kū)), or in two parts (కై). Unlike Hindi and Bengali, none is written before the letter."
  "long-stroke":
    name: "A stroke for a long vowel"
    text: "A short and a long vowel can make different words in Telugu, and the long one is usually the short sign with a stroke added: కి (ki) and కీ (kī), కె (ke) and కే (kē), కొ (ko) and కో (kō). For a, the tick on top becomes a hook to the right: క (ka) and కా (kā)."
  "pollu":
    name: "The mark that takes the vowel away"
    text: "The small mark ్ on top of a letter means no vowel after it. It ends English words written in Telugu, such as డాక్టర్ (ḍākṭar, doctor)."
  "vattu":
    name: "The second consonant below"
    text: "Two consonants with no vowel between them: the second is written small below the first, usually without its tick. This small form is the vattu, also called ఒత్తు (ottu). Some look little like their letter, such as the r below ప (pa) in ప్ర (pra)."
  "doubled":
    name: "Doubled consonants"
    text: "A consonant written again below itself is held longer, and it changes the word. Doubled letters are everywhere in Telugu: అమ్మ (amma), అక్క (akka), పెద్ద (pedda)."
  "sunna":
    name: "The circle after a letter"
    text: "A small circle ం (am) after a letter is an m or an n: m at the end of a word, as in పుస్తకం (pustakam, book), and before another consonant the nasal that suits it."
  "digits":
    name: "Telugu digits"
    text: "Telugu has its own digits, seen on old signs and in some books. Everyday Telugu uses 0 to 9."
