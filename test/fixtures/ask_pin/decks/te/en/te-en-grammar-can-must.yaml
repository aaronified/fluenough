id: "te-en-grammar-can-must"
kind: "layer"
core: "te-grammar-can-must"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Can, may and must"
description: "Ability, permission, need and duty: each is an ending on the verb. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "grammar"]
cards:
  "te-0492":
    native: "I can speak Telugu."
    notes:
      "n1": "Can is the verb with -గల- (-gala-), then the person: మాట్లాడగలను (māṭlāḍagalanu), I can speak."
    bases:
      "తెలుగు": "Telugu (the language)"
  "te-0493":
    native: "Can you come tomorrow?"
  "te-0494":
    native: "I can't come."
    notes:
      "n1": "Can't is the verb with లేను (lēnu), లేవు (lēvu), లేదు (lēdu) …: రాలేను (rālēnu), I can't come."
  "te-0495":
    native: "I can swim."
    notes:
      "n1": "For a skill, the one who knows takes -కు (-ku) and the verb is వచ్చు (vaccu), comes: 'to me swimming comes'. The negative is రాదు (rādu). రావడం (rāvaḍam) changes its stem here: వచ్చ- (vacc-)."
    bases:
      "ఈత": "swimming"
  "te-0496":
    native: "You may come in."
    notes:
      "n1": "May is the verb with -వచ్చు (-vaccu): రావచ్చు (rāvaccu), may come."
  "te-0497":
    native: "You mustn't take photos here."
    notes:
      "n1": "Must not is the verb with -కూడదు (-kūḍadu)."
  "te-0498":
    native: "You must come tomorrow."
    notes:
      "n1": "Must is the verb with -ఆలి (-āli), the same for everyone: నేను వెళ్ళాలి (nēnu veḷḷāli), ఆమె వెళ్ళాలి (āme veḷḷāli)."
  "te-0499":
    native: "I don't have to go."
    notes:
      "n1": "Don't have to is the verb with -అక్కర్లేదు (-akkarlēdu), 'there is no need'."
