schema: 1
id: "te-en-grammar-needs"
kind: "layer"
core: "te-grammar-needs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Need and want"
description: "కావాలి (kāvāli), వద్దు (vaddu) and అవసరం (avasaram): what you need, what you want, and what you don't. Not yet checked by a Telugu speaker: please report any mistake."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "grammar"]
cards:
  "te-0460":
    native: "is needed; is wanted"
    notes:
      "n1": "It stays the same whoever needs it, and the one who needs takes -కు (-ku): నాకు (nāku), మీకు (mīku), అతనికి (ataniki) … కావాలి (kāvāli), 'to me it is needed'."
  "te-0461":
    native: "What would you like? (what a shopkeeper asks)"
  "te-0462":
    native: "I'd like some water."
  "te-0463":
    native: "is not wanted; no, thank you"
    notes:
      "n1": "The opposite of కావాలి (kāvāli): నాకు వద్దు (nāku vaddu), I don't want it. On its own, a polite no."
  "te-0464":
    native: "I don't want this."
  "te-0465":
    native: "need; necessary"
    notes:
      "n1": "నాకు డబ్బు అవసరం (nāku ḍabbu avasaram), I need money: a firmer need than కావాలి (kāvāli)."
  "te-0466":
    native: "There's no need."
  "te-0467":
    native: "I need some help."
  "te-0468":
    native: "I want to go home."
    notes:
      "n1": "To want to do something: the verb in -ఆలని (-ālani), then ఉంది (undi), 'to me there is a wish to go'."
