schema: 1
id: "te-en-script-vowel-signs"
kind: "layer"
core: "te-script-vowel-signs"
native: { code: "en", iso639_3: "eng", name: "English" }
name: "Telugu vowel signs"
description: "After a consonant a vowel is written as a sign (gunintam) on it: on top, on the right, or in two parts, never before it. Here on క (ka) and on మ (ma)."
license: "CC-BY-SA-4.0"
tags: ["beginner", "unreviewed", "script"]
cards:
  "te-0063":
    native: "kaa (k + the aa sign)"
    notes:
      "n1": "The aa sign ా (ā) is at the top, where the tick (talakattu) becomes a hook to the right: కాకి (kāki, crow). Compare క (ka) on its own, which is 'ka' with a short a."
  "te-0064":
    native: "ki (k + the i sign)"
    notes:
      "n1": "The i sign ి (i) sits on top, in place of the tick (talakattu) many consonants carry: కిటికీ (kiṭikī, window)."
  "te-0065":
    native: "kii (k + the ii sign)"
    notes:
      "n1": "The ii sign ీ (ī) also sits on top, with a stroke for the length. Short and long change the word, so look for the stroke."
  "te-0066":
    native: "ku (k + the u sign)"
    notes:
      "n1": "The u sign ు (u) is joined on the right: కుక్క (kukka, dog)."
  "te-0067":
    native: "kuu (k + the uu sign)"
    notes:
      "n1": "The uu sign ూ (ū) is joined on the right, with a longer curl: కూర (kūra, curry)."
  "te-0068":
    native: "kru (k + the ru sign)"
    notes:
      "n1": "The ru sign ృ (ru) is joined on the right, like the u signs, in words from Sanskrit. A recogniser writes 'kru' as క్రు (kru), so it is drilled by reading and writing only."
  "te-0069":
    native: "ke (k + the e sign)"
    notes:
      "n1": "The e sign ె (e) sits on top, in place of the tick: కెరటం (keraṭam, wave)."
  "te-0070":
    native: "kee (k + the ee sign)"
    notes:
      "n1": "The ee sign ే (ē) sits on top, with a stroke for the length: కేక (kēka, shout)."
  "te-0071":
    native: "kai (k + the ai sign)"
    notes:
      "n1": "The ai sign ై (ai) comes in two parts: on top, and below the consonant."
  "te-0072":
    native: "ko (k + the o sign)"
    notes:
      "n1": "The o sign ొ (o) sits on top and curls to the right: కొడుకు (koḍuku, son)."
  "te-0073":
    native: "koo (k + the oo sign)"
    notes:
      "n1": "The oo sign ో (ō) is the o sign with a stroke for the length: కోడి (kōḍi, hen)."
  "te-0074":
    native: "kau (k + the au sign)"
    notes:
      "n1": "The au sign ౌ (au) sits on top and to the right: కౌగిలి (kaugili, hug)."
  "te-0075":
    native: "kam (k + the sunna)"
    notes:
      "n1": "The circle ం (am) after a letter, the sunna (anusvaram), is an m or an n: m at the end of a word, and before another consonant the nasal that suits it: కంచం (kañcam, plate). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  "te-0076":
    native: "k (with the pollu: no vowel)"
    notes:
      "n1": "The pollu ్ takes the vowel away: క్ (k) is 'k' alone. Two consonants usually join instead, the second written below; the pollu ends English words such as డాక్టర్ (ḍākṭar, doctor). A mark rather than a sound of its own, so it is drilled by reading and writing only."
  "te-0077":
    native: "maa (m + the aa sign)"
    notes:
      "n1": "The same aa sign on another consonant: each sign keeps much the same place on most consonants, though its shape joins each a little differently. మా (mā, our)."
  "te-0078":
    native: "mi (m + the i sign)"
    notes:
      "n1": "The i sign on top of మ (ma): మిరపకాయ (mirapakāya, chilli)."
  "te-0079":
    native: "mii (m + the ii sign)"
    notes:
      "n1": "The ii sign on top of మ (ma), with its stroke: మీ (mī, your)."
  "te-0080":
    native: "mu (m + the u sign)"
    notes:
      "n1": "The u sign on the right of మ (ma): ముక్కు (mukku, nose)."
  "te-0081":
    native: "muu (m + the uu sign)"
    notes:
      "n1": "The uu sign on the right of మ (ma): మూడు (mūḍu, three)."
  "te-0082":
    native: "me (m + the e sign)"
    notes:
      "n1": "The e sign on top of మ (ma): మెడ (meḍa, neck)."
  "te-0083":
    native: "mee (m + the ee sign)"
    notes:
      "n1": "The ee sign on top of మ (ma), with its stroke: మేక (mēka, goat)."
  "te-0084":
    native: "mo (m + the o sign)"
    notes:
      "n1": "The o sign on top of మ (ma), curling right: మొక్క (mokka, plant)."
  "te-0085":
    native: "moo (m + the oo sign)"
    notes:
      "n1": "The oo sign on మ (ma): మోకాలు (mōkālu, knee)."
