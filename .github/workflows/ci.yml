name: CI

on:
  push:
    branches: [main]
    # A push to main that changes documentation only starts no run (owner,
    # 2026-11-02, after 2026-10-22: "Doc pushes do not need CI"); such a run
    # used to queue behind, and so cancel, the pending run of a code push and
    # leave the README's CI badge on "cancelled". The run is skipped only when
    # EVERY changed file is excluded here. Later patterns win, so the two
    # Markdown files that tests read from disk are included again: the review
    # guide (test/reviewing_test.dart). CHANGELOG.md is not excluded either: it
    # is an app asset (pubspec.yaml). pull_request has no filter, so a
    # documentation pull request still runs every check the ruleset requires.
    paths:
      - "**"
      - "!README.md"
      - "!CLAUDE.md"
      - "!AGENTS.md"
      - "!CONTRIBUTING.md"
      - "!docs/**"
      - "docs/REVIEWING.md"
      - "!wiki/**"
      - "wiki/Reviewing-Guide.md"
  pull_request:

# A new push to a PR cancels its older run; main's runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  # The jobs below all run at once; CI used to take 35-55 minutes with them in
  # sequence (owner, 2026-10-20: "Also run all in parallel"). The three
  # required checks, "Validate decks", "Analyse and test" and "Build debug
  # APK", are the ones the main branch's ruleset names, so they keep their
  # names: the first two are small final jobs that gather the parallel ones.

  decks-validate:
    name: "Decks: validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # Runs on every PR because YAML fails quietly: a bare `no` becomes a
      # boolean and a reviewer will not spot it. See docs/DECK-FORMAT.md.
      # The index is regenerated on main after each merge (deck-index.yml),
      # so it is not checked here (owner, 2026-10-23).
      # Its stdout and exit code are kept and shared (artifact
      # `validate-output`): "Decks: tools' tests (today's decks)" asserts on
      # this very run instead of repeating the 20-minute pass
      # (tools/test_validate_b1.py, Compatibility).
      - name: Validate the decks
        shell: bash
        env:
          FLUENOUGH_SKIP_INDEX_CHECK: "1"
        run: |
          set +e
          # The absolute path, as the test passes it: the test finds a
          # language's lines by "/decks/<lang>/" in them.
          python3 -u tools/validate_decks.py "$GITHUB_WORKSPACE/decks" | tee "$RUNNER_TEMP/validate-output.txt"
          code=${PIPESTATUS[0]}
          echo "$code" > "$RUNNER_TEMP/validate-exit.txt"
          exit "$code"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validate-output
          path: |
            ${{ runner.temp }}/validate-output.txt
            ${{ runner.temp }}/validate-exit.txt
          if-no-files-found: error
          retention-days: 1
      # Rule 10: no user-visible string is a literal in a widget. Checked here
      # rather than by the analyzer because flutter_lints has no such rule, and
      # a rule aimed at parallel agents cannot rest on a checklist box.
      - run: python3 tools/check_ui_strings.py lib/
      # The English synonym sets (ADR-0050): format, sorting, no word in two
      # sets, and the decks' not_synonyms entries.
      - run: python3 tools/validate_synonyms.py assets/synonyms/en.yaml decks/

  # The validator now gates CI on more than deck content — it checks that
  # decks/index.json, which the app downloads decks by, is current
  # (tools/deck_index.py) — so it and the index tool have tests of their
  # own. They are unittest TestCases, run here by pytest in parallel.
  #
  # They took 29 to 34 minutes in one job, so they run in three parts (every
  # third test by id, tools/conftest.py) and one more job; every test still
  # runs, in exactly one of them. The one test that validates all of decks/
  # takes as long as the validator, so it reads the output of "Decks:
  # validate" instead of running the validator again. Each part prints its 25
  # slowest tests (--durations=25) to show where the time goes. The job named
  # "Decks: tools' tests" is what the required checks and "Validate decks"
  # see: it passes only if the four above it did.
  decks-tools-parts:
    name: "Decks: tools' tests (part ${{ matrix.part }}/3)"
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    runs-on: ubuntu-latest
    env:
      TOOLS_TESTS_PART: ${{ matrix.part }}/3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest pytest-xdist fonttools
      - run: python3 -m pytest -n auto -q -p no:cacheprovider --rootdir tools tools -k "not test_todays_decks_get_no_info_and_no_b1_message" --durations=25

  decks-tools-today:
    name: "Decks: tools' tests (today's decks)"
    needs: [decks-validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest pytest-xdist fonttools
      - uses: actions/download-artifact@v8
        with:
          name: validate-output
          path: ${{ runner.temp }}/validate
      # Exactly one test is selected; pytest fails if none is.
      - run: python3 -m pytest -q -p no:cacheprovider --rootdir tools tools/test_validate_b1.py -k "test_todays_decks_get_no_info_and_no_b1_message" --durations=5
        env:
          FLUENOUGH_VALIDATE_OUTPUT: ${{ runner.temp }}/validate/validate-output.txt
          FLUENOUGH_VALIDATE_EXIT: ${{ runner.temp }}/validate/validate-exit.txt

  decks-tools-tests:
    name: "Decks: tools' tests"
    needs: [decks-tools-parts, decks-tools-today]
    if: always()
    runs-on: ubuntu-latest
    env:
      PARTS: ${{ needs.decks-tools-parts.result }}
      TODAY: ${{ needs.decks-tools-today.result }}
    steps:
      - run: |
          if [ "$PARTS" != "success" ] || [ "$TODAY" != "success" ]; then
            echo "::error::A tools' tests job did not succeed (parts: $PARTS, today's decks: $TODAY)"
            exit 1
          fi

  # The required check "Validate decks": passes only if both jobs above did.
  decks:
    name: Validate decks
    runs-on: ubuntu-latest
    needs: [decks-validate, decks-tools-tests]
    if: always()
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::A deck job did not succeed"
            exit 1
          fi

  # Phones download decks from main, so a deck change reaches every installed
  # app at once, but each app reads only its own release's format: 0.4.3
  # refused main's decks once they were split (#524). This reads the change's
  # decks with the latest release's own code, as its downloader does.
  release-reader:
    name: Released app reads the decks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out the latest release, with this change's decks
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          echo "Latest release: $tag"
          git worktree add release "$tag"
          rm -rf release/decks
          cp -r decks release/decks
          mkdir -p release/test/release_reader
          cp tools/release_reader/release_reader_test.dart release/test/release_reader/
      # The release reads decks/index.json and checks each listed file's
      # hash, and the committed index is regenerated only after merge, so
      # write this change's own index first.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # Tags are fetched here (fetch-depth 0), so decks/min_app.json is also
      # checked against the latest release's languages and files (ADR-0052).
      - name: Regenerate the index for this change's decks
        run: python3 tools/deck_index.py --strict-released
      - run: cp decks/index.json release/decks/index.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Read the decks with the release's code
        working-directory: release
        run: |
          flutter pub get
          dart run build_runner build
          flutter test test/release_reader/

  app-analyse:
    name: "App: analyse"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # android/ and ios/ are generated rather than committed, so CI recreates
      # them. This also catches a pubspec that no longer matches the SDK.
      - run: flutter create . --org app --project-name fluenough --platforms=android
      # flutter create writes a widget_test.dart referencing MyApp; our app
      # class is FluenoughApp, so the generated boilerplate does not compile.
      - run: rm -f test/widget_test.dart
      - run: flutter pub get

      # drift generates database.g.dart, which is gitignored like every other
      # generated file. Without this step the first PR that lands a drift
      # schema fails analyse, test and build on a file CI never made.
      - run: dart run build_runner build

      # Analyse and format here, apart from the tests: a formatting failure
      # must not mask whether the code actually compiles and passes.
      - run: flutter analyze
      - name: Check formatting
        id: fmt
        run: |
          dart format lib test
          if ! git diff --quiet -- lib test; then
            git diff -- lib test > format.patch
            echo "::error::Formatting differs. Run: dart format lib test"
            exit 1
          fi
      - name: Upload formatting patch
        if: failure() && steps.fmt.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: format-patch
          path: format.patch
          if-no-files-found: ignore

  # `flutter test` is split over 8 machines (owner, 2026-10-20); the suite is
  # ~51 minutes of tests, so each runs about an eighth. Shard indices are 0..7.
  app-tests:
    name: "App: tests ${{ matrix.n }}/8"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0, n: 1 }
          - { shard: 1, n: 2 }
          - { shard: 2, n: 3 }
          - { shard: 3, n: 4 }
          - { shard: 4, n: 5 }
          - { shard: 5, n: 6 }
          - { shard: 6, n: 7 }
          - { shard: 7, n: 8 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # android/ and ios/ are generated rather than committed, so CI recreates
      # them. This also catches a pubspec that no longer matches the SDK.
      - run: flutter create . --org app --project-name fluenough --platforms=android
      # flutter create writes a widget_test.dart referencing MyApp; our app
      # class is FluenoughApp, so the generated boilerplate does not compile.
      - run: rm -f test/widget_test.dart
      - run: flutter pub get

      # drift generates database.g.dart, which is gitignored like every other
      # generated file. Without this step the first PR that lands a drift
      # schema fails analyse, test and build on a file CI never made.
      - run: dart run build_runner build
      # The tests read decks/index.json (RepositoryDeckSource, the catalog
      # tests), and the committed one is regenerated only after merge, so
      # write this change's own first.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Regenerate the index for this change's decks
        run: python3 tools/deck_index.py
      - run: flutter test --total-shards 8 --shard-index ${{ matrix.shard }}

  # Real downloads from GitHub through the app's own fetcher: 0.4.0
  # shipped unable to download any deck, which only a test against the
  # real GitHub could have caught.
  app-live:
    name: "App: live downloads"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # android/ and ios/ are generated rather than committed, so CI recreates
      # them. This also catches a pubspec that no longer matches the SDK.
      - run: flutter create . --org app --project-name fluenough --platforms=android
      # flutter create writes a widget_test.dart referencing MyApp; our app
      # class is FluenoughApp, so the generated boilerplate does not compile.
      - run: rm -f test/widget_test.dart
      - run: flutter pub get

      # drift generates database.g.dart, which is gitignored like every other
      # generated file. Without this step the first PR that lands a drift
      # schema fails analyse, test and build on a file CI never made.
      - run: dart run build_runner build
      - name: Download real decks from GitHub
        run: flutter test test/live/
        env:
          LIVE_GITHUB: "1"

  # The required check "Analyse and test": passes only if every app job did.
  app:
    name: Analyse and test
    runs-on: ubuntu-latest
    needs: [app-analyse, app-tests, app-live]
    if: always()
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::An app job did not succeed"
            exit 1
          fi

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter create . --org app --project-name fluenough --platforms=android
      # flutter create writes a widget_test.dart referencing MyApp; our app
      # class is FluenoughApp, so the generated boilerplate does not compile.
      - run: rm -f test/widget_test.dart
      # flutter create writes Flutter's icon, launch screen and a lowercase
      # label; this puts the brand's in their place.
      - run: python3 tools/brand_android.py
      - run: flutter pub get

      # drift generates database.g.dart, which is gitignored like every other
      # generated file. Without this step the first PR that lands a drift
      # schema fails analyse, test and build on a file CI never made.
      - run: dart run build_runner build
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: fluenough-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
