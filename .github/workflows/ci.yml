name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  decks:
    name: Validate decks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # Runs on every PR because YAML fails quietly: a bare `no` becomes a
      # boolean and a reviewer will not spot it. See docs/DECK-FORMAT.md.
      - run: python3 tools/validate_decks.py decks/
      # The validator now gates CI on more than deck content — it checks that
      # every language directory is bundled — so it has tests of its own.
      - run: python3 -m unittest discover -s tools -t tools

  app:
    name: Analyse and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # android/ and ios/ are generated rather than committed, so CI recreates
      # them. This also catches a pubspec that no longer matches the SDK.
      - run: flutter create . --org app --project-name fluenough --platforms=android
      # flutter create writes a widget_test.dart referencing MyApp; our app
      # class is FluenoughApp, so the generated boilerplate does not compile.
      - run: rm -f test/widget_test.dart
      - run: flutter pub get

      # drift generates database.g.dart, which is gitignored like every other
      # generated file. Without this step the first PR that lands a drift
      # schema fails analyse, test and build on a file CI never made.
      - run: dart run build_runner build

      # Analyse and test first: a formatting failure must not mask whether the
      # code actually compiles and passes.
      - run: flutter analyze
      - run: flutter test

      - name: Check formatting
        id: fmt
        run: |
          dart format lib test
          if ! git diff --quiet -- lib test; then
            git diff -- lib test > format.patch
            echo "::error::Formatting differs. Run: dart format lib test"
            exit 1
          fi
      - name: Upload formatting patch
        if: failure() && steps.fmt.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: format-patch
          path: format.patch
          if-no-files-found: ignore

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: [decks, app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter create . --org app --project-name fluenough --platforms=android
      # flutter create writes a widget_test.dart referencing MyApp; our app
      # class is FluenoughApp, so the generated boilerplate does not compile.
      - run: rm -f test/widget_test.dart
      - run: flutter pub get

      # drift generates database.g.dart, which is gitignored like every other
      # generated file. Without this step the first PR that lands a drift
      # schema fails analyse, test and build on a file CI never made.
      - run: dart run build_runner build
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: fluenough-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
