name: CI

# What runs when (owner, 2026-11-02: make CI faster without weakening a check).
#
# * Push to main: everything always runs.
# * Pull request: the `changes` job lists the files the PR changes against
#   its base (renames counted as the two files they are). If every one is under
#   decks/ (decks/themes.yaml and decks/min_app.json are app files: the app
#   bundles the first and the second gates app versions), only "App: analyse",
#   "App: live downloads" and "Build debug APK" are skipped. The 8 test
#   shards ALWAYS run (owner, 2026-11-02: "Keep the 8 test shards"): they
#   read the real decks, and test/deck_format_test.dart is the one check
#   before merge that main's code parses the PR's decks (#524). A change to
#   anything else, the workflow included, or one that cannot be read, runs
#   everything.
# * decks/index.json is generated ONCE per run, by "Decks: index", and shared
#   as the artifact `decks-index`: the 8 test shards and the release reader
#   download it instead of each running the full validator again. It is made
#   with `deck_index.py --strict-released` on a full-history checkout; the
#   flag only adds a check against the latest release's tag (it never changes
#   what is written), so the same file serves the shards, which used to run
#   without the flag. "Decks: validate" still runs the full validator itself.
# * A skipped job satisfies a required check, so the gates ("Validate decks",
#   "Analyse and test") run `if: always()` and look at every result
#   themselves: a skip passes only where `changes` says the job is not needed,
#   never because an upstream job failed. "Build debug APK" is a required
#   check of its own and is skipped like the others; if `changes` itself
#   failed it is skipped too, but then "Analyse and test" fails, which blocks
#   the merge.

on:
  push:
    branches: [main]
    # A push to main that changes documentation only starts no run (owner,
    # 2026-11-02, after 2026-10-22: "Doc pushes do not need CI"); such a run
    # used to queue behind, and so cancel, the pending run of a code push and
    # leave the README's CI badge on "cancelled". The run is skipped only when
    # EVERY changed file is excluded here. Later patterns win, so the two
    # Markdown files that tests read from disk are included again: the review
    # guide (test/reviewing_test.dart). CHANGELOG.md is not excluded either: it
    # is an app asset (pubspec.yaml). pull_request has no filter, so a
    # documentation pull request still runs every check the ruleset requires.
    paths:
      - "**"
      - "!README.md"
      - "!CLAUDE.md"
      - "!AGENTS.md"
      - "!CONTRIBUTING.md"
      - "!docs/**"
      - "docs/REVIEWING.md"
      - "!wiki/**"
      - "wiki/Reviewing-Guide.md"
  pull_request:

# A new push to a PR cancels its older run; main's runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  # The jobs below all run at once; CI used to take 35-55 minutes with them in
  # sequence (owner, 2026-10-20: "Also run all in parallel"). The three
  # required checks, "Validate decks", "Analyse and test" and "Build debug
  # APK", are the ones the main branch's ruleset names, so they keep their
  # names: the first two are small final jobs that gather the parallel ones.

  # Cheap first job: does this change touch anything outside decks/? On a pull
  # request the checkout is the merge commit, whose first parent is the base.
  changes:
    name: "Which parts changed"
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          app=true
          if [ "$EVENT" = "pull_request" ]; then
            if files=$(git diff --name-only --no-renames HEAD^1 HEAD) && [ -n "$files" ]; then
              echo "Changed files: $(echo "$files" | wc -l)"
              # Under decks/ and not an app file: themes.yaml is bundled in
              # the app (pubspec.yaml) and min_app.json changes its gating.
              others=$( { echo "$files" | grep -v '^decks/'; echo "$files" | grep -xE 'decks/(themes\.yaml|min_app\.json)'; } || true)
              if [ -z "$others" ]; then
                app=false
                echo "Only decks/ changed: analyse, live downloads and the APK build are skipped."
              else
                echo "Outside decks/ (the app jobs run):"
                echo "$others" | head -n 20
              fi
            else
              echo "Could not list the changed files: the app jobs run."
            fi
          else
            echo "Not a pull request: everything runs."
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

  # decks/index.json, once, for the jobs that need this change's own index
  # (the app's tests read it; the release reader checks each file's hash by
  # it). The committed one is regenerated only after merge.
  decks-index:
    name: "Decks: index"
    runs-on: ubuntu-latest
    steps:
      # Full history: --strict-released reads the latest v* tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/deck_index.py --strict-released
      - uses: actions/upload-artifact@v7
        with:
          name: decks-index
          path: decks/index.json
          if-no-files-found: error
          retention-days: 3

  decks-validate:
    name: "Decks: validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # Runs on every PR because YAML fails quietly: a bare `no` becomes a
      # boolean and a reviewer will not spot it. See docs/DECK-FORMAT.md.
      # The index is regenerated on main after each merge (deck-index.yml),
      # so it is not checked here (owner, 2026-10-23).
      - run: python3 tools/validate_decks.py decks/
        env:
          FLUENOUGH_SKIP_INDEX_CHECK: "1"
      # Rule 10: no user-visible string is a literal in a widget. Checked here
      # rather than by the analyzer because flutter_lints has no such rule, and
      # a rule aimed at parallel agents cannot rest on a checklist box.
      - run: python3 tools/check_ui_strings.py lib/
      # The English synonym sets (ADR-0050): format, sorting, no word in two
      # sets, and the decks' not_synonyms entries.
      - run: python3 tools/validate_synonyms.py assets/synonyms/en.yaml decks/

  # The validator now gates CI on more than deck content — it checks that
  # decks/index.json, which the app downloads decks by, is current
  # (tools/deck_index.py) — so it and the index tool have tests of their
  # own. They are unittest TestCases, run here by pytest in parallel.
  decks-tools-tests:
    name: "Decks: tools' tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest pytest-xdist fonttools
      - run: python3 -m pytest -n auto -q -p no:cacheprovider --rootdir tools tools

  # The required check "Validate decks": passes only if both jobs above did.
  decks:
    name: Validate decks
    runs-on: ubuntu-latest
    needs: [decks-validate, decks-tools-tests, decks-index]
    if: always()
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::A deck job did not succeed"
            exit 1
          fi

  # Phones download decks from main, so a deck change reaches every installed
  # app at once, but each app reads only its own release's format: 0.4.3
  # refused main's decks once they were split (#524). This reads the change's
  # decks with the latest release's own code, as its downloader does.
  release-reader:
    name: Released app reads the decks
    runs-on: ubuntu-latest
    needs: [decks-index]
    # Runs even if the index job failed, to fail by itself: a skipped job
    # would count as a pass for this required check.
    if: ${{ !cancelled() }}
    steps:
      - name: The index job must have succeeded
        env:
          INDEX: ${{ needs.decks-index.result }}
        run: |
          if [ "$INDEX" != "success" ]; then
            echo "::error::'Decks: index' did not succeed ($INDEX); see that job"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out the latest release, with this change's decks
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          echo "Latest release: $tag"
          git worktree add release "$tag"
          rm -rf release/decks
          cp -r decks release/decks
          mkdir -p release/test/release_reader
          cp tools/release_reader/release_reader_test.dart release/test/release_reader/
      # The release reads decks/index.json and checks each listed file's
      # hash, and the committed index is regenerated only after merge, so use
      # this change's own, made once by "Decks: index" (with
      # --strict-released, so decks/min_app.json is also checked against the
      # latest release there, ADR-0052).
      - uses: actions/download-artifact@v8
        with:
          name: decks-index
          path: release/decks
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Read the decks with the release's code
        working-directory: release
        run: |
          flutter pub get
          dart run build_runner build
          flutter test test/release_reader/

  app-analyse:
    name: "App: analyse"
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # android/ and ios/ are generated rather than committed, so CI recreates
      # them. This also catches a pubspec that no longer matches the SDK.
      - run: flutter create . --org app --project-name fluenough --platforms=android
      # flutter create writes a widget_test.dart referencing MyApp; our app
      # class is FluenoughApp, so the generated boilerplate does not compile.
      - run: rm -f test/widget_test.dart
      - run: flutter pub get

      # drift generates database.g.dart, which is gitignored like every other
      # generated file. Without this step the first PR that lands a drift
      # schema fails analyse, test and build on a file CI never made.
      - run: dart run build_runner build

      # Analyse and format here, apart from the tests: a formatting failure
      # must not mask whether the code actually compiles and passes.
      - run: flutter analyze
      - name: Check formatting
        id: fmt
        run: |
          dart format lib test
          if ! git diff --quiet -- lib test; then
            git diff -- lib test > format.patch
            echo "::error::Formatting differs. Run: dart format lib test"
            exit 1
          fi
      - name: Upload formatting patch
        if: failure() && steps.fmt.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: format-patch
          path: format.patch
          if-no-files-found: ignore

  # `flutter test` is split over 8 machines (owner, 2026-10-20); the suite is
  # ~51 minutes of tests, so each runs about an eighth. Shard indices are 0..7.
  app-tests:
    name: "App: tests ${{ matrix.n }}/8"
    needs: [decks-index]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0, n: 1 }
          - { shard: 1, n: 2 }
          - { shard: 2, n: 3 }
          - { shard: 3, n: 4 }
          - { shard: 4, n: 5 }
          - { shard: 5, n: 6 }
          - { shard: 6, n: 7 }
          - { shard: 7, n: 8 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # android/ and ios/ are generated rather than committed, so CI recreates
      # them. This also catches a pubspec that no longer matches the SDK.
      - run: flutter create . --org app --project-name fluenough --platforms=android
      # flutter create writes a widget_test.dart referencing MyApp; our app
      # class is FluenoughApp, so the generated boilerplate does not compile.
      - run: rm -f test/widget_test.dart
      - run: flutter pub get

      # drift generates database.g.dart, which is gitignored like every other
      # generated file. Without this step the first PR that lands a drift
      # schema fails analyse, test and build on a file CI never made.
      - run: dart run build_runner build
      # The tests read decks/index.json (RepositoryDeckSource, the catalog
      # tests), and the committed one is regenerated only after merge, so
      # use this change's own, made once by "Decks: index".
      - uses: actions/download-artifact@v8
        with:
          name: decks-index
          path: decks
      # The json report gives each test file's time, for balancing the shards.
      - run: flutter test --total-shards 8 --shard-index ${{ matrix.shard }} --file-reporter json:flutter-test-times.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flutter-test-times-${{ matrix.n }}
          path: flutter-test-times.json
          if-no-files-found: ignore
          retention-days: 14

  # Real downloads from GitHub through the app's own fetcher: 0.4.0
  # shipped unable to download any deck, which only a test against the
  # real GitHub could have caught.
  app-live:
    name: "App: live downloads"
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # android/ and ios/ are generated rather than committed, so CI recreates
      # them. This also catches a pubspec that no longer matches the SDK.
      - run: flutter create . --org app --project-name fluenough --platforms=android
      # flutter create writes a widget_test.dart referencing MyApp; our app
      # class is FluenoughApp, so the generated boilerplate does not compile.
      - run: rm -f test/widget_test.dart
      - run: flutter pub get

      # drift generates database.g.dart, which is gitignored like every other
      # generated file. Without this step the first PR that lands a drift
      # schema fails analyse, test and build on a file CI never made.
      - run: dart run build_runner build
      - name: Download real decks from GitHub
        run: flutter test test/live/
        env:
          LIVE_GITHUB: "1"

  # The required check "Analyse and test". The test shards must always have
  # succeeded (a skip means "Decks: index" failed, which they wait for). If
  # `changes` found only decks, analyse and live downloads are skipped on
  # purpose and that passes; otherwise they must have succeeded too.
  app:
    name: Analyse and test
    runs-on: ubuntu-latest
    needs: [changes, app-analyse, app-tests, app-live]
    if: always()
    env:
      CHANGES: ${{ needs.changes.result }}
      APP: ${{ needs.changes.outputs.app }}
      ANALYSE: ${{ needs.app-analyse.result }}
      TESTS: ${{ needs.app-tests.result }}
      LIVE: ${{ needs.app-live.result }}
    steps:
      - run: |
          if [ "$CHANGES" != "success" ]; then
            echo "::error::The changes job did not succeed ($CHANGES)"
            exit 1
          fi
          if [ "$TESTS" != "success" ]; then
            echo "::error::The test shards did not succeed ($TESTS); if 'Decks: index' failed, see it"
            exit 1
          fi
          for result in "$ANALYSE" "$LIVE"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::An app job did not succeed ($ANALYSE/$LIVE)"
              exit 1
            fi
            if [ "$APP" = "true" ] && [ "$result" != "success" ]; then
              echo "::error::An app job did not run ($ANALYSE/$LIVE)"
              exit 1
            fi
          done
          if [ "$APP" != "true" ]; then
            echo "Only decks changed: analyse and live downloads were skipped."
          fi

  build:
    name: Build debug APK
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter create . --org app --project-name fluenough --platforms=android
      # flutter create writes a widget_test.dart referencing MyApp; our app
      # class is FluenoughApp, so the generated boilerplate does not compile.
      - run: rm -f test/widget_test.dart
      # flutter create writes Flutter's icon, launch screen and a lowercase
      # label; this puts the brand's in their place.
      - run: python3 tools/brand_android.py
      - run: flutter pub get

      # drift generates database.g.dart, which is gitignored like every other
      # generated file. Without this step the first PR that lands a drift
      # schema fails analyse, test and build on a file CI never made.
      - run: dart run build_runner build
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: fluenough-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
