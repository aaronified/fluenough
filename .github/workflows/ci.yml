name: CI

# What runs when (owner, 2026-11-02: make CI faster without weakening a check).
#
# * Push to main: everything always runs.
# * Pull request: the `changes` job lists the files the PR changes against
#   its base (renames counted as the two files they are). If every one is under
#   decks/ (decks/themes.yaml and decks/min_app.json are app files: the app
#   bundles the first and the second gates app versions), only "App: analyse",
#   "App: live downloads" and "Build debug APK" are skipped. The 8 test
#   shards ALWAYS run (owner, 2026-11-02: "Keep the 8 test shards").
#   Decks moved to the decks-live branch (owner, 2026-11-06), with their own
#   CI; main's copy of decks/ is frozen (an app older than the one that reads
#   decks-live keeps reading it), so the shards still read it, and the
#   sample deck (test/fixtures/sample-decks) is what the tests are moving to.
#   A change to anything else, the workflow included, or one that cannot be
#   read, runs everything.
# * A skipped job satisfies a required check, so the gates ("Validate decks",
#   "Analyse and test") run `if: always()` and look at every result
#   themselves: a skip passes only where `changes` says the job is not needed,
#   never because an upstream job failed. "Build debug APK" is a required
#   check of its own and is skipped like the others; if `changes` itself
#   failed it is skipped too, but then "Analyse and test" fails, which blocks
#   the merge.

on:
  push:
    branches: [main]
    # A push to main that changes documentation only starts no run (owner,
    # 2026-11-02, after 2026-10-22: "Doc pushes do not need CI"); such a run
    # used to queue behind, and so cancel, the pending run of a code push and
    # leave the README's CI badge on "cancelled". The run is skipped only when
    # EVERY changed file is excluded here. Later patterns win, so the two
    # Markdown files that tests read from disk are included again: the review
    # guide (test/reviewing_test.dart). CHANGELOG.md is not excluded either: it
    # is an app asset (pubspec.yaml). pull_request has no filter, so a
    # documentation pull request still runs every check the ruleset requires.
    paths:
      - "**"
      - "!README.md"
      - "!CLAUDE.md"
      - "!AGENTS.md"
      - "!CONTRIBUTING.md"
      - "!docs/**"
      - "docs/REVIEWING.md"
      - "!wiki/**"
      - "wiki/Reviewing-Guide.md"
  pull_request:
  # The heavy placement suites run every night on main (owner, 2026-11-11), so
  # a change that slips past the path list in "Which parts changed" is caught
  # within a day. A manual run ("Run workflow") runs them too.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# A new push to a PR cancels its older run; main's runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  # The jobs below all run at once; CI used to take 35-55 minutes with them in
  # sequence (owner, 2026-10-20: "Also run all in parallel"). The three
  # required checks, "Validate decks", "Analyse and test" and "Build debug
  # APK", are the ones the main branch's ruleset names, so they keep their
  # names: the first two are small final jobs that gather the parallel ones.

  # Cheap first job: does this change touch anything outside decks/? On a pull
  # request the checkout is the merge commit, whose first parent is the base.
  changes:
    name: "Which parts changed"
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
      placement: ${{ steps.diff.outputs.placement }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          app=true
          # The heavy placement suites (test/heavy_tests.json) run when placement
          # changed, on the nightly schedule and on a manual run (owner,
          # 2026-11-11); any doubt (files not listable) runs them.
          placement=true
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "push" ]; then
            if pfiles=$(git diff --name-only --no-renames HEAD^1 HEAD) && [ -n "$pfiles" ]; then
              if echo "$pfiles" | grep -qE '^(lib/core/placement/|lib/app/placement|lib/features/placement/|test/placement_|test/support/placement_|test/fixtures/placement/|assets/placement_profiles\.json$|tools/placement|tools/test_shard\.py$|tools/test_test_shard\.py$|test/shard_weights\.json$|test/heavy_tests\.json$|\.github/workflows/ci\.yml$)'; then
                echo "Placement changed: the heavy placement suites run."
              else
                placement=false
                echo "Placement unchanged: the heavy placement suites are skipped."
              fi
            else
              echo "Could not list the changed files: the heavy placement suites run."
            fi
          fi
          if [ "$EVENT" = "pull_request" ]; then
            if files=$(git diff --name-only --no-renames HEAD^1 HEAD) && [ -n "$files" ]; then
              echo "Changed files: $(echo "$files" | wc -l)"
              # Under decks/ and not an app file: themes.yaml is bundled in
              # the app (pubspec.yaml) and min_app.json changes its gating.
              others=$( { echo "$files" | grep -v '^decks/'; echo "$files" | grep -xE 'decks/(themes\.yaml|min_app\.json)'; } || true)
              if [ -z "$others" ]; then
                app=false
                echo "Only decks/ changed: analyse, live downloads and the APK build are skipped."
              else
                echo "Outside decks/ (the app jobs run):"
                echo "$others" | head -n 20
              fi
            else
              echo "Could not list the changed files: the app jobs run."
            fi
          else
            echo "Not a pull request: everything runs."
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "placement=$placement" >> "$GITHUB_OUTPUT"

  # The decks are not here to check any more (owner, 2026-11-06): they live on
  # the decks-live branch, with a deck CI of its own (.github/workflows/ci.yml
  # there). What main keeps is the SAMPLE DECK, test/fixtures/sample-decks: the
  # tests read it, it must pass the validator, and decks-live's CI holds its
  # real decks to the same format (tools/check_sample_contract.py). The copy of
  # decks/ on main is frozen: an app older than the one that reads decks-live
  # keeps reading it.
  decks-validate:
    name: "Decks: sample deck and tools"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # YAML fails quietly: a bare `no` becomes a boolean. The sample is held
      # to the validator like every deck.
      - run: python3 tools/validate_sample_decks.py
      # Rule 10: no user-visible string is a literal in a widget.
      - run: python3 tools/check_ui_strings.py lib/
      # The English synonym sets (ADR-0050): format and sorting. Their match
      # with the real decks is checked on decks-live.
      - run: python3 tools/validate_synonyms.py assets/synonyms/en.yaml

  # The tools have tests of their own, unittest TestCases run by pytest in
  # parallel. The four that read the real decks (the validator over everything,
  # a path across decks, the card-id tests over es and bn) run on decks-live,
  # where the decks change.
  decks-tools-parts:
    name: "Decks: tools' tests (part ${{ matrix.part }}/2)"
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    runs-on: ubuntu-latest
    env:
      TOOLS_TESTS_PART: ${{ matrix.part }}/2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest pytest-xdist fonttools numpy
      - run: >-
          python3 -m pytest -n auto -q -p no:cacheprovider --rootdir tools tools
          --deselect test_validate_b1.py::Compatibility::test_todays_decks_get_no_info_and_no_b1_message
          --deselect test_validate_b1.py::PathAcrossDecks::test_a_path_across_the_decks_it_names
          --deselect test_validate_card_ids.py::CardIds::test_a_file_alone_is_held_to_the_repository
          --deselect test_validate_card_ids.py::CardIds::test_next_id_follows_the_highest_in_the_language
          --durations=25

  # The required check "Validate decks" (the name decks-live's ruleset uses
  # too): cheap, and always reporting on main.
  decks:
    name: Validate decks
    runs-on: ubuntu-latest
    needs: [decks-validate, decks-tools-parts]
    if: always()
    steps:
      # Main's decks/ is frozen (decks live on decks-live): a pull request to
      # main may change only decks/themes.yaml and decks/min_app.json there.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - name: Main's decks/ is frozen
        if: github.event_name == 'pull_request'
        run: git -c core.quotepath=false diff --name-only --no-renames HEAD^1 HEAD | python3 tools/check_main_decks_guard.py
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::A deck job did not succeed"
            exit 1
          fi

  # Phones download decks from decks-live, so a deck change reaches every
  # installed app at once, but each app reads only its own release's format:
  # 0.4.3 refused main's decks once they were split (#524). This reads the
  # SAMPLE deck with the latest release's own code, as its downloader does;
  # decks-live's CI does the same for every change to the real decks. A sample
  # that uses a key the latest release rejects fails here: decks of that format
  # wait for the release that reads them.
  release-reader:
    name: Released app reads the decks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out the latest release, with the sample deck
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          echo "Latest release: $tag"
          git worktree add release "$tag"
          rm -rf release/decks
          cp -r test/fixtures/sample-decks/decks release/decks
          mkdir -p release/test/release_reader
          cp tools/release_reader/release_reader_test.dart release/test/release_reader/
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Read the sample deck with the release's code
        working-directory: release
        run: |
          flutter pub get
          dart run build_runner build
          flutter test test/release_reader/

  app-analyse:
    name: "App: analyse"
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # android/ and ios/ are generated rather than committed, so CI recreates
      # them. This also catches a pubspec that no longer matches the SDK.
      - run: flutter create . --org app --project-name fluenough --platforms=android
      # flutter create writes a widget_test.dart referencing MyApp; our app
      # class is FluenoughApp, so the generated boilerplate does not compile.
      - run: rm -f test/widget_test.dart
      - run: flutter pub get

      # drift generates database.g.dart, which is gitignored like every other
      # generated file. Without this step the first PR that lands a drift
      # schema fails analyse, test and build on a file CI never made.
      - run: dart run build_runner build

      # Analyse and format here, apart from the tests: a formatting failure
      # must not mask whether the code actually compiles and passes.
      - run: flutter analyze
      - name: Check formatting
        id: fmt
        run: |
          dart format lib test
          if ! git diff --quiet -- lib test; then
            git diff -- lib test > format.patch
            echo "::error::Formatting differs. Run: dart format lib test"
            exit 1
          fi
      - name: Upload formatting patch
        if: failure() && steps.fmt.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: format-patch
          path: format.patch
          if-no-files-found: ignore

  # `flutter test` is split over 8 machines (owner, 2026-10-20); the suite is
  # ~51 minutes of tests, so each runs about an eighth. Shard indices are 0..7.
  # The job name "App: tests N/8" is what the ruleset's gate waits for.
  app-tests:
    name: "App: tests ${{ matrix.n }}/8"
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0, n: 1 }
          - { shard: 1, n: 2 }
          - { shard: 2, n: 3 }
          - { shard: 3, n: 4 }
          - { shard: 4, n: 5 }
          - { shard: 5, n: 6 }
          - { shard: 6, n: 7 }
          - { shard: 7, n: 8 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # android/ and ios/ are generated rather than committed, so CI recreates
      # them. This also catches a pubspec that no longer matches the SDK.
      - run: flutter create . --org app --project-name fluenough --platforms=android
      # flutter create writes a widget_test.dart referencing MyApp; our app
      # class is FluenoughApp, so the generated boilerplate does not compile.
      - run: rm -f test/widget_test.dart
      - run: flutter pub get

      # drift generates database.g.dart, which is gitignored like every other
      # generated file. Without this step the first PR that lands a drift
      # schema fails analyse, test and build on a file CI never made.
      - run: dart run build_runner build
      # Each shard runs whole test files, chosen by tools/test_shard.py from the
      # weights in test/shard_weights.json (a file with no weight gets a
      # default, so a new test file needs nothing). `flutter test
      # --total-shards` split the tests one by one instead, so every shard
      # compiled every file and a shard's time was luck: 249 s to 750 s on
      # main run 41886601755. The files are listed first, apart from the
      # command, so that a failure of the script stops the step: inside $( )
      # it would leave `flutter test` with no files, which runs them all.
      # The json report gives each test file's time, for refreshing the weights.
      - name: Test
        env:
          PLACEMENT: ${{ needs.changes.outputs.placement }}
        run: |
          # The heavy placement suites run only when placement changed, nightly
          # and on a manual run (test/heavy_tests.json, "Which parts changed").
          flags=""
          if [ "$PLACEMENT" != "true" ]; then flags="--exclude-heavy"; fi
          files=$(python3 tools/test_shard.py --total-shards 8 --shard-index ${{ matrix.shard }} $flags)
          echo "$files"
          flutter test $files --file-reporter json:flutter-test-times.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flutter-test-times-${{ matrix.n }}
          path: flutter-test-times.json
          if-no-files-found: ignore
          retention-days: 14

  # Real downloads from GitHub through the app's own fetcher: 0.4.0
  # shipped unable to download any deck, which only a test against the
  # real GitHub could have caught.
  app-live:
    name: "App: live downloads"
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # android/ and ios/ are generated rather than committed, so CI recreates
      # them. This also catches a pubspec that no longer matches the SDK.
      - run: flutter create . --org app --project-name fluenough --platforms=android
      # flutter create writes a widget_test.dart referencing MyApp; our app
      # class is FluenoughApp, so the generated boilerplate does not compile.
      - run: rm -f test/widget_test.dart
      - run: flutter pub get

      # drift generates database.g.dart, which is gitignored like every other
      # generated file. Without this step the first PR that lands a drift
      # schema fails analyse, test and build on a file CI never made.
      - run: dart run build_runner build
      - name: Download real decks from GitHub
        run: flutter test test/live/
        env:
          LIVE_GITHUB: "1"

  # The required check "Analyse and test". The test shards must always have
  # succeeded (a skip means "Decks: index" failed, which they wait for). If
  # `changes` found only decks, analyse and live downloads are skipped on
  # purpose and that passes; otherwise they must have succeeded too.
  app:
    name: Analyse and test
    runs-on: ubuntu-latest
    needs: [changes, app-analyse, app-tests, app-live]
    if: always()
    env:
      CHANGES: ${{ needs.changes.result }}
      APP: ${{ needs.changes.outputs.app }}
      ANALYSE: ${{ needs.app-analyse.result }}
      TESTS: ${{ needs.app-tests.result }}
      LIVE: ${{ needs.app-live.result }}
    steps:
      - run: |
          if [ "$CHANGES" != "success" ]; then
            echo "::error::The changes job did not succeed ($CHANGES)"
            exit 1
          fi
          if [ "$TESTS" != "success" ]; then
            echo "::error::The test shards did not succeed ($TESTS); if 'Decks: index' failed, see it"
            exit 1
          fi
          for result in "$ANALYSE" "$LIVE"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::An app job did not succeed ($ANALYSE/$LIVE)"
              exit 1
            fi
            if [ "$APP" = "true" ] && [ "$result" != "success" ]; then
              echo "::error::An app job did not run ($ANALYSE/$LIVE)"
              exit 1
            fi
          done
          if [ "$APP" != "true" ]; then
            echo "Only decks changed: analyse and live downloads were skipped."
          fi

  build:
    name: Build debug APK
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter create . --org app --project-name fluenough --platforms=android
      # flutter create writes a widget_test.dart referencing MyApp; our app
      # class is FluenoughApp, so the generated boilerplate does not compile.
      - run: rm -f test/widget_test.dart
      # flutter create writes Flutter's icon, launch screen and a lowercase
      # label; this puts the brand's in their place.
      - run: python3 tools/brand_android.py
      - run: flutter pub get

      # drift generates database.g.dart, which is gitignored like every other
      # generated file. Without this step the first PR that lands a drift
      # schema fails analyse, test and build on a file CI never made.
      - run: dart run build_runner build
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: fluenough-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
