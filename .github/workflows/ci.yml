name: Deck CI

# The deck half of CI, on the decks-live branch (owner, 2026-11-06: decks live
# in a branch of their own; the app and its CI stay on main). Pull requests to
# decks-live run THIS file (a pull request runs the workflows of its base
# branch). Nothing here builds or tests the app, except "Released app reads
# the decks", which compiles the latest release's reader against the change's
# decks (#524).
#
# The tools (validator, index tool), assets/ and the sample deck are main's,
# laid over the checkout by .github/actions/main-tools: the validator is the
# app's contract, so a deck is always held to main's current one. The sample
# deck (test/fixtures/sample-decks on main) is the standard both CIs use: it
# is validated here too, and the real decks' index must have its version and
# schema.
#
# Required checks of the decks-live ruleset: "Validate decks" and "Released
# app reads the decks" (same names as on main).

on:
  push:
    branches: [decks-live]
    paths-ignore:
      - "wiki/**"
      - "docs/**"
  pull_request:
    branches: [decks-live]
  workflow_dispatch:

concurrency:
  group: deck-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  # The jobs below all run at once; CI used to take 35-55 minutes with them in
  # sequence (owner, 2026-10-20: "Also run all in parallel"). The three
  # required checks, "Validate decks", "Analyse and test" and "Build debug
  # APK", are the ones the main branch's ruleset names, so they keep their
  # names: the first two are small final jobs that gather the parallel ones.

  # decks/index.json, once, for the jobs that need this change's own index
  # (the app's tests read it; the release reader checks each file's hash by
  # it). The committed one is regenerated only after merge.
  decks-index:
    name: "Decks: index"
    runs-on: ubuntu-latest
    steps:
      # Full history: --strict-released reads the latest v* tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/main-tools
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/deck_index.py --strict-released
      - uses: actions/upload-artifact@v7
        with:
          name: decks-index
          path: decks/index.json
          if-no-files-found: error
          retention-days: 3

  decks-validate:
    name: "Decks: validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/main-tools
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # Runs on every PR because YAML fails quietly: a bare `no` becomes a
      # boolean and a reviewer will not spot it. See docs/DECK-FORMAT.md.
      # The index is regenerated on main after each merge (deck-index.yml),
      # so it is not checked here (owner, 2026-10-23).
      # Its stdout and exit code are kept and shared (artifact
      # `validate-output`): "Decks: tools' tests (today's decks)" asserts on
      # this very run instead of repeating the 20-minute pass
      # (tools/test_validate_b1.py, Compatibility).
      - name: Validate the decks
        shell: bash
        env:
          FLUENOUGH_SKIP_INDEX_CHECK: "1"
        run: |
          set +e
          # The absolute path, as the test passes it: the test finds a
          # language's lines by "/decks/<lang>/" in them.
          python3 -u tools/validate_decks.py "$GITHUB_WORKSPACE/decks" | tee "$RUNNER_TEMP/validate-output.txt"
          code=${PIPESTATUS[0]}
          echo "$code" > "$RUNNER_TEMP/validate-exit.txt"
          exit "$code"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validate-output
          path: |
            ${{ runner.temp }}/validate-output.txt
            ${{ runner.temp }}/validate-exit.txt
          if-no-files-found: error
          retention-days: 3
      # Rule 10: no user-visible string is a literal in a widget. Checked here
      # rather than by the analyzer because flutter_lints has no such rule, and
      # a rule aimed at parallel agents cannot rest on a checklist box.
      - run: python3 tools/check_ui_strings.py lib/
      # The English synonym sets (ADR-0050): format, sorting, no word in two
      # sets, and the decks' not_synonyms entries.
      - run: python3 tools/validate_synonyms.py assets/synonyms/en.yaml decks/

  # The validator now gates CI on more than deck content — it checks that
  # decks/index.json, which the app downloads decks by, is current
  # (tools/deck_index.py) — so it and the index tool have tests of their
  # own. They are unittest TestCases, run here by pytest in parallel.
  #
  # They took 29 to 34 minutes in one job. The slowest-test table showed why:
  # three tests read real decks (the validator's pass over decks/, 20+ minutes;
  # PathAcrossDecks, 25 minutes; the card-id tests over es and bn, 9 minutes)
  # and every other test took seconds. So the tests run as
  #   - "today's decks": the validator-over-everything test, which reads the
  #     output of "Decks: validate" instead of running the validator again;
  #   - "real decks": the other two slow tests (one of them now validates a
  #     real file once, not per case), side by side;
  #   - two "parts" of everything else (every second test by id,
  #     tools/conftest.py).
  # Every test runs in exactly one of them. Each prints its 25 slowest
  # (--durations=25). The job named "Decks: tools' tests" gathers
  # the four above (it passes only if they all did) and is what "Validate
  # decks" counts; it is not a required check itself.
  decks-tools-parts:
    name: "Decks: tools' tests (part ${{ matrix.part }}/2)"
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    runs-on: ubuntu-latest
    env:
      TOOLS_TESTS_PART: ${{ matrix.part }}/2
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/main-tools
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest pytest-xdist fonttools
      - run: >-
          python3 -m pytest -n auto -q -p no:cacheprovider --rootdir tools tools
          --deselect test_validate_b1.py::Compatibility::test_todays_decks_get_no_info_and_no_b1_message
          --deselect test_validate_b1.py::PathAcrossDecks::test_a_path_across_the_decks_it_names
          --deselect test_validate_card_ids.py::CardIds::test_a_file_alone_is_held_to_the_repository
          --deselect test_validate_card_ids.py::CardIds::test_next_id_follows_the_highest_in_the_language
          --deselect test_review_bot.py::Checks::test_the_required_checks_are_cis_jobs
          --durations=25

  decks-tools-real:
    name: "Decks: tools' tests (real decks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/main-tools
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest pytest-xdist fonttools
      # Three tests, three workers.
      - run: >-
          python3 -m pytest -n 3 -q -p no:cacheprovider --rootdir tools
          "tools/test_validate_b1.py::PathAcrossDecks::test_a_path_across_the_decks_it_names"
          "tools/test_validate_card_ids.py::CardIds::test_a_file_alone_is_held_to_the_repository"
          "tools/test_validate_card_ids.py::CardIds::test_next_id_follows_the_highest_in_the_language"
          --durations=5

  decks-tools-today:
    name: "Decks: tools' tests (today's decks)"
    needs: [decks-validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/main-tools
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest pytest-xdist fonttools
      - uses: actions/download-artifact@v8
        with:
          name: validate-output
          path: ${{ runner.temp }}/validate
      # Exactly one test is selected; pytest fails if none is.
      - run: python3 -m pytest -q -p no:cacheprovider --rootdir tools "tools/test_validate_b1.py::Compatibility::test_todays_decks_get_no_info_and_no_b1_message" --durations=5
        env:
          FLUENOUGH_VALIDATE_OUTPUT: ${{ runner.temp }}/validate/validate-output.txt
          FLUENOUGH_VALIDATE_EXIT: ${{ runner.temp }}/validate/validate-exit.txt

  decks-tools-tests:
    name: "Decks: tools' tests"
    needs: [decks-tools-parts, decks-tools-real, decks-tools-today]
    if: always()
    runs-on: ubuntu-latest
    env:
      PARTS: ${{ needs.decks-tools-parts.result }}
      REAL: ${{ needs.decks-tools-real.result }}
      TODAY: ${{ needs.decks-tools-today.result }}
    steps:
      - run: |
          if [ "$PARTS" != "success" ] || [ "$REAL" != "success" ] || [ "$TODAY" != "success" ]; then
            echo "::error::A tools' tests job did not succeed (parts: $PARTS, real decks: $REAL, today's decks: $TODAY)"
            exit 1
          fi

  # The sample deck is the standard both CIs hold to (owner, 2026-11-06): it
  # must pass main's validator, and the real decks must speak its format (the
  # index's version and schema).
  decks-sample:
    name: "Decks: sample standard"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/main-tools
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: The sample deck passes the validator
        run: |
          if [ ! -d test/fixtures/sample-decks ]; then
            echo "main has no sample deck yet: nothing to check."
            exit 0
          fi
          python3 tools/validate_decks.py test/fixtures/sample-decks/
      - name: The real decks' index speaks the sample's format
        run: |
          if [ -f tools/check_sample_contract.py ] && [ -d test/fixtures/sample-decks ]; then
            python3 tools/check_sample_contract.py test/fixtures/sample-decks decks
          else
            echo "main has no sample contract check yet: nothing to check."
          fi

  # The required check "Validate decks": passes only if both jobs above did.
  decks:
    name: Validate decks
    runs-on: ubuntu-latest
    needs: [decks-validate, decks-tools-tests, decks-index, decks-sample]
    if: always()
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::A deck job did not succeed"
            exit 1
          fi

  # Phones download decks from decks-live, so a deck change reaches every installed
  # app at once, but each app reads only its own release's format: 0.4.3
  # refused main's decks once they were split (#524). This reads the change's
  # decks with the latest release's own code, as its downloader does.
  release-reader:
    name: Released app reads the decks
    runs-on: ubuntu-latest
    needs: [decks-index]
    # Runs even if the index job failed, to fail by itself: a skipped job
    # would count as a pass for this required check.
    if: ${{ !cancelled() }}
    steps:
      - name: The index job must have succeeded
        env:
          INDEX: ${{ needs.decks-index.result }}
        run: |
          if [ "$INDEX" != "success" ]; then
            echo "::error::'Decks: index' did not succeed ($INDEX); see that job"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/main-tools
      - name: Check out the latest release, with this change's decks
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          echo "Latest release: $tag"
          git worktree add release "$tag"
          rm -rf release/decks
          cp -r decks release/decks
          mkdir -p release/test/release_reader
          cp tools/release_reader/release_reader_test.dart release/test/release_reader/
      # The release reads decks/index.json and checks each listed file's
      # hash, and the committed index is regenerated only after merge, so use
      # this change's own, made once by "Decks: index" (with
      # --strict-released, so decks/min_app.json is also checked against the
      # latest release there, ADR-0052).
      - uses: actions/download-artifact@v8
        with:
          name: decks-index
          path: release/decks
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Read the decks with the release's code
        working-directory: release
        run: |
          flutter pub get
          dart run build_runner build
          flutter test test/release_reader/

