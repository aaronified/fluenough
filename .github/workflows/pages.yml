name: Web

# The app in a browser, on GitHub Pages: https://aaronified.github.io/fluenough/
# (wiki: Plan-Web-Pwa). Built on every pull request, so the page can be
# opened from its artifact before merge; deployed on every push to main. The
# repository's Pages source must be "GitHub Actions" (Settings > Pages).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  build:
    name: "Web: build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # web/ is generated like android/, so CI recreates it.
      - run: flutter create . --org app --project-name fluenough --platforms=web
      - run: rm -f test/widget_test.dart
      - run: python3 tools/brand_web.py
      # Fails the build if flutter create's real output lost an iOS tag.
      - run: python3 tools/check_web_page.py web
      - run: flutter pub get
      - run: dart run build_runner build

      # lib/main_web.dart names only services a browser has. CanvasKit is
      # bundled rather than fetched from Google's CDN.
      - run: >
          flutter build web --release -t lib/main_web.dart
          --base-href /fluenough/ --no-web-resources-cdn --no-wasm-dry-run

      # drift on the web needs SQLite compiled to WebAssembly and its worker
      # beside the page (lib/app/profile_storage.dart). Each is released with
      # the package version the lockfile holds.
      - name: Fetch drift's web files
        run: |
          version() { awk -v p="  $1:" '$0 == p { f = 1 } f && /version:/ { gsub(/"/, "", $2); print $2; exit }' pubspec.lock; }
          curl -fsSL -o build/web/sqlite3.wasm "https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-$(version sqlite3)/sqlite3.wasm"
          curl -fsSL -o build/web/drift_worker.js "https://github.com/simolus3/drift/releases/download/drift-$(version drift)/drift_worker.js"

      # Flutter 3.47's own service worker caches nothing (#1012): the offline
      # shell is tools/web/sw.js, which brand_web.py puts in the build.
      - run: python3 tools/check_web_sw.py build/web

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: build/web
      # Kept on every run: a pull request's page can be opened from it, and
      # "Web: smoke test" reads it.
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: build/web
          retention-days: 3

  # The built app, opened in headless Chromium (tools/web_smoke.cjs): it
  # loads, Today, Decks, Progress and Settings are reachable, a reload keeps
  # the progress, and nothing logs an error. It is its own job, after the
  # build, so that the required checks in ci.yml are no slower. On a pull
  # request that changes only decks and documents it does nothing: the app is
  # the same (the same rule as "Which parts changed" in ci.yml).
  smoke:
    name: "Web: smoke test"
    needs: build
    # Playwright's Chromium does not support ubuntu-latest's newest release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = "pull_request" ]; then
            if files=$(git diff --name-only --no-renames HEAD^1 HEAD) && [ -n "$files" ]; then
              others=$( { echo "$files" | grep -vE '^(decks/|docs/|wiki/|.*\.md$)'; echo "$files" | grep -xE 'decks/(themes\.yaml|min_app\.json)|CHANGELOG\.md'; } || true)
              if [ -z "$others" ]; then
                run=false
                echo "Only decks and documents changed: the smoke test is skipped."
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: steps.diff.outputs.run == 'true'
        with:
          name: web
          path: build/web
      - name: Install Playwright and Chromium
        if: steps.diff.outputs.run == 'true'
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          node "$RUNNER_TEMP/pw/node_modules/playwright/cli.js" install chromium
          sudo timeout 120 node "$RUNNER_TEMP/pw/node_modules/playwright/cli.js" install-deps chromium || echo "install-deps skipped (apt mirror unreachable); continuing"
      - name: Smoke test
        if: steps.diff.outputs.run == 'true'
        run: >
          NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          node tools/web_smoke.cjs build/web --shots "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-smoke-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 3

  deploy:
    name: "Web: deploy"
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
