name: Deck index

# Regenerates decks/index.json on decks-live
# after a merge that touched decks/ (owner, 2026-10-23). Pull requests are
# not failed for a stale index and builders do not run tools/deck_index.py.
#
# Pushing to the protected decks-live needs a token that may bypass the rules: it uses
# the secret ADMIN_TOKEN (a fine-grained token with Contents: write), else
# GITHUB_TOKEN, which cannot bypass the pull-request rule. ADMIN_TOKEN's owner
# must be allowed to bypass it in decks-live's ruleset. The README's
# languages list is on main: its own workflow reads this branch's index.

on:
  push:
    branches: [decks-live]
    paths:
      - "decks/**"
      - "!decks/index.json"
      - "!decks/review-queue.json"
  workflow_dispatch:

# One at a time; a second waits rather than cancelling the first.
concurrency:
  group: deck-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  index:
    name: Regenerate decks/index.json
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: decks-live
          token: ${{ secrets.ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/main-tools
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/deck_index.py
      - name: Commit and push
        run: |
          if git diff --quiet -- decks/index.json; then
            echo "Index is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decks/index.json
          git commit -m "Regenerate decks/index.json"
          # Main's tools, laid over the checkout, are not part of this branch.
          git checkout -- .
          for attempt in 1 2 3; do
            if git pull --rebase origin decks-live && git push origin HEAD:decks-live; then
              exit 0
            fi
            echo "Push attempt $attempt failed."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the regenerated decks/index.json to decks-live. Most likely the token may not bypass decks-live's pull-request rule: ADMIN_TOKEN must be allowed to bypass it in the ruleset (GITHUB_TOKEN cannot)."
          exit 1
