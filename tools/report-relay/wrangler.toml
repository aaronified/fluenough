# The relay for reports from the app's bug icon (ADR-0021). Deploy with
# `npx wrangler deploy` from this directory; README.md has the steps.
name = "fluenough-reports"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# The repository whose issues reports become.
REPO = "aaronified/fluenough"

# At most 5 reports a minute from one address.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60
