# The language family and subfamily the README's languages list shows for
# each language, keyed by language code (tools/readme_languages.py).
#
# Tool data only: the app and assets/languages.yaml do not read it. Names are
# Glottolog-style. The family is the top level; the subfamily is the branch
# the language sits in, or an em dash when it has none worth naming (an
# isolate, or a family with one member here). A proto- or ancient language
# sits under its real family and branch. A constructed language has the
# family "Constructed" and, as its subfamily, the family it is modelled on
# (Esperanto: Romance; Sindarin: Celtic, after Welsh; Quenya: Uralic, after
# Finnish), or "None" when it has no model (owner, 2026-11-02). The notation
# courses (ipa, qbe) are not languages and are not listed.
#
# A language with no entry here fails tools/test_readme_languages.py.

