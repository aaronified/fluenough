    name: "Standard Assamese; no Wiktionary form is taken (rules only)"
    untagged: false

"zh":
  dump: "Chinese"
  variety:
    # Not usable, measured 2026-11-15. kaikki.org has one dump "Chinese" for
    # every variety, 1.2 GB (Content-Length 1,214,692,243, modified
