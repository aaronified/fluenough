    # vowels and after a nasal, n̪ before a dental stop. Nothing is imported,
    # as Tamil and Kannada: every Malayalam card gets its narrow form from
    # decks/ml/ml-phonetics.yaml, in one convention. Flip `untagged` to true
    # only with a `normalise` list for the differences above and an `agree`
