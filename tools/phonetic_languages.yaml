# The languages tools/import_phonetic.py can fill with Wiktionary's narrow
# `[ ... ]` IPA, keyed by language code (#1285). One entry per language:
#
#   dump:     what kaikki.org calls the language, in the dump's file name
#             (https://kaikki.org/dictionary/<dump>/kaikki.org-dictionary-<dump>.jsonl)
#   variety:  which of Wiktionary's pronunciations the course teaches
#     name:     a sentence for the report
#     notes:    sound `note` values taken as this variety (default: none)
#     tags:     sound `tags` values taken as this variety (default: none)
#     untagged: whether a form with no note and no tag is taken as the
#               language's default (default: true)
#   normalise: optional list of {pattern, replace} regexes, applied in order
#     to each Wiktionary form so it matches the conventions of the language's
#     rules file (opt in per language; `tools/import_phonetic.py <lang>
#     --renormalise` applies them to cards already imported)
#
# A new language is added here and nowhere else: the tool needs no code
# change (tools/test_phonetic.py checks that). The rationale of each variety
# is in wiki/Plan-Ipa-Revamp-And-Language-Phonology.md; a language that
# needs rules instead has them in decks/<lang>/<lang>-phonetics.yaml.
#
# Language codes and dump names are quoted (YAML would read an unquoted `no:`
# as a boolean).
#
# Tool data only: the app does not read it.

"bn":
  dump: "Bengali"
  variety:
    # Standard Colloquial Bengali of Kolkata, which Wiktionary marks Rarh.
    # The decks' `ipa` is the Kolkata standard too. Dhaka (Bangladeshi
    # Standard), Vanga and the rest are not taken.
    name: "Standard Colloquial Bengali (Kolkata), Wiktionary's Rarh"
    notes: ["Rarh"]
    untagged: true

"hi":
  dump: "Hindi"
  variety:
    # Standard Hindi: Wiktionary tags nearly all of its Hindi forms
    # "Hindi, Standard". Forms tagged dialectal, colloquial, Persianized,
    # formal or with a note are not taken.
    name: "Standard Hindi (Hindustani), Wiktionary's Hindi Standard"
    tags: ["Hindi", "Standard"]
    untagged: true

"es":
  dump: "Spanish"
  variety:
    # Wiktionary's untagged form, which is the general standard. Regional
    # forms (Andalusia, Latin America, ...) carry a tag and are not taken.
    # The decks' `ipa` writes θ, so the course is Castilian: see the plan.
    name: "Standard Spanish, Wiktionary's untagged form"
  # Wiktionary and decks/es/es-phonetics.yaml write the same sounds
  # differently (#1369, gap 5). The rules' conventions win. Nasalised vowels
  # are real allophony and stay. The tie-barred ɟ͡ʝ is written the same by
  # both and is not touched.
  normalise:
    # Lowered approximants ð̞ β̞ ɣ̞ (U+031E) become bare ð β ɣ.
    - pattern: '([ðβɣ])\u031e'
      replace: "\\1"
    # (Patterns are single-quoted: the regex reads \u escapes. Replacements are
    # double-quoted: YAML reads \u, and \\1 is a back-reference.)
    # Tie-barred affricates t͡ʃ d͡ʒ (U+0361 or U+035C) become tʃ dʒ.
    - pattern: '([td])[\u0361\u035c]([ʃʒ])'
      replace: "\\1\\2"
    # Advanced n̟ (U+031F) before θ becomes the dental n̪ (U+032A).
    - pattern: 'n\u031f(?=ˈ?θ)'
      replace: "n\u032a"

"te":
  dump: "Telugu"
  variety:
    # Measured on the kaikki.org dump (2026-11): of 1,670 narrow forms, 1,655
    # carry no note and no tag; the rest are "stand-alone", "accompanied" or
    # letter names, which are not taken. Wiktionary has few narrow Telugu
    # forms (about 5% of cards), so most cards still get theirs from rules.
    name: "Standard Telugu, Wiktionary's untagged form"

"ja":
  dump: "Japanese"
  variety:
    # Measured on the kaikki.org dump (2026-11): of 26,689 narrow forms,
    # 26,661 carry no note and no tag (the Tokyo standard); the rest are
    # regional (Kagoshima, Tohoku, Nagoya, Osaka) or an alternative
    # morpheme-medial reading, and are not taken.
    name: "Standard Japanese (Tokyo), Wiktionary's untagged form"

"fr":
  dump: "French"
  variety:
    # Measured on the kaikki.org dump (modified 2026-10-30): of 623 narrow
    # forms, 56 carry no note and no tag (the general standard); 321 are
    # tagged Louisiana, 127 Quebec, 54 Canada, 9 Belgium, 4 Switzerland, and a
    # few more are Meridional, Marseille, Saint-Étienne or informal. About
    # twenty carry "France" or "Paris" but always beside another region or
    # an unusual realisation ([bõ.ʒuə̯ʁ], [sɒ̃tχ]), so they are not taken.
    # Wiktionary has few narrow French forms, so most cards get theirs from
    # the course's rules file instead.
    name: "Standard French of France, Wiktionary's untagged form"

"as":
  dump: "Assamese"
  variety:
    # Measured on the kaikki.org dump (2026-11): 60 narrow forms for 45 words,
    # all untagged, 17 of those words in the course's decks. They do not agree
    # with the course's broad `ipa` or with each other: some write r, ɦ, ɪ or
    # a lowered ɔ̞ where the decks write ɹ, h, i and ɔ (ধৰ্ম [dʱɔrmɔ], বহুত
    # [bɔɦut], দৈ [dɔɪ]), some are wrong or garbled (তথ্য [tɔɪt.tʱɔ], অভ্যাস
    # [ɔɪd.bʱaˣ]), and ছাঁ and ক্ৰিকেট have two forms that differ. So the
    # untagged form is NOT taken (untagged: false, no notes, no tags): nothing
    # is imported from Wiktionary, and every Assamese card gets its narrow form
    # from decks/as/as-phonetics.yaml, in one convention. Flip `untagged` to
    # true only together with a `normalise` list for r, ɦ, ɪ and U+031E, which
    # needs the Spanish-only test in tools/test_phonetic.py widened first.
    name: "Standard Assamese; no Wiktionary form is taken (rules only)"
    untagged: false

"zh":
  dump: "Chinese"
  variety:
    # Not usable, measured 2026-11-15. kaikki.org has one dump "Chinese" for
    # every variety, 1.2 GB (Content-Length 1,214,692,243, modified
    # 2026-10-30), so a first run of `import_phonetic.py zh` would fetch all
    # of it. The first 6 MB (291 entries, 5,213 sounds) hold no `[ ... ]` form
    # at all: every sound is a `/ ... /` one, and the 465 tagged Mandarin
    # ("Mandarin", "Standard-Chinese", "Sinological-IPA") are phonemic forms
    # the zh-pron template makes from the pinyin, written with Chao tone
    # digits as superscripts (/t͡ɕi̯ɛn⁵⁵/, /ˀeɪ̯⁵⁵/), which the validator's IPA
    # test refuses (U+2070 to U+2079 are not allowed). So nothing is imported
    # (untagged: false, no notes, no tags), and every Chinese card gets its
    # broad ipa from tools/transcribe.py (`mandarin_ipa`, from the pinyin) and
    # its narrow form from decks/zh/zh-phonetics.yaml. Only the first 6 MB were
    # read, not the whole dump: a full count is open.
    name: "Standard Mandarin; no Wiktionary form is taken (rules only)"

"kn":
  dump: "Kannada"
  variety:
    # Measured on the kaikki.org dump (modified 2026-10-30, 2026-11-15): of 27
    # narrow forms, 20 carry no note and no tag, and all but two are the names
    # of letters or vowel signs (ಕ [kə], ರ [r], ಇ [i], ೂ [uː]); the only word
    # forms are ಕೊಟ್ಟಿಗೆ [kɔʈ.ʈɪ.ɡɛ], ಬುಟ್ಟಿ [buʈːi], ಪರ್ಣ [parɳa] and ಕಫ [kɐ.fa],
    # written with syllable dots and in three different conventions (ə, ɐ, a
    # for the short a). The rest are `normally` or `before ...` notes of the
    # anusvara sign. So the untagged form is NOT taken (untagged: false, no
    # notes, no tags): nothing is imported from Wiktionary, and every Kannada
    # card gets its narrow form from decks/kn/kn-phonetics.yaml, in one
    # convention (as Assamese). Flip `untagged` to true only after Wiktionary
    # has word forms that agree with the rules file.
    name: "Standard Kannada; no Wiktionary form is taken (rules only)"
    untagged: false
