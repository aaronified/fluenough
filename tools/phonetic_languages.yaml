    # ("Mandarin", "Standard-Chinese", "Sinological-IPA") are phonemic forms
    # the zh-pron template makes from the pinyin, written with Chao tone
    # digits as superscripts (/t͡ɕi̯ɛn⁵⁵/, /ˀeɪ̯⁵⁵/), which the validator's IPA
    # test refuses (U+2070 to U+2079 are not allowed). So nothing is imported
    # (untagged: false, no notes, no tags), and every Chinese card gets its
    # broad ipa from tools/transcribe.py (`mandarin_ipa`, from the pinyin) and
    # its narrow form from decks/zh/zh-phonetics.yaml. Only the first 6 MB were
    # read, not the whole dump: a full count is open.
    name: "Standard Mandarin; no Wiktionary form is taken (rules only)"
    untagged: false

